components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AllowlistedCertificate:
      description: Defines an allowlisted certificate.
      id: AllowlistedCertificate
      properties:
        pemCertificate:
          description: >-
            Required. PEM certificate that is allowlisted. The certificate can
            be up to 5k bytes, and must be a parseable X.509 certificate.
          type: string
      type: object
    AuthorizationAttemptInfo:
      description: >-
        State of the latest attempt to authorize a domain for certificate
        issuance.
      id: AuthorizationAttemptInfo
      properties:
        attemptTime:
          description: Output only. The timestamp, when the authorization attempt was made.
          format: google-datetime
          readOnly: true
          type: string
        details:
          description: >-
            Output only. Human readable explanation for reaching the state.
            Provided to help address the configuration issues. Not guaranteed to
            be stable. For programmatic access use FailureReason enum.
          readOnly: true
          type: string
        domain:
          description: Output only. Domain name of the authorization attempt.
          readOnly: true
          type: string
        failureReason:
          description: >-
            Output only. Reason for failure of the authorization attempt for the
            domain.
          enum:
            - FAILURE_REASON_UNSPECIFIED
            - CONFIG
            - CAA
            - RATE_LIMITED
          enumDescriptions:
            - FailureReason is unspecified.
            - >-
              There was a problem with the user's DNS or load balancer
              configuration for this domain.
            - >-
              Certificate issuance forbidden by an explicit CAA record for the
              domain or a failure to check CAA records for the domain.
            - >-
              Reached a CA or internal rate-limit for the domain, e.g. for
              certificates per top-level private domain.
          readOnly: true
          type: string
        state:
          description: Output only. State of the domain for managed certificate issuance.
          enum:
            - STATE_UNSPECIFIED
            - AUTHORIZING
            - AUTHORIZED
            - FAILED
          enumDescriptions:
            - State is unspecified.
            - >-
              Certificate provisioning for this domain is under way. Google
              Cloud will attempt to authorize the domain.
            - >-
              A managed certificate can be provisioned, no issues for this
              domain.
            - >-
              Attempt to authorize the domain failed. This prevents the Managed
              Certificate from being issued. See `failure_reason` and `details`
              fields for more information.
          readOnly: true
          type: string
        troubleshooting:
          $ref: '#/components/schemas/Troubleshooting'
          description: >-
            Output only. Troubleshooting information for the authorization
            attempt. This field is only populated if the authorization attempt
            failed.
          readOnly: true
      type: object
    CNAME:
      description: CNAME troubleshooting information.
      id: CNAME
      properties:
        expectedData:
          description: >-
            Output only. The expected value of the CNAME record for the domain,
            equals to `dns_resource_record.data` in the corresponding
            `DnsAuthorization`.
          readOnly: true
          type: string
        name:
          description: >-
            Output only. The name of the CNAME record for the domain, equals to
            `dns_resource_record.name` in the corresponding `DnsAuthorization`.
          readOnly: true
          type: string
        resolvedData:
          description: >-
            Output only. The resolved CNAME chain. Empty list if the CNAME
            record for `CNAME.name` is not found. Otherwise the first item is
            the value of the CNAME record for `CNAME.name`. If the CNAME chain
            is longer, the second item is the value of the CNAME record for the
            first item, and so on.
          items:
            type: string
          readOnly: true
          type: array
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    Certificate:
      description: Defines TLS certificate.
      id: Certificate
      properties:
        createTime:
          description: Output only. The creation timestamp of a Certificate.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. One or more paragraphs of text description of a
            certificate.
          type: string
        expireTime:
          description: Output only. The expiry timestamp of a Certificate.
          format: google-datetime
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Set of labels associated with a Certificate.
          type: object
        managed:
          $ref: '#/components/schemas/ManagedCertificate'
          description: If set, contains configuration and state of a managed certificate.
        managedIdentity:
          $ref: '#/components/schemas/ManagedIdentityCertificate'
          description: >-
            If set, contains configuration and state of a managed identity
            certificate.
        name:
          description: >-
            Identifier. A user-defined name of the certificate. Certificate
            names must be unique globally and match pattern
            `projects/*/locations/*/certificates/*`.
          type: string
        pemCertificate:
          description: Output only. The PEM-encoded certificate chain.
          readOnly: true
          type: string
        sanDnsnames:
          description: >-
            Output only. The list of Subject Alternative Names of dnsName type
            defined in the certificate (see RFC 5280 4.2.1.6). Managed
            certificates that haven't been provisioned yet have this field
            populated with a value of the managed.domains field.
          items:
            type: string
          readOnly: true
          type: array
        scope:
          description: Optional. Immutable. The scope of the certificate.
          enum:
            - DEFAULT
            - EDGE_CACHE
            - ALL_REGIONS
            - CLIENT_AUTH
          enumDescriptions:
            - >-
              Use the DEFAULT scope if you plan to use the certificate with
              global external Application Load Balancer, global external proxy
              Network Load Balancer, or any of the regional Google Cloud
              services.
            - >-
              Use the EDGE_CACHE scope if you plan to use the certificate with
              Media CDN. The certificates are served from Edge Points of
              Presence. See https://cloud.google.com/vpc/docs/edge-locations.
            - >-
              Use the ALL_REGIONS scope if you plan to use the certificate with
              cross-region internal Application Load Balancer. The certificates
              are served from all Google Cloud regions. See
              https://cloud.google.com/compute/docs/regions-zones.
            - >-
              Associated with certificates used as client certificates in
              Backend mTLS.
          type: string
        selfManaged:
          $ref: '#/components/schemas/SelfManagedCertificate'
          description: If set, defines data of a self-managed certificate.
        tags:
          additionalProperties:
            type: string
          description: >-
            Optional. Input only. Immutable. Tag keys/values directly bound to
            this resource. For example: "123/environment": "production",
            "123/costCenter": "marketing"
          type: object
        updateTime:
          description: Output only. The last update timestamp of a Certificate.
          format: google-datetime
          readOnly: true
          type: string
        usedBy:
          description: Output only. The list of resources that use this Certificate.
          items:
            $ref: '#/components/schemas/UsedBy'
          readOnly: true
          type: array
      type: object
    CertificateAuthorityConfig:
      description: >-
        The CA that issues the workload certificate. It includes CA address,
        type, authentication to CA service, etc.
      id: CertificateAuthorityConfig
      properties:
        certificateAuthorityServiceConfig:
          $ref: '#/components/schemas/CertificateAuthorityServiceConfig'
          description: Defines a CertificateAuthorityServiceConfig.
      type: object
    CertificateAuthorityServiceConfig:
      description: Contains information required to contact CA service.
      id: CertificateAuthorityServiceConfig
      properties:
        caPool:
          description: >-
            Required. A CA pool resource used to issue a certificate. The CA
            pool string has a relative resource path following the form
            "projects/{project}/locations/{location}/caPools/{ca_pool}".
          type: string
      type: object
    CertificateIssuanceConfig:
      description: >-
        CertificateIssuanceConfig specifies how to issue and manage a
        certificate.
      id: CertificateIssuanceConfig
      properties:
        certificateAuthorityConfig:
          $ref: '#/components/schemas/CertificateAuthorityConfig'
          description: >-
            Required. The CA that issues the workload certificate. It includes
            the CA address, type, authentication to CA service, etc.
        createTime:
          description: Output only. The creation timestamp of a CertificateIssuanceConfig.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. One or more paragraphs of text description of a
            CertificateIssuanceConfig.
          type: string
        keyAlgorithm:
          description: Required. The key algorithm to use when generating the private key.
          enum:
            - KEY_ALGORITHM_UNSPECIFIED
            - RSA_2048
            - ECDSA_P256
          enumDescriptions:
            - Unspecified key algorithm.
            - Specifies RSA with a 2048-bit modulus.
            - Specifies ECDSA with curve P256.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Set of labels associated with a CertificateIssuanceConfig.
          type: object
        lifetime:
          description: Required. Workload certificate lifetime requested.
          format: google-duration
          type: string
        name:
          description: >-
            Identifier. A user-defined name of the certificate issuance config.
            CertificateIssuanceConfig names must be unique globally and match
            pattern `projects/*/locations/*/certificateIssuanceConfigs/*`.
          type: string
        rotationWindowPercentage:
          description: >-
            Required. Specifies the percentage of elapsed time of the
            certificate lifetime to wait before renewing the certificate. Must
            be a number between 1-99, inclusive.
          format: int32
          type: integer
        tags:
          additionalProperties:
            type: string
          description: >-
            Optional. Input only. Immutable. Tag keys/values directly bound to
            this resource. For example: "123/environment": "production",
            "123/costCenter": "marketing"
          type: object
        updateTime:
          description: >-
            Output only. The last update timestamp of a
            CertificateIssuanceConfig.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    CertificateMap:
      description: Defines a collection of certificate configurations.
      id: CertificateMap
      properties:
        createTime:
          description: Output only. The creation timestamp of a Certificate Map.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. One or more paragraphs of text description of a
            certificate map.
          type: string
        gclbTargets:
          description: >-
            Output only. A list of GCLB targets that use this Certificate Map. A
            Target Proxy is only present on this list if it's attached to a
            Forwarding Rule.
          items:
            $ref: '#/components/schemas/GclbTarget'
          readOnly: true
          type: array
        labels:
          additionalProperties:
            type: string
          description: Optional. Set of labels associated with a Certificate Map.
          type: object
        name:
          description: >-
            Identifier. A user-defined name of the Certificate Map. Certificate
            Map names must be unique globally and match pattern
            `projects/*/locations/*/certificateMaps/*`.
          type: string
        tags:
          additionalProperties:
            type: string
          description: >-
            Optional. Input only. Immutable. Tag keys/values directly bound to
            this resource. For example: "123/environment": "production",
            "123/costCenter": "marketing"
          type: object
        updateTime:
          description: Output only. The update timestamp of a Certificate Map.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    CertificateMapEntry:
      description: Defines a certificate map entry.
      id: CertificateMapEntry
      properties:
        certificates:
          description: >-
            Optional. A set of Certificates defines for the given `hostname`.
            There can be defined up to four certificates in each Certificate Map
            Entry. Each certificate must match pattern
            `projects/*/locations/*/certificates/*`.
          items:
            type: string
          type: array
        createTime:
          description: Output only. The creation timestamp of a Certificate Map Entry.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. One or more paragraphs of text description of a
            certificate map entry.
          type: string
        hostname:
          description: >-
            A Hostname (FQDN, e.g. `example.com`) or a wildcard hostname
            expression (`*.example.com`) for a set of hostnames with common
            suffix. Used as Server Name Indication (SNI) for selecting a proper
            certificate.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Set of labels associated with a Certificate Map Entry.
          type: object
        matcher:
          description: A predefined matcher for particular cases, other than SNI selection.
          enum:
            - MATCHER_UNSPECIFIED
            - PRIMARY
          enumDescriptions:
            - A matcher has't been recognized.
            - >-
              A primary certificate that is served when SNI wasn't specified in
              the request or SNI couldn't be found in the map.
          type: string
        name:
          description: >-
            Identifier. A user-defined name of the Certificate Map Entry.
            Certificate Map Entry names must be unique globally and match
            pattern
            `projects/*/locations/*/certificateMaps/*/certificateMapEntries/*`.
          type: string
        state:
          description: Output only. A serving state of this Certificate Map Entry.
          enum:
            - SERVING_STATE_UNSPECIFIED
            - ACTIVE
            - PENDING
          enumDescriptions:
            - The status is undefined.
            - The configuration is serving.
            - >-
              Update is in progress. Some frontends may serve this
              configuration.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The update timestamp of a Certificate Map Entry.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    DnsAuthorization:
      description: >-
        A DnsAuthorization resource describes a way to perform domain
        authorization for certificate issuance.
      id: DnsAuthorization
      properties:
        createTime:
          description: Output only. The creation timestamp of a DnsAuthorization.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. One or more paragraphs of text description of a
            DnsAuthorization.
          type: string
        dnsResourceRecord:
          $ref: '#/components/schemas/DnsResourceRecord'
          description: >-
            Output only. DNS Resource Record that needs to be added to DNS
            configuration.
          readOnly: true
        domain:
          description: >-
            Required. Immutable. A domain that is being authorized. A
            DnsAuthorization resource covers a single domain and its wildcard,
            e.g. authorization for `example.com` can be used to issue
            certificates for `example.com` and `*.example.com`.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Set of labels associated with a DnsAuthorization.
          type: object
        name:
          description: >-
            Identifier. A user-defined name of the dns authorization.
            DnsAuthorization names must be unique globally and match pattern
            `projects/*/locations/*/dnsAuthorizations/*`.
          type: string
        tags:
          additionalProperties:
            type: string
          description: >-
            Optional. Input only. Immutable. Tag keys/values directly bound to
            this resource. For example: "123/environment": "production",
            "123/costCenter": "marketing"
          type: object
        type:
          description: >-
            Optional. Immutable. Type of DnsAuthorization. If unset during
            resource creation the following default will be used: - in location
            `global`: FIXED_RECORD, - in other locations: PER_PROJECT_RECORD.
          enum:
            - TYPE_UNSPECIFIED
            - FIXED_RECORD
            - PER_PROJECT_RECORD
          enumDescriptions:
            - Type is unspecified.
            - FIXED_RECORD DNS authorization uses DNS-01 validation method.
            - >-
              PER_PROJECT_RECORD DNS authorization allows for independent
              management of Google-managed certificates with DNS authorization
              across multiple projects.
          type: string
        updateTime:
          description: Output only. The last update timestamp of a DnsAuthorization.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    DnsResourceRecord:
      description: >-
        The structure describing the DNS Resource Record that needs to be added
        to DNS configuration for the authorization to be usable by certificate.
      id: DnsResourceRecord
      properties:
        data:
          description: Output only. Data of the DNS Resource Record.
          readOnly: true
          type: string
        name:
          description: >-
            Output only. Fully qualified name of the DNS Resource Record. e.g.
            `_acme-challenge.example.com`
          readOnly: true
          type: string
        type:
          description: >-
            Output only. Type of the DNS Resource Record. Currently always set
            to "CNAME".
          readOnly: true
          type: string
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    GclbTarget:
      description: Describes a Target Proxy that uses this Certificate Map.
      id: GclbTarget
      properties:
        ipConfigs:
          description: >-
            Output only. IP configurations for this Target Proxy where the
            Certificate Map is serving.
          items:
            $ref: '#/components/schemas/IpConfig'
          readOnly: true
          type: array
        targetHttpsProxy:
          description: >-
            Output only. This field returns the resource name in the following
            format:
            `//compute.googleapis.com/projects/*/global/targetHttpsProxies/*`.
          readOnly: true
          type: string
        targetSslProxy:
          description: >-
            Output only. This field returns the resource name in the following
            format:
            `//compute.googleapis.com/projects/*/global/targetSslProxies/*`.
          readOnly: true
          type: string
      type: object
    IPs:
      description: IPs troubleshooting information.
      id: IPs
      properties:
        resolved:
          description: >-
            Output only. The list of IP addresses resolved from the domain's
            A/AAAA records. Can contain both ipv4 and ipv6 addresses.
          items:
            type: string
          readOnly: true
          type: array
        serving:
          description: >-
            Output only. The list of IP addresses, where the certificate is
            attached and port 443 is open.
          items:
            type: string
          readOnly: true
          type: array
        servingOnAltPorts:
          description: >-
            Output only. The list of IP addresses, where the certificate is
            attached, but port 443 is not open.
          items:
            type: string
          readOnly: true
          type: array
      type: object
    IntermediateCA:
      description: Defines an intermediate CA.
      id: IntermediateCA
      properties:
        pemCertificate:
          description: >-
            PEM intermediate certificate used for building up paths for
            validation. Each certificate provided in PEM format may occupy up to
            5kB.
          type: string
      type: object
    IpConfig:
      description: Defines IP configuration where this Certificate Map is serving.
      id: IpConfig
      properties:
        ipAddress:
          description: Output only. An external IP address.
          readOnly: true
          type: string
        ports:
          description: Output only. Ports.
          items:
            format: uint32
            type: integer
          readOnly: true
          type: array
      type: object
    ListCertificateIssuanceConfigsResponse:
      description: Response for the `ListCertificateIssuanceConfigs` method.
      id: ListCertificateIssuanceConfigsResponse
      properties:
        certificateIssuanceConfigs:
          description: A list of certificate configs for the parent resource.
          items:
            $ref: '#/components/schemas/CertificateIssuanceConfig'
          type: array
        nextPageToken:
          description: >-
            If there might be more results than those appearing in this
            response, then `next_page_token` is included. To get the next set of
            results, call this method again using the value of `next_page_token`
            as `page_token`.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListCertificateMapEntriesResponse:
      description: Response for the `ListCertificateMapEntries` method.
      id: ListCertificateMapEntriesResponse
      properties:
        certificateMapEntries:
          description: A list of certificate map entries for the parent resource.
          items:
            $ref: '#/components/schemas/CertificateMapEntry'
          type: array
        nextPageToken:
          description: >-
            If there might be more results than those appearing in this
            response, then `next_page_token` is included. To get the next set of
            results, call this method again using the value of `next_page_token`
            as `page_token`.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListCertificateMapsResponse:
      description: Response for the `ListCertificateMaps` method.
      id: ListCertificateMapsResponse
      properties:
        certificateMaps:
          description: A list of certificate maps for the parent resource.
          items:
            $ref: '#/components/schemas/CertificateMap'
          type: array
        nextPageToken:
          description: >-
            If there might be more results than those appearing in this
            response, then `next_page_token` is included. To get the next set of
            results, call this method again using the value of `next_page_token`
            as `page_token`.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListCertificatesResponse:
      description: Response for the `ListCertificates` method.
      id: ListCertificatesResponse
      properties:
        certificates:
          description: A list of certificates for the parent resource.
          items:
            $ref: '#/components/schemas/Certificate'
          type: array
        nextPageToken:
          description: >-
            If there might be more results than those appearing in this
            response, then `next_page_token` is included. To get the next set of
            results, call this method again using the value of `next_page_token`
            as `page_token`.
          type: string
        unreachable:
          description: A list of locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListDnsAuthorizationsResponse:
      description: Response for the `ListDnsAuthorizations` method.
      id: ListDnsAuthorizationsResponse
      properties:
        dnsAuthorizations:
          description: A list of dns authorizations for the parent resource.
          items:
            $ref: '#/components/schemas/DnsAuthorization'
          type: array
        nextPageToken:
          description: >-
            If there might be more results than those appearing in this
            response, then `next_page_token` is included. To get the next set of
            results, call this method again using the value of `next_page_token`
            as `page_token`.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    ListTrustConfigsResponse:
      description: Response for the `ListTrustConfigs` method.
      id: ListTrustConfigsResponse
      properties:
        nextPageToken:
          description: >-
            If there might be more results than those appearing in this
            response, then `next_page_token` is included. To get the next set of
            results, call this method again using the value of `next_page_token`
            as `page_token`.
          type: string
        trustConfigs:
          description: A list of TrustConfigs for the parent resource.
          items:
            $ref: '#/components/schemas/TrustConfig'
          type: array
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    ManagedCertificate:
      description: >-
        Configuration and state of a Managed Certificate. Certificate Manager
        provisions and renews Managed Certificates automatically, for as long as
        it's authorized to do so.
      id: ManagedCertificate
      properties:
        authorizationAttemptInfo:
          description: >-
            Output only. Detailed state of the latest authorization attempt for
            each domain specified for managed certificate resource.
          items:
            $ref: '#/components/schemas/AuthorizationAttemptInfo'
          readOnly: true
          type: array
        dnsAuthorizations:
          description: >-
            Optional. Immutable. Authorizations that will be used for performing
            domain authorization.
          items:
            type: string
          type: array
        domains:
          description: >-
            Optional. Immutable. The domains for which a managed SSL certificate
            will be generated. Wildcard domains are only supported with DNS
            challenge resolution.
          items:
            type: string
          type: array
        issuanceConfig:
          description: >-
            Optional. Immutable. The resource name for a
            CertificateIssuanceConfig used to configure private PKI certificates
            in the format `projects/*/locations/*/certificateIssuanceConfigs/*`.
            If this field is not set, the certificates will instead be publicly
            signed as documented at
            https://cloud.google.com/load-balancing/docs/ssl-certificates/google-managed-certs#caa.
          type: string
        provisioningIssue:
          $ref: '#/components/schemas/ProvisioningIssue'
          description: >-
            Output only. Information about issues with provisioning a Managed
            Certificate.
          readOnly: true
        state:
          description: Output only. State of the managed certificate resource.
          enum:
            - STATE_UNSPECIFIED
            - PROVISIONING
            - FAILED
            - ACTIVE
          enumDescriptions:
            - State is unspecified.
            - >-
              Certificate Manager attempts to provision or renew the
              certificate. If the process takes longer than expected, consult
              the `provisioning_issue` field.
            - >-
              Multiple certificate provisioning attempts failed and Certificate
              Manager gave up. To try again, delete and create a new managed
              Certificate resource. For details see the `provisioning_issue`
              field.
            - >-
              The certificate management is working, and a certificate has been
              provisioned.
          readOnly: true
          type: string
      type: object
    ManagedIdentityCertificate:
      description: >-
        Configuration and state of a Managed Identity Certificate. Certificate
        Manager provisions and renews Managed Identity Certificates
        automatically, for as long as it's authorized to do so.
      id: ManagedIdentityCertificate
      properties:
        identity:
          description: >-
            Required. Immutable. SPIFFE ID of the Managed Identity used for this
            certificate.
          type: string
        provisioningIssue:
          $ref: '#/components/schemas/ProvisioningIssue'
          description: >-
            Output only. Information about issues with provisioning a managed
            certificate.
          readOnly: true
        state:
          description: Output only. State of the managed certificate resource.
          enum:
            - STATE_UNSPECIFIED
            - PROVISIONING
            - FAILED
            - ACTIVE
          enumDescriptions:
            - State is unspecified.
            - >-
              Certificate Manager attempts to provision or renew the
              certificate. If the process takes longer than expected, consult
              the `provisioning_issue` field.
            - >-
              Multiple certificate provisioning attempts failed and Certificate
              Manager gave up. To try again, delete and create a new managed
              Certificate resource. For details see the `provisioning_issue`
              field.
            - >-
              The certificate management is working, and a certificate has been
              provisioned.
          readOnly: true
          type: string
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation. Output only.
      id: OperationMetadata
      properties:
        apiVersion:
          description: API version used to start the operation.
          type: string
        createTime:
          description: The time the operation was created.
          format: google-datetime
          type: string
        endTime:
          description: The time the operation finished running.
          format: google-datetime
          type: string
        requestedCancellation:
          description: >-
            Identifies whether the user has requested cancellation of the
            operation. Operations that have successfully been cancelled have
            google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
          type: boolean
        statusMessage:
          description: Human-readable status of the operation, if any.
          type: string
        target:
          description: Server-defined resource path for the target of the operation.
          type: string
        verb:
          description: Name of the verb executed by the operation.
          type: string
      type: object
    ProvisioningIssue:
      description: Information about issues with provisioning a Managed Certificate.
      id: ProvisioningIssue
      properties:
        details:
          description: >-
            Output only. Human readable explanation about the issue. Provided to
            help address the configuration issues. Not guaranteed to be stable.
            For programmatic access use Reason enum.
          readOnly: true
          type: string
        reason:
          description: Output only. Reason for provisioning failures.
          enum:
            - REASON_UNSPECIFIED
            - AUTHORIZATION_ISSUE
            - RATE_LIMITED
          enumDescriptions:
            - Reason is unspecified.
            - >-
              Certificate provisioning failed due to an issue with one or more
              of the domains on the certificate. For details of which domains
              failed, consult the `authorization_attempt_info` field.
            - >-
              Exceeded Certificate Authority quotas or internal rate limits of
              the system. Provisioning may take longer to complete.
          readOnly: true
          type: string
      type: object
    SelfManagedCertificate:
      description: >-
        Certificate data for a SelfManaged Certificate. SelfManaged Certificates
        are uploaded by the user. Updating such certificates before they expire
        remains the user's responsibility.
      id: SelfManagedCertificate
      properties:
        pemCertificate:
          description: >-
            Optional. Input only. The PEM-encoded certificate chain. Leaf
            certificate comes first, followed by intermediate ones if any.
          type: string
        pemPrivateKey:
          description: >-
            Optional. Input only. The PEM-encoded private key of the leaf
            certificate.
          type: string
      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      type: object
    Troubleshooting:
      description: Troubleshooting information for the authorization attempt.
      id: Troubleshooting
      properties:
        cname:
          $ref: '#/components/schemas/CNAME'
          description: Output only. CNAME troubleshooting information.
          readOnly: true
        ips:
          $ref: '#/components/schemas/IPs'
          description: Output only. IPs troubleshooting information.
          readOnly: true
        issues:
          description: >-
            Output only. The list of issues discovered during the authorization
            attempt.
          items:
            enum:
              - ISSUE_UNSPECIFIED
              - CNAME_MISMATCH
              - RESOLVED_TO_NOT_SERVING
              - RESOLVED_TO_SERVING_ON_ALT_PORTS
              - NO_RESOLVED_IPS
              - CERTIFICATE_NOT_ATTACHED
            enumDescriptions:
              - Issue is unspecified.
              - The resolved CNAME value doesn't match the expected CNAME.
              - >-
                Domain has A/AAAA records that point to IPs, where the
                certificate is not attached.
              - >-
                Domain has A/AAAA records that point to IPs, where the
                certificate is attached, but port 443 is not open.
              - Domain doesn't have any A/AAAA records.
              - >-
                Certificate is not configured to be served from any IPs (e.g.
                Certificate is not attached to any load balancer).
            type: string
          readOnly: true
          type: array
      type: object
    TrustAnchor:
      description: Defines a trust anchor.
      id: TrustAnchor
      properties:
        pemCertificate:
          description: >-
            PEM root certificate of the PKI used for validation. Each
            certificate provided in PEM format may occupy up to 5kB.
          type: string
      type: object
