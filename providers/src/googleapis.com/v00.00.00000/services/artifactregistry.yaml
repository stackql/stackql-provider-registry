          description: >-
            The name of the version the tag refers to, for example:
            `projects/p1/locations/us-central1/repositories/repo1/packages/pkg1/versions/sha256:5243811`
            If the package or version ID parts contain slashes, the slashes are
            escaped.
          type: string
    ImageManifest:
      id: ImageManifest
      description: Details of a single image manifest within a multi-arch image.
      type: object
      properties:
        os:
          description: >-
            Optional. The operating system of the image. Values are provided by
            the Docker client and are not validated by Artifact Registry.
            Example values include "linux", "windows", "darwin", "aix", etc.
          type: string
        osVersion:
          description: >-
            Optional. The OS version of the image, for example on Windows
            `10.0.14393.1066`.
          type: string
        architecture:
          description: >-
            Optional. The CPU architecture of the image. Values are provided by
            the Docker client and are not validated by Artifact Registry.
            Example values include "amd64", "arm64", "ppc64le", "s390x",
            "riscv64", "mips64le", etc.
          type: string
        digest:
          description: Optional. The manifest digest, in the format "sha256:".
          type: string
        mediaType:
          description: >-
            Optional. The media type of the manifest, e.g.,
            "application/vnd.docker.distribution.manifest.v2+json"
          type: string
        variant:
          description: >-
            Optional. The variant of the CPU in the image, for example `v7` to
            specify ARMv7 when architecture is `arm`.
          type: string
        osFeatures:
          description: >-
            Optional. The required OS features for the image, for example on
            Windows `win32k`.
          type: array
          items:
            type: string
    ExportArtifactResponse:
      id: ExportArtifactResponse
      description: The response for exporting an artifact to a destination.
