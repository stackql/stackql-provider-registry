    VulnerabilityScanningConfig:
      description: >-
        Config on whether to perform vulnerability scanning for resources in
        this repository, as well as output fields describing current state.
      type: object
      properties:
        enablementConfig:
          enumDescriptions:
            - >-
              Not set. This will be treated as INHERITED for Docker repositories
              and DISABLED for non-Docker repositories.
            - Scanning is Enabled, but dependent on API enablement.
            - >-
              No automatic vulnerability scanning will be performed for this
              repository.
          enum:
            - ENABLEMENT_CONFIG_UNSPECIFIED
            - INHERITED
            - DISABLED
          description: >-
            Optional. Config for whether this repository has vulnerability
            scanning disabled.
          type: string
        enablementState:
          description: >-
            Output only. State of feature enablement, combining repository
            enablement config and API enablement state.
          type: string
          readOnly: true
          enumDescriptions:
            - Enablement state is unclear.
            - Repository does not support vulnerability scanning.
            - Vulnerability scanning is disabled for this repository.
            - Vulnerability scanning is active for this repository.
          enum:
            - ENABLEMENT_STATE_UNSPECIFIED
            - SCANNING_UNSUPPORTED
            - SCANNING_DISABLED
            - SCANNING_ACTIVE
        lastEnableTime:
          description: Output only. The last time this repository config was enabled.
          type: string
          readOnly: true
          format: google-datetime
        enablementStateReason:
          description: Output only. Reason for the repository state.
          type: string
          readOnly: true
      id: VulnerabilityScanningConfig
