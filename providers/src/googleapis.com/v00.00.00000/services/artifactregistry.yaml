          type: string
      id: ListRulesResponse
    ExportArtifactRequest:
      description: The request for exporting an artifact to a destination.
      type: object
      properties:
        sourceVersion:
          description: >-
            The artifact version to export. Format:
            projects/{project}/locations/{location}/repositories/{repository}/packages/{package}/versions/{version}
          type: string
        sourceTag:
          description: >-
            The artifact tag to export.
            Format:projects/{project}/locations/{location}/repositories/{repository}/packages/{package}/tags/{tag}
          type: string
        gcsPath:
          description: >-
            The Cloud Storage path to export the artifact to. Should start with
            the bucket name, and optionally have a directory path. Examples:
            `dst_bucket`, `dst_bucket/sub_dir`. Existing objects with the same
            path will be overwritten.
          type: string
      id: ExportArtifactRequest
    ImportAptArtifactsGcsSource:
      id: ImportAptArtifactsGcsSource
      description: Google Cloud Storage location where the artifacts currently reside.
      type: object
      properties:
        useWildcards:
          description: >-
            Supports URI wildcards for matching multiple objects from a single
            URI.
          type: boolean
        uris:
          description: Cloud Storage paths URI (e.g., gs://my_bucket//my_object).
          type: array
          items:
            type: string
    UploadGoModuleRequest:
      description: The request to upload a Go module.
      type: object
