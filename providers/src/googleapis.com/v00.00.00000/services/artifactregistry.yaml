        non-caching proxy.
      type: object
      properties: {}
      id: NoCacheFetching
    PrewarmPlatform:
      description: The platform (architecture and OS) of the image. This is a sub-message.
      type: object
      properties:
        architecture:
          description: >-
            Optional. The architecture of the image or tag. For example, "arm64"
            or "amd64".
          type: string
        os:
          description: >-
            Optional. The OS of the image or tag. For example, "linux" or
            "windows".
          type: string
      id: PrewarmPlatform
    ImportAptArtifactsResponse:
      id: ImportAptArtifactsResponse
      description: The response message from importing APT artifacts.
      type: object
      properties:
        errors:
          description: Detailed error info for packages that were not imported.
          type: array
          items:
            $ref: '#/components/schemas/ImportAptArtifactsErrorInfo'
        aptArtifacts:
          description: The Apt artifacts imported.
          type: array
          items:
            $ref: '#/components/schemas/AptArtifact'
    ProjectSettings:
      description: The Artifact Registry settings that apply to a Project.
      type: object
      properties:
        pullPercent:
          description: >-
            The percentage of pull traffic to redirect from GCR to AR when using
            partial redirection.
          type: integer
          format: int32
        name:
          description: >-
            The name of the project's settings. Always of the form:
            projects/{project-id}/projectSettings In update request: never set
            In response: always set
          type: string
        legacyRedirectionState:
          enumDescriptions:
            - No redirection status has been set.
            - Redirection is disabled.
            - Redirection is enabled.
            - >-
              Redirection is enabled, and has been finalized so cannot be
              reverted.
            - Redirection is enabled and missing images are copied from GCR
            - >-
              Redirection is partially enabled and missing images are copied
              from GCR
          enum:
            - REDIRECTION_STATE_UNSPECIFIED
            - REDIRECTION_FROM_GCR_IO_DISABLED
            - REDIRECTION_FROM_GCR_IO_ENABLED
            - REDIRECTION_FROM_GCR_IO_FINALIZED
            - REDIRECTION_FROM_GCR_IO_ENABLED_AND_COPYING
            - REDIRECTION_FROM_GCR_IO_PARTIAL_AND_COPYING
          description: The redirection state of the legacy repositories in this project.
          type: string
          enumDeprecated:
            - false
            - false
            - false
            - true
            - false
            - false
      id: ProjectSettings
    GoogleDevtoolsArtifactregistryV1RemoteRepositoryConfigAptRepositoryCustomRepository:
      description: Customer-specified publicly available remote repository.
      type: object
      properties:
        uri:
          description: >-
            An http/https uri reference to the upstream remote repository, for
            ex: "https://my.apt.registry/".
          type: string
      id: >-
        GoogleDevtoolsArtifactregistryV1RemoteRepositoryConfigAptRepositoryCustomRepository
