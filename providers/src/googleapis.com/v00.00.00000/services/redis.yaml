      properties:
        eventTime:
          type: string
          format: google-datetime
          description: >-
            Required. The last time at which the event described by this signal
            took place
        description:
          description: Description associated with signal
          type: string
        signalSeverity:
          type: string
          enumDescriptions:
            - >-
              This value is used for findings when a source doesn't write a
