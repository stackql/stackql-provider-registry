            - Represents the enterprise plus edition.
            - Represents the standard edition.
          enum:
            - EDITION_UNSPECIFIED
            - EDITION_ENTERPRISE
            - EDITION_ENTERPRISE_PLUS
            - EDITION_STANDARD
          description: >-
            Optional. Edition represents whether the instance is ENTERPRISE or
