            - REDIS_HIGHMEM_XLARGE
            - REDIS_STANDARD_SMALL
            - REDIS_HIGHCPU_MEDIUM
            - REDIS_STANDARD_LARGE
            - REDIS_HIGHMEM_2XLARGE
    ListLocationsResponse:
      id: ListLocationsResponse
