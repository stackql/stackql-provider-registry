            - WIPEOUT_HIDE_EVENT
            - WIPEOUT_PURGE_EVENT
            - BILLING_DISABLED
            - ABUSER_DETECTED
            - ENCRYPTION_KEY_INACCESSIBLE
            - REPLICATED_CLUSTER_ENCRYPTION_KEY_INACCESSIBLE
        expectedState:
