openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Data Lineage API
  description: ''
  version: v1
  x-discovery-doc-revision: '20260729'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/data-catalog
servers:
  - url: https://datalineage.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
            https://www.googleapis.com/auth/datalineage.readonly: >-
              See your Google Cloud Data Lineage data and the email address of
              your Google Account
            https://www.googleapis.com/auth/datalineage.read-write: >-
              See, edit, configure, and delete your Google Cloud Data Lineage
              data and see the email address for your Google Account
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    GoogleCloudDatacatalogLineageV1SearchLinksRequest:
      description: Request message for SearchLinks.
      properties:
        targets:
          $ref: >-
            #/components/schemas/GoogleCloudDatacatalogLineageV1MultipleEntityReference
          description: >-
            Optional. Send a list of asset information in the **targets** field
            to retrieve all links that lead from upstream assets to the
            specified assets. This field is similar to the `target` target field
            but allows providing multiple entities. All entities within the
            `MultipleEntityReference` must have the same `fully_qualified_name`.
        source:
          description: >-
            Optional. Send asset information in the **source** field to retrieve
            all links that lead from the specified asset to downstream assets.
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1EntityReference'
        target:
          description: >-
            Optional. Send asset information in the **target** field to retrieve
            all links that lead from upstream assets to the specified asset.
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1EntityReference'
        pageToken:
          description: >-
            Optional. The page token received from a previous
            `SearchLinksRequest` call. Use it to get the next page. When
            requesting subsequent pages of a response, remember that all
            parameters must match the values you provided in the original
            request.
          type: string
        sources:
          $ref: >-
            #/components/schemas/GoogleCloudDatacatalogLineageV1MultipleEntityReference
          description: >-
            Optional. Send a list of asset information in the **sources** field
            to retrieve all links that lead from the specified assets to
            downstream assets. This field is similar to the `source` source
            field but allows providing multiple entities. All entities within
            the `MultipleEntityReference` must have the same
            `fully_qualified_name`.
        pageSize:
          type: integer
          format: int32
          description: >-
            Optional. The maximum number of links to return in a single page of
            the response. A page may contain fewer links than this value. If
            unspecified, at most 10 links are returned. Maximum value is 100;
            values greater than 100 are reduced to 100.
      type: object
      id: GoogleCloudDatacatalogLineageV1SearchLinksRequest
    GoogleCloudDatacatalogLineageV1ListRunsResponse:
      type: object
      id: GoogleCloudDatacatalogLineageV1ListRunsResponse
      description: Response message for ListRuns.
      properties:
        nextPageToken:
          description: >-
            The token to specify as `page_token` in the next call to get the
            next page. If this field is omitted, there are no subsequent pages.
          type: string
        runs:
          description: The runs from the specified project and location.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1Run'
    GoogleLongrunningListOperationsResponse:
      id: GoogleLongrunningListOperationsResponse
      type: object
      description: The response message for Operations.ListOperations.
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          items:
            $ref: '#/components/schemas/GoogleLongrunningOperation'
          type: array
          description: >-
            A list of operations that matches the specified filter in the
            request.
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
    GoogleCloudDatacatalogLineageV1BatchSearchLinkProcessesResponse:
      type: object
      id: GoogleCloudDatacatalogLineageV1BatchSearchLinkProcessesResponse
      description: Response message for BatchSearchLinkProcesses.
      properties:
        processLinks:
          items:
            $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1ProcessLinks'
          type: array
          description: An array of processes associated with the specified links.
        nextPageToken:
          type: string
          description: >-
            The token to specify as `page_token` in the subsequent call to get
            the next page. Omitted if there are no more pages in the response.
    GoogleCloudDatacatalogLineageV1Run:
      description: >-
        A lineage run represents an execution of a process that creates lineage
        events.
      properties:
        state:
          enum:
            - UNKNOWN
            - STARTED
            - COMPLETED
            - FAILED
            - ABORTED
          description: Required. The state of the run.
          type: string
          enumDescriptions:
            - >-
              The state is unknown. The true state may be any of the below or a
              different state that is not supported here explicitly.
            - The run is still executing.
            - The run completed.
            - The run failed.
            - The run aborted.
        startTime:
          description: Required. The timestamp of the start of the run.
          format: google-datetime
          type: string
        name:
          description: >-
            Immutable. The resource name of the run. Format:
            `projects/{project}/locations/{location}/processes/{process}/runs/{run}`.
            Can be specified or auto-assigned. {run} must be not longer than 200
            characters and only contain characters in a set: `a-zA-Z0-9_-:.`
          type: string
        attributes:
          type: object
          additionalProperties:
            type: any
          description: >-
            Optional. The attributes of the run. Should only be used for the
            purpose of non-semantic management (classifying, describing or
            labeling the run). Up to 100 attributes are allowed.
        displayName:
          description: >-
            Optional. A human-readable name you can set to display in a user
            interface. Must be not longer than 200 characters and only contain
            UTF-8 letters or numbers, spaces or characters like `_-:&.`
          type: string
        endTime:
          description: Optional. The timestamp of the end of the run.
          type: string
          format: google-datetime
      id: GoogleCloudDatacatalogLineageV1Run
      type: object
    GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestionIngestionRuleLineageEnablement:
      description: >-
        Lineage enablement configuration. Defines configurations for the
        ingestion of lineage for the resource and its children.
      properties:
        enabled:
          description: >-
            Optional. If true, ingestion of lineage should be enabled. If false,
            it should be disabled. If unspecified, the system default value is
            used.
          type: boolean
      type: object
      id: >-
        GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestionIngestionRuleLineageEnablement
    GoogleCloudDatacatalogLineageV1LinkDependencyInfo:
      description: Dependency info describes how one entity depends on another.
      properties:
        dependencyType:
          enum:
            - DEPENDENCY_TYPE_UNSPECIFIED
            - EXACT_COPY
            - OTHER
          description: The type of dependency.
          type: string
          enumDescriptions:
            - Dependency type unspecified.
            - Exact data copy without any change.
            - Other types of dependencies like filtering or grouping.
      id: GoogleCloudDatacatalogLineageV1LinkDependencyInfo
      type: object
    GoogleProtobufEmpty:
      type: object
      id: GoogleProtobufEmpty
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      properties: {}
    GoogleCloudDatacatalogLineageV1MultipleEntityReference:
      description: Multiple entity reference for SearchLinksRequest.
      properties:
        entities:
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDatacatalogLineageV1EntityReference
          type: array
          description: >-
            Optional. The list of entities to search for links. The maximum
            number of entities is 20.
      id: GoogleCloudDatacatalogLineageV1MultipleEntityReference
      type: object
    GoogleCloudDatacatalogLineageV1ProcessLinks:
      type: object
      id: GoogleCloudDatacatalogLineageV1ProcessLinks
      description: Links associated with a specific process.
      properties:
        links:
          description: >-
            An array containing link details objects of the links provided in
            the original request. A single process can result in creating
            multiple links. If any of the links you provide in the request are
            created by the same process, they all are included in this array.
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDatacatalogLineageV1ProcessLinkInfo
        process:
          description: >-
            The process name in the format of
            `projects/{project}/locations/{location}/processes/{process}`.
          type: string
    GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestion:
      id: GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestion
      type: object
      description: Defines how Lineage should be ingested for a given resource.
      properties:
        rules:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestionIngestionRule
          description: Optional. List of rules for Data Lineage ingestion.
    GoogleCloudDatacatalogLineageV1BatchSearchLinkProcessesRequest:
      description: Request message for BatchSearchLinkProcesses.
      properties:
        pageSize:
          description: >-
            Optional. The maximum number of processes to return in a single page
            of the response. A page may contain fewer results than this value.
          type: integer
          format: int32
        pageToken:
          type: string
          description: >-
            Optional. The page token received from a previous
            `BatchSearchLinkProcesses` call. Use it to get the next page. When
            requesting subsequent pages of a response, remember that all
            parameters must match the values you provided in the original
            request.
        links:
          type: array
          items:
            type: string
          description: >-
            Required. An array of links to check for their associated
            LineageProcesses. The maximum number of items in this array is 100.
            If the request contains more than 100 links, it returns the
            `INVALID_ARGUMENT` error. Format:
            `projects/{project}/locations/{location}/links/{link}`.
      id: GoogleCloudDatacatalogLineageV1BatchSearchLinkProcessesRequest
      type: object
    GoogleTypeInterval:
      id: GoogleTypeInterval
      type: object
      description: >-
        Represents a time interval, encoded as a Timestamp start (inclusive) and
        a Timestamp end (exclusive). The start must be less than or equal to the
        end. When the start equals the end, the interval is empty (matches no
        time). When both start and end are unspecified, the interval matches any
        time.
      properties:
        startTime:
          description: >-
            Optional. Inclusive start of the interval. If specified, a Timestamp
            matching this interval will have to be the same or after the start.
          type: string
          format: google-datetime
        endTime:
          type: string
          format: google-datetime
          description: >-
            Optional. Exclusive end of the interval. If specified, a Timestamp
            matching this interval will have to be before the end.
    GoogleLongrunningOperation:
      type: object
      id: GoogleLongrunningOperation
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      properties:
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
        done:
          type: boolean
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/GoogleRpcStatus'
        name:
          type: string
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
        response:
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
    GoogleRpcStatus:
      type: object
      id: GoogleRpcStatus
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      properties:
        code:
          format: int32
          type: integer
          description: The status code, which should be an enum value of google.rpc.Code.
        message:
          type: string
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          type: array
          items:
            type: object
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
    GoogleCloudDatacatalogLineageV1ProcessLinkInfo:
      description: Link details.
      properties:
        link:
          type: string
          description: >-
            The name of the link in the format of
            `projects/{project}/locations/{location}/links/{link}`.
        startTime:
          format: google-datetime
          type: string
          description: The start of the first event establishing this link-process tuple.
        endTime:
          format: google-datetime
          type: string
          description: The end of the last event establishing this link-process tuple.
      id: GoogleCloudDatacatalogLineageV1ProcessLinkInfo
      type: object
    GoogleCloudDatacatalogLineageV1Origin:
      description: Origin of a process.
      properties:
        sourceType:
          description: >-
            Type of the source. Use of a source_type other than `CUSTOM` for
            process creation or updating is highly discouraged. It might be
            restricted in the future without notice. There will be increase in
            cost if you use any of the source types other than `CUSTOM`.
          enum:
            - SOURCE_TYPE_UNSPECIFIED
            - CUSTOM
            - BIGQUERY
            - DATA_FUSION
            - COMPOSER
            - LOOKER_STUDIO
            - DATAPROC
            - VERTEX_AI
            - DATAFLOW
            - LOOKER_CORE
          type: string
          enumDescriptions:
            - Source is Unspecified
            - A custom source
            - BigQuery
            - Data Fusion
            - Composer
            - Looker Studio
            - Dataproc
            - Vertex AI
            - Dataflow
            - Looker Core
        name:
          type: string
          description: >-
            If the source_type isn't CUSTOM, the value of this field should be a
            Google Cloud resource name of the system, which reports lineage. The
            project and location parts of the resource name must match the
            project and location of the lineage resource being created.
            Examples: - `{source_type: COMPOSER, name:
            "projects/foo/locations/us/environments/bar"}` - `{source_type:
            BIGQUERY, name: "projects/foo/locations/eu"}` - `{source_type:
            CUSTOM, name: "myCustomIntegration"}`
      id: GoogleCloudDatacatalogLineageV1Origin
      type: object
    GoogleCloudDatacatalogLineageV1ListLineageEventsResponse:
      id: GoogleCloudDatacatalogLineageV1ListLineageEventsResponse
      type: object
      description: Response message for ListLineageEvents.
      properties:
        lineageEvents:
          items:
            $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1LineageEvent'
          type: array
          description: Lineage events from the specified project and location.
        nextPageToken:
          type: string
          description: >-
            The token to specify as `page_token` in the next call to get the
            next page. If this field is omitted, there are no subsequent pages.
    GoogleCloudDatacatalogLineageConfigmanagementV1Config:
      description: >-
        Configuration for Data Lineage. Defines different configuration options
        for Lineage customers to control behaviour of lineage systems.
      properties:
        name:
          type: string
          description: >-
            Identifier. The resource name of the config. Format:
            `organizations/{organization_id}/locations/global/config`
            `folders/{folder_id}/locations/global/config`
            `projects/{project_id}/locations/global/config`
            `projects/{project_number}/locations/global/config`
        ingestion:
          $ref: >-
            #/components/schemas/GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestion
          description: Optional. Ingestion rule for Data Lineage ingestion.
        etag:
          description: >-
            Optional. `etag` is used for optimistic concurrency control as a way
            to help prevent simultaneous updates of a config from overwriting
            each other. It is required that systems make use of the `etag` in
            the read-modify-write cycle to perform config updates in order to
            avoid race conditions: An `etag` is returned in the response to
            `GetConfig`, and systems are expected to put that etag in the
            request to `UpdateConfig` to ensure that their change will be
            applied to the same version of the config. If an `etag` is not
            provided in the call to `UpdateConfig`, then the existing config, if
            any, will be overwritten.
          type: string
      id: GoogleCloudDatacatalogLineageConfigmanagementV1Config
      type: object
    GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequestSearchLimits:
      type: object
      id: GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequestSearchLimits
      description: Limits for the search results.
      properties:
        maxResults:
          description: >-
            Optional. The maximum number of links to return in the response. The
            default value is 1_000 and the maximum value is 10_000.
          type: integer
          format: int32
        maxDepth:
          format: int32
          type: integer
          description: >-
            Optional. The maximum depth of the search. The default value is 5
            and maximum value is 100.
        maxProcessPerLink:
          description: >-
            Optional. The maximum number of processes to return per link. The
            default value is 0 and the maximum value is 100. If this value is
            non-zero, the response will contain process names for the links. To
            retrieve full process details in the response, include
            `links.processes.process` in the
            [FieldMask](https://developers.google.com/workspace/docs/api/how-tos/field-masks#read_with_a_field_mask).
          type: integer
          format: int32
    GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequest:
      description: Request message for SearchLineageStreaming.
      properties:
        rootCriteria:
          $ref: >-
            #/components/schemas/GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequestRootCriteria
          description: Required. Criteria for the root of the search.
        locations:
          description: >-
            Required. The locations to search in. This list should contain the
            location from the `parent` field.
          type: array
          items:
            type: string
        direction:
          enum:
            - SEARCH_DIRECTION_UNSPECIFIED
            - DOWNSTREAM
            - UPSTREAM
          description: Required. Direction of the search.
          type: string
          enumDescriptions:
            - Direction is unspecified.
            - >-
              Retrieve links that lead from the specified asset to downstream
              assets.
            - >-
              Retrieve links that lead from upstream assets to the specified
              asset.
        filters:
          $ref: >-
            #/components/schemas/GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequestSearchFilters
          description: Optional. Filters for the search.
        limits:
          description: Optional. Limits for the search.
          $ref: >-
            #/components/schemas/GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequestSearchLimits
      type: object
      id: GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequest
    GoogleLongrunningCancelOperationRequest:
      id: GoogleLongrunningCancelOperationRequest
      type: object
      description: The request message for Operations.CancelOperation.
      properties: {}
    GoogleCloudDatacatalogLineageV1DependencyInfo:
      description: Dependency info describes how one entity depends on another.
      properties:
        dependencyType:
          description: Required. Type of dependency.
          enum:
            - DEPENDENCY_TYPE_UNSPECIFIED
            - EXACT_COPY
            - OTHER
          type: string
          enumDescriptions:
            - Dependency type unspecified.
            - Exact data copy without any change.
            - Other types of dependencies like filtering or grouping.
      id: GoogleCloudDatacatalogLineageV1DependencyInfo
      type: object
    GoogleCloudDatacatalogLineageV1LineageLinkLineageProcess:
      id: GoogleCloudDatacatalogLineageV1LineageLinkLineageProcess
      type: object
      description: Process metadata for the link.
      properties:
        process:
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1Process'
          description: Process that created the link.
    GoogleCloudDatacatalogLineageV1EventLink:
      description: A lineage between source and target entities.
      properties:
        source:
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1EntityReference'
          description: Required. Reference to the source entity
        target:
          description: Required. Reference to the target entity
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1EntityReference'
        dependencyInfo:
          description: Optional. Describes how the target depends on the source.
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1DependencyInfo'
      id: GoogleCloudDatacatalogLineageV1EventLink
      type: object
    GoogleCloudDatacatalogLineageV1LineageEvent:
      type: object
      id: GoogleCloudDatacatalogLineageV1LineageEvent
      description: >-
        A lineage event represents an operation on assets. Within the operation,
        the data flows from the source to the target defined in the links field.
      properties:
        name:
          type: string
          description: >-
            Immutable. The resource name of the lineage event. Format:
            `projects/{project}/locations/{location}/processes/{process}/runs/{run}/lineageEvents/{lineage_event}`.
            Can be specified or auto-assigned. {lineage_event} must be not
            longer than 200 characters and only contain characters in a set:
            `a-zA-Z0-9_-:.`
        links:
          items:
            $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1EventLink'
          type: array
          description: >-
            Optional. List of source-target pairs. Can't contain more than 100
            tuples.
        startTime:
          type: string
          format: google-datetime
          description: >-
            Required. The beginning of the transformation which resulted in this
            lineage event. For streaming scenarios, it should be the beginning
            of the period from which the lineage is being reported.
        endTime:
          description: >-
            Optional. The end of the transformation which resulted in this
            lineage event. For streaming scenarios, it should be the end of the
            period from which the lineage is being reported.
          format: google-datetime
          type: string
    GoogleCloudDatacatalogLineageV1SearchLineageStreamingResponse:
      type: object
      id: GoogleCloudDatacatalogLineageV1SearchLineageStreamingResponse
      description: Response message for SearchLineageStreaming.
      properties:
        links:
          description: >-
            Output only. The lineage links that match the search criteria. Can
            be empty if no links match.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1LineageLink'
        unreachable:
          type: array
          items:
            type: string
          description: >-
            Unordered list. Unreachable resources. If non-empty, the result set
            might be incomplete. Currently, only locations are supported.
            Format: `projects/[PROJECT_NUMBER]/locations/[LOCATION]` Example:
            projects/123456789/locations/us-east1
    GoogleCloudDatacatalogLineageV1SearchLinksResponse:
      description: Response message for SearchLinks.
      properties:
        nextPageToken:
          description: >-
            The token to specify as `page_token` in the subsequent call to get
            the next page. Omitted if there are no more pages in the response.
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1Link'
          description: >-
            The list of links for a given asset. Can be empty if the asset has
            no relations of requested type (source or target).
      id: GoogleCloudDatacatalogLineageV1SearchLinksResponse
      type: object
    GoogleCloudDatacatalogLineageV1Link:
      id: GoogleCloudDatacatalogLineageV1Link
      type: object
      description: >-
        Links represent the data flow between **source** (upstream) and
        **target** (downstream) assets in transformation pipelines. Links are
        created when LineageEvents record data transformation between related
        assets.
      properties:
        dependencyInfo:
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDatacatalogLineageV1LinkDependencyInfo
          description: >-
            Optional. The dependency info of the link (applies only to column
            level links).
        source:
          description: The pointer to the entity that is the **source** of this link.
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1EntityReference'
        target:
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1EntityReference'
          description: The pointer to the entity that is the **target** of this link.
        startTime:
          format: google-datetime
          type: string
          description: The start of the first event establishing this link.
        endTime:
          description: The end of the last event establishing this link.
          type: string
          format: google-datetime
        name:
          description: >-
            Output only. Immutable. The name of the link. Format:
            `projects/{project}/locations/{location}/links/{link}`.
          readOnly: true
          type: string
    GoogleCloudDatacatalogLineageV1ListProcessesResponse:
      type: object
      id: GoogleCloudDatacatalogLineageV1ListProcessesResponse
      description: Response message for ListProcesses.
      properties:
        processes:
          description: The processes from the specified project and location.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1Process'
        nextPageToken:
          description: >-
            The token to specify as `page_token` in the next call to get the
            next page. If this field is omitted, there are no subsequent pages.
          type: string
    GoogleCloudDatacatalogLineageV1EntityReference:
      type: object
      id: GoogleCloudDatacatalogLineageV1EntityReference
      description: The soft reference to everything you can attach a lineage event to.
      properties:
        fullyQualifiedName:
          type: string
          description: >-
            Required. [Fully Qualified Name
            (FQN)](https://cloud.google.com/dataplex/docs/fully-qualified-names)
            of the entity.
        field:
          type: array
          items:
            type: string
          description: >-
            Optional. Field path within the entity. Each nesting level should be
            a separate value in the repeated field. The order matters. Must be
            empty for asset level lineage For example to address "salary.net"
            subfield where "salary" is a column and "net" is a proto field two
            values in the `field` should be reported, the first is "salary" and
            the second is "net". Each field length is limited to 500 characters.
            Maximum supported nesting level is 20.
    GoogleCloudDatacatalogLineageV1LineageLink:
      id: GoogleCloudDatacatalogLineageV1LineageLink
      type: object
      description: Lineage link between two entities.
      properties:
        source:
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1EntityReference'
          description: The entity that is the **source** of this link.
        target:
          description: The entity that is the **target** of this link.
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1EntityReference'
        location:
          description: The location where the LineageEvent that created the link is stored.
          type: string
        dependencyInfo:
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDatacatalogLineageV1LineageLinkDependencyInfo
          type: array
          description: Describes how the target entity is dependent on the source entity.
        processes:
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDatacatalogLineageV1LineageLinkLineageProcess
          type: array
          description: Processes metadata associated with the link.
        depth:
          format: int32
          type: integer
          description: Depth of the current link in the graph starting from 1.
    GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequestRootCriteria:
      id: GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequestRootCriteria
      type: object
      description: Criteria for the root of the search.
      properties:
        entities:
          $ref: >-
            #/components/schemas/GoogleCloudDatacatalogLineageV1MultipleEntityReference
          description: >-
            Optional. The entities to initiate the search from. Entities can be
            specified by FQN only, or by FQN and field. To search by FQN and all
            available fields for that FQN, use the wildcard `*` as the field
            value.
    GoogleCloudDatacatalogLineageV1LineageLinkDependencyInfo:
      type: object
      id: GoogleCloudDatacatalogLineageV1LineageLinkDependencyInfo
      description: Dependency info describes how one entity is dependent on another.
      properties:
        dependencyType:
          type: string
          enumDescriptions:
            - Dependency type unspecified.
            - Exact data copy without any change.
            - Other types of dependencies like filtering or grouping.
          description: The type of dependency.
          enum:
            - DEPENDENCY_TYPE_UNSPECIFIED
            - EXACT_COPY
            - OTHER
    GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestionIngestionRule:
