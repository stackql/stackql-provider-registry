      properties:
        lineageEnablement:
          $ref: >-
            #/components/schemas/GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestionIngestionRuleLineageEnablement
          description: >-
            Required. Lineage enablement configuration. Defines configurations
            for the ingestion of lineage for the resource and its children. If
            unspecified, the ingestion will be enabled only if it was configured
            in the resource's parent.
        integrationSelector:
          description: >-
            Required. Integration selector of the rule. The rule is only applied
            to the Integration selected by the selector.
          $ref: >-
            #/components/schemas/GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestionIngestionRuleIntegrationSelector
      id: >-
        GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestionIngestionRule
      type: object
    GoogleCloudDatacatalogLineageV1ProcessOpenLineageRunEventResponse:
      description: Response message for ProcessOpenLineageRunEvent.
      properties:
        lineageEvents:
          description: >-
            Created lineage event names. Format:
            `projects/{project}/locations/{location}/processes/{process}/runs/{run}/lineageEvents/{lineage_event}`.
          type: array
          items:
            type: string
        run:
          description: >-
            Created run name. Format:
            `projects/{project}/locations/{location}/processes/{process}/runs/{run}`.
          type: string
        process:
          description: >-
            Created process name. Format:
            `projects/{project}/locations/{location}/processes/{process}`.
          type: string
      id: GoogleCloudDatacatalogLineageV1ProcessOpenLineageRunEventResponse
      type: object
    GoogleCloudDatacatalogLineageV1OperationMetadata:
      description: Metadata describing the operation.
      properties:
        operationType:
          readOnly: true
          description: Output only. The type of the operation being performed.
          enum:
            - TYPE_UNSPECIFIED
            - DELETE
            - CREATE
          type: string
          enumDescriptions:
            - Unused.
            - The resource deletion operation.
            - The resource creation operation.
        resourceUuid:
          description: Output only. The UUID of the resource being operated on.
          readOnly: true
          type: string
        endTime:
          description: >-
            Output only. The timestamp of the operation termination, regardless
