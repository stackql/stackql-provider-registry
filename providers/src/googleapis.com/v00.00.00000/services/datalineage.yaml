            ongoing.
          readOnly: true
          type: string
          format: google-datetime
        state:
          type: string
          enumDescriptions:
            - Unused.
            - The operation has been created but is not yet started.
            - The operation is underway.
            - The operation completed successfully.
            - The operation is no longer running and did not succeed.
          description: Output only. The current operation state.
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - RUNNING
            - SUCCEEDED
            - FAILED
          readOnly: true
        resource:
          readOnly: true
          type: string
          description: >-
            Output only. The [relative name]
            (https://cloud.google.com//apis/design/resource_names#relative_resource_name)
            of the resource being operated on.
        createTime:
          format: google-datetime
          readOnly: true
          type: string
          description: >-
            Output only. The timestamp of the operation submission to the
            server.
      id: GoogleCloudDatacatalogLineageV1OperationMetadata
      type: object
    GoogleCloudDatacatalogLineageV1Process:
      description: A process is the definition of a data transformation operation.
      properties:
        name:
          description: >-
            Immutable. The resource name of the lineage process. Format:
            `projects/{project}/locations/{location}/processes/{process}`. Can
            be specified or auto-assigned. {process} must be not longer than 200
            characters and only contain characters in a set: `a-zA-Z0-9_-:.`
          type: string
        attributes:
          type: object
          additionalProperties:
            type: any
          description: >-
            Optional. The attributes of the process. Should only be used for the
            purpose of non-semantic management (classifying, describing or
            labeling the process). Up to 100 attributes are allowed.
        origin:
          $ref: '#/components/schemas/GoogleCloudDatacatalogLineageV1Origin'
          description: >-
            Optional. The origin of this process and its runs and lineage
            events.
        displayName:
          type: string
          description: >-
            Optional. A human-readable name you can set to display in a user
            interface. Must be not longer than 200 characters and only contain
            UTF-8 letters or numbers, spaces or characters like `_-:&.`
      id: GoogleCloudDatacatalogLineageV1Process
      type: object
    GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequestSearchFilters:
      description: Filters for the search.
      properties:
        dependencyTypes:
          description: >-
            Optional. Types of dependencies between entities to retrieve. If
            unspecified, all dependency types are returned.
          type: array
          items:
            type: string
            enumDescriptions:
              - Dependency type unspecified.
              - Exact data copy without any change.
              - Other types of dependencies like filtering or grouping.
            enum:
              - DEPENDENCY_TYPE_UNSPECIFIED
              - EXACT_COPY
              - OTHER
        entitySet:
          type: string
          enumDescriptions:
            - The entity set is unspecified. Returns all the data.
            - >-
              Returns entities with only FQN specified. For example, entities
              with the `field` field set are not returned.
          description: >-
            Optional. Entity set restriction. If unspecified, the method returns
            all entities.
          enum:
            - ENTITY_SET_UNSPECIFIED
            - ENTITIES
        timeRange:
          $ref: '#/components/schemas/GoogleTypeInterval'
          description: >-
            Optional. Time interval to search for lineage. If unspecified, all
            lineage is returned. Currently, at most one of `start_time` and
            `end_time` can be set.
      type: object
      id: >-
        GoogleCloudDatacatalogLineageV1SearchLineageStreamingRequestSearchFilters
    GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestionIngestionRuleIntegrationSelector:
      description: >-
        Integration selector of the rule. The rule is only applied to the
        Integration selected by the selector.
      properties:
        integration:
          type: string
          enumDescriptions:
            - Integration is Unspecified
            - BigQuery
            - Dataproc
            - Looker Core
            - >-
              Managed Service for Apache Airflow (formerly known as Cloud
              Composer)
          enum:
            - INTEGRATION_UNSPECIFIED
            - BIGQUERY
            - DATAPROC
            - LOOKER_CORE
            - MANAGED_AIRFLOW
          description: >-
            Required. Integration to which the rule applies. This field can be
            used to specify the integration against which the ingestion rule
            should be applied.
      id: >-
        GoogleCloudDatacatalogLineageConfigmanagementV1ConfigIngestionIngestionRuleIntegrationSelector
      type: object
