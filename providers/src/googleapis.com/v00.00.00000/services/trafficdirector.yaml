    StringMatcher:
      description: 'Specifies the way to match a string. [#next-free-field: 9]'
      type: object
      id: StringMatcher
      properties:
        suffix:
          description: >-
            The input string must have the suffix specified here. .. note::
            Empty suffix match is not allowed, please use ``safe_regex``
            instead. Examples: * ``abc`` matches the value ``xyz.abc``
          type: string
        custom:
          $ref: '#/components/schemas/TypedExtensionConfig'
          description: >-
            Use an extension as the matcher type. [#extension-category:
            envoy.string_matcher]
        exact:
          description: >-
            The input string must match exactly the string specified here.
            Examples: * ``abc`` only matches the value ``abc``.
          type: string
        safeRegex:
          $ref: '#/components/schemas/RegexMatcher'
          description: The input string must match the regular expression specified here.
        contains:
          description: >-
            The input string must have the substring specified here. .. note::
            Empty contains match is not allowed, please use ``safe_regex``
            instead. Examples: * ``abc`` matches the value ``xyz.abc.def``
          type: string
        ignoreCase:
          description: >-
            If ``true``, indicates the exact/prefix/suffix/contains matching
            should be case insensitive. This has no effect for the
            ``safe_regex`` match. For example, the matcher ``data`` will match
            both input string ``Data`` and ``data`` if this option is set to
            ``true``.
          type: boolean
        prefix:
          description: >-
            The input string must have the prefix specified here. .. note::
            Empty prefix match is not allowed, please use ``safe_regex``
            instead. Examples: * ``abc`` matches the value ``abc.xyz``
          type: string
    EndpointsConfigDump:
      description: >-
        Envoy's admin fill this message with all currently known endpoints.
