components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    ClientStatusResponse:
      type: object
      id: ClientStatusResponse
      properties:
        config:
          description: Client configs for the clients specified in the ClientStatusRequest.
          type: array
          items:
            $ref: '#/components/schemas/ClientConfig'
    PathSegment:
      description: Specifies the segment in a path to retrieve value from Struct.
      type: object
      id: PathSegment
      properties:
        key:
          description: If specified, use the key to retrieve the value in a Struct.
          type: string
    NullMatch:
      id: NullMatch
      properties: {}
      description: NullMatch is an empty message to specify a null value.
      type: object
    NodeMatcher:
      description: Specifies the way to match a Node. The match follows AND semantics.
      type: object
      id: NodeMatcher
      properties:
        nodeId:
          $ref: '#/components/schemas/StringMatcher'
          description: Specifies match criteria on the node id.
        nodeMetadatas:
          items:
            $ref: '#/components/schemas/StructMatcher'
          description: Specifies match criteria on the node metadata.
          type: array
    DoubleRange:
      id: DoubleRange
      properties:
        start:
          description: start of the range (inclusive)
          type: number
          format: double
        end:
          format: double
          description: end of the range (exclusive)
          type: number
      description: >-
        Specifies the double start and end of the range using half-open interval
        semantics [start, end).
      type: object
    BuildVersion:
      description: >-
        BuildVersion combines SemVer version of extension with free-form build
        information (i.e. 'alpha', 'private-build') as a set of strings.
      type: object
      id: BuildVersion
      properties:
        version:
          description: SemVer version of extension.
          $ref: '#/components/schemas/SemanticVersion'
        metadata:
          description: >-
            Free-form build information. Envoy defines several well known keys
            in the source/common/version/version.h file
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
    Address:
