          type: string
        lastUpdated:
          description: Timestamp when the xDS resource was last updated
          type: string
          format: google-datetime
        clientStatus:
          enumDescriptions:
            - Resource status is not available/unknown.
            - >-
              Client requested this resource but hasn't received any update from
