            - Client timed out waiting for the resource from the control plane.
          enum:
            - UNKNOWN
            - REQUESTED
            - DOES_NOT_EXIST
            - ACKED
            - NACKED
            - RECEIVED_ERROR
            - TIMEOUT
          description: Per xDS resource status from the view of a xDS client
          type: string
        errorState:
          description: >-
            Set if the last update failed, cleared after the next successful
