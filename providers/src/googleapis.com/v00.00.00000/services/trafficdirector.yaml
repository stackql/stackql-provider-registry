          type: boolean
        configStatus:
          description: >-
            Per xDS resource config status. It is generated by management
            servers. It will not be present if the CSDS server is an xDS client.
          type: string
          enumDescriptions:
            - Status info is not available/unknown.
            - Management server has sent the config to client and received ACK.
            - Config is not sent.
            - >-
              Management server has sent the config to client but hasn’t
              received ACK/NACK.
            - >-
              Management server has sent the config to client but received NACK.
