    Operation:
      id: Operation
      type: object
      properties:
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
        response:
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        metadata:
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
    AutoscalingTargets:
      properties:
        cpuUtilizationPercent:
          description: >-
            The cpu utilization that the Autoscaler should be trying to achieve.
            This number is on a scale from 0 (no utilization) to 100 (total
            utilization), and is limited between 10 and 80, otherwise it will
            return INVALID_ARGUMENT error.
          format: int32
          type: integer
        storageUtilizationGibPerNode:
          description: >-
            The storage utilization that the Autoscaler should be trying to
            achieve. This number is limited between 2560 (2.5TiB) and 5120
            (5TiB) for a SSD cluster and between 8192 (8TiB) and 16384 (16TiB)
            for an HDD cluster, otherwise it will return INVALID_ARGUMENT error.
            If this value is set to 0, it will be treated as if it were set to
            the default value: 2560 for SSD, 8192 for HDD.
          format: int32
          type: integer
      description: >-
        The Autoscaling targets for a Cluster. These determine the recommended
        nodes.
      id: AutoscalingTargets
      type: object
    GoogleBigtableAdminV2MaterializedViewClusterState:
      type: object
      id: GoogleBigtableAdminV2MaterializedViewClusterState
      description: The state of a materialized view's data in a particular cluster.
      properties:
        replicationState:
          description: Output only. The state of the materialized view in this cluster.
          readOnly: true
          enumDescriptions:
            - The state of the materialized view is unknown in this cluster.
            - >-
              The cluster or view was recently created, and the materialized
              view must finish backfilling before it can begin serving Data API
              requests.
            - >-
              The materialized view can serve Data API requests from this
              cluster. Depending on materialization and replication delay, reads
              may not immediately reflect the state of the materialized view in
              other clusters.
          enum:
            - STATE_NOT_KNOWN
            - INITIALIZING
            - READY
          type: string
    UndeleteTableMetadata:
      type: object
      id: UndeleteTableMetadata
      description: >-
        Metadata type for the operation returned by
