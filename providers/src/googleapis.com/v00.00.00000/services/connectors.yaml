      type: object
    ToolAnnotations:
      description: ToolAnnotations holds annotations for a tool.
      id: ToolAnnotations
      properties:
        destructiveHint:
          description: >-
            If true, the tool may perform destructive updates to its
            environment. If false, the tool performs only additive updates.
            (This property is meaningful only when `read_only_hint == false`)
          type: boolean
        idempotentHint:
          description: >-
            If true, calling the tool repeatedly with the same arguments will
            have no additional effect on the environment. (This property is
            meaningful only when `read_only_hint == false`)
          type: boolean
        openWorldHint:
          description: >-
            If true, this tool may interact with an "open world" of external
            entities. If false, the tool's domain of interaction is closed. For
            example, the world of a web search tool is open, whereas that of a
            memory tool is not.
          type: boolean
        readOnlyHint:
          description: If true, the tool does not modify its environment.
          type: boolean
        title:
          description: A human-readable title for the tool.
          type: string
      type: object
    ToolName:
      id: ToolName
      properties:
        entityName:
          description: Entity name for which the tool was generated.
          type: string
        name:
          description: Tool name that was generated in the list tools call.
          type: string
        operation:
