          $ref: '#/components/schemas/JsonSchema'
          description: >-
            JsonSchema of the parameter, applicable only if parameter is of type
            `STRUCT`
        name:
          description: Name of the Parameter.
          type: string
        nullable:
          description: Specifies whether a null value is allowed.
          type: boolean
