          type: string
        displayName:
          description: >-
            Optional. User friendly display name of the Glossary. This is
            user-mutable. This will be same as the GlossaryId, if not specified.
          type: string
        etag:
          description: >-
            Optional. Needed for resource freshness validation. This checksum is
