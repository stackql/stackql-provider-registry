          description: Details about the action associated with the event.
        assetId:
          description: The id of the associated asset.
          type: string
        config:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DiscoveryEventConfigDetails
          description: Details about discovery configuration in effect.
        dataLocation:
          description: The data location associated with the event.
          type: string
        datascanId:
          description: The id of the associated datascan for standalone discovery.
          type: string
        entity:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DiscoveryEventEntityDetails
          description: Details about the entity associated with the event.
        lakeId:
          description: The id of the associated lake.
          type: string
        message:
          description: The log message.
          type: string
        partition:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DiscoveryEventPartitionDetails
          description: Details about the partition associated with the event.
        table:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DiscoveryEventTableDetails'
          description: >-
            Details about the BigQuery table publishing associated with the
            event.
        type:
          description: The type of the event being logged.
          enum:
            - EVENT_TYPE_UNSPECIFIED
            - CONFIG
            - ENTITY_CREATED
            - ENTITY_UPDATED
            - ENTITY_DELETED
            - PARTITION_CREATED
            - PARTITION_UPDATED
            - PARTITION_DELETED
            - TABLE_PUBLISHED
            - TABLE_UPDATED
            - TABLE_IGNORED
            - TABLE_DELETED
          enumDescriptions:
            - An unspecified event type.
            - An event representing discovery configuration in effect.
            - An event representing a metadata entity being created.
            - An event representing a metadata entity being updated.
            - An event representing a metadata entity being deleted.
            - An event representing a partition being created.
            - An event representing a partition being updated.
            - An event representing a partition being deleted.
            - An event representing a table being published.
            - An event representing a table being updated.
            - An event representing a table being skipped in publishing.
            - An event representing a table being deleted.
          type: string
        zoneId:
          description: The id of the associated zone.
          type: string
      type: object
    GoogleCloudDataplexV1DiscoveryEventActionDetails:
      description: Details about the action.
      id: GoogleCloudDataplexV1DiscoveryEventActionDetails
      properties:
        issue:
          description: The human readable issue associated with the action.
          type: string
        type:
          description: The type of action. Eg. IncompatibleDataSchema, InvalidDataFormat
          type: string
      type: object
    GoogleCloudDataplexV1DiscoveryEventConfigDetails:
      description: Details about configuration events.
      id: GoogleCloudDataplexV1DiscoveryEventConfigDetails
      properties:
        parameters:
          additionalProperties:
            type: string
          description: >-
            A list of discovery configuration parameters in effect. The keys are
            the field paths within DiscoverySpec. Eg. includePatterns,
            excludePatterns, csvOptions.disableTypeInference, etc.
          type: object
      type: object
    GoogleCloudDataplexV1DiscoveryEventEntityDetails:
      description: Details about the entity.
      id: GoogleCloudDataplexV1DiscoveryEventEntityDetails
      properties:
        entity:
          description: >-
            The name of the entity resource. The name is the fully-qualified
            resource name.
          type: string
        type:
          description: The type of the entity resource.
          enum:
            - ENTITY_TYPE_UNSPECIFIED
            - TABLE
            - FILESET
          enumDescriptions:
            - An unspecified event type.
            - Entities representing structured data.
            - Entities representing unstructured data.
          type: string
      type: object
    GoogleCloudDataplexV1DiscoveryEventPartitionDetails:
      description: Details about the partition.
      id: GoogleCloudDataplexV1DiscoveryEventPartitionDetails
      properties:
        entity:
          description: >-
            The name to the containing entity resource. The name is the
            fully-qualified resource name.
          type: string
        partition:
          description: >-
            The name to the partition resource. The name is the fully-qualified
            resource name.
          type: string
        sampledDataLocations:
          description: >-
            The locations of the data items (e.g., a Cloud Storage objects)
            sampled for metadata inference.
          items:
            type: string
          type: array
        type:
          description: The type of the containing entity resource.
          enum:
            - ENTITY_TYPE_UNSPECIFIED
            - TABLE
            - FILESET
          enumDescriptions:
            - An unspecified event type.
            - Entities representing structured data.
            - Entities representing unstructured data.
          type: string
      type: object
    GoogleCloudDataplexV1DiscoveryEventTableDetails:
      description: Details about the published table.
      id: GoogleCloudDataplexV1DiscoveryEventTableDetails
      properties:
        table:
          description: The fully-qualified resource name of the table resource.
          type: string
        type:
          description: The type of the table resource.
          enum:
            - TABLE_TYPE_UNSPECIFIED
            - EXTERNAL_TABLE
            - BIGLAKE_TABLE
            - OBJECT_TABLE
          enumDescriptions:
            - An unspecified table type.
            - External table type.
            - BigLake table type.
            - Object table type for unstructured data.
          type: string
      type: object
    GoogleCloudDataplexV1EncryptionConfig:
      description: >-
        A Resource designed to manage encryption configurations for customers to
        support Customer Managed Encryption Keys (CMEK).
      id: GoogleCloudDataplexV1EncryptionConfig
      properties:
        createTime:
          description: Output only. The time when the Encryption configuration was created.
          format: google-datetime
          readOnly: true
          type: string
        enableMetastoreEncryption:
          description: Optional. Represent the state of CMEK opt-in for metastore.
          type: boolean
        encryptionState:
          description: Output only. The state of encryption of the databases.
          enum:
            - ENCRYPTION_STATE_UNSPECIFIED
            - ENCRYPTING
            - COMPLETED
            - FAILED
          enumDescriptions:
            - State is not specified.
            - >-
              The encryption state of the database when the EncryptionConfig is
              created or updated. If the encryption fails, it is retried
              indefinitely and the state is shown as ENCRYPTING.
            - The encryption of data has completed successfully.
            - >-
              The encryption of data has failed. The state is set to FAILED when
              the encryption fails due to reasons like permission issues,
              invalid key etc.
          readOnly: true
          type: string
        etag:
          description: Etag of the EncryptionConfig. This is a strong etag.
          type: string
        failureDetails:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1EncryptionConfigFailureDetails
          description: >-
            Output only. Details of the failure if anything related to Cmek db
            fails.
          readOnly: true
        key:
          description: >-
            Optional. If a key is chosen, it means that the customer is using
            CMEK. If a key is not chosen, it means that the customer is using
            Google managed encryption.
          type: string
        name:
          description: >-
            Identifier. The resource name of the EncryptionConfig. Format:
            organizations/{organization}/locations/{location}/encryptionConfigs/{encryption_config}
            Global location is not supported.
          type: string
        updateTime:
          description: >-
            Output only. The time when the Encryption configuration was last
            updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1EncryptionConfigFailureDetails:
      description: Details of the failure if anything related to Cmek db fails.
      id: GoogleCloudDataplexV1EncryptionConfigFailureDetails
      properties:
        errorCode:
          description: Output only. The error code for the failure.
          enum:
            - UNKNOWN
            - INTERNAL_ERROR
            - REQUIRE_USER_ACTION
          enumDescriptions:
            - The error code is not specified
            - >-
              Error because of internal server error, will be retried
              automatically.
            - User action is required to resolve the error.
          readOnly: true
          type: string
        errorMessage:
          description: >-
            Output only. The error message will be shown to the user. Set only
            if the error code is REQUIRE_USER_ACTION.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1Entity:
      description: Represents tables and fileset metadata contained within a zone.
      id: GoogleCloudDataplexV1Entity
      properties:
        access:
          $ref: '#/components/schemas/GoogleCloudDataplexV1StorageAccess'
          description: >-
            Output only. Identifies the access mechanism to the entity. Not user
            settable.
          readOnly: true
        asset:
          description: >-
            Required. Immutable. The ID of the asset associated with the storage
            location containing the entity data. The entity must be with in the
            same zone with the asset.
          type: string
        catalogEntry:
          description: Output only. The name of the associated Data Catalog entry.
          readOnly: true
          type: string
        compatibility:
          $ref: '#/components/schemas/GoogleCloudDataplexV1EntityCompatibilityStatus'
          description: Output only. Metadata stores that the entity is compatible with.
          readOnly: true
        createTime:
          description: Output only. The time when the entity was created.
          format: google-datetime
          readOnly: true
          type: string
        dataPath:
          description: >-
            Required. Immutable. The storage path of the entity data. For Cloud
            Storage data, this is the fully-qualified path to the entity, such
            as gs://bucket/path/to/data. For BigQuery data, this is the name of
            the table resource, such as
            projects/project_id/datasets/dataset_id/tables/table_id.
          type: string
        dataPathPattern:
          description: >-
            Optional. The set of items within the data path constituting the
            data in the entity, represented as a glob path. Example:
            gs://bucket/path/to/data/**/*.csv.
          type: string
        description:
          description: >-
            Optional. User friendly longer description text. Must be shorter
            than or equal to 1024 characters.
          type: string
        displayName:
          description: >-
            Optional. Display name must be shorter than or equal to 256
            characters.
          type: string
        etag:
          description: >-
            Optional. The etag associated with the entity, which can be
            retrieved with a GetEntity request. Required for update and delete
            requests.
          type: string
        format:
          $ref: '#/components/schemas/GoogleCloudDataplexV1StorageFormat'
          description: >-
            Required. Identifies the storage format of the entity data. It does
            not apply to entities with data stored in BigQuery.
        id:
          description: >-
            Required. A user-provided entity ID. It is mutable, and will be used
            as the published table name. Specifying a new ID in an update entity
            request will override the existing value. The ID must contain only
            letters (a-z, A-Z), numbers (0-9), and underscores, and consist of
            256 or fewer characters.
          type: string
        name:
          description: >-
            Output only. The resource name of the entity, of the form:
            projects/{project_number}/locations/{location_id}/lakes/{lake_id}/zones/{zone_id}/entities/{id}.
          readOnly: true
          type: string
        schema:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Schema'
          description: >-
            Required. The description of the data structure and layout. The
            schema is not included in list responses. It is only included in
            SCHEMA and FULL entity views of a GetEntity response.
        system:
          description: >-
            Required. Immutable. Identifies the storage system of the entity
            data.
          enum:
            - STORAGE_SYSTEM_UNSPECIFIED
            - CLOUD_STORAGE
            - BIGQUERY
          enumDescriptions:
            - Storage system unspecified.
            - The entity data is contained within a Cloud Storage bucket.
            - The entity data is contained within a BigQuery dataset.
          type: string
        type:
          description: Required. Immutable. The type of entity.
          enum:
            - TYPE_UNSPECIFIED
            - TABLE
            - FILESET
          enumDescriptions:
            - Type unspecified.
            - Structured and semi-structured data.
            - Unstructured data.
          type: string
        uid:
          description: >-
            Output only. System generated unique ID for the Entity. This ID will
            be different if the Entity is deleted and re-created with the same
            name.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the entity was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1EntityCompatibilityStatus:
      description: Provides compatibility information for various metadata stores.
      id: GoogleCloudDataplexV1EntityCompatibilityStatus
      properties:
        bigquery:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1EntityCompatibilityStatusCompatibility
          description: Output only. Whether this entity is compatible with BigQuery.
          readOnly: true
        hiveMetastore:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1EntityCompatibilityStatusCompatibility
          description: Output only. Whether this entity is compatible with Hive Metastore.
          readOnly: true
      type: object
    GoogleCloudDataplexV1EntityCompatibilityStatusCompatibility:
      description: Provides compatibility information for a specific metadata store.
      id: GoogleCloudDataplexV1EntityCompatibilityStatusCompatibility
      properties:
        compatible:
          description: >-
            Output only. Whether the entity is compatible and can be represented
            in the metadata store.
          readOnly: true
          type: boolean
        reason:
          description: >-
            Output only. Provides additional detail if the entity is
            incompatible with the metadata store.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1Entry:
      description: >-
        An entry is a representation of a data resource that can be described by
        various metadata.
      id: GoogleCloudDataplexV1Entry
      properties:
        aspects:
          additionalProperties:
            $ref: '#/components/schemas/GoogleCloudDataplexV1Aspect'
          description: >-
            Optional. The aspects that are attached to the entry. Depending on
            how the aspect is attached to the entry, the format of the aspect
            key can be one of the following: If the aspect is attached directly
            to the entry: {project_id_or_number}.{location_id}.{aspect_type_id}
            If the aspect is attached to an entry's path:
            {project_id_or_number}.{location_id}.{aspect_type_id}@{path}
          type: object
        createTime:
          description: >-
            Output only. The time when the entry was created in Dataplex
            Universal Catalog.
          format: google-datetime
          readOnly: true
          type: string
        entrySource:
          $ref: '#/components/schemas/GoogleCloudDataplexV1EntrySource'
          description: >-
            Optional. Information related to the source system of the data
            resource that is represented by the entry.
        entryType:
          description: >-
            Required. Immutable. The relative resource name of the entry type
            that was used to create this entry, in the format
            projects/{project_id_or_number}/locations/{location_id}/entryTypes/{entry_type_id}.
          type: string
        fullyQualifiedName:
          description: >-
            Optional. A name for the entry that can be referenced by an external
            system. For more information, see Fully qualified names
            (https://cloud.google.com/data-catalog/docs/fully-qualified-names).
            The maximum size of the field is 4000 characters.
          type: string
        name:
          description: >-
            Identifier. The relative resource name of the entry, in the format
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}/entries/{entry_id}.
          type: string
        parentEntry:
          description: >-
            Optional. Immutable. The resource name of the parent entry, in the
            format
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}/entries/{entry_id}.
          type: string
        updateTime:
          description: >-
            Output only. The time when the entry was last updated in Dataplex
            Universal Catalog.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1EntryGroup:
      description: An Entry Group represents a logical grouping of one or more Entries.
      id: GoogleCloudDataplexV1EntryGroup
      properties:
        createTime:
          description: Output only. The time when the EntryGroup was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the EntryGroup.
          type: string
        displayName:
          description: Optional. User friendly display name.
          type: string
        etag:
          description: >-
            This checksum is computed by the service, and might be sent on
            update and delete requests to ensure the client has an up-to-date
            value before proceeding.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels for the EntryGroup.
          type: object
        name:
          description: >-
            Output only. The relative resource name of the EntryGroup, in the
            format
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}.
          readOnly: true
          type: string
        transferStatus:
          description: >-
            Output only. Denotes the transfer status of the Entry Group. It is
            unspecified for Entry Group created from Dataplex API.
          enum:
            - TRANSFER_STATUS_UNSPECIFIED
            - TRANSFER_STATUS_MIGRATED
            - TRANSFER_STATUS_TRANSFERRED
          enumDescriptions:
            - >-
              The default value. It is set for resources that were not subject
              for migration from Data Catalog service.
            - >-
              Indicates that a resource was migrated from Data Catalog service
              but it hasn't been transferred yet. In particular the resource
              cannot be updated from Dataplex API.
            - >-
              Indicates that a resource was transferred from Data Catalog
              service. The resource can only be updated from Dataplex API.
          readOnly: true
          type: string
        uid:
          description: >-
            Output only. System generated globally unique ID for the EntryGroup.
            If you delete and recreate the EntryGroup with the same name, this
            ID will be different.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the EntryGroup was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1EntryLink:
      description: EntryLink represents a link between two Entries.
      id: GoogleCloudDataplexV1EntryLink
      properties:
        aspects:
          additionalProperties:
            $ref: '#/components/schemas/GoogleCloudDataplexV1Aspect'
          description: >-
            Optional. The aspects that are attached to the entry link. The
            format of the aspect key has to be the following:
            {project_id_or_number}.{location_id}.{aspect_type_id} Currently,
            only a single aspect of a Dataplex-owned Aspect Type is allowed.
          type: object
        createTime:
          description: Output only. The time when the Entry Link was created.
          format: google-datetime
          readOnly: true
          type: string
        entryLinkType:
          description: >-
            Required. Immutable. Relative resource name of the Entry Link Type
            used to create this Entry Link. For example: Entry link between
            synonym terms in a glossary:
            projects/dataplex-types/locations/global/entryLinkTypes/synonym
            Entry link between related terms in a glossary:
            projects/dataplex-types/locations/global/entryLinkTypes/related
            Entry link between glossary terms and data assets:
            projects/dataplex-types/locations/global/entryLinkTypes/definition
          type: string
        entryReferences:
          description: >-
            Required. Immutable. Specifies the Entries referenced in the Entry
            Link. There should be exactly two entry references.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1EntryLinkEntryReference'
          type: array
        name:
          description: >-
            Output only. Immutable. Identifier. The relative resource name of
            the Entry Link, of the form:
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}/entryLinks/{entry_link_id}
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the Entry Link was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1EntryLinkEntryReference:
      description: Reference to the Entry that is linked through the Entry Link.
      id: GoogleCloudDataplexV1EntryLinkEntryReference
      properties:
        name:
          description: >-
            Required. Immutable. The relative resource name of the referenced
            Entry, of the form:
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}/entries/{entry_id}
          type: string
        path:
          description: >-
            Immutable. The path in the Entry that is referenced in the Entry
            Link. Empty path denotes that the Entry itself is referenced in the
            Entry Link.
          type: string
        type:
          description: Required. Immutable. The reference type of the Entry.
          enum:
            - UNSPECIFIED
            - SOURCE
            - TARGET
          enumDescriptions:
            - >-
              Unspecified reference type. Implies that the Entry is referenced
              in a non-directional Entry Link.
            - >-
              The Entry is referenced as the source of the directional Entry
              Link.
            - >-
              The Entry is referenced as the target of the directional Entry
              Link.
          type: string
      type: object
    GoogleCloudDataplexV1EntryLinkEvent:
      description: Payload associated with Entry related log events.
      id: GoogleCloudDataplexV1EntryLinkEvent
      properties:
        eventType:
          description: The type of the event.
          enum:
            - EVENT_TYPE_UNSPECIFIED
            - ENTRY_LINK_CREATE
            - ENTRY_LINK_DELETE
          enumDescriptions:
            - An unspecified event type.
            - EntryLink create event.
            - EntryLink delete event.
          type: string
        message:
          description: The log message.
          type: string
        resource:
          description: Name of the resource.
          type: string
      type: object
    GoogleCloudDataplexV1EntryLinkTypeEvent:
      description: Payload associated with EntryLinkType related log events.
      id: GoogleCloudDataplexV1EntryLinkTypeEvent
      properties:
        entryLinkTypeId:
          description: Name of the resource.
          type: string
        eventType:
          description: The type of the event.
          enum:
            - EVENT_TYPE_UNSPECIFIED
            - ENTRY_LINK_TYPE_CREATE
            - ENTRY_LINK_TYPE_UPDATE
            - ENTRY_LINK_TYPE_DELETE
          enumDescriptions:
            - An unspecified event type.
            - EntryLinkType create event.
            - EntryLinkType update event.
            - EntryLinkType delete event.
          type: string
        message:
          description: The log message.
          type: string
      type: object
    GoogleCloudDataplexV1EntrySource:
      description: >-
        Information related to the source system of the data resource that is
        represented by the entry.
      id: GoogleCloudDataplexV1EntrySource
      properties:
        ancestors:
          description: >-
            Immutable. The entries representing the ancestors of the data
            resource in the source system.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1EntrySourceAncestor'
          type: array
        createTime:
          description: The time when the resource was created in the source system.
          format: google-datetime
          type: string
        description:
          description: >-
            A description of the data resource. Maximum length is 2,000
            characters.
          type: string
        displayName:
          description: A user-friendly display name. Maximum length is 500 characters.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            User-defined labels. The maximum size of keys and values is 128
            characters each.
          type: object
        location:
          description: >-
            Output only. Location of the resource in the source system. You can
            search the entry by this location. By default, this should match the
            location of the entry group containing this entry. A different value
            allows capturing the source location for data external to Google
            Cloud.
          readOnly: true
          type: string
        platform:
          description: >-
            The platform containing the source system. Maximum length is 64
            characters.
          type: string
        resource:
          description: >-
            The name of the resource in the source system. Maximum length is
            4,000 characters.
          type: string
        system:
          description: The name of the source system. Maximum length is 64 characters.
          type: string
        updateTime:
          description: >-
            The time when the resource was last updated in the source system. If
            the entry exists in the system and its EntrySource has update_time
            populated, further updates to the EntrySource of the entry must
            provide incremental updates to its update_time.
          format: google-datetime
          type: string
      type: object
    GoogleCloudDataplexV1EntrySourceAncestor:
      description: >-
        Information about individual items in the hierarchy that is associated
        with the data resource.
      id: GoogleCloudDataplexV1EntrySourceAncestor
      properties:
        name:
          description: Optional. The name of the ancestor resource.
          type: string
        type:
          description: Optional. The type of the ancestor resource.
          type: string
      type: object
    GoogleCloudDataplexV1EntryType:
      description: Entry Type is a template for creating Entries.
      id: GoogleCloudDataplexV1EntryType
      properties:
        authorization:
          $ref: '#/components/schemas/GoogleCloudDataplexV1EntryTypeAuthorization'
          description: Immutable. Authorization defined for this type.
        createTime:
          description: Output only. The time when the EntryType was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the EntryType.
          type: string
        displayName:
          description: Optional. User friendly display name.
          type: string
        etag:
          description: >-
            Optional. This checksum is computed by the service, and might be
            sent on update and delete requests to ensure the client has an
            up-to-date value before proceeding.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels for the EntryType.
          type: object
        name:
          description: >-
            Output only. The relative resource name of the EntryType, of the
            form:
            projects/{project_number}/locations/{location_id}/entryTypes/{entry_type_id}.
          readOnly: true
          type: string
        platform:
          description: Optional. The platform that Entries of this type belongs to.
          type: string
        requiredAspects:
          description: AspectInfo for the entry type.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1EntryTypeAspectInfo'
          type: array
        system:
          description: >-
            Optional. The system that Entries of this type belongs to. Examples
            include CloudSQL, MariaDB etc
          type: string
        typeAliases:
          description: >-
            Optional. Indicates the classes this Entry Type belongs to, for
            example, TABLE, DATABASE, MODEL.
          items:
            type: string
          type: array
        uid:
          description: >-
            Output only. System generated globally unique ID for the EntryType.
            This ID will be different if the EntryType is deleted and re-created
            with the same name.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the EntryType was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
