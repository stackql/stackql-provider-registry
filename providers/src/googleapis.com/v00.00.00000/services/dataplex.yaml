    GoogleCloudDataplexV1LookupContextRequest:
      description: Lookup Context using permissions in the source system.
      id: GoogleCloudDataplexV1LookupContextRequest
      properties:
        options:
          additionalProperties:
            type: string
          description: >-
            Optional. Allows to configure the context.Supported options: format
            - The format of the context (one of yaml, xml, json, default is
            yaml). context_budget - If provided, the output will be
            intelligently truncated on a best-effort basis to contain
            approximately the desired amount of characters. There is no
            guarantee to achieve the specific amount. all_schema_fields - If set
            to true, all schema fields will be returned in the context
            (regardless of context_budget value). Otherwise, the list of schema
            fields is truncated. Default is false.
          type: object
        resources:
          description: >-
            Required. The entry names to look up the context for. The maximum
            number of resources for a request is limited to
            10.Examples:projects/{project}/locations/{location}/entryGroups/{entry_group}/entries/{entry}
          items:
            type: string
          type: array
      type: object
