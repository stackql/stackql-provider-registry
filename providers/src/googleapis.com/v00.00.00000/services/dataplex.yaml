    GoogleCloudDataplexV1MetadataFeed:
      description: MetadataFeed contains information related to the metadata feed.
      id: GoogleCloudDataplexV1MetadataFeed
      properties:
        createTime:
          description: Output only. The time when the feed was created.
          format: google-datetime
          readOnly: true
          type: string
        filters:
          $ref: '#/components/schemas/GoogleCloudDataplexV1MetadataFeedFilters'
          description: >-
            Optional. The filters of the metadata feed. Only the changes that
            match the filters are published.
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels.
          type: object
        name:
          description: >-
            Identifier. The resource name of the metadata feed, in the format
            projects/{project_id_or_number}/locations/{location_id}/metadataFeeds/{metadata_feed_id}.
          type: string
        pubsubTopic:
          description: >-
            Optional. The pubsub topic that you want the metadata feed messages
            to publish to. Please grant Dataplex service account the permission
            to publish messages to the topic. The service account is:
            service-{PROJECT_NUMBER}@gcp-sa-dataplex.iam.gserviceaccount.com.
          type: string
        scope:
          $ref: '#/components/schemas/GoogleCloudDataplexV1MetadataFeedScope'
          description: >-
            Required. The scope of the metadata feed. Only the in scope changes
            are published.
        uid:
          description: >-
            Output only. A system-generated, globally unique ID for the metadata
            job. If the metadata job is deleted and then re-created with the
            same name, this ID is different.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the feed was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1MetadataFeedFilters:
      description: >-
        Filters defines the type of changes that you want to listen to. You can
        have multiple entry type filters and multiple aspect type filters. All
        of the entry type filters are OR'ed together. All of the aspect type
        filters are OR'ed together. All of the entry type filters and aspect
        type filters are AND'ed together.
      id: GoogleCloudDataplexV1MetadataFeedFilters
      properties:
        aspectTypes:
          description: >-
            Optional. The aspect types that you want to listen to. Depending on
            how the aspect is attached to the entry, in the format:
            projects/{project_id_or_number}/locations/{location}/aspectTypes/{aspect_type_id}.
          items:
            type: string
          type: array
        changeTypes:
          description: >-
            Optional. The type of change that you want to listen to. If not
            specified, all changes are published.
          items:
            enum:
              - CHANGE_TYPE_UNSPECIFIED
              - CREATE
              - UPDATE
              - DELETE
            enumDescriptions:
              - Unspecified change type. Defaults to UNSPECIFIED.
              - The change is a create event.
              - The change is an update event.
              - The change is a delete event.
            type: string
          type: array
        entryTypes:
          description: >-
            Optional. The entry types that you want to listen to, specified as
            relative resource names in the format
            projects/{project_id_or_number}/locations/{location}/entryTypes/{entry_type_id}.
            Only entries that belong to the specified entry types are published.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1MetadataFeedScope:
      description: >-
        Scope defines the scope of the metadata feed. Scopes are exclusive. Only
        one of the scopes can be specified.
      id: GoogleCloudDataplexV1MetadataFeedScope
      properties:
        entryGroups:
          description: >-
            Optional. The entry groups whose entries you want to listen to. Must
            be in the format:
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}.
          items:
            type: string
          type: array
        organizationLevel:
          description: >-
            Optional. Whether the metadata feed is at the organization-level. If
            true, all changes happened to the entries in the same organization
            as the feed are published. If false, you must specify a list of
            projects or a list of entry groups whose entries you want to listen
            to.The default is false.
          type: boolean
        projects:
          description: >-
            Optional. The projects whose entries you want to listen to. Must be
            in the same organization as the feed. Must be in the format:
            projects/{project_id_or_number}.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1MetadataJob:
      description: A metadata job resource.
      id: GoogleCloudDataplexV1MetadataJob
      properties:
        createTime:
          description: Output only. The time when the metadata job was created.
          format: google-datetime
          readOnly: true
          type: string
        exportResult:
          $ref: '#/components/schemas/GoogleCloudDataplexV1MetadataJobExportJobResult'
          description: Output only. Export job result.
          readOnly: true
        exportSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1MetadataJobExportJobSpec'
          description: Export job specification.
        importResult:
          $ref: '#/components/schemas/GoogleCloudDataplexV1MetadataJobImportJobResult'
          description: Output only. Import job result.
          readOnly: true
        importSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1MetadataJobImportJobSpec'
          description: Import job specification.
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels.
          type: object
        name:
          description: >-
            Output only. Identifier. The name of the resource that the
            configuration is applied to, in the format
            projects/{project_number}/locations/{location_id}/metadataJobs/{metadata_job_id}.
          readOnly: true
          type: string
        status:
          $ref: '#/components/schemas/GoogleCloudDataplexV1MetadataJobStatus'
          description: Output only. Metadata job status.
          readOnly: true
        type:
          description: Required. Metadata job type.
          enum:
            - TYPE_UNSPECIFIED
            - IMPORT
            - EXPORT
          enumDescriptions:
            - Unspecified.
            - Import job.
            - Export job.
          type: string
        uid:
          description: >-
            Output only. A system-generated, globally unique ID for the metadata
            job. If the metadata job is deleted and then re-created with the
            same name, this ID is different.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the metadata job was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1MetadataJobExportJobResult:
      description: >-
        Summary results from a metadata export job. The results are a snapshot
        of the metadata at the time when the job was created. The exported
        entries are saved to a Cloud Storage bucket.
      id: GoogleCloudDataplexV1MetadataJobExportJobResult
      properties:
        errorMessage:
          description: Output only. The error message if the metadata export job failed.
          readOnly: true
          type: string
        exportedEntries:
          description: Output only. The number of entries that were exported.
          format: int64
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1MetadataJobExportJobSpec:
      description: Job specification for a metadata export job.
      id: GoogleCloudDataplexV1MetadataJobExportJobSpec
      properties:
        outputPath:
          description: >-
            Required. The root path of the Cloud Storage bucket to export the
            metadata to, in the format gs://{bucket}/. You can optionally
            specify a custom prefix after the bucket name, in the format
            gs://{bucket}/{prefix}/. The maximum length of the custom prefix is
            128 characters. Dataplex Universal Catalog constructs the object
            path for the exported files by using the bucket name and prefix that
            you provide, followed by a system-generated path.The bucket must be
            in the same VPC Service Controls perimeter as the job.
          type: string
        scope:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1MetadataJobExportJobSpecExportJobScope
          description: Required. The scope of the export job.
      type: object
    GoogleCloudDataplexV1MetadataJobExportJobSpecExportJobScope:
      description: The scope of the export job.
      id: GoogleCloudDataplexV1MetadataJobExportJobSpecExportJobScope
      properties:
        aspectTypes:
          description: >-
            The aspect types that are in scope for the export job, specified as
            relative resource names in the format
            projects/{project_id_or_number}/locations/{location}/aspectTypes/{aspect_type_id}.
            Only aspects that belong to the specified aspect types are affected
            by the job.
          items:
            type: string
          type: array
        entryGroups:
          description: >-
            The entry groups whose metadata you want to export, in the format
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}.
            Only the entries in the specified entry groups are exported.The
            entry groups must be in the same location and the same VPC Service
            Controls perimeter as the job.If you set the job scope to be a list
            of entry groups, then set the organization-level export flag to
            false and don't provide a list of projects.
          items:
            type: string
          type: array
        entryTypes:
          description: >-
            The entry types that are in scope for the export job, specified as
            relative resource names in the format
            projects/{project_id_or_number}/locations/{location}/entryTypes/{entry_type_id}.
            Only entries that belong to the specified entry types are affected
            by the job.
          items:
            type: string
          type: array
        organizationLevel:
          description: >-
            Whether the metadata export job is an organization-level export job.
            If true, the job exports the entries from the same organization and
            VPC Service Controls perimeter as the job. The project that the job
            belongs to determines the VPC Service Controls perimeter. If you set
            the job scope to be at the organization level, then don't provide a
            list of projects or entry groups. If false, you must specify a list
            of projects or a list of entry groups whose entries you want to
            export.The default is false.
          type: boolean
        projects:
          description: >-
            The projects whose metadata you want to export, in the format
            projects/{project_id_or_number}. Only the entries from the specified
            projects are exported.The projects must be in the same organization
            and VPC Service Controls perimeter as the job.If you set the job
            scope to be a list of projects, then set the organization-level
            export flag to false and don't provide a list of entry groups.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1MetadataJobImportJobResult:
      description: Results from a metadata import job.
      id: GoogleCloudDataplexV1MetadataJobImportJobResult
      properties:
        createdEntries:
          description: Output only. The total number of entries that were created.
          format: int64
          readOnly: true
          type: string
        createdEntryLinks:
          description: >-
            Output only. The total number of entry links that were successfully
            created.
          format: int64
          readOnly: true
          type: string
        deletedEntries:
          description: Output only. The total number of entries that were deleted.
          format: int64
          readOnly: true
          type: string
        deletedEntryLinks:
          description: >-
            Output only. The total number of entry links that were successfully
            deleted.
          format: int64
          readOnly: true
          type: string
        recreatedEntries:
          description: Output only. The total number of entries that were recreated.
          format: int64
          readOnly: true
          type: string
        unchangedEntries:
          description: Output only. The total number of entries that were unchanged.
          format: int64
          readOnly: true
          type: string
        unchangedEntryLinks:
          description: >-
            Output only. The total number of entry links that were left
            unchanged.
          format: int64
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the status was updated.
          format: google-datetime
          readOnly: true
          type: string
        updatedEntries:
          description: Output only. The total number of entries that were updated.
          format: int64
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1MetadataJobImportJobSpec:
      description: >-
        Job specification for a metadata import job.You can run the following
        kinds of metadata import jobs: Full sync of entries with incremental
        import of their aspects. Supported for custom entries. Incremental
        import of aspects only. Supported for aspects that belong to custom
        entries and system entries. For custom entries, you can modify both
        optional aspects and required aspects. For system entries, you can
        modify optional aspects.
      id: GoogleCloudDataplexV1MetadataJobImportJobSpec
      properties:
        aspectSyncMode:
          description: Required. The sync mode for aspects.
          enum:
            - SYNC_MODE_UNSPECIFIED
            - FULL
            - INCREMENTAL
            - NONE
          enumDescriptions:
            - Sync mode unspecified.
            - >-
              All resources in the job's scope are modified. If a resource
              exists in Dataplex Universal Catalog but isn't included in the
              metadata import file, the resource is deleted when you run the
              metadata job. Use this mode to perform a full sync of the set of
              entries in the job scope.This sync mode is supported for entries.
            - >-
              Only the resources that are explicitly included in the metadata
              import file are modified. Use this mode to modify a subset of
              resources while leaving unreferenced resources unchanged.This sync
              mode is supported for aspects.
            - >-
              If entry sync mode is NONE, then aspects are modified according to
              the aspect sync mode. Other metadata that belongs to entries in
              the job's scope isn't modified.This sync mode is supported for
              entries.
          type: string
        entrySyncMode:
          description: Required. The sync mode for entries.
          enum:
            - SYNC_MODE_UNSPECIFIED
            - FULL
            - INCREMENTAL
            - NONE
          enumDescriptions:
            - Sync mode unspecified.
            - >-
              All resources in the job's scope are modified. If a resource
              exists in Dataplex Universal Catalog but isn't included in the
              metadata import file, the resource is deleted when you run the
              metadata job. Use this mode to perform a full sync of the set of
              entries in the job scope.This sync mode is supported for entries.
            - >-
              Only the resources that are explicitly included in the metadata
              import file are modified. Use this mode to modify a subset of
              resources while leaving unreferenced resources unchanged.This sync
              mode is supported for aspects.
            - >-
              If entry sync mode is NONE, then aspects are modified according to
              the aspect sync mode. Other metadata that belongs to entries in
              the job's scope isn't modified.This sync mode is supported for
              entries.
          type: string
        logLevel:
          description: >-
            Optional. The level of logs to write to Cloud Logging for this
            job.Debug-level logs provide highly-detailed information for
            troubleshooting, but their increased verbosity could incur
            additional costs (https://cloud.google.com/stackdriver/pricing) that
            might not be merited for all jobs.If unspecified, defaults to INFO.
          enum:
            - LOG_LEVEL_UNSPECIFIED
            - DEBUG
            - INFO
          enumDescriptions:
            - Log level unspecified.
            - >-
              Debug-level logging. Captures detailed logs for each import item.
              Use debug-level logging to troubleshoot issues with specific
              import items. For example, use debug-level logging to identify
              resources that are missing from the job scope, entries or aspects
              that don't conform to the associated entry type or aspect type, or
              other misconfigurations with the metadata import file.Depending on
              the size of your metadata job and the number of logs that are
              generated, debug-level logging might incur additional costs
              (https://cloud.google.com/stackdriver/pricing).
            - >-
              Info-level logging. Captures logs at the overall job level.
              Includes aggregate logs about import items, but doesn't specify
              which import item has an error.
          type: string
        scope:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1MetadataJobImportJobSpecImportJobScope
          description: >-
            Required. A boundary on the scope of impact that the metadata import
            job can have.
        sourceCreateTime:
          description: >-
            Optional. The time when the process that created the metadata import
            files began.
          format: google-datetime
          type: string
        sourceStorageUri:
          description: >-
            Optional. The URI of a Cloud Storage bucket or folder (beginning
            with gs:// and ending with /) that contains the metadata import
            files for this job.A metadata import file defines the values to set
            for each of the entries and aspects in a metadata import job. For
            more information about how to create a metadata import file and the
            file requirements, see Metadata import file
            (https://cloud.google.com/dataplex/docs/import-metadata#metadata-import-file).You
            can provide multiple metadata import files in the same metadata job.
            The bucket or folder must contain at least one metadata import file,
            in JSON Lines format (either .json or .jsonl file extension).In FULL
            entry sync mode, don't save the metadata import file in a folder
            named SOURCE_STORAGE_URI/deletions/.Caution: If the metadata import
            file contains no data, all entries and aspects that belong to the
            job's scope are deleted.
          type: string
      type: object
    GoogleCloudDataplexV1MetadataJobImportJobSpecImportJobScope:
      description: A boundary on the scope of impact that the metadata import job can have.
      id: GoogleCloudDataplexV1MetadataJobImportJobSpecImportJobScope
      properties:
        aspectTypes:
          description: >-
            Optional. The aspect types that are in scope for the import job,
            specified as relative resource names in the format
            projects/{project_number_or_id}/locations/{location_id}/aspectTypes/{aspect_type_id}.
            The job modifies only the aspects that belong to these aspect
            types.This field is required when creating an aspect-only import
            job.If the metadata import file attempts to modify an aspect whose
            type isn't included in this list, the import job is halted before
            modifying any entries or aspects.The location of an aspect type must
            either match the location of the job, or the aspect type must be
            global.
          items:
            type: string
          type: array
        entryGroups:
          description: >-
            Required. The entry groups that are in scope for the import job,
            specified as relative resource names in the format
            projects/{project_number_or_id}/locations/{location_id}/entryGroups/{entry_group_id}.
            Only entries and aspects that belong to the specified entry groups
            are affected by the job.The entry groups and the job must be in the
            same location.
          items:
            type: string
          type: array
        entryLinkTypes:
          description: >-
            Optional. The entry link types that are in scope for the import job,
            specified as relative resource names in the format
            projects/{project_number_or_id}/locations/{location_id}/entryLinkTypes/{entry_link_type_id}.
            The job modifies only the entryLinks that belong to these entry link
            types.If the metadata import file attempts to create or delete an
            entry link whose entry link type isn't included in this list, the
            import job will skip those entry links.
          items:
            type: string
          type: array
        entryTypes:
          description: >-
            Required. The entry types that are in scope for the import job,
            specified as relative resource names in the format
            projects/{project_number_or_id}/locations/{location_id}/entryTypes/{entry_type_id}.
            The job modifies only the entries and aspects that belong to these
            entry types.If the metadata import file attempts to modify an entry
            whose type isn't included in this list, the import job is halted
            before modifying any entries or aspects.The location of an entry
            type must either match the location of the job, or the entry type
            must be global.
          items:
            type: string
          type: array
        glossaries:
          description: >-
            Optional. The glossaries that are in scope for the import job,
            specified as relative resource names in the format
            projects/{project_number_or_id}/locations/{location_id}/glossaries/{glossary_id}.While
            importing Business Glossary entries, the user must provide
            glossaries. While importing entries, the user does not have to
            provide glossaries. If the metadata import file attempts to modify
            Business Glossary entries whose glossary isn't included in this
            list, the import job will skip those entries.The location of a
            glossary must either match the location of the job, or the glossary
            must be global.
          items:
            type: string
          type: array
        referencedEntryScopes:
          description: >-
            Optional. Defines the scope of entries that can be referenced in the
            entry links.Currently, projects are supported as valid scopes.
            Format: projects/{project_number_or_id}If the metadata import file
            attempts to create an entry link which references an entry that is
            not in the scope, the import job will skip that entry link.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1MetadataJobStatus:
      description: Metadata job status.
      id: GoogleCloudDataplexV1MetadataJobStatus
      properties:
        completionPercent:
          description: Output only. Progress tracking.
          format: int32
          readOnly: true
          type: integer
        message:
          description: Output only. Message relating to the progression of a metadata job.
          readOnly: true
          type: string
        state:
          description: Output only. State of the metadata job.
          enum:
            - STATE_UNSPECIFIED
            - QUEUED
            - RUNNING
            - CANCELING
            - CANCELED
            - SUCCEEDED
            - FAILED
            - SUCCEEDED_WITH_ERRORS
          enumDescriptions:
            - State unspecified.
            - The job is queued.
            - The job is running.
            - The job is being canceled.
            - The job is canceled.
            - The job succeeded.
            - The job failed.
            - The job completed with some errors.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the status was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1ModifyEntryRequest:
      description: Modify Entry request using permissions in the source system.
      id: GoogleCloudDataplexV1ModifyEntryRequest
      properties:
        aspectKeys:
          description: >-
            Optional. The aspect keys which the service should modify. It
            supports the following syntaxes: - matches an aspect of the given
            type and empty path. @path - matches an aspect of the given type and
            specified path. For example, to attach an aspect to a field that is
            specified by the schema aspect, the path should have the format
            Schema.. @* - matches aspects of the given type for all paths.
            *@path - matches aspects of all types on the given path.The service
            will not remove existing aspects matching the syntax unless
            delete_missing_aspects is set to true.If this field is left empty,
            the service treats it as specifying exactly those Aspects present in
            the request.
          items:
            type: string
          type: array
        deleteMissingAspects:
          description: >-
            Optional. If set to true, any aspects not specified in the request
            will be deleted. The default is false.
          type: boolean
        entry:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Entry'
          description: Required. The entry to modify.
        updateMask:
          description: >-
            Optional. Mask of fields to update. To update Aspects, the
            update_mask must contain the value "aspects".If the update_mask is
            empty, the service will update all modifiable fields present in the
            request.
          format: google-fieldmask
          type: string
      type: object
    GoogleCloudDataplexV1OperationMetadata:
      description: Represents the metadata of a long-running operation.
      id: GoogleCloudDataplexV1OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have successfully been cancelled
            have Operation.error value with a google.rpc.Status.code of 1,
            corresponding to Code.CANCELLED.
          readOnly: true
          type: boolean
        statusMessage:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1Partition:
      description: Represents partition metadata contained within entity instances.
      id: GoogleCloudDataplexV1Partition
      properties:
        etag:
          deprecated: true
          description: Optional. The etag for this partition.
          type: string
        location:
          description: >-
            Required. Immutable. The location of the entity data within the
            partition, for example,
            gs://bucket/path/to/entity/key1=value1/key2=value2. Or
            projects//datasets//tables/
          type: string
        name:
          description: >-
            Output only. Partition values used in the HTTP URL must be double
            encoded. For example, url_encode(url_encode(value)) can be used to
            encode "US:CA/CA#Sunnyvale so that the request URL ends with
            "/partitions/US%253ACA/CA%2523Sunnyvale". The name field in the
            response retains the encoded format.
          readOnly: true
          type: string
        values:
          description: >-
            Required. Immutable. The set of values representing the partition,
            which correspond to the partition schema defined in the parent
            entity.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1RejectChangeRequestRequest:
      description: Request message for RejectChangeRequest.
      id: GoogleCloudDataplexV1RejectChangeRequestRequest
      properties:
        comment:
          description: Optional. The reason for rejecting the ChangeRequest.
          type: string
        etag:
          description: Optional. The etag of the ChangeRequest.
          type: string
      type: object
    GoogleCloudDataplexV1RequestDataProductAccessRequest:
      description: Message for requesting access to a Data Product.
      id: GoogleCloudDataplexV1RequestDataProductAccessRequest
      properties:
        changeRequest:
          $ref: '#/components/schemas/GoogleCloudDataplexV1ChangeRequest'
          description: Required. The change request for the data product access request.
        validateOnly:
          description: >-
            Optional. Validates the request without actually creating the access
            change request. Defaults to false.
          type: boolean
      type: object
    GoogleCloudDataplexV1RequestDataProductAccessResponse:
      description: Response message for requesting access to a Data Product.
      id: GoogleCloudDataplexV1RequestDataProductAccessResponse
      properties:
        changeRequestName:
          description: >-
            The resource name of the created ChangeRequest. Format:
            projects/{project_number}/locations/{location_id}/changeRequests/{change_request_id}
          type: string
      type: object
    GoogleCloudDataplexV1ResourceAccessSpec:
      description: >-
        ResourceAccessSpec holds the access control configuration to be enforced
        on the resources, for example, Cloud Storage bucket, BigQuery dataset,
        BigQuery table.
      id: GoogleCloudDataplexV1ResourceAccessSpec
      properties:
        owners:
          description: >-
            Optional. The set of principals to be granted owner role on the
            resource.
          items:
            type: string
          type: array
        readers:
          description: >-
            Optional. The format of strings follows the pattern followed by IAM
            in the bindings. user:{email}, serviceAccount:{email} group:{email}.
            The set of principals to be granted reader role on the resource.
          items:
            type: string
          type: array
        writers:
          description: >-
            Optional. The set of principals to be granted writer role on the
            resource.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1RunDataScanRequest:
      description: Run DataScan Request
      id: GoogleCloudDataplexV1RunDataScanRequest
      properties: {}
      type: object
    GoogleCloudDataplexV1RunDataScanResponse:
      description: Run DataScan Response.
      id: GoogleCloudDataplexV1RunDataScanResponse
      properties:
        job:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataScanJob'
          description: DataScanJob created by RunDataScan request.
      type: object
    GoogleCloudDataplexV1RunTaskRequest:
      id: GoogleCloudDataplexV1RunTaskRequest
      properties:
        args:
          additionalProperties:
            type: string
          description: >-
            Optional. Execution spec arguments. If the map is left empty, the
            task will run with existing execution spec args from task
            definition. If the map contains an entry with a new key, the same
            will be added to existing set of args. If the map contains an entry
            with an existing arg key in task definition, the task will run with
            new arg value for that entry. Clearing an existing arg will require
            arg value to be explicitly set to a hyphen "-". The arg value cannot
            be empty.
          type: object
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. User-defined labels for the task. If the map is left
            empty, the task will run with existing labels from task definition.
            If the map contains an entry with a new key, the same will be added
            to existing set of labels. If the map contains an entry with an
            existing label key in task definition, the task will run with new
            label value for that entry. Clearing an existing label will require
            label value to be explicitly set to a hyphen "-". The label value
            cannot be empty.
          type: object
      type: object
    GoogleCloudDataplexV1RunTaskResponse:
      id: GoogleCloudDataplexV1RunTaskResponse
      properties:
        job:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Job'
          description: Jobs created by RunTask API.
      type: object
    GoogleCloudDataplexV1ScannedData:
      description: The data scanned during processing (e.g. in incremental DataScan)
      id: GoogleCloudDataplexV1ScannedData
      properties:
        incrementalField:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1ScannedDataIncrementalField
          description: The range denoted by values of an incremental field
      type: object
    GoogleCloudDataplexV1ScannedDataIncrementalField:
      description: A data range denoted by a pair of start/end values of a field.
      id: GoogleCloudDataplexV1ScannedDataIncrementalField
      properties:
        end:
          description: Output only. Value that marks the end of the range.
          readOnly: true
          type: string
        field:
          description: >-
            Output only. The field that contains values which monotonically
            increases over time (e.g. a timestamp column).
          readOnly: true
          type: string
        start:
          description: Output only. Value that marks the start of the range.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1Schema:
      description: Schema information describing the structure and layout of the data.
      id: GoogleCloudDataplexV1Schema
      properties:
        fields:
          description: >-
            Optional. The sequence of fields describing data in table entities.
            Note: BigQuery SchemaFields are immutable.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1SchemaSchemaField'
          type: array
        partitionFields:
          description: >-
            Optional. The sequence of fields describing the partition structure
            in entities. If this field is empty, there are no partitions within
            the data.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1SchemaPartitionField'
          type: array
        partitionStyle:
          description: >-
            Optional. The structure of paths containing partition data within
            the entity.
          enum:
            - PARTITION_STYLE_UNSPECIFIED
            - HIVE_COMPATIBLE
          enumDescriptions:
            - PartitionStyle unspecified
            - >-
              Partitions are hive-compatible. Examples:
              gs://bucket/path/to/table/dt=2019-10-31/lang=en,
              gs://bucket/path/to/table/dt=2019-10-31/lang=en/late.
          type: string
        userManaged:
          description: >-
            Required. Set to true if user-managed or false if managed by
            Dataplex Universal Catalog. The default is false (managed by
            Dataplex Universal Catalog). Set to falseto enable Dataplex
            Universal Catalog discovery to update the schema. including new data
            discovery, schema inference, and schema evolution. Users retain the
            ability to input and edit the schema. Dataplex Universal Catalog
            treats schema input by the user as though produced by a previous
            Dataplex Universal Catalog discovery operation, and it will evolve
            the schema and take action based on that treatment. Set to true to
            fully manage the entity schema. This setting guarantees that
            Dataplex Universal Catalog will not change schema fields.
          type: boolean
      type: object
    GoogleCloudDataplexV1SchemaPartitionField:
      description: >-
        Represents a key field within the entity's partition structure. You
        could have up to 20 partition fields, but only the first 10 partitions
        have the filtering ability due to performance consideration. Note:
        Partition fields are immutable.
      id: GoogleCloudDataplexV1SchemaPartitionField
      properties:
        name:
          description: >-
            Required. Partition field name must consist of letters, numbers, and
            underscores only, with a maximum of length of 256 characters, and
            must begin with a letter or underscore..
          type: string
        type:
          description: Required. Immutable. The type of field.
          enum:
            - TYPE_UNSPECIFIED
            - BOOLEAN
            - BYTE
            - INT16
            - INT32
            - INT64
            - FLOAT
            - DOUBLE
            - DECIMAL
            - STRING
            - BINARY
            - TIMESTAMP
            - DATE
            - TIME
            - RECORD
            - 'NULL'
          enumDescriptions:
            - SchemaType unspecified.
            - Boolean field.
            - Single byte numeric field.
            - 16-bit numeric field.
            - 32-bit numeric field.
            - 64-bit numeric field.
            - Floating point numeric field.
            - Double precision numeric field.
            - Real value numeric field.
            - Sequence of characters field.
            - Sequence of bytes field.
            - Date and time field.
            - Date field.
            - Time field.
            - >-
              Structured field. Nested fields that define the structure of the
              map. If all nested fields are nullable, this field represents a
              union.
            - Null field that does not have values.
          type: string
      type: object
    GoogleCloudDataplexV1SchemaSchemaField:
      description: Represents a column field within a table schema.
      id: GoogleCloudDataplexV1SchemaSchemaField
      properties:
        description:
          description: >-
            Optional. User friendly field description. Must be less than or
            equal to 1024 characters.
          type: string
        fields:
          description: Optional. Any nested field for complex types.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1SchemaSchemaField'
          type: array
        mode:
          description: Required. Additional field semantics.
          enum:
            - MODE_UNSPECIFIED
            - REQUIRED
            - NULLABLE
            - REPEATED
          enumDescriptions:
            - Mode unspecified.
            - The field has required semantics.
            - The field has optional semantics, and may be null.
            - >-
              The field has repeated (0 or more) semantics, and is a list of
              values.
          type: string
        name:
          description: >-
            Required. The name of the field. Must contain only letters, numbers
            and underscores, with a maximum length of 767 characters, and must
            begin with a letter or underscore.
          type: string
        type:
          description: Required. The type of field.
          enum:
            - TYPE_UNSPECIFIED
            - BOOLEAN
            - BYTE
            - INT16
            - INT32
            - INT64
            - FLOAT
            - DOUBLE
            - DECIMAL
            - STRING
            - BINARY
            - TIMESTAMP
            - DATE
            - TIME
            - RECORD
            - 'NULL'
          enumDescriptions:
            - SchemaType unspecified.
            - Boolean field.
            - Single byte numeric field.
            - 16-bit numeric field.
            - 32-bit numeric field.
            - 64-bit numeric field.
            - Floating point numeric field.
            - Double precision numeric field.
            - Real value numeric field.
            - Sequence of characters field.
            - Sequence of bytes field.
            - Date and time field.
            - Date field.
            - Time field.
            - >-
              Structured field. Nested fields that define the structure of the
              map. If all nested fields are nullable, this field represents a
              union.
            - Null field that does not have values.
          type: string
      type: object
    GoogleCloudDataplexV1SearchEntriesResponse:
      id: GoogleCloudDataplexV1SearchEntriesResponse
      properties:
        nextPageToken:
          description: >-
            Token to retrieve the next page of results, or empty if there are no
            more results in the list.
          type: string
        results:
          description: The results matching the search query.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1SearchEntriesResult'
          type: array
        totalSize:
          description: >-
            The estimated total number of matching entries. This number isn't
            guaranteed to be accurate.
          format: int32
          type: integer
        unreachable:
          description: >-
            Locations that the service couldn't reach. Search results don't
            include data from these locations.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1SearchEntriesResult:
      description: A single result of a SearchEntries request.
      id: GoogleCloudDataplexV1SearchEntriesResult
      properties:
        dataplexEntry:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Entry'
        linkedResource:
          deprecated: true
          description: Linked resource name.
          type: string
        snippets:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1SearchEntriesResultSnippets
          deprecated: true
          description: Snippets.
      type: object
    GoogleCloudDataplexV1SearchEntriesResultSnippets:
      deprecated: true
      description: >-
        Snippets for the entry, contains HTML-style highlighting for matched
        tokens, will be used in UI.
      id: GoogleCloudDataplexV1SearchEntriesResultSnippets
      properties:
        dataplexEntry:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Entry'
          deprecated: true
          description: Entry
      type: object
    GoogleCloudDataplexV1SessionEvent:
      description: >-
        These messages contain information about sessions within an environment.
        The monitored resource is 'Environment'.
      id: GoogleCloudDataplexV1SessionEvent
      properties:
        eventSucceeded:
          description: The status of the event.
          type: boolean
        fastStartupEnabled:
          description: >-
            If the session is associated with an environment with fast startup
            enabled, and was created before being assigned to a user.
          type: boolean
        message:
          description: The log message.
          type: string
        query:
          $ref: '#/components/schemas/GoogleCloudDataplexV1SessionEventQueryDetail'
          description: The execution details of the query.
        sessionId:
          description: Unique identifier for the session.
          type: string
        type:
          description: The type of the event.
          enum:
            - EVENT_TYPE_UNSPECIFIED
            - START
            - STOP
            - QUERY
            - CREATE
          enumDescriptions:
            - An unspecified event type.
            - Event when the session is assigned to a user.
            - Event for stop of a session.
            - Query events in the session.
            - >-
              Event for creation of a cluster. It is not yet assigned to a user.
              This comes before START in the sequence
          type: string
        unassignedDuration:
          description: >-
            The idle duration of a warm pooled session before it is assigned to
            user.
          format: google-duration
          type: string
        userId:
          description: >-
            The information about the user that created the session. It will be
            the email address of the user.
          type: string
      type: object
    GoogleCloudDataplexV1SessionEventQueryDetail:
      description: Execution details of the query.
      id: GoogleCloudDataplexV1SessionEventQueryDetail
      properties:
        dataProcessedBytes:
          description: The data processed by the query.
          format: int64
          type: string
        duration:
          description: Time taken for execution of the query.
          format: google-duration
          type: string
        engine:
          description: Query Execution engine.
          enum:
            - ENGINE_UNSPECIFIED
            - SPARK_SQL
            - BIGQUERY
          enumDescriptions:
            - An unspecified Engine type.
            - Spark-sql engine is specified in Query.
            - BigQuery engine is specified in Query.
          type: string
        queryId:
          description: The unique Query id identifying the query.
          type: string
        queryText:
          description: The query text executed.
          type: string
        resultSizeBytes:
          description: The size of results the query produced.
          format: int64
          type: string
      type: object
    GoogleCloudDataplexV1StorageAccess:
      description: Describes the access mechanism of the data within its storage location.
      id: GoogleCloudDataplexV1StorageAccess
      properties:
        read:
          description: >-
            Output only. Describes the read access mechanism of the data. Not
            user settable.
          enum:
            - ACCESS_MODE_UNSPECIFIED
            - DIRECT
            - MANAGED
          enumDescriptions:
            - Access mode unspecified.
            - Default. Data is accessed directly using storage APIs.
            - Data is accessed through a managed interface using BigQuery APIs.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1StorageFormat:
      description: Describes the format of the data within its storage location.
      id: GoogleCloudDataplexV1StorageFormat
      properties:
        compressionFormat:
          description: >-
            Optional. The compression type associated with the stored data. If
            unspecified, the data is uncompressed.
          enum:
            - COMPRESSION_FORMAT_UNSPECIFIED
            - GZIP
            - BZIP2
          enumDescriptions:
            - CompressionFormat unspecified. Implies uncompressed data.
            - GZip compressed set of files.
            - BZip2 compressed set of files.
          type: string
        csv:
          $ref: '#/components/schemas/GoogleCloudDataplexV1StorageFormatCsvOptions'
          description: Optional. Additional information about CSV formatted data.
        format:
          description: >-
            Output only. The data format associated with the stored data, which
            represents content type values. The value is inferred from mime
            type.
          enum:
            - FORMAT_UNSPECIFIED
            - PARQUET
            - AVRO
            - ORC
            - CSV
            - JSON
            - IMAGE
            - AUDIO
            - VIDEO
            - TEXT
            - TFRECORD
            - OTHER
            - UNKNOWN
          enumDescriptions:
            - Format unspecified.
            - Parquet-formatted structured data.
            - Avro-formatted structured data.
            - Orc-formatted structured data.
            - Csv-formatted semi-structured data.
            - Json-formatted semi-structured data.
            - Image data formats (such as jpg and png).
            - Audio data formats (such as mp3, and wav).
            - Video data formats (such as mp4 and mpg).
            - Textual data formats (such as txt and xml).
            - TensorFlow record format.
            - Data that doesn't match a specific format.
            - Data of an unknown format.
          readOnly: true
          type: string
        iceberg:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1StorageFormatIcebergOptions
          description: Optional. Additional information about iceberg tables.
        json:
          $ref: '#/components/schemas/GoogleCloudDataplexV1StorageFormatJsonOptions'
          description: Optional. Additional information about CSV formatted data.
        mimeType:
          description: >-
            Required. The mime type descriptor for the data. Must match the
            pattern {type}/{subtype}. Supported values: application/x-parquet
            application/x-avro application/x-orc application/x-tfrecord
            application/x-parquet+iceberg application/x-avro+iceberg
            application/x-orc+iceberg application/json application/{subtypes}
            text/csv text/ image/{image subtype} video/{video subtype}
            audio/{audio subtype}
          type: string
      type: object
    GoogleCloudDataplexV1StorageFormatCsvOptions:
      description: Describes CSV and similar semi-structured data formats.
      id: GoogleCloudDataplexV1StorageFormatCsvOptions
      properties:
        delimiter:
          description: Optional. The delimiter used to separate values. Defaults to ','.
          type: string
        encoding:
          description: >-
            Optional. The character encoding of the data. Accepts "US-ASCII",
            "UTF-8", and "ISO-8859-1". Defaults to UTF-8 if unspecified.
          type: string
        headerRows:
          description: >-
            Optional. The number of rows to interpret as header rows that should
            be skipped when reading data rows. Defaults to 0.
          format: int32
          type: integer
        quote:
          description: >-
            Optional. The character used to quote column values. Accepts '"'
            (double quotation mark) or ''' (single quotation mark). Defaults to
            '"' (double quotation mark) if unspecified.
          type: string
      type: object
    GoogleCloudDataplexV1StorageFormatIcebergOptions:
      description: Describes Iceberg data format.
      id: GoogleCloudDataplexV1StorageFormatIcebergOptions
      properties:
        metadataLocation:
          description: >-
            Optional. The location of where the iceberg metadata is present,
            must be within the table path
          type: string
      type: object
    GoogleCloudDataplexV1StorageFormatJsonOptions:
      description: Describes JSON data format.
      id: GoogleCloudDataplexV1StorageFormatJsonOptions
      properties:
        encoding:
          description: >-
            Optional. The character encoding of the data. Accepts "US-ASCII",
            "UTF-8" and "ISO-8859-1". Defaults to UTF-8 if not specified.
          type: string
      type: object
    GoogleCloudDataplexV1Task:
      description: A task represents a user-visible job.
      id: GoogleCloudDataplexV1Task
      properties:
        createTime:
          description: Output only. The time when the task was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the task.
          type: string
        displayName:
          description: Optional. User friendly display name.
          type: string
        executionSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TaskExecutionSpec'
          description: Required. Spec related to how a task is executed.
        executionStatus:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TaskExecutionStatus'
          description: Output only. Status of the latest task executions.
          readOnly: true
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels for the task.
          type: object
        name:
          description: >-
            Output only. The relative resource name of the task, of the form:
            projects/{project_number}/locations/{location_id}/lakes/{lake_id}/
            tasks/{task_id}.
          readOnly: true
          type: string
        notebook:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TaskNotebookTaskConfig'
          description: Config related to running scheduled Notebooks.
        spark:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TaskSparkTaskConfig'
          description: Config related to running custom Spark tasks.
        state:
          description: Output only. Current state of the task.
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - CREATING
            - DELETING
            - ACTION_REQUIRED
          enumDescriptions:
            - State is not specified.
            - Resource is active, i.e., ready to use.
            - Resource is under creation.
            - Resource is under deletion.
            - Resource is active but has unresolved actions.
          readOnly: true
          type: string
        triggerSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TaskTriggerSpec'
          description: >-
            Required. Spec related to how often and when a task should be
            triggered.
        uid:
          description: >-
            Output only. System generated globally unique ID for the task. This
            ID will be different if the task is deleted and re-created with the
            same name.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the task was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1TaskExecutionSpec:
      description: Execution related settings, like retry and service_account.
      id: GoogleCloudDataplexV1TaskExecutionSpec
      properties:
        args:
          additionalProperties:
            type: string
          description: >-
            Optional. The arguments to pass to the task. The args can use
            placeholders of the format ${placeholder} as part of key/value
            string. These will be interpolated before passing the args to the
            driver. Currently supported placeholders: - ${task_id} - ${job_time}
            To pass positional args, set the key as TASK_ARGS. The value should
            be a comma-separated string of all the positional arguments. To use
            a delimiter other than comma, refer to
            https://cloud.google.com/sdk/gcloud/reference/topic/escaping. In
            case of other keys being present in the args, then TASK_ARGS will be
            passed as the last argument.
          type: object
        kmsKey:
          description: >-
            Optional. The Cloud KMS key to use for encryption, of the form:
            projects/{project_number}/locations/{location_id}/keyRings/{key-ring-name}/cryptoKeys/{key-name}.
          type: string
        maxJobExecutionLifetime:
          description: >-
            Optional. The maximum duration after which the job execution is
            expired.
          format: google-duration
          type: string
        project:
          description: >-
            Optional. The project in which jobs are run. By default, the project
            containing the Lake is used. If a project is provided, the
            ExecutionSpec.service_account must belong to this project.
          type: string
        serviceAccount:
          description: >-
            Required. Service account to use to execute a task. If not provided,
            the default Compute service account for the project is used.
          type: string
      type: object
    GoogleCloudDataplexV1TaskExecutionStatus:
      description: Status of the task execution (e.g. Jobs).
      id: GoogleCloudDataplexV1TaskExecutionStatus
      properties:
        latestJob:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Job'
          description: Output only. latest job execution
          readOnly: true
        updateTime:
          description: Output only. Last update time of the status.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1TaskInfrastructureSpec:
      description: Configuration for the underlying infrastructure used to run workloads.
      id: GoogleCloudDataplexV1TaskInfrastructureSpec
      properties:
        batch:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1TaskInfrastructureSpecBatchComputeResources
          description: Compute resources needed for a Task when using Dataproc Serverless.
        containerImage:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1TaskInfrastructureSpecContainerImageRuntime
          description: Container Image Runtime Configuration.
        vpcNetwork:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1TaskInfrastructureSpecVpcNetwork
          description: Vpc network.
      type: object
    GoogleCloudDataplexV1TaskInfrastructureSpecBatchComputeResources:
      description: Batch compute resources associated with the task.
      id: GoogleCloudDataplexV1TaskInfrastructureSpecBatchComputeResources
      properties:
        executorsCount:
          description: >-
            Optional. Total number of job executors. Executor Count should be
            between 2 and 100. Default=2
          format: int32
          type: integer
        maxExecutorsCount:
          description: >-
            Optional. Max configurable executors. If max_executors_count >
            executors_count, then auto-scaling is enabled. Max Executor Count
            should be between 2 and 1000. Default=1000
          format: int32
          type: integer
      type: object
    GoogleCloudDataplexV1TaskInfrastructureSpecContainerImageRuntime:
      description: Container Image Runtime Configuration used with Batch execution.
      id: GoogleCloudDataplexV1TaskInfrastructureSpecContainerImageRuntime
      properties:
        image:
          description: Optional. Container image to use.
          type: string
        javaJars:
          description: >-
            Optional. A list of Java JARS to add to the classpath. Valid input
            includes Cloud Storage URIs to Jar binaries. For example,
            gs://bucket-name/my/path/to/file.jar
          items:
            type: string
          type: array
        properties:
          additionalProperties:
            type: string
          description: >-
            Optional. Override to common configuration of open source components
            installed on the Dataproc cluster. The properties to set on daemon
            config files. Property keys are specified in prefix:property format,
            for example core:hadoop.tmp.dir. For more information, see Cluster
            properties
            (https://cloud.google.com/dataproc/docs/concepts/cluster-properties).
          type: object
        pythonPackages:
          description: >-
            Optional. A list of python packages to be installed. Valid formats
            include Cloud Storage URI to a PIP installable library. For example,
            gs://bucket-name/my/path/to/lib.tar.gz
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1TaskInfrastructureSpecVpcNetwork:
      description: Cloud VPC Network used to run the infrastructure.
      id: GoogleCloudDataplexV1TaskInfrastructureSpecVpcNetwork
      properties:
        network:
          description: >-
            Optional. The Cloud VPC network in which the job is run. By default,
            the Cloud VPC network named Default within the project is used.
          type: string
        networkTags:
          description: Optional. List of network tags to apply to the job.
          items:
            type: string
          type: array
        subNetwork:
          description: Optional. The Cloud VPC sub-network in which the job is run.
          type: string
      type: object
    GoogleCloudDataplexV1TaskNotebookTaskConfig:
      description: Config for running scheduled notebooks.
      id: GoogleCloudDataplexV1TaskNotebookTaskConfig
      properties:
        archiveUris:
          description: >-
            Optional. Cloud Storage URIs of archives to be extracted into the
            working directory of each executor. Supported file types: .jar,
            .tar, .tar.gz, .tgz, and .zip.
          items:
            type: string
          type: array
        fileUris:
          description: >-
            Optional. Cloud Storage URIs of files to be placed in the working
            directory of each executor.
          items:
            type: string
          type: array
        infrastructureSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TaskInfrastructureSpec'
          description: Optional. Infrastructure specification for the execution.
        notebook:
          description: >-
            Required. Path to input notebook. This can be the Cloud Storage URI
            of the notebook file or the path to a Notebook Content. The
            execution args are accessible as environment variables
            (TASK_key=value).
          type: string
      type: object
    GoogleCloudDataplexV1TaskSparkTaskConfig:
      description: User-specified config for running a Spark task.
      id: GoogleCloudDataplexV1TaskSparkTaskConfig
      properties:
        archiveUris:
          description: >-
            Optional. Cloud Storage URIs of archives to be extracted into the
            working directory of each executor. Supported file types: .jar,
            .tar, .tar.gz, .tgz, and .zip.
          items:
            type: string
          type: array
        fileUris:
          description: >-
            Optional. Cloud Storage URIs of files to be placed in the working
            directory of each executor.
          items:
            type: string
          type: array
        infrastructureSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TaskInfrastructureSpec'
          description: Optional. Infrastructure specification for the execution.
        mainClass:
          description: >-
            The name of the driver's main class. The jar file that contains the
            class must be in the default CLASSPATH or specified in
            jar_file_uris. The execution args are passed in as a sequence of
            named process arguments (--key=value).
          type: string
        mainJarFileUri:
          description: >-
            The Cloud Storage URI of the jar file that contains the main class.
            The execution args are passed in as a sequence of named process
            arguments (--key=value).
          type: string
        pythonScriptFile:
          description: >-
            The Gcloud Storage URI of the main Python file to use as the driver.
            Must be a .py file. The execution args are passed in as a sequence
            of named process arguments (--key=value).
          type: string
        sqlScript:
          description: >-
            The query text. The execution args are used to declare a set of
            script variables (set key="value";).
          type: string
        sqlScriptFile:
          description: >-
            A reference to a query file. This should be the Cloud Storage URI of
            the query file. The execution args are used to declare a set of
            script variables (set key="value";).
          type: string
      type: object
    GoogleCloudDataplexV1TaskTriggerSpec:
      description: Task scheduling and trigger settings.
      id: GoogleCloudDataplexV1TaskTriggerSpec
      properties:
        disabled:
          description: >-
            Optional. Prevent the task from executing. This does not cancel
            already running tasks. It is intended to temporarily disable
            RECURRING tasks.
          type: boolean
        maxRetries:
          description: >-
            Optional. Number of retry attempts before aborting. Set to zero to
            never attempt to retry a failed task.
          format: int32
          type: integer
        schedule:
          description: >-
            Optional. Cron schedule (https://en.wikipedia.org/wiki/Cron) for
            running tasks periodically. To explicitly set a timezone to the cron
            tab, apply a prefix in the cron tab: "CRON_TZ=${IANA_TIME_ZONE}" or
            "TZ=${IANA_TIME_ZONE}". The ${IANA_TIME_ZONE} may only be a valid
            string from IANA time zone database. For example,
            CRON_TZ=America/New_York 1 * * * *, or TZ=America/New_York 1 * * *
            *. This field is required for RECURRING tasks.
          type: string
        startTime:
          description: >-
            Optional. The first run of the task will be after this time. If not
            specified, the task will run shortly after being submitted if
            ON_DEMAND and based on the schedule if RECURRING.
          format: google-datetime
          type: string
        type:
          description: Required. Immutable. Trigger type of the user-specified Task.
          enum:
            - TYPE_UNSPECIFIED
            - ON_DEMAND
            - RECURRING
          enumDescriptions:
            - Unspecified trigger type.
            - The task runs one-time shortly after Task Creation.
            - The task is scheduled to run periodically.
          type: string
      type: object
    GoogleCloudDataplexV1Trigger:
      description: DataScan scheduling and trigger settings.
      id: GoogleCloudDataplexV1Trigger
      properties:
        onDemand:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TriggerOnDemand'
          description: The scan runs once via RunDataScan API.
        oneTime:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TriggerOneTime'
          description: >-
            The scan runs once, and does not create an associated ScanJob child
            resource.
        schedule:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TriggerSchedule'
          description: The scan is scheduled to run periodically.
      type: object
    GoogleCloudDataplexV1TriggerOnDemand:
      description: The scan runs once via RunDataScan API.
      id: GoogleCloudDataplexV1TriggerOnDemand
      properties: {}
      type: object
    GoogleCloudDataplexV1TriggerOneTime:
      description: The scan runs once using create API.
      id: GoogleCloudDataplexV1TriggerOneTime
      properties:
        ttlAfterScanCompletion:
          description: >-
            Optional. Time to live for OneTime scans. default value is 24 hours,
            minimum value is 0 seconds, and maximum value is 365 days. The time
            is calculated from the data scan job completion time. If value is
            set as 0 seconds, the scan will be immediately deleted upon job
            completion, regardless of whether the job succeeded or failed.
          format: google-duration
          type: string
      type: object
    GoogleCloudDataplexV1TriggerSchedule:
      description: The scan is scheduled to run periodically.
      id: GoogleCloudDataplexV1TriggerSchedule
      properties:
        cron:
          description: >-
            Required. Cron (https://en.wikipedia.org/wiki/Cron) schedule for
            running scans periodically.To explicitly set a timezone in the cron
            tab, apply a prefix in the cron tab: "CRON_TZ=${IANA_TIME_ZONE}" or
            "TZ=${IANA_TIME_ZONE}". The ${IANA_TIME_ZONE} may only be a valid
            string from IANA time zone database (wikipedia
            (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List)).
            For example, CRON_TZ=America/New_York 1 * * * *, or
            TZ=America/New_York 1 * * * *.This field is required for Schedule
            scans.
          type: string
      type: object
    GoogleCloudDataplexV1UnstructuredDataProfileResult:
      description: Contains the result of an unstructured data profile scan.
      id: GoogleCloudDataplexV1UnstructuredDataProfileResult
      properties:
        description:
          description: Output only. The inferred description.
          readOnly: true
          type: string
        graphProfile:
          $ref: '#/components/schemas/GoogleCloudDataplexV1GraphProfile'
          description: Output only. The inferred graph profile.
          readOnly: true
        partialFailureMessage:
          description: >-
            Output only. Optional message for partial failures (e.g. node type
            extraction failed).
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1UnstructuredDataProfileSpec:
      description: Contains the specification for an unstructured data profile scan.
      id: GoogleCloudDataplexV1UnstructuredDataProfileSpec
      properties:
        customizedPrompt:
          description: >-
            Optional. Customized prompt for unstructured data profile. The field
            will be used as part of the prompt, could be some instruction,
            specifying skill, or specific area to focus.
          type: string
        globalEndpointEnabled:
          description: Optional. Whether to use the global model.
          type: boolean
        graphProfilePublishingEnabled:
          description: >-
            Optional. Whether to publish graph-profile as aspect on the catalog
            entry.
          type: boolean
      type: object
    GoogleCloudDataplexV1UpdateEntryRequest:
      description: Update Entry request.
      id: GoogleCloudDataplexV1UpdateEntryRequest
      properties:
        allowMissing:
          description: >-
            Optional. If set to true and the entry doesn't exist, the service
            will create it.
          type: boolean
        aspectKeys:
          description: >-
            Optional. The map keys of the Aspects which the service should
            modify. It supports the following syntaxes: - matches an aspect of
            the given type and empty path. @path - matches an aspect of the
            given type and specified path. For example, to attach an aspect to a
            field that is specified by the schema aspect, the path should have
            the format Schema.. @* - matches aspects of the given type for all
            paths. *@path - matches aspects of all types on the given path.The
            service will not remove existing aspects matching the syntax unless
            delete_missing_aspects is set to true.If this field is left empty,
            the service treats it as specifying exactly those Aspects present in
            the request.
          items:
            type: string
          type: array
        deleteMissingAspects:
          description: >-
            Optional. If set to true and the aspect_keys specify aspect ranges,
            the service deletes any existing aspects from that range that
            weren't provided in the request.
          type: boolean
        entry:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Entry'
          description: Required. Entry resource.
        updateMask:
          description: >-
            Optional. Mask of fields to update. To update Aspects, the
            update_mask must contain the value "aspects".If the update_mask is
            empty, the service will update all modifiable fields present in the
            request.
          format: google-fieldmask
          type: string
      type: object
    GoogleCloudDataplexV1UpdateGlossaryCategoryRequest:
      description: Update GlossaryCategory Request
      id: GoogleCloudDataplexV1UpdateGlossaryCategoryRequest
      properties:
        category:
          $ref: '#/components/schemas/GoogleCloudDataplexV1GlossaryCategory'
          description: >-
            Required. The GlossaryCategory to update. The GlossaryCategory's
            name field is used to identify the GlossaryCategory to update.
            Format:
            projects/{project_id_or_number}/locations/{location_id}/glossaries/{glossary_id}/categories/{category_id}
        updateMask:
          description: Required. The list of fields to update.
          format: google-fieldmask
          type: string
      type: object
    GoogleCloudDataplexV1UpdateGlossaryRequest:
      description: Update Glossary Request
      id: GoogleCloudDataplexV1UpdateGlossaryRequest
      properties:
        glossary:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Glossary'
          description: >-
            Required. The Glossary to update. The Glossary's name field is used
            to identify the Glossary to update. Format:
            projects/{project_id_or_number}/locations/{location_id}/glossaries/{glossary_id}
        updateMask:
          description: Required. The list of fields to update.
          format: google-fieldmask
          type: string
        validateOnly:
          description: >-
            Optional. Validates the request without actually updating the
            Glossary. Default: false.
          type: boolean
      type: object
    GoogleCloudDataplexV1UpdateGlossaryTermRequest:
      description: Update GlossaryTerm Request
      id: GoogleCloudDataplexV1UpdateGlossaryTermRequest
      properties:
        term:
          $ref: '#/components/schemas/GoogleCloudDataplexV1GlossaryTerm'
          description: >-
            Required. The GlossaryTerm to update. The GlossaryTerm's name field
            is used to identify the GlossaryTerm to update. Format:
            projects/{project_id_or_number}/locations/{location_id}/glossaries/{glossary_id}/terms/{term_id}
        updateMask:
          description: Required. The list of fields to update.
          format: google-fieldmask
          type: string
      type: object
    GoogleCloudDataplexV1Zone:
      description: >-
        A zone represents a logical group of related assets within a lake. A
        zone can be used to map to organizational structure or represent stages
        of data readiness from raw to curated. It provides managing behavior
        that is shared or inherited by all contained assets.
      id: GoogleCloudDataplexV1Zone
      properties:
        assetStatus:
          $ref: '#/components/schemas/GoogleCloudDataplexV1AssetStatus'
          description: Output only. Aggregated status of the underlying assets of the zone.
          readOnly: true
        createTime:
          description: Output only. The time when the zone was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the zone.
          type: string
        discoverySpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1ZoneDiscoverySpec'
          description: >-
            Optional. Specification of the discovery feature applied to data in
            this zone.
        displayName:
          description: Optional. User friendly display name.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. User defined labels for the zone.
          type: object
        name:
          description: >-
            Output only. The relative resource name of the zone, of the form:
            projects/{project_number}/locations/{location_id}/lakes/{lake_id}/zones/{zone_id}.
          readOnly: true
          type: string
        resourceSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1ZoneResourceSpec'
          description: >-
            Required. Specification of the resources that are referenced by the
            assets within this zone.
        state:
          description: Output only. Current state of the zone.
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - CREATING
            - DELETING
            - ACTION_REQUIRED
          enumDescriptions:
            - State is not specified.
            - Resource is active, i.e., ready to use.
            - Resource is under creation.
            - Resource is under deletion.
            - Resource is active but has unresolved actions.
          readOnly: true
          type: string
        type:
          description: Required. Immutable. The type of the zone.
          enum:
            - TYPE_UNSPECIFIED
            - RAW
            - CURATED
          enumDescriptions:
            - Zone type not specified.
            - >-
              A zone that contains data that needs further processing before it
              is considered generally ready for consumption and analytics
              workloads.
            - >-
              A zone that contains data that is considered to be ready for
              broader consumption and analytics workloads. Curated structured
              data stored in Cloud Storage must conform to certain file formats
              (parquet, avro and orc) and organized in a hive-compatible
              directory layout.
          type: string
        uid:
          description: >-
            Output only. System generated globally unique ID for the zone. This
            ID will be different if the zone is deleted and re-created with the
            same name.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the zone was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1ZoneDiscoverySpec:
      description: Settings to manage the metadata discovery and publishing in a zone.
      id: GoogleCloudDataplexV1ZoneDiscoverySpec
      properties:
        csvOptions:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1ZoneDiscoverySpecCsvOptions
          description: Optional. Configuration for CSV data.
        enabled:
          description: Required. Whether discovery is enabled.
          type: boolean
        excludePatterns:
          description: >-
            Optional. The list of patterns to apply for selecting data to
            exclude during discovery. For Cloud Storage bucket assets, these are
            interpreted as glob patterns used to match object names. For
            BigQuery dataset assets, these are interpreted as patterns to match
            table names.
          items:
            type: string
          type: array
        includePatterns:
          description: >-
            Optional. The list of patterns to apply for selecting data to
            include during discovery if only a subset of the data should
            considered. For Cloud Storage bucket assets, these are interpreted
            as glob patterns used to match object names. For BigQuery dataset
            assets, these are interpreted as patterns to match table names.
          items:
            type: string
          type: array
        jsonOptions:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1ZoneDiscoverySpecJsonOptions
          description: Optional. Configuration for Json data.
        schedule:
          description: >-
            Optional. Cron schedule (https://en.wikipedia.org/wiki/Cron) for
            running discovery periodically. Successive discovery runs must be
            scheduled at least 60 minutes apart. The default value is to run
            discovery every 60 minutes.To explicitly set a timezone to the cron
            tab, apply a prefix in the cron tab: "CRON_TZ=${IANA_TIME_ZONE}" or
            TZ=${IANA_TIME_ZONE}". The ${IANA_TIME_ZONE} may only be a valid
            string from IANA time zone database. For example,
            CRON_TZ=America/New_York 1 * * * *, or TZ=America/New_York 1 * * *
            *.
          type: string
      type: object
    GoogleCloudDataplexV1ZoneDiscoverySpecCsvOptions:
      description: Describe CSV and similar semi-structured data formats.
      id: GoogleCloudDataplexV1ZoneDiscoverySpecCsvOptions
      properties:
        delimiter:
          description: >-
            Optional. The delimiter being used to separate values. This defaults
            to ','.
          type: string
        disableTypeInference:
          description: >-
            Optional. Whether to disable the inference of data type for CSV
            data. If true, all columns will be registered as strings.
          type: boolean
        encoding:
          description: Optional. The character encoding of the data. The default is UTF-8.
          type: string
        headerRows:
          description: >-
            Optional. The number of rows to interpret as header rows that should
            be skipped when reading data rows.
          format: int32
          type: integer
      type: object
    GoogleCloudDataplexV1ZoneDiscoverySpecJsonOptions:
      description: Describe JSON data format.
      id: GoogleCloudDataplexV1ZoneDiscoverySpecJsonOptions
      properties:
        disableTypeInference:
          description: >-
            Optional. Whether to disable the inference of data type for Json
            data. If true, all columns will be registered as their primitive
            types (strings, number or boolean).
          type: boolean
        encoding:
          description: Optional. The character encoding of the data. The default is UTF-8.
          type: string
      type: object
    GoogleCloudDataplexV1ZoneResourceSpec:
      description: Settings for resources attached as assets within a zone.
      id: GoogleCloudDataplexV1ZoneResourceSpec
      properties:
        locationType:
          description: >-
            Required. Immutable. The location type of the resources that are
            allowed to be attached to the assets within this zone.
          enum:
            - LOCATION_TYPE_UNSPECIFIED
            - SINGLE_REGION
            - MULTI_REGION
          enumDescriptions:
            - Unspecified location type.
            - Resources that are associated with a single region.
            - Resources that are associated with a multi-region location.
          type: string
      type: object
    GoogleCloudLocationListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: GoogleCloudLocationListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/GoogleCloudLocationLocation'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    GoogleCloudLocationLocation:
      description: A resource that represents a Google Cloud location.
      id: GoogleCloudLocationLocation
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"} 
          type: object
        locationId:
          description: 'The canonical id for this location. For example: "us-east1".'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            "projects/example-project/locations/us-east1"
          type: string
      type: object
    GoogleIamV1AuditConfig:
      description: >-
        Specifies the audit configuration for a service. The configuration
        determines which permission types are logged, and what identities, if
        any, are exempted from logging. An AuditConfig must have one or more
        AuditLogConfigs.If there are AuditConfigs for both allServices and a
        specific service, the union of the two AuditConfigs is used for that
        service: the log_types specified in each AuditConfig are enabled, and
        the exempted_members in each AuditLogConfig are exempted.Example Policy
        with multiple AuditConfigs: { "audit_configs": [ { "service":
        "allServices", "audit_log_configs": [ { "log_type": "DATA_READ",
        "exempted_members": [ "user:jose@example.com" ] }, { "log_type":
        "DATA_WRITE" }, { "log_type": "ADMIN_READ" } ] }, { "service":
        "sampleservice.googleapis.com", "audit_log_configs": [ { "log_type":
        "DATA_READ" }, { "log_type": "DATA_WRITE", "exempted_members": [
        "user:aliya@example.com" ] } ] } ] } For sampleservice, this policy
        enables DATA_READ, DATA_WRITE and ADMIN_READ logging. It also exempts
        jose@example.com from DATA_READ logging, and aliya@example.com from
        DATA_WRITE logging.
      id: GoogleIamV1AuditConfig
      properties:
        auditLogConfigs:
          description: The configuration for logging of each type of permission.
          items:
            $ref: '#/components/schemas/GoogleIamV1AuditLogConfig'
          type: array
        service:
          description: >-
            Specifies a service that will be enabled for audit logging. For
            example, storage.googleapis.com, cloudsql.googleapis.com.
            allServices is a special value that covers all services.
          type: string
      type: object
    GoogleIamV1AuditLogConfig:
      description: >-
        Provides the configuration for logging a type of permissions. Example: {
        "audit_log_configs": [ { "log_type": "DATA_READ", "exempted_members": [
        "user:jose@example.com" ] }, { "log_type": "DATA_WRITE" } ] } This
        enables 'DATA_READ' and 'DATA_WRITE' logging, while exempting
        jose@example.com from DATA_READ logging.
      id: GoogleIamV1AuditLogConfig
      properties:
        exemptedMembers:
          description: >-
            Specifies the identities that do not cause logging for this type of
            permission. Follows the same format of Binding.members.
          items:
            type: string
          type: array
        logType:
          description: The log type that this config enables.
          enum:
            - LOG_TYPE_UNSPECIFIED
            - ADMIN_READ
            - DATA_WRITE
            - DATA_READ
          enumDescriptions:
            - Default case. Should never be this.
            - 'Admin reads. Example: CloudIAM getIamPolicy'
            - 'Data writes. Example: CloudSQL Users create'
            - 'Data reads. Example: CloudSQL Users list'
          type: string
      type: object
    GoogleIamV1Binding:
      description: Associates members, or principals, with a role.
      id: GoogleIamV1Binding
      properties:
        condition:
          $ref: '#/components/schemas/GoogleTypeExpr'
          description: >-
            The condition that is associated with this binding.If the condition
            evaluates to true, then this binding applies to the current
            request.If the condition evaluates to false, then this binding does
            not apply to the current request. However, a different role binding
            might grant the same role to one or more of the principals in this
            binding.To learn which resources support conditions in their IAM
            policies, see the IAM documentation
            (https://cloud.google.com/iam/help/conditions/resource-policies).
        members:
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. members can have the following values: allUsers: A special
            identifier that represents anyone who is on the internet; with or
            without a Google account. allAuthenticatedUsers: A special
            identifier that represents anyone who is authenticated with a Google
            account or a service account. Does not include identities that come
            from external identity providers (IdPs) through identity federation.
            user:{emailid}: An email address that represents a specific Google
            account. For example, alice@example.com . serviceAccount:{emailid}:
            An email address that represents a Google service account. For
            example, my-other-app@appspot.gserviceaccount.com.
            serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]:
            An identifier for a Kubernetes service account
            (https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example, my-project.svc.id.goog[my-namespace/my-kubernetes-sa].
            group:{emailid}: An email address that represents a Google group.
            For example, admins@example.com. domain:{domain}: The G Suite domain
            (primary) that represents all the users of that domain. For example,
            google.com or example.com.
            principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}:
            A single identity in a workforce identity pool.
            principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}:
            All workforce identities in a group.
            principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}:
            All workforce identities with a specific attribute value.
            principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*:
            All identities in a workforce identity pool.
            principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}:
            A single identity in a workload identity pool.
            principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}:
            A workload identity pool group.
            principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}:
            All identities in a workload identity pool with a certain attribute.
            principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*:
            All identities in a workload identity pool.
            deleted:user:{emailid}?uid={uniqueid}: An email address (plus unique
            identifier) representing a user that has been recently deleted. For
            example, alice@example.com?uid=123456789012345678901. If the user is
            recovered, this value reverts to user:{emailid} and the recovered
            user retains the role in the binding.
            deleted:serviceAccount:{emailid}?uid={uniqueid}: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901.
            If the service account is undeleted, this value reverts to
            serviceAccount:{emailid} and the undeleted service account retains
            the role in the binding. deleted:group:{emailid}?uid={uniqueid}: An
            email address (plus unique identifier) representing a Google group
            that has been recently deleted. For example,
            admins@example.com?uid=123456789012345678901. If the group is
            recovered, this value reverts to group:{emailid} and the recovered
            group retains the role in the binding.
            deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}:
            Deleted single identity in a workforce identity pool. For example,
            deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value.
          items:
            type: string
          type: array
        role:
          description: >-
            Role that is assigned to the list of members, or principals. For
            example, roles/viewer, roles/editor, or roles/owner.For an overview
            of the IAM roles and permissions, see the IAM documentation
            (https://cloud.google.com/iam/docs/roles-overview). For a list of
            the available pre-defined roles, see here
            (https://cloud.google.com/iam/docs/understanding-roles).
          type: string
      type: object
    GoogleIamV1Policy:
      description: >-
        An Identity and Access Management (IAM) policy, which specifies access
        controls for Google Cloud resources.A Policy is a collection of
        bindings. A binding binds one or more members, or principals, to a
        single role. Principals can be user accounts, service accounts, Google
        groups, and domains (such as G Suite). A role is a named list of
        permissions; each role can be an IAM predefined role or a user-created
        custom role.For some types of Google Cloud resources, a binding can also
        specify a condition, which is a logical expression that allows access to
        a resource only if the expression evaluates to true. A condition can add
        constraints based on attributes of the request, the resource, or both.
        To learn which resources support conditions in their IAM policies, see
        the IAM documentation
        (https://cloud.google.com/iam/help/conditions/resource-policies).JSON
        example: { "bindings": [ { "role":
        "roles/resourcemanager.organizationAdmin", "members": [
        "user:mike@example.com", "group:admins@example.com",
        "domain:google.com",
        "serviceAccount:my-project-id@appspot.gserviceaccount.com" ] }, {
        "role": "roles/resourcemanager.organizationViewer", "members": [
        "user:eve@example.com" ], "condition": { "title": "expirable access",
        "description": "Does not grant access after Sep 2020", "expression":
        "request.time < timestamp('2020-10-01T00:00:00.000Z')", } } ], "etag":
        "BwWWja0YfJA=", "version": 3 } YAML example: bindings: - members: -
        user:mike@example.com - group:admins@example.com - domain:google.com -
        serviceAccount:my-project-id@appspot.gserviceaccount.com role:
        roles/resourcemanager.organizationAdmin - members: -
        user:eve@example.com role: roles/resourcemanager.organizationViewer
        condition: title: expirable access description: Does not grant access
        after Sep 2020 expression: request.time <
        timestamp('2020-10-01T00:00:00.000Z') etag: BwWWja0YfJA= version: 3 For
        a description of IAM and its features, see the IAM documentation
        (https://cloud.google.com/iam/docs/).
      id: GoogleIamV1Policy
      properties:
        auditConfigs:
          description: Specifies cloud audit logging configuration for this policy.
          items:
            $ref: '#/components/schemas/GoogleIamV1AuditConfig'
          type: array
        bindings:
          description: >-
            Associates a list of members, or principals, with a role.
            Optionally, may specify a condition that determines how and when the
            bindings are applied. Each of the bindings must contain at least one
            principal.The bindings in a Policy can refer to up to 1,500
            principals; up to 250 of these principals can be Google groups. Each
            occurrence of a principal counts towards these limits. For example,
            if the bindings grant 50 different roles to user:alice@example.com,
            and not to any other principal, then you can add another 1,450
            principals to the bindings in the Policy.
          items:
            $ref: '#/components/schemas/GoogleIamV1Binding'
          type: array
        etag:
          description: >-
            etag is used for optimistic concurrency control as a way to help
            prevent simultaneous updates of a policy from overwriting each
            other. It is strongly suggested that systems make use of the etag in
            the read-modify-write cycle to perform policy updates in order to
            avoid race conditions: An etag is returned in the response to
            getIamPolicy, and systems are expected to put that etag in the
            request to setIamPolicy to ensure that their change will be applied
            to the same version of the policy.Important: If you use IAM
            Conditions, you must include the etag field whenever you call
            setIamPolicy. If you omit this field, then IAM allows you to
            overwrite a version 3 policy with a version 1 policy, and all of the
            conditions in the version 3 policy are lost.
          format: byte
          type: string
        version:
          description: >-
            Specifies the format of the policy.Valid values are 0, 1, and 3.
            Requests that specify an invalid value are rejected.Any operation
            that affects conditional role bindings must specify version 3. This
            requirement applies to the following operations: Getting a policy
            that includes a conditional role binding Adding a conditional role
            binding to a policy Changing a conditional role binding in a policy
            Removing any role binding, with or without a condition, from a
            policy that includes conditionsImportant: If you use IAM Conditions,
            you must include the etag field whenever you call setIamPolicy. If
