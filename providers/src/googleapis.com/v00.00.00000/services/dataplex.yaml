        dataQualitySpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataQualitySpec'
          description: Output only. Settings for a data quality scan.
          readOnly: true
        endTime:
          description: Output only. The time when the DataScanJob ended.
