          type: string
        paths:
          description: >-
            Optional. The list of paths for items within the associated resource
            (eg. columns and partitions within a table) along with attribute
            bindings.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1DataAttributeBindingPath'
          type: array
        resource:
          description: >-
            Optional. Immutable. The resource name of the resource that is
            associated to attributes. Presently, only entity resource is
            supported in the form:
            projects/{project}/locations/{location}/lakes/{lake}/zones/{zone}/entities/{entity_id}
            Must belong in the same project and region as the attribute binding,
            and there can only exist one active binding for a resource.
          type: string
        uid:
          description: >-
            Output only. System generated globally unique ID for the
            DataAttributeBinding. This ID will be different if the
            DataAttributeBinding is deleted and re-created with the same name.
          readOnly: true
          type: string
        updateTime:
          description: >-
            Output only. The time when the DataAttributeBinding was last
            updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataAttributeBindingPath:
      description: >-
        Represents a subresource of the given resource, and associated bindings
        with it. Currently supported subresources are column and partition
        schema fields within a table.
      id: GoogleCloudDataplexV1DataAttributeBindingPath
      properties:
        attributes:
          description: >-
            Optional. List of attributes to be associated with the path of the
            resource, provided in the form:
            projects/{project}/locations/{location}/dataTaxonomies/{dataTaxonomy}/attributes/{data_attribute_id}
          items:
            type: string
          type: array
        name:
          description: >-
            Required. The name identifier of the path. Nested columns should be
            of the form: 'address.city'.
          type: string
      type: object
    GoogleCloudDataplexV1DataDiscoveryResult:
      description: The output of a data discovery scan.
      id: GoogleCloudDataplexV1DataDiscoveryResult
      properties:
        bigqueryPublishing:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDiscoveryResultBigQueryPublishing
          description: Output only. Configuration for metadata publishing.
          readOnly: true
        scanStatistics:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDiscoveryResultScanStatistics
          description: >-
            Output only. Describes result statistics of a data scan discovery
            job.
          readOnly: true
      type: object
    GoogleCloudDataplexV1DataDiscoveryResultBigQueryPublishing:
      description: Describes BigQuery publishing configurations.
      id: GoogleCloudDataplexV1DataDiscoveryResultBigQueryPublishing
      properties:
        dataset:
          description: >-
            Output only. The BigQuery dataset the discovered tables are
            published to.
          readOnly: true
          type: string
        location:
          description: Output only. The location of the BigQuery publishing dataset.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataDiscoveryResultScanStatistics:
      description: Describes result statistics of a data scan discovery job.
      id: GoogleCloudDataplexV1DataDiscoveryResultScanStatistics
      properties:
        dataProcessedBytes:
          description: The data processed in bytes.
          format: int64
          type: string
        filesExcluded:
          description: The number of files excluded.
          format: int32
          type: integer
        filesetsCreated:
          description: The number of filesets created.
          format: int32
          type: integer
        filesetsDeleted:
          description: The number of filesets deleted.
          format: int32
          type: integer
        filesetsUpdated:
          description: The number of filesets updated.
          format: int32
          type: integer
        scannedFileCount:
          description: The number of files scanned.
          format: int32
          type: integer
        tablesCreated:
          description: The number of tables created.
          format: int32
          type: integer
        tablesDeleted:
          description: The number of tables deleted.
          format: int32
          type: integer
        tablesUpdated:
          description: The number of tables updated.
          format: int32
          type: integer
      type: object
    GoogleCloudDataplexV1DataDiscoverySpec:
      description: Spec for a data discovery scan.
      id: GoogleCloudDataplexV1DataDiscoverySpec
      properties:
        bigqueryPublishingConfig:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDiscoverySpecBigQueryPublishingConfig
          description: Optional. Configuration for metadata publishing.
        storageConfig:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDiscoverySpecStorageConfig
          description: Cloud Storage related configurations.
      type: object
    GoogleCloudDataplexV1DataDiscoverySpecBigQueryPublishingConfig:
      description: Describes BigQuery publishing configurations.
      id: GoogleCloudDataplexV1DataDiscoverySpecBigQueryPublishingConfig
      properties:
        connection:
          description: >-
            Optional. The BigQuery connection used to create BigLake tables.
            Must be in the form
            projects/{project_id}/locations/{location_id}/connections/{connection_id}
          type: string
        location:
          description: >-
            Optional. The location of the BigQuery dataset to publish BigLake
            external or non-BigLake external tables to. 1. If the Cloud Storage
            bucket is located in a multi-region bucket, then BigQuery dataset
            can be in the same multi-region bucket or any single region that is
            included in the same multi-region bucket. The datascan can be
            created in any single region that is included in the same
            multi-region bucket 2. If the Cloud Storage bucket is located in a
            dual-region bucket, then BigQuery dataset can be located in regions
            that are included in the dual-region bucket, or in a multi-region
            that includes the dual-region. The datascan can be created in any
            single region that is included in the same dual-region bucket. 3. If
            the Cloud Storage bucket is located in a single region, then
            BigQuery dataset can be in the same single region or any
            multi-region bucket that includes the same single region. The
            datascan will be created in the same single region as the bucket. 4.
            If the BigQuery dataset is in single region, it must be in the same
            single region as the datascan.For supported values, refer to
            https://cloud.google.com/bigquery/docs/locations#supported_locations.
          type: string
        project:
          description: >-
            Optional. The project of the BigQuery dataset to publish BigLake
            external or non-BigLake external tables to. If not specified, the
            project of the Cloud Storage bucket will be used. The format is
            "projects/{project_id_or_number}".
          type: string
        tableType:
          description: >-
            Optional. Determines whether to publish discovered tables as BigLake
            external tables or non-BigLake external tables.
          enum:
            - TABLE_TYPE_UNSPECIFIED
            - EXTERNAL
            - BIGLAKE
          enumDescriptions:
            - Table type unspecified.
            - >-
              Default. Discovered tables are published as BigQuery external
              tables whose data is accessed using the credentials of the user
              querying the table.
            - >-
              Discovered tables are published as BigLake external tables whose
              data is accessed using the credentials of the associated BigQuery
              connection.
          type: string
      type: object
    GoogleCloudDataplexV1DataDiscoverySpecStorageConfig:
      description: Configurations related to Cloud Storage as the data source.
      id: GoogleCloudDataplexV1DataDiscoverySpecStorageConfig
      properties:
        csvOptions:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDiscoverySpecStorageConfigCsvOptions
          description: Optional. Configuration for CSV data.
        excludePatterns:
          description: >-
            Optional. Defines the data to exclude during discovery. Provide a
            list of patterns that identify the data to exclude. For Cloud
            Storage bucket assets, these patterns are interpreted as glob
            patterns used to match object names. For BigQuery dataset assets,
            these patterns are interpreted as patterns to match table names.
          items:
            type: string
          type: array
        includePatterns:
          description: >-
            Optional. Defines the data to include during discovery when only a
            subset of the data should be considered. Provide a list of patterns
            that identify the data to include. For Cloud Storage bucket assets,
            these patterns are interpreted as glob patterns used to match object
            names. For BigQuery dataset assets, these patterns are interpreted
            as patterns to match table names.
          items:
            type: string
          type: array
        jsonOptions:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDiscoverySpecStorageConfigJsonOptions
          description: Optional. Configuration for JSON data.
        unstructuredDataOptions:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDiscoverySpecStorageConfigUnstructuredDataOptions
          description: Optional. Specifies configuration for unstructured data discovery.
      type: object
    GoogleCloudDataplexV1DataDiscoverySpecStorageConfigCsvOptions:
      description: Describes CSV and similar semi-structured data formats.
      id: GoogleCloudDataplexV1DataDiscoverySpecStorageConfigCsvOptions
      properties:
        delimiter:
          description: >-
            Optional. The delimiter that is used to separate values. The default
            is , (comma).
          type: string
        encoding:
          description: Optional. The character encoding of the data. The default is UTF-8.
          type: string
        headerRows:
          description: >-
            Optional. The number of rows to interpret as header rows that should
            be skipped when reading data rows.
          format: int32
          type: integer
        quote:
          description: >-
            Optional. The character used to quote column values. Accepts "
            (double quotation mark) or ' (single quotation mark). If
            unspecified, defaults to " (double quotation mark).
          type: string
        typeInferenceDisabled:
          description: >-
            Optional. Whether to disable the inference of data types for CSV
            data. If true, all columns are registered as strings.
          type: boolean
      type: object
    GoogleCloudDataplexV1DataDiscoverySpecStorageConfigJsonOptions:
      description: Describes JSON data format.
      id: GoogleCloudDataplexV1DataDiscoverySpecStorageConfigJsonOptions
      properties:
        encoding:
          description: Optional. The character encoding of the data. The default is UTF-8.
          type: string
        typeInferenceDisabled:
          description: >-
            Optional. Whether to disable the inference of data types for JSON
            data. If true, all columns are registered as their primitive types
            (strings, number, or boolean).
          type: boolean
      type: object
    GoogleCloudDataplexV1DataDiscoverySpecStorageConfigUnstructuredDataOptions:
      description: Describes options for unstructured data discovery.
      id: >-
        GoogleCloudDataplexV1DataDiscoverySpecStorageConfigUnstructuredDataOptions
      properties:
        globalEndpointEnabled:
          description: Optional. Whether to use the global model endpoint.
          type: boolean
        semanticInferenceEnabled:
          description: >-
            Optional. Specifies whether deeper semantic inference over the
            objects' contents using GenAI is enabled.
          type: boolean
      type: object
    GoogleCloudDataplexV1DataDocumentationResult:
      description: The output of a DataDocumentation scan.
      id: GoogleCloudDataplexV1DataDocumentationResult
      properties:
        datasetResult:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDocumentationResultDatasetResult
          description: Output only. Insights for a Dataset resource.
          readOnly: true
        tableResult:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDocumentationResultTableResult
          description: Output only. Insights for a Table resource.
          readOnly: true
      type: object
    GoogleCloudDataplexV1DataDocumentationResultDatasetResult:
      description: Insights for a dataset resource.
      id: GoogleCloudDataplexV1DataDocumentationResultDatasetResult
      properties:
        overview:
          description: Output only. Generated Dataset description.
          readOnly: true
          type: string
        queries:
          description: Output only. Sample SQL queries for the dataset.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataDocumentationResultQuery
          readOnly: true
          type: array
        schemaRelationships:
          description: >-
            Output only. Relationships suggesting how tables in the dataset are
            related to each other, based on their schema.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataDocumentationResultSchemaRelationship
          readOnly: true
          type: array
      type: object
    GoogleCloudDataplexV1DataDocumentationResultField:
      description: Column of a table with generated metadata and nested fields.
      id: GoogleCloudDataplexV1DataDocumentationResultField
      properties:
        description:
          description: Output only. Generated description for columns and fields.
          readOnly: true
          type: string
        fields:
          description: Output only. Nested fields.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataDocumentationResultField
          readOnly: true
          type: array
        name:
          description: Output only. The name of the column.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataDocumentationResultQuery:
      description: A sample SQL query in data documentation.
      id: GoogleCloudDataplexV1DataDocumentationResultQuery
      properties:
        description:
          description: Output only. The description for the query.
          readOnly: true
          type: string
        sql:
          description: Output only. The SQL query string which can be executed.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataDocumentationResultSchema:
      description: Schema of the table with generated metadata of columns.
      id: GoogleCloudDataplexV1DataDocumentationResultSchema
      properties:
        fields:
          description: Output only. The list of columns.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataDocumentationResultField
          readOnly: true
          type: array
      type: object
    GoogleCloudDataplexV1DataDocumentationResultSchemaRelationship:
      description: Details of the relationship between the schema of two resources.
      id: GoogleCloudDataplexV1DataDocumentationResultSchemaRelationship
      properties:
        leftSchemaPaths:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDocumentationResultSchemaRelationshipSchemaPaths
          description: >-
            Output only. An ordered list of fields for the join from the first
            table. The size of this list must be the same as right_schema_paths.
            Each field at index i in this list must correspond to a field at the
            same index in the right_schema_paths list.
          readOnly: true
        rightSchemaPaths:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDocumentationResultSchemaRelationshipSchemaPaths
          description: >-
            Output only. An ordered list of fields for the join from the second
            table. The size of this list must be the same as left_schema_paths.
            Each field at index i in this list must correspond to a field at the
            same index in the left_schema_paths list.
          readOnly: true
        sources:
          description: Output only. Sources which generated the schema relation edge.
          items:
            enum:
              - SOURCE_UNSPECIFIED
              - AGENT
              - QUERY_HISTORY
              - TABLE_CONSTRAINTS
            enumDescriptions:
              - The source of the schema relationship is unspecified.
              - The source of the schema relationship is agent.
              - >-
                The source of the schema relationship is query history from the
                source system.
              - >-
                The source of the schema relationship is table constraints added
                in the source system.
            type: string
          readOnly: true
          type: array
        type:
          description: Output only. The type of relationship between the schema paths.
          enum:
            - TYPE_UNSPECIFIED
            - SCHEMA_JOIN
          enumDescriptions:
            - The type of the schema relationship is unspecified.
            - Indicates a join relationship between the schema fields.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataDocumentationResultSchemaRelationshipSchemaPaths:
      description: Represents an ordered set of paths within a table's schema.
      id: >-
        GoogleCloudDataplexV1DataDocumentationResultSchemaRelationshipSchemaPaths
      properties:
        paths:
          description: >-
            Output only. An ordered set of Paths to fields within the schema of
            the table. For fields nested within a top level field of type
            record, use '.' to separate field names. Examples: Top level field -
            top_level Nested field - top_level.child.sub_field
          items:
            type: string
          readOnly: true
          type: array
        tableFqn:
          description: >-
            Output only. The service-qualified full resource name of the table
            Ex:
            //bigquery.googleapis.com/projects/PROJECT_ID/datasets/DATASET_ID/tables/TABLE_ID
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataDocumentationResultTableResult:
      description: Insights for a table resource.
      id: GoogleCloudDataplexV1DataDocumentationResultTableResult
      properties:
        name:
          description: >-
            Output only. The service-qualified full resource name of the cloud
            resource. Ex:
            //bigquery.googleapis.com/projects/PROJECT_ID/datasets/DATASET_ID/tables/TABLE_ID
          readOnly: true
          type: string
        overview:
          description: Output only. Generated description of the table.
          readOnly: true
          type: string
        queries:
          description: Output only. Sample SQL queries for the table.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataDocumentationResultQuery
          readOnly: true
          type: array
        schema:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataDocumentationResultSchema
          description: >-
            Output only. Schema of the table with generated metadata of the
            columns in the schema.
          readOnly: true
      type: object
    GoogleCloudDataplexV1DataDocumentationSpec:
      description: DataDocumentation scan related spec.
      id: GoogleCloudDataplexV1DataDocumentationSpec
      properties:
        catalogPublishingEnabled:
          description: Optional. Whether to publish result to Dataplex Catalog.
          type: boolean
        generationScopes:
          description: >-
            Optional. Specifies which components of the data documentation to
            generate. Any component that is required to generate the specified
            components will also be generated. If no generation scope is
            specified, all available documentation components will be generated.
          items:
            enum:
              - GENERATION_SCOPE_UNSPECIFIED
              - ALL
              - TABLE_AND_COLUMN_DESCRIPTIONS
              - SQL_QUERIES
              - BUSINESS_GLOSSARY_TERM_ASSOCIATIONS
            enumDescriptions:
              - >-
                Unspecified generation scope. If no generation scope is
                specified, all available documentation components will be
                generated.
              - All the possible results will be generated.
              - Table and column descriptions will be generated.
              - SQL queries will be generated.
              - Business glossary term associations will be generated.
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1DataDomain:
      description: >-
        A DataDomain is a logical grouping of data resources for governance,
        discovery, and management at scale.
      id: GoogleCloudDataplexV1DataDomain
      properties:
        contacts:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Contacts'
          description: Required. Contact info for the Data Domains.
        createTime:
          description: Output only. The time at which the DataDomain was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. User-provided description of the DataDomain.
          type: string
        displayName:
          description: Required. User-friendly display name.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels for the DataDomain.
          type: object
        name:
          description: >-
            Identifier. The relative resource name of the DataDomain, of the
            form:
            projects/{project_id_or_number}/locations/{location_id}/dataDomains/{data_domain_id}
          type: string
        parentDataDomain:
          description: >-
            Optional. Immutable. The resource name of the parent DataDomain.
            Empty if this is a top-level DataDomain. Format:
            projects/{project_id_or_number}/locations/{location}/dataDomains/{parent_data_domain_id}
            This field is immutable after creation.
          type: string
        policyMember:
          $ref: '#/components/schemas/GoogleIamV1ResourcePolicyMember'
          description: Output only. Output-only policy member strings of this resource.
          readOnly: true
        uid:
          description: Output only. System-generated globally unique ID for the DataDomain.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time at which the DataDomain was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataDomainBinding:
      description: >-
        DataDomainBinding represents a rule that includes a Google Cloud
        resource and its contents into a DataDomain.
      id: GoogleCloudDataplexV1DataDomainBinding
      properties:
        createTime:
          description: Output only. The time at which the DataDomainBinding was created.
          format: google-datetime
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. The relative resource name of the DataDomainBinding.
            Format:
            projects/{project_id_or_number}/locations/{location}/dataDomains/{data_domain_id}/bindings/{binding_id}
          type: string
        resource:
          description: >-
            Required. Immutable. The full resource name of the Google Cloud
            resource to be bound (i.e. included together with its contents) to
            the DataDomain.Format: IAM Full resource name
            (https://docs.cloud.google.com/iam/docs/full-resource-names)
            Examples: - GCP Project:
            //cloudresourcemanager.googleapis.com/projects/{project-id} -
            BigQuery Dataset:
            //bigquery.googleapis.com/projects/{project-id}/datasets/{dataset-id}
            - BigQuery Table:
            //bigquery.googleapis.com/projects/{project-id}/datasets/{dataset-id}/tables/{table-id}
            - Dataplex Data Product:
            //dataplex.googleapis.com/projects/{project-number}/locations/{location}/dataProducts/{data-product-id}Authorization:
            the resource to be bound must first grant an IAM role with the
            resource-specific setIamPolicy permission to the DataDomain.
            Example: - resource:
            //bigquery.googleapis.com/projects/{project-id}/datasets/{dataset-id}
            - IAM role: with bigquery.datasets.setIamPolicy permission (e.g.
            roles/owner) - IAM member:
            principal://dataplex.googleapis.com/projects/{project-number}/name/locations/{location}/dataDomains/{data-domain-id}
          type: string
        uid:
          description: Output only. System-generated unique ID.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataProduct:
      description: >-
        A data product is a curated collection of data assets, packaged to
        address specific use cases. It's a way to manage and share data in a
        more organized, product-like manner.
      id: GoogleCloudDataplexV1DataProduct
      properties:
        accessApprovalConfig:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProductAccessApprovalConfig
          description: Optional. Configuration for access approval for the data product.
        accessGroups:
          additionalProperties:
            $ref: '#/components/schemas/GoogleCloudDataplexV1DataProductAccessGroup'
          description: >-
            Optional. Data product access groups by access group id as key. If
            data product is used only for packaging data assets, then access
            groups may be empty. However, if a data product is used for sharing
            data assets, then at least one access group must be
            specified.Example: { "analyst": { "id": "analyst", "displayName":
            "Analyst", "description": "Access group for analysts", "principal":
            { "googleGroup": "analysts@example.com" } } } 
          type: object
        assetCount:
          description: >-
            Output only. Number of data assets associated with this data
            product.
          format: int32
          readOnly: true
          type: integer
        createTime:
          description: Output only. The time at which the data product was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the data product.
          type: string
        displayName:
          description: Required. User-friendly display name of the data product.
          type: string
        etag:
          description: >-
            Optional. This checksum is computed by the server based on the value
            of other fields, and may be sent on update and delete requests to
            ensure the client has an up-to-date value before proceeding.
          type: string
        icon:
          description: >-
            Optional. Base64 encoded image representing the data product. Max
            Size: 3.0MiB Expected image dimensions are 512x512 pixels, however
            the API only performs validation on size of the encoded data. Note:
            For byte fields, the content of the fields are base64-encoded (which
            increases the size of the data by 33-36%) when using JSON on the
            wire.
          format: byte
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. User-defined labels for the data product.Example: {
            "environment": "production", "billing": "marketing-department" } 
          type: object
        name:
          description: >-
            Identifier. Resource name of the data product. Format:
            projects/{project_id_or_number}/locations/{location_id}/dataProducts/{data_product_id}.
          type: string
        ownerEmails:
          description: Required. Emails of the data product owners.
          items:
            type: string
          type: array
        uid:
          description: >-
            Output only. System generated unique ID for the data product. This
            ID will be different if the data product is deleted and re-created
            with the same name.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time at which the data product was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataProductAccessApprovalConfig:
      description: Configuration for access approval for the data product.
      id: GoogleCloudDataplexV1DataProductAccessApprovalConfig
      properties:
        approverEmails:
          description: >-
            Optional. Specifies the email addresses of users who are potential
            approvers and are notified when an access request is made for the
            data product. The maximum number of emails allowed is 10.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1DataProductAccessGroup:
      description: >-
        Custom user defined access groups at the data product level. These are
        used for granting different levels of access (IAM roles) on the
        individual data product's data assets.
      id: GoogleCloudDataplexV1DataProductAccessGroup
      properties:
        description:
          description: Optional. Description of the access group.
          type: string
        displayName:
          description: >-
            Required. User friendly display name of the access group. Eg.
            "Analyst", "Developer", etc.
          type: string
        id:
          description: >-
            Required. Unique identifier of the access group within the data
            product. User defined. Eg. "analyst", "developer", etc.
          type: string
        principal:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataProductPrincipal'
          description: Required. The principal entity associated with this access group.
      type: object
    GoogleCloudDataplexV1DataProductAccessRequest:
      description: >-
        Message for requesting access to a Data Product. This will be used to
        create a ChangeRequest of type REQUEST_DATA_PRODUCT_ACCESS.
      id: GoogleCloudDataplexV1DataProductAccessRequest
      properties:
        accessGroupDisplayName:
          description: >-
            Output only. The display name of the access group defined in the
            Data Product for which access is being requested.
          readOnly: true
          type: string
        accessGroupId:
          description: >-
            Required. The ID of the access group for which access is being
            requested. This corresponds to the unique identifier of the
            AccessGroup defined in the Data Product.
          type: string
        parent:
          description: >-
            Required. The resource name of the data product. Format:
            projects/{project_number}/locations/{location_id}/dataProducts/{data_product_id}
          type: string
        requestedPrincipal:
          description: >-
            Optional. The principal for which access is being requested in IAM
            format. If not specified, the requestor's principal will be used.
            Example: serviceAccount:my-sa@my-project.iam.gserviceaccount.com.
            Only service account principals are currently supported.
            https://cloud.google.com/iam/docs/principal-identifiers
          type: string
      type: object
    GoogleCloudDataplexV1DataProductPrincipal:
      description: >-
        Represents the principal entity associated with an access group, as per
        https://cloud.google.com/iam/docs/principals-overview.
      id: GoogleCloudDataplexV1DataProductPrincipal
      properties:
        googleGroup:
          description: >-
            Optional. Email of the Google Group, as per
            https://cloud.google.com/iam/docs/principals-overview#google-group.
          type: string
        serviceAccount:
          description: >-
            Optional. Specifies the email of the producer service account, as
            per
            https://cloud.google.com/iam/docs/principals-overview#service-account.
          type: string
      type: object
    GoogleCloudDataplexV1DataProfileResult:
      description: >-
        DataProfileResult defines the output of DataProfileScan. Each field of
        the table will have field type specific profile result.
      id: GoogleCloudDataplexV1DataProfileResult
      properties:
        catalogPublishingStatus:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataScanCatalogPublishingStatus
          description: >-
            Output only. The status of publishing the data scan as Dataplex
            Universal Catalog metadata.
          readOnly: true
        postScanActionsResult:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProfileResultPostScanActionsResult
          description: Output only. The result of post scan actions.
          readOnly: true
        profile:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataProfileResultProfile'
          description: Output only. The profile information per field.
          readOnly: true
        rowCount:
          description: Output only. The count of rows scanned.
          format: int64
          readOnly: true
          type: string
        scannedData:
          $ref: '#/components/schemas/GoogleCloudDataplexV1ScannedData'
          description: Output only. The data scanned for this result.
          readOnly: true
      type: object
    GoogleCloudDataplexV1DataProfileResultPostScanActionsResult:
      description: The result of post scan actions of DataProfileScan job.
      id: GoogleCloudDataplexV1DataProfileResultPostScanActionsResult
      properties:
        bigqueryExportResult:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProfileResultPostScanActionsResultBigQueryExportResult
          description: Output only. The result of BigQuery export post scan action.
          readOnly: true
      type: object
    GoogleCloudDataplexV1DataProfileResultPostScanActionsResultBigQueryExportResult:
      description: The result of BigQuery export post scan action.
      id: >-
        GoogleCloudDataplexV1DataProfileResultPostScanActionsResultBigQueryExportResult
      properties:
        message:
          description: Output only. Additional information about the BigQuery exporting.
          readOnly: true
          type: string
        state:
          description: Output only. Execution state for the BigQuery exporting.
          enum:
            - STATE_UNSPECIFIED
            - SUCCEEDED
            - FAILED
            - SKIPPED
          enumDescriptions:
            - The exporting state is unspecified.
            - The exporting completed successfully.
            - The exporting is no longer running due to an error.
            - >-
              The exporting is skipped due to no valid scan result to export
              (usually caused by scan failed).
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataProfileResultProfile:
      description: Contains name, type, mode and field type specific profile information.
      id: GoogleCloudDataplexV1DataProfileResultProfile
      properties:
        fields:
          description: >-
            Output only. List of fields with structural and profile information
            for each field.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataProfileResultProfileField
          readOnly: true
          type: array
      type: object
    GoogleCloudDataplexV1DataProfileResultProfileField:
      description: A field within a table.
      id: GoogleCloudDataplexV1DataProfileResultProfileField
      properties:
        mode:
          description: >-
            Output only. The mode of the field. Possible values include:
            REQUIRED, if it is a required field. NULLABLE, if it is an optional
            field. REPEATED, if it is a repeated field.
          readOnly: true
          type: string
        name:
          description: Output only. The name of the field.
          readOnly: true
          type: string
        profile:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfo
          description: Output only. Profile information for the corresponding field.
          readOnly: true
        type:
          description: >-
            Output only. The data type retrieved from the schema of the data
            source. For instance, for a BigQuery native table, it is the
            BigQuery Table Schema
            (https://cloud.google.com/bigquery/docs/reference/rest/v2/tables#tablefieldschema).
            For a Dataplex Universal Catalog Entity, it is the Entity Schema
            (https://cloud.google.com/dataplex/docs/reference/rpc/google.cloud.dataplex.v1#type_3).
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfo:
      description: The profile information for each field type.
      id: GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfo
      properties:
        distinctRatio:
          description: >-
            Output only. Ratio of rows with distinct values against total
            scanned rows. Not available for complex non-groupable field type,
            including RECORD, ARRAY, GEOGRAPHY, and JSON, as well as fields with
            REPEATABLE mode.
          format: double
          readOnly: true
          type: number
        doubleProfile:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoDoubleFieldInfo
          description: Double type field information.
        integerProfile:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoIntegerFieldInfo
          description: Integer type field information.
        nullRatio:
          description: >-
            Output only. Ratio of rows with null value against total scanned
            rows.
          format: double
          readOnly: true
          type: number
        stringProfile:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoStringFieldInfo
          description: String type field information.
        topNValues:
          description: >-
            Output only. The list of top N non-null values, frequency and ratio
            with which they occur in the scanned data. N is 10 or equal to the
            number of distinct values in the field, whichever is smaller. Not
            available for complex non-groupable field type, including RECORD,
            ARRAY, GEOGRAPHY, and JSON, as well as fields with REPEATABLE mode.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoTopNValue
          readOnly: true
          type: array
      type: object
    GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoDoubleFieldInfo:
      description: The profile information for a double type field.
      id: >-
        GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoDoubleFieldInfo
      properties:
        average:
          description: >-
            Output only. Average of non-null values in the scanned data. NaN, if
            the field has a NaN.
          format: double
          readOnly: true
          type: number
        max:
          description: >-
            Output only. Maximum of non-null values in the scanned data. NaN, if
            the field has a NaN.
          format: double
          readOnly: true
          type: number
        min:
          description: >-
            Output only. Minimum of non-null values in the scanned data. NaN, if
            the field has a NaN.
          format: double
          readOnly: true
          type: number
        quartiles:
          description: >-
            Output only. A quartile divides the number of data points into four
            parts, or quarters, of more-or-less equal size. Three main quartiles
            used are: The first quartile (Q1) splits off the lowest 25% of data
            from the highest 75%. It is also known as the lower or 25th
            empirical quartile, as 25% of the data is below this point. The
            second quartile (Q2) is the median of a data set. So, 50% of the
            data lies below this point. The third quartile (Q3) splits off the
            highest 25% of data from the lowest 75%. It is known as the upper or
            75th empirical quartile, as 75% of the data lies below this point.
            Here, the quartiles is provided as an ordered list of quartile
            values for the scanned data, occurring in order Q1, median, Q3.
          items:
            format: double
            type: number
          readOnly: true
          type: array
        standardDeviation:
          description: >-
            Output only. Standard deviation of non-null values in the scanned
            data. NaN, if the field has a NaN.
          format: double
          readOnly: true
          type: number
      type: object
    GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoIntegerFieldInfo:
      description: The profile information for an integer type field.
      id: >-
        GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoIntegerFieldInfo
      properties:
        average:
          description: >-
            Output only. Average of non-null values in the scanned data. NaN, if
            the field has a NaN.
          format: double
          readOnly: true
          type: number
        max:
          description: >-
            Output only. Maximum of non-null values in the scanned data. NaN, if
            the field has a NaN.
          format: int64
          readOnly: true
          type: string
        min:
          description: >-
            Output only. Minimum of non-null values in the scanned data. NaN, if
            the field has a NaN.
          format: int64
          readOnly: true
          type: string
        quartiles:
          description: >-
            Output only. A quartile divides the number of data points into four
            parts, or quarters, of more-or-less equal size. Three main quartiles
            used are: The first quartile (Q1) splits off the lowest 25% of data
            from the highest 75%. It is also known as the lower or 25th
            empirical quartile, as 25% of the data is below this point. The
            second quartile (Q2) is the median of a data set. So, 50% of the
            data lies below this point. The third quartile (Q3) splits off the
            highest 25% of data from the lowest 75%. It is known as the upper or
            75th empirical quartile, as 75% of the data lies below this point.
            Here, the quartiles is provided as an ordered list of approximate
            quartile values for the scanned data, occurring in order Q1, median,
            Q3.
          items:
            format: int64
            type: string
          readOnly: true
          type: array
        standardDeviation:
          description: >-
            Output only. Standard deviation of non-null values in the scanned
            data. NaN, if the field has a NaN.
          format: double
          readOnly: true
          type: number
      type: object
    GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoStringFieldInfo:
      description: The profile information for a string type field.
      id: >-
        GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoStringFieldInfo
      properties:
        averageLength:
          description: Output only. Average length of non-null values in the scanned data.
          format: double
          readOnly: true
          type: number
        maxLength:
          description: Output only. Maximum length of non-null values in the scanned data.
          format: int64
          readOnly: true
          type: string
        minLength:
          description: Output only. Minimum length of non-null values in the scanned data.
          format: int64
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoTopNValue:
      description: Top N non-null values in the scanned data.
      id: GoogleCloudDataplexV1DataProfileResultProfileFieldProfileInfoTopNValue
      properties:
        count:
          description: Output only. Count of the corresponding value in the scanned data.
          format: int64
          readOnly: true
          type: string
        ratio:
          description: >-
            Output only. Ratio of the corresponding value in the field against
            the total number of rows in the scanned data.
          format: double
          readOnly: true
          type: number
        value:
          description: Output only. String value of a top N non-null value.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataProfileSpec:
      description: DataProfileScan related setting.
      id: GoogleCloudDataplexV1DataProfileSpec
      properties:
        catalogPublishingEnabled:
          description: >-
            Optional. If set, the latest DataScan job result will be published
            as Dataplex Universal Catalog metadata.
          type: boolean
        excludeFields:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProfileSpecSelectedFields
          description: >-
            Optional. The fields to exclude from data profile.If specified, the
            fields will be excluded from data profile, regardless of
            include_fields value.
        includeFields:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProfileSpecSelectedFields
          description: >-
            Optional. The fields to include in data profile.If not specified,
            all fields at the time of profile scan job execution are included,
            except for ones listed in exclude_fields.
        mode:
          description: Optional. The execution mode for the profile scan.
          enum:
            - MODE_UNSPECIFIED
            - STANDARD
            - LIGHTWEIGHT
          enumDescriptions:
            - Default value. This value is unused.
            - >-
              Performs standard profiling. The behavior is controlled by other
              fields such as sampling_percent, row_filter, and column filters.
              This mode allows for full scans or custom sampling.
            - >-
              Specifies lightweight profiling mode. This mode is optimized for
              low-latency, low-fidelity profiling.When this mode is selected,
              the following fields must not be set: sampling_percent,
              row_filter, include_fields, and exclude_fields.
          type: string
        postScanActions:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProfileSpecPostScanActions
          description: Optional. Actions to take upon job completion..
        rowFilter:
          description: >-
            Optional. A filter applied to all rows in a single DataScan job. The
            filter needs to be a valid SQL expression for a WHERE clause in
            BigQuery standard SQL syntax. Example: col1 >= 0 AND col2 < 10
          type: string
        samplingPercent:
          description: >-
            Optional. The percentage of the records to be selected from the
            dataset for DataScan. Value can range between 0.0 and 100.0 with up
            to 3 significant decimal digits. Sampling is not applied if
            sampling_percent is not specified, 0 or 100.
          format: float
          type: number
      type: object
    GoogleCloudDataplexV1DataProfileSpecPostScanActions:
      description: The configuration of post scan actions of DataProfileScan job.
      id: GoogleCloudDataplexV1DataProfileSpecPostScanActions
      properties:
        bigqueryExport:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataProfileSpecPostScanActionsBigQueryExport
          description: >-
            Optional. If set, results will be exported to the provided BigQuery
            table.
      type: object
    GoogleCloudDataplexV1DataProfileSpecPostScanActionsBigQueryExport:
      description: The configuration of BigQuery export post scan action.
      id: GoogleCloudDataplexV1DataProfileSpecPostScanActionsBigQueryExport
      properties:
        resultsTable:
          description: >-
            Optional. The BigQuery table to export DataProfileScan results to.
            Format:
            //bigquery.googleapis.com/projects/PROJECT_ID/datasets/DATASET_ID/tables/TABLE_ID
          type: string
      type: object
    GoogleCloudDataplexV1DataProfileSpecSelectedFields:
      description: The specification for fields to include or exclude in data profile scan.
      id: GoogleCloudDataplexV1DataProfileSpecSelectedFields
      properties:
        fieldNames:
          description: >-
            Optional. Expected input is a list of fully qualified names of
            fields as in the schema.Only top-level field names for nested fields
            are supported. For instance, if 'x' is of nested field type, listing
            'x' is supported but 'x.y.z' is not supported. Here 'y' and 'y.z'
            are nested fields of 'x'.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1DataQualityColumnResult:
      description: >-
        DataQualityColumnResult provides a more detailed, per-column view of the
        results.
      id: GoogleCloudDataplexV1DataQualityColumnResult
      properties:
        column:
          description: Output only. The column specified in the DataQualityRule.
          readOnly: true
          type: string
        dimensions:
          description: Output only. The dimension-level results for this column.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataQualityDimensionResult
          readOnly: true
          type: array
        passed:
          description: Output only. Whether the column passed or failed.
          readOnly: true
          type: boolean
        score:
          description: >-
            Output only. The column-level data quality score for this data scan
            job if and only if the 'column' field is set.The score ranges
            between between 0, 100 (up to two decimal points).
          format: float
          readOnly: true
          type: number
      type: object
    GoogleCloudDataplexV1DataQualityDimension:
      description: >-
        A dimension captures data quality intent about a defined subset of the
        rules specified.
      id: GoogleCloudDataplexV1DataQualityDimension
      properties:
        name:
          description: >-
            Output only. The dimension name a rule belongs to. Custom dimension
            name is supported with all uppercase letters and maximum length of
            30 characters.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityDimensionResult:
      description: >-
        DataQualityDimensionResult provides a more detailed, per-dimension view
        of the results.
      id: GoogleCloudDataplexV1DataQualityDimensionResult
      properties:
        dimension:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataQualityDimension'
          description: >-
            Output only. The dimension config specified in the DataQualitySpec,
            as is.
          readOnly: true
        passed:
          description: Output only. Whether the dimension passed or failed.
          readOnly: true
          type: boolean
        score:
          description: >-
            Output only. The dimension-level data quality score for this data
            scan job if and only if the 'dimension' field is set.The score
            ranges between 0, 100 (up to two decimal points).
          format: float
          readOnly: true
          type: number
      type: object
    GoogleCloudDataplexV1DataQualityResult:
      description: The output of a DataQualityScan.
      id: GoogleCloudDataplexV1DataQualityResult
      properties:
        anomalyDetectionGeneratedAssets:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityResultAnomalyDetectionGeneratedAssets
          description: Output only. The generated assets for anomaly detection.
          readOnly: true
        catalogPublishingStatus:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataScanCatalogPublishingStatus
          description: >-
            Output only. The status of publishing the data scan as Dataplex
            Universal Catalog metadata.
          readOnly: true
        columns:
          description: >-
            Output only. A list of results at the column level.A column will
            have a corresponding DataQualityColumnResult if and only if there is
            at least one rule with the 'column' field set to it.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1DataQualityColumnResult'
          readOnly: true
          type: array
        dimensions:
          description: >-
            Output only. A list of results at the dimension level.A dimension
            will have a corresponding DataQualityDimensionResult if and only if
            there is at least one rule with the 'dimension' field set to it.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataQualityDimensionResult
          readOnly: true
          type: array
        passed:
          description: >-
            Output only. Overall data quality result -- true if all rules
            passed.
          readOnly: true
          type: boolean
        postScanActionsResult:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityResultPostScanActionsResult
          description: Output only. The result of post scan actions.
          readOnly: true
        rowCount:
          description: Output only. The count of rows processed.
          format: int64
          readOnly: true
          type: string
        rules:
          description: Output only. A list of all the rules in a job, and their results.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1DataQualityRuleResult'
          readOnly: true
          type: array
        scannedData:
          $ref: '#/components/schemas/GoogleCloudDataplexV1ScannedData'
          description: Output only. The data scanned for this result.
          readOnly: true
        score:
          description: >-
            Output only. The overall data quality score.The score ranges between
            0, 100 (up to two decimal points).
          format: float
          readOnly: true
          type: number
      type: object
    GoogleCloudDataplexV1DataQualityResultAnomalyDetectionGeneratedAssets:
      description: The assets generated by Anomaly Detection Data Scan.
      id: GoogleCloudDataplexV1DataQualityResultAnomalyDetectionGeneratedAssets
      properties:
        dataIntermediateTable:
          description: >-
            Output only. The intermediate table for data anomaly detection.
            Format: PROJECT_ID.DATASET_ID.TABLE_ID
          readOnly: true
          type: string
        freshnessIntermediateTable:
          description: >-
            Output only. The intermediate table for freshness anomaly detection.
            Format: PROJECT_ID.DATASET_ID.TABLE_ID
          readOnly: true
          type: string
        resultTable:
          description: >-
            Output only. The result table for anomaly detection. Format:
            PROJECT_ID.DATASET_ID.TABLE_ID If the result table is set at
            AnomalyDetectionAssets, the result table here would be the same as
            the one set in the AnomalyDetectionAssets.result_table.
          readOnly: true
          type: string
        volumeIntermediateTable:
          description: >-
            Output only. The intermediate table for volume anomaly detection.
            Format: PROJECT_ID.DATASET_ID.TABLE_ID
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityResultPostScanActionsResult:
      description: The result of post scan actions of DataQualityScan job.
      id: GoogleCloudDataplexV1DataQualityResultPostScanActionsResult
      properties:
        bigqueryExportResult:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityResultPostScanActionsResultBigQueryExportResult
          description: Output only. The result of BigQuery export post scan action.
          readOnly: true
      type: object
    GoogleCloudDataplexV1DataQualityResultPostScanActionsResultBigQueryExportResult:
      description: The result of BigQuery export post scan action.
      id: >-
        GoogleCloudDataplexV1DataQualityResultPostScanActionsResultBigQueryExportResult
      properties:
        message:
          description: Output only. Additional information about the BigQuery exporting.
          readOnly: true
          type: string
        state:
          description: Output only. Execution state for the BigQuery exporting.
          enum:
            - STATE_UNSPECIFIED
            - SUCCEEDED
            - FAILED
            - SKIPPED
          enumDescriptions:
            - The exporting state is unspecified.
            - The exporting completed successfully.
            - The exporting is no longer running due to an error.
            - >-
              The exporting is skipped due to no valid scan result to export
              (usually caused by scan failed).
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRule:
      description: A rule captures data quality intent about a data source.
      id: GoogleCloudDataplexV1DataQualityRule
      properties:
        attributes:
          additionalProperties:
            type: string
          description: >-
            Optional. Map of attribute name and value linked to the rule. The
            rules to evaluate can be filtered based on attributes provided here
            and a filter expression provided in the DataQualitySpec.filter
            field.
          type: object
        column:
          description: Optional. The unnested column which this rule is evaluated against.
          type: string
        debugQueries:
          description: >-
            Optional. Specifies the debug queries for this rule. Currently, only
            one query is supported, but this may be expanded in the future.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataQualityRuleDebugQuery
          type: array
        description:
          description: >-
            Optional. Description of the rule. The maximum length is 1,024
            characters.
          type: string
        dimension:
          description: >-
            Optional. The dimension a rule belongs to. Results are also
            aggregated at the dimension level. Custom dimension name is
            supported with all uppercase letters and maximum length of 30
            characters.
          type: string
        ignoreNull:
          description: >-
            Optional. Rows with null values will automatically fail a rule,
            unless ignore_null is true. In that case, such null rows are
            trivially considered passing.This field is only valid for the
            following type of rules: RangeExpectation RegexExpectation
            SetExpectation UniquenessExpectation
          type: boolean
        name:
          description: >-
            Optional. A mutable name for the rule. The name must contain only
            letters (a-z, A-Z), numbers (0-9), or hyphens (-). The maximum
            length is 63 characters. Must start with a letter. Must end with a
            number or a letter.
          type: string
        nonNullExpectation:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleNonNullExpectation
          description: Row-level rule which evaluates whether each column value is null.
        rangeExpectation:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleRangeExpectation
          description: >-
            Row-level rule which evaluates whether each column value lies
            between a specified range.
        regexExpectation:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleRegexExpectation
          description: >-
            Row-level rule which evaluates whether each column value matches a
            specified regex.
        rowConditionExpectation:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleRowConditionExpectation
          description: >-
            Row-level rule which evaluates whether each row in a table passes
            the specified condition.
        ruleSource:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataQualityRuleRuleSource'
          description: >-
            Output only. Contains information about the source of the rule and
            its relationship with the BigQuery table, where applicable.
          readOnly: true
        setExpectation:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleSetExpectation
          description: >-
            Row-level rule which evaluates whether each column value is
            contained by a specified set.
        sqlAssertion:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleSqlAssertion
          description: >-
            Aggregate rule which evaluates the number of rows returned for the
            provided statement. If any rows are returned, this rule fails.
        statisticRangeExpectation:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleStatisticRangeExpectation
          description: >-
            Aggregate rule which evaluates whether the column aggregate
            statistic lies between a specified range.
        suspended:
          description: Optional. Whether the Rule is active or suspended. Default is false.
          type: boolean
        tableConditionExpectation:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleTableConditionExpectation
          description: >-
            Aggregate rule which evaluates whether the provided expression is
            true for a table.
        templateReference:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleTemplateReference
          description: >-
            Aggregate rule which references a rule template and provides the
            parameters to be substituted in the template. If any rows are
            returned, this rule fails.
        threshold:
          description: >-
            Optional. The minimum ratio of passing_rows / total_rows required to
            pass this rule, with a range of 0.0, 1.0.0 indicates default value
            (i.e. 1.0).This field is only valid for row-level type rules.
          format: double
          type: number
        uniquenessExpectation:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleUniquenessExpectation
          description: Row-level rule which evaluates whether each column value is unique.
      type: object
    GoogleCloudDataplexV1DataQualityRuleDebugQuery:
      description: >-
        Specifies a SQL statement that is evaluated to return up to 10 scalar
        values that are used to debug rules. If the rule fails, the values can
        help diagnose the cause of the failure.The SQL statement must use
        GoogleSQL syntax
        (https://cloud.google.com/bigquery/docs/reference/standard-sql/query-syntax),
        and must not contain any semicolons.You can use the data reference
        parameter ${data()} to reference the source table with all of its
        precondition filters applied. Examples of precondition filters include
        row filters, incremental data filters, and sampling. For more
        information, see Data reference parameter
        (https://cloud.google.com/dataplex/docs/auto-data-quality-overview#data-reference-parameter).You
        can also name results with an explicit alias using [AS] alias. For more
        information, see BigQuery explicit aliases
        (https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/query-syntax#explicit_alias_syntax).Example:
        SELECT MIN(col1) AS min_col1, MAX(col1) AS max_col1 FROM ${data()}
      id: GoogleCloudDataplexV1DataQualityRuleDebugQuery
      properties:
        description:
          description: >-
            Optional. Specifies the description of the debug query. The maximum
            length is 1,024 characters.
          type: string
        sqlStatement:
          description: Required. Specifies the SQL statement to be executed.
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleNonNullExpectation:
      description: Evaluates whether each column value is null.
      id: GoogleCloudDataplexV1DataQualityRuleNonNullExpectation
      properties: {}
      type: object
    GoogleCloudDataplexV1DataQualityRuleRangeExpectation:
      description: Evaluates whether each column value lies between a specified range.
      id: GoogleCloudDataplexV1DataQualityRuleRangeExpectation
      properties:
        maxValue:
          description: >-
            Optional. The maximum column value allowed for a row to pass this
            validation. At least one of min_value and max_value need to be
            provided.
          type: string
        minValue:
          description: >-
            Optional. The minimum column value allowed for a row to pass this
            validation. At least one of min_value and max_value need to be
            provided.
          type: string
        strictMaxEnabled:
          description: >-
            Optional. Whether each value needs to be strictly lesser than ('<')
            the maximum, or if equality is allowed.Only relevant if a max_value
            has been defined. Default = false.
          type: boolean
        strictMinEnabled:
          description: >-
            Optional. Whether each value needs to be strictly greater than ('>')
            the minimum, or if equality is allowed.Only relevant if a min_value
            has been defined. Default = false.
          type: boolean
      type: object
    GoogleCloudDataplexV1DataQualityRuleRegexExpectation:
      description: Evaluates whether each column value matches a specified regex.
      id: GoogleCloudDataplexV1DataQualityRuleRegexExpectation
      properties:
        regex:
          description: >-
            Optional. A regular expression the column value is expected to
            match.
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleResult:
      description: >-
        DataQualityRuleResult provides a more detailed, per-rule view of the
        results.
      id: GoogleCloudDataplexV1DataQualityRuleResult
      properties:
        assertionRowCount:
          description: >-
            Output only. The number of rows returned by the SQL statement in a
            SQL assertion rule.This field is only valid for SQL assertion rules.
          format: int64
          readOnly: true
          type: string
        debugQueriesResultSets:
          description: >-
            Output only. Contains the results of all debug queries for this
            rule. The number of result sets will correspond to the number of
            debug_queries.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataQualityRuleResultDebugQueryResultSet
          readOnly: true
          type: array
        evaluatedCount:
          description: >-
            Output only. The number of rows a rule was evaluated against.This
            field is only valid for row-level type rules.Evaluated count can be
            configured to either include all rows (default) - with null rows
            automatically failing rule evaluation, or exclude null rows from the
            evaluated_count, by setting ignore_nulls = true.This field is not
            set for rule SqlAssertion.
          format: int64
          readOnly: true
          type: string
        failingRowsQuery:
          description: >-
            Output only. The query to find rows that did not pass this rule.This
            field is only valid for row-level type rules.
          readOnly: true
          type: string
        nullCount:
          description: >-
            Output only. The number of rows with null values in the specified
            column.
          format: int64
          readOnly: true
          type: string
        passRatio:
          description: >-
            Output only. The ratio of passed_count / evaluated_count.This field
            is only valid for row-level type rules.
          format: double
          readOnly: true
          type: number
        passed:
          description: Output only. Whether the rule passed or failed.
          readOnly: true
          type: boolean
        passedCount:
          description: >-
            Output only. The number of rows which passed a rule evaluation.This
            field is only valid for row-level type rules.This field is not set
            for rule SqlAssertion.
          format: int64
          readOnly: true
          type: string
        rule:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataQualityRule'
          description: Output only. The rule specified in the DataQualitySpec, as is.
          readOnly: true
      type: object
    GoogleCloudDataplexV1DataQualityRuleResultDebugQueryResult:
      description: Contains a single result from the debug query.
      id: GoogleCloudDataplexV1DataQualityRuleResultDebugQueryResult
      properties:
        name:
          description: >-
            Specifies the name of the result. Available if provided with an
            explicit alias using [AS] alias.
          type: string
        type:
          description: >-
            Indicates the data type of the result. For more information, see
            BigQuery data types
            (https://cloud.google.com/bigquery/docs/reference/standard-sql/data-types).
          type: string
        value:
          description: Represents the value of the result as a string.
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleResultDebugQueryResultSet:
      description: Contains all results from a debug query.
      id: GoogleCloudDataplexV1DataQualityRuleResultDebugQueryResultSet
      properties:
        results:
          description: Output only. Contains all results. Up to 10 results can be returned.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataQualityRuleResultDebugQueryResult
          readOnly: true
          type: array
      type: object
    GoogleCloudDataplexV1DataQualityRuleRowConditionExpectation:
      description: >-
        Evaluates whether each row passes the specified condition.The SQL
        expression needs to use GoogleSQL syntax
        (https://cloud.google.com/bigquery/docs/reference/standard-sql/query-syntax)
        and should produce a boolean value per row as the result.Example: col1
        >= 0 AND col2 < 10
      id: GoogleCloudDataplexV1DataQualityRuleRowConditionExpectation
      properties:
        sqlExpression:
          description: Optional. The SQL expression.
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleRuleSource:
      description: Represents the rule source information from Catalog.
      id: GoogleCloudDataplexV1DataQualityRuleRuleSource
      properties:
        rulePathElements:
          description: >-
            Output only. Rule path elements represent information about the
            individual items in the relationship path between the scan resource
            and rule origin in that order.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataQualityRuleRuleSourceRulePathElement
          readOnly: true
          type: array
      type: object
    GoogleCloudDataplexV1DataQualityRuleRuleSourceRulePathElement:
      description: >-
        Path Element represents the direct relationship between the rule origin
        (aspects) to the BigQuery Entry. Ordering of the rule relationship will
        be maintained such that the first entry in the list is the closest
        ancestor (BigQuery table itself). A blank source denotes that the rule
        is derived directly from the DataScan itself.
      id: GoogleCloudDataplexV1DataQualityRuleRuleSourceRulePathElement
      properties:
        entryLinkSource:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleRuleSourceRulePathElementEntryLinkSource
          description: >-
            Output only. Entry link source represents information about the
            entry link.
          readOnly: true
        entrySource:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualityRuleRuleSourceRulePathElementEntrySource
          description: >-
            Output only. Entry source represents information about the related
            source entry.
          readOnly: true
      type: object
    GoogleCloudDataplexV1DataQualityRuleRuleSourceRulePathElementEntryLinkSource:
      description: Entry link source represents information about the entry link.
      id: >-
        GoogleCloudDataplexV1DataQualityRuleRuleSourceRulePathElementEntryLinkSource
      properties:
        entryLink:
          description: >-
            Output only. The entry link name in the form of:
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}/entryLinks/{entry_link_id}
          readOnly: true
          type: string
        entryLinkType:
          description: >-
            Output only. The entry link type to represent the current
            relationship between the entry and the next entry in the path. In
            the form of:
            projects/{project_id_or_number}/locations/{location_id}/entryLinkTypes/{entry_link_type_id}
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleRuleSourceRulePathElementEntrySource:
      description: Entry source represents information about the related source entry.
      id: GoogleCloudDataplexV1DataQualityRuleRuleSourceRulePathElementEntrySource
      properties:
        displayName:
          description: Output only. The display name of the entry.
          readOnly: true
          type: string
        entry:
          description: >-
            Output only. The entry name in the form of:
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}/entries/{entry_id}
          readOnly: true
          type: string
        entryType:
          description: >-
            Output only. The entry type to represent the current characteristics
            of the entry in the form of:
            projects/{project_id_or_number}/locations/{location_id}/entryTypes/{entry-type-id}.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleSetExpectation:
      description: Evaluates whether each column value is contained by a specified set.
      id: GoogleCloudDataplexV1DataQualityRuleSetExpectation
      properties:
        values:
          description: Optional. Expected values for the column value.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1DataQualityRuleSqlAssertion:
      description: >-
        A SQL statement that is evaluated to return rows that match an invalid
        state. If any rows are are returned, this rule fails.The SQL statement
        must use GoogleSQL syntax
        (https://cloud.google.com/bigquery/docs/reference/standard-sql/query-syntax),
        and must not contain any semicolons.You can use the data reference
        parameter ${data()} to reference the source table with all of its
        precondition filters applied. Examples of precondition filters include
        row filters, incremental data filters, and sampling. For more
        information, see Data reference parameter
        (https://cloud.google.com/dataplex/docs/auto-data-quality-overview#data-reference-parameter).Example:
        SELECT * FROM ${data()} WHERE price < 0
      id: GoogleCloudDataplexV1DataQualityRuleSqlAssertion
      properties:
        sqlStatement:
          description: Optional. The SQL statement.
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleStatisticRangeExpectation:
      description: >-
        Evaluates whether the column aggregate statistic lies between a
        specified range.
      id: GoogleCloudDataplexV1DataQualityRuleStatisticRangeExpectation
      properties:
        maxValue:
          description: >-
            Optional. The maximum column statistic value allowed for a row to
            pass this validation.At least one of min_value and max_value need to
            be provided.
          type: string
        minValue:
          description: >-
            Optional. The minimum column statistic value allowed for a row to
            pass this validation.At least one of min_value and max_value need to
            be provided.
          type: string
        statistic:
          description: Optional. The aggregate metric to evaluate.
          enum:
            - STATISTIC_UNDEFINED
            - MEAN
            - MIN
            - MAX
          enumDescriptions:
            - Unspecified statistic type
            - Evaluate the column mean
            - Evaluate the column min
            - Evaluate the column max
          type: string
        strictMaxEnabled:
          description: >-
            Optional. Whether column statistic needs to be strictly lesser than
            ('<') the maximum, or if equality is allowed.Only relevant if a
            max_value has been defined. Default = false.
          type: boolean
        strictMinEnabled:
          description: >-
            Optional. Whether column statistic needs to be strictly greater than
            ('>') the minimum, or if equality is allowed.Only relevant if a
            min_value has been defined. Default = false.
          type: boolean
      type: object
    GoogleCloudDataplexV1DataQualityRuleTableConditionExpectation:
      description: >-
        Evaluates whether the provided expression is true.The SQL expression
        needs to use GoogleSQL syntax
        (https://cloud.google.com/bigquery/docs/reference/standard-sql/query-syntax)
        and should produce a scalar boolean result.Example: MIN(col1) >= 0
      id: GoogleCloudDataplexV1DataQualityRuleTableConditionExpectation
      properties:
        sqlExpression:
          description: Optional. The SQL expression.
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleTemplate:
      description: >-
        DataQualityRuleTemplate represents a template which can be reused across
        multiple data quality rules.
      id: GoogleCloudDataplexV1DataQualityRuleTemplate
      properties:
        capabilities:
          description: >-
            Output only. A list of features or properties supported by this rule
            template.
          items:
            type: string
          readOnly: true
          type: array
        dimension:
          description: >-
            Output only. The dimension a rule template belongs to. Rule level
            results are also aggregated at the dimension level.
          readOnly: true
          type: string
        inputParameters:
          additionalProperties:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataQualityRuleTemplateParameterDescription
          description: Output only. Description for input parameters
          readOnly: true
          type: object
        name:
          description: >-
            Output only. The name of the rule template in the format:
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}/entries/{entry_id}
          readOnly: true
          type: string
        sqlCollection:
          description: >-
            Output only. Collection of SQLs for data quality rules. Currently
            only one SQL is supported.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataQualityRuleTemplateSql
          readOnly: true
          type: array
      type: object
    GoogleCloudDataplexV1DataQualityRuleTemplateParameterDescription:
      description: >-
        Description of the input parameter. It can include the type(s) supported
        by the parameter and intended usage. It is for information purposes only
        and does not affect the behavior of the rule template.
      id: GoogleCloudDataplexV1DataQualityRuleTemplateParameterDescription
      properties:
        defaultValue:
          description: >-
            Output only. The default value for the parameter if no value is
            provided.
          readOnly: true
          type: string
        description:
          description: >-
            Output only. Description of the input parameter. It can include the
            type(s) supported by the parameter and intended usage. It is for
            information purposes only and does not affect the behavior of the
            rule template.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleTemplateReference:
      description: >-
        A rule that constructs a SQL statement to evaluate using a rule template
        and parameter values. If the constructed statement returns any rows,
        this rule fails
      id: GoogleCloudDataplexV1DataQualityRuleTemplateReference
      properties:
        name:
          description: >-
            Required. The template entry name. Entry must be of EntryType
            projects/dataplex-types/locations/global/entryTypes/data-quality-rule-template
            and contains top-level aspect of AspectType
            projects/dataplex-types/locations/global/aspectTypes/data-quality-rule-template.
            The format is:
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}/entries/{entry_id}
          type: string
        resolvedSql:
          description: >-
            Output only. The resolved SQL statement generated from the template
            with parameters substituted. It is only populated in the result.
          readOnly: true
          type: string
        ruleTemplate:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataQualityRuleTemplate'
          description: >-
            Output only. The rule template used to resolve the rule. It is only
            populated in the result.
          readOnly: true
        values:
          additionalProperties:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataQualityRuleTemplateReferenceParameterValue
          description: >-
            Optional. Provides the map of parameter name and value. The maximum
            size of the field is 120KB (encoded as UTF-8).
          type: object
      type: object
    GoogleCloudDataplexV1DataQualityRuleTemplateReferenceParameterValue:
      description: Represents a parameter value.
      id: GoogleCloudDataplexV1DataQualityRuleTemplateReferenceParameterValue
      properties:
        value:
          description: Required. Represents the string value of the parameter.
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleTemplateSql:
      description: >-
        Templatized SQL query for data quality rules. It can have parameters
        that can be substituted with values when a rule is created using this
        template.
      id: GoogleCloudDataplexV1DataQualityRuleTemplateSql
      properties:
        query:
          description: Output only. Templatized SQL query for data quality rules.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataQualityRuleUniquenessExpectation:
      description: Evaluates whether the column has duplicates.
      id: GoogleCloudDataplexV1DataQualityRuleUniquenessExpectation
      properties: {}
      type: object
    GoogleCloudDataplexV1DataQualityScanRuleResult:
      description: >-
        Information about the result of a data quality rule for data quality
        scan. The monitored resource is 'DataScan'.
      id: GoogleCloudDataplexV1DataQualityScanRuleResult
      properties:
        assertionRowCount:
          description: >-
            The number of rows returned by the SQL statement in a SQL assertion
            rule. This field is only valid for SQL assertion rules.
          format: int64
          type: string
        column:
          description: The column which this rule is evaluated against.
          type: string
        dataSource:
          description: The data source of the data scan (e.g. BigQuery table name).
          type: string
        evaluatedRowCount:
          description: >-
            The number of rows evaluated against the data quality rule. This
            field is only valid for rules of PER_ROW evaluation type.
          format: int64
          type: string
        evalutionType:
          description: The evaluation type of the data quality rule.
          enum:
            - EVALUATION_TYPE_UNSPECIFIED
            - PER_ROW
            - AGGREGATE
          enumDescriptions:
            - An unspecified evaluation type.
            - The rule evaluation is done at per row level.
            - The rule evaluation is done for an aggregate of rows.
          type: string
        jobId:
          description: Identifier of the specific data scan job this log entry is for.
          type: string
        nullRowCount:
          description: The number of rows with null values in the specified column.
          format: int64
          type: string
        passedRowCount:
          description: >-
            The number of rows which passed a rule evaluation. This field is
            only valid for rules of PER_ROW evaluation type.
          format: int64
          type: string
        result:
          description: The result of the data quality rule.
          enum:
            - RESULT_UNSPECIFIED
            - PASSED
            - FAILED
          enumDescriptions:
            - An unspecified result.
            - The data quality rule passed.
            - The data quality rule failed.
          type: string
        ruleDimension:
          description: The dimension of the data quality rule.
          type: string
        ruleName:
          description: The name of the data quality rule.
          type: string
        ruleType:
          description: The type of the data quality rule.
          enum:
            - RULE_TYPE_UNSPECIFIED
            - NON_NULL_EXPECTATION
            - RANGE_EXPECTATION
            - REGEX_EXPECTATION
            - ROW_CONDITION_EXPECTATION
            - SET_EXPECTATION
            - STATISTIC_RANGE_EXPECTATION
            - TABLE_CONDITION_EXPECTATION
            - UNIQUENESS_EXPECTATION
            - SQL_ASSERTION
            - TEMPLATE_REFERENCE
          enumDescriptions:
            - An unspecified rule type.
            - See DataQualityRule.NonNullExpectation.
            - See DataQualityRule.RangeExpectation.
            - See DataQualityRule.RegexExpectation.
            - See DataQualityRule.RowConditionExpectation.
            - See DataQualityRule.SetExpectation.
            - See DataQualityRule.StatisticRangeExpectation.
            - See DataQualityRule.TableConditionExpectation.
            - See DataQualityRule.UniquenessExpectation.
            - See DataQualityRule.SqlAssertion.
            - See DataQualityRule.TemplateReference.
          type: string
        thresholdPercent:
          description: The passing threshold (0.0, 100.0) of the data quality rule.
          format: double
          type: number
      type: object
    GoogleCloudDataplexV1DataQualitySpec:
      description: DataQualityScan related setting.
      id: GoogleCloudDataplexV1DataQualitySpec
      properties:
        catalogPublishingEnabled:
          description: >-
            Optional. If set, the latest DataScan job result will be published
            as Dataplex Universal Catalog metadata.
          type: boolean
        enableCatalogBasedRules:
          description: >-
            Optional. If enabled, the data scan will retrieve rules defined in
            the dataplex-types.global.data-rules aspect on all paths of the
            catalog entry corresponding to the BigQuery table resource and all
            attached glossary terms. The path that data-rules aspect is attached
            on the table entry defines the column that the rule will be
            evaluated against. For glossary terms, the path that the terms are
            attached on the table entry defines the column that the rule will be
            evaluated against. At the start of scan execution, the rules reflect
            the latest state retrieved from the catalog entry and any updates on
            the rules thereafter are ignored for that execution. The updates
            will be reflected from the next execution. Rules defined in the
            datascan must be empty if this field is enabled.
          type: boolean
        filter:
          description: >-
            Optional. Filter for selectively running a subset of rules. You can
            filter the request by the name or attribute key-value pairs defined
            on the rule. If not specified, all rules are run. The filter is
            applicable to both, the rules retrieved from catalog and explicitly
            defined rules in the scan. Please see filter syntax
            (https://docs.cloud.google.com/dataplex/docs/auto-data-quality-overview#rule-filtering)
            for more details.
          type: string
        postScanActions:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualitySpecPostScanActions
          description: Optional. Actions to take upon job completion.
        rowFilter:
          description: >-
            Optional. A filter applied to all rows in a single DataScan job. The
            filter needs to be a valid SQL expression for a WHERE clause in
            GoogleSQL syntax
            (https://cloud.google.com/bigquery/docs/reference/standard-sql/query-syntax#where_clause).Example:
            col1 >= 0 AND col2 < 10
          type: string
        rules:
          description: >-
            Required. The list of rules to evaluate against a data source. At
            least one rule is required.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1DataQualityRule'
          type: array
        samplingPercent:
          description: >-
            Optional. The percentage of the records to be selected from the
            dataset for DataScan. Value can range between 0.0 and 100.0 with up
            to 3 significant decimal digits. Sampling is not applied if
            sampling_percent is not specified, 0 or 100.
          format: float
          type: number
      type: object
    GoogleCloudDataplexV1DataQualitySpecPostScanActions:
      description: The configuration of post scan actions of DataQualityScan.
      id: GoogleCloudDataplexV1DataQualitySpecPostScanActions
      properties:
        bigqueryExport:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualitySpecPostScanActionsBigQueryExport
          description: >-
            Optional. If set, results will be exported to the provided BigQuery
            table.
        notificationReport:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualitySpecPostScanActionsNotificationReport
          description: >-
            Optional. If set, results will be sent to the provided notification
            receipts upon triggers.
      type: object
    GoogleCloudDataplexV1DataQualitySpecPostScanActionsBigQueryExport:
      description: The configuration of BigQuery export post scan action.
      id: GoogleCloudDataplexV1DataQualitySpecPostScanActionsBigQueryExport
      properties:
        resultsTable:
          description: >-
            Optional. The BigQuery table to export DataQualityScan results to.
            Format:
            //bigquery.googleapis.com/projects/PROJECT_ID/datasets/DATASET_ID/tables/TABLE_ID
            or projects/PROJECT_ID/datasets/DATASET_ID/tables/TABLE_ID
          type: string
      type: object
    GoogleCloudDataplexV1DataQualitySpecPostScanActionsJobEndTrigger:
      description: >-
        This trigger is triggered whenever a scan job run ends, regardless of
        the result.
      id: GoogleCloudDataplexV1DataQualitySpecPostScanActionsJobEndTrigger
      properties: {}
      type: object
    GoogleCloudDataplexV1DataQualitySpecPostScanActionsJobFailureTrigger:
      description: >-
        This trigger is triggered when the scan job itself fails, regardless of
        the result.
      id: GoogleCloudDataplexV1DataQualitySpecPostScanActionsJobFailureTrigger
      properties: {}
      type: object
    GoogleCloudDataplexV1DataQualitySpecPostScanActionsNotificationReport:
      description: The configuration of notification report post scan action.
      id: GoogleCloudDataplexV1DataQualitySpecPostScanActionsNotificationReport
      properties:
        jobEndTrigger:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualitySpecPostScanActionsJobEndTrigger
          description: Optional. If set, report will be sent when a scan job ends.
        jobFailureTrigger:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualitySpecPostScanActionsJobFailureTrigger
          description: Optional. If set, report will be sent when a scan job fails.
        recipients:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualitySpecPostScanActionsRecipients
          description: Required. The recipients who will receive the notification report.
        scoreThresholdTrigger:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataQualitySpecPostScanActionsScoreThresholdTrigger
          description: Optional. If set, report will be sent when score threshold is met.
      type: object
    GoogleCloudDataplexV1DataQualitySpecPostScanActionsRecipients:
      description: >-
        The individuals or groups who are designated to receive notifications
        upon triggers.
      id: GoogleCloudDataplexV1DataQualitySpecPostScanActionsRecipients
      properties:
        emails:
          description: >-
            Optional. The email recipients who will receive the DataQualityScan
            results report.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1DataQualitySpecPostScanActionsScoreThresholdTrigger:
      description: >-
        This trigger is triggered when the DQ score in the job result is less
        than a specified input score.
      id: GoogleCloudDataplexV1DataQualitySpecPostScanActionsScoreThresholdTrigger
      properties:
        scoreThreshold:
          description: Optional. The score range is in 0,100.
          format: float
          type: number
      type: object
    GoogleCloudDataplexV1DataScan:
      description: >-
        Represents a user-visible job which provides the insights for the
        related data source.For example: Data quality: generates queries based
        on the rules and runs against the data to get data quality check
        results. For more information, see Auto data quality overview
        (https://cloud.google.com/dataplex/docs/auto-data-quality-overview).
        Data profile: analyzes the data in tables and generates insights about
        the structure, content and relationships (such as null percent,
        cardinality, min/max/mean, etc). For more information, see About data
        profiling
        (https://cloud.google.com/dataplex/docs/data-profiling-overview). Data
        discovery: scans data in Cloud Storage buckets to extract and then
        catalog metadata. For more information, see Discover and catalog Cloud
        Storage data
        (https://cloud.google.com/bigquery/docs/automatic-discovery). Data
        documentation: analyzes the table or dataset metadata and generates
        insights. For tables, insights include descriptions and sample SQL
        queries. For datasets, insights include descriptions, schema
        relationships and sample SQL queries. For more information, see Generate
        data insights in BigQuery
        (https://cloud.google.com/bigquery/docs/data-insights).
      id: GoogleCloudDataplexV1DataScan
      properties:
        createTime:
          description: Output only. The time when the scan was created.
          format: google-datetime
          readOnly: true
          type: string
        data:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataSource'
          description: Required. The data source for DataScan.
        dataDiscoveryResult:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataDiscoveryResult'
          description: Output only. The result of a data discovery scan.
          readOnly: true
        dataDiscoverySpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataDiscoverySpec'
          description: Settings for a data discovery scan.
        dataDocumentationResult:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataDocumentationResult'
          description: Output only. The result of a data documentation scan.
          readOnly: true
        dataDocumentationSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataDocumentationSpec'
          description: Settings for a data documentation scan.
        dataProfileResult:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataProfileResult'
          description: Output only. The result of a data profile scan.
          readOnly: true
        dataProfileSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataProfileSpec'
          description: Settings for a data profile scan.
        dataQualityResult:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataQualityResult'
          description: Output only. The result of a data quality scan.
          readOnly: true
        dataQualitySpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataQualitySpec'
          description: Settings for a data quality scan.
        description:
          description: >-
            Optional. Description of the scan. Must be between 1-1024
            characters.
          type: string
        displayName:
          description: >-
            Optional. User friendly display name. Must be between 1-256
            characters.
          type: string
        executionIdentity:
          $ref: '#/components/schemas/GoogleCloudDataplexV1ExecutionIdentity'
          description: >-
            Optional. Immutable. The identity to run the datascan. If not
            specified, defaults to the Dataplex Service Agent.
        executionSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataScanExecutionSpec'
          description: >-
            Optional. DataScan execution settings.If not specified, the fields
            in it will use their default values.
        executionStatus:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataScanExecutionStatus'
          description: Output only. Status of the data scan execution.
          readOnly: true
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels for the scan.
          type: object
        name:
          description: >-
            Output only. Identifier. The relative resource name of the scan, of
            the form:
            projects/{project}/locations/{location_id}/dataScans/{datascan_id},
            where project refers to a project_id or project_number and
            location_id refers to a Google Cloud region.
          readOnly: true
          type: string
        state:
          description: Output only. Current state of the DataScan.
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - CREATING
            - DELETING
            - ACTION_REQUIRED
          enumDescriptions:
            - State is not specified.
            - Resource is active, i.e., ready to use.
            - Resource is under creation.
            - Resource is under deletion.
            - Resource is active but has unresolved actions.
          readOnly: true
          type: string
        type:
          description: Output only. The type of DataScan.
          enum:
            - DATA_SCAN_TYPE_UNSPECIFIED
            - DATA_QUALITY
            - DATA_PROFILE
            - DATA_DISCOVERY
            - DATA_DOCUMENTATION
            - UNSTRUCTURED_DATA_PROFILE
          enumDescriptions:
            - The data scan type is unspecified.
            - Data quality scan.
            - Data profile scan.
            - Data discovery scan.
            - Data documentation scan.
            - Unstructured data profile scan.
          readOnly: true
          type: string
        uid:
          description: >-
            Output only. System generated globally unique ID for the scan. This
            ID will be different if the scan is deleted and re-created with the
            same name.
          readOnly: true
          type: string
        unstructuredDataProfileResult:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1UnstructuredDataProfileResult
          description: Output only. The result of an unstructured data profile scan.
          readOnly: true
        unstructuredDataProfileSpec:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1UnstructuredDataProfileSpec
          description: Optional. Settings for an unstructured data profile scan.
        updateTime:
          description: Output only. The time when the scan was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataScanCatalogPublishingStatus:
      description: >-
        The status of publishing the data scan result as Dataplex Universal
        Catalog metadata. Multiple DataScan log events may exist, each with
        different publishing information depending on the type of publishing
        triggered.
      id: GoogleCloudDataplexV1DataScanCatalogPublishingStatus
      properties:
        state:
          description: Output only. Execution state for publishing.
          enum:
            - STATE_UNSPECIFIED
            - SUCCEEDED
            - FAILED
            - SKIPPED
          enumDescriptions:
            - The publishing state is unspecified.
            - Publishing to catalog completed successfully.
            - Publish to catalog failed.
            - Publishing to catalog was skipped.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataScanEvent:
      description: >-
        These messages contain information about the execution of a datascan.
        The monitored resource is 'DataScan'
      id: GoogleCloudDataplexV1DataScanEvent
      properties:
        catalogPublishingStatus:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataScanCatalogPublishingStatus
          description: >-
            The status of publishing the data scan as Dataplex Universal Catalog
            metadata.
        createTime:
          description: The time when the data scan job was created.
          format: google-datetime
          type: string
        dataProfile:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataScanEventDataProfileResult
          description: Data profile result for data profile type data scan.
        dataProfileConfigs:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataScanEventDataProfileAppliedConfigs
          description: Applied configs for data profile type data scan.
        dataQuality:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataScanEventDataQualityResult
          description: Data quality result for data quality type data scan.
        dataQualityConfigs:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataScanEventDataQualityAppliedConfigs
          description: Applied configs for data quality type data scan.
        dataSource:
          description: The data source of the data scan
          type: string
        endTime:
          description: The time when the data scan job finished.
          format: google-datetime
          type: string
        jobId:
          description: The identifier of the specific data scan job this log entry is for.
          type: string
        message:
          description: The message describing the data scan job event.
          type: string
        postScanActionsResult:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DataScanEventPostScanActionsResult
          description: The result of post scan actions.
        scope:
          description: The scope of the data scan (e.g. full, incremental).
          enum:
            - SCOPE_UNSPECIFIED
            - FULL
            - INCREMENTAL
          enumDescriptions:
            - An unspecified scope type.
            - Data scan runs on all of the data.
            - Data scan runs on incremental data.
          type: string
        specVersion:
          description: A version identifier of the spec which was used to execute this job.
          type: string
        startTime:
          description: The time when the data scan job started to run.
          format: google-datetime
          type: string
        state:
          description: The status of the data scan job.
          enum:
            - STATE_UNSPECIFIED
            - STARTED
            - SUCCEEDED
            - FAILED
            - CANCELLED
            - CREATED
          enumDescriptions:
            - Unspecified job state.
            - Data scan job started.
            - Data scan job successfully completed.
            - Data scan job was unsuccessful.
            - Data scan job was cancelled.
            - Data scan job was created.
          type: string
        trigger:
          description: The trigger type of the data scan job.
          enum:
            - TRIGGER_UNSPECIFIED
            - ON_DEMAND
            - SCHEDULE
            - ONE_TIME
          enumDescriptions:
            - An unspecified trigger type.
            - Data scan triggers on demand.
            - Data scan triggers as per schedule.
            - Data scan is run one time on creation.
          type: string
        type:
          description: The type of the data scan.
          enum:
            - SCAN_TYPE_UNSPECIFIED
            - DATA_PROFILE
            - DATA_QUALITY
            - DATA_DISCOVERY
          enumDescriptions:
            - An unspecified data scan type.
            - Data scan for data profile.
            - Data scan for data quality.
            - Data scan for data discovery.
          type: string
      type: object
    GoogleCloudDataplexV1DataScanEventDataProfileAppliedConfigs:
      description: Applied configs for data profile type data scan job.
      id: GoogleCloudDataplexV1DataScanEventDataProfileAppliedConfigs
      properties:
        columnFilterApplied:
          description: >-
            Boolean indicating whether a column filter was applied in the
            DataScan job.
          type: boolean
        rowFilterApplied:
          description: >-
            Boolean indicating whether a row filter was applied in the DataScan
            job.
          type: boolean
        samplingPercent:
          description: >-
            The percentage of the records selected from the dataset for
            DataScan. Value ranges between 0.0 and 100.0. Value 0.0 or 100.0
            imply that sampling was not applied.
          format: float
          type: number
      type: object
    GoogleCloudDataplexV1DataScanEventDataProfileResult:
      description: Data profile result for data scan job.
      id: GoogleCloudDataplexV1DataScanEventDataProfileResult
      properties:
        rowCount:
          description: The count of rows processed in the data scan job.
          format: int64
          type: string
      type: object
    GoogleCloudDataplexV1DataScanEventDataQualityAppliedConfigs:
      description: Applied configs for data quality type data scan job.
      id: GoogleCloudDataplexV1DataScanEventDataQualityAppliedConfigs
      properties:
        rowFilterApplied:
          description: >-
            Boolean indicating whether a row filter was applied in the DataScan
            job.
          type: boolean
        samplingPercent:
          description: >-
            The percentage of the records selected from the dataset for
            DataScan. Value ranges between 0.0 and 100.0. Value 0.0 or 100.0
            imply that sampling was not applied.
          format: float
          type: number
      type: object
    GoogleCloudDataplexV1DataScanEventDataQualityResult:
      description: Data quality result for data scan job.
      id: GoogleCloudDataplexV1DataScanEventDataQualityResult
      properties:
        columnScore:
          additionalProperties:
            format: float
            type: number
          description: >-
            The score of each column scanned in the data scan job. The key of
            the map is the name of the column. The value is the data quality
            score for the column.The score ranges between 0, 100 (up to two
            decimal points).
          type: object
        dimensionPassed:
          additionalProperties:
            type: boolean
          description: >-
            The result of each dimension for data quality result. The key of the
            map is the name of the dimension. The value is the bool value
            depicting whether the dimension result was pass or not.
          type: object
        dimensionScore:
          additionalProperties:
            format: float
            type: number
          description: >-
            The score of each dimension for data quality result. The key of the
            map is the name of the dimension. The value is the data quality
            score for the dimension.The score ranges between 0, 100 (up to two
            decimal points).
          type: object
        passed:
          description: Whether the data quality result was pass or not.
          type: boolean
        rowCount:
          description: The count of rows processed in the data scan job.
          format: int64
          type: string
        score:
          description: >-
            The table-level data quality score for the data scan job.The data
            quality score ranges between 0, 100 (up to two decimal points).
          format: float
          type: number
      type: object
    GoogleCloudDataplexV1DataScanEventPostScanActionsResult:
      description: Post scan actions result for data scan job.
      id: GoogleCloudDataplexV1DataScanEventPostScanActionsResult
      properties:
