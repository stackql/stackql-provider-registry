          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1GraphProfileEdgeTypeExtractionHints
          description: Output only. Extraction hints for the edge.
          readOnly: true
        fields:
          description: Output only. Fields of the edge type.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1GraphProfileField'
