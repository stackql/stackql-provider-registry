    GoogleCloudDataplexV1GraphProfileEdgeTypeForeignKey:
      description: Represents a foreign key constraint.
      id: GoogleCloudDataplexV1GraphProfileEdgeTypeForeignKey
      properties:
        description:
          description: Output only. Description of the foreign key.
          readOnly: true
          type: string
        fieldMappings:
          description: >-
            Output only. Field Mappings. Mappings between local fields and the
            fields they reference in the referenced node type.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1GraphProfileEdgeTypeForeignKeyFieldMapping
          readOnly: true
          type: array
        name:
          description: Output only. Name of the foreign key constraint.
          readOnly: true
          type: string
        referencedNodeType:
          description: Output only. The node type this constraint references.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1GraphProfileEdgeTypeForeignKeyFieldMapping:
      description: Maps a local field to a referenced field.
      id: GoogleCloudDataplexV1GraphProfileEdgeTypeForeignKeyFieldMapping
      properties:
        field:
          description: Output only. Local field name forming part of the foreign key.
          readOnly: true
          type: string
        referencedField:
          description: Output only. Field name in the referenced node type.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1GraphProfileField:
      description: Represents a field in a node or edge type.
      id: GoogleCloudDataplexV1GraphProfileField
      properties:
        dataType:
          description: >-
            Output only. The data type of the field, e.g., STRING, INTEGER,
            DATE.
          readOnly: true
          type: string
        description:
          description: Output only. Description of the field.
          readOnly: true
          type: string
        extractionHints:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1GraphProfileFieldExtractionHints
          description: Output only. Extraction hints for the field.
          readOnly: true
        fields:
          description: Output only. Sub-fields of this field (for STRUCT types).
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1GraphProfileField'
          readOnly: true
          type: array
        metadataType:
          description: Output only. The mapped metadata type.
          enum:
            - METADATA_TYPE_UNSPECIFIED
            - BOOLEAN
            - NUMBER
            - STRING
            - BYTES
            - DATETIME
            - TIMESTAMP
            - GEOSPATIAL
            - STRUCT
            - OTHER
          enumDescriptions:
            - Unspecified metadata type.
            - Boolean type.
            - Numeric type.
            - String type.
            - Bytes type.
            - Date and time type.
            - Timestamp type.
            - Geospatial type.
            - Struct (record) type.
            - Other types not covered above.
          readOnly: true
          type: string
        mode:
          description: Output only. The mode of the field.
          enum:
            - MODE_UNSPECIFIED
            - NULLABLE
            - REPEATED
            - REQUIRED
          enumDescriptions:
            - Unspecified mode.
            - Field can be null.
            - Field can be repeated.
            - Field is required.
          readOnly: true
          type: string
        name:
          description: Output only. Name of the field.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1GraphProfileFieldExtractionHints:
      description: Extraction hints (field-level).
      id: GoogleCloudDataplexV1GraphProfileFieldExtractionHints
      properties:
        normalization:
          description: >-
            Output only. Standardizes extracted data (e.g., to ISO 3166-1
            alpha-2).
          readOnly: true
          type: string
        synthesis:
          description: >-
            Output only. Generates value from other data instead of direct
            extraction (e.g., hashing).
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1GraphProfileNodeType:
      description: Represents a type of node in the graph.
      id: GoogleCloudDataplexV1GraphProfileNodeType
      properties:
        description:
          description: Output only. Description of the node type.
          readOnly: true
          type: string
        extractionHints:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1GraphProfileNodeTypeExtractionHints
          description: Output only. Extraction hints for the node.
          readOnly: true
        fields:
          description: Output only. Fields of the node type.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1GraphProfileField'
          readOnly: true
          type: array
        name:
          description: Output only. Name of the node type.
          readOnly: true
          type: string
        primaryKeys:
          description: >-
            Output only. Field names forming the primary keys. The order in this
            array defines the key's ordinal positions for composite keys.
          items:
            type: string
          readOnly: true
          type: array
      type: object
    GoogleCloudDataplexV1GraphProfileNodeTypeExtractionHints:
      description: Extraction hints (node-level).
      id: GoogleCloudDataplexV1GraphProfileNodeTypeExtractionHints
      properties:
        cardinality:
          description: >-
            Output only. Expected occurrence frequency of this node type within
            a document. Format: "Bounds - Description" Example: "0:N - A
            document may contain multiple people names."
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1ImportItem:
      description: >-
        An object that describes the values that you want to set for an entry
        and its attached aspects when you import metadata. Used when you run a
        metadata import job. See CreateMetadataJob.You provide a collection of
        import items in a metadata import file. For more information about how
        to create a metadata import file, see Metadata import file
        (https://cloud.google.com/dataplex/docs/import-metadata#metadata-import-file).
      id: GoogleCloudDataplexV1ImportItem
      properties:
        aspectKeys:
          description: >-
            The aspects to modify. Supports the following syntaxes:
            {aspect_type_reference}: matches aspects that belong to the
            specified aspect type and are attached directly to the entry.
            {aspect_type_reference}@{path}: matches aspects that belong to the
            specified aspect type and path. {aspect_type_reference}@* : matches
            aspects of the given type for all paths. *@path : matches aspects of
            all types on the given path.Replace {aspect_type_reference} with a
            reference to the aspect type, in the format
            {project_id_or_number}.{location_id}.{aspect_type_id}.In FULL entry
            sync mode, if you leave this field empty, it is treated as
            specifying exactly those aspects that are present within the
            specified entry. Dataplex Universal Catalog implicitly adds the keys
            for all of the required aspects of an entry.
          items:
            type: string
          type: array
        entry:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Entry'
          description: Information about an entry and its attached aspects.
        entryLink:
          $ref: '#/components/schemas/GoogleCloudDataplexV1EntryLink'
          description: >-
            Information about the entry link. User should provide either one of
            the entry or entry_link. While providing entry_link, user should not
            provide update_mask and aspect_keys.
        updateMask:
          description: >-
            The fields to update, in paths that are relative to the Entry
            resource. Separate each field with a comma.In FULL entry sync mode,
            Dataplex Universal Catalog includes the paths of all of the fields
            for an entry that can be modified, including aspects. This means
            that Dataplex Universal Catalog replaces the existing entry with the
            entry in the metadata import file. All modifiable fields are
            updated, regardless of the fields that are listed in the update
            mask, and regardless of whether a field is present in the entry
            object.The update_mask field is ignored when an entry is created or
            re-created.In an aspect-only metadata job (when entry sync mode is
            NONE), set this value to aspects.Dataplex Universal Catalog also
            determines which entries and aspects to modify by comparing the
            values and timestamps that you provide in the metadata import file
            with the values and timestamps that exist in your project. For more
            information, see Comparison logic
            (https://cloud.google.com/dataplex/docs/import-metadata#data-modification-logic).
          format: google-fieldmask
          type: string
      type: object
    GoogleCloudDataplexV1Job:
      description: A job represents an instance of a task.
      id: GoogleCloudDataplexV1Job
      properties:
        endTime:
          description: Output only. The time when the job ended.
          format: google-datetime
          readOnly: true
          type: string
        executionSpec:
          $ref: '#/components/schemas/GoogleCloudDataplexV1TaskExecutionSpec'
          description: Output only. Spec related to how a task is executed.
          readOnly: true
        labels:
          additionalProperties:
            type: string
          description: Output only. User-defined labels for the task.
          readOnly: true
          type: object
        message:
          description: Output only. Additional information about the current state.
          readOnly: true
          type: string
        name:
          description: >-
            Output only. The relative resource name of the job, of the form:
            projects/{project_number}/locations/{location_id}/lakes/{lake_id}/tasks/{task_id}/jobs/{job_id}.
          readOnly: true
          type: string
        retryCount:
          description: >-
            Output only. The number of times the job has been retried (excluding
            the initial attempt).
          format: uint32
          readOnly: true
          type: integer
        service:
          description: Output only. The underlying service running a job.
          enum:
            - SERVICE_UNSPECIFIED
            - DATAPROC
          enumDescriptions:
            - Service used to run the job is unspecified.
            - Dataproc service is used to run this job.
          readOnly: true
          type: string
        serviceJob:
          description: >-
            Output only. The full resource name for the job run under a
            particular service.
          readOnly: true
          type: string
        startTime:
          description: Output only. The time when the job was started.
          format: google-datetime
          readOnly: true
          type: string
        state:
          description: Output only. Execution state for the job.
          enum:
            - STATE_UNSPECIFIED
            - RUNNING
            - CANCELLING
            - CANCELLED
            - SUCCEEDED
            - FAILED
            - ABORTED
          enumDescriptions:
            - The job state is unknown.
            - The job is running.
            - The job is cancelling.
            - The job cancellation was successful.
            - The job completed successfully.
            - The job is no longer running due to an error.
            - The job was cancelled outside of Dataplex Universal Catalog.
          readOnly: true
          type: string
        trigger:
          description: Output only. Job execution trigger.
          enum:
            - TRIGGER_UNSPECIFIED
            - TASK_CONFIG
            - RUN_REQUEST
          enumDescriptions:
            - The trigger is unspecified.
            - >-
              The job was triggered by Dataplex Universal Catalog based on
              trigger spec from task definition.
            - The job was triggered by the explicit call of Task API.
          readOnly: true
          type: string
        uid:
          description: Output only. System generated globally unique ID for the job.
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1JobEvent:
      description: >-
        The payload associated with Job logs that contains events describing
        jobs that have run within a Lake.
      id: GoogleCloudDataplexV1JobEvent
      properties:
        endTime:
          description: The time when the job ended running.
          format: google-datetime
          type: string
        executionTrigger:
          description: Job execution trigger.
          enum:
            - EXECUTION_TRIGGER_UNSPECIFIED
            - TASK_CONFIG
            - RUN_REQUEST
          enumDescriptions:
            - The job execution trigger is unspecified.
            - >-
              The job was triggered by Dataplex Universal Catalog based on
              trigger spec from task definition.
            - The job was triggered by the explicit call of Task API.
          type: string
        jobId:
          description: The unique id identifying the job.
          type: string
        message:
          description: The log message.
          type: string
        retries:
          description: The number of retries.
          format: int32
          type: integer
        service:
          description: The service used to execute the job.
          enum:
            - SERVICE_UNSPECIFIED
            - DATAPROC
          enumDescriptions:
            - Unspecified service.
            - Cloud Dataproc.
          type: string
        serviceJob:
          description: The reference to the job within the service.
          type: string
        startTime:
          description: The time when the job started running.
          format: google-datetime
          type: string
        state:
          description: The job state on completion.
          enum:
            - STATE_UNSPECIFIED
            - SUCCEEDED
            - FAILED
            - CANCELLED
            - ABORTED
          enumDescriptions:
            - Unspecified job state.
            - Job successfully completed.
            - Job was unsuccessful.
            - Job was cancelled by the user.
            - Job was cancelled or aborted via the service executing the job.
          type: string
        type:
          description: The type of the job.
          enum:
            - TYPE_UNSPECIFIED
            - SPARK
            - NOTEBOOK
          enumDescriptions:
            - Unspecified job type.
            - Spark jobs.
            - Notebook jobs.
          type: string
      type: object
    GoogleCloudDataplexV1Lake:
      description: >-
        A lake is a centralized repository for managing enterprise data across
        the organization distributed across many cloud projects, and stored in a
        variety of storage services such as Google Cloud Storage and BigQuery.
        The resources attached to a lake are referred to as managed resources.
        Data within these managed resources can be structured or unstructured. A
        lake provides data admins with tools to organize, secure and manage
        their data at scale, and provides data scientists and data engineers an
        integrated experience to easily search, discover, analyze and transform
        data and associated metadata.
      id: GoogleCloudDataplexV1Lake
      properties:
        assetStatus:
          $ref: '#/components/schemas/GoogleCloudDataplexV1AssetStatus'
          description: Output only. Aggregated status of the underlying assets of the lake.
          readOnly: true
        createTime:
          description: Output only. The time when the lake was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the lake.
          type: string
        displayName:
          description: Optional. User friendly display name.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels for the lake.
          type: object
        metastore:
          $ref: '#/components/schemas/GoogleCloudDataplexV1LakeMetastore'
          description: >-
            Optional. Settings to manage lake and Dataproc Metastore service
            instance association.
        metastoreStatus:
          $ref: '#/components/schemas/GoogleCloudDataplexV1LakeMetastoreStatus'
          description: Output only. Metastore status of the lake.
          readOnly: true
        name:
          description: >-
            Output only. The relative resource name of the lake, of the form:
            projects/{project_number}/locations/{location_id}/lakes/{lake_id}.
          readOnly: true
          type: string
        serviceAccount:
          description: >-
            Output only. Service account associated with this lake. This service
            account must be authorized to access or operate on resources managed
            by the lake.
          readOnly: true
          type: string
        state:
          description: Output only. Current state of the lake.
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - CREATING
            - DELETING
            - ACTION_REQUIRED
          enumDescriptions:
            - State is not specified.
            - Resource is active, i.e., ready to use.
            - Resource is under creation.
            - Resource is under deletion.
            - Resource is active but has unresolved actions.
          readOnly: true
          type: string
        uid:
          description: >-
            Output only. System generated globally unique ID for the lake. This
            ID will be different if the lake is deleted and re-created with the
            same name.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the lake was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
