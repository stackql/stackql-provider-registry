    GoogleCloudDataplexV1ChangeRequest:
      description: Represents a proposed change to a metadata resource.
      id: GoogleCloudDataplexV1ChangeRequest
      properties:
        approver:
          description: >-
            Output only. The email address of the user who approved/rejected the
            ChangeRequest.
          readOnly: true
          type: string
        author:
          description: >-
            Output only. The email address of the user who created the
            ChangeRequest.
          readOnly: true
          type: string
        changeType:
          description: >-
            Output only. The type of change represented by the change_payload.
            This field is derived from the populated field in the change_payload
            oneof.
          enum:
            - CHANGE_TYPE_UNSPECIFIED
            - CREATE_ENTRY
            - UPDATE_ENTRY
            - DELETE_ENTRY
            - CREATE_ENTRY_LINK
            - DELETE_ENTRY_LINK
            - CREATE_GLOSSARY
            - UPDATE_GLOSSARY
            - DELETE_GLOSSARY
            - CREATE_GLOSSARY_CATEGORY
            - UPDATE_GLOSSARY_CATEGORY
            - DELETE_GLOSSARY_CATEGORY
            - CREATE_GLOSSARY_TERM
            - UPDATE_GLOSSARY_TERM
            - DELETE_GLOSSARY_TERM
            - REQUEST_DATA_PRODUCT_ACCESS
          enumDescriptions:
            - State unspecified.
            - Request to create an Entry.
            - Request to update an Entry.
            - Request to delete an Entry.
            - Request to create an EntryLink.
            - Request to delete an EntryLink.
            - Request to create a Glossary.
            - Request to update a Glossary.
            - Request to delete a Glossary.
            - Request to create a GlossaryCategory.
            - Request to update a GlossaryCategory.
            - Request to delete a GlossaryCategory.
            - Request to create a GlossaryTerm.
            - Request to update a GlossaryTerm.
            - Request to delete a GlossaryTerm.
            - Request to request Data Product access.
          readOnly: true
          type: string
        createEntry:
          $ref: '#/components/schemas/GoogleCloudDataplexV1CreateEntryRequest'
          description: Payload for creating an Entry.
        createEntryLink:
          $ref: '#/components/schemas/GoogleCloudDataplexV1CreateEntryLinkRequest'
          description: Payload for creating an EntryLink.
        createGlossary:
          $ref: '#/components/schemas/GoogleCloudDataplexV1CreateGlossaryRequest'
          description: Payload for creating a Glossary.
        createGlossaryCategory:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1CreateGlossaryCategoryRequest
          description: Payload for creating a GlossaryCategory.
        createGlossaryTerm:
          $ref: '#/components/schemas/GoogleCloudDataplexV1CreateGlossaryTermRequest'
          description: Payload for creating a GlossaryTerm.
        createTime:
          description: Output only. The time when the ChangeRequest was created.
          format: google-datetime
          readOnly: true
          type: string
        dataProductAccessRequest:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DataProductAccessRequest'
          description: Payload for Data Product access request.
        deleteEntry:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DeleteEntryRequest'
          description: Payload for deleting an Entry.
        deleteEntryLink:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DeleteEntryLinkRequest'
          description: Payload for deleting an EntryLink.
        deleteGlossary:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DeleteGlossaryRequest'
          description: Payload for deleting a Glossary.
        deleteGlossaryCategory:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1DeleteGlossaryCategoryRequest
          description: Payload for deleting a GlossaryCategory.
        deleteGlossaryTerm:
          $ref: '#/components/schemas/GoogleCloudDataplexV1DeleteGlossaryTermRequest'
          description: Payload for deleting a GlossaryTerm.
        etag:
          description: >-
            Optional. This checksum is computed by the service. It can be sent
            on update and delete requests to ensure the client has an up-to-date
            value before proceeding.
          type: string
        justification:
          description: >-
            Optional. Justification of the ChangeRequest. This should explain
            why the change is needed or why it should be approved.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. User-defined labels for the ChangeRequest.
          type: object
        name:
          description: >-
            Identifier. The relative resource name of the ChangeRequest, of the
            form:
            projects/{project_number}/locations/{location_id}/changeRequests/{change_request_id}
          type: string
        rejectionComment:
          description: Output only. The reason provided for rejecting the ChangeRequest.
          readOnly: true
          type: string
        resource:
          description: >-
            Output only. The full resource name of the target resource to be
            modified. Example:
            //dataplex.googleapis.com/projects/my-project/locations/us-central1/entryGroups/my-group/entries/my-entry
          readOnly: true
          type: string
        reviewerComment:
          description: >-
            Output only. The comment provided by the reviewer when approving or
            rejecting the ChangeRequest. Maximum length is 1024 characters.
          readOnly: true
          type: string
        state:
          description: Output only. The current state of the ChangeRequest.
          enum:
            - STATE_UNSPECIFIED
            - NEW
            - APPROVED
            - REJECTED
            - EXPIRED
            - REVOKED
          enumDescriptions:
            - State unspecified.
            - The change is proposed and new.
            - The change has been approved.
            - The change has been rejected.
            - The change request has expired.
            - The approved change has been revoked.
          readOnly: true
          type: string
        uid:
          description: >-
            Output only. System generated globally unique ID for the
            ChangeRequest.
          readOnly: true
          type: string
        updateEntry:
          $ref: '#/components/schemas/GoogleCloudDataplexV1UpdateEntryRequest'
          description: Payload for updating an Entry.
        updateGlossary:
          $ref: '#/components/schemas/GoogleCloudDataplexV1UpdateGlossaryRequest'
          description: Payload for updating a Glossary.
        updateGlossaryCategory:
          $ref: >-
            #/components/schemas/GoogleCloudDataplexV1UpdateGlossaryCategoryRequest
          description: Payload for updating a GlossaryCategory.
        updateGlossaryTerm:
          $ref: '#/components/schemas/GoogleCloudDataplexV1UpdateGlossaryTermRequest'
          description: Payload for updating a GlossaryTerm.
        updateTime:
          description: Output only. The time when the ChangeRequest was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1ContactIdentity:
      description: Identity of a business contact.
      id: GoogleCloudDataplexV1ContactIdentity
      properties:
        contactId:
          description: Optional. Email ID or freeform ID of the Contact person.
          type: string
        contactName:
          description: >-
            Required. Name of the contact person for the Data Domain;
            unvalidated freeform text.
          type: string
        contactRole:
          description: >-
            Required. Designation of the person i.e. Data Steward or Data
            Analyst. Example values: owner, steward, producer, admin.
          type: string
      type: object
    GoogleCloudDataplexV1Contacts:
      description: >-
        Business contacts part of business context of a Data Domain. Corresponds
        to the Contacts Aspect in Dataplex Universal Catalog.
      id: GoogleCloudDataplexV1Contacts
      properties:
        identities:
          description: Required. Identities of the business contacts.
          items:
            $ref: '#/components/schemas/GoogleCloudDataplexV1ContactIdentity'
          type: array
      type: object
    GoogleCloudDataplexV1CreateEntryLinkRequest:
      description: Request message for CreateEntryLink.
      id: GoogleCloudDataplexV1CreateEntryLinkRequest
      properties:
        entryLink:
          $ref: '#/components/schemas/GoogleCloudDataplexV1EntryLink'
          description: Required. Entry Link resource.
        entryLinkId:
          description: >-
            Required. Entry Link identifier * Must contain only lowercase
            letters, numbers and hyphens. * Must start with a letter. * Must be
            between 1-63 characters. * Must end with a number or a letter. *
            Must be unique within the EntryGroup.
          type: string
        parent:
          description: >-
            Required. The resource name of the parent Entry Group:
            projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}.
          type: string
      type: object
    GoogleCloudDataplexV1CreateEntryRequest:
      description: Create Entry request.
      id: GoogleCloudDataplexV1CreateEntryRequest
      properties:
        entry:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Entry'
          description: Required. Entry resource.
        entryId:
          description: >-
            Required. Entry identifier. It has to be unique within an Entry
            Group.Entries corresponding to Google Cloud resources use an Entry
            ID format based on full resource names
            (https://cloud.google.com/apis/design/resource_names#full_resource_name).
            The format is a full resource name of the resource without the
            prefix double slashes in the API service name part of the full
            resource name. This allows retrieval of entries using their
            associated resource name.For example, if the full resource name of a
            resource is //library.googleapis.com/shelves/shelf1/books/book2,
            then the suggested entry_id is
            library.googleapis.com/shelves/shelf1/books/book2.It is also
            suggested to follow the same convention for entries corresponding to
            resources from providers or systems other than Google Cloud.The
            maximum size of the field is 4000 characters.
          type: string
        parent:
          description: >-
            Required. The resource name of the parent Entry Group:
            projects/{project}/locations/{location}/entryGroups/{entry_group}.
          type: string
      type: object
    GoogleCloudDataplexV1CreateGlossaryCategoryRequest:
      description: Creates a new GlossaryCategory under the specified Glossary.
      id: GoogleCloudDataplexV1CreateGlossaryCategoryRequest
      properties:
        category:
          $ref: '#/components/schemas/GoogleCloudDataplexV1GlossaryCategory'
          description: Required. The GlossaryCategory to create.
        categoryId:
          description: Required. GlossaryCategory identifier.
          type: string
        parent:
          description: >-
            Required. The parent resource where this GlossaryCategory will be
            created. Format:
            projects/{project_id_or_number}/locations/{location_id}/glossaries/{glossary_id}
            where locationId refers to a Google Cloud region.
          type: string
      type: object
    GoogleCloudDataplexV1CreateGlossaryRequest:
      description: Create Glossary Request
      id: GoogleCloudDataplexV1CreateGlossaryRequest
      properties:
        glossary:
          $ref: '#/components/schemas/GoogleCloudDataplexV1Glossary'
          description: Required. The Glossary to create.
        glossaryId:
          description: 'Required. Glossary ID: Glossary identifier.'
          type: string
        parent:
          description: >-
            Required. The parent resource where this Glossary will be created.
            Format: projects/{project_id_or_number}/locations/{location_id}
            where location_id refers to a Google Cloud region.
          type: string
        validateOnly:
          description: >-
            Optional. Validates the request without actually creating the
            Glossary. Default: false.
          type: boolean
      type: object
    GoogleCloudDataplexV1CreateGlossaryTermRequest:
      description: Creates a new GlossaryTerm under the specified Glossary.
      id: GoogleCloudDataplexV1CreateGlossaryTermRequest
      properties:
        parent:
          description: >-
            Required. The parent resource where the GlossaryTerm will be
            created. Format:
            projects/{project_id_or_number}/locations/{location_id}/glossaries/{glossary_id}
            where location_id refers to a Google Cloud region.
          type: string
        term:
          $ref: '#/components/schemas/GoogleCloudDataplexV1GlossaryTerm'
          description: Required. The GlossaryTerm to create.
        termId:
          description: Required. GlossaryTerm identifier.
          type: string
      type: object
    GoogleCloudDataplexV1DataAccessSpec:
      description: >-
        DataAccessSpec holds the access control configuration to be enforced on
        data stored within resources (eg: rows, columns in BigQuery Tables).
        When associated with data, the data is only accessible to principals
        explicitly granted access through the DataAccessSpec. Principals with
        access to the containing resource are not implicitly granted access.
      id: GoogleCloudDataplexV1DataAccessSpec
      properties:
        readers:
          description: >-
            Optional. The format of strings follows the pattern followed by IAM
            in the bindings. user:{email}, serviceAccount:{email} group:{email}.
            The set of principals to be granted reader role on data stored
            within resources.
          items:
            type: string
          type: array
      type: object
    GoogleCloudDataplexV1DataAsset:
      description: >-
        Represents a data asset resource that can be packaged and shared via a
        data product.
      id: GoogleCloudDataplexV1DataAsset
      properties:
        accessGroupConfigs:
          additionalProperties:
            $ref: >-
              #/components/schemas/GoogleCloudDataplexV1DataAssetAccessGroupConfig
          description: >-
            Optional. Access groups configurations for this data asset.The key
            is DataProduct.AccessGroup.id and the value is
            AccessGroupConfig.Example: { "analyst": { "iamRoles":
            ["roles/bigquery.dataViewer"] } } Currently, at most one IAM role is
            allowed per access group. For providing multiple predefined IAM
            roles, wrap them in a custom IAM role as per
            https://cloud.google.com/iam/docs/creating-custom-roles.
          type: object
        createTime:
          description: Output only. The time at which the data asset was created.
          format: google-datetime
          readOnly: true
          type: string
        etag:
          description: >-
            Optional. This checksum is computed by the server based on the value
            of other fields, and may be sent on update and delete requests to
            ensure the client has an up-to-date value before proceeding.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. User-defined labels for the data asset.Example: {
            "environment": "production", "billing": "marketing-department" } 
          type: object
        name:
          description: >-
            Identifier. Resource name of the data asset. Format:
            projects/{project_id_or_number}/locations/{location_id}/dataProducts/{data_product_id}/dataAssets/{data_asset_id}
          type: string
        resource:
          description: >-
            Required. Immutable. Full resource name of the cloud resource
            represented by the data asset. This must follow
            https://cloud.google.com/iam/docs/full-resource-names. Example:
            //bigquery.googleapis.com/projects/my_project_123/datasets/dataset_456/tables/table_789
            Only BigQuery tables and datasets are currently supported. Data
            asset creator must have getIamPolicy and setIamPolicy permissions on
            the resource. Data asset creator must also have resource specific
            get permission, for instance, bigquery.tables.get for BigQuery
            tables.
          type: string
        uid:
          description: >-
            Output only. System generated globally unique ID for the data asset.
            This ID will be different if the data asset is deleted and
            re-created with the same name.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time at which the data asset was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudDataplexV1DataAssetAccessGroupConfig:
      description: Configuration for access group inherited from the parent data product.
      id: GoogleCloudDataplexV1DataAssetAccessGroupConfig
      properties:
        iamRoles:
          description: >-
            Optional. IAM roles granted on the resource to this access group.
            Role name follows
            https://cloud.google.com/iam/docs/reference/rest/v1/roles.Example: [
            "roles/bigquery.dataViewer" ]
          items:
            type: string
          type: array
      type: object
