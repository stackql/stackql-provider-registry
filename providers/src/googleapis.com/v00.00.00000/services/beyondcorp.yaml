      id: GoogleCloudBeyondcorpAppconnectionsV1ListAppConnectionsResponse
      properties:
        appConnections:
          description: A list of BeyondCorp AppConnections in the project.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudBeyondcorpAppconnectionsV1AppConnection
          type: array
        nextPageToken:
          description: >-
            A token to retrieve the next page of results, or empty if there are
