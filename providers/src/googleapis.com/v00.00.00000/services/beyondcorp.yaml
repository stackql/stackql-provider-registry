    GoogleCloudBeyondcorpAppconnectionsV1ResolveAppConnectionsResponseAppConnectionDetails:
      description: Details of the AppConnection.
      id: >-
        GoogleCloudBeyondcorpAppconnectionsV1ResolveAppConnectionsResponseAppConnectionDetails
      properties:
        appConnection:
          $ref: >-
            #/components/schemas/GoogleCloudBeyondcorpAppconnectionsV1AppConnection
          description: A BeyondCorp AppConnection in the project.
        recentMigVms:
          description: >-
            If type=GCP_REGIONAL_MIG, contains most recent VM instances, like
            `https://www.googleapis.com/compute/v1/projects/{project_id}/zones/{zone_id}/instances/{instance_id}`.
          items:
            type: string
          type: array
      type: object
    GoogleCloudBeyondcorpAppconnectionsV1alphaAppConnectionOperationMetadata:
