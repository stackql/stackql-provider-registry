    GoogleCloudBeyondcorpAppconnectorsV1AppConnector:
      description: >-
        A BeyondCorp connector resource that represents an application facing
        component deployed proximal to and with direct access to the application
        instances. It is used to establish connectivity between the remote
        enterprise environment and GCP. It initiates connections to the
        applications and can proxy the data from users over the connection.
      id: GoogleCloudBeyondcorpAppconnectorsV1AppConnector
      properties:
        createTime:
          description: Output only. Timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        displayName:
          description: >-
            Optional. An arbitrary user-provided name for the AppConnector.
            Cannot exceed 64 characters.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Resource labels to represent user provided metadata.
          type: object
        name:
          description: >-
            Required. Unique resource name of the AppConnector. The name is
            ignored when creating a AppConnector.
          type: string
        principalInfo:
          $ref: >-
            #/components/schemas/GoogleCloudBeyondcorpAppconnectorsV1AppConnectorPrincipalInfo
          description: >-
            Required. Principal information about the Identity of the
            AppConnector.
        resourceInfo:
          $ref: >-
            #/components/schemas/GoogleCloudBeyondcorpAppconnectorsV1ResourceInfo
          description: Optional. Resource info of the connector.
        state:
          description: Output only. The current state of the AppConnector.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - CREATED
            - UPDATING
            - DELETING
            - DOWN
          enumDescriptions:
            - Default value. This value is unused.
            - AppConnector is being created.
            - AppConnector has been created.
            - AppConnector's configuration is being updated.
            - AppConnector is being deleted.
            - >-
              AppConnector is down and may be restored in the future. This
              happens when CCFE sends ProjectState = OFF.
          readOnly: true
          type: string
        uid:
          description: >-
            Output only. A unique identifier for the instance generated by the
            system.
          readOnly: true
          type: string
        updateTime:
          description: Output only. Timestamp when the resource was last modified.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudBeyondcorpAppconnectorsV1AppConnectorInstanceConfig:
      description: >-
        AppConnectorInstanceConfig defines the instance config of a
        AppConnector.
      id: GoogleCloudBeyondcorpAppconnectorsV1AppConnectorInstanceConfig
      properties:
        imageConfig:
          $ref: '#/components/schemas/GoogleCloudBeyondcorpAppconnectorsV1ImageConfig'
          description: >-
            ImageConfig defines the GCR images to run for the remote agent's
            control plane.
        instanceConfig:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: The SLM instance agent configuration.
          type: object
        notificationConfig:
          $ref: >-
            #/components/schemas/GoogleCloudBeyondcorpAppconnectorsV1NotificationConfig
          description: >-
            NotificationConfig defines the notification mechanism that the
            remote instance should subscribe to in order to receive
            notification.
        sequenceNumber:
          description: >-
            Required. A monotonically increasing number generated and maintained
            by the API provider. Every time a config changes in the backend, the
            sequenceNumber should be bumped up to reflect the change.
          format: int64
          type: string
      type: object
    GoogleCloudBeyondcorpAppconnectorsV1AppConnectorOperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: GoogleCloudBeyondcorpAppconnectorsV1AppConnectorOperationMetadata
      properties:
        apiVersion:
