components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AllocatedConnection:
      description: Allocated connection of the AppGateway.
      id: AllocatedConnection
      properties:
        ingressPort:
          description: Required. The ingress port of an allocated connection
          format: int32
          type: integer
        pscUri:
          description: Required. The PSC uri of an allocated connection
          type: string
      type: object
    AppGateway:
      description: >-
        A BeyondCorp AppGateway resource represents a BeyondCorp protected
        AppGateway to a remote application. It creates all the necessary GCP
        components needed for creating a BeyondCorp protected AppGateway.
        Multiple connectors can be authorised for a single AppGateway.
      id: AppGateway
      properties:
        allocatedConnections:
          description: Output only. A list of connections allocated for the Gateway
          items:
            $ref: '#/components/schemas/AllocatedConnection'
          readOnly: true
          type: array
        createTime:
          description: Output only. Timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        displayName:
          description: >-
            Optional. An arbitrary user-provided name for the AppGateway. Cannot
            exceed 64 characters.
          type: string
        hostType:
          description: Required. The type of hosting used by the AppGateway.
          enum:
            - HOST_TYPE_UNSPECIFIED
            - GCP_REGIONAL_MIG
          enumDescriptions:
            - Default value. This value is unused.
            - AppGateway hosted in a GCP regional managed instance group.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Resource labels to represent user provided metadata.
          type: object
        name:
          description: >-
            Required. Unique resource name of the AppGateway. The name is
            ignored when creating an AppGateway.
          type: string
        satisfiesPzi:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        state:
          description: Output only. The current state of the AppGateway.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - CREATED
            - UPDATING
            - DELETING
            - DOWN
          enumDescriptions:
            - Default value. This value is unused.
            - AppGateway is being created.
            - AppGateway has been created.
            - AppGateway's configuration is being updated.
            - AppGateway is being deleted.
            - >-
              AppGateway is down and may be restored in the future. This happens
              when CCFE sends ProjectState = OFF.
          readOnly: true
          type: string
        type:
          description: Required. The type of network connectivity used by the AppGateway.
          enum:
            - TYPE_UNSPECIFIED
            - TCP_PROXY
          enumDescriptions:
            - Default value. This value is unused.
            - >-
              TCP Proxy based BeyondCorp Connection. API will default to this if
              unset.
          type: string
        uid:
          description: >-
            Output only. A unique identifier for the instance generated by the
            system.
          readOnly: true
          type: string
        updateTime:
          description: Output only. Timestamp when the resource was last modified.
          format: google-datetime
          readOnly: true
          type: string
        uri:
          description: Output only. Server-defined URI for this resource.
          readOnly: true
          type: string
      type: object
    AppGatewayOperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: AppGatewayOperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have successfully been cancelled
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        statusMessage:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    CloudSecurityZerotrustApplinkAppConnectorProtoConnectionConfig:
      description: ConnectionConfig represents a Connection Configuration object.
      id: CloudSecurityZerotrustApplinkAppConnectorProtoConnectionConfig
      properties:
        applicationEndpoint:
          description: >-
            application_endpoint is the endpoint of the application the form of
            host:port. For example, "localhost:80".
          type: string
        applicationName:
          description: >-
            application_name represents the given name of the application the
            connection is connecting with.
          type: string
        gateway:
          description: >-
            gateway lists all instances running a gateway in GCP. They all
            connect to a connector on the host.
          items:
            $ref: >-
              #/components/schemas/CloudSecurityZerotrustApplinkAppConnectorProtoGateway
          type: array
        name:
          description: >-
            name is the unique ID for each connection. TODO(b/190732451) returns
            connection name from user-specified name in config. Now, name =
            ${application_name}:${application_endpoint}
          type: string
        project:
          description: project represents the consumer project the connection belongs to.
          type: string
        tunnelsPerGateway:
          description: >-
            tunnels_per_gateway reflects the number of tunnels between a
            connector and a gateway.
          format: uint32
          type: integer
        userPort:
          description: >-
            user_port specifies the reserved port on gateways for user
            connections.
          format: int32
          type: integer
      type: object
    CloudSecurityZerotrustApplinkAppConnectorProtoConnectorDetails:
      description: ConnectorDetails reflects the details of a connector.
      id: CloudSecurityZerotrustApplinkAppConnectorProtoConnectorDetails
      properties: {}
      type: object
    CloudSecurityZerotrustApplinkAppConnectorProtoGateway:
      description: Gateway represents a GCE VM Instance endpoint for use by IAP TCP.
      id: CloudSecurityZerotrustApplinkAppConnectorProtoGateway
      properties:
        interface:
          description: >-
            interface specifies the network interface of the gateway to connect
            to.
          type: string
        name:
          description: >-
            name is the name of an instance running a gateway. It is the unique
            ID for a gateway. All gateways under the same connection have the
            same prefix. It is derived from the gateway URL. For example,
            name=${instance} assuming a gateway URL.
            https://www.googleapis.com/compute/${version}/projects/${project}/zones/${zone}/instances/${instance}
          type: string
        port:
          description: >-
            port specifies the port of the gateway for tunnel connections from
            the connectors.
          format: uint32
          type: integer
        project:
          description: >-
            project is the tenant project the gateway belongs to. Different from
            the project in the connection, it is a BeyondCorpAPI internally
            created project to manage all the gateways. It is sharing the same
            network with the consumer project user owned. It is derived from the
            gateway URL. For example, project=${project} assuming a gateway URL.
            https://www.googleapis.com/compute/${version}/projects/${project}/zones/${zone}/instances/${instance}
          type: string
        selfLink:
          description: >-
            self_link is the gateway URL in the form
            https://www.googleapis.com/compute/${version}/projects/${project}/zones/${zone}/instances/${instance}
          type: string
        zone:
          description: >-
            zone represents the zone the instance belongs. It is derived from
            the gateway URL. For example, zone=${zone} assuming a gateway URL.
            https://www.googleapis.com/compute/${version}/projects/${project}/zones/${zone}/instances/${instance}
          type: string
      type: object
    CloudSecurityZerotrustApplinkLogagentProtoLogAgentDetails:
      description: LogAgentDetails reflects the details of a log agent.
      id: CloudSecurityZerotrustApplinkLogagentProtoLogAgentDetails
      properties: {}
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    GoogleCloudBeyondcorpAppconnectionsV1AppConnection:
      description: >-
        A BeyondCorp AppConnection resource represents a BeyondCorp protected
        AppConnection to a remote application. It creates all the necessary GCP
        components needed for creating a BeyondCorp protected AppConnection.
        Multiple connectors can be authorized for a single AppConnection.
      id: GoogleCloudBeyondcorpAppconnectionsV1AppConnection
      properties:
        applicationEndpoint:
          $ref: >-
            #/components/schemas/GoogleCloudBeyondcorpAppconnectionsV1AppConnectionApplicationEndpoint
          description: >-
            Required. Address of the remote application endpoint for the
            BeyondCorp AppConnection.
        connectors:
          description: >-
            Optional. List of [google.cloud.beyondcorp.v1main.Connector.name]
            that are authorized to be associated with this AppConnection.
          items:
            type: string
          type: array
        createTime:
          description: Output only. Timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        displayName:
          description: >-
            Optional. An arbitrary user-provided name for the AppConnection.
            Cannot exceed 64 characters.
          type: string
        gateway:
          $ref: >-
            #/components/schemas/GoogleCloudBeyondcorpAppconnectionsV1AppConnectionGateway
          description: Optional. Gateway used by the AppConnection.
        labels:
          additionalProperties:
            type: string
          description: Optional. Resource labels to represent user provided metadata.
          type: object
        name:
          description: >-
            Required. Unique resource name of the AppConnection. The name is
            ignored when creating a AppConnection.
          type: string
        satisfiesPzi:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        state:
          description: Output only. The current state of the AppConnection.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - CREATED
            - UPDATING
            - DELETING
            - DOWN
          enumDescriptions:
            - Default value. This value is unused.
            - AppConnection is being created.
            - AppConnection has been created.
            - AppConnection's configuration is being updated.
            - AppConnection is being deleted.
            - >-
              AppConnection is down and may be restored in the future. This
              happens when CCFE sends ProjectState = OFF.
          readOnly: true
          type: string
        type:
          description: >-
            Required. The type of network connectivity used by the
            AppConnection.
          enum:
            - TYPE_UNSPECIFIED
            - TCP_PROXY
          enumDescriptions:
            - Default value. This value is unused.
            - >-
              TCP Proxy based BeyondCorp AppConnection. API will default to this
              if unset.
          type: string
        uid:
          description: >-
            Output only. A unique identifier for the instance generated by the
            system.
          readOnly: true
          type: string
        updateTime:
          description: Output only. Timestamp when the resource was last modified.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudBeyondcorpAppconnectionsV1AppConnectionApplicationEndpoint:
      description: ApplicationEndpoint represents a remote application endpoint.
      id: GoogleCloudBeyondcorpAppconnectionsV1AppConnectionApplicationEndpoint
      properties:
        host:
          description: Required. Hostname or IP address of the remote application endpoint.
          type: string
        port:
          description: Required. Port of the remote application endpoint.
          format: int32
          type: integer
      type: object
    GoogleCloudBeyondcorpAppconnectionsV1AppConnectionGateway:
      description: >-
        Gateway represents a user facing component that serves as an entrance to
        enable connectivity.
      id: GoogleCloudBeyondcorpAppconnectionsV1AppConnectionGateway
      properties:
        appGateway:
          description: >-
            Required. AppGateway name in following format:
            `projects/{project_id}/locations/{location_id}/appgateways/{gateway_id}`
          type: string
        ingressPort:
          description: >-
            Output only. Ingress port reserved on the gateways for this
            AppConnection, if not specified or zero, the default port is 19443.
          format: int32
          readOnly: true
          type: integer
        l7psc:
          description: Output only. L7 private service connection for this resource.
          readOnly: true
          type: string
        type:
          description: Required. The type of hosting used by the gateway.
          enum:
            - TYPE_UNSPECIFIED
            - GCP_REGIONAL_MIG
          enumDescriptions:
            - Default value. This value is unused.
            - Gateway hosted in a GCP regional managed instance group.
          type: string
        uri:
          description: Output only. Server-defined URI for this resource.
          readOnly: true
          type: string
      type: object
    GoogleCloudBeyondcorpAppconnectionsV1AppConnectionOperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: GoogleCloudBeyondcorpAppconnectionsV1AppConnectionOperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
