    GoogleCloudBeyondcorpSecuritygatewaysV1Application:
      description: The information about an application resource.
      id: GoogleCloudBeyondcorpSecuritygatewaysV1Application
      properties:
        createTime:
          description: Output only. Timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        displayName:
          description: >-
            Optional. An arbitrary user-provided name for the application
            resource. Cannot exceed 64 characters.
          type: string
        endpointMatchers:
          description: >-
            Optional. An array of conditions to match the application's network
            endpoint. Each element in the array is an EndpointMatcher object,
            which defines a specific combination of a hostname pattern and one
            or more ports. The application is considered matched if at least one
            of the EndpointMatcher conditions in this array is met (the
            conditions are combined using OR logic). Each EndpointMatcher must
            contain a hostname pattern, such as "example.com", and one or more
            port numbers specified as a string, such as "443". Hostname and port
            number examples: "*.example.com", "443" "example.com" and "22"
            "example.com" and "22,33"
          items:
            $ref: >-
              #/components/schemas/GoogleCloudBeyondcorpSecuritygatewaysV1EndpointMatcher
          type: array
        name:
          description: Identifier. Name of the resource.
          type: string
        schema:
          description: Optional. Type of the external application.
          enum:
            - SCHEMA_UNSPECIFIED
            - PROXY_GATEWAY
            - API_GATEWAY
          enumDescriptions:
            - Default value. This value is unused.
            - >-
              Proxy which routes traffic to actual applications, like Netscaler
              Gateway.
            - >-
              Service Discovery API endpoint when Service Discovery is enabled
              in Gateway.
          type: string
        updateTime:
          description: Output only. Timestamp when the resource was last modified.
          format: google-datetime
          readOnly: true
          type: string
        upstreams:
          description: Optional. Which upstream resources to forward traffic to.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudBeyondcorpSecuritygatewaysV1ApplicationUpstream
          type: array
      type: object
    GoogleCloudBeyondcorpSecuritygatewaysV1ApplicationUpstream:
