      description: >-
        ResourceInfo represents the information or status of an app connector
        resource component that's used to report on various parts of the system.
        For example, ResourceInfo can be used to convey the status of a
        remote_agent, including the status of an appgateway for an runtime
        environment in a container instance.
      id: GoogleCloudBeyondcorpAppconnectorsV1ResourceInfo
      properties:
        id:
          description: Required. Unique Id for the resource.
          type: string
        resource:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: Specific details for the resource. This is for internal use only.
          type: object
        status:
          description: >-
            Overall health status. Overall status is derived based on the status
            of each sub level resources.
          enum:
            - HEALTH_STATUS_UNSPECIFIED
            - HEALTHY
            - UNHEALTHY
            - UNRESPONSIVE
            - DEGRADED
          enumDescriptions:
            - 'Health status is unknown: not initialized or failed to retrieve.'
            - The resource is healthy.
            - The resource is unhealthy.
            - The resource is unresponsive.
            - Some sub-resources are UNHEALTHY.
          type: string
        sub:
          description: List of Info for the sub level resources.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudBeyondcorpAppconnectorsV1ResourceInfo
          type: array
        time:
          description: >-
            The timestamp to collect the info. It is suggested to be set by the
            topmost level resource only.
          format: google-datetime
          type: string
      type: object
