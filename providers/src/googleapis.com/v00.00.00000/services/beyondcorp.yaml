            gcr.io/PROJECT-ID/my-image:tag1
          type: string
        targetImage:
          description: >-
            The initial image the remote agent will attempt to run for the
            control plane. Format would be a gcr image path, e.g.:
            gcr.io/PROJECT-ID/my-image:tag1
          type: string
      type: object
