components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AdminSettings:
      description: Looker instance Admin settings fields.
      id: AdminSettings
      properties:
        allowedEmailDomains:
          description: Email domain allowlist for the instance.
          items:
            type: string
          type: array
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    ControlledEgressConfig:
      description: Controlled egress configuration.
      id: ControlledEgressConfig
      properties:
        egressFqdns:
          description: >-
            Optional. List of fully qualified domain names to be added to the
            allowlist for outbound traffic.
          items:
            type: string
          type: array
        marketplaceEnabled:
          description: Optional. Whether marketplace is enabled.
          type: boolean
        webProxyIps:
          description: >-
            Output only. The list of IP addresses used by Secure Web Proxy for
            outbound traffic.
          items:
            type: string
          readOnly: true
          type: array
      type: object
    CustomDomain:
      description: Custom domain information.
      id: CustomDomain
      properties:
        domain:
          description: Domain name.
          type: string
        state:
          description: Domain state.
          enum:
            - CUSTOM_DOMAIN_STATE_UNSPECIFIED
            - UNVERIFIED
            - VERIFIED
            - MODIFYING
            - AVAILABLE
            - UNAVAILABLE
            - UNKNOWN
          enumDescriptions:
            - Unspecified state.
            - DNS record is not created.
            - DNS record is created.
            - Calling SLM to update.
            - ManagedCertificate is ready.
            - ManagedCertificate is not ready.
            - Status is not known.
          type: string
      type: object
    Date:
      description: >-
        Represents a whole or partial calendar date, such as a birthday. The
        time of day and time zone are either specified elsewhere or are
        insignificant. The date is relative to the Gregorian Calendar. This can
        represent one of the following: * A full date, with non-zero year,
        month, and day values. * A month and day, with a zero year (for example,
        an anniversary). * A year on its own, with a zero month and a zero day.
        * A year and month, with a zero day (for example, a credit card
        expiration date). Related types: * google.type.TimeOfDay *
        google.type.DateTime * google.protobuf.Timestamp
      id: Date
      properties:
        day:
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0 to specify a year by itself or a year and month where
            the day isn't significant.
          format: int32
          type: integer
        month:
          description: >-
            Month of a year. Must be from 1 to 12, or 0 to specify a year
            without a month and day.
          format: int32
          type: integer
        year:
          description: >-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date
            without a year.
          format: int32
          type: integer
      type: object
    DenyMaintenancePeriod:
      description: Specifies the maintenance denial period.
      id: DenyMaintenancePeriod
      properties:
        endDate:
          $ref: '#/components/schemas/Date'
          description: Required. End date of the deny maintenance period.
        startDate:
          $ref: '#/components/schemas/Date'
          description: Required. Start date of the deny maintenance period.
        time:
          $ref: '#/components/schemas/TimeOfDay'
          description: Required. Time in UTC when the period starts and ends.
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    EncryptionConfig:
      description: Encryption configuration (i.e. CMEK).
      id: EncryptionConfig
      properties:
        kmsKeyName:
          description: Name of the CMEK key in KMS (input parameter).
          type: string
        kmsKeyNameVersion:
          description: >-
            Output only. Full name and version of the CMEK key currently in use
            to encrypt Looker data. Format:
            `projects/{project}/locations/{location}/keyRings/{ring}/cryptoKeys/{key}/cryptoKeyVersions/{version}`.
            Empty if CMEK is not configured in this instance.
          readOnly: true
          type: string
        kmsKeyState:
          description: Output only. Status of the CMEK key.
          enum:
            - KMS_KEY_STATE_UNSPECIFIED
            - VALID
            - REVOKED
          enumDescriptions:
            - CMEK status not specified.
            - CMEK key is currently valid.
            - >-
              CMEK key is currently revoked (instance should in restricted
              mode).
          readOnly: true
          type: string
      type: object
    ExportEncryptionConfig:
      description: Configuration for Encryption - e.g. CMEK.
      id: ExportEncryptionConfig
      properties:
        kmsKeyName:
          description: Required. Name of the CMEK key in KMS.
          type: string
      type: object
    ExportInstanceRequest:
      description: Request options for exporting data of an Instance.
      id: ExportInstanceRequest
      properties:
        encryptionConfig:
          $ref: '#/components/schemas/ExportEncryptionConfig'
          description: >-
            Required. Encryption configuration (CMEK). For CMEK enabled
            instances it should be same as looker CMEK.
        gcsUri:
          description: >-
            The path to the folder in Google Cloud Storage where the export will
            be stored. The URI is in the form `gs://bucketName/folderName`.
          type: string
      type: object
    ExportMetadata:
      description: >-
        ExportMetadata represents the metadata of the exported artifacts. The
        metadata.json file in export artifact can be parsed as this message
      id: ExportMetadata
      properties:
        esaSourceDatasetId:
          description: >-
            Source BigQuery dataset (formatted as `project_id:dataset_id`) for
            O2C Elite System Activity (ESA) direct dataset migration.
          type: string
        exportEncryptionKey:
          $ref: '#/components/schemas/ExportMetadataEncryptionKey'
          description: Encryption key that was used to encrypt the export artifacts.
        filePaths:
          description: >-
            List of files created as part of export artifact (excluding the
            metadata). The paths are relative to the folder containing the
            metadata.
          items:
            type: string
          type: array
        lookerEncryptionKey:
          description: >-
            Looker encryption key, encrypted with the provided export encryption
            key. This value will only be populated if the looker instance uses
            Looker managed encryption instead of CMEK.
          type: string
        lookerInstance:
          description: >-
            Name of the exported instance. Format:
            projects/{project}/locations/{location}/instances/{instance}
          type: string
        lookerPlatformEdition:
          description: Platform edition of the exported instance.
          type: string
        lookerVersion:
          description: Version of instance when the export was created.
          type: string
        source:
          description: The source type of the migration.
          enum:
            - SOURCE_UNSPECIFIED
            - LOOKER_CORE
            - LOOKER_ORIGINAL
          enumDescriptions:
            - Source not specified
            - Source of export is Looker Core
            - Source of export is Looker Original
          type: string
      type: object
    ExportMetadataEncryptionKey:
      description: Encryption key details for the exported artifact.
      id: ExportMetadataEncryptionKey
      properties:
        cmek:
          description: Name of the CMEK.
          type: string
        version:
          description: Version of the CMEK.
          type: string
      type: object
    ImportInstanceRequest:
      description: Requestion options for importing looker data to an Instance
      id: ImportInstanceRequest
      properties:
        gcsUri:
          description: >-
            Path to the import folder in Google Cloud Storage, in the form
            `gs://bucketName/folderName`.
          type: string
      type: object
    IngressIpAllowlistConfig:
      description: Ingress IP allowlist configuration.
      id: IngressIpAllowlistConfig
      properties:
        allowlistRules:
          description: Optional. List of IP range rules to allow ingress traffic.
          items:
            $ref: '#/components/schemas/IngressIpAllowlistRule'
          type: array
        enabled:
          description: >-
            Optional. Whether ingress IP allowlist functionality is enabled on
            the Looker instance.
          type: boolean
        googleServicesEnabled:
          description: >-
            Optional. Whether google service connections are enabled for the
            instance.
          type: boolean
      type: object
    IngressIpAllowlistRule:
      description: Ingress IP allowlist rule.
      id: IngressIpAllowlistRule
      properties:
        description:
          description: Optional. Description for the IP range.
          type: string
        ipRange:
          description: Optional. The IP range to allow ingress traffic from.
          type: string
      type: object
    Instance:
      description: A Looker instance.
      id: Instance
      properties:
        acceleratedSecurityPatchEnabled:
          description: Optional. Accelerated security patch enabled for the instance.
          type: boolean
        adminSettings:
          $ref: '#/components/schemas/AdminSettings'
          description: Looker Instance Admin settings.
        catalogIntegrationOptOut:
          description: >-
            Optional. Indicates whether catalog integration is disabled for the
            Looker instance.
          type: boolean
        classType:
          description: Optional. Storage class of the instance.
          enum:
            - CLASS_TYPE_UNSPECIFIED
            - R1
            - P1
          enumDescriptions:
            - Unspecified storage class.
            - Filestore.
            - PD SSD.
          type: string
        consumerNetwork:
          description: >-
            Network name in the consumer project. Format:
            `projects/{project}/global/networks/{network}`. Note that the
            consumer network may be in a different GCP project than the consumer
            project that is hosting the Looker Instance.
          type: string
        controlledEgressConfig:
          $ref: '#/components/schemas/ControlledEgressConfig'
          description: Optional. Controlled egress configuration.
        controlledEgressEnabled:
          description: >-
            Optional. Whether controlled egress is enabled on the Looker
            instance.
          type: boolean
        createTime:
          description: >-
            Output only. The time when the Looker instance provisioning was
            first requested.
          format: google-datetime
          readOnly: true
          type: string
        customDomain:
          $ref: '#/components/schemas/CustomDomain'
          description: Custom domain configuration for the instance.
        denyMaintenancePeriod:
          $ref: '#/components/schemas/DenyMaintenancePeriod'
          description: Maintenance denial period for this instance.
        egressPublicIp:
          description: Output only. Public Egress IP (IPv4).
          readOnly: true
          type: string
        encryptionConfig:
          $ref: '#/components/schemas/EncryptionConfig'
          description: >-
            Encryption configuration (CMEK). Only set if CMEK has been enabled
            on the instance.
        fipsEnabled:
          description: Optional. Whether FIPS is enabled on the Looker instance.
          type: boolean
        geminiEnabled:
          description: >-
            Optional. Whether Gemini feature is enabled on the Looker instance
            or not.
          type: boolean
        ingressIpAllowlistConfig:
          $ref: '#/components/schemas/IngressIpAllowlistConfig'
          description: >-
            Optional. Ingress IP allowlist configuration for the Looker
            instance.
        ingressPrivateIp:
          description: Output only. Private Ingress IP (IPv4).
          readOnly: true
          type: string
        ingressPublicIp:
          description: Output only. Public Ingress IP (IPv4).
          readOnly: true
          type: string
        lastDenyMaintenancePeriod:
          $ref: '#/components/schemas/DenyMaintenancePeriod'
          description: >-
            Output only. Last computed maintenance denial period for this
            instance.
          readOnly: true
        linkedLspProjectNumber:
          description: Optional. Linked Google Cloud Project Number for Looker Studio Pro.
          format: int64
          type: string
        lookerUri:
          description: >-
            Output only. Looker instance URI which can be used to access the
            Looker Instance UI.
          readOnly: true
          type: string
        lookerVersion:
          description: Output only. The Looker version that the instance is using.
          readOnly: true
          type: string
        maintenanceSchedule:
          $ref: '#/components/schemas/MaintenanceSchedule'
          description: Maintenance schedule for this instance.
        maintenanceWindow:
          $ref: '#/components/schemas/MaintenanceWindow'
          description: Maintenance window for this instance.
        name:
          description: >-
            Output only. Format:
            `projects/{project}/locations/{location}/instances/{instance}`.
          readOnly: true
          type: string
        oauthConfig:
          $ref: '#/components/schemas/OAuthConfig'
          description: Looker instance OAuth login settings.
        periodicExportConfig:
          $ref: '#/components/schemas/PeriodicExportConfig'
          description: Optional. Configuration for periodic export.
        platformEdition:
          description: Platform edition.
          enum:
            - PLATFORM_EDITION_UNSPECIFIED
            - LOOKER_CORE_TRIAL
            - LOOKER_CORE_STANDARD
            - LOOKER_CORE_STANDARD_ANNUAL
            - LOOKER_CORE_ENTERPRISE_ANNUAL
            - LOOKER_CORE_EMBED_ANNUAL
            - LOOKER_CORE_NONPROD_STANDARD_ANNUAL
            - LOOKER_CORE_NONPROD_ENTERPRISE_ANNUAL
            - LOOKER_CORE_NONPROD_EMBED_ANNUAL
            - LOOKER_CORE_TRIAL_STANDARD
            - LOOKER_CORE_TRIAL_ENTERPRISE
            - LOOKER_CORE_TRIAL_EMBED
          enumDescriptions:
            - Represents an unspecified platform edition.
            - Represents the Looker Core Trial edition.
            - Represents the Looker Core Standard edition.
            - Represents the Looker Core Standard Annual edition.
            - Represents the Looker Core Enterprise Annual edition.
            - Represents the Looker Core Embed Annual edition.
            - Represents the Looker Core Nonprod Standard Annual edition.
            - Represents the Looker Core Nonprod Enterprise Annual edition.
            - Represents the Looker Core Nonprod Embed Annual edition.
            - Represents the Looker Core Trial Standard edition.
            - Represents the Looker Core Trial Enterprise edition.
            - Represents the Looker Core Trial Embed edition.
          type: string
        privateIpEnabled:
          description: Whether private IP is enabled on the Looker instance.
          type: boolean
        pscConfig:
          $ref: '#/components/schemas/PscConfig'
          description: Optional. PSC configuration. Used when `psc_enabled` is true.
        pscEnabled:
          description: >-
            Optional. Whether to use Private Service Connect (PSC) for private
            IP connectivity. If true, neither `public_ip_enabled` nor
            `private_ip_enabled` can be true.
          type: boolean
        publicIpEnabled:
          description: Whether public IP is enabled on the Looker instance.
          type: boolean
        releaseChannel:
          description: Optional. The selected release channel for the instance.
          enum:
            - RELEASE_CHANNEL_UNSPECIFIED
            - RAPID
            - REGULAR
            - STABLE
          enumDescriptions:
            - Unspecified release channel.
            - 'Rapid: Most frequent updates.'
            - 'Regular: Balanced, default for production.'
            - 'Stable: Least frequent, for maximum stability.'
          type: string
        reservedRange:
          description: >-
            Name of a reserved IP address range within the
            Instance.consumer_network, to be used for private services access
            connection. May or may not be specified in a create request.
          type: string
        satisfiesPzi:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        softDeleteReason:
          description: >-
            Output only. The reason for the instance being in a soft-deleted
            state.
          enum:
            - SOFT_DELETE_REASON_UNSPECIFIED
            - BILLING_ACCOUNT_ISSUE
            - TRIAL_EXPIRED
            - CUSTOMER_REQUEST
          enumDescriptions:
            - Soft delete reason is unspecified. This is the default value.
            - Instance is soft deleted due to billing account issues.
            - Instance is soft deleted due to trial expiration.
            - Instance is soft deleted by the customer.
          readOnly: true
          type: string
        state:
          description: Output only. The state of the instance.
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - CREATING
            - FAILED
            - SUSPENDED
            - UPDATING
            - DELETING
            - EXPORTING
            - IMPORTING
          enumDescriptions:
            - State is unspecified.
            - Instance is active and ready for use.
            - Instance provisioning is in progress.
            - Instance is in a failed state.
            - Instance was suspended.
            - Instance update is in progress.
            - Instance delete is in progress.
            - Instance is being exported.
            - Instance is importing data.
          readOnly: true
          type: string
        suspendedTime:
          description: >-
            Output only. The time when the Looker instance was suspended (soft
            deleted).
          format: google-datetime
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time when the Looker instance was last updated.
          format: google-datetime
          readOnly: true
          type: string
        userMetadata:
          $ref: '#/components/schemas/UserMetadata'
          description: Optional. User metadata.
      type: object
    InstanceBackup:
      description: The details of a backup resource.
      id: InstanceBackup
      properties:
        createTime:
          description: Output only. The time when the backup was started.
          format: google-datetime
          readOnly: true
          type: string
        encryptionConfig:
          $ref: '#/components/schemas/EncryptionConfig'
          description: Output only. Current status of the CMEK encryption
          readOnly: true
        expireTime:
          description: Output only. The time when the backup will be deleted.
          format: google-datetime
          readOnly: true
          type: string
        name:
          description: >-
            Immutable. The relative resource name of the backup, in the
            following form:
            `projects/{project_number}/locations/{location_id}/instances/{instance_id}/backups/{backup}`
          type: string
        state:
          description: Output only. The current state of the backup.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - DELETING
            - ACTIVE
            - FAILED
          enumDescriptions:
            - The state of the backup is unknown.
            - The backup is being created.
            - The backup is being deleted.
            - The backup is active and ready to use.
            - The backup failed.
          readOnly: true
          type: string
      type: object
    ListInstanceBackupsResponse:
      description: Response from listing Looker instance backups.
      id: ListInstanceBackupsResponse
      properties:
        instanceBackups:
          description: >-
            The list of instances matching the request filters, up to the
            requested `page_size`.
          items:
            $ref: '#/components/schemas/InstanceBackup'
          type: array
        nextPageToken:
          description: >-
            If provided, a page token that can look up the next `page_size`
            results. If empty, the results list is exhausted.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListInstancesResponse:
      description: Response from ListInstances.
      id: ListInstancesResponse
      properties:
        instances:
          description: >-
            The list of instances matching the request filters, up to the
            requested `pageSize`.
          items:
            $ref: '#/components/schemas/Instance'
          type: array
        nextPageToken:
          description: >-
            If provided, a page token that can look up the next `pageSize`
            results. If empty, the results list is exhausted.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    MaintenanceSchedule:
      description: Published upcoming future maintenance schedule.
      id: MaintenanceSchedule
      properties:
        endTime:
          description: The scheduled end time for the maintenance.
          format: google-datetime
          type: string
        startTime:
          description: The scheduled start time for the maintenance.
          format: google-datetime
          type: string
      type: object
    MaintenanceWindow:
      description: Specifies the recurring maintenance window.
      id: MaintenanceWindow
      properties:
        dayOfWeek:
          description: Required. Day of the week for this MaintenanceWindow (in UTC).
          enum:
            - DAY_OF_WEEK_UNSPECIFIED
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          enumDescriptions:
            - The day of the week is unspecified.
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          type: string
        startTime:
          $ref: '#/components/schemas/TimeOfDay'
          description: >-
            Required. Time in UTC when the period starts. Maintenance will be
            scheduled within 60 minutes.
      type: object
    OAuthConfig:
      description: Looker instance OAuth login settings.
      id: OAuthConfig
      properties:
        clientId:
          description: >-
            Input only. Client ID from an external OAuth application. This is an
            input-only field, and thus will not be set in any responses.
          type: string
        clientSecret:
          description: >-
            Input only. Client secret from an external OAuth application. This
            is an input-only field, and thus will not be set in any responses.
          type: string
        sharedOauthClientEnabled:
          description: >-
            Optional. Whether to use the shared OAuth client. Instances
            specifying this field do not need to provide client_id and
            client_secret.
          type: boolean
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
