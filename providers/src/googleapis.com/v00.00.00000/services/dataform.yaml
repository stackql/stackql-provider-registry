          type: array
      type: object
    FetchGitAheadBehindResponse:
      description: '`FetchGitAheadBehind` response message.'
      id: FetchGitAheadBehindResponse
      properties:
        commitsAhead:
          description: >-
            The number of commits in the remote branch that are not in the
            workspace.
          format: int32
          type: integer
        commitsBehind:
          description: >-
            The number of commits in the workspace that are not in the remote
            branch.
          format: int32
          type: integer
      type: object
    FetchRemoteBranchesResponse:
      description: '`FetchRemoteBranches` response message.'
      id: FetchRemoteBranchesResponse
      properties:
        branches:
          description: The remote repository's branch names.
          items:
            type: string
          type: array
      type: object
    FetchRepositoryHistoryResponse:
      description: '`FetchRepositoryHistory` response message.'
      id: FetchRepositoryHistoryResponse
      properties:
        commits:
          description: A list of commit logs, ordered by 'git log' default order.
          items:
            $ref: '#/components/schemas/CommitLogEntry'
          type: array
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
          type: string
      type: object
    FileOperation:
      description: Represents a single file operation to the repository.
      id: FileOperation
      properties:
        deleteFile:
          $ref: '#/components/schemas/DeleteFile'
          description: Represents the delete operation.
        writeFile:
          $ref: '#/components/schemas/WriteFile'
          description: Represents the write operation.
      type: object
    FileSearchResult:
      description: Client-facing representation of a file entry in search results.
      id: FileSearchResult
      properties:
        path:
          description: File system path relative to the workspace root.
          type: string
      type: object
    FilesystemEntryMetadata:
      description: Represents metadata for a single entry in a filesystem.
      id: FilesystemEntryMetadata
      properties:
        sizeBytes:
          description: >-
            Output only. Provides the size of the entry in bytes. For
            directories, this will be 0.
          format: int64
          readOnly: true
          type: string
        updateTime:
          description: >-
            Output only. Represents the time of the last modification of the
            entry.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    Folder:
      description: >-
        Represents a Dataform Folder. This is a resource that is used to
        organize Files and other Folders and provide hierarchical access
        controls.
      id: Folder
      properties:
        containingFolder:
          description: >-
            Optional. The containing Folder resource name. This should take the
            format: projects/{project}/locations/{location}/folders/{folder},
            projects/{project}/locations/{location}/teamFolders/{teamFolder}, or
            just "" if this is a root Folder. This field can only be updated
            through MoveFolder.
          type: string
        createTime:
          description: Output only. The timestamp of when the Folder was created.
          format: google-datetime
          readOnly: true
          type: string
        creatorIamPrincipal:
          description: >-
            Output only. The IAM principal identifier of the creator of the
            Folder.
          readOnly: true
          type: string
        displayName:
          description: Required. The Folder's user-friendly name.
          type: string
        internalMetadata:
          description: >-
            Output only. All the metadata information that is used internally to
            serve the resource. For example: timestamps, flags, status fields,
            etc. The format of this field is a JSON string.
          readOnly: true
          type: string
        name:
          description: Identifier. The Folder's name.
          type: string
        teamFolderName:
          description: >-
            Output only. The resource name of the TeamFolder that this Folder is
            associated with. This should take the format:
            projects/{project}/locations/{location}/teamFolders/{teamFolder}. If
            this is not set, the Folder is not associated with a TeamFolder and
            is a UserFolder.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The timestamp of when the Folder was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    FolderContentsEntry:
      description: Represents a single content entry.
      id: FolderContentsEntry
      properties:
        folder:
          $ref: '#/components/schemas/Folder'
          description: A subfolder.
        repository:
          $ref: '#/components/schemas/Repository'
          description: A repository.
      type: object
    GcsRepositorySnapshotDestination:
      description: Configures the destination for a repository snapshot.
      id: GcsRepositorySnapshotDestination
      properties:
        repositorySnapshotUri:
          description: >-
            Optional. The Google Cloud Storage destination to upload the
            repository snapshot to. Format: `gs://bucket-name/path/`.
          type: string
      type: object
    GcsRepositorySnapshotMetadata:
      description: Metadata about a repository snapshot stored in Google Cloud Storage.
      id: GcsRepositorySnapshotMetadata
      properties:
        crc32cChecksum:
          description: >-
            Output only. The crc32c checksum of the repository snapshot,
            big-endian base64 encoded.
          readOnly: true
          type: string
        generation:
          description: >-
            Output only. The generation number of the Cloud Storage object. See
            https://cloud.google.com/storage/docs/metadata#generation-number.
          format: int64
          readOnly: true
          type: string
        repositorySnapshotUri:
          description: >-
            Output only. The Google Cloud Storage URI of the repository
            snapshot.
          readOnly: true
          type: string
      type: object
    GitRemoteSettings:
      description: Controls Git remote configuration for a repository.
      id: GitRemoteSettings
      properties:
        authenticationTokenSecretVersion:
          description: >-
            Optional. The name of the Secret Manager secret version to use as an
            authentication token for Git operations. Must be in the format
            `projects/*/secrets/*/versions/*`.
          type: string
        defaultBranch:
          description: >-
            Optional. The Git remote's default branch name. If not set, `main`
            will be used.
          type: string
        effectiveDefaultBranch:
          description: >-
            Output only. The Git remote's effective default branch name. This is
            the default branch name of the Git remote if it is set, otherwise it
            is `main`.
          readOnly: true
          type: string
        gitRepositoryLink:
          description: >-
            Optional. Resource name for the `GitRepositoryLink` used for machine
            credentials. Must be in the format
            `projects/*/locations/*/connections/*/gitRepositoryLinks/*`
          type: string
        sshAuthenticationConfig:
          $ref: '#/components/schemas/SshAuthenticationConfig'
          description: Optional. Authentication fields for remote uris using SSH protocol.
        tokenStatus:
          deprecated: true
          description: >-
            Output only. Deprecated: The field does not contain any token status
            information.
          enum:
            - TOKEN_STATUS_UNSPECIFIED
            - NOT_FOUND
            - INVALID
            - VALID
          enumDescriptions:
            - Default value. This value is unused.
            - >-
              The token could not be found in Secret Manager (or the Dataform
              Service Account did not have permission to access it).
            - >-
              The token could not be used to authenticate against the Git
              remote.
            - >-
              The token was used successfully to authenticate against the Git
              remote.
          readOnly: true
          type: string
        url:
          description: Required. The Git remote's URL.
          type: string
      type: object
    IamPolicyOverrideView:
      description: >-
        Contains metadata about the IAM policy override for a given Dataform
        resource. If is_active is true, this the policy encoded in
        iam_policy_name is the source of truth for this resource. Will be
        provided in internal ESV2 views for: Workspaces, Repositories, Folders,
        TeamFolders.
      id: IamPolicyOverrideView
      properties:
        iamPolicyName:
          $ref: '#/components/schemas/PolicyName'
          description: The IAM policy name for the resource.
        isActive:
          description: Whether the IAM policy encoded in this view is active.
          type: boolean
      type: object
    IncrementalLoadMode:
      description: Load definition for incremental load modes
      id: IncrementalLoadMode
      properties:
        column:
          description: Column name for incremental load modes
          type: string
      type: object
    IncrementalTableConfig:
      description: Contains settings for relations of type `INCREMENTAL_TABLE`.
      id: IncrementalTableConfig
      properties:
        incrementalPostOperations:
          description: >-
            SQL statements to be executed after inserting new rows into the
            relation.
          items:
            type: string
          type: array
        incrementalPreOperations:
          description: >-
            SQL statements to be executed before inserting new rows into the
            relation.
          items:
            type: string
          type: array
        incrementalSelectQuery:
          description: >-
            The SELECT query which returns rows which should be inserted into
            the relation if it already exists and is not being refreshed.
          type: string
        refreshDisabled:
          description: Whether this table should be protected from being refreshed.
          type: boolean
        uniqueKeyParts:
          description: >-
            A set of columns or SQL expressions used to define row uniqueness.
            If any duplicates are discovered (as defined by `unique_key_parts`),
            only the newly selected rows (as defined by
            `incremental_select_query`) will be included in the relation.
          items:
            type: string
          type: array
        updatePartitionFilter:
          description: >-
            A SQL expression conditional used to limit the set of existing rows
            considered for a merge operation (see `unique_key_parts` for more
            information).
          type: string
      type: object
    InstallNpmPackagesRequest:
      description: '`InstallNpmPackages` request message.'
      id: InstallNpmPackagesRequest
      properties:
        pipelineConfig:
          $ref: '#/components/schemas/PipelineConfig'
          description: >-
            Optional. The pipeline options which defines the pipeline type and
            path within the Git repository.
      type: object
    InstallNpmPackagesResponse:
      description: '`InstallNpmPackages` response message.'
      id: InstallNpmPackagesResponse
      properties: {}
      type: object
    Interval:
      description: >-
        Represents a time interval, encoded as a Timestamp start (inclusive) and
        a Timestamp end (exclusive). The start must be less than or equal to the
        end. When the start equals the end, the interval is empty (matches no
        time). When both start and end are unspecified, the interval matches any
        time.
      id: Interval
      properties:
        endTime:
          description: >-
            Optional. Exclusive end of the interval. If specified, a Timestamp
            matching this interval will have to be before the end.
          format: google-datetime
          type: string
        startTime:
          description: >-
            Optional. Inclusive start of the interval. If specified, a Timestamp
            matching this interval will have to be the same or after the start.
          format: google-datetime
          type: string
      type: object
    InvocationConfig:
      description: >-
        Includes various configuration options for a workflow invocation. If
        both `included_targets` and `included_tags` are unset, all actions will
        be included.
      id: InvocationConfig
      properties:
        fullyRefreshIncrementalTablesEnabled:
          description: >-
            Optional. When set to true, any incremental tables will be fully
            refreshed.
          type: boolean
        includedTags:
          description: Optional. The set of tags to include.
          items:
            type: string
          type: array
        includedTargets:
          description: Optional. The set of action identifiers to include.
          items:
            $ref: '#/components/schemas/Target'
          type: array
        queryPriority:
          description: >-
            Optional. Specifies the priority for query execution in BigQuery.
            More information can be found at
            https://cloud.google.com/bigquery/docs/running-queries#queries.
          enum:
            - QUERY_PRIORITY_UNSPECIFIED
            - INTERACTIVE
            - BATCH
          enumDescriptions:
            - Default value. This value is unused.
            - >-
              Query will be executed in BigQuery with interactive priority. More
              information can be found at
              https://cloud.google.com/bigquery/docs/running-queries#queries.
            - >-
              Query will be executed in BigQuery with batch priority. More
              information can be found at
              https://cloud.google.com/bigquery/docs/running-queries#batchqueries.
          type: string
        serviceAccount:
          description: Optional. The service account to run workflow invocations under.
          type: string
        transitiveDependenciesIncluded:
          description: >-
            Optional. When set to true, transitive dependencies of included
            actions will be executed.
          type: boolean
        transitiveDependentsIncluded:
          description: >-
            Optional. When set to true, transitive dependents of included
            actions will be executed.
          type: boolean
      type: object
    ListCompilationResultsResponse:
