          description: Arbitrary, user-defined tags on this action.
          items:
            type: string
          type: array
      type: object
    NotebookAction:
      description: Represents a workflow action that will run against a Notebook runtime.
      id: NotebookAction
      properties:
        contents:
          description: Output only. The code contents of a Notebook to be run.
          readOnly: true
          type: string
        filePath:
          description: Output only. The path to the notebook file in the repository.
          readOnly: true
          type: string
        jobId:
          description: >-
            Output only. The ID of the Gemini Enterprise Agent Platform job that
            executed the notebook in contents and also the ID used for the
            outputs created in Google Cloud Storage buckets. Only set once the
            job has started to run.
          readOnly: true
          type: string
      type: object
    NotebookRuntimeOptions:
      description: Configures various aspects of Dataform notebook runtime.
      id: NotebookRuntimeOptions
      properties:
        aiPlatformNotebookRuntimeTemplate:
          description: >-
            Optional. The resource name of the [Colab runtime template]
            (https://cloud.google.com/colab/docs/runtimes), from which a runtime
            is created for notebook executions. If not specified, a runtime is
            created with Colab's default specifications.
          type: string
        gcsOutputBucket:
          description: >-
            Optional. The Google Cloud Storage location to upload the result to.
            Format: `gs://bucket-name`.
          type: string
        gcsRepositorySnapshotDestination:
          $ref: '#/components/schemas/GcsRepositorySnapshotDestination'
          description: >-
            Optional. The Google Cloud Storage destination to upload the
            snapshot to. For empty URI it defaults to the provided
            gcs_output_bucket. Format: `gs://bucket-name/path/`.
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        cancelRequested:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
