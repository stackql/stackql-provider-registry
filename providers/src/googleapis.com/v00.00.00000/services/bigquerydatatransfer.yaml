    post:
      description: >-
        Enroll data sources in a user project. This allows users to create
        transfer configurations for these data sources. They will also appear in
        the ListDataSources RPC and as such, will appear in the [BigQuery
        UI](https://console.cloud.google.com/bigquery), and the documents can be
        found in the public guide for [BigQuery Web
        UI](https://cloud.google.com/bigquery/bigquery-web-ui) and [Data
        Transfer
        Service](https://cloud.google.com/bigquery/docs/working-with-transfers).
      operationId: bigquerydatatransfer.projects.enrollDataSources
      parameters:
        - in: path
          name: projectsId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollDataSourcesRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
          description: Successful response
      security:
        - Oauth2:
            - https://www.googleapis.com/auth/bigquery
          Oauth2c:
            - https://www.googleapis.com/auth/bigquery
        - Oauth2:
            - https://www.googleapis.com/auth/cloud-platform
          Oauth2c:
            - https://www.googleapis.com/auth/cloud-platform
servers:
  - url: https://bigquerydatatransfer.googleapis.com
