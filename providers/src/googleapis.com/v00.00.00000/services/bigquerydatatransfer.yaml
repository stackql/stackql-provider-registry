openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: BigQuery Data Transfer API
  description: >-
    Schedule queries or transfer external data from SaaS applications to Google
    BigQuery on a regular basis.
  version: v1
  x-discovery-doc-revision: '20260718'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/bigquery-transfer/
servers:
  - url: https://bigquerydatatransfer.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/bigquery: >-
              View and manage your data in Google BigQuery and see the email
              address for your Google Account
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
            https://www.googleapis.com/auth/cloud-platform.read-only: >-
              View your data across Google Cloud services and see the email
              address of your Google Account
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    MetadataDestination:
      id: MetadataDestination
      description: The metadata destination of the transfer config.
      type: object
      properties:
        dataplexConfiguration:
          $ref: '#/components/schemas/DataplexConfiguration'
          description: The Dataplex Universal Catalog configuration.
    CheckValidCredsRequest:
      description: >-
        A request to determine whether the user has valid credentials. This
        method is used to limit the number of OAuth popups in the user
        interface. The user id is inferred from the API call context. If the
        data source has the Google+ authorization type, this method returns
        false, as it cannot be determined whether the credentials are already
        valid merely based on the user id.
      id: CheckValidCredsRequest
      type: object
      properties: {}
    ListTransferResourcesResponse:
      type: object
      properties:
        nextPageToken:
          description: >-
            Output only. A token, which can be sent as `page_token` to retrieve
            the next page. If this field is omitted, there are no subsequent
            pages.
          readOnly: true
          type: string
        transferResources:
          items:
            $ref: '#/components/schemas/TransferResource'
          description: Output only. The transfer resources.
          readOnly: true
          type: array
      id: ListTransferResourcesResponse
      description: Response for the `ListTransferResources` RPC.
    EnrollDataSourcesRequest:
      id: EnrollDataSourcesRequest
      description: >-
        A request to enroll a set of data sources so they are visible in the
        BigQuery UI's `Transfer` tab.
      type: object
      properties:
        dataSourceIds:
          type: array
          description: >-
            Data sources that are enrolled. It is required to provide at least
            one data source id.
          items:
            type: string
    TransferStatusSummary:
      type: object
      properties:
        metrics:
          description: Optional. List of transfer status metrics.
          items:
            $ref: '#/components/schemas/TransferStatusMetric'
          type: array
        progressUnit:
          type: string
          description: >-
            Input only. Unit based on which transfer status progress should be
            calculated.
          enumDescriptions:
            - Default value.
            - Bytes.
            - Objects.
          enum:
            - TRANSFER_STATUS_UNIT_UNSPECIFIED
            - TRANSFER_STATUS_UNIT_BYTES
            - TRANSFER_STATUS_UNIT_OBJECTS
      id: TransferStatusSummary
      description: Status summary of the resource being transferred.
    UserInfo:
      id: UserInfo
      description: Information about a user.
      type: object
      properties:
        email:
          description: E-mail address of the user.
          type: string
    TransferResourceStatusDetail:
      description: Status details of the resource being transferred.
      id: TransferResourceStatusDetail
      type: object
      properties:
        completedPercentage:
          description: >-
            Output only. Percentage of the transfer completed. Valid values:
            0-100.
          format: double
          readOnly: true
          type: number
        state:
          type: string
          description: Optional. Transfer state of the resource.
          enumDescriptions:
            - Default value.
            - Resource is waiting to be transferred.
            - Resource transfer is running.
            - Resource transfer is a success.
            - Resource transfer failed.
            - Resource transfer was cancelled.
          enum:
            - RESOURCE_TRANSFER_STATE_UNSPECIFIED
            - RESOURCE_TRANSFER_PENDING
            - RESOURCE_TRANSFER_RUNNING
            - RESOURCE_TRANSFER_SUCCEEDED
            - RESOURCE_TRANSFER_FAILED
            - RESOURCE_TRANSFER_CANCELLED
        error:
          $ref: '#/components/schemas/Status'
          description: Optional. Transfer error details for the resource.
        summary:
          description: Optional. Transfer status summary of the resource.
          $ref: '#/components/schemas/TransferStatusSummary'
    EventDrivenSchedule:
      type: object
      properties:
        pubsubSubscription:
          description: >-
            Pub/Sub subscription name used to receive events. Only Google Cloud
            Storage data source support this option. Format:
            projects/{project}/subscriptions/{subscription}
          type: string
      id: EventDrivenSchedule
      description: Options customizing EventDriven transfers schedule.
    TimeRange:
      id: TimeRange
      description: >-
        A specification for a time range, this will request transfer runs with
        run_time between start_time (inclusive) and end_time (exclusive).
      type: object
      properties:
        startTime:
          type: string
          format: google-datetime
          description: >-
            Start time of the range of transfer runs. For example,
            `"2017-05-25T00:00:00+00:00"`. The start_time must be strictly less
            than the end_time. Creates transfer runs where run_time is in the
            range between start_time (inclusive) and end_time (exclusive).
        endTime:
          description: >-
            End time of the range of transfer runs. For example,
            `"2017-05-30T00:00:00+00:00"`. The end_time must not be in the
            future. Creates transfer runs where run_time is in the range between
            start_time (inclusive) and end_time (exclusive).
          type: string
          format: google-datetime
    TransferStatusMetric:
      id: TransferStatusMetric
      description: Metrics for tracking the transfer status.
      type: object
      properties:
        failed:
          description: Optional. Number of units that failed to transfer.
          type: string
          format: int64
        pending:
          description: Optional. Number of units pending transfer.
          type: string
          format: int64
        unit:
          type: string
          enumDescriptions:
            - Default value.
            - Bytes.
            - Objects.
          enum:
            - TRANSFER_STATUS_UNIT_UNSPECIFIED
            - TRANSFER_STATUS_UNIT_BYTES
            - TRANSFER_STATUS_UNIT_OBJECTS
          description: Optional. Unit for measuring progress (e.g., BYTES).
        completed:
          format: int64
          type: string
          description: Optional. Number of units transferred successfully.
        total:
          format: int64
          type: string
          description: Optional. Total number of units for the transfer.
    TransferResource:
      type: object
      properties:
        type:
          description: Optional. Resource type.
          enumDescriptions:
            - Default value.
            - Table resource type.
            - Partition resource type.
          enum:
            - RESOURCE_TYPE_UNSPECIFIED
            - RESOURCE_TYPE_TABLE
            - RESOURCE_TYPE_PARTITION
          type: string
        destination:
          description: Optional. Resource destination.
          enumDescriptions:
            - Default value.
            - BigQuery.
            - Dataproc Metastore.
            - BigLake Metastore.
            - BigLake REST Catalog.
            - BigLake Hive Catalog.
          enum:
            - RESOURCE_DESTINATION_UNSPECIFIED
            - RESOURCE_DESTINATION_BIGQUERY
            - RESOURCE_DESTINATION_DATAPROC_METASTORE
            - RESOURCE_DESTINATION_BIGLAKE_METASTORE
            - RESOURCE_DESTINATION_BIGLAKE_REST_CATALOG
            - RESOURCE_DESTINATION_BIGLAKE_HIVE_CATALOG
          type: string
        latestStatusDetail:
          description: Optional. Status details for the latest run.
          $ref: '#/components/schemas/TransferResourceStatusDetail'
        lastSuccessfulRun:
          readOnly: true
          $ref: '#/components/schemas/TransferRunBrief'
          description: Output only. Run details for the last successful run.
        updateTime:
          readOnly: true
          type: string
          format: google-datetime
          description: Output only. Time when the resource was last updated.
        latestRun:
          description: Optional. Run details for the latest run.
          $ref: '#/components/schemas/TransferRunBrief'
        name:
          description: Identifier. Resource name.
          type: string
        hierarchyDetail:
          $ref: '#/components/schemas/HierarchyDetail'
          description: Optional. Details about the hierarchy.
      id: TransferResource
      description: Resource (table/partition) that is being transferred.
    TransferRunBrief:
      type: object
      properties:
        startTime:
          type: string
          format: google-datetime
          description: Optional. Start time of the transfer run.
        run:
          description: >-
            Optional. Run URI. The format must be:
            `projects/{project}/locations/{location}/transferConfigs/{transfer_config}/run/{run}`
          type: string
      id: TransferRunBrief
      description: Basic information about a transfer run.
    ListLocationsResponse:
      type: object
      properties:
        locations:
          type: array
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
        nextPageToken:
          description: The standard List next-page token.
          type: string
      id: ListLocationsResponse
      description: The response message for Locations.ListLocations.
    ScheduleOptions:
      type: object
      properties:
        startTime:
          format: google-datetime
          type: string
          description: >-
            Specifies time to start scheduling transfer runs. The first run will
            be scheduled at or after the start time according to a recurrence
            pattern defined in the schedule string. The start time can be
            changed at any moment. The time when a data transfer can be
            triggered manually is not limited by this option.
        endTime:
          type: string
          format: google-datetime
          description: >-
            Defines time to stop scheduling transfer runs. A transfer run cannot
            be scheduled at or after the end time. The end time can be changed
            at any moment. The time when a data transfer can be triggered
            manually is not limited by this option.
        disableAutoScheduling:
          description: >-
            If true, automatic scheduling of data transfer runs for this
            configuration will be disabled. The runs can be started on ad-hoc
            basis using StartManualTransferRuns API. When automatic scheduling
            is disabled, the TransferConfig.schedule field will be ignored.
          type: boolean
      id: ScheduleOptions
      description: Options customizing the data transfer schedule.
    StartManualTransferRunsRequest:
      type: object
      properties:
        requestedTimeRange:
          description: >-
            A time_range start and end timestamp for historical data files or
            reports that are scheduled to be transferred by the scheduled
            transfer run. requested_time_range must be a past time and cannot
            include future time values.
          $ref: '#/components/schemas/TimeRange'
        requestedRunTime:
          type: string
          format: google-datetime
          description: >-
            A run_time timestamp for historical data files or reports that are
            scheduled to be transferred by the scheduled transfer run.
            requested_run_time must be a past time and cannot include future
            time values.
      id: StartManualTransferRunsRequest
      description: A request to start manual transfer runs.
    TimeBasedSchedule:
      type: object
      properties:
        endTime:
          description: >-
            Defines time to stop scheduling transfer runs. A transfer run cannot
            be scheduled at or after the end time. The end time can be changed
            at any moment.
          type: string
          format: google-datetime
        schedule:
          description: >-
            Data transfer schedule. If the data source does not support a custom
            schedule, this should be empty. If it is empty, the default value
            for the data source will be used. The specified times are in UTC.
            Examples of valid format: `1st,3rd monday of month 15:30`, `every
            wed,fri of jan,jun 13:15`, and `first sunday of quarter 00:00`. See
            more explanation about the format here:
            https://cloud.google.com/appengine/docs/flexible/python/scheduling-jobs-with-cron-yaml#the_schedule_format
            NOTE: The minimum interval time between recurring transfers depends
            on the data source; refer to the documentation for your data source.
          type: string
        startTime:
          description: >-
            Specifies time to start scheduling transfer runs. The first run will
            be scheduled at or after the start time according to a recurrence
            pattern defined in the schedule string. The start time can be
            changed at any moment.
          format: google-datetime
          type: string
      id: TimeBasedSchedule
      description: >-
        Options customizing the time based transfer schedule. Options are
        migrated from the original ScheduleOptions message.
    EncryptionConfiguration:
      id: EncryptionConfiguration
      description: Represents the encryption configuration for a transfer.
      type: object
      properties:
        kmsKeyName:
          description: The name of the KMS key used for encrypting BigQuery data.
          type: string
    ScheduleOptionsV2:
      description: >-
        V2 options customizing different types of data transfer schedule. This
        field supports existing time-based and manual transfer schedule. Also
        supports Event-Driven transfer schedule. ScheduleOptionsV2 cannot be
        used together with ScheduleOptions/Schedule.
      id: ScheduleOptionsV2
      type: object
      properties:
        eventDrivenSchedule:
          $ref: '#/components/schemas/EventDrivenSchedule'
          description: >-
            Event driven transfer schedule options. If set, the transfer will be
            scheduled upon events arrial.
        manualSchedule:
          description: >-
            Manual transfer schedule. If set, the transfer run will not be
            auto-scheduled by the system, unless the client invokes
            StartManualTransferRuns. This is equivalent to
            disable_auto_scheduling = true.
          $ref: '#/components/schemas/ManualSchedule'
        timeBasedSchedule:
          $ref: '#/components/schemas/TimeBasedSchedule'
          description: >-
            Time based transfer schedule options. This is the default schedule
            option.
    Empty:
      type: object
      properties: {}
      id: Empty
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
    ScheduleTransferRunsResponse:
      type: object
      properties:
        runs:
          items:
            $ref: '#/components/schemas/TransferRun'
          description: The transfer runs that were scheduled.
          type: array
      description: A response to schedule transfer runs for a time range.
      id: ScheduleTransferRunsResponse
    StartManualTransferRunsResponse:
      id: StartManualTransferRunsResponse
      description: A response to start manual transfer runs.
      type: object
      properties:
        runs:
          description: The transfer runs that were created.
          items:
            $ref: '#/components/schemas/TransferRun'
          type: array
    DataplexConfiguration:
      id: DataplexConfiguration
      description: Configuration for Dataplex destination.
      type: object
      properties:
        entryGroup:
          description: >-
            Required. The Dataplex Universal Catalog entry group for importing
            the metadata. entry_group has the format of
            `projects/{project_id}/locations/{region}/entryGroups/{entry_group_id}`.
          type: string
    ScheduleTransferRunsRequest:
      type: object
      properties:
        endTime:
          format: google-datetime
          type: string
          description: >-
            Required. End time of the range of transfer runs. For example,
            `"2017-05-30T00:00:00+00:00"`.
        startTime:
          type: string
          format: google-datetime
          description: >-
            Required. Start time of the range of transfer runs. For example,
            `"2017-05-25T00:00:00+00:00"`.
      id: ScheduleTransferRunsRequest
      description: A request to schedule transfer runs for a time range.
    ListTransferRunsResponse:
      type: object
      properties:
        transferRuns:
          readOnly: true
          type: array
          description: Output only. The stored pipeline transfer runs.
          items:
            $ref: '#/components/schemas/TransferRun'
        nextPageToken:
          readOnly: true
          type: string
          description: >-
            Output only. The next-pagination token. For multiple-page list
            results, this token can be used as the
            `ListTransferRunsRequest.page_token` to request the next page of
            list results.
      id: ListTransferRunsResponse
      description: The returned list of pipelines in the project.
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      type: object
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        labels:
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          additionalProperties:
            type: string
          type: object
        metadata:
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
    TransferMessage:
      type: object
      properties:
        messageTime:
          format: google-datetime
          type: string
          description: Time when message was logged.
        severity:
          type: string
          enumDescriptions:
            - No severity specified.
            - Informational message.
            - Warning message.
            - Error message.
          enum:
            - MESSAGE_SEVERITY_UNSPECIFIED
            - INFO
            - WARNING
            - ERROR
          description: Message severity.
        messageText:
          description: Message text.
          type: string
      id: TransferMessage
      description: Represents a user facing message for a particular data transfer run.
    CheckValidCredsResponse:
      description: A response indicating whether the credentials exist and are valid.
      id: CheckValidCredsResponse
      type: object
      properties:
        hasValidCreds:
          description: If set to `true`, the credentials exist and are valid.
          type: boolean
    ListTransferConfigsResponse:
      description: The returned list of pipelines in the project.
      id: ListTransferConfigsResponse
      type: object
      properties:
        nextPageToken:
          readOnly: true
          type: string
          description: >-
            Output only. The next-pagination token. For multiple-page list
            results, this token can be used as the
            `ListTransferConfigsRequest.page_token` to request the next page of
            list results.
        transferConfigs:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/TransferConfig'
          description: Output only. The stored pipeline transfer configurations.
    TableDetail:
      type: object
      properties:
        partitionCount:
          description: Optional. Total number of partitions being tracked within the table.
          type: string
          format: int64
      id: TableDetail
      description: Table details related to hierarchy.
    PartitionDetail:
      type: object
      properties:
        table:
          description: Optional. Name of the table which has the partitions.
          type: string
      description: Partition details related to hierarchy.
      id: PartitionDetail
    UnenrollDataSourcesRequest:
      type: object
      properties:
        dataSourceIds:
          items:
            type: string
          description: >-
            Data sources that are unenrolled. It is required to provide at least
            one data source id.
          type: array
      description: >-
        A request to unenroll a set of data sources so they are no longer
        visible in the BigQuery UI's `Transfer` tab.
      id: UnenrollDataSourcesRequest
    TransferConfig:
      id: TransferConfig
      description: >-
        Represents a data transfer configuration. A transfer configuration
        contains all metadata needed to perform a data transfer. For example,
        `destination_dataset_id` specifies where data should be stored. When a
        new transfer configuration is created, the specified
        `destination_dataset_id` is created when needed and shared with the
        appropriate data source service account.
      type: object
      properties:
        userId:
          format: int64
          type: string
          description: Deprecated. Unique ID of the user on whose behalf transfer is done.
        scheduleOptions:
          description: Options customizing the data transfer schedule.
          $ref: '#/components/schemas/ScheduleOptions'
        updateTime:
          description: >-
            Output only. Data transfer modification time. Ignored by server on
            input.
          readOnly: true
          type: string
          format: google-datetime
        emailPreferences:
          $ref: '#/components/schemas/EmailPreferences'
          description: >-
            Email notifications will be sent according to these preferences to
            the email address of the user who owns this transfer config.
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            Output only. Error code with detailed information about reason of
            the latest config failure.
          readOnly: true
        name:
          description: >-
            Identifier. The resource name of the transfer config. Transfer
            config names have the form either
            `projects/{project_id}/locations/{region}/transferConfigs/{config_id}`
            or `projects/{project_id}/transferConfigs/{config_id}`, where
            `config_id` is usually a UUID, even though it is not guaranteed or
            required. The name is ignored when creating a transfer config.
          type: string
        schedule:
          description: >-
            Data transfer schedule. If the data source does not support a custom
            schedule, this should be empty. If it is empty, the default value
            for the data source will be used. The specified times are in UTC.
            Examples of valid format: `1st,3rd monday of month 15:30`, `every
            wed,fri of jan,jun 13:15`, and `first sunday of quarter 00:00`. See
            more explanation about the format here:
            https://cloud.google.com/appengine/docs/flexible/python/scheduling-jobs-with-cron-yaml#the_schedule_format
            NOTE: The minimum interval time between recurring transfers depends
            on the data source; refer to the documentation for your data source.
          type: string
        disabled:
          description: >-
            Is this config disabled. When set to true, no runs will be scheduled
            for this transfer config.
          type: boolean
        nextRunTime:
          description: Output only. Next time when data transfer will run.
          readOnly: true
          type: string
          format: google-datetime
        encryptionConfiguration:
          $ref: '#/components/schemas/EncryptionConfiguration'
          description: >-
            The encryption configuration part. Currently, it is only used for
            the optional KMS key name. The BigQuery service account of your
            project must be granted permissions to use the key. Read methods
            will return the key name applied in effect. Write methods will apply
            the key if it is present, or otherwise try to apply project default
            keys if it is absent.
        state:
          readOnly: true
          type: string
          enumDescriptions:
            - State placeholder (0).
            - >-
              Data transfer is scheduled and is waiting to be picked up by data
              transfer backend (2).
            - Data transfer is in progress (3).
            - Data transfer completed successfully (4).
            - Data transfer failed (5).
            - Data transfer is cancelled (6).
          enum:
            - TRANSFER_STATE_UNSPECIFIED
            - PENDING
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
          description: Output only. State of the most recently updated transfer run.
        datasetRegion:
          readOnly: true
          type: string
          description: Output only. Region in which BigQuery dataset is located.
        metadataDestination:
          description: The metadata destination of the transfer config.
          $ref: '#/components/schemas/MetadataDestination'
        notificationPubsubTopic:
          description: >-
            Pub/Sub topic where notifications will be sent after transfer runs
            associated with this transfer config finish. The format for
            specifying a pubsub topic is:
            `projects/{project_id}/topics/{topic_id}`
          type: string
        managedTableType:
          type: string
          description: The classification of the destination table.
          enumDescriptions:
            - Type unspecified. This defaults to `NATIVE` table.
            - >-
              The managed table is a native BigQuery table. This is the default
              value.
            - >-
              The managed table is a BigQuery table for Apache Iceberg (formerly
              BigLake managed tables), with a BigLake configuration.
          enum:
            - MANAGED_TABLE_TYPE_UNSPECIFIED
            - NATIVE
            - BIGLAKE
        destinationDatasetId:
          description: The BigQuery target dataset id.
          type: string
        ownerInfo:
          description: >-
            Output only. Information about the user whose credentials are used
            to transfer data. Populated only for `transferConfigs.get` requests.
            In case the user information is not available, this field will not
            be populated.
          $ref: '#/components/schemas/UserInfo'
          readOnly: true
        params:
          description: >-
            Parameters specific to each data source. For more information see
            the bq tab in the 'Setting up a data transfer' section for each data
            source. For example the parameters for Cloud Storage transfers are
            listed here:
            https://cloud.google.com/bigquery-transfer/docs/cloud-storage-transfer#bq
          additionalProperties:
            type: any
            description: Properties of the object.
          type: object
        displayName:
          description: User specified display name for the data transfer.
          type: string
        dataSourceId:
          description: >-
            Data source ID. This cannot be changed once data transfer is
            created. The full list of available data source IDs can be returned
            through an API call:
            https://cloud.google.com/bigquery-transfer/docs/reference/datatransfer/rest/v1/projects.locations.dataSources/list
          type: string
        dataRefreshWindowDays:
          format: int32
          type: integer
          description: >-
            The number of days to look back to automatically refresh the data.
            For example, if `data_refresh_window_days = 10`, then every day
            BigQuery reingests data for [today-10, today-1], rather than
            ingesting data for just [today-1]. Only valid if the data source
            supports the feature. Set the value to 0 to use the default value.
        scheduleOptionsV2:
          $ref: '#/components/schemas/ScheduleOptionsV2'
          description: >-
            Options customizing different types of data transfer schedule. This
            field replaces "schedule" and "schedule_options" fields.
            ScheduleOptionsV2 cannot be used together with
            ScheduleOptions/Schedule.
    ListTransferLogsResponse:
      id: ListTransferLogsResponse
      description: The returned list transfer run messages.
      type: object
      properties:
        transferMessages:
          description: Output only. The stored pipeline transfer messages.
          items:
            $ref: '#/components/schemas/TransferMessage'
          readOnly: true
          type: array
        nextPageToken:
          description: >-
            Output only. The next-pagination token. For multiple-page list
            results, this token can be used as the
            `GetTransferRunLogRequest.page_token` to request the next page of
            list results.
          readOnly: true
          type: string
    TransferRun:
      type: object
      properties:
        params:
          readOnly: true
          type: object
          description: >-
            Output only. Parameters specific to each data source. For more
            information see the bq tab in the 'Setting up a data transfer'
            section for each data source. For example the parameters for Cloud
            Storage transfers are listed here:
            https://cloud.google.com/bigquery-transfer/docs/cloud-storage-transfer#bq
          additionalProperties:
            type: any
            description: Properties of the object.
        startTime:
          format: google-datetime
          readOnly: true
          type: string
          description: >-
            Output only. Time when transfer run was started. Parameter ignored
            by server for input requests.
        destinationDatasetId:
          description: Output only. The BigQuery target dataset id.
          readOnly: true
          type: string
        dataSourceId:
          readOnly: true
          type: string
          description: Output only. Data source id.
        state:
          type: string
          description: Data transfer run state. Ignored for input requests.
          enumDescriptions:
            - State placeholder (0).
            - >-
              Data transfer is scheduled and is waiting to be picked up by data
              transfer backend (2).
            - Data transfer is in progress (3).
            - Data transfer completed successfully (4).
            - Data transfer failed (5).
            - Data transfer is cancelled (6).
          enum:
            - TRANSFER_STATE_UNSPECIFIED
            - PENDING
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
        notificationPubsubTopic:
          readOnly: true
          type: string
          description: >-
            Output only. Pub/Sub topic where a notification will be sent after
            this transfer run finishes. The format for specifying a pubsub topic
            is: `projects/{project_id}/topics/{topic_id}`
        name:
          description: >-
            Identifier. The resource name of the transfer run. Transfer run
            names have the form
            `projects/{project_id}/locations/{location}/transferConfigs/{config_id}/runs/{run_id}`.
            The name is ignored when creating a transfer run.
          type: string
        scheduleTime:
          format: google-datetime
          type: string
          description: Minimum time after which a transfer run can be started.
        schedule:
          readOnly: true
          type: string
          description: >-
            Output only. Describes the schedule of this transfer run if it was
            created as part of a regular schedule. For batch transfer runs that
            are scheduled manually, this is empty. NOTE: the system might choose
            to delay the schedule depending on the current load, so
            `schedule_time` doesn't always match this.
        runTime:
          description: >-
            For batch transfer runs, specifies the date and time of the data
            should be ingested.
          type: string
          format: google-datetime
        errorStatus:
          $ref: '#/components/schemas/Status'
          description: Status of the transfer run.
        endTime:
          description: >-
            Output only. Time when transfer run ended. Parameter ignored by
            server for input requests.
          readOnly: true
          type: string
          format: google-datetime
        updateTime:
          description: Output only. Last time the data transfer run state was updated.
          readOnly: true
          type: string
          format: google-datetime
        userId:
          description: Deprecated. Unique ID of the user on whose behalf transfer is done.
          type: string
          format: int64
        emailPreferences:
          readOnly: true
          $ref: '#/components/schemas/EmailPreferences'
          description: >-
            Output only. Email notifications will be sent according to these
            preferences to the email address of the user who owns the transfer
            config this run was derived from.
      description: Represents a data transfer run.
      id: TransferRun
    DataSourceParameter:
