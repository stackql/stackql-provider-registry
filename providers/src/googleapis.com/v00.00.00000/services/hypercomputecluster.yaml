components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    BootDisk:
      description: >-
        A [Persistent disk](https://cloud.google.com/compute/docs/disks) used as
        the boot disk for a Compute Engine VM instance.
      id: BootDisk
      properties:
        sizeGb:
          description: >-
            Optional. The size of the disk in gigabytes (GB), which must be at
            least 40 GB.
          format: int64
          type: string
        type:
          description: >-
            Optional. [Persistent disk
            type](https://cloud.google.com/compute/docs/disks#disk-types), in
            the format `projects/{project}/zones/{zone}/diskTypes/{disk_type}`.
          type: string
      type: object
    BucketReference:
      description: >-
        A reference to a [Google Cloud
        Storage](https://cloud.google.com/storage) bucket.
      id: BucketReference
      properties:
        bucket:
          description: Output only. Name of the bucket.
          readOnly: true
          type: string
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    CheckClusterHealth:
      description: >-
        When set in OperationStep, indicates that cluster health check should be
        performed.
      id: CheckClusterHealth
      properties: {}
      type: object
    Cluster:
      description: >-
        A collection of virtual machines and connected resources forming a
        high-performance computing cluster capable of running large-scale,
        tightly coupled workloads. A cluster combines a set a compute resources
        that perform computations, storage resources that contain inputs and
        store outputs, an orchestrator that is responsible for assigning jobs to
        compute resources, and network resources that connect everything
        together.
      id: Cluster
      properties:
        computeResources:
          additionalProperties:
            $ref: '#/components/schemas/ComputeResource'
          description: >-
            Optional. Compute resources available to the cluster. Keys specify
            the ID of the compute resource by which it can be referenced
            elsewhere, and must conform to
            [RFC-1034](https://datatracker.ietf.org/doc/html/rfc1034)
            (lower-case, alphanumeric, and at most 63 characters).
          type: object
        createTime:
          description: Output only. Time that the cluster was originally created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. A description for your cluster. You can use up to 2,048
            characters.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional.
            [Labels](https://cloud.google.com/compute/docs/labeling-resources)
            applied to the cluster. Labels can be used to organize clusters and
            to filter them in queries.
          type: object
        name:
          description: >-
            Identifier. [Relative resource name](https://google.aip.dev/122) of
            the cluster, in the format
            `projects/{project}/locations/{location}/clusters/{cluster}`.
          type: string
        networkResources:
          additionalProperties:
            $ref: '#/components/schemas/NetworkResource'
          description: >-
            Optional. Network resources available to the cluster. Must contain
            exactly one value. Keys specify the ID of the network resource by
            which it can be referenced elsewhere, and must conform to
            [RFC-1034](https://datatracker.ietf.org/doc/html/rfc1034)
            (lower-case, alphanumeric, and at most 63 characters).
          type: object
        orchestrator:
          $ref: '#/components/schemas/Orchestrator'
          description: >-
            Optional. Orchestrator that is responsible for scheduling and
            running jobs on the cluster.
        reconciling:
          description: >-
            Output only. Indicates whether changes to the cluster are currently
            in flight. If this is `true`, then the current state might not match
            the cluster's intended state.
          readOnly: true
          type: boolean
        storageResources:
          additionalProperties:
            $ref: '#/components/schemas/StorageResource'
          description: >-
            Optional. Storage resources available to the cluster. Keys specify
            the ID of the storage resource by which it can be referenced
            elsewhere, and must conform to
            [RFC-1034](https://datatracker.ietf.org/doc/html/rfc1034)
            (lower-case, alphanumeric, and at most 63 characters).
          type: object
        updateTime:
          description: Output only. Time that the cluster was most recently updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    ComputeInstance:
      description: >-
        Details about a Compute Engine
        [instance](https://cloud.google.com/compute/docs/instances).
      id: ComputeInstance
      properties:
        instance:
          description: >-
            Output only. Name of the VM instance, in the format
            `projects/{project}/zones/{zone}/instances/{instance}`.
          readOnly: true
          type: string
      type: object
    ComputeInstanceSlurmNodeSet:
      description: >-
        When set in a SlurmNodeSet, indicates that the nodeset should be backed
        by Compute Engine VM instances.
      id: ComputeInstanceSlurmNodeSet
      properties:
        bootDisk:
          $ref: '#/components/schemas/BootDisk'
          description: Optional. Boot disk for the compute instance
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional.
            [Labels](https://cloud.google.com/compute/docs/labeling-resources)
            that should be applied to each VM instance in the nodeset.
          type: object
        startupScript:
          description: >-
            Optional. [Startup
            script](https://cloud.google.com/compute/docs/instances/startup-scripts/linux)
            to be run on each VM instance in the nodeset. Max 256KB.
          type: string
      type: object
    ComputeResource:
      description: >-
        A resource defining how virtual machines and accelerators should be
        provisioned for the cluster.
      id: ComputeResource
      properties:
        config:
          $ref: '#/components/schemas/ComputeResourceConfig'
          description: >-
            Required. Immutable. Configuration for this compute resource, which
            describes how it should be created at runtime.
      type: object
    ComputeResourceConfig:
      description: Describes how a compute resource should be created at runtime.
      id: ComputeResourceConfig
      properties:
        newFlexStartInstances:
          $ref: '#/components/schemas/NewFlexStartInstancesConfig'
          description: >-
            Optional. Immutable. If set, indicates that this resource should use
            flex-start VMs.
        newOnDemandInstances:
          $ref: '#/components/schemas/NewOnDemandInstancesConfig'
          description: >-
            Optional. Immutable. If set, indicates that this resource should use
            on-demand VMs.
        newReservedInstances:
          $ref: '#/components/schemas/NewReservedInstancesConfig'
          description: >-
            Optional. Immutable. If set, indicates that this resource should use
            reserved VMs.
        newSpotInstances:
          $ref: '#/components/schemas/NewSpotInstancesConfig'
          description: >-
            Optional. Immutable. If set, indicates that this resource should use
            spot VMs.
      type: object
    CreateFilestoreInstance:
      description: >-
        When set in OperationStep, indicates that a new filestore instance
        should be created.
      id: CreateFilestoreInstance
      properties:
        filestore:
          description: >-
            Output only. Name of the Filestore instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          readOnly: true
          type: string
      type: object
    CreateLoginNode:
      description: >-
        When set in OperationStep, indicates that a login node should be
        created.
      id: CreateLoginNode
      properties: {}
      type: object
    CreateLustreInstance:
      description: >-
        When set in OperationStep, indicates that a new lustre instance should
        be created.
      id: CreateLustreInstance
      properties:
        lustre:
          description: >-
            Output only. Name of the Managed Lustre instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          readOnly: true
          type: string
      type: object
    CreateNetwork:
      description: >-
        When set in OperationStep, indicates that a new network should be
        created.
      id: CreateNetwork
      properties:
        network:
          description: >-
            Output only. Name of the network to create, in the format
            `projects/{project}/global/networks/{network}`.
          readOnly: true
          type: string
      type: object
    CreateNodeset:
      description: When set in OperationStep, indicates that a nodeset should be created.
      id: CreateNodeset
      properties:
        nodesets:
          description: Output only. Name of the nodeset to create
          items:
            type: string
          readOnly: true
          type: array
      type: object
    CreateOrchestrator:
      description: >-
        When set in OperationStep, indicates that an orchestrator should be
        created.
      id: CreateOrchestrator
      properties: {}
      type: object
    CreatePartition:
      description: When set in OperationStep, indicates that a partition should be created.
      id: CreatePartition
      properties:
        partitions:
          description: Output only. Name of the partition to create
          items:
            type: string
          readOnly: true
          type: array
      type: object
    CreatePrivateServiceAccess:
      description: >-
        When set in OperationStep, indicates that a new private service access
        should be created.
      id: CreatePrivateServiceAccess
      properties: {}
      type: object
    CreateStorageBucket:
      description: >-
        When set in OperationStep, indicates that a new storage bucket should be
        created.
      id: CreateStorageBucket
      properties:
        bucket:
          description: Output only. Name of the bucket.
          readOnly: true
          type: string
      type: object
    DeleteFilestoreInstance:
      description: >-
        When set in OperationStep, indicates that a Filestore instance should be
        deleted.
      id: DeleteFilestoreInstance
      properties:
        filestore:
          description: >-
            Output only. Name of the Filestore instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          readOnly: true
          type: string
      type: object
    DeleteLoginNode:
      description: >-
        When set in OperationStep, indicates that a login node should be
        deleted.
      id: DeleteLoginNode
      properties: {}
      type: object
    DeleteLustreInstance:
      description: >-
        When set in OperationStep, indicates that a Lustre instance should be
        deleted.
      id: DeleteLustreInstance
      properties:
        lustre:
          description: >-
            Output only. Name of the Managed Lustre instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          readOnly: true
          type: string
      type: object
    DeleteNetwork:
      description: >-
        When set in OperationStep, indicates network deletion step with the
        resource name.
      id: DeleteNetwork
      properties:
        network:
          description: >-
            Output only. Name of the network to delete, in the format
            `projects/{project}/global/networks/{network}`.
          readOnly: true
          type: string
      type: object
    DeleteNodeset:
      description: When set in OperationStep, indicates that a nodeset should be deleted.
      id: DeleteNodeset
      properties:
        nodesets:
          description: Output only. Name of the nodeset to delete
          items:
            type: string
          readOnly: true
          type: array
      type: object
    DeleteOrchestrator:
      description: >-
        When set in OperationStep, indicates that an orchestrator should be
        deleted.
      id: DeleteOrchestrator
      properties: {}
      type: object
    DeletePartition:
      description: When set in OperationStep, indicates that a partition should be deleted.
      id: DeletePartition
      properties:
        partitions:
          description: Output only. Name of the partition to delete
          items:
            type: string
          readOnly: true
          type: array
      type: object
    DeletePrivateServiceAccess:
      description: >-
        When set in OperationStep, indicates private service access deletion
        step.
      id: DeletePrivateServiceAccess
      properties: {}
      type: object
    DeleteStorageBucket:
      description: >-
        When set in OperationStep, indicates that Cloud Storage bucket should be
        deleted.
      id: DeleteStorageBucket
      properties:
        bucket:
          description: Output only. Name of the bucket.
          readOnly: true
          type: string
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    ExistingBucketConfig:
      description: >-
        When set in a StorageResourceConfig, indicates that an existing [Google
        Cloud Storage](https://cloud.google.com/storage) bucket should be
        imported.
      id: ExistingBucketConfig
      properties:
        bucket:
          description: Required. Immutable. Name of the Cloud Storage bucket to import.
          type: string
      type: object
    ExistingFilestoreConfig:
      description: >-
        When set in a StorageResourceConfig, indicates that an existing
        [Filestore](https://cloud.google.com/filestore) instance should be
        imported.
      id: ExistingFilestoreConfig
      properties:
        filestore:
          description: >-
            Required. Immutable. Name of the Filestore instance to import, in
            the format
            `projects/{project}/locations/{location}/instances/{instance}`
          type: string
      type: object
    ExistingLustreConfig:
      description: >-
        When set in a StorageResourceConfig, indicates that an existing [Managed
        Lustre](https://cloud.google.com/products/managed-lustre) instance
        should be imported.
      id: ExistingLustreConfig
      properties:
        lustre:
          description: >-
            Required. Immutable. Name of the Managed Lustre instance to import,
            in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          type: string
      type: object
    ExistingNetworkConfig:
      description: >-
        When set in a NetworkResourceConfig, indicates that an existing network
        should be imported.
      id: ExistingNetworkConfig
      properties:
        network:
          description: >-
            Required. Immutable. Name of the network to import, in the format
            `projects/{project}/global/networks/{network}`.
          type: string
        subnetwork:
          description: >-
            Required. Immutable. Particular subnetwork to use, in the format
            `projects/{project}/regions/{region}/subnetworks/{subnetwork}`.
          type: string
      type: object
    FileShareConfig:
      description: Message describing filestore configuration
      id: FileShareConfig
      properties:
        capacityGb:
          description: >-
            Required. Size of the filestore in GB. Must be between 1024 and
            102400, and must meet scalability requirements described at
            https://cloud.google.com/filestore/docs/service-tiers.
          format: int64
          type: string
        fileShare:
          description: Required. Filestore share location
          type: string
      type: object
    FilestoreReference:
      description: >-
        A reference to a [Filestore](https://cloud.google.com/filestore)
        instance.
      id: FilestoreReference
      properties:
        filestore:
          description: >-
            Output only. Name of the Filestore instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          readOnly: true
          type: string
      type: object
    GcsAutoclassConfig:
      description: Message describing Google Cloud Storage autoclass configuration
      id: GcsAutoclassConfig
      properties:
        enabled:
          description: Required. Enables Auto-class feature.
          type: boolean
        terminalStorageClass:
          description: Optional. Terminal storage class of the autoclass bucket
          enum:
            - TERMINAL_STORAGE_CLASS_UNSPECIFIED
            - NEARLINE
            - ARCHIVE
          enumDescriptions:
            - Unspecified terminal storage class
            - Nearline terminal storage class
            - Archive terminal storage class
          type: string
      type: object
    GcsHierarchicalNamespaceConfig:
      description: >-
        Message describing Google Cloud Storage hierarchical namespace
        configuration
      id: GcsHierarchicalNamespaceConfig
      properties:
        enabled:
          description: Required. Enables hierarchical namespace setup for the bucket.
          type: boolean
      type: object
    ListClustersResponse:
      description: Response message for ListClusters.
      id: ListClustersResponse
      properties:
        clusters:
          description: Clusters in the specified location.
          items:
            $ref: '#/components/schemas/Cluster'
          type: array
        nextPageToken:
          description: >-
            A token that can be sent as `page_token` to retrieve the next page.
            If this field is absent, there are no subsequent pages.
          type: string
        unreachable:
          description: Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    LustreReference:
      description: >-
        A reference to a [Managed
        Lustre](https://cloud.google.com/products/managed-lustre) instance.
      id: LustreReference
      properties:
        lustre:
          description: >-
            Output only. Name of the Managed Lustre instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          readOnly: true
          type: string
      type: object
    NetworkReference:
      description: >-
        A reference to a [VPC network](https://cloud.google.com/vpc/docs/vpc) in
        Google Compute Engine.
      id: NetworkReference
      properties:
        network:
          description: >-
            Output only. Name of the network, in the format
            `projects/{project}/global/networks/{network}`.
          readOnly: true
          type: string
        subnetwork:
          description: >-
            Output only. Name of the particular subnetwork being used by the
            cluster, in the format
            `projects/{project}/regions/{region}/subnetworks/{subnetwork}`.
          readOnly: true
          type: string
      type: object
    NetworkResource:
      description: >-
        A resource representing a network that connects the various components
        of a cluster together.
      id: NetworkResource
      properties:
        config:
          $ref: '#/components/schemas/NetworkResourceConfig'
          description: >-
            Immutable. Configuration for this network resource, which describes
            how it should be created or imported. This field only controls how
            the network resource is initially created or imported. Subsequent
            changes to the network resource should be made via the resource's
            API and will not be reflected in the configuration.
        network:
          $ref: '#/components/schemas/NetworkReference'
          description: Output only. A reference to a network in Google Compute Engine.
          readOnly: true
      type: object
    NetworkResourceConfig:
      description: >-
        Describes how a network resource should be initialized. Each network
        resource can either be imported from an existing Google Cloud resource
        or initialized when the cluster is created.
      id: NetworkResourceConfig
      properties:
        existingNetwork:
          $ref: '#/components/schemas/ExistingNetworkConfig'
          description: >-
            Optional. Immutable. If set, indicates that an existing network
            should be imported.
        newNetwork:
          $ref: '#/components/schemas/NewNetworkConfig'
          description: >-
            Optional. Immutable. If set, indicates that a new network should be
            created.
      type: object
    NewBucketConfig:
      description: >-
        When set in a StorageResourceConfig, indicates that a new [Google Cloud
        Storage](https://cloud.google.com/storage) bucket should be created.
      id: NewBucketConfig
      properties:
        autoclass:
          $ref: '#/components/schemas/GcsAutoclassConfig'
          description: >-
            Optional. Immutable. If set, indicates that the bucket should use
            [Autoclass](https://cloud.google.com/storage/docs/autoclass).
        bucket:
          description: Required. Immutable. Name of the Cloud Storage bucket to create.
          type: string
        hierarchicalNamespace:
          $ref: '#/components/schemas/GcsHierarchicalNamespaceConfig'
          description: >-
            Optional. Immutable. If set, indicates that the bucket should use
            [hierarchical
            namespaces](https://cloud.google.com/storage/docs/hns-overview).
        storageClass:
          description: >-
            Optional. Immutable. If set, uses the provided storage class as the
            bucket's default storage class.
          enum:
            - STORAGE_CLASS_UNSPECIFIED
            - STANDARD
            - NEARLINE
            - COLDLINE
            - ARCHIVE
            - RAPID
          enumDescriptions:
            - Not set.
            - Best for data that is frequently accessed.
            - Low-cost storage for data that is accessed less frequently.
            - Very low-cost storage for infrequently accessed data.
            - >-
              Lowest-cost storage for data archiving, online backup, and
              disaster recovery.
            - Storage class optimized for I/O intensive workloads.
          type: string
      type: object
    NewFilestoreConfig:
      description: >-
        When set in a StorageResourceConfig, indicates that a new
        [Filestore](https://cloud.google.com/filestore) instance should be
        created.
      id: NewFilestoreConfig
      properties:
        description:
          description: >-
            Optional. Immutable. Description of the instance. Maximum of 2048
            characters.
          type: string
        fileShares:
          description: >-
            Required. Immutable. File system shares on the instance. Exactly one
            file share must be specified.
          items:
            $ref: '#/components/schemas/FileShareConfig'
          type: array
        filestore:
          description: >-
            Required. Immutable. Name of the Filestore instance to create, in
            the format
            `projects/{project}/locations/{location}/instances/{instance}`.
          type: string
        protocol:
          description: >-
            Optional. Immutable. Access protocol to use for all file shares in
            the instance. Defaults to NFS V3 if not set.
          enum:
            - PROTOCOL_UNSPECIFIED
            - NFSV3
            - NFSV41
          enumDescriptions:
            - Not set.
            - NFS 3.0.
            - NFS 4.1.
          type: string
        tier:
          description: Required. Immutable. Service tier to use for the instance.
          enum:
            - TIER_UNSPECIFIED
            - ZONAL
            - REGIONAL
          enumDescriptions:
            - Not set.
            - >-
              Offers expanded capacity and performance scaling capabilities
              suitable for high-performance computing application requirements.
            - >-
              Offers features and availability needed for mission-critical,
              high-performance computing workloads.
          type: string
      type: object
    NewFlexStartInstancesConfig:
      description: >-
        When set in a ComputeResourceConfig, indicates that VM instances should
        be created using [Flex
        Start](https://cloud.google.com/compute/docs/instances/provisioning-models).
      id: NewFlexStartInstancesConfig
      properties:
        machineType:
          description: >-
            Required. Immutable. Name of the Compute Engine [machine
            type](https://cloud.google.com/compute/docs/machine-resource) to
            use, e.g. `n2-standard-2`.
          type: string
        maxDuration:
          description: >-
            Required. Immutable. Specifies the time limit for created instances.
            Instances will be terminated at the end of this duration.
          format: google-duration
          type: string
        zone:
          description: >-
            Required. Immutable. Name of the zone in which VM instances should
            run, e.g., `us-central1-a`. Must be in the same region as the
            cluster, and must match the zone of any other resources specified in
            the cluster.
          type: string
      type: object
    NewLustreConfig:
      description: >-
        When set in a StorageResourceConfig, indicates that a new [Managed
        Lustre](https://cloud.google.com/products/managed-lustre) instance
        should be created.
      id: NewLustreConfig
      properties:
        capacityGb:
          description: >-
            Required. Immutable. Storage capacity of the instance in gibibytes
            (GiB). Allowed values are between 18000 and 7632000.
          format: int64
          type: string
        description:
          description: >-
            Optional. Immutable. Description of the Managed Lustre instance.
            Maximum of 2048 characters.
          type: string
        filesystem:
          description: >-
            Required. Immutable. Filesystem name for this instance. This name is
            used by client-side tools, including when mounting the instance.
            Must be 8 characters or less and can only contain letters and
            numbers.
          type: string
        lustre:
          description: >-
            Required. Immutable. Name of the Managed Lustre instance to create,
            in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          type: string
        perUnitStorageThroughput:
          description: >-
            Optional. Immutable. Throughput of the instance in MB/s/TiB. Valid
            values are 125, 250, 500, 1000. See [Performance tiers and maximum
            storage
            capacities](https://cloud.google.com/managed-lustre/docs/create-instance#performance-tiers)
            for more information.
          format: int64
          type: string
      type: object
    NewNetworkConfig:
      description: >-
        When set in a NetworkResourceConfig, indicates that a new network should
        be created.
      id: NewNetworkConfig
      properties:
        description:
          description: >-
            Optional. Immutable. Description of the network. Maximum of 2048
            characters.
          type: string
        network:
          description: >-
            Required. Immutable. Name of the network to create, in the format
            `projects/{project}/global/networks/{network}`.
          type: string
      type: object
    NewOnDemandInstancesConfig:
      description: >-
        When set in a ComputeResourceConfig, indicates that on-demand (i.e.,
        using the standard provisioning model) VM instances should be created.
      id: NewOnDemandInstancesConfig
      properties:
        machineType:
          description: >-
            Required. Immutable. Name of the Compute Engine [machine
            type](https://cloud.google.com/compute/docs/machine-resource) to
            use, e.g. `n2-standard-2`.
          type: string
        zone:
          description: >-
            Required. Immutable. Name of the zone in which VM instances should
            run, e.g., `us-central1-a`. Must be in the same region as the
            cluster, and must match the zone of any other resources specified in
            the cluster.
          type: string
      type: object
    NewReservedInstancesConfig:
      description: >-
        When set in a ComputeResourceConfig, indicates that VM instances should
        be created from a
        [reservation](https://cloud.google.com/compute/docs/instances/reservations-overview).
      id: NewReservedInstancesConfig
      properties:
        reservation:
          description: >-
            Optional. Immutable. Name of the reservation from which VM instances
            should be created, in the format
            `projects/{project}/zones/{zone}/reservations/{reservation}`.
          type: string
      type: object
    NewSpotInstancesConfig:
      description: >-
        When set in a ComputeResourceConfig, indicates that [spot
        VM](https://cloud.google.com/compute/docs/instances/spot) instances
        should be created.
      id: NewSpotInstancesConfig
      properties:
        machineType:
          description: >-
            Required. Immutable. Name of the Compute Engine [machine
            type](https://cloud.google.com/compute/docs/machine-resource) to
            use, e.g. `n2-standard-2`.
          type: string
        terminationAction:
          description: >-
            Optional. Termination action for the instance. If not specified,
            Compute Engine sets the termination action to DELETE.
          enum:
            - TERMINATION_ACTION_UNSPECIFIED
            - STOP
            - DELETE
          enumDescriptions:
            - Not set.
            - Compute Engine stops the Spot VM on preemption.
            - Compute Engine deletes the Spot VM on preemption.
          type: string
        zone:
          description: >-
            Required. Immutable. Name of the zone in which VM instances should
            run, e.g., `us-central1-a`. Must be in the same region as the
            cluster, and must match the zone of any other resources specified in
            the cluster.
          type: string
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        progress:
          $ref: '#/components/schemas/OperationProgress'
          description: Output only. Progress of the operation.
          readOnly: true
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    OperationProgress:
      description: >-
        Message describing the progress of a cluster mutation long-running
        operation.
      id: OperationProgress
      properties:
        steps:
          description: Output only. Steps and status of the operation.
          items:
            $ref: '#/components/schemas/OperationStep'
          readOnly: true
          type: array
      type: object
    OperationStep:
      description: >-
        Message describing the status of a single step in a cluster mutation
        long-running operation.
      id: OperationStep
      properties:
        checkClusterHealth:
          $ref: '#/components/schemas/CheckClusterHealth'
          description: >-
            Output only. If set, indicates that cluster health check is part of
            the operation.
          readOnly: true
        createFilestoreInstance:
          $ref: '#/components/schemas/CreateFilestoreInstance'
          description: >-
            Output only. If set, indicates that new Filestore instance creation
            is part of the operation.
          readOnly: true
        createLoginNode:
          $ref: '#/components/schemas/CreateLoginNode'
          description: >-
            Output only. If set, indicates that new login node creation is part
            of the operation.
          readOnly: true
        createLustreInstance:
          $ref: '#/components/schemas/CreateLustreInstance'
          description: >-
            Output only. If set, indicates that new Lustre instance creation is
            part of the operation.
          readOnly: true
        createNetwork:
          $ref: '#/components/schemas/CreateNetwork'
          description: >-
            Output only. If set, indicates that new network creation is part of
            the operation.
          readOnly: true
        createNodeset:
          $ref: '#/components/schemas/CreateNodeset'
          description: >-
            Output only. If set, indicates that new nodeset creation is part of
            the operation.
          readOnly: true
        createOrchestrator:
          $ref: '#/components/schemas/CreateOrchestrator'
          description: >-
            Output only. If set, indicates that orchestrator creation is part of
            the operation.
          readOnly: true
        createPartition:
          $ref: '#/components/schemas/CreatePartition'
          description: >-
            Output only. If set, indicates that new partition creation is part
            of the operation.
          readOnly: true
        createPrivateServiceAccess:
          $ref: '#/components/schemas/CreatePrivateServiceAccess'
          description: >-
            Output only. If set, indicates that new private service access
            creation is part of the operation.
          readOnly: true
        createStorageBucket:
          $ref: '#/components/schemas/CreateStorageBucket'
          description: >-
            Output only. If set, indicates that new Cloud Storage bucket
            creation is part of the operation.
          readOnly: true
        deleteFilestoreInstance:
          $ref: '#/components/schemas/DeleteFilestoreInstance'
          description: >-
            Output only. If set, indicates that Filestore instance deletion is
            part of the operation.
          readOnly: true
        deleteLoginNode:
          $ref: '#/components/schemas/DeleteLoginNode'
          description: >-
            Output only. If set, indicates that login node deletion is part of
            the operation.
          readOnly: true
        deleteLustreInstance:
          $ref: '#/components/schemas/DeleteLustreInstance'
          description: >-
            Output only. If set, indicates that Lustre instance deletion is part
            of the operation.
          readOnly: true
        deleteNetwork:
          $ref: '#/components/schemas/DeleteNetwork'
          description: >-
            Output only. If set, indicates that network deletion is part of the
            operation.
          readOnly: true
        deleteNodeset:
          $ref: '#/components/schemas/DeleteNodeset'
          description: >-
            Output only. If set, indicates that nodeset deletion is part of the
            operation.
          readOnly: true
        deleteOrchestrator:
          $ref: '#/components/schemas/DeleteOrchestrator'
          description: >-
            Output only. If set, indicates that orchestrator deletion is part of
            the operation.
          readOnly: true
        deletePartition:
          $ref: '#/components/schemas/DeletePartition'
          description: >-
            Output only. If set, indicates that partition deletion is part of
            the operation.
          readOnly: true
        deletePrivateServiceAccess:
          $ref: '#/components/schemas/DeletePrivateServiceAccess'
          description: >-
            Output only. If set, indicates that private service access deletion
            is part of the operation.
          readOnly: true
        deleteStorageBucket:
          $ref: '#/components/schemas/DeleteStorageBucket'
          description: >-
            Output only. If set, indicates that Cloud Storage bucket deletion is
            part of the operation.
          readOnly: true
        state:
          description: Output only. State of the operation step.
          enum:
            - STATE_UNSPECIFIED
            - WAITING
            - IN_PROGRESS
            - DONE
          enumDescriptions:
            - Unspecified state.
            - Initial state before step execution starts.
            - Step execution is running in progress.
            - Step execution is completed.
          readOnly: true
          type: string
        updateLoginNode:
          $ref: '#/components/schemas/UpdateLoginNode'
          description: >-
            Output only. If set, indicates that login node update is part of the
            operation.
          readOnly: true
        updateNodeset:
          $ref: '#/components/schemas/UpdateNodeset'
          description: >-
            Output only. If set, indicates that nodeset update is part of the
            operation.
          readOnly: true
        updateOrchestrator:
          $ref: '#/components/schemas/UpdateOrchestrator'
          description: >-
            Output only. If set, indicates that an orchestrator update is part
            of the operation.
          readOnly: true
        updatePartition:
          $ref: '#/components/schemas/UpdatePartition'
          description: >-
            Output only. If set, indicates that partition update is part of the
            operation.
          readOnly: true
      type: object
    Orchestrator:
      description: >-
        The component responsible for scheduling and running workloads on the
        cluster as well as providing the user interface for interacting with the
        cluster at runtime.
      id: Orchestrator
      properties:
        slurm:
          $ref: '#/components/schemas/SlurmOrchestrator'
          description: >-
            Optional. If set, indicates that the cluster should use Slurm as the
            orchestrator.
      type: object
    SlurmLoginNodes:
      description: >-
        Configuration for Slurm [login
        nodes](https://slurm.schedmd.com/quickstart_admin.html#login) in the
        cluster. Login nodes are Compute Engine VM instances that allow users to
        access the cluster over SSH.
      id: SlurmLoginNodes
      properties:
        bootDisk:
          $ref: '#/components/schemas/BootDisk'
          description: Optional. Boot disk for the login node.
        count:
          description: Required. Number of login node instances to create.
          format: int64
          type: string
        enableOsLogin:
          description: >-
            Optional. Whether [OS
            Login](https://cloud.google.com/compute/docs/oslogin) should be
            enabled on login node instances.
          type: boolean
        enablePublicIps:
          description: >-
            Optional. Whether login node instances should be assigned [external
            IP
            addresses](https://cloud.google.com/compute/docs/ip-addresses#externaladdresses).
          type: boolean
        instances:
          description: >-
            Output only. Information about the login node instances that were
            created in Compute Engine.
          items:
            $ref: '#/components/schemas/ComputeInstance'
          readOnly: true
          type: array
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional.
            [Labels](https://cloud.google.com/compute/docs/labeling-resources)
            that should be applied to each login node instance.
          type: object
        machineType:
          description: >-
            Required. Name of the Compute Engine [machine
            type](https://cloud.google.com/compute/docs/machine-resource) to use
            for login nodes, e.g. `n2-standard-2`.
          type: string
        startupScript:
          description: >-
            Optional. [Startup
            script](https://cloud.google.com/compute/docs/instances/startup-scripts/linux)
            to be run on each login node instance. Max 256KB. The script must
            complete within the system-defined default timeout of 5 minutes. For
            tasks that require more time, consider running them in the
            background using methods such as `&` or `nohup`.
          type: string
        storageConfigs:
          description: >-
            Optional. How storage resources should be mounted on each login
            node.
          items:
            $ref: '#/components/schemas/StorageConfig'
          type: array
        zone:
          description: >-
            Required. Name of the zone in which login nodes should run, e.g.,
            `us-central1-a`. Must be in the same region as the cluster, and must
            match the zone of any other resources specified in the cluster.
          type: string
      type: object
    SlurmNodeSet:
      description: >-
        Configuration for Slurm nodesets in the cluster. Nodesets are groups of
        compute nodes used by Slurm that are responsible for running workloads
        submitted to the cluster.
      id: SlurmNodeSet
      properties:
        computeId:
          description: >-
            Required. The ID of the compute resource on which this nodeset runs.
            Must match a key in the cluster's compute_resources.
          type: string
        computeInstance:
          $ref: '#/components/schemas/ComputeInstanceSlurmNodeSet'
          description: >-
            Optional. If set, indicates that the nodeset should be backed by
            Compute Engine instances.
        id:
          description: >-
            Required. The ID for the nodeset, which allows it to be referenced
            by cluster partitions. The nodeset ID must start with a lowercase
            letter (`a`-`z`), use only lowercase letters or numbers, and contain
            up to 15 characters. For example, specify `nodeset001`.
          type: string
        maxDynamicNodeCount:
          description: >-
            Optional. Controls how many additional nodes a cluster can bring
            online to handle workloads. Set this value to enable dynamic node
            creation and limit the number of additional nodes the cluster can
            bring online. Leave empty if you do not want the cluster to create
            nodes dynamically, and instead rely only on static nodes.
          format: int64
          type: string
        staticNodeCount:
          description: >-
            Optional. Number of nodes to be statically created for this nodeset.
            The cluster will attempt to ensure that at least this many nodes
            exist at all times.
          format: int64
          type: string
        storageConfigs:
          description: >-
            Optional. How storage resources should be mounted on each compute
            node.
          items:
            $ref: '#/components/schemas/StorageConfig'
          type: array
      type: object
    SlurmOrchestrator:
      description: >-
        When set in Orchestrator, indicates that the cluster should use
        [Slurm](https://slurm.schedmd.com/) as the orchestrator.
      id: SlurmOrchestrator
      properties:
        defaultPartition:
          description: >-
            Optional. Default partition to use for submitted jobs that do not
            explicitly specify a partition. Required if and only if there is
            more than one partition, in which case it must match the id of one
            of the partitions.
          type: string
        epilogBashScripts:
          description: >-
            Optional. Slurm [epilog
            scripts](https://slurm.schedmd.com/prolog_epilog.html), which will
            be executed by compute nodes whenever a node finishes running a job.
            Values must not be empty.
          items:
            type: string
          type: array
        loginNodes:
          $ref: '#/components/schemas/SlurmLoginNodes'
          description: >-
            Required. Configuration for login nodes, which allow users to access
            the cluster over SSH.
        nodeSets:
          description: >-
            Optional. Compute resource configuration for the Slurm nodesets in
            your cluster. If not specified, the cluster won't create any nodes.
          items:
            $ref: '#/components/schemas/SlurmNodeSet'
          type: array
        partitions:
          description: >-
            Optional. Configuration for the Slurm partitions in your cluster.
            Each partition can contain one or more nodesets, and you can submit
            separate jobs on each partition. If you don't specify at least one
            partition in your cluster, you can't submit jobs to the cluster.
          items:
            $ref: '#/components/schemas/SlurmPartition'
          type: array
        prologBashScripts:
          description: >-
            Optional. Slurm [prolog
            scripts](https://slurm.schedmd.com/prolog_epilog.html), which will
            be executed by compute nodes before a node begins running a new job.
            Values must not be empty.
          items:
            type: string
          type: array
      type: object
    SlurmPartition:
      description: >-
        Configuration for Slurm partitions in the cluster. Partitions are groups
        of nodesets, and are how clients specify where their workloads should be
        run.
      id: SlurmPartition
      properties:
        id:
          description: >-
            Required. ID of the partition, which is how users will identify it.
            Must conform to
            [RFC-1034](https://datatracker.ietf.org/doc/html/rfc1034)
            (lower-case, alphanumeric, and at most 63 characters).
          type: string
        nodeSetIds:
          description: >-
            Required. IDs of the nodesets that make up this partition. Values
            must match SlurmNodeSet.id.
          items:
            type: string
          type: array
      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      type: object
    StorageConfig:
      description: >-
        Description of how a storage resource should be mounted on a VM
        instance.
      id: StorageConfig
      properties:
        id:
          description: >-
            Required. ID of the storage resource to mount, which must match a
            key in the cluster's storage_resources.
          type: string
        localMount:
          description: >-
            Required. A directory inside the VM instance's file system where the
            storage resource should be mounted (e.g., `/mnt/share`).
          type: string
      type: object
    StorageResource:
      description: >-
        Represents a form of persistent storage that you can mount onto compute
        resources in the cluster.
      id: StorageResource
      properties:
        bucket:
          $ref: '#/components/schemas/BucketReference'
          description: >-
            Output only. A reference to a Google Cloud Storage bucket. Populated
            if and only if the storage resource was configured to use Google
            Cloud Storage.
          readOnly: true
        config:
          $ref: '#/components/schemas/StorageResourceConfig'
          description: >-
            Required. Immutable. Configuration for this storage resource, which
            describes how it should be created or imported. This field only
            controls how the storage resource is initially created or imported.
            Subsequent changes to the storage resource should be made via the
            resource's API and will not be reflected in the configuration.
        filestore:
          $ref: '#/components/schemas/FilestoreReference'
          description: >-
            Output only. A reference to a Filestore instance. Populated if and
            only if the storage resource was configured to use Filestore.
          readOnly: true
        lustre:
          $ref: '#/components/schemas/LustreReference'
          description: >-
            Output only. A reference to a Managed Lustre instance. Populated if
            and only if the storage resource was configured to use Managed
            Lustre.
          readOnly: true
      type: object
    StorageResourceConfig:
      description: >-
        Describes how a storage resource should be initialized. Each storage
        resource can either be imported from an existing Google Cloud resource
        or initialized when the cluster is created.
      id: StorageResourceConfig
      properties:
        existingBucket:
          $ref: '#/components/schemas/ExistingBucketConfig'
          description: >-
            Optional. Immutable. If set, indicates that an existing Cloud
            Storage bucket should be imported.
        existingFilestore:
          $ref: '#/components/schemas/ExistingFilestoreConfig'
          description: >-
            Optional. Immutable. If set, indicates that an existing Filestore
            instance should be imported.
        existingLustre:
          $ref: '#/components/schemas/ExistingLustreConfig'
          description: >-
            Optional. Immutable. If set, indicates that an existing Managed
            Lustre instance should be imported.
        newBucket:
          $ref: '#/components/schemas/NewBucketConfig'
          description: >-
            Optional. Immutable. If set, indicates that a new Cloud Storage
            bucket should be created.
        newFilestore:
          $ref: '#/components/schemas/NewFilestoreConfig'
          description: >-
            Optional. Immutable. If set, indicates that a new Filestore instance
            should be created.
        newLustre:
          $ref: '#/components/schemas/NewLustreConfig'
          description: >-
            Optional. Immutable. If set, indicates that a new Managed Lustre
            instance should be created.
      type: object
    UpdateLoginNode:
      description: >-
        When set in OperationStep, indicates that a login node should be
        updated.
      id: UpdateLoginNode
      properties: {}
      type: object
    UpdateNodeset:
      description: When set in OperationStep, indicates that a nodeset should be updated.
      id: UpdateNodeset
      properties:
        nodesets:
          description: Output only. Name of the nodeset to update
          items:
            type: string
          readOnly: true
          type: array
      type: object
    UpdateOrchestrator:
      description: >-
        When set in OperationStep, indicates that an orchestrator should be
        updated.
      id: UpdateOrchestrator
      properties: {}
      type: object
    UpdatePartition:
      description: When set in OperationStep, indicates that a partition should be updated.
      id: UpdatePartition
      properties:
        partitions:
          description: Output only. Name of the partition to update
          items:
            type: string
          readOnly: true
          type: array
      type: object
  securitySchemes:
    Oauth2:
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
      type: oauth2
    Oauth2c:
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: *ref_0
          tokenUrl: https://accounts.google.com/o/oauth2/token
      type: oauth2
  x-stackQL-resources:
    clusters:
      id: google.hypercomputecluster.clusters
      methods:
        create:
          operation:
            $ref: >-
              #/paths/~1v1~1projects~1{projectsId}~1locations~1{locationsId}~1clusters/post
