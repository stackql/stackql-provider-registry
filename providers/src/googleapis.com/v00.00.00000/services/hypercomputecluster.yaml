openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Cluster Director API
  description: >-
    The Cluster Director API lets you deploy, manage, and monitor clusters that
    run artificial intelligence (AI), machine learning (ML), or high performance
    computing (HPC) workloads.
  version: v1
  x-discovery-doc-revision: '20260722'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://docs.cloud.google.com/cluster-director/docs
servers:
  - url: https://hypercomputecluster.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    DeleteOrchestrator:
      id: DeleteOrchestrator
      description: >-
        When set in OperationStep, indicates that an orchestrator should be
        deleted.
      type: object
      properties: {}
    OperationMetadata:
      properties:
        createTime:
          type: string
          description: Output only. The time the operation was created.
          readOnly: true
          format: google-datetime
        endTime:
          type: string
          description: Output only. The time the operation finished running.
          readOnly: true
          format: google-datetime
        verb:
          readOnly: true
          type: string
          description: Output only. Name of the verb executed by the operation.
        requestedCancellation:
          readOnly: true
          type: boolean
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
        progress:
          description: Output only. Progress of the operation.
          readOnly: true
          $ref: '#/components/schemas/OperationProgress'
        apiVersion:
          type: string
          description: Output only. API version used to start the operation.
          readOnly: true
        target:
          readOnly: true
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          type: string
      type: object
      id: OperationMetadata
      description: Represents the metadata of the long-running operation.
    BootDisk:
      properties:
        sizeGb:
          type: string
          description: >-
            Optional. The size of the disk in gigabytes (GB), which must be at
            least 40 GB.
          format: int64
        type:
          type: string
          description: >-
            Optional. [Persistent disk
            type](https://cloud.google.com/compute/docs/disks#disk-types), in
            the format `projects/{project}/zones/{zone}/diskTypes/{disk_type}`.
      id: BootDisk
      description: >-
        A [Persistent disk](https://cloud.google.com/compute/docs/disks) used as
        the boot disk for a Compute Engine VM instance.
      type: object
    StorageResource:
      properties:
        lustre:
          description: >-
            Output only. A reference to a Managed Lustre instance. Populated if
            and only if the storage resource was configured to use Managed
            Lustre.
          readOnly: true
          $ref: '#/components/schemas/LustreReference'
        config:
          $ref: '#/components/schemas/StorageResourceConfig'
          description: >-
            Required. Immutable. Configuration for this storage resource, which
            describes how it should be created or imported. This field only
            controls how the storage resource is initially created or imported.
            Subsequent changes to the storage resource should be made via the
            resource's API and will not be reflected in the configuration.
        filestore:
          description: >-
            Output only. A reference to a Filestore instance. Populated if and
            only if the storage resource was configured to use Filestore.
          readOnly: true
          $ref: '#/components/schemas/FilestoreReference'
        bucket:
          description: >-
            Output only. A reference to a Google Cloud Storage bucket. Populated
            if and only if the storage resource was configured to use Google
            Cloud Storage.
          readOnly: true
          $ref: '#/components/schemas/BucketReference'
      type: object
      id: StorageResource
      description: >-
        Represents a form of persistent storage that you can mount onto compute
        resources in the cluster.
    OperationStep:
      properties:
        createPartition:
          readOnly: true
          $ref: '#/components/schemas/CreatePartition'
          description: >-
            Output only. If set, indicates that new partition creation is part
            of the operation.
        deleteOrchestrator:
          readOnly: true
          $ref: '#/components/schemas/DeleteOrchestrator'
          description: >-
            Output only. If set, indicates that orchestrator deletion is part of
            the operation.
        deleteLustreInstance:
          description: >-
            Output only. If set, indicates that Lustre instance deletion is part
            of the operation.
          readOnly: true
          $ref: '#/components/schemas/DeleteLustreInstance'
        createPrivateServiceAccess:
          readOnly: true
          $ref: '#/components/schemas/CreatePrivateServiceAccess'
          description: >-
            Output only. If set, indicates that new private service access
            creation is part of the operation.
        createFilestoreInstance:
          description: >-
            Output only. If set, indicates that new Filestore instance creation
            is part of the operation.
          readOnly: true
          $ref: '#/components/schemas/CreateFilestoreInstance'
        deleteNodeset:
          readOnly: true
          $ref: '#/components/schemas/DeleteNodeset'
          description: >-
            Output only. If set, indicates that nodeset deletion is part of the
            operation.
        deleteFilestoreInstance:
          readOnly: true
          $ref: '#/components/schemas/DeleteFilestoreInstance'
          description: >-
            Output only. If set, indicates that Filestore instance deletion is
            part of the operation.
        createOrchestrator:
          readOnly: true
          $ref: '#/components/schemas/CreateOrchestrator'
          description: >-
            Output only. If set, indicates that orchestrator creation is part of
            the operation.
        deleteNetwork:
          description: >-
            Output only. If set, indicates that network deletion is part of the
            operation.
          readOnly: true
          $ref: '#/components/schemas/DeleteNetwork'
        updateOrchestrator:
          readOnly: true
          $ref: '#/components/schemas/UpdateOrchestrator'
          description: >-
            Output only. If set, indicates that an orchestrator update is part
            of the operation.
        updateNodeset:
          readOnly: true
          $ref: '#/components/schemas/UpdateNodeset'
          description: >-
            Output only. If set, indicates that nodeset update is part of the
            operation.
        createNetwork:
          readOnly: true
          $ref: '#/components/schemas/CreateNetwork'
          description: >-
            Output only. If set, indicates that new network creation is part of
            the operation.
        deletePrivateServiceAccess:
          description: >-
            Output only. If set, indicates that private service access deletion
            is part of the operation.
          readOnly: true
          $ref: '#/components/schemas/DeletePrivateServiceAccess'
        updateLoginNode:
          description: >-
            Output only. If set, indicates that login node update is part of the
            operation.
          readOnly: true
          $ref: '#/components/schemas/UpdateLoginNode'
        createStorageBucket:
          description: >-
            Output only. If set, indicates that new Cloud Storage bucket
            creation is part of the operation.
          readOnly: true
          $ref: '#/components/schemas/CreateStorageBucket'
        checkClusterHealth:
          description: >-
            Output only. If set, indicates that cluster health check is part of
            the operation.
          readOnly: true
          $ref: '#/components/schemas/CheckClusterHealth'
        state:
          description: Output only. State of the operation step.
          enumDescriptions:
            - Unspecified state.
            - Initial state before step execution starts.
            - Step execution is running in progress.
            - Step execution is completed.
          readOnly: true
          type: string
          enum:
            - STATE_UNSPECIFIED
            - WAITING
            - IN_PROGRESS
            - DONE
        createNodeset:
          description: >-
            Output only. If set, indicates that new nodeset creation is part of
            the operation.
          readOnly: true
          $ref: '#/components/schemas/CreateNodeset'
        deleteLoginNode:
          readOnly: true
          $ref: '#/components/schemas/DeleteLoginNode'
          description: >-
            Output only. If set, indicates that login node deletion is part of
            the operation.
        deletePartition:
          readOnly: true
          $ref: '#/components/schemas/DeletePartition'
          description: >-
            Output only. If set, indicates that partition deletion is part of
            the operation.
        deleteStorageBucket:
          description: >-
            Output only. If set, indicates that Cloud Storage bucket deletion is
            part of the operation.
          readOnly: true
          $ref: '#/components/schemas/DeleteStorageBucket'
        createLustreInstance:
          description: >-
            Output only. If set, indicates that new Lustre instance creation is
            part of the operation.
          readOnly: true
          $ref: '#/components/schemas/CreateLustreInstance'
        createLoginNode:
          description: >-
            Output only. If set, indicates that new login node creation is part
            of the operation.
          readOnly: true
          $ref: '#/components/schemas/CreateLoginNode'
        updatePartition:
          readOnly: true
          $ref: '#/components/schemas/UpdatePartition'
          description: >-
            Output only. If set, indicates that partition update is part of the
            operation.
      type: object
      id: OperationStep
      description: >-
        Message describing the status of a single step in a cluster mutation
        long-running operation.
    DeleteStorageBucket:
      id: DeleteStorageBucket
      description: >-
        When set in OperationStep, indicates that Cloud Storage bucket should be
        deleted.
      type: object
      properties:
        bucket:
          readOnly: true
          type: string
          description: Output only. Name of the bucket.
    DeleteFilestoreInstance:
      id: DeleteFilestoreInstance
      description: >-
        When set in OperationStep, indicates that a Filestore instance should be
        deleted.
      type: object
      properties:
        filestore:
          readOnly: true
          type: string
          description: >-
            Output only. Name of the Filestore instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`
    DeletePartition:
      properties:
        partitions:
          readOnly: true
          items:
            type: string
          type: array
          description: Output only. Name of the partition to delete
      type: object
      id: DeletePartition
      description: When set in OperationStep, indicates that a partition should be deleted.
    NewOnDemandInstancesConfig:
      type: object
      id: NewOnDemandInstancesConfig
      description: >-
        When set in a ComputeResourceConfig, indicates that on-demand (i.e.,
        using the standard provisioning model) VM instances should be created.
      properties:
        zone:
          type: string
          description: >-
            Required. Immutable. Name of the zone in which VM instances should
            run, e.g., `us-central1-a`. Must be in the same region as the
            cluster, and must match the zone of any other resources specified in
            the cluster.
        machineType:
          description: >-
            Required. Immutable. Name of the Compute Engine [machine
            type](https://cloud.google.com/compute/docs/machine-resource) to
            use, e.g. `n2-standard-2`.
          type: string
    DeleteLoginNode:
      properties: {}
      type: object
      id: DeleteLoginNode
      description: >-
        When set in OperationStep, indicates that a login node should be
        deleted.
    DeletePrivateServiceAccess:
      properties: {}
      id: DeletePrivateServiceAccess
      description: >-
        When set in OperationStep, indicates private service access deletion
        step.
      type: object
    Orchestrator:
      properties:
        slurm:
          description: >-
            Optional. If set, indicates that the cluster should use Slurm as the
            orchestrator.
          $ref: '#/components/schemas/SlurmOrchestrator'
      type: object
      id: Orchestrator
      description: >-
        The component responsible for scheduling and running workloads on the
        cluster as well as providing the user interface for interacting with the
        cluster at runtime.
    StorageResourceConfig:
      properties:
        newBucket:
          description: >-
            Optional. Immutable. If set, indicates that a new Cloud Storage
            bucket should be created.
          $ref: '#/components/schemas/NewBucketConfig'
        existingBucket:
          $ref: '#/components/schemas/ExistingBucketConfig'
          description: >-
            Optional. Immutable. If set, indicates that an existing Cloud
            Storage bucket should be imported.
        newFilestore:
          $ref: '#/components/schemas/NewFilestoreConfig'
          description: >-
            Optional. Immutable. If set, indicates that a new Filestore instance
            should be created.
        existingFilestore:
          $ref: '#/components/schemas/ExistingFilestoreConfig'
          description: >-
            Optional. Immutable. If set, indicates that an existing Filestore
            instance should be imported.
        newLustre:
          description: >-
            Optional. Immutable. If set, indicates that a new Managed Lustre
            instance should be created.
          $ref: '#/components/schemas/NewLustreConfig'
        existingLustre:
          $ref: '#/components/schemas/ExistingLustreConfig'
          description: >-
            Optional. Immutable. If set, indicates that an existing Managed
            Lustre instance should be imported.
      id: StorageResourceConfig
      description: >-
        Describes how a storage resource should be initialized. Each storage
        resource can either be imported from an existing Google Cloud resource
        or initialized when the cluster is created.
      type: object
    ExistingLustreConfig:
      id: ExistingLustreConfig
      description: >-
        When set in a StorageResourceConfig, indicates that an existing [Managed
        Lustre](https://cloud.google.com/products/managed-lustre) instance
        should be imported.
      type: object
      properties:
        lustre:
          description: >-
            Required. Immutable. Name of the Managed Lustre instance to import,
            in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          type: string
    Empty:
      type: object
      id: Empty
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      properties: {}
    CreateLustreInstance:
      type: object
      id: CreateLustreInstance
      description: >-
        When set in OperationStep, indicates that a new lustre instance should
        be created.
      properties:
        lustre:
          readOnly: true
          description: >-
            Output only. Name of the Managed Lustre instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          type: string
    OperationProgress:
      properties:
        steps:
          readOnly: true
          items:
            $ref: '#/components/schemas/OperationStep'
          type: array
          description: Output only. Steps and status of the operation.
      type: object
      id: OperationProgress
      description: >-
        Message describing the progress of a cluster mutation long-running
        operation.
    FileShareConfig:
      properties:
        capacityGb:
          type: string
          description: >-
            Required. Size of the filestore in GB. Must be between 1024 and
            102400, and must meet scalability requirements described at
            https://cloud.google.com/filestore/docs/service-tiers.
          format: int64
        fileShare:
          type: string
          description: Required. Filestore share location
      id: FileShareConfig
      description: Message describing filestore configuration
      type: object
    NetworkResourceConfig:
      properties:
        newNetwork:
          description: >-
            Optional. Immutable. If set, indicates that a new network should be
            created.
          $ref: '#/components/schemas/NewNetworkConfig'
        existingNetwork:
          $ref: '#/components/schemas/ExistingNetworkConfig'
          description: >-
            Optional. Immutable. If set, indicates that an existing network
            should be imported.
      id: NetworkResourceConfig
      description: >-
        Describes how a network resource should be initialized. Each network
        resource can either be imported from an existing Google Cloud resource
        or initialized when the cluster is created.
      type: object
    CreateNetwork:
      id: CreateNetwork
      description: >-
        When set in OperationStep, indicates that a new network should be
        created.
      type: object
      properties:
        network:
          readOnly: true
          type: string
          description: >-
            Output only. Name of the network to create, in the format
            `projects/{project}/global/networks/{network}`.
    ComputeInstanceSlurmNodeSet:
      id: ComputeInstanceSlurmNodeSet
      description: >-
        When set in a SlurmNodeSet, indicates that the nodeset should be backed
        by Compute Engine VM instances.
      type: object
      properties:
        labels:
          additionalProperties:
            type: string
          type: object
          description: >-
            Optional.
            [Labels](https://cloud.google.com/compute/docs/labeling-resources)
            that should be applied to each VM instance in the nodeset.
        startupScript:
          type: string
          description: >-
            Optional. [Startup
            script](https://cloud.google.com/compute/docs/instances/startup-scripts/linux)
            to be run on each VM instance in the nodeset. Max 256KB.
        bootDisk:
          $ref: '#/components/schemas/BootDisk'
          description: Optional. Boot disk for the compute instance
    ComputeResourceConfig:
      type: object
      id: ComputeResourceConfig
      description: Describes how a compute resource should be created at runtime.
      properties:
        newSpotInstances:
          description: >-
            Optional. Immutable. If set, indicates that this resource should use
            spot VMs.
          $ref: '#/components/schemas/NewSpotInstancesConfig'
        newReservedInstances:
          $ref: '#/components/schemas/NewReservedInstancesConfig'
          description: >-
            Optional. Immutable. If set, indicates that this resource should use
            reserved VMs.
        newFlexStartInstances:
          $ref: '#/components/schemas/NewFlexStartInstancesConfig'
          description: >-
            Optional. Immutable. If set, indicates that this resource should use
            flex-start VMs.
        newOnDemandInstances:
          description: >-
            Optional. Immutable. If set, indicates that this resource should use
            on-demand VMs.
          $ref: '#/components/schemas/NewOnDemandInstancesConfig'
    CreatePartition:
      type: object
      id: CreatePartition
      description: When set in OperationStep, indicates that a partition should be created.
      properties:
        partitions:
          description: Output only. Name of the partition to create
          type: array
          items:
            type: string
          readOnly: true
    GcsAutoclassConfig:
      type: object
      id: GcsAutoclassConfig
      description: Message describing Google Cloud Storage autoclass configuration
      properties:
        enabled:
          type: boolean
          description: Required. Enables Auto-class feature.
        terminalStorageClass:
          type: string
          enum:
            - TERMINAL_STORAGE_CLASS_UNSPECIFIED
            - NEARLINE
            - ARCHIVE
          description: Optional. Terminal storage class of the autoclass bucket
          enumDescriptions:
            - Unspecified terminal storage class
            - Nearline terminal storage class
            - Archive terminal storage class
    GcsHierarchicalNamespaceConfig:
      type: object
      id: GcsHierarchicalNamespaceConfig
      description: >-
        Message describing Google Cloud Storage hierarchical namespace
        configuration
      properties:
        enabled:
          description: Required. Enables hierarchical namespace setup for the bucket.
          type: boolean
    FilestoreReference:
      properties:
        filestore:
          readOnly: true
          type: string
          description: >-
            Output only. Name of the Filestore instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`
      type: object
      id: FilestoreReference
      description: >-
        A reference to a [Filestore](https://cloud.google.com/filestore)
        instance.
    NewFlexStartInstancesConfig:
      type: object
      id: NewFlexStartInstancesConfig
      description: >-
        When set in a ComputeResourceConfig, indicates that VM instances should
        be created using [Flex
        Start](https://cloud.google.com/compute/docs/instances/provisioning-models).
      properties:
        machineType:
          description: >-
            Required. Immutable. Name of the Compute Engine [machine
            type](https://cloud.google.com/compute/docs/machine-resource) to
            use, e.g. `n2-standard-2`.
          type: string
        maxDuration:
          format: google-duration
          type: string
          description: >-
            Required. Immutable. Specifies the time limit for created instances.
            Instances will be terminated at the end of this duration.
        zone:
          description: >-
            Required. Immutable. Name of the zone in which VM instances should
            run, e.g., `us-central1-a`. Must be in the same region as the
            cluster, and must match the zone of any other resources specified in
            the cluster.
          type: string
    DeleteNodeset:
      id: DeleteNodeset
      description: When set in OperationStep, indicates that a nodeset should be deleted.
      type: object
      properties:
        nodesets:
          readOnly: true
          items:
            type: string
          type: array
          description: Output only. Name of the nodeset to delete
    NewBucketConfig:
      id: NewBucketConfig
      description: >-
        When set in a StorageResourceConfig, indicates that a new [Google Cloud
        Storage](https://cloud.google.com/storage) bucket should be created.
      type: object
      properties:
        hierarchicalNamespace:
          $ref: '#/components/schemas/GcsHierarchicalNamespaceConfig'
          description: >-
            Optional. Immutable. If set, indicates that the bucket should use
            [hierarchical
            namespaces](https://cloud.google.com/storage/docs/hns-overview).
        autoclass:
          description: >-
            Optional. Immutable. If set, indicates that the bucket should use
            [Autoclass](https://cloud.google.com/storage/docs/autoclass).
          $ref: '#/components/schemas/GcsAutoclassConfig'
        storageClass:
          type: string
          enum:
            - STORAGE_CLASS_UNSPECIFIED
            - STANDARD
            - NEARLINE
            - COLDLINE
            - ARCHIVE
          description: >-
            Optional. Immutable. If set, uses the provided storage class as the
            bucket's default storage class.
          enumDescriptions:
            - Not set.
            - Best for data that is frequently accessed.
            - Low-cost storage for data that is accessed less frequently.
            - Very low-cost storage for infrequently accessed data.
            - >-
              Lowest-cost storage for data archiving, online backup, and
              disaster recovery.
        bucket:
          description: Required. Immutable. Name of the Cloud Storage bucket to create.
          type: string
    UpdatePartition:
      properties:
        partitions:
          items:
            type: string
          readOnly: true
          description: Output only. Name of the partition to update
          type: array
      id: UpdatePartition
      description: When set in OperationStep, indicates that a partition should be updated.
      type: object
    CreateNodeset:
      id: CreateNodeset
      description: When set in OperationStep, indicates that a nodeset should be created.
      type: object
      properties:
        nodesets:
          description: Output only. Name of the nodeset to create
          type: array
          items:
            type: string
          readOnly: true
    NetworkReference:
      id: NetworkReference
      description: >-
        A reference to a [VPC network](https://cloud.google.com/vpc/docs/vpc) in
        Google Compute Engine.
      type: object
      properties:
        subnetwork:
          type: string
          description: >-
            Output only. Name of the particular subnetwork being used by the
            cluster, in the format
            `projects/{project}/regions/{region}/subnetworks/{subnetwork}`.
          readOnly: true
        network:
          readOnly: true
          type: string
          description: >-
            Output only. Name of the network, in the format
            `projects/{project}/global/networks/{network}`.
    CreateFilestoreInstance:
      properties:
        filestore:
          readOnly: true
          description: >-
            Output only. Name of the Filestore instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`
          type: string
      id: CreateFilestoreInstance
      description: >-
        When set in OperationStep, indicates that a new filestore instance
        should be created.
      type: object
    UpdateNodeset:
      type: object
      id: UpdateNodeset
      description: When set in OperationStep, indicates that a nodeset should be updated.
      properties:
        nodesets:
          readOnly: true
          items:
            type: string
          type: array
          description: Output only. Name of the nodeset to update
    ExistingBucketConfig:
      properties:
        bucket:
          type: string
          description: Required. Immutable. Name of the Cloud Storage bucket to import.
      id: ExistingBucketConfig
      description: >-
        When set in a StorageResourceConfig, indicates that an existing [Google
        Cloud Storage](https://cloud.google.com/storage) bucket should be
        imported.
      type: object
    ComputeInstance:
      type: object
      id: ComputeInstance
      description: >-
        Details about a Compute Engine
        [instance](https://cloud.google.com/compute/docs/instances).
      properties:
        instance:
          readOnly: true
          description: >-
            Output only. Name of the VM instance, in the format
            `projects/{project}/zones/{zone}/instances/{instance}`.
          type: string
    UpdateOrchestrator:
      id: UpdateOrchestrator
      description: >-
        When set in OperationStep, indicates that an orchestrator should be
        updated.
      type: object
      properties: {}
    CreatePrivateServiceAccess:
      properties: {}
      id: CreatePrivateServiceAccess
      description: >-
        When set in OperationStep, indicates that a new private service access
        should be created.
      type: object
    NewReservedInstancesConfig:
      properties:
        reservation:
          type: string
          description: >-
            Optional. Immutable. Name of the reservation from which VM instances
            should be created, in the format
            `projects/{project}/zones/{zone}/reservations/{reservation}`.
      type: object
      id: NewReservedInstancesConfig
      description: >-
        When set in a ComputeResourceConfig, indicates that VM instances should
        be created from a
        [reservation](https://cloud.google.com/compute/docs/instances/reservations-overview).
    CreateStorageBucket:
      id: CreateStorageBucket
      description: >-
        When set in OperationStep, indicates that a new storage bucket should be
        created.
      type: object
      properties:
        bucket:
          readOnly: true
          description: Output only. Name of the bucket.
          type: string
    NetworkResource:
      id: NetworkResource
      description: >-
