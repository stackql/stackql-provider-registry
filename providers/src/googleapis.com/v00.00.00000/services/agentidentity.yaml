          type: string
          enum:
            - STATE_UNSPECIFIED
            - ACTIVE
            - SUSPENDED
        name:
          description: Identifier. name of resource
          type: string
        createTime:
          type: string
          format: google-datetime
          description: Output only. [Output only] Create time stamp
          readOnly: true
        scopes:
          type: array
          description: >-
            Output only. The scopes actually granted by the end user during the
