          items:
            type: string
          type: array
    ListAccessSummariesResponse:
      id: ListAccessSummariesResponse
      type: object
      description: Message for response to listing AccessSummaries
      properties:
        accessSummaries:
          description: The list of AccessSummary
          items:
            $ref: '#/components/schemas/AccessSummary'
          type: array
        nextPageToken:
          type: string
          description: A token identifying a page of results the server should return.
        unreachable:
          type: array
          description: Unordered list. Locations that could not be reached.
          items:
            type: string
    AccessSummary:
      id: AccessSummary
      type: object
      description: Message describing AccessSummary object
      properties:
        authProviderType:
          type: string
          enum:
            - AUTH_PROVIDER_TYPE_UNSPECIFIED
            - AUTH_PROVIDER_TYPE_THREE_LEGGED_OAUTH
            - AUTH_PROVIDER_TYPE_TWO_LEGGED_OAUTH
            - AUTH_PROVIDER_TYPE_API_KEY
            - AUTH_PROVIDER_TYPE_GEMINI_ENTERPRISE
          description: >-
            Output only. The type of the connector that was used to create this
            access summary.
          enumDescriptions:
            - Unspecified auth-provider type.
            - Three Legged OAuth auth-provider type.
            - Two Legged OAuth auth-provider type.
            - API Key auth-provider type.
            - Gemini Enterprise auth-provider type.
          readOnly: true
        labels:
          type: object
          additionalProperties:
            type: string
          description: Optional. Labels as key value pairs
        tokenUrl:
          type: string
          description: Output only. The url of the authentication server that was accessed.
          readOnly: true
        purgeTime:
          type: string
          description: >-
            Output only. The time when this access summary is permanently
            deleted.
          readOnly: true
          format: google-datetime
        firstAccessTime:
          type: string
          description: >-
            Output only. The first time this user has interacted with this
            workload. Rounded to the previous hour.
          readOnly: true
          format: google-datetime
        lastAccessTime:
          type: string
          format: google-datetime
          description: >-
            Output only. The most recent time this user has interacted with this
            workload. Rounded to the previous hour.
          readOnly: true
        userId:
          description: >-
            Output only. The user_id provided by the workload application for
            this user. Not verified by Google.
          readOnly: true
          type: string
        authProvider:
          type: string
          description: >-
            Output only. The auth_provider that this access summary is
            associated with.
          readOnly: true
        workloadId:
          type: string
          description: >-
            Output only. The identity bound to the workload that this user
            interacted with to produce this AccessSummary. Will typically be an
            agentic spiffe id
          readOnly: true
        name:
          description: Output only. Identifier. Name of the AccessSummary
          readOnly: true
          type: string
        scopes:
          description: >-
            Output only. All scopes that have been used by this user with this
            workload. The number of scopes is limited to 200.
          readOnly: true
          items:
            type: string
          type: array
    ListAuthProvidersResponse:
      description: Message for response to listing AuthProviders
      properties:
        unreachable:
          type: array
          description: Unordered list. Locations that could not be reached.
          items:
            type: string
        nextPageToken:
          description: A token identifying a page of results the server should return.
          type: string
        authProviders:
          type: array
          description: The list of AuthProvider
          items:
            $ref: '#/components/schemas/AuthProvider'
      id: ListAuthProvidersResponse
      type: object
    GeminiEnterpriseAuthProviderParams:
      description: Message describing GeminiEnterpriseAuthProviderParams object.
      properties: {}
      id: GeminiEnterpriseAuthProviderParams
      type: object
    ApiKeyParams:
