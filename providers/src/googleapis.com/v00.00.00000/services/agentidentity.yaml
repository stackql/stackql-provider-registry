      type: object
      description: Response message for RevokeAuthorization.
      properties: {}
    ThreeLeggedOAuth:
      description: Message describing ThreeLeggedOAuth object.
      properties:
        clientSecret:
          description: Optional. Input only. The client secret of the OAuth client.
          type: string
        clientId:
          type: string
          description: Optional. The client ID of the OAuth client.
        enablePkce:
          description: >-
            Optional. Enables Proof Key for Code Exchange (PKCE) for the OAuth
            flow to prevent authorization code interception attacks.
          type: boolean
        redirectUrl:
          description: >-
            Output only. The redirect URL this auth_provider uses for the OAuth
            exchange. This is deterministic based on the name of the
            auth_provider.
          readOnly: true
          type: string
        defaultContinueUri:
          description: >-
