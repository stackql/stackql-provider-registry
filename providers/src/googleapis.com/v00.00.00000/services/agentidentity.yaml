            when no continue URI is provided in the RetrieveCredentials request.
          type: string
        authorizationUrl:
          description: >-
            Optional. The authorization endpoint to send users to for consenting
            to delegate to the agent. eg. "https://auth.atlassian.com/authorize"
          type: string
        tokenUrl:
          description: >-
            Optional. The token endpoint for requesting tokens on behalf of an
            end user. eg. "https://auth.atlassian.com/oauth/token"
          type: string
