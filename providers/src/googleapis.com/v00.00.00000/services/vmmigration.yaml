openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: VM Migration API
  description: >-
    Use the Migrate to Virtual Machines API to programmatically migrate
    workloads. 
  version: v1
  x-discovery-doc-revision: '20260723'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/migrate/virtual-machines
servers:
  - url: https://vmmigration.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    AwsSourceDetails:
      description: >-
        AwsSourceDetails message describes a specific source details for the AWS
        source type.
      type: object
      id: AwsSourceDetails
      properties:
        accessKeyCreds:
          description: AWS Credentials using access key id and secret.
          $ref: '#/components/schemas/AccessKeyCredentials'
        state:
          type: string
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - FAILED
            - ACTIVE
          enumDescriptions:
            - >-
              The state is unknown. This is used for API compatibility only and
              is not used by the system.
            - The state was not sampled by the health checks yet.
            - >-
              The source is available but might not be usable yet due to invalid
              credentials or another reason. The error message will contain
              further details.
            - The source exists and its credentials were verified.
          description: Output only. State of the source as determined by the health check.
          readOnly: true
        publicIp:
          description: >-
            Output only. The source's public IP. All communication initiated by
            this source will originate from this IP.
          type: string
          readOnly: true
        error:
          $ref: '#/components/schemas/Status'
          readOnly: true
          description: >-
            Output only. Provides details on the state of the Source in case of
            an error.
        inventoryTagList:
          description: AWS resource tags to limit the scope of the source inventory.
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        inventorySecurityGroupNames:
          items:
            type: string
          description: AWS security group names to limit the scope of the source inventory.
          type: array
        awsRegion:
          description: Immutable. The AWS region that the source VMs will be migrated from.
          type: string
        migrationResourcesUserTags:
          description: >-
            User specified tags to add to every M2VM generated resource in AWS.
            These tags will be set in addition to the default tags that are set
            as part of the migration process. The tags must not begin with the
            reserved prefix `m2vm`.
          type: object
          additionalProperties:
            type: string
    AwsSourceDiskDetails:
      description: Represents the source AWS Disk details.
      type: object
      id: AwsSourceDiskDetails
      properties:
        volumeId:
          description: Required. AWS volume ID.
          type: string
        sizeGib:
          description: Output only. Size in GiB.
          type: string
          format: int64
          readOnly: true
        diskType:
          type: string
          enum:
            - TYPE_UNSPECIFIED
            - GP2
            - GP3
            - IO1
            - IO2
            - ST1
            - SC1
            - STANDARD
          enumDescriptions:
            - Unspecified AWS disk type. Should not be used.
            - GP2 disk type.
            - GP3 disk type.
            - IO1 disk type.
            - IO2 disk type.
            - ST1 disk type.
            - SC1 disk type.
            - Standard disk type.
          description: Optional. Output only. Disk type.
          readOnly: true
        tags:
          readOnly: true
          description: Optional. Output only. A map of AWS volume tags.
          type: object
          additionalProperties:
            type: string
    ProvisioningTargetDiskStep:
      id: ProvisioningTargetDiskStep
      properties: {}
      description: ProvisioningTargetDiskStep contains specific step details.
      type: object
    AwsDiskDetails:
      id: AwsDiskDetails
      properties:
        diskNumber:
          readOnly: true
          description: Output only. The ordinal number of the disk.
          type: integer
          format: int32
        volumeId:
          description: Output only. AWS volume ID.
          type: string
          readOnly: true
        sizeGb:
          description: Output only. Size in GB.
          type: string
          format: int64
          readOnly: true
      description: The details of an AWS instance disk.
      type: object
    ReplicationSync:
      description: >-
        ReplicationSync contain information about the last replica sync to the
        cloud.
      type: object
      id: ReplicationSync
      properties:
        lastSyncTime:
          description: >-
            The most updated snapshot created time in the source that finished
            replication.
          type: string
          format: google-datetime
    UpgradeStatus:
      id: UpgradeStatus
      properties:
        previousVersion:
          description: The version from which we upgraded.
          type: string
        version:
          description: The version to upgrade to.
          type: string
        state:
          enumDescriptions:
            - The state was not sampled by the health checks yet.
            - The upgrade has started.
            - The upgrade failed.
            - The upgrade finished successfully.
          description: The state of the upgradeAppliance operation.
          type: string
          enum:
            - STATE_UNSPECIFIED
            - RUNNING
            - FAILED
            - SUCCEEDED
        error:
          readOnly: true
          description: >-
            Output only. Provides details on the state of the upgrade operation
            in case of an error.
          $ref: '#/components/schemas/Status'
        startTime:
          description: The time the operation was started.
          type: string
          format: google-datetime
      description: UpgradeStatus contains information about upgradeAppliance operation.
      type: object
    CloneJob:
      description: >-
        CloneJob describes the process of creating a clone of a MigratingVM to
        the requested target based on the latest successful uploaded snapshots.
        While the migration cycles of a MigratingVm take place, it is possible
        to verify the uploaded VM can be started in the cloud, by creating a
        clone. The clone can be created without any downtime, and it is created
        using the latest snapshots which are already in the cloud. The cloneJob
        is only responsible for its work, not its products, which means once it
        is finished, it will never touch the instance it created. It will only
        delete it in case of the CloneJob being cancelled or upon failure to
        clone.
      type: object
      id: CloneJob
      properties:
        state:
          type: string
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - ACTIVE
            - FAILED
            - SUCCEEDED
            - CANCELLED
            - CANCELLING
            - ADAPTING_OS
          enumDescriptions:
            - >-
              The state is unknown. This is used for API compatibility only and
              is not used by the system.
            - The clone job has not yet started.
            - The clone job is active and running.
            - The clone job finished with errors.
            - The clone job finished successfully.
            - The clone job was cancelled.
            - The clone job is being cancelled.
            - >-
              OS adaptation is running as part of the clone job to generate
              license.
          description: Output only. State of the clone job.
          readOnly: true
        stateTime:
          readOnly: true
          description: Output only. The time the state was last updated.
          type: string
          format: google-datetime
        computeEngineTargetDetails:
          $ref: '#/components/schemas/ComputeEngineTargetDetails'
          readOnly: true
          description: Output only. Details of the target VM in Compute Engine.
        name:
          readOnly: true
          description: Output only. The name of the clone.
          type: string
        computeEngineDisksTargetDetails:
          description: >-
            Output only. Details of the target Persistent Disks in Compute
            Engine.
          readOnly: true
          $ref: '#/components/schemas/ComputeEngineDisksTargetDetails'
        steps:
          readOnly: true
          items:
            $ref: '#/components/schemas/CloneStep'
          description: Output only. The clone steps list representing its progress.
          type: array
        createTime:
          readOnly: true
          description: >-
            Output only. The time the clone job was created (as an API call, not
            when it was actually created in the target).
          type: string
          format: google-datetime
        endTime:
          description: Output only. The time the clone job was ended.
          type: string
          format: google-datetime
          readOnly: true
        error:
          readOnly: true
          description: >-
            Output only. Provides details for the errors that led to the Clone
            Job's state.
          $ref: '#/components/schemas/Status'
    ComputeEngineTargetDetails:
      description: >-
        ComputeEngineTargetDetails is a collection of details for creating a VM
        in a target Compute Engine project.
      type: object
      id: ComputeEngineTargetDetails
      properties:
        bootOption:
          description: The VM Boot Option, as set in the source VM.
          type: string
          enum:
            - COMPUTE_ENGINE_BOOT_OPTION_UNSPECIFIED
            - COMPUTE_ENGINE_BOOT_OPTION_EFI
            - COMPUTE_ENGINE_BOOT_OPTION_BIOS
          enumDescriptions:
            - The boot option is unknown.
            - The boot option is EFI.
            - The boot option is BIOS.
        serviceAccount:
          description: The service account to associate the VM with.
          type: string
        secureBoot:
          description: >-
            Defines whether the instance has Secure Boot enabled. This can be
            set to true only if the VM boot option is EFI.
          type: boolean
        networkTags:
          description: A list of network tags to associate with the VM.
          type: array
          items:
            type: string
        hostname:
          description: The hostname to assign to the VM.
          type: string
        metadata:
          description: The metadata key/value pairs to assign to the VM.
          type: object
          additionalProperties:
            type: string
        machineTypeSeries:
          description: The machine type series to create the VM with.
          type: string
        computeScheduling:
          description: Compute instance scheduling information (if empty default is used).
          $ref: '#/components/schemas/ComputeScheduling'
        additionalLicenses:
          items:
            type: string
          description: Additional licenses to assign to the VM.
          type: array
        labels:
          description: A map of labels to associate with the VM.
          type: object
          additionalProperties:
            type: string
        project:
          description: The Google Cloud target project ID or project name.
          type: string
        diskType:
          description: The disk type to use in the VM.
          type: string
          enum:
            - COMPUTE_ENGINE_DISK_TYPE_UNSPECIFIED
            - COMPUTE_ENGINE_DISK_TYPE_STANDARD
            - COMPUTE_ENGINE_DISK_TYPE_SSD
            - COMPUTE_ENGINE_DISK_TYPE_BALANCED
            - COMPUTE_ENGINE_DISK_TYPE_HYPERDISK_BALANCED
            - COMPUTE_ENGINE_DISK_TYPE_HYPERDISK_BALANCED_HIGH_AVAILABILITY
          enumDescriptions:
            - An unspecified disk type. Will be used as STANDARD.
            - A Standard disk type.
            - SSD hard disk type.
            - >-
              An alternative to SSD persistent disks that balance performance
              and cost.
            - Hyperdisk balanced disk type.
            - Hyperdisk balanced high availability disk type.
        encryption:
          description: Optional. The encryption to apply to the VM disks.
          $ref: '#/components/schemas/Encryption'
        licenseType:
          enumDescriptions:
            - The license type is the default for the OS.
            - The license type is Pay As You Go license type.
            - The license type is Bring Your Own License type.
          description: The license type to use in OS adaptation.
          type: string
          enum:
            - COMPUTE_ENGINE_LICENSE_TYPE_DEFAULT
            - COMPUTE_ENGINE_LICENSE_TYPE_PAYG
            - COMPUTE_ENGINE_LICENSE_TYPE_BYOL
        appliedLicense:
          description: The OS license returned from the adaptation module report.
          $ref: '#/components/schemas/AppliedLicense'
        enableIntegrityMonitoring:
          description: >-
            Optional. Defines whether the instance has integrity monitoring
            enabled.
          type: boolean
        vmName:
          description: The name of the VM to create.
          type: string
        machineType:
          description: The machine type to create the VM with.
          type: string
        bootConversion:
          description: >-
            Optional. By default the virtual machine will keep its existing boot
            option. Setting this property will trigger an internal process which
            will convert the virtual machine from using the existing boot option
            to another.
          type: string
          enum:
            - BOOT_CONVERSION_UNSPECIFIED
            - NONE
            - BIOS_TO_EFI
          enumDescriptions:
            - Unspecified conversion type.
            - No conversion.
            - Convert from BIOS to EFI.
        diskReplicaZones:
          description: >-
            Optional. Additional replica zones of the target regional disks. If
            this list is not empty a regional disk will be created. The first
            supported zone would be the one stated in the zone field. The rest
            are taken from this list. Please refer to the [regional disk
            creation
            API](https://cloud.google.com/compute/docs/regions-zones/global-regional-zonal-resources)
            for further details about regional vs zonal disks. If not specified,
            a zonal disk will be created in the same zone the VM is created.
          type: array
          items:
            type: string
        adaptationModifiers:
          description: >-
            Optional. Modifiers to be used as configuration of the OS adaptation
            process.
          type: array
          items:
            $ref: '#/components/schemas/AdaptationModifier'
        zone:
          description: The zone in which to create the VM.
          type: string
        networkInterfaces:
          items:
            $ref: '#/components/schemas/NetworkInterface'
          description: List of NICs connected to this VM.
          type: array
        enableVtpm:
          description: Optional. Defines whether the instance has vTPM enabled.
          type: boolean
        storagePool:
          description: >-
            Optional. The storage pool used for the VM disks. If specified this
            will be the storage pool in which the disk is created. This is the
            full path of the storage pool resource, for example:
            "projects/my-project/zones/us-central1-a/storagePools/my-storage-pool".
            The storage pool must be in the same project and zone as the target
            disks. The storage pool's type must match the disk type.
          type: string
    VmwareSourceVmDetails:
      description: Represent the source Vmware VM details.
      type: object
      id: VmwareSourceVmDetails
      properties:
        disks:
          readOnly: true
          items:
            $ref: '#/components/schemas/VmwareDiskDetails'
          description: Output only. The disks attached to the source VM.
          type: array
        firmware:
          description: Output only. The firmware type of the source VM.
          readOnly: true
          type: string
          enum:
            - FIRMWARE_UNSPECIFIED
            - EFI
            - BIOS
          enumDescriptions:
            - The firmware is unknown.
            - The firmware is EFI.
            - The firmware is BIOS.
        vmCapabilitiesInfo:
          readOnly: true
          description: >-
            Output only. Information about VM capabilities needed for some
            Compute Engine features.
          $ref: '#/components/schemas/VmCapabilities'
        committedStorageBytes:
          readOnly: true
          description: Output only. The total size of the disks being migrated in bytes.
          type: string
          format: int64
        architecture:
          readOnly: true
          description: Output only. The VM architecture.
          enumDescriptions:
            - The architecture is unknown.
            - The architecture is one of the x86 architectures.
            - The architecture is ARM64.
          type: string
          enum:
            - VM_ARCHITECTURE_UNSPECIFIED
            - VM_ARCHITECTURE_X86_FAMILY
            - VM_ARCHITECTURE_ARM64
    ListDatacenterConnectorsResponse:
      id: ListDatacenterConnectorsResponse
      properties:
        datacenterConnectors:
          readOnly: true
          items:
            $ref: '#/components/schemas/DatacenterConnector'
          description: Output only. The list of sources response.
          type: array
        nextPageToken:
          readOnly: true
          description: >-
            Output only. A token, which can be sent as `page_token` to retrieve
            the next page. If this field is omitted, there are no subsequent
            pages.
          type: string
        unreachable:
          description: Output only. Locations that could not be reached.
          type: array
          readOnly: true
          items:
            type: string
      description: Response message for 'ListDatacenterConnectors' request.
      type: object
    PersistentDiskDefaults:
      description: Details for creation of a Persistent Disk.
      type: object
      id: PersistentDiskDefaults
      properties:
        diskName:
          description: Optional. The name of the Persistent Disk to create.
          type: string
        vmAttachmentDetails:
          description: >-
            Optional. Details for attachment of the disk to a VM. Used when the
            disk is set to be attached to a target VM.
          $ref: '#/components/schemas/VmAttachmentDetails'
        additionalLabels:
          description: A map of labels to associate with the Persistent Disk.
          type: object
          additionalProperties:
            type: string
        diskType:
          enumDescriptions:
            - An unspecified disk type. Will be used as STANDARD.
            - A Standard disk type.
            - SSD hard disk type.
            - >-
              An alternative to SSD persistent disks that balance performance
              and cost.
            - Hyperdisk balanced disk type.
            - Hyperdisk balanced high availability disk type.
          description: The disk type to use.
          type: string
          enum:
            - COMPUTE_ENGINE_DISK_TYPE_UNSPECIFIED
            - COMPUTE_ENGINE_DISK_TYPE_STANDARD
            - COMPUTE_ENGINE_DISK_TYPE_SSD
            - COMPUTE_ENGINE_DISK_TYPE_BALANCED
            - COMPUTE_ENGINE_DISK_TYPE_HYPERDISK_BALANCED
            - COMPUTE_ENGINE_DISK_TYPE_HYPERDISK_BALANCED_HIGH_AVAILABILITY
        encryption:
          description: Optional. The encryption to apply to the disk.
          $ref: '#/components/schemas/Encryption'
        sourceDiskNumber:
          description: Required. The ordinal number of the source VM disk.
          type: integer
          format: int32
    ComputeEngineDisk:
      id: ComputeEngineDisk
      properties:
        zone:
          description: >-
            Required. The Compute Engine zone in which to create the disk.
            Should be of the form: projects/{target-project}/locations/{zone}
          type: string
        replicaZones:
          items:
            type: string
          description: >-
            Optional. Replication zones of the regional disk. Should be of the
            form: projects/{target-project}/locations/{replica-zone} Currently
            only one replica zone is supported.
          type: array
        diskId:
          description: >-
            Optional. Target Compute Engine Disk ID. This is the resource ID
            segment of the Compute Engine Disk to create. In the resource name
            compute/v1/projects/{project}/zones/{zone}/disks/disk1 "disk1" is
            the resource ID for the disk.
          type: string
        diskType:
          description: Required. The disk type to use.
          type: string
          enum:
            - COMPUTE_ENGINE_DISK_TYPE_UNSPECIFIED
            - COMPUTE_ENGINE_DISK_TYPE_STANDARD
            - COMPUTE_ENGINE_DISK_TYPE_SSD
            - COMPUTE_ENGINE_DISK_TYPE_BALANCED
            - COMPUTE_ENGINE_DISK_TYPE_HYPERDISK_BALANCED
            - COMPUTE_ENGINE_DISK_TYPE_HYPERDISK_BALANCED_HIGH_AVAILABILITY
          enumDescriptions:
            - An unspecified disk type. Will be used as STANDARD.
            - A Standard disk type.
            - SSD hard disk type.
            - >-
              An alternative to SSD persistent disks that balance performance
              and cost.
            - Hyperdisk balanced disk type.
            - Hyperdisk balanced high availability disk type.
      description: Compute Engine disk target details.
      type: object
    InitializingReplicationStep:
      id: InitializingReplicationStep
      properties: {}
      description: InitializingReplicationStep contains specific step details.
      type: object
    CutoverForecast:
      id: CutoverForecast
      properties:
        estimatedCutoverJobDuration:
          description: Output only. Estimation of the CutoverJob duration.
          type: string
          format: google-duration
          readOnly: true
      description: >-
        CutoverForecast holds information about future CutoverJobs of a
        MigratingVm.
      type: object
    ImageImportJob:
      id: ImageImportJob
      properties:
        state:
          readOnly: true
          description: Output only. The state of the image import.
          enumDescriptions:
            - The state is unknown.
            - The image import has not yet started.
            - The image import is active and running.
            - The image import has finished successfully.
            - The image import has finished with errors.
            - The image import is being cancelled.
            - The image import was cancelled.
          type: string
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLING
            - CANCELLED
        warnings:
          readOnly: true
          items:
            $ref: '#/components/schemas/MigrationWarning'
          description: Output only. Warnings that occurred during the image import.
          type: array
        name:
          description: Output only. The resource path of the ImageImportJob.
          type: string
          readOnly: true
        diskImageTargetDetails:
          $ref: '#/components/schemas/DiskImageTargetDetails'
          description: Output only. Target details used to import a disk image.
          readOnly: true
        machineImageTargetDetails:
          $ref: '#/components/schemas/MachineImageTargetDetails'
          description: Output only. Target details used to import a machine image.
          readOnly: true
        createdResources:
          readOnly: true
          items:
            type: string
          description: >-
            Output only. The resource paths of the resources created by the
            image import job.
          type: array
        createTime:
          description: >-
            Output only. The time the image import was created (as an API call,
            not when it was actually created in the target).
          type: string
          format: google-datetime
          readOnly: true
        errors:
          readOnly: true
          items:
            $ref: '#/components/schemas/Status'
          description: >-
            Output only. Provides details on the error that led to the image
            import state in case of an error.
          type: array
        steps:
          description: Output only. The image import steps list representing its progress.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/ImageImportStep'
        cloudStorageUri:
          description: >-
            Output only. The path to the Cloud Storage file from which the image
            should be imported.
          type: string
          readOnly: true
        endTime:
          readOnly: true
          description: Output only. The time the image import was ended.
          type: string
          format: google-datetime
      description: ImageImportJob describes the progress and result of an image import.
      type: object
    DisksMigrationVmTargetDetails:
      description: Details for the VM created VM as part of disks migration.
      type: object
      id: DisksMigrationVmTargetDetails
      properties:
        vmUri:
          readOnly: true
          description: Output only. The URI of the Compute Engine VM.
          type: string
    ImageImport:
      id: ImageImport
      properties:
        encryption:
          description: >-
            Immutable. The encryption details used by the image import process
            during the image adaptation for Compute Engine.
          $ref: '#/components/schemas/Encryption'
        cloudStorageUri:
          description: >-
            Immutable. The path to the Cloud Storage file from which the image
            should be imported.
          type: string
        machineImageTargetDefaults:
          description: >-
            Immutable. Target details for importing a machine image, will be
            used by ImageImportJob.
          $ref: '#/components/schemas/MachineImageTargetDetails'
        name:
          description: Output only. The resource path of the ImageImport.
          type: string
          readOnly: true
        createTime:
          readOnly: true
          description: Output only. The time the image import was created.
          type: string
          format: google-datetime
        diskImageTargetDefaults:
          description: >-
            Immutable. Target details for importing a disk image, will be used
            by ImageImportJob.
          $ref: '#/components/schemas/DiskImageTargetDetails'
        recentImageImportJobs:
          description: >-
            Output only. The result of the most recent runs for this
            ImageImport. All jobs for this ImageImport can be listed via
            ListImageImportJobs.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/ImageImportJob'
      description: ImageImport describes the configuration of the image import to run.
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      type: object
      id: CancelOperationRequest
      properties: {}
    MachineImageParametersOverrides:
      id: MachineImageParametersOverrides
      properties:
        machineType:
          description: >-
            Optional. The machine type to create the MachineImage with. If
            empty, the service will choose a relevant machine type based on the
            information from the source image. For more information about
            machine types, please refer to
            https://cloud.google.com/compute/docs/machine-resource.
          type: string
      description: >-
        Parameters overriding decisions based on the source machine image
        configurations.
      type: object
    CycleStep:
      id: CycleStep
      properties:
        postProcessing:
          description: Post processing step.
          $ref: '#/components/schemas/PostProcessingStep'
        endTime:
          description: The time the cycle step has ended.
          type: string
          format: google-datetime
        initializingReplication:
          description: Initializing replication step.
          $ref: '#/components/schemas/InitializingReplicationStep'
        startTime:
          description: The time the cycle step has started.
          type: string
          format: google-datetime
        replicating:
          description: Replicating step.
          $ref: '#/components/schemas/ReplicatingStep'
      description: CycleStep holds information about a step progress.
      type: object
    FetchStorageInventoryResponse:
      id: FetchStorageInventoryResponse
      properties:
        resources:
          description: The list of storage resources in the source.
          type: array
          items:
            $ref: '#/components/schemas/SourceStorageResource'
        nextPageToken:
          description: >-
            Output only. A token, which can be sent as `page_token` to retrieve
            the next page. If this field is omitted, there are no subsequent
            pages.
          type: string
          readOnly: true
        updateTime:
          description: >-
            Output only. The timestamp when the source was last queried (if the
            result is from the cache).
          type: string
          format: google-datetime
          readOnly: true
      description: Response message for fetchStorageInventory.
