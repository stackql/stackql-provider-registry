      id: RemoveGroupMigrationRequest
      properties:
        migratingVm:
          description: The MigratingVm to remove.
          type: string
      type: object
    ReplicatingStep:
      description: ReplicatingStep contains specific step details.
      id: ReplicatingStep
      properties:
        lastThirtyMinutesAverageBytesPerSecond:
          description: >-
            The source disks replication rate for the last 30 minutes in bytes
            per second.
          format: int64
          type: string
        lastTwoMinutesAverageBytesPerSecond:
          description: >-
            The source disks replication rate for the last 2 minutes in bytes
            per second.
          format: int64
          type: string
        replicatedBytes:
          description: Replicated bytes in the step.
          format: int64
          type: string
        totalBytes:
          description: Total bytes to be handled in the step.
          format: int64
          type: string
      type: object
    ReplicationCycle:
      description: >-
        ReplicationCycle contains information about the current replication
        cycle status.
      id: ReplicationCycle
      properties:
        cycleNumber:
          description: The cycle's ordinal number.
          format: int32
          type: integer
        endTime:
          description: The time the replication cycle has ended.
          format: google-datetime
          type: string
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            Output only. Provides details on the state of the cycle in case of
            an error.
          readOnly: true
        name:
          description: The identifier of the ReplicationCycle.
          type: string
        progressPercent:
          deprecated: true
          description: >-
            The current progress in percentage of this cycle. Was replaced by
            'steps' field, which breaks down the cycle progression more
            accurately.
          format: int32
          type: integer
        startTime:
          description: The time the replication cycle has started.
          format: google-datetime
          type: string
        state:
          description: State of the ReplicationCycle.
          enum:
            - STATE_UNSPECIFIED
            - RUNNING
            - PAUSED
            - FAILED
            - SUCCEEDED
          enumDescriptions:
            - >-
              The state is unknown. This is used for API compatibility only and
              is not used by the system.
            - The replication cycle is running.
            - The replication cycle is paused.
            - The replication cycle finished with errors.
            - The replication cycle finished successfully.
          type: string
        steps:
          description: The cycle's steps list representing its progress.
          items:
            $ref: '#/components/schemas/CycleStep'
          type: array
        totalPauseDuration:
          description: The accumulated duration the replication cycle was paused.
          format: google-duration
          type: string
        warnings:
          description: Output only. Warnings that occurred during the cycle.
          items:
            $ref: '#/components/schemas/MigrationWarning'
          readOnly: true
          type: array
      type: object
    ReplicationSync:
      description: >-
        ReplicationSync contain information about the last replica sync to the
        cloud.
      id: ReplicationSync
      properties:
        lastSyncTime:
          description: >-
            The most updated snapshot created time in the source that finished
            replication.
          format: google-datetime
          type: string
      type: object
    ResumeMigrationRequest:
      description: Request message for 'ResumeMigration' request.
      id: ResumeMigrationRequest
      properties: {}
      type: object
    RunDiskMigrationJobRequest:
      description: Request message for 'RunDiskMigrationJobRequest' request.
      id: RunDiskMigrationJobRequest
      properties: {}
      type: object
    SchedulePolicy:
      description: A policy for scheduling replications.
      id: SchedulePolicy
      properties:
        idleDuration:
          description: The idle duration between replication stages.
          format: google-duration
          type: string
        skipOsAdaptation:
          description: >-
            A flag to indicate whether to skip OS adaptation during the
            replication sync. OS adaptation is a process where the VM's
            operating system undergoes changes and adaptations to fully function
            on Compute Engine.
          type: boolean
      type: object
    SchedulingNodeAffinity:
      description: >-
        Node Affinity: the configuration of desired nodes onto which this
        Instance could be scheduled. Based on
        https://cloud.google.com/compute/docs/reference/rest/v1/instances/setScheduling
      id: SchedulingNodeAffinity
      properties:
        key:
          description: The label key of Node resource to reference.
          type: string
        operator:
          description: >-
            The operator to use for the node resources specified in the `values`
            parameter.
          enum:
            - OPERATOR_UNSPECIFIED
            - IN
            - NOT_IN
          enumDescriptions:
            - An unknown, unexpected behavior.
            - The node resource group should be in these resources affinity.
            - The node resource group should not be in these resources affinity.
          type: string
        values:
          description: Corresponds to the label values of Node resource.
          items:
            type: string
          type: array
      type: object
    ServiceAccount:
      description: Service account to assign to the instance created by the machine image.
      id: ServiceAccount
      properties:
        email:
          description: Required. The email address of the service account.
          type: string
        scopes:
          description: >-
            Optional. The list of scopes to be made available for this service
            account.
          items:
            type: string
          type: array
      type: object
    ShieldedInstanceConfig:
      description: Shielded instance configuration.
      id: ShieldedInstanceConfig
      properties:
        enableIntegrityMonitoring:
          description: >-
            Optional. Defines whether the instance created by the machine image
            has integrity monitoring enabled. This can be set to true only if
            the image boot option is EFI, and vTPM is enabled.
          type: boolean
        enableVtpm:
          description: >-
            Optional. Defines whether the instance created by the machine image
            has vTPM enabled. This can be set to true only if the image boot
            option is EFI.
          type: boolean
        secureBoot:
          description: >-
            Optional. Defines whether the instance created by the machine image
            has Secure Boot enabled. This can be set to true only if the image
            boot option is EFI.
          enum:
            - SECURE_BOOT_UNSPECIFIED
            - 'TRUE'
            - 'FALSE'
          enumDescriptions:
            - >-
              No explicit value is selected. Will use the configuration of the
              source (if exists, otherwise the default will be false).
            - >-
              Use secure boot. This can be set to true only if the image boot
              option is EFI.
            - Do not use secure boot.
          type: string
      type: object
    ShuttingDownSourceVMStep:
      description: ShuttingDownSourceVMStep contains specific step details.
