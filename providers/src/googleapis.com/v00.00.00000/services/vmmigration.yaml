            - Migration cancellation was initiated.
            - The migration was cancelled.
            - >-
              The migration process encountered an unrecoverable error and was
              aborted.
          type: string
          enum:
            - STATE_UNSPECIFIED
            - READY
            - RUNNING
            - SUCCEEDED
            - CANCELLING
            - CANCELLED
            - FAILED
        updateTime:
          readOnly: true
          description: >-
