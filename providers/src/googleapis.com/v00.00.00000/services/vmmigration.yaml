      description: Parameters affecting the OS adaptation process.
      id: ImageImportOsAdaptationParameters
      properties:
        adaptationModifiers:
          description: >-
            Optional. Modifiers to be used as configuration of the OS adaptation
            process.
          items:
            $ref: '#/components/schemas/AdaptationModifier'
          type: array
        bootConversion:
          description: >-
            Optional. By default the image will keep its existing boot option.
            Setting this property will trigger an internal process which will
            convert the image from using the existing boot option to another.
            The size of the boot disk might be increased to allow the conversion
          enum:
            - BOOT_CONVERSION_UNSPECIFIED
            - NONE
            - BIOS_TO_EFI
          enumDescriptions:
            - Unspecified conversion type.
            - No conversion.
            - Convert from BIOS to EFI.
          type: string
        generalize:
          description: >-
            Optional. Set to true in order to generalize the imported image. The
            generalization process enables co-existence of multiple VMs created
            from the same image. For Windows, generalizing the image removes
            computer-specific information such as installed drivers and the
            computer security identifier (SID).
          type: boolean
        licenseType:
          description: >-
            Optional. Choose which type of license to apply to the imported
            image.
          enum:
            - COMPUTE_ENGINE_LICENSE_TYPE_DEFAULT
            - COMPUTE_ENGINE_LICENSE_TYPE_PAYG
            - COMPUTE_ENGINE_LICENSE_TYPE_BYOL
          enumDescriptions:
            - The license type is the default for the OS.
            - The license type is Pay As You Go license type.
            - The license type is Bring Your Own License type.
          type: string
