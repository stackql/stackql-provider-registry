            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    MachineImageParametersOverrides:
      description: >-
        Parameters overriding decisions based on the source machine image
        configurations.
      id: MachineImageParametersOverrides
      properties:
        machineType:
          description: >-
            Optional. The machine type to create the MachineImage with. If
            empty, the service will choose a relevant machine type based on the
            information from the source image. For more information about
            machine types, please refer to
            https://cloud.google.com/compute/docs/machine-resource.
          type: string
      type: object
    MachineImageTargetDetails:
      description: >-
        The target details of the machine image resource that will be created by
        the image import job.
      id: MachineImageTargetDetails
      properties:
        additionalLicenses:
          description: >-
            Optional. Additional licenses to assign to the instance created by
            the machine image. Format:
            https://www.googleapis.com/compute/v1/projects/PROJECT_ID/global/licenses/LICENSE_NAME
            Or
            https://www.googleapis.com/compute/beta/projects/PROJECT_ID/global/licenses/LICENSE_NAME
          items:
            type: string
          type: array
        description:
          description: Optional. An optional description of the machine image.
          type: string
        encryption:
          $ref: '#/components/schemas/Encryption'
          description: >-
            Immutable. The encryption to apply to the machine image. If the
            Image Import resource has an encryption, this field must be set to
            the same encryption key.
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. The labels to apply to the instance created by the machine
            image.
          type: object
        machineImageName:
          description: Required. The name of the machine image to be created.
          type: string
        machineImageParametersOverrides:
          $ref: '#/components/schemas/MachineImageParametersOverrides'
          description: >-
            Optional. Parameters overriding decisions based on the source
            machine image configurations.
        networkInterfaces:
          description: >-
            Optional. The network interfaces to create with the instance created
            by the machine image. Internal and external IP addresses, and
            network tiers are ignored for machine image import.
          items:
            $ref: '#/components/schemas/NetworkInterface'
          type: array
        osAdaptationParameters:
          $ref: '#/components/schemas/ImageImportOsAdaptationParameters'
          description: >-
            Optional. Use to set the parameters relevant for the OS adaptation
            process.
        serviceAccount:
          $ref: '#/components/schemas/ServiceAccount'
          description: >-
            Optional. The service account to assign to the instance created by
            the machine image.
        shieldedInstanceConfig:
          $ref: '#/components/schemas/ShieldedInstanceConfig'
          description: Optional. Shielded instance configuration.
        singleRegionStorage:
          description: >-
            Optional. Set to true to set the machine image storageLocations to
            the single region of the import job. When false, the closest
            multi-region is selected.
          type: boolean
        skipOsAdaptation:
          $ref: '#/components/schemas/SkipOsAdaptation'
          description: Optional. Use to skip OS adaptation process.
        tags:
          description: >-
            Optional. The tags to apply to the instance created by the machine
            image.
          items:
            type: string
          type: array
        targetProject:
          description: >-
            Required. Reference to the TargetProject resource that represents
            the target project in which the imported machine image will be
            created.
          type: string
      type: object
    MigratingVm:
      description: >-
        MigratingVm describes the VM that will be migrated from a Source
        environment and its replication state.
      id: MigratingVm
      properties:
        awsSourceVmDetails:
          $ref: '#/components/schemas/AwsSourceVmDetails'
          description: Output only. Details of the VM from an AWS source.
          readOnly: true
        azureSourceVmDetails:
          $ref: '#/components/schemas/AzureSourceVmDetails'
          description: Output only. Details of the VM from an Azure source.
          readOnly: true
        computeEngineDisksTargetDefaults:
          $ref: '#/components/schemas/ComputeEngineDisksTargetDefaults'
          description: Details of the target Persistent Disks in Compute Engine.
        computeEngineTargetDefaults:
          $ref: '#/components/schemas/ComputeEngineTargetDefaults'
          description: Details of the target VM in Compute Engine.
        createTime:
          description: >-
            Output only. The time the migrating VM was created (this refers to
            this resource and not to the time it was installed in the source).
          format: google-datetime
          readOnly: true
          type: string
        currentSyncInfo:
          $ref: '#/components/schemas/ReplicationCycle'
          description: Output only. Details of the current running replication cycle.
          readOnly: true
        cutoverForecast:
          $ref: '#/components/schemas/CutoverForecast'
          description: >-
            Output only. Provides details of future CutoverJobs of a
            MigratingVm. Set to empty when cutover forecast is unavailable.
          readOnly: true
        description:
          description: The description attached to the migrating VM by the user.
          type: string
        displayName:
          description: The display name attached to the MigratingVm by the user.
          type: string
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            Output only. Provides details on the state of the Migrating VM in
            case of an error in replication.
          readOnly: true
        expiration:
          $ref: '#/components/schemas/Expiration'
          description: >-
            Output only. Provides details about the expiration state of the
            migrating VM.
          readOnly: true
        group:
          description: >-
            Output only. The group this migrating vm is included in, if any. The
            group is represented by the full path of the appropriate Group
            resource.
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: The labels of the migrating VM.
          type: object
        lastReplicationCycle:
          $ref: '#/components/schemas/ReplicationCycle'
          description: >-
            Output only. Details of the last replication cycle. This will be
            updated whenever a replication cycle is finished and is not to be
            confused with last_sync which is only updated on successful
            replication cycles.
          readOnly: true
        lastSync:
          $ref: '#/components/schemas/ReplicationSync'
          description: >-
            Output only. The most updated snapshot created time in the source
            that finished replication.
          readOnly: true
        name:
          description: Output only. The identifier of the MigratingVm.
          readOnly: true
          type: string
        policy:
          $ref: '#/components/schemas/SchedulePolicy'
          description: The replication schedule policy.
        recentCloneJobs:
          description: >-
            Output only. The recent clone jobs performed on the migrating VM.
            This field holds the vm's last completed clone job and the vm's
            running clone job, if one exists. Note: To have this field populated
            you need to explicitly request it via the "view" parameter of the
            Get/List request.
          items:
            $ref: '#/components/schemas/CloneJob'
          readOnly: true
          type: array
        recentCutoverJobs:
          description: >-
            Output only. The recent cutover jobs performed on the migrating VM.
            This field holds the vm's last completed cutover job and the vm's
            running cutover job, if one exists. Note: To have this field
            populated you need to explicitly request it via the "view" parameter
            of the Get/List request.
          items:
            $ref: '#/components/schemas/CutoverJob'
          readOnly: true
          type: array
        sourceVmId:
          description: >-
            The unique ID of the VM in the source. The VM's name in vSphere can
            be changed, so this is not the VM's name but rather its moRef id.
            This id is of the form vm-.
          type: string
        state:
          description: Output only. State of the MigratingVm.
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - READY
            - FIRST_SYNC
            - ACTIVE
            - CUTTING_OVER
            - CUTOVER
            - FINAL_SYNC
            - PAUSED
            - FINALIZING
            - FINALIZED
            - ERROR
            - EXPIRED
            - FINALIZED_EXPIRED
          enumDescriptions:
            - The state was not sampled by the health checks yet.
            - The VM in the source is being verified.
            - The source VM was verified, and it's ready to start replication.
            - Migration is going through the first sync cycle.
            - The replication is active, and it's running or scheduled to run.
            - >-
              The source VM is being turned off, and a final replication is
              currently running.
            - >-
              The source VM was stopped and replicated. The replication is
              currently paused.
            - >-
              A cutover job is active and replication cycle is running the final
              sync.
            - >-
              The replication was paused by the user and no cycles are scheduled
              to run.
            - >-
              The migrating VM is being finalized and migration resources are
              being removed.
            - >-
              The replication process is done. The migrating VM is finalized and
              no longer consumes billable resources.
            - >-
              The replication process encountered an unrecoverable error and was
              aborted.
            - >-
              The migrating VM has passed its expiration date. It might be
              possible to bring it back to "Active" state by updating the TTL
              field. For more information, see the documentation.
            - >-
              The migrating VM's has been finalized and migration resources have
              been removed.
          readOnly: true
          type: string
        stateTime:
          description: Output only. The last time the migrating VM state was updated.
          format: google-datetime
          readOnly: true
          type: string
        updateTime:
          description: Output only. The last time the migrating VM resource was updated.
          format: google-datetime
          readOnly: true
          type: string
        vmwareSourceVmDetails:
          $ref: '#/components/schemas/VmwareSourceVmDetails'
          description: Output only. Details of the VM from a Vmware source.
          readOnly: true
      type: object
    MigrationError:
      description: >-
        Represents migration resource error information that can be used with
        google.rpc.Status message. MigrationError is used to present the user
        with error information in migration operations.
      id: MigrationError
      properties:
        actionItem:
          $ref: '#/components/schemas/LocalizedMessage'
          description: Output only. Suggested action for solving the error.
          readOnly: true
        code:
          description: Output only. The error code.
          enum:
            - ERROR_CODE_UNSPECIFIED
            - UNKNOWN_ERROR
            - SOURCE_VALIDATION_ERROR
            - SOURCE_REPLICATION_ERROR
            - TARGET_REPLICATION_ERROR
            - OS_ADAPTATION_ERROR
            - CLONE_ERROR
            - CUTOVER_ERROR
            - UTILIZATION_REPORT_ERROR
            - APPLIANCE_UPGRADE_ERROR
            - IMAGE_IMPORT_ERROR
            - DISK_MIGRATION_ERROR
          enumDescriptions:
            - Default value. This value is not used.
            - Migrate to Virtual Machines encountered an unknown error.
            - >-
              Migrate to Virtual Machines encountered an error while validating
              replication source health.
            - >-
              Migrate to Virtual Machines encountered an error during source
              data operation.
            - >-
              Migrate to Virtual Machines encountered an error during target
              data operation.
            - >-
              Migrate to Virtual Machines encountered an error during OS
              adaptation.
            - >-
              Migrate to Virtual Machines encountered an error in clone
              operation.
            - >-
              Migrate to Virtual Machines encountered an error in cutover
              operation.
            - >-
              Migrate to Virtual Machines encountered an error during
              utilization report creation.
            - >-
              Migrate to Virtual Machines encountered an error during appliance
              upgrade.
            - >-
              Migrate to Virtual Machines encountered an error in image import
              operation.
            - >-
              Migrate to Virtual Machines encountered an error in disk migration
              operation.
          readOnly: true
          type: string
        errorMessage:
          $ref: '#/components/schemas/LocalizedMessage'
          description: Output only. The localized error message.
          readOnly: true
        errorTime:
          description: Output only. The time the error occurred.
          format: google-datetime
          readOnly: true
          type: string
        helpLinks:
          description: >-
            Output only. URL(s) pointing to additional information on handling
            the current error.
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
          type: array
      type: object
    MigrationWarning:
      description: >-
        Represents migration resource warning information that can be used with
        google.rpc.Status message. MigrationWarning is used to present the user
        with warning information in migration operations.
      id: MigrationWarning
      properties:
        actionItem:
          $ref: '#/components/schemas/LocalizedMessage'
          description: Output only. Suggested action for solving the warning.
          readOnly: true
        code:
          description: The warning code.
          enum:
            - WARNING_CODE_UNSPECIFIED
            - ADAPTATION_WARNING
          enumDescriptions:
            - Default value. This value is not used.
            - A warning originated from OS Adaptation.
          type: string
        helpLinks:
          description: >-
            Output only. URL(s) pointing to additional information on handling
            the current warning.
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
          type: array
        warningMessage:
          $ref: '#/components/schemas/LocalizedMessage'
          description: Output only. The localized warning message.
          readOnly: true
        warningTime:
          description: The time the warning occurred.
          format: google-datetime
          type: string
      type: object
    NetworkInterface:
      description: NetworkInterface represents a NIC of a VM.
      id: NetworkInterface
      properties:
        externalIp:
          description: Optional. The external IP to define in the NIC.
          type: string
        internalIp:
          description: >-
            Optional. The internal IP to define in the NIC. The formats accepted
            are: `ephemeral` \ ipv4 address \ a named address resource full
            path.
          type: string
        network:
          description: Optional. The network to connect the NIC to.
          type: string
        networkTier:
          description: >-
            Optional. The networking tier used for optimizing connectivity
            between instances and systems on the internet. Applies only for
            external ephemeral IP addresses. If left empty, will default to
            PREMIUM.
          enum:
            - COMPUTE_ENGINE_NETWORK_TIER_UNSPECIFIED
            - NETWORK_TIER_STANDARD
            - NETWORK_TIER_PREMIUM
          enumDescriptions:
            - An unspecified network tier. Will be used as PREMIUM.
            - A standard network tier.
            - A premium network tier.
          type: string
        subnetwork:
          description: Optional. The subnetwork to connect the NIC to.
          type: string
      type: object
    OSDescription:
      description: >-
        A message describing the VM's OS. Including OS, Publisher, Offer and
        Plan if applicable.
      id: OSDescription
      properties:
        offer:
          description: OS offer.
          type: string
        plan:
          description: OS plan.
          type: string
        publisher:
          description: OS publisher.
          type: string
        type:
          description: OS type.
          type: string
      type: object
    OSDisk:
      description: A message describing the OS disk.
      id: OSDisk
      properties:
        name:
          description: The disk's full name.
          type: string
        sizeGb:
          description: The disk's size in GB.
          format: int32
          type: integer
        type:
          description: The disk's type.
          type: string
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have successfully been cancelled
            have Operation.error value with a google.rpc.Status.code of 1,
            corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        statusMessage:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    PauseMigrationRequest:
