components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AccessKeyCredentials:
      description: Message describing AWS Credentials using access key id and secret.
      id: AccessKeyCredentials
      properties:
        accessKeyId:
          description: AWS access key ID.
          type: string
        secretAccessKey:
          description: Input only. AWS secret access key.
          type: string
        sessionToken:
          description: >-
            Input only. AWS session token. Used only when AWS security token
            service (STS) is responsible for creating the temporary credentials.
          type: string
      type: object
    AdaptationModifier:
      description: >-
        AdaptationModifier a modifier to be used for configuration of the OS
        adaptation process.
      id: AdaptationModifier
      properties:
        modifier:
          description: Optional. The modifier name.
          type: string
        value:
          description: >-
            Optional. The value of the modifier. The actual value depends on the
            modifier and can also be empty.
          type: string
      type: object
    AdaptingOSStep:
      description: AdaptingOSStep contains specific step details.
      id: AdaptingOSStep
      properties: {}
      type: object
    AddGroupMigrationRequest:
      description: Request message for 'AddGroupMigration' request.
      id: AddGroupMigrationRequest
      properties:
        migratingVm:
          description: The full path name of the MigratingVm to add.
          type: string
      type: object
    ApplianceVersion:
      description: Describes an appliance version.
      id: ApplianceVersion
      properties:
        critical:
          description: >-
            Determine whether it's critical to upgrade the appliance to this
            version.
          type: boolean
        releaseNotesUri:
          description: Link to a page that contains the version release notes.
          type: string
        uri:
          description: A link for downloading the version.
          type: string
        version:
          description: The appliance version.
          type: string
      type: object
    AppliedLicense:
      description: >-
        AppliedLicense holds the license data returned by adaptation module
        report.
      id: AppliedLicense
      properties:
        osLicense:
          description: The OS license returned from the adaptation module's report.
          type: string
        type:
          description: The license type that was used in OS adaptation.
          enum:
            - TYPE_UNSPECIFIED
            - NONE
            - PAYG
            - BYOL
          enumDescriptions:
            - Unspecified license for the OS.
            - No license available for the OS.
            - The license type is Pay As You Go license type.
            - The license type is Bring Your Own License type.
          type: string
      type: object
    AvailableUpdates:
      description: Holds information about the available versions for upgrade.
      id: AvailableUpdates
      properties:
        inPlaceUpdate:
          $ref: '#/components/schemas/ApplianceVersion'
          description: >-
            The latest version for in place update. The current appliance can be
            updated to this version using the API or m4c CLI.
        newDeployableAppliance:
          $ref: '#/components/schemas/ApplianceVersion'
          description: >-
            The newest deployable version of the appliance. The current
            appliance can't be updated into this version, and the owner must
            manually deploy this OVA to a new appliance.
      type: object
    AwsDiskDetails:
      description: The details of an AWS instance disk.
      id: AwsDiskDetails
      properties:
        diskNumber:
          description: Output only. The ordinal number of the disk.
          format: int32
          readOnly: true
          type: integer
        sizeGb:
          description: Output only. Size in GB.
          format: int64
          readOnly: true
          type: string
        volumeId:
          description: Output only. AWS volume ID.
          readOnly: true
          type: string
      type: object
    AwsSecurityGroup:
      description: AwsSecurityGroup describes a security group of an AWS VM.
      id: AwsSecurityGroup
      properties:
        id:
          description: The AWS security group id.
          type: string
        name:
          description: The AWS security group name.
          type: string
      type: object
    AwsSourceDetails:
      description: >-
        AwsSourceDetails message describes a specific source details for the AWS
        source type.
      id: AwsSourceDetails
      properties:
        accessKeyCreds:
          $ref: '#/components/schemas/AccessKeyCredentials'
          description: AWS Credentials using access key id and secret.
        awsRegion:
          description: Immutable. The AWS region that the source VMs will be migrated from.
          type: string
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            Output only. Provides details on the state of the Source in case of
            an error.
          readOnly: true
        inventorySecurityGroupNames:
          description: AWS security group names to limit the scope of the source inventory.
          items:
            type: string
          type: array
        inventoryTagList:
          description: AWS resource tags to limit the scope of the source inventory.
          items:
            $ref: '#/components/schemas/Tag'
          type: array
        migrationResourcesUserTags:
          additionalProperties:
            type: string
          description: >-
            User specified tags to add to every M2VM generated resource in AWS.
            These tags will be set in addition to the default tags that are set
            as part of the migration process. The tags must not begin with the
            reserved prefix `m2vm`.
          type: object
        publicIp:
          description: >-
            Output only. The source's public IP. All communication initiated by
            this source will originate from this IP.
          readOnly: true
          type: string
        state:
          description: Output only. State of the source as determined by the health check.
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - FAILED
            - ACTIVE
          enumDescriptions:
            - >-
              The state is unknown. This is used for API compatibility only and
              is not used by the system.
            - The state was not sampled by the health checks yet.
            - >-
              The source is available but might not be usable yet due to invalid
              credentials or another reason. The error message will contain
              further details.
            - The source exists and its credentials were verified.
          readOnly: true
          type: string
      type: object
    AwsSourceDiskDetails:
      description: Represents the source AWS Disk details.
      id: AwsSourceDiskDetails
      properties:
        diskType:
          description: Optional. Output only. Disk type.
          enum:
            - TYPE_UNSPECIFIED
            - GP2
            - GP3
            - IO1
            - IO2
            - ST1
            - SC1
            - STANDARD
          enumDescriptions:
            - Unspecified AWS disk type. Should not be used.
            - GP2 disk type.
            - GP3 disk type.
            - IO1 disk type.
            - IO2 disk type.
            - ST1 disk type.
            - SC1 disk type.
            - Standard disk type.
          readOnly: true
          type: string
        sizeGib:
          description: Output only. Size in GiB.
          format: int64
          readOnly: true
          type: string
        tags:
          additionalProperties:
            type: string
          description: Optional. Output only. A map of AWS volume tags.
          readOnly: true
          type: object
        volumeId:
          description: Required. AWS volume ID.
          type: string
      type: object
    AwsSourceVmDetails:
      description: Represent the source AWS VM details.
      id: AwsSourceVmDetails
      properties:
        architecture:
          description: Output only. The VM architecture.
          enum:
            - VM_ARCHITECTURE_UNSPECIFIED
            - VM_ARCHITECTURE_X86_FAMILY
            - VM_ARCHITECTURE_ARM64
          enumDescriptions:
            - The architecture is unknown.
            - The architecture is one of the x86 architectures.
            - The architecture is ARM64.
          readOnly: true
          type: string
        committedStorageBytes:
          description: Output only. The total size of the disks being migrated in bytes.
          format: int64
          readOnly: true
          type: string
        disks:
          description: Output only. The disks attached to the source VM.
          items:
            $ref: '#/components/schemas/AwsDiskDetails'
          readOnly: true
          type: array
        firmware:
          description: Output only. The firmware type of the source VM.
          enum:
            - FIRMWARE_UNSPECIFIED
            - EFI
            - BIOS
          enumDescriptions:
            - The firmware is unknown.
            - The firmware is EFI.
            - The firmware is BIOS.
          readOnly: true
          type: string
        vmCapabilitiesInfo:
          $ref: '#/components/schemas/VmCapabilities'
          description: >-
            Output only. Information about VM capabilities needed for some
            Compute Engine features.
          readOnly: true
      type: object
    AwsVmDetails:
      description: AwsVmDetails describes a VM in AWS.
      id: AwsVmDetails
      properties:
        architecture:
          description: The CPU architecture.
          enum:
            - VM_ARCHITECTURE_UNSPECIFIED
            - I386
            - X86_64
            - ARM64
            - X86_64_MAC
          enumDescriptions:
            - The architecture is unknown.
            - The architecture is I386.
            - The architecture is X86_64.
            - The architecture is ARM64.
            - The architecture is X86_64_MAC.
          type: string
        bootOption:
          description: The VM Boot Option.
          enum:
            - BOOT_OPTION_UNSPECIFIED
            - EFI
            - BIOS
          enumDescriptions:
            - The boot option is unknown.
            - The boot option is UEFI.
            - The boot option is LEGACY-BIOS.
          type: string
        committedStorageMb:
          description: The total size of the storage allocated to the VM in MB.
          format: int64
          type: string
        cpuCount:
          description: The number of CPU cores the VM has.
          format: int32
          type: integer
        diskCount:
          description: The number of disks the VM has.
          format: int32
          type: integer
        displayName:
          description: >-
            The display name of the VM. Note that this value is not necessarily
            unique.
          type: string
        instanceType:
          description: The instance type of the VM.
          type: string
        memoryMb:
          description: The memory size of the VM in MB.
          format: int32
          type: integer
        osDescription:
          description: The VM's OS.
          type: string
        powerState:
          description: Output only. The power state of the VM at the moment list was taken.
          enum:
            - POWER_STATE_UNSPECIFIED
            - 'ON'
            - 'OFF'
            - SUSPENDED
            - PENDING
          enumDescriptions:
            - Power state is not specified.
            - The VM is turned on.
            - The VM is turned off.
            - The VM is suspended. This is similar to hibernation or sleep mode.
            - The VM is starting.
          readOnly: true
          type: string
        securityGroups:
          description: The security groups the VM belongs to.
          items:
            $ref: '#/components/schemas/AwsSecurityGroup'
          type: array
        sourceDescription:
          description: The descriptive name of the AWS's source this VM is connected to.
          type: string
        sourceId:
          description: The id of the AWS's source this VM is connected to.
          type: string
        tags:
          additionalProperties:
            type: string
          description: The tags of the VM.
          type: object
        vcpuCount:
          description: >-
            The number of vCPUs the VM has. It is calculated as the number of
            CPU cores * threads per CPU the VM has.
          format: int32
          type: integer
        virtualizationType:
          description: The virtualization type.
          enum:
            - VM_VIRTUALIZATION_TYPE_UNSPECIFIED
            - HVM
            - PARAVIRTUAL
          enumDescriptions:
            - The virtualization type is unknown.
            - The virtualziation type is HVM.
            - The virtualziation type is PARAVIRTUAL.
          type: string
        vmId:
          description: The VM ID in AWS.
          type: string
        vpcId:
          description: The VPC ID the VM belongs to.
          type: string
        zone:
          description: The AWS zone of the VM.
          type: string
      type: object
    AwsVmsDetails:
      description: AWSVmsDetails describes VMs in AWS.
      id: AwsVmsDetails
      properties:
        details:
          description: The details of the AWS VMs.
          items:
            $ref: '#/components/schemas/AwsVmDetails'
          type: array
      type: object
    AzureDiskDetails:
      description: The details of an Azure VM disk.
      id: AzureDiskDetails
      properties:
        diskId:
          description: Output only. Azure disk ID.
          readOnly: true
          type: string
        diskNumber:
          description: Output only. The ordinal number of the disk.
          format: int32
          readOnly: true
          type: integer
        sizeGb:
          description: Output only. Size in GB.
          format: int64
          readOnly: true
          type: string
      type: object
    AzureSourceDetails:
      description: >-
        AzureSourceDetails message describes a specific source details for the
        Azure source type.
      id: AzureSourceDetails
      properties:
        azureLocation:
          description: >-
            Immutable. The Azure location (region) that the source VMs will be
            migrated from.
          type: string
        clientSecretCreds:
          $ref: '#/components/schemas/ClientSecretCredentials'
          description: Azure Credentials using tenant ID, client ID and secret.
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            Output only. Provides details on the state of the Source in case of
            an error.
          readOnly: true
        migrationResourcesUserTags:
          additionalProperties:
            type: string
          description: >-
            User specified tags to add to every M2VM generated resource in
            Azure. These tags will be set in addition to the default tags that
            are set as part of the migration process. The tags must not begin
            with the reserved prefix `m4ce` or `m2vm`.
          type: object
        resourceGroupId:
          description: >-
            Output only. The ID of the Azure resource group that contains all
            resources related to the migration process of this source.
          readOnly: true
          type: string
        state:
          description: Output only. State of the source as determined by the health check.
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - FAILED
            - ACTIVE
          enumDescriptions:
            - >-
              The state is unknown. This is used for API compatibility only and
              is not used by the system.
            - The state was not sampled by the health checks yet.
            - >-
              The source is available but might not be usable yet due to invalid
              credentials or another reason. The error message will contain
              further details.
            - The source exists and its credentials were verified.
          readOnly: true
          type: string
        subscriptionId:
          description: Immutable. Azure subscription ID.
          type: string
      type: object
    AzureSourceVmDetails:
      description: Represent the source Azure VM details.
      id: AzureSourceVmDetails
      properties:
        architecture:
          description: Output only. The VM architecture.
          enum:
            - VM_ARCHITECTURE_UNSPECIFIED
            - VM_ARCHITECTURE_X86_FAMILY
            - VM_ARCHITECTURE_ARM64
          enumDescriptions:
            - The architecture is unknown.
            - The architecture is one of the x86 architectures.
            - The architecture is ARM64.
          readOnly: true
          type: string
        committedStorageBytes:
          description: Output only. The total size of the disks being migrated in bytes.
          format: int64
          readOnly: true
          type: string
        disks:
          description: Output only. The disks attached to the source VM.
          items:
            $ref: '#/components/schemas/AzureDiskDetails'
          readOnly: true
          type: array
        firmware:
          description: Output only. The firmware type of the source VM.
          enum:
            - FIRMWARE_UNSPECIFIED
            - EFI
            - BIOS
          enumDescriptions:
            - The firmware is unknown.
            - The firmware is EFI.
            - The firmware is BIOS.
          readOnly: true
          type: string
        vmCapabilitiesInfo:
          $ref: '#/components/schemas/VmCapabilities'
          description: >-
            Output only. Information about VM capabilities needed for some
            Compute Engine features.
          readOnly: true
      type: object
    AzureVmDetails:
      description: AzureVmDetails describes a VM in Azure.
      id: AzureVmDetails
      properties:
        architecture:
          description: The CPU architecture.
          enum:
            - VM_ARCHITECTURE_UNSPECIFIED
            - VM_ARCHITECTURE_X86_FAMILY
            - VM_ARCHITECTURE_ARM64
          enumDescriptions:
            - The architecture is unknown.
            - The architecture is one of the x86 architectures.
            - The architecture is ARM64.
          type: string
        bootOption:
          description: The VM Boot Option.
          enum:
            - BOOT_OPTION_UNSPECIFIED
            - EFI
            - BIOS
          enumDescriptions:
            - The boot option is unknown.
            - The boot option is UEFI.
            - The boot option is BIOS.
          type: string
        committedStorageMb:
          description: The total size of the storage allocated to the VM in MB.
          format: int64
          type: string
        computerName:
          description: The VM's ComputerName.
          type: string
        cpuCount:
          description: The number of cpus the VM has.
          format: int32
          type: integer
        diskCount:
          description: The number of disks the VM has, including OS disk.
          format: int32
          type: integer
        disks:
          description: Description of the data disks.
          items:
            $ref: '#/components/schemas/Disk'
          type: array
        memoryMb:
          description: The memory size of the VM in MB.
          format: int32
          type: integer
        osDescription:
          $ref: '#/components/schemas/OSDescription'
          description: Description of the OS.
        osDisk:
          $ref: '#/components/schemas/OSDisk'
          description: Description of the OS disk.
        powerState:
          description: The power state of the VM at the moment list was taken.
          enum:
            - POWER_STATE_UNSPECIFIED
            - STARTING
            - RUNNING
            - STOPPING
            - STOPPED
            - DEALLOCATING
            - DEALLOCATED
            - UNKNOWN
          enumDescriptions:
            - Power state is not specified.
            - The VM is starting.
            - The VM is running.
            - The VM is stopping.
            - The VM is stopped.
            - The VM is deallocating.
            - The VM is deallocated.
            - The VM's power state is unknown.
          type: string
        tags:
          additionalProperties:
            type: string
          description: The tags of the VM.
          type: object
        vmId:
          description: The VM full path in Azure.
          type: string
        vmSize:
          description: VM size as configured in Azure. Determines the VM's hardware spec.
          type: string
      type: object
    AzureVmsDetails:
      description: AzureVmsDetails describes VMs in Azure.
      id: AzureVmsDetails
      properties:
        details:
          description: The details of the Azure VMs.
          items:
            $ref: '#/components/schemas/AzureVmDetails'
          type: array
      type: object
    BootDiskDefaults:
      description: BootDiskDefaults hold information about the boot disk of a VM.
      id: BootDiskDefaults
      properties:
        deviceName:
          description: >-
            Optional. Specifies a unique device name of your choice that is
            reflected into the /dev/disk/by-id/google-* tree of a Linux
            operating system running within the instance. If not specified, the
            server chooses a default device name to apply to this disk, in the
            form persistent-disk-x, where x is a number assigned by Google
            Compute Engine. This field is only applicable for persistent disks.
          type: string
        diskName:
          description: Optional. The name of the disk.
          type: string
        diskType:
          description: Optional. The type of disk provisioning to use for the VM.
          enum:
            - COMPUTE_ENGINE_DISK_TYPE_UNSPECIFIED
            - COMPUTE_ENGINE_DISK_TYPE_STANDARD
            - COMPUTE_ENGINE_DISK_TYPE_SSD
            - COMPUTE_ENGINE_DISK_TYPE_BALANCED
            - COMPUTE_ENGINE_DISK_TYPE_HYPERDISK_BALANCED
            - COMPUTE_ENGINE_DISK_TYPE_HYPERDISK_BALANCED_HIGH_AVAILABILITY
          enumDescriptions:
            - An unspecified disk type. Will be used as STANDARD.
            - A Standard disk type.
            - SSD hard disk type.
            - >-
              An alternative to SSD persistent disks that balance performance
              and cost.
            - Hyperdisk balanced disk type.
            - Hyperdisk balanced high availability disk type.
          type: string
        encryption:
          $ref: '#/components/schemas/Encryption'
          description: Optional. The encryption to apply to the boot disk.
        image:
          $ref: '#/components/schemas/DiskImageDefaults'
          description: The image to use when creating the disk.
      type: object
    CancelCloneJobRequest:
      description: Request message for 'CancelCloneJob' request.
      id: CancelCloneJobRequest
      properties: {}
      type: object
    CancelCutoverJobRequest:
      description: Request message for 'CancelCutoverJob' request.
      id: CancelCutoverJobRequest
      properties: {}
      type: object
    CancelDiskMigrationJobRequest:
      description: Request message for 'CancelDiskMigrationJob' request.
      id: CancelDiskMigrationJobRequest
      properties: {}
      type: object
    CancelImageImportJobRequest:
      description: Request message for 'CancelImageImportJob' request.
      id: CancelImageImportJobRequest
      properties: {}
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    ClientSecretCredentials:
      description: >-
        Message describing Azure Credentials using tenant ID, client ID and
        secret.
      id: ClientSecretCredentials
      properties:
        clientId:
          description: Azure client ID.
          type: string
        clientSecret:
          description: Input only. Azure client secret.
          type: string
        tenantId:
          description: Azure tenant ID.
          type: string
      type: object
    CloneJob:
      description: >-
        CloneJob describes the process of creating a clone of a MigratingVM to
        the requested target based on the latest successful uploaded snapshots.
        While the migration cycles of a MigratingVm take place, it is possible
        to verify the uploaded VM can be started in the cloud, by creating a
        clone. The clone can be created without any downtime, and it is created
        using the latest snapshots which are already in the cloud. The cloneJob
        is only responsible for its work, not its products, which means once it
        is finished, it will never touch the instance it created. It will only
        delete it in case of the CloneJob being cancelled or upon failure to
        clone.
      id: CloneJob
      properties:
        computeEngineDisksTargetDetails:
          $ref: '#/components/schemas/ComputeEngineDisksTargetDetails'
          description: >-
            Output only. Details of the target Persistent Disks in Compute
            Engine.
          readOnly: true
        computeEngineTargetDetails:
          $ref: '#/components/schemas/ComputeEngineTargetDetails'
          description: Output only. Details of the target VM in Compute Engine.
          readOnly: true
        createTime:
          description: >-
            Output only. The time the clone job was created (as an API call, not
            when it was actually created in the target).
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the clone job was ended.
          format: google-datetime
          readOnly: true
          type: string
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            Output only. Provides details for the errors that led to the Clone
            Job's state.
          readOnly: true
        name:
          description: Output only. The name of the clone.
          readOnly: true
          type: string
        state:
          description: Output only. State of the clone job.
          enum:
            - STATE_UNSPECIFIED
            - PENDING
            - ACTIVE
            - FAILED
            - SUCCEEDED
            - CANCELLED
            - CANCELLING
            - ADAPTING_OS
          enumDescriptions:
            - >-
              The state is unknown. This is used for API compatibility only and
              is not used by the system.
            - The clone job has not yet started.
            - The clone job is active and running.
            - The clone job finished with errors.
            - The clone job finished successfully.
            - The clone job was cancelled.
            - The clone job is being cancelled.
            - >-
              OS adaptation is running as part of the clone job to generate
              license.
          readOnly: true
          type: string
        stateTime:
          description: Output only. The time the state was last updated.
          format: google-datetime
          readOnly: true
          type: string
        steps:
          description: Output only. The clone steps list representing its progress.
          items:
            $ref: '#/components/schemas/CloneStep'
          readOnly: true
          type: array
      type: object
    CloneStep:
      description: CloneStep holds information about the clone step progress.
      id: CloneStep
      properties:
        adaptingOs:
          $ref: '#/components/schemas/AdaptingOSStep'
          description: Adapting OS step.
        endTime:
          description: The time the step has ended.
          format: google-datetime
          type: string
        instantiatingMigratedVm:
          $ref: '#/components/schemas/InstantiatingMigratedVMStep'
          description: Instantiating migrated VM step.
        preparingVmDisks:
          $ref: '#/components/schemas/PreparingVMDisksStep'
