          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/DiskMigrationStep'
        createTime:
          readOnly: true
          description: Output only. The time the DiskMigrationJob resource was created.
          type: string
          format: google-datetime
        errors:
          description: >-
            Output only. Provides details on the errors that led to the disk
            migration job's state in case of an error.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Status'
