    DataDiskImageImport:
      description: Used when the image import is not using OS adaptation process.
      id: DataDiskImageImport
      properties:
        guestOsFeatures:
          description: >-
            Optional. A list of guest OS features to apply to the imported
            image. These features are flags that are used by Compute Engine to
            enable certain capabilities for virtual machine instances that are
            created from the image. This field does not change the OS of the
            image; it only marks the image with the specified features. The user
