components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    Backup:
      description: A Filestore backup.
      id: Backup
      properties:
        capacityGb:
          description: >-
            Output only. Capacity of the source file share when the backup was
            created.
          format: int64
          readOnly: true
          type: string
        createTime:
          description: Output only. The time when the backup was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            A description of the backup with 2048 characters or less. Requests
            with longer descriptions will be rejected.
          type: string
        downloadBytes:
          description: >-
            Output only. Amount of bytes that will be downloaded if the backup
            is restored. This may be different than storage bytes, since
            sequential backups of the same disk will share storage.
          format: int64
          readOnly: true
          type: string
        fileSystemProtocol:
          description: >-
            Output only. The file system protocol of the source Filestore
            instance that this backup is created from.
          enum:
            - FILE_PROTOCOL_UNSPECIFIED
            - NFS_V3
            - NFS_V4_1
          enumDescriptions:
            - >-
              FILE_PROTOCOL_UNSPECIFIED serves a "not set" default value when a
              FileProtocol is a separate field in a message.
            - NFS 3.0.
            - NFS 4.1.
          readOnly: true
          type: string
        kmsKey:
          description: Immutable. KMS key name used for data encryption.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Resource labels to represent user provided metadata.
          type: object
        name:
          description: >-
            Output only. The resource name of the backup, in the format
            `projects/{project_number}/locations/{location_id}/backups/{backup_id}`.
          readOnly: true
          type: string
        satisfiesPzi:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        sourceFileShare:
          description: >-
            Name of the file share in the source Filestore instance that the
            backup is created from.
          type: string
        sourceInstance:
          description: >-
            The resource name of the source Filestore instance, in the format
            `projects/{project_number}/locations/{location_id}/instances/{instance_id}`,
            used to create this backup.
          type: string
        sourceInstanceTier:
          description: >-
            Output only. The service tier of the source Filestore instance that
            this backup is created from.
          enum:
            - TIER_UNSPECIFIED
            - STANDARD
            - PREMIUM
            - BASIC_HDD
            - BASIC_SSD
            - HIGH_SCALE_SSD
            - ENTERPRISE
            - ZONAL
            - REGIONAL
          enumDescriptions:
            - Not set.
            - STANDARD tier. BASIC_HDD is the preferred term for this tier.
            - PREMIUM tier. BASIC_SSD is the preferred term for this tier.
            - >-
              BASIC instances offer a maximum capacity of 63.9 TB. BASIC_HDD is
              an alias for STANDARD Tier, offering economical performance backed
              by HDD.
            - >-
              BASIC instances offer a maximum capacity of 63.9 TB. BASIC_SSD is
              an alias for PREMIUM Tier, and offers improved performance backed
              by SSD.
            - >-
              HIGH_SCALE instances offer expanded capacity and performance
              scaling capabilities.
            - >-
              ENTERPRISE instances offer the features and availability needed
              for mission-critical workloads.
            - >-
              ZONAL instances offer expanded capacity and performance scaling
              capabilities.
            - >-
              REGIONAL instances offer the features and availability needed for
              mission-critical workloads.
          readOnly: true
          type: string
        state:
          description: Output only. The backup state.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - FINALIZING
            - READY
            - DELETING
            - INVALID
          enumDescriptions:
            - State not set.
            - Backup is being created.
            - >-
              Backup has been taken and the operation is being finalized. At
              this point, changes to the file share will not be reflected in the
              backup.
            - Backup is available for use.
            - Backup is being deleted.
            - >-
              Backup is not valid and cannot be used for creating new instances
              or restoring existing instances.
          readOnly: true
          type: string
        storageBytes:
          description: >-
            Output only. The size of the storage used by the backup. As backups
            share storage, this number is expected to change with backup
            creation/deletion.
          format: int64
          readOnly: true
          type: string
        tags:
          additionalProperties:
            type: string
          description: >-
            Optional. Input only. Immutable. Tag key-value pairs bound to this
            resource. Each key must be a namespaced name and each value a short
            name. Example: "123456789012/environment" : "production",
            "123456789013/costCenter" : "marketing" See the documentation for
            more information: - Namespaced name:
            https://cloud.google.com/resource-manager/docs/tags/tags-creating-and-managing#retrieving_tag_key
            - Short name:
            https://cloud.google.com/resource-manager/docs/tags/tags-creating-and-managing#retrieving_tag_value
          type: object
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    DailyCycle:
      description: Time window specified for daily operations.
      id: DailyCycle
      properties:
        duration:
          description: Output only. Duration of the time window, set by service producer.
          format: google-duration
          type: string
        startTime:
          $ref: '#/components/schemas/TimeOfDay'
          description: Time within the day to start the operations.
      type: object
    Date:
      description: >-
        Represents a whole or partial calendar date, such as a birthday. The
        time of day and time zone are either specified elsewhere or are
        insignificant. The date is relative to the Gregorian Calendar. This can
        represent one of the following: * A full date, with non-zero year,
        month, and day values. * A month and day, with a zero year (for example,
        an anniversary). * A year on its own, with a zero month and a zero day.
        * A year and month, with a zero day (for example, a credit card
        expiration date). Related types: * google.type.TimeOfDay *
        google.type.DateTime * google.protobuf.Timestamp
      id: Date
      properties:
        day:
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0 to specify a year by itself or a year and month where
            the day isn't significant.
          format: int32
          type: integer
        month:
          description: >-
            Month of a year. Must be from 1 to 12, or 0 to specify a year
            without a month and day.
          format: int32
          type: integer
        year:
          description: >-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date
            without a year.
          format: int32
          type: integer
      type: object
    DenyMaintenancePeriod:
      description: >-
        DenyMaintenancePeriod definition. Maintenance is forbidden within the
        deny period. The start_date must be less than the end_date.
      id: DenyMaintenancePeriod
      properties:
        endDate:
          $ref: '#/components/schemas/Date'
          description: >-
            Deny period end date. This can be: * A full date, with non-zero
            year, month and day values. * A month and day value, with a zero
            year. Allows recurring deny periods each year. Date matching this
            period will have to be before the end.
        startDate:
          $ref: '#/components/schemas/Date'
          description: >-
            Deny period start date. This can be: * A full date, with non-zero
            year, month and day values. * A month and day value, with a zero
            year. Allows recurring deny periods each year. Date matching this
            period will have to be the same or after the start.
        time:
          $ref: '#/components/schemas/TimeOfDay'
          description: >-
            Time in UTC when the Blackout period starts on start_date and ends
            on end_date. This can be: * Full time. * All zeros for 00:00:00 UTC
      type: object
    DirectoryServicesConfig:
      description: Directory Services configuration for Kerberos-based authentication.
      id: DirectoryServicesConfig
      properties:
        ldap:
          $ref: '#/components/schemas/LdapConfig'
          description: Configuration for LDAP servers.
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    FileShareConfig:
      description: File share configuration for the instance.
      id: FileShareConfig
      properties:
        capacityGb:
          description: >-
            File share capacity in gigabytes (GB). Filestore defines 1 GB as
            1024^3 bytes.
          format: int64
          type: string
        name:
          description: >-
            Required. The name of the file share. Must use 1-16 characters for
            the basic service tier and 1-63 characters for all other service
            tiers. Must use lowercase letters, numbers, or underscores
            `[a-z0-9_]`. Must start with a letter. Immutable.
          type: string
        nfsExportOptions:
          description: >-
            Nfs Export Options. There is a limit of 10 export options per file
            share.
          items:
            $ref: '#/components/schemas/NfsExportOptions'
          type: array
        sourceBackup:
          description: >-
            The resource name of the backup, in the format
            `projects/{project_number}/locations/{location_id}/backups/{backup_id}`,
            that this file share has been restored from.
          type: string
        sourceBackupdrBackup:
          description: >-
            The resource name of the BackupDR backup, in the format
            `projects/{project_id}/locations/{location_id}/backupVaults/{backupvault_id}/dataSources/{datasource_id}/backups/{backup_id}`,
          type: string
      type: object
    FixedIOPS:
      description: Fixed IOPS (input/output operations per second) parameters.
      id: FixedIOPS
      properties:
        maxIops:
          description: Required. Maximum IOPS.
          format: int64
          type: string
      type: object
    GoogleCloudSaasacceleratorManagementProvidersV1Instance:
      description: >-
        Instance represents the interface for SLM services to actuate the state
        of control plane resources. Example Instance in JSON, where
        consumer-project-number=123456, producer-project-id=cloud-sql: ```json
        Instance: { "name":
        "projects/123456/locations/us-east1/instances/prod-instance",
        "create_time": { "seconds": 1526406431, }, "labels": { "env": "prod",
        "foo": "bar" }, "state": READY, "software_versions": {
        "software_update": "cloud-sql-09-28-2018", },
        "maintenance_policy_names": { "UpdatePolicy":
        "projects/123456/locations/us-east1/maintenancePolicies/prod-update-policy",
        } "tenant_project_id": "cloud-sql-test-tenant", "producer_metadata": {
        "cloud-sql-tier": "basic", "cloud-sql-instance-size": "1G", },
        "provisioned_resources": [ { "resource-type": "compute-instance",
        "resource-url":
        "https://www.googleapis.com/compute/v1/projects/cloud-sql/zones/us-east1-b/instances/vm-1",
        } ], "maintenance_schedules": { "csa_rollout": { "start_time": {
        "seconds": 1526406431, }, "end_time": { "seconds": 1535406431, }, },
        "ncsa_rollout": { "start_time": { "seconds": 1526406431, }, "end_time":
        { "seconds": 1535406431, }, } }, "consumer_defined_name":
        "my-sql-instance1", } ``` LINT.IfChange
      id: GoogleCloudSaasacceleratorManagementProvidersV1Instance
      properties:
        consumerDefinedName:
          description: >-
            consumer_defined_name is the name of the instance set by the service
            consumers. Generally this is different from the `name` field which
            reperesents the system-assigned id of the instance which the service
            consumers do not recognize. This is a required field for tenants
            onboarding to Maintenance Window notifications
            (go/slm-rollout-maintenance-policies#prerequisites).
          type: string
        consumerProjectNumber:
          description: >-
            Optional. The consumer_project_number associated with this Apigee
            instance. This field is added specifically to support Apigee
            integration with SLM Rollout and UMM. It represents the numerical
            project ID of the GCP project that consumes this Apigee instance. It
            is used for SLM rollout notifications and UMM integration, enabling
            proper mapping to customer projects and log delivery for Apigee
            instances. This field complements consumer_project_id and may be
            used for specific Apigee scenarios where the numerical ID is
            required.
          type: string
        createTime:
          description: Output only. Timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        instanceType:
          description: >-
            Optional. The instance_type of this instance of format:
            projects/{project_number}/locations/{location_id}/instanceTypes/{instance_type_id}.
            Instance Type represents a high-level tier or SKU of the service
            that this instance belong to. When enabled(eg: Maintenance Rollout),
            Rollout uses 'instance_type' along with 'software_versions' to
            determine whether instance needs an update or not.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Resource labels to represent user provided metadata. Each
            label is a key-value pair, where both the key and the value are
            arbitrary strings provided by the user.
          type: object
        maintenancePolicyNames:
          additionalProperties:
            type: string
          description: >-
            Optional. The MaintenancePolicies that have been attached to the
            instance. The key must be of the type name of the oneof policy name
            defined in MaintenancePolicy, and the referenced policy must define
            the same policy type. For details, please refer to go/mr-user-guide.
            Should not be set if maintenance_settings.maintenance_policies is
            set.
          type: object
        maintenanceSchedules:
          additionalProperties:
            $ref: >-
              #/components/schemas/GoogleCloudSaasacceleratorManagementProvidersV1MaintenanceSchedule
          description: >-
            The MaintenanceSchedule contains the scheduling information of
            published maintenance schedule with same key as software_versions.
          type: object
        maintenanceSettings:
          $ref: >-
            #/components/schemas/GoogleCloudSaasacceleratorManagementProvidersV1MaintenanceSettings
          description: Optional. The MaintenanceSettings associated with instance.
        name:
          description: >-
            Unique name of the resource. It uses the form:
            `projects/{project_number}/locations/{location_id}/instances/{instance_id}`
            Note: This name is passed, stored and logged across the rollout
            system. So use of consumer project_id or any other consumer PII in
            the name is strongly discouraged for wipeout (go/wipeout)
            compliance. See go/elysium/project_ids#storage-guidance for more
            details.
          type: string
        notificationParameters:
          additionalProperties:
            $ref: >-
              #/components/schemas/GoogleCloudSaasacceleratorManagementProvidersV1NotificationParameter
          description: >-
            Optional. notification_parameter are information that service
            producers may like to include that is not relevant to Rollout. This
            parameter will only be passed to Gamma and Cloud Logging for
            notification/logging purpose.
          type: object
        producerMetadata:
          additionalProperties:
            type: string
          description: >-
            Output only. Custom string attributes used primarily to expose
            producer-specific information in monitoring dashboards. See
            go/get-instance-metadata.
          readOnly: true
          type: object
        provisionedResources:
          description: >-
            Output only. The list of data plane resources provisioned for this
            instance, e.g. compute VMs. See go/get-instance-metadata.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudSaasacceleratorManagementProvidersV1ProvisionedResource
          readOnly: true
          type: array
        slmInstanceTemplate:
          description: >-
            Link to the SLM instance template. Only populated when updating SLM
            instances via SSA's Actuation service adaptor. Service producers
            with custom control plane (e.g. Cloud SQL) doesn't need to populate
            this field. Instead they should use software_versions.
          type: string
        sloMetadata:
          $ref: >-
            #/components/schemas/GoogleCloudSaasacceleratorManagementProvidersV1SloMetadata
          description: >-
            Output only. SLO metadata for instance classification in the
            Standardized dataplane SLO platform. See go/cloud-ssa-standard-slo
            for feature description.
          readOnly: true
        softwareVersions:
          additionalProperties:
            type: string
          description: >-
            Software versions that are used to deploy this instance. This can be
            mutated by rollout services.
          type: object
        state:
          description: >-
            Output only. Current lifecycle state of the resource (e.g. if it's
            being created or ready to use).
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - UPDATING
            - REPAIRING
            - DELETING
            - ERROR
          enumDescriptions:
            - Unspecified state.
            - Instance is being created.
            - Instance has been created and is ready to use.
            - Instance is being updated.
            - Instance is unheathy and under repair.
            - Instance is being deleted.
            - Instance encountered an error and is in indeterministic state.
          readOnly: true
          type: string
        tenantProjectId:
          description: >-
            Output only. ID of the associated GCP tenant project. See
            go/get-instance-metadata.
          readOnly: true
          type: string
        updateTime:
          description: Output only. Timestamp when the resource was last modified.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleCloudSaasacceleratorManagementProvidersV1MaintenanceSchedule:
      description: >-
        Maintenance schedule which is exposed to customer and potentially end
        user, indicating published upcoming future maintenance schedule
      id: GoogleCloudSaasacceleratorManagementProvidersV1MaintenanceSchedule
      properties:
        canReschedule:
          deprecated: true
          description: >-
            This field is deprecated, and will be always set to true since
            reschedule can happen multiple times now. This field should not be
            removed until all service producers remove this for their customers.
          type: boolean
        endTime:
          description: The scheduled end time for the maintenance.
          format: google-datetime
          type: string
        rolloutManagementPolicy:
          description: >-
            The rollout management policy this maintenance schedule is
            associated with. When doing reschedule update request, the
            reschedule should be against this given policy.
          type: string
        scheduleDeadlineTime:
          description: >-
            schedule_deadline_time is the time deadline any schedule start time
            cannot go beyond, including reschedule. It's normally the initial
            schedule start time plus maintenance window length (1 day or 1
            week). Maintenance cannot be scheduled to start beyond this
            deadline.
          format: google-datetime
          type: string
        startTime:
          description: The scheduled start time for the maintenance.
          format: google-datetime
          type: string
      type: object
    GoogleCloudSaasacceleratorManagementProvidersV1MaintenanceSettings:
      description: >-
        Maintenance settings associated with instance. Allows service producers
        and end users to assign settings that controls maintenance on this
        instance.
      id: GoogleCloudSaasacceleratorManagementProvidersV1MaintenanceSettings
      properties:
        exclude:
          description: >-
            Optional. Exclude instance from maintenance. When true, rollout
            service will not attempt maintenance on the instance. Rollout
            service will include the instance in reported rollout progress as
            not attempted.
          type: boolean
        isRollback:
          description: >-
            Optional. If the update call is triggered from rollback, set the
            value as true.
          type: boolean
        maintenancePolicies:
          additionalProperties:
            $ref: '#/components/schemas/MaintenancePolicy'
          description: >-
            Optional. The MaintenancePolicies that have been attached to the
            instance. The key must be of the type name of the oneof policy name
            defined in MaintenancePolicy, and the embedded policy must define
            the same policy type. For details, please refer to go/mr-user-guide.
            Should not be set if maintenance_policy_names is set. If only the
            name is needed, then only populate MaintenancePolicy.name.
          type: object
      type: object
    GoogleCloudSaasacceleratorManagementProvidersV1NodeSloMetadata:
      description: >-
        Node information for custom per-node SLO implementations. SSA does not
        support per-node SLO, but producers can populate per-node information in
        SloMetadata for custom precomputations. SSA Eligibility Exporter will
        emit per-node metric based on this information.
      id: GoogleCloudSaasacceleratorManagementProvidersV1NodeSloMetadata
      properties:
        location:
          description: The location of the node, if different from instance location.
          type: string
        nodeId:
          description: >-
            The id of the node. This should be equal to
            SaasInstanceNode.node_id.
          type: string
        perSliEligibility:
          $ref: >-
            #/components/schemas/GoogleCloudSaasacceleratorManagementProvidersV1PerSliSloEligibility
          description: >-
            If present, this will override eligibility for the node coming from
            instance or exclusions for specified SLIs.
      type: object
    GoogleCloudSaasacceleratorManagementProvidersV1NotificationParameter:
      description: Contains notification related data.
      id: GoogleCloudSaasacceleratorManagementProvidersV1NotificationParameter
      properties:
        values:
          description: >-
            Optional. Array of string values. e.g. instance's replica
            information.
          items:
            type: string
          type: array
      type: object
    GoogleCloudSaasacceleratorManagementProvidersV1PerSliSloEligibility:
      description: PerSliSloEligibility is a mapping from an SLI name to eligibility.
      id: GoogleCloudSaasacceleratorManagementProvidersV1PerSliSloEligibility
      properties:
        eligibilities:
          additionalProperties:
            $ref: >-
              #/components/schemas/GoogleCloudSaasacceleratorManagementProvidersV1SloEligibility
          description: >-
            An entry in the eligibilities map specifies an eligibility for a
            particular SLI for the given instance. The SLI key in the name must
            be a valid SLI name specified in the Eligibility Exporter binary
            flags otherwise an error will be emitted by Eligibility Exporter and
            the oncaller will be alerted. If an SLI has been defined in the
            binary flags but the eligibilities map does not contain it, the
            corresponding SLI time series will not be emitted by the Eligibility
            Exporter. This ensures a smooth rollout and compatibility between
            the data produced by different versions of the Eligibility
            Exporters. If eligibilities map contains a key for an SLI which has
            not been declared in the binary flags, there will be an error
            message emitted in the Eligibility Exporter log and the metric for
            the SLI in question will not be emitted.
          type: object
      type: object
    GoogleCloudSaasacceleratorManagementProvidersV1ProvisionedResource:
      description: Describes provisioned dataplane resources.
      id: GoogleCloudSaasacceleratorManagementProvidersV1ProvisionedResource
      properties:
        resourceType:
          description: >-
            Type of the resource. This can be either a GCP resource or a custom
            one (e.g. another cloud provider's VM). For GCP compute resources
            use singular form of the names listed in GCP compute API
            documentation
            (https://cloud.google.com/compute/docs/reference/rest/v1/), prefixed
            with 'compute-', for example: 'compute-instance', 'compute-disk',
            'compute-autoscaler'.
          type: string
        resourceUrl:
          description: >-
            URL identifying the resource, e.g.
            "https://www.googleapis.com/compute/v1/projects/...)".
          type: string
      type: object
    GoogleCloudSaasacceleratorManagementProvidersV1SloEligibility:
      description: >-
        SloEligibility is a tuple containing eligibility value: true if an
        instance is eligible for SLO calculation or false if it should be
        excluded from all SLO-related calculations along with a user-defined
        reason.
      id: GoogleCloudSaasacceleratorManagementProvidersV1SloEligibility
      properties:
        eligible:
          description: Whether an instance is eligible or ineligible.
          type: boolean
        reason:
          description: >-
            User-defined reason for the current value of instance eligibility.
            Usually, this can be directly mapped to the internal state. An empty
            reason is allowed.
          type: string
      type: object
    GoogleCloudSaasacceleratorManagementProvidersV1SloMetadata:
      description: >-
        SloMetadata contains resources required for proper SLO classification of
        the instance.
      id: GoogleCloudSaasacceleratorManagementProvidersV1SloMetadata
      properties:
        nodes:
          description: >-
            Optional. List of nodes. Some producers need to use per-node
            metadata to calculate SLO. This field allows such producers to
            publish per-node SLO meta data, which will be consumed by SSA
            Eligibility Exporter and published in the form of per node metric to
            Monarch.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudSaasacceleratorManagementProvidersV1NodeSloMetadata
          type: array
        perSliEligibility:
          $ref: >-
            #/components/schemas/GoogleCloudSaasacceleratorManagementProvidersV1PerSliSloEligibility
          description: >-
            Optional. Multiple per-instance SLI eligibilities which apply for
            individual SLIs.
        tier:
          description: >-
            Name of the SLO tier the Instance belongs to. This name will be
            expected to match the tiers specified in the service SLO
            configuration. Field is mandatory and must not be empty.
          type: string
      type: object
    IOPSPerTB:
      description: IOPS per TB. Filestore defines TB as 1024^4 bytes (TiB).
      id: IOPSPerTB
      properties:
        maxIopsPerTb:
          description: Required. Maximum IOPS per TiB.
          format: int64
          type: string
      type: object
    Instance:
      description: A Filestore instance.
      id: Instance
      properties:
        capacityStepSizeGb:
          description: >-
            Output only. The incremental increase or decrease in capacity,
            designated in some number of GB.
          format: int64
          readOnly: true
          type: string
        createTime:
          description: Output only. The time when the instance was created.
          format: google-datetime
          readOnly: true
          type: string
        customPerformanceSupported:
          description: >-
            Output only. Indicates whether this instance supports configuring
            its performance. If true, the user can configure the instance's
            performance by using the 'performance_config' field.
          readOnly: true
          type: boolean
        deletionProtectionEnabled:
          description: >-
            Optional. Indicates whether the instance is protected against
            deletion.
          type: boolean
        deletionProtectionReason:
          description: Optional. The reason for enabling deletion protection.
          type: string
        description:
          description: The description of the instance (2048 characters or less).
          type: string
        directoryServices:
          $ref: '#/components/schemas/DirectoryServicesConfig'
          description: >-
            Optional. Directory Services configuration for Kerberos-based
            authentication. Should only be set if protocol is "NFS_V4_1".
        etag:
          description: >-
            Server-specified ETag for the instance resource to prevent
            simultaneous updates from overwriting each other.
          type: string
        fileShares:
          description: >-
            File system shares on the instance. For this version, only a single
            file share is supported.
          items:
            $ref: '#/components/schemas/FileShareConfig'
          type: array
        kmsKeyName:
          description: KMS key name used for data encryption.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Resource labels to represent user provided metadata.
          type: object
        maxCapacityGb:
          description: Output only. The maximum capacity of the instance in GB.
          format: int64
          readOnly: true
          type: string
        minCapacityGb:
          description: Output only. The minimum capacity of the instance in GB.
          format: int64
          readOnly: true
          type: string
        name:
          description: >-
            Output only. The resource name of the instance, in the format
            `projects/{project}/locations/{location}/instances/{instance}`.
          readOnly: true
          type: string
        networks:
          description: >-
            VPC networks to which the instance is connected. For this version,
            only a single network is supported.
          items:
            $ref: '#/components/schemas/NetworkConfig'
          type: array
        performanceConfig:
          $ref: '#/components/schemas/PerformanceConfig'
          description: Optional. Used to configure performance.
        performanceLimits:
          $ref: '#/components/schemas/PerformanceLimits'
          description: Output only. Used for getting performance limits.
          readOnly: true
        protocol:
          description: >-
            Immutable. The protocol indicates the access protocol for all shares
            in the instance. This field is immutable and it cannot be changed
            after the instance has been created. Default value: `NFS_V3`.
          enum:
            - FILE_PROTOCOL_UNSPECIFIED
            - NFS_V3
            - NFS_V4_1
          enumDescriptions:
            - >-
              FILE_PROTOCOL_UNSPECIFIED serves a "not set" default value when a
              FileProtocol is a separate field in a message.
            - NFS 3.0.
            - NFS 4.1.
          type: string
        replication:
          $ref: '#/components/schemas/Replication'
          description: Optional. Replication configuration.
        satisfiesPzi:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        satisfiesPzs:
          description: Output only. Reserved for future use.
          readOnly: true
          type: boolean
        state:
          description: Output only. The instance state.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - REPAIRING
            - DELETING
            - ERROR
            - RESTORING
            - SUSPENDED
            - SUSPENDING
            - RESUMING
            - REVERTING
            - PROMOTING
          enumDescriptions:
            - State not set.
            - The instance is being created.
            - The instance is available for use.
            - >-
              Work is being done on the instance. You can get further details
              from the `statusMessage` field of the `Instance` resource.
            - The instance is shutting down.
            - >-
              The instance is experiencing an issue and might be unusable. You
              can get further details from the `statusMessage` field of the
              `Instance` resource.
            - >-
              The instance is restoring a backup to an existing file share and
              may be unusable during this time.
            - >-
              The instance is suspended. You can get further details from the
              `suspension_reasons` field of the `Instance` resource.
            - The instance is in the process of becoming suspended.
            - The instance is in the process of becoming active.
            - The instance is reverting to a snapshot.
            - The replica instance is being promoted.
          readOnly: true
          type: string
        statusMessage:
          description: >-
            Output only. Additional information about the instance state, if
            available.
          readOnly: true
          type: string
        suspensionReasons:
          description: >-
            Output only. Field indicates all the reasons the instance is in
            "SUSPENDED" state.
          items:
            enum:
              - SUSPENSION_REASON_UNSPECIFIED
              - KMS_KEY_ISSUE
            enumDescriptions:
              - Not set.
              - >-
                The KMS key used by the instance is either revoked or denied
                access to.
            type: string
          readOnly: true
          type: array
        tags:
          additionalProperties:
            type: string
          description: >-
            Optional. Input only. Immutable. Tag key-value pairs bound to this
            resource. Each key must be a namespaced name and each value a short
            name. Example: "123456789012/environment" : "production",
            "123456789013/costCenter" : "marketing" See the documentation for
            more information: - Namespaced name:
            https://cloud.google.com/resource-manager/docs/tags/tags-creating-and-managing#retrieving_tag_key
            - Short name:
            https://cloud.google.com/resource-manager/docs/tags/tags-creating-and-managing#retrieving_tag_value
          type: object
        tier:
          description: The service tier of the instance.
          enum:
            - TIER_UNSPECIFIED
            - STANDARD
            - PREMIUM
            - BASIC_HDD
            - BASIC_SSD
            - HIGH_SCALE_SSD
            - ENTERPRISE
            - ZONAL
            - REGIONAL
          enumDescriptions:
            - Not set.
            - STANDARD tier. BASIC_HDD is the preferred term for this tier.
            - PREMIUM tier. BASIC_SSD is the preferred term for this tier.
            - >-
              BASIC instances offer a maximum capacity of 63.9 TB. BASIC_HDD is
              an alias for STANDARD Tier, offering economical performance backed
              by HDD.
            - >-
              BASIC instances offer a maximum capacity of 63.9 TB. BASIC_SSD is
              an alias for PREMIUM Tier, and offers improved performance backed
              by SSD.
            - >-
              HIGH_SCALE instances offer expanded capacity and performance
              scaling capabilities.
            - >-
              ENTERPRISE instances offer the features and availability needed
              for mission-critical workloads.
            - >-
              ZONAL instances offer expanded capacity and performance scaling
              capabilities.
            - >-
              REGIONAL instances offer the features and availability needed for
              mission-critical workloads.
          type: string
      type: object
    LdapConfig:
      description: LdapConfig contains all the parameters for connecting to LDAP servers.
      id: LdapConfig
      properties:
        domain:
          description: Required. The LDAP domain name in the format of `my-domain.com`.
          type: string
        groupsOu:
          description: >-
            Optional. The groups Organizational Unit (OU) is optional. This
            parameter is a hint to allow faster lookup in the LDAP namespace. In
            case that this parameter is not provided, Filestore instance will
            query the whole LDAP namespace.
          type: string
        servers:
          description: >-
            Required. The servers names are used for specifying the LDAP servers
            names. The LDAP servers names can come with two formats: 1. DNS
            name, for example: `ldap.example1.com`, `ldap.example2.com`. 2. IP
            address, for example: `10.0.0.1`, `10.0.0.2`, `10.0.0.3`. All
            servers names must be in the same format: either all DNS names or
            all IP addresses.
          items:
            type: string
          type: array
        usersOu:
          description: >-
            Optional. The users Organizational Unit (OU) is optional. This
            parameter is a hint to allow faster lookup in the LDAP namespace. In
            case that this parameter is not provided, Filestore instance will
            query the whole LDAP namespace.
          type: string
      type: object
    ListBackupsResponse:
      description: ListBackupsResponse is the result of ListBackupsRequest.
      id: ListBackupsResponse
      properties:
        backups:
          description: >-
            A list of backups in the project for the specified location. If the
            `{location}` value in the request is "-", the response contains a
            list of backups from all locations. If any location is unreachable,
            the response will only return backups in reachable locations and the
            "unreachable" field will be populated with a list of unreachable
            locations.
          items:
            $ref: '#/components/schemas/Backup'
          type: array
        nextPageToken:
          description: >-
            The token you can use to retrieve the next page of results. Not
            returned if there are no more results in the list.
          type: string
        unreachable:
          description: Unordered list. Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListInstancesResponse:
      description: ListInstancesResponse is the result of ListInstancesRequest.
      id: ListInstancesResponse
      properties:
        instances:
          description: >-
            A list of instances in the project for the specified location. If
            the `{location}` value in the request is "-", the response contains
            a list of instances from all locations. If any location is
            unreachable, the response will only return instances in reachable
            locations and the "unreachable" field will be populated with a list
            of unreachable locations.
          items:
            $ref: '#/components/schemas/Instance'
          type: array
        nextPageToken:
          description: >-
            The token you can use to retrieve the next page of results. Not
            returned if there are no more results in the list.
          type: string
        unreachable:
          description: Unordered list. Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    ListSnapshotsResponse:
      description: ListSnapshotsResponse is the result of ListSnapshotsRequest.
      id: ListSnapshotsResponse
      properties:
        nextPageToken:
          description: >-
            The token you can use to retrieve the next page of results. Not
            returned if there are no more results in the list.
          type: string
        snapshots:
          description: A list of snapshots in the project for the specified instance.
          items:
            $ref: '#/components/schemas/Snapshot'
          type: array
        unreachable:
          description: Unordered list. Locations that could not be reached.
          items:
            type: string
          type: array
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    MaintenancePolicy:
      description: Defines policies to service maintenance events.
      id: MaintenancePolicy
      properties:
        createTime:
          description: Output only. The time when the resource was created.
          format: google-datetime
          type: string
        description:
          description: >-
            Optional. Description of what this policy is for. Create/Update
            methods return INVALID_ARGUMENT if the length is greater than 512.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Resource labels to represent user provided metadata. Each
            label is a key-value pair, where both the key and the value are
            arbitrary strings provided by the user.
          type: object
        name:
          description: >-
            Required. MaintenancePolicy name using the form:
            `projects/{project_id}/locations/{location_id}/maintenancePolicies/{maintenance_policy_id}`
            where {project_id} refers to a GCP consumer project ID,
            {location_id} refers to a GCP region/zone, {maintenance_policy_id}
            must be 1-63 characters long and match the regular expression
            `[a-z0-9]([-a-z0-9]*[a-z0-9])?`.
          type: string
        state:
          description: Optional. The state of the policy.
          enum:
            - STATE_UNSPECIFIED
            - READY
            - DELETING
          enumDescriptions:
            - Unspecified state.
            - Resource is ready to be used.
            - >-
              Resource is being deleted. It can no longer be attached to
              instances.
          type: string
        updatePolicy:
          $ref: '#/components/schemas/UpdatePolicy'
          description: Maintenance policy applicable to instance update.
        updateTime:
          description: Output only. The time when the resource was updated.
          format: google-datetime
          type: string
      type: object
    MaintenanceWindow:
      description: MaintenanceWindow definition.
      id: MaintenanceWindow
      properties:
        dailyCycle:
          $ref: '#/components/schemas/DailyCycle'
          description: Daily cycle.
        weeklyCycle:
          $ref: '#/components/schemas/WeeklyCycle'
          description: Weekly cycle.
      type: object
    NetworkConfig:
      description: Network configuration for the instance.
      id: NetworkConfig
      properties:
        connectMode:
          description: >-
            The network connect mode of the Filestore instance. If not provided,
            the connect mode defaults to DIRECT_PEERING.
          enum:
            - CONNECT_MODE_UNSPECIFIED
            - DIRECT_PEERING
            - PRIVATE_SERVICE_ACCESS
            - PRIVATE_SERVICE_CONNECT
          enumDescriptions:
            - Not set.
            - Connect via direct peering to the Filestore service.
            - >-
              Connect to your Filestore instance using Private Service Access.
              Private services access provides an IP address range for multiple
              Google Cloud services, including Filestore.
            - >-
              Connect to your Filestore instance using Private Service Connect.
              A connection policy must exist in the region for the VPC network
              and the google-cloud-filestore service class.
          type: string
        ipAddresses:
          description: >-
            Output only. IPv4 addresses in the format
            `{octet1}.{octet2}.{octet3}.{octet4}` or IPv6 addresses in the
            format
            `{block1}:{block2}:{block3}:{block4}:{block5}:{block6}:{block7}:{block8}`.
          items:
            type: string
          readOnly: true
          type: array
        modes:
          description: >-
            Internet protocol versions for which the instance has IP addresses
            assigned.
          items:
            enum:
              - ADDRESS_MODE_UNSPECIFIED
              - MODE_IPV4
              - MODE_IPV6
            enumDescriptions:
              - Internet protocol not set.
              - Use the IPv4 internet protocol.
              - >-
                Use the IPv6 internet protocol. Only supported when using
                Private Service Connect.
            type: string
          type: array
        network:
          description: >-
            The name of the Google Compute Engine [VPC
            network](https://cloud.google.com/vpc/docs/vpc) to which the
            instance is connected.
          type: string
        pscConfig:
          $ref: '#/components/schemas/PscConfig'
          description: >-
            Optional. Private Service Connect configuration. Should only be set
            when connect_mode is PRIVATE_SERVICE_CONNECT.
        reservedIpRange:
          description: >-
            Optional, reserved_ip_range can have one of the following two types
            of values. * CIDR range value when using DIRECT_PEERING connect
            mode. * [Allocated IP address
            range](https://cloud.google.com/compute/docs/ip-addresses/reserve-static-internal-ip-address)
            when using PRIVATE_SERVICE_ACCESS connect mode. When the name of an
            allocated IP address range is specified, it must be one of the
            ranges associated with the private service access connection. When
            specified as a direct CIDR value, it must be a /29 CIDR block for
            Basic tier, a /24 CIDR block for High Scale tier, or a /26 CIDR
            block for Enterprise tier in one of the [internal IP address
            ranges](https://www.arin.net/reference/research/statistics/address_filters/)
            that identifies the range of IP addresses reserved for this
            instance. For example, 10.0.0.0/29, 192.168.0.0/24 or
            192.168.0.0/26, respectively. The range you specify can't overlap
            with either existing subnets or assigned IP address ranges for other
            Filestore instances in the selected VPC network.
          type: string
      type: object
    NfsExportOptions:
      description: NFS export options specifications.
      id: NfsExportOptions
      properties:
        accessMode:
          description: >-
            Either READ_ONLY, for allowing only read requests on the exported
            directory, or READ_WRITE, for allowing both read and write requests.
            The default is READ_WRITE.
          enum:
            - ACCESS_MODE_UNSPECIFIED
            - READ_ONLY
            - READ_WRITE
          enumDescriptions:
            - AccessMode not set.
            - The client can only read the file share.
            - The client can read and write the file share (default).
          type: string
        anonGid:
          description: >-
            An integer representing the anonymous group id with a default value
            of 65534. Anon_gid may only be set with squash_mode of ROOT_SQUASH.
            An error will be returned if this field is specified for other
            squash_mode settings.
          format: int64
          type: string
        anonUid:
          description: >-
            An integer representing the anonymous user id with a default value
            of 65534. Anon_uid may only be set with squash_mode of ROOT_SQUASH.
            An error will be returned if this field is specified for other
            squash_mode settings.
          format: int64
          type: string
        ipRanges:
          description: >-
            List of either an IPv4 addresses in the format
            `{octet1}.{octet2}.{octet3}.{octet4}` or CIDR ranges in the format
            `{octet1}.{octet2}.{octet3}.{octet4}/{mask size}` which may mount
            the file share. Overlapping IP ranges are not allowed, both within
            and across NfsExportOptions. An error will be returned. The limit is
            64 IP ranges/addresses for each FileShareConfig among all
            NfsExportOptions.
          items:
            type: string
          type: array
        network:
          description: >-
            Optional. The source VPC network for ip_ranges. Required for
            instances using Private Service Connect, optional otherwise. If
            provided, must be the same network specified in the
            `NetworkConfig.network` field.
          type: string
        squashMode:
          description: >-
            Either NO_ROOT_SQUASH, for allowing root access on the exported
            directory, or ROOT_SQUASH, for not allowing root access. The default
            is NO_ROOT_SQUASH.
          enum:
            - SQUASH_MODE_UNSPECIFIED
            - NO_ROOT_SQUASH
            - ROOT_SQUASH
          enumDescriptions:
            - SquashMode not set.
            - The Root user has root access to the file share (default).
            - The Root user has squashed access to the anonymous uid/gid.
          type: string
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        cancelRequested:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of `1`, corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        statusDetail:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    PauseReplicaRequest:
      description: PauseReplicaRequest pauses a Filestore standby instance (replica).
      id: PauseReplicaRequest
      properties: {}
      type: object
    PerformanceConfig:
      description: >-
        Used for setting the performance configuration. If the user doesn't
        specify PerformanceConfig, automatically provision the default
        performance settings as described in
        https://cloud.google.com/filestore/docs/performance. Larger instances
        will be linearly set to more IOPS. If the instance's capacity is
        increased or decreased, its performance will be automatically adjusted
        upwards or downwards accordingly (respectively).
      id: PerformanceConfig
      properties:
        fixedIops:
          $ref: '#/components/schemas/FixedIOPS'
          description: >-
            Choose a fixed provisioned IOPS value for the instance, which will
            remain constant regardless of instance capacity. Value must be a
            multiple of 1000. If the chosen value is outside the supported range
            for the instance's capacity during instance creation, instance
            creation will fail with an `InvalidArgument` error. Similarly, if an
            instance capacity update would result in a value outside the
            supported range, the update will fail with an `InvalidArgument`
            error.
        iopsPerTb:
          $ref: '#/components/schemas/IOPSPerTB'
          description: >-
            Provision IOPS dynamically based on the capacity of the instance.
            Provisioned IOPS will be calculated by multiplying the capacity of
            the instance in TiB by the `iops_per_tb` value. For example, for a 2
            TiB instance with an `iops_per_tb` value of 17000 the provisioned
            IOPS will be 34000. If the calculated value is outside the supported
            range for the instance's capacity during instance creation, instance
            creation will fail with an `InvalidArgument` error. Similarly, if an
            instance capacity update would result in a value outside the
            supported range, the update will fail with an `InvalidArgument`
            error.
      type: object
    PerformanceLimits:
      description: >-
        The enforced performance limits, calculated from the instance's
        performance configuration.
      id: PerformanceLimits
      properties:
        maxIops:
          description: Output only. The maximum IOPS.
          format: int64
          readOnly: true
          type: string
        maxReadIops:
