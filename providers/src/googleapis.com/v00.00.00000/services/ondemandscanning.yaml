openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: On-Demand Scanning API
  description: A service to scan container images for vulnerabilities.
  version: v1
  x-discovery-doc-revision: '20260706'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/container-analysis/docs/on-demand-scanning/
servers:
  - url: https://ondemandscanning.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    Justification:
      id: Justification
      type: object
      description: >-
        Justification provides the justification when the state of the
        assessment if NOT_AFFECTED.
      properties:
        justificationType:
          type: string
          description: The justification type for this vulnerability.
          enumDescriptions:
            - JUSTIFICATION_TYPE_UNSPECIFIED.
            - The vulnerable component is not present in the product.
            - >-
              The vulnerable code is not present. Typically this case occurs
              when source code is configured or built in a way that excludes the
              vulnerable code.
            - >-
              The vulnerable code can not be executed. Typically this case
              occurs when the product includes the vulnerable code but does not
              call or use the vulnerable code.
            - >-
              The vulnerable code cannot be controlled by an attacker to exploit
              the vulnerability.
            - >-
              The product includes built-in protections or features that prevent
              exploitation of the vulnerability. These built-in protections
              cannot be subverted by the attacker and cannot be configured or
              disabled by the user. These mitigations completely prevent
              exploitation based on known attack vectors.
          enum:
            - JUSTIFICATION_TYPE_UNSPECIFIED
            - COMPONENT_NOT_PRESENT
            - VULNERABLE_CODE_NOT_PRESENT
            - VULNERABLE_CODE_NOT_IN_EXECUTE_PATH
            - VULNERABLE_CODE_CANNOT_BE_CONTROLLED_BY_ADVERSARY
            - INLINE_MITIGATIONS_ALREADY_EXIST
        details:
          description: Additional details on why this justification was chosen.
          type: string
    ComplianceVersion:
      id: ComplianceVersion
      type: object
      description: >-
        Describes the CIS benchmark version that is applicable to a given OS and
        os version.
      properties:
        cpeUri:
          description: >-
            The CPE URI (https://cpe.mitre.org/specification/) this benchmark is
            applicable to.
          type: string
        benchmarkDocument:
          type: string
          description: >-
            The name of the document that defines this benchmark, e.g. "CIS
            Container-Optimized OS".
        version:
          type: string
          description: >-
            The version of the benchmark. This is set to the version of the
            OS-specific CIS document the benchmark is defined in.
    RepoId:
      properties:
        uid:
          description: A server-assigned, globally unique identifier.
          type: string
        projectRepoId:
          $ref: '#/components/schemas/ProjectRepoId'
          description: A combination of a project ID and a repo name.
      description: A unique identifier for a Cloud Repo.
      id: RepoId
      type: object
    SlsaProvenanceV1:
      properties:
        runDetails:
          $ref: '#/components/schemas/RunDetails'
        buildDefinition:
          $ref: '#/components/schemas/BuildDefinition'
      description: >-
        Keep in sync with schema at
        https://github.com/slsa-framework/slsa/blob/main/docs/provenance/schema/v1/provenance.proto
        Builder renamed to ProvenanceBuilder because of Java conflicts.
      id: SlsaProvenanceV1
      type: object
    AISkillAnalysisOccurrence:
      properties:
        skillName:
          type: string
          description: Name of the skill that produced this analysis.
        maxSeverity:
          type: string
          enumDescriptions:
            - Unspecified severity.
            - Critical severity.
            - High severity.
          enum:
            - SEVERITY_UNSPECIFIED
            - CRITICAL
            - HIGH
          description: Maximum severity found among findings.
        findings:
          type: array
          description: Findings produced by the analysis.
          items:
            $ref: '#/components/schemas/Finding'
      description: >-
        AISkillAnalysisOccurrence provides the results of an AI-based skill
        analysis.
      id: AISkillAnalysisOccurrence
      type: object
    SlsaBuilder:
      properties:
        id:
          type: string
      id: SlsaBuilder
      type: object
    Source:
      id: Source
      type: object
      description: Source describes the location of the source used for the build.
      properties:
        artifactStorageSourceUri:
          description: >-
            If provided, the input binary artifacts for the build came from this
            location.
          type: string
        fileHashes:
          type: object
          description: >-
            Hash(es) of the build source, which can be used to verify that the
            original source integrity was maintained in the build. The keys to
            this map are file paths used as build source and the values contain
            the hash values for those files. If the build source came in a
            single package such as a gzipped tarfile (.tar.gz), the FileHash
            will be for the single path to that file.
          additionalProperties:
            $ref: '#/components/schemas/FileHashes'
        context:
          $ref: '#/components/schemas/SourceContext'
          description: >-
            If provided, the source code used for the build came from this
            location.
        additionalContexts:
          description: >-
            If provided, some of the source code used for the build may be found
            in these locations, in the case where the source repository had
            multiple remotes or submodules. This list will not include the
            context specified in the context field.
          items:
            $ref: '#/components/schemas/SourceContext'
          type: array
    BuildDefinition:
      properties:
        externalParameters:
          type: object
          additionalProperties:
            description: Properties of the object.
            type: any
        resolvedDependencies:
          items:
            $ref: '#/components/schemas/ResourceDescriptor'
          type: array
        internalParameters:
          type: object
          additionalProperties:
            type: any
            description: Properties of the object.
        buildType:
          type: string
      id: BuildDefinition
      type: object
    Artifact:
      properties:
        checksum:
          type: string
          description: >-
            Hash or checksum value of a binary, or Docker Registry 2.0 digest of
            a container.
        id:
          description: >-
            Artifact ID, if any; for container images, this will be a URL by
            digest like `gcr.io/projectID/imagename@sha256:123456`.
          type: string
        names:
          type: array
          description: >-
            Related artifact names. This may be the path to a binary or jar
            file, or in the case of a container build, the name used to push the
            container image to Google Container Registry, as presented to
            `docker push`. Note that a single Artifact ID can have multiple
            names, for example if two tags are applied to one image.
          items:
            type: string
      description: Artifact describes a build product.
      id: Artifact
      type: object
    ProjectRepoId:
      description: >-
        Selects a repo using a Google Cloud Platform project ID (e.g.,
        winged-cargo-31) and a repo name within that project.
      properties:
        projectId:
          description: The ID of the project.
          type: string
        repoName:
          type: string
          description: The name of the repo. Leave empty for the default repo.
      id: ProjectRepoId
      type: object
    CISAKnownExploitedVulnerabilities:
      properties:
        knownRansomwareCampaignUse:
          type: string
          description: >-
            Whether the vulnerability is known to have been leveraged as part of
            a ransomware campaign.
      id: CISAKnownExploitedVulnerabilities
      type: object
    SecretLocation:
      id: SecretLocation
      type: object
      properties:
        fileLocation:
          description: The secret is found from a file.
          $ref: '#/components/schemas/GrafeasV1FileLocation'
      description: The location of the secret.
    AnalysisCompleted:
      id: AnalysisCompleted
      type: object
      description: >-
        Indicates which analysis completed successfully. Multiple types of
        analysis can be performed on a single resource.
      properties:
        analysisType:
          items:
            type: string
          type: array
    FileLocation:
      id: FileLocation
      type: object
      description: Indicates the location at which a package was found.
      properties:
        filePath:
          type: string
          description: >-
            For jars that are contained inside .war files, this filepath can
            indicate the path to war file combined with the path to jar file.
        layerDetails:
          $ref: '#/components/schemas/LayerDetails'
        lineNumber:
          format: int32
          description: >-
            Line number in the file where the package is found. Applies only to
            source repository scanning. Note: this field is marked as `optional`
            in other corresponding protos, but in edition 2023, the "optional"
            keyword is redundant.
          type: integer
    License:
      properties:
        expression:
          description: >-
            Often a single license can be used to represent the licensing terms.
            Sometimes it is necessary to include a choice of one or more
            licenses or some combination of license identifiers. Examples:
            "LGPL-2.1-only OR MIT", "LGPL-2.1-only AND MIT", "GPL-2.0-or-later
            WITH Bison-exception-2.2".
          type: string
        comments:
          description: Comments
          type: string
      description: License information.
      id: License
      type: object
    GrafeasV1SlsaProvenanceZeroTwoSlsaCompleteness:
      id: GrafeasV1SlsaProvenanceZeroTwoSlsaCompleteness
      type: object
      description: >-
        Indicates that the builder claims certain fields in this message to be
        complete.
      properties:
        environment:
          type: boolean
        parameters:
          type: boolean
        materials:
          type: boolean
    Status:
      properties:
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              type: any
              description: Properties of the object. Contains field @type with type URL.
            type: object
          type: array
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      type: object
    AnalyzePackagesRequestV1:
      id: AnalyzePackagesRequestV1
      type: object
      description: >-
        AnalyzePackagesRequest is the request to analyze a list of packages and
        create Vulnerability Occurrences for it.
      properties:
        packages:
          type: array
          description: The packages to analyze.
          items:
            $ref: '#/components/schemas/PackageData'
        resourceUri:
          description: Required. The resource URI of the container image being scanned.
          type: string
        includeOsvData:
          description: >-
            [DEPRECATED] Whether to include OSV data in the scan. For backwards
            compatibility reasons, this field can be neither removed nor
            renamed.
          deprecated: true
          type: boolean
    Hash:
      id: Hash
      type: object
      description: Container message for hash values.
      properties:
        type:
          type: string
          description: Required. The type of hash that was performed, e.g. "SHA-256".
        value:
          description: Required. The hash value.
          format: byte
          type: string
    SlsaProvenance:
      id: SlsaProvenance
      type: object
      properties:
        recipe:
          $ref: '#/components/schemas/SlsaRecipe'
          description: >-
            Identifies the configuration used for the build. When combined with
            materials, this SHOULD fully describe the build, such that
            re-running this recipe results in bit-for-bit identical output (if
            the build is reproducible). required
        metadata:
          $ref: '#/components/schemas/SlsaMetadata'
        materials:
          description: >-
            The collection of artifacts that influenced the build including
            sources, dependencies, build tools, base images, and so on. This is
            considered to be incomplete unless metadata.completeness.materials
            is true. Unset or null is equivalent to empty.
          items:
            $ref: '#/components/schemas/Material'
          type: array
        builder:
          description: required
          $ref: '#/components/schemas/SlsaBuilder'
    CloudRepoSourceContext:
      id: CloudRepoSourceContext
      type: object
      properties:
        repoId:
          $ref: '#/components/schemas/RepoId'
          description: The ID of the repo.
        aliasContext:
          $ref: '#/components/schemas/AliasContext'
          description: An alias, which may be a branch or tag.
        revisionId:
          type: string
          description: A revision ID.
      description: >-
        A CloudRepoSourceContext denotes a particular revision in a Google Cloud
        Source Repo.
    Location:
      properties:
        cpeUri:
          type: string
          description: >-
            Deprecated. The CPE URI in [CPE
            format](https://cpe.mitre.org/specification/)
        version:
          description: Deprecated. The version installed at this location.
          $ref: '#/components/schemas/Version'
        path:
          description: >-
            The path from which we gathered that this package/version is
            installed.
          type: string
      description: >-
        An occurrence of a particular package installation found within a
        system's filesystem. E.g., glibc was found in `/var/lib/dpkg/status`.
      id: Location
      type: object
    Category:
      id: Category
      type: object
      description: The category to which the update belongs.
      properties:
        categoryId:
          description: The identifier of the category.
          type: string
        name:
          type: string
          description: The localized name of the category.
    GrafeasV1SlsaProvenanceZeroTwoSlsaBuilder:
      id: GrafeasV1SlsaProvenanceZeroTwoSlsaBuilder
      type: object
      description: >-
        Identifies the entity that executed the recipe, which is trusted to have
        correctly performed the operation and populated this provenance.
      properties:
        id:
          type: string
    ExploitPredictionScoringSystem:
      properties:
        percentile:
          format: double
          description: >-
            The percentile of the current score, the proportion of all scored
            vulnerabilities with the same or a lower EPSS score
          type: number
        score:
          format: double
          description: >-
            The EPSS score representing the probability [0-1] of exploitation in
            the wild in the next 30 days
          type: number
      id: ExploitPredictionScoringSystem
      type: object
    Layer:
      description: Layer holds metadata specific to a layer of a Docker image.
      properties:
        arguments:
          type: string
          description: The recovered arguments to the Dockerfile directive.
        directive:
          type: string
          description: >-
            Required. The recovered Dockerfile directive used to construct this
            layer. See https://docs.docker.com/engine/reference/builder/ for
            more information.
      id: Layer
      type: object
    Envelope:
      description: >-
        MUST match
        https://github.com/secure-systems-lab/dsse/blob/master/envelope.proto.
        An authenticated message of arbitrary type.
      properties:
        payload:
          type: string
          format: byte
        payloadType:
          type: string
        signatures:
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeSignature'
      id: Envelope
      type: object
    DiscoveryOccurrence:
      properties:
        analysisError:
          type: array
          description: >-
            Indicates any errors encountered during analysis of a resource.
            There could be 0 or more of these errors.
          items:
            $ref: '#/components/schemas/Status'
        archiveTime:
          description: >-
            Output only. The time occurrences related to this discovery
            occurrence were archived.
          format: google-datetime
          readOnly: true
          type: string
        lastVulnerabilityUpdateTime:
          type: string
          format: google-datetime
          description: The last time vulnerability scan results changed.
        cpe:
          description: The CPE of the resource being scanned.
          type: string
        files:
          type: array
          description: Files that make up the resource described by the occurrence.
          items:
            $ref: '#/components/schemas/File'
        continuousAnalysis:
          type: string
          description: Whether the resource is continuously analyzed.
          enumDescriptions:
            - Unknown.
            - The resource is continuously analyzed.
            - The resource is ignored for continuous analysis.
          enum:
            - CONTINUOUS_ANALYSIS_UNSPECIFIED
            - ACTIVE
            - INACTIVE
        analysisStatus:
          type: string
          description: The status of discovery for the resource.
          enumDescriptions:
            - Unknown.
            - Resource is known but no action has been taken yet.
            - Resource is being analyzed.
            - Analysis has finished successfully.
            - Analysis has completed.
            - >-
              Analysis has finished unsuccessfully, the analysis itself is in a
              bad state.
            - The resource is known not to be supported.
          enum:
            - ANALYSIS_STATUS_UNSPECIFIED
            - PENDING
            - SCANNING
            - FINISHED_SUCCESS
            - COMPLETE
            - FINISHED_FAILED
            - FINISHED_UNSUPPORTED
        analysisCompleted:
          $ref: '#/components/schemas/AnalysisCompleted'
        analysisStatusError:
          $ref: '#/components/schemas/Status'
          description: >-
            When an error is encountered this will contain a LocalizedMessage
            under details to show to the user. The LocalizedMessage is output
            only and populated by the API.
        lastScanTime:
          description: The last time this resource was scanned.
          format: google-datetime
          type: string
        sbomStatus:
          description: The status of an SBOM generation.
          $ref: '#/components/schemas/SBOMStatus'
      description: Provides information about the analysis status of a discovered resource.
      id: DiscoveryOccurrence
      type: object
    InTotoStatement:
      id: InTotoStatement
      type: object
      description: >-
        Spec defined at
        https://github.com/in-toto/attestation/tree/main/spec#statement The
        serialized InTotoStatement will be stored as Envelope.payload.
        Envelope.payloadType is always "application/vnd.in-toto+json".
      properties:
        slsaProvenanceZeroTwo:
          $ref: '#/components/schemas/SlsaProvenanceZeroTwo'
        _type:
          type: string
          description: Always `https://in-toto.io/Statement/v0.1`.
        provenance:
          $ref: '#/components/schemas/InTotoProvenance'
        subject:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
        predicateType:
          description: '`https://slsa.dev/provenance/v0.1` for SlsaProvenance.'
          type: string
        slsaProvenance:
          $ref: '#/components/schemas/SlsaProvenance'
    SBOMReferenceOccurrence:
      properties:
        payload:
          description: The actual payload that contains the SBOM reference data.
          $ref: '#/components/schemas/SbomReferenceIntotoPayload'
        payloadType:
          description: >-
            The kind of payload that SbomReferenceIntotoPayload takes. Since
            it's in the intoto format, this value is expected to be
            'application/vnd.in-toto+json'.
          type: string
        signatures:
          type: array
          description: The signatures over the payload.
          items:
            $ref: '#/components/schemas/EnvelopeSignature'
      description: >-
        The occurrence representing an SBOM reference as applied to a specific
        resource. The occurrence follows the DSSE specification. See
        https://github.com/secure-systems-lab/dsse/blob/master/envelope.md for
        more details.
      id: SBOMReferenceOccurrence
      type: object
    AnalyzePackagesResponse:
      id: AnalyzePackagesResponse
      type: object
      description: >-
        AnalyzePackagesResponse contains the information necessary to find
        results for the given scan.
      properties:
        scan:
          type: string
          description: The name of the scan resource created by this successful scan.
    GrafeasV1SlsaProvenanceZeroTwoSlsaMetadata:
      description: Other properties of the build.
      properties:
        buildInvocationId:
          type: string
        buildFinishedOn:
          type: string
          format: google-datetime
        reproducible:
          type: boolean
        buildStartedOn:
          type: string
          format: google-datetime
        completeness:
          $ref: '#/components/schemas/GrafeasV1SlsaProvenanceZeroTwoSlsaCompleteness'
      id: GrafeasV1SlsaProvenanceZeroTwoSlsaMetadata
      type: object
    Maintainer:
      properties:
        name:
          type: string
        email:
          type: string
        kind:
          type: string
        url:
          type: string
      id: Maintainer
      type: object
    InTotoProvenance:
      properties:
        recipe:
          description: >-
            Identifies the configuration used for the build. When combined with
            materials, this SHOULD fully describe the build, such that
            re-running this recipe results in bit-for-bit identical output (if
            the build is reproducible). required
          $ref: '#/components/schemas/Recipe'
        metadata:
          $ref: '#/components/schemas/Metadata'
        materials:
          type: array
          description: >-
            The collection of artifacts that influenced the build including
            sources, dependencies, build tools, base images, and so on. This is
            considered to be incomplete unless metadata.completeness.materials
            is true. Unset or null is equivalent to empty.
          items:
            type: string
        builderConfig:
          $ref: '#/components/schemas/BuilderConfig'
          description: required
      id: InTotoProvenance
      type: object
    Metadata:
      id: Metadata
      type: object
      properties:
        buildInvocationId:
          description: >-
            Identifies the particular build invocation, which can be useful for
            finding associated logs or other ad-hoc analysis. The value SHOULD
            be globally unique, per in-toto Provenance spec.
          type: string
        buildFinishedOn:
          format: google-datetime
          description: The timestamp of when the build completed.
          type: string
        reproducible:
          type: boolean
          description: >-
            If true, the builder claims that running the recipe on materials
            will produce bit-for-bit identical output.
        buildStartedOn:
          description: The timestamp of when the build started.
          format: google-datetime
          type: string
        completeness:
          description: >-
            Indicates that the builder claims certain fields in this message to
            be complete.
          $ref: '#/components/schemas/Completeness'
      description: Other properties of the build.
    NonCompliantFile:
      id: NonCompliantFile
      type: object
      properties:
        path:
          type: string
          description: Empty if `display_command` is set.
        reason:
          description: Explains why a file is non compliant for a CIS check.
          type: string
        displayCommand:
          type: string
          description: Command to display the non-compliant files.
      description: >-
        Details about files that caused a compliance check to fail.
        display_command is a single command that can be used to display a list
        of non compliant files. When there is no such command, we can also
        iterate a list of non compliant file using 'path'.
    Completeness:
      id: Completeness
      type: object
      properties:
        environment:
          description: >-
            If true, the builder claims that recipe.environment is claimed to be
            complete.
          type: boolean
        arguments:
          type: boolean
          description: >-
            If true, the builder claims that recipe.arguments is complete,
            meaning that all external inputs are properly captured in the
            recipe.
        materials:
          type: boolean
          description: >-
            If true, the builder claims that materials are complete, usually
            through some controls to prevent network access. Sometimes called
            "hermetic".
      description: >-
        Indicates that the builder claims certain fields in this message to be
        complete.
    ProvenanceBuilder:
      properties:
        id:
          type: string
        version:
          type: object
          additionalProperties:
            type: string
        builderDependencies:
          items:
            $ref: '#/components/schemas/ResourceDescriptor'
          type: array
      id: ProvenanceBuilder
      type: object
    Occurrence:
      description: An instance of an analysis type that has been found on a resource.
      properties:
        image:
          $ref: '#/components/schemas/ImageOccurrence'
          description: >-
            Describes how this resource derives from the basis in the associated
            note.
        noteName:
          type: string
          description: >-
            Required. Immutable. The analysis note associated with this
            occurrence, in the form of `projects/[PROVIDER_ID]/notes/[NOTE_ID]`.
            This field can be used as a filter in list requests.
        remediation:
          type: string
          description: A description of actions that can be taken to remedy the note.
        updateTime:
          type: string
          format: google-datetime
          description: Output only. The time this occurrence was last updated.
        aiSkillAnalysis:
          description: Describes an AI skill analysis.
          $ref: '#/components/schemas/AISkillAnalysisOccurrence'
        advisoryPublishTime:
          format: google-datetime
          description: The time this advisory was published by the source.
          type: string
        vulnerability:
          $ref: '#/components/schemas/VulnerabilityOccurrence'
          description: Describes a security vulnerability.
        secret:
          $ref: '#/components/schemas/SecretOccurrence'
          description: Describes a secret.
        attestation:
          $ref: '#/components/schemas/AttestationOccurrence'
          description: Describes an attestation of an artifact.
        envelope:
          description: https://github.com/secure-systems-lab/dsse
          $ref: '#/components/schemas/Envelope'
        resourceUri:
          description: >-
            Required. Immutable. A URI that represents the resource for which
            the occurrence applies. For example,
            `https://gcr.io/project/image@sha256:123abc` for a Docker image.
          type: string
        build:
          description: Describes a verifiable build.
          $ref: '#/components/schemas/BuildOccurrence'
        discovery:
          $ref: '#/components/schemas/DiscoveryOccurrence'
          description: Describes when a resource was discovered.
        upgrade:
          description: Describes an available package upgrade on the linked resource.
          $ref: '#/components/schemas/UpgradeOccurrence'
        name:
          description: >-
            Output only. The name of the occurrence in the form of
            `projects/[PROJECT_ID]/occurrences/[OCCURRENCE_ID]`.
          type: string
        dsseAttestation:
          $ref: '#/components/schemas/DSSEAttestationOccurrence'
          description: Describes an attestation of an artifact using dsse.
        createTime:
          format: google-datetime
          description: Output only. The time this occurrence was created.
          type: string
        sbomReference:
          $ref: '#/components/schemas/SBOMReferenceOccurrence'
          description: Describes a specific SBOM reference occurrences.
        package:
          $ref: '#/components/schemas/PackageOccurrence'
          description: Describes the installation of a package on the linked resource.
        compliance:
          description: Describes a compliance violation on a linked resource.
          $ref: '#/components/schemas/ComplianceOccurrence'
        kind:
          type: string
          enumDescriptions:
            - Default value. This value is unused.
            - The note and occurrence represent a package vulnerability.
            - The note and occurrence assert build provenance.
            - This represents an image basis relationship.
            - This represents a package installed via a package manager.
            - The note and occurrence track deployment events.
            - >-
              The note and occurrence track the initial discovery status of a
              resource.
            - This represents a logical "role" that can attest to artifacts.
            - This represents an available package upgrade.
            - This represents a Compliance Note
            - This represents a DSSE attestation Note
            - This represents a Vulnerability Assessment.
            - This represents an SBOM Reference.
            - This represents a secret.
            - This represents an AI skill analysis.
          enum:
            - NOTE_KIND_UNSPECIFIED
            - VULNERABILITY
            - BUILD
            - IMAGE
            - PACKAGE
            - DEPLOYMENT
            - DISCOVERY
            - ATTESTATION
            - UPGRADE
            - COMPLIANCE
            - DSSE_ATTESTATION
            - VULNERABILITY_ASSESSMENT
            - SBOM_REFERENCE
            - SECRET
            - AI_SKILL_ANALYSIS
          description: >-
            Output only. This explicitly denotes which of the occurrence details
            are specified. This field can be used as a filter in list requests.
        deployment:
          $ref: '#/components/schemas/DeploymentOccurrence'
          description: Describes the deployment of an artifact on a runtime.
      id: Occurrence
      type: object
    SecretStatus:
      id: SecretStatus
      type: object
      properties:
        message:
          description: Optional. Optional message about the status code.
          type: string
        status:
          type: string
          description: Optional. The status of the secret.
          enumDescriptions:
            - Unspecified
            - The status of the secret is unknown.
            - The secret is valid.
            - The secret is invalid.
          enum:
            - STATUS_UNSPECIFIED
            - UNKNOWN
            - VALID
            - INVALID
        updateTime:
          format: google-datetime
          description: Optional. The time the secret status was last updated.
          type: string
      description: The status of the secret with a timestamp.
    Risk:
      id: Risk
      type: object
      properties:
        cisaKev:
          description: >-
            CISA maintains the authoritative source of vulnerabilities that have
            been exploited in the wild.
          $ref: '#/components/schemas/CISAKnownExploitedVulnerabilities'
        epss:
          $ref: '#/components/schemas/ExploitPredictionScoringSystem'
          description: >-
            The Exploit Prediction Scoring System (EPSS) estimates the
            likelihood (probability) that a software vulnerability will be
            exploited in the wild.
    FindingLocation:
      description: Location details with file path and line number.
      properties:
        filePath:
          description: Relative path of the file containing the finding.
          type: string
        lineNumber:
          description: Line number (1-based), or 0 if whole File / unknown.
          format: int64
          type: string
      id: FindingLocation
      type: object
    DeploymentOccurrence:
      id: DeploymentOccurrence
      type: object
      properties:
        userEmail:
          type: string
          description: Identity of the user that triggered this deployment.
        undeployTime:
          format: google-datetime
          description: End of the lifetime of this deployment.
          type: string
        deployTime:
          description: Required. Beginning of the lifetime of this deployment.
          format: google-datetime
          type: string
        address:
          type: string
          description: Address of the runtime element hosting this deployment.
        config:
          description: Configuration used to create this deployment.
          type: string
        resourceUri:
          type: array
          description: >-
            Output only. Resource URI for the artifact being deployed taken from
            the deployable field with the same name.
          items:
            type: string
        platform:
          enumDescriptions:
            - Unknown.
            - Google Container Engine.
            - 'Google App Engine: Flexible Environment.'
            - Custom user-defined platform.
          enum:
            - PLATFORM_UNSPECIFIED
            - GKE
            - FLEX
            - CUSTOM
          description: Platform hosting this deployment.
          type: string
      description: The period during which some deployable was active in a runtime.
    AnalyzePackagesMetadataV1:
      description: >-
        AnalyzePackagesMetadata contains metadata for an active scan of a
        container image.
      properties:
        createTime:
          format: google-datetime
          description: When the scan was created.
          type: string
        resourceUri:
          description: The resource URI of the container image being scanned.
          type: string
      id: AnalyzePackagesMetadataV1
      type: object
    BuildOccurrence:
      properties:
        intotoProvenance:
          $ref: '#/components/schemas/InTotoProvenance'
          description: >-
            Deprecated. See InTotoStatement for the replacement. In-toto
            Provenance representation as defined in spec.
        provenance:
          description: The actual provenance for the build.
          $ref: '#/components/schemas/BuildProvenance'
        intotoStatement:
          $ref: '#/components/schemas/InTotoStatement'
          description: >-
            In-toto Statement representation as defined in spec. The
            intoto_statement can contain any type of provenance. The serialized
            payload of the statement can be stored and signed in the
            Occurrence's envelope.
        provenanceBytes:
          description: >-
            Serialized JSON representation of the provenance, used in generating
            the build signature in the corresponding build note. After verifying
            the signature, `provenance_bytes` can be unmarshalled and compared
            to the provenance to confirm that it is unchanged. A base64-encoded
            string representation of the provenance bytes is used for the
            signature in order to interoperate with openssl which expects this
            format for signature verification. The serialized form is captured
            both to avoid ambiguity in how the provenance is marshalled to json
            as well to prevent incompatibilities with future changes.
          type: string
        inTotoSlsaProvenanceV1:
          description: >-
            In-Toto Slsa Provenance V1 represents a slsa provenance meeting the
            slsa spec, wrapped in an in-toto statement. This allows for direct
            jsonification of a to-spec in-toto slsa statement with a to-spec
            slsa provenance.
          $ref: '#/components/schemas/InTotoSlsaProvenanceV1'
      description: Details of a build occurrence.
      id: BuildOccurrence
      type: object
    SourceContext:
      properties:
        labels:
          type: object
          description: Labels with user defined metadata.
          additionalProperties:
            type: string
        cloudRepo:
          description: >-
            A SourceContext referring to a revision in a Google Cloud Source
            Repo.
          $ref: '#/components/schemas/CloudRepoSourceContext'
        gerrit:
          $ref: '#/components/schemas/GerritSourceContext'
          description: A SourceContext referring to a Gerrit project.
        git:
          description: >-
            A SourceContext referring to any third party Git repo (e.g.,
            GitHub).
          $ref: '#/components/schemas/GitSourceContext'
      description: >-
        A SourceContext is a reference to a tree of files. A SourceContext
        together with a path point to a unique revision of a single file or
        directory.
      id: SourceContext
      type: object
    PackageVersion:
      id: PackageVersion
      type: object
      properties:
        version:
          type: string
        licenses:
          type: array
          description: >-
            The licenses associated with this package. Note that this has to go
            on the PackageVersion level, because we can have cases with images
            with the same source having different licences. E.g. in Alpine, musl
            and musl-utils both have the same origin musl, but have different
            sets of licenses.
          items:
            type: string
        name:
          type: string
    SBOMStatus:
      id: SBOMStatus
      type: object
      properties:
        sbomState:
          enumDescriptions:
            - Default unknown state.
            - SBOM scanning is pending.
            - SBOM scanning has completed.
          enum:
            - SBOM_STATE_UNSPECIFIED
            - PENDING
            - COMPLETE
          description: The progress of the SBOM generation.
          type: string
        error:
          description: >-
            If there was an error generating an SBOM, this will indicate what
            that error was.
          type: string
      description: The status of an SBOM generation.
    UpgradeDistribution:
      id: UpgradeDistribution
      type: object
      properties:
        classification:
          description: >-
            The operating system classification of this Upgrade, as specified by
            the upstream operating system upgrade feed. For Windows the
            classification is one of the category_ids listed at
            https://docs.microsoft.com/en-us/previous-versions/windows/desktop/ff357803(v=vs.85)
          type: string
        severity:
          description: The severity as specified by the upstream operating system.
          type: string
        cpeUri:
          type: string
          description: >-
            Required - The specific operating system this metadata applies to.
            See https://cpe.mitre.org/specification/.
        cve:
          type: array
          description: The cve tied to this Upgrade.
          items:
            type: string
      description: >-
        The Upgrade Distribution represents metadata about the Upgrade for each
        operating system (CPE). Some distributions have additional metadata
        around updates, classifying them into various categories and severities.
    ComplianceOccurrence:
      id: ComplianceOccurrence
      type: object
      properties:
        nonComplianceReason:
          type: string
        version:
          $ref: '#/components/schemas/ComplianceVersion'
          description: The OS and config version the benchmark was run on.
        nonCompliantFiles:
          items:
            $ref: '#/components/schemas/NonCompliantFile'
          type: array
      description: >-
        An indication that the compliance checks in the associated
        ComplianceNote were not satisfied for particular resources or a
        specified reason.
    SlsaRecipe:
      id: SlsaRecipe
      type: object
      properties:
        environment:
          description: >-
            Any other builder-controlled inputs necessary for correctly
            evaluating the recipe. Usually only needed for reproducing the build
            but not evaluated as part of policy. Depending on the recipe Type,
            the structure may be different.
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          type: object
        definedInMaterial:
          format: int64
          description: >-
            Index in materials containing the recipe steps that are not implied
            by recipe.type. For example, if the recipe type were "make", then
            this would point to the source containing the Makefile, not the make
            program itself. Set to -1 if the recipe doesn't come from a
            material, as zero is default unset value for int64.
          type: string
        type:
          description: >-
            URI indicating what type of recipe was performed. It determines the
            meaning of recipe.entryPoint, recipe.arguments, recipe.environment,
            and materials.
          type: string
        entryPoint:
          description: >-
            String identifying the entry point into the build. This is often a
            path to a configuration file and/or a target label within that file.
            The syntax and meaning are defined by recipe.type. For example, if
            the recipe type were "make", then this would reference the directory
            in which to run make as well as which target to use.
          type: string
        arguments:
          type: object
          description: >-
            Collection of all external inputs that influenced the build on top
            of recipe.definedInMaterial and recipe.entryPoint. For example, if
            the recipe type were "make", then this might be the flags passed to
            make aside from the target, which is captured in recipe.entryPoint.
            Depending on the recipe Type, the structure may be different.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
      description: >-
        Steps taken to build the artifact. For a TaskRun, typically each
        container corresponds to one step in the recipe.
    PackageIssue:
      properties:
        affectedCpeUri:
          type: string
          description: >-
            Required. The [CPE URI](https://cpe.mitre.org/specification/) this
            vulnerability was found in.
        affectedVersion:
          $ref: '#/components/schemas/Version'
          description: >-
            Required. The version of the package that is installed on the
            resource affected by this vulnerability.
        fixedPackage:
          description: >-
            The package this vulnerability was fixed in. It is possible for this
            to be different from the affected_package.
          type: string
        fileLocation:
          type: array
          description: The location at which this package was found.
          items:
            $ref: '#/components/schemas/GrafeasV1FileLocation'
        affectedPackage:
          type: string
          description: Required. The package this vulnerability was found in.
        fixedVersion:
          $ref: '#/components/schemas/Version'
          description: >-
            Required. The version of the package this vulnerability was fixed
            in. Setting this to VersionKind.MAXIMUM means no fix is yet
            available.
        packageType:
          type: string
          description: The type of package (e.g. OS, MAVEN, GO).
        fixAvailable:
          type: boolean
          description: Output only. Whether a fix is available for this package.
        fixedCpeUri:
          type: string
          description: >-
            The [CPE URI](https://cpe.mitre.org/specification/) this
            vulnerability was fixed in. It is possible for this to be different
            from the affected_cpe_uri.
        effectiveSeverity:
          type: string
          enum:
            - SEVERITY_UNSPECIFIED
            - MINIMAL
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
          description: >-
            Output only. The distro or language system assigned severity for
            this vulnerability when that is available and note provider assigned
            severity when it is not available.
          readOnly: true
          enumDescriptions:
            - Unknown.
            - Minimal severity.
            - Low severity.
            - Medium severity.
            - High severity.
            - Critical severity.
      description: >-
        A detail for a distro and package this vulnerability occurrence was
        found in and its associated fix (if one is available).
      id: PackageIssue
      type: object
    SlsaMetadata:
      properties:
        completeness:
          $ref: '#/components/schemas/SlsaCompleteness'
          description: >-
            Indicates that the builder claims certain fields in this message to
            be complete.
        buildStartedOn:
          type: string
          description: The timestamp of when the build started.
          format: google-datetime
        reproducible:
          type: boolean
          description: >-
            If true, the builder claims that running the recipe on materials
            will produce bit-for-bit identical output.
        buildInvocationId:
          description: >-
            Identifies the particular build invocation, which can be useful for
            finding associated logs or other ad-hoc analysis. The value SHOULD
            be globally unique, per in-toto Provenance spec.
          type: string
        buildFinishedOn:
          format: google-datetime
          description: The timestamp of when the build completed.
          type: string
      description: Other properties of the build.
      id: SlsaMetadata
      type: object
    AnalyzePackagesMetadata:
      properties:
        resourceUri:
          description: The resource URI of the container image being scanned.
          type: string
        createTime:
          type: string
          description: When the scan was created.
          format: google-datetime
      description: >-
        AnalyzePackagesMetadata contains metadata for an active scan of a
        container image.
      id: AnalyzePackagesMetadata
      type: object
    GitSourceContext:
      id: GitSourceContext
      type: object
      properties:
        url:
          description: Git repository URL.
          type: string
        revisionId:
          description: Git commit hash.
          type: string
      description: >-
        A GitSourceContext denotes a particular revision in a third party Git
        repository (e.g., GitHub).
    BuildMetadata:
      id: BuildMetadata
      type: object
      properties:
        finishedOn:
          type: string
          format: google-datetime
        invocationId:
          type: string
        startedOn:
          type: string
          format: google-datetime
    ListVulnerabilitiesResponseV1:
      id: ListVulnerabilitiesResponseV1
      type: object
      description: >-
        ListVulnerabilitiesResponse contains a single page of vulnerabilities
        resulting from a scan.
      properties:
        occurrences:
          description: The list of Vulnerability Occurrences resulting from a scan.
          items:
            $ref: '#/components/schemas/Occurrence'
          type: array
        nextPageToken:
          type: string
          description: >-
            A page token that can be used in a subsequent call to
            ListVulnerabilities to continue retrieving results.
    SbomReferenceIntotoPayload:
      id: SbomReferenceIntotoPayload
      type: object
      properties:
        _type:
          description: Identifier for the schema of the Statement.
          type: string
        predicate:
          description: >-
            Additional parameters of the Predicate. Includes the actual data
            about the SBOM.
          $ref: '#/components/schemas/SbomReferenceIntotoPredicate'
        predicateType:
          description: URI identifying the type of the Predicate.
          type: string
        subject:
          type: array
          description: >-
            Set of software artifacts that the attestation applies to. Each
            element represents a single software artifact.
          items:
            $ref: '#/components/schemas/Subject'
      description: >-
        The actual payload that contains the SBOM Reference data. The payload
        follows the intoto statement specification. See
        https://github.com/in-toto/attestation/blob/main/spec/v1.0/statement.md
        for more details.
    VexAssessment:
      properties:
        vulnerabilityId:
          description: >-
            The vulnerability identifier for this Assessment. Will hold one of
            common identifiers e.g. CVE, GHSA etc.
          type: string
        remediations:
          type: array
          description: >-
            Specifies details on how to handle (and presumably, fix) a
            vulnerability.
          items:
            $ref: '#/components/schemas/Remediation'
        justification:
          description: >-
            Justification provides the justification when the state of the
            assessment if NOT_AFFECTED.
          $ref: '#/components/schemas/Justification'
        relatedUris:
          type: array
          description: >-
            Holds a list of references associated with this vulnerability item
            and assessment.
          items:
            $ref: '#/components/schemas/RelatedUrl'
        noteName:
          type: string
          description: >-
            The VulnerabilityAssessment note from which this VexAssessment was
            generated. This will be of the form:
            `projects/[PROJECT_ID]/notes/[NOTE_ID]`.
        cve:
          type: string
          description: >-
            Holds the MITRE standard Common Vulnerabilities and Exposures (CVE)
            tracking number for the vulnerability. Deprecated: Use
            vulnerability_id instead to denote CVEs.
          deprecated: true
        state:
          type: string
          description: Provides the state of this Vulnerability assessment.
          enumDescriptions:
            - No state is specified.
            - This product is known to be affected by this vulnerability.
            - This product is known to be not affected by this vulnerability.
            - This product contains a fix for this vulnerability.
            - >-
              It is not known yet whether these versions are or are not affected
              by the vulnerability. However, it is still under investigation.
          enum:
            - STATE_UNSPECIFIED
            - AFFECTED
            - NOT_AFFECTED
            - FIXED
            - UNDER_INVESTIGATION
        impacts:
          description: >-
            Contains information about the impact of this vulnerability, this
            will change with time.
          items:
            type: string
          type: array
      description: >-
        VexAssessment provides all publisher provided Vex information that is
        related to this vulnerability.
      id: VexAssessment
      type: object
    Fingerprint:
      description: A set of properties that uniquely identify a given Docker image.
      properties:
        v2Blob:
          type: array
          description: Required. The ordered list of v2 blobs that represent a given image.
          items:
            type: string
        v1Name:
          type: string
          description: >-
            Required. The layer ID of the final layer in the Docker image's v1
            representation.
        v2Name:
          description: >-
            Output only. The name of the image's v2 blobs computed via: [bottom]
            := v2_blobbottom := sha256(v2_blob[N] + " " + v2_name[N+1]) Only the
            name of the final blob is kept.
          type: string
      id: Fingerprint
      type: object
    Identity:
      description: The unique identifier of the update.
      properties:
        updateId:
          description: The revision independent identifier of the update.
          type: string
        revision:
          description: The revision number of the update.
          format: int32
          type: integer
      id: Identity
      type: object
    Version:
      id: Version
      type: object
      description: Version contains structured information about the version of a package.
      properties:
        inclusive:
          description: >-
            Whether this version is specifying part of an inclusive range.
            Grafeas does not have the capability to specify version ranges;
            instead we have fields that specify start version and end versions.
            At times this is insufficient - we also need to specify whether the
            version is included in the range or is excluded from the range. This
            boolean is expected to be set to true when the version is included
            in a range.
          type: boolean
        revision:
          description: The iteration of the package build from the above version.
          type: string
        epoch:
          format: int32
          description: Used to correct mistakes in the version numbering scheme.
          type: integer
        name:
          type: string
          description: >-
            Required only when version kind is NORMAL. The main part of the
            version name.
        kind:
          type: string
          enumDescriptions:
            - Unknown.
            - A standard package version.
            - A special version representing negative infinity.
            - A special version representing positive infinity.
          enum:
            - VERSION_KIND_UNSPECIFIED
            - NORMAL
            - MINIMUM
            - MAXIMUM
          description: >-
            Required. Distinguishes between sentinel MIN/MAX versions and normal
            versions.
        fullName:
          description: >-
            Human readable version string. This string is of the form :- and is
            only set when kind is NORMAL.
          type: string
    BaseImage:
      id: BaseImage
      type: object
      description: BaseImage describes a base image of a container image.
      properties:
        repository:
          type: string
          description: The repository name in which the base image is from.
        layerCount:
          type: integer
          description: The number of layers that the base image is composed of.
          format: int32
        registry:
          description: The registry in which the base image is from.
          type: string
        name:
          description: The name of the base image.
          type: string
    AttestationOccurrence:
      id: AttestationOccurrence
      type: object
      properties:
        signatures:
          description: >-
            One or more signatures over `serialized_payload`. Verifier
            implementations should consider this attestation message verified if
            at least one `signature` verifies `serialized_payload`. See
            `Signature` in common.proto for more details on signature structure
            and verification.
          items:
            $ref: '#/components/schemas/Signature'
          type: array
        serializedPayload:
          type: string
          description: >-
            Required. The serialized payload that is verified by one or more
            `signatures`.
          format: byte
        jwts:
          description: >-
            One or more JWTs encoding a self-contained attestation. Each JWT
            encodes the payload that it verifies within the JWT itself. Verifier
            implementation SHOULD ignore the `serialized_payload` field when
            verifying these JWTs. If only JWTs are present on this
            AttestationOccurrence, then the `serialized_payload` SHOULD be left
            empty. Each JWT SHOULD encode a claim specific to the `resource_uri`
            of this Occurrence, but this is not validated by Grafeas metadata
            API implementations. The JWT itself is opaque to Grafeas.
          items:
            $ref: '#/components/schemas/Jwt'
          type: array
      description: >-
        Occurrence that represents a single "attestation". The authenticity of
        an attestation can be verified using the attached signature. If the
        verifier trusts the public key of the signer, then verifying the
        signature is sufficient to establish trust. In this circumstance, the
        authority to which this attestation is attached is primarily useful for
        lookup (how to find this attestation if you already know the authority
        and artifact to be verified) and intent (for which authority this
        attestation was intended to sign.
    EnvelopeSignature:
      properties:
        sig:
          type: string
          format: byte
        keyid:
          type: string
      id: EnvelopeSignature
      type: object
    Recipe:
      id: Recipe
      type: object
      properties:
        entryPoint:
          type: string
          description: >-
            String identifying the entry point into the build. This is often a
            path to a configuration file and/or a target label within that file.
            The syntax and meaning are defined by recipe.type. For example, if
            the recipe type were "make", then this would reference the directory
            in which to run make as well as which target to use.
        arguments:
          description: >-
            Collection of all external inputs that influenced the build on top
            of recipe.definedInMaterial and recipe.entryPoint. For example, if
            the recipe type were "make", then this might be the flags passed to
            make aside from the target, which is captured in recipe.entryPoint.
            Since the arguments field can greatly vary in structure, depending
            on the builder and recipe type, this is of form "Any".
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        definedInMaterial:
          format: int64
          description: >-
            Index in materials containing the recipe steps that are not implied
            by recipe.type. For example, if the recipe type were "make", then
            this would point to the source containing the Makefile, not the make
            program itself. Set to -1 if the recipe doesn't come from a
            material, as zero is default unset value for int64.
          type: string
        type:
          type: string
          description: >-
            URI indicating what type of recipe was performed. It determines the
            meaning of recipe.entryPoint, recipe.arguments, recipe.environment,
            and materials.
        environment:
          type: array
          description: >-
            Any other builder-controlled inputs necessary for correctly
            evaluating the recipe. Usually only needed for reproducing the build
            but not evaluated as part of policy. Since the environment field can
            greatly vary in structure, depending on the builder and recipe type,
            this is of form "Any".
          items:
            type: object
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
      description: >-
        Steps taken to build the artifact. For a TaskRun, typically each
        container corresponds to one step in the recipe.
    AliasContext:
      id: AliasContext
      type: object
      description: An alias to a repo revision.
      properties:
        kind:
          enumDescriptions:
            - Unknown.
            - Git tag.
            - Git branch.
            - >-
              Used to specify non-standard aliases. For example, if a Git repo
              has a ref named "refs/foo/bar".
          enum:
            - KIND_UNSPECIFIED
            - FIXED
            - MOVABLE
            - OTHER
          description: The alias kind.
          type: string
        name:
          type: string
          description: The alias name.
    RelatedUrl:
      id: RelatedUrl
      type: object
      description: Metadata for any related URL information.
      properties:
        url:
          description: Specific URL associated with the resource.
          type: string
        label:
          description: Label to describe usage of the URL.
          type: string
    SlsaCompleteness:
      id: SlsaCompleteness
      type: object
      description: >-
        Indicates that the builder claims certain fields in this message to be
        complete.
      properties:
        environment:
          type: boolean
          description: >-
            If true, the builder claims that recipe.environment is claimed to be
            complete.
        arguments:
          type: boolean
          description: >-
            If true, the builder claims that recipe.arguments is complete,
            meaning that all external inputs are properly captured in the
            recipe.
        materials:
          type: boolean
          description: >-
            If true, the builder claims that materials are complete, usually
            through some controls to prevent network access. Sometimes called
            "hermetic".
    ResourceDescriptor:
      id: ResourceDescriptor
      type: object
      properties:
        annotations:
          additionalProperties:
            type: any
          type: object
        uri:
          type: string
        content:
          type: string
          format: byte
        downloadLocation:
          type: string
        mediaType:
          type: string
        name:
          type: string
        digest:
          additionalProperties:
            type: string
          type: object
    Command:
      id: Command
      type: object
      properties:
        name:
          description: >-
            Required. Name of the command, as presented on the command line, or
            if the command is packaged as a Docker container, as presented to
            `docker pull`.
          type: string
        env:
          type: array
          description: Environment variables set before running this command.
          items:
            type: string
        dir:
          type: string
          description: >-
            Working directory (relative to project source root) used when
            running this command.
        waitFor:
          type: array
          description: The ID(s) of the command(s) that this command depends on.
          items:
            type: string
        args:
          description: Command-line arguments used when executing this command.
          items:
            type: string
          type: array
        id:
          type: string
          description: >-
            Optional unique identifier for this command, used in wait_for to
            reference this command as a dependency.
      description: Command describes a step performed as part of the build pipeline.
    Subject:
      properties:
        name:
          type: string
        digest:
          description: >-
            `"": ""` Algorithms can be e.g. sha256, sha512 See
            https://github.com/in-toto/attestation/blob/main/spec/field_types.md#DigestSet
          additionalProperties:
            type: string
          type: object
      id: Subject
      type: object
    Operation:
      id: Operation
      type: object
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      properties:
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        metadata:
          type: object
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        done:
          type: boolean
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
        response:
          type: object
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
    AnalyzePackagesResponseV1:
      id: AnalyzePackagesResponseV1
      type: object
      properties:
        scan:
          type: string
          description: The name of the scan resource created by this successful scan.
      description: >-
        AnalyzePackagesResponse contains the information necessary to find
        results for the given scan.
    Remediation:
      id: Remediation
      type: object
      properties:
        remediationUri:
          $ref: '#/components/schemas/RelatedUrl'
          description: Contains the URL where to obtain the remediation.
        details:
          description: >-
            Contains a comprehensive human-readable discussion of the
            remediation.
          type: string
        remediationType:
          type: string
          description: The type of remediation that can be applied.
          enumDescriptions:
            - No remediation type specified.
            - A MITIGATION is available.
            - No fix is planned.
            - Not available.
            - A vendor fix is available.
            - A workaround is available.
          enum:
            - REMEDIATION_TYPE_UNSPECIFIED
            - MITIGATION
            - NO_FIX_PLANNED
            - NONE_AVAILABLE
            - VENDOR_FIX
            - WORKAROUND
      description: >-
        Specifies details on how to handle (and presumably, fix) a
        vulnerability.
    CVSS:
      id: CVSS
      type: object
      properties:
        vulnerableSystemConfidentialityImpact:
          type: string
          description: Vulnerable System Confidentiality Impact (VC). Defined in CVSS v4.
          enumDescriptions:
            - Unspecified.
            - High impact (H). Defined in CVSS v3, v4.
            - Low impact (L). Defined in CVSS v3, v4.
            - No impact (N). Defined in CVSS v2, v3, v4.
            - Partial impact (P). Defined in CVSS v2.
            - Complete impact (C). Defined in CVSS v2.
          enum:
            - IMPACT_UNSPECIFIED
            - IMPACT_HIGH
            - IMPACT_LOW
            - IMPACT_NONE
            - IMPACT_PARTIAL
            - IMPACT_COMPLETE
        authentication:
          type: string
          enumDescriptions:
            - Unspecified.
            - Multiple authentication required (Au:M). Defined in CVSS v2.
            - Single authentication required (Au:S). Defined in CVSS v2.
            - No authentication required (Au:N). Defined in CVSS v2.
          enum:
            - AUTHENTICATION_UNSPECIFIED
            - AUTHENTICATION_MULTIPLE
            - AUTHENTICATION_SINGLE
            - AUTHENTICATION_NONE
          description: Authentication (Au). Defined in CVSS v2.
        subsequentSystemAvailabilityImpact:
          type: string
          enumDescriptions:
            - Unspecified.
            - High impact (H). Defined in CVSS v3, v4.
            - Low impact (L). Defined in CVSS v3, v4.
            - No impact (N). Defined in CVSS v2, v3, v4.
            - Partial impact (P). Defined in CVSS v2.
            - Complete impact (C). Defined in CVSS v2.
          enum:
            - IMPACT_UNSPECIFIED
            - IMPACT_HIGH
            - IMPACT_LOW
            - IMPACT_NONE
            - IMPACT_PARTIAL
            - IMPACT_COMPLETE
          description: Subsequent System Availability Impact (SA). Defined in CVSS v4.
        attackRequirements:
          description: Attack Requirements (AT). Defined in CVSS v4.
          enumDescriptions:
            - Unspecified.
            - No attack requirements (AT:N). Defined in CVSS v4.
            - 'Attack requirements: Present (AT:P). Defined in CVSS v4.'
          enum:
            - ATTACK_REQUIREMENTS_UNSPECIFIED
            - ATTACK_REQUIREMENTS_NONE
            - ATTACK_REQUIREMENTS_PRESENT
          type: string
        vulnerableSystemIntegrityImpact:
          type: string
          description: Vulnerable System Integrity Impact (VI). Defined in CVSS v4.
          enumDescriptions:
            - Unspecified.
            - High impact (H). Defined in CVSS v3, v4.
            - Low impact (L). Defined in CVSS v3, v4.
            - No impact (N). Defined in CVSS v2, v3, v4.
            - Partial impact (P). Defined in CVSS v2.
            - Complete impact (C). Defined in CVSS v2.
          enum:
            - IMPACT_UNSPECIFIED
            - IMPACT_HIGH
            - IMPACT_LOW
            - IMPACT_NONE
            - IMPACT_PARTIAL
            - IMPACT_COMPLETE
        subsequentSystemConfidentialityImpact:
          type: string
          description: Subsequent System Confidentiality Impact (SC). Defined in CVSS v4.
          enumDescriptions:
            - Unspecified.
            - High impact (H). Defined in CVSS v3, v4.
            - Low impact (L). Defined in CVSS v3, v4.
            - No impact (N). Defined in CVSS v2, v3, v4.
            - Partial impact (P). Defined in CVSS v2.
            - Complete impact (C). Defined in CVSS v2.
          enum:
            - IMPACT_UNSPECIFIED
            - IMPACT_HIGH
            - IMPACT_LOW
            - IMPACT_NONE
            - IMPACT_PARTIAL
            - IMPACT_COMPLETE
        baseScore:
          type: number
          description: The base score is a function of the base metric scores.
          format: float
        attackVector:
          type: string
          description: Attack Vector (AV). Defined in CVSS v2, v3, v4.
          enumDescriptions:
            - Unspecified.
            - 'Attack Vector: Network (AV:N). Defined in CVSS v2, v3, v4.'
            - 'Attack Vector: Adjacent (AV:A). Defined in CVSS v2, v3, v4.'
            - 'Attack Vector: Local (AV:L). Defined in CVSS v2, v3, v4.'
            - 'Attack Vector: Physical (AV:P). Defined in CVSS v3, v4.'
          enum:
            - ATTACK_VECTOR_UNSPECIFIED
            - ATTACK_VECTOR_NETWORK
            - ATTACK_VECTOR_ADJACENT
            - ATTACK_VECTOR_LOCAL
            - ATTACK_VECTOR_PHYSICAL
        availabilityImpact:
          type: string
          enumDescriptions:
            - Unspecified.
            - High impact (H). Defined in CVSS v3, v4.
            - Low impact (L). Defined in CVSS v3, v4.
            - No impact (N). Defined in CVSS v2, v3, v4.
            - Partial impact (P). Defined in CVSS v2.
            - Complete impact (C). Defined in CVSS v2.
          enum:
            - IMPACT_UNSPECIFIED
            - IMPACT_HIGH
            - IMPACT_LOW
            - IMPACT_NONE
            - IMPACT_PARTIAL
            - IMPACT_COMPLETE
          description: Availability Impact (A). Defined in CVSS v2, v3.
        attackComplexity:
          description: Attack Complexity (AC). Defined in CVSS v2, v3, v4.
          enumDescriptions:
            - Unspecified.
            - Low attack complexity (AC:L). Defined in CVSS v2, v3, v4.
            - High attack complexity (AC:H). Defined in CVSS v2, v3, v4.
            - Medium attack complexity (AC:M). Defined in CVSS v2.
          enum:
            - ATTACK_COMPLEXITY_UNSPECIFIED
            - ATTACK_COMPLEXITY_LOW
            - ATTACK_COMPLEXITY_HIGH
            - ATTACK_COMPLEXITY_MEDIUM
          type: string
        exploitMaturity:
          type: string
          description: Exploit Maturity (E). Defined in CVSS v4.
          enumDescriptions:
            - Unspecified.
            - 'Exploit maturity: Not defined (E:X). Defined in CVSS v4.'
            - 'Exploit maturity: Attacked (E:A). Defined in CVSS v4.'
            - 'Exploit maturity: Proof-of-concept (E:P). Defined in CVSS v4.'
            - 'Exploit maturity: Unreported (E:U). Defined in CVSS v4.'
          enum:
            - EXPLOIT_MATURITY_UNSPECIFIED
            - EXPLOIT_MATURITY_NOT_DEFINED
            - EXPLOIT_MATURITY_ATTACKED
            - EXPLOIT_MATURITY_POC
            - EXPLOIT_MATURITY_UNREPORTED
        privilegesRequired:
          type: string
          description: Privileges Required (PR). Defined in CVSS v3, v4.
          enumDescriptions:
            - Unspecified.
            - No privileges required (PR:N). Defined in CVSS v3, v4.
            - Low privileges required (PR:L). Defined in CVSS v3, v4.
            - High privileges required (PR:H). Defined in CVSS v3, v4.
          enum:
            - PRIVILEGES_REQUIRED_UNSPECIFIED
            - PRIVILEGES_REQUIRED_NONE
            - PRIVILEGES_REQUIRED_LOW
            - PRIVILEGES_REQUIRED_HIGH
        confidentialityImpact:
          enumDescriptions:
            - Unspecified.
            - High impact (H). Defined in CVSS v3, v4.
            - Low impact (L). Defined in CVSS v3, v4.
            - No impact (N). Defined in CVSS v2, v3, v4.
            - Partial impact (P). Defined in CVSS v2.
            - Complete impact (C). Defined in CVSS v2.
          enum:
            - IMPACT_UNSPECIFIED
            - IMPACT_HIGH
            - IMPACT_LOW
            - IMPACT_NONE
            - IMPACT_PARTIAL
            - IMPACT_COMPLETE
          description: Confidentiality Impact (C). Defined in CVSS v2, v3.
          type: string
        vulnerableSystemAvailabilityImpact:
          description: Vulnerable System Availability Impact (VA). Defined in CVSS v4.
          enumDescriptions:
            - Unspecified.
            - High impact (H). Defined in CVSS v3, v4.
            - Low impact (L). Defined in CVSS v3, v4.
            - No impact (N). Defined in CVSS v2, v3, v4.
            - Partial impact (P). Defined in CVSS v2.
            - Complete impact (C). Defined in CVSS v2.
          enum:
            - IMPACT_UNSPECIFIED
            - IMPACT_HIGH
            - IMPACT_LOW
            - IMPACT_NONE
            - IMPACT_PARTIAL
            - IMPACT_COMPLETE
          type: string
        exploitabilityScore:
          type: number
          format: float
        userInteraction:
          description: User Interaction (UI). Defined in CVSS v3, v4.
          enumDescriptions:
            - Unspecified.
            - No user interaction required (UI:N). Defined in CVSS v3, v4.
            - User interaction required (UI:R). Defined in CVSS v3.
            - Passive user interaction required (UI:P). Defined in CVSS v4.
            - Active user interaction required (UI:A). Defined in CVSS v4.
          enum:
            - USER_INTERACTION_UNSPECIFIED
            - USER_INTERACTION_NONE
            - USER_INTERACTION_REQUIRED
            - USER_INTERACTION_PASSIVE
            - USER_INTERACTION_ACTIVE
          type: string
        impactScore:
          type: number
          format: float
        integrityImpact:
          description: Integrity Impact (I). Defined in CVSS v2, v3.
          enumDescriptions:
            - Unspecified.
            - High impact (H). Defined in CVSS v3, v4.
            - Low impact (L). Defined in CVSS v3, v4.
            - No impact (N). Defined in CVSS v2, v3, v4.
            - Partial impact (P). Defined in CVSS v2.
            - Complete impact (C). Defined in CVSS v2.
          enum:
            - IMPACT_UNSPECIFIED
            - IMPACT_HIGH
            - IMPACT_LOW
            - IMPACT_NONE
            - IMPACT_PARTIAL
            - IMPACT_COMPLETE
          type: string
        subsequentSystemIntegrityImpact:
          description: Subsequent System Integrity Impact (SI). Defined in CVSS v4.
          enumDescriptions:
            - Unspecified.
            - High impact (H). Defined in CVSS v3, v4.
            - Low impact (L). Defined in CVSS v3, v4.
            - No impact (N). Defined in CVSS v2, v3, v4.
            - Partial impact (P). Defined in CVSS v2.
            - Complete impact (C). Defined in CVSS v2.
          enum:
            - IMPACT_UNSPECIFIED
            - IMPACT_HIGH
            - IMPACT_LOW
            - IMPACT_NONE
            - IMPACT_PARTIAL
            - IMPACT_COMPLETE
          type: string
        scope:
          type: string
          enumDescriptions:
            - Unspecified.
            - 'Scope: Unchanged (S:U). Defined in CVSS v3.'
            - 'Scope: Changed (S:C). Defined in CVSS v3.'
          enum:
            - SCOPE_UNSPECIFIED
            - SCOPE_UNCHANGED
            - SCOPE_CHANGED
          description: Scope (S). Defined in CVSS v3.
      description: >-
        Common Vulnerability Scoring System. For details, see
        https://www.first.org/cvss/specification-document This is a message we
        will try to use for storing various versions of CVSS rather than making
        a separate proto for storing a specific version.
    InTotoSlsaProvenanceV1:
      id: InTotoSlsaProvenanceV1
      type: object
      properties:
        subject:
          items:
            $ref: '#/components/schemas/Subject'
          type: array
        predicateType:
          type: string
        _type:
          description: >-
            InToto spec defined at
            https://github.com/in-toto/attestation/tree/main/spec#statement
          type: string
        predicate:
          $ref: '#/components/schemas/SlsaProvenanceV1'
    DSSEAttestationOccurrence:
      properties:
        statement:
          $ref: '#/components/schemas/InTotoStatement'
        envelope:
          description: >-
            If doing something security critical, make sure to verify the
            signatures in this metadata.
          $ref: '#/components/schemas/Envelope'
      description: >-
        Deprecated. Prefer to use a regular Occurrence, and populate the
        Envelope at the top level of the Occurrence.
      id: DSSEAttestationOccurrence
      type: object
    PackageData:
      properties:
        cpeUri:
          type: string
          description: >-
            The cpe_uri in [cpe format] (https://cpe.mitre.org/specification/)
            in which the vulnerability may manifest. Examples include distro or
            storage location for vulnerable jar.
        fileLocation:
          description: The path to the jar file / go binary file.
          items:
            $ref: '#/components/schemas/FileLocation'
          type: array
        dependencyChain:
          type: array
          description: >-
            The dependency chain between this package and the user's artifact.
            List in order from the customer's package under review first, to the
            current package last. Inclusive of the original package and the
            current package.
          items:
            $ref: '#/components/schemas/LanguagePackageDependency'
        maintainer:
          description: The maintainer of the package.
          $ref: '#/components/schemas/Maintainer'
        binaryVersion:
          description: DEPRECATED
          $ref: '#/components/schemas/PackageVersion'
        unused:
          type: string
        hashDigest:
          description: >-
            HashDigest stores the SHA512 hash digest of the jar file if the
            package is of type Maven. This field will be unset for non Maven
            packages.
          type: string
        version:
          type: string
          description: The version of the package being analysed
        os:
          type: string
          description: >-
            The OS affected by a vulnerability Used to generate the cpe_uri for
            OS packages
        ingestionSources:
          type: array
          description: >-
            The list of sources that were scanned to find this package. This can
            be a Docker image, an SBOM attachment, or both, for example.
          items:
            $ref: '#/components/schemas/IngestionSource'
        architecture:
          description: The architecture of the package.
          type: string
        osVersion:
          description: The version of the OS Used to generate the cpe_uri for OS packages
          type: string
        binarySourceInfo:
          type: array
          description: A bundle containing the binary and source information.
          items:
            $ref: '#/components/schemas/BinarySourceInfo'
        package:
          type: string
          description: The package being analysed for vulnerabilities
        licenses:
          description: >-
            The list of licenses found that are related to a given package. Note
            that licenses may also be stored on the BinarySourceInfo. If there
            is no BinarySourceInfo (because there's no concept of source vs
            binary), then it will be stored here, while if there are
            BinarySourceInfos, it will be stored there, as one source can have
            multiple binaries with different licenses.
          items:
            type: string
          type: array
        layerDetails:
          $ref: '#/components/schemas/LayerDetails'
        sourceVersion:
          $ref: '#/components/schemas/PackageVersion'
          description: DEPRECATED
        packageType:
          type: string
          description: 'The type of package: os, maven, go, etc.'
          enumDescriptions:
            - ''
            - Operating System
            - Java packages from Maven.
            - Go third-party packages.
            - Go toolchain + standard library packages.
            - Python packages.
            - NPM packages.
            - Nuget (C#/.NET) packages.
            - Ruby packges (from RubyGems package manager).
            - Rust packages from Cargo (GitHub ecosystem is `RUST`).
            - PHP packages from Composer package manager.
            - Swift packages from Swift Package Manager (SwiftPM).
          enum:
            - PACKAGE_TYPE_UNSPECIFIED
            - OS
            - MAVEN
            - GO
            - GO_STDLIB
            - PYPI
            - NPM
            - NUGET
            - RUBYGEMS
            - RUST
            - COMPOSER
            - SWIFT
        patchedCve:
          type: array
          description: CVEs that this package is no longer vulnerable to
          items:
            type: string
      id: PackageData
      type: object
    VulnerabilityOccurrence:
      description: An occurrence of a severity vulnerability on a resource.
      properties:
        vexAssessment:
          $ref: '#/components/schemas/VexAssessment'
        cvssScore:
          type: number
          format: float
          description: >-
            Output only. The CVSS score of this vulnerability. CVSS score is on
            a scale of 0 - 10 where 0 indicates low severity and 10 indicates
            high severity.
        risk:
          $ref: '#/components/schemas/Risk'
          description: Risk information about the vulnerability, such as CISA, EPSS, etc.
        longDescription:
          type: string
          description: Output only. A detailed description of this vulnerability.
        relatedUrls:
          type: array
          description: Output only. URLs related to this vulnerability.
          items:
            $ref: '#/components/schemas/RelatedUrl'
        fixAvailable:
          description: >-
            Output only. Whether at least one of the affected packages has a fix
            available.
          type: boolean
        cvssVersion:
          description: Output only. CVSS version used to populate cvss_score and severity.
          enumDescriptions:
            - Unspecified.
            - CVSS v2.
            - CVSS v3.
            - CVSS v4.
          enum:
            - CVSS_VERSION_UNSPECIFIED
            - CVSS_VERSION_2
            - CVSS_VERSION_3
            - CVSS_VERSION_4
          type: string
        cvssV2:
          $ref: '#/components/schemas/CVSS'
          description: The cvss v2 score for the vulnerability.
        cvssv3:
          $ref: '#/components/schemas/CVSS'
          description: The cvss v3 score for the vulnerability.
        extraDetails:
          type: string
          description: Occurrence-specific extra details about the vulnerability.
        cvssV4:
          description: The cvss v4 score for the vulnerability.
          $ref: '#/components/schemas/CVSS'
        severity:
          description: >-
            Output only. The note provider assigned severity of this
            vulnerability.
          enumDescriptions:
            - Unknown.
            - Minimal severity.
            - Low severity.
            - Medium severity.
            - High severity.
            - Critical severity.
          enum:
            - SEVERITY_UNSPECIFIED
            - MINIMAL
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
          type: string
        shortDescription:
          description: Output only. A one sentence description of this vulnerability.
          type: string
        packageIssue:
          type: array
          description: >-
            Required. The set of affected locations and their fixes (if
            available) within the associated resource.
          items:
            $ref: '#/components/schemas/PackageIssue'
        type:
          type: string
          description: >-
            The type of package; whether native or non native (e.g., ruby gems,
            node.js packages, etc.).
        effectiveSeverity:
          type: string
          enumDescriptions:
            - Unknown.
            - Minimal severity.
            - Low severity.
            - Medium severity.
            - High severity.
            - Critical severity.
          enum:
            - SEVERITY_UNSPECIFIED
            - MINIMAL
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
          description: >-
            The distro assigned severity for this vulnerability when it is
            available, otherwise this is the note provider assigned severity.
            When there are multiple PackageIssues for this vulnerability, they
            can have different effective severities because some might be
            provided by the distro while others are provided by the language
            ecosystem for a language pack. For this reason, it is advised to use
            the effective severity on the PackageIssue level. In the case where
            multiple PackageIssues have differing effective severities, this
            field should be the highest severity for any of the PackageIssues.
      id: VulnerabilityOccurrence
      type: object
    GrafeasV1BaseImage:
      properties:
        repository:
          description: The repository name in which the base image is from.
          type: string
        layerCount:
