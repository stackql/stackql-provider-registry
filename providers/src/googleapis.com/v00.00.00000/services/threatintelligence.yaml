components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    Alert:
      description: >-
        Stateful object representing a group of Findings. Key feature to an
        Alert is that it expresses the user's intent towards the findings of
        that group, even those that haven't occurred yet.
      id: Alert
      properties:
        aiSummary:
          description: Optional. AI summary of the alert.
          type: string
        audit:
          $ref: '#/components/schemas/Audit'
          description: Output only. Audit information for the alert.
          readOnly: true
        configurations:
          description: >-
            Output only. The resource names of the Configurations bound to this
            alert. Format: projects/{project}/configurations/{configuration}
          items:
            type: string
          readOnly: true
          type: array
        detail:
          $ref: '#/components/schemas/AlertDetail'
          description: >-
            Output only. Details object for the alert, not all alerts will have
            a details object.
          readOnly: true
        displayName:
          description: Output only. A short title for the alert.
          readOnly: true
          type: string
        duplicateOf:
          description: >-
            Output only. alert name of the alert this alert is a duplicate of.
            Format: projects/{project}/alerts/{alert}
          readOnly: true
          type: string
        duplicatedBy:
          description: >-
            Output only. alert names of the alerts that are duplicates of this
            alert. Format: projects/{project}/alerts/{alert}
          items:
            type: string
          readOnly: true
          type: array
        etag:
          description: >-
            Optional. If included when updating an alert, this should be set to
            the current etag of the alert. If the etags do not match, the update
            will be rejected and an ABORTED error will be returned.
          type: string
        externalId:
          description: >-
            Output only. External ID for the alert. This is used internally to
            provide protection against out of order updates.
          readOnly: true
          type: string
        findingCount:
          description: Output only. The number of findings associated with this alert.
          format: int64
          readOnly: true
          type: string
        findings:
          description: Output only. Findings that are covered by this alert.
          items:
            type: string
          readOnly: true
          type: array
        name:
          description: >-
            Identifier. Server generated name for the alert. format is
            projects/{project}/alerts/{alert}
          type: string
        priorityAnalysis:
          $ref: '#/components/schemas/PriorityAnalysis'
          description: Output only. High-Precision Priority Analysis for the alert.
          readOnly: true
        relevanceAnalysis:
          $ref: '#/components/schemas/RelevanceAnalysis'
          description: >-
            Output only. High-Precision Relevance Analysis verdict for the
            alert.
          readOnly: true
        severityAnalysis:
          $ref: '#/components/schemas/SeverityAnalysis'
          description: Output only. High-Precision Severity Analysis for the alert.
          readOnly: true
        state:
          description: Output only. State of the alert.
          enum:
            - STATE_UNSPECIFIED
            - NEW
            - READ
            - TRIAGED
            - ESCALATED
            - RESOLVED
            - DUPLICATE
            - FALSE_POSITIVE
            - NOT_ACTIONABLE
            - BENIGN
            - TRACKED_EXTERNALLY
          enumDescriptions:
            - Default value, should never be set.
            - alert is new.
            - alert was read by a human.
            - alert has been triaged.
            - alert has been escalated.
            - alert has been resolved.
            - alert is a duplicate of another alert.
            - alert is a false positive and should be ignored.
            - alert is not actionable.
            - alert is benign.
            - alert is tracked externally.
          readOnly: true
          type: string
      type: object
    AlertDetail:
      description: Container for different types of alert details.
      id: AlertDetail
      properties:
        dataLeak:
          $ref: '#/components/schemas/DataLeakAlertDetail'
          description: Data Leak alert detail type.
        detailType:
          description: >-
            Output only. Name of the detail type. Will be set by the server
            during creation to the name of the field that is set in the detail
            union.
          readOnly: true
          type: string
        initialAccessBroker:
          $ref: '#/components/schemas/InitialAccessBrokerAlertDetail'
          description: Initial Access Broker alert detail type.
        insiderThreat:
          $ref: '#/components/schemas/InsiderThreatAlertDetail'
          description: Insider Threat alert detail type.
        targetTechnology:
          $ref: '#/components/schemas/TargetTechnologyAlertDetail'
          description: Technology Watchlist alert detail type.
      type: object
    AlertDocument:
      description: A document that is associated with an alert.
      id: AlertDocument
      properties:
        aiSummary:
          description: Output only. AI summary of the document.
          readOnly: true
          type: string
        author:
          description: Output only. The author of the document.
          readOnly: true
          type: string
        collectionTime:
          description: Output only. Time when the origin source collected the intel.
          format: google-datetime
          readOnly: true
          type: string
        content:
          description: Output only. The content of the document.
          readOnly: true
          type: string
        createTime:
          description: >-
            Output only. The timestamp of the original external publication of
            the document.
          format: google-datetime
          readOnly: true
          type: string
        ingestTime:
          description: Output only. Time when GTI received the intel.
          format: google-datetime
          readOnly: true
          type: string
        languageCode:
          description: Output only. The language code of the document.
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. Server generated name for the alert document. format is
            projects/{project}/alerts/{alert}/documents/{document}
          type: string
        source:
          description: Output only. Source of the intel item, e.g. DarkMarket.
          readOnly: true
          type: string
        sourceUpdateTime:
          description: Output only. Time when the intel was last updated by the source.
          format: google-datetime
          readOnly: true
          type: string
        sourceUri:
          description: Output only. URI of the intel item from the source.
          readOnly: true
          type: string
        title:
          description: Output only. The title of the document, if available.
          readOnly: true
          type: string
        translation:
          $ref: '#/components/schemas/AlertDocumentTranslation'
          description: Output only. The translation of the document, if available.
          readOnly: true
      type: object
    AlertDocumentTranslation:
      description: The translation of an alert document.
      id: AlertDocumentTranslation
      properties:
        translatedContent:
          description: Output only. The translated content of the document.
          readOnly: true
          type: string
        translatedTitle:
          description: Output only. The translated title of the document.
          readOnly: true
          type: string
      type: object
    Association:
      description: Represents an association with a vulnerability.
      id: Association
      properties:
        id:
          description: Required. The ID of the association.
          type: string
        type:
          description: Required. The type of the association.
          enum:
            - THREAT_INTEL_OBJECT_TYPE_UNSPECIFIED
            - THREAT_INTEL_OBJECT_TYPE_THREAT_ACTOR
            - THREAT_INTEL_OBJECT_TYPE_MALWARE
            - THREAT_INTEL_OBJECT_TYPE_REPORT
            - THREAT_INTEL_OBJECT_TYPE_CAMPAIGN
            - THREAT_INTEL_OBJECT_TYPE_IOC_COLLECTION
            - THREAT_INTEL_OBJECT_TYPE_SOFTWARE_AND_TOOLKITS
            - THREAT_INTEL_OBJECT_TYPE_VULNERABILITY
          enumDescriptions:
            - Unspecified object type.
            - Threat actor object type.
            - Malware object type.
            - Report object type.
            - Campaign object type.
            - IoC Collection object type.
            - Software and toolkits object type.
            - Vulnerability object type.
          type: string
      type: object
    Audit:
      description: Tracks basic CRUD facts.
      id: Audit
      properties:
        createTime:
          description: Output only. Time of creation.
          format: google-datetime
          readOnly: true
          type: string
        creator:
          description: >-
            Output only. Agent that created or updated the record, could be a
            UserId or a JobId.
          readOnly: true
          type: string
        updateTime:
          description: Output only. Time of creation or last update.
          format: google-datetime
          readOnly: true
          type: string
        updater:
          description: >-
            Output only. Agent that last updated the record, could be a UserId
            or a JobId.
          readOnly: true
          type: string
      type: object
    Configuration:
      description: >-
        A configuration represents a behavior an engine should follow when
        producing new findings.
      id: Configuration
      properties:
        audit:
          $ref: '#/components/schemas/Audit'
          description: Output only. Audit information for the configuration.
          readOnly: true
        description:
          description: Optional. A description of the configuration.
          type: string
        detail:
          $ref: '#/components/schemas/ConfigurationDetail'
          description: Required. Domain specific details for the configuration.
        displayName:
          description: Output only. Human readable name for the configuration.
          readOnly: true
          type: string
        etag:
          description: >-
            If included when updating a configuration, this should be set to the
            current etag of the configuration. If the etags do not match, the
            update will be rejected and an ABORTED error will be returned.
          type: string
        name:
          description: >-
            Identifier. Server generated name for the configuration. format is
            projects/{project}/configurations/{configuration}
          type: string
        provider:
          description: Required. Name of the service that provides the configuration.
          type: string
        state:
          description: Optional. State of the configuration.
          enum:
            - STATE_UNSPECIFIED
            - ENABLED
            - DISABLED
            - DEPRECATED
          enumDescriptions:
            - Configuration state is unspecified. This is not expected to occur.
            - Configuration is enabled for the customer.
            - Configuration is disabled for the customer.
            - >-
              Configuration is deprecated, no new configs are allowed to be
              created.
          type: string
        version:
          description: >-
            Optional. A user-manipulatable version. Does not adhere to a
            specific format
          type: string
      type: object
    ConfigurationDetail:
      description: >-
        Wrapper class that contains the union struct for all the various
        configuration detail specific classes.
      id: ConfigurationDetail
      properties:
        customThreatScenario:
          $ref: '#/components/schemas/CustomThreatScenarioConfig'
          description: Custom Threat Scenario detail config.
        customerProfile:
          $ref: '#/components/schemas/CustomerProfileConfig'
          description: Customer Profile detail config.
        detailType:
          description: >-
            Output only. Name of the detail type. Will be set by the server
            during creation to the name of the field that is set in the detail
            union.
          readOnly: true
          type: string
        technologyWatchlist:
          $ref: '#/components/schemas/TechnologyWatchListConfig'
          description: Technology Watchlist detail config.
      type: object
    ConfigurationRevision:
      description: >-
        A ConfigurationRevision is a snapshot of a Configuration at a point in
        time. It is immutable.
      id: ConfigurationRevision
      properties:
        createTime:
          description: Output only. The time the Revision was created
          format: google-datetime
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. The name of the ConfigurationRevision Format:
            projects//configurations//revisions/
          type: string
        snapshot:
          $ref: '#/components/schemas/Configuration'
          description: The snapshot of the configuration
      type: object
    CustomThreatScenarioConfig:
      description: >-
        CustomThreatScenarioConfig represents a user-defined threat scenario
        configuration.
      id: CustomThreatScenarioConfig
      properties:
        documentCondition:
          description: >-
            Required. The condition driving the scenario, stored as a
            stringified JSON. This is used to query/filter documents.
          type: string
      type: object
    CustomerProfileCitation:
      description: Citation information for the customer profile.
      id: CustomerProfileCitation
      properties:
        citationId:
          description: >-
            Required. The citation id for the citation. Should be unique within
            the profile.
          type: string
        document:
          description: Required. The name of the document the citation is from.
          type: string
        retrievalTime:
          description: The time the citation was retrieved.
          format: google-datetime
          type: string
        source:
          description: Required. The source of the citation.
          type: string
        uri:
          description: Optional. The url of the citation.
          type: string
      type: object
    CustomerProfileCitedString:
      description: A string with citation ids.
      id: CustomerProfileCitedString
      properties:
        citationIds:
          description: Optional. The citation ids for the string.
          items:
            type: string
          type: array
        value:
          description: Required. The value of the string.
          type: string
      type: object
    CustomerProfileCompany:
      description: Company information for the customer profile.
      id: CustomerProfileCompany
      properties:
        citationIds:
          description: Optional. The citation ids for the company.
          items:
            type: string
          type: array
        company:
          description: Required. The name of the company.
          type: string
      type: object
    CustomerProfileConfig:
      description: CustomerProfileConfig is the configuration for the customer profile.
      id: CustomerProfileConfig
      properties:
        citations:
          description: Optional. Citations for the organization profile.
          items:
            $ref: '#/components/schemas/CustomerProfileCitation'
          type: array
        contactInfo:
          description: Optional. Contact information for the organization.
          items:
            $ref: '#/components/schemas/CustomerProfileContactInfo'
          type: array
        executives:
          description: Optional. Executives of the organization.
          items:
            $ref: '#/components/schemas/CustomerProfilePerson'
          type: array
        industries:
          description: Optional. The industries the organization is involved in.
          items:
            $ref: '#/components/schemas/CustomerProfileIndustry'
          type: array
        locations:
          description: >-
            Optional. Locations the organization is present or conducts business
            in.
          items:
            $ref: '#/components/schemas/CustomerProfileLocation'
          type: array
        org:
          description: Required. The name of the organization.
          type: string
        orgSummary:
          description: Optional. A summary of the organization.
          type: string
        parentCompanies:
          description: Optional. The parent companies of the organization.
          items:
            $ref: '#/components/schemas/CustomerProfileCompany'
          type: array
        products:
          description: Optional. Product information for the organization.
          items:
            $ref: '#/components/schemas/CustomerProfileProduct'
          type: array
        securityConsiderations:
          $ref: '#/components/schemas/CustomerProfileSecurityConsiderations'
          description: Optional. Security considerations for the organization.
        summary:
          $ref: '#/components/schemas/CustomerProfileSummary'
          description: Optional. A summarized version of the customer profile.
        technologyPresence:
          description: Optional. Technology presence of the organization.
          type: string
        webPresences:
          description: Optional. Web presence of the organization.
          items:
            $ref: '#/components/schemas/CustomerProfileWebPresence'
          type: array
      type: object
    CustomerProfileContactInfo:
      description: Contact information for the customer profile.
      id: CustomerProfileContactInfo
      properties:
        address:
          description: The address of the contact.
          type: string
        citationIds:
          description: Optional. The citation ids for the contact information.
          items:
            type: string
          type: array
        email:
          description: The email address of the contact.
          type: string
        label:
          description: Optional. The name of the contact.
          type: string
        other:
          description: The other contact information.
          type: string
        phone:
          description: The phone number of the contact.
          type: string
      type: object
    CustomerProfileIndustry:
      description: Industry information for the customer profile.
      id: CustomerProfileIndustry
      properties:
        citationIds:
          description: Optional. The citation ids for the industry.
          items:
            type: string
          type: array
        industry:
          description: Required. The name of the industry.
          type: string
      type: object
    CustomerProfileLocation:
      description: Location information for the customer profile.
      id: CustomerProfileLocation
      properties:
        address:
          description: Required. The address of the location.
          type: string
        brand:
          description: Required. The brand of the location.
          type: string
        citationIds:
          description: Optional. The citation ids for the location.
          items:
            type: string
          type: array
        facilityType:
          description: Optional. The type of location.
          type: string
      type: object
    CustomerProfilePerson:
      description: Person information for the customer profile.
      id: CustomerProfilePerson
      properties:
        citationIds:
          description: Optional. The citation ids for the person.
          items:
            type: string
          type: array
        name:
          description: Required. The name of the person.
          type: string
        title:
          description: Optional. The title of the person.
          type: string
      type: object
    CustomerProfileProduct:
      description: Product information for the customer profile.
      id: CustomerProfileProduct
      properties:
        brand:
          description: Required. The brand of the product.
          type: string
        citationIds:
          description: Optional. The citation ids for the product.
          items:
            type: string
          type: array
        product:
          description: Required. The name of the product.
          type: string
      type: object
    CustomerProfileSecurityConsiderations:
      description: Security considerations for the customer profile.
      id: CustomerProfileSecurityConsiderations
      properties:
        considerations:
          description: >-
            Optional. A series of considerations for the security of the
            organization, such as "high risk of compromise" or "vulnerable to
            cyberbullying".
          items:
            type: string
          type: array
        note:
          description: Optional. A note about the security considerations.
          type: string
      type: object
    CustomerProfileSummary:
      description: A summarized version of the customer profile. Generated by the backend.
      id: CustomerProfileSummary
      properties:
        areaServed:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. The area the customer serves.
        brands:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. A narrative summary of brands.
        entityType:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. The entity type of the customer.
        founded:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. The date the customer was founded.
        headquarters:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. The headquarters of the customer.
        industry:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. The industry the customer is in.
        keyPeopleSummary:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. A narrative summary of key people.
        parentCompany:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. The parent company of the customer.
        primaryWebsite:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. The primary website of the customer.
        productsSummary:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. A narrative summary of products.
        servicesSummary:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. A narrative summary of services.
        title:
          $ref: '#/components/schemas/CustomerProfileCitedString'
          description: Optional. The official name of the customer.
      type: object
    CustomerProfileWebPresence:
      description: Web presence information for the customer profile.
      id: CustomerProfileWebPresence
      properties:
        citationIds:
          description: Optional. The citation ids for the web presence.
          items:
            type: string
          type: array
        domain:
          description: Required. The domain name of the web presence.
          type: string
      type: object
    DataLeakAlertDetail:
      description: Captures the specific details of Data Leak alert.
      id: DataLeakAlertDetail
      properties:
        discoveryDocumentIds:
          description: Required. Array of ids to accommodate multiple discovery documents
          items:
            type: string
          type: array
        severity:
          description: >-
            Required. The severity of the Data Leak alert. Allowed values are: *
            `LOW` * `MEDIUM` * `HIGH` * `CRITICAL`
          type: string
      type: object
    DataLeakFindingDetail:
      description: A detail object for a Data Leak finding.
      id: DataLeakFindingDetail
      properties:
        documentId:
          description: >-
            Required. The unique identifier of the document that triggered the
            Data Leak finding. This ID can be used to retrieve the content of
            the document for further analysis.
          type: string
        matchScore:
          description: >-
            Required. Reference to the match score of the Data Leak finding.
            This is a float value greater than 0 and less than or equal to 1
            calculated by the matching engine based on the similarity of the
            document and the user provided configurations.
          format: float
          type: number
        severity:
          description: >-
            Required. The severity of the Data Leak finding. This indicates the
            potential impact of the threat.
          enum:
            - SEVERITY_UNSPECIFIED
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
          enumDescriptions:
            - Default value, should never be set.
            - Low severity.
            - Medium severity.
            - High severity.
            - Critical severity.
          type: string
      type: object
    EnumerateAlertFacetsResponse:
      description: Response message for EnumerateAlertFacets.
      id: EnumerateAlertFacetsResponse
      properties:
        facets:
          description: List of facets and the counts.
          items:
            $ref: '#/components/schemas/Facet'
          type: array
      type: object
    Evidence:
      description: Details the evidence used to determine the relevance verdict.
      id: Evidence
      properties:
        commonThemes:
          description: >-
            A list of semantic themes or concepts found to be common, related,
            or aligned between the sources, supporting the verdict.
          items:
            type: string
          type: array
        distinctThemes:
          description: >-
            A list of semantic themes or descriptions unique to one source or
            semantically distant.
          items:
            type: string
          type: array
      type: object
    Facet:
      description: >-
        Facet represents a sub element of a resource for filtering. The results
        from this method are used to populate the filterable facets in the UI.
      id: Facet
      properties:
        facet:
          description: >-
            Name of the facet. This is also the string that needs to be used in
            the filtering expression.
          type: string
        facetCounts:
          description: List of counts for the facet (if categorical).
          items:
            $ref: '#/components/schemas/FacetCount'
          type: array
        facetType:
          description: >-
            The type of the facet. Options include "string", "int", "float",
            "bool", "enum", "timestamp", "user" and are useful to show the right
            sort of UI controls when building a AIP-160 style filtering string.
          type: string
        maxValue:
          description: >-
            Max value of the facet stringified based on type. Will be populated
            and formatted the same as min_value.
          type: string
        minValue:
          description: >-
            Min value of the facet stringified based on type. This is only
            populated for facets that have a clear ordering, for types like enum
            it will be left empty. Timestamps will be formatted using RFC3339.
          type: string
        totalCount:
          description: Total number of records that contain this facet with ANY value.
          format: int64
          type: string
      type: object
    FacetCount:
      description: FacetCount represents a count of records with each facet value.
      id: FacetCount
      properties:
        count:
          description: Count of records with the value.
          format: int32
          type: integer
        value:
          description: >-
            Value of the facet stringified. Timestamps will be formatted using
            RFC3339.
          type: string
      type: object
    Finding:
      description: >-
        A ‘stateless’ and a point in time event that a check produced a result
        of interest.
      id: Finding
      properties:
        aiSummary:
          description: Optional. AI summary of the finding.
          type: string
        alert:
          description: Optional. Name of the alert that this finding is bound to.
          type: string
        audit:
          $ref: '#/components/schemas/Audit'
          description: Output only. Audit data about the finding.
          readOnly: true
        configurations:
          description: Optional. Configuration names that are bound to this finding.
          items:
            type: string
          type: array
        detail:
          $ref: '#/components/schemas/FindingDetail'
          description: Required. Holder of the domain specific details of the finding.
        displayName:
          description: >-
            Required. A short descriptive title for the finding <= 250 chars.
            EX: "Actor 'baddy' offering $1000 for credentials of 'goodguy'".
          type: string
        name:
          description: >-
            Identifier. Server generated name for the finding (leave clear
            during creation). Format: projects/{project}/findings/{finding}
          type: string
        provider:
          description: Required. Logical source of this finding (name of the sub-engine).
          type: string
        relevanceAnalysis:
