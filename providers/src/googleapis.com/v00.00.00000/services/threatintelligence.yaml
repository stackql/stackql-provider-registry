openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Threat Intelligence API
  description: threatintelligence.googleapis.com API.
  version: v1beta
  x-discovery-doc-revision: '20260726'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://docs.cloud.google.com/threatintelligence/
servers:
  - url: https://threatintelligence.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    CustomerProfileSecurityConsiderations:
      type: object
      id: CustomerProfileSecurityConsiderations
      description: Security considerations for the customer profile.
      properties:
        note:
          description: Optional. A note about the security considerations.
          type: string
        considerations:
          type: array
          description: >-
            Optional. A series of considerations for the security of the
            organization, such as "high risk of compromise" or "vulnerable to
            cyberbullying".
          items:
            type: string
    Operation:
      id: Operation
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      properties:
        response:
          type: object
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/Status'
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
      type: object
    ListConfigurationsResponse:
      id: ListConfigurationsResponse
      description: Response message for ListConfigurations.
      properties:
        configurations:
          description: List of configurations.
          items:
            $ref: '#/components/schemas/Configuration'
          type: array
        nextPageToken:
          description: Page token.
          type: string
      type: object
    Facet:
      type: object
      id: Facet
      description: >-
        Facet represents a sub element of a resource for filtering. The results
        from this method are used to populate the filterable facets in the UI.
      properties:
        maxValue:
          description: >-
            Max value of the facet stringified based on type. Will be populated
            and formatted the same as min_value.
          type: string
        facetCounts:
          type: array
          description: List of counts for the facet (if categorical).
          items:
            $ref: '#/components/schemas/FacetCount'
        facet:
          description: >-
            Name of the facet. This is also the string that needs to be used in
            the filtering expression.
          type: string
        totalCount:
          description: Total number of records that contain this facet with ANY value.
          format: int64
          type: string
        minValue:
          description: >-
            Min value of the facet stringified based on type. This is only
            populated for facets that have a clear ordering, for types like enum
            it will be left empty. Timestamps will be formatted using RFC3339.
          type: string
        facetType:
          description: >-
            The type of the facet. Options include "string", "int", "float",
            "bool", "enum", "timestamp", "user" and are useful to show the right
            sort of UI controls when building a AIP-160 style filtering string.
          type: string
    MarkAlertAsTrackedExternallyRequest:
      type: object
      id: MarkAlertAsTrackedExternallyRequest
      description: Request message for MarkAlertAsTrackedExternally.
      properties: {}
    CustomerProfilePerson:
      type: object
      id: CustomerProfilePerson
      description: Person information for the customer profile.
      properties:
        name:
          description: Required. The name of the person.
          type: string
        title:
          description: Optional. The title of the person.
          type: string
        citationIds:
          type: array
          description: Optional. The citation ids for the person.
          items:
            type: string
    CustomerProfileWebPresence:
      id: CustomerProfileWebPresence
      description: Web presence information for the customer profile.
      properties:
        domain:
          description: Required. The domain name of the web presence.
          type: string
        citationIds:
          description: Optional. The citation ids for the web presence.
          items:
            type: string
          type: array
      type: object
    CustomerProfileCompany:
      id: CustomerProfileCompany
      description: Company information for the customer profile.
      properties:
        citationIds:
          type: array
          description: Optional. The citation ids for the company.
          items:
            type: string
        company:
          description: Required. The name of the company.
          type: string
      type: object
    TargetTechnologyAlertDetail:
      type: object
      id: TargetTechnologyAlertDetail
      description: Contains details for a technology watchlist alert.
      properties:
        vulnerabilityMatch:
          description: Optional. The vulnerability match details.
          $ref: '#/components/schemas/VulnerabilityMatch'
    ListFindingsResponse:
      type: object
      id: ListFindingsResponse
      description: Response message for ListFindings.
      properties:
        nextPageToken:
          description: Page token.
          type: string
        findings:
          description: List of findings.
          items:
            $ref: '#/components/schemas/Finding'
          type: array
    Alert:
      type: object
      id: Alert
      description: >-
        Stateful object representing a group of Findings. Key feature to an
        Alert is that it expresses the user's intent towards the findings of
        that group, even those that haven't occurred yet.
      properties:
        relevanceAnalysis:
          description: >-
            Output only. High-Precision Relevance Analysis verdict for the
            alert.
          readOnly: true
          $ref: '#/components/schemas/RelevanceAnalysis'
        findingCount:
          format: int64
          description: Output only. The number of findings associated with this alert.
          readOnly: true
          type: string
        displayName:
          description: Output only. A short title for the alert.
          readOnly: true
          type: string
        detail:
          description: >-
            Output only. Details object for the alert, not all alerts will have
            a details object.
          readOnly: true
          $ref: '#/components/schemas/AlertDetail'
        priorityAnalysis:
          description: Output only. High-Precision Priority Analysis for the alert.
          readOnly: true
          $ref: '#/components/schemas/PriorityAnalysis'
        configurations:
          type: array
          description: >-
            Output only. The resource names of the Configurations bound to this
            alert. Format: projects/{project}/configurations/{configuration}
          readOnly: true
          items:
            type: string
        duplicatedBy:
          type: array
          description: >-
            Output only. alert names of the alerts that are duplicates of this
            alert. Format: projects/{project}/alerts/{alert}
          readOnly: true
          items:
            type: string
        externalId:
          description: >-
            Output only. External ID for the alert. This is used internally to
            provide protection against out of order updates.
          readOnly: true
          type: string
        etag:
          description: >-
            Optional. If included when updating an alert, this should be set to
            the current etag of the alert. If the etags do not match, the update
            will be rejected and an ABORTED error will be returned.
          type: string
        aiSummary:
          description: Optional. AI summary of the alert.
          type: string
        duplicateOf:
          description: >-
            Output only. alert name of the alert this alert is a duplicate of.
            Format: projects/{project}/alerts/{alert}
          readOnly: true
          type: string
        audit:
          description: Output only. Audit information for the alert.
          readOnly: true
          $ref: '#/components/schemas/Audit'
        findings:
          type: array
          description: Output only. Findings that are covered by this alert.
          readOnly: true
          items:
            type: string
        state:
          readOnly: true
          enum:
            - STATE_UNSPECIFIED
            - NEW
            - READ
            - TRIAGED
            - ESCALATED
            - RESOLVED
            - DUPLICATE
            - FALSE_POSITIVE
            - NOT_ACTIONABLE
            - BENIGN
            - TRACKED_EXTERNALLY
          description: Output only. State of the alert.
          enumDescriptions:
            - Default value, should never be set.
            - alert is new.
            - alert was read by a human.
            - alert has been triaged.
            - alert has been escalated.
            - alert has been resolved.
            - alert is a duplicate of another alert.
            - alert is a false positive and should be ignored.
            - alert is not actionable.
            - alert is benign.
            - alert is tracked externally.
          type: string
        name:
          description: >-
            Identifier. Server generated name for the alert. format is
            projects/{project}/alerts/{alert}
          type: string
        severityAnalysis:
          description: Output only. High-Precision Severity Analysis for the alert.
          readOnly: true
          $ref: '#/components/schemas/SeverityAnalysis'
    RelevanceAnalysis:
      id: RelevanceAnalysis
      description: Structured relevance analysis for a threat.
      properties:
        relevant:
          description: Indicates whether the threat is considered relevant.
          type: boolean
        confidence:
          enum:
            - CONFIDENCE_LEVEL_UNSPECIFIED
            - CONFIDENCE_LEVEL_LOW
            - CONFIDENCE_LEVEL_MEDIUM
            - CONFIDENCE_LEVEL_HIGH
          type: string
          description: The level of confidence in the given verdict.
          enumDescriptions:
            - Default value. Confidence level is not specified.
            - Low confidence in the verdict.
            - Medium confidence in the verdict.
            - High confidence in the verdict.
        reasoning:
          description: >-
            Human-readable explanation from the matcher, detailing why a
            particular result is considered relevant or not relevant.
          type: string
        evidence:
          description: >-
            Evidence supporting the verdict, including matched and unmatched
            items.
          $ref: '#/components/schemas/Evidence'
        relevanceLevel:
          description: The level of relevance.
          enumDescriptions:
            - Default value, should never be set.
            - Low Relevance.
            - Medium Relevance.
            - High Relevance.
          type: string
          enum:
            - RELEVANCE_LEVEL_UNSPECIFIED
            - RELEVANCE_LEVEL_LOW
            - RELEVANCE_LEVEL_MEDIUM
            - RELEVANCE_LEVEL_HIGH
      type: object
    ListAlertsResponse:
      id: ListAlertsResponse
      description: Response message for ListAlerts.
      properties:
        nextPageToken:
          description: Page token.
          type: string
        alerts:
          type: array
          description: List of alerts.
          items:
            $ref: '#/components/schemas/Alert'
      type: object
    InsiderThreatAlertDetail:
      id: InsiderThreatAlertDetail
      description: Captures the specific details of InsiderThreat alert.
      properties:
        severity:
          description: >-
            Required. The severity of the Insider Threat alert. Allowed values
            are: * `LOW` * `MEDIUM` * `HIGH` * `CRITICAL`
          type: string
        discoveryDocumentIds:
          description: Required. Array of ids to accommodate multiple discovery documents
          items:
            type: string
          type: array
      type: object
    FindingDetail:
      type: object
      id: FindingDetail
      description: >-
        Wrapper class that contains the union struct for all the various
        findings detail specific classes.
      properties:
        detailType:
          description: >-
            Output only. Name of the detail type. Will be set by the server
            during creation to the name of the field that is set in the detail
            union.
          readOnly: true
          type: string
        initialAccessBroker:
          description: Initial Access Broker finding detail type.
          $ref: '#/components/schemas/InitialAccessBrokerFindingDetail'
        dataLeak:
          description: Data Leak finding detail type.
          $ref: '#/components/schemas/DataLeakFindingDetail'
        insiderThreat:
          description: Insider Threat finding detail type.
          $ref: '#/components/schemas/InsiderThreatFindingDetail'
        targetTechnology:
          description: Technology Watchlist finding detail type.
          $ref: '#/components/schemas/TargetTechnologyFindingDetail'
    SeverityAnalysis:
      type: object
      id: SeverityAnalysis
      description: Structured severity analysis for a threat.
      properties:
        severityLevel:
          description: The level of severity.
          enumDescriptions:
            - Default value, should never be set.
            - Low Severity.
            - Medium Severity.
            - High Severity.
          enum:
            - SEVERITY_LEVEL_UNSPECIFIED
            - SEVERITY_LEVEL_LOW
            - SEVERITY_LEVEL_MEDIUM
            - SEVERITY_LEVEL_HIGH
          type: string
        confidence:
          type: string
          enum:
            - CONFIDENCE_LEVEL_UNSPECIFIED
            - CONFIDENCE_LEVEL_LOW
            - CONFIDENCE_LEVEL_MEDIUM
            - CONFIDENCE_LEVEL_HIGH
          description: The level of confidence in the given verdict.
          enumDescriptions:
            - Default value. Confidence level is not specified.
            - Low confidence in the verdict.
            - Medium confidence in the verdict.
            - High confidence in the verdict.
        reasoning:
          description: >-
            Human-readable explanation from the model, detailing why a
            particular result is considered to have a certain severity.
          type: string
    InitialAccessBrokerAlertDetail:
      type: object
      id: InitialAccessBrokerAlertDetail
      description: Captures the specific details of InitialAccessBroker (IAB) alert.
      properties:
        discoveryDocumentIds:
          type: array
          description: Required. Array of ids to accommodate multiple discovery documents
          items:
            type: string
        severity:
          description: >-
            Required. The severity of the Initial Access Broker (IAB) alert.
            Allowed values are: * `LOW` * `MEDIUM` * `HIGH` * `CRITICAL`
          type: string
    CustomerProfileCitation:
      id: CustomerProfileCitation
      description: Citation information for the customer profile.
      properties:
        uri:
          description: Optional. The url of the citation.
          type: string
        source:
          description: Required. The source of the citation.
          type: string
        document:
          description: Required. The name of the document the citation is from.
          type: string
        retrievalTime:
          type: string
          format: google-datetime
          description: The time the citation was retrieved.
        citationId:
          description: >-
            Required. The citation id for the citation. Should be unique within
            the profile.
          type: string
      type: object
    MarkAlertAsReadRequest:
      id: MarkAlertAsReadRequest
      description: Request message for MarkAlertAsRead.
      properties: {}
      type: object
    AlertDetail:
      type: object
      id: AlertDetail
      description: Container for different types of alert details.
      properties:
        initialAccessBroker:
          description: Initial Access Broker alert detail type.
          $ref: '#/components/schemas/InitialAccessBrokerAlertDetail'
        dataLeak:
          description: Data Leak alert detail type.
          $ref: '#/components/schemas/DataLeakAlertDetail'
        detailType:
          description: >-
            Output only. Name of the detail type. Will be set by the server
            during creation to the name of the field that is set in the detail
            union.
          readOnly: true
          type: string
        insiderThreat:
          description: Insider Threat alert detail type.
          $ref: '#/components/schemas/InsiderThreatAlertDetail'
        targetTechnology:
          description: Technology Watchlist alert detail type.
          $ref: '#/components/schemas/TargetTechnologyAlertDetail'
    ListConfigurationRevisionsResponse:
      id: ListConfigurationRevisionsResponse
      description: Response message for ListConfigurationRevisions.
      properties:
        revisions:
          description: >-
            The Configuration Revisions associated with the specified
            Configuration
          items:
            $ref: '#/components/schemas/ConfigurationRevision'
          type: array
        nextPageToken:
          description: >-
            A token, which can be sent as `page_token` to retrieve the next
            page. If this field is omitted, there are no subsequent pages.
          type: string
      type: object
    SearchFindingsResponse:
      type: object
      id: SearchFindingsResponse
      description: Response message for SearchFindings.
      properties:
        findings:
          type: array
          description: List of findings.
          items:
            $ref: '#/components/schemas/Finding'
        nextPageToken:
          description: Page token.
          type: string
    DataLeakAlertDetail:
      id: DataLeakAlertDetail
      description: Captures the specific details of Data Leak alert.
      properties:
        discoveryDocumentIds:
          description: Required. Array of ids to accommodate multiple discovery documents
          items:
            type: string
          type: array
        severity:
          description: >-
            Required. The severity of the Data Leak alert. Allowed values are: *
            `LOW` * `MEDIUM` * `HIGH` * `CRITICAL`
          type: string
      type: object
    Configuration:
      type: object
      id: Configuration
      description: >-
        A configuration represents a behavior an engine should follow when
        producing new findings.
      properties:
        provider:
          description: Required. Name of the service that provides the configuration.
          type: string
        state:
          type: string
          enum:
            - STATE_UNSPECIFIED
            - ENABLED
            - DISABLED
            - DEPRECATED
          description: Optional. State of the configuration.
          enumDescriptions:
            - Configuration state is unspecified. This is not expected to occur.
            - Configuration is enabled for the customer.
            - Configuration is disabled for the customer.
            - >-
              Configuration is deprecated, no new configs are allowed to be
              created.
        version:
          description: >-
            Optional. A user-manipulatable version. Does not adhere to a
            specific format
          type: string
        description:
          description: Optional. A description of the configuration.
          type: string
        audit:
          description: Output only. Audit information for the configuration.
          readOnly: true
          $ref: '#/components/schemas/Audit'
        displayName:
          type: string
          description: Output only. Human readable name for the configuration.
          readOnly: true
        detail:
          description: Required. Domain specific details for the configuration.
          $ref: '#/components/schemas/ConfigurationDetail'
        etag:
          description: >-
            If included when updating a configuration, this should be set to the
            current etag of the configuration. If the etags do not match, the
            update will be rejected and an ABORTED error will be returned.
          type: string
        name:
          description: >-
            Identifier. Server generated name for the configuration. format is
            projects/{project}/configurations/{configuration}
          type: string
    MarkAlertAsFalsePositiveRequest:
      id: MarkAlertAsFalsePositiveRequest
      description: Request message for MarkAlertAsFalsePositive.
      properties: {}
      type: object
    ConfigurationRevision:
      id: ConfigurationRevision
      description: >-
        A ConfigurationRevision is a snapshot of a Configuration at a point in
        time. It is immutable.
      properties:
        createTime:
          format: google-datetime
          description: Output only. The time the Revision was created
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. The name of the ConfigurationRevision Format:
            projects//configurations//revisions/
          type: string
        snapshot:
          description: The snapshot of the configuration
          $ref: '#/components/schemas/Configuration'
      type: object
    AlertDocument:
      id: AlertDocument
      description: A document that is associated with an alert.
      properties:
        name:
          description: >-
            Identifier. Server generated name for the alert document. format is
            projects/{project}/alerts/{alert}/documents/{document}
          type: string
        source:
          description: Output only. Source of the intel item, e.g. DarkMarket.
          readOnly: true
          type: string
        sourceUri:
          description: Output only. URI of the intel item from the source.
          readOnly: true
          type: string
        content:
          description: Output only. The content of the document.
          readOnly: true
          type: string
        ingestTime:
          type: string
          format: google-datetime
          description: Output only. Time when GTI received the intel.
          readOnly: true
        languageCode:
          description: Output only. The language code of the document.
          readOnly: true
          type: string
        collectionTime:
          description: Output only. Time when the origin source collected the intel.
          readOnly: true
          format: google-datetime
          type: string
        translation:
          description: Output only. The translation of the document, if available.
          readOnly: true
          $ref: '#/components/schemas/AlertDocumentTranslation'
        title:
          type: string
          description: Output only. The title of the document, if available.
          readOnly: true
        createTime:
          description: >-
            Output only. The timestamp of the original external publication of
            the document.
          readOnly: true
          format: google-datetime
          type: string
        aiSummary:
          type: string
          description: Output only. AI summary of the document.
          readOnly: true
        author:
          description: Output only. The author of the document.
          readOnly: true
          type: string
        sourceUpdateTime:
          type: string
          description: Output only. Time when the intel was last updated by the source.
          readOnly: true
          format: google-datetime
      type: object
    Finding:
      type: object
      id: Finding
      description: >-
        A ‘stateless’ and a point in time event that a check produced a result
        of interest.
      properties:
        name:
          description: >-
            Identifier. Server generated name for the finding (leave clear
            during creation). Format: projects/{project}/findings/{finding}
          type: string
        aiSummary:
          description: Optional. AI summary of the finding.
          type: string
        severityAnalysis:
          description: >-
            Output only. High-Precision Severity Analysis verdict for the
            finding.
          readOnly: true
          $ref: '#/components/schemas/SeverityAnalysis'
        displayName:
          description: >-
            Required. A short descriptive title for the finding <= 250 chars.
            EX: "Actor 'baddy' offering $1000 for credentials of 'goodguy'".
          type: string
        detail:
          description: Required. Holder of the domain specific details of the finding.
          $ref: '#/components/schemas/FindingDetail'
        severity:
          deprecated: true
          format: float
          description: >-
            Optional. Deprecated: Use the `severity_analysis` field instead.
            Base severity score from the finding source.
          type: number
        audit:
          description: Output only. Audit data about the finding.
          readOnly: true
          $ref: '#/components/schemas/Audit'
        relevanceAnalysis:
          description: >-
            Output only. High-Precision Relevance Analysis verdict for the
            finding.
          readOnly: true
          $ref: '#/components/schemas/RelevanceAnalysis'
        provider:
          description: Required. Logical source of this finding (name of the sub-engine).
          type: string
        reoccurrenceTimes:
          type: array
          description: >-
            Output only. When identical finding (same labels and same details)
            has re-occurred.
          readOnly: true
          items:
            format: google-datetime
            type: string
        alert:
          description: Optional. Name of the alert that this finding is bound to.
          type: string
        configurations:
          description: Optional. Configuration names that are bound to this finding.
          items:
            type: string
          type: array
    CustomerProfileCitedString:
      id: CustomerProfileCitedString
      description: A string with citation ids.
      properties:
        value:
          description: Required. The value of the string.
          type: string
        citationIds:
          description: Optional. The citation ids for the string.
          items:
            type: string
          type: array
      type: object
    FacetCount:
      type: object
      id: FacetCount
      description: FacetCount represents a count of records with each facet value.
      properties:
        value:
          description: >-
            Value of the facet stringified. Timestamps will be formatted using
            RFC3339.
          type: string
        count:
          type: integer
          format: int32
          description: Count of records with the value.
    MarkAlertAsEscalatedRequest:
      id: MarkAlertAsEscalatedRequest
      description: Request message for MarkAlertAsEscalated.
      properties: {}
      type: object
    InsiderThreatFindingDetail:
      id: InsiderThreatFindingDetail
      description: A detail object for a InsiderThreat finding.
      properties:
        matchScore:
          format: float
          description: >-
            Required. Reference to the match score of the InsiderThreat finding.
            This is a float value greater than 0 and less than or equal to 1
            calculated by the matching engine based on the similarity of the
            document and the user provided configurations.
          type: number
        severity:
          enum:
            - SEVERITY_UNSPECIFIED
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
          type: string
          description: >-
            Required. The severity of the InsiderThreat finding. This indicates
            the potential impact of the threat.
          enumDescriptions:
            - Default value, should never be set.
            - Low severity.
            - Medium severity.
            - High severity.
            - Critical severity.
        documentId:
          description: >-
            Required. The unique identifier of the document that triggered the
            InsiderThreat finding. This ID can be used to retrieve the content
            of the document for further analysis.
          type: string
      type: object
    CustomerProfileSummary:
      type: object
      id: CustomerProfileSummary
      description: A summarized version of the customer profile. Generated by the backend.
      properties:
        keyPeopleSummary:
          description: Optional. A narrative summary of key people.
          $ref: '#/components/schemas/CustomerProfileCitedString'
        brands:
          description: Optional. A narrative summary of brands.
          $ref: '#/components/schemas/CustomerProfileCitedString'
        title:
