            - RISK_RATING_UNSPECIFIED
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
            - UNRATED
          description: Required. The risk rating of the vulnerability.
          enumDescriptions:
            - >-
              Unspecified risk rating. This is the default value when the risk
              rating is not set.
            - Low risk rating.
            - Medium risk rating.
