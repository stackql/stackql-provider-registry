          type: string
    GoogleCloudDocumentaiUiv1beta3SchemaEntityType:
      properties:
        properties:
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDocumentaiUiv1beta3SchemaEntityType
          description: >-
            Describing the nested structure of an entity. An EntityType may
            consist of several other EntityTypes. For example, in a document
            there can be an EntityType `ID`, which consists of EntityType `name`
            and `address`, with corresponding attributes, such as TEXT for both
            types and ONCE for occurrence types.
          type: array
        source:
          description: Source of this entity type.
          enum:
            - SOURCE_UNSPECIFIED
            - PREDEFINED
            - USER_INPUT
          type: string
          enumDescriptions:
            - Unspecified source.
            - >-
              The entity type is in the predefined schema of a pretrained
              version of a processor.
            - >-
              The entity type is added by the users either: - during an
              uptraining of an existing processor, or - during the process of
              creating a customized processor.
        hide:
          description: >-
            If the entity type is hidden in the schema. This provides the
            functionality to temporally "disable" an entity without deleting it.
          type: boolean
        method:
          description: Specifies how the entity's value is obtained.
          enum:
            - METHOD_UNSPECIFIED
            - EXTRACT
            - DERIVE
            - RELAXED_EXTRACT
          type: string
          enumDescriptions:
            - Unspecified method. It defaults to `EXTRACT`.
            - >-
              The entity's value is directly extracted as-is from the document
              text.
            - >-
              The entity's value is derived through inference and is not
              necessarily an exact text extraction from the document.
            - >-
              Attempts to extract the position and value as-is from the document
              text. If the value cannot be grounded in the text, it falls back
              to derivation through inference, for both position and value.
              Note: The inference fallback is currently only supported for
              boolean entities.
        type:
          description: >-
            Name of the type. It must satisfy the following constraints: 1. Must
            be unique within the set of same level types (with case-insensitive
            match). 2. Maximum 64 characters. 3. Must start with a letter. 4.
            Allowed characters: ASCII letters [a-zA-Z], ASCII digits [0-9], or
            one of the following punctuation characters: * underscore '_'
            (recommended) * hyphen '-' (allowed, not recommended) * colon ':'
            (allowed, not recommended) NOTE: Whitespace characters are not
            allowed. 5. Cannot end with a punctuation character. 6. Cannot
            contain the following restricted strings: "google", "DocumentAI"
            (case-insensitive match). 7. A slash character '/' is reserved as a
            separator in flattened representations of nested entity types (e.g.,
            "line_item/amount") in which case each part (e.g., "line_item",
            "amount") must comply with the rules defined above. We recommend
            using the snake case ("snake_case") in entity type names.
          type: string
        enumValues:
          type: array
          description: If specified, lists all the possible values for this entity.
          items:
            type: string
        occurrenceType:
          description: >-
            Occurrence type limits the number of times an entity type appears in
            the document.
          enum:
            - OCCURRENCE_TYPE_UNSPECIFIED
            - OPTIONAL_ONCE
            - OPTIONAL_MULTIPLE
            - REQUIRED_ONCE
            - REQUIRED_MULTIPLE
          type: string
          enumDescriptions:
            - Unspecified occurrence type.
            - The entity type will appear zero times or once.
            - The entity type will appear zero or multiple times.
            - The entity type will only appear exactly once.
            - The entity type will appear once or more times.
        description:
          description: Description of the entity type.
          type: string
        baseType:
          type: string
      id: GoogleCloudDocumentaiUiv1beta3SchemaEntityType
      description: >-
        EntityType is the wrapper of a label of the corresponding model with
        detailed attributes and limitations for entity-based processors.
        Multiple types can also compose a dependency tree to represent nested
        types.
      type: object
