            - Dataset has not been initialized.
            - Dataset is being initialized.
            - Dataset has been initialized.
          description: Required. State of the dataset. Ignored when updating dataset.
          enum:
            - STATE_UNSPECIFIED
            - UNINITIALIZED
            - INITIALIZING
            - INITIALIZED
          type: string
        satisfiesPzi:
          readOnly: true
          type: boolean
          description: Output only. Reserved for future use.
      id: GoogleCloudDocumentaiV1beta3Dataset
      description: >-
        A singleton resource under a Processor which configures a collection of
        documents.
      type: object
    GoogleCloudDocumentaiV1NormalizedVertex:
      type: object
      id: GoogleCloudDocumentaiV1NormalizedVertex
      description: >-
        A vertex represents a 2D point in the image. NOTE: the normalized vertex
        coordinates are relative to the original image and range from 0 to 1.
      properties:
        x:
          type: number
          description: X coordinate.
          format: float
        'y':
          type: number
          description: Y coordinate (starts from the top of the image).
          format: float
    GoogleCloudDocumentaiV1Processor:
      id: GoogleCloudDocumentaiV1Processor
      description: >-
        The first-class citizen for Document AI. Each processor defines how to
        extract structural information from a document.
      type: object
      properties:
        defaultProcessorVersion:
          type: string
          description: The default processor version.
        displayName:
          description: The display name of the processor.
          type: string
        satisfiesPzs:
          description: Output only. Reserved for future use.
          type: boolean
          readOnly: true
        kmsKeyName:
          type: string
          description: >-
            The [KMS key](https://cloud.google.com/security-key-management) used
            for encryption and decryption in CMEK scenarios.
        processEndpoint:
          readOnly: true
          type: string
          description: >-
            Output only. Immutable. The http endpoint that can be called to
            invoke processing.
        activeSchemaVersion:
          description: >-
            Optional. SchemaVersion used by the Processor. It is the same as
            Processor's DatasetSchema.schema_version Format is
            `projects/{project}/locations/{location}/schemas/{schema}/schemaVersions/{schema_version}.
          type: string
        createTime:
          readOnly: true
          format: google-datetime
          description: Output only. The time the processor was created.
          type: string
        type:
          description: >-
            The processor type, such as: `OCR_PROCESSOR`, `INVOICE_PROCESSOR`.
            To get a list of processor types, see FetchProcessorTypes.
          type: string
        satisfiesPzi:
          type: boolean
          description: Output only. Reserved for future use.
          readOnly: true
        processorVersionAliases:
          description: Output only. The processor version aliases.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/GoogleCloudDocumentaiV1ProcessorVersionAlias'
        name:
          type: string
          description: >-
            Output only. Immutable. The resource name of the processor. Format:
            `projects/{project}/locations/{location}/processors/{processor}`
          readOnly: true
        state:
          description: Output only. The state of the processor.
          enum:
            - STATE_UNSPECIFIED
            - ENABLED
            - DISABLED
            - ENABLING
            - DISABLING
            - CREATING
            - FAILED
            - DELETING
          readOnly: true
          enumDescriptions:
            - The processor is in an unspecified state.
            - >-
              The processor is enabled, i.e., has an enabled version which can
              currently serve processing requests and all the feature
              dependencies have been successfully initialized.
            - The processor is disabled.
            - >-
              The processor is being enabled, will become `ENABLED` if
              successful.
            - >-
              The processor is being disabled, will become `DISABLED` if
              successful.
            - >-
              The processor is being created, will become either `ENABLED` (for
              successful creation) or `FAILED` (for failed ones). Once a
              processor is in this state, it can then be used for document
              processing, but the feature dependencies of the processor might
              not be fully created yet.
            - >-
              The processor failed during creation or initialization of feature
              dependencies. The user should delete the processor and recreate
              one as all the functionalities of the processor are disabled.
            - The processor is being deleted, will be removed if successful.
          type: string
    GoogleCloudDocumentaiV1BatchProcessMetadata:
      properties:
        stateMessage:
          description: >-
            A message providing more details about the current state of
            processing. For example, the error message if the operation is
            failed.
          type: string
        createTime:
          type: string
          description: The creation time of the operation.
          format: google-datetime
        state:
          description: The state of the current batch processing.
          enum:
            - STATE_UNSPECIFIED
            - WAITING
            - RUNNING
            - SUCCEEDED
            - CANCELLING
            - CANCELLED
            - FAILED
          type: string
          enumDescriptions:
            - The default value. This value is used if the state is omitted.
            - Request operation is waiting for scheduling.
            - Request is being processed.
            - The batch processing completed successfully.
            - The batch processing was being cancelled.
            - The batch processing was cancelled.
            - The batch processing has failed.
        individualProcessStatuses:
          type: array
          description: The list of response details of each document.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDocumentaiV1BatchProcessMetadataIndividualProcessStatus
        updateTime:
