    GoogleCloudDocumentaiV1RawDocument:
      id: GoogleCloudDocumentaiV1RawDocument
      description: Payload message of raw document content (bytes).
      type: object
      properties:
        content:
          type: string
          description: Inline document content.
          format: byte
        mimeType:
          description: >-
            An IANA MIME type (RFC6838) indicating the nature and format of the
            content.
          type: string
        displayName:
          description: >-
            The display name of the document, it supports all Unicode characters
            except the following: `*`, `?`, `[`, `]`, `%`, `{`, `}`,`'`, `\"`,
            `,` `~`, `=` and `:` are reserved. If not specified, a default ID is
            generated.
          type: string
    GoogleCloudDocumentaiV1beta3HumanReviewStatus:
      id: GoogleCloudDocumentaiV1beta3HumanReviewStatus
      description: The status of human review on a processed document.
      type: object
      properties:
        stateMessage:
          description: A message providing more details about the human review state.
          type: string
        humanReviewOperation:
          description: >-
            The name of the operation triggered by the processed document. This
            field is populated only when the state is
            `HUMAN_REVIEW_IN_PROGRESS`. It has the same response type and
            metadata as the long-running operation returned by ReviewDocument.
          type: string
        state:
          enumDescriptions:
            - >-
              Human review state is unspecified. Most likely due to an internal
              error.
            - >-
              Human review is skipped for the document. This can happen because
              human review isn't enabled on the processor or the processing
              request has been set to skip this document.
            - >-
              Human review validation is triggered and passed, so no review is
              needed.
            - >-
              Human review validation is triggered and the document is under
              review.
            - >-
              Some error happened during triggering human review, see the
              state_message for details.
          description: The state of human review on the processing request.
          enum:
            - STATE_UNSPECIFIED
            - SKIPPED
            - VALIDATION_PASSED
            - IN_PROGRESS
            - ERROR
          type: string
