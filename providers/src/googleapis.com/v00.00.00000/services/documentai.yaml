openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Cloud Document AI API
  description: >-
    Service to parse structured information from unstructured or semi-structured
    documents using state-of-the-art Google AI such as natural language,
    computer vision, translation, and AutoML.
  version: v1
  x-discovery-doc-revision: '20260706'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/document-ai/docs/
servers:
  - url: https://documentai.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    GoogleCloudDocumentaiV1EvaluationMultiConfidenceMetrics:
      id: GoogleCloudDocumentaiV1EvaluationMultiConfidenceMetrics
      description: Metrics across multiple confidence levels.
      type: object
      properties:
        auprcExact:
          format: float
          type: number
          description: >-
            The AUPRC for metrics with fuzzy matching disabled, i.e., exact
            matching only.
        estimatedCalibrationError:
          format: float
          description: >-
            The Estimated Calibration Error (ECE) of the confidence of the
            predicted entities.
          type: number
        metricsType:
          description: The metrics type for the label.
          enum:
            - METRICS_TYPE_UNSPECIFIED
            - AGGREGATE
          type: string
          enumDescriptions:
            - >-
              The metrics type is unspecified. By default, metrics without a
              particular specification are for leaf entity types (i.e.,
              top-level entity types without child types, or child types which
              are not parent types themselves).
            - >-
              Indicates whether metrics for this particular label type represent
              an aggregate of metrics for other types instead of being based on
              actual TP/FP/FN values for the label type. Metrics for parent
              (i.e., non-leaf) entity types are an aggregate of metrics for
              their children.
        confidenceLevelMetrics:
          description: Metrics across confidence levels with fuzzy matching enabled.
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDocumentaiV1EvaluationConfidenceLevelMetrics
        auprc:
          description: >-
            The calculated area under the precision recall curve (AUPRC),
            computed by integrating over all confidence thresholds.
          type: number
          format: float
        estimatedCalibrationErrorExact:
          type: number
          description: >-
            The ECE for the predicted entities with fuzzy matching disabled,
            i.e., exact matching only.
          format: float
        confidenceLevelMetricsExact:
          description: Metrics across confidence levels with only exact matching.
          type: array
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDocumentaiV1EvaluationConfidenceLevelMetrics
    GoogleCloudDocumentaiV1beta3DocumentIdGCSManagedDocumentId:
      id: GoogleCloudDocumentaiV1beta3DocumentIdGCSManagedDocumentId
      description: >-
        Identifies a document uniquely within the scope of a dataset in the
        user-managed Cloud Storage option.
      type: object
      properties:
        gcsUri:
          type: string
          description: Required. The Cloud Storage URI where the actual document is stored.
        cwDocId:
          type: string
          description: ID of the document (indexed) managed by Content Warehouse.
          deprecated: true
    GoogleCloudDocumentaiV1DocumentPageTokenDetectedBreak:
      type: object
      id: GoogleCloudDocumentaiV1DocumentPageTokenDetectedBreak
      description: Detected break at the end of a Token.
      properties:
        type:
          type: string
          description: Detected break type.
          enum:
            - TYPE_UNSPECIFIED
            - SPACE
            - WIDE_SPACE
            - HYPHEN
          enumDescriptions:
            - Unspecified break type.
            - A single whitespace.
            - A wider whitespace.
            - A hyphen that indicates that a token has been split across lines.
