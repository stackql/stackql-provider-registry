    GoogleTypeDateTime:
      id: GoogleTypeDateTime
      description: >-
        Represents civil time (or occasionally physical time). This type can
        represent a civil time in one of a few possible ways: * When utc_offset
        is set and time_zone is unset: a civil time on a calendar day with a
        particular offset from UTC. * When time_zone is set and utc_offset is
        unset: a civil time on a calendar day in a particular time zone. * When
        neither time_zone nor utc_offset is set: a civil time on a calendar day
        in local time. The date is relative to the Proleptic Gregorian Calendar.
        If year, month, or day are 0, the DateTime is considered not to have a
        specific year, month, or day respectively. This type may also be used to
        represent a physical time if all the date and time fields are set and
        either case of the `time_offset` oneof is set. Consider using
        `Timestamp` message for physical time instead. If your use case also
        would like to store the user's timezone, that can be done in another
        field. This type is more flexible than some applications may want. Make
        sure to document and validate your application's limitations.
      type: object
      properties:
        timeZone:
          description: Time zone.
          $ref: '#/components/schemas/GoogleTypeTimeZone'
        utcOffset:
          type: string
          description: >-
            UTC offset. Must be whole seconds, between -18 hours and +18 hours.
            For example, a UTC offset of -4:00 would be represented as {
            seconds: -14400 }.
          format: google-duration
        month:
          type: integer
          description: >-
            Optional. Month of year. Must be from 1 to 12, or 0 if specifying a
            datetime without a month.
          format: int32
        seconds:
          type: integer
          description: >-
            Optional. Seconds of minutes of the time. Must normally be from 0 to
            59, defaults to 0. An API may allow the value 60 if it allows
            leap-seconds.
          format: int32
        hours:
          description: >-
            Optional. Hours of day in 24 hour format. Should be from 0 to 23,
            defaults to 0 (midnight). An API may choose to allow the value
            "24:00:00" for scenarios like business closing time.
          type: integer
          format: int32
        nanos:
          description: >-
            Optional. Fractions of seconds in nanoseconds. Must be from 0 to
            999,999,999, defaults to 0.
          type: integer
          format: int32
        year:
          type: integer
          description: >-
            Optional. Year of date. Must be from 1 to 9999, or 0 if specifying a
            datetime without a year.
          format: int32
        day:
          format: int32
          type: integer
          description: >-
            Optional. Day of month. Must be from 1 to 31 and valid for the year
            and month, or 0 if specifying a datetime without a day.
        minutes:
          format: int32
          type: integer
          description: >-
            Optional. Minutes of hour of day. Must be from 0 to 59, defaults to
            0.
    GoogleCloudDocumentaiV1beta3Processor:
      properties:
        defaultProcessorVersion:
          type: string
          description: The default processor version.
        kmsKeyName:
          description: >-
            The [KMS key](https://cloud.google.com/security-key-management) used
            for encryption and decryption in CMEK scenarios.
          type: string
        displayName:
          description: The display name of the processor.
          type: string
        satisfiesPzs:
          type: boolean
          description: Output only. Reserved for future use.
          readOnly: true
        activeSchemaVersion:
          type: string
          description: >-
            Optional. SchemaVersion used by the Processor. It is the same as
            Processor's DatasetSchema.schema_version Format is
            `projects/{project}/locations/{location}/schemas/{schema}/schemaVersions/{schema_version}.
        processEndpoint:
          type: string
          description: >-
            Output only. Immutable. The http endpoint that can be called to
            invoke processing.
          readOnly: true
        type:
          description: >-
            The processor type, such as: `OCR_PROCESSOR`, `INVOICE_PROCESSOR`.
            To get a list of processor types, see FetchProcessorTypes.
          type: string
        satisfiesPzi:
          readOnly: true
          description: Output only. Reserved for future use.
          type: boolean
        createTime:
          readOnly: true
          format: google-datetime
          description: Output only. The time the processor was created.
          type: string
        processorVersionAliases:
          type: array
          description: Output only. The processor version aliases.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDocumentaiV1beta3ProcessorVersionAlias
          readOnly: true
        name:
          type: string
          description: >-
            Output only. Immutable. The resource name of the processor. Format:
            `projects/{project}/locations/{location}/processors/{processor}`
          readOnly: true
        state:
          type: string
          enumDescriptions:
            - The processor is in an unspecified state.
            - >-
              The processor is enabled, i.e., has an enabled version which can
              currently serve processing requests and all the feature
              dependencies have been successfully initialized.
            - The processor is disabled.
            - >-
              The processor is being enabled, will become `ENABLED` if
              successful.
            - >-
              The processor is being disabled, will become `DISABLED` if
              successful.
            - >-
              The processor is being created, will become either `ENABLED` (for
              successful creation) or `FAILED` (for failed ones). Once a
              processor is in this state, it can then be used for document
              processing, but the feature dependencies of the processor might
              not be fully created yet.
            - >-
              The processor failed during creation or initialization of feature
              dependencies. The user should delete the processor and recreate
              one as all the functionalities of the processor are disabled.
            - The processor is being deleted, will be removed if successful.
          readOnly: true
          description: Output only. The state of the processor.
          enum:
            - STATE_UNSPECIFIED
            - ENABLED
            - DISABLED
            - ENABLING
            - DISABLING
            - CREATING
            - FAILED
            - DELETING
      id: GoogleCloudDocumentaiV1beta3Processor
      description: >-
        The first-class citizen for Document AI. Each processor defines how to
        extract structural information from a document.
      type: object
