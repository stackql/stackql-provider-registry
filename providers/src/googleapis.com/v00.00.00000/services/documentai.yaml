            detection algorithm, which serves as an alternative to the current
            ML-based layout detection algorithm. Customers can choose the best
            suitable layout algorithm based on their situation.
          type: array
          items:
            type: string
        hints:
          description: Hints for the OCR model.
          $ref: '#/components/schemas/GoogleCloudDocumentaiV1OcrConfigHints'
      type: object
      id: GoogleCloudDocumentaiV1OcrConfig
      description: Config for Document OCR.
