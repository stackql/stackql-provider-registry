    GoogleCloudDocumentaiUiv1beta3DocumentSchemaEntityTypeProperty:
      type: object
      id: GoogleCloudDocumentaiUiv1beta3DocumentSchemaEntityTypeProperty
      description: Defines properties that can be part of the entity type.
      properties:
        valueType:
          type: string
          description: >-
            A reference to the value type of the property. This type is subject
            to the same conventions as the `Entity.base_types` field.
        name:
          type: string
          description: >-
            The name of the property. Follows the same guidelines as the
            EntityType name.
        description:
          type: string
          description: >-
            The description of the property. Could be used to provide more
            information about the property for model calls.
        displayName:
          type: string
          description: User defined name for the property.
        occurrenceType:
          enumDescriptions:
            - Unspecified occurrence type.
            - >-
              There will be zero or one instance of this entity type. The same
              entity instance may be mentioned multiple times.
            - The entity type will appear zero or multiple times.
            - >-
              The entity type will only appear exactly once. The same entity
              instance may be mentioned multiple times.
            - The entity type will appear once or more times.
          type: string
          description: >-
            Occurrence type limits the number of instances an entity type
            appears in the document.
          enum:
            - OCCURRENCE_TYPE_UNSPECIFIED
            - OPTIONAL_ONCE
            - OPTIONAL_MULTIPLE
            - REQUIRED_ONCE
            - REQUIRED_MULTIPLE
        method:
          enumDescriptions:
            - Unspecified method. It defaults to `EXTRACT`.
            - >-
              The entity's value is directly extracted as-is from the document
              text.
            - >-
              The entity's value is derived through inference and is not
              necessarily an exact text extraction from the document.
            - >-
              Attempts to extract the position and value as-is from the document
              text. If the value cannot be grounded in the text, it falls back
              to derivation through inference, for both position and value.
              Note: The inference fallback is currently only supported for
              boolean entities.
          description: Specifies how the entity's value is obtained.
          enum:
            - METHOD_UNSPECIFIED
            - EXTRACT
            - DERIVE
            - RELAXED_EXTRACT
          type: string
        propertyMetadata:
          description: Any additional metadata about the property can be added here.
          $ref: '#/components/schemas/GoogleCloudDocumentaiUiv1beta3PropertyMetadata'
