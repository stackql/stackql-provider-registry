          items:
            $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentEntity'
          description: >-
            Optional. Entities can be nested to form a hierarchical data
            structure representing the content in the document.
          type: array
        normalizedValue:
          description: >-
            Optional. Normalized entity value. Absent if the extracted value
            could not be converted or the type (for example, address) is not
            supported for certain parsers. This field is also only populated for
            certain supported document types.
          $ref: >-
            #/components/schemas/GoogleCloudDocumentaiV1DocumentEntityNormalizedValue
        id:
          description: >-
            Optional. Canonical id. This will be a unique value in the entity
            list for this document.
          type: string
        method:
          description: Optional. Specifies how the entity's value is obtained.
          enum:
            - METHOD_UNSPECIFIED
            - EXTRACT
            - DERIVE
          type: string
          enumDescriptions:
            - >-
              When the method is not specified, it should be treated as
              `EXTRACT`.
            - >-
              The entity's value is directly extracted as-is from the document
              text.
            - >-
              The entity's value is derived through inference and is not
              necessarily an exact text extraction from the document.
        mentionId:
          type: string
          description: Optional. Deprecated. Use `id` field instead.
        type:
          type: string
          description: Required. Entity type from a schema, for example, `Address`.
        pageAnchor:
          description: >-
            Optional. Represents the provenance of this entity wrt. the location
            on the page where it was found.
          $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentPageAnchor'
      id: GoogleCloudDocumentaiV1DocumentEntity
      description: >-
        An entity that could be a phrase in the text or a property that belongs
        to the document. It is a known entity type, such as a person, an
        organization, or location.
      type: object
    GoogleCloudDocumentaiUiv1beta3FieldExtractionMetadataEntityQuery:
