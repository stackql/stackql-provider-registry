    GoogleCloudDocumentaiV1Document:
      id: GoogleCloudDocumentaiV1Document
      description: >-
        Document represents the canonical document resource in Document AI. It
        is an interchange format that provides insights into documents and
        allows for collaboration between users and Document AI to iterate and
        optimize for quality.
      type: object
      properties:
        pages:
          description: Visual page layout for the Document.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentPage'
        entitiesRevisionId:
          type: string
          description: >-
            The entity revision ID that `document.entities` field is based on.
            If this field and `entities_revisions` are set, the entities in
            `document.entities` are the entities in the entity revision with
            this ID. The `document.entity_validation_output` field is the
            `entity_validation_output` field in this entity revision.
        revisions:
          items:
            $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentRevision'
          type: array
          description: Placeholder. Revision history of this document.
        uri:
          type: string
          description: >-
            Optional. Currently supports Google Cloud Storage URI of the form
            `gs://bucket_name/object_name`. Object versioning is not supported.
            For more information, refer to [Google Cloud Storage Request
            URIs](https://cloud.google.com/storage/docs/reference-uris).
        entitiesRevisions:
          items:
            $ref: >-
              #/components/schemas/GoogleCloudDocumentaiV1DocumentEntitiesRevision
          description: >-
            A list of entity revisions. The entity revisions are appended to the
            document in the processing order. This field can be used for
            comparing the entity extraction results at different stages of the
            processing.
          type: array
        entityRelations:
          items:
            $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentEntityRelation'
          description: Placeholder. Relationship among Document.entities.
          type: array
        content:
          format: byte
          type: string
          description: >-
            Optional. Inline document content, represented as a stream of bytes.
            Note: As with all `bytes` fields, protobuffers use a pure binary
            representation, whereas JSON representations use base64.
        mimeType:
          description: >-
            An IANA published [media type (MIME
            type)](https://www.iana.org/assignments/media-types/media-types.xhtml).
          type: string
        textChanges:
          items:
            $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentTextChange'
          type: array
          description: >-
            Placeholder. A list of text corrections made to Document.text. This
            is usually used for annotating corrections to OCR mistakes. Text
            changes for a given revision may not overlap with each other.
        entityValidationOutput:
          description: >-
            The entity validation output for the document. This is the
            validation output for `document.entities` field.
          $ref: >-
            #/components/schemas/GoogleCloudDocumentaiV1DocumentEntityValidationOutput
        blobAssets:
          items:
            $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentBlobAsset'
          type: array
          description: >-
            Optional. The blob assets in this document. This is used to store
            the content of the inline blobs in this document, for example, image
            bytes, such that it can be referenced by other fields in the
            document via asset ID.
        documentLayout:
          description: Parsed layout of the document.
          $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentDocumentLayout'
        chunkedDocument:
          description: Document chunked based on chunking config.
          $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentChunkedDocument'
        textStyles:
          description: Styles for the Document.text.
          deprecated: true
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentStyle'
        entities:
          description: >-
            A list of entities detected on Document.text. For document shards,
            entities in this list may cross shard boundaries.
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDocumentaiV1DocumentEntity'
        docid:
          description: >-
            Optional. An internal identifier for document. Should be loggable
            (no PII).
          type: string
        text:
          description: Optional. UTF-8 encoded text in reading order from the document.
          type: string
        error:
          description: Any error that occurred while processing this document.
          $ref: '#/components/schemas/GoogleRpcStatus'
        shardInfo:
          description: >-
