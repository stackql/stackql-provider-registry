    GoogleCloudDocumentaiUiv1beta3ProcessorVersion:
      id: GoogleCloudDocumentaiUiv1beta3ProcessorVersion
      description: >-
        A processor version is an implementation of a processor. Each processor
        can have multiple versions, pretrained by Google internally or uptrained
        by the customer. A processor can only have one default version at a
        time. Its document-processing behavior is defined by that version.
      type: object
      properties:
        satisfiesPzi:
          description: Output only. Reserved for future use.
          type: boolean
          readOnly: true
        documentSchema:
          readOnly: true
          description: >-
            Output only. The schema of the processor version. Describes the
            output.
          $ref: '#/components/schemas/GoogleCloudDocumentaiUiv1beta3DocumentSchema'
        createTime:
          description: Output only. The time the processor version was created.
          type: string
          readOnly: true
          format: google-datetime
        kmsKeyName:
          type: string
          description: Output only. The KMS key name used for encryption.
          readOnly: true
        googleManaged:
          readOnly: true
          type: boolean
          description: >-
            Output only. Denotes that this `ProcessorVersion` is managed by
            Google.
        displayName:
          type: string
          description: The display name of the processor version.
        satisfiesPzs:
          type: boolean
          description: Output only. Reserved for future use.
          readOnly: true
        genAiModelInfo:
          description: >-
            Output only. Information about Generative AI model-based processor
            versions.
          $ref: >-
            #/components/schemas/GoogleCloudDocumentaiUiv1beta3ProcessorVersionGenAiModelInfo
          readOnly: true
        state:
          enumDescriptions:
            - The processor version is in an unspecified state.
            - The processor version is deployed and can be used for processing.
            - The processor version is being deployed.
            - >-
              The processor version is not deployed and cannot be used for
              processing.
            - The processor version is being undeployed.
            - The processor version is being created.
            - The processor version is being deleted.
            - The processor version failed and is in an indeterminate state.
            - The processor version is being imported.
          readOnly: true
          description: Output only. The state of the processor version.
          enum:
            - STATE_UNSPECIFIED
            - DEPLOYED
            - DEPLOYING
            - UNDEPLOYED
            - UNDEPLOYING
            - CREATING
            - DELETING
            - FAILED
            - IMPORTING
          type: string
        schema:
          description: The schema of the processor version. Describes the output.
          $ref: '#/components/schemas/GoogleCloudDocumentaiUiv1beta3Schema'
        deploymentAllowed:
          readOnly: true
          description: >-
            Output only. Denotes that this `ProcessorVersion` can be deployed
            and undeployed.
          type: boolean
        kmsKeyVersionName:
          description: Output only. The KMS key version with which data is encrypted.
          type: string
          readOnly: true
        name:
          description: >-
            Identifier. The resource name of the processor version. Format:
            `projects/{project}/locations/{location}/processors/{processor}/processorVersions/{processor_version}`
          type: string
        deprecationInfo:
          description: >-
            Output only. If set, information about the eventual deprecation of
            this version.
          $ref: >-
            #/components/schemas/GoogleCloudDocumentaiUiv1beta3ProcessorVersionDeprecationInfo
          readOnly: true
        latestEvaluation:
          readOnly: true
          description: >-
            Output only. The most recently invoked evaluation for the processor
            version.
          $ref: >-
            #/components/schemas/GoogleCloudDocumentaiUiv1beta3EvaluationReference
        modelType:
          type: string
          description: Output only. The model type of this processor version.
          enum:
            - MODEL_TYPE_UNSPECIFIED
            - MODEL_TYPE_GENERATIVE
            - MODEL_TYPE_CUSTOM
          enumDescriptions:
            - The processor version has unspecified model type.
            - The processor version has generative model type.
            - The processor version has custom model type.
          readOnly: true
