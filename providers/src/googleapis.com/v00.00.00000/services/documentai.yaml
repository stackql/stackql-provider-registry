        name:
          description: >-
            The name of the property. Follows the same guidelines as the
            EntityType name.
          type: string
        description:
          type: string
          description: >-
            The description of the property. Could be used to provide more
            information about the property for model calls.
        displayName:
          type: string
          description: User defined name for the property.
        occurrenceType:
          enumDescriptions:
            - Unspecified occurrence type.
            - >-
              There will be zero or one instance of this entity type. The same
              entity instance may be mentioned multiple times.
            - The entity type will appear zero or multiple times.
            - >-
              The entity type will only appear exactly once. The same entity
              instance may be mentioned multiple times.
            - The entity type will appear once or more times.
          description: >-
            Occurrence type limits the number of instances an entity type
            appears in the document.
          enum:
            - OCCURRENCE_TYPE_UNSPECIFIED
            - OPTIONAL_ONCE
            - OPTIONAL_MULTIPLE
            - REQUIRED_ONCE
            - REQUIRED_MULTIPLE
          type: string
