            $ref: >-
              #/components/schemas/GoogleCloudDocumentaiUiv1beta3ProcessorVersionAlias
          readOnly: true
        name:
          readOnly: true
          description: >-
            Output only. Immutable. The resource name of the processor. Format:
            `projects/{project}/locations/{location}/processors/{processor}`
          type: string
        state:
          type: string
          description: Output only. The state of the processor.
          enum:
            - STATE_UNSPECIFIED
            - ENABLED
            - DISABLED
            - ENABLING
            - DISABLING
            - CREATING
            - FAILED
            - DELETING
          enumDescriptions:
            - The processor is in an unspecified state.
            - >-
              The processor is enabled, i.e., has an enabled version which can
              currently serve processing requests and all the feature
              dependencies have been successfully initialized.
            - The processor is disabled.
            - >-
              The processor is being enabled, will become `ENABLED` if
              successful.
            - >-
              The processor is being disabled, will become `DISABLED` if
              successful.
            - >-
              The processor is being created, will become either `ENABLED` (for
              successful creation) or `FAILED` (for failed ones). Once a
              processor is in this state, it can then be used for document
              processing, but the feature dependencies of the processor might
              not be fully created yet.
            - >-
              The processor failed during creation or initialization of feature
              dependencies. The user should delete the processor and recreate
              one as all the functionalities of the processor are disabled.
            - The processor is being deleted, will be removed if successful.
          readOnly: true
