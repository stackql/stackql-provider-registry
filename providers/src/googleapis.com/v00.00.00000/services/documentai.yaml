    GoogleCloudDocumentaiUiv1beta3DocumentSchemaMetadata:
      properties:
        documentAllowMultipleLabels:
          description: >-
            If true, on a given page, there can be multiple `document`
            annotations covering it.
          type: boolean
        skipNamingValidation:
          type: boolean
          description: >-
            If set, this will skip the naming format validation in the schema.
            So the string values in `DocumentSchema.EntityType.name` and
            `DocumentSchema.EntityType.Property.name` will not be checked.
        prefixedNamingOnProperties:
          description: If set, all the nested entities must be prefixed with the parents.
          type: boolean
        documentSplitter:
          type: boolean
          description: >-
            If true, a `document` entity type can be applied to subdocument
            (splitting). Otherwise, it can only be applied to the entire
            document (classification).
      id: GoogleCloudDocumentaiUiv1beta3DocumentSchemaMetadata
      description: Metadata for global schema behavior.
