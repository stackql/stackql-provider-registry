    GoogleCloudDocumentaiV1OcrConfig:
      properties:
        enableSymbol:
          type: boolean
          description: Includes symbol level OCR information if set to true.
        enableNativePdfParsing:
          type: boolean
          description: >-
            Enables special handling for PDFs with existing text information.
            Results in better text extraction quality in such PDF inputs.
        premiumFeatures:
          description: Configurations for premium OCR features.
          $ref: '#/components/schemas/GoogleCloudDocumentaiV1OcrConfigPremiumFeatures'
        disableCharacterBoxesDetection:
          description: >-
            Turn off character box detector in OCR engine. Character box
            detection is enabled by default in OCR 2.0 (and later) processors.
          type: boolean
        computeStyleInfo:
          type: boolean
          description: >-
            Turn on font identification model and return font style information.
            Deprecated, use PremiumFeatures.compute_style_info instead.
          deprecated: true
        enableImageQualityScores:
          type: boolean
          description: >-
            Enables intelligent document quality scores after OCR. Can help with
            diagnosing why OCR responses are of poor quality for a given input.
            Adds additional latency comparable to regular OCR to the process
            call.
        advancedOcrOptions:
          description: >-
            A list of advanced OCR options to further fine-tune OCR behavior.
