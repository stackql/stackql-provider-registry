      id: GoogleCloudDocumentaiV1DocumentChunkedDocumentChunkImageChunkField
      description: The image chunk field in the chunk.
      type: object
    GoogleCloudDocumentaiV1DocumentSchemaEntityTypeProperty:
      properties:
        name:
          type: string
          description: >-
            The name of the property. Follows the same guidelines as the
            EntityType name.
        displayName:
          type: string
          description: User defined name for the property.
        occurrenceType:
          enumDescriptions:
            - Unspecified occurrence type.
            - >-
              There will be zero or one instance of this entity type. The same
              entity instance may be mentioned multiple times.
            - The entity type will appear zero or multiple times.
            - >-
              The entity type will only appear exactly once. The same entity
              instance may be mentioned multiple times.
            - The entity type will appear once or more times.
          description: >-
            Occurrence type limits the number of instances an entity type
            appears in the document.
          enum:
            - OCCURRENCE_TYPE_UNSPECIFIED
            - OPTIONAL_ONCE
            - OPTIONAL_MULTIPLE
            - REQUIRED_ONCE
            - REQUIRED_MULTIPLE
          type: string
        valueType:
          description: >-
            A reference to the value type of the property. This type is subject
            to the same conventions as the `Entity.base_types` field.
          type: string
        method:
          enumDescriptions:
            - Unspecified method. It defaults to `EXTRACT`.
            - >-
              The entity's value is directly extracted as-is from the document
              text.
            - >-
              The entity's value is derived through inference and is not
              necessarily an exact text extraction from the document.
            - >-
              Attempts to extract the position and value as-is from the document
              text. If the value cannot be grounded in the text, it falls back
              to derivation through inference, for both position and value.
              Note: The inference fallback is currently only supported for
              boolean entities.
          description: Specifies how the entity's value is obtained.
          enum:
            - METHOD_UNSPECIFIED
            - EXTRACT
            - DERIVE
            - RELAXED_EXTRACT
          type: string
      type: object
      id: GoogleCloudDocumentaiV1DocumentSchemaEntityTypeProperty
      description: Defines properties that can be part of the entity type.
    GoogleLongrunningOperation:
      properties:
        error:
          description: >-
            The error result of the operation in case of failure or
            cancellation.
          $ref: '#/components/schemas/GoogleRpcStatus'
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        metadata:
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
        response:
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
        name:
          type: string
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
      id: GoogleLongrunningOperation
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      type: object
