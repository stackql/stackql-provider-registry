            `heading-5`, `header`, `footer`.
      id: >-
        GoogleCloudDocumentaiV1DocumentDocumentLayoutDocumentLayoutBlockLayoutTextBlock
      description: Represents a text type block.
      type: object
    GoogleCloudDocumentaiUiv1beta3DocumentId:
