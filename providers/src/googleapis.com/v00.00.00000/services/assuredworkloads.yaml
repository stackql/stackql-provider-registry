            values
          items:
            type: string
          type: array
        instructions:
          $ref: >-
            #/components/schemas/GoogleCloudAssuredworkloadsV1ViolationRemediationInstructions
          description: Required. Remediation instructions to resolve violations
        remediationType:
          description: >-
            Output only. Reemediation type based on the type of org policy
            values violated
          enum:
            - REMEDIATION_TYPE_UNSPECIFIED
            - REMEDIATION_BOOLEAN_ORG_POLICY_VIOLATION
            - REMEDIATION_LIST_ALLOWED_VALUES_ORG_POLICY_VIOLATION
            - REMEDIATION_LIST_DENIED_VALUES_ORG_POLICY_VIOLATION
            - REMEDIATION_RESTRICT_CMEK_CRYPTO_KEY_PROJECTS_ORG_POLICY_VIOLATION
            - REMEDIATION_RESOURCE_VIOLATION
            - REMEDIATION_RESOURCE_VIOLATION_NON_CMEK_SERVICES
          enumDescriptions:
            - Unspecified remediation type
            - Remediation type for boolean org policy
            - >-
              Remediation type for list org policy which have allowed values in
              the monitoring rule
            - >-
              Remediation type for list org policy which have denied values in
              the monitoring rule
            - Remediation type for gcp.restrictCmekCryptoKeyProjects
            - Remediation type for resource violation.
            - >-
              Remediation type for resource violation due to
              gcp.restrictNonCmekServices
          readOnly: true
          type: string
      type: object
    GoogleCloudAssuredworkloadsV1ViolationRemediationInstructions:
