    GoogleCloudAssuredworkloadsV1OrgPolicy:
      description: >-
        This assured workload service object is used to represent the org policy
        attached to a resource. It servces the same purpose as the
        orgpolicy.v2.Policy object but with functionality that is limited to
        what is supported by Assured Workloads(e.g. only one rule under one
        OrgPolicy object, no conditions, etc).
      id: GoogleCloudAssuredworkloadsV1OrgPolicy
      properties:
        constraint:
          description: >-
            The constraint name of the OrgPolicy. e.g.
            "constraints/gcp.resourceLocations".
          type: string
        inherit:
          description: >-
            If `inherit` is true, policy rules of the lowest ancestor in the
            resource hierarchy chain are inherited. If it is false, policy rules
            are not inherited.
          type: boolean
        reset:
          description: >-
            Ignores policies set above this resource and restores to the
            `constraint_default` value. `reset` can only be true when `rules` is
            empty and `inherit` is false.
          type: boolean
        resource:
          description: >-
            Resource that the OrgPolicy attaches to. Format: folders/123"
            projects/123".
          type: string
        rule:
          $ref: >-
            #/components/schemas/GoogleCloudAssuredworkloadsV1OrgPolicyPolicyRule
          description: The rule of the OrgPolicy.
      type: object
    GoogleCloudAssuredworkloadsV1OrgPolicyPolicyRule:
      description: A rule used to express this policy.
      id: GoogleCloudAssuredworkloadsV1OrgPolicyPolicyRule
      properties:
        allowAll:
          description: ListPolicy only when all values are allowed.
          type: boolean
        denyAll:
          description: ListPolicy only when all values are denied.
          type: boolean
        enforce:
          description: BooleanPolicy only.
          type: boolean
        values:
          $ref: >-
            #/components/schemas/GoogleCloudAssuredworkloadsV1OrgPolicyPolicyRuleStringValues
          description: ListPolicy only when custom values are specified.
      type: object
    GoogleCloudAssuredworkloadsV1OrgPolicyPolicyRuleStringValues:
      description: The values allowed for a ListPolicy.
      id: GoogleCloudAssuredworkloadsV1OrgPolicyPolicyRuleStringValues
      properties:
        allowedValues:
          description: List of values allowed at this resource.
          items:
            type: string
          type: array
        deniedValues:
          description: List of values denied at this resource.
          items:
            type: string
          type: array
      type: object
    GoogleCloudAssuredworkloadsV1OrgPolicyUpdate:
      description: >-
        Represents an update for an org policy control applied on an Assured
        Workload resource. The inherited org policy is not considered.
      id: GoogleCloudAssuredworkloadsV1OrgPolicyUpdate
      properties:
        appliedPolicy:
          $ref: '#/components/schemas/GoogleCloudAssuredworkloadsV1OrgPolicy'
