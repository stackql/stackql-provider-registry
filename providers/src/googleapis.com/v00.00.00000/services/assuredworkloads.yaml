          description: The list of cloud control reports.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudAssuredworkloadsV1CloudControlReport
          type: array
        complianceFrameworks:
          description: The list of compliance frameworks that the control belongs to.
          items:
            type: string
          type: array
        control:
          description: The name of the control.
          type: string
        controlResponsibilityType:
          description: The responsibility type for the control.
          enum:
            - REGULATORY_CONTROL_RESPONSIBILITY_TYPE_UNSPECIFIED
            - GOOGLE
            - CUSTOMER
            - SHARED
          enumDescriptions:
            - Default value. This value is unused.
            - Google's responsibility.
            - Your responsibility.
            - Shared responsibility.
          type: string
        description:
          description: The description of the control.
          type: string
        displayName:
          description: The display name of the control.
          type: string
        isFakeControl:
          description: >-
            Whether the control is a fake control. Fake controls are created and
            mapped to cloud controls that don't belong to a control group.
          type: boolean
        name:
          description: Identifier. The name of the control compliance summary.
          type: string
        overallEvaluationState:
          description: Output only. The overall evaluation status of the control.
          enum:
            - EVALUATION_STATE_UNSPECIFIED
            - EVALUATION_STATE_PASSED
            - EVALUATION_STATE_FAILED
            - EVALUATION_STATE_NOT_ASSESSED
          enumDescriptions:
            - Default value. This value is unused.
            - The control is passing.
            - The control is failing.
            - The control is not assessed.
          readOnly: true
          type: string
        similarControls:
          description: The list of similar controls.
          items:
            $ref: '#/components/schemas/GoogleCloudAssuredworkloadsV1SimilarControls'
          type: array
        totalFindingsCount:
          description: The total number of findings for the control.
          format: int32
          type: integer
      type: object
    GoogleCloudAssuredworkloadsV1DbFindingSummary:
      description: The details for a finding.
      id: GoogleCloudAssuredworkloadsV1DbFindingSummary
      properties:
        findingCategory:
          description: Output only. The category of the finding.
          readOnly: true
          type: string
        findingClass:
          description: Output only. The class of the finding.
          enum:
            - FINDING_CLASS_UNSPECIFIED
            - THREAT
            - VULNERABILITY
            - MISCONFIGURATION
            - OBSERVATION
            - SCC_ERROR
            - POSTURE_VIOLATION
            - TOXIC_COMBINATION
            - SENSITIVE_DATA_RISK
            - CHOKEPOINT
          enumDescriptions:
            - Default value. This value is unused.
            - The activity is unwanted or malicious.
            - >-
              A potential weakness in software that increases risk to
              confidentiality, integrity, and availability.
            - >-
              A potential weakness in a cloud resource or asset configuration
              that increases risk.
            - A security observation that is for informational purposes.
            - >-
              An error that prevents Security Command Center from functioning
              properly.
            - >-
              A potential security risk that's due to a change in the security
              posture.
            - >-
              A combination of security issues that represent a more severe
              security problem when taken together.
            - >-
              A potential security risk to data assets that contain sensitive
              data.
            - >-
              A resource or resource group where high risk attack paths
              converge, based on attack path simulations (APS).
          readOnly: true
          type: string
        findingCount:
          description: Output only. The count of the finding.
          format: int64
          readOnly: true
          type: string
        name:
          description: Identifier. The name of the finding summary.
          type: string
        organizationPolicyFindingCount:
          description: >-
            Output only. Number of active organization policy findings for this
            category.
          format: int64
          readOnly: true
          type: string
        relatedFrameworks:
          description: >-
            Optional. The list of compliance frameworks that the finding belongs
            to.
          items:
            type: string
          type: array
        resourceFindingCount:
          description: Output only. Number of active resource findings for this category.
          format: int64
          readOnly: true
          type: string
        severity:
          description: Output only. The severity of the finding.
          enum:
            - SEVERITY_UNSPECIFIED
            - CRITICAL
            - HIGH
            - MEDIUM
            - LOW
          enumDescriptions:
            - Default value. This value is unused.
            - >-
              A critical vulnerability is easily discoverable by an external
              actor, exploitable, and results in the direct ability to execute
              arbitrary code, exfiltrate data, and otherwise gain additional
              access and privileges to cloud resources and workloads. Examples
              include publicly accessible unprotected user data and public SSH
              access with weak or no passwords. A critical threat is a threat
              that can access, modify, or delete data or execute unauthorized
              code within existing resources.
            - >-
              A high-risk vulnerability can be easily discovered and exploited
              in combination with other vulnerabilities to gain direct access
              and the ability to execute arbitrary code, exfiltrate data, and
              otherwise gain additional access and privileges to cloud resources
              and workloads. An example is a database with weak or no passwords
              that is only accessible internally. This database could easily be
              compromised by an actor that had access to the internal network. A
              high-risk threat is a threat that can create new computational
              resources in an environment but can't access data or execute code
              in existing resources.
            - >-
              A medium-risk vulnerability can be used by an actor to gain access
              to resources or privileges that enable them to eventually (through
              multiple steps or a complex exploit) gain access and the ability
              to execute arbitrary code or exfiltrate data. An example is a
              service account with access to more projects than it should have.
              If an actor gains access to the service account, they could
              potentially use that access to manipulate a project the service
              account was not intended to. A medium-risk threat can cause
              operational impact but might not access data or execute
              unauthorized code.
            - >-
              A low-risk vulnerability hampers a security organization's ability
              to detect vulnerabilities or active threats in their deployment,
              or prevents the root cause investigation of security issues. An
              example is monitoring and logs being disabled for resource
              configurations and access. A low-risk threat is a threat that has
              obtained minimal access to an environment but can't access data,
              execute code, or create resources.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The last updated time of the finding.
          format: google-datetime
          readOnly: true
          type: string
      type: object
