components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    GoogleCloudAssuredworkloadsV1AcknowledgeViolationRequest:
      description: Request for acknowledging the violation
      id: GoogleCloudAssuredworkloadsV1AcknowledgeViolationRequest
      properties:
        acknowledgeType:
          description: Optional. Acknowledge type of specified violation.
          enum:
            - ACKNOWLEDGE_TYPE_UNSPECIFIED
            - SINGLE_VIOLATION
            - EXISTING_CHILD_RESOURCE_VIOLATIONS
          enumDescriptions:
            - Acknowledge type unspecified.
            - Acknowledge only the specific violation.
            - >-
              Acknowledge specified orgPolicy violation and also associated
              resource violations.
          type: string
        comment:
          description: >-
            Required. Business justification explaining the need for violation
            acknowledgement
          type: string
        nonCompliantOrgPolicy:
          deprecated: true
          description: >-
            Optional. This field is deprecated and will be removed in future
            version of the API. Name of the OrgPolicy which was modified with
            non-compliant change and resulted in this violation. Format:
            projects/{project_number}/policies/{constraint_name}
            folders/{folder_id}/policies/{constraint_name}
            organizations/{organization_id}/policies/{constraint_name}
          type: string
      type: object
    GoogleCloudAssuredworkloadsV1AcknowledgeViolationResponse:
      description: Response for violation acknowledgement
      id: GoogleCloudAssuredworkloadsV1AcknowledgeViolationResponse
      properties: {}
      type: object
    GoogleCloudAssuredworkloadsV1AggregateDbFrameworkComplianceReportResponse:
      description: The response message for AggregateDbFrameworkComplianceReport.
      id: >-
        GoogleCloudAssuredworkloadsV1AggregateDbFrameworkComplianceReportResponse
      properties:
        aggregatedComplianceReports:
          description: The list of aggregated compliance reports.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudAssuredworkloadsV1AggregatedComplianceReport
          type: array
      type: object
    GoogleCloudAssuredworkloadsV1AggregatedComplianceReport:
      description: The aggregated compliance report.
      id: GoogleCloudAssuredworkloadsV1AggregatedComplianceReport
      properties:
        controlAssessmentDetails:
          $ref: >-
            #/components/schemas/GoogleCloudAssuredworkloadsV1ControlAssessmentDetails
          description: The control assessment details of the framework.
        reportTime:
          description: The report time of the aggregated compliance report.
          format: google-datetime
          type: string
      type: object
    GoogleCloudAssuredworkloadsV1AnalyzeWorkloadMoveResponse:
      description: >-
        Response containing the analysis results for the hypothetical resource
        move.
      id: GoogleCloudAssuredworkloadsV1AnalyzeWorkloadMoveResponse
      properties:
        assetMoveAnalyses:
          description: List of analysis results for each asset in scope.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudAssuredworkloadsV1AssetMoveAnalysis
          type: array
        nextPageToken:
          description: The next page token. Is empty if the last page is reached.
          type: string
      type: object
    GoogleCloudAssuredworkloadsV1ApplyWorkloadUpdateOperationMetadata:
      description: Operation metadata to give request details of ApplyWorkloadUpdate.
      id: GoogleCloudAssuredworkloadsV1ApplyWorkloadUpdateOperationMetadata
      properties:
        action:
          description: Optional. The time the operation was created.
          enum:
            - WORKLOAD_UPDATE_ACTION_UNSPECIFIED
            - APPLY
          enumDescriptions:
            - Unspecified value.
            - The update is applied.
          type: string
        createTime:
          description: Optional. Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        updateName:
          description: Required. The resource name of the update
          type: string
      type: object
    GoogleCloudAssuredworkloadsV1ApplyWorkloadUpdateRequest:
      description: Request to apply update to a workload.
      id: GoogleCloudAssuredworkloadsV1ApplyWorkloadUpdateRequest
      properties:
        action:
          description: The action to be performed on the update.
          enum:
            - WORKLOAD_UPDATE_ACTION_UNSPECIFIED
            - APPLY
          enumDescriptions:
            - Unspecified value.
            - The update is applied.
          type: string
      type: object
    GoogleCloudAssuredworkloadsV1ApplyWorkloadUpdateResponse:
      description: Response for ApplyWorkloadUpdate endpoint.
      id: GoogleCloudAssuredworkloadsV1ApplyWorkloadUpdateResponse
      properties:
        appliedUpdate:
          $ref: '#/components/schemas/GoogleCloudAssuredworkloadsV1WorkloadUpdate'
          description: The update that was applied.
      type: object
    GoogleCloudAssuredworkloadsV1ArchiveResourceEventsRequest:
      description: Request for archiving resource events.
      id: GoogleCloudAssuredworkloadsV1ArchiveResourceEventsRequest
      properties:
        archiveTime:
          description: >-
            Optional. Time to set as ArchiveTime in the archive table. If not
            provided, the current time is used.
          format: google-datetime
          type: string
        batchSize:
          description: >-
            Required. The number of events to process in a single transaction
            batch.
          format: int32
          type: integer
        eventCutoffTime:
          description: >-
            Required. Only events with EventTime earlier than this cutoff will
            be archived.
          format: google-datetime
          type: string
        maxEventsMove:
          description: >-
            Required. The maximum total number of events to move in this
            request.
          format: int32
          type: integer
        organizationId:
          description: Required. The organization ID for which to archive events.
          format: int64
          type: string
        region:
          description: >-
            Required. The region of the workload(s) whose events should be
            archived. This is used to filter workloads based on
            AssurantWorkloadData.region.
          type: string
      type: object
    GoogleCloudAssuredworkloadsV1ArchiveResourceEventsResponse:
      description: Response for archiving resource events.
      id: GoogleCloudAssuredworkloadsV1ArchiveResourceEventsResponse
      properties:
        movedEventsCount:
          description: The total number of events successfully moved to the archive table.
          format: int32
          type: integer
      type: object
    GoogleCloudAssuredworkloadsV1AssetMoveAnalysis:
      description: Represents move analysis results for an asset.
      id: GoogleCloudAssuredworkloadsV1AssetMoveAnalysis
      properties:
        analysisGroups:
          description: List of eligible analyses performed for the asset.
          items:
            $ref: >-
              #/components/schemas/GoogleCloudAssuredworkloadsV1MoveAnalysisGroup
          type: array
        asset:
          description: >-
            The full resource name of the asset being analyzed. Example:
            //compute.googleapis.com/projects/my_project_123/zones/zone1/instances/instance1
          type: string
        assetType:
          description: >-
            Type of the asset being analyzed. Possible values will be among the
            ones listed
            [here](https://cloud.google.com/asset-inventory/docs/supported-asset-types).
          type: string
      type: object
    GoogleCloudAssuredworkloadsV1CELExpression:
      description: >-
        A Common Expression Language (CEL) expression that's used to create a
        rule.
      id: GoogleCloudAssuredworkloadsV1CELExpression
      properties:
        expression:
          description: >-
            Required. The logical expression in CEL. The maximum length of the
            condition is 1000 characters. For more information, see [CEL
            expression](https://cloud.google.com/security-command-center/docs/compliance-manager-write-cel-expressions).
          type: string
        resourceTypesValues:
          $ref: '#/components/schemas/GoogleCloudAssuredworkloadsV1StringList'
          description: >-
            The resource instance types on which this expression is defined. The
            format is `/`. For example: `compute.googleapis.com/Instance`
      type: object
    GoogleCloudAssuredworkloadsV1CloudControlAssessmentDetails:
      description: The cloud control assessment details for non-manual cloud controls.
      id: GoogleCloudAssuredworkloadsV1CloudControlAssessmentDetails
      properties:
        evaluationState:
          description: Output only. The evaluation status of the cloud control.
          enum:
            - EVALUATION_STATE_UNSPECIFIED
            - EVALUATION_STATE_PASSED
            - EVALUATION_STATE_FAILED
            - EVALUATION_STATE_NOT_ASSESSED
          enumDescriptions:
            - Default value. This value is unused.
            - The control is passing.
            - The control is failing.
            - The control is not assessed.
          readOnly: true
          type: string
        findingsCount:
          description: The number of findings for the cloud control.
          format: int32
          type: integer
      type: object
    GoogleCloudAssuredworkloadsV1CloudControlReport:
      description: The cloud control report.
      id: GoogleCloudAssuredworkloadsV1CloudControlReport
      properties:
        categories:
          description: The list of categories for the cloud control.
          items:
            type: string
          type: array
        cloudControl:
          description: The name of the cloud control.
          type: string
        cloudControlAssessmentDetails:
          $ref: >-
            #/components/schemas/GoogleCloudAssuredworkloadsV1CloudControlAssessmentDetails
          description: The details of a cloud control assessment.
        cloudControlDeployment:
          description: The name of the cloud control deployment.
          type: string
        cloudControlType:
          description: The type of the cloud control.
          enum:
            - TYPE_UNSPECIFIED
            - CUSTOM
            - BUILT_IN
          enumDescriptions:
            - Default value. This value is unused.
            - A cloud control that's created and managed by you.
            - A cloud control that's provided and managed by Google.
          type: string
        description:
          description: The description of the cloud control.
          type: string
        displayName:
          description: The display name of the cloud control.
          type: string
        enforcementMode:
          description: The enforcement mode of the cloud control.
          enum:
            - ENFORCEMENT_MODE_UNSPECIFIED
            - PREVENTIVE
            - DETECTIVE
            - AUDIT
          enumDescriptions:
            - Default value. This value is unused.
            - The cloud control is enforced to prevent non-compliance.
            - The cloud control is enforced to detect non-compliance.
            - The cloud control is enforced to audit for non-compliance.
          type: string
        findingCategory:
          description: The category of the finding.
          type: string
        findingSeverity:
          description: The severity of the finding.
          enum:
            - SEVERITY_UNSPECIFIED
            - CRITICAL
            - HIGH
            - MEDIUM
            - LOW
          enumDescriptions:
            - Default value. This value is unused.
            - >-
              A critical vulnerability is easily discoverable by an external
              actor, exploitable, and results in the direct ability to execute
              arbitrary code, exfiltrate data, and otherwise gain additional
              access and privileges to cloud resources and workloads. Examples
              include publicly accessible unprotected user data and public SSH
              access with weak or no passwords. A critical threat is a threat
              that can access, modify, or delete data or execute unauthorized
              code within existing resources.
            - >-
              A high-risk vulnerability can be easily discovered and exploited
              in combination with other vulnerabilities to gain direct access
              and the ability to execute arbitrary code, exfiltrate data, and
              otherwise gain additional access and privileges to cloud resources
              and workloads. An example is a database with weak or no passwords
              that is only accessible internally. This database could easily be
              compromised by an actor that had access to the internal network. A
              high-risk threat is a threat that can create new computational
              resources in an environment but can't access data or execute code
              in existing resources.
            - >-
              A medium-risk vulnerability can be used by an actor to gain access
              to resources or privileges that enable them to eventually (through
              multiple steps or a complex exploit) gain access and the ability
              to execute arbitrary code or exfiltrate data. An example is a
              service account with access to more projects than it should have.
              If an actor gains access to the service account, they could
              potentially use that access to manipulate a project the service
              account was not intended to. A medium-risk threat can cause
              operational impact but might not access data or execute
              unauthorized code.
            - >-
              A low-risk vulnerability hampers a security organization's ability
              to detect vulnerabilities or active threats in their deployment,
              or prevents the root cause investigation of security issues. An
              example is monitoring and logs being disabled for resource
              configurations and access. A low-risk threat is a threat that has
              obtained minimal access to an environment but can't access data,
              execute code, or create resources.
          type: string
        frameworkMajorRevisionIds:
          description: >-
            The major revision IDs of the frameworks that the cloud control
            belongs to.
          items:
            format: int64
            type: string
          type: array
        majorRevisionId:
          description: The major revision ID of the cloud control.
          format: int64
          type: string
        manualCloudControlAssessmentDetails:
          $ref: >-
            #/components/schemas/GoogleCloudAssuredworkloadsV1ManualCloudControlAssessmentDetails
          description: The details of a manual cloud control assessment.
        minorRevisionId:
          description: The minor revision ID of the cloud control.
          format: int64
          type: string
        rules:
          description: The list of rules that correspond to the cloud control.
          items:
            $ref: '#/components/schemas/GoogleCloudAssuredworkloadsV1Rule'
          type: array
        similarControls:
          description: The list of similar controls.
          items:
            $ref: '#/components/schemas/GoogleCloudAssuredworkloadsV1SimilarControls'
          type: array
      type: object
    GoogleCloudAssuredworkloadsV1ControlAssessmentDetails:
      description: The details for a control assessment.
      id: GoogleCloudAssuredworkloadsV1ControlAssessmentDetails
      properties:
        assessedPassingControlIds:
          description: The list of controls that were assessed and are passing.
          items:
            type: string
          type: array
        assessedPassingControls:
          description: The number of controls that were assessed and are passing.
          format: int32
          type: integer
        failingControlIds:
          description: The list of controls that are failing.
          items:
            type: string
          type: array
        failingControls:
          description: The number of controls that are failing.
          format: int32
          type: integer
        notAssessedControlIds:
          description: >-
            The list of controls that aren't assessed because they require
            manual review.
          items:
            type: string
          type: array
        notAssessedControls:
          description: >-
