      properties:
        maxAdditionalSubscriptions:
          format: int32
          description: >-
            Optional. Maximum number of additional subscriptions to use for the
            migration job.
          type: integer
        isNativeLogical:
          description: Required. Whether the migration is native logical.
          type: boolean
    OracleToPostgresConfig:
      description: >-
        Configuration for heterogeneous **Oracle to Cloud SQL for PostgreSQL**
        and **Oracle to AlloyDB for PostgreSQL** migrations.
      properties:
        oracleSourceConfig:
          $ref: '#/components/schemas/OracleSourceConfig'
