            - NUMERIC_FILTER_OPTION_ALL
            - NUMERIC_FILTER_OPTION_LIMIT
            - NUMERIC_FILTER_OPTION_LIMITLESS
          enumDescriptions:
            - Numeric filter option unspecified
            - Numeric filter option that matches all numeric columns.
            - >-
              Numeric filter option that matches columns having numeric
              datatypes with specified precision and scale within the limited
              range of filter.
            - >-
              Numeric filter option that matches only the numeric columns with
              no precision and scale specified.
        sourceMinScaleFilter:
          type: integer
          description: >-
            Optional. The filter will match columns with scale greater than or
            equal to this number.
          format: int32
        sourceMinPrecisionFilter:
          format: int32
          description: >-
            Optional. The filter will match columns with precision greater than
            or equal to this number.
          type: integer
        sourceMaxPrecisionFilter:
          type: integer
          description: >-
            Optional. The filter will match columns with precision smaller than
            or equal to this number.
          format: int32
        sourceMaxScaleFilter:
          description: >-
            Optional. The filter will match columns with scale smaller than or
            equal to this number.
          type: integer
          format: int32
      id: SourceNumericFilter
    RequestInfo:
      type: object
      description: >-
