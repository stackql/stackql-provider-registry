    GoogleCloudClouddmsV1OperationMetadata:
      description: Represents the metadata of the long-running operation.
      properties:
        statusMessage:
          readOnly: true
          description: Output only. Human-readable status of the operation, if any.
          type: string
        verb:
          type: string
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
        apiVersion:
          readOnly: true
          description: Output only. API version used to start the operation.
          type: string
        endTime:
          format: google-datetime
          readOnly: true
          description: Output only. The time the operation finished running.
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          type: string
          readOnly: true
        metadata:
          readOnly: true
          additionalProperties:
            type: string
          type: object
          description: >-
            Output only. Additional metadata that is returned by the backend for
            the operation.
        requestedCancellation:
          type: boolean
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have successfully been cancelled
            have google.longrunning.Operation.error value with a
            google.rpc.Status.code of 1, corresponding to `Code.CANCELLED`.
          readOnly: true
        createTime:
          description: Output only. The time the operation was created.
          type: string
          format: google-datetime
          readOnly: true
      type: object
      id: GoogleCloudClouddmsV1OperationMetadata
    Status:
      id: Status
      type: object
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      properties:
        message:
          type: string
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          type: integer
          format: int32
        details:
          items:
            type: object
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          type: array
    MigrationJobVerificationError:
      id: MigrationJobVerificationError
      description: Error message of a verification Migration job.
      properties:
        errorCode:
          enum:
            - ERROR_CODE_UNSPECIFIED
            - CONNECTION_FAILURE
            - AUTHENTICATION_FAILURE
            - INVALID_CONNECTION_PROFILE_CONFIG
            - VERSION_INCOMPATIBILITY
            - CONNECTION_PROFILE_TYPES_INCOMPATIBILITY
            - NO_PGLOGICAL_INSTALLED
            - PGLOGICAL_NODE_ALREADY_EXISTS
            - INVALID_WAL_LEVEL
            - INVALID_SHARED_PRELOAD_LIBRARY
            - INSUFFICIENT_MAX_REPLICATION_SLOTS
            - INSUFFICIENT_MAX_WAL_SENDERS
            - INSUFFICIENT_MAX_WORKER_PROCESSES
            - UNSUPPORTED_EXTENSIONS
            - UNSUPPORTED_MIGRATION_TYPE
            - INVALID_RDS_LOGICAL_REPLICATION
            - UNSUPPORTED_GTID_MODE
            - UNSUPPORTED_TABLE_DEFINITION
            - UNSUPPORTED_DEFINER
            - CANT_RESTART_RUNNING_MIGRATION
            - SOURCE_ALREADY_SETUP
            - TABLES_WITH_LIMITED_SUPPORT
            - UNSUPPORTED_DATABASE_LOCALE
            - UNSUPPORTED_DATABASE_FDW_CONFIG
            - ERROR_RDBMS
            - SOURCE_SIZE_EXCEEDS_THRESHOLD
            - EXISTING_CONFLICTING_DATABASES
            - PARALLEL_IMPORT_INSUFFICIENT_PRIVILEGE
            - EXISTING_DATA
            - SOURCE_MAX_SUBSCRIPTIONS
          enumDescriptions:
            - An unknown error occurred
            - We failed to connect to one of the connection profile.
            - We failed to authenticate to one of the connection profile.
            - >-
              One of the involved connection profiles has an invalid
              configuration.
            - The versions of the source and the destination are incompatible.
            - The types of the source and the destination are incompatible.
            - >-
              No pglogical extension installed on databases, applicable for
              postgres.
            - >-
              pglogical node already exists on databases, applicable for
              postgres.
            - The value of parameter wal_level is not set to logical.
            - >-
              The value of parameter shared_preload_libraries does not include
              pglogical.
            - The value of parameter max_replication_slots is not sufficient.
            - The value of parameter max_wal_senders is not sufficient.
            - The value of parameter max_worker_processes is not sufficient.
            - >-
              Extensions installed are either not supported or having
              unsupported versions.
            - Unsupported migration type.
            - Invalid RDS logical replication.
            - The gtid_mode is not supported, applicable for MySQL.
            - >-
              The table definition is not support due to missing primary key or
              replica identity.
            - The definer is not supported.
            - Migration is already running at the time of restart request.
            - The source already has a replication setup.
            - >-
              The source has tables with limited support. E.g. PostgreSQL tables
              without primary keys.
            - The source uses an unsupported locale.
            - The source uses an unsupported Foreign Data Wrapper configuration.
            - There was an underlying RDBMS error.
            - >-
              The source DB size in Bytes exceeds a certain threshold. The
              migration might require an increase of quota, or might not be
              supported.
            - >-
              The destination DB contains existing databases that are
              conflicting with those in the source DB.
            - Insufficient privilege to enable the parallelism configuration.
            - >-
              The destination instance contains existing data or user defined
              entities (for example databases, tables, or functions). You can
              only migrate to empty instances. Clear your destination instance
              and retry the migration job.
            - >-
              The migration job is configured to use max number of subscriptions
              to migrate data from the source to the destination.
          readOnly: true
          description: >-
            Output only. An instance of ErrorCode specifying the error that
            occurred.
          type: string
        errorDetailMessage:
          readOnly: true
          description: >-
            Output only. A specific detailed error message, if supplied by the
            engine.
          type: string
        errorMessage:
          readOnly: true
          type: string
          description: >-
            Output only. A formatted message with further details about the
            error and a CTA.
      type: object
    MultiEntityRename:
      id: MultiEntityRename
      description: >-
        Options to configure rule type MultiEntityRename. The rule is used to
        rename multiple entities. The rule filter field can refer to one or more
        entities. The rule scope can be one of: Database, Schema, Table, Column,
        Constraint, Index, View, Function, Stored Procedure, Materialized View,
        Sequence, UDT
      properties:
        newNamePattern:
          type: string
          description: >-
            Optional. The pattern used to generate the new entity's name. This
            pattern must include the characters '{name}', which will be replaced
            with the name of the original entity. For example, the pattern
            't_{name}' for an entity name jobs would be converted to 't_jobs'.
            If unspecified, the default value for this field is '{name}'
        sourceNameTransformation:
          type: string
          enum:
            - ENTITY_NAME_TRANSFORMATION_UNSPECIFIED
            - ENTITY_NAME_TRANSFORMATION_NO_TRANSFORMATION
            - ENTITY_NAME_TRANSFORMATION_LOWER_CASE
            - ENTITY_NAME_TRANSFORMATION_UPPER_CASE
            - ENTITY_NAME_TRANSFORMATION_CAPITALIZED_CASE
          description: >-
            Optional. Additional transformation that can be done on the source
            entity name before it is being used by the new_name_pattern, for
            example lower case. If no transformation is desired, use
            NO_TRANSFORMATION
          enumDescriptions:
            - Entity name transformation unspecified.
            - No transformation.
            - Transform to lower case.
            - Transform to upper case.
            - Transform to capitalized case.
      type: object
    LogFileDirectories:
