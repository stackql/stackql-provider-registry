      id: RequestInfo
    SingleColumnChange:
      type: object
      description: >-
        Options to configure rule type SingleColumnChange. The rule is used to
        change the properties of a column. The rule filter field can refer to
        one entity. The rule scope can be one of: Column. When using this rule,
        if a field is not specified than the destination column's configuration
        will be the same as the one in the source column..
      properties:
        precision:
          description: >-
            Optional. Column precision - e.g. 8 as in double (8,2) - when
            relevant.
          type: integer
          format: int32
        udt:
          type: boolean
          description: Optional. Is the column a UDT (User-defined Type).
        array:
          description: Optional. Is the column of array type.
          type: boolean
        nullable:
          description: Optional. Is the column nullable.
          type: boolean
        collation:
          description: Optional. Collation override - instead of table level collation.
          type: string
        customFeatures:
          additionalProperties:
            type: any
            description: Properties of the object.
          type: object
          description: Optional. Custom engine specific features.
        setValues:
          items:
            type: string
          description: Optional. Specifies the list of values allowed in the column.
          type: array
        dataType:
          type: string
          description: Optional. Column data type name.
        scale:
          type: integer
          description: Optional. Column scale - e.g. 2 as in double (8,2) - when relevant.
          format: int32
        autoGenerated:
          type: boolean
          description: Optional. Is the column auto-generated/identity.
        fractionalSecondsPrecision:
          format: int32
          type: integer
          description: >-
            Optional. Column fractional seconds precision - e.g. 2 as in
            timestamp (2) - when relevant.
        length:
          format: int64
          description: >-
            Optional. Column length - e.g. 50 as in varchar (50) - when
            relevant.
          type: string
        charset:
          type: string
          description: Optional. Charset override - instead of table level charset.
        arrayLength:
          description: >-
            Optional. The length of the array, only relevant if the column type
            is an array.
          type: integer
          format: int32
        comment:
          description: Optional. Comment associated with the column.
          type: string
      id: SingleColumnChange
    PscInterfaceConfig:
