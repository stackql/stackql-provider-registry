openapi: 3.1.0
info:
  contact:
    name: StackQL Studios
    url: https://github.com/stackql/google-discovery-to-openapi
    email: info@stackql.io
  title: Database Migration API
  description: Manage Cloud Database Migration Service resources on Google Cloud Platform.
  version: v1
  x-discovery-doc-revision: '20260706'
  x-generated-date: '2026-07-31'
externalDocs:
  url: https://cloud.google.com/database-migration/
servers:
  - url: https://datamigration.googleapis.com
components:
  securitySchemes:
    Oauth2:
      type: oauth2
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
    Oauth2c:
      type: oauth2
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://accounts.google.com/o/oauth2/token
          scopes: *ref_0
  schemas:
    SqlServerEncryptionOptions:
      type: object
      description: Encryption settings for the SQL Server database.
      properties:
        pvkPath:
          type: string
          description: >-
            Required. Path to the Certificate Private Key (.pvk) in Cloud
            Storage, in the form `gs://bucketName/fileName`. The instance must
            have write permissions to the bucket and read access to the file.
        pvkPassword:
          description: Required. Input only. Password that encrypts the private key.
          type: string
        certPath:
          description: >-
            Required. Path to the Certificate (.cer) in Cloud Storage, in the
            form `gs://bucketName/fileName`. The instance must have write
            permissions to the bucket and read access to the file.
          type: string
      id: SqlServerEncryptionOptions
    DescribeConversionWorkspaceRevisionsResponse:
      id: DescribeConversionWorkspaceRevisionsResponse
      description: Response message for 'DescribeConversionWorkspaceRevisions' request.
      properties:
        revisions:
          type: array
          description: The list of conversion workspace revisions.
          items:
            $ref: '#/components/schemas/ConversionWorkspace'
      type: object
    SqlServerDatabaseBackup:
      id: SqlServerDatabaseBackup
      type: object
      description: >-
        Specifies the backup details for a single database in Cloud Storage for
        homogeneous migration to Cloud SQL for SQL Server.
      properties:
        encryptionOptions:
          $ref: '#/components/schemas/SqlServerEncryptionOptions'
          description: >-
            Optional. Encryption settings for the database. Required if provided
            database backups are encrypted. Encryption settings include path to
            certificate, path to certificate private key, and key password.
        database:
          type: string
          description: >-
            Required. Name of a SQL Server database for which to define backup
            configuration.
    VpcPeeringConfig:
      description: >-
        The VPC peering configuration is used to create VPC peering with the
        consumer's VPC.
      properties:
        vpcName:
          description: >-
            Required. Fully qualified name of the VPC that Database Migration
            Service will peer to.
          type: string
        subnet:
          type: string
          description: Required. A free subnet for peering. (CIDR of /29)
      type: object
      id: VpcPeeringConfig
    Help:
      id: Help
      description: >-
        Provides links to documentation or for performing an out of band action.
        For example, if a quota check failed with an error indicating the
        calling project hasn't enabled the accessed service, this can contain a
        URL pointing directly to the right place in the developer console to
        flip the bit.
      properties:
        links:
          type: array
          description: >-
            URL(s) pointing to additional information on handling the current
            error.
          items:
            $ref: '#/components/schemas/Link'
      type: object
    MachineConfig:
      type: object
      description: MachineConfig describes the configuration of a machine.
      properties:
        machineType:
          description: >-
            Optional. Machine type of the VM instance. E.g. "n2-highmem-4",
            "n2-highmem-8", "c4a-highmem-4-lssd". cpu_count must match the
            number of vCPUs in the machine type.
          type: string
        cpuCount:
          format: int32
          description: The number of CPU's in the VM instance.
          type: integer
      id: MachineConfig
    PrivateConnectivity:
      id: PrivateConnectivity
      description: Private Connectivity.
      properties:
        privateConnection:
          description: Required. The resource name (URI) of the private connection.
          type: string
      type: object
    AlloyDbSettings:
      id: AlloyDbSettings
      description: Settings for creating an AlloyDB cluster.
      properties:
        encryptionConfig:
          $ref: '#/components/schemas/EncryptionConfig'
          description: >-
            Optional. The encryption config can be specified to encrypt the data
            disks and other persistent data resources of a cluster with a
            customer-managed encryption key (CMEK). When this field is not
            specified, the cluster will then use default encryption scheme to
            protect the user data.
        initialUser:
          $ref: '#/components/schemas/UserPassword'
          description: >-
            Required. Input only. Initial user to setup during cluster creation.
            Required.
        vpcNetwork:
          description: >-
            Required. The resource link for the VPC network in which cluster
            resources are created and from which they are accessible via Private
            IP. The network must belong to the same project as the cluster. It
            is specified in the form:
            "projects/{project_number}/global/networks/{network_id}". This is
            required to create a cluster.
          type: string
        databaseVersion:
          enumDescriptions:
            - This is an unknown database version.
            - The database version is Postgres 14.
            - The database version is Postgres 15.
            - The database version is Postgres 16.
            - The database version is Postgres 17.
            - The database version is Postgres 18.
          description: >-
            Optional. The database engine major version. This is an optional
            field. If a database version is not supplied at cluster creation
            time, then a default database version will be used.
          type: string
          enum:
            - DATABASE_VERSION_UNSPECIFIED
            - POSTGRES_14
            - POSTGRES_15
            - POSTGRES_16
            - POSTGRES_17
            - POSTGRES_18
        primaryInstanceSettings:
          $ref: '#/components/schemas/PrimaryInstanceSettings'
          description: Settings for the cluster's primary instance
        labels:
          additionalProperties:
            type: string
          description: >-
            Labels for the AlloyDB cluster created by DMS. An object containing
            a list of 'key', 'value' pairs.
          type: object
      type: object
    ImportRulesJobDetails:
      id: ImportRulesJobDetails
      description: Details regarding an Import Rules background job.
      properties:
        files:
          readOnly: true
          items:
            type: string
          type: array
          description: Output only. File names used for the import rules job.
        fileFormat:
          type: string
          description: Output only. The requested file format.
          readOnly: true
          enumDescriptions:
            - Unspecified rules format.
            - HarbourBridge session file.
            - Ora2Pg configuration file.
          enum:
            - IMPORT_RULES_FILE_FORMAT_UNSPECIFIED
            - IMPORT_RULES_FILE_FORMAT_HARBOUR_BRIDGE_SESSION_FILE
            - IMPORT_RULES_FILE_FORMAT_ORATOPG_CONFIG_FILE
      type: object
    ValueListFilter:
      id: ValueListFilter
      type: object
      description: A list of values to filter by in ConditionalColumnSetValue
      properties:
        ignoreCase:
          type: boolean
          description: >-
            Required. Whether to ignore case when filtering by values. Defaults
            to false
        valuePresentList:
          type: string
          enum:
            - VALUE_PRESENT_IN_LIST_UNSPECIFIED
            - VALUE_PRESENT_IN_LIST_IF_VALUE_LIST
            - VALUE_PRESENT_IN_LIST_IF_VALUE_NOT_LIST
          description: >-
            Required. Indicates whether the filter matches rows with values that
            are present in the list or those with values not present in it.
          enumDescriptions:
            - Value present in list unspecified
            - If the source value is in the supplied list at value_list
            - If the source value is not in the supplied list at value_list
        values:
          description: Required. The list to be used to filter by
          type: array
          items:
            type: string
    StaticServiceIpConnectivity:
      id: StaticServiceIpConnectivity
      description: Static IP address connectivity configured on service project.
      properties: {}
      type: object
    ImportMappingRulesRequest:
      description: Request message for 'ImportMappingRules' request.
      properties:
        autoCommit:
          type: boolean
          description: >-
            Required. Should the conversion workspace be committed automatically
            after the import operation.
        rulesFiles:
          items:
            $ref: '#/components/schemas/RulesFile'
          type: array
          description: Required. One or more rules files.
        rulesFormat:
          description: Required. The format of the rules content file.
          type: string
          enum:
            - IMPORT_RULES_FILE_FORMAT_UNSPECIFIED
            - IMPORT_RULES_FILE_FORMAT_HARBOUR_BRIDGE_SESSION_FILE
            - IMPORT_RULES_FILE_FORMAT_ORATOPG_CONFIG_FILE
          enumDescriptions:
            - Unspecified rules format.
            - HarbourBridge session file.
            - Ora2Pg configuration file.
      type: object
      id: ImportMappingRulesRequest
    Link:
      id: Link
      type: object
      description: Describes a URL link.
      properties:
        description:
          description: Describes what the link offers.
          type: string
        url:
          description: The URL of the link.
          type: string
    AuditConfig:
      type: object
      description: >-
        Specifies the audit configuration for a service. The configuration
        determines which permission types are logged, and what identities, if
        any, are exempted from logging. An AuditConfig must have one or more
        AuditLogConfigs. If there are AuditConfigs for both `allServices` and a
        specific service, the union of the two AuditConfigs is used for that
        service: the log_types specified in each AuditConfig are enabled, and
        the exempted_members in each AuditLogConfig are exempted. Example Policy
        with multiple AuditConfigs: { "audit_configs": [ { "service":
        "allServices", "audit_log_configs": [ { "log_type": "DATA_READ",
        "exempted_members": [ "user:jose@example.com" ] }, { "log_type":
        "DATA_WRITE" }, { "log_type": "ADMIN_READ" } ] }, { "service":
        "sampleservice.googleapis.com", "audit_log_configs": [ { "log_type":
        "DATA_READ" }, { "log_type": "DATA_WRITE", "exempted_members": [
        "user:aliya@example.com" ] } ] } ] } For sampleservice, this policy
        enables DATA_READ, DATA_WRITE and ADMIN_READ logging. It also exempts
        `jose@example.com` from DATA_READ logging, and `aliya@example.com` from
        DATA_WRITE logging.
      properties:
        service:
          description: >-
            Specifies a service that will be enabled for audit logging. For
            example, `storage.googleapis.com`, `cloudsql.googleapis.com`.
            `allServices` is a special value that covers all services.
          type: string
        auditLogConfigs:
          type: array
          description: The configuration for logging of each type of permission.
          items:
            $ref: '#/components/schemas/AuditLogConfig'
      id: AuditConfig
    SshScript:
      id: SshScript
      description: Response message for 'GenerateSshScript' request.
      properties:
        script:
          type: string
          description: The ssh configuration script.
      type: object
    CloudSqlConnectionProfile:
      id: CloudSqlConnectionProfile
      type: object
      description: >-
        Specifies required connection parameters, and, optionally, the
        parameters required to create a Cloud SQL destination database instance.
      properties:
        settings:
          $ref: '#/components/schemas/CloudSqlSettings'
          description: >-
            Immutable. Metadata used to create the destination Cloud SQL
            database.
        privateIp:
          description: Output only. The Cloud SQL database instance's private IP.
          type: string
          readOnly: true
        cloudSqlId:
          readOnly: true
          description: >-
            Output only. The Cloud SQL instance ID that this connection profile
            is associated with.
          type: string
        publicIp:
          readOnly: true
          type: string
          description: Output only. The Cloud SQL database instance's public IP.
        additionalPublicIp:
          readOnly: true
          type: string
          description: >-
            Output only. The Cloud SQL database instance's additional (outgoing)
            public IP. Used when the Cloud SQL database availability type is
            REGIONAL (i.e. multiple zones / highly available).
    MySqlHomogeneousConfig:
      description: Configuration for MySQL to MySQL migrations.
      properties:
        isPrimaryDestination:
          type: boolean
          description: >-
            Optional. Whether the destination for the migration job is a primary
            instance.
      type: object
      id: MySqlHomogeneousConfig
    StaticIpConnectivity:
      type: object
      description: >-
        The source database will allow incoming connections from the public IP
        of the destination database. You can retrieve the public IP of the Cloud
        SQL instance from the Cloud SQL console or using Cloud SQL APIs. No
        additional configuration is required.
      properties: {}
      id: StaticIpConnectivity
    SequenceEntity:
      id: SequenceEntity
      type: object
      description: Sequence's parent is a schema.
      properties:
        increment:
          type: string
          description: Increment value for the sequence.
          format: int64
        cycle:
          type: boolean
          description: Indicates whether the sequence value should cycle through.
        customFeatures:
          additionalProperties:
            type: any
            description: Properties of the object.
          type: object
          description: Custom engine specific features.
        maxValue:
          format: byte
          description: >-
            Maximum number for the sequence represented as bytes to accommodate
            large. numbers
          type: string
        startValue:
          format: byte
          description: >-
            Start number for the sequence represented as bytes to accommodate
            large. numbers
          type: string
        minValue:
          type: string
          description: >-
            Minimum number for the sequence represented as bytes to accommodate
            large. numbers
          format: byte
        cache:
          description: Indicates number of entries to cache / precreate.
          type: string
          format: int64
    PerformanceConfig:
      id: PerformanceConfig
      type: object
      description: Performance configuration definition.
      properties:
        dumpParallelLevel:
          enumDescriptions:
            - Unknown dump parallel level. Will be defaulted to OPTIMAL.
            - Minimal parallel level.
            - Optimal parallel level.
            - Maximum parallel level.
          type: string
          enum:
            - DUMP_PARALLEL_LEVEL_UNSPECIFIED
            - MIN
            - OPTIMAL
            - MAX
          description: Initial dump parallelism level.
    BinaryLogParser:
      type: object
      description: Configuration to use Binary Log Parser CDC technique.
      properties:
        logFileDirectories:
          $ref: '#/components/schemas/LogFileDirectories'
          description: Use Oracle directories.
        oracleAsmLogFileAccess:
          description: Use Oracle ASM.
          $ref: '#/components/schemas/OracleAsmLogFileAccess'
      id: BinaryLogParser
    SinglePackageChange:
      description: >-
        Options to configure rule type SinglePackageChange. The rule is used to
        alter the sql code for a package entities. The rule filter field can
        refer to one entity. The rule scope can be: Package
      properties:
        packageDescription:
          type: string
          description: Optional. Sql code for package description
        packageBody:
          description: Optional. Sql code for package body
          type: string
      type: object
      id: SinglePackageChange
    RoundToScale:
      type: object
      description: >-
        This allows the data to change scale, for example if the source is 2
        digits after the decimal point, specify round to scale value = 2. If for
        example the value needs to be converted to an integer, use round to
        scale value = 0.
      properties:
        scale:
          format: int32
          description: Required. Scale value to be used
          type: integer
      id: RoundToScale
    DumpFlag:
      type: object
      description: Dump flag definition.
      properties:
        name:
          type: string
          description: The name of the flag
        value:
          type: string
          description: The value of the flag.
      id: DumpFlag
    VmSelectionConfig:
      type: object
      description: VM selection configuration message
      properties:
        vmZone:
          description: Required. The Google Cloud Platform zone the VM is located.
          type: string
      id: VmSelectionConfig
    ConditionalColumnSetValue:
      id: ConditionalColumnSetValue
      type: object
      description: >-
        Options to configure rule type ConditionalColumnSetValue. The rule is
        used to transform the data which is being replicated/migrated. The rule
        filter field can refer to one or more entities. The rule scope can be
        one of: Column.
      properties:
        sourceTextFilter:
          $ref: '#/components/schemas/SourceTextFilter'
          description: >-
            Optional. Optional filter on source column length. Used for text
            based data types like varchar.
        customFeatures:
          description: Optional. Custom engine specific features.
          type: object
          additionalProperties:
            description: Properties of the object.
            type: any
        sourceNumericFilter:
          $ref: '#/components/schemas/SourceNumericFilter'
          description: >-
            Optional. Optional filter on source column precision and scale. Used
            for fixed point numbers such as NUMERIC/NUMBER data types.
        valueTransformation:
          description: Required. Description of data transformation during migration.
          $ref: '#/components/schemas/ValueTransformation'
    ApplyConversionWorkspaceRequest:
      id: ApplyConversionWorkspaceRequest
      description: Request message for 'ApplyConversionWorkspace' request.
      properties:
        dryRun:
          description: >-
            Optional. Only validates the apply process, but doesn't change the
            destination database. Only works for PostgreSQL destination
            connection profile.
          type: boolean
        autoCommit:
          type: boolean
          description: >-
            Optional. Specifies whether the conversion workspace is to be
            committed automatically after the apply.
        connectionProfile:
          type: string
          description: >-
            Optional. Fully qualified (Uri) name of the destination connection
            profile.
        filter:
          type: string
          description: >-
            Optional. Filter which entities to apply. Leaving this field empty
            will apply all of the entities. Supports Google AIP 160 based
            filtering.
      type: object
    FetchStaticIpsResponse:
      id: FetchStaticIpsResponse
      type: object
      description: Response message for a 'FetchStaticIps' request.
      properties:
        staticIps:
          items:
            type: string
          description: List of static IPs.
          type: array
        nextPageToken:
          description: >-
            A token that can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
          type: string
    CancelOperationRequest:
      type: object
      description: The request message for Operations.CancelOperation.
      properties: {}
      id: CancelOperationRequest
    ConversionWorkspace:
      description: The main conversion workspace resource entity.
      properties:
        source:
          $ref: '#/components/schemas/DatabaseEngineInfo'
          description: Required. The source engine details.
        updateTime:
          description: >-
            Output only. The timestamp when the workspace resource was last
            updated.
          type: string
          format: google-datetime
          readOnly: true
        name:
          description: >-
            Full name of the workspace resource, in the form of:
            projects/{project}/locations/{location}/conversionWorkspaces/{conversion_workspace}.
          type: string
        latestCommitId:
          description: Output only. The latest commit ID.
          type: string
          readOnly: true
        hasUncommittedChanges:
          description: >-
            Output only. Whether the workspace has uncommitted changes (changes
            which were made after the workspace was committed).
          type: boolean
          readOnly: true
        createTime:
          type: string
          description: Output only. The timestamp when the workspace resource was created.
          readOnly: true
          format: google-datetime
        displayName:
          type: string
          description: Optional. The display name for the workspace.
        latestCommitTime:
          format: google-datetime
          readOnly: true
          description: Output only. The timestamp when the workspace was committed.
          type: string
        globalSettings:
          additionalProperties:
            type: string
          description: >-
            Optional. A generic list of settings for the workspace. The settings
            are database pair dependant and can indicate default behavior for
            the mapping rules engine or turn on or off specific features. Such
            examples can be: convert_foreign_key_to_interleave=true,
            skip_triggers=false, ignore_non_table_synonyms=true
          type: object
        sourceProvider:
          description: Optional. The provider for the source database.
          type: string
          enum:
            - DATABASE_PROVIDER_UNSPECIFIED
            - CLOUDSQL
            - RDS
            - AURORA
            - ALLOYDB
            - AZURE_DATABASE
          enumDescriptions:
            - >-
              Use this value for on-premise source database instances and
              ORACLE.
            - Cloud SQL is the source instance provider.
            - Amazon RDS is the source instance provider.
            - Amazon Aurora is the source instance provider.
            - AlloyDB for PostgreSQL is the source instance provider.
            - Microsoft Azure Database for MySQL/PostgreSQL.
        destinationProvider:
          enumDescriptions:
            - >-
              Use this value for on-premise source database instances and
              ORACLE.
            - Cloud SQL is the source instance provider.
            - Amazon RDS is the source instance provider.
            - Amazon Aurora is the source instance provider.
            - AlloyDB for PostgreSQL is the source instance provider.
            - Microsoft Azure Database for MySQL/PostgreSQL.
          type: string
          enum:
            - DATABASE_PROVIDER_UNSPECIFIED
            - CLOUDSQL
            - RDS
            - AURORA
            - ALLOYDB
            - AZURE_DATABASE
          description: Optional. The provider for the destination database.
        destination:
          $ref: '#/components/schemas/DatabaseEngineInfo'
          description: Required. The destination engine details.
      type: object
      id: ConversionWorkspace
    EntityDdl:
      type: object
      description: A single DDL statement for a specific entity
      properties:
        entity:
          type: string
          description: The name of the database entity the ddl refers to.
        entityType:
          description: The entity type (if the DDL is for a sub entity).
          type: string
          enum:
            - DATABASE_ENTITY_TYPE_UNSPECIFIED
            - DATABASE_ENTITY_TYPE_SCHEMA
            - DATABASE_ENTITY_TYPE_TABLE
            - DATABASE_ENTITY_TYPE_COLUMN
            - DATABASE_ENTITY_TYPE_CONSTRAINT
            - DATABASE_ENTITY_TYPE_INDEX
            - DATABASE_ENTITY_TYPE_TRIGGER
            - DATABASE_ENTITY_TYPE_VIEW
            - DATABASE_ENTITY_TYPE_SEQUENCE
            - DATABASE_ENTITY_TYPE_STORED_PROCEDURE
            - DATABASE_ENTITY_TYPE_FUNCTION
            - DATABASE_ENTITY_TYPE_SYNONYM
            - DATABASE_ENTITY_TYPE_DATABASE_PACKAGE
            - DATABASE_ENTITY_TYPE_UDT
            - DATABASE_ENTITY_TYPE_MATERIALIZED_VIEW
            - DATABASE_ENTITY_TYPE_DATABASE
          enumDescriptions:
            - Unspecified database entity type.
            - Schema.
            - Table.
            - Column.
            - Constraint.
            - Index.
            - Trigger.
            - View.
            - Sequence.
            - Stored Procedure.
            - Function.
            - Synonym.
            - Package.
            - UDT.
            - Materialized View.
            - Database.
        issueId:
          type: array
          description: EntityIssues found for this ddl.
          items:
            type: string
        editedDdlKind:
          enumDescriptions:
            - The kind of the DDL is unknown.
            - DDL of the source entity
            - Deterministic converted DDL
            - Gemini AI converted DDL
            - User edited DDL
          description: >-
            If ddl_kind is USER_EDIT, this holds the DDL kind of the original
            content - DETERMINISTIC or AI. Otherwise, this is
            DDL_KIND_UNSPECIFIED.
          type: string
          enum:
            - DDL_KIND_UNSPECIFIED
            - SOURCE
            - DETERMINISTIC
            - AI
            - USER_EDIT
        ddlType:
          type: string
          description: Type of DDL (Create, Alter).
        ddl:
          type: string
          description: The actual ddl code.
        ddlKind:
          type: string
          enum:
            - DDL_KIND_UNSPECIFIED
            - SOURCE
            - DETERMINISTIC
            - AI
            - USER_EDIT
          description: >-
            The DDL Kind selected for apply, or UNSPECIFIED if the entity wasn't
            converted yet.
          enumDescriptions:
            - The kind of the DDL is unknown.
            - DDL of the source entity
            - Deterministic converted DDL
            - Gemini AI converted DDL
            - User edited DDL
      id: EntityDdl
    StartMigrationJobRequest:
      description: Request message for 'StartMigrationJob' request.
      properties:
        skipValidation:
          type: boolean
          description: >-
            Optional. Start the migration job without running prior
            configuration verification. Defaults to `false`.
      type: object
      id: StartMigrationJobRequest
    ListPrivateConnectionsResponse:
      id: ListPrivateConnectionsResponse
      description: Response message for 'ListPrivateConnections' request.
      properties:
        unreachable:
          description: Locations that could not be reached.
          type: array
          items:
            type: string
        privateConnections:
          items:
            $ref: '#/components/schemas/PrivateConnection'
          description: List of private connections.
          type: array
        nextPageToken:
          type: string
          description: >-
            A token which can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
      type: object
    RulesFile:
      description: Details of a single rules file.
      properties:
        rulesSourceFilename:
          type: string
          description: >-
            Required. The filename of the rules that needs to be converted. The
            filename is used mainly so that future logs of the import rules job
            contain it, and can therefore be searched by it.
        rulesContent:
          type: string
          description: Required. The text content of the rules that needs to be converted.
      type: object
      id: RulesFile
    ConvertConversionWorkspaceRequest:
      description: Request message for 'ConvertConversionWorkspace' request.
      properties:
        filter:
          type: string
          description: >-
            Optional. Filter the entities to convert. Leaving this field empty
            will convert all of the entities. Supports Google AIP-160 style
            filtering.
        convertFullPath:
          description: >-
            Optional. Automatically convert the full entity path for each entity
            specified by the filter. For example, if the filter specifies a
            table, that table schema (and database if there is one) will also be
            converted.
          type: boolean
        autoCommit:
          description: >-
            Optional. Specifies whether the conversion workspace is to be
            committed automatically after the conversion.
          type: boolean
      type: object
      id: ConvertConversionWorkspaceRequest
    PackageEntity:
      id: PackageEntity
      description: Package's parent is a schema.
      properties:
        packageSqlCode:
          type: string
          description: The SQL code which creates the package.
        packageBody:
          description: >-
            The SQL code which creates the package body. If the package
            specification has cursors or subprograms, then the package body is
            mandatory.
          type: string
        customFeatures:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: Custom engine specific features.
          type: object
      type: object
    ErrorInfo:
      id: ErrorInfo
      type: object
      description: >-
        Describes the cause of the error with structured details. Example of an
        error when contacting the "pubsub.googleapis.com" API when it is not
        enabled: { "reason": "API_DISABLED" "domain": "googleapis.com"
        "metadata": { "resource": "projects/123", "service":
        "pubsub.googleapis.com" } } This response indicates that the
        pubsub.googleapis.com API is not enabled. Example of an error that is
        returned when attempting to create a Spanner instance in a region that
        is out of stock: { "reason": "STOCKOUT" "domain":
        "spanner.googleapis.com", "metadata": { "availableRegions":
        "us-central1,us-east2" } }
      properties:
        reason:
          description: >-
            The reason of the error. This is a constant value that identifies
            the proximate cause of the error. Error reasons are unique within a
            particular domain of errors. This should be at most 63 characters
            and match a regular expression of `A-Z+[A-Z0-9]`, which represents
            UPPER_SNAKE_CASE.
          type: string
        metadata:
          additionalProperties:
            type: string
          type: object
          description: >-
            Additional structured details about this error. Keys must match a
            regular expression of `a-z+` but should ideally be lowerCamelCase.
            Also, they must be limited to 64 characters in length. When
            identifying the current value of an exceeded limit, the units should
            be contained in the key, not the value. For example, rather than
            `{"instanceLimit": "100/request"}`, should be returned as,
            `{"instanceLimitPerRequest": "100"}`, if the client exceeds the
            number of instances that can be created in a single (batch) request.
        domain:
          type: string
          description: >-
            The logical grouping to which the "reason" belongs. The error domain
            is typically the registered service name of the tool or product that
            generates the error. Example: "pubsub.googleapis.com". If the error
            is generated by some common infrastructure, the error domain must be
            a globally unique value that identifies the infrastructure. For
            Google API infrastructure, the error domain is "googleapis.com".
    ForwardSshTunnelConnectivity:
      type: object
      description: Forward SSH Tunnel connectivity.
      properties:
        username:
          description: Required. Username for the SSH tunnel.
          type: string
        port:
          type: integer
          description: Port for the SSH tunnel, default value is 22.
          format: int32
        hostname:
          description: Required. Hostname for the SSH tunnel.
          type: string
        privateKey:
          type: string
          description: Input only. SSH private key.
        password:
          description: Input only. SSH password.
          type: string
      id: ForwardSshTunnelConnectivity
    DemoteDestinationRequest:
      id: DemoteDestinationRequest
      type: object
      description: Request message for 'DemoteDestination' request.
      properties: {}
    TestIamPermissionsRequest:
      type: object
      description: Request message for `TestIamPermissions` method.
      properties:
        permissions:
          description: >-
            The set of permissions to check for the `resource`. Permissions with
            wildcards (such as `*` or `storage.*`) are not allowed. For more
            information see [IAM
            Overview](https://cloud.google.com/iam/docs/overview#permissions).
          type: array
          items:
            type: string
      id: TestIamPermissionsRequest
    DataCacheConfig:
      type: object
      description: >-
        Data cache is an optional feature available for Cloud SQL for MySQL
        Enterprise Plus edition only. For more information on data cache, see
        [Data cache
        overview](https://cloud.google.com/sql/help/mysql-data-cache) in Cloud
        SQL documentation.
      properties:
        dataCacheEnabled:
          type: boolean
          description: Optional. Whether data cache is enabled for the instance.
      id: DataCacheConfig
    ListMappingRulesResponse:
      description: Response message for 'ListMappingRulesRequest' request.
      properties:
        nextPageToken:
          description: >-
            A token which can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
          type: string
        mappingRules:
          type: array
          description: The list of conversion workspace mapping rules.
          items:
            $ref: '#/components/schemas/MappingRule'
      type: object
      id: ListMappingRulesResponse
    ConvertJobDetails:
      description: Details regarding a Convert background job.
      properties:
        filter:
          readOnly: true
          description: >-
            Output only. AIP-160 based filter used to specify the entities to
            convert
          type: string
      type: object
      id: ConvertJobDetails
    MySqlConnectionProfile:
      id: MySqlConnectionProfile
      type: object
      description: >-
        Specifies connection parameters required specifically for MySQL
        databases.
      properties:
        port:
          description: Required. The network port of the source MySQL database.
          type: integer
          format: int32
        ssl:
          description: >-
            SSL configuration for the destination to connect to the source
            database.
          $ref: '#/components/schemas/SslConfig'
        cloudSqlId:
          type: string
          description: >-
            If the source is a Cloud SQL database, use this field to provide the
            Cloud SQL instance ID of the source.
        username:
          type: string
          description: >-
            Required. The username that Database Migration Service will use to
            connect to the database. The value is encrypted when stored in
            Database Migration Service.
        password:
          description: >-
            Required. Input only. The password for the user that Database
            Migration Service will be using to connect to the database. This
            field is not returned on request, and the value is encrypted when
            stored in Database Migration Service.
          type: string
        host:
          type: string
          description: Required. The IP or hostname of the source MySQL database.
        passwordSet:
          description: >-
            Output only. Indicates If this connection profile password is
            stored.
          type: boolean
          readOnly: true
    PrivateServiceConnectConnectivity:
      type: object
      description: >-
        [Private Service Connect
        connectivity](https://cloud.google.com/vpc/docs/private-service-connect#service-attachments)
      properties:
        serviceAttachment:
          description: >-
            Required. A service attachment that exposes a database, and has the
            following format:
            projects/{project}/regions/{region}/serviceAttachments/{service_attachment_name}
          type: string
      id: PrivateServiceConnectConnectivity
    IntComparisonFilter:
      type: object
      description: >-
        Filter based on relation between source value and compare value of type
        integer in ConditionalColumnSetValue
      properties:
        valueComparison:
          type: string
          enum:
            - VALUE_COMPARISON_UNSPECIFIED
            - VALUE_COMPARISON_IF_VALUE_SMALLER_THAN
            - VALUE_COMPARISON_IF_VALUE_SMALLER_EQUAL_THAN
            - VALUE_COMPARISON_IF_VALUE_LARGER_THAN
            - VALUE_COMPARISON_IF_VALUE_LARGER_EQUAL_THAN
          description: Required. Relation between source value and compare value
          enumDescriptions:
            - Value comparison unspecified.
            - Value is smaller than the Compare value.
            - Value is smaller or equal than the Compare value.
            - Value is larger than the Compare value.
            - Value is larger or equal than the Compare value.
        value:
          description: Required. Integer compare value to be used
          type: string
          format: int64
      id: IntComparisonFilter
    QuotaFailureViolation:
      description: >-
        A message type used to describe a single quota violation. For example, a
        daily quota or a custom quota that was exceeded.
      properties:
        description:
          type: string
          description: >-
            A description of how the quota check failed. Clients can use this
            description to find more about the quota configuration in the
            service's public documentation, or find the relevant quota limit to
            adjust through developer console. For example: "Service disabled" or
            "Daily Limit for read operations exceeded".
        futureQuotaValue:
          description: >-
            The new quota value being rolled out at the time of the violation.
            At the completion of the rollout, this value will be enforced in
            place of quota_value. If no rollout is in progress at the time of
            the violation, this field is not set. For example, if at the time of
            the violation a rollout is in progress changing the number of CPUs
            quota from 10 to 20, 20 would be the value of this field.
          type: string
          format: int64
        subject:
          type: string
          description: >-
            The subject on which the quota check failed. For example,
            "clientip:" or "project:".
        quotaDimensions:
          additionalProperties:
            type: string
          type: object
          description: >-
            The dimensions of the violated quota. Every non-global quota is
            enforced on a set of dimensions. While quota metric defines what to
            count, the dimensions specify for what aspects the counter should be
            increased. For example, the quota "CPUs per region per VM family"
            enforces a limit on the metric
            "compute.googleapis.com/cpus_per_vm_family" on dimensions "region"
            and "vm_family". And if the violation occurred in region
            "us-central1" and for VM family "n1", the quota_dimensions would be,
            { "region": "us-central1", "vm_family": "n1", } When a quota is
            enforced globally, the quota_dimensions would always be empty.
        apiService:
          description: >-
            The API Service from which the `QuotaFailure.Violation` originates.
            In some cases, Quota issues originate from an API Service other than
            the one that was called. In other words, a dependency of the called
            API Service could be the cause of the `QuotaFailure`, and this field
            would have the dependency API service name. For example, if the
            called API is Kubernetes Engine API (container.googleapis.com), and
            a quota violation occurs in the Kubernetes Engine API itself, this
            field would be "container.googleapis.com". On the other hand, if the
            quota violation occurs when the Kubernetes Engine API creates VMs in
            the Compute Engine API (compute.googleapis.com), this field would be
            "compute.googleapis.com".
          type: string
        quotaId:
          description: >-
            The id of the violated quota. Also know as "limit name", this is the
            unique identifier of a quota in the context of an API service. For
            example, "CPUS-PER-VM-FAMILY-per-project-region".
          type: string
        quotaMetric:
          description: >-
            The metric of the violated quota. A quota metric is a named counter
            to measure usage, such as API requests or CPUs. When an activity
            occurs in a service, such as Virtual Machine allocation, one or more
            quota metrics may be affected. For example,
            "compute.googleapis.com/cpus_per_vm_family",
            "storage.googleapis.com/internet_egress_bandwidth".
          type: string
        quotaValue:
          format: int64
          type: string
          description: >-
            The enforced quota value at the time of the `QuotaFailure`. For
            example, if the enforced quota value at the time of the
            `QuotaFailure` on the number of CPUs is "10", then the value of this
            field would reflect this quantity.
      type: object
      id: QuotaFailureViolation
    ListConversionWorkspacesResponse:
      type: object
      description: Response message for 'ListConversionWorkspaces' request.
      properties:
        unreachable:
          items:
            type: string
          type: array
          description: Locations that could not be reached.
        conversionWorkspaces:
          description: The list of conversion workspace objects.
          type: array
          items:
            $ref: '#/components/schemas/ConversionWorkspace'
        nextPageToken:
          description: >-
            A token which can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
          type: string
      id: ListConversionWorkspacesResponse
    LookupMigrationJobObjectRequest:
      id: LookupMigrationJobObjectRequest
      description: >-
        Request for looking up a specific migration job object by its source
        object identifier.
      properties:
        sourceObjectIdentifier:
          $ref: '#/components/schemas/SourceObjectIdentifier'
          description: >-
            Required. The source object identifier which maps to the migration
            job object.
      type: object
    DatabaseType:
      id: DatabaseType
      type: object
      description: A message defining the database engine and provider.
      properties:
        provider:
          enumDescriptions:
            - >-
              Use this value for on-premise source database instances and
              ORACLE.
            - Cloud SQL is the source instance provider.
            - Amazon RDS is the source instance provider.
            - Amazon Aurora is the source instance provider.
            - AlloyDB for PostgreSQL is the source instance provider.
            - Microsoft Azure Database for MySQL/PostgreSQL.
          type: string
          enum:
            - DATABASE_PROVIDER_UNSPECIFIED
            - CLOUDSQL
            - RDS
            - AURORA
            - ALLOYDB
            - AZURE_DATABASE
          description: The database provider.
        engine:
          description: The database engine.
          type: string
          enum:
            - DATABASE_ENGINE_UNSPECIFIED
            - MYSQL
            - POSTGRESQL
            - SQLSERVER
            - ORACLE
          enumDescriptions:
            - The source database engine of the migration job is unknown.
            - The source engine is MySQL.
            - The source engine is PostgreSQL.
            - The source engine is SQL Server.
            - The source engine is Oracle.
    VerifyMigrationJobRequest:
      type: object
      description: Request message for 'VerifyMigrationJob' request.
      properties:
        updateMask:
          type: string
          description: >-
            Optional. Field mask is used to specify the changed fields to be
            verified. It will not update the migration job.
          format: google-fieldmask
        migrationJob:
          description: >-
            Optional. The changed migration job parameters to verify. It will
            not update the migration job.
          $ref: '#/components/schemas/MigrationJob'
      id: VerifyMigrationJobRequest
    VmCreationConfig:
      id: VmCreationConfig
      description: VM creation configuration message
      properties:
        vmZone:
          description: The Google Cloud Platform zone to create the VM in.
          type: string
        vmMachineType:
          type: string
          description: Required. VM instance machine type to create.
        subnet:
          description: The subnet name the vm needs to be created in.
          type: string
      type: object
    ConstraintEntity:
      id: ConstraintEntity
      description: >-
        Constraint is not used as an independent entity, it is retrieved as part
        of another entity such as Table or View.
      properties:
        name:
          type: string
          description: The name of the table constraint.
        tableName:
          description: >-
            Table which is associated with the constraint. In case the
            constraint is defined on a table, this field is left empty as this
            information is stored in parent_name. However, if constraint is
            defined on a view, this field stores the table name on which the
            view is defined.
          type: string
        referenceTable:
          description: >-
            Reference table which may be associated with the constraint. For
            example, if the constraint is a FOREIGN_KEY, this represents the
            list of full name of the referenced table by the foreign key.
          type: string
        tableColumns:
          description: >-
            Table columns used as part of the Constraint, for example primary
            key constraint should list the columns which constitutes the key.
          type: array
          items:
            type: string
        type:
          description: >-
            Type of constraint, for example unique, primary key, foreign key
            (currently only primary key is supported).
          type: string
        customFeatures:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: Custom engine specific features.
          type: object
        referenceColumns:
          description: >-
            Reference columns which may be associated with the constraint. For
            example, if the constraint is a FOREIGN_KEY, this represents the
            list of full names of referenced columns by the foreign key.
          type: array
          items:
            type: string
      type: object
    MigrationJob:
      id: MigrationJob
      type: object
      description: Represents a Database Migration Service migration job object.
      properties:
        reverseSshConnectivity:
          $ref: '#/components/schemas/ReverseSshConnectivity'
          description: >-
            The details needed to communicate to the source over Reverse SSH
            tunnel connectivity.
        type:
          type: string
          enum:
            - TYPE_UNSPECIFIED
            - ONE_TIME
            - CONTINUOUS
          description: Required. The migration job type.
          enumDescriptions:
            - The type of the migration job is unknown.
            - The migration job is a one time migration.
            - The migration job is a continuous migration.
        sourceDatabase:
          description: The database engine type and provider of the source.
          $ref: '#/components/schemas/DatabaseType'
        satisfiesPzs:
          readOnly: true
          type: boolean
          description: Output only. Reserved for future use.
        dumpPath:
          type: string
          description: >-
            The path to the dump file in Google Cloud Storage, in the format:
            (gs://[BUCKET_NAME]/[OBJECT_NAME]). This field and the "dump_flags"
            field are mutually exclusive.
        name:
          description: >-
            The name (URI) of this migration job resource, in the form of:
            projects/{project}/locations/{location}/migrationJobs/{migrationJob}.
          type: string
        vpcPeeringConnectivity:
          $ref: '#/components/schemas/VpcPeeringConnectivity'
          description: >-
            The details of the VPC network that the source database is located
            in.
        endTime:
          format: google-datetime
          readOnly: true
          description: >-
            Output only. If the migration job is completed, the time when it was
            completed.
          type: string
        mysqlHomogeneousConfig:
          $ref: '#/components/schemas/MySqlHomogeneousConfig'
          description: Optional. Configuration for MySQL homogeneous migration.
        purpose:
          enum:
            - PURPOSE_UNSPECIFIED
            - MIGRATE
            - FAILBACK
          description: >-
            Output only. Migration job mode. Migration jobs can be standard
            forward jobs or failback migration jobs.
          type: string
          enumDescriptions:
            - Unknown purpose. Will be defaulted to MIGRATE.
            - Standard migration job.
            - Failback replication job.
          readOnly: true
        postgresToSqlserverConfig:
          description: >-
            Configuration for heterogeneous failback migrations from
            **PostgreSQL to SQL Server**.
          $ref: '#/components/schemas/PostgresToSqlServerConfig'
        performanceConfig:
          description: Optional. Data dump parallelism settings used by the migration.
          $ref: '#/components/schemas/PerformanceConfig'
        sqlserverHomogeneousMigrationJobConfig:
          description: Optional. Configuration for SQL Server homogeneous migration.
          $ref: '#/components/schemas/SqlServerHomogeneousMigrationJobConfig'
        cmekKeyName:
          description: >-
            The CMEK (customer-managed encryption key) fully qualified key name
            used for the migration job. This field supports all migration jobs
            types except for: * Mysql to Mysql (use the cmek field in the
            cloudsql connection profile instead). * PostrgeSQL to PostgreSQL
            (use the cmek field in the cloudsql connection profile instead). *
            PostgreSQL to AlloyDB (use the kms_key_name field in the alloydb
            connection profile instead). Each Cloud CMEK key has the following
            format:
            projects/[PROJECT]/locations/[REGION]/keyRings/[RING]/cryptoKeys/[KEY_NAME]
          type: string
        destinationDatabase:
          description: The database engine type and provider of the destination.
          $ref: '#/components/schemas/DatabaseType'
        conversionWorkspace:
          description: The conversion workspace used by the migration.
          $ref: '#/components/schemas/ConversionWorkspaceInfo'
        filter:
          description: >-
            This field can be used to select the entities to migrate as part of
            the migration job. It uses AIP-160 notation to select a subset of
            the entities configured on the associated conversion-workspace. This
            field should not be set on migration-jobs that are not associated
            with a conversion workspace.
          type: string
        oracleToPostgresConfig:
          description: >-
            Configuration for heterogeneous **Oracle to Cloud SQL for
            PostgreSQL** and **Oracle to AlloyDB for PostgreSQL** migrations.
          $ref: '#/components/schemas/OracleToPostgresConfig'
        createTime:
          description: >-
            Output only. The timestamp when the migration job resource was
            created. A timestamp in RFC3339 UTC "Zulu" format, accurate to
            nanoseconds. Example: "2014-10-02T15:01:23.045123456Z".
          type: string
          format: google-datetime
          readOnly: true
        destination:
          type: string
          description: >-
            Required. The resource name (URI) of the destination connection
            profile.
        originalMigrationName:
          description: >-
            Optional. A failback replication pointer to the resource name (URI)
            of the original migration job.
          type: string
        duration:
          readOnly: true
          format: google-duration
          type: string
          description: >-
            Output only. The duration of the migration job (in seconds). A
            duration in seconds with up to nine fractional digits, terminated by
            's'. Example: "3.5s".
        sqlserverToPostgresConfig:
          $ref: '#/components/schemas/SqlServerToPostgresConfig'
          description: >-
            Configuration for heterogeneous **SQL Server to Cloud SQL for
            PostgreSQL** migrations.
        satisfiesPzi:
          description: Output only. Reserved for future use.
          type: boolean
          readOnly: true
        state:
          type: string
          enum:
            - STATE_UNSPECIFIED
            - MAINTENANCE
            - DRAFT
            - CREATING
            - NOT_STARTED
            - RUNNING
            - FAILED
            - COMPLETED
            - DELETING
            - STOPPING
            - STOPPED
            - DELETED
            - UPDATING
            - STARTING
            - RESTARTING
            - RESUMING
          description: The current migration job state.
          enumDescriptions:
            - The state of the migration job is unknown.
            - The migration job is down for maintenance.
            - The migration job is in draft mode and no resources are created.
            - The migration job is being created.
            - The migration job is created and not started.
            - The migration job is running.
            - The migration job failed.
            - The migration job has been completed.
            - The migration job is being deleted.
            - The migration job is being stopped.
            - The migration job is currently stopped.
            - The migration job has been deleted.
            - The migration job is being updated.
            - The migration job is starting.
            - The migration job is restarting.
            - The migration job is resuming.
        source:
          type: string
          description: Required. The resource name (URI) of the source connection profile.
        objectsConfig:
          $ref: '#/components/schemas/MigrationJobObjectsConfig'
          description: Optional. The objects that need to be migrated.
        labels:
          type: object
          description: >-
            The resource labels for migration job to use to annotate any related
            underlying resources such as Compute Engine VMs. An object
            containing a list of "key": "value" pairs. Example: `{ "name":
            "wrench", "mass": "1.3kg", "count": "3" }`.
          additionalProperties:
            type: string
        postgresHomogeneousConfig:
          $ref: '#/components/schemas/PostgresHomogeneousConfig'
          description: Optional. Configuration for PostgreSQL homogeneous migration.
        dumpType:
          type: string
          enum:
            - DUMP_TYPE_UNSPECIFIED
            - LOGICAL
            - PHYSICAL
          description: >-
            Optional. The type of the data dump. Supported for MySQL to CloudSQL
            for MySQL migrations only.
          enumDescriptions:
            - If not specified, defaults to LOGICAL
            - Logical dump.
            - >-
              Physical file-based dump. Supported for MySQL to CloudSQL for
              MySQL migrations only.
        displayName:
          description: The migration job display name.
          type: string
        updateTime:
          type: string
          description: >-
            Output only. The timestamp when the migration job resource was last
            updated. A timestamp in RFC3339 UTC "Zulu" format, accurate to
            nanoseconds. Example: "2014-10-02T15:01:23.045123456Z".
          readOnly: true
          format: google-datetime
        dumpFlags:
          $ref: '#/components/schemas/DumpFlags'
          description: >-
            The initial dump flags. This field and the "dump_path" field are
            mutually exclusive.
        error:
          description: Output only. The error details in case of state FAILED.
          readOnly: true
          $ref: '#/components/schemas/Status'
        phase:
          readOnly: true
          enumDescriptions:
            - The phase of the migration job is unknown.
            - The migration job is in the full dump phase.
            - The migration job is CDC phase.
            - The migration job is running the promote phase.
            - Only RDS flow - waiting for source writes to stop
            - >-
              Only RDS flow - the sources writes stopped, waiting for dump to
              begin
            - The migration job is ready to be promoted.
          type: string
          description: Output only. The current migration job phase.
          enum:
            - PHASE_UNSPECIFIED
            - FULL_DUMP
            - CDC
            - PROMOTE_IN_PROGRESS
            - WAITING_FOR_SOURCE_WRITES_TO_STOP
            - PREPARING_THE_DUMP
            - READY_FOR_PROMOTE
        staticIpConnectivity:
          description: static ip connectivity data (default, no additional details needed).
          $ref: '#/components/schemas/StaticIpConnectivity'
    PostgresSourceConfig:
      id: PostgresSourceConfig
      description: Configuration for Postgres as a source in a migration.
      properties:
        skipFullDump:
          type: boolean
          description: Optional. Whether to skip full dump or not.
      type: object
    AssignSpecificValue:
      id: AssignSpecificValue
      description: Set to a specific value (value is converted to fit the target data type)
      properties:
        value:
          description: Required. Specific value to be assigned
          type: string
      type: object
    FilterTableColumns:
      id: FilterTableColumns
      type: object
      description: >-
        Options to configure rule type FilterTableColumns. The rule is used to
        filter the list of columns to include or exclude from a table. The rule
        filter field can refer to one entity. The rule scope can be: Table Only
        one of the two lists can be specified for the rule.
      properties:
        includeColumns:
          items:
            type: string
          type: array
          description: Optional. List of columns to be included for a particular table.
        excludeColumns:
          description: Optional. List of columns to be excluded for a particular table.
          type: array
          items:
            type: string
    DescribeDatabaseEntitiesResponse:
      id: DescribeDatabaseEntitiesResponse
      type: object
      description: Response message for 'DescribeDatabaseEntities' request.
      properties:
        databaseEntities:
          items:
            $ref: '#/components/schemas/DatabaseEntity'
          description: The list of database entities for the conversion workspace.
          type: array
        nextPageToken:
          description: >-
            A token which can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
          type: string
    VpcPeeringConnectivity:
      description: >-
        The details of the VPC where the source database is located in Google
        Cloud. We will use this information to set up the VPC peering connection
        between Cloud SQL and this VPC.
      properties:
        vpc:
          description: >-
            The name of the VPC network to peer with the Cloud SQL private
            network.
          type: string
      type: object
      id: VpcPeeringConnectivity
    OracleAsmLogFileAccess:
      id: OracleAsmLogFileAccess
      type: object
      description: Configuration to use Oracle ASM to access the log files.
      properties: {}
    PromoteMigrationJobRequest:
      description: Request message for 'PromoteMigrationJob' request.
      properties:
        objectsFilter:
          description: Optional. The object filter to apply to the migration job.
          $ref: '#/components/schemas/MigrationJobObjectsConfig'
      type: object
      id: PromoteMigrationJobRequest
    Operation:
      id: Operation
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      properties:
        done:
          type: boolean
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
        response:
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
        metadata:
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      properties:
        metadata:
          additionalProperties:
            type: any
            description: Properties of the object. Contains field @type with type URL.
          type: object
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
        displayName:
          type: string
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
      type: object
      id: Location
    SetIamPolicyRequest:
      id: SetIamPolicyRequest
      type: object
      description: Request message for `SetIamPolicy` method.
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
          description: >-
            REQUIRED: The complete policy to be applied to the `resource`. The
            size of the policy is limited to a few 10s of KB. An empty policy is
            a valid policy but certain Google Cloud services (such as Projects)
            might reject them.
        updateMask:
          format: google-fieldmask
          type: string
          description: >-
            OPTIONAL: A FieldMask specifying which fields of the policy to
            modify. Only the fields in the mask will be modified. If no mask is
            provided, the following default mask is used: `paths: "bindings,
            etag"`
    MappingRule:
      type: object
      description: >-
        Definition of a transformation that is to be applied to a group of
        entities in the source schema. Several such transformations can be
        applied to an entity sequentially to define the corresponding entity in
        the target schema.
      properties:
        ruleScope:
          enumDescriptions:
            - Unspecified database entity type.
            - Schema.
            - Table.
            - Column.
            - Constraint.
            - Index.
            - Trigger.
            - View.
            - Sequence.
            - Stored Procedure.
            - Function.
            - Synonym.
            - Package.
            - UDT.
            - Materialized View.
            - Database.
          description: Required. The rule scope
          type: string
          enum:
            - DATABASE_ENTITY_TYPE_UNSPECIFIED
            - DATABASE_ENTITY_TYPE_SCHEMA
            - DATABASE_ENTITY_TYPE_TABLE
            - DATABASE_ENTITY_TYPE_COLUMN
            - DATABASE_ENTITY_TYPE_CONSTRAINT
            - DATABASE_ENTITY_TYPE_INDEX
            - DATABASE_ENTITY_TYPE_TRIGGER
            - DATABASE_ENTITY_TYPE_VIEW
            - DATABASE_ENTITY_TYPE_SEQUENCE
            - DATABASE_ENTITY_TYPE_STORED_PROCEDURE
            - DATABASE_ENTITY_TYPE_FUNCTION
            - DATABASE_ENTITY_TYPE_SYNONYM
            - DATABASE_ENTITY_TYPE_DATABASE_PACKAGE
            - DATABASE_ENTITY_TYPE_UDT
            - DATABASE_ENTITY_TYPE_MATERIALIZED_VIEW
            - DATABASE_ENTITY_TYPE_DATABASE
        multiEntityRename:
          description: Optional. Rule to specify how multiple entities should be renamed.
          $ref: '#/components/schemas/MultiEntityRename'
        conditionalColumnSetValue:
          description: >-
            Optional. Rule to specify how the data contained in a column should
            be transformed (such as trimmed, rounded, etc) provided that the
            data meets certain criteria.
          $ref: '#/components/schemas/ConditionalColumnSetValue'
        name:
          description: >-
            Full name of the mapping rule resource, in the form of:
            projects/{project}/locations/{location}/conversionWorkspaces/{set}/mappingRule/{rule}.
          type: string
        singlePackageChange:
          description: Optional. Rule to specify how a single package is converted.
          $ref: '#/components/schemas/SinglePackageChange'
        sourceSqlChange:
          $ref: '#/components/schemas/SourceSqlChange'
          description: >-
            Optional. Rule to change the sql code for an entity, for example,
            function, procedure.
        setTablePrimaryKey:
          description: Optional. Rule to specify the primary key for a table
          $ref: '#/components/schemas/SetTablePrimaryKey'
        state:
          enumDescriptions:
            - The state of the mapping rule is unknown.
            - The rule is enabled.
            - The rule is disabled.
            - The rule is logically deleted.
          description: Optional. The mapping rule state
          type: string
          enum:
            - STATE_UNSPECIFIED
            - ENABLED
            - DISABLED
            - DELETED
        entityMove:
          description: >-
            Optional. Rule to specify how multiple entities should be relocated
            into a different schema.
          $ref: '#/components/schemas/EntityMove'
        filterTableColumns:
          description: >-
            Optional. Rule to specify the list of columns to include or exclude
            from a table.
          $ref: '#/components/schemas/FilterTableColumns'
        displayName:
          type: string
          description: Optional. A human readable name
        revisionId:
          description: >-
            Output only. The revision ID of the mapping rule. A new revision is
            committed whenever the mapping rule is changed in any way. The
            format is an 8-character hexadecimal string.
          type: string
          readOnly: true
        revisionCreateTime:
          type: string
          description: Output only. The timestamp that the revision was created.
          readOnly: true
          format: google-datetime
        multiColumnDataTypeChange:
          $ref: '#/components/schemas/MultiColumnDatatypeChange'
          description: >-
            Optional. Rule to specify how multiple columns should be converted
            to a different data type.
        convertRowidColumn:
          description: >-
            Optional. Rule to specify how multiple tables should be converted
            with an additional rowid column.
          $ref: '#/components/schemas/ConvertRowIdToColumn'
        singleColumnChange:
          description: Optional. Rule to specify how a single column is converted.
          $ref: '#/components/schemas/SingleColumnChange'
        filter:
          description: Required. The rule filter
          $ref: '#/components/schemas/MappingRuleFilter'
        ruleOrder:
          format: int64
          description: >-
            Required. The order in which the rule is applied. Lower order rules
            are applied before higher value rules so they may end up being
            overridden.
          type: string
        singleEntityRename:
          description: Optional. Rule to specify how a single entity should be renamed.
          $ref: '#/components/schemas/SingleEntityRename'
      id: MappingRule
    RestartMigrationJobRequest:
      type: object
      description: Request message for 'RestartMigrationJob' request.
      properties:
        skipValidation:
          type: boolean
          description: >-
            Optional. Restart the migration job without running prior
            configuration verification. Defaults to `false`.
        objectsFilter:
          description: Optional. The object filter to apply to the migration job.
          $ref: '#/components/schemas/MigrationJobObjectsConfig'
        restartFailedObjects:
          description: Optional. If true, only failed objects will be restarted.
          type: boolean
      id: RestartMigrationJobRequest
    SqlServerSourceConfig:
      description: Configuration for SQL Server as a source in a migration.
      properties:
        cdcStartPosition:
          type: string
          description: >-
            Optional. The log sequence number (LSN) to start CDC data migration
            from.
        maxConcurrentFullDumpConnections:
          format: int32
          description: >-
            Optional. Maximum number of connections Database Migration Service
            will open to the source for full dump phase.
          type: integer
        maxConcurrentCdcConnections:
          format: int32
          description: >-
            Optional. Maximum number of connections Database Migration Service
            will open to the source for CDC phase.
          type: integer
        skipFullDump:
          type: boolean
          description: Optional. Whether to skip full dump or not.
      type: object
      id: SqlServerSourceConfig
    EncryptionConfig:
      description: >-
        EncryptionConfig describes the encryption config of a cluster that is
        encrypted with a CMEK (customer-managed encryption key).
      properties:
        kmsKeyName:
          type: string
          description: >-
            The fully-qualified resource name of the KMS key. Each Cloud KMS key
            is regionalized and has the following format:
            projects/[PROJECT]/locations/[REGION]/keyRings/[RING]/cryptoKeys/[KEY_NAME]
      type: object
      id: EncryptionConfig
    SingleEntityRename:
      type: object
      description: >-
        Options to configure rule type SingleEntityRename. The rule is used to
        rename an entity. The rule filter field can refer to only one entity.
        The rule scope can be one of: Database, Schema, Table, Column,
        Constraint, Index, View, Function, Stored Procedure, Materialized View,
        Sequence, UDT, Synonym
      properties:
        newName:
          type: string
          description: Required. The new name of the destination entity
      id: SingleEntityRename
    OracleSourceConfig:
      type: object
      description: Configuration for Oracle as a source in a migration.
      properties:
        maxConcurrentFullDumpConnections:
          format: int32
          description: >-
            Optional. Maximum number of connections Database Migration Service
            will open to the source for full dump phase.
          type: integer
        cdcStartPosition:
          type: string
          description: >-
            Optional. The schema change number (SCN) to start CDC data migration
            from.
          format: int64
        skipFullDump:
          description: Optional. Whether to skip full dump or not.
          type: boolean
        maxConcurrentCdcConnections:
          format: int32
          type: integer
          description: >-
            Optional. Maximum number of connections Database Migration Service
            will open to the source for CDC phase.
        logMiner:
          $ref: '#/components/schemas/LogMiner'
          description: Use LogMiner.
        binaryLogParser:
          $ref: '#/components/schemas/BinaryLogParser'
          description: Use Binary Log Parser.
      id: OracleSourceConfig
    GenerateSshScriptRequest:
      description: Request message for 'GenerateSshScript' request.
      properties:
        vm:
          type: string
          description: Required. Bastion VM Instance name to use or to create.
        vmCreationConfig:
          description: The VM creation configuration
          $ref: '#/components/schemas/VmCreationConfig'
        vmSelectionConfig:
          $ref: '#/components/schemas/VmSelectionConfig'
          description: The VM selection configuration
        vmPort:
          format: int32
          type: integer
          description: The port that will be open on the bastion host.
      type: object
      id: GenerateSshScriptRequest
    CommitConversionWorkspaceRequest:
      id: CommitConversionWorkspaceRequest
      description: Request message for 'CommitConversionWorkspace' request.
      properties:
        commitName:
          type: string
          description: Optional. Optional name of the commit.
      type: object
    PrimaryInstanceSettings:
      type: object
      description: Settings for the cluster's primary instance
      properties:
        labels:
          description: >-
            Labels for the AlloyDB primary instance created by DMS. An object
            containing a list of 'key', 'value' pairs.
          type: object
          additionalProperties:
            type: string
        instanceNetworkConfig:
          $ref: '#/components/schemas/InstanceNetworkConfig'
          description: Optional. Metadata related to instance level network configuration.
        databaseFlags:
          type: object
          description: >-
            Database flags to pass to AlloyDB when DMS is creating the AlloyDB
            cluster and instances. See the AlloyDB documentation for how these
            can be used.
          additionalProperties:
            type: string
        privateIp:
          description: >-
            Output only. The private IP address for the Instance. This is the
            connection endpoint for an end-user application.
          type: string
          readOnly: true
        outboundPublicIpAddresses:
          type: array
          description: >-
            Output only. All outbound public IP addresses configured for the
            instance.
          readOnly: true
          items:
            type: string
        machineConfig:
          description: >-
            Configuration for the machines that host the underlying database
            engine.
          $ref: '#/components/schemas/MachineConfig'
        id:
          description: >-
            Required. The ID of the AlloyDB primary instance. The ID must
            satisfy the regex expression "[a-z0-9-]+".
          type: string
      id: PrimaryInstanceSettings
    ApplyHash:
      description: Apply a hash function on the value.
      properties:
        uuidFromBytes:
          description: Optional. Generate UUID from the data's byte array
          $ref: '#/components/schemas/Empty'
      type: object
      id: ApplyHash
    ViewEntity:
      id: ViewEntity
      type: object
      description: View's parent is a schema.
      properties:
        customFeatures:
          type: object
          description: Custom engine specific features.
          additionalProperties:
            type: any
            description: Properties of the object.
        sqlCode:
          type: string
          description: The SQL code which creates the view.
        constraints:
          description: View constraints.
          type: array
          items:
            $ref: '#/components/schemas/ConstraintEntity'
    AuthorizedNetwork:
      type: object
      description: AuthorizedNetwork contains metadata for an authorized network.
      properties:
        cidrRange:
          description: Optional. CIDR range for one authorzied network of the instance.
          type: string
      id: AuthorizedNetwork
    ListMigrationJobsResponse:
      id: ListMigrationJobsResponse
      description: Response message for 'ListMigrationJobs' request.
      properties:
        migrationJobs:
          description: The list of migration jobs objects.
          type: array
          items:
            $ref: '#/components/schemas/MigrationJob'
        unreachable:
          type: array
          description: Locations that could not be reached.
          items:
            type: string
        nextPageToken:
          description: >-
            A token which can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
          type: string
      type: object
    MappingRuleFilter:
      id: MappingRuleFilter
      type: object
      description: >-
        A filter defining the entities that a mapping rule should be applied to.
        When more than one field is specified, the rule is applied only to
        entities which match all the fields.
      properties:
        parentEntity:
          type: string
          description: >-
            Optional. The rule should be applied to entities whose parent entity
            (fully qualified name) matches the given value. For example, if the
            rule applies to a table entity, the expected value should be a
            schema (schema). If the rule applies to a column or index entity,
            the expected value can be either a schema (schema) or a table
            (schema.table)
        entityNameContains:
          type: string
          description: >-
            Optional. The rule should be applied to entities whose non-qualified
            name contains the given string.
        entityNameSuffix:
          type: string
          description: >-
            Optional. The rule should be applied to entities whose non-qualified
            name ends with the given suffix.
        entityNamePrefix:
          type: string
          description: >-
            Optional. The rule should be applied to entities whose non-qualified
            name starts with the given prefix.
        entities:
          items:
            type: string
          description: >-
            Optional. The rule should be applied to specific entities defined by
            their fully qualified names.
          type: array
    ConversionWorkspaceInfo:
      description: A conversion workspace's version.
      properties:
        name:
          description: The resource name (URI) of the conversion workspace.
          type: string
        commitId:
          type: string
          description: The commit ID of the conversion workspace.
      type: object
      id: ConversionWorkspaceInfo
    ApplyJobDetails:
      type: object
      description: Details regarding an Apply background job.
      properties:
        connectionProfile:
          description: >-
            Output only. The connection profile which was used for the apply
            job.
          type: string
          readOnly: true
        filter:
          readOnly: true
          type: string
          description: >-
            Output only. AIP-160 based filter used to specify the entities to
            apply
      id: ApplyJobDetails
    AuditLogConfig:
      description: >-
        Provides the configuration for logging a type of permissions. Example: {
        "audit_log_configs": [ { "log_type": "DATA_READ", "exempted_members": [
        "user:jose@example.com" ] }, { "log_type": "DATA_WRITE" } ] } This
        enables 'DATA_READ' and 'DATA_WRITE' logging, while exempting
        jose@example.com from DATA_READ logging.
      properties:
        logType:
          type: string
          enum:
            - LOG_TYPE_UNSPECIFIED
            - ADMIN_READ
            - DATA_WRITE
            - DATA_READ
          description: The log type that this config enables.
          enumDescriptions:
            - Default case. Should never be this.
            - 'Admin reads. Example: CloudIAM getIamPolicy'
            - 'Data writes. Example: CloudSQL Users create'
            - 'Data reads. Example: CloudSQL Users list'
        exemptedMembers:
          items:
            type: string
          type: array
          description: >-
            Specifies the identities that do not cause logging for this type of
            permission. Follows the same format of Binding.members.
      type: object
      id: AuditLogConfig
    PostgresDestinationConfig:
      id: PostgresDestinationConfig
      description: Configuration for Postgres as a destination in a migration.
      properties:
        maxConcurrentConnections:
          description: >-
            Optional. Maximum number of connections Database Migration Service
            will open to the destination for data migration.
          type: integer
          format: int32
        transactionTimeout:
          format: google-duration
          type: string
          description: Optional. Timeout for data migration transactions.
      type: object
    TcpProxyScript:
      description: Response message for 'GenerateTcpProxyScript' request.
      properties:
        script:
          type: string
          description: The TCP Proxy configuration script.
      type: object
      id: TcpProxyScript
    LocalizedMessage:
      description: >-
        Provides a localized error message that is safe to return to the user
        which can be attached to an RPC error.
      properties:
        locale:
          description: >-
            The locale used following the specification defined at
            https://www.rfc-editor.org/rfc/bcp/bcp47.txt. Examples are: "en-US",
            "fr-CH", "es-MX"
          type: string
        message:
          type: string
          description: The localized error message in the above locale.
      type: object
      id: LocalizedMessage
    MaterializedViewEntity:
      type: object
      description: MaterializedView's parent is a schema.
      properties:
        customFeatures:
          description: Custom engine specific features.
          type: object
          additionalProperties:
            description: Properties of the object.
            type: any
        sqlCode:
          type: string
          description: The SQL code which creates the view.
        indices:
          type: array
          description: View indices.
          items:
            $ref: '#/components/schemas/IndexEntity'
      id: MaterializedViewEntity
    ListOperationsResponse:
      type: object
      description: The response message for Operations.ListOperations.
      properties:
        unreachable:
          items:
            type: string
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          type: array
        operations:
          items:
            $ref: '#/components/schemas/Operation'
          description: >-
            A list of operations that matches the specified filter in the
            request.
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      id: ListOperationsResponse
    ListConnectionProfilesResponse:
      id: ListConnectionProfilesResponse
      type: object
      description: Response message for 'ListConnectionProfiles' request.
      properties:
        connectionProfiles:
          type: array
          description: The response list of connection profiles.
          items:
            $ref: '#/components/schemas/ConnectionProfile'
        nextPageToken:
          description: >-
            A token which can be sent as `page_token` to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
          type: string
        unreachable:
          items:
            type: string
          type: array
          description: Locations that could not be reached.
    StopMigrationJobRequest:
      type: object
      description: Request message for 'StopMigrationJob' request.
      properties: {}
      id: StopMigrationJobRequest
    IndexEntity:
      type: object
      description: >-
        Index is not used as an independent entity, it is retrieved as part of a
        Table entity.
      properties:
        customFeatures:
          additionalProperties:
            description: Properties of the object.
            type: any
          type: object
          description: Custom engine specific features.
        type:
          description: Type of index, for example B-TREE.
          type: string
        tableColumns:
          type: array
          description: >-
            Table columns used as part of the Index, for example B-TREE index
            should list the columns which constitutes the index.
          items:
            type: string
        unique:
          description: Boolean value indicating whether the index is unique.
          type: boolean
        tableColumnsDescending:
          items:
            type: boolean
          type: array
          description: >-
            For each table_column, mark whether it's sorting order is ascending
            (false) or descending (true). If no value is defined, assume all
            columns are sorted in ascending order. Otherwise, the number of
            items must match that of table_columns with each value specifying
            the direction of the matched column by its index.
        name:
          description: The name of the index.
          type: string
      id: IndexEntity
    LogMiner:
      description: Configuration to use LogMiner CDC method.
      properties: {}
      type: object
      id: LogMiner
    SqlServerDestinationConfig:
      description: Configuration for SQL Server as a destination in a migration.
      properties:
        maxConcurrentConnections:
          format: int32
          description: >-
            Optional. Maximum number of connections Database Migration Service
            will open to the destination for data migration.
          type: integer
        transactionTimeout:
          type: string
          description: Optional. Timeout for data migration transactions.
          format: google-duration
      type: object
      id: SqlServerDestinationConfig
    OracleAsmConfig:
      type: object
      description: Configuration for Oracle Automatic Storage Management (ASM) connection.
      properties:
        username:
          type: string
          description: Required. Username for the Oracle ASM connection.
        ssl:
          $ref: '#/components/schemas/SslConfig'
          description: Optional. SSL configuration for the Oracle connection.
        port:
          format: int32
          type: integer
          description: Required. Port for the Oracle ASM connection.
        hostname:
          type: string
          description: Required. Hostname for the Oracle ASM connection.
        passwordSet:
          readOnly: true
          description: >-
            Output only. Indicates whether a new password is included in the
            request.
          type: boolean
        asmService:
          description: Required. ASM service name for the Oracle ASM connection.
          type: string
        password:
          type: string
          description: Required. Input only. Password for the Oracle ASM connection.
      id: OracleAsmConfig
    SslConfig:
      description: SSL configuration information.
      properties:
        clientKey:
          description: >-
            Input only. The unencrypted PKCS#1 or PKCS#8 PEM-encoded private key
            associated with the Client Certificate. If this field is used then
            the 'client_certificate' field is mandatory.
          type: string
        type:
          type: string
          enum:
            - SSL_TYPE_UNSPECIFIED
            - SERVER_ONLY
            - SERVER_CLIENT
            - REQUIRED
            - NONE
          description: >-
            Optional. The ssl config type according to 'client_key',
            'client_certificate' and 'ca_certificate'.
          enumDescriptions:
            - Unspecified.
            - Only 'ca_certificate' specified.
            - >-
              Both server ('ca_certificate'), and client ('client_key',
              'client_certificate') specified.
            - >-
              Mandates SSL encryption for all connections. This does not require
              certificate verification.
            - Connection is not encrypted.
        clientCertificate:
          description: >-
            Input only. The x509 PEM-encoded certificate that will be used by
            the replica to authenticate against the source database server.If
            this field is used then the 'client_key' field is mandatory.
          type: string
        caCertificate:
          type: string
          description: >-
            Required. Input only. The x509 PEM-encoded certificate of the CA
            that signed the source database server's certificate. The replica
            will use this certificate to verify it's connecting to the right
            host.
        sslFlags:
          additionalProperties:
            type: string
          type: object
          description: >-
            Optional. SSL flags used for establishing SSL connection to the
            source database. Only source specific flags are supported. An object
            containing a list of "key": "value" pairs. Example: {
            "server_certificate_hostname": "server.com"}.
      type: object
      id: SslConfig
    SqlServerHomogeneousMigrationJobConfig:
      type: object
      description: Configuration for homogeneous migration to Cloud SQL for SQL Server.
      properties:
        databaseBackups:
          items:
            $ref: '#/components/schemas/SqlServerDatabaseBackup'
          type: array
          description: Required. Backup details per database in Cloud Storage.
        promoteWhenReady:
          type: boolean
          description: Optional. Promote databases when ready.
        dagConfig:
          description: >-
            Optional. Configuration for distributed availability group (DAG) for
            the SQL Server homogeneous migration.
          $ref: '#/components/schemas/SqlServerDagConfig'
        backupFilePattern:
          type: string
          description: >-
            Required. Pattern that describes the default backup naming strategy.
            The specified pattern should ensure lexicographical order of
            backups. The pattern must define one of the following capture group
            sets: Capture group set #1 yy/yyyy - year, 2 or 4 digits mm - month
            number, 1-12 dd - day of month, 1-31 hh - hour of day, 00-23 mi -
            minutes, 00-59 ss - seconds, 00-59 Example: For backup file
            TestDB_20230802_155400.trn, use pattern:
            (?.*)_backup_(?\d{4})(?\d{2})(?\d{2})_(?\d{2})(?\d{2})(?\d{2}).trn
            Capture group set #2 timestamp - unix timestamp Example: For backup
            file TestDB.1691448254.trn, use pattern: (?.*)\.(?\d*).trn or
            (?.*)\.(?\d*).trn
        useDiffBackup:
          description: Optional. Enable differential backups.
          type: boolean
      id: SqlServerHomogeneousMigrationJobConfig
