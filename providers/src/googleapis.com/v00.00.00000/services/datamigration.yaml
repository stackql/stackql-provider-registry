          description: Optional. Configuration for Postgres destination.
          $ref: '#/components/schemas/PostgresDestinationConfig'
      type: object
      id: OracleToPostgresConfig
    PrivateConnection:
      type: object
      description: >-
        The PrivateConnection resource is used to establish private connectivity
        with the customer's network.
      properties:
        satisfiesPzs:
          type: boolean
          description: Output only. Reserved for future use.
          readOnly: true
        name:
          description: The name of the resource.
          type: string
        error:
          description: Output only. The error details in case of state FAILED.
          readOnly: true
          $ref: '#/components/schemas/Status'
        labels:
          type: object
          description: >-
            The resource labels for private connections to use to annotate any
            related underlying resources such as Compute Engine VMs. An object
            containing a list of "key": "value" pairs. Example: `{ "name":
            "wrench", "mass": "1.3kg", "count": "3" }`.
          additionalProperties:
            type: string
        updateTime:
          type: string
          description: Output only. The last update time of the resource.
          readOnly: true
          format: google-datetime
        satisfiesPzi:
          readOnly: true
          description: Output only. Reserved for future use.
          type: boolean
        state:
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - CREATED
            - FAILED
            - DELETING
            - FAILED_TO_DELETE
            - DELETED
          description: Output only. The state of the private connection.
          type: string
          enumDescriptions:
            - ''
            - The private connection is in creation state - creating resources.
            - The private connection has been created with all of its resources.
            - The private connection creation has failed.
            - The private connection is being deleted.
            - Delete request has failed, resource is in invalid state.
            - The private connection has been deleted.
          readOnly: true
        displayName:
          type: string
          description: The private connection display name.
        vpcPeeringConfig:
          description: VPC peering configuration.
          $ref: '#/components/schemas/VpcPeeringConfig'
        pscInterfaceConfig:
          $ref: '#/components/schemas/PscInterfaceConfig'
          description: PSC Interface configuration.
        createTime:
          type: string
          description: Output only. The create time of the resource.
          readOnly: true
          format: google-datetime
      id: PrivateConnection
    SeedJobDetails:
      description: Details regarding a Seed background job.
      properties:
        connectionProfile:
          type: string
          description: Output only. The connection profile which was used for the seed job.
          readOnly: true
      type: object
      id: SeedJobDetails
    MultiColumnDatatypeChange:
      id: MultiColumnDatatypeChange
      type: object
      description: >-
        Options to configure rule type MultiColumnDatatypeChange. The rule is
        used to change the data type and associated properties of multiple
        columns at once. The rule filter field can refer to one or more
        entities. The rule scope can be one of:Column. This rule requires
        additional filters to be specified beyond the basic rule filter field,
        which is the source data type, but the rule supports additional
        filtering capabilities such as the minimum and maximum field length. All
        additional filters which are specified are required to be met in order
        for the rule to be applied (logical AND between the fields).
      properties:
        newDataType:
          type: string
          description: Required. New data type.
        overrideLength:
          type: string
          description: >-
            Optional. Column length - e.g. varchar (50) - if not specified and
            relevant uses the source column length.
          format: int64
        sourceTextFilter:
          $ref: '#/components/schemas/SourceTextFilter'
          description: Optional. Filter for text-based data types like varchar.
        customFeatures:
          additionalProperties:
            description: Properties of the object.
            type: any
          type: object
          description: Optional. Custom engine specific features.
        overrideScale:
          type: integer
          description: >-
            Optional. Column scale - when relevant - if not specified and
            relevant uses the source column scale.
          format: int32
        overrideFractionalSecondsPrecision:
          format: int32
          description: >-
            Optional. Column fractional seconds precision - used only for
            timestamp based datatypes - if not specified and relevant uses the
            source column fractional seconds precision.
          type: integer
        sourceNumericFilter:
          $ref: '#/components/schemas/SourceNumericFilter'
          description: >-
            Optional. Filter for fixed point number data types such as
            NUMERIC/NUMBER.
        sourceDataTypeFilter:
          type: string
          description: Required. Filter on source data type.
        overridePrecision:
          format: int32
          description: >-
            Optional. Column precision - when relevant - if not specified and
            relevant uses the source column precision.
          type: integer
    SqlServerConnectionProfile:
      id: SqlServerConnectionProfile
      type: object
      description: >-
        Specifies connection parameters required specifically for SQL Server
        databases.
      properties:
        database:
          type: string
          description: Required. The name of the specific database within the host.
        port:
          type: integer
          description: Required. The network port of the source SQL Server database.
          format: int32
        forwardSshConnectivity:
          $ref: '#/components/schemas/ForwardSshTunnelConnectivity'
          description: Forward SSH tunnel connectivity.
        username:
          type: string
          description: >-
            Required. The username that Database Migration Service will use to
            connect to the database. The value is encrypted when stored in
            Database Migration Service.
        privateConnectivity:
          description: Private connectivity.
          $ref: '#/components/schemas/PrivateConnectivity'
        ssl:
          $ref: '#/components/schemas/SslConfig'
          description: >-
            SSL configuration for the destination to connect to the source
            database.
        backups:
          $ref: '#/components/schemas/SqlServerBackups'
          description: >-
            The backup details in Cloud Storage for homogeneous migration to
            Cloud SQL for SQL Server.
        passwordSet:
          type: boolean
          description: >-
            Output only. Indicates whether a new password is included in the
            request.
          readOnly: true
        dbmPort:
          format: int32
          description: >-
            Optional. The Database Mirroring (DBM) port of the source SQL Server
            instance.
          type: integer
        password:
          description: >-
            Required. Input only. The password for the user that Database
            Migration Service will be using to connect to the database. This
            field is not returned on request, and the value is encrypted when
            stored in Database Migration Service.
          type: string
        cloudSqlProjectId:
          description: >-
            Optional. The project id of the Cloud SQL instance. If not provided,
            the project id of the connection profile will be used.
          type: string
        cloudSqlId:
          type: string
          description: >-
            If the source is a Cloud SQL database, use this field to provide the
            Cloud SQL instance ID of the source.
        privateServiceConnectConnectivity:
          $ref: '#/components/schemas/PrivateServiceConnectConnectivity'
          description: Private Service Connect connectivity.
        host:
          type: string
          description: Required. The IP or hostname of the source SQL Server database.
        staticIpConnectivity:
          $ref: '#/components/schemas/StaticIpConnectivity'
          description: Static IP connectivity data (default, no additional details needed).
    SourceSqlChange:
      type: object
      description: >-
        Options to configure rule type SourceSqlChange. The rule is used to
        alter the sql code for database entities. The rule filter field can
        refer to one entity. The rule scope can be: StoredProcedure, Function,
        Trigger, View
      properties:
        sqlCode:
          description: >-
            Required. Sql code for source (stored procedure, function, trigger
            or view)
          type: string
      id: SourceSqlChange
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      properties: {}
      type: object
      id: Empty
    ConvertRowIdToColumn:
      description: >-
        Options to configure rule type ConvertROWIDToColumn. The rule is used to
        add column rowid to destination tables based on an Oracle rowid
        function/property. The rule filter field can refer to one or more
        entities. The rule scope can be one of: Table. This rule requires
        additional filter to be specified beyond the basic rule filter field,
        which is whether or not to work on tables which already have a primary
        key defined.
      properties:
        onlyIfNoPrimaryKey:
          description: Required. Only work on tables without primary key defined
          type: boolean
      type: object
      id: ConvertRowIdToColumn
    SchemaEntity:
      description: >-
        Schema typically has no parent entity, but can have a parent entity
        DatabaseInstance (for database engines which support it). For some
        database engines, the terms schema and user can be used interchangeably
        when they refer to a namespace or a collection of other database
        entities. Can store additional information which is schema specific.
      properties:
        customFeatures:
          additionalProperties:
            type: any
            description: Properties of the object.
          type: object
          description: Custom engine specific features.
      type: object
      id: SchemaEntity
    OracleConnectionProfile:
      description: >-
        Specifies connection parameters required specifically for Oracle
