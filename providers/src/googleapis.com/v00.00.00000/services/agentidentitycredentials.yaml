        success:
          $ref: '#/components/schemas/GoogleCloudAgentidentitycredentialsV1_Success'
          description: Message indicating credentials were successfully retrieved.
        uriConsentRequired:
          $ref: >-
            #/components/schemas/GoogleCloudAgentidentitycredentialsV1_UriConsentRequired
          description: Message indicating URI-based consent is required.
      type: object
    GoogleCloudAgentidentitycredentialsV1_Success:
      description: Message indicating successful retrieval of credentials.
      id: GoogleCloudAgentidentitycredentialsV1_Success
      properties:
        expireTime:
          description: >-
            The expiration time of the token. This does not guarantee that the
            token will be valid until this time, since the token could be
            revoked earlier. There could also be clock skew between the auth
            provider and the client so it may expire slightly earlier. If not
            set, the token might be permanent or it may be that the service does
            not (or cannot) know when it will expire.
          format: google-datetime
          type: string
        header:
          description: The HTTP header name where the token should be placed.
          type: string
        scopes:
          description: >-
            The scopes actually associated with the retrieved token. End users
            may have rejected some requested scopes, or the third-party
            authorization servers can return a different set of scopes than what
            was asked for. Callers should verify that all required scopes for
            their intended use are included in this list.
          items:
            type: string
          type: array
        token:
          description: >-
            The retrieved access token or credential for the end user. On an MCP
            tool call, for an invalid token the OAuth spec states that this
            should return `401` or `403`, but MCP servers may implement this
            differently. If you get any flavor of `PERMISSION_DENIED`, retry
            your original request to `RetrieveCredentials` with
            force_refresh_token set to the expired/invalid token string, which
            will fetch a new token or initiate a new consent flow.
          type: string
      type: object
    GoogleCloudAgentidentitycredentialsV1_UriConsentRequired:
      description: >-
        Indicates that the user must visit the provided URI to consent to
        delegate permission to the agent to act on their behalf. The caller can
        either poll the `RetrieveCredentials` method, or await the
        /ValidateUserId callback.
      id: GoogleCloudAgentidentitycredentialsV1_UriConsentRequired
      properties:
        authorizationUri:
          description: >-
            Output only. The URL where the user should be redirected to grant
            consent. This will always be present.
          readOnly: true
          type: string
        consentNonce:
          description: >-
            Output only. A one-time, randomly generated value that validates the
            entire consent flow is handled by a single user, avoiding CSRF
            attacks. It must be submitted with the `FinalizeCredentials` request
            to complete the OAuth exchange. This will always be present.
            Implemented per [RFC 6819 Section
            5.3.5](https://www.rfc-editor.org/rfc/rfc6819#section-5.3.5).
          readOnly: true
          type: string
        uid:
          description: Output only. The unique ID of the credentials retrieval operation.
          readOnly: true
          type: string
      type: object
