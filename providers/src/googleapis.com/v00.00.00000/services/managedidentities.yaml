components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AttachTrustRequest:
      description: Request message for AttachTrust
      id: AttachTrustRequest
      properties:
        trust:
          $ref: '#/components/schemas/Trust'
          description: Required. The domain trust resource.
      type: object
    Backup:
      description: Represents a Managed Microsoft Identities backup.
      id: Backup
      properties:
        createTime:
          description: Output only. The time the backups was created.
          format: google-datetime
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Resource labels to represent user provided metadata.
          type: object
        name:
          description: >-
            Output only. The unique name of the Backup in the form of
            `projects/{project_id}/locations/global/domains/{domain_name}/backups/{name}`
          readOnly: true
          type: string
        state:
          description: Output only. The current state of the backup.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
            - FAILED
            - DELETING
          enumDescriptions:
            - Not set.
            - Backup is being created.
            - Backup has been created and validated.
            - Backup has been created but failed validation.
            - Backup is being deleted.
          readOnly: true
          type: string
        statusMessage:
          description: >-
            Output only. Additional information about the current status of this
            backup, if available.
          readOnly: true
          type: string
        type:
          description: >-
            Output only. Indicates whether it’s an on-demand backup or
            scheduled.
          enum:
            - TYPE_UNSPECIFIED
            - ON_DEMAND
            - SCHEDULED
          enumDescriptions:
            - Backup was manually created.
            - Backup was manually created.
            - Backup was automatically created.
          readOnly: true
          type: string
        updateTime:
          description: Output only. Last update time.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    Binding:
      description: Associates `members`, or principals, with a `role`.
      id: Binding
      properties:
        condition:
          $ref: '#/components/schemas/Expr'
          description: >-
            The condition that is associated with this binding. If the condition
            evaluates to `true`, then this binding applies to the current
            request. If the condition evaluates to `false`, then this binding
            does not apply to the current request. However, a different role
            binding might grant the same role to one or more of the principals
            in this binding. To learn which resources support conditions in
            their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
        members:
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. `members` can have the following values: * `allUsers`: A
            special identifier that represents anyone who is on the internet;
            with or without a Google account. * `allAuthenticatedUsers`: A
            special identifier that represents anyone who is authenticated with
            a Google account or a service account. Does not include identities
            that come from external identity providers (IdPs) through identity
            federation. * `user:{emailid}`: An email address that represents a
            specific Google account. For example, `alice@example.com` . *
            `serviceAccount:{emailid}`: An email address that represents a
            Google service account. For example,
            `my-other-app@appspot.gserviceaccount.com`. *
            `serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]`:
            An identifier for a [Kubernetes service
            account](https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example,
            `my-project.svc.id.goog[my-namespace/my-kubernetes-sa]`. *
            `group:{emailid}`: An email address that represents a Google group.
            For example, `admins@example.com`. * `domain:{domain}`: The G Suite
            domain (primary) that represents all the users of that domain. For
            example, `google.com` or `example.com`. *
            `principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workforce identity pool. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}`:
            All workforce identities in a group. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All workforce identities with a specific attribute value. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*`:
            All identities in a workforce identity pool. *
            `principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workload identity pool. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}`:
            A workload identity pool group. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All identities in a workload identity pool with a certain attribute.
            *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*`:
            All identities in a workload identity pool. *
            `deleted:user:{emailid}?uid={uniqueid}`: An email address (plus
            unique identifier) representing a user that has been recently
            deleted. For example, `alice@example.com?uid=123456789012345678901`.
            If the user is recovered, this value reverts to `user:{emailid}` and
            the recovered user retains the role in the binding. *
            `deleted:serviceAccount:{emailid}?uid={uniqueid}`: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            `my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901`.
            If the service account is undeleted, this value reverts to
            `serviceAccount:{emailid}` and the undeleted service account retains
            the role in the binding. * `deleted:group:{emailid}?uid={uniqueid}`:
            An email address (plus unique identifier) representing a Google
            group that has been recently deleted. For example,
            `admins@example.com?uid=123456789012345678901`. If the group is
            recovered, this value reverts to `group:{emailid}` and the recovered
            group retains the role in the binding. *
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            Deleted single identity in a workforce identity pool. For example,
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value`.
          items:
            type: string
          type: array
        role:
          description: >-
            Role that is assigned to the list of `members`, or principals. For
            example, `roles/viewer`, `roles/editor`, or `roles/owner`. For an
            overview of the IAM roles and permissions, see the [IAM
            documentation](https://cloud.google.com/iam/docs/roles-overview).
            For a list of the available pre-defined roles, see
            [here](https://cloud.google.com/iam/docs/understanding-roles).
          type: string
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    Certificate:
      description: Certificate used to configure LDAPS.
      id: Certificate
      properties:
        expireTime:
          description: The certificate expire time.
          format: google-datetime
          type: string
        issuingCertificate:
          $ref: '#/components/schemas/Certificate'
          description: The issuer of this certificate.
        subject:
          description: The certificate subject.
          type: string
        subjectAlternativeName:
          description: The additional hostnames for the domain.
          items:
            type: string
          type: array
        thumbprint:
          description: >-
            The certificate thumbprint which uniquely identifies the
            certificate.
          type: string
      type: object
    CheckMigrationPermissionRequest:
      description: >-
        CheckMigrationPermissionRequest is the request message for
        CheckMigrationPermission method.
      id: CheckMigrationPermissionRequest
      properties: {}
      type: object
    CheckMigrationPermissionResponse:
      description: >-
        CheckMigrationPermissionResponse is the response message for
        CheckMigrationPermission method.
      id: CheckMigrationPermissionResponse
      properties:
        onpremDomains:
          description: >-
            The state of SID filtering of all the domains which has trust
            established.
          items:
            $ref: '#/components/schemas/OnPremDomainSIDDetails'
          type: array
        state:
          description: The state of DomainMigration.
          enum:
            - STATE_UNSPECIFIED
            - DISABLED
            - ENABLED
            - NEEDS_MAINTENANCE
          enumDescriptions:
            - DomainMigration is in unspecified state.
            - Domain Migration is Disabled.
            - Domain Migration is Enabled.
            - Domain Migration is not in valid state.
          type: string
      type: object
    DailyCycle:
      description: Time window specified for daily operations.
      id: DailyCycle
      properties:
        duration:
          description: Output only. Duration of the time window, set by service producer.
          format: google-duration
          type: string
        startTime:
          $ref: '#/components/schemas/TimeOfDay'
          description: Time within the day to start the operations.
      type: object
    Date:
      description: >-
        Represents a whole or partial calendar date, such as a birthday. The
        time of day and time zone are either specified elsewhere or are
        insignificant. The date is relative to the Gregorian Calendar. This can
        represent one of the following: * A full date, with non-zero year,
        month, and day values. * A month and day, with a zero year (for example,
        an anniversary). * A year on its own, with a zero month and a zero day.
        * A year and month, with a zero day (for example, a credit card
        expiration date). Related types: * google.type.TimeOfDay *
        google.type.DateTime * google.protobuf.Timestamp
      id: Date
      properties:
        day:
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0 to specify a year by itself or a year and month where
            the day isn't significant.
          format: int32
          type: integer
        month:
          description: >-
            Month of a year. Must be from 1 to 12, or 0 to specify a year
            without a month and day.
          format: int32
          type: integer
        year:
          description: >-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date
            without a year.
          format: int32
          type: integer
      type: object
    DenyMaintenancePeriod:
      description: >-
        DenyMaintenancePeriod definition. Maintenance is forbidden within the
        deny period. The start_date must be less than the end_date.
      id: DenyMaintenancePeriod
      properties:
        endDate:
          $ref: '#/components/schemas/Date'
          description: >-
            Deny period end date. This can be: * A full date, with non-zero
            year, month and day values. * A month and day value, with a zero
            year. Allows recurring deny periods each year. Date matching this
            period will have to be before the end.
        startDate:
          $ref: '#/components/schemas/Date'
          description: >-
            Deny period start date. This can be: * A full date, with non-zero
            year, month and day values. * A month and day value, with a zero
            year. Allows recurring deny periods each year. Date matching this
            period will have to be the same or after the start.
        time:
          $ref: '#/components/schemas/TimeOfDay'
          description: >-
            Time in UTC when the Blackout period starts on start_date and ends
            on end_date. This can be: * Full time. * All zeros for 00:00:00 UTC
      type: object
    DetachTrustRequest:
      description: Request message for DetachTrust
      id: DetachTrustRequest
      properties:
        trust:
          $ref: '#/components/schemas/Trust'
          description: Required. The domain trust resource to removed.
      type: object
    DisableMigrationRequest:
      description: >-
        DisableMigrationRequest is the request message for DisableMigration
        method.
      id: DisableMigrationRequest
      properties: {}
      type: object
    Domain:
      description: >-
        Represents a managed Microsoft Active Directory domain. If the domain is
        being changed, it will be placed into the UPDATING state, which
        indicates that the resource is being reconciled. At this point, Get will
        reflect an intermediate state.
      id: Domain
      properties:
        admin:
          description: >-
            Optional. The name of delegated administrator account used to
            perform Active Directory operations. If not specified, `setupadmin`
            will be used.
          type: string
        auditLogsEnabled:
          description: >-
            Optional. Configuration for audit logs. True if audit logs are
            enabled, else false. Default is audit logs disabled.
          type: boolean
        authorizedNetworks:
          description: >-
            Optional. The full names of the Google Compute Engine
            [networks](/compute/docs/networks-and-firewalls#networks) the domain
            instance is connected to. Networks can be added using UpdateDomain.
            The domain is only available on networks listed in
            `authorized_networks`. If CIDR subnets overlap between networks,
            domain creation will fail.
          items:
            type: string
          type: array
        createTime:
          description: Output only. The time the instance was created.
          format: google-datetime
          readOnly: true
          type: string
        fqdn:
          description: >-
            Output only. The fully-qualified domain name of the exposed domain
            used by clients to connect to the service. Similar to what would be
            chosen for an Active Directory set up on an internal network.
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Resource labels that can contain user-provided metadata.
          type: object
        locations:
          description: >-
            Required. Locations where domain needs to be provisioned. The
            locations can be specified according to
            https://cloud.google.com/compute/docs/regions-zones, such as
            `us-west1` or `us-east4`. Each domain supports up to 4 locations,
            separated by commas. Each location will use a /26 block.
          items:
            type: string
          type: array
        name:
          description: >-
            Required. The unique name of the domain using the form:
            `projects/{project_id}/locations/global/domains/{domain_name}`.
          type: string
        reservedIpRange:
          description: >-
            Required. The CIDR range of internal addresses that are reserved for
            this domain. Reserved networks must be /24 or larger. Ranges must be
            unique and non-overlapping with existing subnets in
            [Domain].[authorized_networks].
          type: string
        state:
          description: Output only. The current state of this domain.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - UPDATING
            - DELETING
            - REPAIRING
            - PERFORMING_MAINTENANCE
            - UNAVAILABLE
          enumDescriptions:
            - Not set.
            - The domain is being created.
            - The domain has been created and is fully usable.
            - The domain's configuration is being updated.
            - The domain is being deleted.
            - >-
              The domain is being repaired and may be unusable. Details can be
              found in the `status_message` field.
            - The domain is undergoing maintenance.
            - The domain is not serving requests.
          readOnly: true
          type: string
        statusMessage:
          description: >-
            Output only. Additional information about the current status of this
            domain, if available.
          readOnly: true
          type: string
        trusts:
          description: Output only. The current trusts associated with the domain.
          items:
            $ref: '#/components/schemas/Trust'
          readOnly: true
          type: array
        updateTime:
          description: Output only. The last update time.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    DomainJoinMachineRequest:
      description: >-
        DomainJoinMachineRequest is the request message for DomainJoinMachine
        method
      id: DomainJoinMachineRequest
      properties:
        force:
          description: >-
            Optional. force if True, forces domain join even if the computer
            account already exists.
          type: boolean
        ouName:
          description: Optional. OU name where the VM needs to be domain joined
          type: string
        vmIdToken:
          description: >-
            Required. Full instance id token of compute engine VM to verify
            instance identity. More about this:
            https://cloud.google.com/compute/docs/instances/verifying-instance-identity#request_signature
          type: string
      type: object
    DomainJoinMachineResponse:
      description: >-
        DomainJoinMachineResponse is the response message for DomainJoinMachine
        method
      id: DomainJoinMachineResponse
      properties:
        domainJoinBlob:
          description: Offline domain join blob as the response
          type: string
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    EnableMigrationRequest:
      description: >-
        EnableMigrationRequest is the request message for EnableMigration
        method.
      id: EnableMigrationRequest
      properties:
        migratingDomains:
          description: Required. List of the on-prem domains to be migrated.
          items:
            $ref: '#/components/schemas/OnPremDomainDetails'
          type: array
      type: object
    Expr:
      description: >-
        Represents a textual expression in the Common Expression Language (CEL)
        syntax. CEL is a C-like expression language. The syntax and semantics of
        CEL are documented at https://github.com/google/cel-spec. Example
        (Comparison): title: "Summary size limit" description: "Determines if a
        summary is less than 100 chars" expression: "document.summary.size() <
        100" Example (Equality): title: "Requestor is owner" description:
        "Determines if requestor is the document owner" expression:
        "document.owner == request.auth.claims.email" Example (Logic): title:
        "Public documents" description: "Determine whether the document should
        be publicly visible" expression: "document.type != 'private' &&
        document.type != 'internal'" Example (Data Manipulation): title:
        "Notification string" description: "Create a notification string with a
        timestamp." expression: "'New message received at ' +
        string(document.create_time)" The exact variables and functions that may
        be referenced within an expression are determined by the service that
        evaluates it. See the service documentation for additional information.
      id: Expr
      properties:
        description:
          description: >-
            Optional. Description of the expression. This is a longer text which
            describes the expression, e.g. when hovered over it in a UI.
          type: string
        expression:
          description: >-
            Textual representation of an expression in Common Expression
            Language syntax.
          type: string
        location:
          description: >-
            Optional. String indicating the location of the expression for error
            reporting, e.g. a file name and a position in the file.
          type: string
        title:
          description: >-
            Optional. Title for the expression, i.e. a short string describing
            its purpose. This can be used e.g. in UIs which allow to enter the
            expression.
          type: string
      type: object
    ExtendSchemaRequest:
      description: ExtendSchemaRequest is the request message for ExtendSchema method.
      id: ExtendSchemaRequest
      properties:
        description:
          description: Required. Description for Schema Change.
          type: string
        fileContents:
          description: File uploaded as a byte stream input.
          format: byte
          type: string
        gcsPath:
          description: >-
            File stored in Cloud Storage bucket and represented in the form
            projects/{project_id}/buckets/{bucket_name}/objects/{object_name}
            File should be in the same project as the domain.
          type: string
      type: object
    GoogleCloudManagedidentitiesV1OpMetadata:
      description: Represents the metadata of the long-running operation.
      id: GoogleCloudManagedidentitiesV1OpMetadata
