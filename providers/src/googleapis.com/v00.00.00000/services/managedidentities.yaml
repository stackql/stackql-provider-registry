            might reject them.
      type: object
    SqlIntegration:
      description: Represents the SQL instance integrated with Managed AD.
      id: SqlIntegration
      properties:
        createTime:
          description: Output only. The time the SQL integration was created.
          format: google-datetime
          readOnly: true
          type: string
        name:
          description: >-
            The unique name of the SQL integration in the form of
            `projects/{project_id}/locations/global/domains/{domain_name}/sqlIntegrations/{sql_integration}`
          type: string
        sqlInstance:
          description: The full resource name of an integrated SQL instance
          type: string
        state:
          description: Output only. The current state of the SQL integration.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - DELETING
            - READY
          enumDescriptions:
            - Not Set
