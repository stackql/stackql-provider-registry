      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      type: object
    TestIamPermissionsRequest:
      description: Request message for `TestIamPermissions` method.
      id: TestIamPermissionsRequest
      properties:
        permissions:
          description: >-
            The set of permissions to check for the `resource`. Permissions with
            wildcards (such as `*` or `storage.*`) are not allowed. For more
            information see [IAM
            Overview](https://cloud.google.com/iam/docs/overview#permissions).
          items:
            type: string
          type: array
      type: object
    TestIamPermissionsResponse:
      description: Response message for `TestIamPermissions` method.
      id: TestIamPermissionsResponse
      properties:
        permissions:
          description: >-
            A subset of `TestPermissionsRequest.permissions` that the caller is
            allowed.
          items:
            type: string
          type: array
      type: object
    TimeOfDay:
      description: >-
        Represents a time of day. The date and time zone are either not
        significant or are specified elsewhere. An API may choose to allow leap
        seconds. Related types are google.type.Date and
        `google.protobuf.Timestamp`.
      id: TimeOfDay
      properties:
        hours:
          description: >-
            Hours of a day in 24 hour format. Must be greater than or equal to 0
            and typically must be less than or equal to 23. An API may choose to
            allow the value "24:00:00" for scenarios like business closing time.
          format: int32
          type: integer
        minutes:
          description: >-
            Minutes of an hour. Must be greater than or equal to 0 and less than
            or equal to 59.
          format: int32
          type: integer
        nanos:
          description: >-
            Fractions of seconds, in nanoseconds. Must be greater than or equal
            to 0 and less than or equal to 999,999,999.
          format: int32
          type: integer
        seconds:
          description: >-
            Seconds of a minute. Must be greater than or equal to 0 and
            typically must be less than or equal to 59. An API may allow the
            value 60 if it allows leap-seconds.
          format: int32
          type: integer
      type: object
    Trust:
      description: >-
        Represents a relationship between two domains. This allows a controller
        in one domain to authenticate a user in another domain. If the trust is
        being changed, it will be placed into the UPDATING state, which
        indicates that the resource is being reconciled. At this point, Get will
        reflect an intermediate state.
      id: Trust
      properties:
        createTime:
          description: Output only. The time the instance was created.
          format: google-datetime
          readOnly: true
          type: string
        lastTrustHeartbeatTime:
          description: >-
            Output only. The last heartbeat time when the trust was known to be
            connected.
          format: google-datetime
          readOnly: true
          type: string
        selectiveAuthentication:
          description: >-
            Optional. The trust authentication type, which decides whether the
            trusted side has forest/domain wide access or selective access to an
            approved set of resources.
          type: boolean
        state:
          description: Output only. The current state of the trust.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - UPDATING
            - DELETING
            - CONNECTED
            - DISCONNECTED
          enumDescriptions:
            - Not set.
            - The domain trust is being created.
            - The domain trust is being updated.
            - The domain trust is being deleted.
            - The domain trust is connected.
            - The domain trust is disconnected.
          readOnly: true
          type: string
        stateDescription:
          description: >-
            Output only. Additional information about the current state of the
            trust, if available.
          readOnly: true
          type: string
        targetDnsIpAddresses:
          description: >-
            Required. The target DNS server IP addresses which can resolve the
            remote domain involved in the trust.
          items:
            type: string
          type: array
        targetDomainName:
          description: >-
            Required. The fully qualified target domain name which will be in
            trust with the current domain.
          type: string
        trustDirection:
          description: >-
            Required. The trust direction, which decides if the current domain
            is trusted, trusting, or both.
          enum:
            - TRUST_DIRECTION_UNSPECIFIED
            - INBOUND
            - OUTBOUND
            - BIDIRECTIONAL
          enumDescriptions:
            - Not set.
            - The inbound direction represents the trusting side.
            - The outboud direction represents the trusted side.
            - >-
              The bidirectional direction represents the trusted / trusting
              side.
          type: string
        trustHandshakeSecret:
          description: >-
            Required. The trust secret used for the handshake with the target
            domain. This will not be stored.
          type: string
        trustType:
          description: Required. The type of trust represented by the trust resource.
          enum:
            - TRUST_TYPE_UNSPECIFIED
            - FOREST
            - EXTERNAL
          enumDescriptions:
            - Not set.
            - The forest trust.
            - The external domain trust.
          type: string
        updateTime:
          description: Output only. The last update time.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    UpdatePolicy:
      description: Maintenance policy applicable to instance updates.
      id: UpdatePolicy
      properties:
        channel:
          description: Optional. Relative scheduling channel applied to resource.
          enum:
            - UPDATE_CHANNEL_UNSPECIFIED
            - EARLIER
            - LATER
            - WEEK1
            - WEEK2
            - WEEK5
          enumDescriptions:
            - Unspecified channel.
            - Early channel within a customer project.
            - Later channel within a customer project.
            - >-
              ! ! The follow channels can ONLY be used if you adopt the new MW
              system! ! ! NOTE: all WEEK channels are assumed to be under a
              weekly window. ! There is currently no dedicated channel
              definitions for Daily windows. ! If you use Daily window, the
              system will assume a 1d (24Hours) advanced ! notification period
              b/w EARLY and LATER. ! We may consider support more flexible daily
              channel specifications in ! the future. WEEK1 == EARLIER with
              minimum 7d advanced notification. {7d, 14d} The system will treat
              them equally and will use WEEK1 whenever it can. New customers are
              encouraged to use this channel annotation.
            - WEEK2 == LATER with minimum 14d advanced notification {14d, 21d}.
            - >-
              WEEK5 == 40d support. minimum 35d advanced notification {35d,
              42d}.
          type: string
        denyMaintenancePeriods:
          description: >-
            Deny Maintenance Period that is applied to resource to indicate when
            maintenance is forbidden. The protocol supports zero-to-many such
            periods, but the current SLM Rollout implementation only supports
            zero-to-one.
          items:
            $ref: '#/components/schemas/DenyMaintenancePeriod'
          type: array
        window:
          $ref: '#/components/schemas/MaintenanceWindow'
          description: >-
            Optional. Maintenance window that is applied to resources covered by
            this policy.
      type: object
    ValidateTrustRequest:
      description: Request message for ValidateTrust
      id: ValidateTrustRequest
      properties:
        trust:
          $ref: '#/components/schemas/Trust'
          description: Required. The domain trust to validate trust state for.
