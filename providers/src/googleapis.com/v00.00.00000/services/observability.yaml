        delete:
          operation:
            $ref: >-
              #/paths/~1v1~1projects~1{projectsId}~1locations~1{locationsId}~1buckets~1{bucketsId}~1datasets~1{datasetsId}~1links~1{linksId}/delete
          response:
            mediaType: application/json
