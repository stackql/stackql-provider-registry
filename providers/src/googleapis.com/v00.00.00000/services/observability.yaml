        list:
          operation:
            $ref: '#/paths/~1v1~1organizations~1{organizationsId}~1locations/get'
          response:
            mediaType: application/json
            objectKey: $.locations
            openAPIDocKey: '200'
      name: locations
      sqlVerbs:
        delete: []
        insert: []
        replace: []
        select:
          - $ref: '#/components/x-stackQL-resources/locations/methods/get'
          - $ref: '#/components/x-stackQL-resources/locations/methods/list'
        update: []
