components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    Bucket:
      description: Bucket configuration for storing observability data.
      id: Bucket
      properties:
        cmekSettings:
          $ref: '#/components/schemas/CmekSettings'
          description: Optional. Settings for configuring CMEK on a bucket.
        createTime:
          description: Output only. Create timestamp.
          format: google-datetime
          readOnly: true
          type: string
        deleteTime:
          description: Output only. Delete timestamp.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the bucket.
          type: string
        displayName:
          description: Optional. User friendly display name.
          type: string
        name:
          description: >-
            Identifier. Name of the bucket. The format is:
            projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]
          type: string
        purgeTime:
          description: >-
            Output only. Timestamp when the bucket in soft-deleted state is
            purged.
          format: google-datetime
          readOnly: true
          type: string
        updateTime:
          description: Output only. Update timestamp.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    CmekSettings:
      description: Settings for configuring CMEK for a bucket.
      id: CmekSettings
      properties:
        kmsKey:
          description: >-
            Optional. The resource name for the configured Cloud KMS key. The
            format is:
            projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]
            For example:
            projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key
          type: string
        kmsKeyVersion:
          description: >-
            Output only. The CryptoKeyVersion resource name for the configured
            Cloud KMS key. The format is:
            projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]/cryptoKeyVersions/[VERSION]
            For example:
            projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key/cryptoKeyVersions/1
            This read-only field is used to convey the specific configured
            CryptoKeyVersion of the `kms_key` that has been configured. It is
            populated when the CMEK settings are bound to a single key version.
          readOnly: true
          type: string
        serviceAccountId:
          description: Output only. The service account used to access the key.
          readOnly: true
          type: string
      type: object
    Dataset:
      description: >-
        A dataset is a collection of data that has a specific configuration. A
        dataset can be backed by multiple tables. One bucket can have multiple
        datasets.
      id: Dataset
      properties:
        createTime:
          description: Output only. Create timestamp.
          format: google-datetime
          readOnly: true
          type: string
        deleteTime:
          description: Output only. Delete timestamp.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the dataset.
          type: string
        displayName:
          description: Optional. User friendly display name.
          type: string
        name:
          description: >-
            Identifier. Name of the dataset. The format is:
            projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]
          type: string
        purgeTime:
          description: >-
            Output only. Timestamp when the dataset in soft-deleted state is
            purged.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    Link:
      description: >-
        A link lets a dataset be accessible to BigQuery via usage of linked
        datasets.
      id: Link
      properties:
        createTime:
          description: Output only. Create timestamp.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the link.
          type: string
        displayName:
          description: Optional. A user friendly display name.
          type: string
        name:
          description: >-
            Identifier. Name of the link. The format is:
            projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]/links/[LINK_ID]
          type: string
      type: object
    ListBucketsResponse:
      description: Response for listing buckets.
      id: ListBucketsResponse
      properties:
        buckets:
          description: Optional. The list of buckets.
          items:
            $ref: '#/components/schemas/Bucket'
          type: array
        nextPageToken:
          description: >-
            Optional. A token that can be sent as `page_token` to retrieve the
            next page. When this field is omitted, there are no subsequent
            pages.
          type: string
      type: object
    ListDatasetsResponse:
      description: Response for listing datasets.
      id: ListDatasetsResponse
      properties:
        datasets:
          description: The list of datasets.
          items:
            $ref: '#/components/schemas/Dataset'
          type: array
        nextPageToken:
          description: >-
            A token that can be sent as `page_token` to retrieve the next page.
            When this field is omitted, there are no subsequent pages.
          type: string
      type: object
    ListLinksResponse:
      description: Response for listing links.
      id: ListLinksResponse
      properties:
        links:
          description: The list of links.
          items:
            $ref: '#/components/schemas/Link'
          type: array
        nextPageToken:
          description: >-
            Optional. A token that can be sent as `page_token` to retrieve the
            next page. When this field is omitted, there are no subsequent
            pages.
          type: string
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: ListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Operation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    ListTraceScopesResponse:
      description: Response for listing TraceScopes.
      id: ListTraceScopesResponse
      properties:
        nextPageToken:
          description: >-
            Optional. If there might be more results than appear in this
            response, then `next_page_token` is included. To get the next set of
            results, call the same method again using the value of
            `next_page_token` as `page_token`.
          type: string
        traceScopes:
          description: Optional. A list of trace scopes.
          items:
            $ref: '#/components/schemas/TraceScope'
          type: array
      type: object
    ListViewsResponse:
      description: Response for listing views.
      id: ListViewsResponse
      properties:
        nextPageToken:
          description: >-
            Optional. A token that can be sent as `page_token` to retrieve the
            next page. When this field is omitted, there are no subsequent
            pages.
          type: string
        views:
          description: The list of views.
          items:
            $ref: '#/components/schemas/View'
          type: array
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    Operation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: Operation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    OperationMetadata:
      description: Represents the metadata of the long-running operation.
      id: OperationMetadata
      properties:
        apiVersion:
          description: Output only. API version used to start the operation.
          readOnly: true
          type: string
        createTime:
          description: Output only. The time the operation was created.
          format: google-datetime
          readOnly: true
          type: string
        endTime:
          description: Output only. The time the operation finished running.
          format: google-datetime
          readOnly: true
          type: string
        requestedCancellation:
          description: >-
            Output only. Identifies whether the user has requested cancellation
            of the operation. Operations that have been cancelled successfully
            have Operation.error value with a google.rpc.Status.code of 1,
            corresponding to `Code.CANCELLED`.
          readOnly: true
          type: boolean
        statusMessage:
          description: Output only. Human-readable status of the operation, if any.
          readOnly: true
          type: string
        target:
          description: >-
            Output only. Server-defined resource path for the target of the
            operation.
          readOnly: true
          type: string
        verb:
          description: Output only. Name of the verb executed by the operation.
          readOnly: true
          type: string
      type: object
    Scope:
      description: Message describing Scope object
      id: Scope
      properties:
        logScope:
          description: >-
            Required. The full resource name of the `LogScope`. For example:
            //logging.googleapis.com/projects/myproject/locations/global/logScopes/my-log-scope
          type: string
        name:
          description: >-
            Identifier. Name of the resource. The format is:
            projects/{project}/locations/{location}/scopes/{scope} The
            `{location}` field must be set to `global`. The `{scope}` field must
            be set to `_Default`.
          type: string
        traceScope:
          description: >-
            Required. The resource name of the `TraceScope`. For example:
            projects/myproject/locations/global/traceScopes/my-trace-scope
          type: string
        updateTime:
          description: >-
            Output only. Update timestamp. Note: The Update timestamp for the
            default scope is initially unset.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    Settings:
      description: >-
        Describes the settings associated with a project, organization, or
        folder.
      id: Settings
      properties:
        defaultStorageLocation:
          description: >-
            Optional. The location which should be used when any regional
            resources are provisioned by Google Cloud.
          type: string
        kmsKeyName:
          description: >-
            Optional. The resource name for the configured Cloud KMS key. KMS
            key name format:
            "projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]"
            For example:
            `"projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key"`
          type: string
        name:
          description: Identifier. The resource name of the settings.
          type: string
        serviceAccountId:
          description: >-
            Output only. The service account for the given resource container,
            such as project or folder. This will be used by Cloud Observability
            to perform actions in the container's project like access KMS keys
            or create Links. Always the same service account per resource
            container regardless of region.
          readOnly: true
          type: string
      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      type: object
    TraceScope:
      description: >-
        A trace scope is a collection of resources whose traces are queried
        together.
      id: TraceScope
      properties:
        createTime:
          description: Output only. The creation timestamp of the trace scope.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. Describes this trace scope. The maximum length of the
            description is 8000 characters.
          type: string
        name:
          description: >-
            Identifier. The resource name of the trace scope. For example:
            projects/my-project/locations/global/traceScopes/my-trace-scope
          type: string
        resourceNames:
          description: >-
            Required. Names of the projects that are included in this trace
            scope. * `projects/[PROJECT_ID]` A trace scope can include a maximum
            of 20 projects.
          items:
            type: string
          type: array
        updateTime:
          description: Output only. The last update timestamp of the trace scope.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    View:
      description: >-
        A view corresponds to a read-only representation of a subset of the data
        in a dataset.
      id: View
      properties:
        createTime:
          description: Output only. Create timestamp.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. Description of the view.
          type: string
        displayName:
          description: Optional. User friendly display name.
          type: string
        name:
          description: >-
            Identifier. Name of the view. The format is:
            projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]/views/[VIEW_ID]
          type: string
        updateTime:
          description: Output only. Update timestamp.
          format: google-datetime
          readOnly: true
          type: string
      type: object
  securitySchemes:
    Oauth2:
      description: Oauth 2.0 implicit authentication
      flows:
        implicit:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: &ref_0
            https://www.googleapis.com/auth/cloud-platform: >-
              See, edit, configure, and delete your Google Cloud data and see
              the email address for your Google Account.
      type: oauth2
    Oauth2c:
      description: Oauth 2.0 authorization code authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes: *ref_0
          tokenUrl: https://accounts.google.com/o/oauth2/token
      type: oauth2
  x-stackQL-resources:
    buckets:
      id: google.observability.buckets
      methods:
        get:
          operation:
            $ref: >-
              #/paths/~1v1~1projects~1{projectsId}~1locations~1{locationsId}~1buckets~1{bucketsId}/get
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        list:
          operation:
            $ref: >-
              #/paths/~1v1~1projects~1{projectsId}~1locations~1{locationsId}~1buckets/get
          response:
            mediaType: application/json
            objectKey: $.buckets
            openAPIDocKey: '200'
      name: buckets
      sqlVerbs:
        delete: []
        insert: []
        replace: []
        select:
          - $ref: '#/components/x-stackQL-resources/buckets/methods/get'
          - $ref: '#/components/x-stackQL-resources/buckets/methods/list'
        update: []
      title: Buckets
    datasets:
      id: google.observability.datasets
      methods:
        get:
          operation:
