components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    Aggregation:
      description: Defines an aggregation that produces a single result.
      id: Aggregation
      properties:
        alias:
          description: >-
            Optional. Optional name of the field to store the result of the
            aggregation into. If not provided, Firestore will pick a default
            name following the format `field_`. For example: ``` AGGREGATE
            COUNT_UP_TO(1) AS count_up_to_1, COUNT_UP_TO(2), COUNT_UP_TO(3) AS
            count_up_to_3, COUNT(*) OVER ( ... ); ``` becomes: ``` AGGREGATE
            COUNT_UP_TO(1) AS count_up_to_1, COUNT_UP_TO(2) AS field_1,
            COUNT_UP_TO(3) AS count_up_to_3, COUNT(*) AS field_2 OVER ( ... );
            ``` Requires: * Must be unique across all aggregation aliases. *
            Conform to document field name limitations.
          type: string
        avg:
          $ref: '#/components/schemas/Avg'
          description: Average aggregator.
        count:
          $ref: '#/components/schemas/Count'
          description: Count aggregator.
        sum:
          $ref: '#/components/schemas/Sum'
          description: Sum aggregator.
      type: object
    AggregationResult:
      description: >-
        The result of a single bucket from a Firestore aggregation query. The
        keys of `aggregate_fields` are the same for all results in an
        aggregation query, unlike document queries which can have different
        fields present for each result.
      id: AggregationResult
      properties:
        aggregateFields:
          additionalProperties:
            $ref: '#/components/schemas/Value'
          description: >-
            The result of the aggregation functions, ex: `COUNT(*) AS
            total_docs`. The key is the alias assigned to the aggregation
            function on input and the size of this map equals the number of
            aggregation functions in the query.
          type: object
      type: object
    ArrayValue:
      description: An array value.
      id: ArrayValue
      properties:
        values:
          description: Values in the array.
          items:
            $ref: '#/components/schemas/Value'
          type: array
      type: object
    Avg:
      description: >-
        Average of the values of the requested field. * Only numeric values will
        be aggregated. All non-numeric values including `NULL` are skipped. * If
        the aggregated values contain `NaN`, returns `NaN`. Infinity math
        follows IEEE-754 standards. * If the aggregated value set is empty,
        returns `NULL`. * Always returns the result as a double.
      id: Avg
      properties:
        field:
          $ref: '#/components/schemas/FieldReference'
          description: The field to aggregate on.
      type: object
    BatchGetDocumentsRequest:
      description: The request for Firestore.BatchGetDocuments.
      id: BatchGetDocumentsRequest
      properties:
        documents:
          description: >-
            The names of the documents to retrieve. In the format:
            `projects/{project_id}/databases/{database_id}/documents/{document_path}`.
            The request will fail if any of the document is not a child resource
            of the given `database`. Duplicate names will be elided.
          items:
            type: string
          type: array
        mask:
          $ref: '#/components/schemas/DocumentMask'
          description: >-
            The fields to return. If not set, returns all fields. If a document
            has a field that is not present in this mask, that field will not be
            returned in the response.
        newTransaction:
          $ref: '#/components/schemas/TransactionOptions'
          description: >-
            Starts a new transaction and reads the documents. Defaults to a
            read-only transaction. The new transaction ID will be returned as
            the first response in the stream.
        readTime:
          description: >-
            Reads documents as they were at the given time. This must be a
            microsecond precision timestamp within the past one hour, or if
            Point-in-Time Recovery is enabled, can additionally be a whole
            minute timestamp within the past 7 days.
          format: google-datetime
          type: string
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for this request.
        transaction:
          description: Reads documents in a transaction.
          format: byte
          type: string
      type: object
    BatchGetDocumentsResponse:
      description: The streamed response for Firestore.BatchGetDocuments.
      id: BatchGetDocumentsResponse
      properties:
        found:
          $ref: '#/components/schemas/Document'
          description: A document that was requested.
        missing:
          description: >-
            A document name that was requested but does not exist. In the
            format:
            `projects/{project_id}/databases/{database_id}/documents/{document_path}`.
          type: string
        readTime:
          description: >-
            The time at which the document was read. This may be monotically
            increasing, in this case the previous documents in the result stream
            are guaranteed not to have changed between their read_time and this
            one.
          format: google-datetime
          type: string
        transaction:
          description: >-
            The transaction that was started as part of this request. Will only
            be set in the first response, and only if
            BatchGetDocumentsRequest.new_transaction was set in the request.
          format: byte
          type: string
      type: object
    BatchWriteRequest:
      description: The request for Firestore.BatchWrite.
      id: BatchWriteRequest
      properties:
        labels:
          additionalProperties:
            type: string
          description: Labels associated with this batch write.
          type: object
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for this request.
        writes:
          description: >-
            The writes to apply. Method does not apply writes atomically and
            does not guarantee ordering. Each write succeeds or fails
            independently. You cannot write to the same document more than once
            per request.
          items:
            $ref: '#/components/schemas/Write'
          type: array
      type: object
    BatchWriteResponse:
      description: The response from Firestore.BatchWrite.
      id: BatchWriteResponse
      properties:
        status:
          description: >-
            The status of applying the writes. This i-th write status
            corresponds to the i-th write in the request.
          items:
            $ref: '#/components/schemas/Status'
          type: array
        writeResults:
          description: >-
            The result of applying the writes. This i-th write result
            corresponds to the i-th write in the request.
          items:
            $ref: '#/components/schemas/WriteResult'
          type: array
      type: object
    BeginTransactionRequest:
      description: The request for Firestore.BeginTransaction.
      id: BeginTransactionRequest
      properties:
        options:
          $ref: '#/components/schemas/TransactionOptions'
          description: >-
            The options for the transaction. Defaults to a read-write
            transaction.
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for this request.
      type: object
    BeginTransactionResponse:
      description: The response for Firestore.BeginTransaction.
      id: BeginTransactionResponse
      properties:
        transaction:
          description: The transaction that was started.
          format: byte
          type: string
      type: object
    BitSequence:
      description: >-
        A sequence of bits, encoded in a byte array. Each byte in the `bitmap`
        byte array stores 8 bits of the sequence. The only exception is the last
        byte, which may store 8 _or fewer_ bits. The `padding` defines the
        number of bits of the last byte to be ignored as "padding". The values
        of these "padding" bits are unspecified and must be ignored. To retrieve
        the first bit, bit 0, calculate: `(bitmap[0] & 0x01) != 0`. To retrieve
        the second bit, bit 1, calculate: `(bitmap[0] & 0x02) != 0`. To retrieve
        the third bit, bit 2, calculate: `(bitmap[0] & 0x04) != 0`. To retrieve
        the fourth bit, bit 3, calculate: `(bitmap[0] & 0x08) != 0`. To retrieve
        bit n, calculate: `(bitmap[n / 8] & (0x01 << (n % 8))) != 0`. The "size"
        of a `BitSequence` (the number of bits it contains) is calculated by
        this formula: `(bitmap.length * 8) - padding`.
      id: BitSequence
      properties:
        bitmap:
          description: The bytes that encode the bit sequence. May have a length of zero.
          format: byte
          type: string
        padding:
          description: >-
            The number of bits of the last byte in `bitmap` to ignore as
            "padding". If the length of `bitmap` is zero, then this value must
            be `0`. Otherwise, this value must be between 0 and 7, inclusive.
          format: int32
          type: integer
      type: object
    BloomFilter:
      description: >-
        A bloom filter (https://en.wikipedia.org/wiki/Bloom_filter). The bloom
        filter hashes the entries with MD5 and treats the resulting 128-bit hash
        as 2 distinct 64-bit hash values, interpreted as unsigned integers using
        2's complement encoding. These two hash values, named `h1` and `h2`, are
        then used to compute the `hash_count` hash values using the formula,
        starting at `i=0`: h(i) = h1 + (i * h2) These resulting values are then
        taken modulo the number of bits in the bloom filter to get the bits of
        the bloom filter to test for the given entry.
      id: BloomFilter
      properties:
        bits:
          $ref: '#/components/schemas/BitSequence'
          description: The bloom filter data.
        hashCount:
          description: The number of hashes used by the algorithm.
          format: int32
          type: integer
      type: object
    CollectionSelector:
      description: A selection of a collection, such as `messages as m1`.
      id: CollectionSelector
      properties:
        allDescendants:
          description: >-
            When false, selects only collections that are immediate children of
            the `parent` specified in the containing `RunQueryRequest`. When
            true, selects all descendant collections.
          type: boolean
        collectionId:
          description: The collection ID. When set, selects only collections with this ID.
          type: string
      type: object
    CommitRequest:
      description: The request for Firestore.Commit.
      id: CommitRequest
      properties:
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for this request.
        transaction:
          description: If set, applies all writes in this transaction, and commits it.
          format: byte
          type: string
        writes:
          description: The writes to apply. Always executed atomically and in order.
          items:
            $ref: '#/components/schemas/Write'
          type: array
      type: object
    CommitResponse:
      description: The response for Firestore.Commit.
      id: CommitResponse
      properties:
        commitTime:
          description: >-
            The time at which the commit occurred. Any read with an equal or
            greater `read_time` is guaranteed to see the effects of the commit.
          format: google-datetime
          type: string
        writeResults:
          description: >-
            The result of applying the writes. This i-th write result
            corresponds to the i-th write in the request.
          items:
            $ref: '#/components/schemas/WriteResult'
          type: array
      type: object
    CompositeFilter:
      description: A filter that merges multiple other filters using the given operator.
      id: CompositeFilter
      properties:
        filters:
          description: >-
            The list of filters to combine. Requires: * At least one filter is
            present.
          items:
            $ref: '#/components/schemas/Filter'
          type: array
        op:
          description: The operator for combining multiple filters.
          enum:
            - OPERATOR_UNSPECIFIED
            - AND
            - OR
          enumDescriptions:
            - Unspecified. This value must not be used.
            - Documents are required to satisfy all of the combined filters.
            - >-
              Documents are required to satisfy at least one of the combined
              filters.
          type: string
      type: object
    Count:
      description: >-
        Count of documents that match the query. The `COUNT(*)` aggregation
        function operates on the entire document so it does not require a field
        reference.
      id: Count
      properties:
        upTo:
          description: >-
            Optional. Optional constraint on the maximum number of documents to
            count. This provides a way to set an upper bound on the number of
            documents to scan, limiting latency, and cost. Unspecified is
            interpreted as no bound. High-Level Example: ``` AGGREGATE
            COUNT_UP_TO(1000) OVER ( SELECT * FROM k ); ``` Requires: * Must be
            greater than zero when present.
          format: int64
          type: string
      type: object
    Cursor:
      description: A position in a query result set.
      id: Cursor
      properties:
        before:
          description: >-
            If the position is just before or just after the given values,
            relative to the sort order defined by the query.
          type: boolean
        values:
          description: >-
            The values that represent a position, in the order they appear in
            the order by clause of a query. Can contain fewer values than
            specified in the order by clause.
          items:
            $ref: '#/components/schemas/Value'
          type: array
      type: object
    Document:
      description: A Firestore document. Must not exceed 1 MiB - 4 bytes.
      id: Document
      properties:
        createTime:
          description: >-
            Output only. The time at which the document was created. This value
            increases monotonically when a document is deleted then recreated.
            It can also be compared to values from other documents and the
            `read_time` of a query.
          format: google-datetime
          type: string
        fields:
          additionalProperties:
            $ref: '#/components/schemas/Value'
          description: >-
            The document's fields. The map keys represent field names. Field
            names matching the regular expression `__.*__` are reserved.
            Reserved field names are forbidden except in certain documented
            contexts. The field names, represented as UTF-8, must not exceed
            1,500 bytes and cannot be empty. Field paths may be used in other
            contexts to refer to structured fields defined here. For
            `map_value`, the field path is represented by a dot-delimited (`.`)
            string of segments. Each segment is either a simple field name
            (defined below) or a quoted field name. For example, the structured
            field `"foo" : { map_value: { "x&y" : { string_value: "hello" }}}`
            would be represented by the field path `` foo.`x&y` ``. A simple
            field name contains only characters `a` to `z`, `A` to `Z`, `0` to
            `9`, or `_`, and must not start with `0` to `9`. For example,
            `foo_bar_17`. A quoted field name starts and ends with `` ` `` and
            may contain any character. Some characters, including `` ` ``, must
            be escaped using a `\`. For example, `` `x&y` `` represents `x&y`
            and `` `bak\`tik` `` represents `` bak`tik ``.
          type: object
        name:
          description: >-
            The resource name of the document, for example
            `projects/{project_id}/databases/{database_id}/documents/{document_path}`.
          type: string
        updateTime:
          description: >-
            Output only. The time at which the document was last changed. This
            value is initially set to the `create_time` then increases
            monotonically with each change to the document. It can also be
            compared to values from other documents and the `read_time` of a
            query.
          format: google-datetime
          type: string
      type: object
    DocumentChange:
      description: >-
        A Document has changed. May be the result of multiple writes, including
        deletes, that ultimately resulted in a new value for the Document.
        Multiple DocumentChange messages may be returned for the same logical
        change, if multiple targets are affected.
      id: DocumentChange
      properties:
        document:
          $ref: '#/components/schemas/Document'
          description: >-
            The new state of the Document. If `mask` is set, contains only
            fields that were updated or added.
        removedTargetIds:
          description: A set of target IDs for targets that no longer match this document.
          items:
            format: int32
            type: integer
          type: array
        targetIds:
          description: A set of target IDs of targets that match this document.
          items:
            format: int32
            type: integer
          type: array
      type: object
    DocumentDelete:
      description: >-
        A Document has been deleted. May be the result of multiple writes,
        including updates, the last of which deleted the Document. Multiple
        DocumentDelete messages may be returned for the same logical delete, if
        multiple targets are affected.
      id: DocumentDelete
      properties:
        document:
          description: The resource name of the Document that was deleted.
          type: string
        readTime:
          description: >-
            The read timestamp at which the delete was observed. Greater or
            equal to the `commit_time` of the delete.
          format: google-datetime
          type: string
        removedTargetIds:
          description: A set of target IDs for targets that previously matched this entity.
          items:
            format: int32
            type: integer
          type: array
      type: object
    DocumentMask:
      description: >-
        A set of field paths on a document. Used to restrict a get or update
        operation on a document to a subset of its fields. This is different
        from standard field masks, as this is always scoped to a Document, and
        takes in account the dynamic nature of Value.
      id: DocumentMask
      properties:
        fieldPaths:
          description: >-
            The list of field paths in the mask. See Document.fields for a field
            path syntax reference.
          items:
            type: string
          type: array
      type: object
    DocumentRemove:
      description: >-
        A Document has been removed from the view of the targets. Sent if the
        document is no longer relevant to a target and is out of view. Can be
        sent instead of a DocumentDelete or a DocumentChange if the server can
        not send the new value of the document. Multiple DocumentRemove messages
        may be returned for the same logical write or delete, if multiple
        targets are affected.
      id: DocumentRemove
      properties:
        document:
          description: The resource name of the Document that has gone out of view.
          type: string
        readTime:
          description: >-
            The read timestamp at which the remove was observed. Greater or
            equal to the `commit_time` of the change/delete/remove.
          format: google-datetime
          type: string
        removedTargetIds:
          description: >-
            A set of target IDs for targets that previously matched this
            document.
          items:
            format: int32
            type: integer
          type: array
      type: object
    DocumentTransform:
      description: A transformation of a document.
      id: DocumentTransform
      properties:
        document:
          description: The name of the document to transform.
          type: string
        fieldTransforms:
          description: >-
            The list of transformations to apply to the fields of the document,
            in order. This must not be empty.
          items:
            $ref: '#/components/schemas/FieldTransform'
          type: array
      type: object
    DocumentsTarget:
      description: A target specified by a set of documents names.
      id: DocumentsTarget
      properties:
        documents:
          description: >-
            The names of the documents to retrieve. In the format:
            `projects/{project_id}/databases/{database_id}/documents/{document_path}`.
            The request will fail if any of the document is not a child resource
            of the given `database`. Duplicate names will be elided.
          items:
            type: string
          type: array
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    ExecutePipelineRequest:
      description: The request for Firestore.ExecutePipeline.
      id: ExecutePipelineRequest
      properties:
        autoCommitTransaction:
          description: >-
            Optional. Automatically commits the transaction after the pipeline
            has been executed. Only permitted in combination with `transaction`
            or `new_transaction`.
          type: boolean
        newTransaction:
          $ref: '#/components/schemas/TransactionOptions'
          description: >-
            Execute the pipeline in a new transaction. The identifier of the
            newly created transaction will be returned in the first response on
            the stream. This defaults to a read-only transaction.
        readTime:
          description: >-
            Execute the pipeline in a snapshot transaction at the given time.
            This must be a microsecond precision timestamp within the past one
            hour, or if Point-in-Time Recovery is enabled, can additionally be a
            whole minute timestamp within the past 7 days.
          format: google-datetime
          type: string
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for this request.
        structuredPipeline:
          $ref: '#/components/schemas/StructuredPipeline'
          description: A pipelined operation.
        transaction:
          description: >-
            Run the query within an already active transaction. The value here
            is the opaque transaction ID to execute the query in.
          format: byte
          type: string
      type: object
    ExecutePipelineResponse:
      description: The response for Firestore.ExecutePipeline.
      id: ExecutePipelineResponse
      properties:
        executionTime:
          description: >-
            The time at which the results are valid. This is a (not strictly)
            monotonically increasing value across multiple responses in the same
            stream. The API guarantees that all previously returned results are
            still valid at the latest `execution_time`. This allows the API
            consumer to treat the query if it ran at the latest `execution_time`
            returned. If the query returns no results, a response with
            `execution_time` and no `results` will be sent, and this represents
            the time at which the operation was run.
          format: google-datetime
          type: string
        explainStats:
          $ref: '#/components/schemas/ExplainStats'
          description: >-
            Query explain stats. This is present on the **last** response if the
            request configured explain to run in 'analyze' or 'explain' mode in
            the pipeline options. If the query does not return any results, a
            response with `explain_stats` and no `results` will still be sent.
        results:
          description: >-
            An ordered batch of results returned executing a pipeline. The batch
            size is variable, and can even be zero for when only a partial
            progress message is returned. The fields present in the returned
            documents are only those that were explicitly requested in the
            pipeline, this includes those like `__name__` and `__update_time__`.
            This is explicitly a divergence from `Firestore.RunQuery` /
            `Firestore.GetDocument` RPCs which always return such fields even
            when they are not specified in the `mask`.
          items:
            $ref: '#/components/schemas/Document'
          type: array
        transaction:
          description: >-
            Newly created transaction identifier. This field is only specified
            as part of the first response from the server, alongside the
            `results` field when the original request specified
            ExecuteRequest.new_transaction.
          format: byte
          type: string
      type: object
    ExecutionStats:
      description: Execution statistics for the query.
      id: ExecutionStats
      properties:
        debugStats:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Debugging statistics from the execution of the query. Note that the
            debugging stats are subject to change as Firestore evolves. It could
            include: { "indexes_entries_scanned": "1000", "documents_scanned":
            "20", "billing_details" : { "documents_billable": "20",
            "index_entries_billable": "1000", "min_query_cost": "0" } }
          type: object
        executionDuration:
          description: Total time to execute the query in the backend.
          format: google-duration
          type: string
        readOperations:
          description: Total billable read operations.
          format: int64
          type: string
        resultsReturned:
          description: >-
            Total number of results returned, including documents, projections,
            aggregation results, keys.
          format: int64
          type: string
      type: object
    ExistenceFilter:
      description: A digest of all the documents that match a given target.
      id: ExistenceFilter
      properties:
        count:
          description: >-
            The total count of documents that match target_id. If different from
            the count of documents in the client that match, the client must
            manually determine which documents no longer match the target. The
            client can use the `unchanged_names` bloom filter to assist with
            this determination by testing ALL the document names against the
            filter; if the document name is NOT in the filter, it means the
            document no longer matches the target.
          format: int32
          type: integer
        targetId:
          description: The target ID to which this filter applies.
          format: int32
          type: integer
        unchangedNames:
          $ref: '#/components/schemas/BloomFilter'
          description: >-
            A bloom filter that, despite its name, contains the UTF-8 byte
            encodings of the resource names of ALL the documents that match
            target_id, in the form
            `projects/{project_id}/databases/{database_id}/documents/{document_path}`.
            This bloom filter may be omitted at the server's discretion, such as
            if it is deemed that the client will not make use of it or if it is
            too computationally expensive to calculate or transmit. Clients must
            gracefully handle this field being absent by falling back to the
            logic used before this field existed; that is, re-add the target
            without a resume token to figure out which documents in the client's
            cache are out of sync.
      type: object
    ExplainMetrics:
      description: Explain metrics for the query.
      id: ExplainMetrics
      properties:
        executionStats:
          $ref: '#/components/schemas/ExecutionStats'
          description: >-
            Aggregated stats from the execution of the query. Only present when
            ExplainOptions.analyze is set to true.
        planSummary:
          $ref: '#/components/schemas/PlanSummary'
          description: Planning phase information for the query.
      type: object
    ExplainOptions:
      description: Explain options for the query.
      id: ExplainOptions
      properties:
        analyze:
          description: >-
            Optional. Whether to execute this query. When false (the default),
            the query will be planned, returning only metrics from the planning
            stages. When true, the query will be planned and executed, returning
            the full query results along with both planning and execution stage
            metrics.
          type: boolean
      type: object
    ExplainStats:
      description: >-
        Pipeline explain stats. Depending on the explain options in the original
        request, this can contain the optimized plan and / or execution stats.
      id: ExplainStats
      properties:
        data:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The format depends on the `output_format` options in the request.
            Currently there are two supported options: `TEXT` and `JSON`. Both
            supply a `google.protobuf.StringValue`.
          type: object
      type: object
    FieldFilter:
      description: A filter on a specific field.
      id: FieldFilter
      properties:
        field:
          $ref: '#/components/schemas/FieldReference'
          description: The field to filter by.
        op:
          description: The operator to filter by.
          enum:
            - OPERATOR_UNSPECIFIED
            - LESS_THAN
            - LESS_THAN_OR_EQUAL
            - GREATER_THAN
            - GREATER_THAN_OR_EQUAL
            - EQUAL
            - NOT_EQUAL
            - ARRAY_CONTAINS
            - IN
            - ARRAY_CONTAINS_ANY
            - NOT_IN
          enumDescriptions:
            - Unspecified. This value must not be used.
            - >-
              The given `field` is less than the given `value`. Requires: * That
              `field` come first in `order_by`.
            - >-
              The given `field` is less than or equal to the given `value`.
              Requires: * That `field` come first in `order_by`.
            - >-
              The given `field` is greater than the given `value`. Requires: *
              That `field` come first in `order_by`.
            - >-
              The given `field` is greater than or equal to the given `value`.
              Requires: * That `field` come first in `order_by`.
            - The given `field` is equal to the given `value`.
            - >-
              The given `field` is not equal to the given `value`. Requires: *
              No other `NOT_EQUAL`, `NOT_IN`, `IS_NOT_NULL`, or `IS_NOT_NAN`. *
              That `field` comes first in the `order_by`.
            - The given `field` is an array that contains the given `value`.
            - >-
              The given `field` is equal to at least one value in the given
              array. Requires: * That `value` is a non-empty `ArrayValue`,
              subject to disjunction limits. * No `NOT_IN` filters in the same
              query.
            - >-
              The given `field` is an array that contains any of the values in
              the given array. Requires: * That `value` is a non-empty
              `ArrayValue`, subject to disjunction limits. * No other
              `ARRAY_CONTAINS_ANY` filters within the same disjunction. * No
              `NOT_IN` filters in the same query.
            - >-
              The value of the `field` is not in the given array. Requires: *
              That `value` is a non-empty `ArrayValue` with at most 10 values. *
              No other `OR`, `IN`, `ARRAY_CONTAINS_ANY`, `NOT_IN`, `NOT_EQUAL`,
              `IS_NOT_NULL`, or `IS_NOT_NAN`. * That `field` comes first in the
              `order_by`.
          type: string
        value:
          $ref: '#/components/schemas/Value'
          description: The value to compare to.
      type: object
    FieldReference:
      description: 'A reference to a field in a document, ex: `stats.operations`.'
      id: FieldReference
      properties:
        fieldPath:
          description: >-
            A reference to a field in a document. Requires: * MUST be a
            dot-delimited (`.`) string of segments, where each segment conforms
            to document field name limitations.
          type: string
      type: object
    FieldTransform:
      description: A transformation of a field of the document.
      id: FieldTransform
      properties:
        appendMissingElements:
          $ref: '#/components/schemas/ArrayValue'
          description: >-
            Append the given elements in order if they are not already present
            in the current field value. If the field is not an array, or if the
            field does not yet exist, it is first set to the empty array.
            Equivalent numbers of different types (e.g. 3L and 3.0) are
            considered equal when checking if a value is missing. NaN is equal
            to NaN, and Null is equal to Null. If the input contains multiple
            equivalent values, only the first will be considered. The
            corresponding transform_result will be the null value.
        fieldPath:
          description: >-
            The path of the field. See Document.fields for the field path syntax
            reference.
          type: string
        increment:
          $ref: '#/components/schemas/Value'
          description: >-
            Adds the given value to the field's current value. This must be an
            integer or a double value. If the field is not an integer or double,
            or if the field does not yet exist, the transformation will set the
            field to the given value. If either of the given value or the
            current field value are doubles, both values will be interpreted as
            doubles. Double arithmetic and representation of double values
            follow IEEE 754 semantics. If there is positive/negative integer
            overflow, the field is resolved to the largest magnitude
            positive/negative integer.
        maximum:
          $ref: '#/components/schemas/Value'
          description: >-
            Sets the field to the maximum of its current value and the given
            value. This must be an integer or a double value. If the field is
            not an integer or double, or if the field does not yet exist, the
            transformation will set the field to the given value. If a maximum
            operation is applied where the field and the input value are of
            mixed types (that is - one is an integer and one is a double) the
            field takes on the type of the larger operand. If the operands are
            equivalent (e.g. 3 and 3.0), the field does not change. 0, 0.0, and
            -0.0 are all zero. The maximum of a zero stored value and zero input
            value is always the stored value. The maximum of any numeric value x
            and NaN is NaN.
        minimum:
          $ref: '#/components/schemas/Value'
          description: >-
            Sets the field to the minimum of its current value and the given
            value. This must be an integer or a double value. If the field is
            not an integer or double, or if the field does not yet exist, the
            transformation will set the field to the input value. If a minimum
            operation is applied where the field and the input value are of
            mixed types (that is - one is an integer and one is a double) the
            field takes on the type of the smaller operand. If the operands are
            equivalent (e.g. 3 and 3.0), the field does not change. 0, 0.0, and
            -0.0 are all zero. The minimum of a zero stored value and zero input
            value is always the stored value. The minimum of any numeric value x
            and NaN is NaN.
        removeAllFromArray:
          $ref: '#/components/schemas/ArrayValue'
          description: >-
            Remove all of the given elements from the array in the field. If the
            field is not an array, or if the field does not yet exist, it is set
            to the empty array. Equivalent numbers of the different types (e.g.
            3L and 3.0) are considered equal when deciding whether an element
            should be removed. NaN is equal to NaN, and Null is equal to Null.
            This will remove all equivalent values if there are duplicates. The
            corresponding transform_result will be the null value.
        setToServerValue:
          description: Sets the field to the given server value.
          enum:
            - SERVER_VALUE_UNSPECIFIED
            - REQUEST_TIME
          enumDescriptions:
            - Unspecified. This value must not be used.
            - >-
              The time at which the server processed the request, with
              millisecond precision. If used on multiple fields (same or
              different documents) in a transaction, all the fields will get the
              same server timestamp.
          type: string
      type: object
    Filter:
      description: A filter.
      id: Filter
      properties:
        compositeFilter:
          $ref: '#/components/schemas/CompositeFilter'
          description: A composite filter.
        fieldFilter:
          $ref: '#/components/schemas/FieldFilter'
          description: A filter on a document field.
        unaryFilter:
          $ref: '#/components/schemas/UnaryFilter'
          description: A filter that takes exactly one argument.
      type: object
    FindNearest:
      description: >-
        Nearest Neighbors search config. The ordering provided by FindNearest
        supersedes the order_by stage. If multiple documents have the same
        vector distance, the returned document order is not guaranteed to be
        stable between queries.
      id: FindNearest
      properties:
        distanceMeasure:
          description: Required. The distance measure to use, required.
          enum:
            - DISTANCE_MEASURE_UNSPECIFIED
            - EUCLIDEAN
            - COSINE
            - DOT_PRODUCT
          enumDescriptions:
            - Should not be set.
            - >-
              Measures the EUCLIDEAN distance between the vectors. See
              [Euclidean](https://en.wikipedia.org/wiki/Euclidean_distance) to
              learn more. The resulting distance decreases the more similar two
              vectors are.
            - >-
              COSINE distance compares vectors based on the angle between them,
              which allows you to measure similarity that isn't based on the
              vectors magnitude. We recommend using DOT_PRODUCT with unit
              normalized vectors instead of COSINE distance, which is
              mathematically equivalent with better performance. See [Cosine
              Similarity](https://en.wikipedia.org/wiki/Cosine_similarity) to
              learn more about COSINE similarity and COSINE distance. The
              resulting COSINE distance decreases the more similar two vectors
              are.
            - >-
              Similar to cosine but is affected by the magnitude of the vectors.
              See [Dot Product](https://en.wikipedia.org/wiki/Dot_product) to
              learn more. The resulting distance increases the more similar two
              vectors are.
          type: string
        distanceResultField:
          description: >-
            Optional. Optional name of the field to output the result of the
            vector distance calculation. Must conform to document field name
            limitations.
          type: string
        distanceThreshold:
          description: >-
            Optional. Option to specify a threshold for which no less similar
            documents will be returned. The behavior of the specified
            `distance_measure` will affect the meaning of the distance
            threshold. Since DOT_PRODUCT distances increase when the vectors are
            more similar, the comparison is inverted. * For EUCLIDEAN, COSINE:
            `WHERE distance <= distance_threshold` * For DOT_PRODUCT: `WHERE
            distance >= distance_threshold`
          format: double
          type: number
        limit:
          description: >-
            Required. The number of nearest neighbors to return. Must be a
            positive integer of no more than 1000.
          format: int32
          type: integer
        queryVector:
          $ref: '#/components/schemas/Value'
          description: >-
            Required. The query vector that we are searching on. Must be a
            vector of no more than 2048 dimensions.
        vectorField:
          $ref: '#/components/schemas/FieldReference'
          description: >-
            Required. An indexed vector field to search upon. Only documents
            which contain vectors whose dimensionality match the query_vector
            can be returned.
      type: object
    Function:
      description: >-
        Represents an unevaluated scalar expression. For example, the expression
        `like(user_name, "%alice%")` is represented as: ``` name: "like" args {
        field_reference: "user_name" } args { string_value: "%alice%" } ```
      id: Function
      properties:
        args:
          description: Optional. Ordered list of arguments the given function expects.
          items:
            $ref: '#/components/schemas/Value'
          type: array
        name:
          description: >-
            Required. The name of the function to evaluate. **Requires:** * must
            be in snake case (lower case with underscore separator).
          type: string
        options:
          additionalProperties:
            $ref: '#/components/schemas/Value'
          description: >-
            Optional. Optional named arguments that certain functions may
            support.
          type: object
      type: object
    GoogleFirestoreAdminV1Backup:
      description: >-
        A Backup of a Cloud Firestore Database. The backup contains all
        documents and index configurations for the given database at a specific
        point in time.
      id: GoogleFirestoreAdminV1Backup
      properties:
        database:
          description: >-
            Output only. Name of the Firestore database that the backup is from.
            Format is `projects/{project}/databases/{database}`.
          readOnly: true
          type: string
        databaseUid:
          description: >-
            Output only. The system-generated UUID4 for the Firestore database
            that the backup is from.
          readOnly: true
          type: string
        expireTime:
          description: Output only. The timestamp at which this backup expires.
          format: google-datetime
          readOnly: true
          type: string
        name:
          description: >-
            Output only. The unique resource name of the Backup. Format is
            `projects/{project}/locations/{location}/backups/{backup}`. The
            location in the name will be the Standard Managed Multi-Region
            (SMMR) location (e.g. `us`) if the backup was created with an SMMR
            location, or the Google Managed Multi-Region (GMMR) location (e.g.
            `nam5`) if the backup was created with a GMMR location.
          readOnly: true
          type: string
        snapshotTime:
          description: >-
            Output only. The backup contains an externally consistent copy of
            the database at this time.
          format: google-datetime
          readOnly: true
          type: string
        state:
          description: Output only. The current state of the backup.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - NOT_AVAILABLE
          enumDescriptions:
            - The state is unspecified.
            - >-
              The pending backup is still being created. Operations on the
              backup will be rejected in this state.
            - The backup is complete and ready to use.
            - The backup is not available at this moment.
          readOnly: true
          type: string
        stats:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Stats'
          description: >-
            Output only. Statistics about the backup. This data only becomes
            available after the backup is fully materialized to secondary
            storage. This field will be empty till then.
          readOnly: true
      type: object
    GoogleFirestoreAdminV1BackupSchedule:
      description: >-
        A backup schedule for a Cloud Firestore Database. This resource is owned
        by the database it is backing up, and is deleted along with the
        database. The actual backups are not though.
      id: GoogleFirestoreAdminV1BackupSchedule
      properties:
        createTime:
          description: >-
            Output only. The timestamp at which this backup schedule was created
            and effective since. No backups will be created for this schedule
            before this time.
          format: google-datetime
          readOnly: true
          type: string
        dailyRecurrence:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1DailyRecurrence'
          description: For a schedule that runs daily.
        name:
          description: >-
            Output only. The unique backup schedule identifier across all
            locations and databases for the given project. This will be
            auto-assigned. Format is
            `projects/{project}/databases/{database}/backupSchedules/{backup_schedule}`
          readOnly: true
          type: string
        retention:
          description: >-
            At what relative time in the future, compared to its creation time,
            the backup should be deleted, e.g. keep backups for 7 days. The
            maximum supported retention period is 14 weeks.
          format: google-duration
          type: string
        updateTime:
          description: >-
            Output only. The timestamp at which this backup schedule was most
            recently updated. When a backup schedule is first created, this is
            the same as create_time.
          format: google-datetime
          readOnly: true
          type: string
        weeklyRecurrence:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1WeeklyRecurrence'
          description: For a schedule that runs weekly on a specific day.
      type: object
    GoogleFirestoreAdminV1BackupSource:
      description: Information about a backup that was used to restore a database.
      id: GoogleFirestoreAdminV1BackupSource
      properties:
        backup:
          description: >-
            The resource name of the backup that was used to restore this
            database. Format:
            `projects/{project}/locations/{location}/backups/{backup}`.
          type: string
      type: object
    GoogleFirestoreAdminV1BulkDeleteDocumentsMetadata:
      description: >-
        Metadata for google.longrunning.Operation results from
        FirestoreAdmin.BulkDeleteDocuments.
      id: GoogleFirestoreAdminV1BulkDeleteDocumentsMetadata
      properties:
        collectionIds:
          description: The IDs of the collection groups that are being deleted.
          items:
            type: string
          type: array
        endTime:
          description: >-
            The time this operation completed. Will be unset if operation still
            in progress.
          format: google-datetime
          type: string
        namespaceIds:
          description: Which namespace IDs are being deleted.
          items:
            type: string
          type: array
        operationState:
          description: The state of the operation.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - INITIALIZING
            - PROCESSING
            - CANCELLING
            - FINALIZING
            - SUCCESSFUL
            - FAILED
            - CANCELLED
          enumDescriptions:
            - Unspecified.
            - Request is being prepared for processing.
            - Request is actively being processed.
            - >-
              Request is in the process of being cancelled after user called
              google.longrunning.Operations.CancelOperation on the operation.
            - Request has been processed and is in its finalization stage.
            - Request has completed successfully.
            - Request has finished being processed, but encountered an error.
            - >-
              Request has finished being cancelled after user called
              google.longrunning.Operations.CancelOperation.
          type: string
        progressBytes:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Progress'
          description: The progress, in bytes, of this operation.
        progressDocuments:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Progress'
          description: The progress, in documents, of this operation.
        snapshotTime:
          description: >-
            The timestamp that corresponds to the version of the database that
            is being read to get the list of documents to delete. This time can
            also be used as the timestamp of PITR in case of disaster recovery
            (subject to PITR window limit).
          format: google-datetime
          type: string
        startTime:
          description: The time this operation started.
          format: google-datetime
          type: string
      type: object
    GoogleFirestoreAdminV1BulkDeleteDocumentsRequest:
      description: >-
        The request for FirestoreAdmin.BulkDeleteDocuments. When both
        collection_ids and namespace_ids are set, only documents satisfying both
        conditions will be deleted. Requests with namespace_ids and
        collection_ids both empty will be rejected. Please use
        FirestoreAdmin.DeleteDatabase instead.
      id: GoogleFirestoreAdminV1BulkDeleteDocumentsRequest
      properties:
        collectionIds:
          description: >-
            Optional. IDs of the collection groups to delete. Unspecified means
            all collection groups. Each collection group in this list must be
            unique.
          items:
            type: string
          type: array
        namespaceIds:
          description: >-
            Optional. Namespaces to delete. An empty list means all namespaces.
            This is the recommended usage for databases that don't use
            namespaces. An empty string element represents the default
            namespace. This should be used if the database has data in
            non-default namespaces, but doesn't want to delete from them. Each
            namespace in this list must be unique.
          items:
            type: string
          type: array
      type: object
    GoogleFirestoreAdminV1ChangeStream:
      description: >-
        A Change Stream is a resource that allows users to receive change
        notifications from a Firestore database.
      id: GoogleFirestoreAdminV1ChangeStream
      properties:
        collectionGroupScope:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1CollectionGroupScope'
          description: If set, the change stream is scoped to a collection group.
        createTime:
          description: Output only. The time the Change Stream was created.
          format: google-datetime
          readOnly: true
          type: string
        databaseScope:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1DatabaseScope'
          description: If set, the change stream is scoped to the entire database.
        etag:
          description: >-
            Optional. An etag used to determine which version of the
            configuration is being edited.
          type: string
        name:
          description: >-
            Identifier. The external resource name of the change stream. Format
            `projects/{project}/databases/{database}/changeStreams/{change_stream}`
          type: string
        retentionPeriod:
          description: >-
            Required. The retention period of the change stream. This is the
            amount of time a change event is available on the change stream.
            Must be from 1 to 7 days, inclusive. The retention_period must be in
            day granularity, i.e. it must be a multiple of 24 hours.
          format: google-duration
          type: string
        startTime:
          description: Output only. The time the Change Stream started recording events.
          format: google-datetime
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time the Change Stream was last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleFirestoreAdminV1CloneDatabaseMetadata:
      description: Metadata for the long-running operation from the CloneDatabase request.
      id: GoogleFirestoreAdminV1CloneDatabaseMetadata
      properties:
        database:
          description: The name of the database being cloned to.
          type: string
        endTime:
          description: The time the clone finished, unset for ongoing clones.
          format: google-datetime
          type: string
        operationState:
          description: The operation state of the clone.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - INITIALIZING
            - PROCESSING
            - CANCELLING
            - FINALIZING
            - SUCCESSFUL
            - FAILED
            - CANCELLED
          enumDescriptions:
            - Unspecified.
            - Request is being prepared for processing.
            - Request is actively being processed.
            - >-
              Request is in the process of being cancelled after user called
              google.longrunning.Operations.CancelOperation on the operation.
            - Request has been processed and is in its finalization stage.
            - Request has completed successfully.
            - Request has finished being processed, but encountered an error.
            - >-
              Request has finished being cancelled after user called
              google.longrunning.Operations.CancelOperation.
          type: string
        pitrSnapshot:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1PitrSnapshot'
          description: The snapshot from which this database was cloned.
        progressPercentage:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Progress'
          description: >-
            How far along the clone is as an estimated percentage of remaining
            time.
        startTime:
          description: The time the clone was started.
          format: google-datetime
          type: string
      type: object
    GoogleFirestoreAdminV1CloneDatabaseRequest:
      description: The request message for FirestoreAdmin.CloneDatabase.
      id: GoogleFirestoreAdminV1CloneDatabaseRequest
      properties:
        databaseId:
          description: >-
            Required. The ID to use for the database, which will become the
            final component of the database's resource name. This database ID
            must not be associated with an existing database. This value should
            be 4-63 characters. Valid characters are /a-z-/ with first character
            a letter and the last a letter or a number. Must not be UUID-like
            /[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}/. "(default)" database ID
            is also valid if the database is Standard edition.
          type: string
        encryptionConfig:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1EncryptionConfig'
          description: >-
            Optional. Encryption configuration for the cloned database. If this
            field is not specified, the cloned database will use the same
            encryption configuration as the source database, namely
            use_source_encryption.
        pitrSnapshot:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1PitrSnapshot'
          description: >-
            Required. Specification of the PITR data to clone from. The source
            database must exist. The cloned database will be created in the same
            location as the source database.
        tags:
          additionalProperties:
            type: string
          description: >-
            Optional. Immutable. Tags to be bound to the cloned database. The
            tags should be provided in the format of `tagKeys/{tag_key_id} ->
            tagValues/{tag_value_id}`.
          type: object
      type: object
    GoogleFirestoreAdminV1CmekConfig:
      description: >-
        The CMEK (Customer Managed Encryption Key) configuration for a Firestore
        database. If not present, the database is secured by the default Google
        encryption key.
      id: GoogleFirestoreAdminV1CmekConfig
      properties:
        activeKeyVersion:
          description: >-
            Output only. Currently in-use [KMS key
            versions](https://cloud.google.com/kms/docs/resource-hierarchy#key_versions).
            During [key
            rotation](https://cloud.google.com/kms/docs/key-rotation), there can
            be multiple in-use key versions. The expected format is
            `projects/{project_id}/locations/{kms_location}/keyRings/{key_ring}/cryptoKeys/{crypto_key}/cryptoKeyVersions/{key_version}`.
          items:
            type: string
          readOnly: true
          type: array
        kmsKeyName:
          description: >-
            Required. Only keys in the same location as this database are
            allowed to be used for encryption. For Firestore's nam5
            multi-region, this corresponds to Cloud KMS multi-region us. For
            Firestore's eur3 multi-region, this corresponds to Cloud KMS
            multi-region europe. See
            https://cloud.google.com/kms/docs/locations. The expected format is
            `projects/{project_id}/locations/{kms_location}/keyRings/{key_ring}/cryptoKeys/{crypto_key}`.
          type: string
      type: object
    GoogleFirestoreAdminV1CollectionGroupScope:
      description: >-
        The change stream is scoped to a collection group. Only events
        associated with the given collection group are visible to the Change
        Stream. Only a single change stream can be enabled per collection group.
      id: GoogleFirestoreAdminV1CollectionGroupScope
      properties:
        collectionGroupId:
          description: Required. The collection group name.
          type: string
      type: object
    GoogleFirestoreAdminV1CreateDatabaseMetadata:
      description: Metadata related to the create database operation.
      id: GoogleFirestoreAdminV1CreateDatabaseMetadata
      properties: {}
      type: object
    GoogleFirestoreAdminV1CustomerManagedEncryptionOptions:
      description: >-
        The configuration options for using CMEK (Customer Managed Encryption
        Key) encryption.
      id: GoogleFirestoreAdminV1CustomerManagedEncryptionOptions
      properties:
        kmsKeyName:
          description: >-
            Required. Only keys in the same location as the database are allowed
            to be used for encryption. For Firestore's nam5 multi-region, this
            corresponds to Cloud KMS multi-region us. For Firestore's eur3
            multi-region, this corresponds to Cloud KMS multi-region europe. See
            https://cloud.google.com/kms/docs/locations. The expected format is
            `projects/{project_id}/locations/{kms_location}/keyRings/{key_ring}/cryptoKeys/{crypto_key}`.
          type: string
      type: object
    GoogleFirestoreAdminV1DailyRecurrence:
      description: >-
        Represents a recurring schedule that runs every day. The time zone is
        UTC.
      id: GoogleFirestoreAdminV1DailyRecurrence
      properties: {}
      type: object
    GoogleFirestoreAdminV1Database:
      description: A Cloud Firestore Database.
      id: GoogleFirestoreAdminV1Database
      properties:
        appEngineIntegrationMode:
          description: The App Engine integration mode to use for this database.
          enum:
            - APP_ENGINE_INTEGRATION_MODE_UNSPECIFIED
            - ENABLED
            - DISABLED
          enumDescriptions:
            - Not used.
            - >-
              If an App Engine application exists in the same region as this
              database, App Engine configuration will impact this database. This
              includes disabling of the application & database, as well as
              disabling writes to the database.
            - >-
              App Engine has no effect on the ability of this database to serve
              requests. This is the default setting for databases created with
              the Firestore API.
          type: string
        cmekConfig:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1CmekConfig'
          description: Optional. Presence indicates CMEK is enabled for this database.
        concurrencyMode:
          description: >-
            The default concurrency control mode to use for this database. If
            unspecified in a CreateDatabase request, this will default based on
            the database edition: Optimistic for Enterprise and Pessimistic for
            all other databases. While transactions can explicitly specify their
            own concurrency mode, this setting defines the default behavior when
            left unspecified. Important: This database-level setting is not
            respected for Firestore with MongoDB compatibility. All transactions
            through the MongoDB compatibility layer will use optimistic
            concurrency control, regardless of this setting.
          enum:
            - CONCURRENCY_MODE_UNSPECIFIED
            - OPTIMISTIC
            - PESSIMISTIC
            - OPTIMISTIC_WITH_ENTITY_GROUPS
          enumDescriptions:
            - Not used.
            - >-
              Use optimistic concurrency control by default. This mode is
              available for Cloud Firestore databases. This is the default
              setting for Cloud Firestore Enterprise edition databases.
            - >-
              Use pessimistic concurrency control by default. This mode is
              available for Cloud Firestore databases. This is the default
              setting for Cloud Firestore Standard edition databases.
            - >-
              Use optimistic concurrency control with entity groups by default.
              This mode is enabled for some databases that were automatically
              upgraded from Cloud Datastore to Cloud Firestore with Datastore
              Mode. It is not recommended for any new databases, and not
              supported for Firestore Native databases.
          type: string
        createTime:
          description: >-
            Output only. The timestamp at which this database was created.
            Databases created before 2016 do not populate create_time.
          format: google-datetime
          readOnly: true
          type: string
        databaseEdition:
          description: Immutable. The edition of the database.
          enum:
            - DATABASE_EDITION_UNSPECIFIED
            - STANDARD
            - ENTERPRISE
          enumDescriptions:
            - Not used.
            - Standard edition. This is the default setting if not specified.
            - Enterprise edition.
          type: string
        deleteProtectionState:
          description: State of delete protection for the database.
          enum:
            - DELETE_PROTECTION_STATE_UNSPECIFIED
            - DELETE_PROTECTION_DISABLED
            - DELETE_PROTECTION_ENABLED
          enumDescriptions:
            - The default value. Delete protection type is not specified
            - Delete protection is disabled
            - Delete protection is enabled
          type: string
        deleteTime:
          description: >-
            Output only. The timestamp at which this database was deleted. Only
            set if the database has been deleted.
          format: google-datetime
          readOnly: true
          type: string
        earliestVersionTime:
          description: >-
            Output only. The earliest timestamp at which older versions of the
            data can be read from the database. See [version_retention_period]
            above; this field is populated with `now -
            version_retention_period`. This value is continuously updated, and
            becomes stale the moment it is queried. If you are using this value
            to recover data, make sure to account for the time from the moment
            when the value is queried to the moment when you initiate the
            recovery.
          format: google-datetime
          readOnly: true
          type: string
        etag:
          description: >-
            This checksum is computed by the server based on the value of other
            fields, and may be sent on update and delete requests to ensure the
            client has an up-to-date value before proceeding.
          type: string
        firestoreDataAccessMode:
          description: >-
            Optional. The Firestore API data access mode to use for this
            database. If not set on write: - the default value is
            DATA_ACCESS_MODE_DISABLED for Enterprise edition. - the default
            value is DATA_ACCESS_MODE_ENABLED for Standard edition.
          enum:
            - DATA_ACCESS_MODE_UNSPECIFIED
            - DATA_ACCESS_MODE_ENABLED
            - DATA_ACCESS_MODE_DISABLED
          enumDescriptions:
            - Not Used.
            - Accessing the database through the API is allowed.
            - Accessing the database through the API is disallowed.
          type: string
        freeTier:
          description: >-
            Output only. Background: Free tier is the ability of a Firestore
            database to use a small amount of resources every day without being
            charged. Once usage exceeds the free tier limit further usage is
            charged. Whether this database can make use of the free tier. Only
            one database per project can be eligible for the free tier. The
            first (or next) database that is created in a project without a free
            tier database will be marked as eligible for the free tier.
            Databases that are created while there is a free tier database will
            not be eligible for the free tier.
          readOnly: true
          type: boolean
        keyPrefix:
          description: >-
            Output only. The key_prefix for this database. This key_prefix is
            used, in combination with the project ID ("~") to construct the
            application ID that is returned from the Cloud Datastore APIs in
            Google App Engine first generation runtimes. This value may be empty
            in which case the appid to use for URL-encoded keys is the
            project_id (eg: foo instead of v~foo).
          readOnly: true
          type: string
        locationId:
          description: >-
            Required. The location of the database. Available locations are
            listed at https://cloud.google.com/firestore/docs/locations.
          type: string
        mongodbCompatibleDataAccessMode:
          description: >-
            Optional. The MongoDB compatible API data access mode to use for
            this database. If not set on write, the default value is
            DATA_ACCESS_MODE_ENABLED for Enterprise edition. The value is always
            DATA_ACCESS_MODE_DISABLED for Standard edition.
          enum:
            - DATA_ACCESS_MODE_UNSPECIFIED
            - DATA_ACCESS_MODE_ENABLED
            - DATA_ACCESS_MODE_DISABLED
          enumDescriptions:
            - Not Used.
            - Accessing the database through the API is allowed.
            - Accessing the database through the API is disallowed.
          type: string
        name:
          description: >-
            The resource name of the Database. Format:
            `projects/{project}/databases/{database}`
          type: string
        pointInTimeRecoveryEnablement:
          description: Whether to enable the PITR feature on this database.
          enum:
            - POINT_IN_TIME_RECOVERY_ENABLEMENT_UNSPECIFIED
            - POINT_IN_TIME_RECOVERY_ENABLED
            - POINT_IN_TIME_RECOVERY_DISABLED
          enumDescriptions:
            - Not used.
            - >-
              Reads are supported on selected versions of the data from within
              the past 7 days: * Reads against any timestamp within the past
              hour * Reads against 1-minute snapshots beyond 1 hour and within 7
              days `version_retention_period` and `earliest_version_time` can be
              used to determine the supported versions.
            - >-
              Reads are supported on any version of the data from within the
              past 1 hour.
          type: string
        previousId:
          description: >-
            Output only. The database resource's prior database ID. This field
            is only populated for deleted databases.
          readOnly: true
          type: string
        realtimeUpdatesMode:
          description: >-
            Immutable. The default Realtime Updates mode to use for this
            database.
          enum:
            - REALTIME_UPDATES_MODE_UNSPECIFIED
            - REALTIME_UPDATES_MODE_ENABLED
            - REALTIME_UPDATES_MODE_DISABLED
          enumDescriptions:
            - The Realtime Updates feature is not specified.
            - >-
              The Realtime Updates feature is enabled by default. This could
              potentially degrade write performance for the database.
            - The Realtime Updates feature is disabled by default.
          type: string
        sourceInfo:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1SourceInfo'
          description: Output only. Information about the provenance of this database.
          readOnly: true
        tags:
          additionalProperties:
            type: string
          description: >-
            Optional. Input only. Immutable. Tag keys/values directly bound to
            this resource. For example: "123/environment": "production",
            "123/costCenter": "marketing"
          type: object
        type:
          description: >-
            Required. The type of the database. See
            https://cloud.google.com/datastore/docs/firestore-or-datastore for
            information about how to choose.
          enum:
            - DATABASE_TYPE_UNSPECIFIED
            - FIRESTORE_NATIVE
            - DATASTORE_MODE
          enumDescriptions:
            - Not used.
            - Firestore Native Mode
            - Firestore in Datastore Mode.
          type: string
        uid:
          description: Output only. The system-generated UUID4 for this Database.
          readOnly: true
          type: string
        updateTime:
          description: >-
            Output only. The timestamp at which this database was most recently
            updated. Note this only includes updates to the database resource
            and not data contained by the database.
          format: google-datetime
          readOnly: true
          type: string
        versionRetentionPeriod:
          description: >-
            Output only. The period during which past versions of data are
            retained in the database. Any read or query can specify a
            `read_time` within this window, and will read the state of the
            database at that time. If the PITR feature is enabled, the retention
            period is 7 days. Otherwise, the retention period is 1 hour.
          format: google-duration
          readOnly: true
          type: string
      type: object
    GoogleFirestoreAdminV1DatabaseScope:
      description: >-
        The change stream is scoped to the entire database. All events in the
        database are visible to the Change Stream. One Database scope Change
        Stream is allowed per database.
      id: GoogleFirestoreAdminV1DatabaseScope
      properties: {}
      type: object
    GoogleFirestoreAdminV1DeleteDatabaseMetadata:
      description: Metadata related to the delete database operation.
      id: GoogleFirestoreAdminV1DeleteDatabaseMetadata
