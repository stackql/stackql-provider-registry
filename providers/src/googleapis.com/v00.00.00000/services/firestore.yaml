      type: object
    GoogleFirestoreAdminV1ImportDocumentsRequest:
      description: The request for FirestoreAdmin.ImportDocuments.
      id: GoogleFirestoreAdminV1ImportDocumentsRequest
      properties:
        collectionIds:
          description: >-
            IDs of the collection groups to import. Unspecified means all
            collection groups that were included in the export. Each collection
            group in this list must be unique.
          items:
            type: string
          type: array
        inputUriPrefix:
          description: >-
            Location of the exported files. This must match the
            output_uri_prefix of an ExportDocumentsResponse from an export that
            has completed successfully. See:
            google.firestore.admin.v1.ExportDocumentsResponse.output_uri_prefix.
          type: string
        namespaceIds:
          description: >-
            An empty list represents all namespaces. This is the preferred usage
            for databases that don't use namespaces. An empty string element
            represents the default namespace. This should be used if the
            database has data in non-default namespaces, but doesn't want to
            include them. Each namespace in this list must be unique.
          items:
            type: string
          type: array
      type: object
    GoogleFirestoreAdminV1Index:
      description: >-
        Cloud Firestore indexes enable simple and complex queries against
        documents in a database. In Standard edition databases, single-field
        indexes are managed using the google.firestore.admin.v1.Field resource,
        and composite indexes are managed using the
        google.firestore.admin.v1.Index resource. In Enterprise edition
        databases, both single-field and composite indexes are managed using the
        google.firestore.admin.v1.Index resource.
      id: GoogleFirestoreAdminV1Index
      properties:
        apiScope:
          description: The API scope supported by this index.
          enum:
            - ANY_API
            - DATASTORE_MODE_API
            - MONGODB_COMPATIBLE_API
          enumDescriptions:
            - >-
              The index can only be used by the Firestore Native query API. This
              is the default.
            - >-
              The index can only be used by the Firestore in Datastore Mode
              query API.
            - The index can only be used by the MONGODB_COMPATIBLE_API.
          type: string
        density:
          description: Immutable. The density configuration of the index.
          enum:
            - DENSITY_UNSPECIFIED
            - SPARSE_ALL
            - SPARSE_ANY
            - DENSE
          enumDescriptions:
            - >-
              Unspecified. It will use database default setting. This value is
              input only.
            - >-
              An index entry will only exist if ALL fields are present in the
              document. This is both the default and only allowed value for
              Standard edition databases (for both Cloud Firestore `ANY_API` and
              Cloud Datastore `DATASTORE_MODE_API`). Take for example the
              following document: ``` { "__name__": "...", "a": 1, "b": 2, "c":
              3 } ``` an index on `(a ASC, b ASC, c ASC, __name__ ASC)` will
              generate an index entry for this document since `a`, 'b', `c`, and
              `__name__` are all present but an index of `(a ASC, d ASC,
              __name__ ASC)` will not generate an index entry for this document
              since `d` is missing. This means that such indexes can only be
              used to serve a query when the query has either implicit or
              explicit requirements that all fields from the index are present.
            - >-
              An index entry will exist if ANY field are present in the
              document. This is used as the definition of a sparse index for
              Enterprise edition databases. Take for example the following
              document: ``` { "__name__": "...", "a": 1, "b": 2, "c": 3 } ``` an
              index on `(a ASC, d ASC)` will generate an index entry for this
              document since `a` is present, and will fill in an `unset` value
              for `d`. An index on `(d ASC, e ASC)` will not generate any index
              entry as neither `d` nor `e` are present. An index that contains
              `__name__` will generate an index entry for all documents since
              Firestore guarantees that all documents have a `__name__` field.
            - >-
              An index entry will exist regardless of if the fields are present
              or not. This is the default density for an Enterprise edition
              database. The index will store `unset` values for fields that are
              not present in the document.
          type: string
        fields:
          description: >-
            The fields supported by this index. At most 100 fields may be
            specified. In Standard edition databases only: - At least 2 fields
            must be specified. - The last field entry is always for the field
            path `__name__`. If, on creation, `__name__` was not specified as
            the last field, it will be added automatically with the same
            direction as that of the last field defined. If the final field in
            the index is not directional, the `__name__` will be ordered
            ASCENDING (unless explicitly specified).
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1IndexField'
          type: array
        multikey:
          description: >-
            Optional. Whether the index is multikey. By default, the index is
            not multikey. For non-multikey indexes, none of the paths in the
            index definition reach or traverse an array, except via an explicit
            array index. For multikey indexes, at most one of the paths in the
            index definition reach or traverse an array, except via an explicit
            array index. Violations will result in errors. Note this field only
            applies to index with MONGODB_COMPATIBLE_API ApiScope.
          type: boolean
        name:
          description: >-
            A server-defined name for this index. Output only. When used in the
            google.firestore.admin.v1.Index resource, the value is of the form:
            `projects/{project_id}/databases/{database_id}/collectionGroups/{collection_id}/indexes/{index_id}`
            When used in the google.firestore.admin.v1.Field resource, the value
            is empty.
          type: string
        queryScope:
          description: >-
            Indexes with a collection query scope specified allow queries
            against a collection that is the child of a specific document,
            specified at query time, and that has the same collection ID.
            Indexes with a collection group query scope specified allow queries
            against all collections descended from a specific document,
            specified at query time, and that have the same collection ID as
            this index.
          enum:
            - QUERY_SCOPE_UNSPECIFIED
            - COLLECTION
            - COLLECTION_GROUP
            - COLLECTION_RECURSIVE
          enumDescriptions:
            - The query scope is unspecified. Not a valid option.
            - >-
              Indexes with a collection query scope specified allow queries
              against a collection that is the child of a specific document,
              specified at query time, and that has the collection ID specified
              by the index.
            - >-
              Indexes with a collection group query scope specified allow
              queries against all collections that has the collection ID
              specified by the index.
            - >-
              Include all the collections's ancestor in the index. Only
              available for Datastore Mode databases.
          type: string
        searchIndexOptions:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1SearchIndexOptions'
          description: >-
            Optional. Options for search indexes that are at the index
            definition level. This field is only currently supported for indexes
            with MONGODB_COMPATIBLE_API ApiScope.
        shardCount:
          description: Optional. The number of shards for the index.
          format: int32
          type: integer
        state:
          description: Output only. The serving state of the index.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - READY
            - NEEDS_REPAIR
          enumDescriptions:
            - The state is unspecified.
            - >-
              The index is being created. There is an active long-running
              operation for the index. The index is updated when writing a
              document. Some index data may exist.
            - >-
              The index is ready to be used. The index is updated when writing a
              document. The index is fully populated from all stored documents
              it applies to.
            - >-
              The index was being created, but something went wrong. There is no
              active long-running operation for the index, and the most recently
              finished long-running operation failed. The index is not updated
              when writing a document. Some index data may exist. Use the
              google.longrunning.Operations API to determine why the operation
              that last attempted to create this index failed, then re-create
              the index.
          type: string
        unique:
          description: >-
            Optional. Whether it is an unique index. Unique index ensures all
            values for the indexed field(s) are unique across documents.
          type: boolean
      type: object
    GoogleFirestoreAdminV1IndexConfig:
      description: The index configuration for this field.
      id: GoogleFirestoreAdminV1IndexConfig
      properties:
        ancestorField:
          description: >-
            Output only. Specifies the resource name of the `Field` from which
            this field's index configuration is set (when `uses_ancestor_config`
            is true), or from which it *would* be set if this field had no index
            configuration (when `uses_ancestor_config` is false).
          type: string
        indexes:
          description: The indexes supported for this field.
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1Index'
          type: array
        reverting:
          description: >-
            Output only When true, the `Field`'s index configuration is in the
            process of being reverted. Once complete, the index config will
            transition to the same state as the field specified by
            `ancestor_field`, at which point `uses_ancestor_config` will be
            `true` and `reverting` will be `false`.
          type: boolean
        usesAncestorConfig:
          description: >-
            Output only. When true, the `Field`'s index configuration is set
            from the configuration specified by the `ancestor_field`. When
            false, the `Field`'s index configuration is defined explicitly.
          type: boolean
      type: object
    GoogleFirestoreAdminV1IndexConfigDelta:
      description: Information about an index configuration change.
      id: GoogleFirestoreAdminV1IndexConfigDelta
      properties:
        changeType:
          description: Specifies how the index is changing.
          enum:
            - CHANGE_TYPE_UNSPECIFIED
            - ADD
            - REMOVE
          enumDescriptions:
            - The type of change is not specified or known.
            - The single field index is being added.
            - The single field index is being removed.
          type: string
        index:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Index'
          description: The index being changed.
      type: object
    GoogleFirestoreAdminV1IndexField:
      description: >-
        A field in an index. The field_path describes which field is indexed,
        the value_mode describes how the field value is indexed.
      id: GoogleFirestoreAdminV1IndexField
      properties:
        arrayConfig:
          description: Indicates that this field supports operations on `array_value`s.
          enum:
            - ARRAY_CONFIG_UNSPECIFIED
            - CONTAINS
          enumDescriptions:
            - The index does not support additional array queries.
            - The index supports array containment queries.
          type: string
        fieldPath:
          description: >-
            Can be __name__. For single field indexes, this must match the name
            of the field or may be omitted.
          type: string
        order:
          description: >-
            Indicates that this field supports ordering by the specified order
            or comparing using =, !=, <, <=, >, >=.
          enum:
            - ORDER_UNSPECIFIED
            - ASCENDING
            - DESCENDING
          enumDescriptions:
            - The ordering is unspecified. Not a valid option.
            - The field is ordered by ascending field value.
            - The field is ordered by descending field value.
          type: string
        searchConfig:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1SearchConfig'
          description: Indicates that this field supports search operations.
        vectorConfig:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1VectorConfig'
          description: >-
            Indicates that this field supports nearest neighbor and distance
            operations on vector.
      type: object
    GoogleFirestoreAdminV1IndexOperationMetadata:
      description: >-
        Metadata for google.longrunning.Operation results from
        FirestoreAdmin.CreateIndex.
      id: GoogleFirestoreAdminV1IndexOperationMetadata
      properties:
        endTime:
          description: >-
            The time this operation completed. Will be unset if operation still
            in progress.
          format: google-datetime
          type: string
        index:
          description: >-
            The index resource that this operation is acting on. For example:
            `projects/{project_id}/databases/{database_id}/collectionGroups/{collection_id}/indexes/{index_id}`
          type: string
        progressBytes:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Progress'
          description: The progress, in bytes, of this operation.
        progressDocuments:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Progress'
          description: The progress, in documents, of this operation.
        startTime:
          description: The time this operation started.
          format: google-datetime
          type: string
        state:
          description: The state of the operation.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - INITIALIZING
            - PROCESSING
            - CANCELLING
            - FINALIZING
            - SUCCESSFUL
            - FAILED
            - CANCELLED
          enumDescriptions:
            - Unspecified.
            - Request is being prepared for processing.
            - Request is actively being processed.
            - >-
              Request is in the process of being cancelled after user called
              google.longrunning.Operations.CancelOperation on the operation.
            - Request has been processed and is in its finalization stage.
            - Request has completed successfully.
            - Request has finished being processed, but encountered an error.
            - >-
              Request has finished being cancelled after user called
              google.longrunning.Operations.CancelOperation.
          type: string
      type: object
    GoogleFirestoreAdminV1ListBackupSchedulesResponse:
      description: The response for FirestoreAdmin.ListBackupSchedules.
      id: GoogleFirestoreAdminV1ListBackupSchedulesResponse
      properties:
        backupSchedules:
          description: List of all backup schedules.
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1BackupSchedule'
          type: array
      type: object
    GoogleFirestoreAdminV1ListBackupsResponse:
      description: The response for FirestoreAdmin.ListBackups.
      id: GoogleFirestoreAdminV1ListBackupsResponse
      properties:
        backups:
          description: List of all backups for the project.
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1Backup'
          type: array
        unreachable:
          description: >-
            List of locations that existing backups were not able to be fetched
            from. Instead of failing the entire requests when a single location
            is unreachable, this response returns a partial result set and list
            of locations unable to be reached here. The request can be retried
            against a single location to get a concrete error.
          items:
            type: string
          type: array
      type: object
    GoogleFirestoreAdminV1ListChangeStreamsResponse:
      description: Response to FirestoreAdmin.ListChangeStreams.
      id: GoogleFirestoreAdminV1ListChangeStreamsResponse
      properties:
        changeStreams:
          description: The list of change streams.
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1ChangeStream'
          type: array
      type: object
    GoogleFirestoreAdminV1ListDatabasesResponse:
      description: The list of databases for a project.
      id: GoogleFirestoreAdminV1ListDatabasesResponse
      properties:
        databases:
          description: The databases in the project.
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1Database'
          type: array
        unreachable:
          description: >-
            In the event that data about individual databases cannot be listed
            they will be recorded here. An example entry might be:
            projects/some_project/locations/some_location This can happen if the
            Cloud Region that the Database resides in is currently unavailable.
            In this case we can't fetch all the details about the database. You
            may be able to get a more detailed error message (or possibly fetch
            the resource) by sending a 'Get' request for the resource or a
            'List' request for the specific location.
          items:
            type: string
          type: array
      type: object
    GoogleFirestoreAdminV1ListFieldsResponse:
      description: The response for FirestoreAdmin.ListFields.
      id: GoogleFirestoreAdminV1ListFieldsResponse
      properties:
        fields:
          description: The requested fields.
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1Field'
          type: array
        nextPageToken:
          description: >-
            A page token that may be used to request another page of results. If
            blank, this is the last page.
          type: string
      type: object
    GoogleFirestoreAdminV1ListIndexesResponse:
      description: The response for FirestoreAdmin.ListIndexes.
      id: GoogleFirestoreAdminV1ListIndexesResponse
      properties:
        indexes:
          description: The requested indexes.
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1Index'
          type: array
        nextPageToken:
          description: >-
            A page token that may be used to request another page of results. If
            blank, this is the last page.
          type: string
      type: object
    GoogleFirestoreAdminV1ListUserCredsResponse:
      description: The response for FirestoreAdmin.ListUserCreds.
      id: GoogleFirestoreAdminV1ListUserCredsResponse
      properties:
        userCreds:
          description: The user creds for the database.
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1UserCreds'
          type: array
      type: object
    GoogleFirestoreAdminV1LocationMetadata:
      description: The metadata message for google.cloud.location.Location.metadata.
      id: GoogleFirestoreAdminV1LocationMetadata
      properties: {}
      type: object
    GoogleFirestoreAdminV1PitrSnapshot:
      description: >-
        A consistent snapshot of a database at a specific point in time. A PITR
        (Point-in-time recovery) snapshot with previous versions of a database's
        data is available for every minute up to the associated database's data
        retention period. If the PITR feature is enabled, the retention period
        is 7 days; otherwise, it is one hour.
      id: GoogleFirestoreAdminV1PitrSnapshot
      properties:
        database:
          description: >-
            Required. The name of the database that this was a snapshot of.
            Format: `projects/{project}/databases/{database}`.
          type: string
        databaseUid:
          description: >-
            Output only. Public UUID of the database the snapshot was associated
            with.
          format: byte
          readOnly: true
          type: string
        snapshotTime:
          description: Required. Snapshot time of the database.
          format: google-datetime
          type: string
      type: object
    GoogleFirestoreAdminV1Progress:
      description: >-
        Describes the progress of the operation. Unit of work is generic and
        must be interpreted based on where Progress is used.
      id: GoogleFirestoreAdminV1Progress
      properties:
        completedWork:
          description: The amount of work completed.
          format: int64
          type: string
        estimatedWork:
          description: The amount of work estimated.
          format: int64
          type: string
      type: object
    GoogleFirestoreAdminV1ResetUserPasswordRequest:
      description: The request for FirestoreAdmin.ResetUserPassword.
      id: GoogleFirestoreAdminV1ResetUserPasswordRequest
      properties: {}
      type: object
    GoogleFirestoreAdminV1ResourceIdentity:
      description: Describes a Resource Identity principal.
      id: GoogleFirestoreAdminV1ResourceIdentity
      properties:
        principal:
          description: >-
            Output only. Principal identifier string. See:
            https://cloud.google.com/iam/docs/principal-identifiers
          readOnly: true
          type: string
      type: object
    GoogleFirestoreAdminV1RestoreDatabaseMetadata:
      description: >-
        Metadata for the long-running operation from the RestoreDatabase
        request.
      id: GoogleFirestoreAdminV1RestoreDatabaseMetadata
      properties:
        backup:
          description: The name of the backup restoring from.
          type: string
        database:
          description: The name of the database being restored to.
          type: string
        endTime:
          description: The time the restore finished, unset for ongoing restores.
          format: google-datetime
          type: string
        operationState:
          description: The operation state of the restore.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - INITIALIZING
            - PROCESSING
            - CANCELLING
            - FINALIZING
            - SUCCESSFUL
            - FAILED
            - CANCELLED
          enumDescriptions:
            - Unspecified.
            - Request is being prepared for processing.
            - Request is actively being processed.
            - >-
              Request is in the process of being cancelled after user called
              google.longrunning.Operations.CancelOperation on the operation.
            - Request has been processed and is in its finalization stage.
            - Request has completed successfully.
            - Request has finished being processed, but encountered an error.
            - >-
              Request has finished being cancelled after user called
              google.longrunning.Operations.CancelOperation.
          type: string
        progressPercentage:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Progress'
          description: >-
            How far along the restore is as an estimated percentage of remaining
            time.
        startTime:
          description: The time the restore was started.
          format: google-datetime
          type: string
      type: object
    GoogleFirestoreAdminV1RestoreDatabaseRequest:
      description: The request message for FirestoreAdmin.RestoreDatabase.
      id: GoogleFirestoreAdminV1RestoreDatabaseRequest
      properties:
        backup:
          description: >-
            Required. Backup to restore from. Must be from the same project as
            the parent. The restored database will be created in the same
            location as the source backup. Format is:
            `projects/{project_id}/locations/{location}/backups/{backup}`
          type: string
        databaseId:
          description: >-
            Required. The ID to use for the database, which will become the
            final component of the database's resource name. This database ID
            must not be associated with an existing database. This value should
            be 4-63 characters. Valid characters are /a-z-/ with first character
            a letter and the last a letter or a number. Must not be UUID-like
            /[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}/. "(default)" database ID
            is also valid if the database is Standard edition.
          type: string
        encryptionConfig:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1EncryptionConfig'
          description: >-
            Optional. Encryption configuration for the restored database. If
            this field is not specified, the restored database will use the same
            encryption configuration as the backup, namely
            use_source_encryption.
        tags:
          additionalProperties:
            type: string
          description: >-
            Optional. Immutable. Tags to be bound to the restored database. The
            tags should be provided in the format of `tagKeys/{tag_key_id} ->
            tagValues/{tag_value_id}`.
          type: object
      type: object
    GoogleFirestoreAdminV1SearchConfig:
      description: The configuration for how to index a field for search.
      id: GoogleFirestoreAdminV1SearchConfig
      properties:
        geoSpec:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1SearchGeoSpec'
          description: >-
            Optional. The specification for building a geo search index for a
            field.
        textSpec:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1SearchTextSpec'
          description: >-
            Optional. The specification for building a text search index for a
            field.
      type: object
    GoogleFirestoreAdminV1SearchGeoSpec:
      description: The specification for how to build a geo search index for a field.
      id: GoogleFirestoreAdminV1SearchGeoSpec
      properties:
        geoJsonIndexingDisabled:
          description: >-
            Optional. Disables geoJSON indexing for the field. By default,
            geoJSON points are indexed.
          type: boolean
      type: object
    GoogleFirestoreAdminV1SearchIndexOptions:
      description: Options for search indexes at the definition level.
      id: GoogleFirestoreAdminV1SearchIndexOptions
      properties:
        textLanguage:
          description: >-
            Optional. The language to use for text search indexes. Used as the
            default language if not overridden at the document level by
            specifying the `text_language_override_field`. The language is
            specified as a BCP 47 language code. For indexes with
            MONGODB_COMPATIBLE_API ApiScope: If unspecified, the default
            language is English. For indexes with `ANY_API` ApiScope: If
            unspecified, the default behavior is autodetect.
          type: string
        textLanguageOverrideFieldPath:
          description: >-
            Optional. The field in the document that specifies which language to
            use for that specific document. For indexes with
            MONGODB_COMPATIBLE_API ApiScope: if unspecified, the language is
            taken from the "language" field if it exists or from `text_language`
            if it does not.
          type: string
      type: object
    GoogleFirestoreAdminV1SearchTextIndexSpec:
      description: >-
        Specification of how the field should be indexed for search text
        indexes.
      id: GoogleFirestoreAdminV1SearchTextIndexSpec
      properties:
        indexType:
          description: Required. How to index the text field value.
          enum:
            - TEXT_INDEX_TYPE_UNSPECIFIED
            - TOKENIZED
          enumDescriptions:
            - The index type is unspecified. Not a valid option.
            - >-
              Field values are tokenized. This is the only way currently
              supported for MONGODB_COMPATIBLE_API.
          type: string
        matchType:
          description: Required. How to match the text field value.
          enum:
            - TEXT_MATCH_TYPE_UNSPECIFIED
            - MATCH_GLOBALLY
          enumDescriptions:
            - The match type is unspecified. Not a valid option.
            - >-
              Match on any indexed field. This is the only way currently
              supported for MONGODB_COMPATIBLE_API.
          type: string
      type: object
    GoogleFirestoreAdminV1SearchTextSpec:
      description: The specification for how to build a text search index for a field.
      id: GoogleFirestoreAdminV1SearchTextSpec
      properties:
        indexSpecs:
          description: >-
            Required. Specifications for how the field should be indexed.
            Repeated so that the field can be indexed in multiple ways.
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1SearchTextIndexSpec'
          type: array
      type: object
    GoogleFirestoreAdminV1SourceEncryptionOptions:
      description: >-
        The configuration options for using the same encryption method as the
        source.
      id: GoogleFirestoreAdminV1SourceEncryptionOptions
      properties: {}
      type: object
    GoogleFirestoreAdminV1SourceInfo:
      description: Information about the provenance of this database.
      id: GoogleFirestoreAdminV1SourceInfo
      properties:
        backup:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1BackupSource'
          description: >-
            If set, this database was restored from the specified backup (or a
            snapshot thereof).
        operation:
          description: >-
            The associated long-running operation. This field may not be set
            after the operation has completed. Format:
            `projects/{project}/databases/{database}/operations/{operation}`.
          type: string
      type: object
    GoogleFirestoreAdminV1Stats:
      description: Backup specific statistics.
      id: GoogleFirestoreAdminV1Stats
      properties:
        documentCount:
          description: Output only. The total number of documents contained in the backup.
          format: int64
          readOnly: true
          type: string
        indexCount:
          description: >-
            Output only. The total number of index entries contained in the
            backup.
          format: int64
          readOnly: true
          type: string
        sizeBytes:
          description: >-
            Output only. Summation of the size of all documents and index
            entries in the backup, measured in bytes.
          format: int64
          readOnly: true
          type: string
      type: object
    GoogleFirestoreAdminV1TtlConfig:
      description: >-
        The TTL (time-to-live) configuration for documents that have this
        `Field` set. A timestamp stored in a TTL-enabled field will be used to
        determine the expiration time of the document. The expiration time is
        the sum of the timestamp value and the `expiration_offset`. For
        Enterprise edition databases, the timestamp value may alternatively be
        stored in an array value in the TTL-enabled field. An expiration time in
        the past indicates that the document is eligible for immediate
        expiration. Using any other data type or leaving the field absent will
        disable expiration for the individual document.
      id: GoogleFirestoreAdminV1TtlConfig
      properties:
        expirationOffset:
          description: >-
            Optional. The offset, relative to the timestamp value from the
            TTL-enabled field, used to determine the document's expiration time.
            `expiration_offset.seconds` must be between 0 and 2,147,483,647
            inclusive. Values more precise than seconds are rejected. If unset,
            defaults to 0, in which case the expiration time is the same as the
            timestamp value from the TTL-enabled field.
          format: google-duration
          type: string
        state:
          description: Output only. The state of the TTL configuration.
          enum:
            - STATE_UNSPECIFIED
            - CREATING
            - ACTIVE
            - NEEDS_REPAIR
          enumDescriptions:
            - The state is unspecified or unknown.
            - >-
              The TTL is being applied. There is an active long-running
              operation to track the change. Newly written documents will have
              TTLs applied as requested. Requested TTLs on existing documents
              are still being processed. When TTLs on all existing documents
              have been processed, the state will move to 'ACTIVE'.
            - The TTL is active for all documents.
            - >-
              The TTL configuration could not be enabled for all existing
              documents. Newly written documents will continue to have their TTL
              applied. The LRO returned when last attempting to enable TTL for
              this `Field` has failed, and may have more details.
          readOnly: true
          type: string
      type: object
    GoogleFirestoreAdminV1TtlConfigDelta:
      description: Information about a TTL configuration change.
      id: GoogleFirestoreAdminV1TtlConfigDelta
      properties:
        changeType:
          description: Specifies how the TTL configuration is changing.
          enum:
            - CHANGE_TYPE_UNSPECIFIED
            - ADD
            - REMOVE
          enumDescriptions:
            - The type of change is not specified or known.
            - The TTL config is being added.
            - The TTL config is being removed.
          type: string
        expirationOffset:
          description: >-
            The offset, relative to the timestamp value in the TTL-enabled
            field, used determine the document's expiration time.
          format: google-duration
          type: string
      type: object
    GoogleFirestoreAdminV1UpdateDatabaseMetadata:
      description: Metadata related to the update database operation.
      id: GoogleFirestoreAdminV1UpdateDatabaseMetadata
      properties:
        endTime:
          description: >-
            The time this operation completed. Will be unset if operation still
            in progress.
          format: google-datetime
          type: string
        startTime:
          description: The time this operation started.
          format: google-datetime
          type: string
        state:
          description: The state of the operation.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - INITIALIZING
            - PROCESSING
            - CANCELLING
            - FINALIZING
            - SUCCESSFUL
            - FAILED
            - CANCELLED
          enumDescriptions:
            - Unspecified.
            - Request is being prepared for processing.
            - Request is actively being processed.
            - >-
              Request is in the process of being cancelled after user called
              google.longrunning.Operations.CancelOperation on the operation.
            - Request has been processed and is in its finalization stage.
            - Request has completed successfully.
            - Request has finished being processed, but encountered an error.
            - >-
              Request has finished being cancelled after user called
              google.longrunning.Operations.CancelOperation.
          type: string
      type: object
    GoogleFirestoreAdminV1UserCreds:
      description: A Cloud Firestore User Creds.
      id: GoogleFirestoreAdminV1UserCreds
      properties:
        createTime:
          description: Output only. The time the user creds were created.
          format: google-datetime
          readOnly: true
          type: string
        name:
          description: >-
            Identifier. The resource name of the UserCreds. Format:
            `projects/{project}/databases/{database}/userCreds/{user_creds}`
          type: string
        resourceIdentity:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1ResourceIdentity'
          description: Resource Identity descriptor.
        securePassword:
          description: >-
            Output only. The plaintext server-generated password for the user
            creds. Only populated in responses for CreateUserCreds and
            ResetUserPassword.
          readOnly: true
          type: string
        state:
          description: >-
            Output only. Whether the user creds are enabled or disabled.
            Defaults to ENABLED on creation.
          enum:
            - STATE_UNSPECIFIED
            - ENABLED
            - DISABLED
          enumDescriptions:
            - The default value. Should not be used.
            - The user creds are enabled.
            - The user creds are disabled.
          readOnly: true
          type: string
        updateTime:
          description: Output only. The time the user creds were last updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GoogleFirestoreAdminV1VectorConfig:
      description: The index configuration to support vector search operations
      id: GoogleFirestoreAdminV1VectorConfig
      properties:
        dimension:
          description: >-
            Required. The vector dimension this configuration applies to. The
            resulting index will only include vectors of this dimension, and can
            be used for vector search with the same dimension.
          format: int32
          type: integer
        flat:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1FlatIndex'
          description: Indicates the vector index is a flat index.
      type: object
    GoogleFirestoreAdminV1WeeklyRecurrence:
      description: >-
        Represents a recurring schedule that runs on a specified day of the
        week. The time zone is UTC.
      id: GoogleFirestoreAdminV1WeeklyRecurrence
      properties:
        day:
          description: The day of week to run. DAY_OF_WEEK_UNSPECIFIED is not allowed.
          enum:
            - DAY_OF_WEEK_UNSPECIFIED
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          enumDescriptions:
            - The day of the week is unspecified.
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
          type: string
      type: object
    GoogleLongrunningCancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: GoogleLongrunningCancelOperationRequest
      properties: {}
      type: object
    GoogleLongrunningListOperationsResponse:
      description: The response message for Operations.ListOperations.
      id: GoogleLongrunningListOperationsResponse
      properties:
        nextPageToken:
          description: The standard List next-page token.
          type: string
        operations:
          description: >-
            A list of operations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/GoogleLongrunningOperation'
          type: array
        unreachable:
          description: >-
            Unordered list. Unreachable resources. Populated when the request
            sets `ListOperationsRequest.return_partial_success` and reads across
            collections. For example, when attempting to list all resources
            across all supported locations.
          items:
            type: string
          type: array
      type: object
    GoogleLongrunningOperation:
      description: >-
        This resource represents a long-running operation that is the result of
        a network API call.
      id: GoogleLongrunningOperation
      properties:
        done:
          description: >-
            If the value is `false`, it means the operation is still in
            progress. If `true`, the operation is completed, and either `error`
            or `response` is available.
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
          description: >-
            The error result of the operation in case of failure or
            cancellation.
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata associated with the operation. It
            typically contains progress information and common metadata such as
            create time. Some services might not provide such metadata. Any
            method that returns a long-running operation should document the
            metadata type, if any.
          type: object
        name:
          description: >-
            The server-assigned name, which is only unique within the same
            service that originally returns it. If you use the default HTTP
            mapping, the `name` should be a resource name ending with
            `operations/{unique_id}`.
          type: string
        response:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            The normal, successful response of the operation. If the original
            method returns no data on success, such as `Delete`, the response is
            `google.protobuf.Empty`. If the original method is standard
            `Get`/`Create`/`Update`, the response should be the resource. For
            other methods, the response should have the type `XxxResponse`,
            where `Xxx` is the original method name. For example, if the
            original method name is `TakeSnapshot()`, the inferred response type
            is `TakeSnapshotResponse`.
          type: object
      type: object
    LatLng:
      description: >-
        An object that represents a latitude/longitude pair. This is expressed
        as a pair of doubles to represent degrees latitude and degrees
        longitude. Unless specified otherwise, this object must conform to the
        WGS84 standard. Values must be within normalized ranges.
      id: LatLng
      properties:
        latitude:
          description: The latitude in degrees. It must be in the range [-90.0, +90.0].
          format: double
          type: number
        longitude:
          description: The longitude in degrees. It must be in the range [-180.0, +180.0].
          format: double
          type: number
      type: object
    ListCollectionIdsRequest:
      description: The request for Firestore.ListCollectionIds.
      id: ListCollectionIdsRequest
      properties:
        pageSize:
          description: The maximum number of results to return.
          format: int32
          type: integer
        pageToken:
          description: A page token. Must be a value from ListCollectionIdsResponse.
          type: string
        readTime:
          description: >-
            Reads documents as they were at the given time. This must be a
            microsecond precision timestamp within the past one hour, or if
            Point-in-Time Recovery is enabled, can additionally be a whole
            minute timestamp within the past 7 days.
          format: google-datetime
          type: string
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for this request.
      type: object
    ListCollectionIdsResponse:
      description: The response from Firestore.ListCollectionIds.
      id: ListCollectionIdsResponse
      properties:
        collectionIds:
          description: The collection ids.
          items:
            type: string
          type: array
        nextPageToken:
          description: A page token that may be used to continue the list.
          type: string
      type: object
    ListDocumentsResponse:
      description: The response for Firestore.ListDocuments.
      id: ListDocumentsResponse
      properties:
        documents:
          description: The Documents found.
          items:
            $ref: '#/components/schemas/Document'
          type: array
        nextPageToken:
          description: >-
            A token to retrieve the next page of documents. If this field is
            omitted, there are no subsequent pages.
          type: string
      type: object
    ListLocationsResponse:
      description: The response message for Locations.ListLocations.
      id: ListLocationsResponse
      properties:
        locations:
          description: >-
            A list of locations that matches the specified filter in the
            request.
          items:
            $ref: '#/components/schemas/Location'
          type: array
        nextPageToken:
          description: The standard List next-page token.
          type: string
      type: object
    ListenRequest:
      description: A request for Firestore.Listen
      id: ListenRequest
      properties:
        addTarget:
          $ref: '#/components/schemas/Target'
          description: A target to add to this stream.
        labels:
          additionalProperties:
            type: string
          description: Labels associated with this target change.
          type: object
        removeTarget:
          description: The ID of a target to remove from this stream.
          format: int32
          type: integer
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for the request.
      type: object
    ListenResponse:
      description: The response for Firestore.Listen.
      id: ListenResponse
      properties:
        documentChange:
          $ref: '#/components/schemas/DocumentChange'
          description: A Document has changed.
        documentDelete:
          $ref: '#/components/schemas/DocumentDelete'
          description: A Document has been deleted.
        documentRemove:
          $ref: '#/components/schemas/DocumentRemove'
          description: >-
            A Document has been removed from a target (because it is no longer
            relevant to that target).
        filter:
          $ref: '#/components/schemas/ExistenceFilter'
          description: >-
            A filter to apply to the set of documents previously returned for
            the given target. Returned when documents may have been removed from
            the given target, but the exact documents are unknown.
        targetChange:
          $ref: '#/components/schemas/TargetChange'
          description: Targets have changed.
      type: object
    Location:
      description: A resource that represents a Google Cloud location.
      id: Location
      properties:
        displayName:
          description: >-
            The friendly name for this location, typically a nearby city name.
            For example, "Tokyo".
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Cross-service attributes for the location. For example
            {"cloud.googleapis.com/region": "us-east1"}
          type: object
        locationId:
          description: 'The canonical id for this location. For example: `"us-east1"`.'
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object. Contains field @type with type URL.
            type: any
          description: >-
            Service-specific metadata. For example the available capacity at the
            given location.
          type: object
        name:
          description: >-
            Resource name for the location, which may vary between
            implementations. For example:
            `"projects/example-project/locations/us-east1"`
          type: string
      type: object
    MapValue:
      description: A map value.
      id: MapValue
      properties:
        fields:
          additionalProperties:
            $ref: '#/components/schemas/Value'
          description: >-
            The map's fields. The map keys represent field names. Field names
            matching the regular expression `__.*__` are reserved. Reserved
            field names are forbidden except in certain documented contexts. The
            map keys, represented as UTF-8, must not exceed 1,500 bytes and
            cannot be empty.
          type: object
      type: object
    Order:
      description: An order on a field.
      id: Order
      properties:
        direction:
          description: The direction to order by. Defaults to `ASCENDING`.
          enum:
            - DIRECTION_UNSPECIFIED
            - ASCENDING
            - DESCENDING
          enumDescriptions:
            - Unspecified.
            - Ascending.
            - Descending.
          type: string
        field:
          $ref: '#/components/schemas/FieldReference'
          description: The field to order by.
      type: object
    PartitionQueryRequest:
      description: The request for Firestore.PartitionQuery.
      id: PartitionQueryRequest
      properties:
        pageSize:
          description: >-
            The maximum number of partitions to return in this call, subject to
            `partition_count`. For example, if `partition_count` = 10 and
            `page_size` = 8, the first call to PartitionQuery will return up to
            8 partitions and a `next_page_token` if more results exist. A second
            call to PartitionQuery will return up to 2 partitions, to complete
            the total of 10 specified in `partition_count`.
          format: int32
          type: integer
        pageToken:
          description: >-
            The `next_page_token` value returned from a previous call to
            PartitionQuery that may be used to get an additional set of results.
            There are no ordering guarantees between sets of results. Thus,
            using multiple sets of results will require merging the different
            result sets. For example, two subsequent calls using a page_token
            may return: * cursor B, cursor M, cursor Q * cursor A, cursor U,
            cursor W To obtain a complete result set ordered with respect to the
            results of the query supplied to PartitionQuery, the results sets
            should be merged: cursor A, cursor B, cursor M, cursor Q, cursor U,
            cursor W
          type: string
        partitionCount:
          description: >-
            The desired maximum number of partition points. The partitions may
            be returned across multiple pages of results. The number must be
            positive. The actual number of partitions returned may be fewer. For
            example, this may be set to one fewer than the number of parallel
            queries to be run, or in running a data pipeline job, one fewer than
            the number of workers or compute instances available.
          format: int64
          type: string
        readTime:
          description: >-
            Reads documents as they were at the given time. This must be a
            microsecond precision timestamp within the past one hour, or if
            Point-in-Time Recovery is enabled, can additionally be a whole
            minute timestamp within the past 7 days.
          format: google-datetime
          type: string
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for the request.
        structuredQuery:
          $ref: '#/components/schemas/StructuredQuery'
          description: >-
            A structured query. Query must specify collection with all
            descendants and be ordered by name ascending. Other filters, order
            bys, limits, offsets, and start/end cursors are not supported.
      type: object
    PartitionQueryResponse:
      description: The response for Firestore.PartitionQuery.
      id: PartitionQueryResponse
      properties:
        nextPageToken:
          description: >-
            A page token that may be used to request an additional set of
            results, up to the number specified by `partition_count` in the
            PartitionQuery request. If blank, there are no more results.
          type: string
        partitions:
          description: >-
            Partition results. Each partition is a split point that can be used
            by RunQuery as a starting or end point for the query results. The
            RunQuery requests must be made with the same query supplied to this
            PartitionQuery request. The partition cursors will be ordered
            according to same ordering as the results of the query supplied to
            PartitionQuery. For example, if a PartitionQuery request returns
            partition cursors A and B, running the following three queries will
            return the entire result set of the original query: * query, end_at
            A * query, start_at A, end_at B * query, start_at B An empty result
            may indicate that the query has too few results to be partitioned,
            or that the query is not yet supported for partitioning.
          items:
            $ref: '#/components/schemas/Cursor'
          type: array
      type: object
    Pipeline:
      description: A Firestore query represented as an ordered list of operations / stages.
      id: Pipeline
      properties:
        stages:
          description: Required. Ordered list of stages to evaluate.
          items:
            $ref: '#/components/schemas/Stage'
          type: array
      type: object
    PlanSummary:
      description: Planning phase information for the query.
      id: PlanSummary
      properties:
        indexesUsed:
          description: >-
            The indexes selected for the query. For example: [ {"query_scope":
            "Collection", "properties": "(foo ASC, __name__ ASC)"},
            {"query_scope": "Collection", "properties": "(bar ASC, __name__
            ASC)"} ]
          items:
            additionalProperties:
              description: Properties of the object.
              type: any
            type: object
          type: array
      type: object
    Precondition:
      description: A precondition on a document, used for conditional operations.
      id: Precondition
      properties:
        exists:
          description: >-
            When set to `true`, the target document must exist. When set to
            `false`, the target document must not exist.
          type: boolean
        updateTime:
          description: >-
            When set, the target document must exist and have been last updated
            at that time. Timestamp must be microsecond aligned.
          format: google-datetime
          type: string
      type: object
    Projection:
      description: The projection of document's fields to return.
      id: Projection
      properties:
        fields:
          description: >-
            The fields to return. If empty, all fields are returned. To only
            return the name of the document, use `['__name__']`.
          items:
            $ref: '#/components/schemas/FieldReference'
          type: array
      type: object
    QueryTarget:
      description: A target specified by a query.
      id: QueryTarget
      properties:
        parent:
          description: >-
            The parent resource name. In the format:
            `projects/{project_id}/databases/{database_id}/documents` or
            `projects/{project_id}/databases/{database_id}/documents/{document_path}`.
            For example: `projects/my-project/databases/my-database/documents`
            or
            `projects/my-project/databases/my-database/documents/chatrooms/my-chatroom`
          type: string
        structuredQuery:
          $ref: '#/components/schemas/StructuredQuery'
          description: A structured query.
      type: object
    ReadOnly:
      description: Options for a transaction that can only be used to read documents.
      id: ReadOnly
      properties:
        readTime:
          description: >-
            Reads documents at the given time. This must be a microsecond
            precision timestamp within the past one hour, or if Point-in-Time
            Recovery is enabled, can additionally be a whole minute timestamp
            within the past 7 days.
          format: google-datetime
          type: string
      type: object
    ReadWrite:
      description: Options for a transaction that can be used to read and write documents.
      id: ReadWrite
      properties:
        concurrencyMode:
          description: >-
            Optional. The concurrency control mode to use for this transaction.
            A database is able to use different concurrency modes for different
            transactions simultaneously. 3rd party auth requests are only
            allowed to create optimistic read-write transactions and must
            specify that here even if the database-level setting is already
            configured to optimistic.
          enum:
            - CONCURRENCY_MODE_UNSPECIFIED
            - OPTIMISTIC
            - PESSIMISTIC
          enumDescriptions:
            - >-
              Start the transaction with the database-level default concurrency
              mode.
            - Use optimistic concurrency control for the new transaction.
            - Use pessimistic concurrency control for the new transaction.
          type: string
        retryTransaction:
          description: An optional transaction to retry.
          format: byte
          type: string
      type: object
    RequestOptions:
      description: Options for a request.
      id: RequestOptions
      properties:
        requestTags:
          description: >-
            Optional. The request tags for the request. Request tags are
            user-provided strings used for usage monitoring, cost management,
            and observability. Callers can associate custom application context
            (such as component, microservice, feature name, or operation type)
            with database requests. These tags are collected and aggregated in
            usage and monitoring reports, allowing billable operations and usage
            metrics to be sliced and analyzed by tag. These tags *only* show up
            in monitoring and are visible in administrative operations (such as
            usage reports). They do not affect data storage, query semantics, or
            request execution. Cardinality and Best Practices: - Request tags
            are most effective when using a bounded set of distinct values
            (e.g., fewer than 100 distinct tags across an entire database).
            Using a large number of distinct tags may result in tags being
            omitted from top usage dashboards. - Use structured identifiers (for
            example: `app=cart`, `env=prod`, `service=checkout`) and avoid
            high-cardinality values such as UUIDs, request IDs, timestamps, user
            IDs, or document keys. - Do not include sensitive data or personally
            identifiable information (PII) in request tags, as they show up in
            administrative monitoring. The tags are processed as follows: -
            Leading and trailing whitespace is trimmed. - Empty tags (after
            trimming) are filtered out. - Truncated to a maximum of 510
            characters. - Deduplicated within the same request. - Limited to a
            maximum of 50 tags per request (excess tags are silently discarded).
          items:
            type: string
          type: array
      type: object
    RollbackRequest:
      description: The request for Firestore.Rollback.
      id: RollbackRequest
      properties:
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for this request.
        transaction:
          description: Required. The transaction to roll back.
          format: byte
          type: string
      type: object
    RunAggregationQueryRequest:
      description: The request for Firestore.RunAggregationQuery.
      id: RunAggregationQueryRequest
      properties:
        explainOptions:
          $ref: '#/components/schemas/ExplainOptions'
          description: >-
            Optional. Explain options for the query. If set, additional query
            statistics will be returned. If not, only query results will be
            returned.
        newTransaction:
          $ref: '#/components/schemas/TransactionOptions'
          description: >-
            Starts a new transaction as part of the query, defaulting to
            read-only. The new transaction ID will be returned as the first
            response in the stream.
        readTime:
          description: >-
            Executes the query at the given timestamp. This must be a
            microsecond precision timestamp within the past one hour, or if
            Point-in-Time Recovery is enabled, can additionally be a whole
            minute timestamp within the past 7 days.
          format: google-datetime
          type: string
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for the request.
        structuredAggregationQuery:
          $ref: '#/components/schemas/StructuredAggregationQuery'
          description: An aggregation query.
        transaction:
          description: >-
            Run the aggregation within an already active transaction. The value
            here is the opaque transaction ID to execute the query in.
          format: byte
          type: string
      type: object
    RunAggregationQueryResponse:
      description: The response for Firestore.RunAggregationQuery.
      id: RunAggregationQueryResponse
      properties:
        explainMetrics:
          $ref: '#/components/schemas/ExplainMetrics'
          description: >-
            Query explain metrics. This is only present when the
            RunAggregationQueryRequest.explain_options is provided, and it is
            sent only once with the last response in the stream.
        readTime:
          description: >-
            The time at which the aggregate result was computed. This is always
            monotonically increasing; in this case, the previous
            AggregationResult in the result stream are guaranteed not to have
            changed between their `read_time` and this one. If the query returns
            no results, a response with `read_time` and no `result` will be
            sent, and this represents the time at which the query was run.
          format: google-datetime
          type: string
        result:
          $ref: '#/components/schemas/AggregationResult'
          description: >-
            A single aggregation result. Not present when reporting partial
            progress.
        transaction:
          description: >-
            The transaction that was started as part of this request. Only
            present on the first response when the request requested to start a
            new transaction.
          format: byte
          type: string
      type: object
    RunQueryRequest:
      description: The request for Firestore.RunQuery.
      id: RunQueryRequest
      properties:
        explainOptions:
          $ref: '#/components/schemas/ExplainOptions'
          description: >-
            Optional. Explain options for the query. If set, additional query
            statistics will be returned. If not, only query results will be
            returned.
        newTransaction:
          $ref: '#/components/schemas/TransactionOptions'
          description: >-
            Starts a new transaction and reads the documents. Defaults to a
            read-only transaction. The new transaction ID will be returned as
            the first response in the stream.
        readTime:
          description: >-
            Reads documents as they were at the given time. This must be a
            microsecond precision timestamp within the past one hour, or if
            Point-in-Time Recovery is enabled, can additionally be a whole
            minute timestamp within the past 7 days.
          format: google-datetime
          type: string
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for this request.
        structuredQuery:
          $ref: '#/components/schemas/StructuredQuery'
          description: A structured query.
        transaction:
          description: >-
            Run the query within an already active transaction. The value here
            is the opaque transaction ID to execute the query in.
          format: byte
          type: string
      type: object
    RunQueryResponse:
      description: The response for Firestore.RunQuery.
      id: RunQueryResponse
      properties:
        document:
          $ref: '#/components/schemas/Document'
          description: A query result, not set when reporting partial progress.
        done:
          description: >-
            If present, Firestore has completely finished the request and no
            more documents will be returned.
          type: boolean
        explainMetrics:
          $ref: '#/components/schemas/ExplainMetrics'
          description: >-
            Query explain metrics. This is only present when the
            RunQueryRequest.explain_options is provided, and it is sent only
            once with the last response in the stream.
        readTime:
          description: >-
            The time at which the document was read. This may be monotonically
            increasing; in this case, the previous documents in the result
            stream are guaranteed not to have changed between their `read_time`
            and this one. If the query returns no results, a response with
            `read_time` and no `document` will be sent, and this represents the
            time at which the query was run.
          format: google-datetime
          type: string
        skippedResults:
          description: >-
            The number of results that have been skipped due to an offset
            between the last response and the current response.
          format: int32
          type: integer
        transaction:
          description: >-
            The transaction that was started as part of this request. Can only
            be set in the first response, and only if
            RunQueryRequest.new_transaction was set in the request. If set, no
            other fields will be set in this response.
          format: byte
          type: string
      type: object
    Stage:
      description: >-
        A single operation within a pipeline. A stage is made up of a unique
        name, and a list of arguments. The exact number of arguments & types is
        dependent on the stage type. To give an example, the stage `filter(state
        = "MD")` would be encoded as: ``` name: "filter" args { function_value {
        name: "eq" args { field_reference_value: "state" } args { string_value:
        "MD" } } } ``` See public documentation for the full list.
      id: Stage
      properties:
        args:
          description: Optional. Ordered list of arguments the given stage expects.
          items:
            $ref: '#/components/schemas/Value'
          type: array
        name:
          description: >-
            Required. The name of the stage to evaluate. **Requires:** * must be
            in snake case (lower case with underscore separator).
          type: string
        options:
          additionalProperties:
            $ref: '#/components/schemas/Value'
          description: >-
            Optional. Optional named arguments that certain functions may
            support.
          type: object
      type: object
    Status:
      description: >-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It
        is used by [gRPC](https://github.com/grpc). Each `Status` message
        contains three pieces of data: error code, error message, and error
        details. You can find out more about this error model and how to work
        with it in the [API Design
        Guide](https://cloud.google.com/apis/design/errors).
      id: Status
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          format: int32
          type: integer
        details:
          description: >-
            A list of messages that carry the error details. There is a common
            set of message types for APIs to use.
          items:
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
              type: any
            type: object
          type: array
        message:
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            google.rpc.Status.details field, or localized by the client.
          type: string
      type: object
    StructuredAggregationQuery:
      description: Firestore query for running an aggregation over a StructuredQuery.
      id: StructuredAggregationQuery
      properties:
        aggregations:
          description: >-
            Optional. Series of aggregations to apply over the results of the
            `structured_query`. Requires: * A minimum of one and maximum of five
            aggregations per query.
          items:
            $ref: '#/components/schemas/Aggregation'
          type: array
        structuredQuery:
          $ref: '#/components/schemas/StructuredQuery'
          description: Nested structured query.
      type: object
    StructuredPipeline:
      description: >-
        A Firestore query represented as an ordered list of operations / stages.
        This is considered the top-level function which plans and executes a
        query. It is logically equivalent to `query(stages, options)`, but
        prevents the client from having to build a function wrapper.
      id: StructuredPipeline
      properties:
        options:
          additionalProperties:
            $ref: '#/components/schemas/Value'
          description: 'Optional. Optional query-level arguments. '
          type: object
        pipeline:
          $ref: '#/components/schemas/Pipeline'
          description: Required. The pipeline query to execute.
      type: object
    StructuredQuery:
      description: >-
        A Firestore query. The query stages are executed in the following order:
        1. from 2. where 3. select 4. order_by + start_at + end_at 5. offset 6.
        limit 7. find_nearest
      id: StructuredQuery
      properties:
        endAt:
          $ref: '#/components/schemas/Cursor'
          description: >-
            A potential prefix of a position in the result set to end the query
            at. This is similar to `START_AT` but with it controlling the end
            position rather than the start position. Requires: * The number of
            values cannot be greater than the number of fields specified in the
            `ORDER BY` clause.
        findNearest:
          $ref: '#/components/schemas/FindNearest'
          description: >-
            Optional. A potential nearest neighbors search. Applies after all
            other filters and ordering. Finds the closest vector embeddings to
            the given query vector.
        from:
          description: The collections to query.
          items:
            $ref: '#/components/schemas/CollectionSelector'
          type: array
        limit:
          description: >-
            The maximum number of results to return. Applies after all other
            constraints. Requires: * The value must be greater than or equal to
            zero if specified.
          format: int32
          type: integer
        offset:
          description: >-
            The number of documents to skip before returning the first result.
            This applies after the constraints specified by the `WHERE`, `START
            AT`, & `END AT` but before the `LIMIT` clause. Requires: * The value
            must be greater than or equal to zero if specified.
          format: int32
          type: integer
        orderBy:
          description: >-
            The order to apply to the query results. Callers can provide a full
            ordering, a partial ordering, or no ordering at all. While Firestore
            will always respect the provided order, the behavior for queries
            without a full ordering is different per database edition: In
            Standard edition, Firestore guarantees a stable ordering through the
            following rules: * The `order_by` is required to reference all
            fields used with an inequality filter. * All fields that are
            required to be in the `order_by` but are not already present are
            appended in lexicographical ordering of the field name. * If an
            order on `__name__` is not specified, it is appended by default.
            Fields are appended with the same sort direction as the last order
            specified, or 'ASCENDING' if no order was specified. For example: *
            `ORDER BY a` becomes `ORDER BY a ASC, __name__ ASC` * `ORDER BY a
            DESC` becomes `ORDER BY a DESC, __name__ DESC` * `WHERE a > 1`
            becomes `WHERE a > 1 ORDER BY a ASC, __name__ ASC` * `WHERE __name__
            > ... AND a > 1` becomes `WHERE __name__ > ... AND a > 1 ORDER BY a
            ASC, __name__ ASC` In Enterprise edition, Firestore does not
            guarantee a stable ordering. Instead it will pick the most efficient
            ordering based on the indexes available at the time of query
            execution. This will result in a different ordering for queries that
            are otherwise identical. To ensure a stable ordering, always include
            a unique field in the `order_by` clause, such as `__name__`.
          items:
            $ref: '#/components/schemas/Order'
          type: array
        select:
          $ref: '#/components/schemas/Projection'
          description: >-
            Optional sub-set of the fields to return. This acts as a
            DocumentMask over the documents returned from a query. When not set,
            assumes that the caller wants all fields returned.
        startAt:
          $ref: '#/components/schemas/Cursor'
          description: >-
            A potential prefix of a position in the result set to start the
            query at. The ordering of the result set is based on the `ORDER BY`
            clause of the original query. ``` SELECT * FROM k WHERE a = 1 AND b
            > 2 ORDER BY b ASC, __name__ ASC; ``` This query's results are
            ordered by `(b ASC, __name__ ASC)`. Cursors can reference either the
            full ordering or a prefix of the location, though it cannot
            reference more fields than what are in the provided `ORDER BY`.
            Continuing off the example above, attaching the following start
            cursors will have varying impact: - `START BEFORE (2, /k/123)`:
            start the query right before `a = 1 AND b > 2 AND __name__ >
            /k/123`. - `START AFTER (10)`: start the query right after `a = 1
            AND b > 10`. Unlike `OFFSET` which requires scanning over the first
            N results to skip, a start cursor allows the query to begin at a
            logical position. This position is not required to match an actual
            result, it will scan forward from this position to find the next
            document. Requires: * The number of values cannot be greater than
            the number of fields specified in the `ORDER BY` clause.
        where:
          $ref: '#/components/schemas/Filter'
          description: The filter to apply.
      type: object
    Sum:
      description: >-
        Sum of the values of the requested field. * Only numeric values will be
        aggregated. All non-numeric values including `NULL` are skipped. * If
        the aggregated values contain `NaN`, returns `NaN`. Infinity math
        follows IEEE-754 standards. * If the aggregated value set is empty,
        returns 0. * Returns a 64-bit integer if all aggregated numbers are
        integers and the sum result does not overflow. Otherwise, the result is
        returned as a double. Note that even if all the aggregated values are
        integers, the result is returned as a double if it cannot fit within a
        64-bit signed integer. When this occurs, the returned value will lose
        precision. * When underflow occurs, floating-point aggregation is
        non-deterministic. This means that running the same query repeatedly
        without any changes to the underlying values could produce slightly
        different results each time. In those cases, values should be stored as
        integers over floating-point numbers.
      id: Sum
      properties:
        field:
          $ref: '#/components/schemas/FieldReference'
          description: The field to aggregate on.
      type: object
    Target:
      description: A specification of a set of documents to listen to.
      id: Target
      properties:
        documents:
          $ref: '#/components/schemas/DocumentsTarget'
          description: A target specified by a set of document names.
        expectedCount:
          description: >-
            The number of documents that last matched the query at the resume
            token or read time. This value is only relevant when a `resume_type`
            is provided. This value being present and greater than zero signals
            that the client wants `ExistenceFilter.unchanged_names` to be
            included in the response.
          format: int32
          type: integer
        once:
          description: If the target should be removed once it is current and consistent.
          type: boolean
        query:
          $ref: '#/components/schemas/QueryTarget'
          description: A target specified by a query.
        readTime:
          description: >-
            Start listening after a specific `read_time`. The client must know
            the state of matching documents at this time.
          format: google-datetime
          type: string
        resumeToken:
          description: >-
            A resume token from a prior TargetChange for an identical target.
            Using a resume token with a different target is unsupported and may
            fail.
          format: byte
          type: string
        targetId:
          description: >-
            The target ID that identifies the target on the stream. Must be a
            positive number and non-zero. If `target_id` is 0 (or unspecified),
            the server will assign an ID for this target and return that in a
            `TargetChange::ADD` event. Once a target with `target_id=0` is
            added, all subsequent targets must also have `target_id=0`. If an
            `AddTarget` request with `target_id != 0` is sent to the server
            after a target with `target_id=0` is added, the server will
            immediately send a response with a `TargetChange::Remove` event.
            Note that if the client sends multiple `AddTarget` requests without
            an ID, the order of IDs returned in `TargetChange.target_ids` are
            undefined. Therefore, clients should provide a target ID instead of
            relying on the server to assign one. If `target_id` is non-zero,
            there must not be an existing active target on this stream with the
            same ID.
          format: int32
          type: integer
      type: object
    TargetChange:
      description: Targets being watched have changed.
      id: TargetChange
      properties:
        cause:
          $ref: '#/components/schemas/Status'
          description: The error that resulted in this change, if applicable.
        readTime:
          description: >-
            The consistent `read_time` for the given `target_ids` (omitted when
            the target_ids are not at a consistent snapshot). The stream is
            guaranteed to send a `read_time` with `target_ids` empty whenever
            the entire stream reaches a new consistent snapshot. ADD, CURRENT,
            and RESET messages are guaranteed to (eventually) result in a new
            consistent snapshot (while NO_CHANGE and REMOVE messages are not).
            For a given stream, `read_time` is guaranteed to be monotonically
            increasing.
          format: google-datetime
          type: string
        resumeToken:
          description: >-
            A token that can be used to resume the stream for the given
            `target_ids`, or all targets if `target_ids` is empty. Not set on
            every target change.
          format: byte
          type: string
        targetChangeType:
          description: The type of change that occurred.
          enum:
            - NO_CHANGE
            - ADD
            - REMOVE
            - CURRENT
            - RESET
          enumDescriptions:
            - >-
              No change has occurred. Used only to send an updated
              `resume_token`.
            - The targets have been added.
            - The targets have been removed.
            - >-
              The targets reflect all changes committed before the targets were
              added to the stream. This will be sent after or with a `read_time`
              that is greater than or equal to the time at which the targets
              were added. Listeners can wait for this change if read-after-write
              semantics are desired.
            - >-
              The targets have been reset, and a new initial state for the
              targets will be returned in subsequent changes. After the initial
              state is complete, `CURRENT` will be returned even if the target
              was previously indicated to be `CURRENT`.
          type: string
        targetIds:
          description: >-
            The target IDs of targets that have changed. If empty, the change
            applies to all targets. The order of the target IDs is not defined.
          items:
            format: int32
            type: integer
          type: array
      type: object
    TransactionOptions:
      description: Options for creating a new transaction.
      id: TransactionOptions
      properties:
        readOnly:
          $ref: '#/components/schemas/ReadOnly'
          description: The transaction can only be used for read operations.
        readWrite:
          $ref: '#/components/schemas/ReadWrite'
          description: The transaction can be used for both read and write operations.
      type: object
    UnaryFilter:
      description: A filter with a single operand.
      id: UnaryFilter
      properties:
        field:
          $ref: '#/components/schemas/FieldReference'
          description: The field to which to apply the operator.
        op:
          description: The unary operator to apply.
          enum:
            - OPERATOR_UNSPECIFIED
            - IS_NAN
            - IS_NULL
            - IS_NOT_NAN
            - IS_NOT_NULL
          enumDescriptions:
            - Unspecified. This value must not be used.
            - The given `field` is equal to `NaN`.
            - The given `field` is equal to `NULL`.
            - >-
              The given `field` is not equal to `NaN`. Requires: * No other
              `NOT_EQUAL`, `NOT_IN`, `IS_NOT_NULL`, or `IS_NOT_NAN`. * That
              `field` comes first in the `order_by`.
            - >-
              The given `field` is not equal to `NULL`. Requires: * A single
              `NOT_EQUAL`, `NOT_IN`, `IS_NOT_NULL`, or `IS_NOT_NAN`. * That
              `field` comes first in the `order_by`.
          type: string
      type: object
    Value:
      description: A message that can hold any of the supported value types.
      id: Value
      properties:
        arrayValue:
          $ref: '#/components/schemas/ArrayValue'
          description: >-
            An array value. In Standard edition databases, an array value cannot
            directly contain another array value, though it can contain a map
            which contains another array. In Enterprise edition databases, an
            array value can contain another array value.
        booleanValue:
          description: A boolean value.
          type: boolean
        bytesValue:
          description: >-
            A bytes value. In Standard edition databases: * The value must not
            exceed 1 MiB - 89 bytes. * Only the first 1,500 bytes are considered
            by queries. In Enterprise edition databases, there is no limit on
            the size of the value. However, it is still subject to document and
            index entry size limits.
          format: byte
          type: string
        doubleValue:
          description: A double value.
          format: double
          type: number
        fieldReferenceValue:
          description: >-
            Value which references a field. This is considered relative (vs
            absolute) since it only refers to a field and not a field within a
            particular document. **Requires:** * Must follow field reference
            limitations. * Not allowed to be used when writing documents.
          type: string
        functionValue:
          $ref: '#/components/schemas/Function'
          description: >-
            A value that represents an unevaluated expression. **Requires:** *
            Not allowed to be used when writing documents.
        geoPointValue:
          $ref: '#/components/schemas/LatLng'
          description: A geo point value representing a point on the surface of Earth.
        integerValue:
          description: An integer value.
          format: int64
          type: string
        mapValue:
          $ref: '#/components/schemas/MapValue'
          description: A map value.
        nullValue:
          description: A null value.
          enum:
            - NULL_VALUE
          enumDescriptions:
            - Null value.
          type: string
        pipelineValue:
          $ref: '#/components/schemas/Pipeline'
          description: >-
            A value that represents an unevaluated pipeline. **Requires:** * Not
            allowed to be used when writing documents.
        referenceValue:
          description: >-
            A reference to a document. For example:
            `projects/{project_id}/databases/{database_id}/documents/{document_path}`.
          type: string
        stringValue:
          description: >-
            A string value. In Standard edition databases: * The string,
            represented as UTF-8, must not exceed 1 MiB - 89 bytes. * Only the
            first 1,500 bytes of the UTF-8 representation are considered by
            queries. In Enterprise edition databases, there is no limit on the
            size of the value. However, it is still subject to document and
            index entry size limits.
          type: string
        timestampValue:
          description: >-
            A timestamp value. Precise only to microseconds. When stored, any
            additional precision is rounded down.
          format: google-datetime
          type: string
        variableReferenceValue:
          description: >-
            Pointer to a variable defined elsewhere in a pipeline. Unlike
            `field_reference_value` which references a field within a document,
            this refers to a variable, defined in a separate namespace than the
            fields of a document.
          type: string
      type: object
    Write:
      description: A write on a document.
      id: Write
      properties:
        currentDocument:
          $ref: '#/components/schemas/Precondition'
          description: >-
            An optional precondition on the document. The write will fail if
            this is set and not met by the target document.
        delete:
          description: >-
            A document name to delete. In the format:
            `projects/{project_id}/databases/{database_id}/documents/{document_path}`.
          type: string
        transform:
          $ref: '#/components/schemas/DocumentTransform'
          description: Applies a transformation to a document.
        update:
          $ref: '#/components/schemas/Document'
          description: A document to write.
        updateMask:
          $ref: '#/components/schemas/DocumentMask'
          description: >-
            The fields to update in this write. This field can be set only when
            the operation is `update`. If the mask is not set for an `update`
            and the document exists, any existing data will be overwritten. If
            the mask is set and the document on the server has fields not
            covered by the mask, they are left unchanged. Fields referenced in
            the mask, but not present in the input document, are deleted from
            the document on the server. The field paths in this mask must not
            contain a reserved field name.
        updateTransforms:
          description: >-
            The transforms to perform after update. This field can be set only
            when the operation is `update`. If present, this write is equivalent
            to performing `update` and `transform` to the same document
            atomically and in order.
          items:
            $ref: '#/components/schemas/FieldTransform'
          type: array
      type: object
    WriteRequest:
      description: >-
        The request for Firestore.Write. The first request creates a stream, or
        resumes an existing one from a token. When creating a new stream, the
        server replies with a response containing only an ID and a token, to use
        in the next request. When resuming a stream, the server first streams
        any responses later than the given token, then a response containing
        only an up-to-date token, to use in the next request.
      id: WriteRequest
      properties:
        labels:
          additionalProperties:
            type: string
          description: Labels associated with this write request.
          type: object
        requestOptions:
          $ref: '#/components/schemas/RequestOptions'
          description: Optional. The request options for the request.
        streamId:
          description: >-
            The ID of the write stream to resume. This may only be set in the
            first message. When left empty, a new write stream will be created.
          type: string
        streamToken:
          description: >-
            A stream token that was previously sent by the server. The client
            should set this field to the token from the most recent
            WriteResponse it has received. This acknowledges that the client has
            received responses up to this token. After sending this token,
            earlier tokens may not be used anymore. The server may close the
            stream if there are too many unacknowledged responses. Leave this
            field unset when creating a new stream. To resume a stream at a
            specific point, set this field and the `stream_id` field. Leave this
            field unset when creating a new stream.
          format: byte
          type: string
        writes:
          description: >-
            The writes to apply. Always executed atomically and in order. This
            must be empty on the first request. This may be empty on the last
            request. This must not be empty on all other requests.
          items:
            $ref: '#/components/schemas/Write'
          type: array
      type: object
    WriteResponse:
      description: The response for Firestore.Write.
      id: WriteResponse
      properties:
        commitTime:
          description: >-
            The time at which the commit occurred. Any read with an equal or
            greater `read_time` is guaranteed to see the effects of the write.
          format: google-datetime
          type: string
        streamId:
          description: >-
            The ID of the stream. Only set on the first message, when a new
            stream was created.
          type: string
        streamToken:
          description: >-
            A token that represents the position of this response in the stream.
            This can be used by a client to resume the stream at this point.
            This field is always set.
          format: byte
          type: string
        writeResults:
          description: >-
            The result of applying the writes. This i-th write result
            corresponds to the i-th write in the request.
          items:
            $ref: '#/components/schemas/WriteResult'
          type: array
      type: object
    WriteResult:
      description: The result of applying a write.
      id: WriteResult
      properties:
        transformResults:
          description: >-
            The results of applying each DocumentTransform.FieldTransform, in
            the same order.
          items:
            $ref: '#/components/schemas/Value'
          type: array
        updateTime:
          description: >-
            The last update time of the document after applying the write. Not
            set after a `delete`. If the write did not actually change the
            document, this will be the previous update_time.
          format: google-datetime
          type: string
      type: object
