          description: Use Customer Managed Encryption Keys (CMEK) for encryption.
        googleDefaultEncryption:
          $ref: >-
            #/components/schemas/GoogleFirestoreAdminV1GoogleDefaultEncryptionOptions
          description: Use Google default encryption.
        useSourceEncryption:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1SourceEncryptionOptions'
          description: >-
            The database will use the same encryption configuration as the
            source.
      type: object
    GoogleFirestoreAdminV1ExportDocumentsMetadata:
      description: >-
        Metadata for google.longrunning.Operation results from
        FirestoreAdmin.ExportDocuments.
      id: GoogleFirestoreAdminV1ExportDocumentsMetadata
      properties:
        collectionIds:
          description: Which collection IDs are being exported.
          items:
            type: string
          type: array
        endTime:
          description: >-
            The time this operation completed. Will be unset if operation still
            in progress.
          format: google-datetime
          type: string
        namespaceIds:
          description: Which namespace IDs are being exported.
          items:
            type: string
          type: array
        operationState:
          description: The state of the export operation.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - INITIALIZING
            - PROCESSING
            - CANCELLING
            - FINALIZING
            - SUCCESSFUL
            - FAILED
            - CANCELLED
          enumDescriptions:
            - Unspecified.
            - Request is being prepared for processing.
            - Request is actively being processed.
            - >-
              Request is in the process of being cancelled after user called
              google.longrunning.Operations.CancelOperation on the operation.
            - Request has been processed and is in its finalization stage.
            - Request has completed successfully.
            - Request has finished being processed, but encountered an error.
            - >-
              Request has finished being cancelled after user called
              google.longrunning.Operations.CancelOperation.
          type: string
        outputUriPrefix:
          description: Where the documents are being exported to.
          type: string
        progressBytes:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Progress'
          description: The progress, in bytes, of this operation.
        progressDocuments:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Progress'
          description: The progress, in documents, of this operation.
        snapshotTime:
          description: >-
            The timestamp that corresponds to the version of the database that
            is being exported. If unspecified, there are no guarantees about the
            consistency of the documents being exported.
          format: google-datetime
          type: string
        startTime:
          description: The time this operation started.
          format: google-datetime
          type: string
      type: object
    GoogleFirestoreAdminV1ExportDocumentsRequest:
      description: The request for FirestoreAdmin.ExportDocuments.
      id: GoogleFirestoreAdminV1ExportDocumentsRequest
      properties:
        collectionIds:
          description: >-
            IDs of the collection groups to export. Unspecified means all
            collection groups. Each collection group in this list must be
            unique.
          items:
            type: string
          type: array
        namespaceIds:
          description: >-
            An empty list represents all namespaces. This is the preferred usage
            for databases that don't use namespaces. An empty string element
            represents the default namespace. This should be used if the
            database has data in non-default namespaces, but doesn't want to
            include them. Each namespace in this list must be unique.
          items:
            type: string
          type: array
        outputUriPrefix:
          description: >-
            The output URI. Currently only supports Google Cloud Storage URIs of
            the form: `gs://BUCKET_NAME[/NAMESPACE_PATH]`, where `BUCKET_NAME`
            is the name of the Google Cloud Storage bucket and `NAMESPACE_PATH`
            is an optional Google Cloud Storage namespace path. When choosing a
            name, be sure to consider Google Cloud Storage naming guidelines:
            https://cloud.google.com/storage/docs/naming. If the URI is a bucket
            (without a namespace path), a prefix will be generated based on the
            start time.
          type: string
        snapshotTime:
          description: >-
            The timestamp that corresponds to the version of the database to be
            exported. The timestamp must be in the past, rounded to the minute
            and not older than earliestVersionTime. If specified, then the
            exported documents will represent a consistent view of the database
            at the provided time. Otherwise, there are no guarantees about the
            consistency of the exported documents.
          format: google-datetime
          type: string
      type: object
    GoogleFirestoreAdminV1ExportDocumentsResponse:
      description: Returned in the google.longrunning.Operation response field.
      id: GoogleFirestoreAdminV1ExportDocumentsResponse
      properties:
        outputUriPrefix:
          description: >-
            Location of the output files. This can be used to begin an import
            into Cloud Firestore (this project or another project) after the
            operation completes successfully.
          type: string
      type: object
    GoogleFirestoreAdminV1Field:
      description: >-
        Represents a single field in the database. Fields are grouped by their
        "Collection Group", which represent all collections in the database with
        the same ID.
      id: GoogleFirestoreAdminV1Field
      properties:
        indexConfig:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1IndexConfig'
          description: >-
            The index configuration for this field. If unset, field indexing
            will revert to the configuration defined by the `ancestor_field`. To
            explicitly remove all indexes for this field, specify an index
            config with an empty list of indexes.
        name:
          description: >-
            Required. A field name of the form:
            `projects/{project_id}/databases/{database_id}/collectionGroups/{collection_id}/fields/{field_path}`
            A field path can be a simple field name, e.g. `address` or a path to
            fields within `map_value` , e.g. `address.city`, or a special field
            path. The only valid special field is `*`, which represents any
            field. Field paths can be quoted using `` ` `` (backtick). The only
            character that must be escaped within a quoted field path is the
            backtick character itself, escaped using a backslash. Special
            characters in field paths that must be quoted include: `*`, `.`, ``
            ` `` (backtick), `[`, `]`, as well as any ascii symbolic characters.
            Examples: `` `address.city` `` represents a field named
            `address.city`, not the map key `city` in the field `address`. ``
            `*` `` represents a field named `*`, not any field. A special
            `Field` contains the default indexing settings for all fields. This
            field's resource name is:
            `projects/{project_id}/databases/{database_id}/collectionGroups/__default__/fields/*`
            Indexes defined on this `Field` will be applied to all fields which
            do not have their own `Field` index configuration.
          type: string
        ttlConfig:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1TtlConfig'
          description: >-
            The TTL configuration for this `Field`. Setting or unsetting this
            will enable or disable the TTL for documents that have this `Field`.
      type: object
    GoogleFirestoreAdminV1FieldOperationMetadata:
      description: >-
        Metadata for google.longrunning.Operation results from
        FirestoreAdmin.UpdateField.
      id: GoogleFirestoreAdminV1FieldOperationMetadata
      properties:
        endTime:
          description: >-
            The time this operation completed. Will be unset if operation still
            in progress.
          format: google-datetime
          type: string
        field:
          description: >-
            The field resource that this operation is acting on. For example:
            `projects/{project_id}/databases/{database_id}/collectionGroups/{collection_id}/fields/{field_path}`
          type: string
        indexConfigDeltas:
          description: >-
            A list of IndexConfigDelta, which describe the intent of this
            operation.
          items:
            $ref: '#/components/schemas/GoogleFirestoreAdminV1IndexConfigDelta'
          type: array
        progressBytes:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Progress'
          description: The progress, in bytes, of this operation.
        progressDocuments:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1Progress'
          description: The progress, in documents, of this operation.
        startTime:
          description: The time this operation started.
          format: google-datetime
          type: string
        state:
          description: The state of the operation.
          enum:
            - OPERATION_STATE_UNSPECIFIED
            - INITIALIZING
            - PROCESSING
            - CANCELLING
            - FINALIZING
            - SUCCESSFUL
            - FAILED
            - CANCELLED
          enumDescriptions:
            - Unspecified.
            - Request is being prepared for processing.
            - Request is actively being processed.
            - >-
              Request is in the process of being cancelled after user called
              google.longrunning.Operations.CancelOperation on the operation.
            - Request has been processed and is in its finalization stage.
            - Request has completed successfully.
            - Request has finished being processed, but encountered an error.
            - >-
              Request has finished being cancelled after user called
              google.longrunning.Operations.CancelOperation.
          type: string
        ttlConfigDelta:
          $ref: '#/components/schemas/GoogleFirestoreAdminV1TtlConfigDelta'
          description: Describes the deltas of TTL configuration.
      type: object
    GoogleFirestoreAdminV1FlatIndex:
