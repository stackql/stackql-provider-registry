    parameters: *ref_1
    post:
      description: >-
        Creates a new database by cloning an existing one. The new database must
        be in the same cloud region or multi-region location as the existing
        database. This behaves similar to FirestoreAdmin.CreateDatabase except
        instead of creating a new empty database, a new database is created with
        the database type, index configuration, and documents from an existing
        database. The long-running operation can be used to track the progress
        of the clone, with the Operation's metadata field type being the
        CloneDatabaseMetadata. The response type is the Database if the clone
        was successful. The new database is not readable or writeable until the
        LRO has completed.
