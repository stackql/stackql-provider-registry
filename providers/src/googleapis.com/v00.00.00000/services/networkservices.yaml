components:
  parameters:
    _.xgafv:
      description: V1 error format.
      in: query
      name: $.xgafv
      schema:
        enum:
          - '1'
          - '2'
        type: string
    access_token:
      description: OAuth access token.
      in: query
      name: access_token
      schema:
        type: string
    alt:
      description: Data format for response.
      in: query
      name: alt
      schema:
        enum:
          - json
          - media
          - proto
        type: string
    callback:
      description: JSONP
      in: query
      name: callback
      schema:
        type: string
    fields:
      description: Selector specifying which fields to include in a partial response.
      in: query
      name: fields
      schema:
        type: string
    key:
      description: >-
        API key. Your API key identifies your project and provides you with API
        access, quota, and reports. Required unless you provide an OAuth 2.0
        token.
      in: query
      name: key
      schema:
        type: string
    oauth_token:
      description: OAuth 2.0 token for the current user.
      in: query
      name: oauth_token
      schema:
        type: string
    prettyPrint:
      description: Returns response with indentations and line breaks.
      in: query
      name: prettyPrint
      schema:
        type: boolean
    quotaUser:
      description: >-
        Available to use for quota purposes for server-side applications. Can be
        any arbitrary string assigned to a user, but should not exceed 40
        characters.
      in: query
      name: quotaUser
      schema:
        type: string
    uploadType:
      description: Legacy upload protocol for media (e.g. "media", "multipart").
      in: query
      name: uploadType
      schema:
        type: string
    upload_protocol:
      description: Upload protocol for media (e.g. "raw", "multipart").
      in: query
      name: upload_protocol
      schema:
        type: string
  schemas:
    AgentConnectivityTemplate:
      description: AgentConnectivityTemplate represents a reusable network configuration.
      id: AgentConnectivityTemplate
      properties:
        accessPath:
          description: >-
            Required. Immutable. The path of the access. Maps roughly to
            ingress/egress, though we keep CLIENT_TO_AGENT and AGENT_TO_ANYWHERE
            as carryovers from Agent Gateway's original resource model. The path
            is immutable once set. Exactly one path can be set.
          enum:
            - ACCESS_PATH_UNSPECIFIED
            - CLIENT_TO_AGENT
            - AGENT_TO_ANYWHERE
          enumDescriptions:
            - Unspecified access path.
            - Protect connection to Agent or Tool.
            - Govern agent connections to destinations.
          type: string
        accessTypes:
          description: >-
            Optional. The types of network access provided to the gateway. Both
            PUBLIC and PRIVATE can be configured.
          items:
            enum:
              - ACCESS_TYPE_UNSPECIFIED
              - PUBLIC
              - PRIVATE
            enumDescriptions:
              - Unspecified access type.
              - Public network access.
              - Private network access.
            type: string
          type: array
        agentCompute:
          description: >-
            Optional. The compute environment where the agent is hosted. Exactly
            one type of compute must be chosen.
          enum:
            - AGENT_COMPUTE_UNSPECIFIED
            - GKE
            - CLOUD_RUN
            - BORG
          enumDescriptions:
            - Unspecified compute type.
            - Google Kubernetes Engine.
            - Google Cloud Run.
            - Google Borg (for 1P producers).
          type: string
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        deploymentModel:
          description: Required. The deployment model for the gateway.
          enum:
            - DEPLOYMENT_MODEL_UNSPECIFIED
            - CENTRALIZED
            - AMBIENT
          enumDescriptions:
            - Unspecified deployment model.
            - Centralized deployment.
            - Ambient deployment.
          type: string
        description:
          description: >-
            Optional. A free-text description of the resource. Max length 1024
            characters.
          type: string
        egressNetworkConfig:
          $ref: '#/components/schemas/EgressNetworkConfig'
          description: Optional. Configuration for egress network traffic.
        etag:
          description: >-
            Optional. Etag of the resource. If this is provided, it must match
            the server's etag. If the provided etag does not match the server's
            etag, the request will fail with a 409 ABORTED error.
          type: string
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of label tags associated with the
            AgentConnectivityTemplate resource.
          type: object
        name:
          description: >-
            Identifier. Name of the AgentConnectivityTemplate resource. It
            matches pattern
            `projects/*/locations/*/agentConnectivityTemplates/`.
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    AgentGateway:
      description: AgentGateway represents the agent gateway resource.
      id: AgentGateway
      properties:
        agentConnectivityTemplate:
          description: >-
            Optional. The resource name of the AgentConnectivityTemplate.
            Format:
            projects/{project}/locations/{location}/agentConnectivityTemplates/{template}
          type: string
        agentGatewayCard:
          $ref: '#/components/schemas/AgentGatewayAgentGatewayOutputCard'
          description: Output only. Field for populated AgentGateway card.
          readOnly: true
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. A free-text description of the resource. Max length 1024
            characters.
          type: string
        etag:
          description: >-
            Optional. Etag of the resource. If this is provided, it must match
            the server's etag. If the provided etag does not match the server's
            etag, the request will fail with a 409 ABORTED error.
          type: string
        googleManaged:
          $ref: '#/components/schemas/AgentGatewayGoogleManaged'
          description: >-
            Optional. Proxy is orchestrated and managed by GoogleCloud in a
            tenant project.
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of label tags associated with the AgentGateway
            resource.
          type: object
        name:
          description: >-
            Identifier. Name of the AgentGateway resource. It matches pattern
            `projects/*/locations/*/agentGateways/`.
          type: string
        networkConfig:
          $ref: '#/components/schemas/AgentGatewayNetworkConfig'
          description: Optional. Network configuration for the AgentGateway.
        protocols:
          deprecated: true
          description: Optional. Deprecated.
          items:
            enum:
              - PROTOCOL_UNSPECIFIED
              - MCP
            enumDescriptions:
              - Unspecified protocol.
              - Message Control Plane protocol.
            type: string
          type: array
        registries:
          description: >-
            Optional. A list of Agent registries containing the agents, MCP
            servers and tools governed by the Agent Gateway. Note: Currently
            limited to project-scoped registries Must be of format
            `//agentregistry.googleapis.com/projects/{project}/locations/{location}/`
          items:
            type: string
          type: array
        selfManaged:
          $ref: '#/components/schemas/AgentGatewaySelfManaged'
          description: >-
            Optional. Attach to existing Application Load Balancers or Secure
            Web Proxies.
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    AgentGatewayAgentGatewayOutputCard:
      description: AgentGatewayOutputCard contains informational output-only fields
      id: AgentGatewayAgentGatewayOutputCard
      properties:
        mtlsEndpoint:
          description: Output only. mTLS Endpoint associated with this AgentGateway
          readOnly: true
          type: string
        rootCertificates:
          description: >-
            Output only. Root Certificates for Agents to validate this
            AgentGateway
          items:
            type: string
          readOnly: true
          type: array
        serviceExtensionsServiceAccount:
          description: Output only. Service Account used by Service Extensions to operate.
          readOnly: true
          type: string
      type: object
    AgentGatewayGoogleManaged:
      description: >-
        Configuration for Google Managed deployment mode. Proxy is orchestrated
        and managed by GoogleCloud in a tenant project.
      id: AgentGatewayGoogleManaged
      properties:
        governedAccessPath:
          description: Optional. Operating Mode of Agent Gateway.
          enum:
            - GOVERNED_ACCESS_PATH_UNSPECIFIED
            - AGENT_TO_ANYWHERE
            - CLIENT_TO_AGENT
          enumDescriptions:
            - Governed access path is not specified.
            - Govern agent conections to destinations.
            - Protect connection to Agent or Tool.
          type: string
      type: object
    AgentGatewayNetworkConfig:
      description: NetworkConfig contains network configurations for the AgentGateway.
      id: AgentGatewayNetworkConfig
      properties:
        dnsPeeringConfig:
          $ref: '#/components/schemas/AgentGatewayNetworkConfigDnsPeeringConfig'
          description: >-
            Optional. Optional DNS peering configuration for connectivity to
            your private VPC network.
        egress:
          $ref: '#/components/schemas/AgentGatewayNetworkConfigEgress'
          description: >-
            Optional. Optional PSC-Interface network attachment for connectivity
            to your private VPCs network.
      type: object
    AgentGatewayNetworkConfigDnsPeeringConfig:
      description: DNS peering config for the user VPC network.
      id: AgentGatewayNetworkConfigDnsPeeringConfig
      properties:
        domains:
          description: >-
            Required. Domain names for which DNS queries should be forwarded to
            the target network.
          items:
            type: string
          type: array
        targetNetwork:
          description: >-
            Required. Target network in 'target project' to which DNS queries
            should be forwarded to. Must be in format of
            `projects/{project}/global/networks/{network}`.
          type: string
        targetProject:
          description: >-
            Required. Target project ID to which DNS queries should be forwarded
            to. This can be the same project that contains the AgentGateway or a
            different project.
          type: string
      type: object
    AgentGatewayNetworkConfigEgress:
      description: Configuration for Egress
      id: AgentGatewayNetworkConfigEgress
      properties:
        networkAttachment:
          description: Optional. The URI of the Network Attachment resource.
          type: string
      type: object
    AgentGatewaySelfManaged:
      description: >-
        Configuration for Self Managed deployment mode. Attach to existing
        Application Load Balancers or Secure Web Proxies.
      id: AgentGatewaySelfManaged
      properties:
        resourceUri:
          description: >-
            Optional. A supported Google Cloud networking proxy in the Project
            and Location
          type: string
        resourceUris:
          description: >-
            Optional. List of supported Google Cloud networking proxies in the
            Project and Location. resource_uris is mutually exclusive with
            resource_uri.
          items:
            type: string
          type: array
      type: object
    AuditConfig:
      description: >-
        Specifies the audit configuration for a service. The configuration
        determines which permission types are logged, and what identities, if
        any, are exempted from logging. An AuditConfig must have one or more
        AuditLogConfigs. If there are AuditConfigs for both `allServices` and a
        specific service, the union of the two AuditConfigs is used for that
        service: the log_types specified in each AuditConfig are enabled, and
        the exempted_members in each AuditLogConfig are exempted. Example Policy
        with multiple AuditConfigs: { "audit_configs": [ { "service":
        "allServices", "audit_log_configs": [ { "log_type": "DATA_READ",
        "exempted_members": [ "user:jose@example.com" ] }, { "log_type":
        "DATA_WRITE" }, { "log_type": "ADMIN_READ" } ] }, { "service":
        "sampleservice.googleapis.com", "audit_log_configs": [ { "log_type":
        "DATA_READ" }, { "log_type": "DATA_WRITE", "exempted_members": [
        "user:aliya@example.com" ] } ] } ] } For sampleservice, this policy
        enables DATA_READ, DATA_WRITE and ADMIN_READ logging. It also exempts
        `jose@example.com` from DATA_READ logging, and `aliya@example.com` from
        DATA_WRITE logging.
      id: AuditConfig
      properties:
        auditLogConfigs:
          description: The configuration for logging of each type of permission.
          items:
            $ref: '#/components/schemas/AuditLogConfig'
          type: array
        service:
          description: >-
            Specifies a service that will be enabled for audit logging. For
            example, `storage.googleapis.com`, `cloudsql.googleapis.com`.
            `allServices` is a special value that covers all services.
          type: string
      type: object
    AuditLogConfig:
      description: >-
        Provides the configuration for logging a type of permissions. Example: {
        "audit_log_configs": [ { "log_type": "DATA_READ", "exempted_members": [
        "user:jose@example.com" ] }, { "log_type": "DATA_WRITE" } ] } This
        enables 'DATA_READ' and 'DATA_WRITE' logging, while exempting
        jose@example.com from DATA_READ logging.
      id: AuditLogConfig
      properties:
        exemptedMembers:
          description: >-
            Specifies the identities that do not cause logging for this type of
            permission. Follows the same format of Binding.members.
          items:
            type: string
          type: array
        logType:
          description: The log type that this config enables.
          enum:
            - LOG_TYPE_UNSPECIFIED
            - ADMIN_READ
            - DATA_WRITE
            - DATA_READ
          enumDescriptions:
            - Default case. Should never be this.
            - 'Admin reads. Example: CloudIAM getIamPolicy'
            - 'Data writes. Example: CloudSQL Users create'
            - 'Data reads. Example: CloudSQL Users list'
          type: string
      type: object
    AuthzExtension:
      description: >-
        `AuthzExtension` is a resource that allows traffic forwarding to a
        callout backend service to make an authorization decision.
      id: AuthzExtension
      properties:
        authority:
          description: >-
            Optional. The `:authority` header in the gRPC request sent from
            Envoy to the extension service. It is required when the `service`
            field points to a backend service.
          type: string
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. A human-readable description of the resource.
          type: string
        failOpen:
          description: >-
            Optional. Determines how the proxy behaves if the call to the
            extension fails or times out. When set to `TRUE`, request or
            response processing continues without error. Any subsequent
            extensions in the extension chain are also executed. When set to
            `FALSE` or the default setting of `FALSE` is used, one of the
            following happens: * If response headers have not been delivered to
            the downstream client, a generic 500 error is returned to the
            client. The error response can be tailored by configuring a custom
            error response in the load balancer. * If response headers have been
            delivered, then the HTTP stream to the downstream client is reset.
          type: boolean
        forwardAttributes:
          description: >-
            Optional. List of the Envoy attributes to forward to the extension
            server. The attributes provided here are included as part of the
            `ProcessingRequest.attributes` field (of type `map`), where the keys
            are the attribute names. Refer to the
            [documentation](https://cloud.google.com/service-extensions/docs/cel-matcher-language-reference#attributes)
            for the names of attributes that can be forwarded. If omitted, no
            attributes are sent. Each element is a string indicating the
            attribute name.
          items:
            type: string
          type: array
        forwardHeaders:
          description: >-
            Optional. List of the HTTP headers to forward to the extension (from
            the client). If omitted, all headers are sent. Each element is a
            string indicating the header name.
          items:
            type: string
          type: array
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of labels associated with the `AuthzExtension`
            resource. The format must comply with [the requirements for
            labels](/compute/docs/labeling-resources#requirements) for Google
            Cloud resources.
          type: object
        loadBalancingScheme:
          description: >-
            Optional. All backend services and forwarding rules referenced by
            this extension must share the same load balancing scheme. The
            supported values are `INTERNAL_MANAGED` and `EXTERNAL_MANAGED`. You
            can omit this field for `AuthzExtensions` resources that don't
            reference a backend service. For more information, see [Backend
            services
            overview](https://cloud.google.com/load-balancing/docs/backend-service).
          enum:
            - LOAD_BALANCING_SCHEME_UNSPECIFIED
            - INTERNAL_MANAGED
            - EXTERNAL_MANAGED
          enumDescriptions:
            - Default value. Do not use.
            - Signifies that this is used for Internal HTTP(S) Load Balancing.
            - >-
              Signifies that this is used for External Managed HTTP(S) Load
              Balancing.
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Optional. The metadata provided here is included as part of the
            `metadata_context` (of type `google.protobuf.Struct`) in the
            `ProcessingRequest` message sent to the extension server. The
            metadata is available under the namespace
            `com.google.authz_extension.`. The following variables are supported
            in the metadata Struct: `{forwarding_rule_id}` - substituted with
            the forwarding rule's fully qualified resource name.
          type: object
        name:
          description: >-
            Required. Identifier. Name of the `AuthzExtension` resource in the
            following format:
            `projects/{project}/locations/{location}/authzExtensions/{authz_extension}`.
          type: string
        service:
          description: >-
            Required. The reference to the service that runs the extension. To
            configure a callout extension: For global AuthzExtension, `service`
            must be a fully-qualified reference to a [backend
            service](https://cloud.google.com/compute/docs/reference/rest/v1/backendServices)
            in the format:
            `https://www.googleapis.com/compute/v1/projects/{project}/global/backendServices/{backendService}`.
            For regional AuthzExtension, `service` must be a fully-qualified
            reference to one of the following: * a [backend
            service](https://cloud.google.com/compute/docs/reference/rest/v1/backendServices)
            in the format:
            `https://www.googleapis.com/compute/v1/projects/{project}/regions/{region}/backendServices/{backendService}`.
            * a fully qualified domain name that can be resolved by the Google
            Cloud DNS. * `iap.googleapis.com` and it can only be referenced by
            an AuthzPolicy with the policyProfile set to REQUEST_AUTHZ. *
            `modelarmor..rep.googleapis.com` and it can only be referenced by an
            AuthzPolicy with the policyProfile set to CONTENT_AUTHZ.
          type: string
        timeout:
          description: >-
            Required. Specifies the timeout for each individual message on the
            stream. The timeout must be between 10-10000 milliseconds.
          format: google-duration
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
        wireFormat:
          description: >-
            Optional. The format of communication supported by the callout
            extension. This field is supported only for regional
            `AuthzExtension` resources. If not specified, the default value
            `EXT_PROC_GRPC` is used. Global `AuthzExtension` resources use the
            `EXT_PROC_GRPC` wire format.
          enum:
            - WIRE_FORMAT_UNSPECIFIED
            - EXT_PROC_GRPC
            - EXT_AUTHZ_GRPC
          enumDescriptions:
            - Not specified.
            - >-
              The extension service uses ext_proc gRPC API over a gRPC stream.
              This is the default value if the wire format is not specified. The
              backend service for the extension must use HTTP2 or H2C as the
              protocol. All `supported_events` for a client request are sent as
              part of the same gRPC stream.
            - >-
              The extension service uses Envoy's `ext_authz` gRPC API. The
              backend service for the extension must use HTTP2 or H2C as the
              protocol. `EXT_AUTHZ_GRPC` is only supported for regional
              `AuthzExtension` resources.
          type: string
      type: object
    Binding:
      description: Associates `members`, or principals, with a `role`.
      id: Binding
      properties:
        condition:
          $ref: '#/components/schemas/Expr'
          description: >-
            The condition that is associated with this binding. If the condition
            evaluates to `true`, then this binding applies to the current
            request. If the condition evaluates to `false`, then this binding
            does not apply to the current request. However, a different role
            binding might grant the same role to one or more of the principals
            in this binding. To learn which resources support conditions in
            their IAM policies, see the [IAM
            documentation](https://cloud.google.com/iam/help/conditions/resource-policies).
        members:
          description: >-
            Specifies the principals requesting access for a Google Cloud
            resource. `members` can have the following values: * `allUsers`: A
            special identifier that represents anyone who is on the internet;
            with or without a Google account. * `allAuthenticatedUsers`: A
            special identifier that represents anyone who is authenticated with
            a Google account or a service account. Does not include identities
            that come from external identity providers (IdPs) through identity
            federation. * `user:{emailid}`: An email address that represents a
            specific Google account. For example, `alice@example.com` . *
            `serviceAccount:{emailid}`: An email address that represents a
            Google service account. For example,
            `my-other-app@appspot.gserviceaccount.com`. *
            `serviceAccount:{projectid}.svc.id.goog[{namespace}/{kubernetes-sa}]`:
            An identifier for a [Kubernetes service
            account](https://cloud.google.com/kubernetes-engine/docs/how-to/kubernetes-service-accounts).
            For example,
            `my-project.svc.id.goog[my-namespace/my-kubernetes-sa]`. *
            `group:{emailid}`: An email address that represents a Google group.
            For example, `admins@example.com`. * `domain:{domain}`: The G Suite
            domain (primary) that represents all the users of that domain. For
            example, `google.com` or `example.com`. *
            `principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workforce identity pool. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/group/{group_id}`:
            All workforce identities in a group. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All workforce identities with a specific attribute value. *
            `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool_id}/*`:
            All identities in a workforce identity pool. *
            `principal://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/subject/{subject_attribute_value}`:
            A single identity in a workload identity pool. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/group/{group_id}`:
            A workload identity pool group. *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/attribute.{attribute_name}/{attribute_value}`:
            All identities in a workload identity pool with a certain attribute.
            *
            `principalSet://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/{pool_id}/*`:
            All identities in a workload identity pool. *
            `deleted:user:{emailid}?uid={uniqueid}`: An email address (plus
            unique identifier) representing a user that has been recently
            deleted. For example, `alice@example.com?uid=123456789012345678901`.
            If the user is recovered, this value reverts to `user:{emailid}` and
            the recovered user retains the role in the binding. *
            `deleted:serviceAccount:{emailid}?uid={uniqueid}`: An email address
            (plus unique identifier) representing a service account that has
            been recently deleted. For example,
            `my-other-app@appspot.gserviceaccount.com?uid=123456789012345678901`.
            If the service account is undeleted, this value reverts to
            `serviceAccount:{emailid}` and the undeleted service account retains
            the role in the binding. * `deleted:group:{emailid}?uid={uniqueid}`:
            An email address (plus unique identifier) representing a Google
            group that has been recently deleted. For example,
            `admins@example.com?uid=123456789012345678901`. If the group is
            recovered, this value reverts to `group:{emailid}` and the recovered
            group retains the role in the binding. *
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/{pool_id}/subject/{subject_attribute_value}`:
            Deleted single identity in a workforce identity pool. For example,
            `deleted:principal://iam.googleapis.com/locations/global/workforcePools/my-pool-id/subject/my-subject-attribute-value`.
          items:
            type: string
          type: array
        role:
          description: >-
            Role that is assigned to the list of `members`, or principals. For
            example, `roles/viewer`, `roles/editor`, or `roles/owner`. For an
            overview of the IAM roles and permissions, see the [IAM
            documentation](https://cloud.google.com/iam/docs/roles-overview).
            For a list of the available pre-defined roles, see
            [here](https://cloud.google.com/iam/docs/understanding-roles).
          type: string
      type: object
    CancelOperationRequest:
      description: The request message for Operations.CancelOperation.
      id: CancelOperationRequest
      properties: {}
      type: object
    DnsPeeringConfig:
      description: DNS Peering configuration.
      id: DnsPeeringConfig
      properties:
        domain:
          description: Optional. The domain to peer.
          type: string
        targetNetwork:
          description: >-
            Optional. The target network resource name for DNS peering. Format:
            projects/{project}/global/networks/{network_id}
          type: string
      type: object
    EgressNetworkConfig:
      id: EgressNetworkConfig
      properties:
        dnsPeeringConfig:
          $ref: '#/components/schemas/DnsPeeringConfig'
          description: Optional. DNS Peering configuration.
        networkAttachment:
          description: >-
            Optional. The network attachment resource name. Format:
            projects/{project}/regions/{region}/networkAttachments/{network_attachment_id}
          type: string
        trustConfig:
          deprecated: true
          description: >-
            Optional. Deprecated: Use tls_config instead. The trust config
            resource name. Format:
            projects/{project}/locations/{location}/trustConfigs/{trust_config}
          type: string
        vpcEgress:
          description: Optional. The VPC egress setting.
          enum:
            - VPC_EGRESS_UNSPECIFIED
            - ALL_TRAFFIC
            - PRIVATE_RANGES_ONLY
          enumDescriptions:
            - Unspecified
            - All outbound traffic is routed through the VPC connector.
            - Only private IP ranges are routed through the VPC connector.
          type: string
      type: object
    Empty:
      description: >-
        A generic empty message that you can re-use to avoid defining duplicated
        empty messages in your APIs. A typical example is to use it as the
        request or the response type of an API method. For instance: service Foo
        { rpc Bar(google.protobuf.Empty) returns (google.protobuf.Empty); }
      id: Empty
      properties: {}
      type: object
    EndpointMatcher:
      description: >-
        A definition of a matcher that selects endpoints to which the policies
        should be applied.
      id: EndpointMatcher
      properties:
        metadataLabelMatcher:
          $ref: '#/components/schemas/EndpointMatcherMetadataLabelMatcher'
          description: The matcher is based on node metadata presented by xDS clients.
      type: object
    EndpointMatcherMetadataLabelMatcher:
      description: The matcher that is based on node metadata presented by xDS clients.
      id: EndpointMatcherMetadataLabelMatcher
      properties:
        metadataLabelMatchCriteria:
          description: >-
            Specifies how matching should be done. Supported values are:
            MATCH_ANY: At least one of the Labels specified in the matcher
            should match the metadata presented by xDS client. MATCH_ALL: The
            metadata presented by the xDS client should contain all of the
            labels specified here. The selection is determined based on the best
            match. For example, suppose there are three EndpointPolicy resources
            P1, P2 and P3 and if P1 has a the matcher as MATCH_ANY , P2 has
            MATCH_ALL , and P3 has MATCH_ALL . If a client with label connects,
            the config from P1 will be selected. If a client with label
            connects, the config from P2 will be selected. If a client with
            label connects, the config from P3 will be selected. If there is
            more than one best match, (for example, if a config P4 with selector
            exists and if a client with label connects), pick up the one with
            older creation time.
          enum:
            - METADATA_LABEL_MATCH_CRITERIA_UNSPECIFIED
            - MATCH_ANY
            - MATCH_ALL
          enumDescriptions:
            - Default value. Should not be used.
            - >-
              At least one of the Labels specified in the matcher should match
              the metadata presented by xDS client.
            - >-
              The metadata presented by the xDS client should contain all of the
              labels specified here.
          type: string
        metadataLabels:
          description: >-
            The list of label value pairs that must match labels in the provided
            metadata based on filterMatchCriteria This list can have at most 64
            entries. The list can be empty if the match criteria is MATCH_ANY,
            to specify a wildcard match (i.e this matches any client).
          items:
            $ref: >-
              #/components/schemas/EndpointMatcherMetadataLabelMatcherMetadataLabels
          type: array
      type: object
    EndpointMatcherMetadataLabelMatcherMetadataLabels:
      description: Defines a name-pair value for a single label.
      id: EndpointMatcherMetadataLabelMatcherMetadataLabels
      properties:
        labelName:
          description: Required. Label name presented as key in xDS Node Metadata.
          type: string
        labelValue:
          description: >-
            Required. Label value presented as value corresponding to the above
            key, in xDS Node Metadata.
          type: string
      type: object
    EndpointPolicy:
      description: >-
        EndpointPolicy is a resource that helps apply desired configuration on
        the endpoints that match specific criteria. For example, this resource
        can be used to apply "authentication config" an all endpoints that serve
        on port 8080.
      id: EndpointPolicy
      properties:
        authorizationPolicy:
          description: >-
            Optional. This field specifies the URL of AuthorizationPolicy
            resource that applies authorization policies to the inbound traffic
            at the matched endpoints. Refer to Authorization. If this field is
            not specified, authorization is disabled(no authz checks) for this
            endpoint.
          type: string
        clientTlsPolicy:
          deprecated: true
          description: >-
            Optional. Deprecated: This field is not used and is a no-op. A URL
            referring to a ClientTlsPolicy resource. ClientTlsPolicy can be set
            to specify the authentication for traffic from the proxy to the
            actual endpoints. More specifically, it is applied to the outgoing
            traffic from the proxy to the endpoint. This is typically used for
            sidecar model where the proxy identifies itself as endpoint to the
            control plane, with the connection between sidecar and endpoint
            requiring authentication. If this field is not set, authentication
            is disabled(open). Applicable only when EndpointPolicyType is
            SIDECAR_PROXY.
          type: string
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. A free-text description of the resource. Max length 1024
            characters.
          type: string
        endpointMatcher:
          $ref: '#/components/schemas/EndpointMatcher'
          description: >-
            Required. A matcher that selects endpoints to which the policies
            should be applied.
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of label tags associated with the EndpointPolicy
            resource.
          type: object
        name:
          description: >-
            Identifier. Name of the EndpointPolicy resource. It matches pattern
            `projects/{project}/locations/*/endpointPolicies/{endpoint_policy}`.
          type: string
        serverTlsPolicy:
          description: >-
            Optional. A URL referring to ServerTlsPolicy resource.
            ServerTlsPolicy is used to determine the authentication policy to be
            applied to terminate the inbound traffic at the identified backends.
            If this field is not set, authentication is disabled(open) for this
            endpoint.
          type: string
        trafficPortSelector:
          $ref: '#/components/schemas/TrafficPortSelector'
          description: >-
            Optional. Port selector for the (matched) endpoints. If no port
            selector is provided, the matched config is applied to all ports.
        type:
          description: >-
            Required. The type of endpoint policy. This is primarily used to
            validate the configuration.
          enum:
            - ENDPOINT_POLICY_TYPE_UNSPECIFIED
            - SIDECAR_PROXY
            - GRPC_SERVER
          enumDescriptions:
            - Default value. Must not be used.
            - Represents a proxy deployed as a sidecar.
            - Represents a proxyless gRPC backend.
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    Expr:
      description: >-
        Represents a textual expression in the Common Expression Language (CEL)
        syntax. CEL is a C-like expression language. The syntax and semantics of
        CEL are documented at https://github.com/google/cel-spec. Example
        (Comparison): title: "Summary size limit" description: "Determines if a
        summary is less than 100 chars" expression: "document.summary.size() <
        100" Example (Equality): title: "Requestor is owner" description:
        "Determines if requestor is the document owner" expression:
        "document.owner == request.auth.claims.email" Example (Logic): title:
        "Public documents" description: "Determine whether the document should
        be publicly visible" expression: "document.type != 'private' &&
        document.type != 'internal'" Example (Data Manipulation): title:
        "Notification string" description: "Create a notification string with a
        timestamp." expression: "'New message received at ' +
        string(document.create_time)" The exact variables and functions that may
        be referenced within an expression are determined by the service that
        evaluates it. See the service documentation for additional information.
      id: Expr
      properties:
        description:
          description: >-
            Optional. Description of the expression. This is a longer text which
            describes the expression, e.g. when hovered over it in a UI.
          type: string
        expression:
          description: >-
            Textual representation of an expression in Common Expression
            Language syntax.
          type: string
        location:
          description: >-
            Optional. String indicating the location of the expression for error
            reporting, e.g. a file name and a position in the file.
          type: string
        title:
          description: >-
            Optional. Title for the expression, i.e. a short string describing
            its purpose. This can be used e.g. in UIs which allow to enter the
            expression.
          type: string
      type: object
    ExtensionBinding:
      description: >-
        `ExtensionBinding` is a resource representing the attachment of an
        extension to a service.
      id: ExtensionBinding
      properties:
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. A human-readable description of the resource.
          type: string
        etag:
          description: >-
            Optional. Etag of the resource. If provided, it must match the
            server's etag. If the provided etag does not match the server's
            etag, the request will fail with a 409 ABORTED error.
          type: string
        failOpen:
          description: >-
            Optional. Determines the behavior of the extension binding when the
            call to the extension fails or times out. Default value is `FALSE`.
            When set to `TRUE`, failures of the extension are silently ignored.
          type: boolean
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of labels associated with the `ExtensionBinding`
            resource. The format must comply with [the following
            requirements](https://cloud.google.com/compute/docs/labeling-resources#requirements).
          type: object
        matchConditions:
          description: >-
            Optional. A list of match conditions to match against the incoming
            request. The extension will be invoked if at least one condition
            matches the request, or if no match conditions are specified.
            Limited to 5 conditions.
          items:
            $ref: '#/components/schemas/ExtensionBindingMatchCondition'
          type: array
        name:
          description: >-
            Identifier. Name of the `ExtensionBinding` resource in the following
            format:
            `projects/{project}/locations/{location}/extensionBindings/{extension_binding}`.
          type: string
        priority:
          description: >-
            Optional. Priority of the extension binding. Lower numbers indicate
            higher priority. Priority of extension bindings are used to
            determine the order in which extension bindings are applied to a
            request.
          format: int32
          type: integer
        producerExtension:
          description: >-
            Required. The name of the extension that this binding should attach
            to target resources. Format: For Google-provided extensions, specify
            the service endpoint (see [Model Armor
            integration](https://docs.cloud.google.com/model-armor/integrations))
          type: string
        producerMetadata:
          additionalProperties:
            type: string
          description: >-
            Optional. Additional metadata that should be passed to the attached
            extension with each request.
          type: object
        target:
          $ref: '#/components/schemas/ExtensionBindingTarget'
          description: >-
            Required. Specifies a target to which this `ExtensionBinding` should
            be attached. The target can be either a single resource or a scope
            of resources.
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    ExtensionBindingMatchCondition:
      description: Conditions to match against the incoming request.
      id: ExtensionBindingMatchCondition
      properties:
        to:
          $ref: '#/components/schemas/ExtensionBindingMatchConditionTo'
          description: >-
            Optional. Describes properties of a destination of a request. If
            specified, the extension will only be invoked on requests to
            destinations that match the specified criteria.
      type: object
    ExtensionBindingMatchConditionHeaderMatch:
      description: Determines how an HTTP header should be matched.
      id: ExtensionBindingMatchConditionHeaderMatch
      properties:
        name:
          description: Required. Specifies the name of the header in the request.
          type: string
        value:
          $ref: '#/components/schemas/ExtensionBindingMatchConditionStringMatch'
          description: Optional. Specifies how the header match will be performed.
      type: object
    ExtensionBindingMatchConditionStringMatch:
      description: Specifies matching logic for string values.
      id: ExtensionBindingMatchConditionStringMatch
      properties:
        contains:
          description: >-
            Optional. The input string must have the substring specified here.
            Note: empty contains match is not allowed, please use regex instead.
            Examples: * ``abc`` matches the value ``xyz.abc.def``
          type: string
        exact:
          description: >-
            Optional. The input string must match exactly the string specified
            here. Examples: * ``abc`` only matches the value ``abc``.
          type: string
        ignoreCase:
          description: >-
            Optional. If true, indicates the exact/prefix/suffix/contains
            matching should be case insensitive. For example, the matcher
            ``data`` will match both input string ``Data`` and ``data`` if set
            to true.
          type: boolean
        prefix:
          description: >-
            Optional. The input string must have the prefix specified here.
            Note: empty prefix is not allowed. Examples: * ``abc`` matches the
            value ``abc.xyz``
          type: string
        suffix:
          description: >-
            Optional. The input string must have the suffix specified here.
            Note: empty prefix is not allowed, please use regex instead.
            Examples: * ``abc`` matches the value ``xyz.abc``
          type: string
      type: object
    ExtensionBindingMatchConditionTo:
      description: Describes properties of one or more destinations of a request.
      id: ExtensionBindingMatchConditionTo
      properties:
        destination:
          $ref: '#/components/schemas/ExtensionBindingMatchConditionToDestination'
          description: >-
            Optional. Describes properties of destination of a request. Within a
            destination, the match follows AND semantics across fields and OR
            semantics within a field, i.e. a match occurs when ANY path matches
            AND ANY header matches and ANY method matches. At least one of
            destination or not_destination must be specified.
        notDestination:
          $ref: '#/components/schemas/ExtensionBindingMatchConditionToDestination'
          description: >-
            Optional. Describes the negated properties of the request
            destination. Extension will not be invoked on requests that match
            the criteria specified in this field. At least one of destination or
            not_destination must be specified.
      type: object
    ExtensionBindingMatchConditionToDestination:
      description: Describes properties of a single destination.
      id: ExtensionBindingMatchConditionToDestination
      properties:
        headerSet:
          $ref: >-
            #/components/schemas/ExtensionBindingMatchConditionToDestinationHeaderSet
          description: >-
            Optional. A set of HTTP headers to match against. If not specified,
            requests with any headers are matched.
        hosts:
          description: >-
            Optional. A list of HTTP Hosts to match against. Limited to 10
            hosts. If not specified, any host is allowed. If specified, a match
            occurs if any of the hosts matches the host value in the request.
          items:
            $ref: '#/components/schemas/ExtensionBindingMatchConditionStringMatch'
          type: array
        paths:
          description: >-
            Optional. A list of paths to match against. Limited to 10 paths. If
            not specified, any path is allowed. Note that this path match
            includes the query parameters. For gRPC services, this should be a
            fully-qualified name of the form /package.service/method.
          items:
            $ref: '#/components/schemas/ExtensionBindingMatchConditionStringMatch'
          type: array
        resources:
          description: >-
            Optional. A list of non-empty strings whose value is matched against
            the resource value. If not specified, any resource is allowed. If
            specified, a match occurs if any of the resources matches the
            resource value in the request. Limited to 5 resources.
          items:
            $ref: '#/components/schemas/ExtensionBindingMatchConditionStringMatch'
          type: array
      type: object
    ExtensionBindingMatchConditionToDestinationHeaderSet:
      description: Describes a set of HTTP headers to match against.
      id: ExtensionBindingMatchConditionToDestinationHeaderSet
      properties:
        headers:
          description: >-
            Required. A list of headers to match against in http header. If
            multiple header matches are provided, they will be evaluated as an
            AND, i.e. all header matches must match for the request to match.
          items:
            $ref: '#/components/schemas/ExtensionBindingMatchConditionHeaderMatch'
          type: array
      type: object
    ExtensionBindingTarget:
      description: >-
        Specifies a list of targets to which this `ExtensionBinding` should
        attach.
      id: ExtensionBindingTarget
      properties:
        resources:
          description: >-
            Optional. The reference to the target resource, to which this
            binding should attach. Exactly one of `resources` or `scope` must be
            set. For Agent Gateway, this would be the full resource name, in the
            format:
            `projects/{project}/locations/{location}/agentGateways/{agent_gateway}`.
            For AI App, this would be the full resource name, in the format:
            `projects/{project}/locations/{location}/applications/{application}`.
          items:
            type: string
          type: array
        scope:
          $ref: '#/components/schemas/ExtensionBindingTargetScope'
          description: >-
            Optional. Specifies the scope of resources to which this binding
            should attach. Exactly one of `resources` or `scope` must be set.
      type: object
    ExtensionBindingTargetScope:
      description: Specifies the scope of resources to which this binding should attach.
      id: ExtensionBindingTargetScope
      properties:
        parent:
          description: >-
            Required. Parent resource name specification, in the format:
            `projects/{project_number}`.
          type: string
        resourceTypes:
          description: >-
            Required. Type of the resource to which the binding should attach.
            Limited to 1 resource type.
          items:
            enum:
              - RESOURCE_TYPE_UNSPECIFIED
              - AI_APPLICATION
              - AGENT_GATEWAY
            enumDescriptions:
              - Default value. Should not be used.
              - AI Application resources.
              - Agent Gateway resources.
            type: string
          type: array
      type: object
    ExtensionChain:
      description: >-
        A single extension chain wrapper that contains the match conditions and
        extensions to execute.
      id: ExtensionChain
      properties:
        extensions:
          description: >-
            Required. A set of extensions to execute for the matching request.
            At least one extension is required. Up to 3 extensions can be
            defined for each extension chain for `LbTrafficExtension` resource.
            `LbRouteExtension` and `LbEdgeExtension` chains are limited to 1
            extension per extension chain.
          items:
            $ref: '#/components/schemas/ExtensionChainExtension'
          type: array
        matchCondition:
          $ref: '#/components/schemas/ExtensionChainMatchCondition'
          description: >-
            Required. Conditions under which this chain is invoked for a
            request.
        name:
          description: >-
            Required. The name for this extension chain. The name is logged as
            part of the HTTP request logs. The name must conform with RFC-1034,
            is restricted to lower-cased letters, numbers and hyphens, and can
            have a maximum length of 63 characters. Additionally, the first
            character must be a letter and the last a letter or a number.
          type: string
      type: object
    ExtensionChainExtension:
      description: A single extension in the chain to execute for the matching request.
      id: ExtensionChainExtension
      properties:
        authority:
          description: >-
            Optional. The `:authority` header in the gRPC request sent from
            Envoy to the extension service. Required for Callout extensions.
            This field is not supported for plugin extensions. Setting it
            results in a validation error.
          type: string
        failOpen:
          description: >-
            Optional. Determines how the proxy behaves if the call to the
            extension fails or times out. When set to `TRUE`, request or
            response processing continues without error. Any subsequent
            extensions in the extension chain are also executed. When set to
            `FALSE` or the default setting of `FALSE` is used, one of the
            following happens: * If response headers have not been delivered to
            the downstream client, a generic 500 error is returned to the
            client. The error response can be tailored by configuring a custom
            error response in the load balancer. * If response headers have been
            delivered, then the HTTP stream to the downstream client is reset.
          type: boolean
        forwardAttributes:
          description: >-
            Optional. List of the Envoy attributes to forward to the extension
            server. The attributes provided here are included as part of the
            `ProcessingRequest.attributes` field (of type `map`), where the keys
            are the attribute names. Refer to the
            [documentation](https://cloud.google.com/service-extensions/docs/cel-matcher-language-reference#attributes)
            for the names of attributes that can be forwarded. If omitted, no
            attributes are sent. Each element is a string indicating the
            attribute name.
          items:
            type: string
          type: array
        forwardHeaders:
          description: >-
            Optional. List of the HTTP headers to forward to the extension (from
            the client or backend). If omitted, all headers are sent. Each
            element is a string indicating the header name.
          items:
            type: string
          type: array
        metadata:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Optional. The metadata provided here is included as part of the
            `metadata_context` (of type `google.protobuf.Struct`) in the
            `ProcessingRequest` message sent to the extension server. For
            `AuthzExtension` resources, the metadata is available under the
            namespace `com.google.authz_extension.`. For other types of
            extensions, the metadata is available under the namespace
            `com.google....`. For example:
            `com.google.lb_traffic_extension.lbtrafficextension1.chain1.ext1`.
            The following variables are supported in the metadata:
            `{forwarding_rule_id}` - substituted with the forwarding rule's
            fully qualified resource name. This field must not be set for plugin
            extensions. Setting it results in a validation error. You can set
            metadata at either the resource level or the extension level. The
            extension level metadata is recommended because you can pass a
            different set of metadata through each extension to the backend.
            This field is subject to following limitations: * The total size of
            the metadata must be less than 1KiB. * The total number of keys in
            the metadata must be less than 16. * The length of each key must be
            less than 64 characters. * The length of each value must be less
            than 1024 characters. * All values must be strings.
          type: object
        name:
          description: >-
            Optional. The name for this extension. The name is logged as part of
            the HTTP request logs. The name must conform with RFC-1034, is
            restricted to lower-cased letters, numbers and hyphens, and can have
            a maximum length of 63 characters. Additionally, the first character
            must be a letter and the last a letter or a number. This field is
            required except for AuthzExtension.
          type: string
        observabilityMode:
          description: >-
            Optional. When set to `true`, the calls to the extension backend are
            performed asynchronously, without pausing the processing of the
            ongoing request. In this mode, only `STREAMED` (default) body
            processing is supported. Responses, if any, are ignored. Supported
            by regional `LbTrafficExtension` and `LbRouteExtension` resources.
          type: boolean
        requestBodySendMode:
          description: >-
            Optional. Configures the send mode for request body processing. The
            field can only be set if `supported_events` includes `REQUEST_BODY`.
            If `supported_events` includes `REQUEST_BODY`, but
            `request_body_send_mode` is unset, the default value `STREAMED` is
            used. When this field is set to `FULL_DUPLEX_STREAMED`,
            `supported_events` must include both `REQUEST_BODY` and
            `REQUEST_TRAILERS`. This field can be set only for
            `LbTrafficExtension` and `LbRouteExtension` resources, and only when
            the `service` field of the extension points to a `BackendService`.
            Only `FULL_DUPLEX_STREAMED` mode is supported for `LbRouteExtension`
            resources.
          enum:
            - BODY_SEND_MODE_UNSPECIFIED
            - BODY_SEND_MODE_STREAMED
            - BODY_SEND_MODE_FULL_DUPLEX_STREAMED
          enumDescriptions:
            - Default value. Do not use.
            - >-
              Calls to the extension are executed in the streamed mode.
              Subsequent chunks will be sent only after the previous chunks have
              been processed. The content of the body chunks is sent one way to
              the extension. Extension may send modified chunks back. This is
              the default value if the processing mode is not specified.
            - >-
              Calls are executed in the full duplex mode. Subsequent chunks will
              be sent for processing without waiting for the response for the
              previous chunk or for the response for `REQUEST_HEADERS` event.
              Extension can freely modify or chunk the body contents. If the
              extension doesn't send the body contents back, the next extension
              in the chain or the upstream will receive an empty body.
          type: string
        responseBodySendMode:
          description: >-
            Optional. Configures the send mode for response processing. If
            unspecified, the default value `STREAMED` is used. The field can
            only be set if `supported_events` includes `RESPONSE_BODY`. If
            `supported_events` includes `RESPONSE_BODY`, but
            `response_body_send_mode` is unset, the default value `STREAMED` is
            used. When this field is set to `FULL_DUPLEX_STREAMED`,
            `supported_events` must include both `RESPONSE_BODY` and
            `RESPONSE_TRAILERS`. This field can be set only for
            `LbTrafficExtension` resources, and only when the `service` field of
            the extension points to a `BackendService`.
          enum:
            - BODY_SEND_MODE_UNSPECIFIED
            - BODY_SEND_MODE_STREAMED
            - BODY_SEND_MODE_FULL_DUPLEX_STREAMED
          enumDescriptions:
            - Default value. Do not use.
            - >-
              Calls to the extension are executed in the streamed mode.
              Subsequent chunks will be sent only after the previous chunks have
              been processed. The content of the body chunks is sent one way to
              the extension. Extension may send modified chunks back. This is
              the default value if the processing mode is not specified.
            - >-
              Calls are executed in the full duplex mode. Subsequent chunks will
              be sent for processing without waiting for the response for the
              previous chunk or for the response for `REQUEST_HEADERS` event.
              Extension can freely modify or chunk the body contents. If the
              extension doesn't send the body contents back, the next extension
              in the chain or the upstream will receive an empty body.
          type: string
        service:
          description: >-
            Required. The reference to the service that runs the extension. To
            configure a callout extension, `service` must be a fully-qualified
            reference to a [backend
            service](https://cloud.google.com/compute/docs/reference/rest/v1/backendServices)
            in the format:
            `https://www.googleapis.com/compute/v1/projects/{project}/regions/{region}/backendServices/{backendService}`
            or
            `https://www.googleapis.com/compute/v1/projects/{project}/global/backendServices/{backendService}`.
            To configure a plugin extension, `service` must be a reference to a
            [`WasmPlugin`
            resource](https://cloud.google.com/service-extensions/docs/reference/rest/v1beta1/projects.locations.wasmPlugins)
            in the format:
            `projects/{project}/locations/{location}/wasmPlugins/{plugin}` or
            `//networkservices.googleapis.com/projects/{project}/locations/{location}/wasmPlugins/{wasmPlugin}`.
            Plugin extensions are currently supported for the
            `LbTrafficExtension`, the `LbRouteExtension`, and the
            `LbEdgeExtension` resources.
          type: string
        supportedEvents:
          description: >-
            Optional. A set of events during request or response processing for
            which this extension is called. For the `LbTrafficExtension`
            resource, this field is required. For the `LbRouteExtension`
            resource, this field is optional. If unspecified, `REQUEST_HEADERS`
            event is assumed as supported. For the `LbEdgeExtension` resource,
            this field is required and must only contain `REQUEST_HEADERS`
            event. For the `AuthzExtension` resource, this field is optional.
            `REQUEST_HEADERS` is the only supported event. If unspecified,
            `REQUEST_HEADERS` event is assumed as supported.
          items:
            enum:
              - EVENT_TYPE_UNSPECIFIED
              - REQUEST_HEADERS
              - REQUEST_BODY
              - RESPONSE_HEADERS
              - RESPONSE_BODY
              - REQUEST_TRAILERS
              - RESPONSE_TRAILERS
            enumDescriptions:
              - Unspecified value. Do not use.
              - >-
                If included in `supported_events`, the extension is called when
                the HTTP request headers arrive.
              - >-
                If included in `supported_events`, the extension is called when
                the HTTP request body arrives.
              - >-
                If included in `supported_events`, the extension is called when
                the HTTP response headers arrive.
              - >-
                If included in `supported_events`, the extension is called when
                the HTTP response body arrives.
              - >-
                If included in `supported_events`, the extension is called when
                the HTTP request trailers arrives.
              - >-
                If included in `supported_events`, the extension is called when
                the HTTP response trailers arrives.
            type: string
          type: array
        timeout:
          description: >-
            Optional. Specifies the timeout for each individual message on the
            stream. The timeout must be between `10`-`10000` milliseconds.
            Required for callout extensions. This field is not supported for
            plugin extensions. Setting it results in a validation error.
          format: google-duration
          type: string
      type: object
    ExtensionChainMatchCondition:
      description: Conditions under which this chain is invoked for a request.
      id: ExtensionChainMatchCondition
      properties:
        celExpression:
          description: >-
            Required. A Common Expression Language (CEL) expression that is used
            to match requests for which the extension chain is executed. For
            more information, see [CEL matcher language
            reference](https://cloud.google.com/service-extensions/docs/cel-matcher-language-reference).
          type: string
      type: object
    Gateway:
      description: >-
        Gateway represents the configuration for a proxy, typically a load
        balancer. It captures the ip:port over which the services are exposed by
        the proxy, along with any policy configurations. Routes have reference
        to to Gateways to dictate how requests should be routed by this Gateway.
      id: Gateway
      properties:
        addresses:
          description: >-
            Optional. Zero or one IPv4 or IPv6 address on which the Gateway will
            receive the traffic. When no address is provided, an IP from the
            subnetwork is allocated This field only applies to gateways of type
            'SECURE_WEB_GATEWAY'. Gateways of type 'OPEN_MESH' listen on 0.0.0.0
            for IPv4 and :: for IPv6.
          items:
            type: string
          type: array
        allPorts:
          description: >-
            Optional. If true, the Gateway will listen on all ports. This is
            mutually exclusive with the `ports` field. This field only applies
            to gateways of type 'SECURE_WEB_GATEWAY'.
          type: boolean
        allowGlobalAccess:
          description: >-
            Optional. If true, the gateway will allow traffic from clients
            outside of the region where the gateway is located. This field is
            configurable only for gateways of type SECURE_WEB_GATEWAY.
          type: boolean
        certificateUrls:
          description: >-
            Optional. A fully-qualified Certificates URL reference. The proxy
            presents a Certificate (selected based on SNI) when establishing a
            TLS connection. This feature only applies to gateways of type
            'SECURE_WEB_GATEWAY'.
          items:
            type: string
          type: array
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. A free-text description of the resource. Max length 1024
            characters.
          type: string
        envoyHeaders:
          description: >-
            Optional. Determines if envoy will insert internal debug headers
            into upstream requests. Other Envoy headers may still be injected.
            By default, envoy will not insert any debug headers.
          enum:
            - ENVOY_HEADERS_UNSPECIFIED
            - NONE
            - DEBUG_HEADERS
          enumDescriptions:
            - Defaults to NONE.
            - Suppress envoy debug headers.
            - >-
              Envoy will insert default internal debug headers into upstream
              requests: x-envoy-attempt-count, x-envoy-is-timeout-retry,
              x-envoy-expected-rq-timeout-ms, x-envoy-original-path,
              x-envoy-upstream-stream-duration-ms
          type: string
        gatewaySecurityPolicy:
          description: >-
            Optional. A fully-qualified GatewaySecurityPolicy URL reference.
            Defines how a server should apply security policy to inbound (VM to
            Proxy) initiated connections. For example:
            `projects/*/locations/*/gatewaySecurityPolicies/swg-policy`. This
            policy is specific to gateways of type 'SECURE_WEB_GATEWAY'.
          type: string
        ipVersion:
          description: >-
            Optional. The IP Version that will be used by this gateway. Valid
            options are IPV4 or IPV6. Default is IPV4.
          enum:
            - IP_VERSION_UNSPECIFIED
            - IPV4
            - IPV6
          enumDescriptions:
            - The type when IP version is not specified. Defaults to IPV4.
            - The type for IP version 4.
            - The type for IP version 6.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Optional. Set of label tags associated with the Gateway resource.
          type: object
        name:
          description: >-
            Identifier. Name of the Gateway resource. It matches pattern
            `projects/*/locations/*/gateways/`.
          type: string
        network:
          description: >-
            Optional. The relative resource name identifying the VPC network
            that is using this configuration. For example:
            `projects/*/global/networks/network-1`. Currently, this field is
            specific to gateways of type 'SECURE_WEB_GATEWAY'.
          type: string
        ports:
          description: >-
            Required. One or more port numbers (1-65535), on which the Gateway
            will receive traffic. The proxy binds to the specified ports.
            Gateways of type 'SECURE_WEB_GATEWAY' are limited to 5 ports.
            Gateways of type 'OPEN_MESH' listen on 0.0.0.0 for IPv4 and :: for
            IPv6 and support multiple ports.
          items:
            format: int32
            type: integer
          type: array
        routingMode:
          description: >-
            Optional. The routing mode of the Gateway. This field is
            configurable only for gateways of type SECURE_WEB_GATEWAY. This
            field is required for gateways of type SECURE_WEB_GATEWAY.
          enum:
            - EXPLICIT_ROUTING_MODE
            - NEXT_HOP_ROUTING_MODE
          enumDescriptions:
            - >-
              The routing mode is explicit; clients are configured to send
              traffic through the gateway. This is the default routing mode.
            - >-
              The routing mode is next-hop. Clients are unaware of the gateway,
              and a route (advanced route or other route type) can be configured
              to direct traffic from client to gateway. The gateway then acts as
              a next-hop to the destination.
          type: string
        scope:
          description: >-
            Optional. Scope determines how configuration across multiple Gateway
            instances are merged. The configuration for multiple Gateway
            instances with the same scope will be merged as presented as a
            single configuration to the proxy/load balancer. Max length 64
            characters. Scope should start with a letter and can only have
            letters, numbers, hyphens.
          type: string
        selfLink:
          description: Output only. Server-defined URL of this resource
          readOnly: true
          type: string
        serverTlsPolicy:
          description: >-
            Optional. A fully-qualified ServerTLSPolicy URL reference. Specifies
            how TLS traffic is terminated. If empty, TLS termination is
            disabled.
          type: string
        subnetwork:
          description: >-
            Optional. The relative resource name identifying the subnetwork in
            which this SWG is allocated. For example:
            `projects/*/regions/us-central1/subnetworks/network-1` Currently,
            this field is specific to gateways of type 'SECURE_WEB_GATEWAY".
          type: string
        type:
          description: >-
            Immutable. The type of the customer managed gateway. This field is
            required. If unspecified, an error is returned.
          enum:
            - TYPE_UNSPECIFIED
            - OPEN_MESH
            - SECURE_WEB_GATEWAY
          enumDescriptions:
            - The type of the customer managed gateway is unspecified.
            - >-
              The type of the customer managed gateway is TrafficDirector Open
              Mesh.
            - >-
              The type of the customer managed gateway is SecureWebGateway
              (SWG).
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GatewayRouteView:
      description: GatewayRouteView defines view-only resource for Routes to a Gateway
      id: GatewayRouteView
      properties:
        name:
          description: >-
            Output only. Identifier. Full path name of the GatewayRouteView
            resource. Format:
            projects/{project_number}/locations/{location}/gateways/{gateway}/routeViews/{route_view}
          readOnly: true
          type: string
        routeId:
          description: Output only. The resource id for the route.
          readOnly: true
          type: string
        routeLocation:
          description: Output only. Location where the route exists.
          readOnly: true
          type: string
        routeProjectNumber:
          description: Output only. Project number where the route exists.
          format: int64
          readOnly: true
          type: string
        routeType:
          description: >-
            Output only. Type of the route: HttpRoute,GrpcRoute,TcpRoute, or
            TlsRoute
          readOnly: true
          type: string
      type: object
    GrpcRoute:
      description: >-
        GrpcRoute is the resource defining how gRPC traffic routed by a Mesh or
        Gateway resource is routed.
      id: GrpcRoute
      properties:
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. A free-text description of the resource. Max length 1024
            characters.
          type: string
        gateways:
          description: >-
            Optional. Gateways defines a list of gateways this GrpcRoute is
            attached to, as one of the routing rules to route the requests
            served by the gateway. Each gateway reference should match the
            pattern: `projects/*/locations/*/gateways/`
          items:
            type: string
          type: array
        hostnames:
          description: >-
            Required. Service hostnames with an optional port for which this
            route describes traffic. Format: [:] Hostname is the fully qualified
            domain name of a network host. This matches the RFC 1123 definition
            of a hostname with 2 notable exceptions: - IPs are not allowed. - A
            hostname may be prefixed with a wildcard label (`*.`). The wildcard
            label must appear by itself as the first label. Hostname can be
            "precise" which is a domain name without the terminating dot of a
            network host (e.g. `foo.example.com`) or "wildcard", which is a
            domain name prefixed with a single wildcard label (e.g.
            `*.example.com`). Note that as per RFC1035 and RFC1123, a label must
            consist of lower case alphanumeric characters or '-', and must start
            and end with an alphanumeric character. No other punctuation is
            allowed. The routes associated with a Mesh or Gateway must have
            unique hostnames. If you attempt to attach multiple routes with
            conflicting hostnames, the configuration will be rejected. For
            example, while it is acceptable for routes for the hostnames
            `*.foo.bar.com` and `*.bar.com` to be associated with the same
            route, it is not possible to associate two routes both with
            `*.bar.com` or both with `bar.com`. If a port is specified, then
            gRPC clients must use the channel URI with the port to match this
            rule (i.e. "xds:///service:123"), otherwise they must supply the URI
            without a port (i.e. "xds:///service").
          items:
            type: string
          type: array
        labels:
          additionalProperties:
            type: string
          description: Optional. Set of label tags associated with the GrpcRoute resource.
          type: object
        meshes:
          description: >-
            Optional. Meshes defines a list of meshes this GrpcRoute is attached
            to, as one of the routing rules to route the requests served by the
            mesh. Each mesh reference should match the pattern:
            `projects/*/locations/*/meshes/`
          items:
            type: string
          type: array
        name:
          description: >-
            Identifier. Name of the GrpcRoute resource. It matches pattern
            `projects/*/locations/*/grpcRoutes/`
          type: string
        rules:
          description: >-
            Required. A list of detailed rules defining how to route traffic.
            Within a single GrpcRoute, the GrpcRoute.RouteAction associated with
            the first matching GrpcRoute.RouteRule will be executed. At least
            one rule must be supplied.
          items:
            $ref: '#/components/schemas/GrpcRouteRouteRule'
          type: array
        selfLink:
          description: Output only. Server-defined URL of this resource
          readOnly: true
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    GrpcRouteDestination:
      description: The destination to which traffic will be routed.
      id: GrpcRouteDestination
      properties:
        serviceName:
          description: >-
            Required. The URL of a destination service to which to route
            traffic. Must refer to either a BackendService or
            ServiceDirectoryService.
          type: string
        weight:
          description: >-
            Optional. Specifies the proportion of requests forwarded to the
            backend referenced by the serviceName field. This is computed as: -
            weight/Sum(weights in this destination list). For non-zero values,
            there may be some epsilon from the exact proportion defined here
            depending on the precision an implementation supports. If only one
            serviceName is specified and it has a weight greater than 0, 100% of
            the traffic is forwarded to that backend. If weights are specified
            for any one service name, they need to be specified for all of them.
            If weights are unspecified for all services, then, traffic is
            distributed in equal proportions to all of them.
          format: int32
          type: integer
      type: object
    GrpcRouteFaultInjectionPolicy:
      description: >-
        The specification for fault injection introduced into traffic to test
        the resiliency of clients to destination service failure. As part of
        fault injection, when clients send requests to a destination, delays can
        be introduced on a percentage of requests before sending those requests
        to the destination service. Similarly requests from clients can be
        aborted by for a percentage of requests.
      id: GrpcRouteFaultInjectionPolicy
      properties:
        abort:
          $ref: '#/components/schemas/GrpcRouteFaultInjectionPolicyAbort'
          description: The specification for aborting to client requests.
        delay:
          $ref: '#/components/schemas/GrpcRouteFaultInjectionPolicyDelay'
          description: The specification for injecting delay to client requests.
      type: object
    GrpcRouteFaultInjectionPolicyAbort:
      description: >-
        Specification of how client requests are aborted as part of fault
        injection before being sent to a destination.
      id: GrpcRouteFaultInjectionPolicyAbort
      properties:
        httpStatus:
          description: >-
            The HTTP status code used to abort the request. The value must be
            between 200 and 599 inclusive.
          format: int32
          type: integer
        percentage:
          description: >-
            The percentage of traffic which will be aborted. The value must be
            between [0, 100]
          format: int32
          type: integer
      type: object
    GrpcRouteFaultInjectionPolicyDelay:
      description: >-
        Specification of how client requests are delayed as part of fault
        injection before being sent to a destination.
      id: GrpcRouteFaultInjectionPolicyDelay
      properties:
        fixedDelay:
          description: Specify a fixed delay before forwarding the request.
          format: google-duration
          type: string
        percentage:
          description: >-
            The percentage of traffic on which delay will be injected. The value
            must be between [0, 100]
          format: int32
          type: integer
      type: object
    GrpcRouteHeaderMatch:
      description: A match against a collection of headers.
      id: GrpcRouteHeaderMatch
      properties:
        key:
          description: Required. The key of the header.
          type: string
        type:
          description: >-
            Optional. Specifies how to match against the value of the header. If
            not specified, a default value of EXACT is used.
          enum:
            - TYPE_UNSPECIFIED
            - EXACT
            - REGULAR_EXPRESSION
          enumDescriptions:
            - Unspecified.
            - Will only match the exact value provided.
            - >-
              Will match paths conforming to the prefix specified by value. RE2
              syntax is supported.
          type: string
        value:
          description: Required. The value of the header.
          type: string
      type: object
    GrpcRouteMethodMatch:
      description: Specifies a match against a method.
      id: GrpcRouteMethodMatch
      properties:
        caseSensitive:
          description: >-
            Optional. Specifies that matches are case sensitive. The default
            value is true. case_sensitive must not be used with a type of
            REGULAR_EXPRESSION.
          type: boolean
        grpcMethod:
          description: >-
            Required. Name of the method to match against. If unspecified, will
            match all methods.
          type: string
        grpcService:
          description: >-
            Required. Name of the service to match against. If unspecified, will
            match all services.
          type: string
        type:
          description: >-
            Optional. Specifies how to match against the name. If not specified,
            a default value of "EXACT" is used.
          enum:
            - TYPE_UNSPECIFIED
            - EXACT
            - REGULAR_EXPRESSION
          enumDescriptions:
            - Unspecified.
            - Will only match the exact name provided.
            - >-
              Will interpret grpc_method and grpc_service as regexes. RE2 syntax
              is supported.
          type: string
      type: object
    GrpcRouteRetryPolicy:
      description: >-
        The specifications for retries. Specifies one or more conditions for
        which this retry rule applies. Valid values are:
      id: GrpcRouteRetryPolicy
      properties:
        numRetries:
          description: >-
            Specifies the allowed number of retries. This number must be > 0. If
            not specified, default to 1.
          format: uint32
          type: integer
        retryConditions:
          description: >-
            - connect-failure: Router will retry on failures connecting to
            Backend Services, for example due to connection timeouts. -
            refused-stream: Router will retry if the backend service resets the
            stream with a REFUSED_STREAM error code. This reset type indicates
            that it is safe to retry. - cancelled: Router will retry if the gRPC
            status code in the response header is set to cancelled -
            deadline-exceeded: Router will retry if the gRPC status code in the
            response header is set to deadline-exceeded - resource-exhausted:
            Router will retry if the gRPC status code in the response header is
            set to resource-exhausted - unavailable: Router will retry if the
            gRPC status code in the response header is set to unavailable
          items:
            type: string
          type: array
      type: object
    GrpcRouteRouteAction:
      description: Specifies how to route matched traffic.
      id: GrpcRouteRouteAction
      properties:
        destinations:
          description: >-
            Optional. The destination services to which traffic should be
            forwarded. If multiple destinations are specified, traffic will be
            split between Backend Service(s) according to the weight field of
            these destinations.
          items:
            $ref: '#/components/schemas/GrpcRouteDestination'
          type: array
        faultInjectionPolicy:
          $ref: '#/components/schemas/GrpcRouteFaultInjectionPolicy'
          description: >-
            Optional. The specification for fault injection introduced into
            traffic to test the resiliency of clients to destination service
            failure. As part of fault injection, when clients send requests to a
            destination, delays can be introduced on a percentage of requests
            before sending those requests to the destination service. Similarly
            requests from clients can be aborted by for a percentage of
            requests. timeout and retry_policy will be ignored by clients that
            are configured with a fault_injection_policy
        idleTimeout:
          description: >-
            Optional. Specifies the idle timeout for the selected route. The
            idle timeout is defined as the period in which there are no bytes
            sent or received on either the upstream or downstream connection. If
            not set, the default idle timeout is 1 hour. If set to 0s, the
            timeout will be disabled.
          format: google-duration
          type: string
        retryPolicy:
          $ref: '#/components/schemas/GrpcRouteRetryPolicy'
          description: Optional. Specifies the retry policy associated with this route.
        statefulSessionAffinity:
          $ref: '#/components/schemas/GrpcRouteStatefulSessionAffinityPolicy'
          description: Optional. Specifies cookie-based stateful session affinity.
        timeout:
          description: >-
            Optional. Specifies the timeout for selected route. Timeout is
            computed from the time the request has been fully processed (i.e.
            end of stream) up until the response has been completely processed.
            Timeout includes all retries.
          format: google-duration
          type: string
      type: object
    GrpcRouteRouteMatch:
      description: >-
        Criteria for matching traffic. A RouteMatch will be considered to match
        when all supplied fields match.
      id: GrpcRouteRouteMatch
      properties:
        headers:
          description: Optional. Specifies a collection of headers to match.
          items:
            $ref: '#/components/schemas/GrpcRouteHeaderMatch'
          type: array
        method:
          $ref: '#/components/schemas/GrpcRouteMethodMatch'
          description: >-
            Optional. A gRPC method to match against. If this field is empty or
            omitted, will match all methods.
      type: object
    GrpcRouteRouteRule:
      description: Describes how to route traffic.
      id: GrpcRouteRouteRule
      properties:
        action:
          $ref: '#/components/schemas/GrpcRouteRouteAction'
          description: >-
            Required. A detailed rule defining how to route traffic. This field
            is required.
        matches:
          description: >-
            Optional. Matches define conditions used for matching the rule
            against incoming gRPC requests. Each match is independent, i.e. this
            rule will be matched if ANY one of the matches is satisfied. If no
            matches field is specified, this rule will unconditionally match
            traffic.
          items:
            $ref: '#/components/schemas/GrpcRouteRouteMatch'
          type: array
      type: object
    GrpcRouteStatefulSessionAffinityPolicy:
      description: >-
        The specification for cookie-based stateful session affinity where the
        date plane supplies a “session cookie” with the name "GSSA" which
        encodes a specific destination host and each request containing that
        cookie will be directed to that host as long as the destination host
        remains up and healthy. The gRPC proxyless mesh library or sidecar proxy
        will manage the session cookie but the client application code is
        responsible for copying the cookie from each RPC in the session to the
        next.
      id: GrpcRouteStatefulSessionAffinityPolicy
      properties:
        cookieTtl:
          description: >-
            Required. The cookie TTL value for the Set-Cookie header generated
            by the data plane. The lifetime of the cookie may be set to a value
            from 0 to 86400 seconds (24 hours) inclusive. Set this to 0s to use
            a session cookie and disable cookie expiration.
          format: google-duration
          type: string
      type: object
    HttpRoute:
      description: >-
        HttpRoute is the resource defining how HTTP traffic should be routed by
        a Mesh or Gateway resource.
      id: HttpRoute
      properties:
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: >-
            Optional. A free-text description of the resource. Max length 1024
            characters.
          type: string
        gateways:
          description: >-
            Optional. Gateways defines a list of gateways this HttpRoute is
            attached to, as one of the routing rules to route the requests
            served by the gateway. Each gateway reference should match the
            pattern: `projects/*/locations/*/gateways/`
          items:
            type: string
          type: array
        hostnames:
          description: >-
            Required. Hostnames define a set of hosts that should match against
            the HTTP host header to select a HttpRoute to process the request.
            Hostname is the fully qualified domain name of a network host, as
            defined by RFC 1123 with the exception that: - IPs are not allowed.
            - A hostname may be prefixed with a wildcard label (`*.`). The
            wildcard label must appear by itself as the first label. Hostname
            can be "precise" which is a domain name without the terminating dot
            of a network host (e.g. `foo.example.com`) or "wildcard", which is a
            domain name prefixed with a single wildcard label (e.g.
            `*.example.com`). Note that as per RFC1035 and RFC1123, a label must
            consist of lower case alphanumeric characters or '-', and must start
            and end with an alphanumeric character. No other punctuation is
            allowed. The routes associated with a Mesh or Gateways must have
            unique hostnames. If you attempt to attach multiple routes with
            conflicting hostnames, the configuration will be rejected. For
            example, while it is acceptable for routes for the hostnames
            `*.foo.bar.com` and `*.bar.com` to be associated with the same Mesh
            (or Gateways under the same scope), it is not possible to associate
            two routes both with `*.bar.com` or both with `bar.com`.
          items:
            type: string
          type: array
        labels:
          additionalProperties:
            type: string
          description: Optional. Set of label tags associated with the HttpRoute resource.
          type: object
        meshes:
          description: >-
            Optional. Meshes defines a list of meshes this HttpRoute is attached
            to, as one of the routing rules to route the requests served by the
            mesh. Each mesh reference should match the pattern:
            `projects/*/locations/*/meshes/` The attached Mesh should be of a
            type SIDECAR
          items:
            type: string
          type: array
        name:
          description: >-
            Identifier. Name of the HttpRoute resource. It matches pattern
            `projects/*/locations/*/httpRoutes/http_route_name>`.
          type: string
        rules:
          description: >-
            Required. Rules that define how traffic is routed and handled. Rules
            will be matched sequentially based on the RouteMatch specified for
            the rule.
          items:
            $ref: '#/components/schemas/HttpRouteRouteRule'
          type: array
        selfLink:
          description: Output only. Server-defined URL of this resource
          readOnly: true
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    HttpRouteCorsPolicy:
      description: The Specification for allowing client side cross-origin requests.
      id: HttpRouteCorsPolicy
      properties:
        allowCredentials:
          description: >-
            In response to a preflight request, setting this to true indicates
            that the actual request can include user credentials. This
            translates to the Access-Control-Allow-Credentials header. Default
            value is false.
          type: boolean
        allowHeaders:
          description: Specifies the content for Access-Control-Allow-Headers header.
          items:
            type: string
          type: array
        allowMethods:
          description: Specifies the content for Access-Control-Allow-Methods header.
          items:
            type: string
          type: array
        allowOriginRegexes:
          description: >-
            Specifies the regular expression patterns that match allowed
            origins. For regular expression grammar, please see
            https://github.com/google/re2/wiki/Syntax.
          items:
            type: string
          type: array
        allowOrigins:
          description: >-
            Specifies the list of origins that will be allowed to do CORS
            requests. An origin is allowed if it matches either an item in
            allow_origins or an item in allow_origin_regexes.
          items:
            type: string
          type: array
        disabled:
          description: >-
            If true, the CORS policy is disabled. The default value is false,
            which indicates that the CORS policy is in effect.
          type: boolean
        exposeHeaders:
          description: Specifies the content for Access-Control-Expose-Headers header.
          items:
            type: string
          type: array
        maxAge:
          description: >-
            Specifies how long result of a preflight request can be cached in
            seconds. This translates to the Access-Control-Max-Age header.
          type: string
      type: object
    HttpRouteDestination:
      description: >-
        Specifications of a destination to which the request should be routed
        to.
      id: HttpRouteDestination
      properties:
        requestHeaderModifier:
          $ref: '#/components/schemas/HttpRouteHeaderModifier'
          description: >-
            Optional. The specification for modifying the headers of a matching
            request prior to delivery of the request to the destination. If
            HeaderModifiers are set on both the Destination and the RouteAction,
            they will be merged. Conflicts between the two will not be resolved
            on the configuration.
        responseHeaderModifier:
          $ref: '#/components/schemas/HttpRouteHeaderModifier'
          description: >-
            Optional. The specification for modifying the headers of a response
            prior to sending the response back to the client. If HeaderModifiers
            are set on both the Destination and the RouteAction, they will be
            merged. Conflicts between the two will not be resolved on the
            configuration.
        serviceName:
          description: The URL of a BackendService to route traffic to.
          type: string
        weight:
          description: >-
            Specifies the proportion of requests forwarded to the backend
            referenced by the serviceName field. This is computed as: -
            weight/Sum(weights in this destination list). For non-zero values,
            there may be some epsilon from the exact proportion defined here
            depending on the precision an implementation supports. If only one
            serviceName is specified and it has a weight greater than 0, 100% of
            the traffic is forwarded to that backend. If weights are specified
            for any one service name, they need to be specified for all of them.
            If weights are unspecified for all services, then, traffic is
            distributed in equal proportions to all of them.
          format: int32
          type: integer
      type: object
    HttpRouteFaultInjectionPolicy:
      description: >-
        The specification for fault injection introduced into traffic to test
        the resiliency of clients to destination service failure. As part of
        fault injection, when clients send requests to a destination, delays can
        be introduced by client proxy on a percentage of requests before sending
        those requests to the destination service. Similarly requests can be
        aborted by client proxy for a percentage of requests.
      id: HttpRouteFaultInjectionPolicy
      properties:
        abort:
          $ref: '#/components/schemas/HttpRouteFaultInjectionPolicyAbort'
          description: The specification for aborting to client requests.
        delay:
          $ref: '#/components/schemas/HttpRouteFaultInjectionPolicyDelay'
          description: The specification for injecting delay to client requests.
      type: object
    HttpRouteFaultInjectionPolicyAbort:
      description: >-
        Specification of how client requests are aborted as part of fault
        injection before being sent to a destination.
      id: HttpRouteFaultInjectionPolicyAbort
      properties:
        httpStatus:
          description: >-
            The HTTP status code used to abort the request. The value must be
            between 200 and 599 inclusive.
          format: int32
          type: integer
        percentage:
          description: >-
            The percentage of traffic which will be aborted. The value must be
            between [0, 100]
          format: int32
          type: integer
      type: object
    HttpRouteFaultInjectionPolicyDelay:
      description: >-
        Specification of how client requests are delayed as part of fault
        injection before being sent to a destination.
      id: HttpRouteFaultInjectionPolicyDelay
      properties:
        fixedDelay:
          description: Specify a fixed delay before forwarding the request.
          format: google-duration
          type: string
        percentage:
          description: >-
            The percentage of traffic on which delay will be injected. The value
            must be between [0, 100]
          format: int32
          type: integer
      type: object
    HttpRouteHeaderMatch:
      description: Specifies how to select a route rule based on HTTP request headers.
      id: HttpRouteHeaderMatch
      properties:
        exactMatch:
          description: >-
            The value of the header should match exactly the content of
            exact_match.
          type: string
        header:
          description: The name of the HTTP header to match against.
          type: string
        invertMatch:
          description: >-
            If specified, the match result will be inverted before checking.
            Default value is set to false.
          type: boolean
        prefixMatch:
          description: >-
            The value of the header must start with the contents of
            prefix_match.
          type: string
        presentMatch:
          description: >-
            A header with header_name must exist. The match takes place whether
            or not the header has a value.
          type: boolean
        rangeMatch:
          $ref: '#/components/schemas/HttpRouteHeaderMatchIntegerRange'
          description: >-
            If specified, the rule will match if the request header value is
            within the range.
        regexMatch:
          description: >-
            The value of the header must match the regular expression specified
            in regex_match. For regular expression grammar, please see:
            https://github.com/google/re2/wiki/Syntax
          type: string
        suffixMatch:
          description: The value of the header must end with the contents of suffix_match.
          type: string
      type: object
    HttpRouteHeaderMatchIntegerRange:
      description: Represents an integer value range.
      id: HttpRouteHeaderMatchIntegerRange
      properties:
        end:
          description: End of the range (exclusive)
          format: int32
          type: integer
        start:
          description: Start of the range (inclusive)
          format: int32
          type: integer
      type: object
    HttpRouteHeaderModifier:
      description: >-
        The specification for modifying HTTP header in HTTP request and HTTP
        response.
      id: HttpRouteHeaderModifier
      properties:
        add:
          additionalProperties:
            type: string
          description: >-
            Add the headers with given map where key is the name of the header,
            value is the value of the header.
          type: object
        remove:
          description: Remove headers (matching by header names) specified in the list.
          items:
            type: string
          type: array
        set:
          additionalProperties:
            type: string
          description: >-
            Completely overwrite/replace the headers with given map where key is
            the name of the header, value is the value of the header.
          type: object
      type: object
    HttpRouteHttpDirectResponse:
      description: Static HTTP response object to be returned.
      id: HttpRouteHttpDirectResponse
      properties:
        bytesBody:
          description: Optional. Response body as bytes. Maximum body size is 4096B.
          format: byte
          type: string
        status:
          description: >-
            Required. Status to return as part of HTTP Response. Must be a
            positive integer.
          format: int32
          type: integer
        stringBody:
          description: >-
            Optional. Response body as a string. Maximum body length is 1024
            characters.
          type: string
      type: object
    HttpRouteQueryParameterMatch:
      description: Specifications to match a query parameter in the request.
      id: HttpRouteQueryParameterMatch
      properties:
        exactMatch:
          description: >-
            The value of the query parameter must exactly match the contents of
            exact_match. Only one of exact_match, regex_match, or present_match
            must be set.
          type: string
        presentMatch:
          description: >-
            Specifies that the QueryParameterMatcher matches if request contains
            query parameter, irrespective of whether the parameter has a value
            or not. Only one of exact_match, regex_match, or present_match must
            be set.
          type: boolean
        queryParameter:
          description: The name of the query parameter to match.
          type: string
        regexMatch:
          description: >-
            The value of the query parameter must match the regular expression
            specified by regex_match. For regular expression grammar, please see
            https://github.com/google/re2/wiki/Syntax Only one of exact_match,
            regex_match, or present_match must be set.
          type: string
      type: object
    HttpRouteRedirect:
      description: The specification for redirecting traffic.
      id: HttpRouteRedirect
      properties:
        hostRedirect:
          description: >-
            The host that will be used in the redirect response instead of the
            one that was supplied in the request.
          type: string
        httpsRedirect:
          description: >-
            If set to true, the URL scheme in the redirected request is set to
            https. If set to false, the URL scheme of the redirected request
            will remain the same as that of the request. The default is set to
            false.
          type: boolean
        pathRedirect:
          description: >-
            The path that will be used in the redirect response instead of the
            one that was supplied in the request. path_redirect can not be
            supplied together with prefix_redirect. Supply one alone or neither.
            If neither is supplied, the path of the original request will be
            used for the redirect.
          type: string
        portRedirect:
          description: >-
            The port that will be used in the redirected request instead of the
            one that was supplied in the request.
          format: int32
          type: integer
        prefixRewrite:
          description: >-
            Indicates that during redirection, the matched prefix (or path)
            should be swapped with this value. This option allows URLs be
            dynamically created based on the request.
          type: string
        responseCode:
          description: The HTTP Status code to use for the redirect.
          enum:
            - RESPONSE_CODE_UNSPECIFIED
            - MOVED_PERMANENTLY_DEFAULT
            - FOUND
            - SEE_OTHER
            - TEMPORARY_REDIRECT
            - PERMANENT_REDIRECT
          enumDescriptions:
            - Default value
            - Corresponds to 301.
            - Corresponds to 302.
            - Corresponds to 303.
            - >-
              Corresponds to 307. In this case, the request method will be
              retained.
            - >-
              Corresponds to 308. In this case, the request method will be
              retained.
          type: string
        stripQuery:
          description: >-
            if set to true, any accompanying query portion of the original URL
            is removed prior to redirecting the request. If set to false, the
            query portion of the original URL is retained. The default is set to
            false.
          type: boolean
      type: object
    HttpRouteRequestMirrorPolicy:
      description: >-
        Specifies the policy on how requests are shadowed to a separate mirrored
        destination service. The proxy does not wait for responses from the
        shadow service. Prior to sending traffic to the shadow service, the
        host/authority header is suffixed with -shadow. Mirroring is currently
        not supported for Cloud Run destinations.
      id: HttpRouteRequestMirrorPolicy
      properties:
        destination:
          $ref: '#/components/schemas/HttpRouteDestination'
          description: >-
            The destination the requests will be mirrored to. The weight of the
            destination will be ignored.
        mirrorPercent:
          description: >-
            Optional. The percentage of requests to get mirrored to the desired
            destination.
          format: float
          type: number
      type: object
    HttpRouteRetryPolicy:
      description: The specifications for retries.
      id: HttpRouteRetryPolicy
      properties:
        numRetries:
          description: >-
            Specifies the allowed number of retries. This number must be > 0. If
            not specified, default to 1.
          format: int32
          type: integer
        perTryTimeout:
          description: Specifies a non-zero timeout per retry attempt.
          format: google-duration
          type: string
        retryConditions:
          description: >-
            Specifies one or more conditions when this retry policy applies.
            Valid values are: 5xx: Proxy will attempt a retry if the destination
            service responds with any 5xx response code, of if the destination
            service does not respond at all, example: disconnect, reset, read
            timeout, connection failure and refused streams. gateway-error:
            Similar to 5xx, but only applies to response codes 502, 503, 504.
            reset: Proxy will attempt a retry if the destination service does
            not respond at all (disconnect/reset/read timeout) connect-failure:
            Proxy will retry on failures connecting to destination for example
            due to connection timeouts. retriable-4xx: Proxy will retry fro
            retriable 4xx response codes. Currently the only retriable error
            supported is 409. refused-stream: Proxy will retry if the
            destination resets the stream with a REFUSED_STREAM error code. This
            reset type indicates that it is safe to retry.
          items:
            type: string
          type: array
      type: object
    HttpRouteRouteAction:
      description: The specifications for routing traffic and applying associated policies.
      id: HttpRouteRouteAction
      properties:
        corsPolicy:
          $ref: '#/components/schemas/HttpRouteCorsPolicy'
          description: The specification for allowing client side cross-origin requests.
        destinations:
          description: The destination to which traffic should be forwarded.
          items:
            $ref: '#/components/schemas/HttpRouteDestination'
          type: array
        directResponse:
          $ref: '#/components/schemas/HttpRouteHttpDirectResponse'
          description: >-
            Optional. Static HTTP Response object to be returned regardless of
            the request.
        faultInjectionPolicy:
          $ref: '#/components/schemas/HttpRouteFaultInjectionPolicy'
          description: >-
            The specification for fault injection introduced into traffic to
            test the resiliency of clients to backend service failure. As part
            of fault injection, when clients send requests to a backend service,
            delays can be introduced on a percentage of requests before sending
            those requests to the backend service. Similarly requests from
            clients can be aborted for a percentage of requests. timeout and
            retry_policy will be ignored by clients that are configured with a
            fault_injection_policy
        idleTimeout:
          description: >-
            Optional. Specifies the idle timeout for the selected route. The
            idle timeout is defined as the period in which there are no bytes
            sent or received on either the upstream or downstream connection. If
            not set, the default idle timeout is 1 hour. If set to 0s, the
            timeout will be disabled.
          format: google-duration
          type: string
        redirect:
          $ref: '#/components/schemas/HttpRouteRedirect'
          description: If set, the request is directed as configured by this field.
        requestHeaderModifier:
          $ref: '#/components/schemas/HttpRouteHeaderModifier'
          description: >-
            The specification for modifying the headers of a matching request
            prior to delivery of the request to the destination. If
            HeaderModifiers are set on both the Destination and the RouteAction,
            they will be merged. Conflicts between the two will not be resolved
            on the configuration.
        requestMirrorPolicy:
          $ref: '#/components/schemas/HttpRouteRequestMirrorPolicy'
          description: >-
            Specifies the policy on how requests intended for the routes
            destination are shadowed to a separate mirrored destination. Proxy
            will not wait for the shadow destination to respond before returning
            the response. Prior to sending traffic to the shadow service, the
            host/authority header is suffixed with -shadow.
        responseHeaderModifier:
          $ref: '#/components/schemas/HttpRouteHeaderModifier'
          description: >-
            The specification for modifying the headers of a response prior to
            sending the response back to the client. If HeaderModifiers are set
            on both the Destination and the RouteAction, they will be merged.
            Conflicts between the two will not be resolved on the configuration.
        retryPolicy:
          $ref: '#/components/schemas/HttpRouteRetryPolicy'
          description: Specifies the retry policy associated with this route.
        statefulSessionAffinity:
          $ref: '#/components/schemas/HttpRouteStatefulSessionAffinityPolicy'
          description: Optional. Specifies cookie-based stateful session affinity.
        timeout:
          description: >-
            Specifies the timeout for selected route. Timeout is computed from
            the time the request has been fully processed (i.e. end of stream)
            up until the response has been completely processed. Timeout
            includes all retries.
          format: google-duration
          type: string
        urlRewrite:
          $ref: '#/components/schemas/HttpRouteURLRewrite'
          description: >-
            The specification for rewrite URL before forwarding requests to the
            destination.
      type: object
    HttpRouteRouteMatch:
      description: >-
        RouteMatch defines specifications used to match requests. If multiple
        match types are set, this RouteMatch will match if ALL type of matches
        are matched.
      id: HttpRouteRouteMatch
      properties:
        fullPathMatch:
          description: >-
            The HTTP request path value should exactly match this value. Only
            one of full_path_match, prefix_match, or regex_match should be used.
          type: string
        headers:
          description: >-
            Specifies a list of HTTP request headers to match against. ALL of
            the supplied headers must be matched.
          items:
            $ref: '#/components/schemas/HttpRouteHeaderMatch'
          type: array
        ignoreCase:
          description: >-
            Specifies if prefix_match and full_path_match matches are case
            sensitive. The default value is false.
          type: boolean
        prefixMatch:
          description: >-
            The HTTP request path value must begin with specified prefix_match.
            prefix_match must begin with a /. Only one of full_path_match,
            prefix_match, or regex_match should be used.
          type: string
        queryParameters:
          description: >-
            Specifies a list of query parameters to match against. ALL of the
            query parameters must be matched.
          items:
            $ref: '#/components/schemas/HttpRouteQueryParameterMatch'
          type: array
        regexMatch:
          description: >-
            The HTTP request path value must satisfy the regular expression
            specified by regex_match after removing any query parameters and
            anchor supplied with the original URL. For regular expression
            grammar, please see https://github.com/google/re2/wiki/Syntax Only
            one of full_path_match, prefix_match, or regex_match should be used.
          type: string
      type: object
    HttpRouteRouteRule:
      description: >-
        Specifies how to match traffic and how to route traffic when traffic is
        matched.
      id: HttpRouteRouteRule
      properties:
        action:
          $ref: '#/components/schemas/HttpRouteRouteAction'
          description: The detailed rule defining how to route matched traffic.
        matches:
          description: >-
            A list of matches define conditions used for matching the rule
            against incoming HTTP requests. Each match is independent, i.e. this
            rule will be matched if ANY one of the matches is satisfied. If no
            matches field is specified, this rule will unconditionally match
            traffic. If a default rule is desired to be configured, add a rule
            with no matches specified to the end of the rules list.
          items:
            $ref: '#/components/schemas/HttpRouteRouteMatch'
          type: array
      type: object
    HttpRouteStatefulSessionAffinityPolicy:
      description: >-
        The specification for cookie-based stateful session affinity where the
        date plane supplies a “session cookie” with the name "GSSA" which
        encodes a specific destination host and each request containing that
        cookie will be directed to that host as long as the destination host
        remains up and healthy. The gRPC proxyless mesh library or sidecar proxy
        will manage the session cookie but the client application code is
        responsible for copying the cookie from each RPC in the session to the
        next.
      id: HttpRouteStatefulSessionAffinityPolicy
      properties:
        cookieTtl:
          description: >-
            Required. The cookie TTL value for the Set-Cookie header generated
            by the data plane. The lifetime of the cookie may be set to a value
            from 0 to 86400 seconds (24 hours) inclusive. Set this to 0s to use
            a session cookie and disable cookie expiration.
          format: google-duration
          type: string
      type: object
    HttpRouteURLRewrite:
      description: >-
        The specification for modifying the URL of the request, prior to
        forwarding the request to the destination.
      id: HttpRouteURLRewrite
      properties:
        hostRewrite:
          description: >-
            Prior to forwarding the request to the selected destination, the
            requests host header is replaced by this value.
          type: string
        pathPrefixRewrite:
          description: >-
            Prior to forwarding the request to the selected destination, the
            matching portion of the requests path is replaced by this value.
          type: string
      type: object
    LbEdgeExtension:
      description: >-
        `LbEdgeExtension` is a resource that lets the extension service
        influence the selection of backend services and Cloud CDN cache keys by
        modifying request headers.
      id: LbEdgeExtension
      properties:
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. A human-readable description of the resource.
          type: string
        extensionChains:
          description: >-
            Required. A set of ordered extension chains that contain the match
            conditions and extensions to execute. Match conditions for each
            extension chain are evaluated in sequence for a given request. The
            first extension chain that has a condition that matches the request
            is executed. Any subsequent extension chains do not execute. Limited
            to 5 extension chains per resource.
          items:
            $ref: '#/components/schemas/ExtensionChain'
          type: array
        forwardingRules:
          description: >-
            Required. A list of references to the forwarding rules to which this
            service extension is attached. At least one forwarding rule is
            required. Only one `LbEdgeExtension` resource can be associated with
            a forwarding rule.
          items:
            type: string
          type: array
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of labels associated with the `LbEdgeExtension`
            resource. The format must comply with [the requirements for
            labels](https://cloud.google.com/compute/docs/labeling-resources#requirements)
            for Google Cloud resources.
          type: object
        loadBalancingScheme:
          description: >-
            Required. All forwarding rules referenced by this extension must
            share the same load balancing scheme. Supported values:
            `EXTERNAL_MANAGED`.
          enum:
            - LOAD_BALANCING_SCHEME_UNSPECIFIED
            - INTERNAL_MANAGED
            - EXTERNAL_MANAGED
          enumDescriptions:
            - Default value. Do not use.
            - Signifies that this is used for Internal HTTP(S) Load Balancing.
            - >-
              Signifies that this is used for External Managed HTTP(S) Load
              Balancing.
          type: string
        name:
          description: >-
            Required. Identifier. Name of the `LbEdgeExtension` resource in the
            following format:
            `projects/{project}/locations/{location}/lbEdgeExtensions/{lb_edge_extension}`.
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    LbRouteExtension:
      description: >-
        `LbRouteExtension` is a resource that lets you control where traffic is
        routed to for a given request.
      id: LbRouteExtension
      properties:
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. A human-readable description of the resource.
          type: string
        extensionChains:
          description: >-
            Required. A set of ordered extension chains that contain the match
            conditions and extensions to execute. Match conditions for each
            extension chain are evaluated in sequence for a given request. The
            first extension chain that has a condition that matches the request
            is executed. Any subsequent extension chains do not execute. Limited
            to 5 extension chains per resource.
          items:
            $ref: '#/components/schemas/ExtensionChain'
          type: array
        forwardingRules:
          description: >-
            Required. A list of references to the forwarding rules to which this
            service extension is attached. At least one forwarding rule is
            required. Only one `LbRouteExtension` resource can be associated
            with a forwarding rule.
          items:
            type: string
          type: array
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of labels associated with the `LbRouteExtension`
            resource. The format must comply with [the requirements for
            labels](https://cloud.google.com/compute/docs/labeling-resources#requirements)
            for Google Cloud resources.
          type: object
        loadBalancingScheme:
          description: >-
            Required. All backend services and forwarding rules referenced by
            this extension must share the same load balancing scheme. Supported
            values: `INTERNAL_MANAGED`, `EXTERNAL_MANAGED`. For more
            information, refer to [Backend services
            overview](https://cloud.google.com/load-balancing/docs/backend-service).
          enum:
            - LOAD_BALANCING_SCHEME_UNSPECIFIED
            - INTERNAL_MANAGED
            - EXTERNAL_MANAGED
          enumDescriptions:
            - Default value. Do not use.
            - Signifies that this is used for Internal HTTP(S) Load Balancing.
            - >-
              Signifies that this is used for External Managed HTTP(S) Load
              Balancing.
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Optional. The metadata provided here is included as part of the
            `metadata_context` (of type `google.protobuf.Struct`) in the
            `ProcessingRequest` message sent to the extension server. The
            metadata applies to all extensions in all extensions chains in this
            resource. The metadata is available under the key
            `com.google.lb_route_extension.`. The following variables are
            supported in the metadata: `{forwarding_rule_id}` - substituted with
            the forwarding rule's fully qualified resource name. This field must
            not be set if at least one of the extension chains contains plugin
            extensions. Setting it results in a validation error. You can set
            metadata at either the resource level or the extension level. The
            extension level metadata is recommended because you can pass a
            different set of metadata through each extension to the backend.
          type: object
        name:
          description: >-
            Required. Identifier. Name of the `LbRouteExtension` resource in the
            following format:
            `projects/{project}/locations/{location}/lbRouteExtensions/{lb_route_extension}`.
          type: string
        updateTime:
          description: Output only. The timestamp when the resource was updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    LbTrafficExtension:
      description: >-
        `LbTrafficExtension` is a resource that lets the extension service
        modify the headers and payloads of both requests and responses without
        impacting the choice of backend services or any other security policies
        associated with the backend service.
      id: LbTrafficExtension
      properties:
        createTime:
          description: Output only. The timestamp when the resource was created.
          format: google-datetime
          readOnly: true
          type: string
        description:
          description: Optional. A human-readable description of the resource.
          type: string
        extensionChains:
          description: >-
            Required. A set of ordered extension chains that contain the match
            conditions and extensions to execute. Match conditions for each
            extension chain are evaluated in sequence for a given request. The
            first extension chain that has a condition that matches the request
            is executed. Any subsequent extension chains do not execute. Limited
            to 5 extension chains per resource.
          items:
            $ref: '#/components/schemas/ExtensionChain'
          type: array
        forwardingRules:
          description: >-
            Optional. A list of references to the forwarding rules to which this
            service extension is attached. At least one forwarding rule is
            required. Only one `LbTrafficExtension` resource can be associated
            with a forwarding rule.
          items:
            type: string
          type: array
        labels:
          additionalProperties:
            type: string
          description: >-
            Optional. Set of labels associated with the `LbTrafficExtension`
            resource. The format must comply with [the requirements for
            labels](https://cloud.google.com/compute/docs/labeling-resources#requirements)
            for Google Cloud resources.
          type: object
        loadBalancingScheme:
          description: >-
            Required. All backend services and forwarding rules referenced by
            this extension must share the same load balancing scheme. Supported
            values: `INTERNAL_MANAGED` and `EXTERNAL_MANAGED`. For more
            information, refer to [Backend services
            overview](https://cloud.google.com/load-balancing/docs/backend-service).
          enum:
            - LOAD_BALANCING_SCHEME_UNSPECIFIED
            - INTERNAL_MANAGED
            - EXTERNAL_MANAGED
          enumDescriptions:
            - Default value. Do not use.
            - Signifies that this is used for Internal HTTP(S) Load Balancing.
            - >-
              Signifies that this is used for External Managed HTTP(S) Load
              Balancing.
          type: string
        metadata:
          additionalProperties:
            description: Properties of the object.
            type: any
          description: >-
            Optional. The metadata provided here is included as part of the
            `metadata_context` (of type `google.protobuf.Struct`) in the
            `ProcessingRequest` message sent to the extension server. The
