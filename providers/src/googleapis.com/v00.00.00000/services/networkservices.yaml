            for the plugin image. The value is calculated based on the
            `image_uri` field. If the `image_uri` field refers to a container
            image, the digest value is obtained from the container image. If the
            `image_uri` field refers to a generic artifact, the digest value is
            calculated based on the contents of the file.
          readOnly: true
          type: string
        imageUri:
          description: >-
            Optional. URI of the image containing the Wasm module, stored in
