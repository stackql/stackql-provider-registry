    MulticastLogConfig:
      description: The logging configuration.
      id: MulticastLogConfig
      properties:
        enabled:
          description: Optional. Whether to enable logging or not.
          type: boolean
      type: object
    MulticastResourceState:
      description: The multicast resource's state.
      id: MulticastResourceState
      properties:
        state:
          description: Optional. The state of the multicast resource.
          enum:
            - STATE_ENUM_UNSPECIFIED
            - CREATING
            - ACTIVE
            - DELETING
            - DELETE_FAILED
            - UPDATING
            - UPDATE_FAILED
            - INACTIVE
            - OBSOLETE
          enumDescriptions:
            - The resource is in unspecified state.
            - The resource is being created.
            - The resource is in a normal state and ready to use.
            - The resource is being deleted.
            - The resource is failed to be deleted.
            - The resource is being updated.
            - The resource is failed to be updated.
            - >-
              The multicast consumer resource that is deactivated by the
