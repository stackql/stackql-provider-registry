            is assigned a different unique_id.
          readOnly: true
          type: string
        updateTime:
          description: >-
            Output only. [Output only] The timestamp when the Multicast Consumer
            Association was most recently updated.
          format: google-datetime
          readOnly: true
          type: string
      type: object
    MulticastGroupConsumerActivation:
