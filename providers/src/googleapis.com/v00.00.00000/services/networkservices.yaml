          type: object
      type: object
    WasmPluginLogConfig:
      description: >-
        Specifies the logging options for the activity performed by this plugin.
        If logging is enabled, plugin logs are exported to Cloud Logging.
      id: WasmPluginLogConfig
      properties:
        enable:
          description: >-
            Optional. Specifies whether to enable logging for activity by this
            plugin. Defaults to `false`.
          type: boolean
        minLogLevel:
          description: >-
            Optional. Non-empty default. Specifies the lowest level of the
            plugin logs that are exported to Cloud Logging. This setting relates
            to the logs generated by using logging statements in your Wasm code.
            This field is can be set only if logging is enabled for the plugin.
            If the field is not provided when logging is enabled, it is set to
            `INFO` by default.
          enum:
            - LOG_LEVEL_UNSPECIFIED
            - TRACE
            - DEBUG
            - INFO
            - WARN
            - ERROR
            - CRITICAL
          enumDescriptions:
            - Unspecified value. Defaults to `LogLevel.INFO`.
            - Report logs with TRACE level and above.
            - Report logs with DEBUG level and above.
            - Report logs with INFO level and above.
            - Report logs with WARN level and above.
            - Report logs with ERROR level and above.
            - Report logs with CRITICAL level only.
          type: string
        sampleRate:
          description: >-
            Optional. Non-empty default. Configures the sampling rate of
            activity logs, where `1.0` means all logged activity is reported and
            `0.0` means no activity is reported. A floating point value between
            `0.0` and `1.0` indicates that a percentage of log messages is
            stored. The default value when logging is enabled is `1.0`. The
            value of the field must be between `0` and `1` (inclusive). This
            field can be specified only if logging is enabled for this plugin.
          format: float
          type: number
      type: object
