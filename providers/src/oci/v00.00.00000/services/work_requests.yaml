openapi: 3.0.0
info:
  title: work_requests API
  description: oci work_requests API
  version: '20160918'
paths:
  /workRequests:
    get:
      description: |
        Lists the work requests in a compartment or for a specified resource.
      operationId: ListWorkRequests
      parameters:
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/ResourceIdQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        '200':
          description: The list of work requests.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages of
                results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkRequestsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Lists work requests in a compartment or for a resource.
      tags:
        - workRequest
      x-example: |
        GET /20160918/workRequests?compartmentId=<var>&lt;compartment_OCID&gt;</var>
        Host: iaas.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
  /workRequests/{workRequestId}:
    get:
      description: Gets the details of a work request.
      operationId: GetWorkRequest
      parameters:
        - $ref: '#/components/parameters/WorkRequestIdPathParam'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        '200':
          description: The details of the work request.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequest'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Gets the details of a work request.
      tags:
        - workRequest
      x-example: |
        GET /20160918/workRequests/<var>&lt;work_request_OCID&gt;</var>
        Host: iaas.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
  /workRequests/{workRequestId}/errors:
    get:
      description: |
        Gets the errors for a work request.
      operationId: ListWorkRequestErrors
      parameters:
        - $ref: '#/components/parameters/WorkRequestIdPathParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        '200':
          description: The list of work request errors.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages of
                results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkRequestErrorsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Lists work request errors
      tags:
        - workRequest
      x-example: |
        GET /20160918/workRequests/<var>&lt;work_request_OCID&gt;</var>/errors
        Host: iaas.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
  /workRequests/{workRequestId}/logs:
    get:
      description: |
        Gets the logs for a work request.
      operationId: ListWorkRequestLogs
      parameters:
        - $ref: '#/components/parameters/WorkRequestIdPathParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        '200':
          description: The list of work request logs.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages of
                results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkRequestLogsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Lists work request logs
      tags:
        - workRequest
      x-example: |
        GET /20160918/workRequests/<var>&lt;work_request_OCID&gt;</var>/logs
        Host: iaas.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
      x-related-resource: '#/definitions/WorkRequestLogEntry'
components:
  schemas:
    WorkRequestSummary:
      description: A summary of the status of a work request.
      properties:
        compartmentId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
            this work request.
          type: string
        id:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
          type: string
        operationType:
          description: The asynchronous operation tracked by this work request.
          type: string
        percentComplete:
          description: The percentage complete of the operation tracked by this work request.
          format: float
          type: number
        status:
          description: The status of the work request.
          enum:
            - ACCEPTED
            - IN_PROGRESS
            - FAILED
            - SUCCEEDED
            - CANCELING
            - CANCELED
          type: string
        timeAccepted:
          description: The date and time the work request was created, in the format defined by RFC3339.
          format: date-time
          type: string
        timeFinished:
          description: |
            The date and time the work request reached a terminal state, either `FAILED` or `SUCCEEDED`.
            Format is defined by RFC3339.
          format: date-time
          type: string
        timeStarted:
          description: |
            The date and time the work request transitioned from `ACCEPTED` to `IN_PROGRESS`, in
            the format defined by RFC3339.
          format: date-time
          type: string
      required:
        - operationType
        - status
        - id
        - compartmentId
        - percentComplete
        - timeAccepted
      x-example: |
        {
          "operationType":"LaunchInstancesInPool",
          "status":"SUCCEEDED",
          "id":"ocid1.coreservicesworkrequest.oc1.phx.exampleunique_ID",
          "compartmentId":"ocid1.tenancy.oc1..exampleuniqueID",
          "percentComplete":100.0,
          "timeAccepted":"2019-05-07T00:50:03.248Z",
          "timeStarted":"2019-05-07T00:50:03.374Z",
          "timeFinished":"2019-05-07T00:52:05.704Z"
        }
      type: object
    WorkRequest:
      description: An asynchronous work request.
      properties:
        compartmentId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment
            that contains the work request.
          type: string
        id:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
          type: string
        operationType:
          description: The asynchronous operation tracked by this work request.
          type: string
        percentComplete:
          description: The percentage complete of the operation tracked by this work request.
          format: float
          type: number
        resources:
          description: The resources that are affected by this work request.
          items:
            $ref: '#/components/schemas/WorkRequestResource'
          type: array
        status:
          description: The status of the work request.
          enum:
            - ACCEPTED
            - IN_PROGRESS
            - FAILED
            - SUCCEEDED
            - CANCELING
            - CANCELED
          type: string
        timeAccepted:
          description: The date and time the work request was created, in the format defined by RFC3339.
          format: date-time
          type: string
        timeFinished:
          description: |
            The date and time the work request reached a terminal state, either `FAILED` or `SUCCEEDED`.
            Format is defined by RFC3339.
          format: date-time
          type: string
        timeStarted:
          description: |
            The date and time the work request transitioned from `ACCEPTED` to `IN_PROGRESS`,
            in the format defined by RFC3339.
          format: date-time
          type: string
      required:
        - operationType
        - status
        - id
        - compartmentId
        - resources
        - percentComplete
        - timeAccepted
      x-example: |
        Example response: Work request that tracks the launch instance operation
        {
          "operationType": "LaunchInstance",
          "status": "SUCCEEDED",
          "id": "ocid1.coreservicesworkrequest.oc1.phx.exampleunique_ID",
          "compartmentId": "ocid1.tenancy.oc1..exampleunique_ID",
          "resources": [
            {
              "actionType": "CREATED",
              "entityType": "instance",
              "identifier": "ocid1.instance.oc1.phx.exampleunique_ID",
              "entityUri": "/20160918/instances/ocid1.instance.oc1.phx.exampleunique_ID"
            }
          ],
          "percentComplete": 100.0,
          "timeAccepted": "2019-05-06T23:02:52.319Z",
          "timeStarted": "2019-05-06T23:02:57.592Z",
          "timeFinished": "2019-05-06T23:03:59.744Z"
        }
      type: object
    WorkRequestError:
      description: An error encountered while executing an operation that is tracked by a work request.
      properties:
        code:
          description: A machine-usable code for the error that occured.
          type: string
        message:
          description: A human-readable error string.
          type: string
        timestamp:
          description: The date and time the error occurred.
          format: date-time
          type: string
      required:
        - code
        - message
        - timestamp
      x-example: |
        {
          "code" : "InternalError",
          "message" : "Launch instance failed, Retrying failed to complete successfully after 5 attempts.",
          "timestamp" : "2019-05-07T01:04:43.543Z"
        }
      type: object
    WorkRequestLogEntry:
      description: A log message from executing an operation that is tracked by a work request.
      properties:
        message:
          description: A human-readable log message.
          type: string
        timestamp:
          description: The date and time the log message was written.
          format: date-time
          type: string
      required:
        - message
        - timestamp
      x-example: |
        {
          "message" : "Powering on virtual machine.",
          "timestamp" : "2019-05-07T00:50:44.446Z"
        }
      type: object
    Error:
      description: An error code and message from an API request failure.
      properties:
        code:
          description: |
            A short error code that defines the error, meant for programmatic parsing. See
            [API Errors](/iaas/Content/API/References/apierrors.htm).
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
        - code
        - message
      type: object
    WorkRequestResource:
      description: |
        A resource that is created or operated on by an asynchronous operation that is tracked by
        a work request.
      properties:
        actionType:
          description: |
            The way in which this resource was affected by the operation that spawned the work
            request.
          enum:
            - CREATED
            - UPDATED
            - DELETED
            - RELATED
            - IN_PROGRESS
          type: string
        entityType:
          description: The resource type the work request affects.
          type: string
        entityUri:
          description: The URI path that you can use for a GET request to access the resource metadata.
          type: string
        identifier:
          description: |
            An [OCID](/iaas/Content/General/Concepts/identifiers.htm) or other unique identifier for the
            resource.
          type: string
      required:
        - actionType
        - entityType
        - identifier
      type: object
    ListWorkRequestsResponse:
      type: object
      properties:
        work_requests:
          type: array
          items:
            $ref: '#/components/schemas/WorkRequestSummary'
    ListWorkRequestErrorsResponse:
      type: object
      properties:
        work_request_errors:
          type: array
          items:
            $ref: '#/components/schemas/WorkRequestError'
    ListWorkRequestLogsResponse:
      type: object
      properties:
        work_request_logs:
          type: array
          items:
            $ref: '#/components/schemas/WorkRequestLogEntry'
  responses:
    '400':
      description: Bad Request
      headers:
        opc-request-id:
          description: |
            Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
            a particular request, please provide the request ID.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: Unauthorized
      headers:
        opc-request-id:
          description: |
            Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
            a particular request, please provide the request ID.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Not Found
      headers:
        opc-request-id:
          description: |
            Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
            a particular request, please provide the request ID.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Internal Server Error
      headers:
        opc-request-id:
          description: |
            Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
            a particular request, please provide the request ID.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DefaultError:
      description: An error has occurred.
      headers:
        opc-request-id:
          description: |
            Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
            a particular request, please provide the request ID.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    CompartmentIdQueryParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ResourceIdQueryParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the resource.
      in: query
      name: resourceId
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
        default: null
    PaginationLimitQueryParam:
      description: |
        For list pagination. The maximum number of results per page, or items to return in a
        paginated "List" call. For important details about how pagination works, see
        [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    PaginationTokenQueryParam:
      description: |
        For list pagination. The value of the `opc-next-page` response header from the
        previous "List" call. For important details about how pagination works, see
        [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
      in: query
      name: page
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2000
        default: null
    OpcRequestIdHeaderParam:
      description: |
        Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
        particular request, please provide the request ID.
      in: header
      name: opc-request-id
      required: false
      schema:
        type: string
        pattern: '[A-Za-z0-9\-_\.]+'
    WorkRequestIdPathParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
      in: path
      name: workRequestId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    SortOrderQueryParam:
      description: |
        The sort order to use, either ascending (`ASC`) or descending (`DESC`).
      in: query
      name: sortOrder
      required: false
      x-default-description: no sorting
      schema:
        type: string
        enum:
          - ASC
          - DESC
