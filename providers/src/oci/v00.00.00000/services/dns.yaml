openapi: 3.0.0
info:
  title: dns API
  description: oci dns API
  version: '20180115'
paths:
  /actions/createZoneFromZoneFile:
    post:
      description: |
        Creates a new zone from a zone file in the specified compartment. Not supported for private zones.
      operationId: CreateZoneFromZoneFile
      parameters:
        - $ref: '#/components/parameters/OpcRequestIdHeader'
        - $ref: '#/components/parameters/OpcRetryTokenHeader'
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/ScopeQueryParam'
        - $ref: '#/components/parameters/ViewIdQueryParam'
      requestBody:
        content:
          text/dns:
            schema:
              format: binary
              type: string
        description: The zone file contents.
        required: true
      responses:
        '201':
          description: A response containing a single zone object.
          headers:
            Location:
              description: |
                The full URI of the resource related to the request.
              schema:
                type: string
            etag:
              description: |
                The current version of the resource, ending with a
                representation-specific suffix. This value may be used in If-Match
                and If-None-Match headers for later requests of the same resource.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to
                contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
            opc-work-request-id:
              description: |
                Unique Oracle-assigned identifier for the asynchronous request.
                You can use this to query status of the asynchronous operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      tags:
        - dns
      x-example: |
        POST /20180115/actions/createZoneFromZoneFile?compartmentId=ocid1.. HTTP/1.1
        Host: dns.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
        Content-Type: text/dns
        <var>&lt;Zone file contents&gt;</var>
      x-related-resource: '#/definitions/Zone'
  /resolvers:
    get:
      description: |
        Gets a list of all resolvers within a compartment.

        The collection can be filtered by display name, id, or lifecycle state. It can be sorted
        on creation time or displayName both in ASC or DESC order. Note that when no lifecycleState
        query parameter is provided, the collection does not include resolvers in the DELETED
        lifecycleState to be consistent with other operations of the API.
      operationId: ListResolvers
      parameters:
        - $ref: '#/components/parameters/OpcRequestIdHeader'
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
