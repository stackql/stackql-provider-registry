        - $ref: '#/components/parameters/IdQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/ResolversSortByQueryParam'
        - $ref: '#/components/parameters/ResolverLifecycleStateQueryParam'
        - $ref: '#/components/parameters/ScopeQueryParam'
      responses:
        '200':
          description: A Response containing a list of resolver objects.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages
                of results remain. For important details about how pagination works,
                see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
