  /resolvers/{resolverId}/actions/changeCompartment:
    post:
      description: |
        Moves a resolver into a different compartment along with its protected default view and any endpoints.

        Zones in the default view are not moved. VCN-dedicated resolvers are initially created in the same compartment
        as their corresponding VCN, but can then be moved to a different compartment.
      operationId: ChangeResolverCompartment
      parameters:
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/OpcRetryTokenHeader'
        - $ref: '#/components/parameters/OpcRequestIdHeader'
        - $ref: '#/components/parameters/ResolverIdPathParam'
        - $ref: '#/components/parameters/ScopeQueryParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeResolverCompartmentDetails'
        description: |
          Details for moving a resolver, along with its protected default view and endpoints, into a
          different compartment.
        required: true
      responses:
        '202':
          $ref: '#/components/responses/EmptyResponseWithWorkRequest'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
