        <var>&lt;authorization and other headers&gt;</var>
        {
          "compartmentId": "ocid1.compartment.oc1..",
          "displayName": "failover between endpoints",
          "ttl": 30,
          "healthCheckMonitorId": "ocid1.httpmonitor.oc1..",
          "template": "FAILOVER",
          "answers": [
            {
              "name": "server-primary",
              "rtype": "A",
              "rdata": "192.0.2.0",
              "pool": "primary"
            },
            {
              "name": "server-secondary",
              "rtype": "A",
              "rdata": "192.0.4.6",
              "pool": "secondary"
            }
          ],
          "rules": [
            {
              "ruleType": "FILTER",
              "defaultAnswerData": [
                {
                  "answerCondition": "answer.isDisabled != true",
                  "shouldKeep": true
                }
              ]
            },
            {
              "ruleType": "HEALTH"
            },
            {
              "ruleType": "PRIORITY",
              "defaultAnswerData": [
                {
                  "answerCondition": "answer.pool == 'primary'",
                  "value": 1
                },
                {
                  "answerCondition": "answer.pool == 'secondary'",
                  "value": 99
                }
              ]
            },
            {
              "ruleType": "LIMIT",
              "defaultCount": 1
            }
          ]
        }
