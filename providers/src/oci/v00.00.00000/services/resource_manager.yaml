  /jobs/{jobId}/associatedResources:
    get:
      description: |
        Gets the list of resources associated with the specified job.
        For more information, see
        [Listing Job Resources](/iaas/Content/ResourceManager/Tasks/list-job-resources.htm).
      operationId: ListJobAssociatedResources
      parameters:
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
        - $ref: '#/components/parameters/JobIdPathParam'
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/TerraformResourceTypeQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
      responses:
        '200':
          description: A list of associated resources.
          headers:
            opc-next-page:
              description: |
                Retrieves the next page of paginated list items. If the `opc-next-page`
                header appears in the response, additional pages of results remain.
                To receive the next page, include the header value in the `page` param.
                If the `opc-next-page` header does not appear in the response, there
                are no more list items to get. For more information about list pagination,
                see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociatedResourcesCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Gets the list of resources associated with the specified job.
