        Deletes the specified configuration source provider.
        For more information, see
        [Deleting a Configuration Source Provider](/iaas/Content/ResourceManager/Tasks/delete-csp.htm).
      operationId: DeleteConfigurationSourceProvider
      parameters:
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
        - $ref: '#/components/parameters/IfMatchHeaderParam'
        - $ref: '#/components/parameters/ConfigurationSourceProviderIdPathParam'
      responses:
        '204':
          description: The request was accepted for processing.
          headers:
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Deletes the specified configuration source provider.
      tags:
        - ResourceManager
      x-example: |
        DELETE /20180917/configurationSourceProviders/<var>&lt;configurationsourceprovider_OCID&gt;</var>
        Host: resourcemanager.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
      x-related-resource: '#/definitions/ConfigurationSourceProvider'
    get:
      description: |
        Gets the properties of the specified configuration source provider.
