        type: string
    FilterByDisplayNameQueryParam:
      description: |
        A filter to return only resources that match the given display name exactly.
        Use this filter to list a resource by name.
        Requires `sortBy` set to `DISPLAYNAME`.
        Alternatively, when you know the resource OCID, use the related Get operation.
      in: query
      name: displayName
      required: false
      schema:
        type: string
        maxLength: 255
    SortByQueryParam:
      description: |
        The field to use when sorting returned resources.
        By default, `TIMECREATED` is ordered descending.
        By default, `DISPLAYNAME` is ordered ascending. Note that you can sort only on one field.
      in: query
      name: sortBy
      required: false
      schema:
        type: string
        enum:
          - TIMECREATED
          - DISPLAYNAME
    SortOrderQueryParam:
      description: |
        The sort order to use when sorting returned resources. Ascending (`ASC`) or descending (`DESC`).
      in: query
      name: sortOrder
      required: false
      schema:
        type: string
        enum:
          - ASC
          - DESC
    PaginationLimitQueryParam:
      description: |
        The number of items returned in a paginated `List` call. For information about pagination, see
        [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    PaginationTokenQueryParam:
      description: |
        The value of the `opc-next-page` response header from the preceding `List` call.
        For information about pagination, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
      in: query
      name: page
      schema:
        type: string
        minLength: 1
        maxLength: 512
    FilterByConfigSourceProviderTypeQueryParam:
      description: |
        A filter to return only configuration source providers of the specified type (GitHub or GitLab).
      in: query
      name: configSourceProviderType
      required: false
      schema:
        type: string
    OpcRetryTokenHeaderParam:
      description: |
        A token that uniquely identifies a request so it can be retried in case of a timeout or
        server error without risk of retrying the same action. Retry tokens expire after
        24 hours, but can be invalidated before then due to conflicting operations. For example,
        if a resource has been deleted and purged from the system, then a retry of the original
        creation request may be rejected.
      in: header
      name: opc-retry-token
      required: false
      schema:
        type: string
    IfMatchHeaderParam:
      description: |
        For optimistic concurrency control. In the `PUT` or `DELETE` call for a resource, set the `if-match`
        parameter to the value of the etag from a previous `GET` or `POST` response for that resource.  The resource
        will be updated or deleted only if the etag you provide matches the resource's current etag value.
      in: header
      name: if-match
      schema:
        type: string
    ConfigurationSourceProviderIdPathParam:
