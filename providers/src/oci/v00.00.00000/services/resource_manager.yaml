    Job:
      description: |
        The properties of a job.
        A job performs the actions that are defined in your Terraform configuration.
        For instructions on managing jobs, see
        [Managing Jobs](/iaas/Content/ResourceManager/Tasks/jobs.htm).
        For more information about jobs, see
        [Key Concepts](/iaas/Content/ResourceManager/Concepts/resourcemanager.htm#concepts__jobdefinition).
      properties:
        applyJobPlanResolution:
          $ref: '#/components/schemas/ApplyJobPlanResolution'
        cancellationDetails:
          $ref: '#/components/schemas/CancellationDetails'
        compartmentId:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment in which the job's associated stack resides.
          type: string
        configSource:
          $ref: '#/components/schemas/ConfigSourceRecord'
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the string data type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.
              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a namespace.
            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).
            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        displayName:
          description: |
            A user-friendly name. Does not have to be unique, and it's changeable. Avoid entering confidential information.
          maxLength: 255
          type: string
        failureDetails:
          $ref: '#/components/schemas/FailureDetails'
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags associated with the resource. Each tag is a key-value pair with no predefined name, type, or namespace.
            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).
            Example: `{"Department": "Finance"}`
          type: object
        id:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the job.
          type: string
        isProviderUpgradeRequired:
          default: false
          description: |
            Specifies whether or not to upgrade provider versions.
            Within the version constraints of your Terraform configuration, use the latest versions available from the source of Terraform providers.
            For more information about this option, see [Dependency Lock File (terraform.io)](https://www.terraform.io/language/files/dependency-lock).
          type: boolean
        isThirdPartyProviderExperienceEnabled:
          description: |
            When `true`, the stack sources third-party Terraform providers from
            [Terraform Registry](https://registry.terraform.io/browse/providers) and allows
            [custom providers](#/en/resourcemanager/latest/datatypes/CustomTerraformProvider).
            For more information about stack sourcing of third-party Terraform providers, see
            [Third-party Provider Configuration](/iaas/Content/ResourceManager/Concepts/terraformconfigresourcemanager.htm#third-party-providers).
          type: boolean
        jobOperationDetails:
          $ref: '#/components/schemas/JobOperationDetails'
        lifecycleState:
          description: |
            Current state of the specified job.
            For more information about job lifecycle states in Resource Manager, see
            [Key Concepts](/iaas/Content/ResourceManager/Concepts/resourcemanager.htm#concepts__JobStates).
          enum:
            - ACCEPTED
            - IN_PROGRESS
            - FAILED
            - SUCCEEDED
            - CANCELING
            - CANCELED
          type: string
        operation:
          description: The type of job executing.
          enum:
            - PLAN
            - APPLY
            - DESTROY
            - IMPORT_TF_STATE
            - PLAN_ROLLBACK
            - APPLY_ROLLBACK
          type: string
        resolvedPlanJobId:
          description: |
            Deprecated. Use the property `executionPlanJobId` in `jobOperationDetails` instead.
            The plan job [OCID](/iaas/Content/General/Concepts/identifiers.htm) that was used (if this was an apply job and was not auto-approved).
          type: string
        stackId:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the stack that is associated with the job.
          type: string
        systemTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only string, integer, and boolean types are supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing system tags' keys and values scoped to a namespace.
              Example: `{"bar-key": "value"}`
            type: object
          description: |
            The system tags associated with this resource, if any. The system tags are set by Oracle cloud infrastructure services. Each key is predefined and scoped to namespaces.
            For more information, see [Resource Tags](https://docs.cloud.oracle.com/iaas/Content/General/Concepts/resourcetags.htm).
            Example: `{orcl-cloud: {free-tier-retain: true}}`
          type: object
        timeCreated:
          description: |
            The date and time when the job was created.
            Format is defined by RFC3339.
            Example: `2020-01-25T21:10:29.600Z`
          format: date-time
          type: string
        timeFinished:
          description: |
            The date and time when the job stopped running, irrespective of whether the job ran successfully.
            Format is defined by RFC3339.
            Example: `2020-01-25T21:10:29.600Z`
          format: date-time
          type: string
        variables:
          additionalProperties:
            type: string
          description: |
            Terraform variables associated with this resource.
            Maximum number of variables supported is 250.
            The maximum size of each variable, including both name and value, is 8192 bytes.
            Example: `{"CompartmentId": "compartment-id-value"}`
          maxProperties: 250
          type: object
        workingDirectory:
          description: |
            File path to the directory to use for running Terraform.
            If not specified, the root directory is used.
            Required when using a zip Terraform configuration (`configSourceType` value of `ZIP_UPLOAD`) that contains folders.
            Ignored for the `configSourceType` value of `COMPARTMENT_CONFIG_SOURCE`.
            For more information about required and recommended file structure, see
            [File Structure (Terraform Configurations for Resource Manager)](/iaas/Content/ResourceManager/Concepts/terraformconfigresourcemanager.htm#filestructure).
          type: string
      type: object
      x-example: |
