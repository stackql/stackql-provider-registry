components:
  schemas:
    ConfigurationSourceProviderCollection:
      description: |
        Collection of configuration source providers.
      properties:
        items:
          description: Collection of configuration source providers.
          items:
            $ref: '#/components/schemas/ConfigurationSourceProviderSummary'
          type: array
      type: object
    CreateConfigurationSourceProviderDetails:
      description: |
        Creation details for a configuration source provider.
      discriminator:
        propertyName: configSourceProviderType
      properties:
        compartmentId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment where
            you want to create the configuration source provider.
          type: string
        configSourceProviderType:
          description: |
            The type of configuration source provider.
            The `GITLAB_ACCESS_TOKEN` type corresponds to GitLab.
            The `GITHUB_ACCESS_TOKEN` type corresponds to GitHub.
            The `BITBUCKET_CLOUD_ACCESS_TOKEN` type corresponds to Bitbucket Cloud.
            For Bitbucket Cloud, create requests must provide Atlassian account `email` and `secretId` containing an API token.
            The `BITBUCKET_SERVER_ACCESS_TOKEN` type corresponds to Bitbucket Server.
          type: string
          x-obmcs-enumref: '#/definitions/ConfigurationSourceProvider/configSourceProviderType'
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the string data type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.
              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a namespace.
            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).
            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        description:
          description: Description of the configuration source provider. Avoid entering confidential information.
          type: string
        displayName:
          description: |
            A user-friendly name. Does not have to be unique, and it's changeable. Avoid entering confidential information.
          maxLength: 255
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags associated with the resource. Each tag is a key-value pair with no predefined name, type, or namespace.
            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).
            Example: `{"Department": "Finance"}`
          type: object
        privateServerConfigDetails:
          $ref: '#/components/schemas/PrivateServerConfigDetails'
      required:
        - configSourceProviderType
      type: object
      x-example: |
        {
          "compartmentId": "ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>",
          "displayName": "My Configuration Source Provider",
          "description": "Example Git Source",
          "configSourceProviderType": "GITLAB_ACCESS_TOKEN",
            "apiEndpoint": "https://gitlab.com",
            "accessToken": "<var>&lt;token&gt;</var>",
          "privateServerConfigDetails": {
            "privateEndpointId": "ocid1.ormprivateendpoint.oc1..<var>&lt;unique_ID&gt;</var>",
            "certificateId": "ocid1.certificate.oc1..<var>&lt;unique_ID&gt;</var>"
          },
          "freeformTags": {
            "Department": "Finance",
            "Group": "D"
          },
          "definedTags": {
