  /clusters/{clusterId}/actions/startCredentialRotation:
    post:
      description: Start cluster credential rotation by adding new credentials, old credentials will still work after this operation.
      operationId: StartCredentialRotation
      parameters:
        - $ref: '#/components/parameters/ClusterIdPathParam'
