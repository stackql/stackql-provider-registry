      tags:
        - containerEngine
      x-related-resource: '#/definitions/Cluster'
    get:
      description: Get the details of a cluster.
      operationId: GetCluster
      parameters:
        - $ref: '#/components/parameters/ClusterIdPathParam'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IsOpenIdConnectAuthConfigFileIncludedQueryParam'
      responses:
        '200':
          description: The cluster details.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Get cluster details.
      tags:
        - containerEngine
    put:
      description: Update the details of a cluster.
      operationId: UpdateCluster
      parameters:
        - $ref: '#/components/parameters/ClusterIdPathParam'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClusterDetails'
        description: The details of the cluster to update.
        required: true
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        '412':
          $ref: '#/components/responses/NoEtagMatch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Update cluster details.
      tags:
        - containerEngine
      x-related-resource: '#/definitions/Cluster'
  /clusters/{clusterId}/actions/completeCredentialRotation:
    post:
      description: Complete cluster credential rotation. Retire old credentials from kubernetes components.
      operationId: CompleteCredentialRotation
