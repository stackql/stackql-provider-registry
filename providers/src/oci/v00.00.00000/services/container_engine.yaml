openapi: 3.0.0
info:
  title: container_engine API
  description: oci container_engine API
  version: '20180222'
paths:
  /addonOptions:
    get:
      description: Get list of supported addons for a specific kubernetes version.
      operationId: ListAddonOptions
      parameters:
        - $ref: '#/components/parameters/KubernetesVersionQueryParam'
        - $ref: '#/components/parameters/AddonNameQueryParam'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - description: The optional field to sort the results by.
          in: query
          name: sortBy
          required: false
          schema:
            type: string
            enum:
              - NAME
              - TIME_CREATED
        - description: |
            Specifies whether all add-on versions should be displayed. The default value is false. If set to true, the API will return all available add-on versions, including deprecated versions and detailed build numbers.
            Please note that the use of deprecated versions, as well as the specification of a particular build of a supported version, is not recommended for standard operations.
          in: query
          name: shouldShowAllVersions
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A list of addon option summary objects for a specific kubernetes version.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages of results remain.
                For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAddonOptionsResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Get list of supported addons for a specific kubernetes version.
      tags:
        - containerEngine
      x-obmcs-authz-declarations:
        authorizationRequired: false
  /clusterOptions/{clusterOptionId}:
    get:
      description: Get options available for clusters.
      operationId: GetClusterOptions
      parameters:
        - $ref: '#/components/parameters/ClusterOptionIdPathParam'
        - $ref: '#/components/parameters/CompartmentIdOptionalQueryParam'
        - $ref: '#/components/parameters/ShouldListAllPatchVersionsQueryParam'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The cluster options.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterOptions'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Get cluster options.
      tags:
        - containerEngine
  /clusters:
    get:
      description: List all the cluster objects in a compartment.
      operationId: ListClusters
      parameters:
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/ClusterLifecycleStateFilterQueryParam'
        - $ref: '#/components/parameters/NameFilterQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - description: The optional field to sort the results by.
          in: query
          name: sortBy
          required: false
          schema:
            type: string
            enum:
              - ID
              - NAME
              - TIME_CREATED
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A list of cluster summary objects.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages of results remain.
                For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClustersResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: List all cluster objects.
      tags:
        - containerEngine
    post:
      description: Create a new cluster.
      operationId: CreateCluster
      parameters:
        - $ref: '#/components/parameters/IdempotencyTokenHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClusterDetails'
        description: The details of the cluster to create.
        required: true
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        '409':
          $ref: '#/components/responses/IncorrectState'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Create a new cluster.
      tags:
        - containerEngine
      x-related-resource: '#/definitions/Cluster'
  /clusters/{clusterId}:
    delete:
      description: Delete a cluster.
      operationId: DeleteCluster
      parameters:
        - $ref: '#/components/parameters/ClusterIdPathParam'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
