components:
  schemas:
    AddonOptionSummary:
      description: The properties that define addon summary.
      properties:
        addonGroup:
          description: Addon group info, a namespace concept that groups addons with similar functionalities.
          example: oke/cluster-network
          type: string
        addonSchemaVersion:
          description: Addon definition schema version to validate addon.
          example: '0.1'
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.
              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a namespace.
            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).
            Example: `{"Operations": {"CostCenter": "42"}}`
          example:
            Operations:
              CostCenter: 42
          type: object
        description:
          description: Description on the addon.
          example: BlaBla
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.
            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).
            Example: `{"Department": "Finance"}`
          example:
            Department: Finance
          type: object
        isEssential:
          description: Is it an essential addon for cluster operation or not.
          example: true
          type: boolean
        lifecycleState:
          description: The life cycle state of the addon.
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE
          type: string
        name:
          description: Name of the addon and it would be unique.
          example: flannel
          type: string
        systemTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only string, integer and boolean types are supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing system tags' keys and values scoped to a namespace.
              Example: `{"bar-key": "value"}`
            type: object
          description: |
            Usage of system tag keys. These predefined keys are scoped to namespaces.
            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`
          type: object
        timeCreated:
          description: The time the work request was created.
          example: '2017-07-21T16:11:29Z'
          format: date-time
          type: string
        versions:
          description: The resources this work request affects.
          items:
            $ref: '#/components/schemas/AddonVersions'
          type: array
      required:
        - versions
        - name
        - isEssential
        - lifecycleState
      type: object
    ClusterOptions:
      description: Options for creating or updating clusters.
      properties:
        clusterPodNetworkOptions:
          description: Available CNIs and network options for existing and new node pools of the cluster
          items:
            $ref: '#/components/schemas/ClusterPodNetworkOptionDetails'
          maxItems: 255
          type: array
          uniqueItems: true
          x-default-description: when unspecified in case of updates, the current value of this field will be preserved, else value set to null
        kubernetesVersions:
          description: Available Kubernetes versions.
          items:
            example: v1.9.4
            type: string
          type: array
      type: object
    ClusterSummary:
      description: The properties that define a cluster summary.
      properties:
        availableKubernetesUpgrades:
          description: Available Kubernetes versions to which the clusters masters may be upgraded.
          items:
            example: v1.9.4
            type: string
          type: array
        clusterPodNetworkOptions:
          description: Available CNIs and network options for existing and new node pools of the cluster
          items:
            $ref: '#/components/schemas/ClusterPodNetworkOptionDetails'
          maxItems: 255
          type: array
          uniqueItems: true
          x-default-description: 'null'
        compartmentId:
          description: The OCID of the compartment in which the cluster exists.
          example: ocid1.compartment.oc1..aaaaaaaafqm2df7ckwmmbtdsl2bgxsw4fcpvkoojytxrqst24yww2tdmtqcq
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.
              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a namespace.
            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).
            Example: `{"Operations": {"CostCenter": "42"}}`
          example:
            Operations:
              CostCenter: 42
          type: object
        endpointConfig:
          $ref: '#/components/schemas/ClusterEndpointConfig'
        endpoints:
          $ref: '#/components/schemas/ClusterEndpoints'
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.
            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).
            Example: `{"Department": "Finance"}`
          example:
            Department: Finance
          type: object
        id:
          description: The OCID of the cluster.
          example: ocid1.cluster.oc1.iad.aaaaaaaaga3tombrmq3wgyrvmi3gcn3bmfsdizjwgy4wgyldmy3dcmtcmmyw
          type: string
        imagePolicyConfig:
          $ref: '#/components/schemas/ImagePolicyConfig'
        kubernetesVersion:
          description: The version of Kubernetes running on the cluster masters.
          example: v1.9.4
          type: string
        lifecycleDetails:
          description: Details about the state of the cluster masters.
          example: waiting for node pools
          type: string
        lifecycleState:
          description: The state of the cluster masters. For more information, see [Monitoring Clusters](/Content/ContEng/Tasks/contengmonitoringclusters.htm)
          enum:
            - CREATING
            - ACTIVE
            - FAILED
            - DELETING
            - DELETED
            - UPDATING
          example: UPDATING
          type: string
          x-obmcs-top-level-enum: '#/definitions/ClusterLifecycleState'
