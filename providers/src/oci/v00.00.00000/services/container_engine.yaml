  /clusters/{clusterId}/actions/extendEndpointDecommissionRollbackDeadline:
    post:
      description: |
        Extend the rollback deadline of public api endpoint decommission for a cluster.
        The operation can only be performed within decommission rollback deadline.
      operationId: ExtendEndpointDecommissionRollbackDeadline
      parameters:
        - $ref: '#/components/parameters/ClusterIdPathParam'
        - $ref: '#/components/parameters/IdempotencyTokenHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendEndpointDecommissionRollbackDeadlineDetails'
        description: The details for a kubernetes cluster to extend public api endpoint decommission rollback deadline.
        required: true
      responses:
        '200':
          description: The cluster's public api endpoint decommission status details.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiEndpointDecommissionStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        '409':
          $ref: '#/components/responses/IncorrectState'
        '412':
          $ref: '#/components/responses/NoEtagMatch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Extend the rollback deadline of public api endpoint decommission for a cluster.
      tags:
        - containerEngine
      x-related-resource: '#/definitions/Cluster'
  /clusters/{clusterId}/actions/migrateToNativeVcn:
