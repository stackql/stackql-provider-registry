                      "id" : "ocid1.networksource.oc1..aaaaaaaavp6jexampleuniqueID4q",
                      "compartmentId" : "ocid1.tenancy.oc1..aaaaaaaabbbbexampleuniqueIDdsq",
                      "name" : "corpnet",
                      "description" : "Network source for corporate network",
                      "allowedSources":
