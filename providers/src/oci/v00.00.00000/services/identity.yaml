          type: integer
        lifecycleState:
          description: |
            The credential's current state. After creating a SMTP credential, make sure its `lifecycleState` changes from
            CREATING to ACTIVE before using it.
          enum:
            - CREATING
            - ACTIVE
            - INACTIVE
            - DELETING
            - DELETED
          maxLength: 64
          minLength: 1
          type: string
        password:
          description: |
            The SMTP password.
          type: string
        timeCreated:
          description: |
