    ApiKey:
      description: |
        A PEM-format RSA credential for securing requests to the Oracle Cloud Infrastructure REST API. Also known
        as an *API signing key*. Specifically, this is the public key from the key pair. The private key remains with
        the user calling the API. For information about generating a key pair
        in the required PEM format, see [Required Keys and OCIDs](/Content/API/Concepts/apisigningkey.htm).

        **Important:** This is **not** the SSH key for accessing compute instances.

        Each user can have a maximum of three API signing keys.

        For more information about user credentials, see [User Credentials](/Content/Identity/Concepts/usercredentials.htm).
      properties:
        fingerprint:
          description: The key's fingerprint (e.g., 12:34:56:78:90:ab:cd:ef:12:34:56:78:90:ab:cd:ef).
          type: string
        inactiveStatus:
          description: The detailed status of INACTIVE lifecycleState.
          format: int64
          type: integer
        keyId:
          description: |
            An Oracle-assigned identifier for the key, in this format:
            TENANCY_OCID/USER_OCID/KEY_FINGERPRINT.
          type: string
        keyValue:
          description: The key's value.
          type: string
        lifecycleState:
          description: |
            The API key's current state. After creating an `ApiKey` object, make sure its `lifecycleState` changes from
            CREATING to ACTIVE before using it.
          enum:
            - CREATING
            - ACTIVE
            - INACTIVE
            - DELETING
            - DELETED
          maxLength: 64
          minLength: 1
          type: string
        timeCreated:
          description: |
            Date and time the `ApiKey` object was created, in the format defined by RFC3339.

            Example: `2016-08-25T21:10:29.600Z`
          format: date-time
          type: string
        userId:
          description: The OCID of the user the key belongs to.
          type: string
      type: object
    CreateApiKeyDetails:
      properties:
        key:
          description: The public key.  Must be an RSA key in PEM format.
          type: string
      required:
        - key
      type: object
    AuthToken:
      description: |
        An `AuthToken` is an Oracle-generated token string that you can use to authenticate with third-party APIs
        that do not support Oracle Cloud Infrastructure's signature-based authentication. For example, use an `AuthToken`
        to authenticate with a Swift client with the Object Storage Service.

        The auth token is associated with the user's Console login. Auth tokens never expire. A user can have up to two
        auth tokens at a time.

        **Note:** The token is always an Oracle-generated string; you can't change it to a string of your choice.

        For more information, see [Managing User Credentials](/Content/Identity/access/managing-user-credentials.htm).
      properties:
        description:
          description: |
            The description you assign to the auth token. Does not have to be unique, and it's changeable.

            (For tenancies that support identity domains) You can have an empty description.
          type: string
        id:
          description: The OCID of the auth token.
          type: string
        inactiveStatus:
          description: The detailed status of INACTIVE lifecycleState.
          format: int64
          type: integer
        lifecycleState:
          description: |
            The token's current state. After creating an auth token, make sure its `lifecycleState` changes from
            CREATING to ACTIVE before using it.
          enum:
            - CREATING
            - ACTIVE
            - INACTIVE
            - DELETING
            - DELETED
          maxLength: 64
          minLength: 1
          type: string
        timeCreated:
          description: |
            Date and time the `AuthToken` object was created, in the format defined by RFC3339.

            Example: `2016-08-25T21:10:29.600Z`
          format: date-time
          type: string
        timeExpires:
          description: |
            Date and time when this auth token will expire, in the format defined by RFC3339.
            Null if it never expires.

            Example: `2016-08-25T21:10:29.600Z`
          format: date-time
          type: string
        token:
          description: |
            The auth token. The value is available only in the response for `CreateAuthToken`, and not
            for `ListAuthTokens` or `UpdateAuthToken`.
          format: password
          type: string
        userId:
          description: The OCID of the user the auth token belongs to.
          type: string
      type: object
    CreateAuthTokenDetails:
      properties:
        description:
          description: |
            The description you assign to the auth token during creation. Does not have to be unique, and it's changeable.

            (For tenancies that support identity domains) You can have an empty description.
          maxLength: 400
          minLength: 1
          type: string
      required:
        - description
      type: object
