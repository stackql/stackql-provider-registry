    Tenancy:
      description: |
        The root compartment that contains all of your organization's compartments and other
        Oracle Cloud Infrastructure cloud resources. When you sign up for Oracle Cloud Infrastructure,
        Oracle creates a tenancy for your company, which is a secure and isolated partition
        where you can create, organize, and administer your cloud resources.

        To use any of the API operations, you must be authorized in an IAM policy. If you're not authorized,
        talk to an administrator. If you're an administrator who needs to write policies to give users access,
        see [Get Started with Policies](/Content/Identity/policiesgs/get-started-with-policies.htm).
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.
              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a namespace.
            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).
            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        description:
          description: The description of the tenancy.
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.
            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).
            Example: `{"Department": "Finance"}`
          type: object
        homeRegionKey:
          description: |
            The region key for the tenancy's home region. For the full list of supported regions, see
            [Regions and Availability Domains](/Content/General/Concepts/regions.htm).

            Example: `PHX`
          type: string
        id:
          description: The OCID of the tenancy.
          type: string
        name:
          description: The name of the tenancy.
          type: string
        upiIdcsCompatibilityLayerEndpoint:
          description: Url which refers to the UPI IDCS compatibility layer endpoint configured for this Tenant's home region.
          type: string
      type: object
    RegionSubscription:
      description: |
        An object that represents your tenancy's access to a particular region (i.e., a subscription), the status of that
        access, and whether that region is the home region. For more information, see [Managing Regions](/Content/Identity/regions/managingregions.htm).

        To use any of the API operations, you must be authorized in an IAM policy. If you're not authorized,
        talk to an administrator. If you're an administrator who needs to write policies to give users access,
        see [Get Started with Policies](/Content/Identity/policiesgs/get-started-with-policies.htm).
      properties:
        isHomeRegion:
          description: Indicates if the region is the home region or not.
          type: boolean
        regionKey:
          description: |
            The region's key. See [Regions and Availability Domains](/Content/General/Concepts/regions.htm)
            for the full list of supported 3-letter region codes.

            Example: `PHX`
          maxLength: 16
          minLength: 1
          type: string
        regionName:
          description: |
            The region's name. See [Regions and Availability Domains](/Content/General/Concepts/regions.htm)
            for the full list of supported region names.

            Example: `us-phoenix-1`
          maxLength: 16
          minLength: 1
          type: string
        status:
          description: The region subscription status.
          enum:
            - READY
            - IN_PROGRESS
          type: string
      required:
        - regionKey
        - regionName
        - status
        - isHomeRegion
      type: object
    CreateRegionSubscriptionDetails:
      properties:
        regionKey:
          description: |
            The regions's key. See [Regions and Availability Domains](/Content/General/Concepts/regions.htm) for
            the full list of supported 3-letter region codes.

            Example: `PHX`
          maxLength: 16
          minLength: 1
          type: string
      required:
