      type: object
    MfaTotpDevice:
      description: |
        Users can enable multi-factor authentication (MFA) for their own user accounts. After MFA is enabled, the
        user is prompted for a time-based one-time password (TOTP) to authenticate before they can sign in to the
        Console. To enable multi-factor authentication, the user must register a mobile device with a TOTP authenticator app
        installed. The registration process creates the `MfaTotpDevice` object. The registration process requires
        interaction with the Console and cannot be completed programmatically. For more information, see
        [Managing Multi-Factor Authentication](/Content/Identity/mfa/understand-multi-factor-authentication.htm).
      properties:
        id:
          description: The OCID of the MFA TOTP device.
          type: string
        inactiveStatus:
          description: |
            The detailed status of INACTIVE lifecycleState.
            Allowed values are:
             - 1 - SUSPENDED
             - 2 - DISABLED
             - 4 - BLOCKED
             - 8 - LOCKED
          format: int64
          type: integer
        isActivated:
          description: Flag to indicate if the MFA TOTP device has been activated.
          type: boolean
        lifecycleState:
          description: |
            The MFA TOTP device's current state. After creating the MFA TOTP device, make sure its `lifecycleState` changes from
            CREATING to ACTIVE before using it.
          enum:
            - CREATING
            - ACTIVE
            - INACTIVE
            - DELETING
            - DELETED
          maxLength: 64
          minLength: 1
          type: string
        seed:
          description: |
            The seed for the MFA TOTP device (Base32 encoded).
          type: string
        timeCreated:
          description: |
            Date and time the `MfaTotpDevice` object was created, in the format defined by RFC3339.

            Example: `2016-08-25T21:10:29.600Z`
          format: date-time
          type: string
        timeExpires:
          description: |
            Date and time when this MFA TOTP device will expire, in the format defined by RFC3339.
            Null if it never expires.

            Example: `2016-08-25T21:10:29.600Z`
          format: date-time
          type: string
        userId:
          description: The OCID of the user the MFA TOTP device belongs to.
          type: string
      required:
        - id
        - seed
        - userId
        - isActivated
        - timeCreated
        - lifecycleState
      type: object
    MfaTotpToken:
      description: |
        Totp token for MFA
      properties:
        totpToken:
          description: |
            The Totp token for MFA.
          type: string
      type: object
