        particular request, please provide the request ID.
      in: header
      name: opc-request-id
      schema:
        type: string
        pattern: '[A-Za-z0-9\\-_\\.]+'
    ConfigurationCompartmentIdQueryParam:
      description: ID of the root compartment (tenancy)
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
