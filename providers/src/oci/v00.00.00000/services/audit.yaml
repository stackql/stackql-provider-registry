    Configuration:
      description: |
        The retention period setting, specified in days. For more information, see [Setting Audit
        Log Retention Period](/iaas/Content/Audit/Tasks/settingretentionperiod.htm).
      properties:
        retentionPeriodDays:
          description: |
            The retention period setting, specified in days. The minimum is 90, the maximum 365.

            Example: `90`
          type: integer
      type: object
      x-example: |
        {
          "retentionPeriodDays": 90
        }
    UpdateConfigurationDetails:
      description: |
        The configuration details for the retention period setting, specified in days. For more
        information, see [Setting Audit Log Retention Period](/iaas/Content/Audit/Tasks/settingretentionperiod.htm).
      properties:
        retentionPeriodDays:
          description: |
            The retention period setting, specified in days. The minimum is 90, the maximum 365.

            Example: `90`
          maximum: 365
          minimum: 90
          type: integer
      required:
        - retentionPeriodDays
      type: object
      x-example: |
        {
          "retentionPeriodDays": 90
        }
    data:
      description: |
        The payload of the event. Information within `data` comes from the resource emitting the event.
      properties:
        additionalDetails:
          additionalProperties:
            type: string
            description: (opaque JSON object)
          description: |
            A container object for attribues unique to the resource emitting the event.

            Example:

              -----
                {
                  "imageId": "ocid1.image.oc1.phx.<unique_ID>",
                  "shape": "VM.Standard1.1",
                  "type": "CustomerVmi"
                }
              -----
          type: object
        availabilityDomain:
          description: |
            The availability domain where the resource resides.
          maxLength: 255
          minLength: 1
          type: string
        compartmentId:
          description: |
            The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment of the resource
            emitting the event.
          maxLength: 255
          minLength: 1
          type: string
        compartmentName:
          description: |
            The name of the compartment. This value is the friendly name associated with compartmentId.
            This value can change, but the service logs the value that appeared at the time of the audit
            event.

            Example: `CompartmentA`
          maxLength: 100
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.

              Example: `{"CostCenter": "42"}'
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a namespace. For more
            information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        eventGroupingId:
          description: |
            This value links multiple audit events that are part of the same API operation. For example,
            a long running API operations that emit an event at the start and the end of an operation
            would use the same value in this field for both events.
          maxLength: 255
          minLength: 1
          type: string
        eventName:
          description: |
            Name of the API operation that generated this event.

            Example: `GetInstance`
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name,
            type, or namespace. Exists for cross-compatibility only. For more information,
            see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

