openapi: 3.0.0
info:
  title: audit API
  description: oci audit API
  version: '20190901'
paths:
  /auditEvents:
    get:
      description: |
        Returns all the audit events processed for the specified compartment within the specified
        time range.
      operationId: ListEvents
      parameters:
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/StartWithQueryParam'
        - $ref: '#/components/parameters/EndBeforeQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The list of audit events matching the specified time range.
          headers:
            opc-next-page:
              description: |
                For pagination of a list of audit events. When this header appears in the response,
                it means you received a partial list and there are more results. Include this value as the `page`
                parameter for the subsequent ListEvents request to get the next batch of events. For important
                details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEventsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: ListEvents
      tags:
        - Audit
      x-example: |
        Syntax:

        GET /20190901/auditEvents?compartmentId=<var>&lt;compartment_OCID&gt;</var>&endTime=<var>&lt;end_timestamp&gt;</var>&startTime=<var>&lt;start_timestamp&gt;</var>

        Sample:

        GET /20190901/auditEvents?compartmentId=ocid1.compartment.region1..aaaaaaaaexample5gsmzi3hnumfjzstsgkzha74uc6jzpcxlxhx33hewsq&endTime=2017-01-06T00:22:00Z&startTime=2017-01-07T00:00:00Z HTTP/1.1

        Host: audit.us-phoenix-1.oraclecloud.com
        User-Agent: Apache-HttpClient/4.5.1 (Java/1.8.0_111)
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: en-US,en;q=0.5
        Accept-Encoding: gzip, deflate
        Opc-Client-Info: Oracle-HgConsole/0.0.1
        X-Date: Wed, 01 Feb 2017 18:09:22 GMT
        Opc-Request-Id: 4a0d1960-7929-4e00-b84e-5440a007ae09
        Authorization: <var>&lt;authorization string&gt;</var>
        Connection: keep-alive
      x-related-resource: '#/definitions/AuditEvent'
  /configuration:
    get:
      description: Get the configuration
      operationId: GetConfiguration
      parameters:
        - $ref: '#/components/parameters/ConfigurationCompartmentIdQueryParam'
      responses:
        '200':
          description: The configuration properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: GetConfiguration
      tags:
        - Audit
      x-example: |
        Syntax:

        GET /20190901/configuration?compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Sample:

        GET /20190901/configuration?compartmentId=ocidv1.tenancy.oc1.phx.1457636318783.examplea3lagrhwsljxg6mk55eo2tfvxwy

        Host: audit.us-phoenix-1.oraclecloud.com
        Accept: */*
        Accept-Encoding: gzip, deflate, br
        Accept-Language: en-US,en;q=0.9
        Authorization: <var>&lt;authorization string&gt;</var>
        Connection: keep-alive
        opc-request-id: d42a4df0-9c36-45f9-b980-example94486
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/67.0.3396.99 Safari/537.36
        x-date: Mon, 09 Jul 2018 22:59:27 GMT
    put:
      description: Update the configuration
      operationId: UpdateConfiguration
      parameters:
        - $ref: '#/components/parameters/ConfigurationCompartmentIdQueryParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConfigurationDetails'
        description: The configuration properties
        required: true
      responses:
        '202':
          description: The request was accepted for processing.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a
                particular request, please provide the request ID.
              schema:
                type: string
            opc-work-request-id:
              description: |
                The [OCID](/Content/General/Concepts/identifiers.htm) of the work request.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: UpdateConfiguration
      tags:
        - Audit
      x-example: |
        Syntax:

        PUT /20190901/configuration?compartmentId=<var>&lt;compartment_OCID&gt;</var>

        {
        "retentionPeriodDays": 90
        }

        Sample:

        PUT /20190901/configuration?compartmentId=ocidv1.tenancy.oc1.phx.1457636318783.examplea3lagrhwsljxg6mk55eo2tfvxwy

        Host: audit.us-phoenix-1.oraclecloud.com
