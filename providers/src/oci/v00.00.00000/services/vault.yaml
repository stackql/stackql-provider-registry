          {
            "contentType": null,
            "name": null,
            "secretId": "ocid1.vaultsecret.region1.sea.exampleanpy7c7qa6vugpr2lcvblz7bwbzahf25fdueaivyoy5jzlexample",
            "stages": ["CURRENT", "LATEST"],
            "timeCreated": "2020-03-19T04:56:53.048Z",
            "timeOfDeletion": null,
            "timeOfExpiry": null,
            "versionNumber": 1
            ,"isContentAutoGenerated": false
          }
