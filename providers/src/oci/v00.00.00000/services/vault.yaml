    RotationConfig:
      description: Defines the frequency of the rotation and the information about the target system
      properties:
        isScheduledRotationEnabled:
          description: |
            Enables auto rotation, when set to true rotationInterval must be set.
          type: boolean
        rotationInterval:
          description: |
            The time interval that indicates the frequency for rotating secret data, as described in ISO 8601 format.
            The minimum value is 1 day and maximum value is 360 days.
            For example, if you want to set the time interval for rotating a secret data as 30 days, the duration is expressed as "P30D."
          format: x-obmcs-duration
          type: string
        targetSystemDetails:
          $ref: '#/components/schemas/TargetSystemDetails'
      required:
        - targetSystemDetails
      type: object
    SecretGenerationContext:
      description: Captures a configurable set of secret generation rules such as length, base characters, additional characters, and so on.
      discriminator:
        propertyName: generationType
      properties:
        generationType:
          description: Name of the predefined secret generation type.
          enum:
            - PASSPHRASE
            - SSH_KEY
            - BYTES
          type: string
        secretTemplate:
          description: |
            SecretTemplate captures structure in which customer wants to store secrets. This is optional and a default structure is available for each secret type. 
            The template can have any structure with static values that are not generated. Within the template, you can insert predefined placeholders to store secrets. 
            These placeholders are later replaced with the generated content and saved as a Base64 encoded content.
          type: string
      required:
        - generationType
      type: object
      x-example: |
        {
          "generationType": "SSH_KEY",
          "generationTemplate": "RSA_3072"
        }
    Error:
      description: An error.
      properties:
        code:
          description: |
            A short error code that defines the error, meant for programmatic parsing. See
            [API Errors](/Content/API/References/apierrors.htm).
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
        - code
        - message
      type: object
    SecretContentDetails:
      description: The content of the secret and metadata to help identify it.
      discriminator:
        propertyName: contentType
      properties:
        contentType:
          description: The base64-encoded content of the secret.
          enum:
            - BASE64
          type: string
        name:
          description: Names should be unique within a secret. Valid characters are uppercase or lowercase letters, numbers, hyphens, underscores, and periods.
          maxLength: 50
          type: string
        stage:
          default: CURRENT
          description: |
            The rotation state of the secret content. The default is `CURRENT`, meaning that the secret is currently in use. A secret version
            that you mark as `PENDING` is staged and available for use, but you don't yet want to rotate it into current, active use. For example,
            you might create or update a secret and mark its rotation state as `PENDING` if you haven't yet updated the secret on the target system.
            When creating a secret, only the value `CURRENT` is applicable, although the value `LATEST` is also automatically applied. When updating
            a secret, you can specify a version's rotation state as either `CURRENT` or `PENDING`.
          enum:
            - CURRENT
            - PENDING
          type: string
      required:
        - contentType
      type: object
      x-example: |
        {
          "content": "<var>&lt;secret_text&gt;</var>",
          "contentType": "BASE64",
          "stage": "PENDING"
        }
    SecretRule:
