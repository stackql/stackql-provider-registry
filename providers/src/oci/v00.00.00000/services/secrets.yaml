openapi: 3.0.0
info:
  title: secrets API
  description: Use this API to retrieve secrets and secret versions from vaults.
  version: '20190301'
paths:
  /secretbundles/actions/getByName:
    post:
      description: |
        Gets a secret bundle by secret name and vault ID, and secret version that matches either the specified `stage`, `secretVersionName`, or `versionNumber` parameter.
        If none of these parameters are provided, the bundle for the secret version marked as `CURRENT` is returned.
      operationId: GetSecretBundleByName
      parameters:
        - $ref: '#/components/parameters/SecretNameQueryParam'
        - $ref: '#/components/parameters/VaultIdQueryParam'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
        - $ref: '#/components/parameters/SecretVersionNumberQueryParam'
        - $ref: '#/components/parameters/SecretVersionNameQueryParam'
        - $ref: '#/components/parameters/StageQueryParam'
      responses:
        '200':
          description: A secret bundle.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretBundle'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Gets a secret bundle by secret name and vault ID.
      tags:
        - secrets
      x-example: |
        POST /20190301/secretbundles/actions/getByName?secretName=<var>&lt;secret_name&gt;</var>&vaultId=<var>&lt;vault_Ocid&gt;</var>
        Host: <var>&lt;secretsEndpoint&gt;</var>
        <var>&lt;authorization and other headers&gt;</var>
      x-related-resource: '#/definitions/SecretBundle'
  /secretbundles/{secretId}:
    get:
      description: |
        Gets a secret bundle that matches either the specified `stage`, `secretVersionName`, or `versionNumber` parameter.
        If none of these parameters are provided, the bundle for the secret version marked as `CURRENT` will be returned.
      operationId: GetSecretBundle
      parameters:
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
        - $ref: '#/components/parameters/SecretIdRequiredPathParam'
        - $ref: '#/components/parameters/SecretVersionNumberQueryParam'
        - $ref: '#/components/parameters/SecretVersionNameQueryParam'
        - $ref: '#/components/parameters/StageQueryParam'
      responses:
        '200':
          description: A secret bundle.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretBundle'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Gets a secret bundle.
      tags:
        - secrets
      x-example: |
        GET /20190301/secretbundles/<var>&lt;secret_OCID&gt;</var>
        Host: <var>&lt;secretsEndpoint&gt;</var>
        <var>&lt;authorization and other headers&gt;</var>
  /secretbundles/{secretId}/versions:
    get:
      description: Lists all secret bundle versions for the specified secret.
      operationId: ListSecretBundleVersions
      parameters:
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
        - $ref: '#/components/parameters/SecretIdRequiredPathParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortByQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
      responses:
        '200':
          description: A list of secret bundle version objects.
          headers:
            opc-next-page:
              description: |
                For pagination of a list of items. When paging through a list, if this header appears in the response,
                then there are additional items still to get. Include this value as the `page` parameter for the
                subsequent GET request. For information about pagination, see
                [List Pagination](/Content/API/Concepts/usingapi.htm#List_Pagination).
              schema:
                type: string
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretBundleVersionsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Lists all secret bundle versions.
      tags:
        - secrets
      x-example: |
        GET /20190301/secretbundles/<var>&lt;secret_OCID&gt;</var>/versions
        Host: <var>&lt;secretsEndpoint&gt;</var>
        <var>&lt;authorization and other headers&gt;</var>
      x-related-resource: '#/definitions/SecretBundleVersionSummary'
components:
  schemas:
    SecretBundle:
      description: |
        The contents of the secret, properties of the secret (and secret version), and user-provided contextual metadata for the secret.
      properties:
        metadata:
          additionalProperties:
            type: string
            description: (opaque JSON object)
          description: |
            Customer-provided contextual metadata for the secret.
          type: object
        secretBundleContent:
          $ref: '#/components/schemas/SecretBundleContentDetails'
        secretId:
          description: The OCID of the secret.
          type: string
        stages:
          description: A list of possible rotation states for the secret version.
          items:
            enum:
              - CURRENT
              - PENDING
              - LATEST
              - PREVIOUS
              - DEPRECATED
            type: string
            x-obmcs-inline-enum: true
          type: array
        timeCreated:
          description: The time when the secret bundle was created.
          format: date-time
          type: string
        timeOfDeletion:
          description: |
            An optional property indicating when to delete the secret version, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.
            Example: `2019-04-03T21:10:29.600Z`
          format: date-time
          type: string
        timeOfExpiry:
          description: |
            An optional property indicating when the secret version will expire, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.
            Example: `2019-04-03T21:10:29.600Z`
          format: date-time
          type: string
        versionName:
          description: |
            The name of the secret version. Labels are unique across the different versions of a particular secret.
          type: string
        versionNumber:
          description: The version number of the secret.
          format: int64
          type: integer
      required:
        - secretId
        - versionNumber
      type: object
      x-example: |
        {
          "secretId" : "ocid1.vaultsecret.oc1.iad.exampleaz5qacpqadubrc4wwugrqmw5dnyzvcxwzds6er5enn2oamexample",
          "timeCreated" : "2020-03-18T16:51:38.851Z",
          "versionNumber" : 1,
          "versionName" : null,
          "secretBundleContent" : {
            "contentType" : "BASE64",
            "content" : "aGVsbG8h"
          },
          "timeOfDeletion" : null,
          "timeOfExpiry" : null,
          "stages" : [ "CURRENT", "LATEST" ],
          "metadata" : null
        }
    SecretBundleVersionSummary:
      description: |
        The properties of the secret bundle. (Secret bundle version summary objects do not include the actual contents of the secret.)
      properties:
        secretId:
          description: The OCID of the secret.
          type: string
        stages:
          description: A list of possible rotation states for the secret bundle.
          items:
            enum:
              - CURRENT
              - PENDING
              - LATEST
              - PREVIOUS
              - DEPRECATED
            type: string
            x-obmcs-inline-enum: true
          type: array
        timeCreated:
          description: The time when the secret bundle was created.
          format: date-time
          type: string
        timeOfDeletion:
          description: |
            An optional property indicating when to delete the secret version, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.
            Example: `2019-04-03T21:10:29.600Z`
          format: date-time
          type: string
        timeOfExpiry:
          description: |
            An optional property indicating when the secret version will expire, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.
            Example: `2019-04-03T21:10:29.600Z`
          format: date-time
          type: string
        versionName:
          description: |
            The version name of the secret bundle, as provided when the secret was created or last rotated.
          type: string
        versionNumber:
          description: The version number of the secret.
          format: int64
          type: integer
      required:
        - secretId
        - versionNumber
      type: object
      x-example: |
        [
          {
            "secretId": "ocid1.vaultsecret.oc1.iad.exampleaz5qacpqadubrc4wwugrqmw5dnyzvcxwzds6er5enn2oamexample",
            "timeCreated": "2020-03-18T16:51:38.851Z",
            "versionNumber": 1,
            “versionName” : null,
            “timeOfDeletion” : null,
            “timeOfExpiry” : null,
            “stages” : [ “CURRENT”, “LATEST” ]
          }
        ]
    SecretBundleContentDetails:
      description: The contents of the secret.
      discriminator:
        propertyName: contentType
      properties:
        contentType:
          description: The formatting type of the secret contents.
          enum:
            - BASE64
          type: string
          x-obmcs-inline-enum: true
      required:
        - contentType
      type: object
      x-example: |
        {
          "contentType": "BASE64"
        }
    Error:
      description: An error.
      properties:
        code:
          description: |
            A short error code that defines the error, meant for programmatic parsing. See
            [API Errors](/Content/API/References/apierrors.htm).
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
        - code
        - message
      type: object
    ListSecretBundleVersionsResponse:
      type: object
      properties:
        secret_bundle_versions:
          type: array
          items:
            $ref: '#/components/schemas/SecretBundleVersionSummary'
  responses:
    '400':
      $ref: '#/components/responses/Error'
    '401':
      $ref: '#/components/responses/Error'
    '404':
      $ref: '#/components/responses/Error'
    '429':
      $ref: '#/components/responses/Error'
    '500':
      $ref: '#/components/responses/Error'
    DefaultError:
      $ref: '#/components/responses/Error'
    Error:
      description: An error response.
      headers:
        opc-request-id:
          description: Unique identifier for the request.
          schema:
            type: string
      content:
        '*/*':
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    SecretNameQueryParam:
      description: A user-friendly name for the secret. Secret names are unique within a vault. Secret names are case-sensitive.
      in: query
      name: secretName
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    VaultIdQueryParam:
      description: The OCID of the vault that contains the secret.
      in: query
      name: vaultId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    OpcRequestIdHeaderParam:
      description: Unique identifier for the request.
      in: header
      name: opc-request-id
      required: false
      schema:
        type: string
    SecretVersionNumberQueryParam:
      description: The version number of the secret.
      in: query
      name: versionNumber
      required: false
      x-default-description: The default value is `0`, which indicates a non-existent version.
      schema:
        type: integer
        format: int64
        default: 0
    SecretVersionNameQueryParam:
      description: The name of the secret. (This might be referred to as the name of the secret version. Names are unique across the different versions of a secret.)
      in: query
      name: secretVersionName
      required: false
      x-default-description: The default value is null.
      schema:
        type: string
    StageQueryParam:
      description: The rotation state of the secret version.
      in: query
      name: stage
      required: false
      x-default-description: The default value is null.
      x-obmcs-inline-enum: true
      schema:
        type: string
        enum:
          - CURRENT
          - PENDING
          - LATEST
          - PREVIOUS
          - DEPRECATED
    SecretIdRequiredPathParam:
      description: The OCID of the secret.
      in: path
      name: secretId
      required: true
      schema:
        type: string
    PaginationLimitQueryParam:
      description: |
        The maximum number of items to return in a paginated "List" call. For information about pagination, see
        [List Pagination](../../../#API/Concepts/usingapi.htm#List_Pagination).
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
    PaginationTokenQueryParam:
      description: |
        The value of the `opc-next-page` response header from the previous "List" call. For information about
        pagination, see [List Pagination](../../../#API/Concepts/usingapi.htm#List_Pagination).
      in: query
      name: page
      x-default-description: The default value is null.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    SortByQueryParam:
      description: |
        The field to sort by. You can specify only one sort order. The default
        order for `VERSION_NUMBER` is descending.
      in: query
      name: sortBy
      required: false
      schema:
        type: string
        enum:
          - VERSION_NUMBER
        default: VERSION_NUMBER
    SortOrderQueryParam:
      description: |
        The sort order to use, either ascending (`ASC`) or descending (`DESC`).
      in: query
      name: sortOrder
      required: false
      x-obmcs-inline-enum: true
      schema:
        type: string
        enum:
          - ASC
          - DESC
        default: DESC
  x-stackQL-resources:
    secretbundles:
      id: oci.secrets.secretbundles
      name: secretbundles
      title: Secretbundles
      methods:
        get_secret_bundle_by_name:
          operation:
            $ref: '#/paths/~1secretbundles~1actions~1getByName/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select: []
        insert: []
        update: []
        delete: []
        replace: []
    secret_bundles:
      id: oci.secrets.secret_bundles
      name: secret_bundles
      title: Secret Bundles
      methods:
        get:
          operation:
            $ref: '#/paths/~1secretbundles~1{secretId}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/secret_bundles/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
    secret_bundle_versions:
      id: oci.secrets.secret_bundle_versions
      name: secret_bundle_versions
      title: Secret Bundle Versions
      methods:
        list:
          operation:
            $ref: '#/paths/~1secretbundles~1{secretId}~1versions/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.secret_bundle_versions
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/ListSecretBundleVersionsResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"secret_bundle_versions\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          config:
            queryParamPushdown:
              top:
                paramName: limit
                maxValue: 1000
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/secret_bundle_versions/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://secrets.vaults.{region}.oci.oraclecloud.com/20190301
    variables:
      region:
        default: us-ashburn-1
        description: OCI region identifier (e.g. us-ashburn-1, ap-sydney-1); resolves from OCI_REGION when not supplied in the query.
        x-stackQL-envVar: OCI_REGION
x-stackQL-config:
  pagination:
    requestToken:
      key: page
      location: query
    responseToken:
      key: opc-next-page
      location: header
