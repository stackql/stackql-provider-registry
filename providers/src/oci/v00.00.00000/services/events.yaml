        }
  /rules/{ruleId}/actions/changeCompartment:
    post:
      description: |
        Moves a rule into a different compartment within the same tenancy. For information about moving 
        resources between compartments, see [Moving Resources to a Different Compartment](/iaas/Content/Identity/Tasks/managingcompartments.htm#moveRes).
      operationId: ChangeRuleCompartment
      parameters:
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
        - $ref: '#/components/parameters/RetryTokenHeader'
        - $ref: '#/components/parameters/RuleIdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRuleCompartmentDetails'
        required: true
      responses:
        '204':
          description: Response returned for a successful change compartment request.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      summary: Moves a rule into a different compartment. When provided, If-Match is checked against ETag values of the resource.
      tags:
        - events
      x-related-resource: '#/definitions/Rule'
components:
  schemas:
    RuleSummary:
      description: |
        The summary details of rules for Events. For more information, see
        [Managing Rules for Events](/iaas/Content/Events/Task/managingrules.htm).
      properties:
        compartmentId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to which this rule belongs.
          maxLength: 1024
          minLength: 1
          type: string
        condition:
          description: |
            A filter that specifies the event that will trigger actions associated with this rule. A few 
            important things to remember about filters:

            * Fields not mentioned in the condition are ignored. You can create a valid filter that matches
            all events with two curly brackets: `{}` 

              For more examples, see 
            [Matching Events with Filters](/iaas/Content/Events/Concepts/filterevents.htm).       
            * For a condition with fields to match an event, the event must contain all the field names 
            listed in the condition. Field names must appear in the condition with the same nesting 
            structure used in the event. 

              For a list of reference events, see 
            [Services that Produce Events](/iaas/Content/Events/Reference/eventsproducers.htm).       
            * Rules apply to events in the compartment in which you create them and any child compartments. 
            This means that a condition specified by a rule only matches events emitted from resources in 
            the compartment or any of its child compartments. 
            * Wildcard matching is supported with the asterisk (*) character. 

              For examples of wildcard matching, see 
            [Matching Events with Filters](/iaas/Content/Events/Concepts/filterevents.htm)

            Example: `\"eventType\": \"com.oraclecloud.databaseservice.autonomous.database.backup.end\"`
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.

              Example: `{"CostCenter": "42"}'
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        description:
          description: |
            A string that describes the details of the rule. It does not have to be unique, and you can change it. Avoid entering
            confidential information.
          maxLength: 1024
          minLength: 0
          type: string
        displayName:
          description: |
            A string that describes the rule. It does not have to be unique, and you can change it. Avoid entering
            confidential information.

            Example: `"This rule sends a notification upon completion of DbaaS backup."`
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace. Exists for cross-compatibility only.
            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Department": "Finance"}`
          type: object
        id:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of this rule.
          maxLength: 1024
          minLength: 1
          type: string
        isEnabled:
          default: true
          description: |
            Whether or not this rule is currently enabled.

            Example: `true`
          type: boolean
        lifecycleState:
          type: string
          x-obmcs-enumref: '#/definitions/Rule/lifecycleState'
        timeCreated:
          description: |
            The time this rule was created, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339)
            timestamp format.

            Example: `2018-09-12T22:47:12.613Z`
          format: date-time
          type: string
      required:
        - id
        - displayName
        - lifecycleState
        - condition
        - compartmentId
        - isEnabled
        - timeCreated
      type: object
      x-example: |
        {
          "displayName": "This rule sends a notification upon completion of DbaaS backup",
          "lifecycleState": "CREATING",
          "condition": "{
              \"eventType\": \"com.oraclecloud.databaseservice.autonomous.database.backup.end\"
              }",
          "compartmentId": "ocid.compartment.oc1..<var>&lt;unique_ID&gt;</var>",
          "isEnabled": true,
          "id": "ocid.rule.oc1..<var>&lt;unique_ID&gt;</var>",
          "timeCreated": "2018-09-12T22:47:12.613Z",
          "freeformTags": {
            "Department": "Finance"
            },
          "definedTags": {
            "Operations": {
              "CostCenter": "42"
            },
        }
    CreateRuleDetails:
      description: Object used to create an events1.0 rule and events2.0 system rule.
