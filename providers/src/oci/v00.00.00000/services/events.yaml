openapi: 3.0.0
info:
  title: events API
  description: oci events API
  version: '20181201'
paths:
  /rules:
    get:
      description: |
        Lists rules for this compartment.
      operationId: ListRules
      parameters:
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/ListRulesFilterByLifecycleStateQueryParam'
        - description: |
            A filter to return only rules with descriptions that match the displayName string
            in this parameter.

            Example: `"This rule sends a notification upon completion of DbaaS backup."`
          in: query
          name: displayName
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - description: |
            Specifies the attribute with which to sort the rules.

            Default: `timeCreated`

            * **TIME_CREATED:** Sorts by timeCreated.
            * **DISPLAY_NAME:** Sorts by displayName.
            * **ID:** Sorts by id.
          in: query
          name: sortBy
          required: false
          schema:
            type: string
            enum:
              - TIME_CREATED
              - ID
              - DISPLAY_NAME
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        '200':
          description: Succesfully retrieved summary of rules.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages of
                results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRulesResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Lists rules for this compartment.
      tags:
        - events
      x-example: |
        GET /20181201/rules?compartmentId=<var>&lt;compartment_OCID&gt;</var>
        Host: events.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
    post:
      description: |
        Creates a new rule.
      operationId: CreateRule
      parameters:
        - $ref: '#/components/parameters/RetryTokenHeader'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleDetails'
        description: Specification of the rule to create
        required: true
      responses:
        '200':
          description: Succesfully created rule.
          headers:
            etag:
              description: |
                For optimistic concurrency control. Add this value to the `if-match` parameter
                in a PUT or DELETE operation. The resource will be updated only if the value you
                provide matches the `etag` on the resource.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Creates a new rule
      tags:
        - events
      x-example: |
        POST /20181201/rules
        Host: events.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>

        {
          "displayName": "This rule sends a notification upon completion of DbaaS backup",
          "condition": "{
            \"eventType\": \"com.oraclecloud.databaseservice.autonomous.database.backup.end\"
            }",
          "compartmentId": "ocid.compartment.oc1..<var>&lt;unique_ID&gt;</var>",
          "isEnabled": true,
          "freeformTags": {
            "Department": "Finance"
            },
          "definedTags": {
            Operations": {
              "CostCenter": "42"
            },
          "actions": {
            "actions": [
              {
                "actionType": "ONS",
                "id": "ocid.action.oc1..<var>&lt;unique_ID&gt;</var>",
                "lifecycleMessage":null,
                "lifecycleState": "CREATING"
              }
            ]
          }
        }
  /rules/{ruleId}:
    delete:
      description: Deletes a rule.
      operationId: DeleteRule
      parameters:
        - $ref: '#/components/parameters/RuleIdPathParam'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        '204':
          description: Rule deleted successfully.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request ID.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Deletes a rule
      tags:
        - events
      x-example: |
        DELETE /20181201/rules/<var>&lt;rule_OCID&gt;</var>
        Host: events.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
      x-related-resource: '#/definitions/Rule'
    get:
      description: Retrieves a rule.
      operationId: GetRule
      parameters:
        - $ref: '#/components/parameters/RuleIdPathParam'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        '200':
          description: Succesfully retrieved rule.
          headers:
            etag:
              description: |
                For optimistic concurrency control. Add this value to the `if-match` parameter
                in a PUT or DELETE operation. The resource will be updated only if the value you
                provide matches the `etag` on the resource.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Retrieves a rule
      tags:
        - events
      x-example: |
        GET /20181201/rules/<var>&lt;rule_OCID&gt;</var>
        Host: events.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
    put:
      description: |
        Updates a rule.
      operationId: UpdateRule
      parameters:
        - $ref: '#/components/parameters/RuleIdPathParam'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuleDetails'
        description: The new rule spec to apply
        required: true
      responses:
        '200':
          description: |
            Succesfully updated rule.
          headers:
            etag:
              description: |
                For optimistic concurrency control. Add this value to the `if-match` parameter
                in a PUT or DELETE operation. The resource will be updated only if the value you
                provide matches the `etag` on the resource.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '412':
          $ref: '#/components/responses/412'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Updates a rule
      tags:
        - events
      x-example: |
        PUT /20181201/rules/<var>&lt;rule_OCID&gt;</var>
        Host: events.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>

        {
          "displayName": "This rule sends a notification upon completion of DbaaS backup",
          "condition": "{
            \"eventType\": \"com.oraclecloud.databaseservice.autonomous.database.backup.end\"
            }",
          "isEnabled": true,
          "freeformTags": {
            "Department": "Finance"
            },
          "definedTags": {
            Operations": {
              "CostCenter": "42"
            },
          "actions": {
            "actions": [
              {
                "actionType": "ONS",
                "id": "ocid.action.oc1..<var>&lt;unique_ID&gt;</var>",
                "lifecycleMessage":null,
                "lifecycleState": "CREATING"
