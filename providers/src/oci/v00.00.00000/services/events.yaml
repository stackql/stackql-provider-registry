      type: object
      x-example: |
        {
          "actions": { }
        }
    ActionDetails:
      description: |
        Object used to create an action.
      discriminator:
        propertyName: actionType
      properties:
        actionType:
          description: |
            The action to perform if the condition in the rule matches an event.

            * **ONS:** Send to an Oracle Notification Service topic.
            * **OSS:** Send to a stream from Oracle Streaming Service.
            * **FAAS:** Send to an Oracle Functions Service endpoint.
          enum:
            - ONS
            - OSS
            - FAAS
          type: string
        description:
          description: |
            A string that describes the details of the action. It does not have to be unique, and you can change it. Avoid entering
            confidential information.
          maxLength: 1024
          minLength: 0
          type: string
        isEnabled:
          default: true
          description: |
            Whether or not this action is currently enabled.

            Example: `true`
          type: boolean
      required:
        - actionType
        - isEnabled
      type: object
      x-example: |
        {
          "actionType": "ONS",
          "isEnabled": true,
          "description": "Notification action"      
        }
    Action:
      description: |
        An object that represents an action to trigger for events that match a rule.
      discriminator:
        propertyName: actionType
      properties:
        actionType:
          description: |
            The action to perform if the condition in the rule matches an event.

            * **ONS:** Send to an Oracle Notification Service topic.
            * **OSS:** Send to a stream from Oracle Streaming Service.
            * **FAAS:** Send to an Oracle Functions Service endpoint.
          enum:
            - ONS
            - OSS
            - FAAS
          type: string
        description:
          description: |
            A string that describes the details of the action. It does not have to be unique, and you can change it. Avoid entering
            confidential information.
          maxLength: 1024
          minLength: 0
          type: string
        id:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the action.
          maxLength: 1024
          minLength: 1
          type: string
        isEnabled:
          default: true
          description: |
            Whether or not this action is currently enabled.

            Example: `true`
          type: boolean
        lifecycleMessage:
          description: |
            A message generated by the Events service about the current state of this action.
          type: string
        lifecycleState:
          description: |
            The current state of the rule.
          enum:
            - CREATING
            - ACTIVE
            - INACTIVE
            - UPDATING
            - DELETING
            - DELETED
            - FAILED
          type: string
      required:
        - actionType
        - id
        - lifecycleState
        - lifecycleMessage
      type: object
      x-example: |
        {
          "actions": [
            {
              "actionType": "ONS",
              "id": "ocid.action.oc1..<var>&lt;unique_ID&gt;</var>",
              "lifecycleMessage":null,
              "lifecycleState": "CREATING"
            }
          ]
        }    
