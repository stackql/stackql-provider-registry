              schema:
                type: string
            opc-work-request-id:
              description: |
                The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
                Use [GetWorkRequest](/api/#/en/workrequests/latest/WorkRequest/GetWorkRequest)
                with this ID to track the status of the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
