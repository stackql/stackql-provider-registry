            * `BIOS` - Boot VM using BIOS style firmware. This is compatible with both 32 bit and 64 bit operating
            systems that boot using MBR style bootloaders.
            * `UEFI_64` - Boot VM using UEFI style firmware compatible with 64 bit operating systems. This is the
            default for platform images.
          enum:
            - BIOS
            - UEFI_64
          type: string
        isConsistentVolumeNamingEnabled:
          description: Whether to enable consistent volume naming feature. Defaults to false.
          type: boolean
        isPvEncryptionInTransitEnabled:
          description: |
            Deprecated. Instead use `isPvEncryptionInTransitEnabled` in
            [LaunchInstanceDetails](#/en/iaas/latest/datatypes/LaunchInstanceDetails).
          type: boolean
        networkType:
          description: |
            Emulation type for the physical network interface card (NIC).
            * `E1000` - Emulated Gigabit ethernet controller. Compatible with Linux e1000 network driver.
            * `VFIO` - Direct attached Virtual Function network controller. This is the networking type
            when you launch an instance using hardware-assisted (SR-IOV) networking.
            * `PARAVIRTUALIZED` - VM instances launch with paravirtualized devices using VirtIO drivers.
            * `ACCELERATEDPV` - VM instances launch with accelerated paravirtualized networking type.
          enum:
            - E1000
            - VFIO
            - PARAVIRTUALIZED
            - ACCELERATEDPV
          type: string
        remoteDataVolumeType:
          description: |
            Emulation type for volume.
            * `ISCSI` - ISCSI attached block storage device.
            * `SCSI` - Emulated SCSI disk.
            * `IDE` - Emulated IDE disk.
            * `VFIO` - Direct attached Virtual Function storage. This is the default option for local data
            volumes on platform images.
            * `PARAVIRTUALIZED` - Paravirtualized disk. This is the default for boot volumes and remote block
            storage volumes on platform images.
          enum:
            - ISCSI
            - SCSI
            - IDE
            - VFIO
            - PARAVIRTUALIZED
          type: string
      type: object
    ImageSourceDetails:
      discriminator:
        propertyName: sourceType
      properties:
        operatingSystem:
          maxLength: 255
          minLength: 1
          type: string
        operatingSystemVersion:
          maxLength: 255
          minLength: 1
          type: string
        sourceImageType:
          description: |
            The format of the image to be imported. Only monolithic
            images are supported. This attribute is not used for exported Oracle images with the OCI image format.
          enum:
            - QCOW2
            - VMDK
          type: string
        sourceType:
          description: |
            The source type for the image. Use `objectStorageTuple` when specifying the namespace,
            bucket name, and object name. Use `objectStorageUri` when specifying the Object Storage URL.
          type: string
      required:
        - sourceType
      type: object
    ImageMemoryConstraints:
      description: For a flexible image and shape, the amount of memory supported for instances that use this image.
      properties:
        maxInGBs:
          description: The maximum amount of memory, in gigabytes.
          minimum: 0
          type: integer
        minInGBs:
          description: The minimum amount of memory, in gigabytes.
          minimum: 0
          type: integer
      type: object
    ImageOcpuConstraints:
      description: OCPU options for an image and shape.
      properties:
        max:
          description: The maximum number of OCPUs supported for this image and shape.
          minimum: 0
          type: integer
        min:
          description: The minimum number of OCPUs supported for this image and shape.
          minimum: 0
          type: integer
      type: object
    InstanceAgentConfig:
      description: Configuration options for the Oracle Cloud Agent software running on the instance.
      properties:
        areAllPluginsDisabled:
          default: false
          description: |
            Whether Oracle Cloud Agent can run all of the available plugins.
            This includes the management and monitoring plugins.

            For more information about the available plugins, see
            [Managing Plugins with Oracle Cloud Agent](/iaas/Content/Compute/Tasks/manage-plugins.htm).
          type: boolean
        isManagementDisabled:
          default: false
          description: |
            Whether Oracle Cloud Agent can run all the available management plugins.

            These are the management plugins: OS Management Service Agent and Compute Instance
            Run Command.

            The management plugins are controlled by this parameter and by the per-plugin
            configuration in the `pluginsConfig` object.

            - If `isManagementDisabled` is true, all of the management plugins are disabled, regardless of
            the per-plugin configuration.
            - If `isManagementDisabled` is false, all of the management plugins are enabled. You
            can optionally disable individual management plugins by providing a value in the `pluginsConfig`
            object.
          type: boolean
        isMonitoringDisabled:
          default: false
          description: |
            Whether Oracle Cloud Agent can gather performance metrics and monitor the instance using the
            monitoring plugins.

            These are the monitoring plugins: Compute Instance Monitoring
            and Custom Logs Monitoring.

            The monitoring plugins are controlled by this parameter and by the per-plugin
            configuration in the `pluginsConfig` object.

            - If `isMonitoringDisabled` is true, all of the monitoring plugins are disabled, regardless of
            the per-plugin configuration.
            - If `isMonitoringDisabled` is false, all of the monitoring plugins are enabled. You
            can optionally disable individual monitoring plugins by providing a value in the `pluginsConfig`
            object.
          type: boolean
        pluginsConfig:
          description: The configuration of plugins associated with this instance.
          items:
            $ref: '#/components/schemas/InstanceAgentPluginConfigDetails'
          maxLength: 128
          type: array
      type: object
    InstanceAvailabilityConfig:
      description: |
        Options for defining the availabiity of a VM instance after a maintenance event that impacts the underlying hardware.
      properties:
        isLiveMigrationPreferred:
          description: |
            Whether to live migrate supported VM instances to a healthy physical VM host without
            disrupting running instances during infrastructure maintenance events. If null, Oracle
            chooses the best option for migrating the VM during infrastructure maintenance events.
          type: boolean
        recoveryAction:
          default: RESTORE_INSTANCE
          description: |
            The lifecycle state for an instance when it is recovered after infrastructure maintenance.
            * `RESTORE_INSTANCE` - The instance is restored to the lifecycle state it was in before the maintenance event.
            If the instance was running, it is automatically rebooted. This is the default action when a value is not set.
            * `STOP_INSTANCE` - The instance is recovered in the stopped state.
          enum:
            - RESTORE_INSTANCE
            - STOP_INSTANCE
          type: string
      type: object
    InstanceOptions:
      description: Optional mutable instance options
      properties:
        areLegacyImdsEndpointsDisabled:
          description: |
            Whether to disable the legacy (/v1) instance metadata service endpoints.
            Customers who have migrated to /v2 should set this to true for added security.
            Default is false.
          type: boolean
      type: object
    LicensingConfig:
      description: Configuration of the Operating System license.
      properties:
        licenseType:
          description: |
            License Type for the OS license.
            * `OCI_PROVIDED` - OCI provided license (e.g. metered $/OCPU-hour).
            * `BRING_YOUR_OWN_LICENSE` - Bring your own license.
          enum:
            - OCI_PROVIDED
            - BRING_YOUR_OWN_LICENSE
          type: string
        osVersion:
          description: The Operating System version of the license config.
          type: string
        type:
          description: Operating System type of the Configuration.
          enum:
            - WINDOWS
          type: string
      type: object
    PlatformConfig:
      description: |
        The platform configuration for the instance.
      discriminator:
        propertyName: type
      properties:
        isMeasuredBootEnabled:
          default: false
          description: |
            Whether the Measured Boot feature is enabled on the instance.
          type: boolean
        isMemoryEncryptionEnabled:
          default: false
          description: |
            Whether the instance is a confidential instance. If this value is `true`, the instance is a confidential instance. The default value is `false`.
          type: boolean
        isSecureBootEnabled:
          default: false
          description: |
            Whether Secure Boot is enabled on the instance.
          type: boolean
        isTrustedPlatformModuleEnabled:
          default: false
          description: |
            Whether the Trusted Platform Module (TPM) is enabled on the instance.
          type: boolean
        type:
          description: |
            The type of platform being configured.
          enum:
            - AMD_MILAN_BM
            - AMD_MILAN_BM_GPU
            - AMD_ROME_BM
            - AMD_ROME_BM_GPU
            - GENERIC_BM
            - INTEL_ICELAKE_BM
            - INTEL_SKYLAKE_BM
            - AMD_VM
            - INTEL_VM
          type: string
      required:
        - type
      type: object
    PreemptibleInstanceConfigDetails:
      description: |
        Configuration options for preemptible instances.
      properties:
        preemptionAction:
          $ref: '#/components/schemas/PreemptionAction'
      required:
        - preemptionAction
      type: object
    InstanceShapeConfig:
      description: |
        The shape configuration for an instance. The shape configuration determines
        the resources allocated to an instance.
      properties:
        baselineOcpuUtilization:
          description: |
            The baseline OCPU utilization for a subcore burstable VM instance. Leave this attribute blank for a
            non-burstable instance, or explicitly specify non-burstable with `BASELINE_1_1`.

            The following values are supported:
            - `BASELINE_1_8` - baseline usage is 1/8 of an OCPU.
            - `BASELINE_1_2` - baseline usage is 1/2 of an OCPU.
            - `BASELINE_1_1` - baseline usage is the entire OCPU. This represents a non-burstable instance.
          enum:
            - BASELINE_1_8
            - BASELINE_1_2
            - BASELINE_1_1
          type: string
        gpuDescription:
          description: |
            A short description of the instance's graphics processing unit (GPU).

            If the instance does not have any GPUs, this field is `null`.
          type: string
        gpus:
          description: |
            The number of GPUs available to the instance.
          minimum: 0
          type: integer
        localDiskDescription:
          description: |
            A short description of the local disks available to this instance.

            If the instance does not have any local disks, this field is `null`.
          maxLength: 255
          minLength: 1
          type: string
        localDisks:
          description: |
            The number of local disks available to the instance.
          minimum: 0
          type: integer
        localDisksTotalSizeInGBs:
          description: |
            The aggregate size of all local disks, in gigabytes.

            If the instance does not have any local disks, this field is `null`.
          format: float
          minimum: 0
          type: number
        maxVnicAttachments:
          description: |
            The maximum number of VNIC attachments for the instance.
          minimum: 0
          type: integer
        memoryInGBs:
          description: |
            The total amount of memory available to the instance, in gigabytes.
          format: float
          minimum: 0
          type: number
        networkingBandwidthInGbps:
          description: |
            The networking bandwidth available to the instance, in gigabits per second.
          format: float
          minimum: 0
          type: number
        ocpus:
          description: |
            The total number of OCPUs available to the instance.
          format: float
          minimum: 0
          type: number
        processorDescription:
          description: |
            A short description of the instance's processor (CPU).
          maxLength: 255
          minLength: 1
          type: string
        resourceManagement:
          description: |
            This field is reserved for internal use.
          enum:
            - DYNAMIC
            - STATIC
          type: string
        vcpus:
          description: |
            The total number of VCPUs available to the instance. This can be used instead of OCPUs,
            in which case the actual number of OCPUs will be calculated based on this value
            and the actual hardware. This must be a multiple of 2.
          format: int32
          minimum: 0
          type: integer
      type: object
    InstanceSourceDetails:
      discriminator:
        propertyName: sourceType
      properties:
        sourceType:
          description: |
            The source type for the instance.
            Use `image` when specifying the image OCID. Use `bootVolume` when specifying
            the boot volume OCID.
          type: string
      required:
        - sourceType
      type: object
    InstancePoolLifecycleManagementDetails:
      description: |
        The lifecycle management options for the instance pool.
      properties:
        lifecycleActions:
          $ref: '#/components/schemas/InstancePoolLifecycleActionsDetails'
      required:
        - lifecycleActions
      type: object
    CreateInstancePoolPlacementConfigurationDetails:
      description: The location for where an instance pool will place instances.
      properties:
        availabilityDomain:
          description: |
            The availability domain to place instances.

            Example: `Uocm:PHX-AD-1`
          maxLength: 255
          minLength: 1
          type: string
        computeClusterId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the
            [compute cluster](/iaas/Content/Compute/Tasks/compute-clusters.htm) that the instance will be created in.

            Make sure the compute cluster belongs to the same availability domain as specified in placement configuration otherwise the request will be rejected with 400.
            Once this field is set, it cannot be updated. Also any update to the availability domain in placement configuration will be blocked.
          maxLength: 255
          minLength: 1
          type: string
          x-default-description: 'null'
        faultDomains:
          description: |
            The fault domains to place instances.

            If you don't provide any values, the system makes a best effort to distribute
            instances across all fault domains based on capacity.

            To distribute the instances evenly across selected fault domains, provide a
            set of fault domains. For example, you might want instances to be evenly
            distributed if your applications require high availability.

            To get a list of fault domains, use the
            [ListFaultDomains](#/en/identity/20160918/FaultDomain/ListFaultDomains) operation
            in the Identity and Access Management Service API.

            Example: `[FAULT-DOMAIN-1, FAULT-DOMAIN-2, FAULT-DOMAIN-3]`
          items:
            type: string
          type: array
          uniqueItems: true
        primarySubnetId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the primary subnet in which to place instances. This field is deprecated.
            Use `primaryVnicSubnets` instead to set VNIC data for instances in the pool.
          maxLength: 255
          minLength: 1
          type: string
        primaryVnicSubnets:
          $ref: '#/components/schemas/InstancePoolPlacementPrimarySubnet'
        secondaryVnicSubnets:
          description: The set of secondary VNIC data for instances in the pool.
          items:
            $ref: '#/components/schemas/InstancePoolPlacementSecondaryVnicSubnet'
          type: array
          uniqueItems: true
      required:
        - availabilityDomain
      type: object
    InstancePoolPlacementConfiguration:
      description: The location for where an instance pool will place instances.
      properties:
        availabilityDomain:
          description: |
            The availability domain to place instances.

            Example: `Uocm:PHX-AD-1`
          maxLength: 255
          minLength: 1
          type: string
        computeClusterId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the
            [compute cluster](/iaas/Content/Compute/Tasks/compute-clusters.htm) that the instance will be created in.
          maxLength: 255
          minLength: 1
          type: string
          x-default-description: 'null'
        faultDomains:
          description: |
            The fault domains to place instances.

            If you don't provide any values, the system makes a best effort to distribute
            instances across all fault domains based on capacity.

            To distribute the instances evenly across selected fault domains, provide a
            set of fault domains. For example, you might want instances to be evenly
            distributed if your applications require high availability.

            To get a list of fault domains, use the
            [ListFaultDomains](#/en/identity/20160918/FaultDomain/ListFaultDomains) operation
            in the Identity and Access Management Service API.

            Example: `[FAULT-DOMAIN-1, FAULT-DOMAIN-2, FAULT-DOMAIN-3]`
          items:
            type: string
          type: array
          uniqueItems: true
        primarySubnetId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the primary subnet in which to place instances. This field is deprecated.
            Use `primaryVnicSubnets` instead to set VNIC data for instances in the pool.
          maxLength: 255
          minLength: 1
          type: string
        primaryVnicSubnets:
          $ref: '#/components/schemas/InstancePoolPlacementPrimarySubnet'
        secondaryVnicSubnets:
          description: The set of secondary VNIC data for instances in the pool.
          items:
            $ref: '#/components/schemas/InstancePoolPlacementSecondaryVnicSubnet'
          type: array
          uniqueItems: true
      required:
        - availabilityDomain
      type: object
    UpdateInstancePoolPlacementConfigurationDetails:
      description: The location for where an instance pool will place instances.
      properties:
        availabilityDomain:
          description: |
            The availability domain to place instances.

            Example: `Uocm:PHX-AD-1`
          maxLength: 255
          minLength: 1
          type: string
        faultDomains:
          description: |
            The fault domains to place instances.

            If you don't provide any values, the system makes a best effort to distribute
            instances across all fault domains based on capacity.

            To distribute the instances evenly across selected fault domains, provide a
            set of fault domains. For example, you might want instances to be evenly
            distributed if your applications require high availability.

            To get a list of fault domains, use the
            [ListFaultDomains](#/en/identity/20160918/FaultDomain/ListFaultDomains) operation
            in the Identity and Access Management Service API.

            Example: `[FAULT-DOMAIN-1, FAULT-DOMAIN-2, FAULT-DOMAIN-3]`
          items:
            type: string
          type: array
          uniqueItems: true
        primarySubnetId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the primary subnet in which to place instances. This field is deprecated.
            Use `primaryVnicSubnets` instead to set VNIC data for instances in the pool.
          maxLength: 255
          minLength: 1
          type: string
        primaryVnicSubnets:
          $ref: '#/components/schemas/InstancePoolPlacementPrimarySubnet'
        secondaryVnicSubnets:
          description: The set of secondary VNIC data for instances in the pool.
          items:
            $ref: '#/components/schemas/InstancePoolPlacementSecondaryVnicSubnet'
          type: array
          uniqueItems: true
      required:
        - availabilityDomain
      type: object
    LaunchInstanceAgentConfigDetails:
      description: Configuration options for the Oracle Cloud Agent software running on the instance.
      properties:
        areAllPluginsDisabled:
          default: false
          description: |
            Whether Oracle Cloud Agent can run all the available plugins.
            This includes the management and monitoring plugins.

            To get a list of available plugins, use the
            [ListInstanceagentAvailablePlugins](#/en/instanceagent/20180530/Plugin/ListInstanceagentAvailablePlugins)
            operation in the Oracle Cloud Agent API. For more information about the available plugins, see
            [Managing Plugins with Oracle Cloud Agent](/iaas/Content/Compute/Tasks/manage-plugins.htm).
          type: boolean
        isManagementDisabled:
          default: false
          description: |
            Whether Oracle Cloud Agent can run all the available management plugins.
            Default value is false (management plugins are enabled).

            These are the management plugins: OS Management Service Agent and Compute Instance
            Run Command.

            The management plugins are controlled by this parameter and by the per-plugin
            configuration in the `pluginsConfig` object.

            - If `isManagementDisabled` is true, all of the management plugins are disabled, regardless of
            the per-plugin configuration.
            - If `isManagementDisabled` is false, all of the management plugins are enabled. You
            can optionally disable individual management plugins by providing a value in the `pluginsConfig`
            object.
          type: boolean
        isMonitoringDisabled:
          default: false
          description: |
            Whether Oracle Cloud Agent can gather performance metrics and monitor the instance using the
            monitoring plugins. Default value is false (monitoring plugins are enabled).

            These are the monitoring plugins: Compute Instance Monitoring
            and Custom Logs Monitoring.

            The monitoring plugins are controlled by this parameter and by the per-plugin
            configuration in the `pluginsConfig` object.

            - If `isMonitoringDisabled` is true, all of the monitoring plugins are disabled, regardless of
            the per-plugin configuration.
            - If `isMonitoringDisabled` is false, all of the monitoring plugins are enabled. You
            can optionally disable individual monitoring plugins by providing a value in the `pluginsConfig`
            object.
          type: boolean
        pluginsConfig:
          description: The configuration of plugins associated with this instance.
          items:
            $ref: '#/components/schemas/InstanceAgentPluginConfigDetails'
          maxLength: 128
          type: array
      type: object
    LaunchInstanceAvailabilityConfigDetails:
      description: |
        Options for VM migration during infrastructure maintenance events and for defining
        the availability of a VM instance after a maintenance event that impacts the underlying hardware.
      properties:
        isLiveMigrationPreferred:
          description: |
            Whether to live migrate supported VM instances to a healthy physical VM host without
            disrupting running instances during infrastructure maintenance events. If null, Oracle
            chooses the best option for migrating the VM during infrastructure maintenance events.
          type: boolean
        recoveryAction:
          default: RESTORE_INSTANCE
          description: |
            The lifecycle state for an instance when it is recovered after infrastructure maintenance.
            * `RESTORE_INSTANCE` - The instance is restored to the lifecycle state it was in before the maintenance event.
            If the instance was running, it is automatically rebooted. This is the default action when a value is not set.
            * `STOP_INSTANCE` - The instance is recovered in the stopped state.
          enum:
            - RESTORE_INSTANCE
            - STOP_INSTANCE
          type: string
      type: object
    CreateVnicDetails:
      description: |
        Contains properties for a VNIC. You use this object when creating the
        primary VNIC during instance launch or when creating a secondary VNIC.
        For more information about VNICs, see
        [Virtual Network Interface Cards (VNICs)](/iaas/Content/Network/Tasks/managingVNICs.htm).
      properties:
        assignIpv6Ip:
          default: false
          description: |
            Whether to allocate an IPv6 address at instance and VNIC creation from an IPv6 enabled
            subnet. Default: False. When provided you may optionally provide an IPv6 prefix
            (`ipv6SubnetCidr`) of your choice to assign the IPv6 address from. If `ipv6SubnetCidr`
            is not provided then an IPv6 prefix is chosen
            for you.
          type: boolean
        assignPrivateDnsRecord:
          description: |
            Whether the VNIC should be assigned a DNS record. If set to false, there will be no DNS record
            registration for the VNIC. If set to true, the DNS record will be registered. The default
            value is true.

            If you specify a `hostnameLabel`, then `assignPrivateDnsRecord` must be set to true.
          type: boolean
        assignPublicIp:
          description: |
            Whether the VNIC should be assigned a public IP address. Defaults to whether
            the subnet is public or private. If not set and the VNIC is being created
            in a private subnet (that is, where `prohibitPublicIpOnVnic` = true in the
            [Subnet](#/en/iaas/latest/Subnet/)), then no public IP address is assigned.
            If not set and the subnet is public (`prohibitPublicIpOnVnic` = false), then
            a public IP address is assigned. If set to true and
            `prohibitPublicIpOnVnic` = true, an error is returned.

            **Note:** This public IP address is associated with the primary private IP
            on the VNIC. For more information, see
            [IP Addresses](/iaas/Content/Network/Tasks/managingIPaddresses.htm).

            **Note:** There's a limit to the number of [public IPs](#/en/iaas/latest/PublicIp/)
            a VNIC or instance can have. If you try to create a secondary VNIC
            with an assigned public IP for an instance that has already
            reached its public IP limit, an error is returned. For information
            about the public IP limits, see
            [Public IP Addresses](/iaas/Content/Network/Tasks/managingpublicIPs.htm).

            Example: `false`

            If you specify a `vlanId`, then `assignPublicIp` must be set to false. See
            [Vlan](#/en/iaas/latest/Vlan).
          type: boolean
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.

              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a
            namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        displayName:
          description: |
            A user-friendly name. Does not have to be unique, and it's changeable.
            Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags for this resource. Each tag is a simple key-value pair with no
            predefined name, type, or namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Department": "Finance"}`
          type: object
        hostnameLabel:
          description: |
            The hostname for the VNIC's primary private IP. Used for DNS. The value is the hostname
            portion of the primary private IP's fully qualified domain name (FQDN)
            (for example, `bminstance1` in FQDN `bminstance1.subnet123.vcn1.oraclevcn.com`).
            Must be unique across all VNICs in the subnet and comply with
            [RFC 952](https://tools.ietf.org/html/rfc952) and
            [RFC 1123](https://tools.ietf.org/html/rfc1123).
            The value appears in the [Vnic](#/en/iaas/latest/Vnic/) object and also the
            [PrivateIp](#/en/iaas/latest/PrivateIp/) object returned by
            [ListPrivateIps](#/en/iaas/latest/PrivateIp/ListPrivateIps) and
            [GetPrivateIp](#/en/iaas/latest/PrivateIp/GetPrivateIp).

            For more information, see
            [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).

            When launching an instance, use this `hostnameLabel` instead
            of the deprecated `hostnameLabel` in
            [LaunchInstanceDetails](#/en/iaas/latest/requests/LaunchInstanceDetails).
            If you provide both, the values must match.

            Example: `bminstance1`

            If you specify a `vlanId`, the `hostnameLabel` cannot be specified. VNICs on a VLAN
            can not be assigned a hostname. See [Vlan](#/en/iaas/latest/Vlan).
          maxLength: 63
          minLength: 1
          type: string
        ipv6AddressIpv6SubnetCidrPairDetails:
          description: |
            A list of IPv6 prefix ranges from which the VNIC is assigned an IPv6 address.
            You can provide only the prefix ranges from which OCI selects an available
            address from the range. You can optionally choose to leave the prefix range empty
            and instead provide the specific IPv6 address within that range to use.
          items:
            $ref: '#/components/schemas/Ipv6AddressIpv6SubnetCidrPairDetails'
          type: array
        nsgIds:
          description: |
            A list of the OCIDs of the network security groups (NSGs) to add the VNIC to. For more
            information about NSGs, see
            [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).

            If a `vlanId` is specified, the `nsgIds` cannot be specified. The `vlanId`
            indicates that the VNIC will belong to a VLAN instead of a subnet. With VLANs,
            all VNICs in the VLAN belong to the NSGs that are associated with the VLAN.
            See [Vlan](#/en/iaas/latest/Vlan).
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 5
          type: array
          uniqueItems: true
        privateIp:
          description: |
            A private IP address of your choice to assign to the VNIC. Must be an
            available IP address within the subnet's CIDR. If you don't specify a
            value, Oracle automatically assigns a private IP address from the subnet.
            This is the VNIC's *primary* private IP address. The value appears in
            the [Vnic](#/en/iaas/latest/Vnic/) object and also the
            [PrivateIp](#/en/iaas/latest/PrivateIp/) object returned by
            [ListPrivateIps](#/en/iaas/latest/PrivateIp/ListPrivateIps) and
            [GetPrivateIp](#/en/iaas/latest/PrivateIp/GetPrivateIp).


            If you specify a `vlanId`, the `privateIp` cannot be specified.
            See [Vlan](#/en/iaas/latest/Vlan).

            If you specify a 'privateIpId', the 'privateIp' cannot be specified.

            Example: `10.0.3.3`
          maxLength: 46
          minLength: 1
          type: string
        privateIpId:
          description: |
            An [OCID](/iaas/Content/General/Concepts/identifiers.htm) that specifies a previously-reserved IP address to use for this VNIC.
          maxLength: 255
          minLength: 1
          type: string
        securityAttributes:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a [ZPR namespace](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attribute-namespaces).
            type: object
          description: |
            [Security attributes](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attributes) are labels
            for a resource that can be referenced in a [Zero Trust Packet Routing](/iaas/Content/zero-trust-packet-routing/overview.htm)
            (ZPR) policy to control access to ZPR-supported resources.

            Example: `{"Oracle-DataSecurity-ZPR": {"MaxEgressCount": {"value":"42","mode":"audit"}}}`
          type: object
        skipSourceDestCheck:
          description: |
            Whether the source/destination check is disabled on the VNIC.
            Defaults to `false`, which means the check is performed. For information
            about why you would skip the source/destination check, see
            [Using a Private IP as a Route Target](/iaas/Content/Network/Tasks/managingroutetables.htm#privateip).


            If you specify a `vlanId`, the `skipSourceDestCheck` cannot be specified because the
            source/destination check is always disabled for VNICs in a VLAN. See
            [Vlan](#/en/iaas/latest/Vlan).

            Example: `true`
          type: boolean
        subnetCidr:
          description: |
            One of the IPv4 CIDR blocks allocated to the subnet. Represents the IP range
            from which the VNIC's private IP address will be assigned if `privateIp` or
            `privateIpId` is not specified.
            Either this field or the `privateIp` (or `privateIpId`, if applicable) field
            must be provided, but not both simultaneously.
            Example: `192.168.1.0/28`
          maxLength: 18
          minLength: 9
          type: string
        subnetId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the subnet to create the VNIC in. When launching an instance,
            use this `subnetId` instead of the deprecated `subnetId` in
            [LaunchInstanceDetails](#/en/iaas/latest/requests/LaunchInstanceDetails).
            At least one of them is required; if you provide both, the values must match.

            If you are an Oracle Cloud VMware Solution customer and creating a secondary
            VNIC in a VLAN instead of a subnet, provide a `vlanId` instead of a `subnetId`.
            If you provide both a `vlanId` and `subnetId`, the request fails.
          maxLength: 255
          minLength: 1
          type: string
        vlanId:
          description: |
            Provide this attribute only if you are an Oracle Cloud VMware Solution
            customer and creating a secondary VNIC in a VLAN. The value is the [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VLAN.
            See [Vlan](#/en/iaas/latest/Vlan).

            Provide a `vlanId` instead of a `subnetId`. If you provide both a
            `vlanId` and `subnetId`, the request fails.
          maxLength: 255
          minLength: 1
          type: string
      type: object
    LaunchAttachVolumeDetails:
      description: The details of the volume to attach.
      discriminator:
        propertyName: type
      properties:
        device:
          description: The device name. To retrieve a list of devices for a given instance, see [ListInstanceDevices](#/en/iaas/latest/Device/ListInstanceDevices).
          maxLength: 100
          minLength: 3
          type: string
        displayName:
          description: |
            A user-friendly name. Does not have to be unique, and it's changeable.
            Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        isReadOnly:
          description: Whether the attachment was created in read-only mode.
          type: boolean
        isShareable:
          default: false
          description: |
            Whether the attachment should be created in shareable mode. If an attachment
            is created in shareable mode, then other instances can attach the same volume, provided
            that they also create their attachments in shareable mode. Only certain volume types can
            be attached in shareable mode. Defaults to false if not specified.
          type: boolean
        launchCreateVolumeDetails:
          $ref: '#/components/schemas/LaunchCreateVolumeDetails'
        type:
          description: The type of volume attachment. Currently, the only supported values are "iscsi" and "paravirtualized".
          maxLength: 255
          minLength: 1
          type: string
        volumeId:
          description: |
            The OCID of the volume. If CreateVolumeDetails is specified, this field must be omitted from the request.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - type
      type: object
    LaunchInstanceLicensingConfig:
      description: The license config requested for the instance.
      discriminator:
        propertyName: type
      properties:
        licenseType:
          default: OCI_PROVIDED
          description: |
            License Type for the OS license.
            * `OCI_PROVIDED` - OCI provided license (e.g. metered $/OCPU-hour).
            * `BRING_YOUR_OWN_LICENSE` - Bring your own license.
          enum:
            - OCI_PROVIDED
            - BRING_YOUR_OWN_LICENSE
          type: string
        type:
          description: Operating System type of the Configuration.
          enum:
            - WINDOWS
          type: string
      required:
        - type
      type: object
    LaunchInstancePlatformConfig:
      description: |
        The platform configuration requested for the instance.

        If you provide the parameter, the instance is created with the platform configuration that you specify.
        For any values that you omit, the instance uses the default configuration values for the `shape` that you
        specify. If you don't provide the parameter, the default values for the `shape` are used.

        Each shape only supports certain configurable values. If the values that you provide are not valid for the
        specified `shape`, an error is returned.

        For more information about shielded instances, see
        [Shielded Instances](/iaas/Content/Compute/References/shielded-instances.htm).

        For more information about BIOS settings for bare metal instances, see
        [BIOS Settings for Bare Metal Instances](/iaas/Content/Compute/References/bios-settings.htm).
      discriminator:
        propertyName: type
      properties:
        isMeasuredBootEnabled:
          default: false
          description: |
            Whether the Measured Boot feature is enabled on the instance.
          type: boolean
        isMemoryEncryptionEnabled:
          default: false
          description: |
            Whether the instance is a confidential instance. If this value is `true`, the instance is a confidential instance. The default value is `false`.
          type: boolean
        isSecureBootEnabled:
          default: false
          description: |
            Whether Secure Boot is enabled on the instance.
          type: boolean
        isTrustedPlatformModuleEnabled:
          default: false
          description: |
            Whether the Trusted Platform Module (TPM) is enabled on the instance.
          type: boolean
        type:
          description: |
            The type of platform being configured.
          enum:
            - AMD_MILAN_BM
            - AMD_MILAN_BM_GPU
            - AMD_ROME_BM
            - AMD_ROME_BM_GPU
            - GENERIC_BM
            - INTEL_ICELAKE_BM
            - INTEL_SKYLAKE_BM
            - AMD_VM
            - INTEL_VM
          type: string
      required:
        - type
      type: object
    LaunchInstanceShapeConfigDetails:
      description: |
        The shape configuration requested for the instance.

        If the parameter is provided, the instance is created with the resources that you specify. If some
        properties are missing or the entire parameter is not provided, the instance is created
        with the default configuration values for the `shape` that you specify.

        Each shape only supports certain configurable values. If the values that you provide are not valid for the
        specified `shape`, an error is returned.
      properties:
        baselineOcpuUtilization:
          description: |
            The baseline OCPU utilization for a subcore burstable VM instance. Leave this attribute blank for a
            non-burstable instance, or explicitly specify non-burstable with `BASELINE_1_1`.

            The following values are supported:
            - `BASELINE_1_8` - baseline usage is 1/8 of an OCPU.
            - `BASELINE_1_2` - baseline usage is 1/2 of an OCPU.
            - `BASELINE_1_1` - baseline usage is an entire OCPU. This represents a non-burstable instance.
          enum:
            - BASELINE_1_8
            - BASELINE_1_2
            - BASELINE_1_1
          type: string
        memoryInGBs:
          description: |
            The total amount of memory available to the instance, in gigabytes.
          format: float
          minimum: 0
          type: number
        nvmes:
          description: |
            The number of NVMe drives to be used for storage. A single drive has 6.8 TB available.
          format: int32
          maximum: 7
          minimum: 1
          type: integer
        ocpus:
          description: |
            The total number of OCPUs available to the instance.
          format: float
          minimum: 0
          type: number
        resourceManagement:
          description: |
            This field is reserved for internal use.
          enum:
            - DYNAMIC
            - STATIC
          type: string
        vcpus:
          description: |
            The total number of VCPUs available to the instance. This can be used instead of OCPUs,
            in which case the actual number of OCPUs will be calculated based on this value
            and the actual hardware. This must be a multiple of 2.
          format: int32
          minimum: 0
          type: integer
      type: object
    UpdateInstanceAgentConfigDetails:
      description: Configuration options for the Oracle Cloud Agent software running on the instance.
      properties:
        areAllPluginsDisabled:
          default: false
          description: |
            Whether Oracle Cloud Agent can run all the available plugins.
            This includes the management and monitoring plugins.

            To get a list of available plugins, use the
            [ListInstanceagentAvailablePlugins](#/en/instanceagent/20180530/Plugin/ListInstanceagentAvailablePlugins)
            operation in the Oracle Cloud Agent API. For more information about the available plugins, see
            [Managing Plugins with Oracle Cloud Agent](/iaas/Content/Compute/Tasks/manage-plugins.htm).
          type: boolean
        isManagementDisabled:
          default: false
          description: |
            Whether Oracle Cloud Agent can run all the available management plugins.

            These are the management plugins: OS Management Service Agent and Compute Instance
            Run Command.

            The management plugins are controlled by this parameter and by the per-plugin
            configuration in the `pluginsConfig` object.

            - If `isManagementDisabled` is true, all of the management plugins are disabled, regardless of
            the per-plugin configuration.
            - If `isManagementDisabled` is false, all of the management plugins are enabled. You
            can optionally disable individual management plugins by providing a value in the `pluginsConfig`
            object.
          type: boolean
        isMonitoringDisabled:
          default: false
          description: |
            Whether Oracle Cloud Agent can gather performance metrics and monitor the instance using the
            monitoring plugins.

            These are the monitoring plugins: Compute Instance Monitoring
            and Custom Logs Monitoring.

            The monitoring plugins are controlled by this parameter and by the per-plugin
            configuration in the `pluginsConfig` object.

            - If `isMonitoringDisabled` is true, all of the monitoring plugins are disabled, regardless of
            the per-plugin configuration.
            - If `isMonitoringDisabled` is false, all of the monitoring plugins are enabled. You
            can optionally disable individual monitoring plugins by providing a value in the `pluginsConfig`
            object.
          type: boolean
        pluginsConfig:
          description: The configuration of plugins associated with this instance.
          items:
            $ref: '#/components/schemas/InstanceAgentPluginConfigDetails'
          maxLength: 128
          type: array
      type: object
    UpdateInstanceAvailabilityConfigDetails:
      description: |
        Options for defining the availability of a VM instance after a maintenance event that impacts the underlying
        hardware, including whether to live migrate supported VM instances when possible without sending a prior customer notification.
      properties:
        isLiveMigrationPreferred:
          description: |
            Whether to live migrate supported VM instances to a healthy physical VM host without
            disrupting running instances during infrastructure maintenance events. If null, Oracle
            chooses the best option for migrating the VM during infrastructure maintenance events.
          type: boolean
        recoveryAction:
          default: RESTORE_INSTANCE
          description: |
            The lifecycle state for an instance when it is recovered after infrastructure maintenance.
            * `RESTORE_INSTANCE` - The instance is restored to the lifecycle state it was in before the maintenance event.
            If the instance was running, it is automatically rebooted. This is the default action when a value is not set.
            * `STOP_INSTANCE` - The instance is recovered in the stopped state.
          enum:
            - RESTORE_INSTANCE
            - STOP_INSTANCE
          type: string
      type: object
    UpdateLaunchOptions:
      description: |
        Options for tuning the compatibility and performance of VM shapes.
      properties:
        bootVolumeType:
          description: |
            Emulation type for the boot volume.
            * `ISCSI` - ISCSI attached block storage device.
            * `PARAVIRTUALIZED` - Paravirtualized disk. This is the default for boot volumes and remote block
            storage volumes on platform images.

            Before you change the boot volume attachment type, detach all block volumes and VNICs except for
            the boot volume and the primary VNIC.

            If the instance is running when you change the boot volume attachment type, it will be rebooted.

            **Note:** Some instances might not function properly if you change the boot volume attachment type. After
            the instance reboots and is running, connect to it. If the connection fails or the OS doesn't behave
            as expected, the changes are not supported. Revert the instance to the original boot volume attachment type.
          enum:
            - ISCSI
            - PARAVIRTUALIZED
          type: string
        isPvEncryptionInTransitEnabled:
          description: |
            Whether to enable in-transit encryption for the volume's paravirtualized attachment.
            To enable in-transit encryption for block volumes and boot volumes, this field must be set to `true`.

            Data in transit is transferred over an internal and highly secure network. If you have specific
            compliance requirements related to the encryption of the data while it is moving between the
            instance and the boot volume or the block volume, you can enable in-transit encryption.
            In-transit encryption is not enabled by default.

            All boot volumes and block volumes are encrypted at rest.

            For more information, see [Block Volume Encryption](/iaas/Content/Block/Concepts/overview.htm#Encrypti).
          type: boolean
        networkType:
          description: |
            Emulation type for the physical network interface card (NIC).
            * `VFIO` - Direct attached Virtual Function network controller. This is the networking type
            when you launch an instance using hardware-assisted (SR-IOV) networking.
            * `PARAVIRTUALIZED` - VM instances launch with paravirtualized devices using VirtIO drivers.
            * `ACCELERATEDPV` - VM instances launch with accelerated paravirtualized networking type.

            Before you change the networking type, detach all VNICs and block volumes except for the primary
            VNIC and the boot volume.

            The image must have paravirtualized drivers installed. For more information, see
            [Editing an Instance](/iaas/Content/Compute/Tasks/resizinginstances.htm).

            If the instance is running when you change the network type, it will be rebooted.

            **Note:** Some instances might not function properly if you change the networking type. After
            the instance reboots and is running, connect to it. If the connection fails or the OS doesn't behave
            as expected, the changes are not supported. Revert the instance to the original networking type.
          enum:
            - VFIO
            - PARAVIRTUALIZED
            - ACCELERATEDPV
          type: string
      type: object
    UpdateInstanceShapeConfigDetails:
      description: |
        The shape configuration requested for the instance. If provided, the instance will be updated
        with the resources specified. In the case where some properties are missing,
        the missing values will be set to the default for the provided `shape`.

        Each shape only supports certain configurable values. If the `shape` is provided
        and the configuration values are invalid for that new `shape`, an error will be returned.
        If no `shape` is provided and the configuration values are invalid for the instance's
        existing shape, an error will be returned.
      properties:
        baselineOcpuUtilization:
          description: |
            The baseline OCPU utilization for a subcore burstable VM instance. Leave this attribute blank for a
            non-burstable instance, or explicitly specify non-burstable with `BASELINE_1_1`.

            The following values are supported:
            - `BASELINE_1_8` - baseline usage is 1/8 of an OCPU.
            - `BASELINE_1_2` - baseline usage is 1/2 of an OCPU.
            - `BASELINE_1_1` - baseline usage is an entire OCPU. This represents a non-burstable instance.
          enum:
            - BASELINE_1_8
            - BASELINE_1_2
            - BASELINE_1_1
          type: string
        memoryInGBs:
          description: |
            The total amount of memory available to the instance, in gigabytes.
          format: float
          minimum: 0
          type: number
        nvmes:
          description: |
            The number of NVMe drives to be used for storage. A single drive has 6.8 TB available.
          format: int32
          maximum: 7
          minimum: 1
          type: integer
        ocpus:
          description: |
            The total number of OCPUs available to the instance.
          format: float
          minimum: 0
          type: number
        resourceManagement:
          description: |
            This field is reserved for internal use.
          enum:
            - DYNAMIC
            - STATIC
          type: string
        vcpus:
          description: |
            The total number of VCPUs available to the instance. This can be used instead of OCPUs,
            in which case the actual number of OCPUs will be calculated based on this value
            and the actual hardware. This must be a multiple of 2.
          format: int32
          minimum: 0
          type: integer
      type: object
    UpdateInstanceSourceDetails:
      description: The details for updating the instance source.
      discriminator:
        propertyName: sourceType
      properties:
        isPreserveBootVolumeEnabled:
          default: true
          description: |
            Whether to preserve the boot volume that was previously attached to the instance after a successful replacement of that boot volume.
          type: boolean
        sourceType:
          description: |
            The source type for the instance.
            Use `image` when specifying the image OCID. Use `bootVolume` when specifying
            the boot volume OCID.
          type: string
      required:
        - sourceType
      type: object
    MeasuredBootReportMeasurements:
      description: |
        A list of Trusted Platform Module (TPM) Platform Configuration Register (PCR) entries.
      properties:
        actual:
          description: The list of actual PCR entries measured during boot.
          items:
            $ref: '#/components/schemas/MeasuredBootEntry'
          type: array
        policy:
          description: The list of expected PCR entries to use during verification.
          items:
            $ref: '#/components/schemas/MeasuredBootEntry'
          type: array
      type: object
    ShapeMaxVnicAttachmentOptions:
      description: |
        For a flexible shape, the number of VNIC attachments that are available for instances that use this shape.

        If this field is null, then this shape has a fixed maximum number of VNIC attachments equal to `maxVnicAttachments`.
      properties:
        defaultPerOcpu:
          description: |
            The default number of VNIC attachments allowed per OCPU.
          format: float
          minimum: 0
          type: number
        max:
          description: |
            The highest maximum value of VNIC attachments.
          format: float
          minimum: 0
          type: number
        min:
          description: |
            The lowest maximum value of VNIC attachments.
          minimum: 0
          type: integer
      type: object
    ShapeMemoryOptions:
      description: |
        For a flexible shape, the amount of memory available for instances that use this shape.

        If this field is null, then this shape has a fixed amount of memory equivalent to `memoryInGBs`.
      properties:
        defaultPerOcpuInGBs:
          description: |
            The default amount of memory per OCPU available for this shape, in gigabytes.
          format: float
          minimum: 0
          type: number
        maxInGBs:
          description: |
            The maximum amount of memory, in gigabytes.
          format: float
          minimum: 0
          type: number
        maxPerOcpuInGBs:
          description: |
            The maximum amount of memory per OCPU available for this shape, in gigabytes.
          exclusiveMinimum: true
          format: float
          minimum: 0
          type: number
        minInGBs:
          description: |
            The minimum amount of memory, in gigabytes.
          format: float
          minimum: 0
          type: number
        minPerOcpuInGBs:
          description: |
            The minimum amount of memory per OCPU available for this shape, in gigabytes.
          exclusiveMinimum: true
          format: float
          minimum: 0
          type: number
      type: object
    ShapeNetworkingBandwidthOptions:
      description: |
        For a flexible shape, the amount of networking bandwidth available for instances that use this shape.

        If this field is null, then this shape has a fixed amount of bandwidth equivalent to `networkingBandwidthInGbps`.
      properties:
        defaultPerOcpuInGbps:
          description: |
            The default amount of networking bandwidth per OCPU, in gigabits per second.
          format: float
          minimum: 0
          type: number
        maxInGbps:
          description: |
            The maximum amount of networking bandwidth, in gigabits per second.
          format: float
          minimum: 0
          type: number
        minInGbps:
          description: |
            The minimum amount of networking bandwidth, in gigabits per second.
          format: float
          minimum: 0
          type: number
      type: object
    ShapeOcpuOptions:
      description: |
        For a flexible shape, the number of OCPUs available for instances that use this shape.

        If this field is null, then this shape has a fixed number of OCPUs equal to `ocpus`.
      properties:
        max:
          description: |
            The maximum number of OCPUs.
          format: float
          minimum: 0
          type: number
        min:
          description: |
            The minimum number of OCPUs.
          format: float
          minimum: 0
          type: number
      type: object
    ShapePlatformConfigOptions:
      description: |
        The list of supported platform configuration options for this shape.
      properties:
        accessControlServiceOptions:
          $ref: '#/components/schemas/ShapeAccessControlServiceEnabledPlatformOptions'
        inputOutputMemoryManagementUnitOptions:
          $ref: '#/components/schemas/ShapeInputOutputMemoryManagementUnitEnabledPlatformOptions'
        measuredBootOptions:
          $ref: '#/components/schemas/ShapeMeasuredBootOptions'
        memoryEncryptionOptions:
          $ref: '#/components/schemas/ShapeMemoryEncryptionOptions'
        numaNodesPerSocketPlatformOptions:
          $ref: '#/components/schemas/ShapeNumaNodesPerSocketPlatformOptions'
        percentageOfCoresEnabledOptions:
          $ref: '#/components/schemas/PercentageOfCoresEnabledOptions'
        secureBootOptions:
          $ref: '#/components/schemas/ShapeSecureBootOptions'
        symmetricMultiThreadingOptions:
          $ref: '#/components/schemas/ShapeSymmetricMultiThreadingEnabledPlatformOptions'
        trustedPlatformModuleOptions:
          $ref: '#/components/schemas/ShapeTrustedPlatformModuleOptions'
        type:
          description: |
            The type of platform being configured.
          enum:
            - AMD_MILAN_BM
            - AMD_MILAN_BM_GPU
            - AMD_ROME_BM
            - AMD_ROME_BM_GPU
            - GENERIC_BM
            - INTEL_ICELAKE_BM
            - INTEL_SKYLAKE_BM
            - AMD_VM
            - INTEL_VM
          type: string
        virtualInstructionsOptions:
          $ref: '#/components/schemas/ShapeVirtualInstructionsEnabledPlatformOptions'
      type: object
    ShapeAlternativeObject:
      description: |
        The shape that Oracle recommends you to use an alternative to the current shape.
      properties:
        shapeName:
          description: |
            The name of the shape.
          type: string
      required:
        - shapeName
      type: object
    InstancePoolPlacementPrimarySubnet:
      description: Details about the IPv6 primary subnet.
      properties:
        ipv6AddressIpv6SubnetCidrPairDetails:
          description: |
            A list of IPv6 prefix ranges from which the VNIC should be assigned an IPv6 address.
            You can provide only the prefix ranges and OCI will select an available
            address from the range. You can optionally choose to leave the prefix range empty
            and instead provide the specific IPv6 address that should be used from within that range.
          items:
            $ref: '#/components/schemas/InstancePoolPlacementIpv6AddressIpv6SubnetCidrDetails'
          type: array
        isAssignIpv6Ip:
          default: false
          description: |
            Whether to allocate an IPv6 address at instance and VNIC creation from an IPv6 enabled
            subnet. Default: False. When provided you may optionally provide an IPv6 prefix
            (`ipv6SubnetCidr`) of your choice to assign the IPv6 address from. If `ipv6SubnetCidr`
            is not provided then an IPv6 prefix is chosen
            for you.
          type: boolean
        subnetId:
          description: The subnet [OCID](/iaas/Content/General/Concepts/identifiers.htm) for the secondary VNIC.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - subnetId
      type: object
    InstancePoolPlacementSecondaryVnicSubnet:
      description: The secondary VNIC object for the placement configuration for an instance pool.
      properties:
        ipv6AddressIpv6SubnetCidrPairDetails:
          description: |
            A list of IPv6 prefix ranges from which the VNIC should be assigned an IPv6 address.
            You can provide only the prefix ranges and OCI will select an available
            address from the range. You can optionally choose to leave the prefix range empty
            and instead provide the specific IPv6 address that should be used from within that range.
          items:
            $ref: '#/components/schemas/InstancePoolPlacementIpv6AddressIpv6SubnetCidrDetails'
          type: array
        isAssignIpv6Ip:
          default: false
          description: |
            Whether to allocate an IPv6 address at instance and VNIC creation from an IPv6 enabled
            subnet. Default: False. When provided you may optionally provide an IPv6 prefix
            (`ipv6SubnetCidr`) of your choice to assign the IPv6 address from. If `ipv6SubnetCidr`
            is not provided then an IPv6 prefix is chosen
            for you.
          type: boolean
        subnetId:
          description: The subnet [OCID](/iaas/Content/General/Concepts/identifiers.htm) for the secondary VNIC.
          maxLength: 255
          minLength: 1
          type: string
        displayName:
          description: |
            The display name of the VNIC. This is also used to match against the instance configuration defined
            secondary VNIC.
          maxLength: 255
          minItems: 1
          minLength: 1
          type: string
      required:
        - subnetId
      type: object
    CapacityReportInstanceShapeConfig:
      description: |
        The shape configuration for a shape in a capacity report.
      properties:
        baselineOcpuUtilization:
          description: |
            The baseline OCPU utilization for a subcore burstable VM instance. Leave this attribute blank for a
            non-burstable instance, or explicitly specify non-burstable with `BASELINE_1_1`.

            The following values are supported:
            - `BASELINE_1_8` - baseline usage is 1/8 of an OCPU.
            - `BASELINE_1_2` - baseline usage is 1/2 of an OCPU.
            - `BASELINE_1_1` - baseline usage is an entire OCPU. This represents a non-burstable instance.
          enum:
            - BASELINE_1_8
            - BASELINE_1_2
            - BASELINE_1_1
          type: string
        memoryInGBs:
          description: |
            The total amount of memory available to the instance, in gigabytes.
          format: float
          minimum: 0
          type: number
        nvmes:
          description: |
            The number of NVMe drives to be used for storage.
          format: int32
          maximum: 7
          minimum: 1
          type: integer
        ocpus:
          description: |
            The total number of OCPUs available to the instance.
          format: float
          minimum: 0
          type: number
      type: object
    ClusterConfigDetails:
      description: |
        The HPC cluster configuration requested when launching instances in a compute capacity reservation.

        If the parameter is provided, the reservation is created with the HPC island and a list of HPC blocks that you
        specify. If a list of HPC blocks are missing or not provided, the reservation is created with any HPC blocks in
        the HPC island that you specify. If the values of HPC island or HPC block that you provide are not valid, an error
        is returned.
      properties:
        hpcIslandId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the HPC island.
          maxLength: 255
          minLength: 1
          type: string
        networkBlockIds:
          description: The list of OCIDs of the network blocks.
          items:
            type: string
          type: array
      required:
        - hpcIslandId
      type: object
    ComputeHostConfigurationCheckDetails:
      description: |
        Compute Host Group Configuration Details Check
      properties:
        configurationState:
          description: |
            The current state of the host configuration. The Host is either |
            CONFORMANT - current state matches the desired configuration
            NON_CONFORMANT - current state does not match the desired configuration
            PRE_APPLYING, APPLYING, CHECKING- transitional states
            UNKNOWN - current state is unknown
          enum:
            - CONFORMANT
            - NON_CONFORMANT
            - CHECKING
            - PRE_APPLYING
            - APPLYING
            - UNKNOWN
          type: string
          x-obmcs-top-level-enum: '#/definitions/ConfigurationState'
        firmwareBundleId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) for the Customer-unique firmware bundle associated with the Host Configuration.
          maxLength: 255
          minLength: 1
          type: string
        recycleLevel:
          description: |
            Preferred recycle level for hosts associated with the reservation config.
            * `SKIP_RECYCLE` - Skips host wipe.
            * `FULL_RECYCLE` - Does not skip host wipe. This is the default behavior.
          enum:
            - SKIP_RECYCLE
            - FULL_RECYCLE
          type: string
        type:
          description: The type of configuration
          enum:
            - FIRMWARE
            - RECYCLE
          type: string
      type: object
    CapacityBinPreview:
      description: |
        Total CPU and memory capacity for each capacity bucket.
      properties:
        capacityIndex:
          description: |
            Zero-based index for the corresponding capacity bucket.
          format: int32
          maximum: 24
          minimum: 0
          type: integer
        supportedShapes:
          description: |
            List of VMI shapes supported on each capacity bucket.
          items:
            type: string
          maxItems: 25
          minItems: 1
          type: array
        totalMemoryInGBs:
          description: |
            The total memory of the capacity bucket, in GBs.
          format: float
          minimum: 0
          type: number
        totalOcpus:
          description: |
            The total OCPUs of the capacity bucket.
          format: float
          minimum: 0
          type: number
      required:
        - capacityIndex
        - totalOcpus
        - totalMemoryInGBs
        - supportedShapes
      type: object
    ComponentVersion:
      description: Represents a specific component type and its associated firmware versions.
      properties:
        componentType:
          description: The type of component.
          type: string
        version:
          description: A list of firmware versions associated with this component type.
          items:
            type: string
          type: array
      required:
        - componentType
        - version
      type: object
    InstanceAgentPluginConfigDetails:
      description: The configuration of plugins associated with this instance.
      properties:
        desiredState:
          description: |
            Whether the plugin should be enabled or disabled.

            To enable the monitoring and management plugins, the `isMonitoringDisabled` and
            `isManagementDisabled` attributes must also be set to false.
          enum:
            - ENABLED
            - DISABLED
          type: string
        name:
          description: |
            The plugin name. To get a list of available plugins, use the
            [ListInstanceagentAvailablePlugins](#/en/instanceagent/20180530/Plugin/ListInstanceagentAvailablePlugins)
            operation in the Oracle Cloud Agent API. For more information about the available plugins, see
            [Managing Plugins with Oracle Cloud Agent](/iaas/Content/Compute/Tasks/manage-plugins.htm).
          maxLength: 255
          minLength: 1
          type: string
      required:
        - name
        - desiredState
      type: object
    PreemptionAction:
      description: |
        The action to run when the preemptible instance is interrupted for eviction.
      discriminator:
        propertyName: type
      properties:
        type:
          description: The type of action to run when the instance is interrupted for eviction.
          enum:
            - TERMINATE
          type: string
      required:
        - type
      type: object
    InstancePoolLifecycleActionsDetails:
      description: |
        The lifecycle actions for the instance pool.
      minProperties: 1
      properties:
        preTermination:
          $ref: '#/components/schemas/InstancePoolPreTerminationActionDetails'
      type: object
    Ipv6AddressIpv6SubnetCidrPairDetails:
      description: |
        Details to assign an IPv6 subnet prefix and IPv6 address on VNIC creation.
      properties:
        ipv6Address:
          description: |
            An IPv6 address of your choice. Must be an available IPv6 address within the subnet's prefix.
            If an IPv6 address is not provided:
            - Oracle will automatically assign an IPv6 address from the subnet's IPv6 prefix if and only if there is only one IPv6 prefix on the subnet.
            - Oracle will automatically assign an IPv6 address from the subnet's IPv6 Oracle GUA prefix if it exists on the subnet.
          maxLength: 45
          minLength: 1
          type: string
          x-default-description: 'null'
        ipv6Id:
          description: |
            An [OCID](/iaas/Content/General/Concepts/identifiers.htm) that specifies a previously-reserved ipv6 to use.
          maxLength: 255
          minLength: 1
          type: string
        ipv6SubnetCidr:
          description: |
            The IPv6 prefix allocated to the subnet.
          maxLength: 45
          minLength: 1
          type: string
          x-default-description: 'null'
      type: object
    LaunchCreateVolumeDetails:
      description: Define a volume that will be created and attached or attached to an instance on creation.
