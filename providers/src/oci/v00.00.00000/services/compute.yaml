            To get a list of fault domains, use the
            [ListFaultDomains](#/en/identity/20160918/FaultDomain/ListFaultDomains) operation in the
            Identity and Access Management Service API.

            Example: `FAULT-DOMAIN-1`
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags for this resource. Each tag is a simple key-value pair with no
            predefined name, type, or namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Department": "Finance"}`
          type: object
        instanceOptions:
          $ref: '#/components/schemas/InstanceOptions'
        isAIEnterpriseEnabled:
          default: false
          description: |
            Whether to enable AI enterprise on the instance.
          type: boolean
        launchOptions:
          $ref: '#/components/schemas/UpdateLaunchOptions'
        metadata:
          additionalProperties:
            type: string
          description: |
            Custom metadata key/value string pairs that you provide. Any set of key/value pairs
            provided here will completely replace the current set of key/value pairs in the `metadata`
            field on the instance.

            The "user_data" field and the "ssh_authorized_keys" field cannot be changed after an instance
            has launched. Any request that updates, removes, or adds either of these fields will be
            rejected. You must provide the same values for "user_data" and "ssh_authorized_keys" that
            already exist on the instance.

            The combined size of the `metadata` and `extendedMetadata` objects can be a maximum of
            32,000 bytes.
          type: object
        securityAttributes:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a [ZPR namespace](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attribute-namespaces).
            type: object
          description: |
            [Security attributes](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attributes) are labels
            for a resource that can be referenced in a [Zero Trust Packet Routing](/iaas/Content/zero-trust-packet-routing/overview.htm)
            (ZPR) policy to control access to ZPR-supported resources.

            Example: `{"Oracle-DataSecurity-ZPR": {"MaxEgressCount": {"value":"42","mode":"audit"}}}`
          type: object
        shape:
          description: |
            The shape of the instance. The shape determines the number of CPUs and the amount of memory
            allocated to the instance. For more information about how to change shapes, and a list of
            shapes that are supported, see
            [Editing an Instance](/iaas/Content/Compute/Tasks/resizinginstances.htm).

            For details about the CPUs, memory, and other properties of each shape, see
            [Compute Shapes](/iaas/Content/Compute/References/computeshapes.htm).

            The new shape must be compatible with the image that was used to launch the instance. You
            can enumerate all available shapes and determine image compatibility by calling
            [ListShapes](#/en/iaas/latest/Shape/ListShapes).

            To determine whether capacity is available for a specific shape before you change the shape of an instance,
            use the [CreateComputeCapacityReport](#/en/iaas/latest/ComputeCapacityReport/CreateComputeCapacityReport)
            operation.

            If the instance is running when you change the shape, the instance is rebooted.

            Example: `VM.Standard2.1`
          maxLength: 255
          minLength: 1
          type: string
        shapeConfig:
          $ref: '#/components/schemas/UpdateInstanceShapeConfigDetails'
        sourceDetails:
          $ref: '#/components/schemas/UpdateInstanceSourceDetails'
        timeMaintenanceRebootDue:
          description: |
            For a VM instance, resets the scheduled time that the instance will be reboot migrated for
            infrastructure maintenance, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).
            If the instance hasn't been rebooted after this date, Oracle reboots the instance within 24 hours of the time
            and date that maintenance is due.

            To get the maximum possible date that a maintenance reboot can be extended,
            use [GetInstanceMaintenanceReboot](#/en/iaas/latest/InstanceMaintenanceReboot/GetInstanceMaintenanceReboot).

            Regardless of how the instance is stopped, this flag is reset to empty as soon as the instance reaches the
            Stopped state.

            To reboot migrate a bare metal instance, use the [InstanceAction](#/en/iaas/latest/Instance/InstanceAction) operation.

            For more information, see
            [Infrastructure Maintenance](/iaas/Content/Compute/References/infrastructure-maintenance.htm).

            Example: `2018-05-25T21:10:29.600Z`
          format: date-time
          type: string
        updateOperationConstraint:
          description: |
            The parameter acts as a fail-safe to prevent unwanted downtime when updating a running instance.
            The default is ALLOW_DOWNTIME.
            * `ALLOW_DOWNTIME` - Compute might reboot the instance while updating the instance if a reboot is required.
            * `AVOID_DOWNTIME` - If the instance is in running state, Compute tries to update the instance without rebooting
                              it. If the instance requires a reboot to be updated, an error is returned and the instance
                              is not updated. If the instance is stopped, it is updated and remains in the stopped state.
          enum:
            - ALLOW_DOWNTIME
            - AVOID_DOWNTIME
          type: string
      type: object
    ChangeInstanceCompartmentDetails:
      description: The configuration details for the move operation.
      properties:
        compartmentId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to move the instance to.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - compartmentId
      type: object
    InstanceCredentials:
      description: The credentials for a particular instance.
      properties:
        password:
          description: The password for the username.
          maxLength: 255
          minLength: 1
          type: string
        username:
          description: The username.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - username
        - password
      type: object
    Device:
      description: Device Path corresponding to the block devices attached to instances having a name and isAvailable flag.
      properties:
        isAvailable:
          description: The flag denoting whether device is available.
          type: boolean
        name:
          description: The device name.
          maxLength: 100
          minLength: 3
          type: string
      required:
        - name
        - isAvailable
      type: object
    InstanceMaintenanceReboot:
      description: The maximum possible date and time that a maintenance reboot can be extended.
      properties:
        timeMaintenanceRebootDueMax:
          description: |
            The maximum extension date and time for the maintenance reboot, in the format defined by
            [RFC3339](https://tools.ietf.org/html/rfc3339).
            The range for the maintenance extension is between 1 and 14 days from the initial scheduled maintenance date.
            Example: `2018-05-25T21:10:29.600Z`
          format: date-time
          type: string
      required:
        - timeMaintenanceRebootDueMax
      type: object
    MeasuredBootReport:
      description: The measured boot report for a shielded instance.
      properties:
        isPolicyVerificationSuccessful:
          description: |
            Whether the verification succeeded, and the new values match the expected values.
          type: boolean
        measurements:
          $ref: '#/components/schemas/MeasuredBootReportMeasurements'
      required:
        - isPolicyVerificationSuccessful
      type: object
    Shape:
      description: |
        A compute instance shape that can be used in [LaunchInstance](#/en/iaas/latest/Instance/LaunchInstance).
        For more information, see [Overview of the Compute Service](/iaas/Content/Compute/Concepts/computeoverview.htm) and
        [Compute Shapes](/iaas/Content/Compute/References/computeshapes.htm).
      properties:
        availabilityDomain:
          description: The shape's availability domain.
          maxLength: 255
          minLength: 1
          type: string
        baselineOcpuUtilizations:
          description: |
            For a subcore burstable VM, the supported baseline OCPU utilization for instances that use this shape.
          items:
            enum:
              - BASELINE_1_8
              - BASELINE_1_2
              - BASELINE_1_1
            minimum: 0
            type: string
          type: array
        billingType:
          description: |
            How instances that use this shape are charged.
          enum:
            - ALWAYS_FREE
            - LIMITED_FREE
            - PAID
          type: string
        gpuDescription:
          description: |
            A short description of the graphics processing unit (GPU) available for this shape.

            If the shape does not have any GPUs, this field is `null`.
          type: string
        gpus:
          description: |
            The number of GPUs available for this shape.
          minimum: 0
          type: integer
        isBilledForStoppedInstance:
          description: |
            Whether billing continues when the instances that use this shape are in the stopped state.
          type: boolean
        isFlexible:
          description: |
            Whether the shape supports creating flexible instances. A [flexible shape](/iaas/Content/Compute/References/computeshapes.htm#flexible)
            is a shape that lets you customize the number of OCPUs and the amount of memory when launching or resizing your instance.
          type: boolean
        isLiveMigrationSupported:
          description: |
            Whether live migration is supported for this shape.
          type: boolean
        isSubcore:
          description: |
            Whether the shape supports creating subcore or burstable instances. A [burstable instance](/iaas/Content/Compute/References/burstable-instances.htm)
            is a virtual machine (VM) instance that provides a baseline level of CPU performance with the ability to burst to a higher level to support occasional
            spikes in usage.
          type: boolean
        localDiskDescription:
          description: |
            A short description of the local disks available for this shape.

            If the shape does not have any local disks, this field is `null`.
          maxLength: 255
          minLength: 1
          type: string
        localDisks:
          description: |
            The number of local disks available for this shape.
          minimum: 0
          type: integer
        localDisksTotalSizeInGBs:
          description: |
            The aggregate size of the local disks available for this shape, in gigabytes.

            If the shape does not have any local disks, this field is `null`.
          format: float
          minimum: 0
          type: number
        maxVnicAttachmentOptions:
          $ref: '#/components/schemas/ShapeMaxVnicAttachmentOptions'
        maxVnicAttachments:
          description: |
            The maximum number of VNIC attachments available for this shape.
          minimum: 0
          type: integer
        memoryInGBs:
          description: |
            The default amount of memory available for this shape, in gigabytes.
          format: float
          minimum: 0
          type: number
        memoryOptions:
          $ref: '#/components/schemas/ShapeMemoryOptions'
        minTotalBaselineOcpusRequired:
          description: |
            For a subcore burstable VM, the minimum total baseline OCPUs required. The total baseline OCPUs is equal to
            baselineOcpuUtilization chosen multiplied by the number of OCPUs chosen.
          format: int32
          minimum: 0
          type: number
        networkPorts:
          description: |
            The number of physical network interface card (NIC) ports available for this shape.
          minimum: 0
          type: integer
        networkingBandwidthInGbps:
          description: |
            The networking bandwidth available for this shape, in gigabits per second.
          format: float
          minimum: 0
          type: number
        networkingBandwidthOptions:
          $ref: '#/components/schemas/ShapeNetworkingBandwidthOptions'
        ocpuOptions:
          $ref: '#/components/schemas/ShapeOcpuOptions'
        ocpus:
          description: |
            The default number of OCPUs available for this shape.
          format: float
          minimum: 0
          type: number
        platformConfigOptions:
          $ref: '#/components/schemas/ShapePlatformConfigOptions'
        platformNames:
          description: |
            The list of platform names that can be used for this shapes
          items:
            type: string
          type: array
        processorDescription:
          description: |
            A short description of the shape's processor (CPU).
          maxLength: 255
          minLength: 1
          type: string
        quotaNames:
          description: |
            The list of of compartment quotas for the shape.
          items:
            type: string
          type: array
        rdmaBandwidthInGbps:
          description: |
            The networking bandwidth available for the remote direct memory access (RDMA) network for this shape, in
            gigabits per second.
          minimum: 0
          type: integer
        rdmaPorts:
          description: |
            The number of networking ports available for the remote direct memory access (RDMA) network between nodes in
            a high performance computing (HPC) cluster network. If the shape does not support cluster networks, this
            value is `0`.
          minimum: 0
          type: integer
        recommendedAlternatives:
          description: |
            The list of shapes and shape details (if applicable) that Oracle recommends that you use as an alternative to the current shape.
          items:
            $ref: '#/components/schemas/ShapeAlternativeObject'
          type: array
        resizeCompatibleShapes:
          description: |
            The list of compatible shapes that this shape can be changed to. For more information,
            see [Changing the Shape of an Instance](/iaas/Content/Compute/Tasks/resizinginstances.htm).
          items:
            type: string
          type: array
        shape:
          description: |
            The name of the shape. You can enumerate all available shapes by calling
            [ListShapes](#/en/iaas/latest/Shape/ListShapes).
          maxLength: 255
          minLength: 1
          type: string
      required:
        - shape
      type: object
    VnicAttachment:
      description: |
        Represents an attachment between a VNIC and an instance. For more information, see
        [Virtual Network Interface Cards (VNICs)](/iaas/Content/Network/Tasks/managingVNICs.htm).

        **Warning:** Oracle recommends that you avoid using any confidential information when you
        supply string values using the API.
      properties:
        availabilityDomain:
          description: |
            The availability domain of the instance.

            Example: `Uocm:PHX-AD-1`
          maxLength: 255
          minLength: 1
          type: string
        compartmentId:
          description: |
            The OCID of the compartment the VNIC attachment is in, which is the same
            compartment the instance is in.
          maxLength: 255
          minLength: 1
          type: string
        displayName:
          description: |
            A user-friendly name. Does not have to be unique, and it's changeable.
            Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        id:
          description: The OCID of the VNIC attachment.
          maxLength: 255
          minLength: 1
          type: string
        instanceId:
          description: The OCID of the instance.
          maxLength: 255
          minLength: 1
          type: string
        lifecycleState:
          description: The current state of the VNIC attachment.
          enum:
            - ATTACHING
            - ATTACHED
            - DETACHING
            - DETACHED
          type: string
        nicIndex:
          description: |
            Which physical network interface card (NIC) the VNIC uses.
            Certain bare metal instance shapes have two active physical NICs (0 and 1). If
            you add a secondary VNIC to one of these instances, you can specify which NIC
            the VNIC will use. For more information, see
            [Virtual Network Interface Cards (VNICs)](/iaas/Content/Network/Tasks/managingVNICs.htm).
          format: int32
          maximum: 31
          minimum: 0
          type: integer
        subnetId:
          description: The OCID of the subnet to create the VNIC in.
          maxLength: 255
          minLength: 1
          type: string
        timeCreated:
          description: |
            The date and time the VNIC attachment was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).

            Example: `2016-08-25T21:10:29.600Z`
          format: date-time
          type: string
        vlanId:
          description: |
            The OCID of the VLAN to create the VNIC in. Creating the VNIC in a VLAN (instead
            of a subnet) is possible only if you are an Oracle Cloud VMware Solution customer.
            See [Vlan](#/en/iaas/latest/Vlan).

            An error is returned if the instance already has a VNIC attached to it from this VLAN.
          maxLength: 255
          minLength: 1
          type: string
        vlanTag:
          description: |
            The Oracle-assigned VLAN tag of the attached VNIC. Available after the
            attachment process is complete.

            However, if the VNIC belongs to a VLAN as part of the Oracle Cloud VMware Solution,
            the `vlanTag` value is instead the value of the `vlanTag` attribute for the VLAN.
            See [Vlan](#/en/iaas/latest/Vlan).

            Example: `0`
          format: int32
          type: integer
        vnicId:
          description: |
            The OCID of the VNIC. Available after the attachment process is complete.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - id
        - compartmentId
        - instanceId
        - lifecycleState
        - availabilityDomain
        - timeCreated
      type: object
    AttachVnicDetails:
      properties:
        createVnicDetails:
          $ref: '#/components/schemas/CreateVnicDetails'
        displayName:
          description: |
            A user-friendly name. Does not have to be unique, and it's changeable.
            Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        instanceId:
          description: The OCID of the instance.
          maxLength: 255
          minLength: 1
          type: string
        nicIndex:
          description: |
            Which physical network interface card (NIC) the VNIC will use. Defaults to 0.
            Certain bare metal instance shapes have two active physical NICs (0 and 1). If
            you add a secondary VNIC to one of these instances, you can specify which NIC
            the VNIC will use. For more information, see
            [Virtual Network Interface Cards (VNICs)](/iaas/Content/Network/Tasks/managingVNICs.htm).
          format: int32
          maximum: 31
          minimum: 0
          type: integer
      required:
        - instanceId
        - createVnicDetails
      type: object
    VolumeAttachment:
      description: |
        A base object for all types of attachments between a storage volume and an instance.
        For specific details about iSCSI attachments, see
        [IScsiVolumeAttachment Reference](#/en/iaas/latest/IScsiVolumeAttachment/).

        For general information about volume attachments, see
        [Overview of Block Volume Storage](/iaas/Content/Block/Concepts/overview.htm).

        **Warning:** Oracle recommends that you avoid using any confidential information when you
        supply string values using the API.
      discriminator:
        propertyName: attachmentType
      properties:
        attachmentType:
          description: The type of volume attachment.
          maxLength: 255
          minLength: 1
          type: string
        availabilityDomain:
          description: |
            The availability domain of an instance.

            Example: `Uocm:PHX-AD-1`
          maxLength: 255
          minLength: 1
          type: string
        compartmentId:
          description: The OCID of the compartment.
          maxLength: 255
          minLength: 1
          type: string
        device:
          description: The device name.
          maxLength: 100
          minLength: 3
          type: string
        displayName:
          description: |
            A user-friendly name. Does not have to be unique, and it's changeable.
            Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        id:
          description: The OCID of the volume attachment.
          maxLength: 255
          minLength: 1
          type: string
        instanceId:
          description: The OCID of the instance the volume is attached to.
          maxLength: 255
          minLength: 1
          type: string
        isMultipath:
          description: Whether the Iscsi or Paravirtualized attachment is multipath or not, it is not applicable to NVMe attachment.
          type: boolean
        isPvEncryptionInTransitEnabled:
          description: |
            Whether in-transit encryption for the data volume's paravirtualized attachment is enabled or not.
          type: boolean
        isReadOnly:
          description: Whether the attachment was created in read-only mode.
          type: boolean
        isShareable:
          description: |
            Whether the attachment should be created in shareable mode. If an attachment
            is created in shareable mode, then other instances can attach the same volume, provided
            that they also create their attachments in shareable mode. Only certain volume types can
            be attached in shareable mode. Defaults to false if not specified.
          type: boolean
        isVolumeCreatedDuringLaunch:
          description: |
            Flag indicating if this volume was created for the customer as part of a simplified launch.
            Used to determine whether the volume requires deletion on instance termination.
          type: boolean
        iscsiLoginState:
          description: |
            The iscsi login state of the volume attachment. For a Iscsi volume attachment,
            all iscsi sessions need to be all logged-in or logged-out to be in logged-in or logged-out state.
          enum:
            - UNKNOWN
            - LOGGING_IN
            - LOGIN_SUCCEEDED
            - LOGIN_FAILED
            - LOGGING_OUT
            - LOGOUT_SUCCEEDED
            - LOGOUT_FAILED
          type: string
        lifecycleState:
          description: The current state of the volume attachment.
          enum:
            - ATTACHING
            - ATTACHED
            - DETACHING
            - DETACHED
          type: string
        timeCreated:
          description: |
            The date and time the volume was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).

            Example: `2016-08-25T21:10:29.600Z`
          format: date-time
          type: string
        volumeId:
          description: The OCID of the volume.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - id
        - attachmentType
        - instanceId
        - volumeId
        - lifecycleState
        - compartmentId
        - availabilityDomain
        - timeCreated
      type: object
    AttachVolumeDetails:
