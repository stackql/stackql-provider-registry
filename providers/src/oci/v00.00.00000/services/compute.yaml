openapi: 3.0.0
info:
  title: compute API
  description: oci compute API
  version: '20160918'
paths:
  /appCatalogListings:
    get:
      description: Lists the published listings.
      operationId: ListAppCatalogListings
      parameters:
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/FilterByPublisherNameQueryParam'
        - $ref: '#/components/parameters/FilterByPublisherTypeQueryParam'
        - $ref: '#/components/parameters/FilterByDisplayNameQueryParam'
      responses:
        '200':
          description: The list is being retrieved.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages
                of results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppCatalogListingsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: ListAppCatalogListings
      tags:
        - compute
      x-obmcs-client-retries-enabled: true
  /appCatalogListings/{listingId}:
    get:
      description: Gets the specified listing.
      operationId: GetAppCatalogListing
      parameters:
        - $ref: '#/components/parameters/ListingIdPathParam'
      responses:
        '200':
          description: The listing was retrieved.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCatalogListing'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: GetAppCatalogListing
      tags:
        - compute
      x-obmcs-client-retries-enabled: true
  /appCatalogListings/{listingId}/resourceVersions:
    get:
      description: Gets all resource versions for a particular listing.
      operationId: ListAppCatalogListingResourceVersions
      parameters:
        - $ref: '#/components/parameters/ListingIdPathParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
      responses:
        '200':
          description: The listing resource versions were retrieved.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages
                of results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppCatalogListingResourceVersionsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: ListAppCatalogListingResourceVersions
      tags:
        - compute
      x-obmcs-client-retries-enabled: true
  /appCatalogListings/{listingId}/resourceVersions/{resourceVersion}:
    get:
      description: Gets the specified listing resource version.
      operationId: GetAppCatalogListingResourceVersion
      parameters:
        - $ref: '#/components/parameters/ListingIdPathParam'
        - $ref: '#/components/parameters/ResourceVersionPathParam'
      responses:
        '200':
          description: The listing resource version was retrieved.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCatalogListingResourceVersion'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: GetAppCatalogListingResourceVersion
      tags:
        - compute
      x-obmcs-client-retries-enabled: true
  /appCatalogListings/{listingId}/resourceVersions/{resourceVersion}/agreements:
    get:
      description: Retrieves the agreements for a particular resource version of a listing.
      operationId: GetAppCatalogListingAgreements
      parameters:
        - $ref: '#/components/parameters/ListingIdPathParam'
        - $ref: '#/components/parameters/ResourceVersionPathParam'
      responses:
        '200':
          description: Agreements for the listing resource version were retrieved.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCatalogListingResourceVersionAgreements'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: GetAppCatalogListingAgreements
      tags:
        - compute
      x-obmcs-client-retries-enabled: true
  /appCatalogSubscriptions:
    delete:
      description: Delete a subscription for a listing resource version for a compartment.
      operationId: DeleteAppCatalogSubscription
      parameters:
        - $ref: '#/components/parameters/ListingIdQueryParam'
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/ResourceVersionQueryParam'
      responses:
        '204':
          description: The resource version was successfully deleted to for a compartment.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: DeleteAppCatalogSubscription
      tags:
        - compute
    get:
      description: Lists subscriptions for a compartment.
      operationId: ListAppCatalogSubscriptions
      parameters:
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortByQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/FilterByListingIdQueryParam'
      responses:
        '200':
          description: The list of subscriptions has been returned.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages
                of results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppCatalogSubscriptionsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: ListAppCatalogSubscriptions
      tags:
        - compute
      x-obmcs-client-retries-enabled: true
    post:
      description: |
        Create a subscription for listing resource version for a compartment. It will take some time to propagate to all regions.
      operationId: CreateAppCatalogSubscription
      parameters:
        - $ref: '#/components/parameters/RetryTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppCatalogSubscriptionDetails'
        description: Request for the creation of a subscription for listing resource version for a compartment.
        required: true
      responses:
        '200':
          description: The resource version was successfully subscribed to.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCatalogSubscription'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: CreateAppCatalogSubscription
      tags:
        - compute
      x-obmcs-client-retries-enabled: true
  /bootVolumeAttachments/:
    get:
      description: |
        Lists the boot volume attachments in the specified compartment. You can filter the
        list by specifying an instance OCID, boot volume OCID, or both.
      operationId: ListBootVolumeAttachments
      parameters:
        - $ref: '#/components/parameters/RequiredAvailabilityDomainQueryParam'
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/InstanceIdQueryParam'
        - $ref: '#/components/parameters/BootVolumeIdQueryParam'
      responses:
        '200':
          description: The list is being retrieved.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages
                of results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBootVolumeAttachmentsResponse'
            application/x-json-stream:
              schema:
                items:
                  $ref: '#/components/schemas/BootVolumeAttachment'
                type: array
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: ListBootVolumeAttachments
      tags:
        - compute
    post:
      description: |
        Attaches the specified boot volume to the specified instance.
      operationId: AttachBootVolume
      parameters:
        - $ref: '#/components/parameters/RetryTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachBootVolumeDetails'
        description: Attach boot volume request
        required: true
      responses:
        '200':
          description: The boot volume is being attached.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootVolumeAttachment'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: AttachBootVolume
      tags:
        - compute
  /bootVolumeAttachments/{bootVolumeAttachmentId}:
    delete:
      description: |
        Detaches a boot volume from an instance. You must specify the OCID of the boot volume attachment.

        This is an asynchronous operation. The attachment's `lifecycleState` will change to DETACHING temporarily
        until the attachment is completely removed.
      operationId: DetachBootVolume
      parameters:
        - $ref: '#/components/parameters/BootVolumeAttachmentIdPathParam'
        - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        '204':
          description: The request was accepted by the server
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: DetachBootVolume
      tags:
        - compute
    get:
      description: Gets information about the specified boot volume attachment.
      operationId: GetBootVolumeAttachment
      parameters:
        - $ref: '#/components/parameters/BootVolumeAttachmentIdPathParam'
      responses:
        '200':
          description: The boot volume attachment was retrieved.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootVolumeAttachment'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: GetBootVolumeAttachment
      tags:
        - compute
  /clusterNetworks:
    get:
      description: |
        Lists the [cluster networks with instance pools](/iaas/Content/Compute/Tasks/managingclusternetworks.htm)
        in the specified compartment.
      operationId: ListClusterNetworks
      parameters:
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/FilterByDisplayNameQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortByQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - description: |
            A filter to only return resources that match the given lifecycle
            state. The state value is case-insensitive.
          in: query
          name: lifecycleState
          required: false
          x-obmcs-enumref: '#/definitions/ClusterNetworkSummary/lifecycleState'
          schema:
            type: string
      responses:
        '200':
          description: The list was retrieved.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages
                of results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClusterNetworksResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: ListClusterNetworks
      tags:
        - computeManagement
      x-example: |
        GET /20160918/clusterNetworks
        Host: iaas.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
        {
          "compartmentId": "ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>"
        }
      x-related-resource: '#/definitions/ClusterNetwork'
    post:
      description: |
        Creates a [cluster network with instance pools](/iaas/Content/Compute/Tasks/managingclusternetworks.htm).
        A cluster network is a group of high performance computing (HPC), GPU, or optimized bare metal
        instances that are connected with an ultra low-latency remote direct memory access (RDMA) network.
        Cluster networks with instance pools use instance pools to manage groups of identical instances.

        Use cluster networks with instance pools when you want predictable capacity for a specific number of identical
        instances that are managed as a group.

        If you want to manage instances in the RDMA network independently of each other or use different types of instances
        in the network group, create a compute cluster by using the [CreateComputeCluster](#/en/iaas/latest/ComputeCluster/CreateComputeCluster)
        operation.

        To determine whether capacity is available for a specific shape before you create a cluster network,
        use the [CreateComputeCapacityReport](#/en/iaas/latest/ComputeCapacityReport/CreateComputeCapacityReport)
        operation.
      operationId: CreateClusterNetwork
      parameters:
        - $ref: '#/components/parameters/RetryTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClusterNetworkDetails'
        description: Cluster network creation details
        required: true
      responses:
        '200':
          description: The cluster network.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
            opc-work-request-id:
              description: |
                The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
                Use [GetWorkRequest](/api/#/en/workrequests/latest/WorkRequest/GetWorkRequest)
                with this ID to track the status of the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterNetwork'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: CreateClusterNetwork
      tags:
        - computeManagement
      x-example: |
        POST /20160918/clusterNetworks
        Host: iaas.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
        {
          "displayName": "hpc-cluster-network",
          "compartmentId": "ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>",
          "instancePools": [
            {
              "displayName": "hpc-instance-pool-1",
              "instanceConfigurationId": "ocid1.instanceconfiguration.oc1..<var>&lt;unique_ID&gt;</var>",
              "size": 10,
            }
          ],
          "placementConfiguration":
          {
            "availabilityDomain": "Uocm:PHX-AD-1",
            "primarySubnetId": "ocid1.subnet.oc1..<var>&lt;unique_ID&gt;</var>"
          }
        }
  /clusterNetworks/{clusterNetworkId}:
    delete:
      description: |
        Deletes (terminates) a [cluster network with instance pools](/iaas/Content/Compute/Tasks/managingclusternetworks.htm).

        When you delete a cluster network, all of its resources are permanently deleted,
        including associated instances and instance pools.
      operationId: TerminateClusterNetwork
      parameters:
        - $ref: '#/components/parameters/ClusterNetworkIdPathParam'
        - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        '204':
          description: The cluster network is being terminated.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
            opc-work-request-id:
              description: |
                The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
                Use [GetWorkRequest](/api/#/en/workrequests/latest/WorkRequest/GetWorkRequest)
                with this ID to track the status of the request.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '412':
          $ref: '#/components/responses/412'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: TerminateClusterNetwork
      tags:
        - computeManagement
      x-example: |
        ​DELETE /20160918/clusterNetworks/<var>&lt;cluster_network_OCID&gt;</var>
        Host: iaas.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
      x-related-resource: '#/definitions/ClusterNetwork'
    get:
      description: |
        Gets information about a [cluster network with instance pools](/iaas/Content/Compute/Tasks/managingclusternetworks.htm).
      operationId: GetClusterNetwork
      parameters:
        - $ref: '#/components/parameters/ClusterNetworkIdPathParam'
      responses:
        '200':
          description: The cluster network was retrieved.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterNetwork'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: GetClusterNetwork
      tags:
        - computeManagement
      x-example: |
        GET /20160918/clusterNetworks/<var>&lt;cluster_network_OCID&gt;</var>
        Host: iaas.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
    put:
      description: |
        Updates a [cluster network with instance pools](/iaas/Content/Compute/Tasks/managingclusternetworks.htm).
        The OCID of the cluster network remains the same.
      operationId: UpdateClusterNetwork
      parameters:
        - $ref: '#/components/parameters/ClusterNetworkIdPathParam'
        - $ref: '#/components/parameters/RetryTokenHeader'
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClusterNetworkDetails'
        description: Update cluster network
        required: true
      responses:
        '200':
          description: The cluster network was updated.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
