        platformConfig:
          $ref: '#/components/schemas/PlatformConfig'
        preemptibleInstanceConfig:
          $ref: '#/components/schemas/PreemptibleInstanceConfigDetails'
        region:
          description: |
            The region that contains the availability domain the instance is running in.

            For the us-phoenix-1 and us-ashburn-1 regions, `phx` and `iad` are returned, respectively.
            For all other regions, the full region name is returned.

            Examples: `phx`, `eu-frankfurt-1`
          maxLength: 255
          minLength: 1
          type: string
        securityAttributes:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a [ZPR namespace](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attribute-namespaces).
            type: object
          description: |
            [Security attributes](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attributes) are labels
            for a resource that can be referenced in a [Zero Trust Packet Routing](/iaas/Content/zero-trust-packet-routing/overview.htm)
            (ZPR) policy to control access to ZPR-supported resources.

            Example: `{"Oracle-DataSecurity-ZPR": {"MaxEgressCount": {"value":"42","mode":"audit"}}}`
          type: object
        securityAttributesState:
          description: The lifecycle state of the `securityAttributes`
          enum:
            - STABLE
            - UPDATING
          type: string
        shape:
          description: |
            The shape of the instance. The shape determines the number of CPUs and the amount of memory
            allocated to the instance. You can enumerate all available shapes by calling
            [ListShapes](#/en/iaas/latest/Shape/ListShapes).
          maxLength: 255
          minLength: 1
          type: string
        shapeConfig:
          $ref: '#/components/schemas/InstanceShapeConfig'
        sourceDetails:
          $ref: '#/components/schemas/InstanceSourceDetails'
        timeCreated:
          description: |
            The date and time the instance was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).

            Example: `2016-08-25T21:10:29.600Z`
          format: date-time
          type: string
        timeMaintenanceRebootDue:
          description: |
            The date and time the instance is expected to be stopped / started,  in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).
            After that time if instance hasn't been rebooted, Oracle will reboot the instance within 24 hours of the due time.
            Regardless of how the instance was stopped, the flag will be reset to empty as soon as instance reaches Stopped state.
            Example: `2018-05-25T21:10:29.600Z`
          format: date-time
          type: string
