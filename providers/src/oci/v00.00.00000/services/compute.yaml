          maxLength: 255
          minLength: 1
          type: string
        compartmentId:
          description: The OCID of the compartment that contains the instance.
          maxLength: 255
          minLength: 1
          type: string
        dedicatedVmHostId:
          description: |
            The OCID of the dedicated virtual machine host that the instance is placed on.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.

              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a
            namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        displayName:
          description: |
            A user-friendly name. Does not have to be unique, and it's changeable.
            Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        extendedMetadata:
          additionalProperties:
            type: string
            description: (opaque JSON object)
          description: |
            Additional metadata key/value pairs that you provide. They serve the same purpose and functionality
            as fields in the `metadata` object.

            They are distinguished from `metadata` fields in that these can be nested JSON objects (whereas `metadata`
            fields are string/string maps only).
          type: object
        faultDomain:
          description: |
            The name of the fault domain the instance is running in.

            A fault domain is a grouping of hardware and infrastructure within an availability domain.
            Each availability domain contains three fault domains. Fault domains let you distribute your
            instances so that they are not on the same physical hardware within a single availability domain.
            A hardware failure or Compute hardware maintenance that affects one fault domain does not affect
            instances in other fault domains.

            If you do not specify the fault domain, the system selects one for you.

            Example: `FAULT-DOMAIN-1`
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags for this resource. Each tag is a simple key-value pair with no
            predefined name, type, or namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Department": "Finance"}`
          type: object
        id:
          description: The OCID of the instance.
          maxLength: 255
          minLength: 1
          type: string
