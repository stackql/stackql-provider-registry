components:
  schemas:
    DecryptDataDetails:
      description: The details of the encrypted data that you want to decrypt.
      properties:
        associatedData:
          additionalProperties:
            type: string
          description: |
            Information that can be used to provide an encryption context for the encrypted data.
            The length of the string representation of the associated data must be fewer than 4096 characters.
          type: object
        ciphertext:
          description: The encrypted data to decrypt.
          maxLength: 65536
          minLength: 1
          type: string
        encryptionAlgorithm:
          default: AES_256_GCM
          description: |
            The encryption algorithm to use to encrypt or decrypt data with a customer-managed key.
            `AES_256_GCM` indicates that the key is a symmetric key that uses the Advanced Encryption Standard (AES) algorithm and
            that the mode of encryption is the Galois/Counter Mode (GCM). `RSA_OAEP_SHA_1` indicates that the
            key is an asymmetric key that uses the RSA encryption algorithm and uses Optimal Asymmetric Encryption Padding (OAEP).
            `RSA_OAEP_SHA_256` indicates that the key is an asymmetric key that uses the RSA encryption algorithm with a SHA-256 hash
            and uses OAEP.
          enum:
            - AES_256_GCM
            - RSA_OAEP_SHA_1
            - RSA_OAEP_SHA_256
          type: string
        keyId:
          description: The OCID of the key used to encrypt the ciphertext.
          maxLength: 255
          minLength: 1
          type: string
        keyVersionId:
          description: The OCID of the key version used to encrypt the ciphertext.
          maxLength: 255
          minLength: 1
          type: string
        loggingContext:
          additionalProperties:
            type: string
          description: |
            Information that provides context for audit logging. You can provide this additional
            data as key-value pairs to include in audit logs when audit logging is enabled.
          type: object
      required:
        - ciphertext
        - keyId
      type: object
    DecryptedData:
      description: The response to a request to decrypt the encrypted data.
      properties:
        encryptionAlgorithm:
