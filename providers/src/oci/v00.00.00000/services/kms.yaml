  /20180608/encrypt:
    post:
      description: |
        Encrypts data using the given [EncryptDataDetails](/api/#/en/key/latest/datatypes/EncryptDataDetails) resource.
        Plaintext included in the example request is a base64-encoded value of a UTF-8 string.
      operationId: Encrypt
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptDataDetails'
        description: EncryptDataDetails
        required: true
      responses:
        '200':
          description: The encrypted data, presented as ciphertext.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptedData'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Encrypt
      tags:
        - kmsCrypto
      x-example: |
        POST /20180608/encrypt
        Host: <var>&lt;cryptoEndpoint&gt;</var>
        <var>&lt;authorization and other headers&gt;</var>
        {
          "keyId": "ocid1.key.oc1.iad.exampledaaeug.examplestkvmbjdnbickxcvbotxd5q23tteidhj4q2c6qfauxm32i577yu5a",
          "plaintext": "aGVsbG8sIHdvcmxk"
        }
  /20180608/exportKey:
    post:
      description: |
        Exports a specific version of a master encryption key according to the details of the request. For their protection,
        keys that you create and store on a hardware security module (HSM) can never leave the HSM. You can only export keys
        stored on the server. For export, the key version is encrypted by an RSA public key that you provide.
        This operation is not supported for keys having protection mode `EXTERNAL`.
      operationId: ExportKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportKeyDetails'
        description: ExportKeyDetails
        required: true
      responses:
        '200':
          description: The encrypted exported key.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportedKeyData'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Exports a master encryption key.
      tags:
        - kmsCrypto
      x-example: |
        POST /20180608/exportKey
        Host: <var>&lt;cryptoEndpoint&gt;</var>
        <var>&lt;authorization and other headers&gt;</var>
        {
          "keyId": "ocid1.key.oc1.iad.exampledaaeug.examplestkvmbjdnbickxcvbotxd5q23tteidhj4q2c6qfauxm32i577yu5a",
          "keyVersionId": "ocid1.keyversion.oc1.iad.examplevriiaa.examples4h2bocax3damnsxw4cvbbndged2gftlho4ufxwa4faux2eiqwija",
          "algorithm": "RSA_OAEP_AES_SHA256",
          "publicKey": "-----BEGIN PUBLIC KEY----- ..... -----END PUBLIC KEY-----"
        }
      x-related-resource: '#/definitions/ExportedKeyData'
  /20180608/generateDataEncryptionKey:
