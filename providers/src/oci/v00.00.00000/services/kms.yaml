        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/SortByQueryParam'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A list of EKMS private endpoint summary objects.
          headers:
            opc-next-page:
              description: |
                For pagination of a list of items. When paging through a list, if this header appears in the response,
                then there are additional items still to get. Include this value as the `page` parameter for the
                subsequent GET request. For information about pagination, see
                [List Pagination](/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEkmsPrivateEndpointsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Lists all the EKMS private endpoints in the specified compartment
      tags:
        - Ekm
      x-example: |
        GET /20180608/ekmsPrivateEndpoints?compartmentId=<var>&lt;compartmentId&gt;</var>
        Host: kms.us-ashburn-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
    post:
      description: Create a new EKMS private endpoint used to connect to external key manager system
      operationId: CreateEkmsPrivateEndpoint
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/RetryTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEkmsPrivateEndpointDetails'
        description: The information used to create EKMS private endpoint.
        required: true
      responses:
        '202':
          description: The ekmsPrivateEndpoint is being created.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
            opc-work-request-id:
              description: |
                Work request id to track progress of the create operation
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EkmsPrivateEndpoint'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Create a new EKMS private endpoint.
      tags:
        - Ekm
      x-example: |
        POST /20180608/ekmsPrivateEndpoints
        Host: kms.us-ashburn-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
        {
          "subnetId": "ocid1.subnet.oc1.phx.aaaaaaaarzlbjasxeir5mg5sux6fcah2lsdmgpytduuuv4ktnjpb2hpwqunq",
          "freeformTags": {},
          "definedTags": {},
          "compartmentId": "ocid1.tenancy.oc1..exampleati4wjo6cvbxq4iusld5ltpneskcfy7lr4a6wfauxuwrwed5b3xea",
          "displayName": "EKMS Private Endpoint 1",
          "caBundle": "----- BEGIN CERTIFICATE ----- abcRTynddf567= ---- END CERTIFICATE ---",
          "externalKeyManagerIp": "1.2.3.4",
          "port": 1234
        }
      x-related-resource: '#/definitions/EkmsPrivateEndpoint'
