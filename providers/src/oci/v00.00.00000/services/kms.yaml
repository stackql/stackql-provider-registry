        default:
          $ref: '#/components/responses/DefaultError'
      summary: Decrypt
      tags:
        - kmsCrypto
      x-example: |
        POST /20180608/decrypt
        <var>&lt;authorization and other headers&gt;</var>
        {
          "key-id": "ocid1.key.oc1.iad.annnb3f42acuu.abuwcljstscov63fvwp3yrrfepbnqyqlvqso3mfkpqg6aijasggkxglfzjia",
          "key-version-id": "ocid1.keyversion.oc1.iad.annnb3f4a2cuu.arcnlvkg4zyaa.abuwcljsemiqtbccvmfppbpua3ll3f5kmfgireh62hfcxgg7tgcs5gwsg5ma",
          "plaintext": "abcdefgh",
          "plaintext-checksum": "1434553411"
        }
  /20180608/ekmsPrivateEndpoints:
    get:
      description: |
        Returns a list of all the EKMS private endpoints in the specified compartment.
      operationId: ListEkmsPrivateEndpoints
      parameters:
