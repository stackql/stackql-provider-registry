        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecryptDataDetails'
        description: DecryptDataDetails
        required: true
      responses:
        '200':
          description: |
            The decrypted data in plaintext.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
