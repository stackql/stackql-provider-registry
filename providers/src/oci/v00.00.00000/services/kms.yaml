      description: |
        For optimistic concurrency control. In the PUT or DELETE call for a
        resource, set the `if-match` parameter to the value of the etag from a
        previous GET or POST response for that resource. The resource will be
        updated or deleted only if the etag you provide matches the resource's
        current etag value.
      in: header
      name: if-match
      required: false
      schema:
        type: string
    EkmsPrivateEndpointIdentifierPathParam:
      description: Unique EKMS private endpoint identifier.
      in: path
      name: ekmsPrivateEndpointId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    HsmClusterIdPathParam:
      description: The OCID of the HSM Cluster. This is a unique identifier assigned to each hsmCluster.
      in: path
      name: hsmClusterId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    HsmPartitionIdPathParam:
      description: The OCID of the HSM Partition. This is a unique identifier which each hsmPartition will have.
      in: path
      name: hsmPartitionId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ProtectionModeQueryParam:
      description: |
        A key's protection mode indicates how the key persists and where cryptographic operations that use the key are performed. A
        protection mode of `HSM` means that the key persists on a hardware security module (HSM) and all cryptographic operations are
        performed inside the HSM. A protection mode of `SOFTWARE` means that the key persists on the server, protected by the vault's
        RSA wrapping key which persists on the HSM. All cryptographic operations that use a key with a protection mode of
        `SOFTWARE` are performed on the server.
        A protection mode of `EXTERNAL` mean that the key persists on the customer's external key manager which is hosted externally outside of oracle.
        Oracle only hold a reference to that key. All cryptographic operations that use a key with a protection mode of `EXTERNAL` are performed by external key manager.
      in: query
      name: protectionMode
      required: false
      schema:
        type: string
        enum:
          - HSM
          - SOFTWARE
          - EXTERNAL
        default: HSM
    KeyAlgorithmQueryParam:
      description: |
        The algorithm used by a key's key versions to encrypt or decrypt data. Currently, support includes AES, RSA, and ECDSA algorithms.
      in: query
      name: algorithm
      required: false
      schema:
        type: string
        enum:
          - AES
          - RSA
          - ECDSA
    KeyLengthQueryParam:
      description: |
        The length of the key in bytes, expressed as an integer. Supported values include 16, 24, or 32.
      in: query
      name: length
      required: false
      schema:
        type: integer
    KeyCurveQueryParam:
      description: |
        The curve ID of the keys. (This pertains only to ECDSA keys.)
      in: query
      name: curveId
      required: false
      schema:
        type: string
        enum:
          - NIST_P256
          - NIST_P384
          - NIST_P521
    ContentLengthHeader:
      description: The content length of the body.
      in: header
      name: content-length
      required: true
      schema:
        type: integer
        format: int64
    OptionalContentMD5Header:
      description: |
        The base64-encoded MD5 hash value of the body, as described in [RFC 2616](https://tools.ietf.org/rfc/rfc2616), section 14.15.
        If the Content-MD5 header is present, Key Management performs an integrity check on the body of the HTTP request by computing the MD5
        hash for the body and comparing it to the MD5 hash supplied in the header. If the two hashes don't match, the object is rejected and
        a response with 400 Unmatched Content MD5 error is returned, along with the message: "The computed MD5 of the request body (ACTUAL_MD5)
        does not match the Content-MD5 header (HEADER_MD5)."
      in: header
      name: content-md5
      schema:
        type: string
    KeyIdPathParam:
      description: The OCID of the key.
      in: path
      name: keyId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    KeyVersionIdPathParam:
      description: The OCID of the key version.
      in: path
      name: keyVersionId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ReplicationIdPathParam:
      description: |
        replicationId associated with an operation on a resource
      in: path
      name: replicationId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    VaultIdPathParam:
      description: The OCID of the vault.
      in: path
      name: vaultId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
