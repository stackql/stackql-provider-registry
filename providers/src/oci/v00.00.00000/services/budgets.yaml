openapi: 3.0.0
info:
  title: budgets API
  description: oci budgets API
  version: '20190111'
paths:
  /budgets:
    get:
      description: |
        Gets a list of budgets in a compartment.

        By default, ListBudgets returns budgets of the 'COMPARTMENT' target type, and the budget records with only one target compartment OCID.

        To list all budgets, set the targetType query parameter to ALL (for example: 'targetType=ALL').

        Clients should ignore new targetTypes, or upgrade to the latest version of the client SDK to handle new targetTypes.
      operationId: ListBudgets
      parameters:
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/SortByQueryParam'
        - $ref: '#/components/parameters/LifecycleStateQueryParam'
        - $ref: '#/components/parameters/DisplayNameQueryParam'
        - $ref: '#/components/parameters/TargetTypeQueryParam'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A page of BudgetSummary objects.
          headers:
            opc-next-page:
              description: |
                For pagination of a list of `Budget`s. If this header appears in the response, then this
                is a partial list of budgets. Include this value as the `page` parameter in a subsequent
                GET request to get the next batch of budgets.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If
                you need to contact Oracle about a particular request,
                please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBudgetsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Returns a list of Budgets
      tags:
        - budget
    post:
      description: |
        Creates a new budget.
      operationId: CreateBudget
      parameters:
        - $ref: '#/components/parameters/RetryTokenHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetDetails'
        description: Details for the new budget.
        required: true
      responses:
        '200':
          description: The budget was successfully created.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If
                you need to contact Oracle about a particular request,
                please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a new Budget
      tags:
        - budget
      x-example: |
        POST /20190111/budgets
        Host: usage.us-phoenix-1.oci.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
        {
          "compartmentId": "ocid1.compartment.oc1..aaaaaaaayzfqeibduyox6iib3olcmdar3ugly4fmameq4h7lcdlihrvur7xq",
          "targetType" : "COMPARTMENT",
          "targets" : ["ocid1.compartment.oc1..aaaaaaaayzfqeibduyox6iib3olcmdar3ugly4fmameq4h7lcdlihrvur7xq"],
          "amount": "100.00",
          "resetPeriod": "Monthly"
        }
