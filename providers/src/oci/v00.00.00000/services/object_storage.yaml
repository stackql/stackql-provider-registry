              - DEFINED_TAGS
              - FREEFORM_TAGS
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        targetBucket:
          description: |
            The target bucket name to upload the generated report. Create the target bucket before creating the rule.
          maxLength: 256
          minLength: 1
          type: string
      required:
        - schemaFields
        - targetBucket
      type: object
