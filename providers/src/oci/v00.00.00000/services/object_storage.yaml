  parameters:
    ClientRequestIdHeader:
      description: The client request ID for tracing.
      in: header
      name: opc-client-request-id
      schema:
        type: string
    OptionalCompartmentIdQueryParam:
      description: |
        This is an optional field representing either the tenancy [OCID](/Content/General/Concepts/identifiers.htm) or the compartment
        [OCID](/Content/General/Concepts/identifiers.htm) within the tenancy whose Object Storage namespace is to be retrieved.
      in: query
      name: compartmentId
      schema:
        type: string
    NamespacePathParam:
      description: The Object Storage namespace used for the request.
      in: path
      name: namespaceName
      required: true
      schema:
        type: string
        minLength: 1
        pattern: '[A-Za-z][A-Za-z0-9\\-_\\.]+'
    CompartmentIdQueryParam:
      description: The ID of the compartment in which to list buckets.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
    PaginationLimitQueryParam:
      description: |
        For list pagination. The maximum number of results per page, or items to return in a paginated
        "List" call. For important details about how pagination works, see
        [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    PaginationTokenQueryParam:
      description: |
        For list pagination. The value of the `opc-next-page` response header from the previous "List" call. For important
        details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
      in: query
      name: page
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    ListBucketFieldsQueryParam:
      description: |
        Bucket summary in list of buckets includes the 'namespace', 'name', 'compartmentId', 'createdBy', 'timeCreated',
        and 'etag' fields. This parameter can also include 'tags' (freeformTags and definedTags). The only supported value of this parameter is 'tags' for now. Example 'tags'.
      in: query
      name: fields
      style: form
      explode: false
      schema:
        type: array
        items:
          enum:
            - tags
          type: string
    BucketPathParam:
      description: |
        The name of the bucket. Avoid entering confidential information.
        Example: `my-new-bucket1`
      in: path
      name: bucketName
      required: true
      schema:
        type: string
        minLength: 1
        pattern: '[A-Za-z0-9\\-_\\.]+'
    IfMatchHeader:
      description: |
        The entity tag (ETag) to match with the ETag of an existing resource. If the specified ETag matches the ETag of
        the existing resource, GET and HEAD requests will return the resource and PUT and POST requests will upload
        the resource.
      in: header
      name: if-match
      schema:
        type: string
    IfNoneMatchHeaderExceptStar:
      description: |
        The entity tag (ETag) to avoid matching. Wildcards ('*') are not allowed. If the specified ETag does not
        match the ETag of the existing resource, the request returns the expected response. If the ETag matches
        the ETag of the existing resource, the request returns an HTTP 304 status without a response body.
      in: header
      name: if-none-match
      schema:
        type: string
    GetBucketFieldsQueryParam:
      description: |
        Bucket summary includes the 'namespace', 'name', 'compartmentId', 'createdBy', 'timeCreated',
        and 'etag' fields. This parameter can also include 'approximateCount' (approximate number of objects), 'approximateSize'
        (total approximate size in bytes of all objects) and 'autoTiering' (state of auto tiering on the bucket).
        For example 'approximateCount,approximateSize,autoTiering'.
      in: query
      name: fields
      style: form
      explode: false
      schema:
        type: array
        items:
          enum:
            - approximateCount
            - approximateSize
            - autoTiering
          type: string
          x-obmcs-inline-enum: false
    OptionalSSECustomerAlgorithmHeader:
      description: |
        The optional header that specifies "AES256" as the encryption algorithm. For more information, see
        [Using Your Own Keys for Server-Side Encryption](/Content/Object/Tasks/usingyourencryptionkeys.htm).
      in: header
      name: opc-sse-customer-algorithm
      x-default-description: 'null'
      schema:
        type: string
    OptionalSSECustomerKeyHeader:
      description: |
        The optional header that specifies the base64-encoded 256-bit encryption key to use to encrypt or
        decrypt the data. For more information, see
        [Using Your Own Keys for Server-Side Encryption](/Content/Object/Tasks/usingyourencryptionkeys.htm).
      in: header
      name: opc-sse-customer-key
      x-default-description: 'null'
      schema:
        type: string
    OptionalSSECustomerKeySHA256Header:
      description: |
        The optional header that specifies the base64-encoded SHA256 hash of the encryption key. This
        value is used to check the integrity of the encryption key. For more information, see
        [Using Your Own Keys for Server-Side Encryption](/Content/Object/Tasks/usingyourencryptionkeys.htm).
      in: header
      name: opc-sse-customer-key-sha256
      x-default-description: 'null'
      schema:
        type: string
    OptionalSrcSSECustomerAlgorithmHeader:
      description: |
        The optional header that specifies "AES256" as the encryption algorithm to use to decrypt the source
        object. For more information, see
        [Using Your Own Keys for Server-Side Encryption](/Content/Object/Tasks/usingyourencryptionkeys.htm).
      in: header
      name: opc-source-sse-customer-algorithm
      x-default-description: 'null'
      schema:
        type: string
    OptionalSrcSSECustomerKeyHeader:
      description: |
        The optional header that specifies the base64-encoded 256-bit encryption key to use to decrypt
        the source object. For more information, see
        [Using Your Own Keys for Server-Side Encryption](/Content/Object/Tasks/usingyourencryptionkeys.htm).
      in: header
      name: opc-source-sse-customer-key
      x-default-description: 'null'
      schema:
        type: string
    OptionalSrcSSECustomerKeySHA256Header:
      description: |
        The optional header that specifies the base64-encoded SHA256 hash of the encryption key used to
        decrypt the source object. This value is used to check the integrity of the encryption key. For
        more information, see
        [Using Your Own Keys for Server-Side Encryption](/Content/Object/Tasks/usingyourencryptionkeys.htm).
      in: header
      name: opc-source-sse-customer-key-sha256
      x-default-description: 'null'
      schema:
        type: string
    OptionalSSEKMSKeyIdHeader:
      description: |
        The [OCID](/Content/General/Concepts/identifiers.htm) of a master encryption key used to call the Key
        Management service to generate a data encryption key or to encrypt or decrypt a data encryption key.
      in: header
      name: opc-sse-kms-key-id
      x-default-description: 'null'
      schema:
        type: string
    ReencryptBucketKeyOnlyQueryParam:
      description: If true, reencrypt only the intermediate bucket keys and skip everything else in the bucket.
      in: query
      name: isReencryptBucketKeyOnly
      required: false
      schema:
        type: boolean
        default: false
    ObjectPathParam:
      description: |
        The name of the object. Avoid entering confidential information.
        Example: `test/object1.log`
      in: path
      name: objectName
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: '[^\\r\\n\\00#\\?]+'
    VersionIdQueryParam:
      description: VersionId used to identify a particular version of the object
      in: query
      name: versionId
      required: false
      schema:
        type: string
        pattern: '[A-Za-z][A-Za-z0-9\\-_\\.]+'
    IfNoneMatchHeader:
      description: |
        The entity tag (ETag) to avoid matching. The only valid value is '*', which indicates that the request should
        fail if the resource already exists.
      in: header
      name: if-none-match
      schema:
        type: string
        minLength: 0
        maxLength: 1
        pattern: ^[*]$
    PrefixQueryParam:
      description: The string to use for matching against the start of object names in a list query.
      in: query
      name: prefix
      schema:
        type: string
    StartWithQueryParam:
      description: Returns object names which are lexicographically greater than or equal to this parameter.
      in: query
      name: start
      schema:
        type: string
    EndBeforeQueryParam:
      description: Returns object names which are lexicographically strictly less than this parameter.
      in: query
      name: end
      schema:
        type: string
    DelimiterQueryParam:
      description: |
        When this parameter is set, only objects whose names do not contain the delimiter character
        (after an optionally specified prefix) are returned in the objects key of the response body.
        Scanned objects whose names contain the delimiter have the part of their name up to the first
        occurrence of the delimiter (including the optional prefix) returned as a set of prefixes.
        Note that only '/' is a supported delimiter character at this time.
      in: query
      name: delimiter
      schema:
        type: string
    ObjectFieldsQueryParam:
      description: |
        Object summary by default includes only the 'name' field. Use this parameter to also
        include 'size' (object size in bytes), 'etag', 'md5', 'timeCreated' (object creation date and time),
        'timeModified' (object modification date and time), 'storageTier' and 'archivalState' fields.
        Specify the value of this parameter as a comma-separated, case-insensitive list of those field names. 
        For example 'name,etag,timeCreated,md5,timeModified,storageTier,archivalState'.
      in: query
      name: fields
      x-obmcs-inline-enum: false
      schema:
        type: string
        enum:
          - name
          - size
          - etag
          - timeCreated
          - md5
          - timeModified
          - storageTier
          - archivalState
    StartAfterQueryParam:
      description: Returns object names which are lexicographically strictly greater than this parameter.
      in: query
      name: startAfter
      schema:
        type: string
    RangeRequestHeader:
      description: |
        Optional byte range to fetch, as described in [RFC 7233](https://tools.ietf.org/html/rfc7233#section-2.1).
        Note that only a single range of bytes is supported.
      in: header
      name: range
      schema:
        type: string
    ResponseContentDispositionQueryParam:
      description: Specify this query parameter to override the value of the Content-Disposition response header in the GetObject response.
      in: query
      name: httpResponseContentDisposition
      required: false
      schema:
        type: string
    ResponseCacheControlQueryParam:
      description: Specify this query parameter to override the Cache-Control response header in the GetObject response.
      in: query
      name: httpResponseCacheControl
      required: false
      schema:
        type: string
    ResponseContentTypeQueryParam:
      description: Specify this query parameter to override the Content-Type response header in the GetObject response.
      in: query
      name: httpResponseContentType
      required: false
      schema:
        type: string
    ResponseContentLanguageQueryParam:
      description: Specify this query parameter to override the Content-Language response header in the GetObject response.
      in: query
      name: httpResponseContentLanguage
      required: false
      schema:
        type: string
    ResponseContentEncodingQueryParam:
      description: Specify this query parameter to override the Content-Encoding response header in the GetObject response.
      in: query
      name: httpResponseContentEncoding
      required: false
      schema:
        type: string
    ResponseExpiresQueryParam:
      description: Specify this query parameter to override the Expires response header in the GetObject response.
      in: query
      name: httpResponseExpires
      required: false
      schema:
        type: string
    Expect100ContinueHeader:
      description: |
        A value of `100-continue` requests preliminary verification of the request method, path, and headers before the request body is sent.
        If no error results from such verification, the server will send a 100 (Continue) interim response to indicate readiness for the request body.
        The only allowed value for this parameter is "100-Continue" (case-insensitive).
      in: header
      name: Expect
      x-default-description: |
        If you do not supply this parameter, the service will accept the entire request body first, before verifying the request.
        If there is an error, accepting the entire request body first may have a negative performance impact.
        If you do supply this parameter, but with a value other than "100-Continue" (case-insensitive), you will receive a 400 (Bad Request) response.
      schema:
        type: string
        pattern: ^(100-[cC][oO][nN][tT][iI][nN][uU][eE])?$
    RequiredContentLengthHeader:
      description: The content length of the body.
      in: header
      name: Content-Length
      required: true
      schema:
        type: integer
        format: int64
    OptionalContentMD5Header:
      description: |
        The optional header that defines the base64-encoded MD5 hash of the body. If the optional Content-MD5 header is present, Object
        Storage performs an integrity check on the body of the HTTP request by computing the MD5 hash for the body and comparing it to the
        MD5 hash supplied in the header. If the two hashes do not match, the object is rejected and an HTTP-400 Unmatched Content MD5 error
        is returned with the message:

        "The computed MD5 of the request body (ACTUAL_MD5) does not match the Content-MD5 header (HEADER_MD5)"
      in: header
      name: Content-MD5
      schema:
        type: string
    ObjectAppendQueryParam:
      description: |
        The option to commit a new chunk of data to the end of an existing object. If the object doesn't exist, it'll create a new one.
        The maximum size of the data to append to an object in a single append request is 512MB. Each object can only be appended up to 10,000 times.
      in: query
      name: isAppend
      required: false
      schema:
        type: boolean
    OptionalContentTypeHeader:
      description: |
        The optional Content-Type header that defines the standard MIME type format of the object. Content type defaults to
        'application/octet-stream' if not specified in the PutObject call. In the OCI CLI, you can set this value to 'auto'
        to have the CLI infer the content type from the file name. Specifying values for this header has no effect on Object
        Storage behavior. Programs that read the object determine what to do based on the value provided. For example, you
        could use this header to identify and perform special operations on text only objects.
      in: header
      name: Content-Type
      schema:
        type: string
    OptionalContentLanguageHeader:
      description: |
        The optional Content-Language header that defines the content language of the object to upload. Specifying
        values for this header has no effect on Object Storage behavior. Programs that read the object determine what
        to do based on the value provided. For example, you could use this header to identify and differentiate objects
        based on a particular language.
      in: header
      name: Content-Language
      schema:
        type: string
    OptionalContentEncodingHeader:
      description: |
        The optional Content-Encoding header that defines the content encodings that were applied to the object to
        upload. Specifying values for this header has no effect on Object Storage behavior. Programs that read the
        object determine what to do based on the value provided. For example, you could use this header to determine
        what decoding mechanisms need to be applied to obtain the media-type specified by the Content-Type header of
        the object.
      in: header
      name: Content-Encoding
      schema:
        type: string
    OptionalContentDispositionHeader:
      description: |
        The optional Content-Disposition header that defines presentational information for the object to be
        returned in GetObject and HeadObject responses. Specifying values for this header has no effect on Object
        Storage behavior. Programs that read the object determine what to do based on the value provided.
        For example, you could use this header to let users download objects with custom filenames in a browser.
      in: header
      name: Content-Disposition
      schema:
        type: string
    OptionalCacheControlHeader:
      description: |
        The optional Cache-Control header that defines the caching behavior value to be returned in GetObject and
        HeadObject responses. Specifying values for this header has no effect on Object Storage behavior. Programs
        that read the object determine what to do based on the value provided.
        For example, you could use this header to identify objects that require caching restrictions.
      in: header
      name: Cache-Control
      schema:
        type: string
    OptionalStorageTierHeader:
      description: |
        The storage tier that the object should be stored in. If not specified, the object will be stored in
        the same storage tier as the bucket.
      in: header
      name: storage-tier
      required: false
      x-obmcs-top-level-enum: '#/definitions/StorageTier'
      schema:
        type: string
        enum:
          - Standard
          - InfrequentAccess
          - Archive
    OpcMetaHeader:
      description: Optional user-defined metadata key and value.
      in: header
      name: opc-meta-*
      x-obmcs-header-collection: true
      x-obmcs-prefix: opc-meta-
      schema:
        type: string
    ObjectNamePrefixQueryParam:
      description: User-specified object name prefixes can be used to query and return a list of pre-authenticated requests.
      in: query
      name: objectNamePrefix
      schema:
        type: string
    PreauthenticatedRequestIdPathParam:
      description: |
        The unique identifier for the pre-authenticated request. This can be used to manage operations against
        the pre-authenticated request, such as GET or DELETE.
      in: path
      name: parId
      required: true
      schema:
        type: string
