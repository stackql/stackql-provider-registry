        name:
          description: |
            The name given to the Private Endpoint. Avoid entering confidential information.
            Example: my-new-pe1
          type: string
        namespace:
          description: The Object Storage namespace with which the Private Endpoint is associated.
          type: string
        prefix:
          description: |
            A prefix to use for the private endpoint. The customer VCN's DNS records are
            updated with this prefix. The prefix input from the customer will be the first sub-domain in the endpointFqdn.
            Example: If the prefix chosen is "abc", then the endpointFqdn will be 'abc.private.objectstorage.<region>.oraclecloud.com'
          maxLength: 63
          minLength: 1
          type: string
        timeCreated:
          description: The date and time the Private Endpoint was created, as described in [RFC 2616](https://tools.ietf.org/html/rfc2616#section-14.29).
          format: date-time
          type: string
        timeModified:
          description: The date and time the Private Endpoint was updated, as described in [RFC 2616](https://tools.ietf.org/html/rfc2616#section-14.29).
