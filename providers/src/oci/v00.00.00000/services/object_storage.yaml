    ObjectNameFilter:
      description: |
        A filter that compares object names to a set of prefixes or patterns to determine if a rule applies to a
        given object. The filter can contain include glob patterns, exclude glob patterns and inclusion prefixes.
        The inclusion prefixes property is kept for backward compatibility. It is recommended to use inclusion patterns
        instead of prefixes. Exclusions take precedence over inclusions.
      properties:
        exclusionPatterns:
          description: |
            An array of glob patterns to match the object names to exclude. An empty array is ignored. Exclusion
            patterns take precedence over inclusion patterns.
            A Glob pattern is a sequence of characters to match text. Any character that appears in the pattern, other
            than the special pattern characters described below, matches itself.
                Glob patterns must be between 1 and 1024 characters.

                The special pattern characters have the following meanings:

                \           Escapes the following character
                *           Matches any string of characters.
                ?           Matches any single character .
                [...]       Matches a group of characters. A group of characters can be:
                                A set of characters, for example: [Zafg9@]. This matches any character in the brackets.
                                A range of characters, for example: [a-z]. This matches any character in the range.
                                    [a-f] is equivalent to [abcdef].
                                    For character ranges only the CHARACTER-CHARACTER pattern is supported.
                                        [ab-yz] is not valid
                                        [a-mn-z] is not valid
                                    Character ranges can not start with ^ or :
                                    To include a '-' in the range, make it the first or last character.
          items:
            maxLength: 1024
            minLength: 1
            type: string
          maxItems: 1000
          type: array
        inclusionPatterns:
          description: |
            An array of glob patterns to match the object names to include. An empty array includes all objects in the
            bucket. Exclusion patterns take precedence over inclusion patterns.
            A Glob pattern is a sequence of characters to match text. Any character that appears in the pattern, other
            than the special pattern characters described below, matches itself.
                Glob patterns must be between 1 and 1024 characters.

                The special pattern characters have the following meanings:

                \           Escapes the following character
                *           Matches any string of characters.
                ?           Matches any single character .
                [...]       Matches a group of characters. A group of characters can be:
                                A set of characters, for example: [Zafg9@]. This matches any character in the brackets.
                                A range of characters, for example: [a-z]. This matches any character in the range.
                                    [a-f] is equivalent to [abcdef].
                                    For character ranges only the CHARACTER-CHARACTER pattern is supported.
                                        [ab-yz] is not valid
                                        [a-mn-z] is not valid
                                    Character ranges can not start with ^ or :
                                    To include a '-' in the range, make it the first or last character.
          items:
            maxLength: 1024
            minLength: 1
            type: string
          maxItems: 1000
          type: array
        inclusionPrefixes:
          description: |
            An array of object name prefixes that the rule will apply to. An empty array means to include all objects.
          items:
            type: string
          type: array
      type: object
    RuleFilter:
      description: Defines rule filter.
      properties:
        createdWithinDays:
          default: -1
          description: |
            Objects created within the last createdWithinDays days (inclusive) will be considered.
            For example, a value of 3 includes objects created within the last three days.
            During report generation, the calculation is based on the report generation start time, rounded up to the next full day.
            The object age is calculated relative to this adjusted start time.
            This parameter is optional. If not provided, the value is assumed to be -1,
            meaning no filtering based on object age will be applied, and all objects will be included in the report regardless of their creation date.
            A value of -1 explicitly indicates that all objects should be included.
          type: integer
        exclusionPrefixes:
          description: |
            An array of prefixes that the rule will exclude.
            If the array is not provided, no exclusions will be applied, and all objects will be considered.
            Any object matching any Exclude filter will be excluded, regardless of matching Include filters.
            Exclude filters take precedence over Include filters.
          items:
            maxLength: 1024
            minLength: 1
            type: string
          maxItems: 5
          type: array
          uniqueItems: true
        inclusionPrefixes:
          description: |
            An array of prefixes to which the rule will apply.
            If the array is not provided, the rule applies to all prefixes.
            If one or more prefixes are specified, only buckets/objects matching any of the specified prefixes will be included.
            Objects matching any Include filter will be included unless excluded by an Exclude filter.
            In case of overlap, Exclude filters take precedence over Include filters.
          items:
            maxLength: 1024
            minLength: 1
            type: string
          maxItems: 5
          type: array
          uniqueItems: true
        objectTypes:
          description: |
            An array of object types to be included in report.
          items:
            default: OBJECT
            enum:
              - OBJECT
            type: string
          maxItems: 1
          minItems: 1
          type: array
          uniqueItems: true
      type: object
    Report:
      description: Defines output report.
      properties:
        format:
          default: PARQUET
          description: |
            The inventory report format specification
          enum:
            - PARQUET
          type: string
        schemaFields:
          description: |
            An array of fields to be included in report.
            The valid schemaFields for 'object' rules are:
              - SIZE
              - ETAG
              - TIME_CREATED
              - MD5_CHECKSUM
              - TIME_MODIFIED
              - STORAGE_TIER
              - ARCHIVAL_STATE
              - COMPARTMENT_ID
              - CREATED_BY
            The valid schemaFields for 'bucket' rules are:
