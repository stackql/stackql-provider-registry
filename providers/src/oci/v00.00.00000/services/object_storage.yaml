    put:
      description: |
        By default, buckets created using the Amazon S3 Compatibility API or the Swift API are created in the root
        compartment of the Oracle Cloud Infrastructure tenancy.

        You can change the default Swift/Amazon S3 compartmentId designation to a different compartmentId. All
        subsequent bucket creations will use the new default compartment, but no previously created
        buckets will be modified. A user must have OBJECTSTORAGE_NAMESPACE_UPDATE permission to make changes to the default
        compartments for Amazon S3 and Swift.
      operationId: UpdateNamespaceMetadata
      parameters:
        - $ref: '#/components/parameters/NamespacePathParam'
        - $ref: '#/components/parameters/ClientRequestIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNamespaceMetadataDetails'
        description: Request object for update NamespaceMetadata.
        required: true
      responses:
        '200':
          description: The updated NamespaceMetadata information.
          headers:
            opc-client-request-id:
              description: Echoes back the value passed in the opc-client-request-id header, for use by clients when debugging.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular
                request, provide this request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceMetadata'
            application-json:
              examples:
                response:
                  value: |
                    {
                      "name": "ansh8lvru1zp",
                      "defaultS3CompartmentId": "ocid.compartment.oc1..exampleuniquecompartmentS3ID",
                      "defaultSwiftCompartmentId": "ocid.compartment.oc1..exampleuniquecompartmentS3ID"
                    }
