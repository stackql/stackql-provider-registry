    InventoryRuleSummary:
      description: The summary of a inventory rule.
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/RuleFilter'
        isEnabled:
          default: true
          description: |
            A Boolean that determines whether this rule is currently enabled.
          type: boolean
        report:
          $ref: '#/components/schemas/Report'
        reportRecurrences:
          default: FREQ=MONTHLY
          description: |
            Defines the recurring times for report generation using iCal RFC 5545 format.
            The report will be generated based on the provided frequency (e.g., daily, weekly, monthly).
            Supported values:
            -  FREQ=DAILY (Daily recurrence)
            -  FREQ=WEEKLY (Weekly recurrence without specifying days)
            -  FREQ=MONTHLY (Monthly recurrence without specifying days, default value)
            The recurrence is based purely on the frequency (e.g., daily, weekly, monthly), 
            with no support for finer details like specific days or intervals.
          format: x-obmcs-recurring-time
          type: string
        ruleName:
          description: |
            The user-defined name for the inventory rule.
            - Must be unique within the tenancy's Object Storage namespace.
            - Must be between 1 and 256 characters in length.
            - Valid characters are uppercase and lowercase letters, numbers, hyphens (-), underscores (_), and periods (.).
          maxLength: 256
          minLength: 1
          type: string
        ruleType:
          default: OBJECT_RULE
          description: |
            The inventory rule type.
          enum:
            - BUCKET_RULE
            - OBJECT_RULE
          type: string
        etag:
          description: The entity tag (ETag) for the inventory rule.
          type: string
        id:
          description: Unique identifier for the inventory rule.
          type: string
        timeCreated:
          description: The date and time that the inventory rule was created as per [RFC3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
        timeModified:
          description: The date and time that the inventory rule was modified as per [RFC3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
      required:
        - ruleName
        - filter
        - report
        - id
        - etag
        - timeCreated
        - timeModified
