  /n/{namespaceName}/b/:
    get:
      description: |
        Gets a list of all BucketSummary items in a compartment. A BucketSummary contains only summary fields for the bucket
        and does not contain fields like the user-defined metadata.

        ListBuckets returns a BucketSummary containing at most 1000 buckets. To paginate through more buckets, use the returned
        `opc-next-page` value with the `page` request parameter.

        To use this and other API operations, you must be authorized in an IAM policy. If you are not authorized,
        talk to an administrator. If you are an administrator who needs to write policies to give users access, see
        [Getting Started with Policies](/Content/Identity/Concepts/policygetstarted.htm).
      operationId: ListBuckets
      parameters:
        - $ref: '#/components/parameters/NamespacePathParam'
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/ListBucketFieldsQueryParam'
        - $ref: '#/components/parameters/ClientRequestIdHeader'
      responses:
        '200':
          description: A page of BucketSummary objects.
          headers:
            opc-client-request-id:
              description: Echoes back the value passed in the opc-client-request-id header, for use by clients when debugging.
              schema:
                type: string
            opc-next-page:
              description: |
                For paginating a list of buckets.
                In the GET request, set the limit to the number of buckets items that you want returned in the response.
                If the `opc-next-page` header appears in the response, then this is a partial list and there are additional
                buckets to get. Include the header's value as the `page` parameter in the subsequent GET request to get the
                next batch of buckets. Repeat this process to retrieve the entire list of buckets.
                By default, the page limit is set to 25 buckets per page, but you can specify a value from 1 to 1000.

                For more details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular
                request, provide this request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBucketsResponse'
            application-json:
              examples:
                response:
                  value: |
                    [
                      {
                        "namespace": "ansh8lvru1zp",
