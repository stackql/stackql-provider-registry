  /n/{namespaceName}/b/{bucketName}/objectversions:
    get:
      description: |
        Lists the object versions in a bucket.

        ListObjectVersions returns an ObjectVersionCollection containing at most 1000 object versions. To paginate through
        more object versions, use the returned `opc-next-page` value with the `page` request parameter.

        To use this and other API operations, you must be authorized in an IAM policy. If you are not authorized,
        talk to an administrator. If you are an administrator who needs to write policies to give users access, see
        [Getting Started with Policies](/Content/Identity/Concepts/policygetstarted.htm).
      operationId: ListObjectVersions
      parameters:
        - $ref: '#/components/parameters/NamespacePathParam'
        - $ref: '#/components/parameters/BucketPathParam'
        - $ref: '#/components/parameters/PrefixQueryParam'
        - $ref: '#/components/parameters/StartWithQueryParam'
        - $ref: '#/components/parameters/EndBeforeQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/DelimiterQueryParam'
        - $ref: '#/components/parameters/ObjectFieldsQueryParam'
        - $ref: '#/components/parameters/ClientRequestIdHeader'
        - $ref: '#/components/parameters/StartAfterQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
      responses:
        '200':
          description: |
            List of object version summaries, including optional prefixes and, in a truncated response, the `opc-next-page` to
            start the next page of results.
          headers:
            opc-client-request-id:
              description: Echoes back the value passed in the opc-client-request-id header, for use by clients when debugging.
              schema:
                type: string
            opc-next-page:
              description: |
                For paginating a list of object versions.
                In the GET request, set the limit to the number of object versions that you want returned in the response.
                If the `opc-next-page` header appears in the response, then this is a partial list and there are
                additional object versions to get. Include the header's value as the `page` parameter in the subsequent
                GET request to get the next batch of object versions and prefixes. Repeat this process to retrieve the entire list of
                object versions and prefixes.

                For more details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular
                request, provide this request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectVersionCollection'
            application-json:
              examples:
                response:
                  value: |
                    {
                      "items": [
                        {
                          "name": "1MB.data",
                          "versionId": "A_v1",
                          "isDeleteMarker": true,
                          "timeModified": "Thu Feb 27 16:22:54 PST 2020"
                        },
                        {
                          "name": "2MB.data",
                          "versionId": "B_v1",
                          "isDeleteMarker": false,
                          "timeModified": "Thu Feb 27 16:22:54 PST 2020"
                        }
                      ]
                    }
