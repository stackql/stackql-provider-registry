openapi: 3.0.0
info:
  title: object_storage API
  description: oci object_storage API
  version: '20160918'
paths:
  /n/:
    get:
      description: |
        Each Oracle Cloud Infrastructure tenant is assigned one unique and uneditable Object Storage namespace. The namespace
        is a system-generated string assigned during account creation. For some older tenancies, the namespace string may be
        the tenancy name in all lower-case letters. You cannot edit a namespace.

        GetNamespace returns the name of the Object Storage namespace for the user making the request.
        If an optional compartmentId query parameter is provided, GetNamespace returns the namespace name of the corresponding
        tenancy, provided the user has access to it.
      operationId: GetNamespace
      parameters:
        - $ref: '#/components/parameters/ClientRequestIdHeader'
        - $ref: '#/components/parameters/OptionalCompartmentIdQueryParam'
      responses:
        '200':
          description: The requesting user's Object Storage namespace string.
          content:
            application/json:
              schema:
                pattern: '[A-Za-z][A-Za-z0-9\\-_\\.]+'
                type: string
            application-json:
              examples:
                response:
                  value: |
                    "ansh8lvru1zp"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
      summary: GET Namespace Name
      tags:
        - objectStorage
      x-example: |
        GET /n/ HTTP/1.1
        Host: objectstorage.us-phoenix-1.oraclecloud.com
        connection: keep-alive
        accept-encoding: gzip, deflate
        accept: */*
        user-agent: python-requests/2.11.0
        date: Fri, 12 Aug 2016 22:42:15 GMT
        authorization: <var>&lt;authorization and other headers&gt;</var>
      x-related-resource: '#/definitions/Namespace'
  /n/{namespaceName}:
    get:
      description: |
        Gets the metadata for the Object Storage namespace, which contains defaultS3CompartmentId and
        defaultSwiftCompartmentId.

        Any user with the OBJECTSTORAGE_NAMESPACE_READ permission will be able to see the current metadata. If you are
        not authorized, talk to an administrator. If you are an administrator who needs to write policies
        to give users access, see
        [Getting Started with Policies](/Content/Identity/Concepts/policygetstarted.htm).
      operationId: GetNamespaceMetadata
      parameters:
        - $ref: '#/components/parameters/NamespacePathParam'
        - $ref: '#/components/parameters/ClientRequestIdHeader'
      responses:
        '200':
          description: The default metadata.
          headers:
            opc-client-request-id:
              description: Echoes back the value passed in the opc-client-request-id header, for use by clients when debugging.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular
                request, provide this request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceMetadata'
            application-json:
              examples:
                response:
                  value: |
                    [
                      {
                        "namespace": "ansh8lvru1zp",
                        "defaultS3CompartmentId": "ocid.compartment.oc1..exampleuniquecompartmentS3ID",
                        "defaultSwiftCompartmentId": "ocid.compartment.oc1..exampleuniquecompartmentSwiftID"
                      }
                    ]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
      summary: GET Namespace Metadata
      tags:
