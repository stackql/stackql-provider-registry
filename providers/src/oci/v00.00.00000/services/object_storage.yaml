    WorkRequestSummary:
      description: A summary of the status of a work request.
      properties:
        compartmentId:
          description: |
            The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that contains the work request. Work
            requests are scoped to the same compartment as the resource the work request affects.

            If the work request affects multiple resources and those resources are not in the same compartment, the OCID of
            the primary resource is used. For example, you can copy an object in a bucket in one compartment to a bucket in
            another compartment. In this case, the OCID of the source compartment is used.
          type: string
        id:
          description: The id of the work request.
          type: string
        operationType:
          description: The type of work request.
          enum:
            - COPY_OBJECT
            - REENCRYPT
            - PRIVATE_ENDPOINT_CREATE
            - PRIVATE_ENDPOINT_UPDATE
            - PRIVATE_ENDPOINT_DELETE
          type: string
        percentComplete:
          description: Percentage of the work request completed.
          format: float
          type: number
        resources:
          items:
            $ref: '#/components/schemas/WorkRequestResource'
          type: array
        status:
          description: The status of a specified work request.
          enum:
            - ACCEPTED
            - IN_PROGRESS
            - FAILED
            - COMPLETED
            - CANCELING
            - CANCELED
          type: string
        timeAccepted:
          description: |
            The date and time the work request was created, as described in
            [RFC 3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
        timeFinished:
          description: |
            The date and time the work request was finished, as described in
            [RFC 3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
        timeStarted:
          description: |
            The date and time the work request was started, as described in
            [RFC 3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
      type: object
    WorkRequest:
      description: A description of workRequest status.
      properties:
        compartmentId:
          description: |
            The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that contains the work request. Work
            requests are scoped to the same compartment as the resource the work request affects.

            If the work request affects multiple resources and those resources are not in the same compartment, the OCID of
            the primary resource is used. For example, you can copy an object in a bucket in one compartment to a bucket in
            another compartment. In this case, the OCID of the source compartment is used.
          type: string
        id:
          description: The id of the work request.
          type: string
        operationType:
          description: The type of work request.
          enum:
            - COPY_OBJECT
            - REENCRYPT
            - PRIVATE_ENDPOINT_CREATE
            - PRIVATE_ENDPOINT_UPDATE
            - PRIVATE_ENDPOINT_DELETE
          type: string
        percentComplete:
          description: Percentage of the work request completed.
          format: float
          type: number
        resources:
          items:
            $ref: '#/components/schemas/WorkRequestResource'
          type: array
        status:
          description: The status of the specified work request.
          enum:
            - ACCEPTED
            - IN_PROGRESS
            - FAILED
            - COMPLETED
            - CANCELING
            - CANCELED
          type: string
        timeAccepted:
          description: |
            The date and time the work request was created, as described in
            [RFC 3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
        timeFinished:
          description: |
            The date and time the work request was finished, as described in
            [RFC 3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
        timeStarted:
          description: |
            The date and time the work request was started, as described in
