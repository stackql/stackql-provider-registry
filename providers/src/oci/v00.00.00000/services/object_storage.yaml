      in: path
      name: retentionRuleId
      required: true
      schema:
        type: string
    UploadIdQueryParam:
      description: The upload ID for a multipart upload.
      in: query
      name: uploadId
      required: true
      schema:
        type: string
    UploadPartNumberQueryParam:
      description: The part number that identifies the object part currently being uploaded.
      in: query
      name: uploadPartNum
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
    InventoryRuleIdPathParam:
