  /alarms:
    get:
      description: |
        Lists the alarms for the specified compartment.
        For more information, see
        [Listing Alarms](/iaas/Content/Monitoring/Tasks/list-alarm.htm).
        For important limits information, see
        [Limits on Monitoring](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#limits).

        This call is subject to a Monitoring limit that applies to the total number of requests across all alarm operations.
        Monitoring might throttle this call to reject an otherwise valid request when the total rate of alarm operations exceeds 10 requests,
        or transactions, per second (TPS) for a given tenancy.
      operationId: ListAlarms
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/FilterByDisplayNameQueryParam'
        - $ref: '#/components/parameters/FilterByLifecycleStateQueryParam'
        - $ref: '#/components/parameters/SortByQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/CompartmentIdInSubtreeQueryParam'
      responses:
        '200':
          description: Successfully retrieved alarms for listing.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages of results remain.
                For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAlarmsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      tags:
        - monitoring
      x-example: |
        Sample 1: List all alarms in a compartment, sorted by display name

        GET /20180401/alarms?compartmentId=<var>&lt;compartment_OCID&gt;</var>&sortBy=displayName
        Host: telemetry.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>

        Sample 2: List the alarm named "CPU" in a compartment

        GET /20180401/alarms?compartmentId=<var>&lt;compartment_OCID&gt;</var>&displayName=CPU
        Host: telemetry.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
    post:
      description: |
        Creates a new alarm in the specified compartment.
        For more information, see
        [Creating an Alarm](/iaas/Content/Monitoring/Tasks/create-alarm.htm).
        For important limits information, see
        [Limits on Monitoring](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#limits).

        This call is subject to a Monitoring limit that applies to the total number of requests across all alarm operations.
        Monitoring might throttle this call to reject an otherwise valid request when the total rate of alarm operations exceeds 10 requests,
        or transactions, per second (TPS) for a given tenancy.
      operationId: CreateAlarm
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/RetryTokenHeaderParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlarmDetails'
        description: Document for creating an alarm.
        required: true
      responses:
        '200':
          description: Successfully created alarm.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alarm'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: |
        Creates a new alarm in the specified compartment.
      tags:
        - monitoring
      x-example: |
        Sample 1: Single condition

        POST /20180401/alarms
        Host: telemetry.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
        {
          "body": "CPU utilization has reached high values.",
          "compartmentId": "<var>&lt;compartment_OCID&gt;</var>",
          "destinations": [ "<var>&lt;topic_OCID&gt;</var>" ],
          "displayName": "High CPU Utilization",
          "isEnabled": true,
          "isNotificationsPerMetricDimensionEnabled": true,
          "messageFormat": "ONS_OPTIMIZED",
          "metricCompartmentId": "<var>&lt;compartment_OCID&gt;</var>",
          "namespace": "oci_computeagent",
          "pendingDuration": "PT5M",
          "query": "CpuUtilization[1m]{availabilityDomain = \"cumS:PHX-AD-1"\}.groupBy(availabilityDomain).percentile(0.9) > 85",
          "repeatNotificationDuration": "PT2H",
          "severity": "WARNING",
          "suppression":
          {
            "description": "System Maintenance",
            "timeSuppressFrom": "2023-02-04T05:00:00.600Z",
            "timeSuppressUntil": "2023-02-04T07:00:00.600Z"
          }
        }
                
        Sample 2: Multiple conditions, with dynamic variables and a five-minute evaluation slack duration

        POST /20180401/alarms
        Host: telemetry.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
        {
          "alarmSummary": "test summary with severity = {{severity}} and query = {{{query}}}",
          "body": "{{severity}} alarm triggered because threshold got breached due to {{metricValues}} at {{timestamp}}",
          "compartmentId": "<var>&lt;compartment_OCID&gt;</var>",
          "destinations": [ "<var>&lt;topic_OCID&gt;</var>" ],
          "displayName": "High CPU Utilization",
          "evaluationSlackDuration": "PT5M",
          "isEnabled": true,
          "isNotificationsPerMetricDimensionEnabled": true,
          "messageFormat": "ONS_OPTIMIZED",
          "metricCompartmentId": "<var>&lt;compartment_OCID&gt;</var>",
          "namespace": "oci_computeagent",
          "notificationTitle": "Sample title with severity {{severity}}",
          "overrides":
            [
              {"body": "95% CPU utilization", "query": "CPUUtilization[1m].mean()>95", "severity": "CRITICAL"},
              {"body": "80% CPU utilization", "query": "CPUUtilization[1m].mean()>80", "severity": "WARNING"}
            ],
          "pendingDuration": "PT5M",
          "query": "CpuUtilization[1m]{availabilityDomain=\"cumS:PHX-AD-1\"}.groupBy(availabilityDomain).percentile(0.9) > 85",
          "repeatNotificationDuration": "PT2H",
          "ruleName": "BASE",
          "severity": "INFO"
        }        

        Sample 3: Event-based alarm

        POST /20180401/alarms
        Host: telemetry.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
        {
          "body": "Database instance terminated.",
          "compartmentId": "<var>&lt;compartment_OCID&gt;</var>",
          "destinations": [ "<var>&lt;topic_OCID&gt;</var>" ],
          "displayName": "Database instance shutdown",
          "isEnabled": true,
          "isNotificationsPerMetricDimensionEnabled": true,
          "messageFormat": "ONS_OPTIMIZED",
          "metricCompartmentId": "<var>&lt;compartment_OCID&gt;</var>",
          "namespace": "oci_database",
          "pendingDuration": "PT1M",
          "query": "DatabaseInstance.Shutdown[1m].groupBy(availabilityDomain).count() > 0",
          "repeatNotificationDuration": "PT0M",
          "severity": "INFO"
        }
  /alarms/status:
    get:
      description: |
        List the status of each alarm in the specified compartment.
        Status is collective, across all metric streams in the alarm.
        To list alarm status for each metric stream, use [RetrieveDimensionStates](#/en/monitoring/latest/AlarmDimensionStatesCollection/RetrieveDimensionStates).
        Optionally filter by resource or status value.

        For more information, see
        [Listing Alarm Statuses](/iaas/Content/Monitoring/Tasks/list-alarm-status.htm).
        For important limits information, see
        [Limits on Monitoring](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#limits).

        This call is subject to a Monitoring limit that applies to the total number of requests across all alarm operations.
        Monitoring might throttle this call to reject an otherwise valid request when the total rate of alarm operations exceeds 10 requests,
        or transactions, per second (TPS) for a given tenancy.
      operationId: ListAlarmsStatus
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/CompartmentIdInSubtreeQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/FilterByDisplayNameQueryParam'
        - $ref: '#/components/parameters/SortByQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/ResourceIdQueryParam'
        - $ref: '#/components/parameters/ServiceNameQueryParam'
        - $ref: '#/components/parameters/EntityIdQueryParam'
        - $ref: '#/components/parameters/StatusQueryParam'
      responses:
        '200':
          description: |
            Successfully retrieved alarms status for listing.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages of results remain.
                For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAlarmsStatusResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      tags:
        - monitoring
      x-example: |
        GET /20180401/alarms/status?compartmentId=<var>&lt;compartment_OCID&gt;</var>&resourceId=<var>&lt;resource_OCID&gt;</var>
        Host: telemetry.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
      x-obmcs-client-retries-enabled: true
