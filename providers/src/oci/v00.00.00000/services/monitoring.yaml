          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing the metric
            being evaluated by the alarm.
          maxLength: 255
          minLength: 1
          type: string
        metricCompartmentIdInSubtree:
          description: |
            When true, the alarm evaluates metrics from all compartments and subcompartments. The parameter can
            only be set to true when metricCompartmentId is the tenancy OCID (the tenancy is the root compartment).
            A true value requires the user to have tenancy-level permissions. If this requirement is not met,
            then the call is rejected. When false, the alarm evaluates metrics from only the compartment specified
            in metricCompartmentId. Default is false.

            Example: `true`
          type: boolean
        namespace:
          description: |
            The source service or application emitting the metric that is evaluated by the alarm.

            Example: `oci_computeagent`
          maxLength: 255
          minLength: 1
          type: string
        notificationTitle:
          description: |
            Customizable notification title (`title` [alarm message parameter](/iaas/Content/Monitoring/alarm-message-format.htm)).
            Optionally include [dynamic variables](/iaas/Content/Monitoring/Tasks/update-alarm-dynamic-variables.htm).
            The notification title appears as the subject line in a formatted email message and as the title in a Slack message.
          type: string
        notificationVersion:
          description: |
            The version of the alarm notification to be delivered. Allowed value: `1.X`
            The value must start with a number (up to four digits), followed by a period and an uppercase X.
          type: string
        overrides:
          description: |
            A set of overrides that control evaluations of the alarm. 

            Each override can specify values for query, severity, body, and pending duration.
            When an alarm contains overrides, the Monitoring service evaluates each override in order, beginning with the first override in the array (index position `0`),
            and then evaluates the alarm's base values (`ruleName` value of `BASE`).
          items:
            $ref: '#/components/schemas/AlarmOverride'
          maxItems: 2
          type: array
        pendingDuration:
          description: |
            The period of time that the condition defined in the alarm must persist before the alarm state
            changes from "OK" to "FIRING". For example, a value of 5 minutes means that the
            alarm must persist in breaching the condition for five minutes before the alarm updates its
            state to "FIRING".

            The duration is specified as a string in ISO 8601 format (`PT10M` for ten minutes or `PT1H`
            for one hour). Minimum: PT1M. Maximum: PT24H. Default: PT1M.

            Under the default value of PT1M, the first evaluation that breaches the alarm updates the
            state to "FIRING".

            The alarm updates its status to "OK" when the breaching condition has been clear for
            the most recent minute.

            Example: `PT5M`
          type: string
        query:
          description: |
            The Monitoring Query Language (MQL) expression to evaluate for the alarm. The Alarms feature of
            the Monitoring service interprets results for each returned time series as Boolean values,
            where zero represents false and a non-zero value represents true. A true value means that the trigger
            rule condition has been met. The query must specify a metric, statistic, interval, and trigger
            rule (threshold or absence). Supported values for interval depend on the specified time range. More
            interval values are supported for smaller time ranges. You can optionally
            specify dimensions and grouping functions.
            Also, you can customize the 
            [absence detection period](/iaas/Content/Monitoring/Tasks/create-edit-alarm-query-absence-detection-period.htm).
            Supported grouping functions: `grouping()`, `groupBy()`.
            For information about writing MQL expressions, see
            [Editing the MQL Expression for a Query](/iaas/Content/Monitoring/Tasks/query-metric-mql.htm).
            For details about MQL, see
            [Monitoring Query Language (MQL) Reference](/iaas/Content/Monitoring/Reference/mql.htm).
            For available dimensions, review the metric definition for the supported service. See
            [Supported Services](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#SupportedServices).

            Example of threshold alarm:

              -----

                CpuUtilization[1m]{availabilityDomain="cumS:PHX-AD-1"}.groupBy(availabilityDomain).percentile(0.9) > 85

              -----

            Example of absence alarm:

              -----

                CpuUtilization[1m]{availabilityDomain="cumS:PHX-AD-1"}.absent()

              -----
            Example of absence alarm with custom absence detection period of 20 hours:

              -----
                
                CpuUtilization[1m]{availabilityDomain="cumS:PHX-AD-1"}.absent(20h)
              
              -----
          maxLength: 1000
          minLength: 1
          type: string
        repeatNotificationDuration:
          description: |
            The frequency for re-submitting alarm notifications, if the alarm keeps firing without
            interruption. Format defined by ISO 8601. For example, `PT4H` indicates four hours.
            As another example, `PT0M` indicates a repeat notification each time the alarm trigger condition is met,
            otherwise known as an event-based notification. For more information, see
            [Getting Event-Based Notifications for an Alarm](/iaas/Content/Monitoring/Tasks/update-alarm-event.htm).
            Minimum: PT0M. Maximum: P30D.
          type: string
        resolution:
          description: |
            The time between calculated aggregation windows for the alarm. Supported value: `1m`
          type: string
        resourceGroup:
          description: |
            Resource group that you want to match. A null value returns only metric data that has no resource groups. The alarm retrieves metric data associated with the specified resource group only. Only one resource group can be applied per metric.
            A valid resourceGroup value starts with an alphabetical character and includes only alphanumeric characters, periods (.), underscores (_), hyphens (-), and dollar signs ($).
            Avoid entering confidential information.

            Example: `frontend-fleet`
          maxLength: 255
          minLength: 1
          type: string
        ruleName:
          description: |
            Identifier of the alarm's base values for alarm evaluation, for use when the alarm contains overrides. 
            Default value is `BASE`. For information about alarm overrides, see [AlarmOverride](#/en/monitoring/latest/datatypes/AlarmOverride).
          type: string
        severity:
          description: |
            The perceived severity of the alarm with regard to the affected system.
          type: string
          x-obmcs-enumref: '#/definitions/Alarm/severity'
        suppression:
          $ref: '#/components/schemas/Suppression'
      type: object
      x-example: |
        {
          "destinations":
          [
            "ocid1.onstopic.exampleuniqueID"
          ]
        }
    ChangeAlarmCompartmentDetails:
      description: |
        The configuration details for moving an alarm.
      properties:
        compartmentId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to move the alarm to.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - compartmentId
      type: object
      x-example: |
        {
          "compartmentId": "<var>&lt;compartment_OCID&gt;</var>"
        }
    RetrieveDimensionStatesDetails:
      description: |
        The configuration details for retrieving the alarm state entries.
        Filter retrieved alarm state entries by status value and dimension key-value pairs.
      properties:
        dimensionFilters:
          additionalProperties:
            type: string
          description: |
            A filter to return only alarm state entries that match the exact set of specified dimension key-value pairs.
            If you specify `"availabilityDomain": "phx-ad-1"` but the alarm state entry corresponds to the set `"availabilityDomain": "phx-ad-1"`
            and `"resourceId": "ocid1.instance.region1.phx.exampleuniqueID"`, then no results are returned.
          type: object
        status:
          description: |
            A filter to return only alarm state entries that match the status value.
          type: string
          x-obmcs-enumref: '#/definitions/AlarmDimensionStatesEntry/status'
      type: object
      x-example: |
        {
          "dimensions":
            {
              "availabilityDomain": "phx-ad-1",
              "resourceId": "ocid1.instance.region1.phx.exampleuniqueID"
            },
            "status" : FIRING
        }
    AlarmDimensionStatesCollection:
      description: |
        The list of current alarm state entries for each metric stream that matches the filters. 
      properties:
        alarmId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the alarm to retrieve alarm state entries for.
          type: string
        isEnabled:
          description: |
            Whether the alarm is enabled.

            Example: `true`
          type: boolean
        isNotificationsPerMetricDimensionEnabled:
          description: |
            When set to `true`, splits alarm notifications per metric stream.
            When set to `false`, groups alarm notifications across metric streams.
          type: boolean
        items:
          description: |
            Array of alarm state entries.
          items:
            $ref: '#/components/schemas/AlarmDimensionStatesEntry'
          type: array
      required:
        - alarmId
        - isEnabled
        - isNotificationsPerMetricDimensionEnabled
        - items
      type: object
      x-example: |
        {
          "alarmId": "ocid1.alarm.oc1..exampleuniqueID",
          "isEnabled": true,
          "isNotificationsPerMetricDimensionEnabled": true,
          "items":
          [
            {
              "alarmSummary": "Customizable alarm summary with dynamic variables severity CRITICAL",
              "dimensions":
                {
                  "availabilityDomain": "phx-ad-1",
                  "resourceId": "ocid1.instance.region1.phx.exampleuniqueID"
                },
              "status" : FIRING
              "timestamp" : "2021-12-01T01:02:30.600Z"  
                
            }
          ]
        }
    SummarizeAlarmSuppressionHistoryDetails:
      description: |
        The configuration details for returning history of suppressions for the specified alarm.
      properties:
        dimensions:
          additionalProperties:
            type: string
          description: |
            A filter to suppress only alarm state entries that include the set of specified dimension key-value pairs.
            If you specify {"availabilityDomain": "phx-ad-1"}
            and the alarm state entry corresponds to the set {"availabilityDomain": "phx-ad-1" and "resourceId": "ocid1.instance.region1.phx.exampleuniqueID"},
            then this alarm will be included for suppression.

            Example: `{"resourceId": "ocid1.instance.region1.phx.exampleuniqueID"}`
          type: object
        timeSuppressFromGreaterThanOrEqualTo:
          description: |
            A filter to return only entries with "timeSuppressFrom" time occurring on or after the specified time.

            The value cannot be a future time.
            Format defined by RFC3339.

            Example: `2023-02-01T01:02:29.600Z`
          format: date-time
          type: string
        timeSuppressFromLessThan:
          description: |
            A filter to return only entries with "timeSuppressFrom" time occurring before the specified time.

            The value cannot be a future time.
            Format defined by RFC3339.

            Example: `2023-02-01T01:02:29.600Z`
          format: date-time
          type: string
      type: object
    AlarmSuppressionHistoryItemCollection:
      description: |
        Collection of property summaries for alarm suppression history items.
      properties:
        items:
          description: |
            List of alarm suppression history items.
          items:
            $ref: '#/components/schemas/AlarmSuppressionHistoryItem'
          type: array
      required:
        - items
      type: object
    AlarmHistoryCollection:
      description: |
        The configuration details for retrieving alarm history.
      properties:
