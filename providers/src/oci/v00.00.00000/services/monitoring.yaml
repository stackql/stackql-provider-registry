  /metrics:
    post:
      description: |
        Publishes raw metric data points to the Monitoring service.
        For a data point to be posted, its timestamp must be near current time (less than two hours in the past and less than 10 minutes in the future).

        For more information about publishing metrics, see 
        [Publishing Custom Metrics](/iaas/Content/Monitoring/Tasks/publishingcustommetrics.htm)
        and
        [Custom Metrics Walkthrough](/iaas/Content/Monitoring/Tasks/custom-metrics-walkthrough.htm).
        For information about developing a metric-posting client, see
        [Developer Guide](/iaas/Content/API/Concepts/devtoolslanding.htm).
        For an example client, see
        [MonitoringMetricPostExample.java](https://github.com/oracle/oci-java-sdk/blob/master/bmc-examples/src/main/java/MonitoringMetricPostExample.java).
        For important limits information, see
        [Limits on Monitoring](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#limits).

        Per-call limits information follows.

        * Dimensions per metric group*. Maximum: 20. Minimum: 1.
        * Unique metric streams*. Maximum: 50.
        * Transactions Per Second (TPS) per-tenancy limit for this operation: 50.

        *A metric group is the combination of a given metric, metric namespace, and tenancy for the purpose of determining limits.
        A dimension is a qualifier provided in a metric definition.
        A metric stream is an individual set of aggregated data for a metric with zero or more dimension values.
        For more information about metric-related concepts, see
        [Monitoring Concepts](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#concepts).

        **Note:** The endpoints for this operation differ from other Monitoring operations. Replace the string `telemetry` with `telemetry-ingestion` in the endpoint, as in the following example:

        https://telemetry-ingestion.eu-frankfurt-1.oraclecloud.com
      operationId: PostMetricData
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/EncodingHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMetricDataDetails'
        description: |
          An array of metric objects containing raw metric data points to be posted to the Monitoring service.
        required: true
      responses:
        '200':
          description: |
            Successfully posted metrics to the Monitoring service.
            This response means that the request passed the partial or full input validation requirements
            determined by the BatchAtomicity parameter value. The default value of NON_ATOMIC requires a
            partial pass: at least one metric object in the request must pass input validation, and any
            objects that failed validation are identified in the returned summary, along with their error
            messages. A value of ATOMIC requires a full pass: all metric objects in the request must
            pass input validation.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMetricDataResponseDetails'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: |
        Publishes raw metric data points to the Monitoring service.
      tags:
        - monitoring
      x-related-resource: '#/definitions/MetricData'
