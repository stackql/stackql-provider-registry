    AlarmHistoryEntry:
      description: |
        An alarm history entry indicating a description of the entry and the time that the entry occurred.
        If the entry corresponds to a state transition, such as OK to Firing, then the entry also includes a transition timestamp.
      properties:
        alarmSummary:
          description: |
            Customizable alarm summary (`alarmSummary` [alarm message parameter](/iaas/Content/Monitoring/alarm-message-format.htm)).
            Optionally include [dynamic variables](/iaas/Content/Monitoring/Tasks/update-alarm-dynamic-variables.htm).
            The alarm summary appears within the body of the alarm message and in responses to 
            [ListAlarmStatus](#/en/monitoring/latest/AlarmStatusSummary/ListAlarmsStatus) 
            [GetAlarmHistory](#/en/monitoring/latest/AlarmHistoryCollection/GetAlarmHistory) and
            [RetrieveDimensionStates](#/en/monitoring/latest/AlarmDimensionStatesCollection/RetrieveDimensionStates).
          type: string
        summary:
          description: |
            Description for this alarm history entry.

            Example 1 - alarm state history entry: `The alarm state is FIRING`

            Example 2 - alarm state transition history entry: `State transitioned from OK to Firing`
          type: string
        timestamp:
          description: |
            Timestamp for this alarm history entry. Format defined by RFC3339.

            Example: `2023-02-01T01:02:29.600Z`
          format: date-time
          type: string
        timestampTriggered:
          description: |
            Timestamp for the transition of the alarm state. For example, the time when the alarm transitioned from OK to Firing.
            Available for state transition entries only. Note: A three-minute lag for this value accounts for any late-arriving metrics.

            Example: `2023-02-01T0:59:00.789Z`
          format: date-time
          type: string
      required:
        - alarmSummary
        - summary
        - timestamp
      type: object
      x-example: |
        {
          "alarmSummary": "Alarm is in a FIRING state; because 1 metric meets the trigger rule: Example[1m].mean() > 1",
