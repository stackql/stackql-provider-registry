components:
  schemas:
    AlarmSuppressionCollection:
      description: |
        Collection of property summaries for alarm suppressions.
      properties:
        items:
          description: |
            List of property summaries for alarm suppressions.
          items:
            $ref: '#/components/schemas/AlarmSuppressionSummary'
          type: array
      required:
        - items
      type: object
    CreateAlarmSuppressionDetails:
      description: |
        The configuration details for creating an alarm suppression.
      properties:
        alarmSuppressionTarget:
          $ref: '#/components/schemas/AlarmSuppressionTarget'
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                An object that represents the value of the tag. Only String types are currently supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing predefined tags' keys and values scoped to a namespace
              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Usage of predefined tag keys. These predefined keys are scoped to namespaces.
            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        description:
          description: |
            Human-readable reason for this alarm suppression.
            It does not have to be unique, and it's changeable.
            Avoid entering confidential information.

            Oracle recommends including tracking information for the event or associated work,
            such as a ticket number.

            Example: `Planned outage due to change IT-1234.`
          type: string
        dimensions:
          additionalProperties:
            type: string
          description: |
            A filter to suppress only alarm state entries that include the set of specified dimension key-value pairs.
