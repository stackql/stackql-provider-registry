    AlarmSummary:
      description: |
        A summary of properties for the specified alarm.
        For information about alarms, see
        [Alarms Overview](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#AlarmsOverview).

        To use any of the API operations, you must be authorized in an IAM policy. If you're not authorized,
        talk to an administrator. If you're an administrator who needs to write policies to give users access, see
        [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

        For information about endpoints and signing API requests, see
        [About the API](/iaas/Content/API/Concepts/usingapi.htm).
        For information about available SDKs and tools, see
        [SDKS and Other Tools](/iaas/Content/API/Concepts/sdks.htm).
      properties:
        alarmSummary:
          description: |
            Customizable alarm summary (`alarmSummary` [alarm message parameter](/iaas/Content/Monitoring/alarm-message-format.htm)).
            Optionally include [dynamic variables](/iaas/Content/Monitoring/Tasks/update-alarm-dynamic-variables.htm).
            The alarm summary appears within the body of the alarm message and in responses to 
            [ListAlarmStatus](#/en/monitoring/latest/AlarmStatusSummary/ListAlarmsStatus) 
            [GetAlarmHistory](#/en/monitoring/latest/AlarmHistoryCollection/GetAlarmHistory) and
            [RetrieveDimensionStates](#/en/monitoring/latest/AlarmDimensionStatesCollection/RetrieveDimensionStates).
          type: string
        compartmentId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing the alarm.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                An object that represents the value of the tag. Only String types are currently supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing predefined tags' keys and values scoped to a namespace
              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Usage of predefined tag keys. These predefined keys are scoped to namespaces.
            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        destinations:
          description: |
            A list of destinations for alarm notifications.
            Each destination is represented by the [OCID](/iaas/Content/General/Concepts/identifiers.htm)
            of a related resource, such as a [topic](#/en/notification/latest/NotificationTopic).
            Supported destination services: Notifications, Streaming.
            Limit: One destination per supported destination service.
          items:
            type: string
          minItems: 1
          type: array
        displayName:
          description: |
            A user-friendly name for the alarm. It does not have to be unique, and it's changeable.

            This value determines the title of each alarm notification.

            Example: `High CPU Utilization`
          maxLength: 255
          minLength: 1
          type: string
        evaluationSlackDuration:
          description: |
            Customizable slack period to wait for metric ingestion before evaluating the alarm.
            Specify a string in ISO 8601 format (`PT10M` for ten minutes or `PT1H`
            for one hour). Minimum: PT3M. Maximum: PT2H. Default: PT3M.
            For more information about the slack period, see
            [About the Internal Reset Period](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#reset).
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.
            Example: `{"Department": "Finance"}`
          type: object
        id:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the alarm.
          maxLength: 255
          minLength: 1
          type: string
        isEnabled:
          description: |
            Whether the alarm is enabled.

            Example: `true`
          type: boolean
        isNotificationsPerMetricDimensionEnabled:
          description: |
            Whether the alarm sends a separate message for each metric stream.
            See [Creating an Alarm That Splits Messages by Metric Stream](/iaas/Content/Monitoring/Tasks/create-alarm-split.htm).
            Example: `true`
          type: boolean
        lifecycleState:
          description: |
            The current lifecycle state of the alarm.
          type: string
          x-obmcs-enumref: '#/definitions/Alarm/lifecycleState'
        metricCompartmentId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing the metric
            being evaluated by the alarm.
          maxLength: 255
          minLength: 1
          type: string
        namespace:
          description: |
            The source service or application emitting the metric that is evaluated by the alarm.

            Example: `oci_computeagent`
          maxLength: 255
          minLength: 1
          type: string
        notificationTitle:
          description: |
            Customizable notification title (`title` [alarm message parameter](/iaas/Content/Monitoring/alarm-message-format.htm)).
            Optionally include [dynamic variables](/iaas/Content/Monitoring/Tasks/update-alarm-dynamic-variables.htm).
            The notification title appears as the subject line in a formatted email message and as the title in a Slack message.
          type: string
        notificationVersion:
          description: |
            The version of the alarm notification to be delivered. Allowed value: `1.X`
            The value must start with a number (up to four digits), followed by a period and an uppercase X.
          type: string
        overrides:
          description: |
            A set of overrides that control evaluations of the alarm. 

            Each override can specify values for query, severity, body, and pending duration.
            When an alarm contains overrides, the Monitoring service evaluates each override in order, beginning with the first override in the array (index position `0`),
            and then evaluates the alarm's base values (`ruleName` value of `BASE`).
          items:
            $ref: '#/components/schemas/AlarmOverride'
          maxItems: 2
          type: array
        query:
          description: |
            The Monitoring Query Language (MQL) expression to evaluate for the alarm. The Alarms feature of
            the Monitoring service interprets results for each returned time series as Boolean values,
            where zero represents false and a non-zero value represents true. A true value means that the trigger
            rule condition has been met. The query must specify a metric, statistic, interval, and trigger
            rule (threshold or absence). Supported values for interval depend on the specified time range. More
            interval values are supported for smaller time ranges. Supported grouping functions: `grouping()`, `groupBy()`.
            For information about writing MQL expressions, see
            [Editing the MQL Expression for a Query](/iaas/Content/Monitoring/Tasks/query-metric-mql.htm).
            For details about MQL, see
            [Monitoring Query Language (MQL) Reference](/iaas/Content/Monitoring/Reference/mql.htm).
            For available dimensions, review the metric definition for the supported service. See
            [Supported Services](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#SupportedServices).

            Example of threshold alarm:

              -----

                CpuUtilization[1m]{availabilityDomain="cumS:PHX-AD-1"}.groupBy(availabilityDomain).percentile(0.9) > 85

              -----

            Example of absence alarm:

              -----

                CpuUtilization[1m]{availabilityDomain="cumS:PHX-AD-1"}.absent()

              -----
          maxLength: 255
          minLength: 1
          type: string
        resourceGroup:
          description: |
            Resource group that you want to match. A null value returns only metric data that has no resource groups. The specified resource group must exist in the definition of the posted metric. Only one resource group can be applied per metric.
            A valid resourceGroup value starts with an alphabetical character and includes only alphanumeric characters, periods (.), underscores (_), hyphens (-), and dollar signs ($).

            Example: `frontend-fleet`
          maxLength: 255
          minLength: 1
          type: string
        ruleName:
          description: |
            Identifier of the alarm's base values for alarm evaluation, for use when the alarm contains overrides. 
            Default value is `BASE`. For information about alarm overrides, see [AlarmOverride](#/en/monitoring/latest/datatypes/AlarmOverride).
          type: string
        severity:
          description: |
            The perceived type of response required when the alarm is in the "FIRING" state.

            Example: `CRITICAL`
          enum:
            - CRITICAL
            - ERROR
            - WARNING
            - INFO
          type: string
        suppression:
          $ref: '#/components/schemas/Suppression'
      required:
        - id
        - displayName
        - compartmentId
        - metricCompartmentId
        - namespace
        - query
        - severity
        - destinations
        - isEnabled
        - lifecycleState
      type: object
      x-example: |
        Sample: Multiple conditions, with dynamic variables and a five-minute evaluation slack duration

        {
          "alarmSummary": "test summary with severity = {{severity}} and query = {{{query}}}",
          "compartmentId": "<var>&lt;compartment_OCID&gt;</var>",
          "destinations": [ "<var>&lt;topic_OCID&gt;</var>" ],
          "displayName": "High CPU Utilization",
          "evaluationSlackDuration": "PT5M",
          "id": "ocid1.alarm.oc1..exampleuniqueID",
          "isEnabled": true,
          "isNotificationsPerMetricDimensionEnabled": true,
          "lifecycleState": "ACTIVE",
          "metricCompartmentId": "<var>&lt;compartment_OCID&gt;</var>",
          "namespace": "oci_computeagent",
          "notificationTitle": "Sample title with severity {{severity}}",
          "overrides":
            [
              {"body": "95% CPU utilization", "query": "CPUUtilization[1m].mean()>95", "severity": "CRITICAL"},
              {"body": "80% CPU utilization", "query": "CPUUtilization[1m].mean()>80", "severity": "WARNING"}
            ],
          "query": "CpuUtilization[1m]{availabilityDomain=\"cumS:PHX-AD-1\"}.groupBy(availabilityDomain).percentile(0.9) > 85",
          "ruleName": "BASE",
          "severity": "INFO"
        }
