        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '412':
      description: Precondition Failed
      headers:
        opc-request-id:
          description: |
            Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
            a particular request, please provide the request ID.
          schema:
            type: string
      content:
        application/json:
          schema:
