        - isEnabled
        - entries
      type: object
      x-example: |
        {
          "alarmId": "ocid1.alarm.oc1..exampleuniqueID",
          "isEnabled": true,
          "entries":
          [
            {
            "alarmSummary": "Customizable alarm summary with dynamic variables severity CRITICAL",
            "summary": "Alarm transitioned from OK to FIRING.",
            "timestamp": "2023-02-01T01:02:29.600Z"
            },
            {
            "alarmSummary": "Customizable alarm summary with dynamic variables severity CRITICAL",
            "summary": "Alarm transitioned from FIRING to OK.",
            "timestamp": "2023-02-01T01:02:30.600Z"
            },
            {
            "alarmSummary": "Customizable alarm summary with dynamic variables severity CRITICAL",
            "summary": "Alarm transitioned from OK to FIRING.",
            "timestamp": "2023-02-01T01:02:31.600Z"
            }
          ]
        }
    PostMetricDataDetails:
      description: |
        An array of metric objects containing raw metric data points to be posted to the Monitoring service.
      properties:
        batchAtomicity:
          default: NON_ATOMIC
          description: |
            Batch atomicity behavior. Requires either partial or full pass of input validation for
            metric objects in PostMetricData requests. The default value of NON_ATOMIC requires a
            partial pass: at least one metric object in the request must pass input validation, and
            any objects that failed validation are identified in the returned summary, along with
            their error messages. A value of ATOMIC requires a full pass: all metric objects in
            the request must pass input validation.

            Example: `NON_ATOMIC`
          enum:
            - ATOMIC
            - NON_ATOMIC
          type: string
        metricData:
          description: |
            A metric object containing raw metric data points to be posted to the Monitoring service.
          items:
            $ref: '#/components/schemas/MetricDataDetails'
          type: array
      required:
        - metricData
      type: object
    PostMetricDataResponseDetails:
      description: |
        The response object returned from a PostMetricData operation.
      properties:
        failedMetrics:
          description: |
            A list of records identifying metric objects that failed input validation
            and the reasons for the failures.
          items:
            $ref: '#/components/schemas/FailedMetricRecord'
          type: array
        failedMetricsCount:
          description: The number of metric objects that failed input validation.
          format: int32
          type: integer
      required:
        - failedMetricsCount
      type: object
    ListMetricsDetails:
      description: |
        The request details for retrieving metric definitions. Specify optional properties to filter the returned results.
        Use an asterisk (&#42;) as a wildcard character, placed anywhere in the string.
        For example, to search for all metrics with names that begin with "disk", specify "name" as "disk&#42;".
        If no properties are specified, then all metric definitions within the request scope are returned.
      properties:
        dimensionFilters:
          additionalProperties:
            maxLength: 255
            minLength: 1
            type: string
          description: |
            Qualifiers that you want to use when searching for metric definitions.
            Available dimensions vary by metric namespace. Each dimension takes the form of a key-value pair.

            Example: `{"resourceId": "ocid1.instance.region1.phx.exampleuniqueID"}`
          minItems: 1
          type: object
        groupBy:
          description: |
            Group metrics by these fields in the response. For example, to list all metric namespaces available
                      in a compartment, groupBy the "namespace" field. Supported fields: namespace, name, resourceGroup.
            If `groupBy` is used, then `dimensionFilters` is ignored.

            Example - group by namespace:
            `[ "namespace" ]`
          items:
            type: string
          type: array
        name:
          description: |
            The metric name to use when searching for metric definitions.

            Example: `CpuUtilization`
          type: string
        namespace:
          description: |
            The source service or application to use when searching for metric definitions.

            Example: `oci_computeagent`
          type: string
        resourceGroup:
          description: |
            Resource group that you want to match. A null value returns only metric data that has no resource groups. The specified resource group must exist in the definition of the posted metric. Only one resource group can be applied per metric.
            A valid resourceGroup value starts with an alphabetical character and includes only alphanumeric characters, periods (.), underscores (_), hyphens (-), and dollar signs ($).

            Example: `frontend-fleet`
          maxLength: 255
          minLength: 1
          type: string
        sortBy:
          description: |
            The field to use when sorting returned metric definitions. Only one sorting level is provided.

            Example: `NAMESPACE`
          enum:
            - NAMESPACE
            - NAME
            - RESOURCEGROUP
          type: string
        sortOrder:
          description: |
            The sort order to use when sorting returned metric definitions. Ascending (ASC) or
            descending (DESC).

            Example: `ASC`
          enum:
            - ASC
            - DESC
          type: string
      type: object
      x-example: |
        Sample 1: List all namespaces

        {
          "groupBy":["namespace"]
        }

        Sample 2: List all resource groups in a namespace

        {
          "groupBy":["resourceGroup"],
          "namespace":"my_namespace"
        }

        Sample 3: List all metrics in a namespace for a specific resource group

        {
          "groupBy":["name"],
          "namespace": "my_namespace",
          "resourceGroup": "my_resourcegroup"
        }
    Metric:
      description: |
        The properties that define a metric.
        For information about metrics, see
        [Metrics Overview](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#MetricsOverview).
      properties:
        compartmentId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
            the resources monitored by the metric.
          example: ocid1.compartment.oc1..exampleuniqueID
          type: string
        dimensions:
          additionalProperties:
            maxLength: 255
            minLength: 1
            type: string
          description: |
            Qualifiers provided in a metric definition. Available dimensions vary by metric namespace.
            Each dimension takes the form of a key-value pair.

            Example: `{"resourceId": "ocid1.instance.region1.phx.exampleuniqueID"}`
          type: object
        name:
          description: |
            The name of the metric.

            Example: `CpuUtilization`
          type: string
        namespace:
          description: |
            The source service or application emitting the metric.

            Example: `oci_computeagent`
          type: string
        resourceGroup:
          description: |
            Resource group provided with the posted metric. A resource group is a custom string that you can match when retrieving custom metrics. Only one resource group can be applied per metric.
            A valid resourceGroup value starts with an alphabetical character and includes only alphanumeric characters, periods (.), underscores (_), hyphens (-), and dollar signs ($).

            Example: `frontend-fleet`
          maxLength: 255
          minLength: 1
          type: string
      type: object
      x-example: |
        {
          "name": "DiskBytesRead",
          "namespace": "oci_computeagent",
          "compartmentId": "ocid1.tenancy.oc1..exampleuniqueID",
          "dimensions":
            {
              "resourceId": "ocid1.instance.region1.phx.exampleuniqueID"
            }
        }
    SummarizeMetricsDataDetails:
      description: |
        The request details for retrieving aggregated data.
        Use the query and optional properties to filter the returned results.
      properties:
        endTime:
          description: |
            The end of the time range to use when searching for metric data points.
            Format is defined by RFC3339. The response excludes metric data points for the endTime.
            Default value: the timestamp representing when the call was sent.

            Example: `2023-02-01T02:02:29.600Z`
          format: date-time
          type: string
        namespace:
          description: |
            The source service or application to use when searching for metric data points to aggregate.

            Example: `oci_computeagent`
          type: string
        query:
          description: |
            The Monitoring Query Language (MQL) expression to use when searching for metric data points to
            aggregate. The query must specify a metric, statistic, and interval.
            Supported values for interval depend on the specified time range. More interval values are supported for smaller time ranges.
            You can optionally specify dimensions and grouping functions.
            When specifying a dimension value, surround it with double quotes, and escape each double quote with a backslash (`\`) character.
            Supported grouping functions: `grouping()`, `groupBy()`.

            Construct your query to avoid exceeding limits on returned data. See [MetricData Reference](#/en/monitoring/20180401/MetricData).

            For details about Monitoring Query Language (MQL), see
            [Monitoring Query Language (MQL) Reference](/iaas/Content/Monitoring/Reference/mql.htm).
            For available dimensions, review the metric definition for the supported service. See
            [Supported Services](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#SupportedServices).

            Example 1: `CpuUtilization[1m].sum()`

            Example 2 (escaped double quotes for value string): `CpuUtilization[1m]{resourceId = \"<var>&lt;instance_OCID&gt;</var>\"}.max()`
          maxLength: 1000
          minLength: 1
          type: string
        resolution:
          description: |
            The time between calculated aggregation windows. Use with the query interval to vary the
            frequency for returning aggregated data points. For example, use a query interval of
            5 minutes with a resolution of 1 minute to retrieve five-minute aggregations at a one-minute
            frequency. The resolution must be equal or less than the interval in the query. The default
            resolution is 1m (one minute). Supported values: `1m`-`60m`, `1h`-`24h`, `1d`.

            Example: `5m`
          type: string
        resourceGroup:
          description: |
            Resource group that you want to match. A null value returns only metric data that has no resource groups. The specified resource group must exist in the definition of the posted metric. Only one resource group can be applied per metric.
            A valid resourceGroup value starts with an alphabetical character and includes only alphanumeric characters, periods (.), underscores (_), hyphens (-), and dollar signs ($).

            Example: `frontend-fleet`
          maxLength: 255
          minLength: 1
          type: string
        startTime:
          description: |
            The beginning of the time range to use when searching for metric data points.
            Format is defined by RFC3339. The response includes metric data points for the startTime.
            Default value: the timestamp 3 hours before the call was sent.

            Example: `2023-02-01T01:02:29.600Z`
          format: date-time
          type: string
      required:
        - namespace
        - query
      type: object
      x-example: |
        {
          "namespace": "oci_computeagent",
          "query": "DiskBytesRead[1m]{resourceId = \"ocid1.instance.region1.phx.exampleuniqueID\"}.max()",
          "startTime": "2023-03-10T22:44:26.789Z",
          "endTime": "2023-03-10T22:59:26.789Z"
        }
    MetricData:
      description: |
        The set of aggregated data returned for a metric.
        For information about metrics, see
        [Metrics Overview](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#MetricsOverview).

        Limits information for returned data follows.

        * Data points: 100,000.
        * Metric streams* within data points: 2,000.
        * Time range returned for 1-day resolution: 90 days.
        * Time range returned for 1-hour resolution: 90 days.
        * Time range returned for 5-minute resolution: 30 days.
        * Time range returned for 1-minute resolution: 7 days.

        *A metric stream is an individual set of aggregated data for a metric with zero or more dimension values.
        Metric streams cannot be aggregated across metric groups.
        A metric group is the combination of a given metric, metric namespace, and tenancy for the purpose of determining limits.
        For more information about metric-related concepts, see
        [Monitoring Concepts](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#concepts).
      properties:
        aggregatedDatapoints:
          description: |
            The list of timestamp-value pairs returned for the specified request. Metric values are rolled up to the start time specified in the request.
            For important limits information related to data points, see MetricData Reference at the top of this page.
          items:
            $ref: '#/components/schemas/AggregatedDatapoint'
          minItems: 1
          type: array
        compartmentId:
          description: |
            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing the
            resources that the aggregated data was returned from.
          example: ocid1.compartment.oc1..exampleuniqueID
          maxLength: 255
          minLength: 1
          type: string
        dimensions:
          additionalProperties:
            maxLength: 255
            minLength: 1
            type: string
          description: |
            Qualifiers provided in the definition of the returned metric.
            Available dimensions vary by metric namespace. Each dimension takes the form of a key-value pair.

            Example: `{"resourceId": "ocid1.instance.region1.phx.exampleuniqueID"}`
          type: object
        metadata:
          additionalProperties:
            maxLength: 255
            minLength: 1
            type: string
          description: |
            The references provided in a metric definition to indicate extra information about the metric.

            Example: `"unit": "bytes"`
          type: object
        name:
          description: |
            The name of the metric.

            Example: `CpuUtilization`
          maxLength: 255
          minLength: 1
          type: string
        namespace:
          description: |
            The reference provided in a metric definition to indicate the source service or
            application that emitted the metric.

            Example: `oci_computeagent`
          maxLength: 255
          minLength: 1
          type: string
        resolution:
          description: |
            The time between calculated aggregation windows. Use with the query interval to vary the
            frequency for returning aggregated data points. For example, use a query interval of
            5 minutes with a resolution of 1 minute to retrieve five-minute aggregations at a one-minute
            frequency. The resolution must be equal or less than the interval in the query. The default
            resolution is 1m (one minute). Supported values: `1m`-`60m`, `1h`-`24h`, `1d`.

            Example: `5m`
          type: string
        resourceGroup:
          description: |
            Resource group provided with the posted metric. A resource group is a custom string that you can match when retrieving custom metrics. Only one resource group can be applied per metric.
            A valid resourceGroup value starts with an alphabetical character and includes only alphanumeric characters, periods (.), underscores (_), hyphens (-), and dollar signs ($).

            Example: `frontend-fleet`
          maxLength: 255
          minLength: 1
          type: string
      required:
        - namespace
        - compartmentId
        - name
        - dimensions
        - aggregatedDatapoints
      type: object
      x-example: |
        [
          {
            "namespace": "oci_computeagent",
            "compartmentId": "ocid1.tenancy.oc1..exampleuniqueID",
            "name": "DiskBytesRead",
            "dimensions":
              {
                "resourceId": "ocid1.instance.region1.phx.exampleuniqueID"
              },
          "metadata":
            {
              "unit": "bytes"
            }
          },
          "aggregatedDatapoints":
          [
            {
              "timestamp": "2023-03-10T22:19:00Z",
              "value": 10.4
            },
            {
              "timestamp": "2023-03-10T22:20:00Z",
              "value": 11.3
            },
            {
              "timestamp": "2023-03-10T22:21:00Z",
              "value": 11.2
            },
            {
              "timestamp": "2023-03-10T22:22:00Z",
              "value": 10.9
            },
            {
              "timestamp": "2023-03-10T22:23:00Z",
              "value": 10.2
            },
            {
              "timestamp": "2023-03-10T22:24:00Z",
              "value": 10.5
            },
            {
              "timestamp": "2023-03-10T22:25:00Z",
              "value": 11.3
            },
