          description: The type of the alarm suppression target.
          enum:
            - ALARM
            - COMPARTMENT
          type: string
      required:
        - targetType
      type: object
    SuppressionCondition:
      description: |
        Precondition for an alarm suppression within the suppression date and time range (`timeSuppressFrom` to `timeSuppressUntil`).
      discriminator:
        propertyName: conditionType
      properties:
        conditionType:
          description: Type of suppression condition.
          enum:
            - RECURRENCE
          type: string
      required:
        - conditionType
      x-example: |
        {
          "conditionType": "RECURRENCE",
          "suppressionRecurrence":"FREQ=WEEKLY;BYDAY=MO,TU,WE,TH;BYHOUR=10;BYMINUTE=00;BYSECOND=00",
          "suppressionDuration":"PT1H"
        }
      type: object
    AlarmOverride:
      description: |
        Values to use for an independent evaluation of the alarm.
        You can specify values for query, severity, body, and pending duration.
        When an alarm contains overrides, the Monitoring service evaluates each override in order,
        beginning with the first override in the array (index position `0`),
        and then evaluates the alarm's base values (`ruleName` value of `BASE`)
      properties:
        body:
          description: |
            The human-readable content of the delivered alarm notification.
            Optionally include [dynamic variables](/iaas/Content/Monitoring/Tasks/update-alarm-dynamic-variables.htm).
            Oracle recommends providing guidance
            to operators for resolving the alarm condition. Consider adding links to standard runbook
            practices. Avoid entering confidential information.

            Example: `High CPU usage alert. Follow runbook instructions for resolution.`
          maxLength: 1000
          minLength: 1
          type: string
        pendingDuration:
          description: |
            The period of time that the condition defined in the alarm must persist before the alarm state
            changes from "OK" to "FIRING". For example, a value of 5 minutes means that the
            alarm must persist in breaching the condition for five minutes before the alarm updates its
            state to "FIRING".

            The duration is specified as a string in ISO 8601 format (`PT10M` for ten minutes or `PT1H`
            for one hour). Minimum: PT1M. Maximum: PT24H. Default: PT1M.

            Under the default value of PT1M, the first evaluation that breaches the alarm updates the
            state to "FIRING".

            The alarm updates its status to "OK" when the breaching condition has been clear for
            the most recent minute.

            Example: `PT5M`
          type: string
        query:
          description: |
            The Monitoring Query Language (MQL) expression to evaluate for the alarm. The Alarms feature of
            the Monitoring service interprets results for each returned time series as Boolean values,
            where zero represents false and a non-zero value represents true. A true value means that the trigger
            rule condition has been met. The query must specify a metric, statistic, interval, and trigger
            rule (threshold or absence). Supported values for interval depend on the specified time range. More
            interval values are supported for smaller time ranges. You can optionally
            specify dimensions and grouping functions.
            Also, you can customize the 
            [absence detection period](/iaas/Content/Monitoring/Tasks/create-edit-alarm-query-absence-detection-period.htm).
            Supported grouping functions: `grouping()`, `groupBy()`.
            For information about writing MQL expressions, see
            [Editing the MQL Expression for a Query](/iaas/Content/Monitoring/Tasks/query-metric-mql.htm).
            For details about MQL, see
            [Monitoring Query Language (MQL) Reference](/iaas/Content/Monitoring/Reference/mql.htm).
            For available dimensions, review the metric definition for the supported service. See
            [Supported Services](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#SupportedServices).

            Example of threshold alarm:

              -----

                CpuUtilization[1m]{availabilityDomain="cumS:PHX-AD-1"}.groupBy(availabilityDomain).percentile(0.9) > 85

              -----

            Example of absence alarm:

              -----

                CpuUtilization[1m]{availabilityDomain="cumS:PHX-AD-1"}.absent()

              -----
            Example of absence alarm with custom absence detection period of 20 hours:

              -----
                
                CpuUtilization[1m]{availabilityDomain="cumS:PHX-AD-1"}.absent(20h)
              
              -----
          maxLength: 1000
          minLength: 1
          type: string
        ruleName:
          description: |
            A user-friendly description for this alarm override. Must be unique across all `ruleName` values for the alarm.
          type: string
        severity:
          description: |
            The perceived severity of the alarm with regard to the affected system.
          type: string
          x-obmcs-enumref: '#/definitions/Alarm/severity'
      type: object
      x-example: |
        {
          "body": "95% CPU utilization",
          "pendingDuration": "PT5M",
          "query": "CPUUtilization[1m].mean()>95",
          "ruleName": "95",
          "severity": "CRITICAL"
        }
    Suppression:
      description: |
        The configuration details for an alarm-wide suppression.
        For dimension-specific suppressions, see [AlarmSuppression](#/en/monitoring/latest/AlarmSuppression).

        For information about alarms, see
        [Alarms Overview](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#AlarmsOverview).
      properties:
        description:
          description: |
            Human-readable reason for suppressing alarm notifications.
            It does not have to be unique, and it's changeable.
            Avoid entering confidential information.

            Oracle recommends including tracking information for the event or associated work,
            such as a ticket number.

            Example: `Planned outage due to change IT-1234.`
          maxLength: 255
          minLength: 1
          type: string
        timeSuppressFrom:
          description: |
            The start date and time for the suppression to take place, inclusive. Format defined by RFC3339.

            Example: `2023-02-01T01:02:29.600Z`
          format: date-time
          type: string
        timeSuppressUntil:
          description: |
            The end date and time for the suppression to take place, inclusive. Format defined by RFC3339.

            Example: `2023-02-01T02:02:29.600Z`
          format: date-time
          type: string
      required:
        - timeSuppressFrom
        - timeSuppressUntil
      type: object
      x-example: |
        {
          "description": "Planned outage due to change IT-1234.",
          "timeSuppressFrom": "2023-02-01T01:02:29.600Z",
          "timeSuppressUntil": "2023-02-01T02:02:29.600Z"
        }
    AlarmDimensionStatesEntry:
      description: |
        A timestamped alarm state entry for a metric stream. 
      properties:
        alarmSummary:
          description: |
            Customizable alarm summary (`alarmSummary` [alarm message parameter](/iaas/Content/Monitoring/alarm-message-format.htm)).
            Optionally include [dynamic variables](/iaas/Content/Monitoring/Tasks/update-alarm-dynamic-variables.htm).
            The alarm summary appears within the body of the alarm message and in responses to 
            [ListAlarmStatus](#/en/monitoring/latest/AlarmStatusSummary/ListAlarmsStatus) 
            [GetAlarmHistory](#/en/monitoring/latest/AlarmHistoryCollection/GetAlarmHistory) and
            [RetrieveDimensionStates](#/en/monitoring/latest/AlarmDimensionStatesCollection/RetrieveDimensionStates).
          type: string
        dimensions:
          additionalProperties:
            maxLength: 255
            minLength: 1
            type: string
          description: |
            Indicator of the metric stream associated with the alarm state entry. Includes one or more dimension key-value pairs.
          type: object
        ruleName:
          description: |
            Identifier of the alarm's base values for alarm evaluation, for use when the alarm contains overrides. 
            Default value is `BASE`. For information about alarm overrides, see [AlarmOverride](#/en/monitoring/latest/datatypes/AlarmOverride).
          type: string
        status:
          description: |
            Transition state (status value) associated with the alarm state entry.

            Example: `FIRING`
          enum:
            - FIRING
            - OK
          type: string
        timestamp:
          description: |
            Transition time associated with the alarm state entry. Format defined by RFC3339.

            Example: `2022-02-01T01:02:29.600Z`
          format: date-time
          type: string
      required:
        - alarmSummary
        - dimensions
        - status
        - ruleName
        - timestamp
      type: object
      x-example: |
        {
          "alarmSummary": "Customizable alarm summary with dynamic variables severity CRITICAL",
          "dimensions": "{
             "availabilityDomain": "phx-ad-1",
             "resourceId": "ocid1.instance.region1.phx.exampleuniqueID"
           }"
          "status": "Firing",
          "ruleName": "BASE",
          "timestamp": "2021-12-01T01:02:29.600Z"
        }
    AlarmSuppressionHistoryItem:
