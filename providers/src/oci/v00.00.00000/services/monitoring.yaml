openapi: 3.0.0
info:
  title: monitoring API
  description: oci monitoring API
  version: '20180401'
paths:
  /alarmSuppressions:
    get:
      description: |
        Lists alarm suppressions for the specified alarm. For more information, see
        [Listing Alarm Suppressions](/iaas/Content/Monitoring/Tasks/list-alarm-suppression.htm).

        For important limits information, see
        [Limits on Monitoring](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#limits).

        This call is subject to a Monitoring limit that applies to the total number of requests across all alarm operations.
        Monitoring might throttle this call to reject an otherwise valid request when the total rate of alarm operations exceeds 10 requests,
        or transactions, per second (TPS) for a given tenancy.
      operationId: ListAlarmSuppressions
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/AlarmIdQueryParam'
        - $ref: '#/components/parameters/FilterByAlarmSuppressionDisplayNameQueryParam'
        - $ref: '#/components/parameters/FilterByAlarmSuppressionLifecycleStateQueryParam'
        - $ref: '#/components/parameters/AlarmSuppressionLevelQueryParam'
        - $ref: '#/components/parameters/AlarmSuppressionCompartmentIdQueryParam'
        - $ref: '#/components/parameters/CompartmentIdInSubtreeQueryParam'
        - $ref: '#/components/parameters/AlarmSuppressionTargetTypeQueryParam'
        - $ref: '#/components/parameters/IsAllSuppressionsQueryParam'
        - $ref: '#/components/parameters/AlarmSuppressionSortByQueryParam'
        - $ref: '#/components/parameters/AlarmSuppressionSortOrderQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
      responses:
        '200':
          description: alarm suppression items
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, next page of results remains.
                For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-previous-page:
              description: |
                For list pagination. When this header appears in the response, previous pages of results remains.
                For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmSuppressionCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: List Alarm Suppressions
      tags:
        - monitoring
      x-example: |
        GET /20180401/alarmSuppressions?alarmId=<var>&lt;alarm_OCID&gt;</var>
        Host: telemetry.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
    post:
      description: |
        Creates a new alarm suppression at the specified level (alarm-wide or dimension-specific).
        For more information, see
        [Suppressing a Single Alarm](/iaas/Content/Monitoring/Tasks/create-alarm-suppression.htm) and
        [Suppressing Multiple Alarms](/iaas/Content/Monitoring/Tasks/create-alarm-suppression-multiple.htm).

        For important limits information, see
        [Limits on Monitoring](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#limits).

        This call is subject to a Monitoring limit that applies to the total number of requests across all alarm operations.
        Monitoring might throttle this call to reject an otherwise valid request when the total rate of alarm operations exceeds 10 requests,
        or transactions, per second (TPS) for a given tenancy.
      operationId: CreateAlarmSuppression
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/RetryTokenHeaderParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlarmSuppressionDetails'
        description: |
          The details of the alarm suppression to be created
        required: true
      responses:
        '200':
          description: |
            Successfully created alarm suppression.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmSuppression'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Creates a new alarm suppression
      tags:
        - monitoring
      x-example: |
        POST /20180401/alarmSuppressions
        Host: telemetry.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
        {
          "alarmSuppressionTarget" : {
              "targetType" : "ALARM",
              "alarmId" : "<var>&lt;alarm_OCID&gt;</var>"
          },
          "level": "DIMENSION",
          "displayName": "Suppression for monthly downtime of resource ABC",
          "description": "Suppression for monthly downtime of resource ABC, for support ticket IT-ABC",
          "dimensions": {"resourceId": <var>&lt;resource_OCID&gt;</var>}
          "timeSuppressFrom": "2023-03-04T05:00:00.600Z",
          "timeSuppressUntil": "2023-03-31T17:00:00.000Z",
          "suppressionConditions": [{
            "conditionType": "RECURRENCE",
            "suppressionRecurrence":"FREQ=WEEKLY;BYDAY=MO,TU,WE,TH;BYHOUR=10;BYMINUTE=00;BYSECOND=00",
            "suppressionDuration":"PT1H"
          }]
        }
  /alarmSuppressions/{alarmSuppressionId}:
    delete:
      description: |
        Deletes the specified alarm suppression. For more information, see
        [Removing a Suppression from a Single Alarm](/iaas/Content/Monitoring/Tasks/delete-alarm-suppression.htm) and
        [Removing a Suppression from Multiple Alarms](/iaas/Content/Monitoring/Tasks/delete-alarm-suppression-multiple.htm).

        For important limits information, see
        [Limits on Monitoring](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#limits).

        This call is subject to a Monitoring limit that applies to the total number of requests across all alarm operations.
        Monitoring might throttle this call to reject an otherwise valid request when the total rate of alarm operations exceeds 10 requests,
        or transactions, per second (TPS) for a given tenancy.
      operationId: DeleteAlarmSuppression
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/AlarmSuppressionIdPathParam'
      responses:
        '204':
          description: Successfully deleted the alarm suppression.
          headers:
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '412':
          $ref: '#/components/responses/412'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      tags:
        - monitoring
      x-example: |
        DELETE /20180401/alarmSuppressions/<var>&lt;alarmSuppression_OCID&gt;</var>
        Host: telemetry.us-phoenix-1.oraclecloud.com
        <var>&lt;authorization and other headers&gt;</var>
      x-related-resource: '#/definitions/AlarmSuppression'
    get:
      description: |
        Gets the specified alarm suppression. For more information, see
        [Getting an Alarm-wide Suppression](/iaas/Content/Monitoring/Tasks/get-alarm-suppression.htm).

        For important limits information, see
        [Limits on Monitoring](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#limits).

        This call is subject to a Monitoring limit that applies to the total number of requests across all alarm operations.
        Monitoring might throttle this call to reject an otherwise valid request when the total rate of alarm operations exceeds 10 requests,
        or transactions, per second (TPS) for a given tenancy.
      operationId: GetAlarmSuppression
      parameters:
