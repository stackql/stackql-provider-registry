    AlarmSuppressionSummary:
      description: |
        A summary of properties for the specified alarm suppression.
      properties:
        alarmSuppressionTarget:
          $ref: '#/components/schemas/AlarmSuppressionTarget'
        compartmentId:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing the alarm suppression.
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                An object that represents the value of the tag. Only String types are currently supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing predefined tags' keys and values scoped to a namespace
              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a namespace.
            Example: `{"foo-namespace": {"bar-key": "value"}}`
          type: object
        description:
          description: |
            Human-readable reason for this alarm suppression.
            It does not have to be unique, and it's changeable.
            Avoid entering confidential information.

            Oracle recommends including tracking information for the event or associated work,
            such as a ticket number.

            Example: `Planned outage due to change IT-1234.`
          type: string
        dimensions:
          additionalProperties:
            type: string
          description: |
            Configured dimension filter for suppressing alarm state entries that include the set of specified dimension key-value pairs.

            Example: `{"resourceId": "ocid1.instance.region1.phx.exampleuniqueID"}`
          type: object
        displayName:
          description: A user-friendly name for the alarm suppression. It does not have to be unique, and it's changeable. Avoid entering confidential information.
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.
            Example: `{"bar-key": "value"}`
          type: object
        id:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the alarm suppression.
          type: string
        level:
          description: |
            The level of this alarm suppression.
            `ALARM` indicates a suppression of the entire alarm, regardless of dimension.
            `DIMENSION` indicates a suppression configured for specified dimensions.

            Defaut: `DIMENSION`
          type: string
          x-obmcs-enumref: '#/definitions/AlarmSuppression/level'
        lifecycleState:
          description: |
            The current lifecycle state of the alarm suppression.
          type: string
          x-obmcs-enumref: '#/definitions/AlarmSuppression/lifecycleState'
        suppressionConditions:
          description: |
            Array of all preconditions for alarm suppression.
            Example: `[{
              conditionType: "RECURRENCE",
              suppressionRecurrence: "FRQ=DAILY;BYHOUR=10",
              suppressionDuration: "PT1H"
            }]`
          items:
            $ref: '#/components/schemas/SuppressionCondition'
          maxItems: 1
          minItems: 1
          type: array
        timeCreated:
          description: |
            The date and time the alarm suppression was created. Format defined by RFC3339.

            Example: `2023-02-01T01:02:29.600Z`
          format: date-time
          type: string
        timeSuppressFrom:
          description: |
            The start date and time for the suppression to take place, inclusive. Format defined by RFC3339.

            Example: `2023-02-01T01:02:29.600Z`
          format: date-time
          type: string
        timeSuppressUntil:
          description: |
            The end date and time for the suppression to take place, inclusive. Format defined by RFC3339.

            Example: `2023-02-01T02:02:29.600Z`
          format: date-time
          type: string
        timeUpdated:
          description: |
            The date and time the alarm suppression was last updated (deleted). Format defined by RFC3339.

            Example: `2023-02-03T01:02:29.600Z`
          format: date-time
          type: string
      required:
        - id
        - compartmentId
        - alarmSuppressionTarget
        - level
        - displayName
        - timeSuppressFrom
        - timeSuppressUntil
        - lifecycleState
        - timeCreated
        - timeUpdated
      type: object
    Error:
