            The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the alarm to retrieve history for.
          type: string
        entries:
          description: |
            The set of history entries retrieved for the alarm.
          items:
            $ref: '#/components/schemas/AlarmHistoryEntry'
          type: array
        isEnabled:
          description: |
            Whether the alarm is enabled.

            Example: `true`
          type: boolean
      required:
