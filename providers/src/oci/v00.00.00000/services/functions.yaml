openapi: 3.0.0
info:
  title: functions API
  description: oci functions API
  version: '20181201'
paths:
  /applications:
    get:
      description: Lists applications for a compartment.
      operationId: ListApplications
      parameters:
        - $ref: '#/components/parameters/CompartmentIdQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
