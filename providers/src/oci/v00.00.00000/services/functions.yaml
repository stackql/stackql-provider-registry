        - $ref: '#/components/parameters/ListApplicationsFilterByDisplayNameQueryParam'
        - $ref: '#/components/parameters/ListApplicationsFilterByIdQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - description: |
            Specifies the attribute with which to sort the rules.

            Default: `displayName`

            * **timeCreated:** Sorts by timeCreated.
            * **displayName:** Sorts by displayName.
            * **id:** Sorts by id.
          in: query
          name: sortBy
          required: false
          schema:
            type: string
            enum:
              - timeCreated
              - id
              - displayName
            default: displayName
      responses:
        '200':
          description: Succesfully retrieved summary of applications.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages of
                results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
                a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Lists applications for a compartment
      tags:
        - functionsManagement
      x-example: |
