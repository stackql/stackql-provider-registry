  /pbfListingVersions:
    get:
      description: |
        Fetches a wrapped list of all Pre-built Function(PBF) Listing versions. Returns a PbfListingVersionCollection 
        containing an array of PbfListingVersionSummary response models.

        Note that the PbfListingIdentifier must be provided as a query parameter, otherwise an exception shall 
        be thrown.
      operationId: ListPbfListingVersions
      parameters:
        - $ref: '#/components/parameters/PbfListingIdentifierQueryParam'
        - $ref: '#/components/parameters/PbfListingVersionIdentifierQueryParam'
        - $ref: '#/components/parameters/PbfListingVersionNameQueryParam'
        - $ref: '#/components/parameters/PbfListingVersionIsCurrentVersionQueryParam'
        - $ref: '#/components/parameters/PbfListingVersionLifecycleStateQueryParam'
        - $ref: '#/components/parameters/PaginationLimitQueryParam'
        - $ref: '#/components/parameters/PaginationTokenQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/PbfListingVersionSortByQueryParam'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        '200':
          description: A page of PbfListingVersionSummary objects.
          headers:
            opc-next-page:
              description: |
                For pagination of a list of items. When paging through a list, if this header appears in the response,
                then a partial list might have been returned. Include this value as the `page` parameter for the
                subsequent GET request to get the next batch of items.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PbfListingVersionsCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Get a list of all Pre-built Function(PBF) Listing versions.
