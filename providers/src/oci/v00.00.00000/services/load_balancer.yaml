    HealthCheckResult:
      description: |
        Information about a single backend server health check result reported by a load balancer.
      properties:
        healthCheckStatus:
          description: |
            The result of the most recent health check.
          enum:
            - OK
            - INVALID_STATUS_CODE
            - TIMED_OUT
            - REGEX_MISMATCH
            - CONNECT_FAILED
            - IO_ERROR
            - OFFLINE
            - UNKNOWN
          type: string
        sourceIpAddress:
          description: |
            The IP address of the health check status report provider. This identifier helps you differentiate same-subnet
            load balancers that report health check status.

            Example: `10.0.0.7`
          type: string
        subnetId:
          description: |
            The [OCID](/Content/General/Concepts/identifiers.htm) of the subnet hosting the load balancer that reported this health check status.
          type: string
        timestamp:
          description: |
            The date and time the data was retrieved, in the format defined by RFC3339.

            Example: `2017-06-02T18:28:11+00:00`
          format: date-time
          type: string
      required:
        - subnetId
        - sourceIpAddress
        - timestamp
        - healthCheckStatus
      type: object
      x-example: |
        {
          "subnetId": "ocid1.subnet.oc1.phx.<var>&lt;unique_ID&gt;</var>",
          "sourceIpAddress": "192.168.0.7",
          "timestamp": "2018-02-09T21:58:11.417Z",
          "healthCheckStatus": "OK"
        }
    ConnectionConfiguration:
      description: |
        Configuration details for the connection between the client and backend servers.
      properties:
        backendTcpProxyProtocolOptions:
          description: |
            An array that represents the PPV2 Options that can be enabled on TCP Listeners.
            Example: ["PP2_TYPE_AUTHORITY"]
          items:
            enum:
              - PP2_TYPE_AUTHORITY
            maxLength: 64
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        backendTcpProxyProtocolVersion:
          description: |
            The backend TCP Proxy Protocol version.

            Example: `1`
          format: int32
          maximum: 2
          minimum: 1
          type: integer
        idleTimeout:
          description: |
            The maximum idle time, in seconds, allowed between two successive receive or two successive send operations
            between the client and backend servers. A send operation does not reset the timer for receive operations. A
            receive operation does not reset the timer for send operations.

            For more information, see [Connection Configuration](/Content/Balance/Reference/connectionreuse.htm#ConnectionConfiguration).

            Example: `1200`
          format: int64
          minimum: 1
          type: integer
      required:
        - idleTimeout
      type: object
      x-example: |
        {
          "backendTcpProxyProtocolVersion": 2,
          "backendTcpProxyProtocolOptions": ["PP2_TYPE_AUTHORITY"],
          "idleTimeout": 1200
