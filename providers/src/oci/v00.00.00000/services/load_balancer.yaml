    UpdateRoutingPolicyDetails:
      description: An updated list of routing rules that overwrites the existing list of routing rules.
      properties:
        conditionLanguageVersion:
          description: |
            The version of the language in which `condition` of `rules` are composed.
          enum:
            - V1
          type: string
        rules:
          description: The list of routing rules.
          items:
            $ref: '#/components/schemas/RoutingRule'
          maxItems: 100
          minItems: 1
          type: array
      required:
        - rules
      type: object
      x-example: |
        {
          "conditionLanguageVersion": "V1",
          "rules": [
            {
              "name": "HR_mobile_user_rule",
              "condition": "all(http.request.headers[(i 'user-agent')] eq (i 'mobile'), http.request.url.query[(i 'department')] eq (i 'HR'))" ,
              "actions": [{
                "name": "FORWARD_TO_BACKENDSET",
                "backendSetName": "backendSetForHRMobileUsers"
              }]
            },
            {
              "name": "Cookie_rule",
              "condition": "any(http.request.cookies['myCookie'] eq 'myCookieVal', http.request.headers[(i 'customHeader')] eq (i 'headerVal'))" ,
              "actions": [{
                "name": "FORWARD_TO_BACKENDSET",
                "backendSetName": "backendSetForlargeimages"
              }]
            }
          ]
        }
    RuleSet:
      description: |
        A named set of rules associated with a load balancer. Rules are objects that represent actions to apply to a listener,
        such as adding, altering, or removing HTTP headers. For more information, see
        [Managing Rule Sets](/Content/Balance/Tasks/managingrulesets.htm).
      properties:
