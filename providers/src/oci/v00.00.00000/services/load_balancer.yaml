          type: array
        name:
          description: |
            The name for this set of rules. It must be unique and it cannot be changed. Avoid entering
            confidential information.

            Example: `example_rule_set`
          type: string
      required:
        - name
        - items
      type: object
      x-example: |
        {
          "name": "example_rule_set",
