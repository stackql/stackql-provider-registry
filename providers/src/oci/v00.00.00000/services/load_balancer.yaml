      description: An object that represents an action to apply to a listener.
      discriminator:
        propertyName: action
      properties:
        action:
          enum:
            - ADD_HTTP_REQUEST_HEADER
            - EXTEND_HTTP_REQUEST_HEADER_VALUE
            - REMOVE_HTTP_REQUEST_HEADER
            - ADD_HTTP_RESPONSE_HEADER
            - EXTEND_HTTP_RESPONSE_HEADER_VALUE
            - REMOVE_HTTP_RESPONSE_HEADER
            - ALLOW
            - CONTROL_ACCESS_USING_HTTP_METHODS
            - REDIRECT
            - HTTP_HEADER
            - IP_BASED_MAX_CONNECTIONS
          type: string
      required:
        - action
      type: object
      x-example: |
        {
          "action": "ADD_HTTP_REQUEST_HEADER",
          "header": "example_header_name",
          "value": "example_value"
        }
    PathRoute:
      description: |
        A "path route rule" to evaluate an incoming URI path, and then route a matching request to the specified backend set.

        Path route rules apply only to HTTP and HTTPS requests. They have no effect on TCP requests.
      properties:
        backendSetName:
          description: |
            The name of the target backend set for requests where the incoming URI matches the specified path.

            Example: `example_backend_set`
          maxLength: 32
          minLength: 1
          type: string
        path:
          description: |
            The path string to match against the incoming URI path.

            *  Path strings are case-insensitive.

            *  Asterisk (*) wildcards are not supported.

            *  Regular expressions are not supported.

            Example: `/example/video/123`
          maxLength: 2048
          minLength: 1
          type: string
        pathMatchType:
          $ref: '#/components/schemas/PathMatchType'
      required:
        - path
        - pathMatchType
        - backendSetName
      type: object
      x-example: |
        {
          "path": "/example/video/123",
          "pathMatchType": {
            "matchType": "EXACT_MATCH"
          },
          "backendSetName": "example_backend_set"
        }
    RoutingRule:
      description: |
        A routing rule examines an incoming request, routing matching requests to the specified backend set.
        Routing rules apply only to HTTP and HTTPS requests. They have no effect on TCP requests.
      properties:
        actions:
          description: |
            A list of actions to be applied when conditions of the routing rule are met.
          items:
            $ref: '#/components/schemas/Action'
          maxItems: 1
          minItems: 1
          type: array
        condition:
          description: |
            A routing rule to evaluate defined conditions against the incoming HTTP request and perform an action.
          maxLength: 4096
          minLength: 1
          type: string
        name:
          description: |
            A unique name for the routing policy rule. Avoid entering confidential information.
          maxLength: 32
          minLength: 1
          pattern: ^[a-zA-Z_][a-zA-Z_0-9]*$
          type: string
      required:
        - name
        - condition
        - actions
      type: object
      x-example: |
        {
          "name": "Cookie_rule",
          "condition" : "any(http.request.cookies['myCookie'] eq 'myCookieVal', http.request.headers[(i 'customHeader')] eq 'headerVal')",
          "actions": [{
            "name": "FORWARD_TO_BACKENDSET",
            "backendSetName": "backendSetForThumbnails"
          }]
        }
    PathMatchType:
      description: The type of matching to apply to incoming URIs.
      properties:
        matchType:
          description: |
            Specifies how the load balancing service compares a [PathRoute](#/en/loadbalancer/20170115/requests/PathRoute)
            object's `path` string against the incoming URI.

            *  **EXACT_MATCH** - Looks for a `path` string that exactly matches the incoming URI path.

            *  **FORCE_LONGEST_PREFIX_MATCH** - Looks for the `path` string with the best, longest match of the beginning
               portion of the incoming URI path.

            *  **PREFIX_MATCH** - Looks for a `path` string that matches the beginning portion of the incoming URI path.

            *  **SUFFIX_MATCH** - Looks for a `path` string that matches the ending portion of the incoming URI path.

            For a full description of how the system handles `matchType` in a path route set containing multiple rules, see
            [Managing Request Routing](/Content/Balance/Tasks/managingrequest.htm).
          enum:
            - EXACT_MATCH
            - FORCE_LONGEST_PREFIX_MATCH
            - PREFIX_MATCH
            - SUFFIX_MATCH
          type: string
      required:
        - matchType
      type: object
      x-example: |
        {
          "matchType": "EXACT_MATCH"
        }
    Action:
      description: An entity that represents an action to apply for a routing rule.
      discriminator:
        propertyName: name
      properties:
        name:
          enum:
            - FORWARD_TO_BACKENDSET
          type: string
      required:
        - name
      type: object
      x-example: |
        {
          "name": "FORWARD_TO_BACKENDSET",
          "backendSetName" : "backendSetToHandleSomeCriteria"
        }
