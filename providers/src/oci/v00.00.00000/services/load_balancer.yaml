      properties:
        shapeDetails:
          $ref: '#/components/schemas/ShapeDetails'
        shapeName:
          description: |
            The new shape name for the load balancer.

            Allowed values are :
              *  10Mbps
              *  100Mbps
              *  400Mbps
              *  8000Mbps
              *  Flexible

              Example: `flexible`

              * NOTE: Fixed shapes 10Mbps, 100Mbps, 400Mbps, 8000Mbps will be deprecated after May 2023. This api
              * will only support `Flexible` shape after that date.
          type: string
      required:
        - shapeName
      type: object
      x-example: |
        {
          "shapeName": "Flexible",
          "shapeDetails": {
            "minimumBandwidthInMbps": 150,
            "maximumBandwidthInMbps": 1500
          }
        }
    Error:
      properties:
        code:
          description: |
            A short error code that defines the error, meant for programmatic parsing. See
            [API Errors](/Content/API/References/apierrors.htm).
          type: string
        message:
          description: |
            A human-readable error string.
          type: string
      required:
        - code
        - message
      x-example: |
        {
          "code" : "400",
          "message" : "LimitExceeded"
        }
      type: object
    WorkRequestError:
      description: An object returned in the event of a work request error.
      properties:
        errorCode:
          enum:
            - BAD_INPUT
            - INTERNAL_ERROR
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
        - errorCode
        - message
      type: object
      x-example: |
        {
          "errorCode" : "BAD_INPUT",
          "message" : "Default Listener on port '80' refer to VIP 'private-vip' twice"
        }
    IpAddress:
      description: A load balancer IP address.
      properties:
        ipAddress:
          description: |
            An IP address.

            Example: `192.168.0.3`
          type: string
        isPublic:
          description: |
            Whether the IP address is public or private.

            If "true", the IP address is public and accessible from the internet.

            If "false", the IP address is private and accessible only from within the associated VCN.
          type: boolean
        reservedIp:
          $ref: '#/components/schemas/ReservedIP'
      required:
        - ipAddress
      x-example: |
        {
          "reservedIp": {
            "id": "ocid1.publicip.oc1.phx.amaasavayhrfkyyamqzspkfppv5vsvbtlkyxq6cu2b34pv575empq7nv6zvp"
          },
          "ipAddress": "192.168.0.3",
          "isPublic": false
        }
      type: object
    Listener:
      description: |
        The listener's configuration.
        For more information on backend set configuration, see
        [Managing Load Balancer Listeners](/Content/Balance/Tasks/managinglisteners.htm).
      properties:
        connectionConfiguration:
          $ref: '#/components/schemas/ConnectionConfiguration'
        defaultBackendSetName:
          description: |
            The name of the associated backend set.

            Example: `example_backend_set`
          type: string
        hostnameNames:
          description: An array of hostname resource names.
          items:
            maxLength: 16
            minLength: 1
            type: string
          type: array
        name:
          description: |
            A friendly name for the listener. It must be unique and it cannot be changed.

            Example: `example_listener`
          type: string
        pathRouteSetName:
          description: |
            Deprecated. Please use `routingPolicies` instead.

            The name of the set of path-based routing rules, [PathRouteSet](#/en/loadbalancer/20170115/PathRouteSet/),
            applied to this listener's traffic.

            Example: `example_path_route_set`
          maxLength: 32
          minLength: 1
          type: string
        port:
          description: |
            The communication port for the listener.

            Example: `80`
          example: '0'
          format: int32
          type: integer
        protocol:
          description: |
            The protocol on which the listener accepts connection requests.
            To get a list of valid protocols, use the [ListProtocols](#/en/loadbalancer/20170115/LoadBalancerProtocol/ListProtocols)
            operation.

            Example: `HTTP`
          type: string
        routingPolicyName:
          description: |
            The name of the routing policy applied to this listener's traffic.

            Example: `example_routing_policy_name`
          maxLength: 32
          minLength: 1
          pattern: ^[a-zA-Z_][a-zA-Z_0-9]*$
          type: string
        ruleSetNames:
          description: |
            The names of the [rule sets](#/en/loadbalancer/20170115/RuleSet/) to apply to the listener.

            Example: ["example_rule_set"]
          items:
            maxLength: 32
            minLength: 1
            pattern: ^[a-zA-Z_][a-zA-Z_0-9]*$
            type: string
          type: array
        sslConfiguration:
          $ref: '#/components/schemas/SSLConfiguration'
      required:
        - defaultBackendSetName
        - name
        - port
        - protocol
      type: object
      x-example: |
        {
          "defaultBackendSetName": "example_backend_set",
          "port": 80,
          "protocol": "HTTP",
          "hostnameNames": [
            "example_hostname_001",
            "example_hostname_002"
          ],
          "pathRouteSetName": "example_path_route_set",
          "sslConfiguration": {
            "protocols": ["TLSv1.1", "TLSv1.2"],
            "cipherSuiteName" : "example_cipher_suite",
            "serverOrderPreference" : "ENABLED",
            "certificateName": "example_certificate_bundle",
            "verifyPeerCertificate": true
            "verifyDepth": 3,
          }
          "connectionConfiguration": {
            "idleTimeout": 1200
          }
          "name": "example_listener"
        }
    ShapeDetails:
      description: |
        The configuration details to update load balancer to a different shape.
      properties:
        maximumBandwidthInMbps:
          description: |
            Bandwidth in Mbps that determines the maximum bandwidth (ingress plus egress) that the load balancer can
            achieve. This bandwidth cannot be always guaranteed. For a guaranteed bandwidth use the minimumBandwidthInMbps
            parameter.

            The values must be between minimumBandwidthInMbps and 8000 (8Gbps).

            Example: `1500`
          format: int32
          maximum: 8000
          minimum: 10
          type: integer
        minimumBandwidthInMbps:
          description: |
            Bandwidth in Mbps that determines the total pre-provisioned bandwidth (ingress plus egress).
            The values must be between 10 and the maximumBandwidthInMbps.

            Example: `150`
          format: int32
          maximum: 8000
          minimum: 10
          type: integer
      required:
        - minimumBandwidthInMbps
        - maximumBandwidthInMbps
      type: object
      x-example: |
        {
          "minimumBandwidthInMbps": 150,
          "maximumBandwidthInMbps": 1500
        }
    BackendSetDetails:
      description: |
        The configuration details for a load balancer backend set.
        For more information on backend set configuration, see
        [Managing Backend Sets](/Content/Balance/Tasks/managingbackendsets.htm).
      properties:
        backendMaxConnections:
          description: |
            The maximum number of simultaneous connections the load balancer can make to any backend
            in the backend set unless the backend has its own maxConnections setting. If this is not
            set or set to 0 then the number of simultaneous connections the load balancer can make
            to any backend in the backend set unless the backend has its own maxConnections setting
            is unlimited.

            If setting backendMaxConnections to some value other than 0 then that value must be greater
            or equal to 256.

            Example: `300`
          format: int32
          maximum: 65535
          minimum: 0
          type: integer
        backends:
          items:
            $ref: '#/components/schemas/BackendDetails'
          type: array
          uniqueItems: true
        healthChecker:
          $ref: '#/components/schemas/HealthCheckerDetails'
        policy:
          description: |
            The load balancer policy for the backend set. To get a list of available policies, use the
            [ListPolicies](#/en/loadbalancer/20170115/LoadBalancerPolicy/ListPolicies) operation.

            Example: `LEAST_CONNECTIONS`
          type: string
        sessionPersistenceConfiguration:
          $ref: '#/components/schemas/SessionPersistenceConfigurationDetails'
        sslConfiguration:
          $ref: '#/components/schemas/SSLConfigurationDetails'
      required:
        - healthChecker
        - policy
      type: object
      x-example: |
        {
          "policy": "LEAST_CONNECTIONS",
          "backends": [
            {
              "ipAddress": "10.0.0.3",
              "port": 8080,
              "weight": 3,
              "backup": false,
              "drain": false,
              "offline": false
            },
            {
              "ipAddress": "10.0.0.4",
              "port": 8080,
              "weight": 1,
              "backup": false,
              "drain": false,
              "offline": false
            }
          ],
          "backendMaxConnections": 300,
          "healthChecker": {
            "protocol": "HTTP",
            "isForcePlainText": false,
            "urlPath": "/healthcheck",
            "port": 8080,
            "returnCode": 200,
            "retries": 3,
            "timeoutInMillis": 3000,
            "intervalInMillis": 10000,
            "responseBodyRegex": "^((?!false).|\s)*$"
          },
          "sslConfiguration": {
            "protocols": ["TLSv1.1", "TLSv1.2"],
            "cipherSuiteName" : "example_cipher_suite",
            "serverOrderPreference" : "ENABLED",
            "certificateName": "example_certificate_bundle",
            "verifyPeerCertificate": true,
            "verifyDepth": 3
          },
          "sessionPersistenceConfiguration": {
            "cookieName": "example_cookie",
            "disableFallback": false
          }
        }
    CertificateDetails:
      description: |
        The configuration details for a certificate bundle.
        For more information on SSL certficate configuration, see
        [Managing SSL Certificates](/Content/Balance/Tasks/managingcertificates.htm).

        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.
      properties:
        caCertificate:
          description: |
            The Certificate Authority certificate, or any interim certificate, that you received from your SSL certificate provider.

            Example:

                -----BEGIN CERTIFICATE-----
                MIIEczCCA1ugAwIBAgIBADANBgkqhkiG9w0BAQQFAD..AkGA1UEBhMCR0Ix
                EzARBgNVBAgTClNvbWUtU3RhdGUxFDASBgNVBAoTC0..0EgTHRkMTcwNQYD
                VQQLEy5DbGFzcyAxIFB1YmxpYyBQcmltYXJ5IENlcn..XRpb24gQXV0aG9y
                aXR5MRQwEgYDVQQDEwtCZXN0IENBIEx0ZDAeFw0wMD..TUwMTZaFw0wMTAy
                ...
                -----END CERTIFICATE-----
          type: string
        certificateName:
          description: |
            A friendly name for the certificate bundle. It must be unique and it cannot be changed.
            Valid certificate bundle names include only alphanumeric characters, dashes, and underscores.
            Certificate bundle names cannot contain spaces. Avoid entering confidential information.

            Example: `example_certificate_bundle`
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9_.-]*$
          type: string
        passphrase:
          description: |
            A passphrase for encrypted private keys. This is needed only if you created your certificate with a passphrase.
          type: string
        privateKey:
          description: |
            The SSL private key for your certificate, in PEM format.

            Example:

                -----BEGIN RSA PRIVATE KEY-----
                jO1O1v2ftXMsawM90tnXwc6xhOAT1gDBC9S8DKeca..JZNUgYYwNS0dP2UK
                tmyN+XqVcAKw4HqVmChXy5b5msu8eIq3uc2NqNVtR..2ksSLukP8pxXcHyb
                +sEwvM4uf8qbnHAqwnOnP9+KV9vds6BaH1eRA4CHz..n+NVZlzBsTxTlS16
                /Umr7wJzVrMqK5sDiSu4WuaaBdqMGfL5hLsTjcBFD..Da2iyQmSKuVD4lIZ
                ...
                -----END RSA PRIVATE KEY-----
          type: string
        publicCertificate:
          description: |
            The public certificate, in PEM format, that you received from your SSL certificate provider.

            Example:

                -----BEGIN CERTIFICATE-----
                MIIC2jCCAkMCAg38MA0GCSqGSIb3DQEBBQUAMIGbMQswCQYDVQQGEwJKUDEOMAwG
                A1UECBMFVG9reW8xEDAOBgNVBAcTB0NodW8ta3UxETAPBgNVBAoTCEZyYW5rNERE
                MRgwFgYDVQQLEw9XZWJDZXJ0IFN1cHBvcnQxGDAWBgNVBAMTD0ZyYW5rNEREIFdl
                YiBDQTEjMCEGCSqGSIb3DQEJARYUc3VwcG9ydEBmcmFuazRkZC5jb20wHhcNMTIw
                ...
                -----END CERTIFICATE-----
          type: string
      required:
        - certificateName
      type: object
      x-example: |
        {
          "passphrase": "<var>&lt;passphrase&gt</var>",
          "privateKey": "<var>&lt;private_key&gt</var>",
          "publicCertificate": "<var>&lt;public_certificate&gt</var>",
          "caCertificate": "<var>&lt;ca_certificate&gt</var>",
          "certificateName": "example_certificate_bundle",
        }
    HostnameDetails:
      description: The details of a hostname resource associated with a load balancer.
      properties:
        hostname:
          description: |
            A virtual hostname. For more information about virtual hostname string construction, see
            [Managing Request Routing](/Content/Balance/Tasks/managingrequest.htm#routing).

            Example: `app.example.com`
          type: string
        name:
          description: |
            The name of the hostname resource.

            Example: `example_hostname_001`
          type: string
      required:
        - name
        - hostname
      type: object
    ListenerDetails:
      description: The listener's configuration details.
      properties:
        connectionConfiguration:
          $ref: '#/components/schemas/ConnectionConfiguration'
        defaultBackendSetName:
          description: |
            The name of the associated backend set.

            Example: `example_backend_set`
          maxLength: 32
          minLength: 1
          type: string
        hostnameNames:
          description: An array of hostname resource names.
          items:
            maxLength: 16
            minLength: 1
            type: string
          type: array
        pathRouteSetName:
          description: |
            Deprecated. Please use `routingPolicies` instead.

            The name of the set of path-based routing rules, [PathRouteSet](#/en/loadbalancer/20170115/PathRouteSet/),
            applied to this listener's traffic.

            Example: `example_path_route_set`
          maxLength: 32
          minLength: 1
          type: string
        port:
          description: |
            The communication port for the listener.

            Example: `80`
          format: int32
          maximum: 65535
          minimum: 1
          type: integer
        protocol:
          description: |
            The protocol on which the listener accepts connection requests.
            To get a list of valid protocols, use the [ListProtocols](#/en/loadbalancer/20170115/LoadBalancerProtocol/ListProtocols)
            operation.

            Example: `HTTP`
          type: string
        routingPolicyName:
          description: |
            The name of the routing policy applied to this listener's traffic.

            Example: `example_routing_policy`
          maxLength: 32
          minLength: 1
          pattern: ^[a-zA-Z_][a-zA-Z_0-9]*$
          type: string
        ruleSetNames:
          description: |
            The names of the [rule sets](#/en/loadbalancer/20170115/RuleSet/) to apply to the listener.

             Example: ["example_rule_set"]
          items:
            maxLength: 32
            minLength: 1
            pattern: ^[a-zA-Z_][a-zA-Z_0-9]*$
            type: string
          type: array
        sslConfiguration:
          $ref: '#/components/schemas/SSLConfigurationDetails'
      required:
        - defaultBackendSetName
        - port
        - protocol
      type: object
      x-example: |
        {
          "defaultBackendSetName": "example_backend_set",
          "port": 80,
          "protocol": "HTTP",
          "pathRouteSetName": "example_path_route_set",
          "sslConfiguration": {
            "protocols": ["TLSv1.1", "TLSv1.2"],
            "cipherSuiteName" : "example_cipher_suite",
            "serverOrderPreference" : "ENABLED",
            "certificateName": "example_certificate_bundle",
            "verifyPeerCertificate": true
            "verifyDepth": 3,
          }
          "connectionConfiguration": {
            "idleTimeout": 1200
          }
        }
    PathRouteSetDetails:
      description: A set of path route rules.
      properties:
        pathRoutes:
          description: The set of path route rules.
          items:
            $ref: '#/components/schemas/PathRoute'
          maxItems: 20
          minItems: 1
          type: array
      required:
        - pathRoutes
      type: object
      x-example: |
        {
          "pathRoutes": [
            {
              "path": "/example/video/123",
              "pathMatchType": {
                "matchType": "EXACT_MATCH"
              },
              "backendSetName": "example_backend_set"
            }
          ]
        }
    ReservedIP:
      properties:
        id:
          description: |
            Ocid of the Reserved IP/Public Ip created with VCN.

            Reserved IPs are IPs which already registered using VCN API.

            Create a reserved Public IP and then while creating the load balancer pass the ocid of the reserved IP in this
            field reservedIp to attach the Ip to Load balancer. Load balancer will be configured to listen to traffic on this IP.

            Reserved IPs will not be deleted when the Load balancer is deleted. They will be unattached from the Load balancer.

            Example: "ocid1.publicip.oc1.phx.unique_ID"

            IPV6 example: "ocid1.ipv6.oc1.phx.unique_ID"
          type: string
      type: object
    RuleSetDetails:
      description: The rules that compose a rule set.
      properties:
        items:
          description: An array of rules that compose the rule set.
          items:
            $ref: '#/components/schemas/Rule'
          type: array
      required:
        - items
      type: object
      x-example: |
        {
          "items": [
            {
              "action": "ADD_REQUEST_HEADER",
              "header": "example_header_name",
              "value": "example_value"
            },
            {
              "action": "EXTEND_HTTP_REQUEST_HEADER_VALUE",
              "header": "example_header_name2",
              "prefix": "example_prefix_value",
              "suffix": "example_suffix_value"
            }
          ]
        }
