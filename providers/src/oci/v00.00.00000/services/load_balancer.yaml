    BackendHealth:
      description: |
        The health status of the specified backend server as reported by the primary and standby load balancers.
      properties:
        healthCheckResults:
          description: |
            A list of the most recent health check results returned for the specified backend server.
          items:
            $ref: '#/components/schemas/HealthCheckResult'
          type: array
        status:
          description: |
            The general health status of the specified backend server as reported by the primary and standby load balancers.

            *   **OK:** Both health checks returned `OK`.

            *   **WARNING:** One health check returned `OK` and one did not.

            *   **CRITICAL:** Neither health check returned `OK`.

            *   **UNKNOWN:** One or both health checks returned `UNKNOWN`, or the system was unable to retrieve metrics at this time.
          enum:
            - OK
            - WARNING
            - CRITICAL
            - UNKNOWN
          type: string
      required:
        - status
        - healthCheckResults
      type: object
      x-example: |
        {
          "status": "OK",
          "healthCheckResults": [
            {
              "subnetId": "ocid1.subnet.oc1.phx.<var>&lt;unique_ID&gt;</var>",
              "sourceIpAddress": "192.168.0.7",
              "timestamp": "2018-02-09T21:58:11.417Z",
              "healthCheckStatus": "OK"
            }
          ]
        }
    BackendSetHealth:
      description: |
        The health status details for a backend set.

        This object does not explicitly enumerate backend servers with a status of `OK`. However, they are included in the
        `totalBackendCount` sum.
      properties:
        criticalStateBackendNames:
          description: |
            A list of backend servers that are currently in the `CRITICAL` health state. The list identifies each backend server by
            IP address and port.

            Example: `10.0.0.4:8080`
          items:
            type: string
          type: array
        status:
          description: |
            Overall health status of the backend set.

            *  **OK:** All backend servers in the backend set return a status of `OK`.

            *  **WARNING:** Half or more of the backend set's backend servers return a status of `OK` and at least one backend
            server returns a status of `WARNING`, `CRITICAL`, or `UNKNOWN`.

            *  **CRITICAL:** Fewer than half of the backend set's backend servers return a status of `OK`.

            *  **UNKNOWN:** More than half of the backend set's backend servers return a status of `UNKNOWN`, the system was
            unable to retrieve metrics, or the backend set does not have a listener attached.
          enum:
            - OK
            - WARNING
            - CRITICAL
            - UNKNOWN
          type: string
        totalBackendCount:
          description: |
            The total number of backend servers in this backend set.

            Example: `7`
          type: integer
        unknownStateBackendNames:
          description: |
            A list of backend servers that are currently in the `UNKNOWN` health state. The list identifies each backend server by
            IP address and port.

            Example: `10.0.0.5:8080`
          items:
            type: string
          type: array
        warningStateBackendNames:
          description: |
            A list of backend servers that are currently in the `WARNING` health state. The list identifies each backend server by
            IP address and port.

            Example: `10.0.0.3:8080`
          items:
            type: string
          type: array
      required:
        - status
        - warningStateBackendNames
        - criticalStateBackendNames
        - unknownStateBackendNames
        - totalBackendCount
      type: object
      x-example: |
        {
          "status": "WARNING",
          "warningStateBackendNames": [
            "10.0.0.3:8080"
          ],
          "criticalStateBackendNames": [
            "10.0.0.4:8080"
          ],
          "unknownStateBackendNames": [
            "10.0.0.5:8080"
          ],
          "totalBackendCount": 7
        }
    HealthChecker:
      description: |
        The health check policy configuration.
        For more information, see [Editing Health Check Policies](/Content/Balance/Tasks/editinghealthcheck.htm).
      properties:
        intervalInMillis:
          description: |
            The interval between health checks, in milliseconds. The default is 10000 (10 seconds).

            Example: `10000`
          format: int32
          type: integer
        isForcePlainText:
          default: false
          description: |
            Specifies if health checks should always be done using plain text instead of depending on
            whether or not the associated backend set is using SSL.

            If "true", health checks will be done using plain text even if the associated backend set is configured
            to use SSL.

            If "false", health checks will be done using SSL encryption if the associated backend set is configured
            to use SSL. If the backend set is not so configured the health checks will be done using plain text.

            Example: `false`
          type: boolean
        port:
          description: |
            The backend server port against which to run the health check. If the port is not specified, the load balancer uses the
            port information from the `Backend` object.

            Example: `8080`
          example: '0'
          format: int32
          type: integer
        protocol:
          description: |
            The protocol the health check must use; either HTTP or TCP.

            Example: `HTTP`
          type: string
        responseBodyRegex:
          description: |
            A regular expression for parsing the response body from the backend server.

            Example: `^((?!false).|\s)*$`
          type: string
        retries:
          description: |
            The number of retries to attempt before a backend server is considered "unhealthy". This number also applies
            when recovering a server to the "healthy" state. Defaults to 3.

            Example: `3`
          format: int32
          type: integer
        returnCode:
          description: |
            The status code a healthy backend server should return. If you configure the health check policy to use the HTTP protocol,
            you can use common HTTP status codes such as "200".

            Example: `200`
          example: '0'
          format: int32
          type: integer
        timeoutInMillis:
          description: |
            The maximum time, in milliseconds, to wait for a reply to a health check. A health check is successful only if a reply
            returns within this timeout period. Defaults to 3000 (3 seconds).

            Example: `3000`
          format: int32
          type: integer
        urlPath:
          description: |
            The path against which to run the health check.

            Example: `/healthcheck`
          type: string
      required:
        - port
        - protocol
        - responseBodyRegex
        - returnCode
      type: object
      x-example: |
        {
          "protocol": "HTTP",
          "isForcePlainText": false,
          "urlPath": "/healthcheck",
          "port": 8080,
          "returnCode": 200,
          "retries": 3,
          "timeoutInMillis": 3000,
          "intervalInMillis": 10000,
          "responseBodyRegex": "^((?!false).|\s)*$"
        }
