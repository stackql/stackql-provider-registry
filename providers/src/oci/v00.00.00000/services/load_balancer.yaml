    Backend:
      description: |
        The configuration of a backend server that is a member of a load balancer backend set.
        For more information, see [Managing Backend Servers](/Content/Balance/Tasks/managingbackendservers.htm).
      properties:
        backup:
          default: false
          description: |
            Whether the load balancer should treat this server as a backup unit. If `true`, the load balancer forwards no ingress
            traffic to this backend server unless all other backend servers not marked as "backup" fail the health check policy.

            **Note:** You cannot add a backend server marked as `backup` to a backend set that uses the IP Hash policy.

            Example: `false`
          type: boolean
        drain:
          default: false
          description: |
            Whether the load balancer should drain this server. Servers marked "drain" receive no new
            incoming traffic.

            Example: `false`
          type: boolean
        ipAddress:
          description: |
            The IP address of the backend server.

            Example: `10.0.0.3`
          type: string
        maxConnections:
          description: |
            The maximum number of simultaneous connections the load balancer can make to the backend.
            If this is not set or set to 0 then the maximum number of simultaneous connections the
            load balancer can make to the backend is unlimited.

            Example: `300`
          format: int32
          type: integer
        name:
          description: |
            A read-only field showing the IP address and port that uniquely identify this backend server in the backend set.

            Example: `10.0.0.3:8080`
          readOnly: true
          type: string
        offline:
          default: false
          description: |
            Whether the load balancer should treat this server as offline. Offline servers receive no incoming
            traffic.

            Example: `false`
          type: boolean
        port:
          description: |
            The communication port for the backend server.

            Example: `8080`
          format: int32
          type: integer
        weight:
          description: |
            The load balancing policy weight assigned to the server. Backend servers with a higher weight receive a larger
            proportion of incoming traffic. For example, a server weighted '3' receives 3 times the number of new connections
            as a server weighted '1'.
            For more information on load balancing policies, see
            [How Load Balancing Policies Work](/Content/Balance/Reference/lbpolicies.htm).

            Example: `3`
          format: int32
          type: integer
      required:
        - backup
        - drain
        - ipAddress
        - name
        - offline
        - port
        - weight
      type: object
      x-example: |
        {
          "name": "example_backend",
          "ipAddress": "10.0.0.3",
          "port": 8080,
          "weight": 3,
          "maxConnections": 300,
          "backup": false,
          "drain": false,
          "offline": false
        }
