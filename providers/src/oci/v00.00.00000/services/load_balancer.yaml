    SessionPersistenceConfigurationDetails:
      description: |
        The configuration details for implementing session persistence based on a user-specified cookie name (application
        cookie stickiness).

        Session persistence enables the Load Balancing service to direct any number of requests that originate from a single
        logical client to a single backend web server. For more information, see
        [Session Persistence](/Content/Balance/Reference/sessionpersistence.htm).

        To disable application cookie stickiness on a running load balancer, use the
        [UpdateBackendSet](#/en/loadbalancer/20170115/BackendSet/UpdateBackendSet) operation and specify `null` for the
        `SessionPersistenceConfigurationDetails` object.

        Example: `SessionPersistenceConfigurationDetails: null`

        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.
      properties:
        cookieName:
          description: |
            The name of the cookie used to detect a session initiated by the backend server. Use '*' to specify
            that any cookie set by the backend causes the session to persist.

            Example: `example_cookie`
          maxLength: 4096
          minLength: 1
          type: string
        disableFallback:
          default: false
          description: |
            Whether the load balancer is prevented from directing traffic from a persistent session client to
            a different backend server if the original server is unavailable. Defaults to false.

            Example: `false`
          type: boolean
      required:
        - cookieName
      type: object
      x-example: |
        {
          "cookieName": "example_cookie",
          "disableFallback": false
        }
    SSLConfiguration:
      description: |
        A listener's SSL handling configuration.

        To use SSL, a listener must be associated with a [certificate bundle](#/en/loadbalancer/20170115/Certificate/).

        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.
      properties:
        certificateIds:
          description: |
            Ids for OCI certificates service certificates. Currently only a single Id may be passed.

            Example: `[ocid1.certificate.oc1.us-ashburn-1.amaaaaaaav3bgsaa5o2q7rh5nfmkkukfkogasqhk6af2opufhjlqg7m6jqzq]`
          example: 'true'
          items:
            maxLength: 255
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        certificateName:
          description: |
            A friendly name for the certificate bundle. It must be unique and it cannot be changed.
            Valid certificate bundle names include only alphanumeric characters, dashes, and underscores.
            Certificate bundle names cannot contain spaces. Avoid entering confidential information.

            Example: `example_certificate_bundle`
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9_.-]*$
          type: string
        cipherSuiteName:
          default: oci-default-ssl-cipher-suite-v1
          description: |
            The name of the cipher suite to use for HTTPS or SSL connections.

            If this field is not specified, the default is `oci-default-ssl-cipher-suite-v1`.

            **Notes:**

            *  You must ensure compatibility between the specified SSL protocols and the ciphers configured in the cipher
               suite. Clients cannot perform an SSL handshake if there is an incompatible configuration.
            *  You must ensure compatibility between the ciphers configured in the cipher suite and the configured
               certificates. For example, RSA-based ciphers require RSA certificates and ECDSA-based ciphers require ECDSA
               certificates.
            *  If the cipher configuration is not modified after load balancer creation, the `GET` operation returns
               `oci-default-ssl-cipher-suite-v1` as the value of this field in the SSL configuration for existing listeners
               that predate this feature.
            *  If the cipher configuration was modified using Oracle operations after load balancer creation, the `GET`
               operation returns `oci-customized-ssl-cipher-suite` as the value of this field in the SSL configuration for
               existing listeners that predate this feature.
            *  The `GET` operation returns `oci-wider-compatible-ssl-cipher-suite-v1` as the value of this field in the SSL
               configuration for existing backend sets that predate this feature.
            *  If the `GET` operation on a listener returns `oci-customized-ssl-cipher-suite` as the value of this field,
               you must specify an appropriate predefined or custom cipher suite name when updating the resource.
            *  The `oci-customized-ssl-cipher-suite` Oracle reserved cipher suite name is not accepted as valid input for
               this field.

            example: `example_cipher_suite`
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]*$
          type: string
        protocols:
          default: TLSv1.2
          description: |
            A list of SSL protocols the load balancer must support for HTTPS or SSL connections.

            The load balancer uses SSL protocols to establish a secure connection between a client and a server. A secure
            connection ensures that all data passed between the client and the server is private.

            The Load Balancing service supports the following protocols:

            *  TLSv1
            *  TLSv1.1
            *  TLSv1.2
            *  TLSv1.3

            If this field is not specified, TLSv1.2 is the default.

            **Warning:** All SSL listeners created on a given port must use the same set of SSL protocols.

            **Notes:**

            *  The handshake to establish an SSL connection fails if the client supports none of the specified protocols.
            *  You must ensure compatibility between the specified SSL protocols and the ciphers configured in the cipher
               suite.
            *  For all existing load balancer listeners and backend sets that predate this feature, the `GET` operation
               displays a list of SSL protocols currently used by those resources.

            example: `["TLSv1.1", "TLSv1.2"]`
          items:
            type: string
          type: array
        serverOrderPreference:
          default: ENABLED
          description: |
            When this attribute is set to ENABLED, the system gives preference to the server ciphers over the client
            ciphers.

            **Note:** This configuration is applicable only when the load balancer is acting as an SSL/HTTPS server. This
                      field is ignored when the `SSLConfiguration` object is associated with a backend set.
          enum:
            - ENABLED
            - DISABLED
          example: ENABLED
          type: string
        trustedCertificateAuthorityIds:
          description: |
            Ids for OCI certificates service CA or CA bundles for the load balancer to trust.

            Example: `[ocid1.cabundle.oc1.us-ashburn-1.amaaaaaaav3bgsaagl4zzyqdop5i2vuwoqewdvauuw34llqa74otq2jdsfyq]`
          example: 'true'
          items:
            maxLength: 255
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        verifyDepth:
          description: |
            The maximum depth for peer certificate chain verification.

            Example: `3`
          format: int32
          type: integer
        verifyPeerCertificate:
          default: false
          description: |
            Whether the load balancer listener should verify peer certificates.

            Example: `true`
          example: 'true'
          type: boolean
      required:
        - verifyDepth
        - verifyPeerCertificate
      type: object
      x-example: |
        [
          {
            "protocols": ["TLSv1.1", "TLSv1.2"],
            "cipherSuiteName" : "example_cipher_suite",
            "serverOrderPreference" : "ENABLED",
            "certificateName": "example_certificate_bundle",
            "verifyPeerCertificate": true
            "verifyDepth": 3,
          },
          {
            "certificateIds": [ "example_certificate_id" ],
            "trustedCertificateAuthorityIds": [ "example_certificate_authority_id", "example_certificate_bundle_id"]
            "verifyPeerCertificate": true
            "verifyDepth": 3,
          }
        ]
    BackendDetails:
      description: The load balancing configuration details of a backend server.
      properties:
        backup:
          default: false
          description: |
            Whether the load balancer should treat this server as a backup unit. If `true`, the load balancer forwards no ingress
            traffic to this backend server unless all other backend servers not marked as "backup" fail the health check policy.

            **Note:** You cannot add a backend server marked as `backup` to a backend set that uses the IP Hash policy.

            Example: `false`
          type: boolean
        drain:
          default: false
          description: |
            Whether the load balancer should drain this server. Servers marked "drain" receive no new
            incoming traffic.

            Example: `false`
          type: boolean
        ipAddress:
          description: |
            The IP address of the backend server.

            Example: `10.0.0.3`
          type: string
        maxConnections:
          description: |
            The maximum number of simultaneous connections the load balancer can make to the backend.
            If this is not set or set to 0 then the maximum number of simultaneous connections the
            load balancer can make to the backend is unlimited.

            If setting maxConnections to some value other than 0 then that value must be greater
            or equal to 256.

            Example: `300`
          format: int32
          maximum: 65535
          minimum: 0
          type: integer
        offline:
          default: false
          description: |
            Whether the load balancer should treat this server as offline. Offline servers receive no incoming
            traffic.

            Example: `false`
          type: boolean
        port:
          description: |
            The communication port for the backend server.

            Example: `8080`
          format: int32
          maximum: 65535
          minimum: 1
          type: integer
        weight:
          description: |
            The load balancing policy weight assigned to the server. Backend servers with a higher weight receive a larger
            proportion of incoming traffic. For example, a server weighted '3' receives 3 times the number of new connections
            as a server weighted '1'.
            For more information on load balancing policies, see
            [How Load Balancing Policies Work](/Content/Balance/Reference/lbpolicies.htm).

            Example: `3`
          format: int32
          type: integer
      required:
        - ipAddress
        - port
      type: object
      x-example: |
        {
          "ipAddress": "10.0.0.3",
          "port": 8080,
          "weight": 3,
          "maxConections": 300,
          "backup": false,
          "drain": false,
          "offline": false
        }
    HealthCheckerDetails:
      description: The health check policy's configuration details.
      properties:
        intervalInMillis:
          description: |
            The interval between health checks, in milliseconds.

            Example: `10000`
          format: int32
          maximum: 1800000
          minimum: 1000
          type: integer
        isForcePlainText:
          default: false
          description: |
            Specifies if health checks should always be done using plain text instead of depending on
            whether or not the associated backend set is using SSL.

            If "true", health checks will be done using plain text even if the associated backend set is configured
            to use SSL.

            If "false", health checks will be done using SSL encryption if the associated backend set is configured
            to use SSL. If the backend set is not so configured the health checks will be done using plain text.

            Example: `false`
          type: boolean
        port:
          description: |
            The backend server port against which to run the health check. If the port is not specified, the load balancer uses the
            port information from the `Backend` object.

            Example: `8080`
          format: int32
          maximum: 65535
          minimum: 0
          type: integer
        protocol:
          description: |
            The protocol the health check must use; either HTTP or TCP.

            Example: `HTTP`
          type: string
        responseBodyRegex:
          description: |
            A regular expression for parsing the response body from the backend server.

            Example: `^((?!false).|\s)*$`
          maxLength: 255
          type: string
        retries:
          description: |
            The number of retries to attempt before a backend server is considered "unhealthy". This number also applies
            when recovering a server to the "healthy" state.

            Example: `3`
          format: int32
          type: integer
        returnCode:
          description: |
            The status code a healthy backend server should return.

            Example: `200`
          format: int32
          type: integer
        timeoutInMillis:
          description: |
            The maximum time, in milliseconds, to wait for a reply to a health check. A health check is successful only if a reply
            returns within this timeout period.

            Example: `3000`
          format: int32
          maximum: 600000
          minimum: 1
          type: integer
        urlPath:
          description: |
            The path against which to run the health check.

            Example: `/healthcheck`
          maxLength: 1024
          type: string
      required:
        - protocol
      type: object
      x-example: |
        {
          "protocol": "HTTP",
          "urlPath": "/healthcheck",
          "port": 8080,
          "returnCode": 200,
          "retries": 3,
          "timeoutInMillis": 3000,
          "intervalInMillis": 10000,
          "responseBodyRegex": "^((?!false).|\s)*$"
        }
    SSLConfigurationDetails:
