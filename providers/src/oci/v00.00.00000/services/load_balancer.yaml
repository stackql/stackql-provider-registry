        - description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment containing the load balancers to list.
          in: query
          name: compartmentId
          required: true
          schema:
            type: string
        - description: |
            The level of detail to return for each result. Can be `full` or `simple`.

            Example: `full`
          in: query
          name: detail
          required: false
          schema:
            type: string
            default: full
        - $ref: '#/components/parameters/SortByQueryParam'
        - $ref: '#/components/parameters/SortOrderQueryParam'
        - $ref: '#/components/parameters/FilterByDisplayNameQueryParam'
        - $ref: '#/components/parameters/FilterByLifecycleStateQueryParam'
      responses:
