          name: page
          required: false
          schema:
            type: string
        - description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment containing the load balancers to return health status information for.
          in: query
          name: compartmentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The health status information was retrieved.
          headers:
            opc-next-page:
              description: |
                For list pagination. When this header appears in the response, additional pages
                of results remain. For important details about how pagination works, see
                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLoadBalancerHealthsResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
