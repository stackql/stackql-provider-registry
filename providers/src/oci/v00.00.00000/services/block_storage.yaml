            - INCREMENTAL
          type: string
      required:
        - bootVolumeId
      type: object
    UpdateBootVolumeBackupDetails:
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
