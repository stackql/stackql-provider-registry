    VolumeBackupSchedule:
      description: |
        Defines the backup frequency and retention period for a volume backup policy. For more information,
        see [Policy-Based Backups](/iaas/Content/Block/Tasks/schedulingvolumebackups.htm).
      properties:
        backupType:
          description: The type of volume backup to create.
          enum:
            - FULL
            - INCREMENTAL
          type: string
        dayOfMonth:
          description: The day of the month to schedule the volume backup.
          maximum: 31
          minimum: 1
          type: integer
        dayOfWeek:
          description: The day of the week to schedule the volume backup.
          enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          type: string
        hourOfDay:
          description: The hour of the day to schedule the volume backup.
          maximum: 23
          minimum: 0
          type: integer
        month:
          description: The month of the year to schedule the volume backup.
          enum:
            - JANUARY
            - FEBRUARY
            - MARCH
            - APRIL
            - MAY
            - JUNE
            - JULY
            - AUGUST
            - SEPTEMBER
            - OCTOBER
            - NOVEMBER
            - DECEMBER
          type: string
        offsetSeconds:
          description: |
            The number of seconds that the volume backup start
            time should be shifted from the default interval boundaries specified by
            the period. The volume backup start time is the frequency start time plus the offset.
          maximum: 31532400
          minimum: 0
          multipleOf: 3600
          type: integer
        offsetType:
          description: |
            Indicates how the offset is defined. If value is `STRUCTURED`,
            then `hourOfDay`, `dayOfWeek`, `dayOfMonth`, and `month` fields are used
            and `offsetSeconds` will be ignored in requests and users should ignore its
            value from the responses.

            `hourOfDay` is applicable for periods `ONE_DAY`,
            `ONE_WEEK`, `ONE_MONTH` and `ONE_YEAR`.

            `dayOfWeek` is applicable for period
            `ONE_WEEK`.

            `dayOfMonth` is applicable for periods `ONE_MONTH` and `ONE_YEAR`.

            'month' is applicable for period 'ONE_YEAR'.

            They will be ignored in the requests for inapplicable periods.

            If value is `NUMERIC_SECONDS`, then `offsetSeconds`
            will be used for both requests and responses and the structured fields will be
            ignored in the requests and users should ignore their values from the responses.

            For clients using older versions of Apis and not sending `offsetType` in their
            requests, the behaviour is just like `NUMERIC_SECONDS`.
          enum:
            - STRUCTURED
            - NUMERIC_SECONDS
          type: string
        period:
          description: The volume backup frequency.
          enum:
            - ONE_HOUR
            - ONE_DAY
            - ONE_WEEK
            - ONE_MONTH
            - ONE_YEAR
          type: string
        retentionSeconds:
          description: How long, in seconds, to keep the volume backups created by this schedule.
          maximum: 1576800000
          minimum: 3600
          multipleOf: 3600
          type: integer
        timeZone:
          default: UTC
          description: Specifies what time zone is the schedule in
          enum:
            - UTC
            - REGIONAL_DATA_CENTER_TIME
          type: string
      required:
        - period
        - backupType
        - retentionSeconds
      type: object
