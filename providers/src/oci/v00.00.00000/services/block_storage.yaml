components:
  schemas:
    BlockVolumeReplica:
      description: |
        An asynchronous replica of a block volume that can then be used to create
        a new block volume or recover a block volume. For more information, see [Overview
        of Cross-Region Volume Replication](/iaas/Content/Block/Concepts/volumereplication.htm)
        To use any of the API operations, you must be authorized in an IAM policy.
        If you're not authorized, talk to an administrator. If you're an administrator
        who needs to write policies to give users access, see [Getting Started with
        Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

        **Warning:** Oracle recommends that you avoid using any confidential information when you
        supply string values using the API.
      properties:
        availabilityDomain:
          description: |
            The availability domain of the block volume replica.

            Example: `Uocm:PHX-AD-1`
          maxLength: 255
          minLength: 1
          type: string
        blockVolumeId:
          description: The OCID of the source block volume.
          maxLength: 255
          minLength: 1
          type: string
        compartmentId:
          description: The OCID of the compartment that contains the block volume replica.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.

              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a
            namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        displayName:
          description: |
            A user-friendly name. Does not have to be unique, and it's changeable.
            Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags for this resource. Each tag is a simple key-value pair with no
            predefined name, type, or namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Department": "Finance"}`
          type: object
        id:
          description: The block volume replica's Oracle ID (OCID).
          maxLength: 255
          minLength: 1
          type: string
        lifecycleState:
          description: The current state of a block volume replica.
          enum:
            - PROVISIONING
            - AVAILABLE
            - ACTIVATING
            - TERMINATING
            - TERMINATED
            - FAULTY
          type: string
        sizeInGBs:
          description: |
            The size of the source block volume, in GBs.
          format: int64
          maximum: 16384
          minimum: 1
          type: integer
        timeCreated:
          description: |
            The date and time the block volume replica was created. Format defined
            by [RFC3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
        timeLastSynced:
          description: |
            The date and time the block volume replica was last synced from the source block volume.
            Format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
        totalDataTransferredInGBs:
          description: |
            The total size of the data transferred from the source block volume to the block volume replica, in GBs.
          format: int64
          type: integer
        volumeGroupReplicaId:
          description: |
            The OCID of the volume group replica.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - id
        - availabilityDomain
        - sizeInGBs
        - compartmentId
        - displayName
        - timeCreated
        - lifecycleState
        - timeLastSynced
        - blockVolumeId
      type: object
    BootVolumeBackup:
      description: |
        A point-in-time copy of a boot volume that can then be used to create
        a new boot volume or recover a boot volume. For more information, see [Overview
        of Boot Volume Backups](/iaas/Content/Block/Concepts/bootvolumebackups.htm)
        To use any of the API operations, you must be authorized in an IAM policy.
        If you're not authorized, talk to an administrator. If you're an administrator
        who needs to write policies to give users access, see [Getting Started with
        Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

        **Warning:** Oracle recommends that you avoid using any confidential information when you
        supply string values using the API.
      properties:
        bootVolumeId:
          description: The OCID of the boot volume.
          maxLength: 255
          minLength: 1
          type: string
        compartmentId:
          description: The OCID of the compartment that contains the boot volume backup.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
                 (opaque JSON object)
              type: string
            description: |
              Key-value pair representing a defined tag key and value, scoped to a namespace.

              Example: `{"CostCenter": "42"}`
            type: object
          description: |
            Defined tags for this resource. Each key is predefined and scoped to a
            namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Operations": {"CostCenter": "42"}}`
          type: object
        displayName:
          description: |
            A user-friendly name. Does not have to be unique, and it's changeable.
            Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        expirationTime:
          description: |
            The date and time the volume backup will expire and be automatically deleted.
            Format defined by [RFC3339](https://tools.ietf.org/html/rfc3339). This parameter will always be present for backups that
            were created automatically by a scheduled-backup policy. For manually created backups,
            it will be absent, signifying that there is no expiration time and the backup will
            last forever until manually deleted.
          format: date-time
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: |
            Free-form tags for this resource. Each tag is a simple key-value pair with no
            predefined name, type, or namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Department": "Finance"}`
          type: object
        id:
          description: The OCID of the boot volume backup.
          maxLength: 255
          minLength: 1
          type: string
        imageId:
          description: |
            The image OCID used to create the boot volume the backup is taken from.
          maxLength: 255
          minLength: 1
          type: string
        kmsKeyId:
          description: |
            The OCID of the Vault service master encryption assigned to the boot volume backup.
            For more information about the Vault service and encryption keys, see
            [Overview of Vault service](/iaas/Content/KeyManagement/Concepts/keyoverview.htm) and
            [Using Keys](/iaas/Content/KeyManagement/Tasks/usingkeys.htm).
          maxLength: 255
          minLength: 1
          type: string
        lifecycleState:
          description: The current state of a boot volume backup.
          enum:
            - CREATING
            - AVAILABLE
            - TERMINATING
            - TERMINATED
            - FAULTY
            - REQUEST_RECEIVED
          type: string
        sizeInGBs:
          description: |
            The size of the boot volume, in GBs.
          format: int64
          maximum: 16384
          minimum: 1
          type: integer
        sourceBootVolumeBackupId:
          description: The OCID of the source boot volume backup.
          maxLength: 255
          minLength: 1
          type: string
        sourceType:
          description: |
            Specifies whether the backup was created manually, or via scheduled backup policy.
          enum:
            - MANUAL
            - SCHEDULED
          type: string
        timeCreated:
          description: |
            The date and time the boot volume backup was created. This is the time the actual point-in-time image
            of the volume data was taken. Format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
        timeRequestReceived:
          description: |
            The date and time the request to create the boot volume backup was received. Format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).
          format: date-time
          type: string
        type:
          description: The type of a volume backup.
          enum:
            - FULL
            - INCREMENTAL
          type: string
        uniqueSizeInGBs:
          description: |
            The size used by the backup, in GBs. It is typically smaller than sizeInGBs, depending on the space
            consumed on the boot volume and whether the backup is full or incremental.
          format: int64
          maximum: 16384
          minimum: 0
          type: integer
      required:
        - id
        - displayName
        - compartmentId
        - timeCreated
        - lifecycleState
      type: object
    CreateBootVolumeBackupDetails:
      properties:
        bootVolumeId:
          description: The OCID of the boot volume that needs to be backed up.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: |-
                The value of the tag. Only the String type is supported.
