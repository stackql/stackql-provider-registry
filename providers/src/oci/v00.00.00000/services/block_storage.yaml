      description: |
        Creates a new boot volume backup of the specified boot volume. For general information about boot volume backups,
        see [Overview of Boot Volume Backups](/iaas/Content/Block/Concepts/bootvolumebackups.htm)

        When the request is received, the backup object is in a REQUEST_RECEIVED state.
        When the data is imaged, it goes into a CREATING state.
        After the backup is fully uploaded to the cloud, it goes into an AVAILABLE state.
      operationId: CreateBootVolumeBackup
      parameters:
        - $ref: '#/components/parameters/RetryTokenHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBootVolumeBackupDetails'
        description: Request to create a new backup of given boot volume.
        required: true
      responses:
        '200':
          description: The boot volume backup is being created.
          headers:
            etag:
              description: |
                For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
