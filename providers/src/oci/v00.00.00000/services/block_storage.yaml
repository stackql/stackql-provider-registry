            [Using Keys](/iaas/Content/KeyManagement/Tasks/usingkeys.htm).
          maxLength: 255
          minLength: 1
          type: string
      type: object
    ChangeBootVolumeBackupCompartmentDetails:
      description: Contains the details for the compartment to move the boot volume backup to.
      properties:
