        Returns the average carbon emissions summary by SKU.
      operationId: RequestAverageCarbonEmission
      parameters:
        - $ref: '#/components/parameters/SkuPathParam'
        - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        '200':
          description: The average carbon emissions summary.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: |
                Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AverageCarbonEmission'
