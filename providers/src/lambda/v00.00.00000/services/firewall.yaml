components:
  schemas:
    FirewallRule:
      type: object
      properties:
        protocol:
          $ref: '#/components/schemas/NetworkProtocol'
          description: The protocol to which the rule applies.
          example: tcp
        port_range:
          type: array
          items:
            type: integer
            maximum: 65535
            minimum: 1
          minItems: 2
          maxItems: 2
          description: |-
            An inclusive range of network ports specified as `[min, max]`.
            Not allowed for the `icmp` protocol but required for the others.

            To specify a single port, list it twice (for example, `[22,22]`).
          example:
            - 22
            - 22
        source_network:
          type: string
          format: ipv4network
          description: |-
            The set of source IPv4 addresses from which you want to allow inbound
            traffic. These addresses must be specified in CIDR notation. You can
            specify individual public IPv4 CIDR blocks such as `1.2.3.4` or
            `1.2.3.4/32`, or you can specify `0.0.0.0/0` to allow access from any
            address.

            This value is a string consisting of a public IPv4 address optionally
            followed by a slash (/) and an integer mask (the network prefix).
            If no mask is provided, the API assumes `/32` by default.
          example: 0.0.0.0/0
        description:
          type: string
          minLength: 0
          maxLength: 128
          description: A human-readable description of the rule.
          example: Allow SSH from anywhere
      required:
        - protocol
        - source_network
        - description
      title: FirewallRule
    ApiErrorUnauthorized:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/invalid-api-key
        message:
          type: string
          default: API key was invalid, expired, or deleted.
          description: A description of the error.
        suggestion:
          type: string
          default: Check your API key or create a new one, then try again.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorUnauthorized
    ApiErrorAccountInactive:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/account-inactive
        message:
          type: string
          default: Your account is inactive.
          description: A description of the error.
        suggestion:
          type: string
          default: Make sure you have verified your email address and have a valid payment method. Contact Support if problems continue.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorAccountInactive
      description: |-
        The account or identity is not in good standing to make the request.

        Your account is inactive or suspended, your identity is deactivated or has
        not verified its email, or your account is missing a payment method the
        endpoint requires.
    ApiErrorNotFound:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/not-found
        message:
          type: string
          default: The requested resource was not found.
          description: A description of the error.
        suggestion:
          type: string
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
      title: ApiErrorNotFound
      description: |-
        The resource does not exist, or the caller is not permitted to access it.

        If you believe the ID is correct, ask an account administrator whether or not
        you have been granted a role that permits the action.
    ApiErrorRateLimited:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/rate-limited
        message:
          type: string
          default: Too many requests. Retry after the interval given in the Retry-After response header.
          description: A description of the error.
        suggestion:
          type: string
          default: Wait for the interval in the Retry-After header, then retry the request. Reduce the rate of concurrent requests if this recurs.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
