openapi: 3.0.3
info:
  title: Filesystems
  description: Persistent filesystems that can be mounted on instances.
  version: 1.10.0
paths:
  /file-systems:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Filesystem'
                required:
                  - data
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorInvalidParameters'
                required:
                  - error
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorUnauthorized'
                required:
                  - error
                type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorAccountInactive'
                required:
                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - Filesystems
      summary: List filesystems (deprecated path)
      description: |-
        Retrieves a list of your filesystems.

        This path is deprecated in favor of `GET /api/v1/filesystems`, which is the spelling every other filesystem operation uses. The two return identical responses. This path is not scheduled for removal, so existing integrations keep working, but new ones should use `/api/v1/filesystems`.
      operationId: listFileSystemsDeprecated
      deprecated: true
  /filesystems:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Filesystem'
                required:
                  - data
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorInvalidParameters'
                required:
                  - error
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorUnauthorized'
                required:
                  - error
                type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorAccountInactive'
                required:
                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - Filesystems
      summary: List filesystems
      description: Retrieves a list of your filesystems.
      operationId: listFilesystems
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Filesystem'
                required:
                  - data
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The unique identifier for the type of error.
                        enum:
                          - global/duplicate
                      message:
                        type: string
                        description: A description of the error.
                      suggestion:
                        type: string
                        description: One or more suggestions of possible ways to fix the error.
                      request_id:
                        type: string
                        description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
                    required:
                      - code
                      - message
                      - suggestion
                    title: ApiErrorDuplicate
                required:
                  - error
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorUnauthorized'
                required:
                  - error
                type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The unique identifier for the type of error.
                        enum:
                          - global/account-inactive
                      message:
                        type: string
                        default: Your account is inactive.
                        description: A description of the error.
                      suggestion:
                        type: string
                        default: Make sure you have verified your email address and have a valid payment method. Contact Support if problems continue.
                        description: One or more suggestions of possible ways to fix the error.
                      request_id:
                        type: string
                        description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
                    required:
                      - code
                      - message
                      - suggestion
                    title: ApiErrorAccountInactive
                    description: |-
                      The account or identity is not in good standing to make the request.

                      Your account is inactive or suspended, your identity is deactivated or has
                      not verified its email, or your account is missing a payment method the
                      endpoint requires.
                required:
                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - Filesystems
      summary: Create filesystem
      description: Creates a new filesystem.
      operationId: createFilesystem
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                  pattern: ^[a-zA-Z]+[0-9a-zA-Z-]*$
                  description: The name of the filesystem.
                  example: my-filesystem
                region:
                  type: string
                  description: The region in which you want to create the filesystem.
                  example: us-west-1
              required:
                - name
                - region
              title: FilesystemCreateRequest
              type: object
        required: true
  /filesystems/{id}:
    delete:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/FilesystemDeleteResponse'
                required:
                  - data
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The unique identifier for the type of error.
                        enum:
                          - filesystems/filesystem-in-use
                      message:
                        type: string
                        description: A description of the error.
                      suggestion:
                        type: string
                        description: One or more suggestions of possible ways to fix the error.
                      request_id:
                        type: string
                        description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
                    required:
                      - code
                      - message
                    title: ApiErrorFilesystemInUse
                required:
                  - error
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorUnauthorized'
                required:
                  - error
                type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorAccountInactive'
                required:
                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorFilesystemNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - Filesystems
      summary: Delete filesystem
      description: Deletes the filesystem with the specified ID. The filesystem must not be mounted to any running instances at the time of deletion.
      operationId: filesystemDelete
      parameters:
        - name: id
          in: path
          description: The unique identifier (ID) of the filesystem to delete
          required: true
          schema:
            description: The unique identifier (ID) of the filesystem to delete
            type: string
            example: ddaedf1b7a0e41ac981711504493b242
          example: 398578a2336b49079e74043f0bd2cfe8
components:
  schemas:
    Filesystem:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier (ID) of the filesystem.
          example: 398578a2336b49079e74043f0bd2cfe8
        name:
          type: string
          description: The name of the filesystem.
          example: my-filesystem
        mount_point:
          type: string
          description: |-
            The DEFAULT absolute path indicating where on instances the filesystem will be mounted.
            If `file_system_mounts` were used at launch time, the actual mount point is in the
            instance response.
          example: /lambda/nfs/my-filesystem
        created:
          type: string
          format: date-time
          description: The date and time at which the filesystem was created. Formatted as an ISO 8601 timestamp.
        created_by:
          $ref: '#/components/schemas/User'
          description: The user in your Team that created the filesystem.
        is_in_use:
          type: boolean
          description: |-
            Whether the filesystem is currently mounted to an instance. Filesystems that
            are mounted cannot be deleted.
        region:
          $ref: '#/components/schemas/Region'
          description: The region in which the filesystem is deployed.
        bytes_used:
          type: integer
          description: |-
            The approximate amount of storage used by the filesystem in bytes. This estimate is
            updated every few hours.
      required:
        - id
        - name
        - mount_point
        - created
        - created_by
        - is_in_use
        - region
      title: Filesystem
      description: Information about a shared filesystem.
    ApiErrorInvalidParameters:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/invalid-parameters
        message:
          type: string
          default: Invalid request data.
          description: A description of the error.
        suggestion:
          type: string
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
      title: ApiErrorInvalidParameters
    ApiErrorUnauthorized:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/invalid-api-key
        message:
          type: string
          default: API key was invalid, expired, or deleted.
          description: A description of the error.
        suggestion:
          type: string
          default: Check your API key or create a new one, then try again.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorUnauthorized
    ApiErrorAccountInactive:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/account-inactive
        message:
          type: string
          default: Your account is inactive.
          description: A description of the error.
        suggestion:
          type: string
          default: Make sure you have verified your email address and have a valid payment method. Contact Support if problems continue.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorAccountInactive
      description: |-
        The account or identity is not in good standing to make the request.

        Your account is inactive or suspended, your identity is deactivated or has
        not verified its email, or your account is missing a payment method the
        endpoint requires.
    ApiErrorNotFound:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/not-found
        message:
          type: string
          default: The requested resource was not found.
          description: A description of the error.
        suggestion:
          type: string
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
      title: ApiErrorNotFound
      description: |-
        The resource does not exist, or the caller is not permitted to access it.

        If you believe the ID is correct, ask an account administrator whether or not
        you have been granted a role that permits the action.
    ApiErrorRateLimited:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/rate-limited
        message:
          type: string
          default: Too many requests. Retry after the interval given in the Retry-After response header.
          description: A description of the error.
        suggestion:
          type: string
          default: Wait for the interval in the Retry-After header, then retry the request. Reduce the rate of concurrent requests if this recurs.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorRateLimited
      description: |-
        The request was rate limited upstream and should be retried.

        Carries no detail about which limit was hit. The limit is enforced at the
        edge and is not part of the API contract, so naming it here would publish an
        implementation detail we intend to keep free to change.
    ApiErrorDuplicate:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/duplicate
        message:
          type: string
          description: A description of the error.
        suggestion:
          type: string
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
      title: ApiErrorDuplicate
    ApiErrorQuotaExceeded:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/quota-exceeded
        message:
          type: string
          default: Quota exceeded.
          description: A description of the error.
        suggestion:
          type: string
          default: Contact Support to increase your quota.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorQuotaExceeded
    ApiErrorInvalidBillingAddress:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/invalid-address
        message:
          type: string
          default: Your billing address is invalid.
          description: A description of the error.
        suggestion:
          type: string
          default: Make sure your billing address is valid. Contact Support if problems continue.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorInvalidBillingAddress
    FilesystemDeleteResponse:
      type: object
      properties:
        deleted_ids:
          type: array
          items:
            type: string
          description: The unique identifiers of the filesystems that were deleted.
          example:
            - 398578a2336b49079e74043f0bd2cfe8
      required:
        - deleted_ids
      title: FilesystemDeleteResponse
    ApiErrorFilesystemInUse:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - filesystems/filesystem-in-use
        message:
          type: string
          description: A description of the error.
        suggestion:
          type: string
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
      title: ApiErrorFilesystemInUse
    ApiErrorFilesystemNotFound:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/object-does-not-exist
        message:
          type: string
          default: Filesystem was not found.
          description: A description of the error.
        suggestion:
          type: string
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
      title: ApiErrorFilesystemNotFound
    User:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the user.
          example: 3da5a70a57a7422ea8a7203f98b2198b
        email:
          type: string
          description: The email address of the user.
          example: me@example.com
        status:
          $ref: '#/components/schemas/UserStatus'
          description: The status of the user's account.
      required:
        - id
        - email
        - status
      title: User
      description: Information about a user in your Team.
    Region:
      type: object
      properties:
        name:
          type: string
          description: The region code.
        description:
          type: string
          description: The region description.
      required:
        - name
        - description
      title: Region
    UserStatus:
      title: UserStatus
      description: Status of the user's account.
      enum:
        - active
        - deactivated
      type: string
  x-stackQL-resources:
    filesystems:
      id: lambda.filesystems.filesystems
      name: filesystems
      title: Filesystems
      methods:
        list:
          operation:
            $ref: '#/paths/~1filesystems/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1filesystems/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
        delete:
          operation:
            $ref: '#/paths/~1filesystems~1{id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/filesystems/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/filesystems/methods/create'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/filesystems/methods/delete'
        replace: []
servers:
  - url: https://cloud.lambda.ai/api/v1
