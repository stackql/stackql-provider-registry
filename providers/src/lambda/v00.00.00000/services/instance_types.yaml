openapi: 3.0.3
info:
  title: Instance Types
  description: Instance types offered on Lambda Cloud with their specifications, price in US cents per hour and the regions that have capacity at the time of the request.
  version: 1.10.0
paths:
  /instance-types:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/InstanceTypes'
                required:
                  - data
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorInvalidParameters'
                required:
                  - error
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorUnauthorized'
                required:
                  - error
                type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorAccountInactive'
                required:
                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - Instances
      summary: List available instance types
      description: |-
        Retrieves a list of the instance types currently offered on Lambda's public cloud, as well as details about each type. Details include resource specifications, pricing, and regional availability.

        Capacity is point-in-time: the regions reported are those with capacity at the moment of the request, and they change continuously.
      operationId: listInstanceTypes
components:
  schemas:
    InstanceTypes:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/InstanceTypesItem'
      title: InstanceTypes
      example:
        gpu_8x_example:
          instance_type:
            name: gpu_8x_example
            description: 8x Example GPU (40 GB SXM4)
            gpu_description: Example GPU (40 GB SXM4)
            price_cents_per_hour: 1592
            specs:
              vcpus: 124
              memory_gib: 1800
              storage_gib: 6144
              gpus: 8
            architecture: x86_64
          regions_with_capacity_available:
            - name: us-west-1
              description: California, USA
    ApiErrorInvalidParameters:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/invalid-parameters
        message:
          type: string
          default: Invalid request data.
          description: A description of the error.
        suggestion:
          type: string
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
      title: ApiErrorInvalidParameters
    ApiErrorUnauthorized:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/invalid-api-key
        message:
          type: string
          default: API key was invalid, expired, or deleted.
          description: A description of the error.
        suggestion:
          type: string
          default: Check your API key or create a new one, then try again.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorUnauthorized
    ApiErrorAccountInactive:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/account-inactive
        message:
          type: string
          default: Your account is inactive.
          description: A description of the error.
        suggestion:
          type: string
          default: Make sure you have verified your email address and have a valid payment method. Contact Support if problems continue.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorAccountInactive
      description: |-
        The account or identity is not in good standing to make the request.

        Your account is inactive or suspended, your identity is deactivated or has
        not verified its email, or your account is missing a payment method the
        endpoint requires.
    ApiErrorNotFound:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/not-found
        message:
          type: string
          default: The requested resource was not found.
          description: A description of the error.
        suggestion:
          type: string
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
      title: ApiErrorNotFound
      description: |-
        The resource does not exist, or the caller is not permitted to access it.

        If you believe the ID is correct, ask an account administrator whether or not
        you have been granted a role that permits the action.
    ApiErrorRateLimited:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/rate-limited
        message:
          type: string
          default: Too many requests. Retry after the interval given in the Retry-After response header.
          description: A description of the error.
        suggestion:
          type: string
          default: Wait for the interval in the Retry-After header, then retry the request. Reduce the rate of concurrent requests if this recurs.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorRateLimited
      description: |-
        The request was rate limited upstream and should be retried.

        Carries no detail about which limit was hit. The limit is enforced at the
        edge and is not part of the API contract, so naming it here would publish an
        implementation detail we intend to keep free to change.
    InstanceTypesItem:
      type: object
      properties:
        instance_type:
          $ref: '#/components/schemas/InstanceType'
          description: The description, technical specifications, and metadata for this instance type.
        regions_with_capacity_available:
          type: array
          items:
            $ref: '#/components/schemas/Region'
          description: A list of the regions in which this instance type is available.
      required:
        - instance_type
        - regions_with_capacity_available
      title: InstanceTypesItem
      description: Detailed information and regional availability for the instance type.
    InstanceType:
      type: object
      properties:
        name:
          type: string
          description: The name of the instance type.
          example: gpu_8x_h100_sxm5gdr
        description:
          type: string
          description: A description of the instance type.
          example: 8x H100 (80 GB SXM5)
        gpu_description:
          type: string
          description: The type of GPU used by this instance type.
          example: H100 (80 GB SXM5)
        price_cents_per_hour:
          type: integer
          description: The price of the instance type in US cents per hour.
          example: 3592
        specs:
          $ref: '#/components/schemas/InstanceTypeSpecs'
          description: Detailed technical specifications for the instance type.
        architecture:
          $ref: '#/components/schemas/InstanceTypeArchitecture'
          description: The CPU architecture of the instance type.
          example: x86_64
      required:
        - name
        - description
        - gpu_description
        - price_cents_per_hour
        - specs
        - architecture
      title: InstanceType
    Region:
      type: object
      properties:
        name:
          type: string
          description: The region code.
        description:
          type: string
          description: The region description.
      required:
        - name
        - description
      title: Region
    InstanceTypeSpecs:
      type: object
      properties:
        vcpus:
          type: integer
          description: The number of virtual CPUs.
          example: 208
        memory_gib:
          type: integer
          description: The amount of RAM in gibibytes (GiB).
          example: 1800
        storage_gib:
          type: integer
          description: The amount of storage in gibibytes (GiB).
          example: 24780
        gpus:
          type: integer
          description: The number of GPUs.
          example: 8
      required:
        - vcpus
        - memory_gib
        - storage_gib
        - gpus
      title: InstanceTypeSpecs
    InstanceTypeArchitecture:
      title: InstanceTypeArchitecture
      description: CPU architecture of an instance type.
      enum:
        - x86_64
        - arm64
      type: string
    InstanceTypeRows:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            description: An instance type with its specifications, price and the regions that have capacity.
            properties:
              name:
                type: string
                description: The name of the instance type.
                example: gpu_8x_h100_sxm5gdr
              description:
                type: string
                description: A description of the instance type.
                example: 8x H100 (80 GB SXM5)
              gpu_description:
                type: string
                description: The type of GPU used by this instance type.
                example: H100 (80 GB SXM5)
              price_cents_per_hour:
                type: integer
                description: The price of the instance type in US cents per hour.
                example: 3592
              architecture:
                description: The CPU architecture of the instance type.
                enum:
                  - x86_64
                  - arm64
                type: string
              vcpus:
                type: integer
                description: The number of virtual CPUs.
                example: 208
              memory_gib:
                type: integer
                description: The amount of RAM in gibibytes (GiB).
                example: 1800
              storage_gib:
                type: integer
                description: The amount of storage in gibibytes (GiB).
                example: 24780
              gpus:
                type: integer
                description: The number of GPUs.
                example: 8
              regions_with_capacity_available:
                type: array
                description: 'The regions in which this instance type has capacity (name, description). Empty when there is none. Capacity is point-in-time: the regions reported are those with capacity at the moment of the request, and they change continuously.'
                items:
                  $ref: '#/components/schemas/Region'
    RegionalCapacityRows:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            description: An instance type and one region in which it has capacity.
            properties:
              region_name:
                type: string
                description: The code of a region in which the instance type has capacity.
              region_description:
                type: string
                description: The location represented by the region code.
              name:
                type: string
                description: The name of the instance type.
                example: gpu_8x_h100_sxm5gdr
              description:
                type: string
                description: A description of the instance type.
                example: 8x H100 (80 GB SXM5)
              gpu_description:
                type: string
                description: The type of GPU used by this instance type.
                example: H100 (80 GB SXM5)
              price_cents_per_hour:
                type: integer
                description: The price of the instance type in US cents per hour.
                example: 3592
              architecture:
                description: The CPU architecture of the instance type.
                enum:
                  - x86_64
                  - arm64
                type: string
              vcpus:
                type: integer
                description: The number of virtual CPUs.
                example: 208
              memory_gib:
                type: integer
                description: The amount of RAM in gibibytes (GiB).
                example: 1800
              storage_gib:
                type: integer
                description: The amount of storage in gibibytes (GiB).
                example: 24780
              gpus:
                type: integer
                description: The number of GPUs.
                example: 8
  x-stackQL-resources:
    instance_types:
      id: lambda.instance_types.instance_types
      name: instance_types
      title: Instance Types
      methods:
        list:
          operation:
            $ref: '#/paths/~1instance-types/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            overrideMediaType: application/json
            objectKey: $.data
            schema_override:
              $ref: '#/components/schemas/InstanceTypeRows'
            transform:
              type: golang_template_json_v0.3.0
              body: '{"data":[{{- $sep := separator "," -}}{{- range $key, $item := index . "data" -}}{{- $t := index $item "instance_type" -}}{{- $s := index $t "specs" -}}{{ call $sep }}{"name":{{ toJson (index $t "name") }},"description":{{ toJson (index $t "description") }},"gpu_description":{{ toJson (index $t "gpu_description") }},"price_cents_per_hour":{{ toJson (index $t "price_cents_per_hour") }},"architecture":{{ toJson (index $t "architecture") }},"vcpus":{{ toJson (index $s "vcpus") }},"memory_gib":{{ toJson (index $s "memory_gib") }},"storage_gib":{{ toJson (index $s "storage_gib") }},"gpus":{{ toJson (index $s "gpus") }},"regions_with_capacity_available":{{ toJson (index $item "regions_with_capacity_available") }}}{{- end -}}]}'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/instance_types/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    regional_capacity:
      id: lambda.instance_types.regional_capacity
      name: regional_capacity
      title: Regional Capacity
      methods:
        list:
          operation:
            $ref: '#/paths/~1instance-types/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            overrideMediaType: application/json
            objectKey: $.data
            schema_override:
              $ref: '#/components/schemas/RegionalCapacityRows'
            transform:
              type: golang_template_json_v0.3.0
              body: '{"data":[{{- $sep := separator "," -}}{{- range $key, $item := index . "data" -}}{{- $t := index $item "instance_type" -}}{{- $s := index $t "specs" -}}{{- range $r := index $item "regions_with_capacity_available" -}}{{ call $sep }}{"region_name":{{ toJson (index $r "name") }},"region_description":{{ toJson (index $r "description") }},"name":{{ toJson (index $t "name") }},"description":{{ toJson (index $t "description") }},"gpu_description":{{ toJson (index $t "gpu_description") }},"price_cents_per_hour":{{ toJson (index $t "price_cents_per_hour") }},"architecture":{{ toJson (index $t "architecture") }},"vcpus":{{ toJson (index $s "vcpus") }},"memory_gib":{{ toJson (index $s "memory_gib") }},"storage_gib":{{ toJson (index $s "storage_gib") }},"gpus":{{ toJson (index $s "gpus") }}}{{- end -}}{{- end -}}]}'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/regional_capacity/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://cloud.lambda.ai/api/v1
