openapi: 3.0.3
info:
  title: Audit Events
  description: Audit events recorded for the account.
  version: 1.10.0
paths:
  /audit-events:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  page_token:
                    description: Provide this token in your next request to retrieve the next page of results. If there are no additional pages, this field has a null value.
                    nullable: true
                    type: string
                    example: eyJuZXh0IjoxNzA0MTk2ODAwfQ==
                required:
                  - data
                  - page_token
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorInvalidParameters'
                required:
                  - error
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorUnauthorized'
                required:
                  - error
                type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorAccountInactive'
                required:
                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - Audit Events
      summary: Get audit events
      description: Retrieves a list of audit events that have occurred in your account. To view the full catalog of possible audit events, visit [Access and security > Audit logs](https://docs.lambda.ai/public-cloud/access-security#audit-logs) in the Lambda Cloud documentation.
      operationId: getAuditEvents
      parameters:
        - name: start
          in: query
          description: An ISO 8601 timestamp defining the start of the time range to query, inclusive. If omitted, the response starts at the earliest available event.
          required: false
          schema:
            description: An ISO 8601 timestamp defining the start of the time range to query, inclusive. If omitted, the response starts at the earliest available event.
            format: date-time
            type: string
            example: '2025-09-01T10:30:45.123456Z'
          example: '2025-09-01T10:30:45.123456Z'
        - name: end
          in: query
          description: An ISO 8601 timestamp defining the end of the time range to query, inclusive. If omitted, the response ends at the most recent event.
          required: false
          schema:
            description: An ISO 8601 timestamp defining the end of the time range to query, inclusive. If omitted, the response ends at the most recent event.
            format: date-time
            type: string
            example: '2025-09-15T10:30:45.123456Z'
          example: '2025-09-15T10:30:45.123456Z'
        - name: page_token
          in: query
          description: The token returned by the previous API response to retrieve the next page of results.
          required: false
          schema:
            description: The token returned by the previous API response to retrieve the next page of results.
            type: string
            example: abCdEFg0h1I2jKlm34n5O6Pq78r=
          example: abCdEFg0h1I2jKlm34n5O6Pq78r=
        - name: resource_type
          in: query
          description: The resource type to filter by. By default, all available resource types are retrieved.
          required: false
          schema:
            description: The resource type to filter by. By default, all available resource types are retrieved.
            type: string
            example: cloud.api_key
          example: cloud.api_key
components:
  schemas:
    AuditEvent:
      type: object
      properties:
        service_name:
          type: string
          description: The service in which the action was performed.
          example: cloud
        resource_name:
          type: string
          description: The type of resource that was affected.
          example: api_key
        action:
          type: string
          description: The action that was performed.
          example: created
        catalog_version:
          type: string
          description: The version of the event catalog schema.
          example: '2025-09-06'
        event_id:
          type: string
          description: The unique identifier (ID) for this audit event.
          example: 0123456789abcdef0123456789abcdef
        event_time:
          type: string
          description: The UTC timestamp for when the event occurred (ISO 8601 format).
          example: '2025-09-15T10:30:45.123456Z'
        actor_lrn:
          description: The Lambda Resource Name (LRN) of the actor who performed the action. This is the stable identifier for the actor; emails and display names can change or be reassigned over time.
          nullable: true
          type: string
          example: lrn:cloud:identity:00112233445566778899aabbccddeeff
        actor_email:
          description: The email address of the actor, resolved at read time from the actor's identity. Reflects the current email, not the email at the time of the event. `null` for service identities (which have no email), system-generated events, and actors that no longer resolve to an identity in this account.
          nullable: true
          type: string
          example: alice@example.com
        actor_display_name:
          description: 'A human-readable name for the actor, resolved at read time: the user''s full name, or the display name of a service identity. `null` when unavailable or when the actor no longer resolves to an identity in this account.'
          nullable: true
          type: string
          example: Alice Example
        resource_lrns:
          type: array
          items:
            type: string
          description: The Lambda Resource Names (LRNs) of the resources affected by this action.
          example:
            - lrn:cloud:api_key:ffeeddccbbaa99887766554433221100
        resource_owner_lrn:
          description: The Lambda Resource Name (LRN) of the account that owns the affected resources.
          nullable: true
          type: string
          example: lrn:cloud:account:fedcba9876543210fedcba9876543210
        request_api_key_lrn:
          description: The Lambda Resource Name (LRN) of the API key used to authenticate the request, if applicable.
          nullable: true
          type: string
          example: lrn:cloud:api_key:0f1e2d3c4b5a69788796a5b4c3d2e1f0
        workspace_lrn:
          description: The Lambda Resource Name (LRN) of the workspace the affected resources belong to, if applicable.
          nullable: true
          type: string
          example: lrn:cloud:workspace:abcdef0123456789abcdef0123456789
        client_ip:
          description: The IP address the request originated from. Shows `lambda-internal` for actions performed by Lambda staff. `null` for system-generated events and events recorded before this field was introduced.
          nullable: true
          type: string
          example: 203.0.113.42
        client_user_agent:
          description: The User-Agent header supplied by the client that made the request. This value is client-controlled and informational only. `null` for system-generated events and events recorded before this field was introduced.
          nullable: true
          type: string
          example: curl/8.5.0
        surface:
          description: 'The surface the request came through: `console` (logged-in browser session), `api` (API key), or `system` (generated by Lambda systems without a request). `null` when the surface could not be determined (for example, unauthenticated requests) and for events recorded before this field was introduced.'
          nullable: true
          type: string
          example: console
        result:
          description: The result of the audited action, including its status and the HTTP status code when the action originated from an API request. `null` for events recorded before this field was introduced.
          nullable: true
          $ref: '#/components/schemas/AuditResult'
          example:
            status: success
            status_code: 200
        additional_details:
          type: object
          additionalProperties: true
          description: Additional event-specific details. The exact keys returned vary by event type.
          properties: {}
          example:
            api_key_lrn: lrn:cloud:api_key:ffeeddccbbaa99887766554433221100
      required:
        - service_name
        - resource_name
        - action
        - catalog_version
        - event_id
        - event_time
        - actor_lrn
        - actor_email
        - actor_display_name
        - resource_lrns
        - resource_owner_lrn
        - request_api_key_lrn
        - workspace_lrn
        - client_ip
        - client_user_agent
        - surface
        - result
        - additional_details
      title: AuditEvent
      description: |-
        Audit event in the account's audit log. To view the full catalog of
        possible audit events, visit
        [Access and security > Audit logs](https://docs.lambda.ai/public-cloud/access-security#audit-logs)
        in the Lambda Cloud documentation.
    ApiErrorInvalidParameters:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/invalid-parameters
        message:
          type: string
          default: Invalid request data.
          description: A description of the error.
        suggestion:
          type: string
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
      title: ApiErrorInvalidParameters
    ApiErrorUnauthorized:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/invalid-api-key
        message:
          type: string
          default: API key was invalid, expired, or deleted.
          description: A description of the error.
        suggestion:
          type: string
          default: Check your API key or create a new one, then try again.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorUnauthorized
    ApiErrorAccountInactive:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/account-inactive
        message:
          type: string
          default: Your account is inactive.
          description: A description of the error.
        suggestion:
          type: string
          default: Make sure you have verified your email address and have a valid payment method. Contact Support if problems continue.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorAccountInactive
      description: |-
        The account or identity is not in good standing to make the request.

        Your account is inactive or suspended, your identity is deactivated or has
        not verified its email, or your account is missing a payment method the
        endpoint requires.
    ApiErrorNotFound:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/not-found
        message:
          type: string
          default: The requested resource was not found.
          description: A description of the error.
        suggestion:
          type: string
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
      title: ApiErrorNotFound
      description: |-
        The resource does not exist, or the caller is not permitted to access it.

        If you believe the ID is correct, ask an account administrator whether or not
        you have been granted a role that permits the action.
    ApiErrorRateLimited:
      type: object
      properties:
        code:
          type: string
          description: The unique identifier for the type of error.
          enum:
            - global/rate-limited
        message:
          type: string
          default: Too many requests. Retry after the interval given in the Retry-After response header.
          description: A description of the error.
        suggestion:
          type: string
          default: Wait for the interval in the Retry-After header, then retry the request. Reduce the rate of concurrent requests if this recurs.
          description: One or more suggestions of possible ways to fix the error.
        request_id:
          type: string
          description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
      required:
        - code
        - message
        - suggestion
      title: ApiErrorRateLimited
      description: |-
        The request was rate limited upstream and should be retried.

        Carries no detail about which limit was hit. The limit is enforced at the
        edge and is not part of the API contract, so naming it here would publish an
        implementation detail we intend to keep free to change.
    AuditResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResultStatus'
        status_code:
          nullable: true
          type: integer
      required:
        - status
      title: AuditResult
      description: The result of an audited action.
    ResultStatus:
      title: ResultStatus
      description: The result of an audited action, open to future status values.
      enum:
        - success
        - failure
      type: string
      x-speakeasy-unknown-values: allow
  x-stackQL-resources:
    audit_events:
      id: lambda.audit.audit_events
      name: audit_events
      title: Audit Events
      methods:
        list:
          operation:
            $ref: '#/paths/~1audit-events/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/audit_events/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://cloud.lambda.ai/api/v1
x-stackQL-config:
  pagination:
    requestToken:
      key: page_token
      location: query
    responseToken:
      key: $.page_token
      location: body
