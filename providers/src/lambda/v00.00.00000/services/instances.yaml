openapi: 3.0.3
info:
  title: Instances
  description: 'On-demand instances: inventory, launch, update, restart and terminate.'
  version: 1.10.0
paths:
  /instance-operations/launch:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/InstanceLaunchResponse'
                required:
                  - data
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The unique identifier for the type of error.
                        enum:
                          - instance-operations/launch/file-system-in-wrong-region
                      message:
                        type: string
                        description: A description of the error.
                      suggestion:
                        type: string
                        description: One or more suggestions of possible ways to fix the error.
                      request_id:
                        type: string
                        description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
                    required:
                      - code
                      - message
                      - suggestion
                    title: ApiErrorFileSystemInWrongRegion
                required:
                  - error
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorUnauthorized'
                required:
                  - error
                type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The unique identifier for the type of error.
                        enum:
                          - global/account-inactive
                      message:
                        type: string
                        default: Your account is inactive.
                        description: A description of the error.
                      suggestion:
                        type: string
                        default: Make sure you have verified your email address and have a valid payment method. Contact Support if problems continue.
                        description: One or more suggestions of possible ways to fix the error.
                      request_id:
                        type: string
                        description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
                    required:
                      - code
                      - message
                      - suggestion
                    title: ApiErrorAccountInactive
                    description: |-
                      The account or identity is not in good standing to make the request.

                      Your account is inactive or suspended, your identity is deactivated or has
                      not verified its email, or your account is missing a payment method the
                      endpoint requires.
                required:
                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorLaunchResourceNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - Instances
      summary: Launch instances
      description: |-
        Launches a Lambda On-Demand Cloud instance.

        Returns an `instance_ids` array. The API launches one instance per request; launch requests are limited to one per 12 seconds.
      operationId: launchInstance
      requestBody:
        content:
          application/json:
            schema:
              properties:
                region_name:
                  type: string
                  description: The region into which you want to launch the instance.
                instance_type_name:
                  type: string
                  description: |-
                    The type of instance you want to launch. To retrieve a list of available instance types, see
                    [List available instance types](#listInstanceTypes).
                  example: gpu_8x_a100
                ssh_key_names:
                  type: array
                  items:
                    type: string
                  description: |-
                    The names of the SSH keys you want to use to provide access to the instance.
                    Currently, exactly one SSH key must be specified.
                  example:
                    - my-public-key
                file_system_names:
                  type: array
                  items:
                    type: string
                  description: |-
                    The names of the filesystems you want to mount to the instance. When specified
                    alongside `file_system_mounts`, any filesystems referred to in both lists will use the
                    mount path specified in `file_system_mounts`, rather than the default.
                  example:
                    - my-filesystem
                file_system_mounts:
                  type: array
                  items:
                    $ref: '#/components/schemas/RequestedFilesystemMountEntry'
                  description: |-
                    The filesystem mounts to mount to the instance. When specified alongside
                    `file_system_names`, any filesystems referred to in both lists will use the
                    mount path specified in `file_system_mounts`, rather than the default.
                hostname:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9][0-9a-z-]{0,62}$
                  description: |-
                    The hostname to assign to the instance. If not specified, a default, IP-address-based
                    hostname is assigned. This hostname is driven into /etc/hostname on the instance.
                  example: headnode1
                name:
                  type: string
                  minLength: 0
                  maxLength: 64
                  description: The name you want to assign to your instance. Must be 64 characters or fewer.
                  example: My Instance
                image:
                  description: The machine image you want to use. Defaults to the latest Lambda Stack image.
                  type: object
                  properties:
                    id:
                      type: string
                      example: ddaedf1b7a0e41ac981711504493b242
                    family:
                      type: string
                      description: The family name of the image.
                  required:
                    - id
                    - family
                  title: ImageSpecificationID
                user_data:
                  type: string
                  writeOnly: true
                  format: password
                  description: |-
                    An instance configuration string specified in a valid
                    [cloud-init user-data](https://cloudinit.readthedocs.io/en/latest/explanation/format.html)
                    format. You can use this field to configure your instance on launch. The
                    user data string must be plain text and cannot exceed 1MB in size.
                  example: |
                    #cloud-config
                    runcmd:
                      - echo "Hello, World" > /tmp/hello.txt
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/RequestedTagEntry'
                  description: Key/value pairs representing the instance's tags.
                firewall_rulesets:
                  type: array
                  items:
                    $ref: '#/components/schemas/FirewallRulesetEntry'
                  description: |-
                    The firewall rulesets to associate with the instance.
                    The firewall rulesets must exist in the same region as the instance.
              required:
                - region_name
                - instance_type_name
                - ssh_key_names
              title: InstanceLaunchRequest
              type: object
        required: true
