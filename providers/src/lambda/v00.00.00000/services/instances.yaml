  x-stackQL-resources:
    instances:
      id: lambda.instances.instances
      name: instances
      title: Instances
      methods:
        launch:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1instance-operations~1launch/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
        restart:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1instance-operations~1restart/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.restarted_instances
        terminate:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1instance-operations~1terminate/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.terminated_instances
        list:
          operation:
            $ref: '#/paths/~1instances/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
        get:
          operation:
            $ref: '#/paths/~1instances~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1instances~1{id}/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/instances/methods/get'
          - $ref: '#/components/x-stackQL-resources/instances/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/instances/methods/launch'
        update:
          - $ref: '#/components/x-stackQL-resources/instances/methods/update'
        delete: []
        replace: []
    vw_instance_costs:
      name: vw_instance_costs
      id: lambda.instances.vw_instance_costs
      title: Instance Costs
      config:
        docs:
          description: 'The running-instance estate with its cost, one row per instance: the nested region and instance_type objects of the instances resource flattened to columns, the instance type''s price in US cents per hour and in USD per hour and per day, and the hours since the instance first became healthy (the moment Lambda starts billing it; null while booting). The forgot-to-terminate report is SELECT * FROM lambda.instances.vw_instance_costs ORDER BY usd_per_hour DESC.'
          fields:
            - name: id
              type: string
              description: The unique identifier (ID) of the instance.
            - name: name
              type: string
              description: The name of the instance.
            - name: status
              type: string
              description: The current status of the instance (booting, active, unhealthy, terminating, terminated or preempted).
            - name: region
              type: string
              description: The name of the region the instance is deployed in.
            - name: instance_type
              type: string
              description: The name of the instance type.
            - name: gpu_description
              type: string
              description: The type of GPU used by the instance type.
            - name: gpus
              type: integer
              description: The number of GPUs.
            - name: price_cents_per_hour
              type: integer
              description: The price of the instance type in US cents per hour.
            - name: usd_per_hour
              type: number
              description: The price of the instance type in USD per hour.
            - name: usd_per_day
              type: number
              description: The price of the instance type in USD per 24 hours.
            - name: first_healthy
              type: string
              description: When the instance first became healthy (billing starts), or null if it never has.
            - name: hours_running
              type: number
              description: Hours since first_healthy, to one decimal place; null while the instance is booting.
            - name: ip
              type: string
              description: The public IPv4 address of the instance.
            - name: ssh_key_names
              type: array
              description: The names of the SSH keys that are allowed to access the instance (JSON array).
        views:
          select:
            predicate: sqlDialect == "sqlite3"
            ddl: |-
              SELECT id,
                     name,
                     status,
                     json_extract(region, '$.name') AS region,
                     json_extract(instance_type, '$.name') AS instance_type,
                     json_extract(instance_type, '$.gpu_description') AS gpu_description,
                     json_extract(instance_type, '$.specs.gpus') AS gpus,
                     json_extract(instance_type, '$.price_cents_per_hour') AS price_cents_per_hour,
                     json_extract(instance_type, '$.price_cents_per_hour') / 100.0 AS usd_per_hour,
                     json_extract(instance_type, '$.price_cents_per_hour') * 24 / 100.0 AS usd_per_day,
                     first_healthy,
                     ROUND((julianday('now') - julianday(first_healthy)) * 24, 1) AS hours_running,
                     ip,
                     ssh_key_names
              FROM lambda.instances.instances
            fallback:
              predicate: sqlDialect == "postgres"
              ddl: |-
                SELECT id,
                       name,
                       status,
                       region::jsonb->>'name' AS region,
                       instance_type::jsonb->>'name' AS instance_type,
                       instance_type::jsonb->>'gpu_description' AS gpu_description,
                       (instance_type::jsonb->'specs'->>'gpus')::int AS gpus,
                       (instance_type::jsonb->>'price_cents_per_hour')::int AS price_cents_per_hour,
                       (instance_type::jsonb->>'price_cents_per_hour')::numeric / 100.0 AS usd_per_hour,
                       (instance_type::jsonb->>'price_cents_per_hour')::numeric * 24 / 100.0 AS usd_per_day,
                       first_healthy,
                       ROUND(EXTRACT(EPOCH FROM (now() - first_healthy::timestamptz)) / 3600, 1) AS hours_running,
                       ip,
                       ssh_key_names
                FROM lambda.instances.instances
servers:
  - url: https://cloud.lambda.ai/api/v1
x-stackQL-config:
  pagination:
    requestToken:
      key: page_token
      location: query
    responseToken:
      key: $.page_token
      location: body
