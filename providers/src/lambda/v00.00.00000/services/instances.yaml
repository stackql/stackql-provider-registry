      summary: List running instances
      description: |-
        Retrieves a list of your running instances.

        Pagination is opt-in. If you send neither `page_size` nor `page_token`, the response contains every instance, oldest first, and `page_token` is null. If you send either, results are paged newest first, `page_size` (default 50) per page; pass the returned `page_token` to get the next page.
      operationId: listInstances
      parameters:
        - name: page_size
          in: query
          description: Maximum number of results per page (1-100, default 50).
          required: false
          schema:
            description: Maximum number of results per page (1-100, default 50).
            ge: 1
            le: 100
            type: integer
            example: 50
          example: 50
        - name: page_token
          in: query
          description: A page token for cursor-based pagination.
          required: false
          schema:
            description: A page token for cursor-based pagination.
            type: string
            example: abCdEFg0h1I2jKlm34n5O6Pq78r=
          example: abCdEFg0h1I2jKlm34n5O6Pq78r=
        - name: cluster_id
          in: query
          description: |-
            If provided, the resulting list will only include
            instances that are part of a cluster with this unique identifier (ID).
          required: false
          schema:
            description: |-
              If provided, the resulting list will only include
              instances that are part of a cluster with this unique identifier (ID).
            type: string
            example: ddaedf1b7a0e41ac981711504493b242
          example: ddaedf1b7a0e41ac981711504493b242
