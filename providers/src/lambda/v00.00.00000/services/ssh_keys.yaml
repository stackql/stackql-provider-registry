                type: object
      tags:
        - SSH keys
      summary: List your SSH keys
      description: Retrieves a list of your SSH keys.
      operationId: listSSHKeys
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The unique identifier (ID) of the SSH key.
                        example: ddf9a910ceb744a0bb95242cbba6cb50
                      name:
                        type: string
                        minLength: 1
                        maxLength: 64
                        description: The name of the SSH key.
                        example: my-public-key
                      public_key:
                        type: string
                        minLength: 1
                        maxLength: 4096
                        description: The public key for the SSH key.
                        example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICN+lJwsONkwrdsSnQsu1ydUkIuIg5oOC+Eslvmtt60T noname
                      private_key:
                        type: string
                        description: |-
                          The private key generated in the SSH key pair. Store this value locally;
                          Lambda does not retain the private key server-side.
                        example: '-----BEGIN RSA PRIVATE KEY-----\n...\n-----END RSA PRIVATE KEY-----\n'
                    required:
                      - id
                      - name
                      - public_key
                      - private_key
                    title: GeneratedSSHKey
                    description: Information about a server-generated SSH key.
                required:
                  - data
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorInvalidParameters'
                required:
                  - error
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorUnauthorized'
                required:
                  - error
                type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorAccountInactive'
                required:
                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - SSH keys
      summary: Add an SSH key
      description: |-
        Add an SSH key to your Lambda Cloud account. You can upload an existing public
        key, or you can generate a new key pair.

        -  To use an existing key pair, set the `public_key` property in the request body
           to your public key.

        -  To generate a new key pair, omit the `public_key` property from the request
           body.

        **Important:** Lambda doesn't store your private key after it's been generated. If you generate a new key pair, make sure to save the resulting private key locally.

        For example, to generate a new key pair and associate it with a Lambda
        On-Demand Cloud instance:

        1. Generate the key pair. The command provided below automatically extracts and
            saves the returned private key to a new file called `key.pem`. Replace
            `<NEW-KEY-NAME>` with the name you want to assign to the SSH key:

            ```bash
            curl --request POST --url 'https://cloud.lambda.ai/api/v1/ssh-keys' \
            --fail \
            --header "Authorization: Bearer ${LAMBDA_API_KEY}" \
            --data '{"name": "<NEW-KEY-NAME>"}' \
            | jq -r '.data.private_key' > key.pem
            ```

        2. Next, set the private key's permissions to read-only:

            ```bash
            chmod 400 key.pem
            ```

        3. Launch a new instance. Replace `<NEW-KEY-NAME>` with the name you assigned
           to your SSH key.

            ```bash
            curl --request POST 'https://cloud.lambda.ai/api/v1/instance-operations/launch' \
            --fail \
            --header "Authorization: Bearer ${LAMBDA_API_KEY}" \
            --data '{"region_name":"us-west-1","instance_type_name":"gpu_1x_a10","ssh_key_names":["<NEW-KEY-NAME>"],"file_system_names":[],"quantity":1,"name":"My Instance"}'
            ```

        4. From your local terminal, establish an SSH connection to the instance.
           Replace `<INSTANCE-IP>` with the public IP of the instance:

            ```bash
            ssh -i key.pem <INSTANCE-IP>
            ```
      operationId: addSSHKey
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The name of the SSH key.
                  example: my-public-key
                public_key:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: The public key to store. Omit this to generate a new key pair.
                  example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICN+lJwsONkwrdsSnQsu1ydUkIuIg5oOC+Eslvmtt60T noname
              required:
                - name
              title: AddSSHKeyRequest
              type: object
        required: true
  /ssh-keys/{id}:
