                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorTicketNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - Support Tickets
      summary: Update a support ticket
      description: Updates a support ticket status, severity, or priority, or adds a comment to the ticket. Returns a 202. Ticket updates happen asynchronously so to see the result of an update, re-query the tickets API.
      operationId: updateTicket
      parameters:
        - name: ticket_id
          in: path
          description: The ticket ID.
          required: true
          schema:
            description: The ticket ID.
            type: string
          example: 0920582c7ff041399e34823a0be62549
      requestBody:
        content:
          application/json:
            schema:
              properties:
                status:
                  type: string
                  description: The new status to set the ticket to.
                  enum:
                    - solved
                  example: solved
                severity:
                  $ref: '#/components/schemas/TicketSeverity'
                  description: The new severity level to set the ticket to.
                  example: sev_2
                priority:
                  $ref: '#/components/schemas/TicketPriority'
                  description: The new priority level to set the ticket to.
                  example: high
                comment:
                  $ref: '#/components/schemas/TicketCommentInput'
                  description: Adds a new comment.
                affected_devices:
                  type: array
                  items:
                    type: string
                  description: The list of devices affected by the issue.
                  example:
                    - abc-gpu-001
                    - abc-gpu-002
              title: TicketUpdateRequest
              type: object
        required: true
