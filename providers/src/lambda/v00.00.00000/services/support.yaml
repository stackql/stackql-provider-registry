openapi: 3.0.3
info:
  title: Support
  description: Support tickets and ticket attachments.
  version: 1.10.0
paths:
  /tickets:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/TicketListResponse'
                required:
                  - data
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorInvalidParameters'
                required:
                  - error
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorUnauthorized'
                required:
                  - error
                type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorAccountInactive'
                required:
                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - Support Tickets
      summary: List support tickets
      description: Retrieves a list of support tickets for your account.
      operationId: listTickets
      parameters:
        - name: status
          in: query
          description: The current status of a support ticket.
          required: false
          schema:
            description: The current status of a support ticket.
            items:
              $ref: '#/components/schemas/TicketStatus'
            type: array
            example:
              - open
              - pending
          example:
            - open
            - pending
        - name: type
          in: query
          description: The type of support ticket.
          required: false
          schema:
            description: The type of support ticket.
            items:
              $ref: '#/components/schemas/TicketType'
            type: array
            example:
              - incident
              - service_request
              - automated_event
          example:
            - incident
            - service_request
            - automated_event
        - name: severity
          in: query
          description: The severity level for incident tickets.
          required: false
          schema:
            description: The severity level for incident tickets.
            items:
              $ref: '#/components/schemas/TicketSeverity'
            type: array
            example:
              - sev_1
              - sev_2
          example:
            - sev_1
            - sev_2
        - name: priority
          in: query
          description: The priority level of a support ticket.
          required: false
          schema:
            description: The priority level of a support ticket.
            items:
              $ref: '#/components/schemas/TicketPriority'
            type: array
            example:
              - high
              - urgent
          example:
            - high
            - urgent
        - name: device_serial
          in: query
          description: The serial number of the affected device. Matching is case-insensitive.
          required: false
          schema:
            description: The serial number of the affected device. Matching is case-insensitive.
            items:
              type: string
            type: array
            example:
              - SN123456789
              - SN987654321
          example:
            - SN123456789
            - SN987654321
        - name: order_by
          in: query
          description: Specifies the field used to sort the list of tickets.
          required: false
          schema:
            $ref: '#/components/schemas/TicketOrderByField'
            description: Specifies the field used to sort the list of tickets.
            example: created_at
          example: created_at
        - name: direction
          in: query
          description: Specifies the order in which to sort the list of tickets.
          required: false
          schema:
            $ref: '#/components/schemas/SortDirection'
            description: Specifies the order in which to sort the list of tickets.
            example: desc
          example: desc
        - name: page_token
          in: query
          description: A page token. Provide this token in your next request to retrieve the next page of results. If there are no additional pages, this field has a null value.
          required: false
          schema:
            description: A page token. Provide this token in your next request to retrieve the next page of results. If there are no additional pages, this field has a null value.
            type: string
            example: abCdEFg0h1I2jKlm34n5O6Pq78r=
          example: abCdEFg0h1I2jKlm34n5O6Pq78r=
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/TicketCreateResponse'
                required:
                  - data
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The unique identifier for the type of error.
                        enum:
                          - global/invalid-parameters
                      message:
                        type: string
                        default: Invalid request data.
                        description: A description of the error.
                      suggestion:
                        type: string
                        description: One or more suggestions of possible ways to fix the error.
                      request_id:
                        type: string
                        description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
                    required:
                      - code
                      - message
                      - suggestion
                    title: ApiErrorInvalidParameters
                required:
                  - error
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorUnauthorized'
                required:
                  - error
                type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The unique identifier for the type of error.
                        enum:
                          - global/account-inactive
                      message:
                        type: string
                        default: Your account is inactive.
                        description: A description of the error.
                      suggestion:
                        type: string
                        default: Make sure you have verified your email address and have a valid payment method. Contact Support if problems continue.
                        description: One or more suggestions of possible ways to fix the error.
                      request_id:
                        type: string
                        description: 'Uniquely identifies the request that produced this error. Quote it when contacting support: it is how a failed call is found in our logs and traces.'
                    required:
                      - code
                      - message
                      - suggestion
                    title: ApiErrorAccountInactive
                    description: |-
                      The account or identity is not in good standing to make the request.

                      Your account is inactive or suspended, your identity is deactivated or has
                      not verified its email, or your account is missing a payment method the
                      endpoint requires.
                required:
                  - error
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorNotFound'
                required:
                  - error
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    $ref: '#/components/schemas/ApiErrorRateLimited'
                required:
                  - error
                type: object
      tags:
        - Support Tickets
      summary: Create a support ticket
      description: Creates a new support ticket.
      operationId: createTicket
      requestBody:
        content:
          application/json:
            schema:
              properties:
                subject:
                  type: string
                  description: A short summary of the issue.
                  example: GPU cluster experiencing performance degradation
                description:
                  type: string
                  description: An initial description of the issue or request. When you make an API request to list the comments on this ticket, this will appear as the first public comment in the list.
                  example: Performance drops by 30-40% during peak hours.
                type:
                  $ref: '#/components/schemas/TicketRequestType'
                  example: incident
                severity:
                  $ref: '#/components/schemas/TicketSeverity'
                  description: The severity level of the issue. Required for incident tickets, must not be provided for service requests.
                  example: sev_1
                priority:
                  $ref: '#/components/schemas/TicketPriority'
                  description: The priority level of the ticket.
                  example: high
                ip:
                  type: string
                  description: The IP address of the affected node.
                  example: 192.222.53.194
                instance_id:
                  type: string
                  description: The ID of the affected on-demand instance.
                  example: 2fbb7a309a7c475abe7ee58bd125ac36
                cluster_id:
                  type: string
                  description: The ID of the affected 1CC or Supercluster.
                  example: a0bacf07268245a2b596b5863185a4ff
                hostname:
                  type: string
                  description: The hostname of the affected device.
                  example: abc-gpu-001
                device_serial:
                  type: string
                  description: The serial number of the affected device.
                  example: SN123456789
                requester_email:
                  type: string
                  description: The email address to associate with the ticket's requester.
                  example: alerts@example.com
                affected_devices:
                  type: array
                  items:
                    type: string
                  description: The list of devices affected by the issue.
                  example:
                    - abc-gpu-001
                    - abc-gpu-002
              required:
                - subject
                - description
                - type
              title: TicketCreateRequest
              type: object
        required: true
