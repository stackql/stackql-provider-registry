id: lambda
name: lambda
version: v00.00.00000
providerServices:
  audit:
    id: audit:v00.00.00000
    name: audit
    preferred: true
    service:
      $ref: lambda/v00.00.00000/services/audit.yaml
    title: Audit Events
    version: v00.00.00000
    description: Audit events recorded for the account.
  filesystems:
    id: filesystems:v00.00.00000
    name: filesystems
    preferred: true
    service:
      $ref: lambda/v00.00.00000/services/filesystems.yaml
    title: Filesystems
    version: v00.00.00000
    description: Persistent filesystems that can be mounted on instances.
  firewall:
    id: firewall:v00.00.00000
    name: firewall
    preferred: true
    service:
      $ref: lambda/v00.00.00000/services/firewall.yaml
    title: Firewall
    version: v00.00.00000
    description: Inbound firewall rules, firewall rulesets and the global firewall ruleset.
  images:
    id: images:v00.00.00000
    name: images
    preferred: true
    service:
      $ref: lambda/v00.00.00000/services/images.yaml
    title: Images
    version: v00.00.00000
    description: Machine images available for instance launches, by region.
  instance_types:
    id: instance_types:v00.00.00000
    name: instance_types
    preferred: true
    service:
      $ref: lambda/v00.00.00000/services/instance_types.yaml
    title: Instance Types
    version: v00.00.00000
    description: Instance types offered on Lambda Cloud with their specifications, price in US cents per hour and the regions that have capacity at the time of the request.
  instances:
    id: instances:v00.00.00000
    name: instances
    preferred: true
    service:
      $ref: lambda/v00.00.00000/services/instances.yaml
    title: Instances
    version: v00.00.00000
    description: 'On-demand instances: inventory, launch, update, restart and terminate.'
  regions:
    id: regions:v00.00.00000
    name: regions
    preferred: true
    service:
      $ref: lambda/v00.00.00000/services/regions.yaml
    title: Regions
    version: v00.00.00000
    description: Lambda Cloud regions.
  ssh_keys:
    id: ssh_keys:v00.00.00000
    name: ssh_keys
    preferred: true
    service:
      $ref: lambda/v00.00.00000/services/ssh_keys.yaml
    title: SSH Keys
    version: v00.00.00000
    description: SSH keys registered in the account, used for access to launched instances.
  support:
    id: support:v00.00.00000
    name: support
    preferred: true
    service:
      $ref: lambda/v00.00.00000/services/support.yaml
    title: Support
    version: v00.00.00000
    description: Support tickets and ticket attachments.
config:
  auth:
    type: bearer
    credentialsenvvar: LAMBDA_CLOUD_API_KEY
