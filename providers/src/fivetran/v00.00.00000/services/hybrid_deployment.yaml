openapi: 3.0.1
info:
  title: Fivetran Hybrid Deployment API
  description: Hybrid deployment agents and HVR hub registration.
  version: v1
paths:
  /v1/hvr/register-hub:
    post:
      tags:
        - HVR Registrations Management
      summary: Register Hub
      description: Register a new hub within your Fivetran account.
      operationId: hvr_register_hub
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HvrHubRegistrationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: HVR hub has been registered
                  data:
                    $ref: '#/components/schemas/HvrHubRegistrationResponse'
                type: object
  /v1/hybrid-deployment-agents:
    get:
      tags:
        - Hybrid Deployment Agent Management
      summary: List Hybrid Deployment Agents
      description: Returns list of all Hybrid Deployment Agents within your Fivetran account, along with usage. Optionally filtered to a single group.
      operationId: get_hybrid_deployment_agent_list
      parameters:
        - name: groupId
          in: query
          description: The Fivetran Group Id.
          required: false
          schema:
            type: string
            example: group_id
          example: group_id
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Hybrid deployment agents retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/HybridDeploymentAgentWithUsageResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Hybrid Deployment Agent Management
      summary: Create a Hybrid Deployment Agent
      description: Creates a new Hybrid Deployment Agent in a group.
      operationId: create_hybrid_deployment_agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HybridDeploymentAgentCreateRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Hybrid deployment agent has been created
                  data:
                    $ref: '#/components/schemas/HybridDeploymentAgentCreateResponse'
                type: object
        '400':
          description: Missing name or license not accepted in the payload.
        '404':
          description: Group not found.
  /v1/hybrid-deployment-agents/{agent_id}:
    get:
      tags:
        - Hybrid Deployment Agent Management
      summary: Returns Hybrid Deployment Agent Details
      description: Returns Hybrid Deployment Agent Details.
      operationId: get_hybrid_deployment_agent
      parameters:
        - name: agent_id
          in: path
          description: Hybrid Deployment Agent Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Hybrid deployment agent details retrieved successfully
                  data:
                    $ref: '#/components/schemas/HybridDeploymentAgentWithUsageResponse'
                type: object
    delete:
      tags:
        - Hybrid Deployment Agent Management
      summary: Delete a Hybrid Deployment Agent
      description: Delete a Hybrid Deployment Agent.
      operationId: delete_hybrid_deployment_agent
      parameters:
        - name: agent_id
          in: path
          description: Hybrid Deployment Agent Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Hybrid deployment agent with id = string has been deleted.
                type: object
        '404':
          description: Hybrid Deployment Agent not found.
  /v1/hybrid-deployment-agents/{agent_id}/re-auth:
    patch:
      tags:
        - Hybrid Deployment Agent Management
      summary: Regenerate Authentication Keys
      description: Regenerate authentication for a Hybrid Deployment Agent.
      operationId: re_auth_hybrid_deployment_agent
      parameters:
        - name: agent_id
          in: path
          description: Hybrid Deployment Agent Id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HybridDeploymentAgentReAuthRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Hybrid deployment agent re-authentication successful
                  data:
                    $ref: '#/components/schemas/HybridDeploymentAgentCreateResponse'
                type: object
        '404':
          description: Hybrid Deployment Agent not found in group.
  /v1/hybrid-deployment-agents/{agent_id}/reset-credentials:
    post:
      tags:
        - Hybrid Deployment Agent Management
      summary: Reset Agent Credentials
      description: Reset credentials for a Hybrid Deployment Agent.
      operationId: reset_hybrid_deployment_agent_credentials
      parameters:
        - name: agent_id
          in: path
          description: Hybrid Deployment Agent Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Successfully reset credentials the agent with id = string
                type: object
        '404':
          description: Hybrid Deployment Agent not found
components:
  schemas:
    HvrHubRegistrationRequest:
      required:
        - fingerprint
        - hub_server_url
      type: object
      properties:
        fingerprint:
          type: string
          description: Installation fingerprint.
          example: fingerprint_value
        port:
          type: integer
          description: Installation port.
          format: int32
          example: 1234
        hub_server_url:
          type: string
          description: URL of Hub server.
          example: hub_server_url
    HvrHubRegistrationResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Access token.
          example: access_token_value
        registration_id:
          type: string
          description: Registration identifier.
          example: registration_id
    HybridDeploymentAgentWithUsageResponse:
      required:
        - created_by
        - deployment_type
        - display_name
        - enabled
        - group_id
        - id
        - last_used_at
        - online
        - registered_at
        - updated_at
        - version
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the hybrid deployment agent within the Fivetran system.
          example: agent_id
        version:
          type: string
          description: Version of the Hybrid Deployment Agent
          example: version
        enabled:
          type: boolean
          description: The boolean value specifying whether the Hybrid Deployment Agent is enabled.
          example: true
        online:
          type: boolean
          description: The boolean value specifying whether the Hybrid Deployment Agent is online.
          example: true
        usage:
          type: array
          items:
            $ref: '#/components/schemas/HybridDeploymentAgentUsageResponse'
        display_name:
          type: string
          description: Hybrid Deployment Agent display name.
          example: display_name
        group_id:
          type: string
          description: The unique identifier for the group within your Fivetran account.
          example: group_id
        registered_at:
          type: string
          description: Time when this Hybrid Deployment Agent was created.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
        created_by:
          type: string
          description: The actor who created the Hybrid Deployment Agent
          example: created_by
        deployment_type:
          type: string
          description: Environment type.
          example: DOCKER
          enum:
            - DOCKER
            - PODMAN
            - KUBERNETES
            - SNOWPARK
        updated_at:
          type: string
          description: Time when this Hybrid Deployment Agent was updated.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
        last_used_at:
          type: string
          description: The time this Hybrid Deployment Agent was last used.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
    HybridDeploymentAgentCreateRequest:
      required:
        - accept_terms
        - display_name
        - env_type
      type: object
      properties:
        group_id:
          type: string
          description: The unique identifier for the group within your Fivetran account.
          example: group_id
        display_name:
          type: string
          description: Hybrid Deployment Agent display name.
          example: display_name
        env_type:
          type: string
          description: Environment type.
          example: DOCKER
          enum:
            - DOCKER
            - PODMAN
            - KUBERNETES
            - SNOWPARK
        accept_terms:
          type: boolean
          description: Boolean, must be true to indicate that the caller accepts the Fivetran On-Prem Software License Addendum.
          example: true
        auth_type:
          type: string
          description: Agent Auth Mode. Defines how agent should be authorised.
          example: AUTO
          enum:
            - AUTO
            - MANUAL
    HybridDeploymentAgentCreateResponse:
      required:
        - created_by
        - deployment_type
        - display_name
        - enabled
        - group_id
        - id
        - last_used_at
        - online
        - registered_at
        - updated_at
        - version
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the hybrid deployment agent within the Fivetran system.
          example: agent_id
        version:
          type: string
          description: Version of the Hybrid Deployment Agent
          example: version
        enabled:
          type: boolean
          description: The boolean value specifying whether the Hybrid Deployment Agent is enabled.
          example: true
        online:
          type: boolean
          description: The boolean value specifying whether the Hybrid Deployment Agent is online.
          example: true
        files:
          $ref: '#/components/schemas/HybridDeploymentAgentFilesResponse'
        token:
          type: string
          description: Base64 encoded content of token
          example: token_value
        display_name:
          type: string
          description: Hybrid Deployment Agent display name.
          example: display_name
        group_id:
          type: string
          description: The unique identifier for the group within your Fivetran account.
          example: group_id
        registered_at:
          type: string
          description: Time when this Hybrid Deployment Agent was created.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
        created_by:
          type: string
          description: The actor who created the Hybrid Deployment Agent
          example: created_by
        deployment_type:
          type: string
          description: Environment type.
          example: DOCKER
          enum:
            - DOCKER
            - PODMAN
            - KUBERNETES
            - SNOWPARK
        updated_at:
          type: string
          description: Time when this Hybrid Deployment Agent was updated.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
        last_used_at:
          type: string
          description: The time this Hybrid Deployment Agent was last used.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
    HybridDeploymentAgentReAuthRequest:
      type: object
      properties:
        auth_type:
          type: string
          enum:
            - AUTO
            - MANUAL
    HybridDeploymentAgentUsageResponse:
      required:
        - connection_id
        - schema
        - service
      type: object
      properties:
        schema:
          type: string
          description: The name used both as the connection's name within the Fivetran system and as the source schema's name within your group.
          example: schema_name
        service:
          type: string
          description: The connector type name within the Fivetran system.
          example: service
        connection_id:
          type: string
          description: The unique identifier for the connection within the Fivetran
          example: connection_id
    HybridDeploymentAgentFilesResponse:
      required:
        - auth_json
        - config_json
        - docker_compose_yaml
      type: object
      properties:
        config_json:
          type: string
          description: Base64 encoded content of the config.json
          format: byte
          example: Base64 {... config.json contents ...}
        auth_json:
          type: string
          description: Base64 encoded content of the auth.json
          format: byte
          example: Base64 {... auth.json contents ...}
        docker_compose_yaml:
          type: string
          description: Base64 encoded content of the docker-compose.yaml
          format: byte
          example: Base64 {... docker-compose.yaml contents ...}
  x-stackQL-resources:
    hvr_hubs:
      id: fivetran.hybrid_deployment.hvr_hubs
      name: hvr_hubs
      title: Hvr Hubs
      methods:
        register:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1hvr~1register-hub/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
      sqlVerbs:
        select: []
        insert: []
        update: []
        delete: []
        replace: []
    agents:
      id: fivetran.hybrid_deployment.agents
      name: agents
      title: Agents
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1hybrid-deployment-agents/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.items
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1hybrid-deployment-agents/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
            objectKey: $.data
        get:
          operation:
            $ref: '#/paths/~1v1~1hybrid-deployment-agents~1{agent_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
        delete:
          operation:
            $ref: '#/paths/~1v1~1hybrid-deployment-agents~1{agent_id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        re_auth:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1hybrid-deployment-agents~1{agent_id}~1re-auth/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
        reset_credentials:
          operation:
            $ref: '#/paths/~1v1~1hybrid-deployment-agents~1{agent_id}~1reset-credentials/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/agents/methods/get'
          - $ref: '#/components/x-stackQL-resources/agents/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/agents/methods/create'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/agents/methods/delete'
        replace: []
servers:
  - url: https://api.fivetran.com
x-stackQL-config:
  pagination:
    requestToken:
      key: cursor
      location: query
    responseToken:
      key: $.data.next_cursor
      location: body
