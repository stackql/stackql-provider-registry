            - AZURE_CENTRALUS
            - AZURE_CANADACENTRAL
            - AZURE_UAENORTH
            - AZURE_SOUTHEASTASIA
            - AZURE_EASTUS
            - AZURE_JAPANEAST
            - AZURE_CENTRALINDIA
            - AZURE_GERMANYWESTCENTRAL
            - AZURE_WESTUS3
            - AZURE_SWITZERLANDNORTH
            - AZURE_KOREACENTRAL
        group_id:
          type: string
          description: The unique identifier for the group within the Fivetran system.
          example: group_id
        time_zone_offset:
          type: string
          description: Determines the time zone for the Fivetran sync schedule.
          example: '+3'
          enum:
            - '-11'
            - '-10'
            - '-9'
            - '-8'
            - '-7'
            - '-6'
            - '-5'
            - '-4'
            - '-3'
            - '-2'
