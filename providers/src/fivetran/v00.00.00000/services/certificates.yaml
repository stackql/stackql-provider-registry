openapi: 3.0.1
info:
  title: Fivetran Certificates API
  description: TLS certificates and SSH fingerprints approved for connections and destinations.
  version: v1
paths:
  /v1/certificates:
    post:
      tags:
        - Certificate Management
      summary: (Deprecated) Approve a Certificate
      description: Approves a certificate for a connection/destination, so Fivetran trusts this certificate for a source/destination database. The connection/destination setup tests will fail if a non-approved certificate is provided.
      operationId: approve_certificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustCertificateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: The certificate has been approved.
                type: object
      deprecated: true
  /v1/connections/{connection_id}/certificates:
    get:
      tags:
        - Certificate Management
      summary: List Certificates Approved for the Connection
      description: Returns the list of approved certificates for the specified connection.
      operationId: get_connection_certificates_list
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection certificates retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/CertificateDetailsResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
        '404':
          description: Connection not found.
    post:
      tags:
        - Certificate Management
      summary: Approve a Certificate for the Connection
      description: |
        Approves a certificate, so Fivetran trusts this certificate for a source database connection. 
        The connection setup tests will fail if a non-approved certificate is provided.

        > NOTE: This is only required for source connections based on the following databases: 
        >  - [MySQL](https://fivetran.com/docs/connectors/databases/mysql#supportedservices)
        >  - [PostgreSQL](https://fivetran.com/docs/connectors/databases/postgresql#supportedservices)
        >  - [SQLServer](https://fivetran.com/docs/connectors/databases/sql-server#supportedservices)
      operationId: approve_connection_certificate
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCertificateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: The certificate has been approved.
                  data:
                    $ref: '#/components/schemas/CertificateDetailsResponse'
                type: object
        '400':
          description: Missing `hash` or `encoded_cert` fields in request payload
        '404':
          description: Connection not found
  /v1/connections/{connection_id}/certificates/{hash}:
    get:
      tags:
        - Certificate Management
      summary: Retrieve Connection Certificate Details
      description: Returns details of the certificate approved for the specified connection with specified certificate hash.
      operationId: get_connection_certificate_details
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
        - name: hash
          in: path
          description: The unique identifier of the certificate (Base64URL encoded hash of the certificate).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection certificate details retrieved successfully
                  data:
                    $ref: '#/components/schemas/CertificateDetailsResponse'
                type: object
        '404':
          description: Certificate with specified hash not found
    delete:
      tags:
        - Certificate Management
      summary: Revoke Connection Certificate
      description: Revokes a certificate, so Fivetran no longer trusts it while connecting to the source database.
      operationId: revoke_connection_certificate
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
        - name: hash
          in: path
          description: The unique identifier of the certificate (Base64URL encoded hash of the certificate).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Certificate 'string' has been revoked for connection 'string'
                type: object
        '404':
          description: Certificate with specified hash not found
  /v1/connections/{connection_id}/fingerprints:
    get:
      tags:
        - Certificate Management
      summary: List Fingerprints Approved for the Connection
      description: Returns the list of approved SSH fingerprints for specified connection
      operationId: get_connection_fingerprints_list
