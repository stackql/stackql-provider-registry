components:
  schemas:
    TrustCertificateRequest:
      required:
        - encoded_cert
        - hash
      type: object
      properties:
        hash:
          type: string
          description: Hash of the certificate.
          example: jhg5UI7fgrI6yy...
        encoded_cert:
          type: string
          description: The certificate encoded in base64.
          example: MIID9DCCAtygAwIBAgIBQjANBgkqhkiG9w0BAQUFADCBijELMAkGA1UEBhMCV...
        connection_id:
          type: string
          description: The unique identifier for the connection within the Fivetran system.
          example: connection_id
        destination_id:
          type: string
          description: The unique identifier for the destination within the Fivetran system.
          example: destination_id
    CertificateDetailsResponse:
      required:
        - hash
        - id
        - name
        - public_key
        - sha1
        - sha256
        - type
        - validated_by
        - validated_date
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the certificate (Base64URL encoded hash of the certificate).
          example: Y29ubmVjdG9yIGNlcnRpZmljYXRlIGhhc2g
        name:
          type: string
          description: The certificate name.
          example: Certificate Name
        hash:
          type: string
          description: Hash of the certificate.
          example: jhg5UI7fgrI6yy...
        type:
          type: string
          description: Type of the certificate.
          example: TLS
        sha1:
          type: string
          description: SHA1 of certificate.
          example: c8de1d13vtu435ilj435lj345796d8jh7hk8hgk
        sha256:
          type: string
          description: SHA256 of certificate.
          example: 5vt6rt6jtr654eef94ec3f91122a623b389f4d331ff330026e43af21013vb45f
        public_key:
          type: string
          description: The certificate decoded public key.
          example: 'Sun RSA public key, 2048 bits params: null modulus: 7685655455... public exponent: 65537'
        validated_date:
          type: string
          description: Date when certificate has been validated and approved.
          format: date-time
          example: '2023-08-20T10:15:20.677566Z'
        validated_by:
          type: string
          description: The unique identified for the user who has approved the certificate.
          example: user_id
    ApproveCertificateRequest:
      required:
        - encoded_cert
        - hash
      type: object
      properties:
        hash:
          type: string
          description: Hash of the certificate.
          example: jhg5UI7fgrI6yy...
        encoded_cert:
          type: string
          description: The certificate encoded in base64.
          example: MIID9DCCAtygAwIBAgIBQjANBgkqhkiG9w0BAQUFADCBijELMAkGA1UEBhMCV...
    FingerprintDetailsResponse:
      required:
        - hash
        - id
        - public_key
        - validated_by
        - validated_date
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the fingerprint (Base64URL encoded hash of the fingerprint).
          example: Y29ubmVjdG9yIGZpbmdlcnByaW50IGhhc2g
        hash:
          type: string
          description: Hash of the fingerprint.
          example: eUtPirI6yy...
        public_key:
          type: string
          description: The SSH public key.
          example: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC6 ... fivetran user key
        validated_date:
          type: string
          description: Date when fingerprint has been validated and approved.
          format: date-time
          example: '2024-01-01T00:00:00Z'
        validated_by:
          type: string
          description: The unique identified for the user who has approved the fingerprint.
          example: user_id
    ApproveFingerprintRequest:
      required:
        - hash
        - public_key
      type: object
      properties:
        hash:
          type: string
          description: Hash of the fingerprint.
          example: eUtPirI6yy...
        public_key:
          type: string
          description: The SSH public key.
          example: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC6 ... fivetran user key
    ApproveCertificateRequest_approve_destination_certificate:
      required:
        - encoded_cert
