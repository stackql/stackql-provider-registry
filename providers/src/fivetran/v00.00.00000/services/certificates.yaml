          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection fingerprints retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/FingerprintDetailsResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
        '404':
          description: Connection not found
    post:
      tags:
        - Certificate Management
      summary: Approve a Fingerprint for the Connection
      description: Approves a fingerprint, enabling Fivetran to trust it for a source database and establish connections via an SSH tunnel.
      operationId: approve_connection_fingerprint
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveFingerprintRequest'
      responses:
        '200':
          description: Successful response
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                  data:
                    $ref: '#/components/schemas/FingerprintDetailsResponse'
        '400':
          description: Missing `hash` or `public_key` fields in request payload
        '404':
          description: Connection not found
