openapi: 3.0.1
info:
  title: Fivetran External Logging API
  description: Log services at group and account level.
  version: v1
paths:
  /v1/external-logging:
    get:
      tags:
        - Log Service Management
      summary: List All Log Services within Account
      description: Returns a list of all accessible [logging services](https://fivetran.com/docs/logs/external-logs) within your Fivetran account.
      operationId: list_log_services
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: External logging services retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/LogResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Log Service Management
      summary: Create a Group Log Service
      description: Creates a new group-level [logging service](https://fivetran.com/docs/logs/external-logs) within a specified group in your Fivetran account.
      operationId: add_log_service
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLogRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: External logging service has been added
                  data:
                    $ref: '#/components/schemas/LogExtendedResponse'
                type: object
  /v1/external-logging/account:
    get:
      tags:
        - Log Service Management
      summary: Retrieve Account Log Service
      description: Returns the account-level [logging service](https://fivetran.com/docs/logs/external-logs) if it exists.
      operationId: get_account_log_service_details
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Account external logging service details retrieved successfully
                  data:
                    $ref: '#/components/schemas/LogExtendedResponse'
                type: object
    post:
      tags:
        - Log Service Management
      summary: Create Account Log Service
      description: Creates an account-level [logging service](https://fivetran.com/docs/logs/external-logs).
      operationId: add_account_log_service
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAccountLogRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Account external logging service has been added
                  data:
                    $ref: '#/components/schemas/LogExtendedResponse'
                type: object
    delete:
      tags:
        - Log Service Management
      summary: Delete Account Log Service
      description: Deletes the account-level [logging service](https://fivetran.com/docs/logs/external-logs).
      operationId: delete_account_log_service
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Account external logging service has been deleted
                type: object
    patch:
      tags:
        - Log Service Management
      summary: Update Account Log Service
      description: Updates information for the account-level [logging service](https://fivetran.com/docs/logs/external-logs).
      operationId: update_account_log_service
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLogRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Account external logging service has been updated
                  data:
                    $ref: '#/components/schemas/LogExtendedResponse'
                type: object
  /v1/external-logging/account/test:
    post:
      tags:
        - Log Service Management
      summary: Run Account Log Service Setup Tests
      description: Runs the setup tests for the account-level [logging service](https://fivetran.com/docs/logs/external-logs).
      operationId: run_setup_tests_account_log_service
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Account external logging service setup tests have been completed
                  data:
                    $ref: '#/components/schemas/LoggingServiceSetupTestResponse'
                type: object
  /v1/external-logging/{log_id}:
    get:
      tags:
        - Log Service Management
      summary: Retrieve Group Log Service Details
      description: Returns a group-level [logging service](https://fivetran.com/docs/logs/external-logs) object if a valid identifier was provided.
      operationId: get_log_service_details
      parameters:
        - name: log_id
          in: path
          description: The unique identifier for the log service within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: External logging service details retrieved successfully
                  data:
                    $ref: '#/components/schemas/LogExtendedResponse'
                type: object
    delete:
      tags:
        - Log Service Management
      summary: Delete a Group Log Service
      description: Deletes a group-level [logging service](https://fivetran.com/docs/logs/external-logs) from your Fivetran account.
      operationId: delete_log_service
      parameters:
        - name: log_id
          in: path
          description: The unique identifier for the log service within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: External logging service with id 'string' has been deleted
                type: object
    patch:
      tags:
        - Log Service Management
      summary: Update a Group Log Service
      description: Updates information for an existing group-level [logging service](https://fivetran.com/docs/logs/external-logs) within your Fivetran account.
      operationId: update_log_service
      parameters:
        - name: log_id
          in: path
          description: The unique identifier for the log service within the Fivetran system.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLogRequest_update_log_service'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: External logging service has been updated
                  data:
                    $ref: '#/components/schemas/LogExtendedResponse'
                type: object
  /v1/external-logging/{log_id}/test:
    post:
      tags:
        - Log Service Management
      summary: Run Group Log Service Setup Tests
      description: Runs the setup tests for an existing group-level [logging service](https://fivetran.com/docs/logs/external-logs) within your Fivetran account.
      operationId: run_setup_tests_log_service
      parameters:
        - name: log_id
          in: path
          description: The unique identifier for the log service within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Setup tests have been completed
                  data:
                    $ref: '#/components/schemas/LoggingServiceSetupTestResponse'
                type: object
components:
  schemas:
    LogResponse:
      required:
        - enabled
        - id
        - service
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the log service within the Fivetran system.
          example: log_id
        service:
          type: string
          description: 'The name of the log service type within the Fivetran system. We support the following log services: `azure_monitor_log`, `cloudwatch`, `datadog_log`, `dynatrace`, `grafana_loki`, `splunkLog`, `new_relic_log`, `stackdriver` (Google Cloud Logging).'
          example: log_service_type
        enabled:
          type: boolean
          description: The boolean value specifying whether the log service is enabled.
          example: true
        status:
          description: Setup status of the log service. Present when a setup status exists for the log service.
          type: object
          properties:
            tasks:
              type: array
              description: List of alerts describing issues with the log service configuration.
              items:
                $ref: '#/components/schemas/LogAlert'
            setup_state:
              type: string
              description: 'Current setup state of the log service. Possible values: `connected` — log service is reachable and forwarding events; `broken` — configuration errors prevent log delivery; `incomplete` — setup has not been completed and log delivery is paused. Example: `connected`.'
              example: connected
    AddLogRequest:
      type: object
      properties:
        group_id:
          type: string
          description: The unique identifier for the group within the Fivetran system
          example: group_id
        service:
          type: string
          description: 'The name of the log service type within the Fivetran system. We support the following log services: `azure_monitor_log`, `cloudwatch`, `datadog_log`, `dynatrace`, `grafana_loki`, `splunkLog`, `new_relic_log`, `stackdriver` (Google Cloud Logging).'
          example: log_service_type
        enabled:
          type: boolean
          description: The boolean value specifying whether the log service is enabled.
          example: true
        run_setup_tests:
          type: boolean
          description: When `true`, Fivetran runs setup tests immediately after creating or updating the log service and returns the results in the `setup_tests` field of the response. Defaults to `false`.
          example: false
        config:
          type: object
          additionalProperties: true
          description: The `config` object for the `service` in question (a JSON value; its keys depend on the `service`). The accepted keys per type are documented in the vendor's API reference and returned by the connector metadata endpoints.
    LogExtendedResponse:
      required:
        - enabled
        - id
        - service
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the log service within the Fivetran system.
          example: log_id
        service:
          type: string
          description: 'The name of the log service type within the Fivetran system. We support the following log services: `azure_monitor_log`, `cloudwatch`, `datadog_log`, `dynatrace`, `grafana_loki`, `splunkLog`, `new_relic_log`, `stackdriver` (Google Cloud Logging).'
          example: log_service_type
        enabled:
          type: boolean
          description: The boolean value specifying whether the log service is enabled.
          example: true
        status:
          description: Setup status of the log service. Present when a setup status exists for the log service.
          type: object
          properties:
            tasks:
              type: array
              description: List of alerts describing issues with the log service configuration.
              items:
                $ref: '#/components/schemas/LogAlert'
            setup_state:
              type: string
              description: 'Current setup state of the log service. Possible values: `connected` — log service is reachable and forwarding events; `broken` — configuration errors prevent log delivery; `incomplete` — setup has not been completed and log delivery is paused. Example: `connected`.'
              example: connected
        setup_tests:
          type: array
          description: Results of the most recent setup test run.
          items:
            $ref: '#/components/schemas/SetupTestResultResponse'
        config:
          type: object
          additionalProperties: true
          description: The `config` object for the `service` in question (a JSON value; its keys depend on the `service`). The accepted keys per type are documented in the vendor's API reference and returned by the connector metadata endpoints.
    AddAccountLogRequest:
      type: object
      properties:
        service:
          type: string
          description: 'The name of the log service type within the Fivetran system. We support the following log services: `azure_monitor_log`, `cloudwatch`, `datadog_log`, `dynatrace`, `grafana_loki`, `splunkLog`, `new_relic_log`, `stackdriver` (Google Cloud Logging).'
          example: log_service_type
        enabled:
          type: boolean
          description: The boolean value specifying whether the log service is enabled.
          example: true
        config:
          $ref: '#/components/schemas/JsonNode'
        run_setup_tests:
          type: boolean
          description: When `true`, Fivetran runs setup tests immediately after creating or updating the log service and returns the results in the `setup_tests` field of the response. Defaults to `false`.
          example: false
    UpdateLogRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: The boolean value specifying whether the log service is enabled.
          example: true
        config:
          description: The setup configuration. Check possible config formats in [create method](https://fivetran.com/docs/rest-api/api-reference/log-service-management/add-log-service/)
        run_setup_tests:
          type: boolean
          description: When `true`, Fivetran runs setup tests immediately after creating or updating the log service and returns the results in the `setup_tests` field of the response. Defaults to `false`.
          example: false
    LoggingServiceSetupTestResponse:
      type: object
      properties:
        setup_tests:
          type: array
          items:
            $ref: '#/components/schemas/SetupTestResultResponse'
    UpdateLogRequest_update_log_service:
      type: object
      properties:
        enabled:
          type: boolean
          description: The boolean value specifying whether the log service is enabled.
          example: true
        config:
          $ref: '#/components/schemas/JsonNode'
        run_setup_tests:
          type: boolean
          description: When `true`, Fivetran runs setup tests immediately after creating or updating the log service and returns the results in the `setup_tests` field of the response. Defaults to `false`.
          example: false
    LogStatusResponse:
      type: object
      properties:
        tasks:
          type: array
          description: List of alerts describing issues with the log service configuration.
          items:
            $ref: '#/components/schemas/LogAlert'
        setup_state:
          type: string
          description: 'Current setup state of the log service. Possible values: `connected` — log service is reachable and forwarding events; `broken` — configuration errors prevent log delivery; `incomplete` — setup has not been completed and log delivery is paused. Example: `connected`.'
          example: connected
    SetupTestResultResponse:
      required:
        - status
        - title
      type: object
      properties:
        title:
          type: string
          description: 'A human-readable name for the setup test step. For example: Validate Login, Test Connection, Check Permissions.'
          example: Validate Login
        status:
          type: string
          description: 'The result of the individual setup test step. Possible values: PASSED, FAILED, SKIPPED.'
          example: FAILED
          enum:
            - PASSED
            - SKIPPED
            - WARNING
            - FAILED
            - JOB_FAILED
        message:
          type: string
          description: 'The result message for the setup test step. For example: Invalid login credentials.'
          example: Invalid login credentials.
        details:
          type: string
          description: Additional diagnostic information about the setup test result. Populated when the status is FAILED and more context is available beyond the message. (opaque JSON object)
          example: Authentication failed (401 Unauthorized). Verify the provided credentials and permissions.
    JsonNode:
      type: string
      description: (opaque JSON object)
    LogAlert:
      type: object
      properties:
        code:
          type: string
          description: Alert code identifying the type of issue.
          example: reconnect_log
        message:
          type: string
          description: Human-readable description of the issue.
          example: Reconnect Logging Service
        details:
          type: string
          description: Additional context or details for the alert.
          example: Please provide required permissions
