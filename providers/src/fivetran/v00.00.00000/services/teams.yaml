openapi: 3.0.1
info:
  title: Fivetran Teams API
  description: Teams and their user, group and connection memberships.
  version: v1
paths:
  /v1/teams:
    get:
      tags:
        - Team Management
      summary: List All Teams
      description: Returns a list of all teams within your Fivetran account
      operationId: list_all_teams
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Teams retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/TeamResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Team Management
      summary: Create a Team
      description: Creates a new team in your Fivetran account
      operationId: create_team
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '201':
          description: default response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team has been created
                  data:
                    $ref: '#/components/schemas/TeamResponse'
                type: object
  /v1/teams/{team_id}:
    get:
      tags:
        - Team Management
      summary: Retrieve Team Details
      description: Returns information for a given team within your Fivetran account
      operationId: team_details
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team details retrieved successfully
                  data:
                    $ref: '#/components/schemas/TeamResponse'
                type: object
    delete:
      tags:
        - Team Management
      summary: Delete a Team
      description: Deletes a team from your Fivetran account
      operationId: delete_team
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team has been deleted
                type: object
    patch:
      tags:
        - Team Management
      summary: Update a Team
      description: Updates information for an existing team within your Fivetran account
      operationId: modify_team
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team has been updated
                  data:
                    $ref: '#/components/schemas/TeamResponse'
                type: object
  /v1/teams/{team_id}/connections:
    get:
      tags:
        - Team Management
      summary: List All Connection Memberships
      description: Returns all connections a team has membership in.
      operationId: get_team_memberships_in_connections
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team connection memberships retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/MembershipResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Team Management
      summary: Add Connection Membership
      description: Adds a team as a member of a connection.
      operationId: add_team_membership_in_connection
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection membership has been created
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
  /v1/teams/{team_id}/connections/{connection_id}:
    get:
      tags:
        - Team Management
      summary: Retrieve Connection Membership
      description: Returns details of a team membership in a connection.
      operationId: get_team_membership_in_connection
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team connection membership retrieved successfully
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
    delete:
      tags:
        - Team Management
      summary: Delete Connection Membership
      description: Removes team membership in a connection.
      operationId: delete_team_membership_in_connection
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection membership has been deleted
                type: object
    patch:
      tags:
        - Team Management
      summary: Update Connection Membership
      description: Updates team membership in a connection
      operationId: update_team_membership_in_connection
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection membership has been updated
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
  /v1/teams/{team_id}/groups:
    get:
      tags:
        - Team Management
      summary: List All Group Memberships
      description: Returns all groups in which a team has membership.
      operationId: get_team_memberships_in_groups
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team group memberships retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/MembershipResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Team Management
      summary: Add Group Membership
      description: Adds a team as a member of a group.
      operationId: add_team_membership_in_group
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest_add_team_membership_in_group'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group membership has been created
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
  /v1/teams/{team_id}/groups/{group_id}:
    get:
      tags:
        - Team Management
      summary: Retrieve Group Membership Details
      description: Returns details of a team membership in a group.
      operationId: get_team_membership_in_group
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team group membership retrieved successfully
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
    delete:
      tags:
        - Team Management
      summary: Delete Group Membership
      description: Removes a team's membership in a group.
      operationId: delete_team_membership_in_group
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group membership has been deleted
                type: object
    patch:
      tags:
        - Team Management
      summary: Update Group Membership
      description: Updates team membership in a group.
      operationId: update_team_membership_in_group
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRequest_update_team_membership_in_group'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group membership has been updated
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
  /v1/teams/{team_id}/role:
    delete:
      tags:
        - Team Management
      summary: Delete Team from Account
      description: Removes a team from your Fivetran account
      operationId: delete_team_membership_in_account
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team role in account has been removed
                type: object
  /v1/teams/{team_id}/users:
    get:
      tags:
        - Team Management
      summary: List All User Memberships
      description: Returns a list of users and their roles within a team in your Fivetran account
      operationId: list_users_in_team
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
        - name: active
          in: query
          description: Indicates whether to return only enabled users (true) or not (false). By default, both enabled (allowed to log in) and suspended users are returned.
          required: false
          schema:
            type: boolean
            example: true
          example: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team users retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/TeamMembershipResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Team Management
      summary: Add a User to the Team
      description: Assigns a role for a user in a team.
      operationId: add_user_to_team
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMembershipRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User has been added to the team
                  data:
                    $ref: '#/components/schemas/TeamMembershipResponse'
                type: object
  /v1/teams/{team_id}/users/{user_id}:
    get:
      tags:
        - Team Management
      summary: Retrieve User Membership in a Team
      description: Returns the membership details for a user in a team.
      operationId: get_user_in_team
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Team user details retrieved successfully
                  data:
                    $ref: '#/components/schemas/TeamMembershipResponse'
                type: object
    delete:
      tags:
        - Team Management
      summary: Delete a User from a Team
      description: Removes a user from a team.
      operationId: delete_user_from_team
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User has been removed from the team
                type: object
    patch:
      tags:
        - Team Management
      summary: Update a User Membership
      description: Updates a user membership in a team.
      operationId: update_user_membership
      parameters:
        - name: team_id
          in: path
          description: The unique identifier for the team within the account.
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRequest_update_user_membership'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User role has been updated
                  data:
                    $ref: '#/components/schemas/TeamMembershipResponse'
                type: object
components:
  schemas:
    TeamResponse:
      required:
        - id
        - role
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the team within your account
          example: team_id
        name:
          type: string
          description: The name of the team within your account
          example: Team Title
        description:
          type: string
          description: The description of the team within your account
          example: Team Description
        role:
          type: string
          description: The account role of the team
          example: Account Reviewer
    TeamRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the team within your account
          example: Team Title
        description:
          type: string
          description: The description of the team within your account
          example: Team Description
        role:
          type: string
          description: The account role of the team
          example: Account Analyst
    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the team within your account
          example: Team Name
        description:
          type: string
          description: The description of the team within your account
          example: Team description
        role:
          type: string
          description: The account role of the team
          example: Account Analyst
    MembershipResponse:
      required:
        - created_at
        - id
        - role
      type: object
      properties:
        id:
          type: string
          description: The membership entity unique identifier
          example: resource_id
        role:
          type: string
          description: The role the user has within the entity
          example: Role Title
        created_at:
          type: string
          description: The timestamp that the user created their Fivetran account
          format: date-time
          example: '2024-01-01T00:00:00Z'
    MembershipRequest:
      required:
        - id
        - role
      type: object
      properties:
        id:
          type: string
          description: The connection unique identifier
          example: connection_id
        role:
          type: string
          description: The team's role
          example: View Connection
    UpdateMembershipRequest:
      required:
        - role
      type: object
      properties:
        role:
          type: string
          description: The team's role
          example: Edit Connection
    MembershipRequest_add_team_membership_in_group:
      required:
        - id
        - role
      type: object
      properties:
        id:
          type: string
          description: The group unique identifier
          example: group_id
        role:
          type: string
          description: The team's role
          example: Manage Destination
    UpdateMembershipRequest_update_team_membership_in_group:
      required:
        - role
      type: object
      properties:
        role:
          type: string
          description: The user's role within the team
          example: Manage Destination
    TeamMembershipResponse:
      required:
        - created_at
        - role
        - user_id
      type: object
      properties:
        user_id:
          type: string
          description: The unique identifier of user
          example: user_id
        role:
          type: string
          description: The user's role within the team
          example: Team Member
