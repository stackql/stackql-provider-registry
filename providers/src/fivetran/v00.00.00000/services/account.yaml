openapi: 3.0.1
info:
  title: Fivetran Account API
  description: Account information, roles and system keys.
  version: v1
paths:
  /v1/account/info:
    get:
      tags:
        - Account Management
      summary: Get Account Info from the API Key
      description: Returns information about current account from API key.
      operationId: get_account_info
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Account information retrieved successfully
                  data:
                    $ref: '#/components/schemas/AccountInfoResponse'
                type: object
        '401':
          description: Invalid authorization credentials
  /v1/roles:
    get:
      tags:
        - Role Management
      summary: List all roles
      description: Returns a list of all predefined and custom roles within your Fivetran account.
      operationId: list_all_roles
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Roles list retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/RoleResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
  /v1/system-keys:
    get:
      tags:
        - System Key Management
      summary: List All System Keys
      description: Returns a list of system keys within your Fivetran account.
      operationId: get_system_keys
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: System keys retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/SystemKeyResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
              examples:
                get_list_response:
                  value:
                    code: Success
                    data:
                      items:
                        - id: _moonbeam_acc_dev
                          name: dev
                          key: <key_1_value>
                          created_at: '2023-11-10T22:11:52.326265Z'
                          expired_at: '2024-02-10T22:11:52.326265Z'
                        - id: cyclical_prospered
                          name: prod_key
                          key: <key_2_value>
                          created_at: '2023-11-10T22:11:58.931Z'
                          updated_at: '2023-11-10T22:11:58.931Z'
                          expired_at: '2024-02-10T22:11:58.931Z'
    post:
      tags:
        - System Key Management
      summary: Create a System Key
      description: Creates a new system key with your Fivetran account.
      operationId: create_system_key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSystemKeyRequest'
            examples:
              create_request:
                value:
                  name: prod_key
                  expiration_period: THREE_MONTHS
                  permissions:
                    - resource_type: USER
                      access_level: READ
                    - resource_type: WEBHOOK
                      access_level: MANAGE
                    - resource_type: CONNECTOR
                      access_level: MANAGE
                    - resource_type: DESTINATION
                      access_level: MANAGE
                    - resource_type: TRANSFORMATION
                      access_level: MANAGE
                      resource_filter:
                        group_ids:
                          - group_id_1
                          - group_id_2
                    - resource_type: CONNECTOR
                      access_level: NONE
                      resource_filter:
                        ids:
                          - connection_id_1
                          - connection_id_2
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: System key has been created
                  data:
                    $ref: '#/components/schemas/SystemKeyResponse'
                type: object
              examples:
                create_response:
                  value:
                    code: Success
                    message: System key has been created
                    data:
                      id: sod_determine
                      name: prod_key
                      key: <key_value>
                      secret: <secret_value>
                      created_at: '2023-11-10T19:32:58.646Z'
                      expired_at: '2024-02-10T19:32:58.646Z'
                      permissions:
                        - resource_type: USER
                          access_level: READ
                        - resource_type: WEBHOOK
                          access_level: MANAGE
                        - resource_type: DESTINATION
                          access_level: MANAGE
                        - resource_type: TRANSFORMATION
                          access_level: MANAGE
                          resource_filter:
                            group_ids:
                              - group_id_1
                              - group_id_2
                        - resource_type: CONNECTOR
                          access_level: NONE
                          resource_filter:
                            ids:
                              - connection_id_1
                              - connection_id_2
                        - resource_type: CONNECTOR
                          access_level: MANAGE
  /v1/system-keys/{key_id}:
    get:
      tags:
        - System Key Management
      summary: Retrieve System Key Details
      description: Retrieves a system key object within your Fivetran account.
      operationId: get_system_key_details
      parameters:
        - name: key_id
          in: path
          description: The unique identifier for the system key within your Fivetran account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: System key details retrieved successfully
                  data:
                    $ref: '#/components/schemas/SystemKeyResponse'
                type: object
              examples:
                get_response:
                  value:
                    code: Success
                    data:
                      id: rushed_fainting
                      name: updated_key
                      key_value: <key_value>
                      created_at: '2023-10-17T14:01:16.318Z'
                      updated_at: '2023-10-17T14:02:20.919291Z'
                      expired_at: '2024-01-17T14:01:16.318Z'
                      permissions:
                        - resource_type: CONNECTOR
                          access_level: MANAGE
                        - resource_type: DESTINATION
                          access_level: MANAGE
                        - resource_type: TRANSFORMATION
                          access_level: MANAGE
                          resource_filter:
                            group_ids:
                              - group_id_1
                              - group_id_2
                        - resource_type: CONNECTOR
                          access_level: NONE
                          resource_filter:
                            ids:
                              - connection_id_3
                              - connection_id_4
    delete:
      tags:
        - System Key Management
      summary: Delete a System Key
      description: Deletes a system key from your Fivetran account.
      operationId: delete_system_key
      parameters:
        - name: key_id
          in: path
          description: The unique identifier for the system key within your Fivetran account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: System key with id 'string' has been deleted
                type: object
              examples:
                delete_response:
                  value:
                    code: Success
                    message: System key with id 'rushed_fainting' has been deleted
    patch:
      tags:
        - System Key Management
      summary: Update a System Key
      description: Updates an existing system key within your Fivetran account.
      operationId: update_system_key
      parameters:
        - name: key_id
          in: path
          description: The unique identifier for the system key within your Fivetran account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSystemKeyRequest'
            examples:
              update_request:
                value:
                  name: updated_key
                  permissions:
                    - resource_type: CONNECTOR
                      access_level: MANAGE
                    - resource_type: DESTINATION
                      access_level: MANAGE
                    - resource_type: TRANSFORMATION
                      access_level: MANAGE
                      resource_filter:
                        group_ids:
                          - group_id_3
                          - group_id_4
                    - resource_type: CONNECTOR
                      access_level: NONE
                      resource_filter:
                        ids:
                          - connection_id_3
                          - connection_id_4
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: System key has been updated
                  data:
                    $ref: '#/components/schemas/SystemKeyResponse'
                type: object
              examples:
                update_response:
                  value:
                    code: Success
                    message: System key has been updated
                    data:
                      id: rushed_fainting
                      name: updated_key
                      key_value: <key_value>
                      created_at: '2023-10-17T14:01:16.318Z'
                      updated_at: '2023-10-17T14:02:20.919291Z'
                      expired_at: '2024-01-17T14:01:16.318Z'
                      permissions:
                        - resource_type: CONNECTOR
                          access_level: MANAGE
                        - resource_type: DESTINATION
                          access_level: MANAGE
                        - resource_type: TRANSFORMATION
                          access_level: MANAGE
                          resource_filter:
                            group_ids:
                              - group_id_3
                              - group_id_4
                        - resource_type: CONNECTOR
                          access_level: NONE
                          resource_filter:
                            ids:
                              - connection_id_3
                              - connection_id_4
  /v1/system-keys/{key_id}/rotate:
    post:
      tags:
        - System Key Management
      summary: Rotate a System Key
      description: Updates the secret value and expired_at date for an existing system key within your Fivetran account.
      operationId: rotate_system_key
      parameters:
        - name: key_id
          in: path
          description: The unique identifier for the system key within your Fivetran account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateSystemKeyRequest'
            examples:
              rotate_request:
                value:
                  name: updated_key
                  permissions:
                    expiration_period: THREE_MONTHS
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: System key with id 'string' has been rotated
                  data:
                    $ref: '#/components/schemas/SystemKeyResponse'
                type: object
              examples:
                rotate_response:
                  value:
                    code: Success
                    message: System key with id 'rushed_fainting' has been rotated
                    data:
                      id: rushed_fainting
                      name: prod_key
                      key: <key_value>
                      secret: <secret_value>
                      created_at: '2023-11-10T19:32:58.646Z'
                      expired_at: '2024-02-10T19:32:58.646Z'
                      permissions:
                        - resource_type: USER
                          access_level: READ
                        - resource_type: WEBHOOK
                          access_level: MANAGE
                        - resource_type: DESTINATION
                          access_level: MANAGE
                        - resource_type: TRANSFORMATION
                          access_level: MANAGE
                          resource_filter:
                            group_ids:
                              - group_id_1
                              - group_id_2
                        - resource_type: CONNECTOR
                          access_level: NONE
                          resource_filter:
                            ids:
                              - connection_id_3
                              - connection_id_4
                        - resource_type: CONNECTOR
                          access_level: MANAGE
components:
  schemas:
    AccountInfoResponse:
      required:
        - account_id
      type: object
      properties:
        account_id:
          type: string
          description: The unique identifier for the account within the Fivetran system.
          example: account_id
        account_name:
          type: string
        user_id:
          type: string
          description: The user ID from the API key. Returned if the user API key is used to authenticate the request.
          example: user_id
        system_key_id:
          type: string
          description: The system ID from the API key. Returned if the system API key is used to authenticate the request.
          example: system_key_id
    RoleResponse:
      required:
        - is_custom
        - is_deprecated
        - name
        - replacement_role_name
        - scope
      type: object
      properties:
        name:
          type: string
          description: The role name
          example: Destination Administrator
        description:
          type: string
          description: The role description
          example: Role Description
        scope:
          uniqueItems: true
          type: array
          description: Defines the list of resources the role manages
          example:
            - DESTINATION
          items:
            type: string
          enum:
            - ACCOUNT
            - DESTINATION
            - CONNECTOR
            - TEAM
        is_custom:
          type: boolean
          description: Defines whether the role is standard or custom
          example: false
        is_deprecated:
          type: boolean
          description: Defines whether the role is deprecated
          example: true
        replacement_role_name:
          type: string
          description: The name of the new role replacing the deprecated role
          example: Manage Destination
    SystemKeyResponse:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the system key within the Fivetran system
          example: key_id
        name:
          type: string
          description: The system key name within the account
          example: MySystemKey
        key:
          type: string
          description: The key value of the system key
          example: ft_rDefAFDSgFdAGdFG
        secret:
          type: string
          description: The secret value of rotated system key
          example: uytFfdSfDADFgfCgFBVsdCSFg4fsGfFg87fhRuuFASuTHkETSfg
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/SystemKeyPermissionResponse'
        created_at:
          type: string
          description: The system key creation timestamp
          format: date-time
          example: '2023-08-20T10:15:20.677566Z'
        updated_at:
          type: string
          description: The system key update timestamp
          format: date-time
          example: '2023-08-20T10:15:20.677566Z'
        expired_at:
          type: string
          description: The system key expiration timestamp
          format: date-time
          example: '2024-08-20T10:15:20.677566Z'
        last_used_at:
          type: string
          description: The timestamp of last usage
          format: date-time
          example: '2023-08-20T10:15:20.677566Z'
    NewSystemKeyRequest:
      type: object
      properties:
        name:
          type: string
          description: The system key name within the account
          example: MySystemKey
        expiration_period:
          type: string
          description: The system key's expiration period
          example: SIX_MONTHS
          enum:
            - ONE_WEEK
            - ONE_MONTH
            - THREE_MONTHS
            - SIX_MONTHS
            - INFINITE
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/SystemKeyPermissionRequest'
    UpdateSystemKeyRequest:
      type: object
      properties:
        name:
          type: string
          description: The system key name within the account
          example: MySystemKey
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/SystemKeyPermissionRequest'
    RotateSystemKeyRequest:
      type: object
      properties:
        expiration_period:
          type: string
          description: The system key's expiration period
          example: SIX_MONTHS
          enum:
            - ONE_WEEK
            - ONE_MONTH
            - THREE_MONTHS
            - SIX_MONTHS
            - INFINITE
    SystemKeyPermissionResponse:
      type: object
      properties:
        resource_type:
          type: string
          description: The resource type for the permission
          example: DESTINATION
          enum:
            - ACCOUNT
            - USER
            - WEBHOOK
            - TEAM
            - ROLES
            - DESTINATION
            - TRANSFORMATION
            - REMOTE_EXECUTION_AGENT
            - CONNECTOR
        access_level:
          type: string
          description: The access level for the permission
          example: MANAGE
          enum:
            - NONE
            - READ
            - MANAGE
        resource_filter:
          $ref: '#/components/schemas/SystemKeyPermissionResourceFilter'
    SystemKeyPermissionRequest:
      type: object
      properties:
        resource_type:
          type: string
          description: The resource type for the permission
          example: CONNECTOR
          enum:
            - ACCOUNT
            - USER
            - WEBHOOK
            - TEAM
            - ROLES
            - DESTINATION
            - TRANSFORMATION
            - REMOTE_EXECUTION_AGENT
            - CONNECTOR
        access_level:
          type: string
          description: The access level for the permission
          example: MANAGE
          enum:
            - NONE
            - READ
            - MANAGE
        resource_filter:
          $ref: '#/components/schemas/SystemKeyPermissionResourceFilter'
    SystemKeyPermissionResourceFilter:
      type: object
      properties:
        ids:
          type: array
          description: The IDs of managed entities
          example: {}
          items:
            type: string
        group_ids:
          type: array
          description: The IDs of managed groups
          example: {}
          items:
            type: string
