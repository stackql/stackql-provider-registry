openapi: 3.0.1
info:
  title: Fivetran External Secrets Managers API
  description: External secrets managers and the entities that use them.
  version: v1
paths:
  /v1/external-secrets-managers:
    get:
      tags:
        - Handling External Secrets Manager (ESM) resources
      summary: List all External Secrets Managers
      description: Returns a list of all External Secrets Manager instances within your Fivetran account.
      operationId: list_esms
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Operation performed successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/SecretsManagerResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
              examples:
                list_response:
                  value:
                    code: Success
                    data:
                      items:
                        - id: lucky_tiger
                          type: AWS_SECRET_MANAGER
                          name: My AWS Secrets Manager
                          is_hybrid_deployment: false
                          created_at: '2024-01-01T00:00:00.000000Z'
                          updated_at: '2024-06-01T00:00:00.000000Z'
                      next_cursor: eyJza2lwIjoyfQ
    post:
      tags:
        - Handling External Secrets Manager (ESM) resources
      summary: Create an External Secrets Manager
      description: Creates a new External Secrets Manager instance within your Fivetran account.
      operationId: create_esm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretsManagerCreateRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Created
                  message:
                    type: string
                    description: Response status text
                    example: External Secrets Manager has been created
                  data:
                    $ref: '#/components/schemas/SecretsManagerResponse'
                type: object
              examples:
                esm_response:
                  value:
                    code: Success
                    data:
                      id: lucky_tiger
                      type: AWS_SECRET_MANAGER
                      name: My AWS Secrets Manager
                      is_hybrid_deployment: false
                      created_at: '2024-01-01T00:00:00.000000Z'
                      updated_at: '2024-06-01T00:00:00.000000Z'
                      config:
                        role_arn: arn:aws:iam::123456789012:role/FivetranRole
                        external_id: fivetran_external_id
        '400':
          description: Validation error
          content:
            application/json:
              examples:
                bad_request:
                  value:
                    code: BadRequest
                    message: ESM config is required.
  /v1/external-secrets-managers-entities:
    get:
      tags:
        - Handling External Secrets Manager (ESM) resources
      summary: List All Entities Using External Secrets Managers
      description: Returns a list of all source connections and destinations that are using any External Secrets Manager within your Fivetran account.
      operationId: list_esm_entities
      parameters:
        - name: esm_id
          in: query
          description: Filter by a specific External Secrets Manager ID.
          required: false
          schema:
            type: string
            example: lucky_tiger
          example: lucky_tiger
        - name: type
          in: query
          description: Filter by entity type. Accepted values are source, destination, or all.
          required: false
          schema:
            type: string
            example: source
          example: source
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Operation performed successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/SecretsManagerEntityItem'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
              examples:
                entities_response:
                  value:
                    code: Success
                    data:
                      items:
                        - id: connection_id
                          type: SOURCE
                          name: my_schema
                          enabled: true
                          secret_manager_id: lucky_tiger
                          created_at: '2024-01-01T00:00:00.000000Z'
                      next_cursor: eyJza2lwIjoyfQ
  /v1/external-secrets-managers/{esm_id}:
    get:
      tags:
        - Handling External Secrets Manager (ESM) resources
      summary: Retrieve External Secrets Manager Details
      description: Returns the details of an existing External Secrets Manager instance.
      operationId: get_esm_details
      parameters:
        - name: esm_id
          in: path
          description: The unique identifier of the External Secrets Manager instance.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Operation performed successfully
                  data:
                    $ref: '#/components/schemas/SecretsManagerResponse'
                type: object
              examples:
                esm_response:
                  value:
                    code: Success
                    data:
                      id: lucky_tiger
                      type: AWS_SECRET_MANAGER
                      name: My AWS Secrets Manager
                      is_hybrid_deployment: false
                      created_at: '2024-01-01T00:00:00.000000Z'
                      updated_at: '2024-06-01T00:00:00.000000Z'
                      config:
                        role_arn: arn:aws:iam::123456789012:role/FivetranRole
                        external_id: fivetran_external_id
        '404':
          description: External Secrets Manager not found
          content:
            application/json:
              examples:
                not_found:
                  value:
                    code: NotFound
                    message: External Secrets Manager with 'lucky_tiger' id is not found.
    delete:
      tags:
        - Handling External Secrets Manager (ESM) resources
      summary: Delete an External Secrets Manager
      description: Deletes an External Secrets Manager instance from your Fivetran account. The instance must not be in use by any source connections or destinations.
      operationId: delete_esm
      parameters:
        - name: esm_id
          in: path
          description: The unique identifier of the External Secrets Manager instance.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Resource deleted successfully
                type: object
              examples:
                delete_successful:
                  value:
                    code: Success
                    message: External Secrets Manager 'lucky_tiger' has been deleted.
        '400':
          description: External Secrets Manager is still in use
          content:
            application/json:
              examples:
                esm_in_use:
                  value:
                    code: BadRequest
                    message: Failed to delete External Secrets Manager with 'lucky_tiger' id, because it is used by 1 connection(s) and 0 destination(s).
        '404':
          description: External Secrets Manager not found
          content:
            application/json:
              examples:
                not_found:
                  value:
                    code: NotFound
                    message: External Secrets Manager with 'lucky_tiger' id is not found.
    patch:
      tags:
        - Handling External Secrets Manager (ESM) resources
      summary: Update an External Secrets Manager
      description: Updates the configuration of an existing External Secrets Manager instance.
      operationId: modify_esm
      parameters:
        - name: esm_id
          in: path
          description: The unique identifier of the External Secrets Manager instance.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretsManagerUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Resource updated successfully
                  data:
                    $ref: '#/components/schemas/SecretsManagerResponse'
                type: object
              examples:
                esm_response:
                  value:
                    code: Success
                    data:
                      id: lucky_tiger
                      type: AWS_SECRET_MANAGER
                      name: My AWS Secrets Manager
                      is_hybrid_deployment: false
                      created_at: '2024-01-01T00:00:00.000000Z'
                      updated_at: '2024-06-01T00:00:00.000000Z'
                      config:
                        role_arn: arn:aws:iam::123456789012:role/FivetranRole
                        external_id: fivetran_external_id
        '400':
          description: Validation error
          content:
            application/json:
              examples:
                bad_request:
                  value:
                    code: BadRequest
                    message: ESM config is required.
        '404':
          description: External Secrets Manager not found
          content:
            application/json:
              examples:
                not_found:
                  value:
                    code: NotFound
                    message: External Secrets Manager with 'lucky_tiger' id is not found.
  /v1/external-secrets-managers/{esm_id}/entities:
    get:
      tags:
        - Handling External Secrets Manager (ESM) resources
      summary: List Entities Using an External Secrets Manager
      description: Returns a list of source connections and destinations that are using a specific External Secrets Manager.
      operationId: get_esm_entities
      parameters:
        - name: esm_id
          in: path
          description: The unique identifier of the External Secrets Manager instance.
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: Filter by entity type. Accepted values are source, destination, or all.
          required: false
          schema:
            type: string
            example: source
          example: source
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Operation performed successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/SecretsManagerEntityItem'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
              examples:
                entities_response:
                  value:
                    code: Success
                    data:
                      items:
                        - id: connection_id
                          type: SOURCE
                          name: my_schema
                          enabled: true
                          secret_manager_id: lucky_tiger
                          created_at: '2024-01-01T00:00:00.000000Z'
                      next_cursor: eyJza2lwIjoyfQ
components:
  schemas:
    SecretsManagerResponse:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the External Secrets Manager instance.
          example: lucky_tiger
        type:
          type: string
          description: The ESM provider type
          example: AWS_SECRET_MANAGER
          enum:
            - AWS_SECRET_MANAGER
            - AZURE_KEY_VAULT
            - HASHICORP_VAULT
        name:
          type: string
          description: The name of the ESM instance
          example: My AWS Secrets Manager
        config:
          type: object
          additionalProperties:
            type: string
            description: (opaque JSON object)
          description: Provider-specific configuration.
        is_hybrid_deployment:
          type: boolean
          description: Whether this External Secrets Manager instance is compatible with Hybrid Deployment environments.
          example: true
        created_at:
          type: string
          description: The timestamp when the ESM instance was created.
          format: date-time
          example: '2026-05-20T00:00:00Z'
        updated_at:
          type: string
          description: The timestamp when the ESM instance was last updated.
          format: date-time
          example: '2026-05-20T00:00:00Z'
    SecretsManagerCreateRequest:
      required:
        - config
        - name
        - type
      type: object
      properties:
        type:
          type: string
          description: 'The ESM provider type. Supported values: AWS_SECRET_MANAGER, AZURE_KEY_VAULT, HASHICORP_VAULT.'
          example: AWS_SECRET_MANAGER
          enum:
            - AWS_SECRET_MANAGER
            - AZURE_KEY_VAULT
            - HASHICORP_VAULT
        name:
          type: string
          description: The name of the External Secrets Manager instance. Must be unique within the account.
          example: My AWS Secrets Manager
        config:
          description: 'Provider-specific configuration object. For AWS_SECRET_MANAGER: role_arn (required). For AZURE_KEY_VAULT: vault_url (required), tenant_id (required for SaaS). For HASHICORP_VAULT: vault_address (required), role_id and secret_id (required for SaaS), namespace (optional).'
          type: string
        is_hybrid_deployment:
          type: boolean
          description: Whether this External Secrets Manager instance is compatible with Hybrid Deployment environments.
          example: false
    SecretsManagerEntityItem:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the source connection or destination.
          example: connection_id
        name:
          type: string
          description: The schema name of the source connection, or the name of the destination group.
          example: my_schema
        enabled:
          type: boolean
          description: Whether the source connection or destination is currently active and connected.
          example: true
        type:
          type: string
          description: 'The type of entity using this External Secrets Manager. Possible values: SOURCE, DESTINATION.'
          example: SOURCE
          enum:
            - SOURCE
            - DESTINATION
        secret_manager_id:
          type: string
          description: The unique identifier of the External Secrets Manager instance.
          example: lucky_tiger
        created_at:
          type: string
          description: Timestamp when the entity was created
          format: date-time
          example: '2024-01-01T00:00:00Z'
      description: An entity (connection or destination) that uses an External Secrets Manager
    SecretsManagerUpdateRequest:
      required:
        - config
      type: object
      properties:
        config:
          description: 'Provider-specific configuration object. For AWS_SECRET_MANAGER: role_arn (required). For AZURE_KEY_VAULT: vault_url (required), tenant_id (required for SaaS). For HASHICORP_VAULT: vault_address (required), role_id and secret_id (required for SaaS), namespace (optional).'
          type: string
    JsonNode:
      type: string
      description: (opaque JSON object)
