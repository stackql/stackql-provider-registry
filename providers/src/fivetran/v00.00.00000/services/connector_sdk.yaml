openapi: 3.0.1
info:
  title: Fivetran Connector SDK API
  description: Connector SDK packages.
  version: v1
paths:
  /v1/connector-sdk/packages:
    get:
      tags:
        - Connector SDK Package Resource
      summary: List All Connector SDK Packages
      description: Returns a list of all Connector SDK packages in your Fivetran account.
      operationId: list_connector_sdk_packages
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connector SDK packages retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/ConnectorSdkPackageResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Connector SDK Package Resource
      summary: Create Connector SDK Package
      description: |
        Uploads a new Connector SDK package to your Fivetran account. The package must be a ZIP file containing your custom connector code. You can create the package ZIP file using the [`fivetran package` command](https://fivetran.com/docs/connector-sdk/connector-development-and-configuration/connector-sdk-commands#fivetranpackage).

        After creating a package, use the standard [Create a Connection endpoint](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection) with the returned `id` as `package_id` in the config.

        > NOTE: Each package can only be associated with one connection at a time.
      operationId: create_connector_sdk_package
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  description: The ZIP file containing the Connector SDK package. (opaque JSON object)
      responses:
        '201':
          description: Package created successfully
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Package created successfully
                  data:
                    $ref: '#/components/schemas/ConnectorSdkPackageResponse'
                type: object
        '400':
          description: Invalid package file or missing file parameter
  /v1/connector-sdk/packages/{package_id}:
    get:
      tags:
        - Connector SDK Package Resource
      summary: Retrieve Connector SDK Package Details
      description: Returns details for a specific Connector SDK package.
      operationId: get_connector_sdk_package
      parameters:
        - name: package_id
          in: path
          description: The unique identifier for the Connector SDK package.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connector SDK package details retrieved successfully
                  data:
                    $ref: '#/components/schemas/ConnectorSdkPackageResponse'
                type: object
        '404':
          description: Package not found
    delete:
      tags:
        - Connector SDK Package Resource
      summary: Delete Connector SDK Package
      description: |
        Permanently deletes a Connector SDK package from your Fivetran account.

        > **Warning:** Packages that are associated with a connection cannot be deleted. You must first delete the connection before deleting the package.
      operationId: delete_connector_sdk_package
      parameters:
        - name: package_id
          in: path
          description: The unique identifier for the Connector SDK package.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package deleted successfully
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Package deleted successfully
                type: object
        '403':
          description: Package is associated with a connection and cannot be deleted
        '404':
          description: Package not found
    patch:
      tags:
        - Connector SDK Package Resource
      summary: Update Connector SDK Package
      description: |
        Updates an existing Connector SDK package by uploading a new version of the connector code.

        Connection using this package will automatically use the updated code on their next sync.
      operationId: update_connector_sdk_package
      parameters:
        - name: package_id
          in: path
          description: The unique identifier for the Connector SDK package.
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  description: The ZIP file containing the Connector SDK package. (opaque JSON object)
      responses:
        '200':
          description: Package updated successfully
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Package updated successfully
                  data:
                    $ref: '#/components/schemas/ConnectorSdkPackageResponse'
                type: object
        '400':
          description: Invalid package file or missing file parameter
        '403':
          description: User is not the package owner or an account administrator
        '404':
          description: Package not found
  /v1/connector-sdk/packages/{package_id}/download:
    get:
      tags:
        - Connector SDK Package Resource
      summary: Download Connector SDK Package
      description: |
        Downloads the connector code package file (code.zip) for a specific Connector SDK package.

        This endpoint returns the raw ZIP file as an octet-stream.
      operationId: download_connector_sdk_package
      parameters:
        - name: package_id
          in: path
          description: The unique identifier for the Connector SDK package.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package file downloaded successfully
          content:
            application/json:
              schema:
                type: string
                description: (opaque JSON object)
        '404':
          description: Package not found
components:
  schemas:
    ConnectorSdkPackageResponse:
      required:
        - created_at
        - created_by
        - id
        - last_updated_by
        - updated_at
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the Connector SDK package.
          example: package_id
        connection_id:
          type: string
          description: The connection identifier associated with this package. Each package can only be associated with one connection at a time. Returns null if the package is not yet associated with any connection.
          example: connection_id
        created_by:
          type: string
          description: The unique identifier of the user who created the package.
          example: user_id
        last_updated_by:
          type: string
          description: The unique identifier of the user who last updated the package.
          example: user_id
        created_at:
          type: string
          description: The timestamp when the package was created.
          format: date-time
          example: '2024-01-14T19:30:00Z'
        updated_at:
          type: string
          description: The timestamp when the package was last updated.
          format: date-time
          example: '2024-01-14T20:15:00Z'
        file_sha256_hash:
          type: string
          description: The SHA-256 hash of the uploaded package file. Used for integrity verification and change detection.
          example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
  x-stackQL-resources:
    packages:
      id: fivetran.connector_sdk.packages
      name: packages
      title: Packages
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1connector-sdk~1packages/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.items
        get:
          operation:
            $ref: '#/paths/~1v1~1connector-sdk~1packages~1{package_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data
        delete:
          operation:
            $ref: '#/paths/~1v1~1connector-sdk~1packages~1{package_id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/packages/methods/get'
          - $ref: '#/components/x-stackQL-resources/packages/methods/list'
        insert: []
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/packages/methods/delete'
        replace: []
servers:
  - url: https://api.fivetran.com
x-stackQL-config:
  pagination:
    requestToken:
      key: cursor
      location: query
    responseToken:
      key: $.data.next_cursor
      location: body
