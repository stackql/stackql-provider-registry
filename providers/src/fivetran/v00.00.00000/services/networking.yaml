openapi: 3.0.1
info:
  title: Fivetran Networking API
  description: Private links and proxy agents.
  version: v1
paths:
  /v1/private-links:
    get:
      tags:
        - Private Link Management
      summary: List All Private Links
      description: Returns a list of all private links.
      operationId: get_private_links
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Private links retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/PrivateLinkResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Private Link Management
      summary: Create a Private Link
      description: |
        Creates a new private link in your Fivetran account. 

        > NOTE: See the [Set Up a Connection With Private Links tutorial](https://fivetran.com/docs/rest-api/tutorials/set-up-connection-with-private-links) to learn how to use this endpoint to set up a [database connection](https://fivetran.com/docs/connectors/databases) with [private networking](https://fivetran.com/docs/using-fivetran/features#privatenetworking).
      operationId: create_private_link
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateLinkCreateRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Private link has been created
                  data:
                    $ref: '#/components/schemas/PrivateLinkResponse'
                type: object
  /v1/private-links/{private_link_id}:
    get:
      tags:
        - Private Link Management
      summary: Retrieve Private Link Details
      description: Returns a private link object if a valid identifier was provided.
      operationId: get_private_link_details
      parameters:
        - name: private_link_id
          in: path
          description: The unique identifier for the private link within the Fivetran system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Private link details retrieved successfully
                  data:
                    $ref: '#/components/schemas/PrivateLinkResponse'
                type: object
        '404':
          description: Private Link not found
    delete:
      tags:
        - Private Link Management
      summary: Delete a Private Link
      description: Deletes a private link from your Fivetran account.
      operationId: delete_private_link
      parameters:
        - name: private_link_id
          in: path
          description: The unique identifier for the private link within the Fivetran system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Private link with id 'string' is marked for deletion
                type: object
        '404':
          description: Private Link not found
    patch:
      tags:
        - Private Link Management
      summary: Update a Private Link
      description: Updates information for an existing private link within your Fivetran account.
      operationId: modify_private_link
      parameters:
        - name: private_link_id
          in: path
          description: The unique identifier for the private link within the Fivetran system
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateLinkUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Private link has been updated
                  data:
                    $ref: '#/components/schemas/PrivateLinkResponse'
                type: object
        '404':
          description: Private Link not found
  /v1/proxy:
    get:
      tags:
        - Proxy Agent Management
      summary: List all Proxy Agents
      description: Returns a list of all proxy agents within your Fivetran account.
      operationId: get_proxy_agent
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Proxy agent retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/ProxyAgentWithCountsResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
              examples:
                get_response_with_counts:
                  value:
                    code: Success
                    data:
                      items:
                        - id: id
                          account_id: account_id
                          registered_at: '2018-12-01T15:43:29.013729Z'
                          region: GCP_US_EAST4
                          created_by: created_by
                          display_name: display_name
                          version: 1.0.0
                          status: CONNECTED
                          connector_count: 3
                          destination_count: 1
                      next_cursor: eyJza2lwIjoyfQ
    post:
      tags:
        - Proxy Agent Management
      summary: Create a Proxy Agent
      description: Creates a new proxy agent within your Fivetran account.
      operationId: create_proxy_agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyParamRequest'
            examples:
              create_payload:
                value:
                  display_name: display_name
                  group_region: GCP_US_EAST4
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Created
                  message:
                    type: string
                    description: Response status text
                    example: Proxy agent has been created
                  data:
                    $ref: '#/components/schemas/ProxyAgentCreatedResponse'
                type: object
        '400':
          description: Group region not supported
          content:
            application/json:
              examples:
                group_region_not_found:
                  value:
                    code: InvalidInput
                    message: Group region not supported.
        '409':
          description: Proxy agent with same name already exists.
          content:
            application/json:
              examples:
                proxy_name_conflict:
                  value:
                    code: Conflict
                    message: Proxy agent with same name already exists.
  /v1/proxy/{agent_id}:
    get:
      tags:
        - Proxy Agent Management
      summary: Retrieve Proxy Agent Details
      description: Retrieves the details of the specified proxy agent.
      operationId: get_proxy_agent_details
      parameters:
        - name: agent_id
          in: path
          description: The unique identifier for the proxy agent within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                  data:
                    $ref: '#/components/schemas/ProxyAgentWithUsageResponse'
              examples:
                get_details_with_usages:
                  value:
                    code: Success
                    data:
                      id: id
                      account_id: account_id
                      registered_at: '2018-12-01T15:43:29.013729Z'
                      region: GCP_US_EAST4
                      created_by: created_by
                      display_name: display_name
                      version: 1.0.0
                      status: CONNECTED
                      usage:
                        - id: connection_id
                          schema: schema
                          service: postgres
        '404':
          description: Proxy Agent not found
          content:
            application/json:
              examples:
                proxy_not_found:
                  value:
                    code: NotFound
                    message: Proxy Agent not found.
    delete:
      tags:
        - Proxy Agent Management
      summary: Delete a Proxy Agent
      description: Deletes the specified proxy agent from your Fivetran account.
      operationId: delete_proxy_agent
      parameters:
        - name: agent_id
          in: path
          description: The unique identifier for the proxy agent within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Agent string successfully deleted
                type: object
              examples:
                delete_successful:
                  value:
                    code: Success
                    message: Agent <proxy> successfully deleted.
        '404':
          description: Proxy agent not found.
          content:
            application/json:
              examples:
                proxy_not_found:
                  value:
                    code: NotFound
                    message: Proxy Agent not found.
        '409':
          description: Proxy agent have attached connections.
          content:
            application/json:
              examples:
                proxy_has_connections:
                  value:
                    code: Conflict
                    message: Proxy agent have attached connections.
  /v1/proxy/{agent_id}/connections:
    get:
      tags:
        - Proxy Agent Management
      summary: List All Connections Attached to the Proxy Agent
      description: Returns all connections attached to the specified proxy agent within your Fivetran account.
      operationId: get_proxy_agent_connections
      parameters:
        - name: agent_id
          in: path
          description: The unique identifier for the proxy agent within the Fivetran system.
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Proxy agent connections retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/ProxyIntegrationResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
              examples:
                get_connections_response:
                  value:
                    code: Success
                    data:
                      items:
                        - connection_id: connection_id
                      next_cursor: eyJza2lwIjoyfQ
        '404':
          description: Proxy Agent not found
          content:
            application/json:
              examples:
                proxy_not_found:
                  value:
                    code: NotFound
                    message: Proxy Agent not found.
  /v1/proxy/{agent_id}/regenerate-secrets:
    post:
      tags:
        - Proxy Agent Management
      summary: Regenerate Secrets for Proxy Agent
      description: Regenerate secrets for proxy agent within your Fivetran account.
      operationId: regenerate_secrets_proxy_agent
      parameters:
        - name: agent_id
          in: path
          description: The unique identifier for the proxy agent within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Created
                  message:
                    type: string
                    description: Response status text
                    example: Proxy agent secrets have been regenerated
                  data:
                    $ref: '#/components/schemas/ProxyAgentCreatedResponse'
                type: object
        '404':
          description: Proxy agent not found.
          content:
            application/json:
              examples:
                proxy_not_found:
                  value:
                    code: NotFound
                    message: Proxy Agent not found.
components:
  schemas:
    PrivateLinkResponse:
      required:
        - cloud_provider
        - config
        - created_at
        - created_by
        - id
        - name
        - region
        - service
        - state
        - state_summary
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the private link within the Fivetran system.
          example: private_link_id
        name:
          type: string
          description: Private link name
          example: PrivateLinkName
        region:
          type: string
          description: Data processing location. This is where Fivetran will operate and run computation on data.
          example: AWS_US_EAST_1
          enum:
            - GCP_US_EAST4
            - GCP_US_WEST1
            - GCP_US_CENTRAL1
            - GCP_EUROPE_WEST3
            - GCP_AUSTRALIA_SOUTHEAST1
            - GCP_NORTHAMERICA_NORTHEAST1
            - GCP_EUROPE_WEST2
            - GCP_ASIA_SOUTHEAST1
            - GCP_ASIA_SOUTHEAST2
            - GCP_ASIA_SOUTH1
            - GCP_ASIA_NORTHEAST1
            - GCP_ASIA_NORTHEAST3
            - GCP_ME_CENTRAL2
            - AWS_US_EAST_1
            - AWS_US_EAST_2
            - AWS_US_WEST_2
            - AWS_AP_NORTHEAST_1
            - AWS_AP_NORTHEAST_2
            - AWS_AP_SOUTHEAST_1
            - AWS_AP_SOUTHEAST_2
            - AWS_EU_CENTRAL_1
            - AWS_EU_NORTH_1
            - AWS_EU_WEST_1
            - AWS_EU_WEST_2
            - AWS_EU_WEST_3
            - AWS_AP_SOUTH_1
            - AWS_CA_CENTRAL_1
            - AWS_US_GOV_WEST_1
            - AZURE_EASTUS2
            - AZURE_AUSTRALIAEAST
            - AZURE_UKSOUTH
            - AZURE_WESTEUROPE
            - AZURE_CENTRALUS
            - AZURE_CANADACENTRAL
            - AZURE_UAENORTH
            - AZURE_SOUTHEASTASIA
            - AZURE_EASTUS
            - AZURE_JAPANEAST
            - AZURE_CENTRALINDIA
            - AZURE_GERMANYWESTCENTRAL
            - AZURE_WESTUS3
            - AZURE_SWITZERLANDNORTH
            - AZURE_KOREACENTRAL
        service:
          type: string
          description: The name for the service type within the Fivetran system.
          example: DATABRICKS
          enum:
            - DATABRICKS_AWS
            - SNOWFLAKE_AWS
            - REDSHIFT_AWS
            - SOURCE_AWS
            - DATABRICKS_AZURE
            - SNOWFLAKE_AZURE
            - ONELAKE_AZURE
            - POSTGRES_WAREHOUSE_AZURE
            - SQL_DATA_WAREHOUSE_AZURE
            - SOURCE_AZURE
            - SNOWFLAKE_GCP
            - SOURCE_GCP
            - DATABRICKS_GCP
        state:
          type: string
          description: Private link state
          example: OK
          enum:
            - CREATING
            - UPDATING
            - DESTROYING
            - OK
            - FAIL
        host:
          type: string
          description: The DNS name of the PrivateLink endpoint service.
          example: example.host.com
        account_id:
          type: string
        cloud_provider:
          type: string
          description: Private link cloud provider
          example: AWS
          enum:
            - AWS
            - GCP
            - AZURE
        created_at:
          type: string
          description: The timestamp of the time the private link was created in your account
          format: date-time
          example: '2023-12-01T15:43:29.013729Z'
        created_by:
          type: string
          description: The actor who created the private link
          example: user_id
        state_summary:
          type: string
          description: Private link state summary
          example: ...
        resource_upstream_status:
          type: string
          description: The upstream status of the PrivateLink resource as reported by the cloud provider.
          example: IDLE
        config:
          type: object
          additionalProperties: true
          description: The `config` object for the `service` in question (a JSON value; its keys depend on the `service`). The accepted keys per type are documented in the vendor's API reference and returned by the connector metadata endpoints.
    PrivateLinkCreateRequest:
      required:
        - config
        - name
        - region
        - service
      type: object
      properties:
        name:
          type: string
          description: Private link name
          example: PrivateLinkName
        region:
          type: string
          description: Data processing location. This is where Fivetran will operate and run computation on data.
          example: GCP_US_EAST4
          enum:
            - GCP_US_EAST4
            - GCP_US_WEST1
            - GCP_US_CENTRAL1
            - GCP_EUROPE_WEST3
            - GCP_AUSTRALIA_SOUTHEAST1
            - GCP_NORTHAMERICA_NORTHEAST1
            - GCP_EUROPE_WEST2
            - GCP_ASIA_SOUTHEAST1
            - GCP_ASIA_SOUTHEAST2
            - GCP_ASIA_SOUTH1
            - GCP_ASIA_NORTHEAST1
            - GCP_ASIA_NORTHEAST3
            - GCP_ME_CENTRAL2
            - AWS_US_EAST_1
            - AWS_US_EAST_2
            - AWS_US_WEST_2
            - AWS_AP_NORTHEAST_1
            - AWS_AP_NORTHEAST_2
            - AWS_AP_SOUTHEAST_1
            - AWS_AP_SOUTHEAST_2
            - AWS_EU_CENTRAL_1
            - AWS_EU_NORTH_1
            - AWS_EU_WEST_1
            - AWS_EU_WEST_2
            - AWS_EU_WEST_3
            - AWS_AP_SOUTH_1
            - AWS_CA_CENTRAL_1
            - AWS_US_GOV_WEST_1
            - AZURE_EASTUS2
            - AZURE_AUSTRALIAEAST
            - AZURE_UKSOUTH
            - AZURE_WESTEUROPE
            - AZURE_CENTRALUS
            - AZURE_CANADACENTRAL
            - AZURE_UAENORTH
            - AZURE_SOUTHEASTASIA
            - AZURE_EASTUS
            - AZURE_JAPANEAST
            - AZURE_CENTRALINDIA
            - AZURE_GERMANYWESTCENTRAL
            - AZURE_WESTUS3
            - AZURE_SWITZERLANDNORTH
            - AZURE_KOREACENTRAL
        service:
          type: string
          description: The name for the service type within the Fivetran system.
          example: DATABRICKS
          enum:
            - DATABRICKS_AWS
            - SNOWFLAKE_AWS
            - REDSHIFT_AWS
            - SOURCE_AWS
            - DATABRICKS_AZURE
            - SNOWFLAKE_AZURE
            - ONELAKE_AZURE
            - POSTGRES_WAREHOUSE_AZURE
            - SQL_DATA_WAREHOUSE_AZURE
            - SOURCE_AZURE
            - SNOWFLAKE_GCP
            - SOURCE_GCP
            - DATABRICKS_GCP
        config:
          type: object
          additionalProperties: true
          description: The `config` object for the `service` in question (a JSON value; its keys depend on the `service`). The accepted keys per type are documented in the vendor's API reference and returned by the connector metadata endpoints.
    PrivateLinkUpdateRequest:
      type: object
      properties:
        config:
          type: object
          additionalProperties: true
          description: The `config` object for the `service` in question (a JSON value; its keys depend on the `service`). The accepted keys per type are documented in the vendor's API reference and returned by the connector metadata endpoints.
    ProxyAgentWithCountsResponse:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the proxy agent within the Fivetran system.
          example: id
        account_id:
          type: string
          description: Fivetran Account ID.
          example: account_id
        registered_at:
          type: string
          description: The timestamp of the time the proxy agent was created in your account.
          format: date-time
          example: '2018-12-01T15:43:29.013729Z'
        region:
          type: string
          description: Data processing location. This is where Fivetran will operate and run computation on data.
          example: GCP_US_EAST4
          enum:
            - GCP_US_EAST4
            - GCP_US_WEST1
            - GCP_US_CENTRAL1
            - GCP_EUROPE_WEST3
            - GCP_AUSTRALIA_SOUTHEAST1
            - GCP_NORTHAMERICA_NORTHEAST1
            - GCP_EUROPE_WEST2
            - GCP_ASIA_SOUTHEAST1
            - GCP_ASIA_SOUTHEAST2
            - GCP_ASIA_SOUTH1
            - GCP_ASIA_NORTHEAST1
            - GCP_ASIA_NORTHEAST3
            - GCP_ME_CENTRAL2
            - AWS_US_EAST_1
            - AWS_US_EAST_2
            - AWS_US_WEST_2
            - AWS_AP_NORTHEAST_1
            - AWS_AP_NORTHEAST_2
            - AWS_AP_SOUTHEAST_1
            - AWS_AP_SOUTHEAST_2
            - AWS_EU_CENTRAL_1
            - AWS_EU_NORTH_1
            - AWS_EU_WEST_1
            - AWS_EU_WEST_2
            - AWS_EU_WEST_3
            - AWS_AP_SOUTH_1
            - AWS_CA_CENTRAL_1
            - AWS_US_GOV_WEST_1
            - AZURE_EASTUS2
            - AZURE_AUSTRALIAEAST
            - AZURE_UKSOUTH
            - AZURE_WESTEUROPE
            - AZURE_CENTRALUS
            - AZURE_CANADACENTRAL
            - AZURE_UAENORTH
            - AZURE_SOUTHEASTASIA
            - AZURE_EASTUS
            - AZURE_JAPANEAST
            - AZURE_CENTRALINDIA
            - AZURE_GERMANYWESTCENTRAL
            - AZURE_WESTUS3
            - AZURE_SWITZERLANDNORTH
            - AZURE_KOREACENTRAL
        created_by:
          type: string
          description: The actor who created the proxy agent.
          example: created_by
        display_name:
          type: string
          description: Proxy agent name.
          example: display_name
        version:
          type: string
          description: The version of the proxy agent.
          example: 1.0.0
        status:
          type: string
          description: The connection status of the proxy agent.
          example: CONNECTED
          enum:
            - NOT_FOUND
            - CONNECTED
            - NOT_CONNECTED
        connector_count:
          type: integer
          description: The number of source connections using the proxy agent.
          format: int32
          example: 3
        destination_count:
          type: integer
          description: The number of destinations using the proxy agent.
          format: int32
          example: 1
    ProxyParamRequest:
      type: object
      properties:
        display_name:
          type: string
          description: Proxy agent name.
          example: display_name
        group_region:
          type: string
          description: Data processing location. This is where Fivetran will operate and run computation on data (optional).
          example: GCP_US_EAST4
          enum:
            - GCP_US_EAST4
            - GCP_US_WEST1
