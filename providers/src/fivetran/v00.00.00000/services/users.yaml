openapi: 3.0.1
info:
  title: Fivetran Users API
  description: Users, API keys, and group and connection memberships.
  version: v1
paths:
  /v1/users:
    get:
      tags:
        - User Management
      summary: List All Users
      description: Returns a list of all users within your Fivetran account.
      operationId: list_all_users
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
        - name: active
          in: query
          description: Indicates whether to return only enabled users (true) or not (false). By default, both enabled (allowed to log in) and suspended users are returned.
          required: false
          schema:
            type: boolean
            example: true
          example: true
        - name: user_type
          in: query
          description: 'The type of user. Possible values: `REGULAR_USER`: A human user who can log in to the Fivetran dashboard and interact with the API, and `SERVICE_ACCOUNT`: A non-human identity for machine-to-machine API access that cannot log in to the dashboard.'
          required: false
          schema:
            type: string
            example: SERVICE_ACCOUNT
          example: SERVICE_ACCOUNT
        - name: has_api_key
          in: query
          description: 'Indicates whether the user has an assigned API key, including expired keys. Accepted values: `true` or `false`.'
          required: false
          schema:
            type: string
            example: 'true'
          example: 'true'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Users list retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/UserResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - User Management
      summary: Invite a User
      description: |
        Creates a new user in your Fivetran account.

        For a regular user, an invitation email is sent, and the user must accept it before gaining access; their details are accessible through the API in the meantime.

        For a service account, the user gets created immediately with no invitation or email validation required.

        > Note: A service account user can't create another service account user.
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUserRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User has been created
                  data:
                    $ref: '#/components/schemas/UserResponse'
                type: object
        '400':
          description: Bad request
  /v1/users/api-keys:
    get:
      tags:
        - User Management
      summary: List All API Keys
      description: Returns a paginated list of API keys for all users within your Fivetran account.
      operationId: list_api_keys
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
        - name: user_type
          in: query
          description: 'The type of user. Possible values: `REGULAR_USER`: A human user who can log in to the Fivetran dashboard and interact with the API, and `SERVICE_ACCOUNT`: A non-human identity for machine-to-machine API access that cannot log in to the dashboard.'
          required: false
          schema:
            type: string
            example: SERVICE_ACCOUNT
          example: SERVICE_ACCOUNT
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: API keys have been listed
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/ApiKeyResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
  /v1/users/{user_id}:
    delete:
      tags:
        - User Management
      summary: Delete a User
      description: Deletes a user from your Fivetran account. You will be unable to delete an account owner user if there is only one remaining.
      operationId: delete_user
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User with id 'string' has been deleted
                type: object
        '404':
          description: Not found error
    get:
      tags:
        - User Management
      summary: Retrieve User Details
      description: Returns a user object if a valid identifier was provided.
      operationId: user_details
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User details retrieved successfully
                  data:
                    $ref: '#/components/schemas/UserResponse'
                type: object
        '404':
          description: User not found
    patch:
      tags:
        - User Management
      summary: Update a User
      description: Updates information for an existing user within your Fivetran account.
      operationId: modify_user
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User has been updated
                  data:
                    $ref: '#/components/schemas/UserResponse'
                type: object
        '404':
          description: User not found
  /v1/users/{user_id}/api-keys:
    get:
      tags:
        - User Management
      summary: Retrieve User API Key
      description: Returns the API key details for the specified service account.
      operationId: get_user_api_key
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User API key has been retrieved
                  data:
                    $ref: '#/components/schemas/ApiKeyResponse'
                type: object
        '404':
          description: User not found
    post:
      tags:
        - User Management
      summary: Create Service Account API Key
      description: |
        Creates a new API key for the specified service account. The secret is
        returned once at creation and cannot be retrieved again.

        > Note: Only a regular user can perform this operation.
      operationId: create_user_api_key
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: API key has been created
                  data:
                    $ref: '#/components/schemas/CreateApiKeyResponse'
                type: object
        '400':
          description: Bad request
        '404':
          description: User not found
    delete:
      tags:
        - User Management
      summary: Delete API Keys
      description: |
        Deletes all API keys for the specified user.

        > Note: Only a regular user can perform this operation.
      operationId: delete_user_api_keys
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: API key deleted for service account user with id='string'
                type: object
        '404':
          description: User not found
  /v1/users/{user_id}/api-keys/rotate:
    post:
      tags:
        - User Management
      summary: Rotate Service Account API Key
      description: |
        Rotates the API key for the specified service account and generates a new secret.

        During the optional overlap period, both the old and new secrets remain valid, allowing zero-downtime credential rotation.

        > Note: Only a regular user can perform this operation.
      operationId: rotate_user_api_key
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateApiKeyRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: API key rotated successfully
                  data:
                    $ref: '#/components/schemas/RotateApiKeyResponse'
                type: object
        '400':
          description: Bad request
        '404':
          description: User not found
  /v1/users/{user_id}/connections:
    get:
      tags:
        - User Management
      summary: List All Connection Memberships
      description: Returns all connection membership for a user within your Fivetran account.
      operationId: get_user_memberships_in_connections
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User memberships in connections retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/MembershipResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - User Management
      summary: Add a Connection Membership
      description: Adds a connection membership
      operationId: add_user_membership_in_connection
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest_add_user_membership_in_connection'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection membership has been created
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
        '404':
          description: User not found
  /v1/users/{user_id}/connections/{connection_id}:
    get:
      tags:
        - User Management
      summary: Retrieve Connection Membership
      description: Returns the details of a user's membership in a connection.
      operationId: get_user_membership_in_connections
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User membership in connection retrieved successfully
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
        '404':
          description: User not found
    delete:
      tags:
        - User Management
      summary: Delete Connection Membership
      description: Removes user membership in a connection.
      operationId: delete_user_membership_in_connection
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection membership has been deleted
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
        '404':
          description: User not found
    patch:
      tags:
        - User Management
      summary: Update Connection Membership
      description: Updates user membership in a connection.
      operationId: update_user_membership_in_connection
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRequest_update_user_membership_in_connection'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection membership has been updated
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
        '404':
          description: User not found
  /v1/users/{user_id}/groups:
    get:
      tags:
        - User Management
      summary: List All Group Memberships
      description: Returns the membership details for all groups a user belongs to.
      operationId: get_user_memberships_in_groups
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User memberships in groups retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/MembershipResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - User Management
      summary: Add Group Membership
      description: Adds a user membership in a group.
      operationId: add_user_membership_in_group
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMembershipRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group membership has been created
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
        '400':
          description: Bad request
        '404':
          description: User not found
  /v1/users/{user_id}/groups/{group_id}:
    get:
      tags:
        - User Management
      summary: Retrieve Group Membership Details
      description: Returns details of a user membership in group.
      operationId: get_user_membership_in_group
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User membership in group retrieved successfully
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
                type: object
        '404':
          description: User not found
    delete:
      tags:
        - User Management
      summary: Delete Group Membership
      description: Removes user from a group.
      operationId: delete_user_membership_in_group
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group membership has been deleted
                type: object
        '404':
          description: User not found
    patch:
      tags:
        - User Management
      summary: Update Group Membership
      description: Updates user group membership.
      operationId: update_user_membership_in_group
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRequest_update_user_membership_in_group'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group membership has been updated
                type: object
        '404':
          description: User not found
  /v1/users/{user_id}/role:
    delete:
      tags:
        - User Management
      summary: Delete Account Role
      description: Removes a user's role from an account, but the user remains a member of the account.
      operationId: delete_user_membership_in_account
      parameters:
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User role in account has been removed
                type: object
        '404':
          description: User not found
components:
  schemas:
    UserResponse:
      required:
        - active
        - created_at
        - email
        - id
        - logged_in_at
        - role
        - verified
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the user within the Fivetran system.
          example: user_id
        email:
          type: string
          description: 'The email address that the user has associated with their user profile. Optional for service accounts (`user_type: SERVICE_ACCOUNT`).'
          example: user@email.value
        verified:
          type: boolean
          description: The field indicates whether the user has verified their email address in the account creation process.
          example: true
        invited:
          type: boolean
          description: The field indicates whether the user has been invited to your account.
          example: true
        picture:
          type: string
