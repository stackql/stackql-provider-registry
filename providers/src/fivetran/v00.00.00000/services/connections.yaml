            - blocked_on_capture
            - ready
        is_historical_sync:
          type: boolean
          description: The boolean specifying whether the connection should be triggered to re-sync all historical data. If you set this parameter to TRUE, a [historical sync](https://fivetran.com/docs/getting-started/glossary#historicalsync) starts immediately. If a sync is currently running, it's canceled and restarted as a historical sync. All subsequent syncs after the historical sync completes will be incremental. If the value is FALSE or not specified, the connection doesn't re-sync historical data. This parameter is automatically reset to FALSE once the historical sync is completed.
          example: true
        schedule_type:
          type: string
          description: 'The connection schedule configuration type. Supported values: auto, manual'
          example: auto
          enum:
            - auto
            - manual
        run_setup_tests:
          type: boolean
          description: Specifies whether the setup tests should be run automatically after updating the connection. The default value is TRUE. When using this parameter in a PATCH request, you must also include at least one persistent configuration parameter (e.g., `sync_frequency`, `paused`, `config`, `auth`). This parameter can be combined with `trust_certificates` or `trust_fingerprints` to automatically approve `certificates/fingerprints` during the test run. To run setup tests without making configuration changes, use the POST `/v1/connections/{connectionId}/test` endpoint instead.
          example: true
        networking_method:
          type: string
          enum:
            - Directly
            - PrivateLink
            - SshTunnel
            - ProxyAgent
        hybrid_deployment_agent_id:
          type: string
          description: The unique identifier for the hybrid deployment agent within the Fivetran system. If not specified, the agent ID from the destination will be used
          example: hybrid_deployment_agent_id
        proxy_agent_id:
          type: string
          description: The unique identifier for the proxy agent within the Fivetran system
          example: proxy_agent_id
        private_link_id:
          type: string
          description: The unique identifier for the self-served private link that is used by the connection
          example: private_link_id
        destination_configuration:
          $ref: '#/components/schemas/DestinationConfiguration'
        external_secrets_manager_id:
          type: string
          description: The unique identifier of the [External Secrets Manager](https://fivetran.com/docs/rest-api/api-reference/external-secrets-managers) instance. Connector service must [support](https://fivetran.com/docs/core-concepts/features/external-secret-managers#connectors) External Secrets Manager feature to use this field.
        external_secrets_keys_config:
          description: The setup configuration keys to be stored in external secrets manager. Check possible config formats in [create method](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection/)
    ConnectCardConfigRequest:
      required:
        - connect_card_config
      type: object
      properties:
        connect_card_config:
          description: Configuration for the Connect Card flow. Connect Card is a Fivetran-hosted UI that allows your end users to authorize a connection without accessing the Fivetran dashboard. Use `redirect_uri` to control where users land after completing setup.
          required:
            - redirect_uri
          type: object
          properties:
            redirect_uri:
              type: string
              description: The URI on your site we redirect the end user to after successful setup. The URI must start with the `https` or `http` prefix.
              example: https://your.site/path
            hide_setup_guide:
              type: boolean
              description: An optional parameter that lets you hide the embedded setup guide in the Connect Card.
              example: true
            all_fields:
              type: boolean
              description: An optional parameter that lets you show all fields on Connect Card including those that are hidden by default for certain connectors.
              example: true
    ConnectorConnectCardResponse:
      required:
        - connector_id
      type: object
      properties:
        connector_id:
          type: string
          description: The unique identifier of the connection for which this Connect Card token was issued. This is the same value as the `connectionId` path parameter.
          example: connection_id
        connect_card:
          $ref: '#/components/schemas/ConnectCardResponse'
        connect_card_config:
          $ref: '#/components/schemas/ConnectCardConfig'
    MoveConnectionsRequest:
      required:
        - destination_group_id
      type: object
      properties:
        destination_group_id:
          type: string
          description: The unique identifier of the destination group to move the connection to. Retrieve group IDs from the [List All Groups](https://fivetran.com/docs/rest-api/api-reference/groups/list-all-groups) endpoint.
          example: destination_group_id
        sync_behavior:
          type: string
          description: Controls how data syncs after the move. Use `CONTINUE` to preserve the existing sync cursor so the connection resumes incremental sync from where it left off. Use `BACKFILL` to reset the cursor and trigger a historical sync. Use `CONTINUE_WITH_DATA` to preserve the cursor and additionally migrate existing data to the new destination by starting an asynchronous job—use the `job_id` returned in the response to monitor progress. `CONTINUE_WITH_DATA` is supported only when moving a connection from Snowflake Native tables to a MDLS-linked Snowflake Lakehouse destination.
          example: CONTINUE
          enum:
            - CONTINUE
            - BACKFILL
            - CONTINUE_WITH_DATA
        force_move:
          type: boolean
          description: Set to `true` to confirm that you have completed all prerequisite steps for moving connectors with credential dependencies. Required when moving connectors whose credentials reference the source group—for example, connectors with AWS IAM external IDs or GCP service account credentials. The error response for affected connectors describes the required steps.
          example: true
    MoveConnectionsResponse:
      required:
        - connection_id
        - destination_group_id
        - source_group_id
        - sync_behavior
      type: object
      properties:
        connection_id:
          type: string
          description: The unique identifier of the connection that was moved.
          example: connection_id
        source_group_id:
          type: string
          description: The unique identifier of the destination group the connection was moved from.
          example: source_group_id
        destination_group_id:
          type: string
          description: The unique identifier of the destination group to move the connection to. Retrieve group IDs from the [List All Groups](https://fivetran.com/docs/rest-api/api-reference/groups/list-all-groups) endpoint.
          example: destination_group_id
        sync_behavior:
          type: string
          description: Controls how data syncs after the move. Use `CONTINUE` to preserve the existing sync cursor so the connection resumes incremental sync from where it left off. Use `BACKFILL` to reset the cursor and trigger a historical sync. Use `CONTINUE_WITH_DATA` to preserve the cursor and additionally migrate existing data to the new destination by starting an asynchronous job—use the `job_id` returned in the response to monitor progress. `CONTINUE_WITH_DATA` is supported only when moving a connection from Snowflake Native tables to a MDLS-linked Snowflake Lakehouse destination.
          example: CONTINUE
          enum:
            - CONTINUE
            - BACKFILL
            - CONTINUE_WITH_DATA
        moved_at:
          type: string
          description: The timestamp of when the connection was moved. Null when `sync_behavior` is `CONTINUE_WITH_DATA` (since the move runs asynchronously).
          format: date-time
          example: '2024-01-01T00:00:00Z'
        job_id:
          type: string
          description: The unique identifier of the move job. Use this value to check the status of the move operation.
          example: 01234567-89ab-cdef-0123-456789abcdef
    MoveConnectionJobResponse:
      required:
        - connection_id
        - created_at
        - destination_group_id
        - id
        - source_group_id
        - status
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the move job. Use this value to check the status of the move operation.
          example: 01234567-89ab-cdef-0123-456789abcdef
        status:
          type: string
          description: 'The current status of the move job. Possible values: PENDING, IN_PROGRESS, SUCCESS, FAILED.'
          example: IN_PROGRESS
          enum:
            - PENDING
            - IN_PROGRESS
            - SUCCESS
            - FAILED
        connection_id:
          type: string
          description: The unique identifier of the connection that was moved.
          example: connection_id
        source_group_id:
          type: string
          description: The unique identifier of the destination group the connection was moved from.
          example: source_group_id
        destination_group_id:
          type: string
          description: The unique identifier of the destination group to move the connection to. Retrieve group IDs from the [List All Groups](https://fivetran.com/docs/rest-api/api-reference/groups/list-all-groups) endpoint.
          example: destination_group_id
        created_at:
          type: string
          description: The timestamp of when the move job was created.
          format: date-time
          example: '2024-01-01T00:00:00Z'
        started_at:
          type: string
          description: The timestamp of when the move job started processing. Null if the job has not started yet.
          format: date-time
          example: '2024-01-01T00:00:30Z'
        completed_at:
          type: string
          description: The timestamp of when the move job completed (successfully or with failure). Null if the job has not completed yet.
          format: date-time
          example: '2024-01-01T00:05:00Z'
        error_message:
          type: string
          description: The error message if the move job failed. Null if the job has not failed.
          example: Error details if the job failed
    ResyncConnectorRequest:
      type: object
      properties:
        scope:
          type: object
          properties:
            schema:
              title: Schema name
              uniqueItems: true
              type: array
              description: Schema name
              example:
                - table1
                - table2
              items:
                type: string
          description: |
            A map where each key is a schema name and each value is a non-empty array of table names to re-sync within that schema.
            Both the scope object and each schema's table array must be non-empty — an empty scope object or an empty table array returns 400.
            If omitted or set to null, all schemas and tables of the connection are re-synced.
            This parameter is only supported for connectors that support table-level re-sync (typically database connectors such as PostgreSQL, MySQL, and Oracle). Sending scope to an unsupported connector type (for example, Google Sheets) returns 400.
            Retrieve valid schema and table names from GET /v1/connections/{connectionId}/schemas.
    StandardConfigResponse:
      required:
        - schema_change_handling
        - schemas
      type: object
      properties:
        enable_new_by_default:
          type: boolean
          description: The boolean value specifying whether to enable new schemas, tables, and columns by default
          example: true
        schemas:
          title: Schemas
          type: object
          properties:
            schema:
              $ref: '#/components/schemas/SchemaConfigResponse'
          description: The set of schemas within your connection schema config. Each key is the schema name as stored in the connection schema config. Schema names are case-sensitive; an incorrect case results in an HTTP 404 error.
        row_filtering_supported:
          type: boolean
          description: A boolean value that specifies whether row filtering is available for the tables in this connection. It is `true` only when the row filtering feature is enabled for the connection, the connector type supports row filtering. It is `false` when the connector type does not support row filtering. This field is omitted from the response when the row filtering feature is not enabled for the connection.
          example: true
        schema_change_handling:
          type: string
          description: 'The possible values for the schema_change_handling parameter are as follows: <br /> - `ALLOW_ALL` - all new schemas, tables, and columns which appear in the source after the initial setup are included in syncs <br /> - `ALLOW_COLUMNS` - all new schemas and tables which appear in the source after the initial setup are excluded from syncs, but new columns are included <br /> - `BLOCK_ALL` - all new schemas, tables, and columns which appear in the source after the initial setup are excluded from syncs'
          example: ALLOW_ALL
          enum:
            - ALLOW_ALL
            - ALLOW_COLUMNS
            - BLOCK_ALL
    StandardConfigCreateRequest:
      required:
        - schemas
      type: object
      properties:
        schemas:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SchemaUpdateRequest'
          description: The set of schemas within your connection schema config. Each key is the schema name as stored in the connection schema config. Schema names are case-sensitive; an incorrect case results in an HTTP 404 error.
          example:
            schema_name:
              enabled: true
              tables:
                table_name:
                  enabled: true
                  columns:
                    column_name:
                      enabled: true
        schema_change_handling:
          type: string
          description: 'The possible values for the schema_change_handling parameter are as follows: <br /> - `ALLOW_ALL` - all new schemas, tables, and columns which appear in the source after the initial setup are included in syncs <br /> - `ALLOW_COLUMNS` - all new schemas and tables which appear in the source after the initial setup are excluded from syncs, but new columns are included <br /> - `BLOCK_ALL` - all new schemas, tables, and columns which appear in the source after the initial setup are excluded from syncs'
          example: ALLOW_COLUMNS
          enum:
            - ALLOW_ALL
            - ALLOW_COLUMNS
            - BLOCK_ALL
    StandardConfigUpdateRequest:
      type: object
      properties:
        schemas:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SchemaUpdateRequest'
          description: The set of schemas within your connection schema config. Each key is the schema name as stored in the connection schema config. Schema names are case-sensitive; an incorrect case results in an HTTP 404 error.
          example:
            schema_name:
              enabled: true
              tables:
                table_name:
                  enabled: true
                  columns:
                    column_name:
                      enabled: true
        schema_change_handling:
          type: string
          description: 'The possible values for the schema_change_handling parameter are as follows: <br /> - `ALLOW_ALL` - all new schemas, tables, and columns which appear in the source after the initial setup are included in syncs <br /> - `ALLOW_COLUMNS` - all new schemas and tables which appear in the source after the initial setup are excluded from syncs, but new columns are included <br /> - `BLOCK_ALL` - all new schemas, tables, and columns which appear in the source after the initial setup are excluded from syncs'
          example: BLOCK_ALL
          enum:
            - ALLOW_ALL
            - ALLOW_COLUMNS
            - BLOCK_ALL
        is_type_locked:
          type: boolean
          description: The boolean value specifying whether the connection's destination data types are locked to the types determined from the source. If enabled before or immediately after the initial sync, the [type lock](https://fivetran.com/docs/using-fivetran/features/type-locking) captures the types determined at the initial sync; if enabled later, it captures the types determined on the first sync after enabling. Re-enabling an already-enabled lock does not change previously locked types.
          example: false
    DropColumnsRequest:
      required:
        - schemas
      type: object
      properties:
        schemas:
          title: Schemas
          type: object
          properties:
            schema:
              $ref: '#/components/schemas/DropColumnSchemaRequest'
          description: The set of schemas within your connection schema config. Each key is the schema name as stored in the connection schema config. Schema names are case-sensitive; an incorrect case results in an HTTP 404 error.
    ReloadStandardConfigRequest:
      type: object
      properties:
        exclude_mode:
          type: string
          description: |
            Specifies whether all schemas and tables will be enabled or disabled in the standard config. By specifying the `exclude_mode` parameter value, you can enable or disable syncing for all schemas and tables when reloading the connection schema config.

            When the default `PRESERVE` value is set, all selected schemas and tables in the standard config preserve their state.

            When the `EXCLUDE` value is set, the columns that haven't been updated by user yet are not excluded from the sync. Such columns may be present in the source and not displayed in the response, but they are considered to be included in the sync by default. If you enable syncing of their table, then all of these columns from the source will be synced in the next sync cycle. See also [Troubleshooting: How to enable syncs only for the columns you need](https://fivetran.com/docs/rest-api/tutorials/enable-sync-for-columns-you-need).
          example: PRESERVE
    SchemaUpdateRequest:
      required:
        - enabled
      type: object
      properties:
        enabled:
          type: boolean
          description: The boolean value specifying whether the sync for the table into the destination is enabled.
          example: true
        tables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TableUpdateRequest'
          description: The set of tables within your database schema config. Each key is the table name as stored in the connection schema config. Table names are case-sensitive; an incorrect case results in an HTTP 404 error.
    TableUpdateRequest:
      required:
        - enabled
      type: object
      properties:
        enabled:
          type: boolean
          description: The boolean value specifying whether the sync for the table into the destination is enabled.
          example: true
        columns:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ColumnUpdateRequest'
          description: The set of columns within your table schema config. Each key is the column name as stored in the connection schema config. Column names are case-sensitive; an incorrect case results in an HTTP 404 error. The `columns` object in the response contains the columns whose `enabled` value has been set by the user after the initial sync.
        sync_mode:
          type: string
          description: This field appears in the response if the connection supports switching sync modes for tables
          example: SOFT_DELETE
          enum:
            - SOFT_DELETE
            - HISTORY
            - LIVE
        row_filter:
          description: 'The [row filter](https://fivetran.com/docs/core-concepts/features/row-filter) for the table. A row filter restricts the rows synced to your destination to those that satisfy its clauses. This field uses three-state semantics: <br /> - `Absent` (the `row_filter` key is omitted from the request): The table''s existing row filter is left unchanged. <br /> - `null` (the `row_filter` key is present with a JSON null value): The table''s existing row filter, if any, is deleted. <br /> - `Object`: The provided object creates or replaces (upserts) the table''s existing row filter. <br /> Row filtering must be available for the connection; see the `row_filtering_supported` response field.'
          example:
            name: active_us_orders
            description: Sync only active orders created on or after 2024 for US and Canadian customers
            column_clauses:
              - column: status
                column_type: STRING
                operator: EQUALS
                values:
                  - ACTIVE
              - column: country
                column_type: STRING
                operator: IN
                values:
                  - US
                  - CA
              - column: created_at
                column_type: DATETIME
                operator: GREATER_OR_EQUALS
                values:
                  - '2024-01-01T00:00:00Z'
          type: object
          properties:
            name:
              type: string
              description: A human-readable name for the row filter. Required when a row filter object is provided (upsert).
              example: active_orders
            description:
              type: string
              description: A human-readable description for the row filter. Required when a row filter object is provided (upsert).
              example: Sync only active orders
            operator:
              type: string
              description: The logical operator applied to the column clauses. `AND` means a row is synced only when it satisfies every clause; `OR` means a row is synced when it satisfies at least one clause. If omitted, defaults to `AND`. Only valid when `column_clauses` contains 2 or more clauses; setting it explicitly on a single-clause filter returns an error. For a single-clause filter, omit this field.
              example: AND
              enum:
                - AND
                - OR
            column_clauses:
              maxItems: 10
              minItems: 0
              type: array
              description: The list of column clauses that make up the row filter. Clauses are combined according to the `operator` field (defaults to AND when omitted). The list must contain 1 to 10 clauses. If `operator` is explicitly set to `AND` or `OR`, the list must contain at least 2 clauses; for a single-clause filter, omit `operator` rather than setting it explicitly.
              items:
                $ref: '#/components/schemas/RowFilterClauseDto'
          nullable: true
    ColumnUpdateRequest:
      required:
        - enabled
      type: object
      properties:
        enabled:
          type: boolean
          description: The boolean value specifying whether the sync for the table into the destination is enabled.
          example: true
        hashed:
          type: boolean
          description: The boolean value specifying whether a column should be hashed
          example: false
        is_primary_key:
          type: boolean
        target_data_type:
          type: string
          description: The target data type for this column in the destination. Overrides Fivetran's default type mapping. Available target types depend on the column's source data type and destination. Set to null to remove an existing mapping and revert to the default.
          example: String
          enum:
            - Unknown
            - Boolean
            - String
            - Short
            - Int
            - Long
            - Float
            - Double
            - BigDecimal
            - Instant
            - LocalDateTime
            - LocalDate
            - LocalTime
            - Json
            - Binary
            - Xml
    TableColumnsConfigResponse:
      required:
        - columns
      type: object
      properties:
        columns:
          title: Columns
          type: object
          properties:
            column:
              $ref: '#/components/schemas/ColumnConfigResponse'
          description: The set of columns within your table schema config. Each key is the column name as stored in the connection schema config. Column names are case-sensitive; an incorrect case results in an HTTP 404 error. The `columns` object in the response contains the columns whose `enabled` value has been set by the user after the initial sync.
    ConnectorStateResponse:
      required:
        - state
      type: object
      properties:
        state:
          type: string
          description: A freeform JSON object representing the connector's cursor or internal state. The structure is defined by the connector implementation and varies by connector type. Returns 400 if no state has been written yet. (opaque JSON object)
          example:
            cursor: '2024-01-01T00:00:00Z'
    UpdateFunctionOrConnectorSdkState:
      type: object
      properties:
        state:
          description: A freeform JSON object representing the connector's cursor or internal state to write. The structure is defined by the connector implementation and varies by connector type. If omitted or set to null, the existing state is preserved and the response returns 200 without modification.
          example:
            cursor: '2024-01-01T00:00:00Z'
          type: string
    SyncConnectorRequest:
      type: object
      properties:
        force:
          type: boolean
          description: If force is true and the connection is currently syncing, it will stop the sync and re-run it. If force is false, the connection will sync only if it isn't currently syncing. The default value is false
          example: true
    ConnectorSyncHistoryResponse:
      required:
        - stages
        - status
        - sync_id
      type: object
      properties:
        start:
          type: string
          description: The UTC timestamp of when the sync started, in ISO 8601 format. Null if the sync has not started yet.
        end:
          type: string
          description: The UTC timestamp of when the sync finished, in ISO 8601 format. Null if the sync is still in progress.
        status:
          type: string
          description: 'The outcome of the sync. Possible values: `COMPLETED`, `FAILURE`, `CANCELED`, `INCOMPLETE`, `RESCHEDULED`, `PAUSED`.'
        reason:
          type: string
          description: The failure reason if the sync did not complete successfully. Omitted if the sync completed without errors.
        stages:
          description: The data volume processed in each stage of the sync pipeline.
          type: object
          properties:
            extract:
              description: Data volume metrics for the extract stage, in which data is read from the source system.
              type: object
              properties:
                volume:
                  type: number
                  description: The volume of data processed in this stage, in megabytes. Null if volume data is not available for this stage.
                  format: double
            process:
              description: Data volume metrics for the process stage, in which data is transformed and prepared for loading.
              type: object
              properties:
                volume:
                  type: number
                  description: The volume of data processed in this stage, in megabytes. Null if volume data is not available for this stage.
                  format: double
            load:
              description: Data volume metrics for the load stage, in which data is written to the destination.
              type: object
              properties:
                volume:
                  type: number
                  description: The volume of data processed in this stage, in megabytes. Null if volume data is not available for this stage.
                  format: double
        sync_id:
          type: string
          description: The unique identifier of the sync.
    RunSetupTestsRequest:
      type: object
      properties:
        trust_certificates:
          type: boolean
          description: Specifies whether we should trust the certificate automatically during setup tests. The default value is FALSE. This parameter only affects the behavior of setup tests and does not persist in the connection configuration. When using the PATCH endpoint to update a connection, this parameter must be combined with `run_setup_tests=true` and at least one persistent configuration parameter (e.g., `sync_frequency`, `paused`, `config`, `auth`). If you only want to run setup tests with automatic certificate trust, use the POST `/v1/connections/{connectionId}/test` endpoint instead. If a certificate is not trusted automatically during testing, it has to be approved with [Certificates Management API Approve a destination certificate](https://fivetran.com/docs/rest-api/certificates#approveadestinationcertificate).
          example: true
        trust_fingerprints:
          type: boolean
          description: Specifies whether we should trust the SSH fingerprint automatically during setup tests. The default value is FALSE. This parameter only affects the behavior of setup tests and does not persist in the connection configuration. When using the PATCH endpoint to update a connection, this parameter must be combined with `run_setup_tests=true` and at least one persistent configuration parameter (e.g., `sync_frequency`, `paused`, `config`, `auth`). If you only want to run setup tests with automatic fingerprint trust, use the POST `/v1/connections/{connectionId}/test` endpoint instead. If a fingerprint is not trusted automatically during testing, it has to be approved with [Certificates Management API Approve a destination fingerprint](https://fivetran.com/docs/rest-api/certificates#approveadestinationfingerprint).
          example: true
    ConnectionWarningsResponse:
      required:
        - items
      type: object
      properties:
        items:
          type: array
          description: Array of warnings grouped by destination table
          items:
            $ref: '#/components/schemas/TableWarnings'
        next_cursor:
          type: string
          description: Pagination cursor for the next page of results
          example: next_cursor_value
    ConnectorStatusResponse:
      required:
        - is_historical_sync
        - setup_state
        - sync_state
        - update_state
      type: object
      properties:
        tasks:
          type: array
          description: The collection of tasks for the connection
          items:
            $ref: '#/components/schemas/ConnectionTask'
        warnings:
          type: array
          description: The collection of warnings for the connection
          items:
            $ref: '#/components/schemas/ConnectionWarning'
        setup_state:
          type: string
          description: 'The current setup state of the connection. The available values are: <br /> - incomplete - the setup config is incomplete, the setup tests never succeeded <br /> - connected - the connection is properly set up <br /> - broken - the connection setup config is broken.'
          example: connected
        schema_status:
          type: string
          description: Schema status. Returned only for connectors that support [Universal Column Masking flow](https://fivetran.com/docs/rest-api/tutorials/schema-status).
          example: ready
        sync_state:
          type: string
          description: 'The current sync state of the connection. The available values are: <br /> - scheduled - the sync is waiting to be run <br /> - syncing - the sync is currently running <br /> - paused - the sync is currently paused <br /> - rescheduled - the sync is waiting until more API calls are available in the source service.'
          example: scheduled
        update_state:
          type: string
          description: 'The current data update state of the connection. The available values are: <br /> - on_schedule - the sync is running smoothly, no delays <br /> - delayed - the data is delayed for a longer time than expected for the update.'
          example: delayed
        is_historical_sync:
          type: boolean
          description: The boolean specifying whether the connection should be triggered to re-sync all historical data. If you set this parameter to TRUE, a [historical sync](https://fivetran.com/docs/getting-started/glossary#historicalsync) starts immediately. If a sync is currently running, it's canceled and restarted as a historical sync. All subsequent syncs after the historical sync completes will be incremental. If the value is FALSE or not specified, the connection doesn't re-sync historical data. This parameter is automatically reset to FALSE once the historical sync is completed.
          example: false
        rescheduled_for:
          type: string
          description: The UTC timestamp of the next scheduled sync attempt. Non-null only when `sync_state` is `"rescheduled"`. If `schedule_type` is `manual`, the connection expects the sync to be triggered at the designated time through the [Sync Connection Data](https://fivetran.com/docs/rest-api/api-reference/connections/sync-connection) endpoint.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
    ConnectorSchedule:
      type: object
      properties:
        cron:
          type: string
        interval:
          type: integer
          description: The sync interval in minutes
          format: int32
          example: 360
        schedule_type:
          type: string
          description: 'The schedule type. Possible values: INTERVAL, TIME_OF_DAY'
          example: INTERVAL
          enum:
            - TIME_OF_DAY
            - INTERVAL
            - CRON
            - MANUAL
        days_of_week:
          uniqueItems: true
          type: array
          description: The days of the week on which the connection syncs
          example:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          items:
            type: string
            enum:
              - MONDAY
              - TUESDAY
              - WEDNESDAY
              - THURSDAY
              - FRIDAY
              - SATURDAY
              - SUNDAY
        time_of_day:
          type: string
    SetupTestResultResponse:
      required:
        - status
        - title
      type: object
      properties:
        title:
          type: string
          description: 'A human-readable name for the setup test step. For example: Validate Login, Test Connection, Check Permissions.'
          example: Validate Login
        status:
          type: string
          description: 'The result of the individual setup test step. Possible values: PASSED, FAILED, SKIPPED.'
          example: FAILED
          enum:
            - PASSED
            - SKIPPED
            - WARNING
            - FAILED
            - JOB_FAILED
        message:
          type: string
          description: 'The result message for the setup test step. For example: Invalid login credentials.'
          example: Invalid login credentials.
        details:
          type: string
          description: Additional diagnostic information about the setup test result. Populated when the status is FAILED and more context is available beyond the message. (opaque JSON object)
          example: Authentication failed (401 Unauthorized). Verify the provided credentials and permissions.
    ConnectCardResponse:
      type: object
      properties:
        token:
          type: string
          description: A short-lived JWT that authorizes the end user to configure this connection via the Connect Card interface. Use the `uri` field directly to redirect users — it already embeds this token. If you need to construct your own URL, pass this value as the `auth` query parameter to `https://fivetran.com/connect-card/setup`.
          example: eyJ0e...
        uri:
          type: string
          description: The complete URL to redirect the end user to in order to authorize the connection. It embeds the auth token, redirect URI, and setup guide visibility as query parameters. Redirect the user directly to this address.
          example: https://fivetran.com/connect-card/setup?redirect_uri=https://your.site/path&auth=eyJ0e...&hide_setup_guide=true
    ConnectCardConfig:
      required:
        - redirect_uri
      type: object
      properties:
        redirect_uri:
          type: string
          description: The URI on your site we redirect the end user to after successful setup. The URI must start with the `https` or `http` prefix.
          example: https://your.site/path
        hide_setup_guide:
          type: boolean
          description: An optional parameter that lets you hide the embedded setup guide in the Connect Card.
          example: true
        all_fields:
          type: boolean
          description: An optional parameter that lets you show all fields on Connect Card including those that are hidden by default for certain connectors.
          example: true
    DestinationConfiguration:
      type: object
      properties:
        virtual_warehouse:
          type: string
          description: Snowflake's virtual warehouse used in the connection
          example: virtual_warehouse
    JsonNode:
      type: string
      description: (opaque JSON object)
    SchemaConfigResponse:
      required:
        - enabled
        - name_in_destination
        - tables
      type: object
      properties:
        name_in_destination:
          type: string
          description: The schema name within your destination in accordance with Fivetran conventional rules
          example: schema_name_in_destination
        enabled:
          type: boolean
          description: The boolean value specifying whether the sync for the table into the destination is enabled.
          example: true
        tables:
          title: Tables
          type: object
          properties:
            table:
              $ref: '#/components/schemas/TableConfigResponse'
          description: The set of tables within your database schema config. Each key is the table name as stored in the connection schema config. Table names are case-sensitive; an incorrect case results in an HTTP 404 error.
    DropColumnSchemaRequest:
      required:
        - tables
      type: object
      properties:
        tables:
          title: Tables
          type: object
          properties:
            table:
              $ref: '#/components/schemas/DropColumnsTableRequest'
          description: The set of tables within your database schema config. Each key is the table name as stored in the connection schema config. Table names are case-sensitive; an incorrect case results in an HTTP 404 error.
    RowFilterDto:
      type: object
      properties:
        name:
          type: string
          description: A human-readable name for the row filter. Required when a row filter object is provided (upsert).
          example: active_orders
        description:
          type: string
          description: A human-readable description for the row filter. Required when a row filter object is provided (upsert).
          example: Sync only active orders
        operator:
          type: string
          description: The logical operator applied to the column clauses. `AND` means a row is synced only when it satisfies every clause; `OR` means a row is synced when it satisfies at least one clause. If omitted, defaults to `AND`. Only valid when `column_clauses` contains 2 or more clauses; setting it explicitly on a single-clause filter returns an error. For a single-clause filter, omit this field.
          example: AND
          enum:
            - AND
            - OR
        column_clauses:
          maxItems: 10
          minItems: 0
          type: array
          description: The list of column clauses that make up the row filter. Clauses are combined according to the `operator` field (defaults to AND when omitted). The list must contain 1 to 10 clauses. If `operator` is explicitly set to `AND` or `OR`, the list must contain at least 2 clauses; for a single-clause filter, omit `operator` rather than setting it explicitly.
          items:
            $ref: '#/components/schemas/RowFilterClauseDto'
      nullable: true
    ColumnConfigResponse:
      required:
        - enabled
        - enabled_patch_settings
        - hashed
        - name_in_destination
      type: object
      properties:
        name_in_destination:
          type: string
          description: The schema name within your destination in accordance with Fivetran conventional rules
          example: column_name_in_destination
        enabled:
          type: boolean
          description: The boolean value specifying whether the sync for the table into the destination is enabled.
          example: true
        hashed:
          type: boolean
          description: The boolean value specifying whether a column should be hashed
          example: false
        enabled_patch_settings:
          $ref: '#/components/schemas/ColumnEnabledPatchSettings'
        is_primary_key:
          type: boolean
        target_data_type:
          type: string
          description: The target data type for this column in the destination. Overrides Fivetran's default type mapping. Available target types depend on the column's source data type and destination. Set to null to remove an existing mapping and revert to the default.
          example: String
    Stages:
      type: object
      properties:
        extract:
          description: Data volume metrics for the extract stage, in which data is read from the source system.
          type: object
          properties:
            volume:
              type: number
              description: The volume of data processed in this stage, in megabytes. Null if volume data is not available for this stage.
              format: double
        process:
          description: Data volume metrics for the process stage, in which data is transformed and prepared for loading.
          type: object
          properties:
            volume:
              type: number
              description: The volume of data processed in this stage, in megabytes. Null if volume data is not available for this stage.
              format: double
        load:
          description: Data volume metrics for the load stage, in which data is written to the destination.
          type: object
          properties:
            volume:
              type: number
              description: The volume of data processed in this stage, in megabytes. Null if volume data is not available for this stage.
              format: double
    TableWarnings:
      required:
        - warnings
      type: object
      properties:
        schema:
          type: string
          description: The destination schema name. Omitted for warnings that are not scoped to a specific table.
          example: my_schema
        table:
          type: string
          description: The destination table name. Omitted for warnings that are not scoped to a specific table.
          example: my_table
        warnings:
          type: array
          description: List of warnings for this table
          items:
            $ref: '#/components/schemas/ConnectionWarningItem'
    ConnectionTask:
      type: object
      properties:
        code:
          type: string
          description: A machine-readable identifier for the condition type. Use this value to programmatically detect and respond to specific connection conditions.
        message:
          type: string
          description: 'A human-readable label describing the condition. For example: Reconnect, Resync Table Warning.'
        details:
          type: string
          description: Additional context about this condition beyond the message field.
    ConnectionWarning:
      type: object
      properties:
        code:
          type: string
          description: A machine-readable identifier for the condition type. Use this value to programmatically detect and respond to specific connection conditions.
        message:
          type: string
          description: 'A human-readable label describing the condition. For example: Reconnect, Resync Table Warning.'
        details:
          type: string
          description: Additional context about this condition beyond the message field.
    TableConfigResponse:
      required:
        - columns
        - enabled
        - enabled_patch_settings
        - name_in_destination
        - supports_columns_config
        - supports_history_mode
      type: object
      properties:
        sync_mode:
          type: string
          description: This field appears in the response if the connection supports switching sync modes for tables
          example: SOFT_DELETE
          enum:
            - SOFT_DELETE
            - HISTORY
            - LIVE
        name_in_destination:
          type: string
          description: The schema name within your destination in accordance with Fivetran conventional rules
          example: table_name_in_destination
        enabled:
          type: boolean
          description: The boolean value specifying whether the sync for the table into the destination is enabled.
          example: true
        columns:
          title: Columns
          type: object
          properties:
            column:
              $ref: '#/components/schemas/ColumnConfigResponse'
          description: The set of columns within your table schema config. Each key is the column name as stored in the connection schema config. Column names are case-sensitive; an incorrect case results in an HTTP 404 error. The `columns` object in the response contains the columns whose `enabled` value has been set by the user after the initial sync.
        enabled_patch_settings:
          $ref: '#/components/schemas/TableEnabledPatchSettings'
        supports_columns_config:
          type: boolean
          description: A boolean value that specifies if the table supports a column-level configuration.
          example: true
        supports_history_mode:
          type: boolean
          description: The boolean value that specifies if the table supports history mode.
          example: true
        row_filter:
          description: The row filter configured for the table. Omitted when no row filter is configured for the table. The clauses are combined according to the `operator` field; `OR` is returned explicitly, while the default `AND` is represented by an omitted `operator` field. Row filtering must be available for the connection; see the `row_filtering_supported` response field.
          type: object
          properties:
            name:
              type: string
              description: A human-readable name for the row filter. Required when a row filter object is provided (upsert).
              example: active_orders
            description:
              type: string
              description: A human-readable description for the row filter. Required when a row filter object is provided (upsert).
              example: Sync only active orders
            operator:
              type: string
              description: The logical operator applied to the column clauses. `AND` means a row is synced only when it satisfies every clause; `OR` means a row is synced when it satisfies at least one clause. If omitted, defaults to `AND`. Only valid when `column_clauses` contains 2 or more clauses; setting it explicitly on a single-clause filter returns an error. For a single-clause filter, omit this field.
              example: AND
              enum:
                - AND
                - OR
            column_clauses:
              maxItems: 10
              minItems: 0
              type: array
              description: The list of column clauses that make up the row filter. Clauses are combined according to the `operator` field (defaults to AND when omitted). The list must contain 1 to 10 clauses. If `operator` is explicitly set to `AND` or `OR`, the list must contain at least 2 clauses; for a single-clause filter, omit `operator` rather than setting it explicitly.
              items:
                $ref: '#/components/schemas/RowFilterClauseDto'
          nullable: true
        parent_table:
          type: string
          description: The name of the table that this table is grouped under, if any. This field appears in the response only for tables that belong to a group (for example, a core table's child tables).
          example: core_table_name
    DropColumnsTableRequest:
      required:
        - columns
      type: object
      properties:
        columns:
          type: array
          description: The set of columns within your table schema config. Each key is the column name as stored in the connection schema config. Column names are case-sensitive; an incorrect case results in an HTTP 404 error. The `columns` object in the response contains the columns whose `enabled` value has been set by the user after the initial sync.
          items:
            type: string
    RowFilterClauseDto:
      required:
        - column_type
        - operator
        - values
      type: object
      properties:
        column:
          maxLength: 500
          minLength: 0
          type: string
          description: The name of the source column the clause applies to. Maximum 500 characters.
          example: status
        operator:
          type: string
          description: 'The operator applied to the column. The operator must be compatible with `column_type`, and the number of `values` required depends on the operator: <br /> - `EQUALS`, `NOT_EQUALS` - valid for `LONG`, `FLOAT`, `DOUBLE`, `BIGDECIMAL`, `DATE`, `DATETIME`, and `STRING`; require exactly 1 value. <br /> - `LESS`, `LESS_OR_EQUALS`, `GREATER`, `GREATER_OR_EQUALS` - valid for `LONG`, `FLOAT`, `DOUBLE`, `BIGDECIMAL`, `DATE`, `DATETIME`, and `STRING`; require exactly 1 value. <br /> - `STARTS_WITH`, `CONTAINS` - valid for `STRING` only; require exactly 1 value. <br /> - `IN` - valid for `LONG`, `STRING`, `FLOAT`, and `DOUBLE` only; require at least 1 value. <br /> - `IS_NULL`, `IS_NOT_NULL` - valid for all types; require no values.'
          example: EQUALS
          enum:
            - EQUALS
            - NOT_EQUALS
            - LESS
            - LESS_OR_EQUALS
            - GREATER
            - GREATER_OR_EQUALS
            - STARTS_WITH
            - CONTAINS
            - IN
            - IS_NULL
            - IS_NOT_NULL
        values:
          type: array
          description: 'The list of values the operator compares against. Each value is a string of at most 1,000 characters; the API parses it according to column_type. The number of values must match the operator: exactly 1 for the comparison and string operators, at least 1 for `IN`, and 0 for `IS_NULL` and `IS_NOT_NULL`. For the `IN` operator on a STRING column, the combined length of all values must not exceed 10,000 characters.'
          example:
            - ACTIVE
          items:
            maxLength: 1000
            minLength: 0
            type: string
        column_type:
          type: string
          description: 'The data type of the column. It determines which operators are valid and the required format of each value: <br /> - `LONG` - integer types (short, int, long). <br /> - `FLOAT` - single-precision floating-point number. <br /> - `DOUBLE` - double-precision floating-point number. <br /> - `BIGDECIMAL` - arbitrary-precision decimal number; each value is capped at 50 characters. <br /> - `STRING` - text. <br /> - `BOOLEAN` - accepts only the string values `true` or `false` (lowercase). <br /> - `DATE` - a date with no time component, in `yyyy-MM-dd` format (for example, `2024-01-01`). <br /> - `DATETIME` - a UTC timestamp ending in `Z`, in `yyyy-MM-ddTHH:mm:ssZ` format (for example, `2024-01-01T00:00:00Z`). Offsets other than `Z` are not accepted.'
          example: STRING
          enum:
            - LONG
            - FLOAT
            - DOUBLE
            - BIGDECIMAL
            - STRING
            - BOOLEAN
            - DATE
            - DATETIME
    ColumnEnabledPatchSettings:
      required:
        - allowed
      type: object
      properties:
        allowed:
          type: boolean
          description: The boolean value specifying whether the enabled property can be updated
          example: false
        reason:
          type: string
          description: The additional message indicating the reason why the enabled property cannot be updated. This field appears in the response only when the reason_code value is OTHER
          example: ...
        reason_code:
          type: string
          description: 'The reason code indicating the reason why the enabled property cannot be updated: <br /> SYSTEM_TABLE - the table is a system table <br /> DELETED - the table was deleted in the source <br /> OTHER - the table was excluded by the system for some reason <br /> This field appears in the response when the allowed property value is FALSE'
          example: SYSTEM_COLUMN
          enum:
            - SYSTEM_COLUMN
            - DELETED
            - OTHER
    Stage:
      type: object
      properties:
        volume:
          type: number
          description: The volume of data processed in this stage, in megabytes. Null if volume data is not available for this stage.
          format: double
    ConnectionWarningItem:
      required:
        - code
        - created_at
        - message
      type: object
      properties:
        code:
          type: string
          description: A machine-readable identifier for the condition type. Use this value to programmatically detect and respond to specific connection conditions.
        message:
          type: string
          description: 'A human-readable label describing the condition. For example: Reconnect, Resync Table Warning.'
        error_message:
          type: string
          description: Additional error details extracted from the warning
          example: Connection refused
        created_at:
          type: string
          description: ISO 8601 timestamp when the warning was created
          format: date-time
          example: '2024-03-17T12:31:40.870504Z'
    TableEnabledPatchSettings:
      required:
        - allowed
      type: object
      properties:
        allowed:
          type: boolean
          description: The boolean value specifying whether the enabled property can be updated
          example: false
        reason:
          type: string
          description: The additional message indicating the reason why the enabled property cannot be updated. This field appears in the response only when the reason_code value is OTHER
          example: ...
        reason_code:
          type: string
          description: 'The reason code indicating the reason why the enabled property cannot be updated: <br /> SYSTEM_TABLE - the table is a system table <br /> DELETED - the table was deleted in the source <br /> OTHER - the table was excluded by the system for some reason <br /> This field appears in the response when the allowed property value is FALSE'
          example: SYSTEM_TABLE
          enum:
            - SYSTEM_TABLE
            - DELETED
            - OTHER
