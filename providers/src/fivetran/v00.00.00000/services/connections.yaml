openapi: 3.0.1
info:
  title: Fivetran Connections API
  description: 'Connections (formerly connectors): lifecycle, sync and resync, state, sync history, warnings, and the schema, table and column configuration.'
  version: v1
paths:
  /v1/connections:
    get:
      tags:
        - Connection Management
      summary: List All Connections
      description: Returns a list of all accessible connections within your Fivetran account.
      operationId: list_connections
      parameters:
        - name: group_id
          in: query
          description: Filter the list to connections belonging to this group. Retrieve group IDs from the [List All Groups](https://fivetran.com/docs/rest-api/api-reference/groups/list-all-groups) endpoint.
          required: false
          schema:
            type: string
            example: group_id
          example: group_id
        - name: schema
          in: query
          description: Filter the list to connections whose schema name matches this value. Partial matches are not supported.
          required: false
          schema:
            type: string
            example: schema
          example: schema
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connections list retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/ConnectorResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
        '401':
          description: Unauthorized error
        '405':
          description: Method not allowed error
        '406':
          description: Not acceptable error
    post:
      tags:
        - Connection Management
      summary: Create a Connection
      description: |-
        Creates a new connection within a specified group in your Fivetran account. Runs setup tests and returns testing results. <br />
        > IMPORTANT: The `destination_schema_names` field will soon become a required field. Make sure to include it in your API requests when creating new connections to prevent future disruptions.
        > IMPORTANT: If you want to get the fingerprint details, do not set `trust_fingerprints` to `true` when you create a connection with our REST API. We can only provide the fingerprint details through the failed SSH Tunnel Connection setup test. For a full walkthrough, see [Get Connection Fingerprint Details](https://fivetran.com/docs/rest-api/tutorials/get-connection-fingerprint-details).
      operationId: create_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConnectorRequestV1'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection has been created
                  data:
                    $ref: '#/components/schemas/ConnectorResponseV1'
                type: object
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found error
        '406':
          description: Not acceptable
        '409':
          description: Conflict
        '415':
          description: Unsupported media type
  /v1/connections/{connection_id}:
    get:
      tags:
        - Connection Management
      summary: Retrieve Connection Details
      description: Returns a connection configuration and status details if a valid identifier was provided.
      operationId: connection_details
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection details retrieved successfully
                  data:
                    $ref: '#/components/schemas/ConnectorResponseV1'
                type: object
        '401':
          description: Unauthorized error
        '404':
          description: Not found error
        '405':
          description: Method not allowed error
        '406':
          description: Not acceptable error
    delete:
      tags:
        - Connection Management
      summary: Delete a Connection
      description: Deletes a connection from your Fivetran account.
      operationId: delete_connection
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection with id 'string' has been deleted
                type: object
        '404':
          description: Not found error
    patch:
      tags:
        - Connection Management
      summary: Update a Connection
      description: |
        Updates connection parameters for an existing connection within your Fivetran account.

        This endpoint requires at least one persistent configuration parameter to be specified (e.g., `sync_frequency`, `paused`, `config`, `auth`, `daily_sync_time`, `schema_status`).

        > IMPORTANT: Parameters like `trust_certificates`, `trust_fingerprints`, and `run_setup_tests` are test-control parameters that affect only the behavior of setup tests during the update and do not persist in the connection configuration; they cannot be used on their own. If you want to run setup tests without making configuration changes, use the POST `/v1/connections/{connectionId}/test` endpoint instead.
      operationId: modify_connection
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectorRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection has been updated
                  data:
                    $ref: '#/components/schemas/ConnectorResponseV1'
                type: object
        '404':
          description: Not found error
  /v1/connections/{connection_id}/connect-card:
    post:
      tags:
        - Connection Management
      summary: Create a Connect Card
      description: Generates the Connect Card URI for the connection
      operationId: connect_card
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectCardConfigRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection Connect Card has been created
                  data:
                    $ref: '#/components/schemas/ConnectorConnectCardResponse'
                type: object
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found error
        '406':
          description: Not acceptable
        '415':
          description: Unsupported media type
  /v1/connections/{connection_id}/move:
    post:
      tags:
        - Connection Management
      summary: Move a Connection
      description: 'Moves a connection from its current destination group to a different destination group. The connection must be paused before calling this endpoint. Use `sync_behavior` to control how data syncs after the move: `CONTINUE` preserves the existing sync cursor so the connection resumes incremental sync from where it left off; `BACKFILL` resets the cursor and triggers a historical sync; `CONTINUE_WITH_DATA` preserves the cursor and additionally migrates existing data to the new destination by starting an asynchronous job. Use the `job_id` returned in the response to monitor progress via the move-connection-job-status endpoint. `CONTINUE_WITH_DATA` is supported only when moving a connection from Snowflake Native tables to a MDLS-linked Snowflake Lakehouse destination.'
      operationId: connection_moved
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveConnectionsRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection moved successfully
                  data:
                    $ref: '#/components/schemas/MoveConnectionsResponse'
                type: object
        '400':
          description: Bad request error
        '401':
          description: Unauthorized error
        '404':
          description: Not found error
        '406':
          description: Not acceptable error
        '415':
          description: Unsupported media type error
  /v1/connections/{connection_id}/move/{job_id}:
    get:
      tags:
        - Connection Management
      summary: Retrieve Move Connection Job Status
      description: Retrieves the status of an asynchronous connection move job. Use this endpoint to monitor the progress of a connection move operation that was initiated with the `CONTINUE_WITH_DATA` sync behavior.
      operationId: connection_moved_job_status
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
        - name: job_id
          in: path
          description: The unique identifier of the move job. This is returned in the response when you initiate a connection move.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Move connection job status retrieved successfully
                  data:
                    $ref: '#/components/schemas/MoveConnectionJobResponse'
                type: object
        '400':
          description: Bad request error
        '401':
          description: Unauthorized error
        '404':
          description: Not found error
  /v1/connections/{connection_id}/resync:
    post:
      tags:
        - Connection Management
      summary: Re-sync Connection Data (Historical Sync)
      description: Triggers a full historical sync of a connection or multiple schema tables within a connection. If the connection is paused, the table sync will be scheduled to be performed when the connection is re-enabled. If there is a data sync already in progress, we will try to complete it. If it fails, the request will be declined and the HTTP 409 Conflict error will be returned.
      operationId: resync_connection
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResyncConnectorRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Sync has been successfully triggered for connection with id 'string'
                type: object
        '400':
          description: Bad request error. Returned when the scope object is empty, a schema key maps to an empty table array, or the connector does not support table-level re-sync.
        '401':
          description: Unauthorized error
        '404':
          description: Not found error
        '405':
          description: Method not allowed error
        '406':
          description: Not acceptable error
        '409':
          description: Conflict error. Returned when a data sync is already in progress and cannot be completed before the re-sync can be scheduled.
        '415':
          description: Unsupported media type error
  /v1/connections/{connection_id}/schemas:
    get:
      tags:
        - Connection Schema Management
      summary: Retrieve a Connection Schema Config
      description: |

        Returns the top-level schema configuration for an existing connection within your Fivetran account. The response includes global flags, every schema, each table, and only the columns that were explicitly overridden. 

        Use this endpoint to read the current data-selection tree for a connection, to back up the schema before making edits, or to copy the configuration to another connection.

        > NOTE: To restore a backed-up schema or copy the configuration to another connection, use the [Update a Connection Schema Config](https://fivetran.com/docs/rest-api/api-reference/connection-schema/modify-connection-schema-config) endpoint.

        For more information, see the [Connection Schema config](https://fivetran.com/docs/rest-api/tutorials/connection-schema-configuration-use-cases) tutorial.

        > NOTE: Unedited columns (those following table defaults) are omitted from the response. For a read-only cataloging workflow, walk this response from schemas to tables, inspect each table's `supports_columns_config` field, and call the [Retrieve Source Table Columns Config](https://fivetran.com/docs/rest-api/api-reference/connection-schema/connection-column-config) endpoint only for tables where that field is `true`.

        For the NetSuite SuiteAnalytics, and Salesforce and Salesforce Sandbox connectors, the 'schemas' map field contains a single entry with the 'netsuite' or 'salesforce' key, respectively. For the 'schema.name_in_destination` name field, these connectors always return the destination schema name you set in the connection setup form.

        For more information on using this API endpoint with the the Oracle Fusion Cloud Applications connectors, see the [Schema information documentation](https://fivetran.com/docs/connectors/applications/oracle-fusion-cloud-applications#schemainformation).

        > IMPORTANT: This endpoint does not apply to [Magic Folder](https://fivetran.com/docs/connectors/files#magicfolder) connectors.
      operationId: connection_schema_config
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Schema configuration retrieved successfully
                  data:
                    $ref: '#/components/schemas/StandardConfigResponse'
                type: object
    post:
      tags:
        - Connection Schema Management
      summary: Set Up a New Connection Schema Config
      description: |
        Configures a Connection Schema for a new connection before the schema is captured from the source.

        > NOTE: The response returns the exact settings provided in the request.

        After the initial sync, when the connection captures the schema from the source, Fivetran attempts to apply the specified settings to the actual schema.
        If certain tables or columns cannot be excluded, the settings for those entities are ignored.
      operationId: pre_create_connection_schema_config
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardConfigCreateRequest'
            examples:
              pre_create_schema_config_request:
                value:
                  schemas:
                    schema_name:
                      enabled: true
                      tables:
                        table_name:
                          enabled: true
                          sync_mode: SOFT_DELETE
                          columns:
                            column_name:
                              enabled: true
                              hashed: false
                  schema_change_handling: ALLOW_COLUMNS
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Schema configuration pre-created successfully
                  data:
                    $ref: '#/components/schemas/StandardConfigResponse'
                type: object
    patch:
      tags:
        - Connection Schema Management
      summary: Update a Connection Schema Config
      description: |
        Updates the schema config for an existing connection within your Fivetran account.

        > NOTE: For backward compatibility, the response may contain the 'enable_new_by_default' boolean field. It defines whether new schemas and tables discovered in the source are synced. The value is 'true' if you specify 'ALLOW_ALL' as a value of 'schema_change_handling'. In the future API versions, we may remove this field.
        >
        > The response contains all known schemas and tables. Also, it contains columns whose state has ever been set by the user. For more information, see also the [Connection Schema config](https://fivetran.com/docs/rest-api/tutorials/connection-schema-configuration-use-cases) tutorial.
      operationId: modify_connection_schema_config
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardConfigUpdateRequest'
            examples:
              modify_schema_config_request:
                value:
                  schemas:
                    schema_name:
                      enabled: true
                      tables:
                        table_name:
                          enabled: true
                          sync_mode: SOFT_DELETE
                          columns:
                            column_name:
                              enabled: true
                              hashed: false
                  schema_change_handling: BLOCK_ALL
              modify_schema_config_row_filter_request:
                value:
                  schemas:
                    schema_name:
                      enabled: true
                      tables:
                        orders:
                          enabled: true
                          row_filter:
                            name: active_orders
                            description: Sync only active orders
                            column_clauses:
                              - column: status
                                column_type: STRING
                                operator: EQUALS
                                values:
                                  - ACTIVE
                        customers:
                          enabled: true
                          row_filter: null
                        events:
                          enabled: true
              modify_schema_config_row_filter_or_request:
                value:
                  schemas:
                    schema_name:
                      enabled: true
                      tables:
                        orders:
                          enabled: true
                          row_filter:
                            name: high_value_or_us
                            description: Sync high-value orders or US orders
                            operator: OR
                            column_clauses:
                              - column: amount
                                column_type: LONG
                                operator: GREATER
                                values:
                                  - '1000'
                              - column: country
                                column_type: STRING
                                operator: EQUALS
                                values:
                                  - US
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Schema configuration has been modified
                  data:
                    $ref: '#/components/schemas/StandardConfigResponse'
                type: object
  /v1/connections/{connection_id}/schemas/drop-columns:
    post:
      tags:
        - Connection Schema Management
      summary: Drop Blocked Columns from the Destination.
      description: Mark multiple blocked columns for deletion from your destination tables. The columns will be dropped during the next sync.
      operationId: delete_multiple_columns_connection_config
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DropColumnsRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Column(s) successfully marked for deletion
                type: object
        '400':
          description: Bad request
        '404':
          description: Not found error
        '409':
          description: Column not in blocked state error
  /v1/connections/{connection_id}/schemas/reload:
    post:
      tags:
        - Connection Schema Management
      summary: Reload a Connection Schema Config
      description: |
        Reloads the connection schema config for an existing connection within your Fivetran account.

        > NOTE: This method reloads the full schema from the connection's data source. It may take a long time to complete the request. The method execution speed depends on the schema size and the number of databases, tables, and columns.
        >
        > The response contains all known schemas and tables. Also, it contains columns whose state has ever been set by the user. For more information, see also the [Connection Schema config](https://fivetran.com/docs/rest-api/tutorials/connection-schema-configuration-use-cases) tutorial.
      operationId: reload_connection_schema_config
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadStandardConfigRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Schema configuration has been reloaded
                  data:
                    $ref: '#/components/schemas/StandardConfigResponse'
                type: object
  /v1/connections/{connection_id}/schemas/tables/resync:
    post:
      tags:
        - Connection Schema Management
      summary: Re-sync Connection Table Data
      description: Triggers a historical sync of all data for multiple schema tables within a connection. This action does not override the standard sync frequency you defined in the Fivetran dashboard.
      operationId: resync_tables
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schema:
                  title: Schema name
                  uniqueItems: true
                  type: array
