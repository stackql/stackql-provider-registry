          example: esm_id
        auth:
          type: object
          additionalProperties: true
          description: The `auth` object for the `service` in question (a JSON value; its keys depend on the `service`). The accepted keys per type are documented in the vendor's API reference and returned by the connector metadata endpoints.
        config:
          type: object
          additionalProperties: true
