  /v1/connections/{connection_id}/schemas/{schema_name}/tables/{table_name}/columns:
    get:
      tags:
        - Connection Schema Management
      summary: Retrieve Source Table Columns Config
      description: |
        Returns the real-time column list for one source table by querying the source. The response includes the current enabled and hashed flags, and the patchable fields.

        To determine whether this endpoint is available for a table, first [retrieve the connection schema config](https://fivetran.com/docs/rest-api/api-reference/connection-schema/connection-schema-config) and check the table's public [`supports_columns_config` response field](https://fivetran.com/docs/rest-api/api-reference/connection-schema/connection-schema-config#supports_columns_config). Column-level schema metadata support is reported per table rather than as a static connector-wide list. If `supports_columns_config` is `false`, column metadata is not available for that table.

        > NOTE: This endpoint works only for an existing connection that is in a 'Connected' state.

        > NOTE: The connection schema config response includes every schema and table, but includes only columns that were explicitly overridden. Use this endpoint when you need the exhaustive real-time column list for a table that supports column-level configuration.
      operationId: connection_column_config
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
        - name: schema_name
          in: path
          description: The database schema name within your destination
          required: true
          schema:
            type: string
        - name: table_name
          in: path
          description: The table name from the connection schema, using the original source system's naming conventions. This value is case-sensitive.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Column configuration retrieved successfully
                  data:
                    $ref: '#/components/schemas/TableColumnsConfigResponse'
                type: object
  /v1/connections/{connection_id}/state:
    get:
      tags:
        - Connection Management
      summary: Retrieve Connection State
      description: |
        This endpoint returns the connection state for [Function](https://fivetran.com/docs/connectors/functions) and [Connector SDK](https://fivetran.com/docs/connector-sdk) connections. Sending a request for any other connection type returns `400 Bad Request`. To update the connection state, use [Update Connection State](https://fivetran.com/docs/rest-api/api-reference/connections/modify-connection-state).

        To read the sync status for any connection type, use [Retrieve connection details](https://fivetran.com/docs/rest-api/api-reference/connections/connection-details) and inspect the `status` object in the response.
      operationId: connection_state
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection state retrieved successfully
                  data:
                    $ref: '#/components/schemas/ConnectorStateResponse'
                type: object
        '400':
          description: The specified connection does not support state management. Only Function and Connector SDK connectors support this operation.
        '401':
          description: Unauthorized error
        '404':
          description: Connection not found error.
        '405':
          description: Method not allowed error.
        '406':
          description: Not acceptable error
    patch:
      tags:
        - Connection Management
      summary: Update a Connection State
      description: |
        Updates the connection state. This endpoint is only supported for [Function](https://fivetran.com/docs/connectors/functions) and [Connection SDK](https://fivetran.com/docs/connectors/connector-sdk) connectors. To update the state, you should pause your connection first.

        To update the connection state, do the following:

          1. Pause connection using [Update a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/modify-connection) endpoint (set 'paused' to 'true').
          2. Update the state by using the [Update Connection State](https://fivetran.com/docs/rest-api/api-reference/connections/modify-connection-state) endpoint.
          3. Unpause the connection by setting the 'paused' parameter to 'false' in the [Update a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/modify-connection) endpoint request.
      operationId: modify_connection_state
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionOrConnectorSdkState'
            examples:
              update_connection_state_request:
                value:
                  state:
                    cursor: '2024-01-01T00:00:00Z'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Connection state has been updated
                  data:
                    $ref: '#/components/schemas/ConnectorStateResponse'
                type: object
        '400':
          description: 'Invalid request. Possible causes: the request body is missing or malformed, the connection state does not exist, or the specified connection is not a Function or Connector SDK connector.'
        '401':
          description: Unauthorized error
        '404':
          description: Connection not found error.
        '405':
          description: Method not allowed error.
        '406':
          description: Not acceptable error
        '409':
          description: Connection cannot be updated because the sync is in progress.
        '415':
          description: Unsupported media type error
  /v1/connections/{connection_id}/sync:
    post:
      tags:
        - Connection Management
      summary: Sync Connection Data
      description: |
        Triggers a data sync for an existing connection within your Fivetran account without waiting for the next scheduled sync. This action does not override the standard sync frequency you defined in the Fivetran dashboard.

        When `schedule_type` is set to `manual`, this endpoint is the only way syncs occur — including syncs in a `rescheduled` state. For a full walkthrough, see [Trigger Manual Syncs](https://fivetran.com/docs/rest-api/tutorials/trigger-syncs-manually).
      operationId: sync_connection
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
