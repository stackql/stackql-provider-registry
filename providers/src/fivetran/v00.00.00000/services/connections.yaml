    NewConnectorRequestV1:
      required:
        - group_id
        - service
      type: object
      properties:
        group_id:
          type: string
          description: The unique identifier of the destination group to create the connection in. Retrieve group IDs from the [List All Groups](https://fivetran.com/docs/rest-api/api-reference/groups/list-all-groups) endpoint.
          example: group_id
        service:
          type: string
          description: The connector name within the Fivetran system
          example: google_ads
        trust_certificates:
          type: boolean
          description: Specifies whether we should trust the certificate automatically during setup tests. The default value is FALSE. This parameter only affects the behavior of setup tests and does not persist in the connection configuration. When using the PATCH endpoint to update a connection, this parameter must be combined with `run_setup_tests=true` and at least one persistent configuration parameter (e.g., `sync_frequency`, `paused`, `config`, `auth`). If you only want to run setup tests with automatic certificate trust, use the POST `/v1/connections/{connectionId}/test` endpoint instead. If a certificate is not trusted automatically during testing, it has to be approved with [Certificates Management API Approve a destination certificate](https://fivetran.com/docs/rest-api/certificates#approveadestinationcertificate).
          example: true
        trust_fingerprints:
          type: boolean
          description: Specifies whether we should trust the SSH fingerprint automatically during setup tests. The default value is FALSE. This parameter only affects the behavior of setup tests and does not persist in the connection configuration. When using the PATCH endpoint to update a connection, this parameter must be combined with `run_setup_tests=true` and at least one persistent configuration parameter (e.g., `sync_frequency`, `paused`, `config`, `auth`). If you only want to run setup tests with automatic fingerprint trust, use the POST `/v1/connections/{connectionId}/test` endpoint instead. If a fingerprint is not trusted automatically during testing, it has to be approved with [Certificates Management API Approve a destination fingerprint](https://fivetran.com/docs/rest-api/certificates#approveadestinationfingerprint).
          example: true
        run_setup_tests:
          type: boolean
          description: Specifies whether the setup tests should be run automatically after updating the connection. The default value is TRUE. When using this parameter in a PATCH request, you must also include at least one persistent configuration parameter (e.g., `sync_frequency`, `paused`, `config`, `auth`). This parameter can be combined with `trust_certificates` or `trust_fingerprints` to automatically approve `certificates/fingerprints` during the test run. To run setup tests without making configuration changes, use the POST `/v1/connections/{connectionId}/test` endpoint instead.
          example: true
        paused:
          type: boolean
          description: Specifies whether the connection is paused
          example: false
        pause_after_trial:
          type: boolean
          description: Specifies whether the connection should be paused after the free trial period has ended
          example: false
        sync_frequency:
          type: integer
          description: The connection sync frequency in minutes. `null` when the connection's schedule has no single cadence to report, such as a custom cron or multiple-time-of-day schedule.
          format: int32
          example: 1440
          enum:
            - '1'
            - '5'
            - '15'
            - '30'
            - '60'
            - '120'
            - '180'
            - '360'
            - '480'
            - '720'
            - '1440'
        data_delay_sensitivity:
          type: string
          description: 'The level of data delay notification threshold. Possible values: LOW, NORMAL, HIGH, CUSTOM, SYNC_FREQUENCY. The default value is LOW. CUSTOM is only available for customers using the [Enterprise plan](https://fivetran.com/docs/getting-started/pricing#fivetranplans) or above.'
          example: LOW
          enum:
            - LOW
            - NORMAL
            - HIGH
            - CUSTOM
            - SYNC_FREQUENCY
        data_delay_threshold:
          type: integer
          description: Custom sync delay notification threshold in minutes. The default value is 0. This parameter is only used when data_delay_sensitivity set to CUSTOM.
          format: int32
          example: 0
        daily_sync_time:
          type: string
          description: The optional parameter that defines the sync start time when the sync frequency is already set or being set by the current request to 1440. It can be specified in one hour increments starting from 00:00 to 23:00. If not specified, we will use [the baseline sync start time](https://fivetran.com/docs/getting-started/syncoverview#syncfrequencyandscheduling). This parameter has no effect on the [0 to 60 minutes offset](https://fivetran.com/docs/getting-started/syncoverview#syncstarttimesandoffsets) used to determine the actual sync start time
          example: '14:00'
        schedule_type:
          type: string
          description: 'The connection schedule configuration type. Supported values: auto, manual'
          example: auto
          enum:
            - auto
            - manual
        connect_card_config:
          $ref: '#/components/schemas/ConnectCardConfig'
        proxy_agent_id:
          type: string
          description: The unique identifier for the proxy agent within the Fivetran system
          example: proxy_agent_id
        private_link_id:
          type: string
          description: The unique identifier for the self-served private link that is used by the connection
          example: private_link_id
        networking_method:
          type: string
          enum:
            - Directly
            - PrivateLink
            - SshTunnel
            - ProxyAgent
        hybrid_deployment_agent_id:
          type: string
          description: The unique identifier for the hybrid deployment agent within the Fivetran system. If not specified, the agent ID from the destination will be used
          example: hybrid_deployment_agent_id
        destination_configuration:
          $ref: '#/components/schemas/DestinationConfiguration'
        destination_schema_names:
          type: string
          description: |-
            Defines how you want the schema names to appear in your destination. <br /> The available values are:  <br /> - FIVETRAN_NAMING - Use Fivetran naming conventions to simplify and standardize the schema, table and column names in the destination. <br /> - SOURCE_NAMING - Preserve source schema table and column names in the destination. <br /> You can modify your selection only before the initial sync. Learn more in [our documentation](https://fivetran.com/docs/core-concepts#namingconventions) <br />
            > IMPORTANT: This field will soon become a required field. Make sure to include it in your API requests when creating new connections to prevent future disruptions.
