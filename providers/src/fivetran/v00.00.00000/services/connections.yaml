      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Sync has been successfully triggered for connection with id 'string'
                type: object
        '401':
          description: Unauthorized error
        '404':
          description: Not found error
        '406':
          description: Not acceptable error
        '415':
          description: Unsupported media type error
  /v1/connections/{connection_id}/sync-history:
    get:
      tags:
        - Connection Management
      summary: Retrieve Connection Sync History
      description: Returns a list of sync history records for the specified connection. The maximum time window is 7 days.
      operationId: connection_sync_history
      parameters:
        - name: connection_id
          in: path
          description: The unique identifier of the connection. Retrieve it from the `id` field in the [List All Connections](https://fivetran.com/docs/rest-api/api-reference/connections/list-connections) response, or from the `id` field returned when you [Create a Connection](https://fivetran.com/docs/rest-api/api-reference/connections/create-connection).
          required: true
          schema:
            type: string
        - name: duration
          in: query
          description: Deprecated. Use `start_time` and `end_time` instead.
          required: false
          schema:
            type: integer
            format: int32
        - name: start_time
          in: query
          description: The start of the time range for which to retrieve sync history, in ISO 8601 format (for example, 2026-01-01T00:00:00Z). If omitted, defaults to one hour before `end_time`. The maximum allowed range between `start_time` and `end_time` is 7 days.
          required: false
          schema:
            type: string
        - name: end_time
          in: query
          description: The end of the time range for which to retrieve sync history, in ISO 8601 format (for example, 2026-01-01T01:00:00Z). If omitted, defaults to one hour after `start_time`. Must be after `start_time`.
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Operation performed successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/ConnectorSyncHistoryResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
        '400':
          description: Bad request error. Returned when the duration between `start_time` and `end_time` exceeds 7 days, `start_time` is after `end_time`, or `start_time` is more than 7 days in the past.
        '401':
          description: Unauthorized error
        '404':
          description: Not found error
        '405':
          description: Method not allowed error
        '406':
          description: Not acceptable error
