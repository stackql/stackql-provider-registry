openapi: 3.0.1
info:
  title: Fivetran Transformations API
  description: Transformations, transformation projects and quickstart package metadata.
  version: v1
paths:
  /v1/transformation-projects:
    get:
      tags:
        - Transformation Projects Management
      summary: List all Transformation Projects
      description: Returns a list of all transformation projects available via API within your Fivetran account.
      operationId: list_all_transformation_projects
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation projects retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/TransformationProjectResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Transformation Projects Management
      summary: Create Transformation Project
      description: Creates a new transformation project.
      operationId: create_transformation_project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTransformationProjectRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation project created successfully
                  data:
                    $ref: '#/components/schemas/TransformationProjectDetailsResponse'
                type: object
  /v1/transformation-projects/{project_id}:
    get:
      tags:
        - Transformation Projects Management
      summary: Retrieve Transformation Project Details
      description: Returns transformation project details if a valid identifier was provided.
      operationId: transformation_project_details
      parameters:
        - name: project_id
          in: path
          description: The unique identifier for the transformation project within the Fivetran system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation project details retrieved successfully
                  data:
                    $ref: '#/components/schemas/TransformationProjectDetailsResponse'
                type: object
    delete:
      tags:
        - Transformation Projects Management
      summary: Delete Transformation Project
      description: Deletes transformation project if a valid identifier was provided.
      operationId: delete_transformation_project
      parameters:
        - name: project_id
          in: path
          description: The unique identifier for the transformation project within the Fivetran system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation project with id 'string' has been deleted
                type: object
    patch:
      tags:
        - Transformation Projects Management
      summary: Update Transformation Project
      description: Updates transformation project if a valid identifier was provided.
      operationId: modify_transformation_project
      parameters:
        - name: project_id
          in: path
          description: The unique identifier for the transformation project within the Fivetran system
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransformationProjectRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation project updated successfully
                  data:
                    $ref: '#/components/schemas/TransformationProjectDetailsResponse'
                type: object
  /v1/transformation-projects/{project_id}/test:
    post:
      tags:
        - Transformation Projects Management
      summary: Test Transformation Project
      description: Triggers tests for an existing transformation project.
      operationId: test_transformation_project
      parameters:
        - name: project_id
          in: path
          description: The unique identifier for the transformation project within the Fivetran system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation project test completed successfully
                  data:
                    $ref: '#/components/schemas/TransformationProjectDetailsResponse'
                type: object
  /v1/transformations:
    get:
      tags:
        - Transformation Management
      summary: List all Transformations
      description: Returns a list of all transformations within your Fivetran account.
      operationId: transformations_list
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
        - name: group_id
          in: query
          description: Specify the group identifier to filter transformations by group
          required: false
          schema:
            type: string
            example: group_id
          example: group_id
        - name: project_id
          in: query
          description: Specify dbt project identifier to filter transformations by project
          required: false
          schema:
            type: string
            example: project_id
          example: project_id
        - name: type
          in: query
          description: Transformation type filter
          required: false
          schema:
            type: string
            example: DBT_CORE
            enum:
              - DBT_CORE
              - QUICKSTART
          example: DBT_CORE
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformations list retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/TransformationResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Transformation Management
      summary: Create a Transformation
      description: Creates a new transformation.
      operationId: create_transformation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTransformationRequest'
      responses:
        '201':
          description: Created response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation created successfully
                  data:
                    $ref: '#/components/schemas/TransformationResponse'
                type: object
  /v1/transformations/package-metadata:
    get:
      tags:
        - Transformation Management
      summary: List All Quickstart Package Metadata
      description: Returns a list of available Quickstart transformation package metadata details.
      operationId: transformation_package_metadata_list
      parameters:
        - name: service
          in: query
          description: Specify the service identifier to filter Quickstart packages by connection service
          required: false
          schema:
            type: string
            example: service
          example: service
        - name: name
          in: query
          description: Specify the package name to filter Quickstart packages by name
          required: false
          schema:
            type: string
            example: service
          example: service
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation package metadata list retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/TransformationPackageMetadataResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
        '400':
          description: Bad request
  /v1/transformations/package-metadata/{package_definition_id}:
    get:
      tags:
        - Transformation Management
      summary: Retrieve a Quickstart Package Metadata Details
      description: Returns the metadata details of the Quickstart transformation package if a valid identifier is provided.
      operationId: transformation_package_metadata_details
      parameters:
        - name: package_definition_id
          in: path
          description: The unique identifier for the Quickstart transformation package definition within the Fivetran system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation package metadata details retrieved successfully
                  data:
                    $ref: '#/components/schemas/TransformationPackageMetadataResponse'
                type: object
        '404':
          description: Transformation Package not found
  /v1/transformations/{transformation_id}:
    get:
      tags:
        - Transformation Management
      summary: Retrieve Transformation Details
      description: Returns a transformation details if a valid identifier is provided.
      operationId: transformation_details
      parameters:
        - name: transformation_id
          in: path
          description: The unique identifier for the transformation within the Fivetran system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation details retrieved successfully
                  data:
                    $ref: '#/components/schemas/TransformationResponse'
                type: object
        '404':
          description: Transformation not found
    delete:
      tags:
        - Transformation Management
      summary: Delete a Transformation
      description: Deletes a transformation if a valid identifier is provided.
      operationId: delete_transformation
      parameters:
        - name: transformation_id
          in: path
          description: The unique identifier for the transformation within the Fivetran system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation with id 'string' has been deleted
                type: object
        '404':
          description: Transformation not found
    patch:
      tags:
        - Transformation Management
      summary: Update a Transformation
      description: Updates the transformation if a valid identifier is provided.
      operationId: update_transformation
      parameters:
        - name: transformation_id
          in: path
          description: The unique identifier for the transformation within the Fivetran system
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransformationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation updated successfully
                  data:
                    $ref: '#/components/schemas/TransformationResponse'
                type: object
        '404':
          description: Transformation not found
  /v1/transformations/{transformation_id}/cancel:
    post:
      tags:
        - Transformation Management
      summary: Cancel Running Transformation
      description: Cancels the execution of the transformation if a valid identifier is provided.
      operationId: cancel_transformation
      parameters:
        - name: transformation_id
          in: path
          description: The unique identifier for the transformation within the Fivetran system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation with id 'string' has been canceled
                type: object
        '404':
          description: Transformation not found
  /v1/transformations/{transformation_id}/run:
    post:
      tags:
        - Transformation Management
      summary: Run Transformation
      description: Runs the transformation if a valid identifier is provided.
      operationId: run_transformation
      parameters:
        - name: transformation_id
          in: path
          description: The unique identifier for the transformation within the Fivetran system
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunTransformationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation with id 'string' has been started
                type: object
        '404':
          description: Transformation not found
  /v1/transformations/{transformation_id}/upgrade:
    post:
      tags:
        - Transformation Management
      summary: Upgrade Transformation Package
      description: Upgrades the Quickstart transformation package to latest version if a valid identifier is provided.
      operationId: upgrade_transformation_package
      parameters:
        - name: transformation_id
          in: path
          description: The unique identifier for the transformation within the Fivetran system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Transformation package has been upgraded
                type: object
        '404':
          description: Transformation Package not found
components:
  schemas:
    TransformationProjectResponse:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the transformation project within the Fivetran system
        type:
          type: string
          description: Transformation project type
          enum:
            - DBT_CORE
        created_at:
          type: string
          description: The timestamp when the transformation project was created
          format: date-time
        created_by_id:
          type: string
          description: The unique identifier for the actor (user or system key) within the Fivetran system
        group_id:
          type: string
          description: The unique identifier for the group within the Fivetran system
    NewTransformationProjectRequest:
      type: object
      properties:
        group_id:
          type: string
          description: The unique identifier for the group within the Fivetran system
        type:
          type: string
          description: Transformation project type
          enum:
            - DBT_CORE
        run_tests:
          type: boolean
          description: The boolean flag specifies if the project should be tested after creation or update operation
        project_config:
          type: object
          description: Depends on `type` (DBT_CORE).
          properties:
            dbt_version:
              type: string
              description: The version of dbt that should run the project
            default_schema:
              type: string
              description: The default schema in the destination
            git_remote_url:
              type: string
              description: The Git remote URL of your dbt project
            folder_path:
              type: string
              description: The path to the folder in the Git repo where your dbt project is stored.
            git_branch:
              type: string
              description: The Git branch of your dbt project.
            threads:
              type: integer
              description: The number of threads dbt will use
              format: int32
            target_name:
              type: string
              description: The default target name
            environment_vars:
              type: array
              description: 'The list of environment variables defined as key-value pairs in the raw string format using `=` as a separator. The variable names should have the `DBT_` prefix and can contain A-Z, 0-9, dash, underscore, or dot characters. Example: `["DBT_VARIABLE=variable_value", "DBT_VARIABLE_2=variable_value_2"]`'
              items:
                type: string
                description: ''
    TransformationProjectDetailsResponse:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the transformation project within the Fivetran system
        type:
          type: string
          description: Transformation project type
          enum:
            - DBT_CORE
        status:
          type: string
          description: The status of transformation project
          enum:
            - NOT_READY
            - READY
            - ERROR
        errors:
          type: array
          description: The list of errors occurred during project processing and setup
          items:
            type: string
        created_at:
          type: string
          description: The timestamp when the transformation project was created
          format: date-time
        created_by_id:
          type: string
          description: The unique identifier for the actor (user or system key) within the Fivetran system
        group_id:
          type: string
          description: The unique identifier for the group within the Fivetran system
        setup_tests:
          type: array
          description: The setup tests results
          items:
            $ref: '#/components/schemas/SetupTestResultResponse'
        project_config:
          type: object
          description: Depends on `type` (DBT_CORE).
          properties:
            dbt_version:
              type: string
              description: The version of dbt that should run the project
            default_schema:
              type: string
              description: The default schema in the destination
            git_remote_url:
              type: string
              description: The Git remote URL of your dbt project
            folder_path:
              type: string
              description: The path to the folder in the Git repo where your dbt project is stored.
            git_branch:
              type: string
              description: The Git branch of your dbt project.
            threads:
              type: integer
              description: The number of threads dbt will use
              format: int32
            target_name:
              type: string
              description: The default target name
            environment_vars:
              type: array
              description: 'The list of environment variables defined as key-value pairs in the raw string format using `=` as a separator. The variable names should have the `DBT_` prefix and can contain A-Z, 0-9, dash, underscore, or dot characters. Example: `["DBT_VARIABLE=variable_value", "DBT_VARIABLE_2=variable_value_2"]`'
              items:
                type: string
                description: ''
            public_key:
              type: string
              description: The public key used to grant Fivetran SSH access to the dbt project Git repository
    UpdateTransformationProjectRequest:
      type: object
      properties:
        run_tests:
          type: boolean
          description: The boolean flag specifies if the project should be tested after creation or update operation
        project_config:
          type: object
          description: Depends on `type` (DBT_CORE).
          properties:
            folder_path:
              type: string
              description: The path to the folder in the Git repo where your dbt project is stored.
            git_branch:
              type: string
              description: The Git branch of your dbt project.
            threads:
              type: integer
              description: The number of threads dbt will use
              format: int32
            target_name:
              type: string
              description: The default target name
            environment_vars:
              type: array
              description: 'The list of environment variables defined as key-value pairs in the raw string format using `=` as a separator. The variable names should have the `DBT_` prefix and can contain A-Z, 0-9, dash, underscore, or dot characters. Example: `["DBT_VARIABLE=variable_value", "DBT_VARIABLE_2=variable_value_2"]`'
              items:
                type: string
                description: ''
    TransformationResponse:
      required:
        - created_at
        - created_by_id
        - id
        - paused
        - schedule
        - status
        - type
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the transformation within the Fivetran system
          example: transformation_id
        status:
          type: string
          description: The status of transformation
          example: RUNNING
          enum:
            - NEW
            - SCHEDULING
            - RUNNING
            - TERMINATING
            - SUCCEEDED
            - FAILED
            - BLOCKED
            - CANCELED
            - PARTIALLY_SUCCEEDED
        schedule:
          description: The transformation schedule
          required:
            - schedule_type
          type: object
          properties:
            cron:
              type: array
              description: 'Cron schedule: list of CRON strings.'
              example:
                - 0 */1 * * *
              items:
                type: string
            interval:
              type: integer
              description: The interval in minutes
              format: int32
              example: 60
            schedule_type:
              type: string
              description: 'The schedule type. The following values are supported: ''INTEGRATED'', ''TIME_OF_DAY'', ''INTERVAL'', ''CRON'''
              example: TIME_OF_DAY
              enum:
                - INTEGRATED
                - TIME_OF_DAY
                - INTERVAL
                - CRON
            days_of_week:
              uniqueItems: true
              type: array
              description: The set of days of the week, where an empty set represents a daily schedule
              example:
                - MONDAY
                - FRIDAY
              items:
                type: string
                enum:
                  - MONDAY
                  - TUESDAY
                  - WEDNESDAY
                  - THURSDAY
                  - FRIDAY
                  - SATURDAY
                  - SUNDAY
            time_of_day:
              type: string
              description: 'The time of the day the transformation should be launched at. The following values are supported: ''00:00'', ''00:30'', ''01:00'', ''01:30'', ''02:00'', ''02:30'', ''03:00'', ''03:30'', ''04:00'', ''04:30'', ''05:00'', ''05:30'', ''06:00'', ''06:30'', ''07:00'', ''07:30'', ''08:00'', ''08:30'', ''09:00'', ''09:30'', ''10:00'', ''10:30'', ''11:00'', ''11:30'', ''12:00'', ''12:30'', ''13:00'', ''13:30'', ''14:00'', ''14:30'', ''15:00'', ''15:30'', ''16:00'', ''16:30'', ''17:00'', ''17:30'', ''18:00'', ''18:30'', ''19:00'', ''19:30'', ''20:00'', ''20:30'', ''21:00'', ''21:30'', ''22:00'', ''22:30'', ''23:00'', ''23:30'''
              example: '14:00'
            connection_ids:
              uniqueItems: true
              type: array
              description: 'The list of connection IDs that the Transformation for dbt depends on when using the integrated schedule (`schedule_type: INTEGRATED`) or custom schedules (`schedule_type: TIME_OF_DAY` or `schedule_type: INTERVAL`)  with smart syncing enabled (`smart_syncing: true`). These connections must belong to the same group as the dbt project. This field should not be used for Quickstart transformations.'
              example:
                - connection_id
              items:
                type: string
            transformation_ids:
              uniqueItems: true
              type: array
              description: The list of the transformation identifiers to be used for the integrated schedule or custom scheduling with smart syncing enabled
              example:
                - transformation_id
              items:
                type: string
            smart_syncing:
              type: boolean
              description: The boolean flag that enables the Smart Syncing schedule
        type:
          type: string
          description: Transformation type
          example: DBT_CORE
          enum:
            - DBT_CORE
            - QUICKSTART
        paused:
          type: boolean
          description: The field indicates whether transformation is in paused state
          example: true
        created_at:
          type: string
          description: The timestamp when the transformation was created
          format: date-time
