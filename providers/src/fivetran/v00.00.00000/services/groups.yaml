openapi: 3.0.1
info:
  title: Fivetran Groups API
  description: Groups, their users and connections, SSH public key and service account.
  version: v1
paths:
  /v1/groups:
    get:
      tags:
        - Group Management
      summary: List All Destinations within Account
      description: Returns a list of all groups within your Fivetran account.
      operationId: list_all_groups
      parameters:
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Groups retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/GroupResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Group Management
      summary: Create a Group
      description: |
        Creates a new group in your Fivetran account. 

        > IMPORTANT: Groups and destinations are mapped 1:1 to each other. We do this mapping using the group's `id` value that we automatically generate when you create a group, and the destination's `group_id` value that you specify when you create a destination. This means that you must create a group in your Fivetran account before you can create a destination in it.
      operationId: create_group
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGroupRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group has been created
                  data:
                    $ref: '#/components/schemas/GroupResponse'
                type: object
  /v1/groups/{group_id}:
    get:
      tags:
        - Group Management
      summary: Retrieve Group Details
      description: Returns a group object if a valid identifier was provided.
      operationId: group_details
      parameters:
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group details retrieved successfully
                  data:
                    $ref: '#/components/schemas/GroupResponse'
                type: object
    delete:
      tags:
        - Group Management
      summary: Delete a Group
      description: Deletes a group from your Fivetran account.
      operationId: delete_group
      parameters:
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group with id 'string' has been deleted
                type: object
    patch:
      tags:
        - Group Management
      summary: Update a Group
      description: Updates information for an existing group within your Fivetran account.
      operationId: modify_group
      parameters:
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group has been updated
                  data:
                    $ref: '#/components/schemas/GroupResponse'
                type: object
  /v1/groups/{group_id}/connections:
    get:
      tags:
        - Group Management
      summary: List All Connections within a Group
      description: Returns a list of information about all connections within a group in your Fivetran account.
      operationId: list_all_connections_in_group
      parameters:
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
        - name: schema
          in: query
          description: The name used both as the connection's name within the Fivetran system and as the source schema's name within your destination.
          required: false
          schema:
            type: string
            example: schema_name
          example: schema_name
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group connections retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/ConnectorResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
  /v1/groups/{group_id}/public-key:
    get:
      tags:
        - Group Management
      summary: Retrieve Group Public SSH Key
      description: Returns public key from SSH key pair associated with the group.
      operationId: group_ssh_public_key
      parameters:
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group SSH public key retrieved successfully
                  data:
                    $ref: '#/components/schemas/GroupSshKeyResponse'
                type: object
  /v1/groups/{group_id}/service-account:
    get:
      tags:
        - Group Management
      summary: Retrieve Group Service Account
      description: Returns Fivetran service account associated with the group.
      operationId: group_service_account
      parameters:
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group service account retrieved successfully
                  data:
                    $ref: '#/components/schemas/GroupServiceAccountResponse'
                type: object
  /v1/groups/{group_id}/users:
    get:
      tags:
        - Group Management
      summary: List All Users within a Group
      description: Returns a list of information about all users within a group in your Fivetran account.
      operationId: list_all_users_in_group
      parameters:
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: Paging cursor, [read more about pagination](https://fivetran.com/docs/rest-api/pagination)
          required: false
          schema:
            type: string
            example: cursor_value
          example: cursor_value
        - name: limit
          in: query
          description: Number of records to fetch per page. Accepts a number in the range 1..1000; the default value is 100.
          required: false
          schema:
            type: integer
            format: int32
            example: 100
          example: 100
        - name: active
          in: query
          description: Indicates whether to return only enabled users (true) or not (false). By default, both enabled (allowed to log in) and suspended users are returned.
          required: false
          schema:
            type: boolean
            example: true
          example: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - data
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: Group users retrieved successfully
                  data:
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        description: The collection of returned items
                        items:
                          $ref: '#/components/schemas/UserResponse'
                      next_cursor:
                        type: string
                        description: The value of the cursor parameter for the next page
                        example: cursor_value
                    type: object
                type: object
    post:
      tags:
        - Group Management
      summary: Add a User to a Group
      description: Adds an existing user to a group in your Fivetran account.
      operationId: add_user_to_group
      parameters:
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserToGroupRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User has been added to the group
                type: object
  /v1/groups/{group_id}/users/{user_id}:
    delete:
      tags:
        - Group Management
      summary: Remove a User from a Group
      description: Removes an existing user from a group in your Fivetran account.
      operationId: delete_user_from_group
      parameters:
        - name: group_id
          in: path
          description: The unique identifier for the group within the Fivetran system.
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          description: The unique identifier for the user within the account.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    description: Response status code
                    example: Success
                  message:
                    type: string
                    description: Response status text
                    example: User with id 'string' has been removed from the group
                type: object
components:
  schemas:
    GroupResponse:
      required:
        - created_at
        - id
        - name
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the group within the Fivetran system.
          example: group_id
        name:
          type: string
          description: The name of the group within your account.
          example: Group_Name
        created_at:
          type: string
          description: The timestamp of when the group was created in your account.
          format: date-time
          example: '2024-01-01T00:00:00Z'
    NewGroupRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the group within your account.
          example: Group_Name
    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the group within your account.
          example: Updated_Group_Name
    ConnectorResponse:
      required:
        - connected_by
        - created_at
        - group_id
        - id
        - pause_after_trial
        - paused
        - schedule_type
        - schema
        - service
        - status
        - sync_frequency
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the group within the Fivetran system.
          example: connection_id
        service:
          type: string
          description: The name for the connector type within the Fivetran system.
          example: google_sheets
        schema:
          type: string
          description: The name used both as the connection's name within the Fivetran system and as the source schema's name within your destination.
          example: gsheets.table
        paused:
          type: boolean
          description: Specifies whether the connection is paused.
          example: false
        status:
          description: 'The current state of the connection. '
          required:
            - is_historical_sync
            - setup_state
            - sync_state
            - update_state
          type: object
          properties:
            tasks:
              type: array
              description: The collection of tasks for the connection
              items:
                $ref: '#/components/schemas/ConnectionTask'
            warnings:
              type: array
              description: The collection of warnings for the connection
              items:
                $ref: '#/components/schemas/ConnectionWarning'
            setup_state:
              type: string
              description: 'The current setup state of the connection. The available values are: <br /> - incomplete - the setup config is incomplete, the setup tests never succeeded <br /> - connected - the connection is properly set up <br /> - broken - the connection setup config is broken.'
              example: connected
            schema_status:
              type: string
              description: Schema status. Returned only for connectors that support [Universal Column Masking flow](https://fivetran.com/docs/rest-api/tutorials/schema-status).
              example: ready
            sync_state:
              type: string
              description: 'The current sync state of the connection. The available values are: <br /> - scheduled - the sync is waiting to be run <br /> - syncing - the sync is currently running <br /> - paused - the sync is currently paused <br /> - rescheduled - the sync is waiting until more API calls are available in the source service.'
              example: scheduled
            update_state:
              type: string
              description: 'The current data update state of the connection. The available values are: <br /> - on_schedule - the sync is running smoothly, no delays <br /> - delayed - the data is delayed for a longer time than expected for the update.'
              example: delayed
            is_historical_sync:
              type: boolean
              description: The boolean specifying whether the connection should be triggered to re-sync all historical data. If you set this parameter to TRUE, a [historical sync](https://fivetran.com/docs/getting-started/glossary#historicalsync) starts immediately. If a sync is currently running, it's canceled and restarted as a historical sync. All subsequent syncs after the historical sync completes will be incremental. If the value is FALSE or not specified, the connection doesn't re-sync historical data. This parameter is automatically reset to FALSE once the historical sync is completed.
              example: false
            rescheduled_for:
              type: string
              description: The UTC timestamp of the next scheduled sync attempt. Non-null only when `sync_state` is `"rescheduled"`. If `schedule_type` is `manual`, the connection expects the sync to be triggered at the designated time through the [Sync Connection Data](https://fivetran.com/docs/rest-api/api-reference/connections/sync-connection) endpoint.
              format: date-time
              example: '2024-12-01T15:43:29.013729Z'
        config:
          type: object
          additionalProperties:
            type: string
            description: (opaque JSON object)
          description: The connection setup configuration.
        schedule:
          $ref: '#/components/schemas/ConnectorSchedule'
        group_id:
          type: string
          description: The unique identifier for the group within the Fivetran system.
          example: group_id
        service_version:
          type: integer
          description: The connector type version within the Fivetran system.
          format: int32
          example: 0
        connected_by:
          type: string
          description: The unique identifier of the user who has created the connection in your account.
          example: user_id
        created_at:
          type: string
          description: The timestamp of when the group was created in your account.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
        succeeded_at:
          type: string
          description: The timestamp of the time the connection sync succeeded last time.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
        failed_at:
          type: string
          description: The timestamp of the time the connection sync failed last time.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
        pause_after_trial:
          type: boolean
          description: Specifies whether the connection should be paused after the free trial period has ended.
          example: false
        sync_frequency:
          type: integer
          description: The connection sync frequency in minutes. `null` when the connection's schedule has no single cadence to report, such as a custom cron or multiple-time-of-day schedule.
          format: int32
          example: 360
        data_delay_threshold:
          type: integer
          format: int32
        data_delay_sensitivity:
          type: string
          enum:
            - LOW
            - NORMAL
            - HIGH
            - CUSTOM
            - SYNC_FREQUENCY
        daily_sync_time:
          type: string
          description: The optional parameter that defines the sync start time when the sync frequency is already set or being set by the current request to 1440. It can be specified in one hour increments starting from 00:00 to 23:00. If not specified, we will use the baseline sync start time. This parameter has no effect on the 0 to 60 minutes offset used to determine the actual sync start time.
          example: '14:00'
        schedule_type:
          type: string
          description: 'The connection schedule config type. Supported values: auto, manual. Lets you disable or enable an automatic data sync on a schedule.'
          example: auto
        setup_tests:
          type: array
          description: Setup tests results
          items:
            $ref: '#/components/schemas/SetupTestResultResponse'
        private_link_id:
          type: string
        networking_method:
          type: string
          enum:
            - Directly
            - SshTunnel
            - PrivateLink
            - ProxyAgent
            - UnmanagedProxyAgent
            - Unknown
        proxy_agent_id:
          type: string
        source_sync_details:
          type: string
          description: Read-only, connector-specific sync state. Depending on the connector type, this object may include source scope identifiers such as accounts, profiles, or projects; per-entity cursors or checkpoints; or last-synced timestamps. This field is optional, and its schema varies by connector type. To determine whether a connector exposes this information and inspect its returned fields, use [Retrieve Connection Details](https://fivetran.com/docs/rest-api/api-reference/connections/connection-details). (opaque JSON object)
        hybrid_deployment_agent_id:
          type: string
        connect_card:
          $ref: '#/components/schemas/ConnectCardResponse'
        connect_card_config:
          $ref: '#/components/schemas/ConnectCardConfig'
        destination_configuration:
          $ref: '#/components/schemas/DestinationConfiguration'
        destination_schema_names:
          type: string
          enum:
            - FIVETRAN_NAMING
            - SOURCE_NAMING
        external_secrets_manager_id:
          type: string
        external_secrets_keys_config:
          type: object
          additionalProperties:
            type: string
    GroupSshKeyResponse:
      required:
        - public_key
      type: object
      properties:
        public_key:
          type: string
          example: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC6 ... fivetran user key
    GroupServiceAccountResponse:
      required:
        - service_account
      type: object
      properties:
        service_account:
          type: string
          example: service_account
    UserResponse:
      required:
        - active
        - created_at
        - email
        - id
        - logged_in_at
        - role
        - verified
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the user within the Fivetran system.
          example: user_id
        email:
          type: string
          description: 'The email address that the user has associated with their user profile. Optional for service accounts (`user_type: SERVICE_ACCOUNT`).'
          example: user@email.value
        verified:
          type: boolean
          description: The field indicates whether the user has verified their email address in the account creation process.
          example: true
        invited:
          type: boolean
          description: The field indicates whether the user has been invited to your account.
          example: true
        picture:
          type: string
          description: The user's avatar as a URL link (for example, 'http:<!-- -->//mycompany.com/avatars/john_white.png') or base64 data URI (for example, 'data:image/png;base64,aHR0cDovL215Y29tcGFueS5jb20vYXZhdGFycy9qb2huX3doaXRlLnBuZw==')
          example: AFg65aoa7af4r3feaAa6bi7se ... base64 encoded image ... blDFSs87gQ==
        phone:
          type: string
          description: The phone number of the user.
          example: '+1234567890'
        role:
          type: string
          description: 'The role that you would like to assign to the user '
          example: Account Administrator
        active:
          type: boolean
          description: The field indicates if the user is an active Fivetran account user.
          example: true
        given_name:
          type: string
          description: The first name of the user.
          example: John
        family_name:
          type: string
          description: The last name of the user.
          example: Doe
        logged_in_at:
          type: string
          description: The last time that the user has logged into their Fivetran account.
          format: date-time
          example: '2024-01-01T00:00:00Z'
        created_at:
          type: string
          description: The timestamp that the user created their Fivetran account
          format: date-time
          example: '2024-01-01T00:00:00Z'
        user_type:
          type: string
          description: 'The type of user. Possible values: `REGULAR_USER`: A human user who can log in to the Fivetran dashboard and interact with the API, and `SERVICE_ACCOUNT`: A non-human identity for machine-to-machine API access that cannot log in to the dashboard.'
          example: SERVICE_ACCOUNT
          enum:
            - REGULAR_USER
            - SERVICE_ACCOUNT
        has_api_key:
          type: boolean
          description: 'Indicates whether the user has an assigned API key, including expired keys. Accepted values: `true` or `false`.'
          example: true
    AddUserToGroupRequest:
      type: object
      properties:
        email:
          type: string
          description: The email address that the user has associated with their user profile.
          example: user@email.value
        role:
          type: string
          description: 'The group role that you would like to assign this new user to. Supported group roles: ‘Manage Destination‘, ‘View Destination‘, ‘Edit Destination‘, ‘Create Connection‘, or a custom destination role'
          example: Owner
    ConnectorStatusResponse:
      required:
        - is_historical_sync
        - setup_state
        - sync_state
        - update_state
      type: object
      properties:
        tasks:
          type: array
          description: The collection of tasks for the connection
          items:
            $ref: '#/components/schemas/ConnectionTask'
        warnings:
          type: array
          description: The collection of warnings for the connection
          items:
            $ref: '#/components/schemas/ConnectionWarning'
        setup_state:
          type: string
          description: 'The current setup state of the connection. The available values are: <br /> - incomplete - the setup config is incomplete, the setup tests never succeeded <br /> - connected - the connection is properly set up <br /> - broken - the connection setup config is broken.'
          example: connected
        schema_status:
          type: string
          description: Schema status. Returned only for connectors that support [Universal Column Masking flow](https://fivetran.com/docs/rest-api/tutorials/schema-status).
          example: ready
        sync_state:
          type: string
          description: 'The current sync state of the connection. The available values are: <br /> - scheduled - the sync is waiting to be run <br /> - syncing - the sync is currently running <br /> - paused - the sync is currently paused <br /> - rescheduled - the sync is waiting until more API calls are available in the source service.'
          example: scheduled
        update_state:
          type: string
          description: 'The current data update state of the connection. The available values are: <br /> - on_schedule - the sync is running smoothly, no delays <br /> - delayed - the data is delayed for a longer time than expected for the update.'
          example: delayed
        is_historical_sync:
          type: boolean
          description: The boolean specifying whether the connection should be triggered to re-sync all historical data. If you set this parameter to TRUE, a [historical sync](https://fivetran.com/docs/getting-started/glossary#historicalsync) starts immediately. If a sync is currently running, it's canceled and restarted as a historical sync. All subsequent syncs after the historical sync completes will be incremental. If the value is FALSE or not specified, the connection doesn't re-sync historical data. This parameter is automatically reset to FALSE once the historical sync is completed.
          example: false
        rescheduled_for:
          type: string
          description: The UTC timestamp of the next scheduled sync attempt. Non-null only when `sync_state` is `"rescheduled"`. If `schedule_type` is `manual`, the connection expects the sync to be triggered at the designated time through the [Sync Connection Data](https://fivetran.com/docs/rest-api/api-reference/connections/sync-connection) endpoint.
          format: date-time
          example: '2024-12-01T15:43:29.013729Z'
    ConnectorSchedule:
      type: object
      properties:
        cron:
          type: string
        interval:
          type: integer
          description: The sync interval in minutes
          format: int32
          example: 360
        schedule_type:
          type: string
          description: 'The schedule type. Possible values: INTERVAL, TIME_OF_DAY'
          example: INTERVAL
          enum:
            - TIME_OF_DAY
            - INTERVAL
            - CRON
            - MANUAL
        days_of_week:
          uniqueItems: true
          type: array
          description: The days of the week on which the connection syncs
          example:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          items:
            type: string
            enum:
              - MONDAY
              - TUESDAY
              - WEDNESDAY
              - THURSDAY
              - FRIDAY
              - SATURDAY
              - SUNDAY
        time_of_day:
          type: string
    SetupTestResultResponse:
      required:
        - status
        - title
      type: object
      properties:
        title:
          type: string
          description: 'A human-readable name for the setup test step. For example: Validate Login, Test Connection, Check Permissions.'
          example: Validate Login
        status:
          type: string
          description: 'The result of the individual setup test step. Possible values: PASSED, FAILED, SKIPPED.'
          example: FAILED
          enum:
            - PASSED
            - SKIPPED
            - WARNING
            - FAILED
            - JOB_FAILED
        message:
          type: string
          description: 'The result message for the setup test step. For example: Invalid login credentials.'
          example: Invalid login credentials.
        details:
          type: string
          description: Additional diagnostic information about the setup test result. Populated when the status is FAILED and more context is available beyond the message. (opaque JSON object)
          example: Authentication failed (401 Unauthorized). Verify the provided credentials and permissions.
    ConnectCardResponse:
      type: object
      properties:
        token:
          type: string
          description: A short-lived JWT that authorizes the end user to configure this connection via the Connect Card interface. Use the `uri` field directly to redirect users — it already embeds this token. If you need to construct your own URL, pass this value as the `auth` query parameter to `https://fivetran.com/connect-card/setup`.
          example: eyJ0e...
        uri:
          type: string
          description: The complete URL to redirect the end user to in order to authorize the connection. It embeds the auth token, redirect URI, and setup guide visibility as query parameters. Redirect the user directly to this address.
          example: https://fivetran.com/connect-card/setup?redirect_uri=https://your.site/path&auth=eyJ0e...&hide_setup_guide=true
    ConnectCardConfig:
      required:
        - redirect_uri
      type: object
      properties:
        redirect_uri:
          type: string
          description: The URI on your site we redirect the end user to after successful setup. The URI must start with the `https` or `http` prefix.
          example: https://your.site/path
        hide_setup_guide:
          type: boolean
          description: An optional parameter that lets you hide the embedded setup guide in the Connect Card.
          example: true
        all_fields:
          type: boolean
          description: An optional parameter that lets you show all fields on Connect Card including those that are hidden by default for certain connectors.
          example: true
    DestinationConfiguration:
      type: object
      properties:
        virtual_warehouse:
          type: string
          description: Snowflake's virtual warehouse used in the connection
          example: virtual_warehouse
    ConnectionTask:
      type: object
      properties:
        code:
          type: string
          description: A machine-readable identifier for the condition type. Use this value to programmatically detect and respond to specific connection conditions.
        message:
          type: string
          description: 'A human-readable label describing the condition. For example: Reconnect, Resync Table Warning.'
        details:
          type: string
          description: Additional context about this condition beyond the message field.
    ConnectionWarning:
      type: object
      properties:
        code:
          type: string
          description: A machine-readable identifier for the condition type. Use this value to programmatically detect and respond to specific connection conditions.
        message:
          type: string
          description: 'A human-readable label describing the condition. For example: Reconnect, Resync Table Warning.'
        details:
          type: string
          description: Additional context about this condition beyond the message field.
