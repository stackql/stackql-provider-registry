id: fivetran
name: fivetran
version: v00.00.00000
providerServices:
  account:
    id: account:v00.00.00000
    name: account
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/account.yaml
    title: Fivetran Account API
    version: v00.00.00000
    description: Account information, roles and system keys.
  certificates:
    id: certificates:v00.00.00000
    name: certificates
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/certificates.yaml
    title: Fivetran Certificates API
    version: v00.00.00000
    description: >-
      TLS certificates and SSH fingerprints approved for connections and
      destinations.
  connections:
    id: connections:v00.00.00000
    name: connections
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/connections.yaml
    title: Fivetran Connections API
    version: v00.00.00000
    description: >-
      Connections (formerly connectors): lifecycle, sync and resync, state, sync
      history, warnings, and the schema, table and column configuration.
  connector_sdk:
    id: connector_sdk:v00.00.00000
    name: connector_sdk
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/connector_sdk.yaml
    title: Fivetran Connector SDK API
    version: v00.00.00000
    description: Connector SDK packages.
  destinations:
    id: destinations:v00.00.00000
    name: destinations
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/destinations.yaml
    title: Fivetran Destinations API
    version: v00.00.00000
    description: Destinations and their setup tests.
  external_logging:
    id: external_logging:v00.00.00000
    name: external_logging
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/external_logging.yaml
    title: Fivetran External Logging API
    version: v00.00.00000
    description: Log services at group and account level.
  external_secrets_managers:
    id: external_secrets_managers:v00.00.00000
    name: external_secrets_managers
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/external_secrets_managers.yaml
    title: Fivetran External Secrets Managers API
    version: v00.00.00000
    description: External secrets managers and the entities that use them.
  groups:
    id: groups:v00.00.00000
    name: groups
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/groups.yaml
    title: Fivetran Groups API
    version: v00.00.00000
    description: Groups, their users and connections, SSH public key and service account.
  hybrid_deployment:
    id: hybrid_deployment:v00.00.00000
    name: hybrid_deployment
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/hybrid_deployment.yaml
    title: Fivetran Hybrid Deployment API
    version: v00.00.00000
    description: Hybrid deployment agents and HVR hub registration.
  metadata:
    id: metadata:v00.00.00000
    name: metadata
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/metadata.yaml
    title: Fivetran Connector Metadata API
    version: v00.00.00000
    description: Connector types and their configuration metadata.
  networking:
    id: networking:v00.00.00000
    name: networking
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/networking.yaml
    title: Fivetran Networking API
    version: v00.00.00000
    description: Private links and proxy agents.
  teams:
    id: teams:v00.00.00000
    name: teams
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/teams.yaml
    title: Fivetran Teams API
    version: v00.00.00000
    description: Teams and their user, group and connection memberships.
  transformations:
    id: transformations:v00.00.00000
    name: transformations
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/transformations.yaml
    title: Fivetran Transformations API
    version: v00.00.00000
    description: Transformations, transformation projects and quickstart package metadata.
  users:
    id: users:v00.00.00000
    name: users
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/users.yaml
    title: Fivetran Users API
    version: v00.00.00000
    description: Users, API keys, and group and connection memberships.
  webhooks:
    id: webhooks:v00.00.00000
    name: webhooks
    preferred: true
    service:
      $ref: fivetran/v00.00.00000/services/webhooks.yaml
    title: Fivetran Webhooks API
    version: v00.00.00000
    description: Account and group webhooks.
config:
  auth:
    type: basic
    valuePrefix: 'Basic '
    username_var: FIVETRAN_APIKEY
    password_var: FIVETRAN_APISECRET
  snake_case_aliases: true
