openapi: 3.0.0
info:
  title: ai_gateway API
  description: netlify ai_gateway API
  version: 2.57.0
paths:
  /ai-gateway/providers:
    get:
      operationId: getAIGatewayProviders
      tags:
        - aiGateway
      security: []
      responses:
        '200':
          description: The mapping of providers and supported models
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    additionalProperties:
                      type: object
                      properties:
                        token_env_var:
                          type: string
                        url_env_var:
                          type: string
                        models:
                          type: array
                          items:
                            type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
  /sites/{site_id}/ai-gateway/token:
    get:
      operationId: getAIGatewayToken
      tags:
        - aiGateway
      responses:
        '200':
          description: AI Gateway token for the site
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The AI Gateway authentication token
                  url:
                    type: string
                    description: AI gateway base url
                  expires_at:
                    type: integer
                    format: int64
                    description: Unix timestamp when the token expires
        '404':
          description: AI Gateway not available for this site
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      description: Returns an AI Gateway token for a specific site
      parameters:
        - name: site_id
          in: path
          required: true
          description: The site ID
          schema:
            type: string
  /accounts/{account_id}/ai-gateway/token:
    get:
      operationId: getAccountAIGatewayToken
      tags:
        - aiGateway
      responses:
        '200':
          description: AI Gateway token for the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The AI Gateway authentication token
                  url:
                    type: string
                    description: AI gateway base url
                  expires_at:
                    type: integer
                    format: int64
                    description: Unix timestamp when the token expires
        '404':
          description: AI Gateway not available for this account
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      description: Returns an AI Gateway token scoped to an account
      parameters:
        - name: account_id
          in: path
          required: true
          description: The account ID
          schema:
            type: string
components:
  x-stackQL-resources:
    providers:
      id: netlify.ai_gateway.providers
      name: providers
      title: Providers
      methods:
        get:
          operation:
            $ref: '#/paths/~1ai-gateway~1providers/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/providers/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
    tokens:
      id: netlify.ai_gateway.tokens
      name: tokens
      title: Tokens
      methods:
        get_for_site:
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1ai-gateway~1token/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        get_for_account:
          operation:
            $ref: '#/paths/~1accounts~1{account_id}~1ai-gateway~1token/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/tokens/methods/get_for_site'
          - $ref: '#/components/x-stackQL-resources/tokens/methods/get_for_account'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.netlify.com/api/v1
x-stackQL-config:
  pagination:
    requestToken:
      key: ''
      location: request
    responseToken:
      key: Link
      location: header
