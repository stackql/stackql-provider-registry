openapi: 3.0.0
info:
  title: services API
  description: netlify services API
  version: 2.57.0
paths:
  /sites/{site_id}/service-instances:
    get:
      operationId: listServiceInstancesForSite
      tags:
        - serviceInstance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    url:
                      type: string
                    config:
                      type: string
                      description: (opaque JSON object)
                    external_attributes:
                      type: string
                      description: (opaque JSON object)
                    service_slug:
                      type: string
                    service_path:
                      type: string
                    service_name:
                      type: string
                    env:
                      type: string
                      description: (opaque JSON object)
                    snippets:
                      type: array
                      items:
                        type: string
                        description: (opaque JSON object)
                    auth_url:
                      type: string
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
  /sites/{site_id}/services/{addon}/instances:
    post:
      operationId: createServiceInstance
      tags:
        - serviceInstance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stackqlServiceInstancesCreateBody'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  url:
                    type: string
                  config:
                    type: string
                    description: (opaque JSON object)
                  external_attributes:
                    type: string
                    description: (opaque JSON object)
                  service_slug:
                    type: string
                  service_path:
                    type: string
                  service_name:
                    type: string
                  env:
                    type: string
                    description: (opaque JSON object)
                  snippets:
                    type: array
                    items:
                      type: string
                      description: (opaque JSON object)
                  auth_url:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
        - name: addon
          in: path
          required: true
          schema:
            type: string
  /sites/{site_id}/services/{addon}/instances/{instance_id}:
    get:
      operationId: showServiceInstance
      tags:
        - serviceInstance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  url:
                    type: string
                  config:
                    type: string
                    description: (opaque JSON object)
                  external_attributes:
                    type: string
                    description: (opaque JSON object)
                  service_slug:
                    type: string
                  service_path:
                    type: string
                  service_name:
                    type: string
                  env:
                    type: string
                    description: (opaque JSON object)
                  snippets:
                    type: array
                    items:
                      type: string
                      description: (opaque JSON object)
                  auth_url:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
        - name: addon
          in: path
          required: true
          schema:
            type: string
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: updateServiceInstance
      tags:
        - serviceInstance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stackqlServiceInstancesUpdateBody'
        required: true
      responses:
        '204':
          description: No Content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
        - name: addon
          in: path
          required: true
          schema:
            type: string
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: deleteServiceInstance
      tags:
        - serviceInstance
      responses:
        '204':
          description: Deleted
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
        - name: addon
          in: path
          required: true
          schema:
            type: string
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
  /services/:
    get:
      operationId: getServices
      tags:
        - service
      responses:
        '200':
          description: services
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    slug:
                      type: string
                    service_path:
                      type: string
                    long_description:
                      type: string
                    description:
                      type: string
                    events:
                      type: array
                      items:
                        type: string
                        description: (opaque JSON object)
                    tags:
                      type: array
                      items:
                        type: string
                    icon:
                      type: string
                    manifest_url:
                      type: string
                    environments:
                      type: array
                      items:
                        type: string
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: search
          in: query
          schema:
            type: string
  /services/{addon_name}:
    get:
      operationId: showService
      tags:
        - service
      responses:
        '200':
          description: services
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  service_path:
                    type: string
                  long_description:
                    type: string
                  description:
                    type: string
                  events:
                    type: array
                    items:
                      type: string
                      description: (opaque JSON object)
                  tags:
                    type: array
                    items:
                      type: string
                  icon:
                    type: string
                  manifest_url:
                    type: string
                  environments:
                    type: array
                    items:
                      type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: addon_name
          in: path
          required: true
          schema:
            type: string
  /services/{addon_name}/manifest:
    get:
      operationId: showServiceManifest
      tags:
        - service
      responses:
        '201':
          description: retrieving from provider
          content:
            application/json:
              schema:
                type: string
                description: (opaque JSON object)
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: addon_name
          in: path
          required: true
          schema:
            type: string
components:
  requestBodies:
    updateSiteMetadataMetadata:
      content:
        application/json:
          schema:
            type: string
            description: (opaque JSON object)
      required: true
  schemas:
    stackqlServiceInstancesCreateBody:
      type: object
      required:
        - config
      properties:
        config:
          type: object
          additionalProperties: true
          description: Add-on specific configuration object; sent verbatim as the request body.
    stackqlServiceInstancesUpdateBody:
      type: object
      required:
        - config
      properties:
        config:
          type: object
          additionalProperties: true
          description: Add-on specific configuration object; sent verbatim as the request body.
    stackqlServiceManifestsGetResponse:
      type: object
      properties:
        manifest:
          type: object
          additionalProperties: true
          description: The add-on service manifest (opaque JSON).
  x-stackQL-resources:
    service_instances:
      id: netlify.services.service_instances
      name: service_instances
      title: Service Instances
      methods:
        list:
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1service-instances/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1services~1{addon}~1instances/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
          request:
            mediaType: application/json
            required:
              - config
            schema_override:
              $ref: '#/components/schemas/stackqlServiceInstancesCreateBody'
            transform:
              type: golang_template_json_v0.3.0
              body: '{{ toJson .config }}'
        get:
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1services~1{addon}~1instances~1{instance_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1services~1{addon}~1instances~1{instance_id}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            mediaType: application/json
            required:
              - config
            schema_override:
              $ref: '#/components/schemas/stackqlServiceInstancesUpdateBody'
            transform:
              type: golang_template_json_v0.3.0
              body: '{{ toJson .config }}'
        delete:
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1services~1{addon}~1instances~1{instance_id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/service_instances/methods/get'
          - $ref: '#/components/x-stackQL-resources/service_instances/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/service_instances/methods/create'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/service_instances/methods/delete'
        replace:
          - $ref: '#/components/x-stackQL-resources/service_instances/methods/update'
    services:
      id: netlify.services.services
      name: services
      title: Services
      methods:
        list:
          operation:
            $ref: '#/paths/~1services~1/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        get:
          operation:
            $ref: '#/paths/~1services~1{addon_name}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/services/methods/get'
          - $ref: '#/components/x-stackQL-resources/services/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    service_manifests:
      id: netlify.services.service_manifests
      name: service_manifests
      title: Service Manifests
      methods:
        get:
          operation:
            $ref: '#/paths/~1services~1{addon_name}~1manifest/get'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/stackqlServiceManifestsGetResponse'
            transform:
              type: golang_template_json_v0.3.0
              body: '{"manifest": {{ toJson . }}}'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/service_manifests/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.netlify.com/api/v1
x-stackQL-config:
  pagination:
    requestToken:
      key: ''
      location: request
    responseToken:
      key: Link
      location: header
