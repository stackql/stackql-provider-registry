openapi: 3.0.0
info:
  title: builds API
  description: netlify builds API
  version: 2.57.0
paths:
  /sites/{site_id}/build_hooks:
    get:
      operationId: listSiteBuildHooks
      tags:
        - buildHook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    branch:
                      type: string
                    url:
                      type: string
                    site_id:
                      type: string
                    created_at:
                      type: string
                      format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
    post:
      operationId: createSiteBuildHook
      tags:
        - buildHook
      requestBody:
        $ref: '#/components/requestBodies/createSiteBuildHookBuildhook'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  branch:
                    type: string
                  url:
                    type: string
                  site_id:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
  /sites/{site_id}/build_hooks/{id}:
    get:
      operationId: getSiteBuildHook
      tags:
        - buildHook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  branch:
                    type: string
                  url:
                    type: string
                  site_id:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: updateSiteBuildHook
      tags:
        - buildHook
      requestBody:
        $ref: '#/components/requestBodies/createSiteBuildHookBuildhook'
      responses:
        '204':
          description: No content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: deleteSiteBuildHook
      tags:
        - buildHook
      responses:
        '204':
          description: No content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
  /sites/{site_id}/builds:
    get:
      operationId: listSiteBuilds
      tags:
        - build
      parameters:
        - name: page
          required: false
          in: query
          schema:
            type: integer
            format: int32
        - name: per_page
          required: false
          in: query
          schema:
            type: integer
            format: int32
        - name: site_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    deploy_id:
                      type: string
                    sha:
                      type: string
                    done:
                      type: boolean
                    error:
                      type: string
                    created_at:
                      type: string
                      format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
    post:
      operationId: createSiteBuild
      tags:
        - build
      description: >
        Runs a build for a site. The build will be scheduled to run at the first
        opportunity, but it might not start immediately if insufficient account
        build capacity is available.


        Files for build can be uploaded as a zipped site using one of these
        methods:

        1. Set Content-Type to 'application/zip' and send the zip file as the
        raw request body

        2. Set Content-Type to 'multipart/form-data' and include the zip file in
        the 'zip' field
      parameters:
        - name: branch
          description: >-
            If no branch is specified, it is treated as a production deploy If a
            branch IS specified and matches the main branch, it is also
            production If a branch is specified and doesn't match the main
            branch, it is a branch deploy
          required: false
          in: query
          schema:
            type: string
        - name: clear_cache
          description: Whether to clear the build cache before building
          required: false
          in: query
          schema:
            type: boolean
        - name: image
          description: The build image tag to use for the build
          required: false
          in: query
          schema:
            type: string
        - name: template_id
          description: The build template to use for the build
          required: false
          in: query
          schema:
            type: string
        - name: title
          description: The title of the build
          required: false
          in: query
          schema:
            type: string
        - name: site_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                zip:
                  description: >
                    A zip file containing the site files to build.

                    Only used with Content-Type 'multipart/form-data'.

                    Alternatively, set Content-Type to 'application/zip' and
                    send the zip as the raw request body (no 'zip' parameter
                    needed).
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  deploy_id:
                    type: string
                  sha:
                    type: string
                  done:
                    type: boolean
                  error:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '422':
          description: Unprocessable Entity
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
  /builds/{build_id}:
    get:
      operationId: getSiteBuild
      tags:
        - build
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  deploy_id:
                    type: string
                  sha:
                    type: string
                  done:
                    type: boolean
                  error:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: build_id
          in: path
          required: true
          schema:
            type: string
  /builds/{build_id}/log:
    post:
      operationId: updateSiteBuildLog
      tags:
        - buildLogMsg
      responses:
        '204':
          description: No content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: build_id
          in: path
          required: true
          schema:
            type: string
  /builds/{build_id}/start:
    post:
      operationId: notifyBuildStart
      tags:
        - build
      responses:
        '204':
          description: No content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: build_id
          in: path
          required: true
          schema:
            type: string
        - name: buildbot_version
          in: query
          required: false
          schema:
            type: string
        - name: build_version
          in: query
          required: false
          schema:
            type: string
        - name: task_id
          in: query
          required: false
          schema:
            type: string
  /{account_id}/builds/status:
    get:
      operationId: getAccountBuildStatus
      tags:
        - build
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    active:
                      type: integer
                    pending_concurrency:
                      type: integer
                    enqueued:
                      type: integer
                    build_count:
                      type: integer
                    minutes:
                      type: object
                      properties:
                        current:
                          type: integer
                        current_average_sec:
                          type: integer
                        previous:
                          type: integer
                        period_start_date:
                          type: string
                          format: dateTime
                        period_end_date:
                          type: string
                          format: dateTime
                        last_updated_at:
                          type: string
                          format: dateTime
                        included_minutes:
                          type: string
                        included_minutes_with_packs:
                          type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
components:
  requestBodies:
    createSiteBuildHookBuildhook:
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              branch:
                type: string
      required: true
  schemas: {}
  x-stackQL-resources:
    build_hooks:
      id: netlify.builds.build_hooks
      name: build_hooks
      title: Build Hooks
      methods:
        list:
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1build_hooks/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1build_hooks/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        get:
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1build_hooks~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1build_hooks~1{id}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
        delete:
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1build_hooks~1{id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/build_hooks/methods/get'
          - $ref: '#/components/x-stackQL-resources/build_hooks/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/build_hooks/methods/create'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/build_hooks/methods/delete'
        replace:
          - $ref: '#/components/x-stackQL-resources/build_hooks/methods/update'
    builds:
      id: netlify.builds.builds
      name: builds
      title: Builds
      methods:
        list:
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1builds/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1sites~1{site_id}~1builds/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        get:
          operation:
            $ref: '#/paths/~1builds~1{build_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update_log:
          operation:
            $ref: '#/paths/~1builds~1{build_id}~1log/post'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
        notify_start:
          operation:
            $ref: '#/paths/~1builds~1{build_id}~1start/post'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/builds/methods/list'
          - $ref: '#/components/x-stackQL-resources/builds/methods/get'
        insert:
          - $ref: '#/components/x-stackQL-resources/builds/methods/create'
        update: []
        delete: []
        replace: []
    build_status:
      id: netlify.builds.build_status
      name: build_status
      title: Build Status
      methods:
        get:
          operation:
            $ref: '#/paths/~1{account_id}~1builds~1status/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/build_status/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.netlify.com/api/v1
x-stackQL-config:
  pagination:
    requestToken:
      key: ''
      location: request
    responseToken:
      key: Link
      location: header
