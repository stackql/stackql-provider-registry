openapi: 3.0.0
info:
  title: accounts API
  description: netlify accounts API
  version: 2.57.0
paths:
  /{account_slug}/members:
    get:
      operationId: listMembersForAccount
      tags:
        - member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    full_name:
                      type: string
                    email:
                      type: string
                    avatar:
                      type: string
                    role:
                      type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: account_slug
          in: path
          required: true
          schema:
            type: string
    post:
      operationId: addMemberToAccount
      tags:
        - member
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - Owner
                    - Developer
                    - Billing Admin
                    - Reviewer
                email:
                  type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    full_name:
                      type: string
                    email:
                      type: string
                    avatar:
                      type: string
                    role:
                      type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: account_slug
          in: path
          required: true
          schema:
            type: string
  /{account_slug}/members/{member_id}:
    get:
      operationId: getAccountMember
      tags:
        - member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  full_name:
                    type: string
                  email:
                    type: string
                  avatar:
                    type: string
                  role:
                    type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: account_slug
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: updateAccountMember
      tags:
        - member
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - Owner
                    - Developer
                    - Billing Admin
                    - Reviewer
                site_access:
                  type: string
                  enum:
                    - all
                    - none
                    - selected
                site_ids:
                  type: array
                  items:
                    type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  full_name:
                    type: string
                  email:
                    type: string
                  avatar:
                    type: string
                  role:
                    type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: account_slug
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: removeAccountMember
      tags:
        - member
      responses:
        '204':
          description: Not Content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: account_slug
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          schema:
            type: string
  /billing/payment_methods:
    get:
      operationId: listPaymentMethodsForUser
      tags:
        - paymentMethod
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    method_name:
                      type: string
                    type:
                      type: string
                    state:
                      type: string
                    data:
                      type: object
                      properties:
                        card_type:
                          type: string
                        last4:
                          type: string
                        email:
                          type: string
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
  /accounts/types:
    get:
      operationId: listAccountTypesForUser
      tags:
        - accountType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                    capabilities:
                      type: string
                      description: (opaque JSON object)
                    monthly_dollar_price:
                      type: integer
                    yearly_dollar_price:
                      type: integer
                    monthly_seats_addon_dollar_price:
                      type: integer
                    yearly_seats_addon_dollar_price:
                      type: integer
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
  /accounts:
    get:
      operationId: listAccountsForUser
      tags:
        - accountMembership
      parameters:
        - name: minimal
          x-internal: true
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    slug:
                      type: string
                    type:
                      type: string
                    capabilities:
                      type: object
                      properties:
                        sites:
                          type: object
                          properties:
                            included:
                              type: integer
                            used:
                              type: integer
                        collaborators:
                          type: object
                          properties:
                            included:
                              type: integer
                            used:
                              type: integer
                    billing_name:
                      type: string
                    billing_email:
                      type: string
                    billing_details:
                      type: string
                    billing_period:
                      type: string
                    payment_method_id:
                      type: string
                    type_name:
                      type: string
                    type_id:
                      type: string
                    owner_ids:
                      type: array
                      items:
                        type: string
                    roles_allowed:
                      type: array
                      items:
                        type: string
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
    post:
      operationId: createAccount
      tags:
        - accountMembership
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type_id
              properties:
                name:
                  type: string
                type_id:
                  type: string
                payment_method_id:
                  type: string
                period:
                  type: string
                  enum:
                    - monthly
                    - yearly
                extra_seats_block:
                  type: integer
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  type:
                    type: string
                  capabilities:
                    type: object
                    properties:
                      sites:
                        type: object
                        properties:
                          included:
                            type: integer
                          used:
                            type: integer
                      collaborators:
                        type: object
                        properties:
                          included:
                            type: integer
                          used:
                            type: integer
                  billing_name:
                    type: string
                  billing_email:
                    type: string
                  billing_details:
                    type: string
                  billing_period:
                    type: string
                  payment_method_id:
                    type: string
                  type_name:
                    type: string
                  type_id:
                    type: string
                  owner_ids:
                    type: array
                    items:
                      type: string
                  roles_allowed:
                    type: array
                    items:
                      type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
  /accounts/{account_id}:
    get:
      operationId: getAccount
      tags:
        - accountMembership
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  type:
                    type: string
                  capabilities:
                    type: object
                    properties:
                      sites:
                        type: object
                        properties:
                          included:
                            type: integer
                          used:
                            type: integer
                      collaborators:
                        type: object
                        properties:
                          included:
                            type: integer
                          used:
                            type: integer
                  billing_name:
                    type: string
                  billing_email:
                    type: string
                  billing_details:
                    type: string
                  billing_period:
                    type: string
                  payment_method_id:
                    type: string
                  type_name:
                    type: string
                  type_id:
                    type: string
                  owner_ids:
                    type: array
                    items:
                      type: string
                  roles_allowed:
                    type: array
                    items:
                      type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: updateAccount
      tags:
        - accountMembership
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                type_id:
                  type: string
                extra_seats_block:
                  type: integer
                billing_name:
                  type: string
                billing_email:
                  type: string
                billing_details:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  type:
                    type: string
                  capabilities:
                    type: object
                    properties:
                      sites:
                        type: object
                        properties:
                          included:
                            type: integer
                          used:
                            type: integer
                      collaborators:
                        type: object
                        properties:
                          included:
                            type: integer
                          used:
                            type: integer
                  billing_name:
                    type: string
                  billing_email:
                    type: string
                  billing_details:
                    type: string
                  billing_period:
                    type: string
                  payment_method_id:
                    type: string
                  type_name:
                    type: string
                  type_id:
                    type: string
                  owner_ids:
                    type: array
                    items:
                      type: string
                  roles_allowed:
                    type: array
                    items:
                      type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: cancelAccount
      tags:
        - accountMembership
      responses:
        '204':
          description: Not Content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
  /accounts/{account_id}/audit:
    get:
      operationId: listAccountAuditEvents
      tags:
        - auditLog
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: log_type
          in: query
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            type: integer
            format: int32
        - name: per_page
          required: false
          in: query
          schema:
            type: integer
            format: int32
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    account_id:
                      type: string
                    payload:
                      type: object
                      properties:
                        actor_id:
                          type: string
                        actor_name:
                          type: string
                        actor_email:
                          type: string
                        action:
                          type: string
                        timestamp:
                          type: string
                          format: dateTime
                        log_type:
                          type: string
                      additionalProperties:
                        type: string
                        description: (opaque JSON object)
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
components:
  schemas: {}
  x-stackQL-resources:
    members:
      id: netlify.accounts.members
      name: members
      title: Members
      methods:
        list:
          operation:
            $ref: '#/paths/~1{account_slug}~1members/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        add:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1{account_slug}~1members/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        get:
          operation:
            $ref: '#/paths/~1{account_slug}~1members~1{member_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1{account_slug}~1members~1{member_id}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        remove:
          operation:
            $ref: '#/paths/~1{account_slug}~1members~1{member_id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/members/methods/get'
          - $ref: '#/components/x-stackQL-resources/members/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/members/methods/add'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/members/methods/remove'
        replace:
          - $ref: '#/components/x-stackQL-resources/members/methods/update'
    payment_methods:
      id: netlify.accounts.payment_methods
      name: payment_methods
      title: Payment Methods
      methods:
        list:
          operation:
            $ref: '#/paths/~1billing~1payment_methods/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/payment_methods/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    account_types:
      id: netlify.accounts.account_types
      name: account_types
      title: Account Types
      methods:
        list:
          operation:
            $ref: '#/paths/~1accounts~1types/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/account_types/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    accounts:
      id: netlify.accounts.accounts
      name: accounts
      title: Accounts
      methods:
        list:
          operation:
            $ref: '#/paths/~1accounts/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1accounts/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        get:
          operation:
            $ref: '#/paths/~1accounts~1{account_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1accounts~1{account_id}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        cancel:
          operation:
            $ref: '#/paths/~1accounts~1{account_id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/accounts/methods/get'
          - $ref: '#/components/x-stackQL-resources/accounts/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/accounts/methods/create'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/accounts/methods/cancel'
        replace:
          - $ref: '#/components/x-stackQL-resources/accounts/methods/update'
    audit_events:
      id: netlify.accounts.audit_events
      name: audit_events
      title: Audit Events
      methods:
        list:
          operation:
            $ref: '#/paths/~1accounts~1{account_id}~1audit/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/audit_events/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.netlify.com/api/v1
x-stackQL-config:
  pagination:
    requestToken:
      key: ''
      location: request
    responseToken:
      key: Link
      location: header
