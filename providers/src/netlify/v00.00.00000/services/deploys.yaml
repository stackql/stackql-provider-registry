components:
  requestBodies:
    createSiteDeployDeploy:
      content:
        application/json:
          schema:
            type: object
            description: |
              Deploy files can be provided in two ways:
              1. As a JSON object using 'files' (a hash mapping file paths to SHA1 digests), OR
              2. As a zip file using one of these methods:
                 - Set Content-Type to 'application/zip' and send the zip file as the raw request body
                 - Include the zip file content in the 'zip' field of this JSON object with Content-Type 'application/json'
            properties:
              files:
                type: string
                description: A hash mapping file paths to SHA1 digests of the file contents. (opaque JSON object)
              zip:
                type: string
                format: binary
                description: |
                  A zip file containing the site files to deploy. Alternative to 'files'.
                  To use this field, set Content-Type to 'application/json' and include the zip content here.
                  Alternatively, you can set Content-Type to 'application/zip' and send the zip as the raw request body (not as JSON).
              draft:
                type: boolean
              async:
                type: boolean
              functions:
                type: string
                description: (opaque JSON object)
              edge_functions:
                type: string
                description: |-
                  A hash mapping edge-function bundle formats to the code_sha of each bundle. The
                  response's required_edge_functions lists which of these still need to be uploaded.
                   (opaque JSON object)
              function_schedules:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    cron:
                      type: string
              functions_config:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    display_name:
                      type: string
                    generator:
                      type: string
                    build_data:
                      type: string
                      description: (opaque JSON object)
                    memory:
                      type: integer
                      description: |
                        The function's memory allocation in MB. Mutually exclusive with `vcpu`.
                    routes:
                      type: array
                      items:
                        type: object
                        properties:
                          pattern:
                            type: string
                          literal:
                            type: string
                          expression:
                            type: string
                          methods:
                            type: array
                            items:
                              type: string
                              enum:
                                - GET
                                - POST
                                - PUT
                                - PATCH
                                - DELETE
                                - OPTIONS
                          prefer_static:
                            type: boolean
                    excluded_routes:
                      type: array
                      items:
                        type: object
                        properties:
                          pattern:
                            type: string
                          literal:
                            type: string
                          expression:
                            type: string
                    priority:
                      type: integer
                    region:
                      type: string
                    traffic_rules:
                      type: object
                      properties:
                        action:
                          type: object
                          properties:
                            type:
                              type: string
                            config:
                              type: object
                              properties:
                                to:
                                  type: string
                                rate_limit_config:
                                  type: object
                                  properties:
                                    algorithm:
                                      type: string
                                      enum:
                                        - sliding_window
                                    window_size:
                                      type: integer
                                    window_limit:
                                      type: integer
                                aggregate:
                                  type: object
                                  properties:
                                    keys:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          type:
                                            type: string
                                            enum:
                                              - ip
                                              - domain
                    vcpu:
                      type: number
                      format: float
                      description: |
                        Number of vCPUs to provision for the function. Allowed range is
                        0.5–2.
                    event_subscriptions:
                      type: array
                      items:
                        type: string
              branch:
                type: string
              framework:
                type: string
              framework_version:
                type: string
              environment:
                description: |
                  A list of deploy-specific environment variable data. Data specified this way applies only
                  to this specific deploy and is merged into any existing environment variables set on the
                  account and site.

                  Deploy-specific environment variable data takes precedence over account and site
                  environment variable data: For example, a deploy-specific variable with the key `NODE_ENV`
                  will take priority over any existing site- and account-level environment variable data
                  with the key `NODE_ENV`.

                  Environment variable data may be provided at one of two times:

                  - When creating a new Deploy with deploy files (most common)
                  - When finalizing an existing Deploy with deploy files

                  Once set, environment variables for a specific deploy cannot be modified. Subsequent
                  attempts to modify environment variable data for a deploy will be ignored.
                type: array
                items:
                  type: object
                  required:
                    - key
                    - value
                    - scopes
                    - is_secret
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                    is_secret:
                      type: boolean
                    scopes:
                      type: array
                      items:
                        type: string
                        enum:
                          - builds
                          - functions
                          - runtime
                          - post-processing
      required: true
    uploadDeployFileFileBody:
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
      required: true
  schemas:
    stackqlDeploysUploadFileBody:
      type: object
      required:
        - file_body
      properties:
        file_body:
          type: string
          x-stackQL-stringOnly: true
          description: Raw file contents sent as the application/octet-stream request body.
    stackqlDeploysUploadFunctionBody:
      type: object
      required:
        - file_body
      properties:
