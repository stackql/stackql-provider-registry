  /deploys/{deploy_id}/validations_report:
    patch:
      operationId: updateDeployValidations
      tags:
        - deploy
      description: Updates the deploy validations report for a deploy.
      x-internal: true
      x-controller: api/v1/deploys
      x-action: validations_report
      parameters:
        - name: deploy_id
          description: The ID of the deploy
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                secrets_scan:
                  type: string
                  description: (opaque JSON object)
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The id of the deploy validations report
                  deploy_id:
                    type: string
                    description: The id of the deploy
                  secret_scan_result:
                    type: object
                    properties:
                      scannedFilesCount:
                        type: integer
                        description: The number of files scanned
                      secretsScanMatches:
                        type: array
                        items:
                          type: string
                        description: The list of secrets scan matches
