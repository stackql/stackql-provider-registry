openapi: 3.0.0
info:
  title: deploys API
  description: netlify deploys API
  version: 2.57.0
paths:
  /sites/{site_id}/deploys:
    get:
      operationId: listSiteDeploys
      tags:
        - deploy
      parameters:
        - name: page
          required: false
          in: query
          schema:
            type: integer
            format: int32
        - name: per_page
          required: false
          in: query
          schema:
            type: integer
            format: int32
        - name: site_id
          in: path
          required: true
          schema:
            type: string
        - name: deploy-previews
          in: query
          schema:
            type: boolean
        - name: production
          in: query
          schema:
            type: boolean
        - name: state
          in: query
          schema:
            type: string
            enum:
              - new
              - pending_review
              - accepted
              - rejected
              - enqueued
              - building
              - uploading
              - uploaded
              - preparing
              - prepared
              - processing
              - processed
              - ready
              - error
              - retrying
        - name: branch
          in: query
          schema:
            type: string
        - name: latest-published
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    site_id:
                      type: string
                    user_id:
                      type: string
                    build_id:
                      type: string
                    state:
                      type: string
                    name:
                      type: string
                    url:
                      type: string
                    ssl_url:
                      type: string
                    admin_url:
                      type: string
                    deploy_url:
                      type: string
                    deploy_ssl_url:
                      type: string
                    screenshot_url:
                      type: string
                    review_id:
                      type: number
                    draft:
                      type: boolean
                    required:
                      type: array
                      items:
                        type: string
                    required_functions:
                      type: array
                      items:
                        type: string
                    required_edge_functions:
                      type: array
                      items:
                        type: string
                      description: |
                        An array of code_shas for the edge-function bundles that need to be uploaded to
                        complete the deploy.
                    error_message:
                      type: string
                    branch:
                      type: string
                    commit_ref:
                      type: string
                    commit_url:
                      type: string
                    skipped:
                      type: boolean
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
                    published_at:
                      type: string
                      format: dateTime
                    title:
                      type: string
                    context:
                      type: string
                    locked:
                      type: boolean
                    review_url:
                      type: string
                    framework:
                      type: string
                    skew_protection_token:
                      type: string
                    function_schedules:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          cron:
                            type: string
                    functions_region:
                      type: string
                      description: |
                        The functions region for this deploy as an airport code.
                    functions_region_overrides:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          region:
                            type: string
                      description: |
                        Functions in the deploy that explicitly specify their own region
                        (airport code).
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
    post:
      operationId: createSiteDeploy
      tags:
        - deploy
      parameters:
        - name: title
          in: query
          schema:
            type: string
        - name: site_id
          in: path
          required: true
          schema:
            type: string
        - name: deploy-previews
          in: query
          schema:
            type: boolean
        - name: production
          in: query
          schema:
            type: boolean
        - name: state
          in: query
          schema:
            type: string
            enum:
              - new
              - pending_review
              - accepted
              - rejected
              - enqueued
              - building
              - uploading
              - uploaded
              - preparing
              - prepared
              - processing
              - processed
              - ready
              - error
              - retrying
        - name: branch
          in: query
          schema:
            type: string
        - name: latest-published
          in: query
          schema:
            type: boolean
      requestBody:
        $ref: '#/components/requestBodies/createSiteDeployDeploy'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  site_id:
                    type: string
                  user_id:
                    type: string
                  build_id:
                    type: string
                  state:
                    type: string
                  name:
                    type: string
                  url:
                    type: string
                  ssl_url:
                    type: string
                  admin_url:
                    type: string
                  deploy_url:
                    type: string
                  deploy_ssl_url:
                    type: string
                  screenshot_url:
                    type: string
                  review_id:
                    type: number
                  draft:
                    type: boolean
                  required:
                    type: array
                    items:
                      type: string
                  required_functions:
                    type: array
                    items:
                      type: string
                  required_edge_functions:
                    type: array
                    items:
                      type: string
                    description: |
                      An array of code_shas for the edge-function bundles that need to be uploaded to
                      complete the deploy.
                  error_message:
                    type: string
                  branch:
                    type: string
                  commit_ref:
                    type: string
                  commit_url:
                    type: string
                  skipped:
                    type: boolean
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
                  published_at:
                    type: string
                    format: dateTime
                  title:
                    type: string
                  context:
                    type: string
                  locked:
                    type: boolean
                  review_url:
                    type: string
                  framework:
                    type: string
                  skew_protection_token:
                    type: string
                  function_schedules:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        cron:
                          type: string
                  functions_region:
                    type: string
                    description: |
                      The functions region for this deploy as an airport code.
                  functions_region_overrides:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        region:
                          type: string
                    description: |
                      Functions in the deploy that explicitly specify their own region
                      (airport code).
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
