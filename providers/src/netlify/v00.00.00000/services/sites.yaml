          schema:
            type: string
        - name: key
          in: query
          description: PEM-encoded private key. Required when updating an existing certificate.
          schema:
            type: string
        - name: ca_certificates
          in: query
          description: PEM-encoded CA certificate chain. Required when updating an existing certificate.
