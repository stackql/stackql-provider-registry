openapi: 3.0.0
info:
  title: dns API
  description: netlify dns API
  version: 2.57.0
paths:
  /dns_zones:
    post:
      operationId: createDnsZone
      tags:
        - dnsZone
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_slug:
                  type: string
                site_id:
                  type: string
                name:
                  type: string
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  supported_record_types:
                    type: array
                    items:
                      type: string
                  user_id:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        hostname:
                          type: string
                        type:
                          type: string
                        value:
                          type: string
                        ttl:
                          type: integer
                          format: int64
                        priority:
                          type: integer
                          format: int64
                        dns_zone_id:
                          type: string
                        site_id:
                          type: string
                        flag:
                          type: integer
                        tag:
                          type: string
                        managed:
                          type: boolean
                  dns_servers:
                    type: array
                    items:
                      type: string
                  account_id:
                    type: string
                  site_id:
                    type: string
                  account_slug:
                    type: string
                  account_name:
                    type: string
                  domain:
                    type: string
                  ipv6_enabled:
                    type: boolean
                  dedicated:
                    type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
    get:
      operationId: getDnsZones
      tags:
        - dnsZone
      parameters:
        - name: account_slug
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: get all DNS zones the user has access to
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    errors:
                      type: array
                      items:
                        type: string
                    supported_record_types:
                      type: array
                      items:
                        type: string
                    user_id:
                      type: string
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
                    records:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          hostname:
                            type: string
                          type:
                            type: string
                          value:
                            type: string
                          ttl:
                            type: integer
                            format: int64
                          priority:
                            type: integer
                            format: int64
                          dns_zone_id:
                            type: string
                          site_id:
                            type: string
                          flag:
                            type: integer
                          tag:
                            type: string
                          managed:
                            type: boolean
                    dns_servers:
                      type: array
                      items:
                        type: string
                    account_id:
                      type: string
                    site_id:
                      type: string
                    account_slug:
                      type: string
                    account_name:
                      type: string
                    domain:
                      type: string
                    ipv6_enabled:
                      type: boolean
                    dedicated:
                      type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
  /dns_zones/{zone_id}:
    get:
      operationId: getDnsZone
      tags:
        - dnsZone
      responses:
        '200':
          description: get a single DNS zone
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  supported_record_types:
                    type: array
                    items:
                      type: string
                  user_id:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        hostname:
                          type: string
                        type:
                          type: string
                        value:
                          type: string
                        ttl:
                          type: integer
                          format: int64
                        priority:
                          type: integer
                          format: int64
                        dns_zone_id:
                          type: string
                        site_id:
                          type: string
                        flag:
                          type: integer
                        tag:
                          type: string
                        managed:
                          type: boolean
                  dns_servers:
                    type: array
                    items:
                      type: string
                  account_id:
                    type: string
                  site_id:
                    type: string
                  account_slug:
                    type: string
                  account_name:
                    type: string
                  domain:
                    type: string
                  ipv6_enabled:
                    type: boolean
                  dedicated:
                    type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: deleteDnsZone
      tags:
        - dnsZone
      responses:
        '204':
          description: delete a single DNS zone
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
  /dns_zones/{zone_id}/transfer:
    put:
      operationId: transferDnsZone
      tags:
        - dnsZone
      responses:
        '200':
          description: transfer a DNS zone to another account
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  supported_record_types:
                    type: array
                    items:
                      type: string
                  user_id:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        hostname:
                          type: string
                        type:
                          type: string
                        value:
                          type: string
                        ttl:
                          type: integer
                          format: int64
                        priority:
                          type: integer
                          format: int64
                        dns_zone_id:
                          type: string
                        site_id:
                          type: string
                        flag:
                          type: integer
                        tag:
                          type: string
                        managed:
                          type: boolean
                  dns_servers:
                    type: array
                    items:
                      type: string
                  account_id:
                    type: string
                  site_id:
                    type: string
                  account_slug:
                    type: string
                  account_name:
                    type: string
                  domain:
                    type: string
                  ipv6_enabled:
                    type: boolean
                  dedicated:
                    type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          description: the account of the dns zone
          required: true
          schema:
            type: string
        - name: transfer_account_id
          in: query
          description: the account you want to transfer the dns zone to
          required: true
          schema:
            type: string
        - name: transfer_user_id
          in: query
          description: the user you want to transfer the dns zone to
          required: true
          schema:
            type: string
  /dns_zones/{zone_id}/dns_records:
    get:
      operationId: getDnsRecords
      tags:
        - dnsZone
      responses:
        '200':
          description: get all DNS records for a single DNS zone
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    hostname:
                      type: string
                    type:
                      type: string
                    value:
                      type: string
                    ttl:
                      type: integer
                      format: int64
                    priority:
                      type: integer
                      format: int64
                    dns_zone_id:
                      type: string
                    site_id:
                      type: string
                    flag:
                      type: integer
                    tag:
                      type: string
                    managed:
                      type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
    post:
      operationId: createDnsRecord
      tags:
        - dnsZone
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                hostname:
                  type: string
                value:
                  type: string
                ttl:
                  type: integer
                  format: int64
                priority:
                  type: integer
                  format: int64
                weight:
                  type: integer
                  format: int64
                port:
                  type: integer
                  format: int64
                flag:
                  type: integer
                  format: int64
                tag:
                  type: string
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  hostname:
                    type: string
                  type:
                    type: string
                  value:
                    type: string
                  ttl:
                    type: integer
                    format: int64
                  priority:
                    type: integer
                    format: int64
                  dns_zone_id:
                    type: string
                  site_id:
                    type: string
                  flag:
                    type: integer
                  tag:
                    type: string
                  managed:
                    type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
  /dns_zones/{zone_id}/dns_records/{dns_record_id}:
    get:
      operationId: getIndividualDnsRecord
      tags:
        - dnsZone
      responses:
        '200':
          description: get a single DNS record
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  hostname:
                    type: string
                  type:
                    type: string
                  value:
                    type: string
                  ttl:
                    type: integer
                    format: int64
                  priority:
                    type: integer
                    format: int64
                  dns_zone_id:
                    type: string
                  site_id:
                    type: string
                  flag:
                    type: integer
                  tag:
                    type: string
                  managed:
                    type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
        - name: dns_record_id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: deleteDnsRecord
      tags:
        - dnsZone
      responses:
        '204':
          description: record deleted
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
        - name: dns_record_id
          in: path
          required: true
          schema:
            type: string
