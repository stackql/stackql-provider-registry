openapi: 3.0.3
info:
  title: connect API
  description: vercel connect API
  version: 0.0.1
paths:
  /v2/connect/connectors:
    get:
      description: List connectors that belong to a team.
      operationId: listConnectors
      security:
        - bearerToken: []
      summary: List connectors
      tags:
        - connect
      responses:
        '200':
          description: A page of connectors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectConnectorList'
        '400':
          description: One of the provided values in the request query is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '401':
          description: The request is not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '403':
          description: You do not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '410':
          description: The requested resource is no longer available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '422':
          description: The request cannot be completed in the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
      parameters:
        - name: limit
          description: Maximum number of connectors to return. Defaults to 20.
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            description: Maximum number of connectors to return. Defaults to 20.
        - name: cursor
          description: Cursor from `pagination.next` on the previous response.
          in: query
          schema:
            type: string
            description: Cursor from `pagination.next` on the previous response.
        - name: projectId
          description: Return only connectors connected to this project.
          in: query
          schema:
            type: string
            description: Return only connectors connected to this project.
        - name: search
          description: Search connector names, UIDs, and services.
          in: query
          schema:
            type: string
            maxLength: 100
            description: Search connector names, UIDs, and services.
        - name: type
          description: 'Comma-separated connector types: `slack`, `discord`, `github`, `linear`, `linq`, `salesforce`, `sendblue`, `snowflake`, `snowflake-wif`, `microsoft-entra`, `api-key`, `photon`, `oauth`, or `custom`.'
          in: query
          schema:
            type: string
            description: 'Comma-separated connector types: `slack`, `discord`, `github`, `linear`, `linq`, `salesforce`, `sendblue`, `snowflake`, `snowflake-wif`, `microsoft-entra`, `api-key`, `photon`, `oauth`, or `custom`.'
        - name: service
          description: Comma-separated provider or service identifiers.
          in: query
          schema:
            type: string
            description: Comma-separated provider or service identifiers.
        - name: sort
          description: Sort by name in ascending order, or by creation or update time in descending order.
          in: query
          schema:
            type: string
            enum:
              - name
              - createdAt
              - updatedAt
            description: Sort by name in ascending order, or by creation or update time in descending order.
        - description: The team ID that scopes the request. Do not send it with slug. If both are omitted, Vercel uses the team associated with the token or the authenticated user's default team. The request returns 401 if no team can be selected.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The team slug that scopes the request. Do not send it with teamId. If both are omitted, Vercel uses the team associated with the token or the authenticated user's default team. The request returns 401 if no team can be selected.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/connect/connectors/{connector}:
    get:
      description: Get the connector by ID. Accepts a dashboard/team requester or a deployment's project OIDC token; project requesters may only read connectors linked to their project and environment.
      operationId: getConnector
      security:
        - bearerToken: []
      summary: Get a connector
      tags:
        - connect
      responses:
        '200':
          description: The connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectConnector'
        '400':
          description: One of the provided values in the request query is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '401':
          description: The request is not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '403':
          description: You do not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '410':
          description: The requested resource is no longer available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '422':
          description: The request cannot be completed in the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
      parameters:
        - name: connector
          description: 'Stable connector ID or URL-encoded team-scoped UID. Examples: `scl_abc123` or `slack%2Fmy-bot`.'
          in: path
          required: true
          schema:
            type: string
            description: 'Stable connector ID or URL-encoded team-scoped UID. Examples: `scl_abc123` or `slack%2Fmy-bot`.'
        - description: The team ID that scopes the request. Do not send it with slug. If both are omitted, Vercel uses the team associated with the token or the authenticated user's default team. The request returns 401 if no team can be selected.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The team slug that scopes the request. Do not send it with teamId. If both are omitted, Vercel uses the team associated with the token or the authenticated user's default team. The request returns 401 if no team can be selected.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    delete:
      description: Delete a connector, its project connections, and its installation records.
      operationId: deleteConnector
      security:
        - bearerToken: []
      summary: Delete a connector
      tags:
        - connect
      responses:
        '204':
          description: The connector, its project connections, and its installation records were deleted.
        '400':
          description: One of the provided values in the request query is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '401':
          description: The request is not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '403':
          description: You do not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '409':
          description: The request conflicts with the current resource state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '410':
          description: The requested resource is no longer available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '422':
          description: The request cannot be completed in the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
        '502':
          description: A dependency returned an invalid or unsuccessful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectError'
      parameters:
        - name: connector
          description: 'Stable connector ID or URL-encoded team-scoped UID. Examples: `scl_abc123` or `slack%2Fmy-bot`.'
          in: path
          required: true
          schema:
            type: string
            description: 'Stable connector ID or URL-encoded team-scoped UID. Examples: `scl_abc123` or `slack%2Fmy-bot`.'
        - description: The team ID that scopes the request. Do not send it with slug. If both are omitted, Vercel uses the team associated with the token or the authenticated user's default team. The request returns 401 if no team can be selected.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The team slug that scopes the request. Do not send it with teamId. If both are omitted, Vercel uses the team associated with the token or the authenticated user's default team. The request returns 401 if no team can be selected.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/connect/connectors:
