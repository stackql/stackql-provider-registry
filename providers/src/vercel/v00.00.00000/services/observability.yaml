openapi: 3.0.3
info:
  title: observability API
  description: vercel observability API
  version: 0.0.1
paths:
  /v1/observability/manage/configuration/projects:
    get:
      description: Lists the projects that are currently configured as disabled for Observability Plus on a team.
      operationId: getObservabilityConfigurationProjects
      security:
        - bearerToken: []
      summary: Lists disabled Observability Plus projects
      tags:
        - observability
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  disabledProjects:
                    items:
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        disabledAt:
                          type: number
                      required:
                        - disabledAt
                        - id
                      type: object
                    type: array
                required:
                  - disabledProjects
                type: object
        '400':
          description: ''
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/observability/manage/configuration/projects/{project_id_or_name}:
    put:
      description: Updates whether Observability Plus is disabled for a single project.
      operationId: updateObservabilityConfigurationProject
      security:
        - bearerToken: []
      summary: Updates a disabled Observability Plus project setting
      tags:
        - observability
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  disabledAt:
                    type: number
                required:
                  - id
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '429':
          description: ''
      parameters:
        - name: project_id_or_name
          description: The ID or name of the project to update
          in: path
          required: true
          schema:
            type: string
            description: The ID or name of the project to update
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - disabled
              properties:
                disabled:
                  type: boolean
                  description: Whether Observability Plus should be disabled for the project
  /v2/observability/query:
    post:
      description: ''
      operationId: createObservabilityQuery
      security: []
      tags: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
                description: (opaque JSON object)
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '408':
          description: ''
        '410':
          description: ''
        '413':
          description: ''
        '422':
          description: ''
        '500':
          description: ''
        '503':
          description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - metric
                - scope
              properties:
                metric:
                  type: string
                  description: Metric id
                scope:
                  type: string
                  description: Owner or project scope for the query (opaque JSON object)
                aggregation:
                  type: string
                  description: 'Aggregation function to apply. Some aggregations require a dimension: use <agg>/<dimension>, for example unique/visitor_id.'
                groupBy:
                  type: array
                  items:
                    type: string
                  description: Dimensions to group results by. JSON dimensions support nested refs, for example event_data/checkout_step. Nested keys containing characters that OData cannot parse as an identifier, such as '-', spaces, quotes, or '/', must be wrapped in single quotes (escape embedded single quotes by doubling them), for example flags/'enable-comments-view' or event_data/'some property''s/value'.
                filter:
                  type: string
                  description: Filter to apply to the query. JSON dimensions support nested refs, for example event_data/checkout_step eq 'payment'. Nested keys containing characters that OData cannot parse as an identifier, such as '-', spaces, quotes, or '/', must be wrapped in single quotes (escape embedded single quotes by doubling them), for example flags/'enable-comments-view' eq true or event_data/'some property''s/value' eq true.
                limit:
                  type: number
                  description: Maximum number of results
                orderBy:
                  type: string
                  description: Rollup column to order grouped results by. Use the generated rollup key for the requested metric and aggregation. Defaults to the query engine count rollup.
                orderDirection:
                  type: string
                  enum:
                    - asc
                    - desc
                  description: Direction to order grouped results by. Defaults to desc.
                granularity:
                  type: string
                  description: Time bucket size (opaque JSON object)
                startTime:
                  type: string
                  description: Start timestamp
                endTime:
                  type: string
                  description: End timestamp
                bucketTimezone:
                  type: string
                  description: IANA timezone (e.g. Europe/Paris) used only to align calendar buckets (1d/1mo) to that zone's day/month boundaries. startTime/endTime and all output timestamps are always UTC. No effect on sub-day granularities.
              additionalProperties: true
  /v2/observability/schema:
    get:
      description: ''
      operationId: getObservabilitySchema
      security: []
      tags: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  metrics:
                    items:
                      properties:
                        id:
                          type: string
                        description:
                          type: string
                      required:
                        - description
                        - id
                      type: object
                    type: array
                required:
                  - metrics
                type: object
        '400':
          description: ''
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters: []
  /v2/observability/schema/{metric_id}:
    get:
      description: ''
      operationId: getObservabilitySchemaByMetricId
      security: []
      tags: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetObservabilitySchemaByMetricIdResponse'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - name: metric_id
          in: path
          required: true
          schema:
            type: string
components:
  schemas:
    GetObservabilitySchemaByMetricIdResponse:
      type: object
      properties:
        observability_schema_by_metric_id:
          type: array
          items:
            properties:
              id:
                type: string
              description:
                type: string
              dimensions:
                items:
                  properties:
                    name:
                      type: string
                    label:
                      type: string
                    description:
                      type: string
                  required:
                    - label
                    - name
                  type: object
                type: array
              unit:
                type: string
              aggregations:
                items:
                  type: string
                type: array
              defaultAggregation:
                type: string
            required:
              - aggregations
              - defaultAggregation
              - description
              - dimensions
              - id
              - unit
            type: object
  x-stackQL-resources:
    configuration_projects:
      id: vercel.observability.configuration_projects
      name: configuration_projects
      title: Configuration Projects
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1observability~1manage~1configuration~1projects/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.disabledProjects
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1observability~1manage~1configuration~1projects~1{project_id_or_name}/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/configuration_projects/methods/list'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/configuration_projects/methods/update'
        delete: []
        replace: []
    queries:
      id: vercel.observability.queries
      name: queries
      title: Queries
      methods:
        run:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v2~1observability~1query/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select: []
        insert: []
        update: []
        delete: []
        replace: []
    schema:
      id: vercel.observability.schema
      name: schema
      title: Schema
      methods:
        list:
          operation:
            $ref: '#/paths/~1v2~1observability~1schema/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1v2~1observability~1schema~1{metric_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.observability_schema_by_metric_id
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/GetObservabilitySchemaByMetricIdResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"observability_schema_by_metric_id\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/schema/methods/get'
          - $ref: '#/components/x-stackQL-resources/schema/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.vercel.com
