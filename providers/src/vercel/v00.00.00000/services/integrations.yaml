openapi: 3.0.3
info:
  title: integrations API
  description: vercel integrations API
  version: 0.0.1
paths:
  /v1/integrations/git-namespaces:
    get:
      description: Lists git namespaces for a supported provider. Supported providers are `github`, `gitlab` and `bitbucket`. If the provider is not provided, it will try to obtain it from the user that authenticated the request.
      operationId: gitNamespaces
      security:
        - bearerToken: []
      summary: List git namespaces by provider
      tags:
        - integrations
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitNamespacesResponse'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '429':
          description: ''
        '500':
          description: ''
      parameters:
        - name: host
          description: The custom Git host if using a custom Git provider, like GitHub Enterprise Server
          in: query
          schema:
            description: The custom Git host if using a custom Git provider, like GitHub Enterprise Server
            type: string
            example: ghes-test.now.systems
        - name: provider
          in: query
          schema:
            enum:
              - github
              - github-limited
              - github-custom-host
              - gitlab
              - bitbucket
        - name: viewerMetadata
          description: When true, includes the viewer object for each namespace.
          in: query
          schema:
            description: When true, includes the viewer object for each namespace.
            type: boolean
  /v1/integrations/search-repo:
    get:
      description: Lists git repositories linked to a namespace `id` for a supported provider. A specific namespace `id` can be obtained via the `git-namespaces`  endpoint. Supported providers are `github`, `gitlab` and `bitbucket`. If the provider or namespace is not provided, it will try to obtain it from the user that authenticated the request.
      operationId: searchRepo
      security:
        - bearerToken: []
      summary: List git repositories linked to namespace by provider
      tags:
        - integrations
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: string
                        enum:
                          - installation_not_found
                      message:
                        type: string
                    required:
                      - code
                      - message
                    type: object
                  gitAccount:
                    properties:
                      provider:
                        type: string
                      namespaceId:
                        nullable: true
                        type: string
                    required:
                      - namespaceId
                      - provider
                    type: object
                  repos:
                    items:
                      properties:
                        id:
                          type: string
                        provider:
                          type: string
                          enum:
                            - cursor-origin
                        url:
                          type: string
                        name:
                          type: string
                        slug:
                          type: string
                        namespace:
                          type: string
                        ownerType:
                          type: string
                          enum:
                            - team
                            - user
                        owner:
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                          required:
                            - id
                            - name
                          type: object
                        private:
                          type: boolean
                          enum:
                            - false
                            - true
                        defaultBranch:
                          type: string
                        updatedAt:
                          type: number
                      required:
                        - defaultBranch
                        - id
                        - name
                        - namespace
                        - owner
                        - ownerType
                        - private
                        - provider
                        - slug
                        - updatedAt
                        - url
                      type: object
                    type: array
                required:
                  - error
                  - gitAccount
                  - repos
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '429':
          description: ''
        '500':
          description: ''
        '502':
          description: ''
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: namespaceId
          in: query
          schema:
            nullable: true
            oneOf:
              - type: string
              - type: number
        - name: provider
          in: query
          schema:
            enum:
              - github
              - github-limited
              - github-custom-host
              - gitlab
              - bitbucket
              - cursor-origin
        - name: installationId
          in: query
          schema:
            type: string
        - name: host
          description: The custom Git host if using a custom Git provider, like GitHub Enterprise Server
          in: query
          schema:
            description: The custom Git host if using a custom Git provider, like GitHub Enterprise Server
            type: string
            example: ghes-test.now.systems
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/integrations/integration/{integration_id_or_slug}/products/{product_id_or_slug}/plans:
    get:
      description: Get a list of billing plans for an integration and product.
      operationId: getBillingPlans
      security:
        - bearerToken: []
      summary: List integration billing plans
      tags:
        - integrations
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  plans:
                    items:
                      properties:
                        type:
                          type: string
                          enum:
                            - prepayment
                            - subscription
                        id:
                          type: string
                        name:
                          type: string
                        scope:
                          type: string
                          enum:
                            - installation
                            - resource
                        description:
                          type: string
                        paymentMethodRequired:
                          type: boolean
                          enum:
                            - false
                            - true
                        preauthorizationAmount:
                          type: number
                        initialCharge:
                          type: string
                        minimumAmount:
                          type: string
                        maximumAmount:
                          type: string
                        maximumAmountAutoPurchasePerPeriod:
                          type: string
                        cost:
                          type: string
                        details:
                          items:
                            properties:
                              label:
                                type: string
                              value:
                                type: string
                            required:
                              - label
                            type: object
                          type: array
                        highlightedDetails:
                          items:
                            properties:
                              label:
                                type: string
                              value:
                                type: string
                            required:
                              - label
                            type: object
                          type: array
                        quote:
                          items:
                            properties:
                              line:
                                type: string
                              amount:
                                type: string
                            required:
                              - amount
                              - line
                            type: object
                          type: array
                        effectiveDate:
                          type: string
                        disabled:
                          type: boolean
                          enum:
                            - false
                            - true
                      required:
                        - description
                        - id
                        - name
                        - paymentMethodRequired
                        - scope
                        - type
                      type: object
                    type: array
                required:
                  - plans
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_id_or_slug
          in: path
          required: true
          schema:
            type: string
        - name: integrationConfigurationId
          in: query
          required: false
          schema:
            type: string
        - name: product_id_or_slug
          in: path
          required: true
          schema:
            type: string
        - name: metadata
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - marketplace
              - deploy-button
              - external
              - v0
              - resource-claims
              - cli
              - oauth
              - backoffice
              - import-recommended-integrations
              - organization
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/integrations/installations/{integration_configuration_id}/resources/{resource_id}/connections:
    post:
      description: Connects an integration resource to a Vercel project. This endpoint establishes a connection between a provisioned integration resource (from storage APIs like `POST /v1/storage/stores/integration/direct`) and a specific Vercel project.
      operationId: connectIntegrationResourceToProject
      security:
        - bearerToken: []
      summary: Connect integration resource to project
      tags:
        - integrations
      responses:
        '201':
          description: ''
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
              properties:
                projectId:
                  type: string
                envVarEnvironments:
                  type: array
                  items:
                    type: string
                    enum:
                      - production
                      - preview
                      - development
                makeEnvVarsSensitive:
                  type: boolean
  /v1/integrations/configurations:
    get:
      description: Allows to retrieve all configurations for an authenticated integration. When the `project` view is used, configurations generated for the authorization flow will be filtered out of the results.
      operationId: getConfigurations
      security:
        - bearerToken: []
      summary: Get configurations for the authenticated user or team
      tags:
        - integrations
      responses:
        '200':
          description: The list of configurations for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConfigurationsResponse'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum:
              - account
              - project
        - name: installationType
          in: query
          required: false
          schema:
            type: string
            enum:
              - marketplace
              - external
              - provisioning
        - name: integrationIdOrSlug
          description: ID of the integration
          in: query
          required: false
          schema:
            type: string
            description: ID of the integration
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      x-speakeasy-test: false
  /v1/integrations/configuration/{id}:
    get:
      description: Allows to retrieve a the configuration with the provided id in case it exists. The authenticated user or team must be the owner of the config in order to access it.
      operationId: getConfiguration
      security:
        - bearerToken: []
      summary: Retrieve an integration configuration
      tags:
        - integrations
      responses:
        '200':
          description: The configuration with the provided id
          content:
            application/json:
              schema:
                properties:
                  projectSelection:
                    type: string
                    enum:
                      - all
                      - selected
                    description: A string representing the permission for projects. Possible values are `all` or `selected`.
                    example: all
                  notification:
                    properties:
                      level:
                        type: string
                        enum:
                          - error
                          - info
                          - warn
                      title:
                        type: string
                      message:
                        type: string
                      href:
                        type: string
                    required:
                      - level
                      - title
                    type: object
                  transferRequest:
                    oneOf:
                      - properties:
                          kind:
                            type: string
                            enum:
                              - transfer-to-marketplace
                          metadata:
                            additionalProperties: true
                            type: object
                          billingPlan:
                            properties:
                              id:
                                type: string
                              type:
                                type: string
                                enum:
                                  - prepayment
                                  - subscription
                              scope:
                                type: string
                                enum:
                                  - installation
                                  - resource
                              name:
                                type: string
                              description:
                                type: string
                              paymentMethodRequired:
                                type: boolean
                                enum:
                                  - false
                                  - true
                              preauthorizationAmount:
                                type: number
                            required:
                              - description
                              - id
                              - name
                              - type
                            type: object
                          requestId:
                            type: string
                          transferId:
                            type: string
                          requester:
                            properties:
                              name:
                                type: string
                              email:
                                type: string
                            required:
                              - name
                            type: object
                          createdAt:
                            type: number
                          expiresAt:
                            type: number
                          discardedAt:
                            type: number
                          discardedBy:
                            type: string
                          approvedAt:
                            type: number
                          approvedBy:
                            type: string
                          authorizationId:
                            type: string
                        required:
                          - createdAt
                          - expiresAt
                          - kind
                          - requestId
                          - requester
                          - transferId
                        type: object
                      - properties:
                          kind:
                            type: string
                            enum:
                              - transfer-from-marketplace
                          requestId:
                            type: string
                          transferId:
                            type: string
                          requester:
                            properties:
                              name:
                                type: string
                              email:
                                type: string
                            required:
                              - name
                            type: object
                          createdAt:
                            type: number
                          expiresAt:
                            type: number
                          discardedAt:
                            type: number
                          discardedBy:
                            type: string
                          approvedAt:
                            type: number
                          approvedBy:
                            type: string
                          authorizationId:
                            type: string
                        required:
                          - createdAt
                          - expiresAt
                          - kind
                          - requestId
                          - requester
                          - transferId
                        type: object
                  projects:
                    items:
                      type: string
                    type: array
                    description: When a configuration is limited to access certain projects, this will contain each of the project ID it is allowed to access. If it is not defined, the configuration has full access.
                    example:
                      - prj_xQxbutw1HpL6HLYPAzt5h75m8NjO
                  status:
                    type: string
                    enum:
                      - error
                      - onboarding
                      - pending
                      - ready
                      - resumed
                      - suspended
                      - uninstalled
                    description: The configuration status. Optional. If not defined, assume 'ready'.
                  type:
                    type: string
                    enum:
                      - integration-configuration
                  id:
                    type: string
                    description: The unique identifier of the configuration
                    example: icfg_3bwCLgxL8qt5kjRLcv2Dit7F
                  slug:
                    type: string
                    description: The slug of the integration the configuration is created for.
                    example: slack
                  createdAt:
                    type: number
                    description: A timestamp that tells you when the configuration was created
                    example: 1558531915505
                  updatedAt:
                    type: number
                    description: A timestamp that tells you when the configuration was updated.
                    example: 1558531915505
                  ownerId:
                    type: string
                    description: The user or team ID that owns the configuration
                    example: kr1PsOIzqEL5Xg6M4VZcZosf
                  deletedAt:
                    nullable: true
                    type: number
                    description: A timestamp that tells you when the configuration was deleted.
                    example: 1558531915505
                  integrationId:
                    type: string
                    description: The unique identifier of the app the configuration was created for
                    example: oac_xzpVzcUOgcB1nrVlirtKhbWV
                  userId:
                    type: string
                    description: The ID of the user that created the configuration.
                    example: kr1PsOIzqEL5Xg6M4VZcZosf
                  teamId:
                    nullable: true
                    type: string
                    description: When the configuration was created for a team, this will show the ID of the team.
                    example: team_nLlpyC6RE1qxydlFKbrxDlud
                  scopes:
                    items:
                      type: string
                    type: array
                    description: The resources that are allowed to be accessed by the configuration.
                    example:
                      - read:project
                      - read-write:log-drain
                  canConfigureOpenTelemetry:
                    type: boolean
                    enum:
                      - false
                      - true
                  completedAt:
                    type: number
                    description: A timestamp that tells you when the configuration was installed successfully
                    example: 1558531915505
                  externalId:
                    type: string
                    description: An external identifier defined by the integration vendor.
                  source:
                    type: string
                    enum:
                      - backoffice
                      - cli
                      - deploy-button
                      - external
                      - import-recommended-integrations
                      - marketplace
                      - oauth
                      - organization
                      - resource-claims
                      - v0
                    description: Source defines where the configuration was installed from. It is used to analyze user engagement for integration installations in product metrics.
                    example: marketplace
                  disabledAt:
                    type: number
                    description: 'A timestamp that tells you when the configuration was disabled. Note: Configurations can be disabled when the associated user loses access to a team. They do not function during this time until the configuration is ''transferred'', meaning the associated user is changed to one with access to the team.'
                    example: 1558531915505
                  deleteRequestedAt:
                    nullable: true
                    type: number
                    description: A timestamp that tells you when the configuration deletion has been started for cases when the deletion needs to be settled/approved by partners, such as when marketplace invoices have been paid.
                    example: 1558531915505
                  customerDeleteRequestedAt:
                    nullable: true
                    type: number
                    description: Record when the customer initited deletion, independent of whether `deleteRequestedAt` gets set.
                  disabledReason:
                    type: string
                    enum:
                      - account-plan-downgrade
                      - disabled-by-admin
                      - disabled-by-owner
                      - feature-not-available
                      - original-owner-left-the-team
                      - original-owner-role-downgraded
                  installationType:
                    type: string
                    enum:
                      - external
                      - marketplace
                    description: 'Defines the installation type. - ''external'' integrations are installed via the existing integrations flow - ''marketplace'' integrations are natively installed: - when accepting the TOS of a partner during the store creation process - if undefined, assume ''external'''
                  acceptedPoliciesInheritedFromInstallationId:
                    type: string
                    description: Historical parent installation from which acceptedPolicies were inherited. This is immutable provenance, not current authorization or relationship truth.
                required:
                  - createdAt
                  - id
                  - integrationId
                  - notification
                  - ownerId
                  - projectSelection
                  - scopes
                  - slug
                  - transferRequest
                  - type
                  - updatedAt
                  - userId
                type: object
                description: The configuration with the provided id
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: The configuration was not found
        '410':
          description: ''
      parameters:
        - name: id
          description: ID of the configuration to check
          in: path
          required: true
          schema:
            type: string
            description: ID of the configuration to check
            example: icfg_cuwj0AdCdH3BwWT4LPijCC7t
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    delete:
      description: Allows to remove the configuration with the `id` provided in the parameters. The configuration and all of its resources will be removed. This includes Webhooks, LogDrains and Project Env variables.
      operationId: deleteConfiguration
      security:
        - bearerToken: []
      summary: Delete an integration configuration
      tags:
        - integrations
      responses:
        '204':
          description: The configuration was successfully removed
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: The configuration was not found
        '410':
          description: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/integrations/configuration/{id}/products:
    get:
      description: Returns products available for an integration configuration. Each product includes a `metadataSchema` field with the JSON Schema for required and optional metadata fields.
      operationId: getConfigurationProducts
      security:
        - bearerToken: []
      summary: List products for integration configuration
      tags:
        - integrations
      responses:
        '200':
          description: List of products available for this integration configuration
          content:
            application/json:
              schema:
                properties:
                  products:
                    items:
                      properties:
                        id:
                          type: string
                        slug:
                          type: string
                        name:
                          type: string
                        protocols:
                          properties:
                            storage:
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - disabled
                                    - enabled
                                repl:
                                  properties:
                                    enabled:
                                      type: boolean
                                      enum:
                                        - false
                                        - true
                                    supportsReadOnlyMode:
                                      type: boolean
                                      enum:
                                        - false
                                        - true
                                    welcomeMessage:
                                      type: string
                                  required:
                                    - enabled
                                    - supportsReadOnlyMode
                                  type: object
                              required:
                                - status
                              type: object
                            experimentation:
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - disabled
                                    - enabled
                                edgeConfigSyncingSupport:
                                  type: boolean
                                  enum:
                                    - false
                                    - true
                              required:
                                - status
                              type: object
                            ai:
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - disabled
                                    - enabled
                              required:
                                - status
                              type: object
                            authentication:
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - disabled
                                    - enabled
                                appUrlRegistrationSupport:
                                  type: boolean
                                  enum:
                                    - false
                                    - true
                                  description: The partner accepts Vercel-managed app URLs via `protocolSettings.authentication.appUrls` on provision-resource and update-resource, and reconciles them into its trusted-origin / redirect-URL allowlist. When absent, consumers surface the URL for a one-time manual registration instead.
                              required:
                                - status
                              type: object
                            observability:
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - disabled
                                    - enabled
                              required:
                                - status
                              type: object
                            video:
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - disabled
                                    - enabled
                              required:
                                - status
                              type: object
                            workflow:
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - disabled
                                    - enabled
                              required:
                                - status
                              type: object
                            checks:
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - disabled
                                    - enabled
                              required:
                                - status
                              type: object
                            logDrain:
                              properties:
                                status:
                                  type: string
                                  enum:
                                    - disabled
                                    - enabled
                                endpoint:
                                  type: string
                                headers:
                                  additionalProperties:
                                    type: string
                                  type: object
                                format:
                                  type: string
                                  enum:
                                    - json
                                    - ndjson
                              required:
                                - endpoint
                                - format
