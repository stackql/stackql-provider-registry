openapi: 3.0.3
info:
  title: domains_registrar API
  description: vercel domains_registrar API
  version: 0.0.1
paths:
  /v1/registrar/tlds/supported:
    get:
      tags:
        - domains-registrar
      operationId: getSupportedTlds
      parameters:
        - name: teamId
          in: query
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: false
      security:
        - bearerToken: []
      responses:
        '200':
          description: A list of the TLDs supported by Vercel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSupportedTldsResponse'
        '400':
          description: There was something wrong with the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpApiDecodeError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: NotAuthorizedForScope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedForScope'
        '429':
          description: TooManyRequests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get a list of TLDs supported by Vercel
      summary: Get supported TLDs
  /v1/registrar/tlds/{tld}:
    get:
      tags:
        - domains-registrar
      operationId: getTld
      parameters:
        - name: tld
          in: path
          schema:
            $ref: '#/components/schemas/TldName'
          required: true
        - name: teamId
          in: query
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: false
      security:
        - bearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - supportedLanguageCodes
                properties:
                  supportedLanguageCodes:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                    description: The language codes that are supported for the TLD. The key is the language code, and the value is the name of the language.
                additionalProperties: false
        '400':
          description: There was something wrong with the request
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - issues
                properties:
                  status:
                    type: number
                    enum:
                      - 400
                  code:
                    type: string
                    enum:
                      - tld_not_supported
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                additionalProperties: false
                description: The TLD is not currently supported.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: NotAuthorizedForScope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedForScope'
        '429':
          description: TooManyRequests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get the metadata for a specific TLD.
      summary: Get TLD
  /v1/registrar/tlds/{tld}/price:
    get:
      tags:
        - domains-registrar
      operationId: getTldPrice
      parameters:
        - name: tld
          in: path
          schema:
            $ref: '#/components/schemas/TldName'
          required: true
        - name: years
          in: query
          schema:
            type: string
            description: The number of years to get the price for. If not provided, the minimum number of years for the TLD will be used.
          required: false
          description: The number of years to get the price for. If not provided, the minimum number of years for the TLD will be used.
        - name: teamId
          in: query
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: false
      security:
        - bearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - years
                  - purchasePrice
                  - renewalPrice
                  - transferPrice
                properties:
                  years:
                    type: number
                    description: The number of years the returned price is for.
                  purchasePrice:
                    type: number
                    minimum: 0.01
                  renewalPrice:
                    type: number
                    minimum: 0.01
                  transferPrice:
                    type: number
                    minimum: 0.01
                additionalProperties: false
        '400':
          description: There was something wrong with the request
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - issues
                properties:
                  status:
                    type: number
                    enum:
                      - 400
                  code:
                    type: string
                    enum:
                      - tld_not_supported
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                additionalProperties: false
                description: The TLD is not currently supported.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: NotAuthorizedForScope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedForScope'
        '429':
          description: TooManyRequests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get price data for a specific TLD. This only reflects base prices for the given TLD. Premium domains may have different prices. Use the [Get price data for a domain](https://vercel.com/docs/rest-api/reference/endpoints/domains-registrar/get-price-data-for-a-domain) endpoint to get the price data for a specific domain.
      summary: Get TLD price data
  /v1/registrar/domains/{domain}/availability:
    get:
      tags:
        - domains-registrar
      operationId: getDomainAvailability
      parameters:
        - name: domain
          in: path
          schema:
            $ref: '#/components/schemas/DomainName'
          required: true
        - name: teamId
          in: query
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: false
      security:
        - bearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                properties:
                  available:
                    type: boolean
                additionalProperties: false
        '400':
          description: There was something wrong with the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpApiDecodeError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: NotAuthorizedForScope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedForScope'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '429':
          description: TooManyRequests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get availability for a specific domain. If the domain is available, it can be purchased using the [Buy a domain](https://vercel.com/docs/rest-api/reference/endpoints/domains-registrar/buy-a-domain) endpoint or the [Buy multiple domains](https://vercel.com/docs/rest-api/reference/endpoints/domains-registrar/buy-multiple-domains) endpoint.
      summary: Get availability for a domain
  /v1/registrar/domains/{domain}/price:
    get:
      tags:
        - domains-registrar
      operationId: getDomainPrice
      parameters:
        - name: domain
          in: path
          schema:
            $ref: '#/components/schemas/DomainName'
          required: true
        - name: years
          in: query
          schema:
            type: string
            description: The number of years to get the price for. If not provided, the minimum number of years for the TLD will be used.
          required: false
          description: The number of years to get the price for. If not provided, the minimum number of years for the TLD will be used.
        - name: teamId
          in: query
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: false
      security:
        - bearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - years
                  - purchasePrice
                  - renewalPrice
                  - transferPrice
                properties:
                  years:
                    type: number
                  purchasePrice:
                    type: number
                    minimum: 0.01
                  renewalPrice:
                    type: number
                    minimum: 0.01
                  transferPrice:
                    type: number
                    minimum: 0.01
                additionalProperties: false
        '400':
          description: There was something wrong with the request
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - issues
                properties:
                  status:
                    type: number
                    enum:
                      - 400
                  code:
                    type: string
                    enum:
                      - bad_request
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                additionalProperties: false
                description: The domain name (excluding the TLD) is too short.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: NotAuthorizedForScope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedForScope'
        '429':
          description: TooManyRequests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get price data for a specific domain
      summary: Get price data for a domain
  /v1/registrar/domains/availability:
    post:
      tags:
        - domains-registrar
      operationId: getBulkAvailability
      parameters:
        - name: teamId
          in: query
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: false
      security:
        - bearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - domain
                        - available
                      properties:
                        domain:
                          $ref: '#/components/schemas/DomainName'
                        available:
                          type: boolean
                      additionalProperties: false
                additionalProperties: false
        '400':
          description: There was something wrong with the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpApiDecodeError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: NotAuthorizedForScope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedForScope'
        '429':
          description: TooManyRequests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get availability for multiple domains. If the domains are available, they can be purchased using the [Buy a domain](https://vercel.com/docs/rest-api/reference/endpoints/domains-registrar/buy-a-domain) endpoint or the [Buy multiple domains](https://vercel.com/docs/rest-api/reference/endpoints/domains-registrar/buy-multiple-domains) endpoint.
      summary: Get availability for multiple domains
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - domains
              properties:
                domains:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/DomainName'
                  description: an array of at most 50 item(s)
                  title: maxItems(50)
                  maxItems: 50
              additionalProperties: false
        required: true
  /v1/registrar/domains/{domain}/auth-code:
    get:
      tags:
        - domains-registrar
      operationId: getDomainAuthCode
      parameters:
        - name: domain
          in: path
          schema:
            $ref: '#/components/schemas/DomainName'
          required: true
        - name: teamId
          in: query
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: false
      security:
        - bearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - authCode
                properties:
                  authCode:
                    type: string
                additionalProperties: false
        '400':
          description: There was something wrong with the request
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - issues
                properties:
                  status:
                    type: number
                    enum:
                      - 400
                  code:
                    type: string
                    enum:
                      - domain_not_registered
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                additionalProperties: false
                description: The domain is not registered with Vercel.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: NotAuthorizedForScope
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                properties:
                  status:
                    type: number
                    enum:
                      - 403
                  code:
                    type: string
                    enum:
                      - not_authorized_for_scope
                  message:
                    type: string
                additionalProperties: false
        '404':
          description: The domain was not found in our system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainNotFound'
        '409':
          description: The domain cannot be transfered out until the specified date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainCannotBeTransferedOutUntil'
        '429':
          description: TooManyRequests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get the auth code for a domain. This is required to transfer a domain from Vercel to another registrar.
      summary: Get the auth code for a domain
  /v1/registrar/domains/{domain}/buy:
    post:
      tags:
        - domains-registrar
      operationId: buySingleDomain
      parameters:
        - name: domain
          in: path
          schema:
            $ref: '#/components/schemas/DomainName'
          required: true
        - name: teamId
          in: query
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: false
      security:
        - bearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - orderId
                  - _links
                properties:
                  orderId:
                    $ref: '#/components/schemas/OrderId'
                  _links:
                    type: object
                    additionalProperties:
                      type: object
                      required:
                        - href
                        - method
                      properties:
                        href:
                          type: string
                        method:
                          type: string
                          enum:
                            - GET
                            - POST
                            - PUT
                            - DELETE
                            - PATCH
                      additionalProperties: false
                additionalProperties: false
        '400':
          description: There was something wrong with the request
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - issues
                properties:
                  status:
                    type: number
                    enum:
                      - 400
                  code:
                    type: string
                    enum:
                      - domain_too_short
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                additionalProperties: false
                description: The domain name (excluding the TLD) is too short.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: NotAuthorizedForScope
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                properties:
                  status:
                    type: number
                    enum:
                      - 403
                  code:
                    type: string
                    enum:
                      - not_authorized_for_scope
                  message:
                    type: string
                additionalProperties: false
        '429':
          description: TooManyRequests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Buy a domain
      summary: Buy a domain
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - autoRenew
                - years
                - expectedPrice
                - contactInformation
              properties:
                autoRenew:
                  type: boolean
                  description: Whether the domain should be auto-renewed before it expires. This can be configured later through the Vercel Dashboard or the [Update auto-renew for a domain](https://vercel.com/docs/rest-api/reference/endpoints/domains-registrar/update-auto-renew-for-a-domain) endpoint.
                years:
                  type: number
                  description: The number of years to purchase the domain for.
                expectedPrice:
                  type: number
                  minimum: 0.01
                contactInformation:
                  type: object
                  required:
                    - firstName
                    - lastName
                    - email
                    - phone
                    - address1
                    - city
                    - state
                    - zip
                    - country
                  properties:
                    firstName:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    lastName:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    email:
                      $ref: '#/components/schemas/EmailAddress'
                    phone:
                      $ref: '#/components/schemas/E164PhoneNumber'
                    address1:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    address2:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    city:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    state:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    zip:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    country:
                      $ref: '#/components/schemas/CountryCode'
                    companyName:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    fax:
                      $ref: '#/components/schemas/E164PhoneNumber'
                    additional:
                      type: object
                      properties: {}
                  additionalProperties: false
                  description: The contact information for the domain. Some TLDs require additional contact information. Use the [Get contact info schema](https://vercel.com/docs/rest-api/reference/endpoints/domains-registrar/get-contact-info-schema) endpoint to retrieve the required fields.
                languageCode:
                  type: string
                  description: The language code for the domain. For punycode domains, this must be provided. The list of supported language codes for a TLD can be retrieved from the [Get TLD](https://vercel.com/docs/rest-api/reference/endpoints/domains-registrar/get-tld) endpoint.
              additionalProperties: false
        required: true
  /v1/registrar/domains/buy:
    post:
      tags:
        - domains-registrar
      operationId: buyDomains
      parameters:
        - name: teamId
          in: query
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: false
      security:
        - bearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - orderId
                  - _links
                properties:
                  orderId:
                    $ref: '#/components/schemas/OrderId'
                  _links:
                    type: object
                    additionalProperties:
                      type: object
                      required:
                        - href
                        - method
                      properties:
                        href:
                          type: string
                        method:
                          type: string
                          enum:
                            - GET
                            - POST
                            - PUT
                            - DELETE
                            - PATCH
                      additionalProperties: false
                additionalProperties: false
        '400':
          description: There was something wrong with the request
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                  - issues
                properties:
                  status:
                    type: number
                    enum:
                      - 400
                  code:
                    type: string
                    enum:
                      - domain_too_short
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                additionalProperties: false
                description: The domain name (excluding the TLD) is too short.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: NotAuthorizedForScope
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                  - message
                properties:
                  status:
                    type: number
                    enum:
                      - 403
                  code:
                    type: string
                    enum:
                      - not_authorized_for_scope
                  message:
                    type: string
                additionalProperties: false
        '429':
          description: TooManyRequests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Buy multiple domains at once
      summary: Buy multiple domains
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - domains
                - contactInformation
              properties:
                domains:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - domainName
                      - autoRenew
                      - years
                      - expectedPrice
                    properties:
                      domainName:
                        $ref: '#/components/schemas/DomainName'
                      autoRenew:
                        type: boolean
                        description: Whether the domain should be auto-renewed before it expires. This can be configured later through the Vercel Dashboard or the [Update auto-renew for a domain](https://vercel.com/docs/rest-api/reference/endpoints/domains-registrar/update-auto-renew-for-a-domain) endpoint.
                      years:
                        type: number
                        description: The number of years to purchase the domain for.
                      expectedPrice:
                        type: number
                        minimum: 0.01
                      languageCode:
                        type: string
                        description: The language code for the domain. For punycode domains, this must be provided. The list of supported language codes for a TLD can be retrieved from the [Get TLD](https://vercel.com/docs/rest-api/reference/endpoints/domains-registrar/get-tld) endpoint.
                    additionalProperties: false
                contactInformation:
                  type: object
                  required:
                    - firstName
                    - lastName
                    - email
                    - phone
                    - address1
                    - city
                    - state
                    - zip
                    - country
                  properties:
                    firstName:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    lastName:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    email:
                      $ref: '#/components/schemas/EmailAddress'
                    phone:
                      $ref: '#/components/schemas/E164PhoneNumber'
                    address1:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    address2:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    city:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    state:
                      $ref: '#/components/schemas/NonEmptyTrimmedString'
                    zip:
