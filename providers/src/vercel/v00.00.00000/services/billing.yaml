openapi: 3.0.3
info:
  title: billing API
  description: vercel billing API
  version: 0.0.1
paths:
  /v1/billing/charges:
    get:
      description: 'Returns the billing charge data in FOCUS v1.3 JSONL format for a specified Vercel team, within a date range specified by `from` and `to` query parameters. Supports 1-day granularity with a maximum date range of 1 year. The response is streamed as newline-delimited JSON (JSONL) and can be optionally compressed with gzip if the `Accept-Encoding: gzip` header is provided. This is only available for Owner, Member, Developer, Security, Billing, and Enterprise Viewer roles for the supplied team.'
      operationId: listBillingCharges
      security:
        - bearerToken: []
      summary: List FOCUS billing charges
      tags:
        - billing
      responses:
        '200':
          description: ''
          content:
            application/jsonl:
              schema:
                properties:
                  BilledCost:
                    type: number
                    description: Charge amount serving as the basis for invoicing
                  BillingCurrency:
                    type: string
                    enum:
                      - USD
                    description: Currency used for billing (ISO 4217)
                  ChargeCategory:
                    type: string
                    enum:
                      - Adjustment
                      - Credit
                      - Purchase
                      - Tax
                      - Usage
                    description: Classification of the charge
                  ChargePeriodStart:
                    type: string
                    description: Inclusive start of the charge period (ISO 8601 UTC)
                  ChargePeriodEnd:
                    type: string
                    description: Exclusive end of the charge period (ISO 8601 UTC) - Required in v1.3
                  ConsumedQuantity:
                    nullable: true
                    type: number
                    description: Volume of resource consumed. Null when a charge does not involve measurable consumption quantity.
                  ConsumedUnit:
                    nullable: true
                    type: string
                    description: Unit of measurement for consumed quantity. Null when the charge is not measured in units.
                  EffectiveCost:
                    type: number
                    description: Amortized cost representation including discounts, pre-commitment credit purchase amount, etc.
                  RegionId:
                    type: string
                    description: Provider-assigned region identifier
                  RegionName:
                    type: string
                    description: Display name for the region
                  ServiceName:
                    type: string
                    description: Display name for the service/product
                  ServiceCategory:
                    type: string
                    enum:
                      - AI and Machine Learning
                      - Analytics
                      - Business Applications
                      - Compute
                      - Databases
                      - Developer Tools
                      - Identity
                      - Integration
                      - Internet of Things
                      - Management and Governance
                      - Media
                      - Migration
                      - Mobile
                      - Multicloud
                      - Networking
                      - Other
                      - Security
                      - Storage
                      - Web
                    description: High-level category of the service
                  ServiceProviderName:
                    type: string
                    description: Entity making the resource/service available for purchase (v1.3)
                  Tags:
                    additionalProperties:
                      type: string
                    type: object
                    description: Charge metadata including the Vercel ProjectId and ProjectName information
                  PricingCategory:
                    type: string
                    enum:
                      - Committed
                      - Dynamic
                      - Other
                      - Standard
                    description: Pricing model used for the charge.
                  PricingCurrency:
                    type: string
                    enum:
                      - USD
                  PricingQuantity:
                    type: number
                  PricingUnit:
                    type: string
                required:
                  - BilledCost
                  - BillingCurrency
                  - ChargeCategory
                  - ChargePeriodEnd
                  - ChargePeriodStart
                  - ConsumedQuantity
                  - ConsumedUnit
                  - EffectiveCost
                  - PricingCategory
                  - PricingCurrency
                  - PricingQuantity
                  - PricingUnit
                  - ServiceName
                  - ServiceProviderName
                  - Tags
                type: object
                description: Extension of the base schema for Focus charges. Includes pricing information for all customers.
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '500':
          description: ''
        '503':
          description: ''
      parameters:
        - name: from
          description: Inclusive start of the date range as an ISO 8601 date-time string in UTC.
          in: query
          required: true
          schema:
            type: string
            description: Inclusive start of the date range as an ISO 8601 date-time string in UTC.
            example: '2025-01-01T00:00:00.000Z'
        - name: to
          description: Exclusive end of the date range as an ISO 8601 date-time string in UTC.
          in: query
          required: true
          schema:
            type: string
            description: Exclusive end of the date range as an ISO 8601 date-time string in UTC.
            example: '2025-01-31T00:00:00.000Z'
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -N --request GET \
              --url 'https://api.vercel.com/v1/billing/charges?teamId=<team>&from=<from_date>&to=<to_date>' \
              --header 'Authorization: Bearer <token>' \
              --header 'Accept-Encoding: gzip' \
              --compressed
  /v1/billing/contract-commitments:
    get:
      description: Returns commitment allocations per contract period in FOCUS v1.3 JSONL format for a specified Vercel team. The response is streamed as newline-delimited JSON (JSONL). This endpoint is only applicable to Enterprise Vercel customers. An empty response is returned for non-Enterprise (Pro/Flex) customers.
      operationId: listContractCommitments
      security:
        - bearerToken: []
      summary: List FOCUS contract commitments
      tags:
        - billing
      responses:
        '200':
          description: ''
          content:
            application/jsonl:
              schema:
                properties:
                  ContractCommitmentCategory:
                    type: string
                    enum:
                      - Spend
                      - Usage
                    description: Highest-level classification of the contract commitment. 'Spend' for Pro ($20/month), 'Usage' for Enterprise (MIU allocation).
                  ContractCommitmentCost:
                    type: number
                    description: 'Monetary value of the contract commitment (in BillingCurrency). Required when ContractCommitmentCategory is ''Spend''. For Pro: 20 (USD)'
                  ContractCommitmentDescription:
                    type: string
                    description: Self-contained summary of the contract commitment's terms
                  ContractCommitmentId:
                    type: string
                    description: Unique identifier for a single contract term within a contract. Maps to specific commitment period or allocation ID.
                  ContractCommitmentPeriodStart:
                    type: string
                    description: Inclusive start of the commitment term period (ISO 8601 UTC)
                  ContractCommitmentPeriodEnd:
                    type: string
                    description: Exclusive end of the commitment term period (ISO 8601 UTC)
                  ContractCommitmentQuantity:
                    type: number
                    description: 'Amount associated with the commitment (in ContractCommitmentUnit). Required when ContractCommitmentCategory is ''Usage''. For Enterprise: MIU allocation amount.'
                  ContractCommitmentType:
                    type: string
                    description: Service-provider-assigned name identifying the commitment type. 'Pro' or 'Enterprise' for Vercel.
                  ContractCommitmentUnit:
                    type: string
                    description: Measurement unit for ContractCommitmentQuantity. 'MIUs' for Enterprise, 'USD' for Pro spend commitments.
                  ContractId:
                    type: string
                    description: Service-provider-assigned identifier for a contract. Maps to Orb Subscription ID for Vercel.
                  ContractPeriodStart:
                    type: string
                    description: Inclusive start of the overall contract period (ISO 8601 UTC)
                  ContractPeriodEnd:
                    type: string
                    description: Exclusive end of the overall contract period (ISO 8601 UTC)
                  BillingCurrency:
                    type: string
                required:
                  - BillingCurrency
                  - ContractCommitmentCategory
                  - ContractCommitmentId
                  - ContractCommitmentPeriodEnd
                  - ContractCommitmentPeriodStart
                  - ContractCommitmentType
                  - ContractCommitmentUnit
                  - ContractId
                  - ContractPeriodEnd
                  - ContractPeriodStart
                type: object
                description: 'Contract commitment information describing terms within a contract. New in FOCUS v1.3 - tracks commitment terms separate from cost/usage rows. For Vercel: - Pro: $20 monthly spend commitment - Enterprise: MIU allocation per period (usage commitment)'
        '400':
          description: ''
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/billing/buy:
    post:
      description: Purchases credits for a Vercel team using the default payment method on file. The purchase is charged immediately via Stripe invoice. Supported credit types are `v0`, `gateway`, and `agent`. The `amount` field specifies the number of credits to purchase and must be a positive integer. An optional `source` query parameter can be provided to identify the caller. Defaults to `api` if not specified. This is only available for Owner, Member, Developer, Security, and Billing roles for the supplied team.
      operationId: buyCredits
      security:
        - bearerToken: []
      summary: Purchase credits
      tags:
        - billing
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  checkoutSessionId:
                    type: string
                  checkoutSessionUrl:
                    type: string
                  purchaseIntent:
                    properties:
                      id:
                        type: string
                        description: The unique ID of a Purchase Intent. Uses the format `pur_*`
                      configuration:
                        oneOf:
                          - properties:
                              options:
                                properties:
                                  amount:
                                    type: string
                                    description: The amount of currency to buy
                                  currency:
                                    type: string
                                    enum:
                                      - ai_credits
                                      - ai_gateway_credits
                                      - copper_test_units
                                      - v0_user_credits
                                      - vercel_agent_credits
                                    description: The currency being purchased
                                  expirationDate:
                                    type: string
                                    description: The expiration date of the credits being purchased
                                required:
                                  - amount
                                  - currency
                                type: object
                                description: Purchase configuration specific options
                              output:
                                nullable: true
                              type:
                                type: string
                                enum:
                                  - credit_topup
                            required:
                              - options
                              - output
                              - type
                            type: object
                            description: The configuration for a credit purchase
                          - properties:
                              options:
                                properties:
                                  items:
                                    items:
                                      properties:
                                        name:
                                          type: string
                                        subtotal:
                                          type: string
                                          description: The subtotal of the domain name purchase
                                        type:
                                          type: string
                                          enum:
                                            - purchase
                                            - renewal
                                            - transfer
                                        years:
                                          type: number
                                          description: The number of years to purchase
                                      required:
                                        - name
                                        - subtotal
                                        - type
                                        - years
                                      type: object
                                    type: array
                                  orderId:
                                    type: string
                                    description: The order ID of the domain name purchase
                                required:
                                  - items
                                  - orderId
                                type: object
                              output:
                                nullable: true
                              type:
                                type: string
                                enum:
                                  - domain_name
                            required:
                              - options
                              - output
                              - type
                            type: object
                            description: The configuration for a credit purchase
                          - properties:
                              options:
                                properties:
                                  effectiveDate:
                                    oneOf:
                                      - type: string
                                        description: The effective date of the plan change (opaque JSON object)
                                      - type: string
                                        enum:
                                          - end_of_subscription_term
                                          - immediate
                                  orbSubscriptionId:
                                    type: string
                                    description: The ID of the Orb subscription to change
                                  alignBillingWithPlanChangeDate:
                                    type: boolean
                                    enum:
                                      - false
                                      - true
                                    description: Whether or not to reset the billing cycle
                                  couponRedemptionCode:
                                    type: string
                                    description: The coupon redemption code to apply to the plan change
                                  externalPlanId:
                                    type: string
                                    description: The ID of the external plan to change to
                                  replacePrices:
                                    items:
                                      properties:
                                        fixedPriceQuantity:
                                          type: number
                                          description: The quantity for the fixed price
                                        replacesPriceId:
                                          type: string
                                          description: The ID of the price to replace
                                      required:
                                        - fixedPriceQuantity
                                        - replacesPriceId
                                      type: object
                                      description: The prices to replace in the subscription
                                    type: array
                                    description: The prices to replace in the subscription
                                required:
                                  - effectiveDate
                                  - orbSubscriptionId
                                type: object
                              output:
                                properties:
                                  pendingSubscriptionChangeId:
                                    type: string
                                    description: The ID of the pending subscription change
                                required:
                                  - pendingSubscriptionChangeId
                                type: object
                              type:
                                type: string
                                enum:
                                  - orb_plan_change
                            required:
                              - options
                              - output
                              - type
                            type: object
                            description: The configuration for a credit purchase
                          - properties:
                              options:
                                type: string
                                description: (opaque JSON object)
                              output:
                                properties:
                                  pendingSubscriptionChangeId:
                                    type: string
                                    description: The ID of the pending subscription change
                                required:
                                  - pendingSubscriptionChangeId
                                type: object
                              type:
                                type: string
                                enum:
                                  - orb_price_interval
                            required:
                              - options
                              - output
                              - type
                            type: object
                            description: The configuration for a credit purchase
                          - properties:
                              options:
                                properties:
                                  externalPlanId:
                                    type: string
                                    description: The external plan ID of the Orb plan to subscribe to
                                  addPrices:
                                    items:
                                      oneOf:
                                        - properties:
                                            priceId:
                                              type: string
                                              description: The ID of the price to add
                                          required:
                                            - priceId
                                          type: object
                                          description: The prices to add to the subscription
                                        - type: string
                                          description: The prices to add to the subscription (opaque JSON object)
                                    type: array
                                    description: The prices to add to the subscription
                                  alignBillingWithSubscriptionStartDate:
                                    type: boolean
                                    enum:
                                      - false
                                      - true
                                    description: Whether to align the subscription start date with the billing subscription start date
                                  couponRedemptionCode:
                                    type: string
                                    description: The coupon redemption code to apply to the subscription
                                  initialPhaseOrder:
                                    type: number
                                    description: The initial phase order to use for the subscription
                                  metadata:
                                    additionalProperties:
                                      nullable: true
                                      type: string
                                      description: Optional metadata to associate with the subscription
                                    type: object
                                    description: Optional metadata to associate with the subscription
                                  removePrices:
                                    items:
                                      properties:
                                        priceId:
                                          type: string
                                          description: The ID of the price to remove
                                      required:
                                        - priceId
                                      type: object
                                      description: The prices to remove in the subscription
                                    type: array
                                    description: The prices to remove in the subscription
                                  replacePrices:
                                    items:
                                      properties:
                                        fixedPriceQuantity:
                                          type: number
                                          description: The quantity for the fixed price
                                        replacesPriceId:
                                          type: string
                                          description: The ID of the price to replace
                                      required:
                                        - fixedPriceQuantity
                                        - replacesPriceId
                                      type: object
                                      description: The prices to replace in the subscription
                                    type: array
                                    description: The prices to replace in the subscription
                                  startDate:
                                    type: string
                                    description: The start date of the subscription
                                required:
                                  - externalPlanId
                                type: object
                              output:
                                properties:
                                  pendingSubscriptionChangeId:
                                    type: string
                                    description: The ID of the pending subscription change
                                required:
                                  - pendingSubscriptionChangeId
                                type: object
                              type:
                                type: string
                                enum:
                                  - orb_subscription
                            required:
                              - options
                              - output
                              - type
                            type: object
                            description: The configuration for a credit purchase
                          - properties:
                              options:
                                properties:
                                  orbCustomerId:
                                    type: string
                                    description: The ID of the Orb customer to create
                                  orbExternalCustomerId:
                                    type: string
                                    description: The external ID of the Orb customer to create
                                  orbExternalPlanId:
                                    type: string
                                    description: The external ID of the Orb plan to create
                                  orbPlanId:
                                    type: string
                                    description: The ID of the Orb plan to create
                                  orbSubscriptionId:
                                    type: string
                                    description: The ID of the Orb subscription to create
                                  lineItems:
                                    items:
                                      properties:
                                        id:
                                          type: string
                                          description: The ID of the line item
                                        description:
                                          type: string
                                          description: The description of the line item
                                        name:
                                          type: string
                                          description: The name of the line item
                                        productId:
                                          type: string
                                          description: The ID of the product being purchased
                                        quantity:
                                          type: string
                                          description: The quantity of the line item
                                        unitAmount:
                                          type: string
                                          description: The unit amount of the line item
                                        metadata:
                                          additionalProperties:
                                            type: string
                                          type: object
                                          description: Optional metadata for the line item
                                        productAlias:
                                          type: string
                                          description: The alias of the product being purchased
                                        refund:
                                          type: string
                                          description: The amount of the line item that has been refunded
                                      required:
                                        - description
                                        - id
                                        - name
                                        - productId
                                        - quantity
                                        - unitAmount
                                      type: object
                                      description: The line items that make up the Purchase Intent.
                                    type: array
                                    description: The line items that make up the Purchase Intent.
                                  orbPendingSubscriptionChangeId:
                                    type: string
                                    description: The ID of the pending subscription change
                                required:
                                  - orbCustomerId
                                  - orbExternalCustomerId
                                  - orbExternalPlanId
                                  - orbPlanId
                                  - orbSubscriptionId
                                type: object
                              output:
                                properties:
                                  pendingSubscriptionChangeId:
                                    type: string
                                    description: The ID of the pending subscription change
                                type: object
                              type:
                                type: string
                                enum:
                                  - orb_subscription_intent
                            required:
                              - options
                              - output
                              - type
                            type: object
                            description: The configuration for a credit purchase
                          - properties:
                              options:
                                properties:
                                  planId:
                                    type: string
                                    description: The ID of the plan to subscribe to
                                  fromPlan:
                                    properties:
                                      currentCycleEndDate:
                                        type: string
                                        description: The end of the current plan billing cycle
                                      orbSubscriptionId:
                                        type: string
                                        description: The Orb subscription ID currently active for the owner on the source plan
                                      planId:
                                        type: string
                                        description: The ID of the plan currently assigned
                                      planItemQuantities:
                                        items:
                                          properties:
                                            planItemId:
                                              type: string
                                              description: The ID of the current plan item to set the quantity for
                                            quantity:
                                              type: number
                                              description: The nonnegative integer quantity for the current plan item
                                            resourceIds:
                                              items:
                                                type: string
                                              type: array
                                              description: The resource IDs associated with the current plan item quantity
                                          required:
                                            - planItemId
                                            - quantity
                                          type: object
                                          description: The current plan item quantities
                                        type: array
                                        description: The current plan item quantities
                                      rateVariantKey:
                                        type: string
                                        description: The rate variant currently assigned
                                    required:
                                      - currentCycleEndDate
                                      - orbSubscriptionId
                                      - planId
                                    type: object
                                    description: The current plan being replaced by this purchase
                                  planItemQuantities:
                                    items:
                                      properties:
                                        planItemId:
                                          type: string
                                          description: The ID of the plan item to set the quantity for
                                        quantity:
                                          type: number
                                          description: The nonnegative integer quantity for the plan item
                                        resourceIds:
                                          items:
                                            type: string
                                          type: array
                                          description: The resource IDs to associate with the plan item quantity
                                      required:
                                        - planItemId
                                        - quantity
                                      type: object
                                      description: The plan item quantities to set for the subscription
                                    type: array
                                    description: The plan item quantities to set for the subscription
                                  rateVariantKey:
                                    type: string
                                    description: The rate variant key to apply to the subscription
                                required:
                                  - planId
                                type: object
                                description: Purchase configuration specific options
                              output:
                                properties:
                                  planChangeId:
                                    type: string
                                    description: The committed Plan revision used to calculate the purchase price
                                type: object
                              type:
                                type: string
                                enum:
                                  - subscription
                            required:
                              - options
                              - output
                              - type
                            type: object
                            description: The configuration for a credit purchase
                      createdAt:
                        type: string
                        description: The datetime when the Purchase Intent was created.
                      currency:
                        type: string
                        enum:
                          - miu
                          - usd
                        description: The currency for the purchase intent
                      ownerId:
                        type: string
                        description: The ID of the owner of the Purchase Intent.
                      provider:
                        properties:
                          resourceId:
                            type: string
                            description: Provider resource id
                          type:
                            type: string
                            enum:
                              - apple_in_app_purchase
                              - orb_ledger
                              - stripe_elements
                              - stripe_hosted
                              - stripe_invoice_deferred
                              - stripe_invoice_elements
                              - stripe_invoice_immediate
                              - tackle_aws_marketplace
                            description: The type of the purchase provider
                          currencyConversionRate:
                            type: string
                            description: The currency conversion rate used by the provider
                          stripeSharedPaymentTokenUsed:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: Whether a Stripe Shared Payment Token was used for this purchase. Only applicable when type is stripe_invoice_immediate.
                        required:
                          - resourceId
                          - type
                        type: object
                      status:
                        type: string
                        enum:
                          - failed
                          - pending
                          - succeeded
                        description: The status of the Purchase Intent.
                      subtotal:
                        type: string
                        description: The subtotal of the Purchase Intent.
                      tax:
                        type: string
                        description: The tax due on the Purchase Intent.
                      total:
                        type: string
                        description: The total balance due on the Purchase Intent.
                      updatedAt:
                        type: string
                        description: The datetime when the Purchase Intent was last updated.
                      dispute:
                        properties:
                          id:
                            type: string
                            description: The unique ID of the dispute entity.
                          amount:
                            type: string
                            description: The disputed amount.
                          createdAt:
                            type: string
                            description: When the dispute was first recorded.
                          currency:
                            type: string
                            description: The dispute currency.
                          providerId:
                            type: string
                            description: The external provider dispute ID (e.g. Stripe dispute ID).
                          reason:
                            nullable: true
                            type: string
                            description: The dispute reason.
                          status:
                            type: string
                            description: The dispute status.
                          updatedAt:
                            type: string
                            description: When the dispute was last updated.
                        required:
                          - amount
                          - createdAt
                          - currency
                          - id
                          - providerId
                          - reason
                          - status
                          - updatedAt
                        type: object
                        description: The dispute details, if any.
                      lineItems:
                        items:
                          properties:
                            id:
                              type: string
                              description: The ID of the line item
                            description:
                              type: string
                              description: The description of the line item
                            name:
                              type: string
                              description: The name of the line item
                            productId:
                              type: string
                              description: The ID of the product being purchased
                            quantity:
                              type: string
                              description: The quantity of the line item
                            unitAmount:
                              type: string
                              description: The unit amount of the line item
                            metadata:
                              additionalProperties:
                                type: string
                              type: object
                              description: Optional metadata for the line item
                            productAlias:
                              type: string
                              description: The alias of the product being purchased
                            refund:
                              type: string
                              description: The amount of the line item that has been refunded
                          required:
                            - description
                            - id
                            - name
                            - productId
                            - quantity
                            - unitAmount
                          type: object
                          description: The line items that make up the Purchase Intent.
                        type: array
                        description: The line items that make up the Purchase Intent.
                      metadata:
                        additionalProperties:
                          type: string
                        type: object
                        description: Optional metadata associated with the purchase intent
                      refund:
                        type: string
                        description: The amount of the purchase intent that has been refunded
                      returnUrl:
                        type: string
                        description: The URL to redirect to after the purchase is complete
                    required:
                      - configuration
                      - createdAt
                      - currency
                      - id
                      - ownerId
                      - provider
                      - status
                      - subtotal
                      - tax
                      - total
                      - updatedAt
                    type: object
                    description: The created purchase intent
                  orbSubscriptionIntent:
                    properties:
                      id:
                        type: string
                        description: The ID of the Orb subscription intent with the format `orbsubint_`.
                      configuration:
                        oneOf:
                          - properties:
                              options:
                                properties:
                                  productAlias:
                                    type: string
                                    description: The alias of the product to set quantity for.
                                  quantity:
                                    type: number
                                    description: The quantity to set for the plan item.
                                  resourceIds:
                                    items:
                                      type: string
                                    type: array
