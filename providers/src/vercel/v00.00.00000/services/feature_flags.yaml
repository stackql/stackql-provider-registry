openapi: 3.0.3
info:
  title: feature_flags API
  description: vercel feature_flags API
  version: 0.0.1
paths:
  /v2/projects/{project_id_or_name}/feature-flags/flags:
    get:
      description: Retrieve feature flags for a project. Returns an opaque cursor for pagination.
      operationId: listFlagsV2
      security:
        - bearerToken: []
      summary: List flags
      tags:
        - feature-flags
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  pagination:
                    properties:
                      next:
                        nullable: true
                        type: string
                    required:
                      - next
                    type: object
                  data:
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Flag'
                        - $ref: '#/components/schemas/MarketplaceFlag'
                    type: array
                required:
                  - data
                  - pagination
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: project_id_or_name
          description: The project id or name
          in: path
          required: true
          schema:
            description: The project id or name
            type: string
        - name: state
          description: The state of the flags to retrieve. Defaults to `active`.
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - archived
            description: The state of the flags to retrieve. Defaults to `active`.
        - name: limit
          description: Maximum number of flags to return.
          in: query
          required: false
          schema:
            description: Maximum number of flags to return.
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          description: Pagination cursor to continue from.
          in: query
          required: false
          schema:
            description: Pagination cursor to continue from.
            type: string
        - name: search
          description: Search flags by their slug or description. Case-insensitive.
          in: query
          required: false
          schema:
            description: Search flags by their slug or description. Case-insensitive.
            type: string
            maxLength: 256
        - name: tags
          description: Filter flags by tag. Repeat the parameter for multiple tags (all must match).
          in: query
          required: false
          schema:
            description: Filter flags by tag. Repeat the parameter for multiple tags (all must match).
            type: array
            items:
              type: string
        - name: createdBy
          description: Filter flags by the id of the entity that created them (a user or team id).
          in: query
          required: false
          schema:
            description: Filter flags by the id of the entity that created them (a user or team id).
            type: string
            maxLength: 256
        - name: maintainerIds
          description: Filter flags by maintainer user id. Repeat the parameter for multiple maintainers (any may match).
          in: query
          required: false
          schema:
            description: Filter flags by maintainer user id. Repeat the parameter for multiple maintainers (any may match).
            type: array
            items:
              type: string
              maxLength: 24
            maxItems: 25
        - name: includeMarketplaceFlags
          description: Whether to include Marketplace experimentation items in the paginated response. Defaults to false.
          in: query
          required: false
          schema:
            description: Whether to include Marketplace experimentation items in the paginated response. Defaults to false.
            type: boolean
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/projects/{project_id_or_name}/feature-flags/flags:
    get:
      description: Retrieve feature flags for a project. The list can be filtered by state and supports pagination.
      operationId: listFlags
      security:
        - bearerToken: []
      summary: List flags
      tags:
        - feature-flags
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/Flag'
                    type: array
                  pagination:
                    properties:
                      next:
                        nullable: true
                        type: string
                    required:
                      - next
                    type: object
                required:
                  - data
                  - pagination
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: project_id_or_name
          description: The project id or name
          in: path
          required: true
          schema:
            description: The project id or name
            type: string
        - name: state
          description: The state of the flags to retrieve. Defaults to `active`.
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - archived
            description: The state of the flags to retrieve. Defaults to `active`.
        - name: withMetadata
          description: Deprecated. Whether to include creator metadata in each flag in the response. Resolve creator identity client-side (e.g. via the team members endpoint) instead; this parameter will be removed in a future release. Use `GET /v1/projects/:id/feature-flags/flags/:flagIdOrSlug?withMetadata=true` for single-flag lookups that need creator metadata.
          in: query
          required: false
          schema:
            description: Deprecated. Whether to include creator metadata in each flag in the response. Resolve creator identity client-side (e.g. via the team members endpoint) instead; this parameter will be removed in a future release. Use `GET /v1/projects/:id/feature-flags/flags/:flagIdOrSlug?withMetadata=true` for single-flag lookups that need creator metadata.
            type: boolean
            deprecated: true
        - name: limit
          description: Maximum number of flags to return. When not set, all flags are returned.
          in: query
          required: false
          schema:
            description: Maximum number of flags to return. When not set, all flags are returned.
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          description: Pagination cursor to continue from.
          in: query
          required: false
          schema:
            description: Pagination cursor to continue from.
            type: string
        - name: search
          description: Search flags by their slug or description. Case-insensitive.
          in: query
          required: false
          schema:
            description: Search flags by their slug or description. Case-insensitive.
            type: string
            maxLength: 256
        - name: tags
          description: Filter flags by tag. Repeat the parameter for multiple tags (all must match).
          in: query
          required: false
          schema:
            description: Filter flags by tag. Repeat the parameter for multiple tags (all must match).
            type: array
            items:
              type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    put:
      description: Create a new feature flag for a project. The flag must have a unique slug within the project and specify its kind (boolean, string, number, or json).
      operationId: createFlag
      security:
        - bearerToken: []
      summary: Create a flag
      tags:
        - feature-flags
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  description:
                    type: string
                  variants:
                    items:
                      type: string
                      description: (opaque JSON object)
                    type: array
                  id:
                    type: string
                  environments:
                    additionalProperties:
                      properties:
                        reuse:
                          properties:
                            active:
                              type: boolean
                              enum:
                                - false
                                - true
                            environment:
                              type: string
                          required:
                            - active
                            - environment
                          type: object
                        targets:
                          additionalProperties:
                            additionalProperties:
                              additionalProperties:
                                items:
                                  properties:
                                    note:
                                      type: string
                                    value:
                                      type: string
                                  required:
                                    - value
                                  type: object
                                type: array
                              type: object
                            type: object
                          type: object
                        revision:
                          type: number
                        pausedOutcome:
                          properties:
                            type:
                              type: string
                              enum:
                                - variant
                            variantId:
                              type: string
                          required:
                            - type
                            - variantId
                          type: object
                        fallthrough:
                          oneOf:
                            - properties:
                                type:
                                  type: string
                                  enum:
                                    - variant
                                variantId:
                                  type: string
                              required:
                                - type
                                - variantId
                              type: object
                            - properties:
                                type:
                                  type: string
                                  enum:
                                    - split
                                base:
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                        - entity
                                    kind:
                                      type: string
                                    attribute:
                                      type: string
                                  required:
                                    - attribute
                                    - kind
                                    - type
                                  type: object
                                weights:
                                  additionalProperties:
                                    type: number
                                  type: object
                                defaultVariantId:
                                  type: string
                              required:
                                - base
                                - defaultVariantId
                                - type
                                - weights
                              type: object
                            - properties:
                                type:
                                  type: string
                                  enum:
                                    - rollout
                                base:
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                        - entity
                                    kind:
                                      type: string
                                    attribute:
                                      type: string
                                  required:
                                    - attribute
                                    - kind
                                    - type
                                  type: object
                                defaultVariantId:
                                  type: string
                                startTimestamp:
                                  type: number
                                rollFromVariantId:
                                  type: string
                                rollToVariantId:
                                  type: string
                                slots:
                                  items:
                                    properties:
                                      promille:
                                        type: number
                                      durationMs:
                                        type: number
                                    required:
                                      - durationMs
                                      - promille
                                    type: object
                                  type: array
                              required:
                                - base
                                - defaultVariantId
                                - rollFromVariantId
                                - rollToVariantId
                                - slots
                                - startTimestamp
                                - type
                              type: object
                            - properties:
                                type:
                                  type: string
                                  enum:
                                    - experiment
                              required:
                                - type
                              type: object
                        active:
                          type: boolean
                          enum:
                            - false
                            - true
                        rules:
                          items:
                            properties:
                              id:
                                type: string
                              outcome:
                                oneOf:
                                  - properties:
                                      type:
                                        type: string
                                        enum:
                                          - variant
                                      variantId:
                                        type: string
                                    required:
                                      - type
                                      - variantId
                                    type: object
                                  - properties:
                                      type:
                                        type: string
                                        enum:
                                          - split
                                      base:
                                        properties:
                                          type:
                                            type: string
                                            enum:
                                              - entity
                                          kind:
                                            type: string
                                          attribute:
                                            type: string
                                        required:
                                          - attribute
                                          - kind
                                          - type
                                        type: object
                                      weights:
                                        additionalProperties:
                                          type: number
                                        type: object
                                      defaultVariantId:
                                        type: string
                                    required:
                                      - base
                                      - defaultVariantId
                                      - type
                                      - weights
                                    type: object
                                  - properties:
                                      type:
                                        type: string
                                        enum:
                                          - rollout
                                      base:
                                        properties:
                                          type:
                                            type: string
                                            enum:
                                              - entity
                                          kind:
                                            type: string
                                          attribute:
                                            type: string
                                        required:
                                          - attribute
                                          - kind
                                          - type
                                        type: object
                                      defaultVariantId:
                                        type: string
                                      startTimestamp:
                                        type: number
                                      rollFromVariantId:
                                        type: string
                                      rollToVariantId:
                                        type: string
                                      slots:
                                        items:
                                          properties:
                                            promille:
                                              type: number
                                            durationMs:
                                              type: number
                                          required:
                                            - durationMs
                                            - promille
                                          type: object
                                        type: array
                                    required:
                                      - base
                                      - defaultVariantId
                                      - rollFromVariantId
                                      - rollToVariantId
                                      - slots
                                      - startTimestamp
                                      - type
                                    type: object
                                  - properties:
                                      type:
                                        type: string
                                        enum:
                                          - experiment
                                    required:
                                      - type
                                    type: object
                              conditions:
                                items:
                                  properties:
                                    rhs:
                                      oneOf:
                                        - type: string
                                        - type: number
                                        - properties:
                                            type:
                                              type: string
                                              enum:
                                                - list
                                                - list/inline
                                            items:
                                              items:
                                                oneOf:
                                                  - properties:
                                                      label:
                                                        type: string
                                                      note:
                                                        type: string
                                                      value:
                                                        type: number
                                                    required:
                                                      - value
                                                    type: object
                                                  - properties:
                                                      label:
                                                        type: string
                                                      note:
                                                        type: string
                                                      value:
                                                        type: string
                                                    required:
                                                      - value
                                                    type: object
                                              type: array
                                          required:
                                            - items
                                            - type
                                          type: object
                                        - properties:
                                            type:
                                              type: string
                                              enum:
                                                - regex
                                            pattern:
                                              type: string
                                            flags:
                                              type: string
                                          required:
                                            - flags
                                            - pattern
                                            - type
                                          type: object
                                        - type: boolean
                                          enum:
                                            - false
                                            - true
                                    cmpOptions:
                                      properties:
                                        ignoreCase:
                                          type: boolean
                                          enum:
                                            - false
                                            - true
                                      type: object
                                    lhs:
                                      oneOf:
                                        - properties:
                                            type:
                                              type: string
                                              enum:
                                                - segment
                                          required:
                                            - type
                                          type: object
                                        - properties:
                                            type:
                                              type: string
                                              enum:
                                                - entity
                                            kind:
                                              type: string
                                            attribute:
                                              type: string
                                          required:
                                            - attribute
                                            - kind
                                            - type
                                          type: object
                                    cmp:
                                      type: string
                                      enum:
                                        - '!contains'
                                        - '!endsWith'
                                        - '!eq'
                                        - '!ex'
                                        - '!oneOf'
                                        - '!regex'
                                        - '!startsWith'
                                        - after
                                        - before
                                        - contains
                                        - containsAllOf
                                        - containsAnyOf
                                        - containsNoneOf
                                        - endsWith
                                        - eq
                                        - ex
                                        - gt
                                        - gte
                                        - lt
                                        - lte
                                        - oneOf
                                        - regex
                                        - startsWith
                                  required:
                                    - cmp
                                    - lhs
                                  type: object
                                type: array
                            required:
                              - conditions
                              - id
                              - outcome
                            type: object
                          type: array
                      required:
                        - active
                        - fallthrough
                        - pausedOutcome
                        - rules
                      type: object
                    type: object
                  kind:
                    type: string
                    enum:
                      - boolean
                      - json
                      - number
                      - string
                  revision:
                    type: number
                  seed:
                    type: number
                  state:
                    type: string
                    enum:
                      - active
                      - archived
                  maintainerIds:
                    items:
                      type: string
                    type: array
                  permanent:
                    type: boolean
                    enum:
                      - false
                      - true
                  tags:
                    items:
                      type: string
                    type: array
                  slug:
                    type: string
                  createdAt:
                    type: number
                  updatedAt:
                    type: number
                  updatedBy:
                    type: string
                  createdBy:
                    type: string
                  ownerId:
                    type: string
                  projectId:
                    type: string
                  typeName:
                    type: string
                    enum:
                      - flag
                required:
                  - createdAt
                  - createdBy
                  - environments
                  - id
                  - kind
                  - ownerId
                  - projectId
                  - revision
                  - seed
                  - slug
                  - state
                  - typeName
                  - updatedAt
                  - variants
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - name: project_id_or_name
          description: The project id or name
          in: path
          required: true
          schema:
            description: The project id or name
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                slug:
                  description: A unique (per project) key for the flag, composed of letters, numbers, dashes, and underscores
                  type: string
                  pattern: ^[a-zA-Z0-9_-]{1,512}$
                kind:
                  description: The kind of flag
                  enum:
                    - boolean
                    - string
                    - number
                    - json
                variants:
                  type: array
                  description: The variants of the flag
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        description: The id of the variant
                        type: string
                      label:
                        description: A label for the variant
                        type: string
                      description:
                        description: A description of the variant
                        type: string
                      value:
                        anyOf:
                          - type: string
                          - type: number
                          - type: boolean
                          - type: string
                            description: (opaque JSON object)
                          - type: array
                            items: {}
                          - type: string
                    required:
                      - id
                      - value
                environments:
                  type: object
                  description: The configuration for the flag in different environments
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    properties:
                      active:
                        type: boolean
                      reuse:
                        type: object
                        description: Allows linking this environment to another environment so this flag will be evaluated with the other flag's configuration
                        additionalProperties: false
                        required:
                          - active
                          - environment
                        properties:
                          active:
                            type: boolean
                            description: Whether the reuse is active or not
                          environment:
                            type: string
                            description: The environment to link to
                      targets:
                        type: object
                        description: Allows assigning targets to variants while bypassing the flag's rules
                        additionalProperties:
                          type: object
                          additionalProperties:
                            type: object
                            additionalProperties:
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                properties:
                                  note:
                                    type: string
                                  value:
                                    type: string
                                required:
                                  - value
                              maxItems: 10000
                      pausedOutcome:
                        type: object
                        additionalProperties: false
                        properties:
                          type: {}
                          variantId:
                            type: string
                        required:
                          - type
                          - variantId
                      rules:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                            conditions:
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                properties:
                                  lhs:
                                    anyOf:
                                      - type: object
                                        additionalProperties: false
                                        properties:
                                          type: {}
                                        required:
                                          - type
                                      - type: object
                                        additionalProperties: false
                                        properties:
                                          type: {}
                                          kind:
                                            type: string
                                          attribute:
                                            type: string
                                        required:
                                          - type
                                          - kind
                                          - attribute
                                  cmp:
                                    type: string
                                    enum:
                                      - eq
                                      - '!eq'
                                      - oneOf
                                      - '!oneOf'
                                      - containsAllOf
                                      - containsAnyOf
                                      - containsNoneOf
                                      - startsWith
                                      - '!startsWith'
                                      - endsWith
                                      - '!endsWith'
                                      - contains
                                      - '!contains'
                                      - ex
                                      - '!ex'
                                      - gt
                                      - gte
                                      - lt
                                      - lte
                                      - regex
                                      - '!regex'
                                      - before
                                      - after
                                  rhs:
                                    anyOf:
                                      - type: object
                                        additionalProperties: false
                                        properties:
                                          type:
                                            type: string
                                            enum:
                                              - list/inline
                                              - list
                                          items:
                                            type: array
                                            items:
                                              anyOf:
                                                - type: object
                                                  additionalProperties: false
                                                  properties:
                                                    label:
                                                      type: string
                                                    note:
                                                      type: string
                                                    value:
                                                      type: number
                                                  required:
                                                    - value
                                                - type: object
                                                  additionalProperties: false
                                                  properties:
                                                    label:
                                                      type: string
                                                    note:
                                                      type: string
                                                    value:
                                                      type: string
                                                  required:
                                                    - value
                                            maxItems: 10000
                                        required:
                                          - type
                                          - items
                                      - type: object
                                        additionalProperties: false
                                        properties:
                                          type: {}
                                          pattern:
                                            type: string
                                          flags:
                                            type: string
                                        required:
                                          - type
                                          - pattern
                                          - flags
                                      - type: string
                                      - type: number
                                      - type: boolean
                                  cmpOptions:
                                    type: object
                                    additionalProperties: false
                                    properties:
                                      ignoreCase:
                                        type: boolean
                                required:
                                  - lhs
                                  - cmp
                            outcome:
                              anyOf:
                                - type: object
                                  additionalProperties: false
                                  properties:
                                    type: {}
                                    variantId:
                                      type: string
                                  required:
                                    - type
                                    - variantId
                                - type: object
                                  additionalProperties: false
                                  properties:
                                    type: {}
                                    base:
                                      type: object
                                      additionalProperties: false
                                      properties:
                                        type: {}
                                        kind:
                                          type: string
                                        attribute:
                                          type: string
                                      required:
                                        - type
                                        - kind
                                        - attribute
                                    weights:
                                      type: object
                                      additionalProperties:
                                        type: number
                                      description: The distribution for each variant
                                    defaultVariantId:
                                      type: string
                                      description: This variant will be used when the base attribute does not exist
                                  required:
                                    - type
                                    - base
                                    - weights
                                    - defaultVariantId
                                - type: object
                                  additionalProperties: false
                                  properties:
                                    type: {}
                                    base:
                                      type: object
                                      additionalProperties: false
                                      properties:
                                        type: {}
                                        kind:
                                          type: string
                                        attribute:
                                          type: string
                                      required:
                                        - type
                                        - kind
                                        - attribute
                                    startTimestamp:
                                      type: number
                                      description: Epoch ms when the rollout begins
                                    rollFromVariantId:
                                      type: string
                                      description: The variant to roll away from
                                    rollToVariantId:
                                      type: string
                                      description: The variant to roll towards
                                    defaultVariantId:
                                      type: string
                                      description: This variant will be used when the base attribute does not exist
                                    slots:
                                      type: array
                                      description: 'Each slot defines a promille and how long it is served for. After all slots expire, 100% is served indefinitely. The final implicit 100% slot does not need to be listed. Example: [[5_000, 21_600_000], [10_000, 28_800_000]] means 5‰ for 6h, then 10‰ for 8h, then 100% indefinitely.'
                                      items:
                                        type: object
                                        additionalProperties: false
                                        properties:
                                          promille:
                                            type: number
                                            minimum: 0
                                            maximum: 100000
                                            description: Promille of traffic for rollToVariant (0-100_000, where 1_000 = 1%)
                                          durationMs:
                                            type: number
                                            minimum: 0
                                            description: How long this promille is served in ms before moving to the next slot.
                                        required:
                                          - promille
                                          - durationMs
                                      minItems: 1
                                  required:
