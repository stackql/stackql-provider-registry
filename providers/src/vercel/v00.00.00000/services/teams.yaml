openapi: 3.0.3
info:
  title: teams API
  description: vercel teams API
  version: 0.0.1
paths:
  /v3/teams/{team_id}/members:
    get:
      description: Get a paginated list of team members for the provided team.
      operationId: getTeamMembers
      security:
        - bearerToken: []
      summary: List team members
      tags:
        - teams
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  members:
                    items:
                      properties:
                        avatar:
                          type: string
                          description: ID of the file for the Avatar of this member.
                          example: 123a6c5209bc3778245d011443644c8d27dc2c50
                        confirmed:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: Boolean that indicates if this member was confirmed by an owner.
                          example: true
                        email:
                          type: string
                          description: The email of this member.
                          example: jane.doe@example.com
                        github:
                          properties:
                            login:
                              type: string
                          type: object
                          description: Information about the GitHub account for this user.
                        gitlab:
                          properties:
                            login:
                              type: string
                          type: object
                          description: Information about the GitLab account of this user.
                        bitbucket:
                          properties:
                            login:
                              type: string
                          type: object
                          description: Information about the Bitbucket account of this user.
                        role:
                          type: string
                          enum:
                            - BILLING
                            - CONTRIBUTOR
                            - DEVELOPER
                            - MEMBER
                            - OWNER
                            - SECURITY
                            - VIEWER
                            - VIEWER_FOR_PLUS
                          description: Role of this user in the team.
                          example: OWNER
                        uid:
                          type: string
                          description: The ID of this user.
                          example: zTuNVUXEAvvnNN3IaqinkyMw
                        username:
                          type: string
                          description: The unique username of this user.
                          example: jane-doe
                        name:
                          type: string
                          description: The name of this user.
                          example: Jane Doe
                        createdAt:
                          type: number
                          description: Timestamp in milliseconds when this member was added.
                          example: 1588720733602
                        accessRequestedAt:
                          type: number
                          description: Timestamp in milliseconds for when this team member was accepted by an owner.
                          example: 1588820733602
                        joinedFrom:
                          properties:
                            origin:
                              type: string
                              enum:
                                - account-update
                                - bitbucket
                                - dsync
                                - feedback
                                - github
                                - gitlab
                                - import
                                - link
                                - mail
                                - nsnb-auto-approve
                                - nsnb-hobby-upgrade
                                - nsnb-invite
                                - nsnb-redeploy
                                - nsnb-redeploy-attribution-card
                                - nsnb-request-access
                                - nsnb-viewer-upgrade
                                - organization-teams
                                - saml
                                - teams
                            commitId:
                              type: string
                            repoId:
                              type: string
                            repoPath:
                              type: string
                            gitUserId:
                              oneOf:
                                - type: string
                                - type: number
                            gitUserLogin:
                              type: string
                            ssoUserId:
                              type: string
                            ssoConnectedAt:
                              type: number
                            idpUserId:
                              type: string
                            dsyncUserId:
                              type: string
                            dsyncConnectedAt:
                              type: number
                          required:
                            - origin
                          type: object
                          description: Map with information about the members origin if they joined by requesting access.
                        projects:
                          items:
                            properties:
                              name:
                                type: string
                              id:
                                type: string
                              role:
                                type: string
                                enum:
                                  - ADMIN
                                  - PROJECT_DEVELOPER
                                  - PROJECT_GUEST
                                  - PROJECT_VIEWER
                            required:
                              - id
                              - name
                            type: object
                            description: Array of project memberships
                          type: array
                          description: Array of project memberships
                        isEnterpriseManaged:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: Indicates whether the user is managed by an enterprise.
                      required:
                        - confirmed
                        - createdAt
                        - email
                        - role
                        - uid
                        - username
                      type: object
                    type: array
                  emailInviteCodes:
                    items:
                      properties:
                        accessGroups:
                          items:
                            type: string
                          type: array
                        id:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                          enum:
                            - BILLING
                            - CONTRIBUTOR
                            - DEVELOPER
                            - MEMBER
                            - OWNER
                            - SECURITY
                            - VIEWER
                            - VIEWER_FOR_PLUS
                        teamRoles:
                          items:
                            type: string
                            enum:
                              - BILLING
                              - CONTRIBUTOR
                              - DEVELOPER
                              - MEMBER
                              - OWNER
                              - SECURITY
                              - VIEWER
                              - VIEWER_FOR_PLUS
                          type: array
                        teamPermissions:
                          items:
                            type: string
                            enum:
                              - AiGatewayApiKeyOwnedBySelf
                              - AiGatewayBudgetManager
                              - AiGatewayCredits
                              - AiGatewaySettings
                              - AiGatewayTranscriptsManager
                              - AiGatewayTranscriptsViewer
                              - ConnectorManager
                              - CreateProject
                              - EnvVariableManager
                              - EnvironmentManager
                              - FullProductionDeployment
                              - IntegrationManager
                              - OrgAdmin
                              - OrgViewer
                              - UsageViewer
                              - V0Builder
                              - V0Chatter
                              - V0Viewer
                              - WorkflowDecryptor
                          type: array
                        isDSyncUser:
                          type: boolean
                          enum:
                            - false
                            - true
                        createdAt:
                          type: number
                        expired:
                          type: boolean
                          enum:
                            - true
                        projects:
                          additionalProperties:
                            type: string
                            enum:
                              - ADMIN
                              - PROJECT_DEVELOPER
                              - PROJECT_GUEST
                              - PROJECT_VIEWER
                          type: object
                        entitlements:
                          items:
                            type: string
                          type: array
                      required:
                        - id
                        - isDSyncUser
                      type: object
                    type: array
                  pagination:
                    properties:
                      hasNext:
                        type: boolean
                        enum:
                          - false
                          - true
                      count:
                        type: number
                        description: Amount of items in the current page.
                        example: 20
                      next:
                        nullable: true
                        type: number
                        description: Timestamp that must be used to request the next page.
                        example: 1540095775951
                      prev:
                        nullable: true
                        type: number
                        description: Timestamp that must be used to request the previous page.
                        example: 1540095775951
                    required:
                      - count
                      - hasNext
                      - next
                      - prev
                    type: object
                required:
                  - members
                  - pagination
                type: object
                x-vercel-cli:
                  displayColumns:
                    username: members[].username
                    email: members[].email
                    role: members[].role
                    joinedFrom: members[].joinedFrom.origin
                    createdAt: members[].createdAt
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - members
      parameters:
        - name: limit
          description: Limit how many teams should be returned
          in: query
          required: false
          schema:
            description: Limit how many teams should be returned
            example: 20
            minimum: 1
            type: number
        - name: since
          description: Timestamp in milliseconds to only include members added since then.
          in: query
          required: false
          schema:
            description: Timestamp in milliseconds to only include members added since then.
            example: 1540095775951
            type: number
        - name: until
          description: Timestamp in milliseconds to only include members added until then.
          in: query
          required: false
          schema:
            description: Timestamp in milliseconds to only include members added until then.
            example: 1540095775951
            type: number
        - name: search
          description: Search team members by their name, username, and email.
          in: query
          required: false
          schema:
            description: Search team members by their name, username, and email.
            type: string
        - name: role
          description: Only return members with the specified team role.
          in: query
          required: false
          schema:
            description: Only return members with the specified team role.
            example: OWNER
            type: string
            enum:
              - OWNER
              - MEMBER
              - DEVELOPER
              - SECURITY
              - BILLING
              - VIEWER
              - VIEWER_FOR_PLUS
              - CONTRIBUTOR
        - name: excludeProject
          description: Exclude members who belong to the specified project.
          in: query
          required: false
          schema:
            description: Exclude members who belong to the specified project.
            type: string
        - name: eligibleMembersForProjectId
          description: Include team members who are eligible to be members of the specified project.
          in: query
          required: false
          schema:
            description: Include team members who are eligible to be members of the specified project.
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: path
          name: team_id
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: true
          x-vercel-cli:
            kind: argument
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      x-speakeasy-test: false
  /v2/teams/{team_id}/members:
    post:
      description: Invite a user to join the team specified in the URL. The authenticated user needs to be an `OWNER` in order to successfully invoke this endpoint. The user to be invited must be specified by email.
      operationId: inviteUserToTeam
      security:
        - bearerToken: []
      summary: Invite a user
      tags:
        - teams
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitedTeamMember'
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: |-
            You do not have permission to access this resource.
            The authenticated user must be a team owner to perform the action
        '410':
          description: ''
        '503':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - invite
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: path
          name: team_id
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
          required: true
          x-vercel-cli:
            kind: argument
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - email
                properties:
                  email:
                    type: string
                    format: email
                    description: The email address of the user to invite
                    example: john@example.com
                  role:
                    type: string
                    enum:
                      - OWNER
                      - MEMBER
                      - DEVELOPER
                      - SECURITY
                      - BILLING
                      - VIEWER
                      - VIEWER_FOR_PLUS
                      - CONTRIBUTOR
                    default: VIEWER
                    description: The role of the user to invite
                    example: VIEWER
                  projects:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - role
                        - projectId
                      properties:
                        projectId:
                          type: string
                          maxLength: 64
                          example: prj_ndlgr43fadlPyCtREAqxxdyFK
                          description: The ID of the project.
                        role:
                          type: string
                          enum:
                            - ADMIN
                            - PROJECT_VIEWER
                            - PROJECT_DEVELOPER
                            - PROJECT_GUEST
                          example: ADMIN
                          description: Sets the project roles for the invited user
  /v1/teams/{team_id}/request:
    post:
      description: Request access to a team as a member. An owner has to approve the request. Only 100 users can request access to a team at the same time.
      operationId: requestAccessToTeam
      security:
        - bearerToken: []
      summary: Request access to a team
      tags:
        - teams
      responses:
        '200':
          description: Successfuly requested access to the team.
          content:
            application/json:
              schema:
                properties:
                  teamSlug:
                    type: string
                  teamName:
                    type: string
                  confirmed:
                    type: boolean
                    enum:
                      - false
                      - true
                  joinedFrom:
                    properties:
                      origin:
                        type: string
                        enum:
                          - account-update
                          - bitbucket
                          - dsync
                          - feedback
                          - github
                          - gitlab
                          - import
                          - link
                          - mail
                          - nsnb-auto-approve
                          - nsnb-hobby-upgrade
                          - nsnb-invite
                          - nsnb-redeploy
                          - nsnb-redeploy-attribution-card
                          - nsnb-request-access
                          - nsnb-viewer-upgrade
                          - organization-teams
                          - saml
                          - teams
                      commitId:
                        type: string
                      repoId:
                        type: string
                      repoPath:
                        type: string
                      gitUserId:
                        oneOf:
                          - type: string
                          - type: number
                      gitUserLogin:
                        type: string
                      ssoUserId:
                        type: string
                      ssoConnectedAt:
                        type: number
                      idpUserId:
                        type: string
                      dsyncUserId:
                        type: string
                      dsyncConnectedAt:
                        type: number
                    required:
                      - origin
                    type: object
                  accessRequestedAt:
                    type: number
                  github:
                    nullable: true
                    properties:
                      login:
                        type: string
                    type: object
                  gitlab:
                    nullable: true
                    properties:
                      login:
                        type: string
                    type: object
                  bitbucket:
                    nullable: true
                    properties:
                      login:
                        type: string
                    type: object
                required:
                  - bitbucket
                  - github
                  - gitlab
                  - teamName
                  - teamSlug
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: The team was not found.
        '410':
          description: ''
        '429':
          description: ''
        '503':
          description: ''
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
            description: The unique team identifier
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - joinedFrom
              properties:
                joinedFrom:
                  type: object
                  additionalProperties: false
                  required:
                    - origin
                  properties:
                    origin:
                      type: string
                      enum:
                        - import
                        - teams
                        - github
                        - gitlab
                        - bitbucket
                        - feedback
                        - organization-teams
                      description: The origin of the request.
                      example: github
                    commitId:
                      type: string
                      description: The commit sha if the origin is a git provider.
                      example: f498d25d8bd654b578716203be73084b31130cd7
                    repoId:
                      type: string
                      description: The ID of the repository for the given Git provider.
                      example: '67753070'
                    repoPath:
                      type: string
                      description: The path to the repository for the given Git provider.
                      example: jane-doe/example
                    gitUserId:
                      description: The ID of the Git account of the user who requests access.
                      example: 103053343
                      oneOf:
                        - type: string
                        - type: number
                    gitUserLogin:
                      type: string
                      description: The login name for the Git account of the user who requests access.
                      example: jane-doe
        required: true
  /v1/teams/{team_id}/request/{user_id}:
    get:
      description: Check the status of a join request. It'll respond with a 404 if the request has been declined. If no `userId` path segment was provided, this endpoint will instead return the status of the authenticated user.
      operationId: getTeamAccessRequest
      security:
        - bearerToken: []
      summary: Get access request status
      tags:
        - teams
      responses:
        '200':
          description: Successfully
          content:
            application/json:
              schema:
                properties:
                  teamSlug:
                    type: string
                    description: The slug of the team.
                    example: my-team
                  teamName:
                    type: string
                    description: The name of the team.
                    example: My Team
                  confirmed:
                    type: boolean
                    enum:
                      - false
                      - true
                    description: Current status of the membership. Will be `true` if confirmed, if pending it'll be `false`.
                    example: false
                  joinedFrom:
                    properties:
                      origin:
                        type: string
                        enum:
                          - account-update
                          - bitbucket
                          - dsync
                          - feedback
                          - github
                          - gitlab
                          - import
                          - link
                          - mail
                          - nsnb-auto-approve
                          - nsnb-hobby-upgrade
                          - nsnb-invite
                          - nsnb-redeploy
                          - nsnb-redeploy-attribution-card
                          - nsnb-request-access
                          - nsnb-viewer-upgrade
                          - organization-teams
                          - saml
                          - teams
                      commitId:
                        type: string
                      repoId:
                        type: string
                      repoPath:
                        type: string
                      gitUserId:
                        oneOf:
                          - type: string
                          - type: number
                      gitUserLogin:
                        type: string
                      ssoUserId:
                        type: string
                      ssoConnectedAt:
                        type: number
                      idpUserId:
                        type: string
                      dsyncUserId:
                        type: string
                      dsyncConnectedAt:
                        type: number
                    required:
                      - origin
                    type: object
                    description: A map that describes the origin from where the user joined.
                  accessRequestedAt:
                    type: number
                    description: Timestamp in milliseconds when the user requested access to the team.
                    example: 1588720733602
                  github:
                    nullable: true
                    properties:
                      login:
                        type: string
                    type: object
                    description: Map of the connected GitHub account.
                  gitlab:
                    nullable: true
                    properties:
                      login:
                        type: string
                    type: object
                    description: Map of the connected GitLab account.
                  bitbucket:
                    nullable: true
                    properties:
                      login:
                        type: string
                    type: object
                    description: Map of the connected Bitbucket account.
                required:
                  - accessRequestedAt
                  - bitbucket
                  - confirmed
                  - github
                  - gitlab
                  - joinedFrom
                  - teamName
                  - teamSlug
                type: object
        '400':
          description: |-
            One of the provided values in the request query is invalid.
            User is already a confirmed member of the team and did not request access. Only visible when the authenticated user does have access to the team.
        '401':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: |-
            The provided user doesn't have a membership.
            Team was not found.
        '410':
          description: ''
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            description: The unique user identifier
        - name: team_id
          in: path
          required: true
          schema:
            type: string
            description: The unique team identifier
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
  /v1/teams/{team_id}/members/teams/join:
    post:
      description: Join a team with a provided invite code or team ID.
      operationId: joinTeam
      security:
        - bearerToken: []
      summary: Join a team
      tags:
        - teams
      responses:
        '200':
          description: Successfully joined a team.
          content:
            application/json:
              schema:
                properties:
                  teamId:
                    type: string
                    description: The ID of the team the user joined.
                    example: team_LLHUOMOoDlqOp8wPE4kFo9pE
                  slug:
                    type: string
                    description: The slug of the team the user joined.
                    example: my-team
                  name:
                    type: string
                    description: The name of the team the user joined.
                    example: My Team
                  from:
                    type: string
                    description: The origin of how the user joined.
                    example: email
                required:
                  - from
                  - name
                  - slug
                  - teamId
                type: object
                description: Successfully joined a team.
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: ''
        '402':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '503':
          description: ''
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
            description: The unique team identifier
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                inviteCode:
                  type: string
                  description: The invite code to join the team.
                  example: fisdh38aejkeivn34nslfore9vjtn4ls
        required: true
  /v1/teams/{team_id}/members/{uid}:
    patch:
      description: Update the membership of a Team Member on the Team specified by `teamId`, such as changing the _role_ of the member, or confirming a request to join the Team for an unconfirmed member. The authenticated user must be an `OWNER` of the Team.
      operationId: updateTeamMember
      security:
        - bearerToken: []
      summary: Update a Team Member
      tags:
        - teams
      responses:
        '200':
          description: Successfully updated the membership.
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                    description: ID of the team.
                required:
                  - id
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
            Cannot disconnect SSO from a Team member that does not have a SSO connection.
            Cannot confirm a member that is already confirmed.
            Cannot confirm a member that did not request access.
        '401':
          description: |-
            The request is not authorized.
            Team members can only be updated by an owner, or by the authenticated user if they are only disconnecting their SAML connection to the Team.
        '402':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: |-
            The provided user is not part of this team.
            A user with the specified ID does not exist.
        '409':
          description: ''
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: uid
          description: The ID of the member.
          in: path
          required: true
          schema:
            type: string
            description: The ID of the member.
            example: ndfasllgPyCtREAqxxdyFKb
        - name: team_id
          in: path
          required: true
          schema:
            type: string
            description: The unique team identifier
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed:
                  type: boolean
                  enum:
                    - true
                  description: Accept a user who requested access to the team.
                  example: true
                role:
                  type: string
                  description: The role in the team of the member.
                  example: VIEWER
                  default: MEMBER
                teamPermissions:
                  type: array
                  description: The team permissions to set for the member. Permissions must be compatible with the team roles assigned to the member.
                  example:
                    - CreateProject
                    - FullProductionDeployment
                  items:
                    type: string
                    enum:
                      - ConnectorManager
                      - IntegrationManager
                      - CreateProject
                      - FullProductionDeployment
                      - UsageViewer
                      - EnvVariableManager
                      - EnvironmentManager
                      - WorkflowDecryptor
                      - OrgAdmin
                      - OrgViewer
                      - AiGatewaySettings
                      - AiGatewayCredits
                      - AiGatewayApiKeyOwnedBySelf
                      - AiGatewayBudgetManager
                      - AiGatewayTranscriptsManager
                      - AiGatewayTranscriptsViewer
                      - V0Builder
                      - V0Chatter
                      - V0Viewer
                projects:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - role
                      - projectId
                    properties:
                      projectId:
                        type: string
                        maxLength: 256
                        example: prj_ndlgr43fadlPyCtREAqxxdyFK
                        description: The ID of the project.
