openapi: 3.0.3
info:
  title: storage API
  description: vercel storage API
  version: 0.0.1
paths:
  /storage/stores/{id}:
    get:
      description: ''
      operationId: getStorageStoresById
      security: []
      summary: Get a store
      tags:
        - storage
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  store:
                    type: object
                    properties:
                      projectsMetadata:
                        items:
                          properties:
                            id:
                              type: string
                            projectId:
                              type: string
                            name:
                              type: string
                            framework:
                              nullable: true
                              type: string
                              enum:
                                - actix-web
                                - angular
                                - ash
                                - astro
                                - axum
                                - blitzjs
                                - brunch
                                - bun
                                - container
                                - create-react-app
                                - django
                                - docusaurus
                                - docusaurus-2
                                - dojo
                                - eleventy
                                - elysia
                                - ember
                                - eve
                                - express
                                - factory-eve
                                - fastapi
                                - fasthtml
                                - fastify
                                - flask
                                - gatsby
                                - go
                                - gridsome
                                - h3
                                - hexo
                                - hono
                                - hugo
                                - hydrogen
                                - ionic-angular
                                - ionic-react
                                - jekyll
                                - koa
                                - mastra
                                - middleman
                                - nestjs
                                - nextjs
                                - nitro
                                - node
                                - nuxtjs
                                - parcel
                                - polymer
                                - preact
                                - python
                                - react-router
                                - redwoodjs
                                - remix
                                - ruby
                                - rust
                                - saber
                                - sanity
                                - sanity-v2
                                - sapper
                                - scully
                                - services
                                - solidstart
                                - solidstart-1
                                - stencil
                                - storybook
                                - svelte
                                - sveltekit
                                - sveltekit-1
                                - tanstack-start
                                - tanstack-start-lovable
                                - umijs
                                - vite
                                - vitepress
                                - vue
                                - vuepress
                                - xmcp
                                - zola
                                - null
                            latestDeployment:
                              type: string
                            environments:
                              items:
                                type: string
                              type: array
                            envVarPrefix:
                              nullable: true
                              type: string
                            environmentVariables:
                              items:
                                type: string
                              type: array
                            deployments:
                              properties:
                                required:
                                  type: boolean
                                  enum:
                                    - false
                                    - true
                                actions:
                                  items:
                                    properties:
                                      slug:
                                        type: string
                                      environments:
                                        items:
                                          type: string
                                        type: array
                                    required:
                                      - environments
                                      - slug
                                    type: object
                                  type: array
                              required:
                                - actions
                                - required
                              type: object
                            makeEnvVarsSensitive:
                              type: boolean
                              enum:
                                - false
                                - true
                          required:
                            - envVarPrefix
                            - environmentVariables
                            - environments
                            - id
                            - name
                            - projectId
                          type: object
                        type: array
                      projectFilter:
                        properties:
                          git:
                            properties:
                              providers:
                                oneOf:
                                  - items:
                                      type: string
                                      enum:
                                        - bitbucket
                                        - github
                                        - gitlab
                                    type: array
                                  - type: string
                                    enum:
                                      - '*'
                              owners:
                                items:
                                  type: string
                                type: array
                              repos:
                                items:
                                  type: string
                                type: array
                            required:
                              - providers
                            type: object
                        type: object
                      totalConnectedProjects:
                        type: number
                      usageQuotaExceeded:
                        type: boolean
                        enum:
                          - false
                          - true
                      status:
                        nullable: true
                        type: string
                        enum:
                          - available
                          - error
                          - initializing
                          - limits-exceeded-suspended
                          - limits-exceeded-suspended-store-count
                          - onboarding
                          - suspended
                          - uninstalled
                          - null
                    required:
                      - projectsMetadata
                      - status
                      - usageQuotaExceeded
                required:
                  - store
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: skip-metadata
          in: query
          required: false
          schema:
            type: boolean
        - name: include-guides
          in: query
          required: false
          schema:
            type: boolean
  /storage/stores/blob:
    post:
      description: ''
      operationId: createStorageStoresBlob
      security: []
      summary: Create a Blob store
      tags:
        - storage
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  store:
                    nullable: true
                    type: object
                    properties:
                      projectsMetadata:
                        items:
                          properties:
                            id:
                              type: string
                            projectId:
                              type: string
                            name:
                              type: string
                            framework:
                              nullable: true
                              type: string
                              enum:
                                - actix-web
                                - angular
                                - ash
                                - astro
                                - axum
                                - blitzjs
                                - brunch
                                - bun
                                - container
                                - create-react-app
                                - django
                                - docusaurus
                                - docusaurus-2
                                - dojo
                                - eleventy
                                - elysia
                                - ember
                                - eve
                                - express
                                - factory-eve
                                - fastapi
                                - fasthtml
                                - fastify
                                - flask
                                - gatsby
                                - go
                                - gridsome
                                - h3
                                - hexo
                                - hono
                                - hugo
                                - hydrogen
                                - ionic-angular
                                - ionic-react
                                - jekyll
                                - koa
                                - mastra
                                - middleman
                                - nestjs
                                - nextjs
                                - nitro
                                - node
                                - nuxtjs
                                - parcel
                                - polymer
                                - preact
                                - python
                                - react-router
                                - redwoodjs
                                - remix
                                - ruby
                                - rust
                                - saber
                                - sanity
                                - sanity-v2
                                - sapper
                                - scully
                                - services
                                - solidstart
                                - solidstart-1
                                - stencil
                                - storybook
                                - svelte
                                - sveltekit
                                - sveltekit-1
                                - tanstack-start
                                - tanstack-start-lovable
                                - umijs
                                - vite
                                - vitepress
                                - vue
                                - vuepress
                                - xmcp
                                - zola
                                - null
                            latestDeployment:
                              type: string
                            environments:
                              items:
                                type: string
                              type: array
                            envVarPrefix:
                              nullable: true
                              type: string
                            environmentVariables:
                              items:
                                type: string
                              type: array
                            deployments:
                              properties:
                                required:
                                  type: boolean
                                  enum:
                                    - false
                                    - true
                                actions:
                                  items:
                                    properties:
                                      slug:
                                        type: string
                                      environments:
                                        items:
                                          type: string
                                        type: array
                                    required:
                                      - environments
                                      - slug
                                    type: object
                                  type: array
                              required:
                                - actions
                                - required
                              type: object
                            makeEnvVarsSensitive:
                              type: boolean
                              enum:
                                - false
                                - true
                          required:
                            - envVarPrefix
                            - environmentVariables
                            - environments
                            - id
                            - name
                            - projectId
                          type: object
                        type: array
                      projectFilter:
                        properties:
                          git:
                            properties:
                              providers:
                                oneOf:
                                  - items:
                                      type: string
                                      enum:
                                        - bitbucket
                                        - github
                                        - gitlab
                                    type: array
                                  - type: string
                                    enum:
                                      - '*'
                              owners:
                                items:
                                  type: string
                                type: array
                              repos:
                                items:
                                  type: string
                                type: array
                            required:
                              - providers
                            type: object
                        type: object
                      totalConnectedProjects:
                        type: number
                      usageQuotaExceeded:
                        type: boolean
                        enum:
                          - false
                          - true
                      status:
                        nullable: true
                        type: string
                        enum:
                          - available
                          - error
                          - initializing
                          - limits-exceeded-suspended
                          - limits-exceeded-suspended-store-count
                          - onboarding
                          - suspended
                          - uninstalled
                          - null
                      access:
                        type: string
                        enum:
                          - private
                          - public
                      kind:
                        type: string
                        enum:
                          - project-default
                          - user-created
                        description: A project-default store is a private blob store that is lazily created per-project, uses OIDC auth instead of read-write tokens, and cannot be modified through standard store mutation APIs. Undefined for legacy stores.
                      projectId:
                        type: string
                        description: The project this store is scoped to. Set for project-default stores and user-created stores with enforced project association.
                      size:
                        type: number
                      count:
                        type: number
                      region:
                        type: string
                        enum:
                          - arn1
                          - bom1
                          - cdg1
                          - cle1
                          - cpt1
                          - dub1
                          - dxb1
                          - fra1
                          - gru1
                          - hkg1
                          - hnd1
                          - iad1
                          - icn1
                          - kix1
                          - lhr1
                          - pdx1
                          - sfo1
                          - sin1
                          - syd1
                          - yul1
                      isTokenExpired:
                        type: boolean
                        enum:
                          - false
                          - true
                    required:
                      - count
                      - isTokenExpired
                      - projectsMetadata
                      - region
                      - size
                      - status
                      - usageQuotaExceeded
                required:
                  - store
                type: object
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
        '429':
          description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 70
                region:
                  type: string
                  enum:
                    - arn1
                    - bom1
                    - cdg1
                    - cle1
                    - cpt1
                    - dub1
                    - dxb1
                    - fra1
                    - gru1
                    - hkg1
                    - hnd1
                    - iad1
                    - icn1
                    - kix1
                    - lhr1
                    - pdx1
                    - sfo1
                    - sin1
                    - syd1
                    - yul1
                access:
                  type: string
                  enum:
                    - public
                    - private
                  default: public
                projectId:
                  type: string
                  maxLength: 50
  /storage/stores/blob/{id}:
    delete:
      description: ''
      operationId: deleteStorageStoresBlobById
      security: []
      summary: Delete a Blob store
      tags:
        - storage
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                required:
                  - id
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
components:
  x-stackQL-resources:
    stores:
      id: vercel.storage.stores
      name: stores
      title: Stores
      methods:
        get:
          operation:
            $ref: '#/paths/~1storage~1stores~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.store
          request:
            nativeCasing: camel
        create_blob:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1storage~1stores~1blob/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        delete_blob:
          operation:
            $ref: '#/paths/~1storage~1stores~1blob~1{id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/stores/methods/get'
        insert:
          - $ref: '#/components/x-stackQL-resources/stores/methods/create_blob'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/stores/methods/delete_blob'
        replace: []
servers:
  - url: https://api.vercel.com
