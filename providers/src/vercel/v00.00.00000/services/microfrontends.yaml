openapi: 3.0.3
info:
  title: microfrontends API
  description: vercel microfrontends API
  version: 0.0.1
paths:
  /v1/microfrontends/groups:
    get:
      description: Get the microfrontends group IDs for a team.
      operationId: getMicrofrontendsGroups
      security:
        - bearerToken: []
      summary: List microfrontends groups
      tags:
        - microfrontends
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  maxMicrofrontendsGroupsPerTeam:
                    type: number
                  maxMicrofrontendsPerGroup:
                    type: number
        '400':
          description: ''
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/microfrontends/groups/{group_id}/projects:
    get:
      description: Get the microfrontends for a given group ID.
      operationId: getMicrofrontendsInGroup
      security:
        - bearerToken: []
      summary: List projects in a microfrontends group
      tags:
        - microfrontends
