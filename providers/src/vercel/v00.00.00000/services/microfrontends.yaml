                                        type:
                                          type: string
                                          enum:
                                            - app
                                        app:
                                          properties:
                                            id:
                                              type: string
                                              description: The internal ID of the Vercel App backing this principal.
                                            clientId:
                                              type: string
                                              description: The protocol-facing OAuth client ID. This may differ from {@link id} when Client ID Metadata Documents (CIMD) are used.
                                          required:
                                            - id
                                          type: object
                                      required:
                                        - app
                                        - type
                                      type: object
                                      description: Set when a Vercel App or Integration acts on behalf of a {@link User}. Captures user-consented OAuth delegation that the ACL layer may inspect to evaluate scope restrictions. This is NOT for impersonation or token-exchange provenance — those live on `auth.token`, not on the principal.
                                    - properties:
                                        type:
                                          type: string
                                          enum:
