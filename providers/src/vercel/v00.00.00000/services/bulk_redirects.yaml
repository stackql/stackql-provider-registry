openapi: 3.0.3
info:
  title: bulk_redirects API
  description: vercel bulk_redirects API
  version: 0.0.1
paths:
  /v1/bulk-redirects:
    put:
      description: Stages new redirects for a project and returns the new version.
      operationId: stageRedirects
      security:
        - bearerToken: []
      summary: Stages new redirects for a project.
      tags:
        - bulk-redirects
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  alias:
                    nullable: true
                    type: string
                  version:
                    properties:
                      id:
                        type: string
                        description: The unique identifier for the version.
                      key:
                        type: string
                        description: The key of the version. The key may be duplicated across versions if the contents are the same as a different version.
                      lastModified:
                        type: number
                      createdBy:
                        type: string
                      name:
                        type: string
                        description: Optional name for the version. If not provided, defaults to an ISO timestamp string.
                      isStaging:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version has not been promoted to production yet and is not serving end users.
                      isLive:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version is currently live in production.
                      redirectCount:
                        type: number
                        description: The number of redirects in this version.
                      alias:
                        type: string
                        description: The staging link for previewing redirects in this version.
                    required:
                      - createdBy
                      - id
                      - key
                      - lastModified
                    type: object
                required:
                  - alias
                  - version
                type: object
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - teamId
              properties:
                projectId:
                  type: string
                teamId:
                  type: string
                overwrite:
                  type: boolean
                name:
                  type: string
                  maxLength: 256
                redirects:
                  type: array
                  default: []
                  items:
                    type: object
                    required:
                      - source
                      - destination
                    properties:
                      source:
                        type: string
                        maxLength: 2048
                      destination:
                        type: string
                        maxLength: 2048
                      statusCode:
                        oneOf:
                          - type: number
                          - type: string
                      permanent:
                        type: boolean
                      caseSensitive:
                        type: boolean
                      query:
                        type: boolean
                      preserveQueryParams:
                        type: boolean
    get:
      description: Get the version history for a project's bulk redirects
      operationId: getRedirects
      security:
        - bearerToken: []
      summary: Gets project-level redirects.
      tags:
        - bulk-redirects
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  version:
                    properties:
                      id:
                        type: string
                        description: The unique identifier for the version.
                      key:
                        type: string
                        description: The key of the version. The key may be duplicated across versions if the contents are the same as a different version.
                      lastModified:
                        type: number
                      createdBy:
                        type: string
                      name:
                        type: string
                        description: Optional name for the version. If not provided, defaults to an ISO timestamp string.
                      isStaging:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version has not been promoted to production yet and is not serving end users.
                      isLive:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version is currently live in production.
                      redirectCount:
                        type: number
                        description: The number of redirects in this version.
                      alias:
                        type: string
                        description: The staging link for previewing redirects in this version.
                    required:
                      - createdBy
                      - id
                      - key
                      - lastModified
                    type: object
                  redirects:
                    items:
                      properties:
                        statusCode:
                          type: number
                        permanent:
                          type: boolean
                          enum:
                            - false
                            - true
                        sensitive:
                          type: boolean
                          enum:
                            - false
                            - true
                        caseSensitive:
                          type: boolean
                          enum:
                            - false
                            - true
                        query:
                          type: boolean
                          enum:
                            - false
                            - true
                        preserveQueryParams:
                          type: boolean
                          enum:
                            - false
                            - true
                        destination:
                          type: string
                        source:
                          type: string
                      required:
                        - destination
                        - source
                      type: object
                    type: array
                  pagination:
                    properties:
                      page:
                        type: number
                      per_page:
                        type: number
                      numPages:
                        type: number
                    required:
                      - numPages
                      - page
                      - per_page
                    type: object
                required:
                  - pagination
                  - redirects
                  - version
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: versionId
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: diff
          in: query
          required: false
          schema:
            oneOf:
              - type: boolean
              - type: string
                enum:
                  - only
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 250
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - source
              - destination
              - statusCode
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    delete:
      description: Deletes the provided redirects from the latest version of the projects' bulk redirects. Stages a new change with the new redirects and returns the alias for the new version in the response.
      operationId: deleteRedirects
      security:
        - bearerToken: []
      summary: Delete project-level redirects.
      tags:
        - bulk-redirects
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  alias:
                    type: string
                  version:
                    properties:
                      id:
                        type: string
                        description: The unique identifier for the version.
                      key:
                        type: string
                        description: The key of the version. The key may be duplicated across versions if the contents are the same as a different version.
                      lastModified:
                        type: number
                      createdBy:
                        type: string
                      name:
                        type: string
                        description: Optional name for the version. If not provided, defaults to an ISO timestamp string.
                      isStaging:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version has not been promoted to production yet and is not serving end users.
                      isLive:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version is currently live in production.
                      redirectCount:
                        type: number
                        description: The number of redirects in this version.
                      alias:
                        type: string
                        description: The staging link for previewing redirects in this version.
                    required:
                      - createdBy
                      - id
                      - key
                      - lastModified
                    type: object
                required:
                  - version
                  - alias
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 256
                redirects:
                  description: The redirects to delete. The source of the redirect is used to match the redirect to delete.
                  type: array
                  minItems: 1
                  items:
                    type: string
              required:
                - redirects
    patch:
      description: Edits a single redirect identified by its source path. Stages a new change with the modified redirect and returns the alias for the new version in the response.
      operationId: editRedirect
      security:
        - bearerToken: []
      summary: Edit a project-level redirect.
      tags:
        - bulk-redirects
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  alias:
                    nullable: true
                    type: string
                  version:
                    properties:
                      id:
                        type: string
                        description: The unique identifier for the version.
                      key:
                        type: string
                        description: The key of the version. The key may be duplicated across versions if the contents are the same as a different version.
                      lastModified:
                        type: number
                      createdBy:
                        type: string
                      name:
                        type: string
                        description: Optional name for the version. If not provided, defaults to an ISO timestamp string.
                      isStaging:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version has not been promoted to production yet and is not serving end users.
                      isLive:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version is currently live in production.
                      redirectCount:
                        type: number
                        description: The number of redirects in this version.
                      alias:
                        type: string
                        description: The staging link for previewing redirects in this version.
                    required:
                      - createdBy
                      - id
                      - key
                      - lastModified
                    type: object
                required:
                  - alias
                  - version
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 256
                redirect:
                  description: The redirect object to edit. The source field is used to match the redirect to modify.
                  type: object
                  properties:
                    source:
                      type: string
                    destination:
                      type: string
                    statusCode:
                      type: number
                    permanent:
                      type: boolean
                    caseSensitive:
                      type: boolean
                    query:
                      type: boolean
                    preserveQueryParams:
                      type: boolean
                  required:
                    - source
                  additionalProperties: false
                restore:
                  description: If true, restores the redirect from the latest production version to staging.
                  type: boolean
              required:
                - redirect
  /v1/bulk-redirects/restore:
    post:
      description: Restores the provided redirects in the staging version to the value in the production version. If no production version exists, removes the redirects from staging.
      operationId: restoreRedirects
      security:
        - bearerToken: []
      summary: Restore staged project-level redirects to their production version.
      tags:
        - bulk-redirects
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  version:
                    properties:
                      id:
                        type: string
                        description: The unique identifier for the version.
                      key:
                        type: string
                        description: The key of the version. The key may be duplicated across versions if the contents are the same as a different version.
                      lastModified:
                        type: number
                      createdBy:
                        type: string
                      name:
                        type: string
                        description: Optional name for the version. If not provided, defaults to an ISO timestamp string.
                      isStaging:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version has not been promoted to production yet and is not serving end users.
                      isLive:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version is currently live in production.
                      redirectCount:
                        type: number
                        description: The number of redirects in this version.
                      alias:
                        type: string
                        description: The staging link for previewing redirects in this version.
                    required:
                      - createdBy
                      - id
                      - key
                      - lastModified
                    type: object
                  restored:
                    items:
                      type: string
                    type: array
                  failedToRestore:
                    items:
                      type: string
                    type: array
                required:
                  - failedToRestore
                  - restored
                  - version
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 256
                redirects:
                  description: The redirects to restore. The source of the redirect is used to match the redirect to restore.
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
              required:
                - redirects
  /v1/bulk-redirects/versions:
    get:
      description: Get the version history for a project's bulk redirects
      operationId: getVersions
      security:
        - bearerToken: []
      summary: Get the version history for a project's redirects.
      tags:
        - bulk-redirects
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  versions:
                    items:
                      properties:
                        id:
                          type: string
                          description: The unique identifier for the version.
                        key:
                          type: string
                          description: The key of the version. The key may be duplicated across versions if the contents are the same as a different version.
                        lastModified:
                          type: number
                        createdBy:
                          type: string
                        name:
                          type: string
                          description: Optional name for the version. If not provided, defaults to an ISO timestamp string.
                        isStaging:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: Whether this version has not been promoted to production yet and is not serving end users.
                        isLive:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: Whether this version is currently live in production.
                        redirectCount:
                          type: number
                          description: The number of redirects in this version.
                        alias:
                          type: string
                          description: The staging link for previewing redirects in this version.
                      required:
                        - createdBy
                        - id
                        - key
                        - lastModified
                      type: object
                    type: array
                required:
                  - versions
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    post:
      description: Update a version by promoting staging to production or restoring a previous production version
      operationId: updateVersion
      security:
        - bearerToken: []
      summary: Promote a staging version to production or restore a previous production version.
      tags:
        - bulk-redirects
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  version:
                    properties:
                      id:
                        type: string
                        description: The unique identifier for the version.
                      key:
                        type: string
                        description: The key of the version. The key may be duplicated across versions if the contents are the same as a different version.
                      lastModified:
                        type: number
                      createdBy:
                        type: string
                      name:
                        type: string
                        description: Optional name for the version. If not provided, defaults to an ISO timestamp string.
                      isStaging:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version has not been promoted to production yet and is not serving end users.
                      isLive:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version is currently live in production.
                      redirectCount:
                        type: number
                        description: The number of redirects in this version.
                      alias:
                        type: string
                        description: The staging link for previewing redirects in this version.
                    required:
                      - createdBy
                      - id
                      - key
                      - lastModified
                    type: object
                required:
                  - version
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - action
              properties:
                id:
                  type: string
                action:
                  type: string
                  enum:
                    - promote
                    - restore
                    - discard
                name:
                  type: string
                  maxLength: 256
components:
  x-stackQL-resources:
    redirects:
      id: vercel.bulk_redirects.redirects
      name: redirects
      title: Redirects
      methods:
        stage:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1bulk-redirects/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        list:
          operation:
            $ref: '#/paths/~1v1~1bulk-redirects/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.redirects
          request:
            nativeCasing: camel
          config:
            pagination:
              algorithm: page_number
              requestToken:
                key: page
                location: query
              responseToken:
                key: $.pagination.page
                location: body
              responseTerminator:
                key: $.pagination.numPages
                location: body
        delete:
          operation:
            $ref: '#/paths/~1v1~1bulk-redirects/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1bulk-redirects/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        restore:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1bulk-redirects~1restore/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/redirects/methods/list'
        insert: []
        update:
          - $ref: '#/components/x-stackQL-resources/redirects/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/redirects/methods/delete'
        replace:
          - $ref: '#/components/x-stackQL-resources/redirects/methods/stage'
    versions:
      id: vercel.bulk_redirects.versions
      name: versions
      title: Versions
      methods:
        list:
          operation:
            $ref: '#/paths/~1v1~1bulk-redirects~1versions/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.versions
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1bulk-redirects~1versions/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/versions/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.vercel.com
