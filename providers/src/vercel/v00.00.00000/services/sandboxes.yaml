openapi: 3.0.3
info:
  title: sandboxes API
  description: vercel sandboxes API
  version: 0.0.1
paths:
  /v2/sandboxes:
    get:
      description: Retrieves a paginated list of named sandboxes belonging to a specific project. Results can be sorted by creation time or name, and optionally filtered by name prefix or status.
      operationId: listNamedSandboxes
      security:
        - bearerToken: []
      summary: List sandboxes
      tags:
        - sandboxes
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  sandboxes:
                    items:
                      $ref: '#/components/schemas/NamedSandbox'
                    type: array
                  pagination:
                    properties:
                      count:
                        type: number
                      next:
                        nullable: true
                        type: string
                    required:
                      - count
                      - next
                    type: object
                required:
                  - pagination
                  - sandboxes
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '429':
          description: ''
      parameters:
        - name: project
          description: The unique identifier or name of the project to list named sandboxes for.
          in: query
          required: false
          schema:
            description: The unique identifier or name of the project to list named sandboxes for.
            type: string
            example: prj_abc123
        - name: limit
          description: Maximum number of named sandboxes to return in the response. Used for pagination.
          in: query
          required: false
          schema:
            description: Maximum number of named sandboxes to return in the response. Used for pagination.
            type: number
            minimum: 1
            maximum: 50
            default: 20
            example: 20
        - name: sortBy
          description: Field to sort by.
          in: query
          required: false
          schema:
            description: Field to sort by.
            type: string
            enum:
              - createdAt
              - name
              - statusUpdatedAt
              - currentSnapshotId
            default: createdAt
        - name: namePrefix
          description: Filter named sandboxes whose name starts with this prefix. Only valid when sortBy=name.
          in: query
          required: false
          schema:
            description: Filter named sandboxes whose name starts with this prefix. Only valid when sortBy=name.
            type: string
        - name: cursor
          description: Opaque pagination cursor from a previous response.
          in: query
          required: false
          schema:
            description: Opaque pagination cursor from a previous response.
            type: string
        - name: sortOrder
          description: Sort direction. Defaults to desc.
          in: query
          required: false
          schema:
            description: Sort direction. Defaults to desc.
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: status
          description: Filter named sandboxes by status. Only valid when sortBy is createdAt.
          in: query
          required: false
          schema:
            description: Filter named sandboxes by status. Only valid when sortBy is createdAt.
            type: string
            enum:
              - running
              - stopping
              - stopped
        - name: tags
          description: 'Filter sandboxes by tag. Format: \"key:value\". Only one tag filter is supported at a time.'
          in: query
          required: false
          schema:
            description: 'Filter sandboxes by tag. Format: \"key:value\". Only one tag filter is supported at a time.'
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    post:
      description: Creates a named sandbox environment. Named sandboxes have a unique name within a project and support automatic snapshotting on shutdown.
      operationId: createSandboxesV2
      security:
        - bearerToken: []
      summary: Create a named sandbox
      tags:
        - sandboxes
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  sandbox:
                    $ref: '#/components/schemas/NamedSandbox'
                  session:
                    $ref: '#/components/schemas/Session'
                  routes:
                    items:
                      $ref: '#/components/schemas/SandboxPublicRoute'
                    type: array
                required:
                  - routes
                  - sandbox
                  - session
                type: object
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
        '422':
          description: ''
        '429':
          description: The concurrency limit has been exceeded.
        '500':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                networkPolicy:
                  description: Network access policy for the sandbox.\n    Controls which external hosts the sandbox can communicate with.\n    Use \"allow-all\" mode to allow all traffic, \"deny-all\" to block all traffic or \"custom\" to provide specific rules.
                  type: object
                  additionalProperties: false
                  required:
                    - mode
                  properties:
                    mode:
                      description: The network access policy mode. Use \"allow-all\" to permit all outbound traffic. Use \"deny-all\" to block all outbound traffic. Use \"custom\" to specify explicit allow/deny rules.
                      type: string
                      enum:
                        - allow-all
                        - deny-all
                        - custom
                        - default-allow
                        - default-deny
                      example: custom
                    allowedDomains:
                      description: List of domain names the sandbox is allowed to connect to. Only applies when mode is \"custom\". Supports wildcard patterns (e.g., \"*.example.com\" matches all subdomains).
                      type: array
                      example:
                        - api.github.com
                        - '*.npmjs.org'
                      items:
                        type: string
                        description: A domain name pattern. Use \"*\" for wildcard matching of subdomains (e.g., \"*.example.com\").
                    allowedCIDRs:
                      description: List of IP address ranges (in CIDR notation) the sandbox is allowed to connect to. Traffic to these addresses bypasses domain-based restrictions.
                      type: array
                      example:
                        - 35.192.0.0/12
                        - 104.16.0.0/12
                      items:
                        type: string
                        description: An IPv4 address range in CIDR notation (e.g., \"35.192.0.0/12\").
                    deniedCIDRs:
                      description: List of IP address ranges (in CIDR notation) the sandbox is blocked from connecting to. These rules take precedence over all allowed rules.
                      type: array
                      example:
                        - 35.192.0.0/12
                      items:
                        type: string
                        description: An IP address range in CIDR notation to block.
                    injectionRules:
                      description: HTTP header injection rules for outgoing requests matching specific domains. Traffic to matching domains will be intercepted instead of proxied through encrypted connections.
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - domain
                          - headers
                        properties:
                          domain:
                            description: The domain (or pattern) of requests to add headers for. Supports wildcards like *.example.com.
                            type: string
                          headers:
                            description: HTTP headers to inject into requests for this domain. Existing headers with the same name will be overridden.
                            type: object
                            additionalProperties:
                              type: string
                          match:
                            description: Optional L7 match. When provided, the injection rule only applies to requests that satisfy every specified dimension. When multiple injection rules target the same domain they are evaluated in order and the first match wins; a rule without `match` matches any request and shadows later rules for the same domain.
                            type: object
                            additionalProperties: false
                            properties:
                              path:
                                description: Match on the request path. Comparison is case-sensitive.
                                type: object
                                additionalProperties: false
                                properties:
                                  exact:
                                    type: string
                                    description: Match the value exactly. Case-sensitive for paths, header values, and methods; case-insensitive for domains and header keys.
                                  startsWith:
                                    type: string
                                    description: Match values that start with the given prefix.
                              method:
                                type: array
                                description: HTTP methods to match. Any single match succeeds (OR semantics).
                                items:
                                  type: string
                              queryString:
                                type: array
                                description: Query-string entry matchers. Multiple entries are ANDed. Query parameter names and values are both compared case-sensitively (RFC 3986). When a request has multiple values for the same key, any matching value satisfies the matcher.
                                items:
                                  type: object
                                  additionalProperties: false
                                  properties:
                                    key:
                                      description: Matcher for the entry key (header name or query key).
                                      type: object
                                      additionalProperties: false
                                      properties:
                                        exact:
                                          type: string
                                          description: Match the value exactly. Case-sensitive for paths, header values, and methods; case-insensitive for domains and header keys.
                                        startsWith:
                                          type: string
                                          description: Match values that start with the given prefix.
                                    value:
                                      description: Matcher for the entry value.
                                      type: object
                                      additionalProperties: false
                                      properties:
                                        exact:
                                          type: string
                                          description: Match the value exactly. Case-sensitive for paths, header values, and methods; case-insensitive for domains and header keys.
                                        startsWith:
                                          type: string
                                          description: Match values that start with the given prefix.
                              headers:
                                type: array
                                description: Header matchers. Multiple entries are ANDed. Header names are compared case-insensitively (RFC 9110); header values are compared case-sensitively. When a request has multiple values for the same header, any matching value satisfies the matcher.
                                items:
                                  type: object
                                  additionalProperties: false
                                  properties:
                                    key:
                                      description: Matcher for the entry key (header name or query key).
                                      type: object
                                      additionalProperties: false
                                      properties:
                                        exact:
                                          type: string
                                          description: Match the value exactly. Case-sensitive for paths, header values, and methods; case-insensitive for domains and header keys.
                                        startsWith:
                                          type: string
                                          description: Match values that start with the given prefix.
                                    value:
                                      description: Matcher for the entry value.
                                      type: object
                                      additionalProperties: false
                                      properties:
                                        exact:
                                          type: string
                                          description: Match the value exactly. Case-sensitive for paths, header values, and methods; case-insensitive for domains and header keys.
                                        startsWith:
                                          type: string
                                          description: Match values that start with the given prefix.
                    allow:
                      oneOf:
                        - type: array
                          items:
                            type: string
                        - description: A rule applied to requests matching a domain in the network policy. Only one of `transform`, `forwardURL`, or `response` can be specified per rule.
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              properties:
                                match:
                                  description: Optional L7 match. When provided, the injection rule only applies to requests that satisfy every specified dimension. When multiple injection rules target the same domain they are evaluated in order and the first match wins; a rule without `match` matches any request and shadows later rules for the same domain.
                                  type: object
                                  additionalProperties: false
                                  properties:
                                    path:
                                      description: Match on the request path. Comparison is case-sensitive.
                                      type: object
                                      additionalProperties: false
                                      properties:
                                        exact:
                                          type: string
                                          description: Match the value exactly. Case-sensitive for paths, header values, and methods; case-insensitive for domains and header keys.
                                        startsWith:
                                          type: string
                                          description: Match values that start with the given prefix.
                                    method:
                                      type: array
                                      description: HTTP methods to match. Any single match succeeds (OR semantics).
                                      items:
                                        type: string
                                    queryString:
                                      type: array
                                      description: Query-string entry matchers. Multiple entries are ANDed. Query parameter names and values are both compared case-sensitively (RFC 3986). When a request has multiple values for the same key, any matching value satisfies the matcher.
                                      items:
                                        type: object
                                        additionalProperties: false
                                        properties:
                                          key:
                                            description: Matcher for the entry key (header name or query key).
                                            type: object
                                            additionalProperties: false
                                            properties:
                                              exact:
                                                type: string
                                                description: Match the value exactly. Case-sensitive for paths, header values, and methods; case-insensitive for domains and header keys.
                                              startsWith:
                                                type: string
                                                description: Match values that start with the given prefix.
                                          value:
                                            description: Matcher for the entry value.
                                            type: object
                                            additionalProperties: false
                                            properties:
                                              exact:
                                                type: string
                                                description: Match the value exactly. Case-sensitive for paths, header values, and methods; case-insensitive for domains and header keys.
                                              startsWith:
                                                type: string
                                                description: Match values that start with the given prefix.
                                    headers:
                                      type: array
                                      description: Header matchers. Multiple entries are ANDed. Header names are compared case-insensitively (RFC 9110); header values are compared case-sensitively. When a request has multiple values for the same header, any matching value satisfies the matcher.
                                      items:
                                        type: object
                                        additionalProperties: false
                                        properties:
                                          key:
                                            description: Matcher for the entry key (header name or query key).
                                            type: object
                                            additionalProperties: false
                                            properties:
                                              exact:
                                                type: string
                                                description: Match the value exactly. Case-sensitive for paths, header values, and methods; case-insensitive for domains and header keys.
                                              startsWith:
                                                type: string
                                                description: Match values that start with the given prefix.
                                          value:
                                            description: Matcher for the entry value.
                                            type: object
                                            additionalProperties: false
                                            properties:
                                              exact:
                                                type: string
                                                description: Match the value exactly. Case-sensitive for paths, header values, and methods; case-insensitive for domains and header keys.
                                              startsWith:
                                                type: string
                                                description: Match values that start with the given prefix.
                                transform:
                                  type: array
                                  items:
                                    type: object
                                    additionalProperties: false
                                    properties:
                                      headers:
                                        type: object
                                        additionalProperties:
                                          type: string
                                forwardURL:
                                  type: string
                                  description: HTTP/1.1 proxy URL to forward traffic to. Must not include username, password, query string, or fragment.
                                response:
                                  description: Answer matching requests from the proxy with this response instead of forwarding them to the origin. Combine with a `match` on an earlier rule to allow one sub-path and reject the rest of a domain.
                                  type: object
                                  additionalProperties: false
                                  required:
                                    - statusCode
                                  properties:
                                    statusCode:
                                      type: integer
                                      minimum: 200
                                      maximum: 599
                                      description: HTTP status code returned to the sandbox.
                                    headers:
                                      type: object
                                      additionalProperties:
                                        type: string
                                      description: HTTP response headers. Framing and hop-by-hop headers are managed by the proxy and cannot be set.
                                    body:
                                      type: string
                                      description: UTF-8 response body. Requires `contentType`.
                                    contentType:
                                      type: string
                                      description: Value of the `Content-Type` response header. Required when `body` is set.
                    subnets:
                      type: object
                      additionalProperties: false
                      properties:
                        allow:
                          type: array
                          items:
                            type: string
                        deny:
                          type: array
                          items:
                            type: string
                runtime:
                  description: The runtime environment for the sandbox. Determines the pre-installed language runtimes and tools available.
                  type: string
                  enum:
                    - node22
                    - node24
                    - node26
                    - python3.13
                  default: node24
                  example: node24
                resources:
                  description: Resources to define the VM
                  additionalProperties: false
                  type: object
                  properties:
                    vcpus:
                      description: The number of virtual CPUs to allocate to the sandbox. Must be 1, or an even number.
                      type: integer
                      minimum: 1
                      default: 2
                      example: 2
                    memory:
                      description: The amount of memory in megabytes to allocate to the sandbox. Must equal vcpus * 2048.
                      type: integer
                      minimum: 2048
                      example: 4096
                source:
                  description: The source from which to initialize the sandbox filesystem. Can be a Git repository, a tarball URL, or an existing snapshot.
                  type: object
                  properties:
                    type:
                      description: Indicates the source is a Git repository.
                    url:
                      type: string
                      format: uri
                      description: The URL of the Git repository to clone.
                      example: https://github.com/vercel/next.js.git
                    username:
                      type: string
                      description: Username for Git authentication. Required together with password for private repositories.
                    password:
                      type: string
                      description: Password or personal access token for Git authentication. Required together with username for private repositories.
                    depth:
                      type: integer
                      minimum: 1
                      description: Create a shallow clone with history truncated to the specified number of commits. Useful for faster cloning of large repositories.
                      example: 1
                    revision:
                      type: string
                      description: The specific commit SHA, branch name, or tag to checkout after cloning.
                      example: main
                    snapshotId:
                      type: string
                      description: The unique identifier of the snapshot to restore.
                      example: snap_abc123
                  required:
                    - type
                    - url
                    - snapshotId
                  additionalProperties: false
                projectId:
                  description: The target project slug or ID in which the sandbox will be assigned to.
                  example: prj_abc123
                  type: string
                ports:
                  description: List of ports to expose from the sandbox. Each port will be accessible via a unique URL. Maximum of 15 ports can be exposed.
                  type: array
                  maxItems: 15
                  uniqueItems: true
                  example:
                    - 3000
                    - 4000
                  items:
                    type: integer
                    description: A port number to expose from the sandbox. Must be between 1024 and 65535.
                    not:
                      enum:
                        - 23456
                    maximum: 65535
                    minimum: 1024
                image:
                  type: string
                  maxLength: 255
                  description: Image to use for the sandbox.
                timeout:
                  type: integer
                  description: Maximum duration in milliseconds that the sandbox can run before being automatically stopped.
                  minimum: 1000
                  example: 300000
                env:
                  type: object
                  additionalProperties:
                    type: string
                  description: Default environment variables for the sandbox. These are inherited by all commands unless overridden.
                  default: {}
                  example:
                    NODE_ENV: production
                    HELLO: world
                mounts:
                  type: object
                  description: List of drives to mount to the sandbox at the provided path.
                  maxProperties: 4
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    required:
                      - drive
                    properties:
                      drive:
                        type: string
                        description: Name of the drive to mount. The drive must already exist.
                        maxLength: 64
                        pattern: ^[a-zA-Z0-9_-]+$
                      mode:
                        type: string
                        description: Mount the drive as read-write, or as a read-only snapshot. One writer is permitted at a time.
                        default: read-write
                        enum:
                          - snapshot
                          - read-write
                region:
                  type: string
                  enum:
                    - iad1
                    - sfo1
                    - cle1
                    - cdg1
                    - fra1
                    - arn1
                    - sin1
                    - pdx1
                    - lhr1
                    - icn1
                    - bom1
                    - cpt1
                    - dub1
                    - gru1
                    - hkg1
                    - syd1
                    - yul1
                    - hnd1
                    - kix1
                  default:
                    - iad1
                    - sfo1
                    - cle1
                    - cdg1
                    - fra1
                    - arn1
                    - sin1
                    - pdx1
                    - lhr1
                    - icn1
                    - bom1
                    - cpt1
                    - dub1
                    - gru1
                    - hkg1
                    - syd1
                    - yul1
                    - hnd1
                    - kix1
                  description: The Vercel region in which to create the sandbox.
                  example: iad1
                failoverRegions:
                  type: array
                  maxItems: 19
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - iad1
                      - sfo1
                      - cle1
                      - cdg1
                      - fra1
                      - arn1
                      - sin1
                      - pdx1
                      - lhr1
                      - icn1
                      - bom1
                      - cpt1
                      - dub1
                      - gru1
                      - hkg1
                      - syd1
                      - yul1
                      - hnd1
                      - kix1
                  description: The regions the sandbox falls back to when it cannot be created in `region`.
                  example:
                    - sfo1
                    - cle1
                networkId:
                  type: string
                  maxLength: 255
                  description: The Connect network id for the target Secure Compute private network.
                name:
                  example: my-sandbox
                  type: string
                  pattern: ^[a-zA-Z0-9_-]+$
                  maxLength: 128
                  description: Name for the sandbox. Must be unique per project and URL-safe (alphanumeric, hyphens, underscores).
                persistent:
                  description: Whether the sandbox persists its state across restarts via automatic snapshots. Defaults to true.
                  type: boolean
                  default: true
                snapshotExpiration:
                  description: Default snapshot expiration time in milliseconds. Set to 0 to disable expiration. When set, this value is used as the default expiration for all snapshots created for this sandbox.
                  example: 604800000
                  type: integer
                keepLastSnapshots:
                  description: Protect the N most recent snapshots with different expiration/deletion behavior.
                  type: object
                  additionalProperties: false
                  required:
                    - count
                  properties:
                    count:
                      type: integer
                      minimum: 1
                      maximum: 10
                      description: Number of most recent snapshots to keep.
                    expiration:
                      description: Expiration time in milliseconds for kept snapshots. Falls back to snapshotExpiration.
                      oneOf:
                        - {}
                        - type: integer
                    deleteEvicted:
                      type: boolean
                      description: Whether to immediately delete evicted snapshots. Defaults to true.
                tags:
                  description: Key-value tags to associate with the sandbox. Maximum 5 tags.
                  type: object
                  maxProperties: 5
                  additionalProperties:
                    type: string
                    maxLength: 256
                  example:
                    env: staging
                    team: platform
  /v2/sandboxes/drives:
    get:
      description: 'Retrieves a paginated list of drives belonging to a specific project. Drives are in private beta. Register your interest to get access: https://vercel.com/changelog/drives-for-vercel-sandbox-in-private-beta'
      operationId: listDrives
      security:
        - bearerToken: []
      summary: List drives
      tags:
        - sandboxes
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  drives:
                    items:
                      $ref: '#/components/schemas/Drive'
                    type: array
                  pagination:
                    properties:
                      count:
                        type: number
                      next:
                        nullable: true
                        type: string
                    required:
                      - count
                      - next
                    type: object
                required:
                  - drives
                  - pagination
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '429':
          description: ''
      parameters:
        - name: projectId
          description: The project ID or name associated with the drives. Required unless using a Vercel OIDC token scoped to a project.
          in: query
          required: false
          schema:
            type: string
            description: The project ID or name associated with the drives. Required unless using a Vercel OIDC token scoped to a project.
            example: prj_abc123
        - name: limit
          description: Maximum number of drives to return in the response. Used for pagination.
          in: query
          required: false
          schema:
            description: Maximum number of drives to return in the response. Used for pagination.
            type: number
            minimum: 1
            maximum: 50
            default: 20
            example: 20
        - name: cursor
          description: Opaque pagination cursor from a previous response.
          in: query
          required: false
          schema:
            description: Opaque pagination cursor from a previous response.
            type: string
        - name: sortBy
          description: Field to sort drives by.
          in: query
          required: false
          schema:
            description: Field to sort drives by.
            type: string
            enum:
              - createdAt
              - updatedAt
              - name
            default: createdAt
        - name: namePrefix
          description: Filter drives whose name starts with this prefix. Only valid when sortBy=name.
          in: query
          required: false
          schema:
            description: Filter drives whose name starts with this prefix. Only valid when sortBy=name.
            type: string
        - name: sortOrder
          description: Sort direction for results.
          in: query
          required: false
          schema:
            description: Sort direction for results.
            type: string
            enum:
              - asc
              - desc
            default: desc
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v2/sandboxes/drives/{name}:
    post:
      description: 'Gets an existing drive by project and name, or creates it when it does not exist. Drives are in private beta. Register your interest to get access: https://vercel.com/changelog/drives-for-vercel-sandbox-in-private-beta'
      operationId: getOrCreateDrive
      security:
        - bearerToken: []
      summary: Get or create a drive
      tags:
        - sandboxes
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  drive:
                    $ref: '#/components/schemas/Drive'
                required:
                  - drive
                type: object
        '201':
