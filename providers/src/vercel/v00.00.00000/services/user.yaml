openapi: 3.0.3
info:
  title: user API
  description: vercel user API
  version: 0.0.1
paths:
  /v3/events:
    get:
      description: Retrieves a list of "events" generated by the User on Vercel. Events are generated when the User performs a particular action, such as logging in, creating a deployment, and joining a Team (just to name a few). When the `teamId` parameter is supplied, then the events that are returned will be in relation to the Team that was specified.
      operationId: listUserEvents
      security:
        - bearerToken: []
      summary: List User Events
      tags:
        - user
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                properties:
                  events:
                    items:
                      $ref: '#/components/schemas/UserEvent'
                    type: array
                    description: Array of events generated by the User.
                required:
                  - events
                type: object
                description: Successful response.
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - events
      parameters:
        - name: limit
          description: Maximum number of items which may be returned.
          in: query
          schema:
            description: Maximum number of items which may be returned.
            example: 20
            type: number
        - name: since
          description: Timestamp to only include items created since then.
          in: query
          schema:
            description: Timestamp to only include items created since then.
            example: '2019-12-08T10:00:38.976Z'
            type: string
        - name: until
          description: Timestamp to only include items created until then.
          in: query
          schema:
            description: Timestamp to only include items created until then.
            example: '2019-12-09T23:00:38.976Z'
            type: string
        - name: types
          description: Comma-delimited list of event "types" to filter the results by.
          in: query
          schema:
            description: Comma-delimited list of event "types" to filter the results by.
            example: login,team-member-join,domain-buy
            type: string
        - name: userId
          description: Deprecated. Use `principalId` instead. If `principalId` and `userId` both exist, `principalId` will be used.
          in: query
          schema:
            description: Deprecated. Use `principalId` instead. If `principalId` and `userId` both exist, `principalId` will be used.
            example: aeIInYVk59zbFF2SxfyxxmuO
            type: string
        - name: principalId
          description: When retrieving events for a Team, the `principalId` parameter may be specified to filter events generated by a specific principal.
          in: query
          schema:
            description: When retrieving events for a Team, the `principalId` parameter may be specified to filter events generated by a specific principal.
            example: aeIInYVk59zbFF2SxfyxxmuO
            type: string
        - name: projectIds
          description: Comma-delimited list of project IDs to filter the results by.
          in: query
          schema:
            description: Comma-delimited list of project IDs to filter the results by.
            example: aeIInYVk59zbFF2SxfyxxmuO
            type: string
        - name: entityId
          description: Filters events to those associated with a specific entity (matched against `payload.id`). For example, a connector ID.
          in: query
          schema:
            description: Filters events to those associated with a specific entity (matched against `payload.id`). For example, a connector ID.
            example: scl_123
            type: string
        - name: withPayload
          description: When set to `true`, the response will include the `payload` field for each event.
          in: query
          schema:
            description: When set to `true`, the response will include the `payload` field for each event.
            example: 'true'
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/events/types:
    get:
      description: Returns the list of user-facing event types with descriptions.
      operationId: listEventTypes
      security:
        - bearerToken: []
      summary: List Event Types
      tags:
        - user
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEventTypesResponse'
        '400':
          description: ''
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v2/user:
    get:
      description: Retrieves information related to the currently authenticated User.
      operationId: getAuthUser
      security:
        - bearerToken: []
      summary: Get the User
      tags:
        - user
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                properties:
                  user:
                    properties:
                      createdAt:
                        type: number
                        description: UNIX timestamp (in milliseconds) when the User account was created.
                        example: 1630748523395
                      softBlock:
                        nullable: true
                        properties:
                          blockedAt:
                            type: number
                          reason:
                            type: string
                            enum:
                              - BLOCKED_FOR_PLATFORM_ABUSE
                              - DOMAIN_OWNER_DELETION_REQUEST
                              - ENTERPRISE_TRIAL_ENDED
                              - ENTERPRISE_UNPAID_INVOICE
                              - EXPOSURE_CAP_EXCEEDED
                              - FAIR_USE_LIMITS_EXCEEDED
                              - SUBSCRIPTION_CANCELED
                              - SUBSCRIPTION_EXPIRED
                              - UNPAID_INVOICE
                          blockedDueToOverageType:
                            type: string
                            enum:
                              - analyticsUsage
                              - artifacts
                              - bandwidth
                              - blobDataTransfer
                              - blobTotalAdvancedRequests
                              - blobTotalAvgSizeInBytes
                              - blobTotalGetResponseObjectSizeInBytes
                              - blobTotalSimpleRequests
                              - connectDataTransfer
                              - dataCacheRead
                              - dataCacheWrite
                              - edgeConfigRead
                              - edgeConfigWrite
                              - edgeFunctionExecutionUnits
                              - edgeMiddlewareInvocations
                              - edgeRequest
                              - edgeRequestAdditionalCpuDuration
                              - elasticConcurrencyBuildSlots
                              - fastDataTransfer
                              - fastOriginTransfer
                              - fluidCpuDuration
                              - fluidDuration
                              - functionDuration
                              - functionInvocation
                              - imageOptimizationCacheRead
                              - imageOptimizationCacheWrite
                              - imageOptimizationTransformation
                              - logDrainsVolume
                              - monitoringMetric
                              - observabilityEvent
                              - onDemandConcurrencyMinutes
                              - runtimeCacheRead
                              - runtimeCacheWrite
                              - serverlessFunctionExecution
                              - sourceImages
                              - wafOwaspExcessBytes
                              - wafOwaspRequests
                              - wafRateLimitRequest
                              - webAnalyticsEvent
                          unpauseAt:
                            type: number
                            description: Since September 2026. Set only by `billing-usage-alerts` for usage plans with a `blockDurationMs`; its presence marks a pause that expires on its own.
                        required:
                          - blockedAt
                          - reason
                        type: object
                        description: When the User account has been "soft blocked", this property will contain the date when the restriction was enacted, and the identifier for why.
                      billing:
                        nullable: true
                        type: string
                        description: An object containing billing infomation associated with the User account. (opaque JSON object)
                      resourceConfig:
                        properties:
                          concurrentBuilds:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          nodeType:
                            type: string
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          elasticConcurrencyEnabled:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          buildEntitlements:
                            properties:
                              enhancedBuilds:
                                type: boolean
                                enum:
                                  - false
                                  - true
                                description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                            type: object
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          buildQueue:
                            properties:
                              configuration:
                                type: string
                                enum:
                                  - SKIP_NAMESPACE_QUEUE
                                  - WAIT_FOR_NAMESPACE_QUEUE
                                description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                            type: object
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          awsAccountType:
                            type: string
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          awsAccountIds:
                            items:
                              type: string
                            type: array
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          cfZoneName:
                            type: string
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          imageOptimizationType:
                            type: string
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          edgeConfigs:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          edgeConfigSize:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          edgeFunctionMaxSizeBytes:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          edgeFunctionExecutionTimeoutMs:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          serverlessFunctionMaxDuration:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          serverlessFunctionMaxMemorySize:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          kvDatabases:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          postgresDatabases:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          blobStores:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          integrationStores:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          cronJobsPerProject:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          microfrontendGroupsPerTeam:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          microfrontendProjectsPerGroup:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          flagsExplorerOverridesThreshold:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          flagsExplorerUnlimitedOverrides:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          customEnvironmentsPerProject:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          security:
                            properties:
                              rateLimit:
                                type: number
                                description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                              customRules:
                                type: number
                                description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                              ipBlocks:
                                type: number
                                description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                              ipBypass:
                                type: number
                                description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                            type: object
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                          bulkRedirectsFreeLimitOverride:
                            type: number
                            description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                        type: object
                        description: An object containing infomation related to the amount of platform resources may be allocated to the User account.
                      stagingPrefix:
                        type: string
                        description: Prefix that will be used in the URL of "Preview" deployments created by the User account.
                      activeDashboardViews:
                        items:
                          properties:
                            scopeId:
                              type: string
                            viewPreference:
                              nullable: true
                              type: string
                              enum:
                                - cards
                                - list
                                - null
                            favoritesViewPreference:
                              nullable: true
                              type: string
                              enum:
                                - closed
                                - open
                                - null
                            recentsViewPreference:
                              nullable: true
                              type: string
                              enum:
                                - closed
                                - open
                                - null
                          required:
                            - scopeId
                          type: object
                          description: set of dashboard view preferences (cards or list) per scopeId
                        type: array
                        description: set of dashboard view preferences (cards or list) per scopeId
                      importFlowGitNamespace:
                        nullable: true
                        type: string
                      importFlowGitNamespaceId:
                        nullable: true
                        type: string
                      importFlowGitProvider:
                        nullable: true
                        type: string
                        enum:
                          - bitbucket
                          - cursor-origin
                          - github
                          - github-custom-host
                          - github-limited
                          - gitlab
                          - vercel
                          - null
                      preferredScopesAndGitNamespaces:
                        items:
                          properties:
                            scopeId:
                              type: string
                            gitNamespaceId:
                              nullable: true
                              oneOf:
                                - type: string
                                - type: number
                          required:
                            - gitNamespaceId
                            - scopeId
                          type: object
                        type: array
                      dismissedToasts:
                        items:
                          properties:
                            name:
                              type: string
                            dismissals:
                              items:
                                properties:
                                  scopeId:
                                    type: string
                                  createdAt:
                                    type: number
                                required:
                                  - createdAt
                                  - scopeId
                                type: object
                              type: array
                          required:
                            - dismissals
                            - name
                          type: object
                          description: A record of when, under a certain scopeId, a toast was dismissed
                        type: array
                        description: A record of when, under a certain scopeId, a toast was dismissed
                      favoriteProjectsAndSpaces:
                        items:
                          properties:
                            teamId:
                              type: string
                            projectId:
                              type: string
                          required:
                            - projectId
                            - teamId
                          type: object
                          description: A list of projects and spaces across teams that a user has marked as a favorite.
                        type: array
                        description: A list of projects and spaces across teams that a user has marked as a favorite.
                      hasTrialAvailable:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether the user has a trial available for a paid plan subscription.
                      remoteCaching:
                        properties:
                          enabled:
                            type: boolean
                            enum:
                              - false
                              - true
                        type: object
                        description: remote caching settings
                      dataCache:
                        properties:
                          excessBillingEnabled:
                            type: boolean
                            enum:
                              - false
                              - true
                        type: object
                        description: data cache settings
                      featureBlocks:
                        properties:
                          webAnalytics:
                            properties:
                              blockedFrom:
                                type: number
                              blockedUntil:
                                type: number
                              isCurrentlyBlocked:
                                type: boolean
                                enum:
                                  - false
                                  - true
                            required:
                              - isCurrentlyBlocked
                            type: object
                          speedInsightsFree:
                            properties:
                              blockedFrom:
                                type: number
                              blockedUntil:
                                type: number
                              blockReason:
                                type: string
                                enum:
                                  - admin_override
                                  - hard_blocked
                                  - limits_exceeded
                              isCurrentlyBlocked:
                                type: boolean
                                enum:
                                  - false
                                  - true
                            required:
                              - blockReason
                              - isCurrentlyBlocked
                            type: object
                            description: Client-facing view of the `speedInsightsFree` ingestion block. The dashboard needs `blockReason` to tell usage pauses apart from admin blocks.
                        type: object
                        description: Feature blocks for the user
                      isAccountUpdateRequired:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: When `true`, the user must complete the EMU Update Account flow before they can use the dashboard.
                      accountUpdateContext:
                        properties:
                          canOptOut:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: Whether this user can cancel their optional Account Update flow.
                          organization:
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              slug:
                                type: string
                            required:
                              - id
                              - name
                              - slug
                            type: object
                          managedTeams:
                            items:
                              properties:
                                teamId:
                                  type: string
                                slug:
                                  type: string
                                name:
                                  type: string
                                avatar:
                                  nullable: true
                                  type: string
                                workEmail:
                                  type: string
                              required:
                                - avatar
                                - name
                                - slug
                                - teamId
                                - workEmail
                              type: object
                            type: array
                          verifiedEmuDomains:
                            items:
                              type: string
                            type: array
                        required:
                          - canOptOut
                          - managedTeams
                          - verifiedEmuDomains
                        type: object
                        description: Context for the Update Account screen. Present only when `isAccountUpdateRequired` is true. `managedTeams` is empty for orphan mode (user matches an EMU domain but is not on the team).
                      id:
                        type: string
                        description: The User's unique identifier.
                        example: AEIIDYVk59zbFF2Sxfyxxmua
                      email:
                        type: string
                        description: Email address associated with the User account.
                        example: me@example.com
                      name:
                        nullable: true
                        type: string
                        description: Name associated with the User account, or `null` if none has been provided.
                        example: John Doe
                      username:
                        type: string
                        description: Unique username associated with the User account.
                        example: jdoe
                      avatar:
                        nullable: true
                        type: string
                        description: SHA1 hash of the avatar for the User account. Can be used in conjuction with the ... endpoint to retrieve the avatar image.
                        example: 22cb30c85ff45ac4c72de8981500006b28114aa1
                      defaultTeamId:
                        nullable: true
                        type: string
                        description: The user's default team.
                      isEnterpriseManaged:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Indicates whether the user is managed by an enterprise.
                      shouldShowEnterpriseManagedWelcome:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether the Enterprise Managed User joined the current team through the Update Account flow and should see its welcome experience.
                      limited:
                        type: boolean
                        enum:
                          - true
                        description: Property indicating that this User data contains only limited information, due to the authentication token missing privileges to read the full User data. Re-login with email, GitHub, GitLab or Bitbucket in order to upgrade the authentication token with the necessary privileges.
                    required:
                      - avatar
                      - billing
                      - createdAt
                      - defaultTeamId
                      - email
                      - hasTrialAvailable
                      - id
                      - name
                      - resourceConfig
                      - softBlock
                      - stagingPrefix
                      - username
                      - limited
                    type: object
                    description: Data for the currently authenticated User.
                required:
                  - user
                type: object
                description: Successful response.
                x-vercel-cli:
                  displayProperty: user
                  displayColumns:
                    name: user.name
                    id: user.id
                    email: user.email
                    username: user.username
                    defaultTeamId: user.defaultTeamId
                    createdAt: user.createdAt
                    blockedAt: user.softBlock.blockedAt
                    blockedReason: user.softBlock.reason
        '302':
          description: ''
        '400':
          description: ''
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '409':
          description: ''
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
      parameters: []
      x-speakeasy-test: false
  /v1/user:
    delete:
      description: Initiates the deletion process for the currently authenticated User, by sending a deletion confirmation email. The email contains a link that the user needs to visit in order to proceed with the deletion process.
      operationId: requestDelete
      security:
        - bearerToken: []
      summary: Delete User Account
      tags:
        - user
      responses:
        '202':
          description: Response indicating that the User deletion process has been initiated, and a confirmation email has been sent.
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                    description: Unique identifier of the User who has initiated deletion.
                  email:
                    type: string
                    description: Email address of the User who has initiated deletion.
                  message:
                    type: string
                    description: User deletion progress status.
                    example: Verification email sent
                required:
                  - email
                  - id
                  - message
                type: object
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: ''
        '402':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reasons:
                  type: array
                  description: Optional array of objects that describe the reason why the User account is being deleted.
                  items:
                    type: object
                    description: An object describing the reason why the User account is being deleted.
                    required:
                      - slug
                      - description
                    additionalProperties: false
                    properties:
                      slug:
                        type: string
                        description: Idenitifier slug of the reason why the User account is being deleted.
                      description:
                        type: string
                        description: Description of the reason why the User account is being deleted.
        required: true
components:
  schemas:
    UserEvent:
      properties:
        id:
          type: string
          description: The unique identifier of the Event.
          example: uev_bfmMjiMnXfnPbT97dGdpJbCN
        text:
          type: string
          description: The human-readable text of the Event.
          example: You logged in via GitHub
        entities:
          items:
            properties:
              type:
                type: string
                enum:
                  - app
                  - author
                  - bitbucket_login
                  - bold
                  - deployment_host
                  - deployment_inspector
                  - dns_record
                  - edge-config
                  - env_var_name
                  - flag
                  - flags-segment
                  - flags-settings
                  - git_link
                  - github_login
                  - gitlab_login
                  - hook_name
                  - integration
                  - link
                  - project_name
                  - scaling_rules
                  - store
                  - system
                  - target
                example: author
                description: The type of entity.
              start:
                type: number
                description: The index of where the entity begins within the `text` (inclusive).
                example: 0
              end:
                type: number
                description: The index of where the entity ends within the `text` (non-inclusive).
                example: 3
            required:
              - end
              - start
              - type
            type: object
            description: A list of "entities" within the event `text`. Useful for enhancing the displayed text with additional styling and links.
          type: array
          description: A list of "entities" within the event `text`. Useful for enhancing the displayed text with additional styling and links.
        type:
          type: string
          enum:
            - access-group-created
            - access-group-deleted
            - access-group-project-updated
            - access-group-updated
            - access-group-user-added
            - access-group-user-removed
            - admin-agentic-provisioning-account-unlinked
            - admin-plan-updated
            - admin-secondary-email-added
            - admin-secondary-email-removed
            - admin-team-name-update
            - admin-team-slug-update
            - admin-user-delete
            - admin-user-primary-email-updated
            - admin-username-updated
            - agentic-provisioning-account-blocked
            - agentic-provisioning-account-linked
            - agentic-provisioning-account-relinked
            - agentic-provisioning-account-unlinked
            - agentic-provisioning-credentials-rotated
            - agentic-provisioning-plan-changed
            - agentic-provisioning-team-created
            - ai-alert-investigation
            - ai-code-review
            - ai-gateway-api-key-created
            - ai-gateway-api-key-deleted
            - ai-gateway-api-key-quota-updated
            - ai-gateway-auto-reload-updated
            - ai-gateway-budget-default-updated
            - ai-gateway-byok-credential-created
            - ai-gateway-byok-credential-deleted
            - ai-gateway-byok-credential-updated
            - ai-gateway-byok-model-mappings-updated
