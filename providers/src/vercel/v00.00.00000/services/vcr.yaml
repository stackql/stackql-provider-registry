openapi: 3.0.3
info:
  title: vcr API
  description: vercel vcr API
  version: 0.0.1
paths:
  /v1/vcr/repository:
    post:
      description: Create a container registry repository for a project.
      operationId: createRepository
      security:
        - bearerToken: []
      summary: Create a repository
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  repository:
                    $ref: '#/components/schemas/VcrRepository'
                required:
                  - repository
                type: object
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - projectId
                - name
              properties:
                projectId:
                  type: string
                  description: Project ID. Missing or empty values return HTTP 400.
                name:
                  type: string
                  pattern: ^[a-z0-9]+(?:(?:\\.|_|__|-+)[a-z0-9]+)*$
                  maxLength: 255
                  description: Single Docker repository name component.
                  example: nginx
    get:
      description: List container registry repositories for a project.
      operationId: listRepositories
      security:
        - bearerToken: []
      summary: List repositories
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcrRepositoryList'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          description: Opaque pagination cursor returned by a previous list response.
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
            description: Opaque pagination cursor returned by a previous list response.
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/vcr/repository/{id_or_name}:
    get:
      description: Fetch a container registry repository for a project by ID or name.
      operationId: getRepository
      security:
        - bearerToken: []
      summary: Get a repository
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  repository:
                    $ref: '#/components/schemas/VcrRepository'
                required:
                  - repository
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    delete:
      description: Schedule a repository for deletion. The repository is marked so it disappears from list/get immediately; subscriber-vcr reclaims every image (manifests, blobs, tags and rows) and finally deletes the repository row asynchronously via the VcrRepositoryRemoved event.
      operationId: deleteRepository
      security:
        - bearerToken: []
      summary: Delete a repository
      tags:
        - vcr
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                nullable: true
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/vcr/repository/{id_or_name}/images:
    get:
      description: List images for a container registry repository, including their tags.
      operationId: listRepositoryImages
      security:
        - bearerToken: []
      summary: List repository images
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcrImageList'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          description: Opaque pagination cursor returned by a previous list response.
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
            description: Opaque pagination cursor returned by a previous list response.
        - name: untagged
          in: query
          required: false
          schema:
            type: boolean
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/vcr/repository/{id_or_name}/permissions:
    post:
      description: Grant a team access to a VCR repository. Sharing applies to the whole repository.
      operationId: addRepositoryPermission
      security:
        - bearerToken: []
      summary: Add a repository permission
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  permission:
                    $ref: '#/components/schemas/VcrRepositoryPermission'
                required:
                  - permission
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                teamId:
                  type: string
                  pattern: ^team_[a-zA-Z0-9]+$
                  maxLength: 64
                  description: ID of a team that is granted access to a repository.
                  example: team_LLHUOMOoDlqOp8wPE4kFo9pE
                teamSlug:
                  type: string
                  pattern: ^[a-z0-9](?:[a-z0-9-]{0,46}[a-z0-9])?$
                  maxLength: 64
                  description: Slug of a team that is granted access to a repository.
                  example: my-team
    delete:
      description: Revoke a team's access to a VCR repository.
      operationId: removeRepositoryPermission
      security:
        - bearerToken: []
      summary: Remove a repository permission
      tags:
        - vcr
      responses:
        '204':
          description: ''
          content:
            application/json:
              schema:
                nullable: true
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                teamId:
                  type: string
                  pattern: ^team_[a-zA-Z0-9]+$
                  maxLength: 64
                  description: ID of a team that is granted access to a repository.
                  example: team_LLHUOMOoDlqOp8wPE4kFo9pE
                teamSlug:
                  type: string
                  pattern: ^[a-z0-9](?:[a-z0-9-]{0,46}[a-z0-9])?$
                  maxLength: 64
                  description: Slug of a team that is granted access to a repository.
                  example: my-team
    get:
      description: List the teams a VCR repository is shared with.
      operationId: listRepositoryPermissions
      security:
        - bearerToken: []
      summary: List repository permissions
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcrRepositoryPermissionList'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          description: Opaque pagination cursor returned by a previous list response.
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
            description: Opaque pagination cursor returned by a previous list response.
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/vcr/repository/{id_or_name}/permissions/all:
    delete:
      description: Revoke every team's access to a VCR repository. Clearing an unshared repository is a no-op.
      operationId: clearRepositoryPermissions
      security:
        - bearerToken: []
      summary: Clear all repository permissions
      tags:
        - vcr
      responses:
        '204':
          description: ''
          content:
            application/json:
              schema:
                nullable: true
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/vcr/repository/{id_or_name}/tags:
    get:
      description: List a repository's tags.
      operationId: listRepositoryTags
      security:
        - bearerToken: []
      summary: List repository tags
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  tags:
                    items:
                      properties:
                        tag:
                          type: string
                        manifestDigest:
                          type: string
                        imageId:
                          type: string
                        kind:
                          type: string
                          enum:
                            - attestation
                            - index
                            - manifest
                        platform:
                          type: string
                        arch:
                          type: string
                        pushedBy:
                          type: string
                        status:
                          nullable: true
                          type: string
                          enum:
                            - preparing
                            - ready
                            - unoptimized
                            - null
                        sizeInBytes:
                          type: number
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                        - createdAt
                        - imageId
                        - kind
                        - manifestDigest
                        - sizeInBytes
                        - status
                        - tag
                        - updatedAt
                      type: object
                    type: array
                  nextCursor:
                    type: string
                required:
                  - tags
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: sortBy
          description: Field to sort the non-pinned tags by.
          in: query
          required: false
          schema:
            description: Field to sort the non-pinned tags by.
            type: string
            enum:
              - updatedAt
              - tag
            default: updatedAt
        - name: sortOrder
          description: Sort direction. Defaults to desc.
          in: query
          required: false
          schema:
            description: Sort direction. Defaults to desc.
            type: string
            enum:
              - asc
              - desc
            default: desc
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/vcr/repository/{id_or_name}/tags/{tag}:
    get:
      description: Fetch a single tag from a repository, including the backing image's metadata and VHS-readiness status.
      operationId: getRepositoryTag
      security:
        - bearerToken: []
      summary: Get a repository tag
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  tag:
                    $ref: '#/components/schemas/VcrTag'
                required:
                  - tag
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - name: tag
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/vcr/repository/{id_or_name}/images/{image_id_or_digest}:
    get:
      description: Fetch an individual image from a repository, including its tags and Dockerfile history entries with discriminated layer details for UI rendering. The image may be addressed by its internal id (`image_...`) or by its manifest digest (`sha256:...`).
      operationId: getRepositoryImage
      security:
        - bearerToken: []
      summary: Get a repository image
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  image:
                    $ref: '#/components/schemas/VcrImageDetail'
                required:
                  - image
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - name: image_id_or_digest
          description: The internal image id (`image_...`) or the image manifest digest (`sha256:...`).
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            description: The internal image id (`image_...`) or the image manifest digest (`sha256:...`).
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/vcr/repository/{id_or_name}/images/{image_id}:
    delete:
      description: Schedule an image for deletion. The image is marked so it disappears from list/get immediately; subscriber-vcr reclaims the manifest, blobs, tags and row asynchronously via the VcrManifestRemoved event.
      operationId: deleteRepositoryImage
      security:
        - bearerToken: []
      summary: Delete a repository image
      tags:
        - vcr
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                nullable: true
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: Project ID. Missing or empty values return HTTP 400.
          in: query
          required: true
          schema:
            type: string
            description: Project ID. Missing or empty values return HTTP 400.
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v2/:
    get:
      description: GET /v2/ Docker Registry v2 version check. Returns a 401 challenge when no credentials are provided, prompting the Docker client to send auth. With valid credentials, returns 200 so the client can proceed.
      operationId: getRoot
      security: []
      summary: Check registry API version support
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
                description: (opaque JSON object)
        '400':
          description: ''
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters: []
  /v2/{team_slug}/{project_slug}/{repository_name}/blobs/{digest}:
    head:
      description: HEAD /v2/:teamSlug/:projectSlug/:repositoryName/blobs/:digest Check whether a blob exists. Used by the Docker client before pushing a layer to avoid re-uploading content that already exists.
      operationId: headByTeamSlugByProjectSlugByRepositoryNameBlobsByDigest
      security: []
      summary: Check if a blob exists
      tags:
        - vcr
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                nullable: true
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: teamSlug
          description: Single Docker repository team slug component.
          in: path
          required: true
          schema:
            type: string
