components:
  schemas:
    VcrRepository:
      properties:
        id:
          type: string
          description: Unique identifier of the repository.
          example: repo_a1b2c3d4e5f6
        projectId:
          type: string
          description: Identifier of the project the repository belongs to.
          example: prj_a1b2c3d4e5f6
        name:
          type: string
          description: Name of the repository.
          example: my-app
        public:
          type: boolean
          enum:
            - false
            - true
          description: Whether the repository is public. Images in public repositories can be pulled by anyone. Defaults to `false` (private).
          example: false
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the repository was created.
          example: '2026-06-30T10:00:00.000Z'
        updatedAt:
          type: string
          description: ISO 8601 timestamp of when the repository was last updated.
          example: '2026-06-30T10:00:00.000Z'
      required:
        - createdAt
        - id
        - name
        - projectId
        - public
        - updatedAt
      type: object
      description: A Vercel Container Registry repository.
    VcrRepositoryList:
      properties:
        repositories:
          items:
            $ref: '#/components/schemas/VcrRepository'
          type: array
        nextCursor:
          type: string
          description: Cursor to fetch the next page of results, when more are available.
      required:
        - repositories
      type: object
      description: A paginated list of Vercel Container Registry repositories.
    VcrImageList:
      properties:
        images:
          items:
            $ref: '#/components/schemas/VcrImageListItem'
          type: array
        nextCursor:
          type: string
          description: Cursor to fetch the next page of results, when more are available.
      required:
        - images
      type: object
      description: A paginated list of images for a repository.
    VcrRepositoryPermission:
      properties:
        repositoryId:
          type: string
          description: Identifier of the repository the permission grants access to.
          example: repo_a1b2c3d4e5f6
        teamId:
          type: string
          description: Identifier of the team that is granted access to the repository.
          example: team_a1b2c3d4e5f6
        teamSlug:
          type: string
          description: Slug of the team that is granted access to the repository.
          example: my-team
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the permission was created.
          example: '2026-06-30T10:00:00.000Z'
      required:
        - createdAt
        - repositoryId
        - teamId
        - teamSlug
      type: object
      description: A team's access grant to a Vercel Container Registry repository.
    VcrRepositoryPermissionList:
      properties:
        permissions:
          items:
            $ref: '#/components/schemas/VcrRepositoryPermission'
          type: array
        nextCursor:
          type: string
          description: Cursor to fetch the next page of results, when more are available.
      required:
        - permissions
      type: object
      description: A paginated list of Vercel Container Registry repository permissions.
    VcrTag:
      properties:
        tag:
          type: string
          description: The tag name.
          example: latest
        manifestDigest:
          type: string
          description: SHA-256 digest of the image manifest the tag points at.
          example: sha256:2c4e8f3a1b9d0e5c7a6f4b2d8e1c9a0b3d5f7e9c1a2b4d6f8e0c2a4b6d8f0e2c
        imageId:
          type: string
          description: Internal identifier of the image the tag points at.
          example: img_a1b2c3d4e5f6
        kind:
          type: string
          enum:
            - attestation
            - index
            - manifest
          description: Whether the manifest is a multi-platform image index, a single-platform image manifest or an attestation.
        platform:
          type: string
          description: Operating system the manifest targets. Only present for single-platform manifests.
          example: linux
        arch:
          type: string
          description: CPU architecture the manifest targets. Only present for single-platform manifests.
          example: amd64
        pushedBy:
          type: string
          description: Identifier of the actor that pushed the image.
        status:
          nullable: true
          type: string
          enum:
            - preparing
            - ready
            - unoptimized
            - null
          description: VHS-readiness status, or `null` for a multi-platform index.
        sizeInBytes:
          type: number
          description: Total size in bytes of the image's resources (manifest, config and layer blobs) stored by the registry.
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the tag was created.
          example: '2026-06-30T10:00:00.000Z'
        updatedAt:
          type: string
          description: ISO 8601 timestamp of when the tag was last updated.
          example: '2026-06-30T10:00:00.000Z'
      required:
        - createdAt
        - imageId
        - kind
        - manifestDigest
        - sizeInBytes
        - status
        - tag
        - updatedAt
      type: object
      description: A tag pointing at an image in a Vercel Container Registry repository, enriched with the backing image's metadata and VHS-readiness status.
    VcrImageDetail:
      properties:
        layers:
          items:
            $ref: '#/components/schemas/VcrImageLayer'
          type: array
        tags:
          items:
            type: string
          type: array
          description: Tags pointing at this image's manifest.
        id:
          type: string
          description: Internal identifier of the image.
          example: img_a1b2c3d4e5f6
        repositoryId:
          type: string
          description: Identifier of the repository the image belongs to.
          example: repo_a1b2c3d4e5f6
        manifestDigest:
          type: string
          description: SHA-256 digest of the image manifest.
          example: sha256:2c4e8f3a1b9d0e5c7a6f4b2d8e1c9a0b3d5f7e9c1a2b4d6f8e0c2a4b6d8f0e2c
        kind:
          type: string
          enum:
            - attestation
            - index
            - manifest
          description: Whether the manifest is a multi-platform image index, a single-platform image manifest or an attestation.
        platform:
          type: string
          description: Operating system the manifest targets. Only present for single-platform manifests.
          example: linux
        arch:
          type: string
          description: CPU architecture the manifest targets. Only present for single-platform manifests.
          example: amd64
        pushedBy:
          type: string
          description: Identifier of the actor that pushed the image.
        sizeInBytes:
          type: number
          description: Total size in bytes of the image's resources (manifest, config and layer blobs) stored by the registry.
        status:
          nullable: true
          type: string
          enum:
            - preparing
            - ready
            - unoptimized
            - null
          description: VHS-readiness status, or `null` for a multi-platform index.
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the image was created.
          example: '2026-06-30T10:00:00.000Z'
      required:
        - createdAt
        - id
        - kind
        - layers
        - manifestDigest
        - repositoryId
        - sizeInBytes
        - status
        - tags
      type: object
      description: A single image with its tags, status and resolved Dockerfile layer history.
    VcrImageListItem:
      properties:
        tags:
          items:
            type: string
          type: array
          description: Tags pointing at this image's manifest.
        id:
          type: string
          description: Internal identifier of the image.
          example: img_a1b2c3d4e5f6
        repositoryId:
          type: string
          description: Identifier of the repository the image belongs to.
          example: repo_a1b2c3d4e5f6
        manifestDigest:
          type: string
          description: SHA-256 digest of the image manifest.
          example: sha256:2c4e8f3a1b9d0e5c7a6f4b2d8e1c9a0b3d5f7e9c1a2b4d6f8e0c2a4b6d8f0e2c
        kind:
          type: string
          enum:
            - attestation
            - index
            - manifest
          description: Whether the manifest is a multi-platform image index, a single-platform image manifest or an attestation.
        platform:
          type: string
          description: Operating system the manifest targets. Only present for single-platform manifests.
          example: linux
        arch:
          type: string
          description: CPU architecture the manifest targets. Only present for single-platform manifests.
          example: amd64
        pushedBy:
          type: string
          description: Identifier of the actor that pushed the image.
        sizeInBytes:
          type: number
          description: Total size in bytes of the image's resources (manifest, config and layer blobs) stored by the registry.
        status:
          nullable: true
          type: string
          enum:
            - preparing
            - ready
            - unoptimized
            - null
          description: VHS-readiness status, or `null` for a multi-platform index.
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the image was created.
          example: '2026-06-30T10:00:00.000Z'
      required:
        - createdAt
        - id
        - kind
        - manifestDigest
        - repositoryId
        - sizeInBytes
        - status
        - tags
      type: object
      description: An image enriched with its tags and VHS-readiness status, as returned when listing a repository's images.
    VcrImageLayer:
      properties:
        createdBy:
          nullable: true
          type: string
        digest:
          nullable: true
          type: string
        operation:
          type: string
          enum:
            - ADD
            - ARG
            - CMD
            - COPY
            - ENTRYPOINT
            - ENV
            - EXPOSE
            - FROM
            - HEALTHCHECK
            - LABEL
            - ONBUILD
            - RUN
            - SHELL
            - STOPSIGNAL
            - UNKNOWN
            - USER
            - VOLUME
            - WORKDIR
          description: Docker/OCI build instruction associated with an image layer.
        sizeBytes:
          nullable: true
          type: number
        type:
          type: string
          enum:
            - FROM
        baseImage:
          nullable: true
          type: string
        collapsedDigests:
          items:
            type: string
          type: array
        collapsedLayerCount:
          type: number
        command:
          nullable: true
          type: string
        env:
          nullable: true
          type: string
        value:
          nullable: true
          type: string
      required:
        - baseImage
        - collapsedDigests
        - collapsedLayerCount
        - createdBy
        - digest
        - operation
        - sizeBytes
        - type
        - command
        - env
        - value
      type: object
