      id: vercel.log_drains.log_drains
      name: log_drains
      title: Log Drains
      methods:
        get:
          operation:
            $ref: '#/paths/~1v1~1log-drains~1{id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        delete:
          operation:
            $ref: '#/paths/~1v1~1log-drains~1{id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
          request:
            nativeCasing: camel
        list:
          operation:
            $ref: '#/paths/~1v1~1log-drains/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.log_drains
            overrideMediaType: application/json
            schema_override:
              $ref: '#/components/schemas/GetAllLogDrainsResponse'
            transform:
              body: |-
                {{- $wrapped := printf "{\"log_drains\":%s}" . -}}
                {{- $wrapped -}}
              type: golang_template_text_v0.3.0
