openapi: 3.0.3
info:
  title: log_drains API
  description: vercel log_drains API
  version: 0.0.1
paths:
  /v1/log-drains/{id}:
    get:
      description: Retrieves a Configurable Log Drain. This endpoint must be called with a team AccessToken (integration OAuth2 clients are not allowed). Only log drains owned by the authenticated team can be accessed.
      operationId: getConfigurableLogDrain
      security:
        - bearerToken: []
      summary: Retrieves a Configurable Log Drain (deprecated)
      tags:
        - logDrains
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdFrom:
                    type: string
                  clientId:
                    type: string
                  configurationId:
                    type: string
                  projectsMetadata:
                    nullable: true
                    items:
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        framework:
                          nullable: true
                          type: string
                          enum:
                            - actix-web
                            - angular
                            - ash
                            - astro
                            - axum
                            - blitzjs
                            - brunch
                            - bun
                            - container
                            - create-react-app
                            - django
                            - docusaurus
                            - docusaurus-2
                            - dojo
                            - eleventy
                            - elysia
                            - ember
                            - eve
                            - express
                            - factory-eve
                            - fastapi
                            - fasthtml
                            - fastify
                            - flask
                            - gatsby
                            - go
                            - gridsome
                            - h3
                            - hexo
                            - hono
                            - hugo
                            - hydrogen
                            - ionic-angular
                            - ionic-react
                            - jekyll
                            - koa
                            - mastra
                            - middleman
                            - nestjs
                            - nextjs
                            - nitro
                            - node
                            - nuxtjs
                            - parcel
                            - polymer
                            - preact
                            - python
                            - react-router
                            - redwoodjs
                            - remix
                            - ruby
                            - rust
                            - saber
                            - sanity
                            - sanity-v2
                            - sapper
                            - scully
                            - services
                            - solidstart
                            - solidstart-1
                            - stencil
                            - storybook
                            - svelte
                            - sveltekit
                            - sveltekit-1
                            - tanstack-start
                            - tanstack-start-lovable
                            - umijs
                            - vite
                            - vitepress
                            - vue
                            - vuepress
                            - xmcp
                            - zola
                            - null
                        latestDeployment:
                          type: string
                      required:
                        - id
                        - name
                      type: object
                    type: array
                  integrationIcon:
                    type: string
                  integrationConfigurationUri:
                    type: string
                  integrationWebsite:
                    type: string
                required:
                  - createdFrom
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    delete:
      description: Deletes a Configurable Log Drain. This endpoint must be called with a team AccessToken (integration OAuth2 clients are not allowed). Only log drains owned by the authenticated team can be deleted.
      operationId: deleteConfigurableLogDrain
      security:
        - bearerToken: []
      summary: Deletes a Configurable Log Drain (deprecated)
      tags:
        - logDrains
      responses:
        '204':
          description: ''
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/log-drains:
    get:
      description: Retrieves a list of all the Log Drains owned by the account. This endpoint must be called with an account AccessToken (integration OAuth2 clients are not allowed). Only log drains owned by the authenticated account can be accessed.
      operationId: getAllLogDrains
      security:
        - bearerToken: []
      summary: Retrieves a list of all the Log Drains (deprecated)
      tags:
        - logDrains
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllLogDrainsResponse'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          in: query
          schema:
            pattern: ^[a-zA-z0-9_]+$
            type: string
        - name: projectIdOrName
          in: query
          schema:
            type: string
        - name: includeMetadata
          in: query
          schema:
            type: boolean
            default: false
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    post:
      description: Creates a configurable log drain. This endpoint must be called with a team AccessToken (integration OAuth2 clients are not allowed)
      operationId: createConfigurableLogDrain
      security:
        - bearerToken: []
      summary: Creates a Configurable Log Drain (deprecated)
      tags:
        - logDrains
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
                description: (opaque JSON object)
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - deliveryFormat
                - url
                - sources
              properties:
                deliveryFormat:
                  description: The delivery log format
                  example: json
                  enum:
                    - json
                    - ndjson
                url:
                  description: The log drain url
                  format: uri
                  pattern: ^(http|https)?://
                  type: string
                headers:
                  description: Headers to be sent together with the request
                  type: object
                  additionalProperties:
                    type: string
                projectIds:
                  minItems: 1
                  maxItems: 50
                  type: array
                  items:
                    pattern: ^[a-zA-z0-9_]+$
                    type: string
                sources:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - static
                      - lambda
                      - build
                      - edge
                      - external
                      - firewall
                  minItems: 1
                environments:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - preview
                      - production
                  minItems: 1
                secret:
                  description: Custom secret of log drain
                  type: string
                samplingRate:
                  type: number
                  description: The sampling rate for this log drain. It should be a percentage rate between 0 and 100. With max 2 decimal points
                  minimum: 0.01
                  maximum: 1
                  multipleOf: 0.01
                name:
                  type: string
                  description: The custom name of this log drain.
        required: true
  /v2/integrations/log-drains:
    get:
      description: Retrieves a list of all Integration log drains that are defined for the authenticated user or team. When using an OAuth2 token, the list is limited to log drains created by the authenticated integration.
      operationId: getIntegrationLogDrains
      security:
        - bearerToken: []
      summary: Retrieves a list of Integration log drains (deprecated)
      tags:
        - logDrains
      responses:
        '200':
          description: A list of log drains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIntegrationLogDrainsResponse'
        '400':
          description: ''
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    post:
      description: Creates an Integration log drain. This endpoint must be called with an OAuth2 client (integration), since log drains are tied to integrations. If it is called with a different token type it will produce a 400 error.
      operationId: createLogDrain
      security:
        - bearerToken: []
      summary: Creates a new Integration Log Drain (deprecated)
      tags:
        - logDrains
      responses:
        '200':
          description: The log drain was successfully created
          content:
            application/json:
              schema:
                properties:
                  clientId:
                    type: string
                    description: The oauth2 client application id that created this log drain
                    example: oac_xRhY4LAB7yLhUADD69EvV7ct
                  configurationId:
                    type: string
                    description: The client configuration this log drain was created with
                    example: icfg_3bwCLgxL8qt5kjRLcv2Dit7F
                  createdAt:
                    type: number
                    description: A timestamp that tells you when the log drain was created
                    example: 1558531915505
                  id:
                    type: string
                    description: The unique identifier of the log drain. Always prefixed with `ld_`
                    example: ld_nBuA7zCID8g4QZ8g
                  deliveryFormat:
                    type: string
                    enum:
                      - json
                      - ndjson
                      - protobuf
                    description: The delivery log format
                    example: json
                  name:
                    type: string
                    description: The name of the log drain
                    example: My first log drain
                  ownerId:
                    type: string
                    description: The identifier of the team or user whose events will trigger the log drain
                    example: kr1PsOIzqEL5Xg6M4VZcZosf
                  projectId:
                    nullable: true
                    type: string
                    example: AbCgVkqoxXeXCDWehVir51LHGrrcWL4mkYm14W6UBPWQeb
                  projectIds:
                    items:
                      type: string
                    type: array
                    description: The identifier of the projects this log drain is associated with
                    example: AbCgVkqoxXeXCDWehVir51LHGrrcWL4mkYm14W6UBPWQeb
                  url:
                    type: string
                    description: The URL to call when logs are generated
                    example: https://example.com/log-drain
                  sources:
                    items:
                      type: string
                      enum:
                        - build
                        - edge
                        - external
                        - firewall
                        - lambda
                        - redirect
                        - static
                      description: The sources from which logs are currently being delivered to this log drain.
                      example:
                        - build
                        - edge
                    type: array
                    description: The sources from which logs are currently being delivered to this log drain.
                    example:
                      - build
                      - edge
                  createdFrom:
                    type: string
                    enum:
                      - integration
                      - self-served
                    description: Whether the log drain was created by an integration or by a user
                    example: integration
                  headers:
                    additionalProperties:
                      type: string
                    type: object
                    description: The headers to send with the request
                    example: '{"Authorization": "Bearer 123"}'
                  environments:
                    items:
                      type: string
                      enum:
                        - preview
                        - production
                      description: The environment of log drain
                      example:
                        - production
                    type: array
                    description: The environment of log drain
                    example:
                      - production
                  branch:
                    type: string
                    description: The branch regexp of log drain
                    example: feature/*
                  samplingRate:
                    type: number
                    description: The sampling rate of log drain
                    example: 0.5
                  source:
                    properties:
                      kind:
                        type: string
                        enum:
                          - self-served
                      resourceId:
                        type: string
                      externalResourceId:
                        type: string
                      integrationId:
                        type: string
                      integrationConfigurationId:
                        type: string
                    required:
                      - kind
                      - integrationConfigurationId
                      - integrationId
                    type: object
                required:
                  - createdAt
                  - id
                  - name
                  - ownerId
                  - source
                  - url
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            The provided token is not from an OAuth2 Client
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: The name of the log drain
                  example: My first log drain
                  maxLength: 100
                  pattern: ^[A-z0-9_ -]+$
                  type: string
                projectIds:
                  minItems: 1
                  maxItems: 50
                  type: array
                  items:
                    pattern: ^[a-zA-z0-9_]+$
                    type: string
                secret:
                  description: A secret to sign log drain notification headers so a consumer can verify their authenticity
                  example: a1Xsfd325fXcs
                  maxLength: 100
                  pattern: ^[A-z0-9_ -]+$
                  type: string
                deliveryFormat:
                  description: The delivery log format
                  example: json
                  enum:
                    - json
                    - ndjson
                url:
                  description: The url where you will receive logs. The protocol must be `https://` or `http://` when type is `json` and `ndjson`.
                  example: https://example.com/log-drain
                  format: uri
                  pattern: ^https?://
                  type: string
                sources:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - static
                      - lambda
                      - build
                      - edge
                      - external
                      - firewall
                  minItems: 1
                headers:
                  description: Headers to be sent together with the request
                  type: object
                  additionalProperties:
                    type: string
                environments:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - preview
                      - production
                  minItems: 1
              required:
                - name
                - url
              type: object
        required: true
  /v1/integrations/log-drains/{id}:
    delete:
      description: Deletes the Integration log drain with the provided `id`. When using an OAuth2 Token, the log drain can be deleted only if the integration owns it.
      operationId: deleteIntegrationLogDrain
      security:
        - bearerToken: []
      summary: Deletes the Integration log drain with the provided `id` (deprecated)
      tags:
        - logDrains
      responses:
        '204':
          description: The log drain was successfully deleted
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: id
          description: ID of the log drain to be deleted
          in: path
          required: true
          schema:
            description: ID of the log drain to be deleted
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
