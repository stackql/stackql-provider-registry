openapi: 3.0.3
info:
  title: dns API
  description: vercel dns API
  version: 0.0.1
paths:
  /v5/domains/{domain}/records:
    get:
      description: Retrieves a list of DNS records created for a domain name. By default it returns 20 records if no limit is provided. The rest can be retrieved using the pagination options.
      operationId: getRecords
      security:
        - bearerToken: []
      summary: List existing DNS records
      tags:
        - dns
      responses:
        '200':
          description: Successful response retrieving a list of paginated DNS records.
          content:
            application/json:
              schema:
                properties:
                  records:
                    items:
                      properties:
                        id:
                          type: string
                        slug:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
                          enum:
                            - A
                            - AAAA
                            - ALIAS
                            - CAA
                            - CNAME
                            - HTTPS
                            - MX
                            - NS
                            - SRV
                            - TXT
                        value:
                          type: string
                        mxPriority:
                          type: number
                        priority:
                          type: number
                        creator:
                          type: string
                        created:
                          nullable: true
                          type: number
                        updated:
                          nullable: true
                          type: number
                        createdAt:
                          nullable: true
                          type: number
                        updatedAt:
                          nullable: true
                          type: number
                        ttl:
                          type: number
                        comment:
                          type: string
                      required:
                        - created
                        - createdAt
                        - creator
                        - id
                        - name
                        - slug
                        - type
                        - updated
                        - updatedAt
                        - value
                      type: object
                    type: array
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - records
                  - pagination
                type: object
                description: Successful response retrieving a list of paginated DNS records.
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - ls
          - list
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
            example: example.com
          x-vercel-cli:
            kind: argument
        - name: limit
          description: Maximum number of records to list from a request.
          in: query
          required: false
          schema:
            description: Maximum number of records to list from a request.
            type: string
            example: 20
        - name: since
          description: Get records created after this JavaScript timestamp.
          in: query
          required: false
          schema:
            description: Get records created after this JavaScript timestamp.
            type: string
            example: 1609499532000
        - name: until
          description: Get records created before this JavaScript timestamp.
          in: query
          required: false
          schema:
            description: Get records created before this JavaScript timestamp.
            type: string
            example: 1612264332000
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v2/domains/{domain}/records:
    post:
      description: Creates a DNS record for a domain.
      operationId: createRecord
      security:
        - bearerToken: []
      summary: Create a DNS record
      tags:
        - dns
      responses:
        '200':
          description: Successful response showing the uid of the newly created DNS record.
          content:
            application/json:
              schema:
                properties:
                  uid:
                    type: string
                  updated:
                    type: number
                required:
                  - updated
                  - uid
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        bodyArguments:
          - name
          - type
          - value
      parameters:
        - name: domain
          description: The domain used to create the DNS record.
          in: path
          required: true
          schema:
            description: The domain used to create the DNS record.
            type: string
            example: example.com
          x-vercel-cli:
            kind: argument
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              required:
                - type
                - value
                - name
                - mxPriority
                - srv
                - https
              properties:
                type:
                  description: The type of record, it could be one of the valid DNS records.
                  type: string
                  enum:
                    - A
                    - AAAA
                    - ALIAS
                    - CAA
                    - CNAME
                    - HTTPS
                    - MX
                    - SRV
                    - TXT
                    - NS
                name:
                  description: A subdomain name or an empty string for the root domain.
                  type: string
                  example: subdomain
                ttl:
                  description: The TTL value. Must be a number between 60 and 2147483647. Default value is 60.
                  type: number
                  minimum: 60
                  maximum: 2147483647
                  example: 60
                value:
                  description: The record value must be a valid IPv4 address.
                  type: string
                  format: ipv4
                  example: 192.0.2.42
                comment:
                  type: string
                  description: A comment to add context on what this DNS record is for
                  example: used to verify ownership of domain
                  maxLength: 500
                mxPriority:
                  type: number
                  minimum: 0
                  maximum: 65535
                  example: 10
                srv:
                  type: object
                  additionalProperties: false
                  required:
                    - weight
                    - port
                    - priority
                    - target
                  properties:
                    priority:
                      anyOf:
                        - type: number
                          minimum: 0
                          maximum: 65535
                          example: 10
                      nullable: true
                    weight:
                      anyOf:
                        - type: number
                          minimum: 0
                          maximum: 65535
                          example: 10
                      nullable: true
                    port:
                      anyOf:
                        - type: number
                          minimum: 0
                          maximum: 65535
                          example: 5000
                      nullable: true
                    target:
                      type: string
                      example: host.example.com
                https:
                  type: object
                  additionalProperties: false
                  required:
                    - priority
                    - target
                  properties:
                    priority:
                      anyOf:
                        - type: number
                          minimum: 0
                          maximum: 65535
                          example: 10
                      nullable: true
                    target:
                      type: string
                      example: host.example.com
                    params:
                      type: string
                      example: alpn=h2,h3
              type: object
              additionalProperties: false
        required: true
      x-speakeasy-test: false
  /v1/domains/records/{record_id}:
    patch:
      description: Updates an existing DNS record for a domain name.
      operationId: updateRecord
      security:
        - bearerToken: []
      summary: Update an existing DNS record
      tags:
        - dns
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  type:
                    type: string
                    enum:
                      - record
                      - record-sys
                  value:
                    type: string
                  creator:
                    type: string
                  domain:
                    type: string
                  ttl:
                    type: number
                  comment:
                    type: string
                  recordType:
                    type: string
                    enum:
                      - A
                      - AAAA
                      - ALIAS
                      - CAA
                      - CNAME
                      - HTTPS
                      - MX
                      - NS
                      - SRV
                      - TXT
                  createdAt:
                    nullable: true
                    type: number
                required:
                  - creator
                  - domain
                  - id
                  - name
                  - recordType
                  - type
                  - value
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
      parameters:
        - name: record_id
          description: The id of the DNS record
          in: path
          required: true
          schema:
            description: The id of the DNS record
            example: rec_2qn7pzrx89yxy34vezpd31y9
            type: string
          x-vercel-cli:
            kind: argument
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: The name of the DNS record
                  example: example-1
                  nullable: true
                value:
                  type: string
                  description: The value of the DNS record
                  example: google.com
                  nullable: true
                type:
                  enum:
                    - A
                    - AAAA
                    - ALIAS
                    - CAA
                    - CNAME
                    - HTTPS
                    - MX
                    - SRV
                    - TXT
                    - NS
                    - null
                  type: string
                  description: The type of the DNS record
                  example: A
                  maxLength: 255
                  nullable: true
                ttl:
                  type: integer
                  description: The Time to live (TTL) value of the DNS record
                  example: '60'
                  minimum: 60
                  maximum: 2147483647
                  nullable: true
                mxPriority:
                  type: integer
                  description: The MX priority value of the DNS record
                  nullable: true
                srv:
                  additionalProperties: false
                  required:
                    - target
                    - weight
                    - port
                    - priority
                  properties:
                    target:
                      type: string
                      description: ''
                      example: example2.com.
                      maxLength: 255
                      nullable: true
                    weight:
                      description: ''
                      type: integer
                      nullable: true
                    port:
                      description: ''
                      type: integer
                      nullable: true
                    priority:
                      description: ''
                      type: integer
                      nullable: true
                  type: object
                  nullable: true
                https:
                  additionalProperties: false
                  required:
                    - priority
                    - target
                  properties:
                    priority:
                      description: ''
                      type: integer
                      nullable: true
                    target:
                      type: string
                      description: ''
                      example: example2.com.
                      maxLength: 255
                      nullable: true
                    params:
                      description: ''
                      type: string
                      nullable: true
                  type: object
                  nullable: true
                comment:
                  type: string
                  description: A comment to add context on what this DNS record is for
                  example: used to verify ownership of domain
                  maxLength: 500
              type: object
        required: true
  /domains/{domain}/records:
    put:
      description: ''
      operationId: replaceDomainsByDomainRecords
      security: []
      tags: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  recordIds:
                    items:
                      type: string
                    type: array
                required:
                  - recordIds
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
        '415':
          description: ''
      parameters:
        - name: domain
          description: The domain name
          in: path
          required: true
          schema:
            type: string
            description: The domain name
            example: example.com
  /domains/records/{record_id}:
    get:
      description: ''
      operationId: getDomainsRecordsByRecordId
      security: []
      tags: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  type:
                    type: string
                    enum:
                      - A
                      - AAAA
                      - ALIAS
                      - CAA
                      - CNAME
                      - HTTPS
                      - MX
                      - NS
                      - SRV
                      - TXT
                  id:
                    type: string
                  name:
                    type: string
                  value:
                    type: string
                  creator:
                    type: string
                  domain:
                    type: string
                  ttl:
                    type: number
                  comment:
                    type: string
                  recordType:
                    type: string
                    enum:
                      - A
                      - AAAA
                      - ALIAS
                      - CAA
                      - CNAME
                      - HTTPS
                      - MX
                      - NS
                      - SRV
                      - TXT
                  createdAt:
                    nullable: true
                    type: number
                required:
                  - creator
                  - domain
                  - id
                  - name
                  - recordType
                  - type
                  - value
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: record_id
          description: The unique ID of the DNS record
          in: path
          required: true
          schema:
            type: string
            description: The unique ID of the DNS record
  /v2/domains/{domain}/records/{record_id}:
    delete:
      description: Removes an existing DNS record from a domain name.
      operationId: removeRecord
      security:
        - bearerToken: []
      summary: Delete a DNS record
      tags:
        - dns
      responses:
        '200':
          description: Successful response by removing the specified DNS record.
          content:
            application/json:
              schema:
                type: string
                description: (opaque JSON object)
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
            example: example.com
          x-vercel-cli:
            kind: argument
        - name: record_id
          in: path
          required: true
          schema:
            type: string
            example: rec_V0fra8eEgQwEpFhYG2vTzC3K
          x-vercel-cli:
            kind: argument
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
components:
  schemas:
    Pagination:
      properties:
        count:
          type: number
          description: Amount of items in the current page.
          example: 20
        next:
          nullable: true
          type: number
          description: Timestamp that must be used to request the next page.
          example: 1540095775951
        prev:
          nullable: true
          type: number
          description: Timestamp that must be used to request the previous page.
          example: 1540095775951
      required:
        - count
        - next
        - prev
      type: object
      description: This object contains information related to the pagination of the current request, including the necessary parameters to get the next or previous page of data.
  x-stackQL-resources:
    records:
      id: vercel.dns.records
      name: records
      title: Records
      methods:
        list:
          operation:
            $ref: '#/paths/~1v5~1domains~1{domain}~1records/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.records
          request:
            nativeCasing: camel
          config:
            pagination:
              requestToken:
                key: until
                location: query
              responseToken:
                key: $.pagination.next
                location: body
            queryParamPushdown:
              top:
                paramName: limit
                maxValue: 100
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v2~1domains~1{domain}~1records/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v1~1domains~1records~1{record_id}/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        replace:
          operation:
            $ref: '#/paths/~1domains~1{domain}~1records/put'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1domains~1records~1{record_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        delete:
          operation:
            $ref: '#/paths/~1v2~1domains~1{domain}~1records~1{record_id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/records/methods/list'
          - $ref: '#/components/x-stackQL-resources/records/methods/get'
        insert:
          - $ref: '#/components/x-stackQL-resources/records/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/records/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/records/methods/delete'
        replace:
          - $ref: '#/components/x-stackQL-resources/records/methods/replace'
servers:
  - url: https://api.vercel.com
