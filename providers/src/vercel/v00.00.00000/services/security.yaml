openapi: 3.0.3
info:
  title: security API
  description: vercel security API
  version: 0.0.1
paths:
  /v1/security/attack-mode:
    post:
      description: Update the setting for determining if the project has Attack Challenge mode enabled.
      operationId: updateAttackChallengeMode
      security:
        - bearerToken: []
      summary: Update Attack Challenge mode
      tags:
        - security
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  attackModeEnabled:
                    type: boolean
                    enum:
                      - false
                      - true
                  attackModeUpdatedAt:
                    type: number
                required:
                  - attackModeEnabled
                  - attackModeUpdatedAt
                type: object
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - attackModeEnabled
                - attackModeActiveUntil
              properties:
                projectId:
                  type: string
                attackModeEnabled:
                  type: boolean
                attackModeActiveUntil:
                  type: number
        required: true
