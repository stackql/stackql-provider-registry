                    - PROJECT_VIEWER
                    - PROJECT_DEVELOPER
        required: true
  /v1/access-groups/{access_group_id_or_name}/projects/{project_id}:
    get:
      description: Allows reading an access group project
      operationId: readAccessGroupProject
      security:
        - bearerToken: []
      summary: Reads an access group project
      tags:
        - access-groups
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
