        required: true
  /v1/access-groups/{id_or_name}/projects:
    get:
      description: List projects of an access group
      operationId: listAccessGroupProjects
      security:
        - bearerToken: []
      summary: List projects of an access group
      tags:
        - access-groups
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  projects:
                    items:
                      properties:
                        projectId:
                          type: string
                        role:
                          type: string
                          enum:
                            - ADMIN
                            - PROJECT_DEVELOPER
                            - PROJECT_GUEST
                            - PROJECT_VIEWER
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        project:
                          properties:
                            name:
                              type: string
                            framework:
                              nullable: true
                              type: string
                            latestDeploymentId:
                              type: string
                          type: object
                      required:
                        - createdAt
                        - project
                        - projectId
                        - role
                        - updatedAt
                      type: object
                    type: array
                  pagination:
                    properties:
                      count:
                        type: number
                      next:
                        nullable: true
                        type: string
                    required:
                      - count
