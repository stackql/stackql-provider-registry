                  teamRoles:
                    items:
                      type: string
                    type: array
                    description: Roles that the team has in the access group.
                    example:
                      - DEVELOPER
                      - BILLING
                  teamPermissions:
                    items:
                      type: string
                    type: array
                    description: Permissions that the team has in the access group.
                    example:
                      - CreateProject
