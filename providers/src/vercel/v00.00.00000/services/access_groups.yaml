                          type: array
                        entitlements:
                          items:
                            type: string
                          type: array
                        teamPermissions:
                          items:
                            type: string
                          type: array
                        isDsyncManaged:
                          type: boolean
                          enum:
                            - false
                            - true
                        name:
                          type: string
