                        accessGroupId:
                          type: string
                          description: ID of the access group.
                          example: ag_123a6c5209bc3778245d011443644c8d27dc2c50
                        membersCount:
                          type: number
                          description: Number of members in the access group.
                          example: 5
                        projectsCount:
                          type: number
                          description: Number of projects in the access group.
                          example: 2
                        teamRoles:
                          items:
                            type: string
                          type: array
                          description: Roles that the team has in the access group.
                          example:
                            - DEVELOPER
                            - BILLING
                      required:
                        - accessGroupId
                        - createdAt
                        - isDsyncManaged
                        - membersCount
                        - name
                        - projectsCount
                        - teamId
                        - updatedAt
                      type: object
                    type: array
                  pagination:
                    properties:
                      count:
                        type: number
                      next:
                        nullable: true
                        type: string
                    required:
                      - count
                      - next
                    type: object
                required:
                  - accessGroups
                  - pagination
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - list
      parameters:
        - name: projectId
          description: Filter access groups by project.
          in: query
          schema:
            description: Filter access groups by project.
            example: prj_pavWOn1iLObbx3RowVvzmPrTWyTf
            type: string
        - name: search
          description: Search for access groups by name.
          in: query
          schema:
            description: Search for access groups by name.
            example: example
            type: string
        - name: membersLimit
          description: Number of members to include in the response.
          in: query
          schema:
            description: Number of members to include in the response.
            example: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: projectsLimit
          description: Number of projects to include in the response.
          in: query
          schema:
            description: Number of projects to include in the response.
            example: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: limit
          description: Limit how many access group should be returned.
          in: query
          schema:
            description: Limit how many access group should be returned.
            example: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: next
          description: Continuation cursor to retrieve the next page of results.
