openapi: 3.0.3
info:
  title: access_groups API
  description: vercel access_groups API
  version: 0.0.1
paths:
  /v1/access-groups/{id_or_name}:
    get:
      description: Allows to read an access group
      operationId: readAccessGroup
      security:
        - bearerToken: []
      summary: Reads an access group
      tags:
        - access-groups
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  teamPermissions:
                    items:
                      type: string
                      enum:
                        - AiGatewayApiKeyOwnedBySelf
                        - AiGatewayBudgetManager
                        - AiGatewayCredits
                        - AiGatewaySettings
                        - AiGatewayTranscriptsManager
                        - AiGatewayTranscriptsViewer
                        - ConnectorManager
                        - CreateProject
                        - EnvVariableManager
                        - EnvironmentManager
                        - FullProductionDeployment
                        - IntegrationManager
                        - OrgAdmin
                        - OrgViewer
                        - UsageViewer
                        - V0Builder
                        - V0Chatter
                        - V0Viewer
                        - WorkflowDecryptor
                    type: array
                  entitlements:
                    items:
                      type: string
                      enum:
                        - v0
                    type: array
                  isDsyncManaged:
                    type: boolean
                    enum:
                      - false
                      - true
                  name:
                    type: string
                    description: The name of this access group.
                    example: my-access-group
                  createdAt:
                    type: string
                    description: Timestamp in milliseconds when the access group was created.
                    example: 1588720733602
                  teamId:
                    type: string
                    description: ID of the team that this access group belongs to.
                    example: team_123a6c5209bc3778245d011443644c8d27dc2c50
                  updatedAt:
                    type: string
                    description: Timestamp in milliseconds when the access group was last updated.
                    example: 1588720733602
                  accessGroupId:
                    type: string
                    description: ID of the access group.
                    example: ag_123a6c5209bc3778245d011443644c8d27dc2c50
                  membersCount:
                    type: number
                    description: Number of members in the access group.
                    example: 5
                  projectsCount:
                    type: number
                    description: Number of projects in the access group.
                    example: 2
                  teamRoles:
                    items:
                      type: string
                    type: array
                    description: Roles that the team has in the access group.
                    example:
                      - DEVELOPER
                      - BILLING
                required:
                  - accessGroupId
                  - createdAt
                  - isDsyncManaged
                  - membersCount
                  - name
                  - projectsCount
                  - teamId
                  - updatedAt
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - read
          - get
      parameters:
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
          x-vercel-cli:
            kind: argument
          examples:
            id:
              summary: Access group ID
              value: ag_1a2b3c4d5e6f7g8h9i0j
            name:
              summary: Access group name
              value: My Access Group
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    post:
      description: Allows to update an access group metadata
      operationId: updateAccessGroup
      security:
        - bearerToken: []
      summary: Update an access group
      tags:
        - access-groups
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  entitlements:
                    items:
                      type: string
                      enum:
                        - v0
                    type: array
                  name:
                    type: string
                    description: The name of this access group.
                    example: my-access-group
                  createdAt:
                    type: string
                    description: Timestamp in milliseconds when the access group was created.
                    example: 1588720733602
                  teamId:
                    type: string
                    description: ID of the team that this access group belongs to.
                    example: team_123a6c5209bc3778245d011443644c8d27dc2c50
                  updatedAt:
                    type: string
                    description: Timestamp in milliseconds when the access group was last updated.
                    example: 1588720733602
                  accessGroupId:
                    type: string
                    description: ID of the access group.
                    example: ag_123a6c5209bc3778245d011443644c8d27dc2c50
                  membersCount:
                    type: number
                    description: Number of members in the access group.
                    example: 5
                  projectsCount:
                    type: number
                    description: Number of projects in the access group.
                    example: 2
                  teamRoles:
                    items:
                      type: string
                    type: array
                    description: Roles that the team has in the access group.
                    example:
                      - DEVELOPER
                      - BILLING
                  teamPermissions:
                    items:
                      type: string
                    type: array
                    description: Permissions that the team has in the access group.
                    example:
                      - CreateProject
                required:
                  - accessGroupId
                  - createdAt
                  - entitlements
                  - membersCount
                  - name
                  - projectsCount
                  - teamId
                  - updatedAt
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: The name of the access group
                  maxLength: 50
                  pattern: ^[A-z0-9_ -]+$
                  example: My access group
                projects:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - role
                      - projectId
                    properties:
                      projectId:
                        type: string
                        maxLength: 256
                        example: prj_ndlgr43fadlPyCtREAqxxdyFK
                        description: The ID of the project.
                      role:
                        type: string
                        example: ADMIN
                        description: The project role that will be added to this Access Group. "null" will remove this project level role.
                        nullable: true
                        enum:
                          - ADMIN
                          - PROJECT_VIEWER
                          - PROJECT_DEVELOPER
                          - null
                membersToAdd:
                  description: List of members to add to the access group.
                  type: array
                  items:
                    type: string
                  example:
                    - usr_1a2b3c4d5e6f7g8h9i0j
                    - usr_2b3c4d5e6f7g8h9i0j1k
                membersToRemove:
                  description: List of members to remove from the access group.
                  type: array
                  items:
                    type: string
                  example:
                    - usr_1a2b3c4d5e6f7g8h9i0j
                    - usr_2b3c4d5e6f7g8h9i0j1k
        required: true
    delete:
      description: Allows to delete an access group
      operationId: deleteAccessGroup
      security:
        - bearerToken: []
      summary: Deletes an access group
      tags:
        - access-groups
      responses:
        '200':
          description: ''
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - name: id_or_name
          in: path
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/access-groups/{id_or_name}/members:
    get:
      description: List members of an access group
      operationId: listAccessGroupMembers
      security:
        - bearerToken: []
      summary: List members of an access group
      tags:
        - access-groups
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  members:
                    items:
                      properties:
                        avatar:
                          type: string
                        email:
                          type: string
                        uid:
                          type: string
                        username:
                          type: string
                        name:
                          type: string
                        createdAt:
                          type: string
                        teamRole:
                          type: string
                          enum:
                            - BILLING
                            - CONTRIBUTOR
                            - DEVELOPER
                            - MEMBER
                            - OWNER
                            - SECURITY
                            - VIEWER
                            - VIEWER_FOR_PLUS
                      required:
                        - email
                        - teamRole
                        - uid
                        - username
                      type: object
                    type: array
                  pagination:
                    properties:
                      count:
                        type: number
                      next:
                        nullable: true
                        type: string
                    required:
                      - count
                      - next
                    type: object
                required:
                  - members
                  - pagination
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - name: id_or_name
          description: The ID or name of the Access Group.
          in: path
          required: true
          schema:
            type: string
            description: The ID or name of the Access Group.
            example: ag_pavWOn1iLObbXLRiwVvzmPrTWyTf
        - name: limit
          description: Limit how many access group members should be returned.
          in: query
          required: false
          schema:
            description: Limit how many access group members should be returned.
            example: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: next
          description: Continuation cursor to retrieve the next page of results.
          in: query
          required: false
          schema:
            description: Continuation cursor to retrieve the next page of results.
            type: string
        - name: search
          description: Search project members by their name, username, and email.
          in: query
          required: false
          schema:
            description: Search project members by their name, username, and email.
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/access-groups:
    get:
      description: List access groups
      operationId: listAccessGroups
      security:
        - bearerToken: []
      summary: List access groups for a team, project or member
