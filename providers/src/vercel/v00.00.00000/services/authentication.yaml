openapi: 3.0.3
info:
  title: authentication API
  description: vercel authentication API
  version: 0.0.1
paths:
  /api-keys:
    post:
      description: ''
      operationId: createApiKeys
      security: []
      tags: []
      responses:
        '200':
          description: Successfully created an API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeyString:
                    description: The API key's actual value. This value is only provided in this response, and can never be retrieved again in the future. Be sure to save it somewhere safe!
                    example: uRKJSTt0L4RaSkiMj41QTkxM
                    type: string
                  apiKey:
                    $ref: '#/components/schemas/APIKey'
                required:
                  - apiKeyString
                  - apiKey
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        '403':
          description: You do not have permission to access this resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        '409':
          description: ''
        '410':
          description: ''
        '429':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      name:
                        type: string
                      message:
                        type: string
                      limit:
                        type: number
                    required:
                      - code
                      - name
                      - message
                      - limit
                required:
                  - error
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - purpose
              properties:
                purpose:
                  type: string
                  description: The API key's purpose, which restricts how it can be used.
                projectId:
                  type: string
                  description: An optional project to restrict the API key to.
                  example: prj_12HKQaOmR5t5Uy6vdcQsNIiZgHGB
                name:
                  type: string
                  description: An optional name for the API key.
                  example: API Key for App 123
                expiresAt:
                  type: number
                  description: The API key's expiration, expressed as a UNIX timestamp in milliseconds.
                aiGatewayQuota:
                  type: object
                  description: Optional AI Gateway quota configuration for the API key.
                  properties:
                    limitAmount:
                      type: number
                      minimum: 1
                      description: The quota limit amount.
                    includeByokInQuota:
                      type: boolean
                      default: false
                      description: Whether to include BYOK (Bring Your Own Key) usage in the quota.
                    refreshPeriod:
                      type: string
                      enum:
                        - daily
                        - weekly
                        - monthly
                        - none
                      default: none
                      description: How often the quota refreshes.
                    alertThresholds:
                      type: array
                      items:
                        type: number
                        enum:
                          - 50
                          - 75
                          - 100
                      description: Spend percentages (a subset of [50, 75, 100]) at which to send a spend alert.
                  required:
                    - limitAmount
                metadata:
                  type: object
                  description: Optional generic metadata for the API key. The accepted shape depends on the key's `purpose` and is validated on creation; for `ai-gateway` keys this accepts `environment`.
                  additionalProperties: true
  /v6/user/tokens:
    get:
      description: Retrieve a list of the current User's authentication tokens.
      operationId: listAuthTokens
      security:
        - bearerToken: []
      summary: List Auth Tokens
      tags:
        - authentication
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  tokens:
                    items:
                      $ref: '#/components/schemas/AuthToken'
                    type: array
                  pagination:
                    properties:
                      count:
                        type: number
                      next:
                        nullable: true
                        type: string
                      prev:
                        nullable: true
                        type: string
                    required:
                      - count
                      - next
                      - prev
                    type: object
                required:
                  - pagination
                  - tokens
                type: object
        '400':
          description: ''
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - list
      parameters: []
  /v3/user/tokens:
    post:
      description: Creates and returns a new authentication token for the currently authenticated User. The `bearerToken` property is only provided once, in the response body, so be sure to save it on the client for use with API requests.
      operationId: createAuthToken
      security:
        - bearerToken: []
      summary: Create an Auth Token
      tags:
        - authentication
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                properties:
                  token:
                    $ref: '#/components/schemas/AuthToken'
                  bearerToken:
                    type: string
                    description: The authentication token's actual value. This token is only provided in this response, and can never be retrieved again in the future. Be sure to save it somewhere safe!
                    example: uRKJSTt0L4RaSkiMj41QTkxM
                required:
                  - bearerToken
                  - token
                type: object
                description: Successful response.
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                expiresAt:
                  type: number
                projectId:
                  type: string
                  description: The ID of the project to scope this token to
        required: true
  /v5/user/tokens/{token_id}:
    get:
      description: Retrieve metadata about an authentication token belonging to the currently authenticated User.
      operationId: getAuthToken
      security:
        - bearerToken: []
      summary: Get Auth Token Metadata
      tags:
        - authentication
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                properties:
                  token:
                    $ref: '#/components/schemas/AuthToken'
                required:
                  - token
                type: object
                description: Successful response.
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: Token not found with the requested `tokenId`.
        '410':
          description: ''
      parameters:
        - name: token_id
          description: The identifier of the token to retrieve. The special value "current" may be supplied, which returns the metadata for the token that the current HTTP request is authenticated with.
          in: path
          required: true
          schema:
            type: string
            description: The identifier of the token to retrieve. The special value "current" may be supplied, which returns the metadata for the token that the current HTTP request is authenticated with.
            example: 5d9f2ebd38ddca62e5d51e9c1704c72530bdc8bfdd41e782a6687c48399e8391
  /v3/user/tokens/{token_id}:
    delete:
      description: Invalidate an authentication token, such that it will no longer be valid for future HTTP requests.
      operationId: deleteAuthToken
      security:
        - bearerToken: []
      summary: Delete an authentication token
      tags:
        - authentication
      responses:
        '200':
          description: Authentication token successfully deleted.
          content:
            application/json:
              schema:
                properties:
                  tokenId:
                    type: string
                    description: The unique identifier of the token that was deleted.
                    example: 5d9f2ebd38ddca62e5d51e9c1704c72530bdc8bfdd41e782a6687c48399e8391
                required:
                  - tokenId
                type: object
                description: Authentication token successfully deleted.
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: Token not found with the requested `tokenId`.
        '410':
          description: ''
      parameters:
        - name: token_id
          description: The identifier of the token to invalidate. The special value "current" may be supplied, which invalidates the token that the HTTP request was authenticated with.
          in: path
          required: true
          schema:
            type: string
            description: The identifier of the token to invalidate. The special value "current" may be supplied, which invalidates the token that the HTTP request was authenticated with.
            example: 5d9f2ebd38ddca62e5d51e9c1704c72530bdc8bfdd41e782a6687c48399e8391
components:
  schemas:
    APIKey:
      description: Information about the newly created API key.
      type: object
      properties:
        id:
          description: The unique identifier of the API key.
          example: 5d9f2ebd38ddca62e5d51e9c1704c72530bdc8bfdd41e782a6687c48399e8391
          type: string
        name:
          description: The human-readable name of the API key.
          example: API Key for AI Gateway
          type: string
        partialKey:
          description: The last few characters of the API key string, for helping identify the API key.
          example: t7V
          type: string
        teamId:
          description: The ID of the team that the API key grants access to.
          example: team_123a6c5209bc3778245d011443644c8d27dc2c50
          type: string
        purpose:
          description: The API key's purpose, i.e. what resources it can be used with.
          example: ai-gateway
          type: string
        projectId:
          description: |-
            The ID of the project that this API key grants access to.

            When this is unset, the API key grants access to all projects in the team.
          example: prj_12HKQaOmR5t5Uy6vdcQsNIiZgHGB
          type: string
          nullable: true
        expiresAt:
          description: Timestamp (in milliseconds) of when the API key expires.
          example: 1632816536002
          type: number
          nullable: true
        activeAt:
          description: Timestamp (in milliseconds) of when the API key was most recently used.
          example: 1632816536002
          type: number
        createdAt:
          description: Timestamp (in milliseconds) of when the API key was created.
          example: 1632816536002
          type: number
        createdBy:
          description: The ID of the user who created the API key.
          example: ZspSRT4ljIEEmMHgoDwKWDei
          type: string
        leakedAt:
          description: Timestamp (in milliseconds) of when the API key was marked as leaked.
          example: 1632816536002
          type: number
          nullable: true
        leakedUrl:
          description: URL where the API key was discovered as leaked.
          type: string
          nullable: true
        createdByAppId:
          description: The ID of the app that created the API key, if any
          type: string
          nullable: true
        quota:
          $ref: '#/components/schemas/APIKeyQuota'
        metadata:
          description: |-
            Generic metadata attached to the API key.

            The accepted shape depends on the key's `purpose` and is validated when the key is created. For `ai-gateway` keys this carries `environment` and `spendAttribution`.
          type: object
          patternProperties:
            ^(.*)$: {}
      required:
        - id
        - name
        - partialKey
        - teamId
        - purpose
        - projectId
        - expiresAt
        - activeAt
        - createdAt
        - createdBy
        - leakedAt
        - leakedUrl
        - createdByAppId
    AuthToken:
      properties:
        id:
          type: string
          description: The unique identifier of the token.
          example: 5d9f2ebd38ddca62e5d51e9c1704c72530bdc8bfdd41e782a6687c48399e8391
        name:
          type: string
          description: The human-readable name of the token.
        type:
          type: string
          description: The type of the token.
          example: oauth2-token
        prefix:
          type: string
          description: The token's prefix, for identification purposes.
          example: vcp_
        suffix:
          type: string
          description: The last few characters of the token, for identification purposes.
          example: abc123
        origin:
          type: string
          description: The origin of how the token was created.
          example: github
        scopes:
          items:
            oneOf:
              - properties:
                  type:
                    type: string
                    enum:
                      - user
                  sudo:
                    properties:
                      origin:
                        type: string
                        enum:
                          - email-otp
                          - otp
                          - recovery-code
                          - totp
                          - webauthn
                        description: Possible step-up auth origins
                      verifiedAt:
                        type: number
                      expiresAt:
                        type: number
                    required:
                      - expiresAt
                      - origin
                    type: object
                  origin:
                    type: string
                    enum:
                      - app
                      - apple
                      - bitbucket
                      - chatgpt
                      - email
                      - emu
                      - github
                      - github-webhook
                      - gitlab
                      - google
                      - invite
                      - manual
                      - otp
                      - passkey
                      - saml
                      - sms
                      - token-exchange-oidc
                  createdAt:
                    type: number
                  expiresAt:
                    type: number
                required:
                  - createdAt
                  - type
                type: object
                description: The access scopes granted to the token.
              - properties:
                  type:
                    type: string
                    enum:
                      - team
                  teamId:
                    type: string
                  origin:
                    type: string
                    enum:
                      - app
                      - apple
                      - bitbucket
                      - chatgpt
                      - email
                      - emu
                      - github
                      - github-webhook
                      - gitlab
                      - google
                      - invite
                      - manual
                      - otp
                      - passkey
                      - saml
                      - sms
                      - token-exchange-oidc
                  createdAt:
                    type: number
                  expiresAt:
                    type: number
                required:
                  - createdAt
                  - teamId
                  - type
                type: object
                description: The access scopes granted to the token.
          type: array
          description: The access scopes granted to the token.
        createdAt:
          type: number
          description: Timestamp (in milliseconds) of when the token was created.
          example: 1632816536002
        activeAt:
          type: number
          description: Timestamp (in milliseconds) of when the token was most recently used.
          example: 1632816536002
        expiresAt:
          type: number
          description: Timestamp (in milliseconds) of when the token expires.
          example: 1632816536002
        revokedAt:
          type: number
          description: Timestamp (in milliseconds) of when the token was revoked.
          example: 1632816536002
        leakedAt:
          type: number
          description: Timestamp (in milliseconds) of when the token was marked as leaked.
          example: 1632816536002
        leakedUrl:
          type: string
          description: URL where the token was discovered as leaked.
      required:
        - activeAt
        - createdAt
        - id
        - name
        - type
      type: object
      description: Authentication token metadata.
    Pagination:
      properties:
        count:
          type: number
          description: Amount of items in the current page.
          example: 20
        next:
          nullable: true
          type: number
          description: Timestamp that must be used to request the next page.
          example: 1540095775951
        prev:
          nullable: true
          type: number
          description: Timestamp that must be used to request the previous page.
          example: 1540095775951
      required:
        - count
        - next
        - prev
      type: object
      description: This object contains information related to the pagination of the current request, including the necessary parameters to get the next or previous page of data.
    APIKeyQuota:
      description: AI Gateway quota associated with an API key.
      type: object
      properties:
        quotaEntityId:
          description: The unique identifier for the quota.
          type: string
        limitAmount:
          description: The quota limit amount.
          type: number
        currentSpend:
          description: The current amount spent against the quota.
          type: number
        currentByokSpend:
          description: The current BYOK spend (tracked separately).
          type: number
        includeByokInQuota:
          description: Whether BYOK (Bring Your Own Key) spend counts against the quota.
          type: boolean
        refreshPeriod:
          description: How often the quota refreshes.
          type: string
        active:
          description: Whether the quota is currently active.
          type: boolean
        archived:
          description: Whether the quota has been archived.
          type: boolean
        alertThresholds:
          description: Spend percentages (a subset of [50, 75, 100]) at which to send a spend alert. Empty or undefined disables alerts.
          type: array
          items:
            type: number
        createdAt:
          description: Timestamp (in milliseconds) of when the quota was created.
          type: number
        updatedAt:
          description: Timestamp (in milliseconds) of when the quota was last updated.
          type: number
      required:
        - quotaEntityId
        - limitAmount
        - currentSpend
        - currentByokSpend
        - includeByokInQuota
        - refreshPeriod
        - active
        - archived
        - createdAt
        - updatedAt
  x-stackQL-resources:
    api_keys:
      id: vercel.authentication.api_keys
      name: api_keys
      title: Api Keys
      methods:
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1api-keys/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select: []
        insert:
          - $ref: '#/components/x-stackQL-resources/api_keys/methods/create'
        update: []
        delete: []
        replace: []
    tokens:
      id: vercel.authentication.tokens
      name: tokens
      title: Tokens
      methods:
        list:
          operation:
            $ref: '#/paths/~1v6~1user~1tokens/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.tokens
          request:
            nativeCasing: camel
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v3~1user~1tokens/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
        get:
          operation:
            $ref: '#/paths/~1v5~1user~1tokens~1{token_id}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.token
          request:
            nativeCasing: camel
        delete:
          operation:
            $ref: '#/paths/~1v3~1user~1tokens~1{token_id}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
          request:
            nativeCasing: camel
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/tokens/methods/get'
          - $ref: '#/components/x-stackQL-resources/tokens/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/tokens/methods/create'
        update: []
        delete:
          - $ref: '#/components/x-stackQL-resources/tokens/methods/delete'
        replace: []
servers:
  - url: https://api.vercel.com
