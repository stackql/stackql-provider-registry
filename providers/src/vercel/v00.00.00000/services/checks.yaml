openapi: 3.0.3
info:
  title: checks API
  description: vercel checks API
  version: 0.0.1
paths:
  /v2/projects/{project_id_or_name}/checks:
    get:
      description: List all checks for a project, optionally filtered by target.
      operationId: listProjectChecks
      security:
        - bearerToken: []
      summary: List all checks for a project
      tags:
        - checks-v2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  checks:
                    items:
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        ownerId:
                          type: string
                        projectId:
                          type: string
                        isRerequestable:
                          type: boolean
                          enum:
                            - false
                            - true
                        requires:
                          type: string
                          enum:
                            - build-ready
                            - deployment-url
                            - none
                        source:
                          oneOf:
                            - properties:
                                kind:
                                  type: string
                                  enum:
                                    - integration
                                integrationId:
                                  type: string
                                integrationConfigurationId:
                                  type: string
                                resourceId:
                                  type: string
                                externalResourceId:
                                  type: string
                              required:
                                - integrationConfigurationId
                                - integrationId
                                - kind
                              type: object
                            - properties:
                                kind:
                                  type: string
                                  enum:
                                    - webhook
                                webhookId:
                                  type: string
                              required:
                                - kind
                              type: object
                            - properties:
                                kind:
                                  type: string
                                  enum:
                                    - git-provider
                                provider:
                                  type: string
                                  enum:
                                    - bitbucket
                                    - github
                                    - gitlab
                                externalCheckName:
                                  type: string
                              required:
                                - externalCheckName
                                - kind
                                - provider
                              type: object
                        blocks:
                          type: string
                          enum:
                            - build-start
                            - deployment-alias
                            - deployment-promotion
                            - deployment-start
                            - none
                        targets:
                          items:
                            type: string
                          type: array
                        sourceKind:
                          type: string
                          enum:
                            - git-provider
                            - integration
                            - vercel
                            - webhook
                            - integration
                            - webhook
                            - git-provider
                        sourceIntegrationConfigurationId:
                          type: string
                        timeout:
                          type: number
                        createdAt:
                          type: number
                        updatedAt:
                          type: number
                        deletedAt:
                          type: number
                      required:
                        - blocks
                        - createdAt
                        - id
                        - isRerequestable
                        - name
                        - ownerId
                        - projectId
                        - requires
                        - source
                        - sourceKind
                        - targets
                        - timeout
                        - updatedAt
                      type: object
                    type: array
                required:
                  - checks
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: project_id_or_name
          in: path
          required: true
          schema:
            type: string
        - name: blocks
          in: query
          required: false
          schema:
            type: string
            enum:
              - build-start
              - deployment-start
              - deployment-alias
              - deployment-promotion
              - none
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    post:
      description: Creates a new check for a project.
      operationId: createProjectCheck
      security:
        - bearerToken: []
      summary: Create a check
      tags:
        - checks-v2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  ownerId:
                    type: string
                  projectId:
                    type: string
                  isRerequestable:
                    type: boolean
                    enum:
                      - false
                      - true
                  requires:
                    type: string
                    enum:
                      - build-ready
                      - deployment-url
                      - none
                  source:
                    properties:
                      kind:
                        type: string
                        enum:
                          - integration
                      integrationId:
                        type: string
                      integrationConfigurationId:
                        type: string
                      resourceId:
                        type: string
                      externalResourceId:
                        type: string
                      webhookId:
                        type: string
                      provider:
                        type: string
                        enum:
                          - bitbucket
                          - github
                          - gitlab
                      externalCheckName:
                        type: string
                    required:
                      - integrationConfigurationId
                      - integrationId
                      - kind
                      - externalCheckName
                      - provider
                    type: object
                  blocks:
                    type: string
                    enum:
                      - build-start
                      - deployment-alias
                      - deployment-promotion
                      - deployment-start
                      - none
                  targets:
                    items:
                      type: string
                    type: array
                  sourceKind:
                    type: string
                    enum:
                      - git-provider
                      - integration
                      - vercel
                      - webhook
                      - integration
                      - webhook
                      - git-provider
                  sourceIntegrationConfigurationId:
                    type: string
                  timeout:
                    type: number
                  createdAt:
                    type: number
                  updatedAt:
                    type: number
                  deletedAt:
                    type: number
                required:
                  - blocks
                  - createdAt
                  - id
                  - isRerequestable
                  - name
                  - ownerId
                  - projectId
                  - requires
                  - source
                  - sourceKind
                  - targets
                  - timeout
                  - updatedAt
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: project_id_or_name
          in: path
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                isRerequestable:
                  type: boolean
                requires:
                  type: string
                  enum:
                    - build-ready
                    - deployment-url
                    - none
                  default: deployment-url
                targets:
                  type: array
                  items:
                    type: string
                  uniqueItems: true
                blocks:
                  type: string
                  enum:
                    - build-start
                    - deployment-start
                    - deployment-alias
                    - deployment-promotion
                    - none
                  default: deployment-alias
                source:
                  type: object
                  properties:
                    kind:
                      type: string
                      default: integration
                    externalResourceId:
                      type: string
                    webhookId:
                      type: string
                    externalCheckName:
                      type: string
                    provider:
                      type: string
                      enum:
                        - github
                  required:
                    - kind
                    - externalCheckName
                    - provider
                timeout:
                  type: number
                  default: 300
              required:
                - name
                - requires
              type: object
  /v2/projects/{project_id_or_name}/checks/{check_id}:
    get:
      description: Return a detailed response for a single check.
      operationId: getProjectCheck
      security:
        - bearerToken: []
      summary: Get a check
      tags:
        - checks-v2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  ownerId:
                    type: string
                  projectId:
                    type: string
                  isRerequestable:
                    type: boolean
                    enum:
                      - false
                      - true
                  requires:
                    type: string
                    enum:
                      - build-ready
                      - deployment-url
                      - none
                  source:
                    properties:
                      kind:
                        type: string
                        enum:
                          - integration
                      integrationId:
                        type: string
                      integrationConfigurationId:
                        type: string
                      resourceId:
                        type: string
                      externalResourceId:
                        type: string
                      webhookId:
                        type: string
                      provider:
                        type: string
                        enum:
                          - bitbucket
                          - github
                          - gitlab
                      externalCheckName:
                        type: string
                    required:
                      - integrationConfigurationId
                      - integrationId
                      - kind
                      - externalCheckName
                      - provider
                    type: object
                  blocks:
                    type: string
                    enum:
                      - build-start
                      - deployment-alias
                      - deployment-promotion
                      - deployment-start
                      - none
                  targets:
                    items:
                      type: string
                    type: array
                  sourceKind:
                    type: string
                    enum:
                      - git-provider
                      - integration
                      - vercel
                      - webhook
                      - integration
                      - webhook
                      - git-provider
                  sourceIntegrationConfigurationId:
                    type: string
                  timeout:
                    type: number
                  createdAt:
                    type: number
                  updatedAt:
                    type: number
                  deletedAt:
                    type: number
                required:
                  - blocks
                  - createdAt
                  - id
                  - isRerequestable
                  - name
                  - ownerId
                  - projectId
                  - requires
                  - source
                  - sourceKind
                  - targets
                  - timeout
                  - updatedAt
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: project_id_or_name
          in: path
          required: true
          schema:
            type: string
        - name: check_id
          description: The ID of the resource that will be updated.
          in: path
          required: true
          schema:
            type: string
            description: The ID of the resource that will be updated.
            example: stf_89ha9sdhh9a9
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    patch:
      description: Update an existing check.
      operationId: updateProjectCheck
      security:
        - bearerToken: []
      summary: Update a check
      tags:
        - checks-v2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  ownerId:
                    type: string
                  projectId:
                    type: string
                  isRerequestable:
                    type: boolean
                    enum:
                      - false
                      - true
                  requires:
                    type: string
                    enum:
                      - build-ready
                      - deployment-url
                      - none
                  source:
                    properties:
                      kind:
                        type: string
                        enum:
                          - integration
                      integrationId:
                        type: string
                      integrationConfigurationId:
                        type: string
                      resourceId:
                        type: string
                      externalResourceId:
                        type: string
                      webhookId:
                        type: string
                      provider:
                        type: string
                        enum:
                          - bitbucket
                          - github
                          - gitlab
                      externalCheckName:
                        type: string
                    required:
                      - integrationConfigurationId
                      - integrationId
                      - kind
                      - externalCheckName
                      - provider
                    type: object
                  blocks:
                    type: string
                    enum:
                      - build-start
                      - deployment-alias
                      - deployment-promotion
                      - deployment-start
                      - none
                  targets:
                    items:
                      type: string
                    type: array
                  sourceKind:
                    type: string
                    enum:
                      - git-provider
                      - integration
                      - vercel
                      - webhook
                      - integration
                      - webhook
                      - git-provider
                  sourceIntegrationConfigurationId:
                    type: string
                  timeout:
                    type: number
                  createdAt:
                    type: number
                  updatedAt:
                    type: number
                  deletedAt:
                    type: number
                required:
                  - blocks
                  - createdAt
                  - id
                  - isRerequestable
                  - name
                  - ownerId
                  - projectId
                  - requires
                  - source
                  - sourceKind
                  - targets
                  - timeout
                  - updatedAt
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: project_id_or_name
          in: path
          required: true
          schema:
            type: string
        - name: check_id
          in: path
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                isRerequestable:
                  type: boolean
                requires:
                  type: string
                  enum:
                    - build-ready
                    - deployment-url
                  default: deployment-url
                targets:
                  type: array
                  items:
                    type: string
                blocks:
                  type: string
                  enum:
                    - build-start
                    - deployment-start
                    - deployment-alias
                    - deployment-promotion
                    - none
                  default: deployment-alias
                timeout:
                  type: number
                  default: 300
              type: object
    delete:
      description: Delete an existing check and all of its runs.
      operationId: deleteProjectCheck
      security:
        - bearerToken: []
      summary: Delete a check
      tags:
        - checks-v2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: project_id_or_name
          in: path
          required: true
          schema:
            type: string
        - name: check_id
          in: path
          required: true
