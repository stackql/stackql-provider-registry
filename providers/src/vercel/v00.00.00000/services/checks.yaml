            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v2/projects/{project_id_or_name}/checks/{check_id}/runs:
    get:
      description: List all runs associated with a given check.
      operationId: listCheckRuns
      security:
        - bearerToken: []
      summary: List runs for a check
      tags:
        - checks-v2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  runs:
                    items:
                      oneOf:
                        - properties:
                            id:
                              type: string
                            name:
                              type: string
                            ownerId:
                              type: string
                            deploymentId:
                              type: string
                            projectId:
                              type: string
                            requires:
                              type: string
                              enum:
                                - build-ready
                                - deployment-url
                                - none
                            blocks:
                              type: string
                              enum:
                                - build-start
                                - deployment-alias
                                - deployment-promotion
                                - deployment-start
                                - none
                            targets:
                              items:
                                type: string
                              type: array
                            status:
                              type: string
                              enum:
                                - completed
                                - queued
                                - running
                            conclusion:
                              type: string
                              enum:
                                - canceled
                                - failed
                                - neutral
                                - skipped
                                - succeeded
                                - timeout
                            conclusionText:
                              type: string
                            externalId:
                              type: string
                            externalUrl:
                              type: string
                            output:
                              additionalProperties: true
                              type: object
                            timeout:
                              type: number
                            createdAt:
                              type: number
                            updatedAt:
                              type: number
                            completedAt:
                              type: number
                            checkId:
                              type: string
                            source:
                              oneOf:
                                - properties:
                                    kind:
                                      type: string
                                      enum:
                                        - integration
                                    integrationId:
                                      type: string
                                    integrationConfigurationId:
                                      type: string
                                    resourceId:
                                      type: string
                                    externalResourceId:
                                      type: string
                                  required:
                                    - integrationConfigurationId
                                    - integrationId
                                    - kind
                                  type: object
                                - properties:
                                    kind:
                                      type: string
                                      enum:
                                        - webhook
                                    webhookId:
                                      type: string
                                  required:
                                    - kind
                                  type: object
                                - properties:
                                    kind:
                                      type: string
                                      enum:
                                        - git-provider
                                    provider:
                                      type: string
                                      enum:
                                        - bitbucket
                                        - github
                                        - gitlab
                                    externalCheckName:
                                      type: string
                                  required:
                                    - externalCheckName
                                    - kind
                                    - provider
                                  type: object
                                - properties:
                                    subKind:
                                      type: string
                                      enum:
                                        - vercel-native-check
                                    origin:
                                      type: string
                                      enum:
                                        - api
                                        - platform
                                  type: object
                                  description: Native Vercel checks — check definition and check run `source`.
                          required:
                            - checkId
                            - createdAt
                            - deploymentId
                            - id
                            - name
                            - ownerId
                            - source
                            - status
                            - timeout
                            - updatedAt
                          type: object
                          description: Check run backed by a project-level `check` definition.
                        - properties:
                            id:
                              type: string
                            name:
                              type: string
                            ownerId:
                              type: string
                            deploymentId:
                              type: string
                            projectId:
                              type: string
                            requires:
                              type: string
                              enum:
                                - build-ready
                                - deployment-url
                                - none
                            blocks:
                              type: string
                              enum:
                                - build-start
                                - deployment-alias
                                - deployment-promotion
                                - deployment-start
                                - none
                            targets:
                              items:
                                type: string
                              type: array
                            status:
                              type: string
                              enum:
                                - completed
                                - queued
                                - running
                            conclusion:
                              type: string
                              enum:
                                - canceled
                                - failed
                                - neutral
                                - skipped
                                - succeeded
                                - timeout
                            conclusionText:
                              type: string
                            externalId:
                              type: string
                            externalUrl:
                              type: string
                            output:
                              additionalProperties: true
                              type: object
                            timeout:
                              type: number
                            createdAt:
                              type: number
                            updatedAt:
                              type: number
                            completedAt:
                              type: number
                            source:
                              oneOf:
                                - properties:
                                    subKind:
                                      type: string
                                      enum:
                                        - vercel-ci
                                    origin:
                                      type: string
                                      enum:
                                        - config
                                    invocationId:
                                      type: string
                                    invocationAttempt:
                                      type: number
                                    jobDefinitionId:
                                      type: string
                                  required:
                                    - invocationId
                                    - jobDefinitionId
                                    - origin
                                    - subKind
                                  type: object
                                  description: Config-driven CI task — check run `source` only (no parent check).
                                - properties:
                                    subKind:
                                      type: string
                                      enum:
                                        - vercel-ci-sentinel
                                    origin:
                                      type: string
                                      enum:
                                        - platform
                                  required:
                                    - origin
                                    - subKind
                                  type: object
                                  description: CI sentinel — check run `source` only (no parent check).
                          required:
                            - createdAt
                            - deploymentId
                            - id
                            - name
                            - ownerId
                            - source
                            - status
                            - timeout
                            - updatedAt
                          type: object
                          description: Vercel CI check run without a parent `check` (no `checkId` field).
                    type: array
                required:
                  - runs
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: project_id_or_name
          in: path
          required: true
          schema:
            type: string
        - name: check_id
          description: The ID of the resource that will be updated.
          in: path
          required: true
          schema:
            type: string
            description: The ID of the resource that will be updated.
            example: ckr_89ha9sdhh9a9
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v2/deployments/{deployment_id}/check-runs:
    get:
      description: List all check runs for a deployment.
      operationId: listDeploymentCheckRuns
      security:
        - bearerToken: []
      summary: List check runs for a deployment
      tags:
        - checks-v2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  runs:
                    items:
                      oneOf:
                        - properties:
                            id:
                              type: string
                            name:
                              type: string
                            ownerId:
                              type: string
                            deploymentId:
                              type: string
                            projectId:
                              type: string
                            requires:
                              type: string
                              enum:
                                - build-ready
                                - deployment-url
                                - none
                            blocks:
                              type: string
                              enum:
                                - build-start
                                - deployment-alias
                                - deployment-promotion
                                - deployment-start
                                - none
                            targets:
                              items:
                                type: string
                              type: array
                            status:
                              type: string
                              enum:
                                - completed
                                - queued
                                - running
                            conclusion:
                              type: string
                              enum:
                                - canceled
                                - failed
                                - neutral
                                - skipped
                                - succeeded
                                - timeout
                            conclusionText:
                              type: string
                            externalId:
                              type: string
                            externalUrl:
                              type: string
                            output:
                              additionalProperties: true
                              type: object
                            timeout:
                              type: number
                            createdAt:
                              type: number
                            updatedAt:
                              type: number
                            completedAt:
                              type: number
                            checkId:
                              type: string
                            source:
                              oneOf:
                                - properties:
                                    kind:
                                      type: string
                                      enum:
                                        - integration
                                    integrationId:
                                      type: string
                                    integrationConfigurationId:
                                      type: string
                                    resourceId:
                                      type: string
                                    externalResourceId:
                                      type: string
                                  required:
                                    - integrationConfigurationId
                                    - integrationId
                                    - kind
                                  type: object
                                - properties:
                                    kind:
