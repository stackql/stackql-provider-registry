openapi: 3.0.3
info:
  title: environments API
  description: vercel environments API
  version: 0.0.1
paths:
  /v1/env:
    post:
      description: Creates shared environment variable(s) for a team.
      operationId: createSharedEnvVariable
      security:
        - bearerToken: []
      summary: Create one or more shared environment variables
      tags:
        - environment
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  created:
                    items:
                      properties:
                        created:
                          type: string
                          format: date-time
                          description: The date when the Shared Env Var was created.
                          example: '2021-02-10T13:11:49.180Z'
                        key:
                          type: string
                          description: The name of the Shared Env Var.
                          example: my-api-key
                        ownerId:
                          nullable: true
                          type: string
                          description: The unique identifier of the owner (team) the Shared Env Var was created for.
                          example: team_LLHUOMOoDlqOp8wPE4kFo9pE
                        id:
                          type: string
                          description: The unique identifier of the Shared Env Var.
                          example: env_XCG7t7AIHuO2SBA8667zNUiM
                        createdBy:
                          nullable: true
                          type: string
                          description: The unique identifier of the user who created the Shared Env Var.
                          example: 2qDDuGFTWXBLDNnqZfWPDp1A
                        deletedBy:
                          nullable: true
                          type: string
                          description: The unique identifier of the user who deleted the Shared Env Var.
                          example: 2qDDuGFTWXBLDNnqZfWPDp1A
                        updatedBy:
                          nullable: true
                          type: string
                          description: The unique identifier of the user who last updated the Shared Env Var.
                          example: 2qDDuGFTWXBLDNnqZfWPDp1A
                        createdAt:
                          type: number
                          description: Timestamp for when the Shared Env Var was created.
                          example: 1609492210000
                        deletedAt:
                          type: number
                          description: Timestamp for when the Shared Env Var was (soft) deleted.
                          example: 1609492210000
                        updatedAt:
                          type: number
                          description: Timestamp for when the Shared Env Var was last updated.
                          example: 1609492210000
                        value:
                          type: string
                          description: The value of the Shared Env Var.
                        projectId:
                          items:
                            type: string
                          type: array
                          description: The unique identifiers of the projects which the Shared Env Var is linked to.
                          example:
                            - prj_2WjyKQmM8ZnGcJsPWMrHRHrE
                            - prj_2WjyKQmM8ZnGcJsPWMrasEFg
                        type:
                          type: string
                          enum:
                            - encrypted
                            - plain
                            - sensitive
                            - system
                          description: The type of this cosmos doc instance, if blank, assume secret.
                          example: encrypted
                        target:
                          items:
                            type: string
                            enum:
                              - development
                              - preview
                              - production
                            example: production
                            description: environments this env variable targets
                          type: array
                          description: environments this env variable targets
                          example: production
                        applyToAllCustomEnvironments:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: whether or not this env varible applies to custom environments
                        customEnvironmentIds:
                          items:
                            type: string
                          type: array
                          description: The custom environment IDs that this Shared Env Var is scoped to.
                        decrypted:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: whether or not this env variable is decrypted
                        comment:
                          type: string
                          description: A user provided comment that describes what this Shared Env Var is for.
                        lastEditedByDisplayName:
                          type: string
                          description: The last editor full name or username.
                      type: object
                    type: array
                  failed:
                    items:
                      properties:
                        error:
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                            key:
                              type: string
                            envVarId:
                              type: string
                            envVarKey:
                              type: string
                            action:
                              type: string
                            link:
                              type: string
                            value:
                              oneOf:
                                - type: string
                                - items:
                                    type: string
                                    enum:
                                      - development
                                      - development
                                      - preview
                                      - preview
                                      - production
                                  type: array
                            gitBranch:
                              type: string
                            target:
                              oneOf:
                                - items:
                                    type: string
                                    enum:
                                      - development
                                      - development
                                      - preview
                                      - preview
                                      - production
                                  type: array
                                - type: string
                                  enum:
                                    - development
                                    - development
                                    - preview
                                    - preview
                                    - production
                            project:
                              type: string
                          required:
                            - code
                            - message
                          type: object
                      required:
                        - error
                      type: object
                    type: array
                required:
                  - created
                  - failed
                type: object
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - evs
                - target
                - applyToAllCustomEnvironments
                - customEnvironmentIds
              properties:
                evs:
                  type: array
                  maximum: 50
                  minimum: 1
                  items:
                    type: object
                    required:
                      - key
                      - value
                    properties:
                      key:
                        description: The name of the Shared Environment Variable
                        type: string
                        example: API_URL
                      value:
                        description: The value of the Shared Environment Variable
                        type: string
                        example: https://api.vercel.com
                      comment:
                        type: string
                        description: A comment to add context on what this Shared Environment Variable is for
                        example: database connection string for production
                        maxLength: 500
                type:
                  description: The type of environment variable
                  type: string
                  enum:
                    - encrypted
                    - sensitive
                  example: encrypted
                target:
                  description: The target environment of the Shared Environment Variable
                  type: array
                  items:
                    enum:
                      - production
                      - preview
                      - development
                  example:
                    - production
                    - preview
                projectId:
                  description: Associate a Shared Environment Variable to projects.
                  type: array
                  items:
                    type: string
                  example:
                    - prj_2WjyKQmM8ZnGcJsPWMrHRHrE
                    - prj_2WjyKQmM8ZnGcJsPWMrHRCRV
                  deprecated: true
    get:
      description: Lists all Shared Environment Variables for a team, taking into account optional filters.
      operationId: listSharedEnvVariable
      security:
        - bearerToken: []
      summary: Lists all Shared Environment Variables for a team
      tags:
        - environment
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      properties:
                        securityIssues:
                          items:
                            type: string
                            enum:
                              - flags-secret-needs-split
                              - readable-secret
                          type: array
                        created:
                          type: string
                          format: date-time
                          description: The date when the Shared Env Var was created.
                          example: '2021-02-10T13:11:49.180Z'
                        key:
                          type: string
                          description: The name of the Shared Env Var.
                          example: my-api-key
                        ownerId:
                          nullable: true
                          type: string
                          description: The unique identifier of the owner (team) the Shared Env Var was created for.
                          example: team_LLHUOMOoDlqOp8wPE4kFo9pE
                        id:
                          type: string
                          description: The unique identifier of the Shared Env Var.
                          example: env_XCG7t7AIHuO2SBA8667zNUiM
                        createdBy:
                          nullable: true
                          type: string
                          description: The unique identifier of the user who created the Shared Env Var.
                          example: 2qDDuGFTWXBLDNnqZfWPDp1A
                        deletedBy:
                          nullable: true
                          type: string
                          description: The unique identifier of the user who deleted the Shared Env Var.
                          example: 2qDDuGFTWXBLDNnqZfWPDp1A
                        updatedBy:
                          nullable: true
                          type: string
                          description: The unique identifier of the user who last updated the Shared Env Var.
                          example: 2qDDuGFTWXBLDNnqZfWPDp1A
                        createdAt:
                          type: number
                          description: Timestamp for when the Shared Env Var was created.
                          example: 1609492210000
                        deletedAt:
                          type: number
                          description: Timestamp for when the Shared Env Var was (soft) deleted.
                          example: 1609492210000
                        updatedAt:
                          type: number
                          description: Timestamp for when the Shared Env Var was last updated.
                          example: 1609492210000
                        value:
                          type: string
                          description: The value of the Shared Env Var.
                        projectId:
                          items:
                            type: string
                          type: array
                          description: The unique identifiers of the projects which the Shared Env Var is linked to.
                          example:
                            - prj_2WjyKQmM8ZnGcJsPWMrHRHrE
                            - prj_2WjyKQmM8ZnGcJsPWMrasEFg
                        type:
                          type: string
                          enum:
                            - encrypted
                            - plain
                            - sensitive
                            - system
                          description: The type of this cosmos doc instance, if blank, assume secret.
                          example: encrypted
                        target:
                          items:
                            type: string
                            enum:
                              - development
                              - preview
                              - production
                            example: production
                            description: environments this env variable targets
                          type: array
                          description: environments this env variable targets
                          example: production
                        applyToAllCustomEnvironments:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: whether or not this env varible applies to custom environments
                        customEnvironmentIds:
                          items:
                            type: string
                          type: array
                          description: The custom environment IDs that this Shared Env Var is scoped to.
                        decrypted:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: whether or not this env variable is decrypted
                        comment:
                          type: string
                          description: A user provided comment that describes what this Shared Env Var is for.
                        lastEditedByDisplayName:
                          type: string
                          description: The last editor full name or username.
                      required:
                        - created
                        - decrypted
                        - id
                        - key
                        - securityIssues
                      type: object
                    type: array
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - data
                  - pagination
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - ls
          - list
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: projectId
          description: Filter SharedEnvVariables that belong to a project
          in: query
          schema:
            description: Filter SharedEnvVariables that belong to a project
            type: string
            example: prj_2WjyKQmM8ZnGcJsPWMrHRHrE
        - name: ids
          description: Filter SharedEnvVariables based on comma separated ids
          in: query
          schema:
            description: Filter SharedEnvVariables based on comma separated ids
            type: string
            example: env_2WjyKQmM8ZnGcJsPWMrHRHrE,env_2WjyKQmM8ZnGcJsPWMrHRCRV
        - name: exclude_ids
          description: Filter SharedEnvVariables based on comma separated ids
          in: query
          schema:
            description: Filter SharedEnvVariables based on comma separated ids
            type: string
            example: env_2WjyKQmM8ZnGcJsPWMrHRHrE,env_2WjyKQmM8ZnGcJsPWMrHRCRV
        - name: exclude-ids
          description: Filter SharedEnvVariables based on comma separated ids
          in: query
          schema:
            description: Filter SharedEnvVariables based on comma separated ids
            type: string
            example: env_2WjyKQmM8ZnGcJsPWMrHRHrE,env_2WjyKQmM8ZnGcJsPWMrHRCRV
        - name: exclude_projectId
          description: Filter SharedEnvVariables that belong to a project
          in: query
          schema:
            description: Filter SharedEnvVariables that belong to a project
            type: string
            example: prj_2WjyKQmM8ZnGcJsPWMrHRHrE
        - name: exclude-projectId
          description: Filter SharedEnvVariables that belong to a project
          in: query
          schema:
            description: Filter SharedEnvVariables that belong to a project
            type: string
            example: prj_2WjyKQmM8ZnGcJsPWMrHRHrE
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    patch:
      description: Updates a given Shared Environment Variable for a Team.
      operationId: updateSharedEnvVariable
      security:
        - bearerToken: []
      summary: Updates one or more shared environment variables
      tags:
        - environment
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  updated:
                    items:
                      properties:
                        created:
                          type: string
                          format: date-time
                          description: The date when the Shared Env Var was created.
                          example: '2021-02-10T13:11:49.180Z'
                        key:
                          type: string
                          description: The name of the Shared Env Var.
                          example: my-api-key
                        ownerId:
                          nullable: true
                          type: string
                          description: The unique identifier of the owner (team) the Shared Env Var was created for.
                          example: team_LLHUOMOoDlqOp8wPE4kFo9pE
                        id:
                          type: string
                          description: The unique identifier of the Shared Env Var.
                          example: env_XCG7t7AIHuO2SBA8667zNUiM
                        createdBy:
                          nullable: true
                          type: string
                          description: The unique identifier of the user who created the Shared Env Var.
                          example: 2qDDuGFTWXBLDNnqZfWPDp1A
                        deletedBy:
                          nullable: true
                          type: string
                          description: The unique identifier of the user who deleted the Shared Env Var.
                          example: 2qDDuGFTWXBLDNnqZfWPDp1A
                        updatedBy:
                          nullable: true
                          type: string
                          description: The unique identifier of the user who last updated the Shared Env Var.
                          example: 2qDDuGFTWXBLDNnqZfWPDp1A
                        createdAt:
                          type: number
                          description: Timestamp for when the Shared Env Var was created.
                          example: 1609492210000
                        deletedAt:
                          type: number
                          description: Timestamp for when the Shared Env Var was (soft) deleted.
                          example: 1609492210000
                        updatedAt:
                          type: number
                          description: Timestamp for when the Shared Env Var was last updated.
                          example: 1609492210000
                        value:
                          type: string
                          description: The value of the Shared Env Var.
                        projectId:
                          items:
                            type: string
                          type: array
                          description: The unique identifiers of the projects which the Shared Env Var is linked to.
                          example:
                            - prj_2WjyKQmM8ZnGcJsPWMrHRHrE
                            - prj_2WjyKQmM8ZnGcJsPWMrasEFg
                        type:
                          type: string
                          enum:
                            - encrypted
                            - plain
                            - sensitive
                            - system
                          description: The type of this cosmos doc instance, if blank, assume secret.
                          example: encrypted
                        target:
                          items:
                            type: string
                            enum:
                              - development
                              - preview
                              - production
                            example: production
                            description: environments this env variable targets
                          type: array
                          description: environments this env variable targets
                          example: production
                        applyToAllCustomEnvironments:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: whether or not this env varible applies to custom environments
                        customEnvironmentIds:
                          items:
                            type: string
                          type: array
                          description: The custom environment IDs that this Shared Env Var is scoped to.
                        decrypted:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: whether or not this env variable is decrypted
                        comment:
                          type: string
                          description: A user provided comment that describes what this Shared Env Var is for.
                        lastEditedByDisplayName:
                          type: string
                          description: The last editor full name or username.
                      type: object
                    type: array
                  failed:
                    items:
                      properties:
                        error:
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                            key:
                              type: string
                            envVarId:
                              type: string
                            envVarKey:
                              type: string
                            action:
                              type: string
                            link:
                              type: string
                            value:
                              oneOf:
                                - type: string
                                - items:
                                    type: string
                                    enum:
                                      - development
                                      - development
                                      - preview
                                      - preview
                                      - production
                                  type: array
                            gitBranch:
                              type: string
                            target:
                              oneOf:
                                - items:
                                    type: string
                                    enum:
                                      - development
                                      - development
                                      - preview
                                      - preview
                                      - production
                                  type: array
                                - type: string
                                  enum:
                                    - development
                                    - development
                                    - preview
                                    - preview
                                    - production
                            project:
                              type: string
                          required:
                            - code
                            - message
                          type: object
                      required:
                        - error
                      type: object
                    type: array
                required:
                  - failed
                  - updated
                type: object
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              required:
                - updates
              properties:
                updates:
                  description: An object where each key is an environment variable ID (not the key name) and the value is the update to apply
                  type: object
                  example:
                    env_2WjyKQmM8ZnGcJsPWMrHRHrE:
                      key: API_URL
                      value: https://api.vercel.com
                      target:
                        - production
                        - preview
                      projectIdUpdates:
                        link:
                          - prj_2WjyKQmM8ZnGcJsPWMrHRHrE
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    properties:
                      key:
                        description: The name of the Shared Environment Variable
                        type: string
                        example: API_URL
                      value:
                        description: The value of the Shared Environment Variable
                        type: string
                        example: https://api.vercel.com
                      target:
                        description: The target environment of the Shared Environment Variable
                        type: array
                        items:
                          enum:
                            - production
                            - preview
                            - development
                        example:
                          - production
                          - preview
                      projectId:
                        description: Associate a Shared Environment Variable to projects.
                        type: array
                        items:
                          type: string
                        example:
                          - prj_2WjyKQmM8ZnGcJsPWMrHRHrE
                          - prj_2WjyKQmM8ZnGcJsPWMrHRCRV
                      projectIdUpdates:
                        description: Incrementally update project linking without specifying the full list
                        type: object
                        additionalProperties: false
                        properties:
                          link:
                            description: Project IDs to add to this environment variable
                            type: array
                            items:
                              type: string
                            example:
                              - prj_2WjyKQmM8ZnGcJsPWMrHRHrE
                          unlink:
                            description: Project IDs to remove from this environment variable
                            type: array
                            items:
                              type: string
                            example:
                              - prj_2WjyKQmM8ZnGcJsPWMrHRCRV
                      type:
                        description: The new type of the Shared Environment Variable
                        type: string
                        enum:
                          - encrypted
                          - sensitive
                        example: encrypted
                      comment:
                        type: string
                        description: A comment to add context on what this Shared Environment Variable is for
                        example: database connection string for production
                        maxLength: 500
    delete:
      description: Deletes one or many Shared Environment Variables for a given team.
      operationId: deleteSharedEnvVariable
      security:
        - bearerToken: []
      summary: Delete one or more Env Var
      tags:
        - environment
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  deleted:
                    items:
                      type: string
                    type: array
                  failed:
                    items:
                      properties:
                        error:
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                            key:
                              type: string
                            envVarId:
                              type: string
                            envVarKey:
                              type: string
                            action:
                              type: string
                            link:
                              type: string
                            value:
                              oneOf:
                                - type: string
                                - items:
                                    type: string
                                    enum:
                                      - development
                                      - development
                                      - preview
                                      - preview
                                      - production
                                  type: array
                            gitBranch:
                              type: string
                            target:
                              oneOf:
                                - items:
                                    type: string
                                    enum:
                                      - development
                                      - development
                                      - preview
                                      - preview
                                      - production
                                  type: array
                                - type: string
                                  enum:
                                    - development
                                    - development
                                    - preview
                                    - preview
                                    - production
                            project:
                              type: string
                          required:
                            - code
                            - message
                          type: object
                      required:
                        - error
                      type: object
                    type: array
                required:
                  - deleted
                  - failed
                type: object
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  description: IDs of the Shared Environment Variables to delete
                  minimum: 1
                  maximum: 50
                  type: array
                  items:
                    type: string
                  example:
                    - env_abc123
                    - env_abc124
  /v1/env/{id}:
    get:
      description: Retrieve the decrypted value of a Shared Environment Variable by id.
      operationId: getSharedEnvVar
      security:
        - bearerToken: []
      summary: Retrieve the decrypted value of a Shared Environment Variable by id.
      tags:
        - environment
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  created:
                    type: string
                    format: date-time
                    description: The date when the Shared Env Var was created.
                    example: '2021-02-10T13:11:49.180Z'
                  key:
                    type: string
                    description: The name of the Shared Env Var.
                    example: my-api-key
                  ownerId:
                    nullable: true
                    type: string
                    description: The unique identifier of the owner (team) the Shared Env Var was created for.
                    example: team_LLHUOMOoDlqOp8wPE4kFo9pE
                  id:
