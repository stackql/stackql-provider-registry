openapi: 3.0.3
info:
  title: aliases API
  description: vercel aliases API
  version: 0.0.1
paths:
  /v2/deployments/{id}/aliases:
    get:
      description: Retrieves all Aliases for the Deployment with the given ID. The authenticated user or team must own the deployment.
      operationId: listDeploymentAliases
      security:
        - bearerToken: []
      summary: List Deployment Aliases
      tags:
        - aliases
      responses:
        '200':
          description: The list of aliases assigned to the deployment
          content:
            application/json:
              schema:
                properties:
                  aliases:
                    items:
                      properties:
                        uid:
                          type: string
                          description: The unique identifier of the alias
                          example: 2WjyKQmM8ZnGcJsPWMrHRHrE
                        alias:
                          type: string
                          description: The alias name, it could be a `.vercel.app` subdomain or a custom domain
                          example: my-alias.vercel.app
                        created:
                          type: string
                          format: date-time
                          description: The date when the alias was created
                          example: '2017-04-26T23:00:34.232Z'
                        redirect:
                          nullable: true
                          type: string
                          description: Target destination domain for redirect when the alias is a redirect
                        protectionBypass:
                          additionalProperties:
                            oneOf:
                              - properties:
                                  createdAt:
                                    type: number
                                  createdBy:
                                    type: string
                                  scope:
                                    type: string
                                    enum:
                                      - shareable-link
                                  expires:
                                    type: number
                                required:
                                  - createdAt
                                  - createdBy
                                  - scope
                                type: object
                                description: The protection bypass for the alias
                              - properties:
                                  createdAt:
                                    type: number
                                  lastUpdatedAt:
                                    type: number
                                  lastUpdatedBy:
                                    type: string
                                  access:
                                    type: string
                                    enum:
                                      - granted
                                      - requested
                                  scope:
                                    type: string
                                    enum:
                                      - user
                                required:
                                  - access
                                  - createdAt
                                  - lastUpdatedAt
                                  - lastUpdatedBy
                                  - scope
                                type: object
                                description: The protection bypass for the alias
                              - properties:
                                  createdAt:
                                    type: number
                                  createdBy:
                                    type: string
                                  scope:
                                    type: string
                                    enum:
                                      - alias-protection-override
                                required:
                                  - createdAt
                                  - createdBy
                                  - scope
                                type: object
                                description: The protection bypass for the alias
                              - properties:
                                  createdAt:
                                    type: number
                                  lastUpdatedAt:
                                    type: number
                                  lastUpdatedBy:
                                    type: string
                                  scope:
                                    type: string
                                    enum:
                                      - email_invite
                                required:
                                  - createdAt
                                  - lastUpdatedAt
                                  - lastUpdatedBy
                                  - scope
                                type: object
                                description: The protection bypass for the alias
                          type: object
                          description: The protection bypass for the alias
                      required:
                        - alias
                        - created
                        - uid
                      type: object
                      description: A list of the aliases assigned to the deployment
                    type: array
                    description: A list of the aliases assigned to the deployment
                required:
                  - aliases
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: The deployment was not found
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - for-deployment
      parameters:
        - name: id
          description: The ID of the deployment the aliases should be listed for
          in: path
          required: true
          schema:
            example: dpl_FjvFJncQHQcZMznrUm9EoB8sFuPa
            description: The ID of the deployment the aliases should be listed for
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    post:
      description: Creates a new alias for the deployment resolved from the given deployment or alias ID or URL. The authenticated user or team must own this deployment. If the desired alias is already assigned to another deployment, then it will be removed from the old deployment and assigned to the new one.
      operationId: assignAlias
      security:
        - bearerToken: []
      summary: Assign an Alias
      tags:
        - aliases
      responses:
        '200':
          description: The alias was successfully assigned to the deployment
          content:
            application/json:
              schema:
                properties:
                  uid:
                    type: string
                    description: The unique identifier of the alias
                    example: 2WjyKQmM8ZnGcJsPWMrHRHrE
                  alias:
                    type: string
                    description: The assigned alias name
                    example: my-alias.vercel.app
                  created:
                    type: string
                    format: date-time
                    description: The date when the alias was created
                    example: '2017-04-26T23:00:34.232Z'
                  oldDeploymentId:
                    nullable: true
                    type: string
                    description: The unique identifier of the previously aliased deployment, only received when the alias was used before
                    example: dpl_FjvFJncQHQcZMznrUm9EoB8sFuPa
                required:
                  - alias
                  - created
                  - uid
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
            The cert for the provided alias is not ready
            The deployment is not READY and can not be aliased
            The supplied alias is invalid
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: |-
            You do not have permission to access this resource.
            If no .vercel.app alias exists then we fail (nothing to mirror)
        '404':
          description: |-
            The domain used for the alias was not found
            The deployment was not found
        '409':
          description: |-
            The provided alias is already assigned to the given deployment
            The domain is not allowed to be used
        '410':
          description: ''
      parameters:
        - name: id
          description: The deployment or alias ID or URL to assign from
          in: path
          required: true
          schema:
            description: The deployment or alias ID or URL to assign from
            example: dpl_FjvFJncQHQcZMznrUm9EoB8sFuPa
            oneOf:
              - type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              properties:
                alias:
                  description: The alias we want to assign to the deployment defined in the URL
                  example: my-alias.vercel.app
                  type: string
                redirect:
                  description: The redirect property will take precedence over the deployment id from the URL and consists of a hostname (like test.com) to which the alias should redirect using status code 307
                  example: null
                  type: string
                  nullable: true
              type: object
        required: true
  /v4/aliases:
    get:
      description: Retrieves a list of aliases for the authenticated User or Team. When `domain` is provided, only aliases for that domain will be returned. When `projectId` is provided, it will only return the given project aliases.
      operationId: listAliases
      security:
        - bearerToken: []
      summary: List aliases
      tags:
        - aliases
      responses:
        '200':
          description: The paginated list of aliases
          content:
            application/json:
              schema:
                properties:
                  aliases:
                    items:
                      properties:
                        alias:
                          type: string
                          description: The alias name, it could be a `.vercel.app` subdomain or a custom domain
                          example: my-alias.vercel.app
                        created:
                          type: string
                          format: date-time
                          description: The date when the alias was created
                          example: '2017-04-26T23:00:34.232Z'
                        createdAt:
                          type: number
                          description: The date when the alias was created in milliseconds since the UNIX epoch
                          example: 1540095775941
                        creator:
                          properties:
                            uid:
                              type: string
                              description: ID of the user who created the alias
                              example: 96SnxkFiMyVKsK3pnoHfx3Hz
                            email:
                              type: string
                              description: Email of the user who created the alias
                              example: john-doe@gmail.com
                            username:
                              type: string
                              description: Username of the user who created the alias
                              example: john-doe
                          required:
                            - uid
                          type: object
                          description: Information of the user who created the alias
                        deletedAt:
                          type: number
                          description: The date when the alias was deleted in milliseconds since the UNIX epoch
                          example: 1540095775941
                          nullable: true
                        deployment:
                          properties:
                            id:
                              type: string
                              description: The deployment unique identifier
                              example: dpl_5m8CQaRBm3FnWRW1od3wKTpaECPx
                            url:
                              type: string
                              description: The deployment unique URL
                              example: my-instant-deployment-3ij3cxz9qr.now.sh
                            meta:
                              type: string
                              description: The deployment metadata
                              example: {}
                          required:
                            - id
                          type: object
                          description: A map with the deployment ID, URL and metadata
                        deploymentId:
                          nullable: true
                          type: string
                          description: The deployment ID
                          example: dpl_5m8CQaRBm3FnWRW1od3wKTpaECPx
                        projectId:
                          nullable: true
                          type: string
                          description: The unique identifier of the project
                          example: prj_12HKQaOmR5t5Uy6vdcQsNIiZgHGB
                        redirect:
                          nullable: true
                          type: string
                          description: Target destination domain for redirect when the alias is a redirect
                        redirectStatusCode:
                          nullable: true
                          type: number
                          enum:
                            - 301
                            - 302
                            - 307
                            - 308
                            - null
                          description: Status code to be used on redirect
                        uid:
                          type: string
                          description: The unique identifier of the alias
                        updatedAt:
                          type: number
                          description: The date when the alias was updated in milliseconds since the UNIX epoch
                          example: 1540095775941
                        protectionBypass:
                          additionalProperties:
                            oneOf:
                              - properties:
                                  createdAt:
                                    type: number
                                  createdBy:
                                    type: string
                                  scope:
                                    type: string
                                    enum:
                                      - shareable-link
                                  expires:
                                    type: number
                                required:
                                  - createdAt
                                  - createdBy
                                  - scope
                                type: object
                                description: The protection bypass for the alias
                              - properties:
                                  createdAt:
                                    type: number
                                  lastUpdatedAt:
                                    type: number
                                  lastUpdatedBy:
                                    type: string
                                  access:
                                    type: string
                                    enum:
                                      - granted
                                      - requested
                                  scope:
                                    type: string
                                    enum:
                                      - user
                                required:
                                  - access
                                  - createdAt
                                  - lastUpdatedAt
                                  - lastUpdatedBy
                                  - scope
                                type: object
                                description: The protection bypass for the alias
                              - properties:
                                  createdAt:
                                    type: number
                                  createdBy:
                                    type: string
                                  scope:
                                    type: string
                                    enum:
                                      - alias-protection-override
                                required:
                                  - createdAt
                                  - createdBy
                                  - scope
                                type: object
                                description: The protection bypass for the alias
                              - properties:
                                  createdAt:
                                    type: number
                                  lastUpdatedAt:
                                    type: number
                                  lastUpdatedBy:
                                    type: string
                                  scope:
                                    type: string
                                    enum:
                                      - email_invite
                                required:
                                  - createdAt
                                  - lastUpdatedAt
                                  - lastUpdatedBy
                                  - scope
                                type: object
                                description: The protection bypass for the alias
                          type: object
                          description: The protection bypass for the alias
                        microfrontends:
                          properties:
                            defaultApp:
                              properties:
                                projectId:
                                  type: string
                              required:
                                - projectId
                              type: object
                            applications:
                              oneOf:
                                - items:
                                    properties:
                                      fallbackHost:
                                        type: string
                                        description: This is always set. In production it is used as a pointer to each apps production deployment. For pre-production, it's used as the fallback if there is no deployment for the branch.
                                      projectId:
                                        type: string
                                        description: The project ID of the microfrontends application.
                                    required:
                                      - fallbackHost
                                      - projectId
                                    type: object
                                    description: A list of the deployment routing information for each project.
                                  type: array
                                  description: A list of the deployment routing information for each project.
                                - items:
                                    properties:
                                      fallbackHost:
                                        type: string
                                        description: This is always set. For branch aliases, it's used as the fallback if there is no deployment for the branch.
                                      branchAlias:
                                        type: string
                                        description: Could point to a branch without a deployment if the project was never deployed. The proxy will fallback to the fallbackHost if there is no deployment.
                                      projectId:
                                        type: string
                                        description: The project ID of the microfrontends application.
                                    required:
                                      - branchAlias
                                      - fallbackHost
                                      - projectId
                                    type: object
                                    description: A list of the deployment routing information for each project.
                                  type: array
                                  description: A list of the deployment routing information for each project.
                                - items:
                                    properties:
                                      deploymentId:
                                        type: string
                                        description: This is the deployment for the same commit, it could be a cancelled deployment. The proxy will fallback to the branchDeploymentId and then the fallbackDeploymentId.
                                      branchDeploymentId:
                                        type: string
                                        description: This is the latest non-cancelled deployment of the branch alias at the time the commit alias was created. It is possible there is no deployment for the branch, or this was set before the deployment was canceled, in which case this will point to a cancelled deployment, in either case the proxy will fallback to the fallbackDeploymentId.
                                      fallbackDeploymentId:
                                        type: string
                                        description: This is the deployment of the fallback host at the time the commit alias was created. It is possible for this to be a deleted deployment, in which case the proxy will show that the deployment is deleted. It will not use the fallbackHost, as a future deployment on the fallback host could be invalid for this deployment, and it could lead to confusion / incorrect behavior for the commit alias.
                                      fallbackHost:
                                        type: string
                                        description: Temporary for backwards compatibility. Can remove when metadata change is released
                                      branchAlias:
                                        type: string
                                      projectId:
                                        type: string
                                        description: The project ID of the microfrontends application.
                                    required:
                                      - projectId
                                    type: object
                                    description: A list of the deployment routing information for each project.
                                  type: array
                                  description: A list of the deployment routing information for each project.
                          required:
                            - applications
                            - defaultApp
                          type: object
                          description: The microfrontends for the alias including the routing configuration
                      required:
                        - alias
                        - created
                        - deploymentId
                        - projectId
                        - uid
                      type: object
                    type: array
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - aliases
                  - pagination
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - list
      parameters:
        - name: domain
          description: Get only aliases of the given domain name
          in: query
          schema:
            description: Get only aliases of the given domain name
            example: my-test-domain.com
            maxItems: 20
            oneOf:
              - type: array
                items:
                  type: string
              - type: string
        - name: from
          description: Get only aliases created after the provided timestamp
          in: query
          schema:
            deprecated: true
            description: Get only aliases created after the provided timestamp
            example: 1540095775951
            type: number
        - name: limit
          description: Maximum number of aliases to list from a request
          in: query
          schema:
            description: Maximum number of aliases to list from a request
            example: 10
            type: number
        - name: projectId
          description: Filter aliases from the given `projectId`
          in: query
          schema:
            description: Filter aliases from the given `projectId`
            example: prj_12HKQaOmR5t5Uy6vdcQsNIiZgHGB
            type: string
        - name: since
          description: Get aliases created after this JavaScript timestamp
          in: query
          schema:
            description: Get aliases created after this JavaScript timestamp
            example: 1540095775941
            type: number
        - name: until
          description: Get aliases created before this JavaScript timestamp
          in: query
          schema:
            description: Get aliases created before this JavaScript timestamp
            example: 1540095775951
            type: number
        - name: rollbackDeploymentId
          description: Get aliases that would be rolled back for the given deployment
          in: query
          schema:
            description: Get aliases that would be rolled back for the given deployment
            example: dpl_XXX
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v4/aliases/{id_or_alias}:
    get:
      description: Retrieves an Alias for the given host name or alias ID.
      operationId: getAlias
      security:
        - bearerToken: []
      summary: Get an Alias
      tags:
        - aliases
      responses:
        '200':
          description: The alias information
          content:
            application/json:
              schema:
                properties:
                  alias:
                    type: string
                    description: The alias name, it could be a `.vercel.app` subdomain or a custom domain
                    example: my-alias.vercel.app
                  created:
                    type: string
                    format: date-time
                    description: The date when the alias was created
                    example: '2017-04-26T23:00:34.232Z'
                  createdAt:
                    type: number
                    description: The date when the alias was created in milliseconds since the UNIX epoch
                    example: 1540095775941
                    nullable: true
                  creator:
                    properties:
                      uid:
                        type: string
                        description: ID of the user who created the alias
                        example: 96SnxkFiMyVKsK3pnoHfx3Hz
                      email:
                        type: string
                        description: Email of the user who created the alias
                        example: john-doe@gmail.com
                      username:
                        type: string
                        description: Username of the user who created the alias
                        example: john-doe
                    required:
                      - uid
                    type: object
                    description: Information of the user who created the alias
                  deletedAt:
                    type: number
                    description: The date when the alias was deleted in milliseconds since the UNIX epoch
                    example: 1540095775941
                    nullable: true
                  deployment:
                    properties:
                      id:
                        type: string
                        description: The deployment unique identifier
                        example: dpl_5m8CQaRBm3FnWRW1od3wKTpaECPx
                      url:
                        type: string
                        description: The deployment unique URL
                        example: my-instant-deployment-3ij3cxz9qr.now.sh
                      meta:
                        type: string
                        description: The deployment metadata
                        example: {}
                    required:
                      - id
                    type: object
                    description: A map with the deployment ID, URL and metadata
                  deploymentId:
                    nullable: true
                    type: string
                    description: The deployment ID
                    example: dpl_5m8CQaRBm3FnWRW1od3wKTpaECPx
                  projectId:
                    nullable: true
                    type: string
                    description: The unique identifier of the project
                    example: prj_12HKQaOmR5t5Uy6vdcQsNIiZgHGB
                  redirect:
                    nullable: true
                    type: string
                    description: Target destination domain for redirect when the alias is a redirect
                  redirectStatusCode:
                    nullable: true
                    type: number
                    enum:
                      - 301
                      - 302
                      - 307
                      - 308
                      - null
                    description: Status code to be used on redirect
                  uid:
                    type: string
                    description: The unique identifier of the alias
                  updatedAt:
                    type: number
                    description: The date when the alias was updated in milliseconds since the UNIX epoch
                    example: 1540095775941
                    nullable: true
                  protectionBypass:
                    additionalProperties:
                      oneOf:
                        - properties:
                            createdAt:
                              type: number
                            createdBy:
                              type: string
                            scope:
                              type: string
                              enum:
                                - shareable-link
                            expires:
                              type: number
                          required:
                            - createdAt
                            - createdBy
                            - scope
                          type: object
                          description: The protection bypass for the alias
                        - properties:
                            createdAt:
                              type: number
                            lastUpdatedAt:
                              type: number
                            lastUpdatedBy:
                              type: string
                            access:
                              type: string
                              enum:
                                - granted
                                - requested
                            scope:
                              type: string
                              enum:
                                - user
                          required:
                            - access
                            - createdAt
                            - lastUpdatedAt
                            - lastUpdatedBy
                            - scope
                          type: object
                          description: The protection bypass for the alias
                        - properties:
                            createdAt:
                              type: number
                            createdBy:
                              type: string
                            scope:
                              type: string
                              enum:
                                - alias-protection-override
                          required:
                            - createdAt
                            - createdBy
                            - scope
                          type: object
                          description: The protection bypass for the alias
                        - properties:
                            createdAt:
                              type: number
                            lastUpdatedAt:
                              type: number
                            lastUpdatedBy:
                              type: string
                            scope:
                              type: string
                              enum:
                                - email_invite
                          required:
                            - createdAt
                            - lastUpdatedAt
                            - lastUpdatedBy
                            - scope
                          type: object
                          description: The protection bypass for the alias
                    type: object
                    description: The protection bypass for the alias
                  microfrontends:
                    properties:
                      defaultApp:
                        properties:
                          projectId:
                            type: string
                        required:
                          - projectId
                        type: object
                      applications:
                        oneOf:
                          - items:
                              properties:
                                fallbackHost:
                                  type: string
                                  description: This is always set. In production it is used as a pointer to each apps production deployment. For pre-production, it's used as the fallback if there is no deployment for the branch.
                                projectId:
                                  type: string
                                  description: The project ID of the microfrontends application.
                              required:
                                - fallbackHost
                                - projectId
                              type: object
                              description: A list of the deployment routing information for each project.
                            type: array
                            description: A list of the deployment routing information for each project.
                          - items:
                              properties:
                                fallbackHost:
                                  type: string
                                  description: This is always set. For branch aliases, it's used as the fallback if there is no deployment for the branch.
                                branchAlias:
                                  type: string
                                  description: Could point to a branch without a deployment if the project was never deployed. The proxy will fallback to the fallbackHost if there is no deployment.
                                projectId:
                                  type: string
                                  description: The project ID of the microfrontends application.
                              required:
                                - branchAlias
                                - fallbackHost
                                - projectId
                              type: object
                              description: A list of the deployment routing information for each project.
                            type: array
                            description: A list of the deployment routing information for each project.
                          - items:
                              properties:
                                deploymentId:
                                  type: string
                                  description: This is the deployment for the same commit, it could be a cancelled deployment. The proxy will fallback to the branchDeploymentId and then the fallbackDeploymentId.
                                branchDeploymentId:
                                  type: string
                                  description: This is the latest non-cancelled deployment of the branch alias at the time the commit alias was created. It is possible there is no deployment for the branch, or this was set before the deployment was canceled, in which case this will point to a cancelled deployment, in either case the proxy will fallback to the fallbackDeploymentId.
                                fallbackDeploymentId:
                                  type: string
                                  description: This is the deployment of the fallback host at the time the commit alias was created. It is possible for this to be a deleted deployment, in which case the proxy will show that the deployment is deleted. It will not use the fallbackHost, as a future deployment on the fallback host could be invalid for this deployment, and it could lead to confusion / incorrect behavior for the commit alias.
                                fallbackHost:
                                  type: string
                                  description: Temporary for backwards compatibility. Can remove when metadata change is released
                                branchAlias:
                                  type: string
                                projectId:
                                  type: string
                                  description: The project ID of the microfrontends application.
                              required:
                                - projectId
                              type: object
                              description: A list of the deployment routing information for each project.
                            type: array
                            description: A list of the deployment routing information for each project.
                    required:
                      - applications
                      - defaultApp
                    type: object
                    description: The microfrontends for the alias including the routing configuration
                required:
                  - alias
                  - created
                  - deploymentId
