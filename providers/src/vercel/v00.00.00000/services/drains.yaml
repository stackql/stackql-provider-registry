                      - filter
                      - version
                    type: object
                  integrationIcon:
                    type: string
                  integrationConfigurationUri:
                    type: string
                  integrationWebsite:
                    type: string
                  projectAccess:
                    oneOf:
                      - properties:
                          access:
                            type: string
                            enum:
                              - all
                          managedBy:
                            type: string
                            enum:
                              - drain
                              - integration
                        required:
                          - access
                          - managedBy
                        type: object
                      - properties:
