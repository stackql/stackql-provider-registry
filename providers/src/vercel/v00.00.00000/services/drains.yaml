                  - delivery
                  - id
                  - name
                  - ownerId
                  - schemas
                  - source
                  - updatedAt
                type: object
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - projects
                - schemas
              properties:
                name:
                  type: string
                projects:
                  type: string
                  enum:
                    - some
                    - all
                projectIds:
                  type: array
                  items:
                    type: string
                filter:
                  type: object
                  additionalProperties: false
                  required:
                    - version
                    - filter
                  properties:
                    version:
                      type: string
                    filter:
                      oneOf:
                        - type: object
                          additionalProperties: false
                          required:
                            - type
                          properties:
                            type:
                              type: string
                            project:
                              type: object
                              additionalProperties: false
                              properties:
                                ids:
                                  type: array
                                  items:
                                    type: string
                            log:
                              type: object
                              additionalProperties: false
                              properties:
                                sources:
                                  type: array
                                  items:
                                    type: string
                                    enum:
                                      - build
                                      - edge
                                      - lambda
                                      - static
                                      - external
                                      - firewall
                                      - redirect
                            deployment:
                              type: object
                              additionalProperties: false
                              properties:
                                environments:
                                  type: array
                                  items:
                                    type: string
                                    enum:
                                      - production
                                      - preview
                        - type: object
                          additionalProperties: false
                          required:
                            - type
                            - text
                          properties:
                            type:
                              type: string
                            text:
                              type: string
                schemas:
                  type: object
                  additionalProperties:
                    type: object
                    required:
                      - version
                    properties:
                      version:
                        type: string
                delivery:
                  type: object
                  additionalProperties: false
                  required:
                    - type
                    - endpoint
                    - encoding
                    - headers
                    - compression
                    - fileStructure
                    - roleArn
                    - region
                  properties:
                    type:
                      type: string
                    endpoint:
                      type: string
                    compression:
                      type: string
                      enum:
                        - gzip
                        - none
                    encoding:
                      type: string
                      enum:
                        - json
                        - ndjson
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                    secret:
                      type: string
                    fileStructure:
                      type: string
                      enum:
                        - hive
                    roleArn:
                      type: string
                    region:
                      type: string
                    serverSideEncryption:
                      type: string
                      enum:
                        - AES256
                        - aws:kms
                        - aws:kms:dsse
                      default: AES256
                    objectAcl:
                      type: string
                      enum:
                        - private
                        - bucket-owner-read
                        - bucket-owner-full-control
                sampling:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - type
                      - rate
                    properties:
                      type:
                        type: string
                      rate:
                        type: number
                        minimum: 0
                        maximum: 1
                        description: Sampling rate from 0 to 1 (e.g., 0.1 for 10%)
                      env:
                        type: string
                        enum:
                          - production
                          - preview
                        description: Environment to apply sampling to
                      requestPath:
                        type: string
                        description: Request path prefix to apply the sampling rule to
                transforms:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: string
                source:
                  type: object
                  oneOf:
                    - properties:
                        kind:
                          type: string
                          default: integration
                        externalResourceId:
                          type: string
                      additionalProperties: false
                      required:
                        - externalResourceId
                      type: object
                    - properties:
                        kind:
                          type: string
                          default: integration
                        resourceId:
                          type: string
                      additionalProperties: false
                      required:
                        - resourceId
                      type: object
                    - properties:
                        kind:
                          type: string
                          default: integration
                      additionalProperties: false
                      required:
                        - kind
                      type: object
                  properties:
                    kind:
                      type: string
                      default: self-served
                  additionalProperties: false
                  required:
                    - kind
