openapi: 3.0.3
info:
  title: drains API
  description: vercel drains API
  version: 0.0.1
paths:
  /v1/drains:
    post:
      description: Create a new Drain with the provided configuration.
      operationId: createDrain
      security:
        - bearerToken: []
      summary: Create a new Drain
      tags:
        - drains
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  createdAt:
                    type: number
                  updatedAt:
                    type: number
                  projectIds:
                    items:
                      type: string
                    type: array
                  name:
                    type: string
                  teamId:
                    nullable: true
                    type: string
                  ownerId:
                    type: string
                  status:
                    type: string
                    enum:
                      - disabled
                      - enabled
                      - errored
                  firstErrorTimestamp:
                    type: number
                  disabledAt:
                    type: number
                  disabledBy:
                    type: string
                  disabledReason:
                    type: string
                    enum:
                      - account-plan-downgrade
                      - disabled-by-admin
                      - disabled-by-owner
                      - feature-not-available
                      - limits-exceeded
                  schemas:
                    properties:
                      log:
                        type: string
                        description: (opaque JSON object)
                      trace:
                        type: string
                        description: (opaque JSON object)
                      analytics:
                        type: string
                        description: (opaque JSON object)
                      speed_insights:
                        type: string
                        description: (opaque JSON object)
                      ai_gateway:
                        type: string
                        description: (opaque JSON object)
                      audit_log:
                        type: string
                        description: (opaque JSON object)
                      connect:
                        type: string
                        description: (opaque JSON object)
                    type: object
                  delivery:
                    oneOf:
                      - properties:
                          type:
                            type: string
                            enum:
                              - http
                          endpoint:
                            type: string
                          encoding:
                            type: string
                            enum:
                              - json
                              - ndjson
                          compression:
                            type: string
                            enum:
                              - gzip
                              - none
                          headers:
                            additionalProperties:
                              type: string
                            type: object
                          secret:
                            oneOf:
                              - type: string
                              - properties:
                                  kind:
                                    type: string
                                    enum:
                                      - INTEGRATION_SECRET
                                required:
                                  - kind
                                type: object
                        required:
                          - encoding
                          - endpoint
                          - headers
                          - type
                        type: object
                      - properties:
                          type:
                            type: string
                            enum:
                              - otlphttp
                          endpoint:
                            properties:
                              traces:
                                type: string
                            required:
                              - traces
                            type: object
                          encoding:
                            type: string
                            enum:
                              - json
                              - proto
                          headers:
                            additionalProperties:
                              type: string
                            type: object
                          secret:
                            oneOf:
                              - type: string
                              - properties:
                                  kind:
                                    type: string
                                    enum:
                                      - INTEGRATION_SECRET
                                required:
                                  - kind
                                type: object
                        required:
                          - encoding
                          - endpoint
                          - headers
                          - type
                        type: object
                      - properties:
                          type:
                            type: string
                            enum:
                              - clickhouse
                          endpoint:
                            type: string
                          table:
                            type: string
                        required:
                          - endpoint
                          - table
                          - type
                        type: object
                      - properties:
                          type:
                            type: string
                            enum:
                              - s3
                          endpoint:
                            type: string
                          encoding:
                            type: string
                            enum:
                              - json
                              - ndjson
                          compression:
                            type: string
                            enum:
                              - none
                          fileStructure:
                            type: string
                            enum:
                              - hive
                          roleArn:
                            type: string
                          region:
                            type: string
                          serverSideEncryption:
                            type: string
                            enum:
                              - AES256
                              - aws:kms
                              - aws:kms:dsse
                          objectAcl:
                            type: string
                            enum:
                              - authenticated-read
                              - aws-exec-read
                              - bucket-owner-full-control
                              - bucket-owner-read
                              - private
                              - public-read
                              - public-read-write
                        required:
                          - compression
                          - encoding
                          - endpoint
                          - fileStructure
                          - region
                          - roleArn
                          - type
                        type: object
                      - properties:
                          type:
                            type: string
                            enum:
                              - internal
                          target:
                            type: string
                            enum:
                              - vercel-otel-traces-db
                        required:
                          - target
                          - type
                        type: object
                  sampling:
                    items:
                      properties:
                        type:
                          type: string
                          enum:
                            - head_sampling
                        rate:
                          type: number
                        env:
                          type: string
                          enum:
                            - preview
                            - production
                        requestPath:
                          type: string
                      required:
                        - rate
                        - type
                      type: object
                    type: array
                  source:
                    oneOf:
                      - properties:
                          kind:
                            type: string
                            enum:
                              - self-served
                        required:
                          - kind
                        type: object
                      - properties:
                          kind:
                            type: string
                            enum:
                              - integration
                          resourceId:
                            type: string
                          externalResourceId:
                            type: string
                          integrationId:
                            type: string
                          integrationConfigurationId:
                            type: string
                        required:
                          - integrationConfigurationId
                          - integrationId
                          - kind
                        type: object
                  filterV2:
                    properties:
                      version:
                        type: string
                        enum:
                          - v2
                      filter:
                        oneOf:
                          - properties:
                              type:
                                type: string
                                enum:
                                  - basic
                              project:
                                properties:
                                  ids:
                                    items:
                                      type: string
                                    type: array
                                type: object
                              log:
                                properties:
                                  sources:
                                    items:
                                      type: string
                                      enum:
                                        - build
                                        - edge
                                        - external
                                        - firewall
                                        - lambda
                                        - redirect
                                        - static
                                    type: array
                                  legacy_excludeCachedStaticAssetLogs:
                                    type: boolean
                                    enum:
                                      - false
                                      - true
                                type: object
                              deployment:
                                properties:
                                  environments:
                                    items:
                                      type: string
                                      enum:
                                        - preview
                                        - production
                                    type: array
                                type: object
                            required:
                              - type
                            type: object
                          - properties:
                              type:
                                type: string
                                enum:
                                  - odata
                              text:
                                type: string
                            required:
                              - text
                              - type
                            type: object
