                          - method
                          - timestamp
                        type: object
                    required:
                      - date
                      - deploymentId
                      - id
                      - serial
                    type: object
                  date:
                    type: number
                  deploymentId:
                    type: string
                  id:
                    type: string
                  info:
                    properties:
                      type:
                        type: string
                      name:
                        type: string
                      entrypoint:
                        type: string
                      path:
                        type: string
                      step:
                        type: string
                      readyState:
                        type: string
                      serviceName:
                        type: string
                    required:
                      - name
                      - type
                    type: object
                  serial:
                    type: string
                  text:
                    type: string
                  level:
                    type: string
                    enum:
                      - error
                      - warning
                required:
                  - created
                  - payload
                  - type
                  - date
                  - deploymentId
                  - id
                  - info
                  - serial
                type: object
                oneOf:
                  - properties:
                      type:
                        type: string
                        enum:
                          - command
                          - delimiter
                          - deployment-state
                          - edge-function-invocation
                          - exit
                          - fatal
                          - metric
                          - middleware
                          - middleware-invocation
                          - report
                          - stderr
