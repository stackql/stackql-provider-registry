                            type: string
                          path:
                            type: string
                          step:
                            type: string
                          readyState:
                            type: string
                          serviceName:
                            type: string
                        required:
                          - name
                          - type
                        type: object
                      text:
                        type: string
                      id:
                        type: string
                      date:
                        type: number
                      serial:
                        type: string
                      created:
                        type: number
                      statusCode:
                        type: number
                      requestId:
                        type: string
                      proxy:
                        properties:
                          timestamp:
                            type: number
                          method:
                            type: string
                          host:
                            type: string
                          path:
                            type: string
                          statusCode:
                            type: number
                          userAgent:
                            items:
                              type: string
                            type: array
                          referer:
                            type: string
                          clientIp:
                            type: string
                          region:
                            type: string
                          scheme:
                            type: string
                          responseByteSize:
                            type: number
                          cacheId:
                            type: string
                          pathType:
                            type: string
                          pathTypeVariant:
                            type: string
                          vercelId:
                            type: string
                          vercelCache:
                            type: string
                            enum:
                              - BYPASS
                              - HIT
                              - MISS
                              - PRERENDER
                              - REVALIDATED
                              - STALE
                          lambdaRegion:
                            type: string
                          wafAction:
                            type: string
                            enum:
                              - bypass
                              - challenge
                              - deny
                              - log
                              - rate_limit
                          wafRuleId:
                            type: string
                        required:
