                      created:
                        type: number
                      date:
                        type: number
                      deploymentId:
                        type: string
                      id:
                        type: string
                      info:
                        properties:
                          type:
                            type: string
                          name:
                            type: string
                          entrypoint:
                            type: string
                          path:
                            type: string
                          step:
                            type: string
                          readyState:
                            type: string
                          serviceName:
                            type: string
                        required:
                          - name
                          - type
                        type: object
                      serial:
                        type: string
                      text:
                        type: string
                      type:
                        type: string
                        enum:
                          - command
                          - delimiter
                          - deployment-state
                          - edge-function-invocation
                          - exit
                          - fatal
                          - metric
                          - middleware
                          - middleware-invocation
                          - report
                          - stderr
                          - stdout
                      level:
                        type: string
                        enum:
                          - error
                          - warning
                    required:
                      - created
                      - date
                      - deploymentId
                      - id
                      - info
                      - serial
                      - type
                    type: object
                  - properties:
                      type:
                        type: string
                        enum:
                          - alias-assigned
                      deploymentId:
                        type: string
                      date:
                        type: number
                      alias:
                        items:
                          type: string
                        type: array
                      aliasError:
                        nullable: true
                        properties:
                          code:
                            type: string
                          message:
                            type: string
                        required:
                          - code
                          - message
                        type: object
                      aliasWarning:
                        nullable: true
                        properties:
                          code:
                            type: string
                          message:
                            type: string
                          link:
                            type: string
                          action:
                            type: string
                        required:
                          - code
                          - message
                        type: object
                    required:
                      - alias
                      - aliasError
                      - aliasWarning
                      - date
                      - deploymentId
                      - type
                    type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: id_or_url
          description: The unique identifier or hostname of the deployment.
          in: path
          required: true
          schema:
            type: string
            example: dpl_5WJWYSyB7BpgTj3EuwF37WMRBXBtPQ2iTMJHJBJyRfd
            description: The unique identifier or hostname of the deployment.
        - name: direction
          description: Order of the returned events based on the timestamp.
          in: query
          required: false
          schema:
            type: string
            enum:
              - backward
              - forward
            default: forward
            example: backward
            description: Order of the returned events based on the timestamp.
        - name: follow
          description: When enabled, this endpoint will return live events as they happen.
          in: query
          required: false
          schema:
            type: number
            enum:
              - 0
              - 1
            example: 1
            description: When enabled, this endpoint will return live events as they happen.
        - name: limit
          description: Maximum number of events to return. Provide `-1` to return all available logs.
          in: query
          required: false
          schema:
            type: number
            example: 100
            description: Maximum number of events to return. Provide `-1` to return all available logs.
        - name: name
          description: Deployment build ID.
          in: query
          required: false
          schema:
            type: string
            example: bld_cotnkcr76
            description: Deployment build ID.
        - name: since
          description: Timestamp for when build logs should be pulled from.
          in: query
          required: false
          schema:
            type: number
            example: 1540095775941
            description: Timestamp for when build logs should be pulled from.
        - name: until
          description: Timestamp for when the build logs should be pulled up until.
          in: query
          required: false
          schema:
            type: number
            example: 1540106318643
            description: Timestamp for when the build logs should be pulled up until.
        - name: statusCode
          description: HTTP status code range to filter events by.
          in: query
          required: false
          schema:
            example: 5xx
            description: HTTP status code range to filter events by.
            oneOf:
              - type: number
              - type: string
        - name: delimiter
          in: query
          required: false
          schema:
            type: number
            enum:
              - 0
              - 1
            example: 1
        - name: builds
          in: query
          required: false
          schema:
            type: number
            enum:
              - 0
              - 1
            example: 1
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/deployments/{deployment_id}/integrations/{integration_configuration_id}/resources/{resource_id}/actions/{action}:
    patch:
      description: Updates the deployment integration action for the specified integration installation
      operationId: update-integration-deployment-action
      security:
        - bearerToken: []
      summary: Update deployment integration action
      tags:
        - deployments
        - integrations
      responses:
        '202':
          description: ''
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - running
                    - succeeded
                    - failed
                statusText:
                  type: string
                statusUrl:
                  type: string
                  format: uri
                  pattern: '^https?://|^sso:'
                outcomes:
                  type: array
                  items:
                    oneOf:
                      - type: object
                        properties:
                          kind:
                            type: string
                          secrets:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                value:
                                  type: string
                              required:
                                - name
                                - value
                              additionalProperties: false
                        required:
                          - kind
                          - secrets
                        additionalProperties: false
              additionalProperties: false
  /v13/deployments/{id_or_url}:
    get:
      description: Retrieves information for a deployment either by supplying its ID (`id` property) or Hostname (`url` property). Additional details will be included when the authenticated user or team is an owner of the deployment.
      operationId: getDeployment
      security:
        - bearerToken: []
      summary: Get a deployment by ID or URL
      tags:
        - deployments
      responses:
        '200':
          description: |-
            Returns a reduced view of the deployment with public information only. Private fields are omitted when the requester is not the deployment owner.
            Returns the deployment object for the authenticated owner, including private fields such as environment variables, build log URLs, and internal metadata.
            Returns the reduced deployment view for anonymous (`vcn_`) callers. Pool-team details are withheld.
          content:
            application/json:
              schema:
                properties:
                  alias:
                    items:
                      type: string
                    type: array
                  aliasAssigned:
                    type: boolean
                    enum:
                      - false
                      - true
                  id:
                    type: string
                    description: A string holding the unique ID of the deployment
                    example: dpl_89qyp1cskzkLrVicDaZoDbjyHuDJ
                  target:
                    nullable: true
                    type: string
                    enum:
                      - production
                      - staging
                      - null
                    description: If defined, either `staging` if a staging alias in the format `<project>.<team>.now.sh` was assigned upon creation, or `production` if the aliases from `alias` were assigned. `null` value indicates the "preview" deployment.
                    example: null
                  readyState:
                    type: string
                    enum:
                      - BLOCKED
                      - BUILDING
                      - CANCELED
                      - ERROR
                      - INITIALIZING
                      - QUEUED
                      - READY
                    description: The state of the deployment depending on the process of deploying, or if it is ready or in an error state
                    example: READY
                  aliasError:
                    nullable: true
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                    type: object
                    description: An object that will contain a `code` and a `message` when the aliasing fails, otherwise the value will be `null`
                    example: null
                  aliasWarning:
                    nullable: true
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      link:
                        type: string
                      action:
                        type: string
                    required:
                      - code
                      - message
                    type: object
                  errorCode:
                    type: string
                  errorMessage:
                    nullable: true
                    type: string
                  aliasAssignedAt:
                    nullable: true
                    oneOf:
                      - type: number
                      - type: boolean
                        enum:
                          - false
                          - true
                  alwaysRefuseToBuild:
                    type: boolean
                    enum:
                      - false
                      - true
                  build:
                    properties:
                      env:
                        items:
                          type: string
                        type: array
                    required:
                      - env
                    type: object
                  buildArtifactUrls:
                    items:
                      type: string
                    type: array
                  builds:
                    items:
                      properties:
                        use:
                          type: string
                        src:
                          type: string
                        config:
                          additionalProperties: true
                          type: object
                      required:
                        - use
                      type: object
                    type: array
                  env:
                    items:
                      type: string
                    type: array
                  resourceConfig:
                    properties:
                      buildMachine:
                        properties:
                          purchaseType:
                            type: string
                            enum:
                              - basic
                              - enhanced
                              - standard
                              - turbo
                            description: Machine type which was purchased/selected for this build. `basic` is the 2vCPU tier, recorded on the deployment so the build pipeline can detect a basic build without consulting the project.
                          defaultPurchaseType:
                            type: string
                            enum:
                              - basic
                              - enhanced
                              - standard
                            description: The default plan type for the build machine — what the customer is *paying* for on their plan. For most customers, this is standard, but some customers have an entitlement for enhanced builds.
                          machineSelectionType:
                            type: string
                            enum:
                              - elastic
                              - fixed
                            description: Whether the build ran on a fixed or elastic machine. Used to drive billing for the build.
                          selectionSource:
                            type: string
                            enum:
                              - elastic-algorithm
                              - plan-default
                              - project-setting
                              - team-entitlement
                              - team-setting
                            description: The setting which selected the build machine when the deployment was created. Frozen here so later project or team changes do not rewrite its history.
                          cores:
                            type: number
                            description: Number of cores the build machine ran with. Set at dispatch time once the build lands on a hive.
                          memory:
                            type: number
                            description: Memory, in MiB, the build machine ran with. Set at dispatch time once the build lands on a hive.
                        type: object
                        description: Build machine configuration recorded for this deployment's build. See {@link DeploymentBuildMachine}. Distinct from the team/user `resourceConfig.buildMachine`, which only carries `default`.
                    type: object
                  inspectorUrl:
                    nullable: true
                    type: string
                  isInConcurrentBuildsQueue:
                    type: boolean
                    enum:
                      - false
                      - true
                  isInSystemBuildsQueue:
                    type: boolean
                    enum:
                      - false
                      - true
                  projectSettings:
                    properties:
                      nodeVersion:
                        type: string
                        enum:
                          - 10.x
                          - 12.x
                          - 14.x
                          - 16.x
                          - 18.x
                          - 20.x
                          - 22.x
                          - 24.x
                          - 8.10.x
                      buildCommand:
                        nullable: true
                        type: string
                      devCommand:
                        nullable: true
                        type: string
                      framework:
                        nullable: true
                        type: string
                        enum:
                          - actix-web
                          - angular
                          - ash
                          - astro
                          - axum
                          - blitzjs
                          - brunch
                          - bun
                          - container
                          - create-react-app
                          - django
                          - docusaurus
                          - docusaurus-2
                          - dojo
                          - eleventy
                          - elysia
                          - ember
                          - eve
                          - express
                          - factory-eve
                          - fastapi
                          - fasthtml
                          - fastify
                          - flask
                          - gatsby
                          - go
                          - gridsome
                          - h3
                          - hexo
                          - hono
                          - hugo
                          - hydrogen
                          - ionic-angular
                          - ionic-react
                          - jekyll
                          - koa
                          - mastra
                          - middleman
                          - nestjs
                          - nextjs
                          - nitro
                          - node
                          - nuxtjs
                          - parcel
                          - polymer
                          - preact
                          - python
                          - react-router
                          - redwoodjs
                          - remix
                          - ruby
                          - rust
                          - saber
                          - sanity
                          - sanity-v2
                          - sapper
                          - scully
                          - services
                          - solidstart
                          - solidstart-1
                          - stencil
                          - storybook
                          - svelte
                          - sveltekit
                          - sveltekit-1
                          - tanstack-start
                          - tanstack-start-lovable
                          - umijs
                          - vite
                          - vitepress
                          - vue
                          - vuepress
                          - xmcp
                          - zola
                          - null
                      commandForIgnoringBuildStep:
                        nullable: true
                        type: string
                      installCommand:
                        nullable: true
                        type: string
                      outputDirectory:
                        nullable: true
                        type: string
                      speedInsights:
                        properties:
                          id:
                            type: string
                          enabledAt:
                            type: number
                          disabledAt:
                            type: number
                          canceledAt:
                            type: number
                          hasData:
                            type: boolean
                            enum:
                              - false
                              - true
                          dataReceivedAt:
                            type: number
                            description: When the first free (not Speed Insights Plus) production data point was observed, in ms. Set once by subscriber-analytics-events; projects that already had data before this field shipped get it backfilled on their next batch, so it reads "first free data point observed", not necessarily "first ever".
                          paidAt:
                            type: number
                        required:
                          - id
                        type: object
                      webAnalytics:
                        properties:
                          id:
                            type: string
                          disabledAt:
                            type: number
                          canceledAt:
                            type: number
                          enabledAt:
                            type: number
                          hasData:
                            type: boolean
                            enum:
                              - true
                        required:
                          - id
                        type: object
                    type: object
                  integrations:
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                          - pending
                          - ready
                          - skipped
                          - timeout
                      startedAt:
                        type: number
                      claimedAt:
                        type: number
                      completedAt:
                        type: number
                      skippedAt:
                        type: number
                      skippedBy:
                        type: string
                    required:
                      - startedAt
                      - status
                    type: object
                  images:
                    properties:
                      sizes:
                        items:
                          type: number
                        type: array
                      qualities:
                        items:
                          type: number
                        type: array
                      domains:
                        items:
                          type: string
                        type: array
                      remotePatterns:
                        items:
                          properties:
                            protocol:
                              type: string
                              enum:
                                - http
                                - https
                              description: Must be `http` or `https`.
                            hostname:
                              type: string
                              description: Can be literal or wildcard. Single `*` matches a single subdomain. Double `**` matches any number of subdomains.
                            port:
                              type: string
                              description: Can be literal port such as `8080` or empty string meaning no port.
                            pathname:
                              type: string
                              description: Can be literal or wildcard. Single `*` matches a single path segment. Double `**` matches any number of path segments.
                            search:
                              type: string
                              description: Can be literal query string such as `?v=1` or empty string meaning no query string.
                          required:
                            - hostname
                          type: object
                        type: array
                      localPatterns:
                        items:
                          properties:
                            pathname:
                              type: string
                              description: Can be literal or wildcard. Single `*` matches a single path segment. Double `**` matches any number of path segments.
                            search:
                              type: string
                              description: Can be literal query string such as `?v=1` or empty string meaning no query string.
                          type: object
                        type: array
                      minimumCacheTTL:
                        type: number
                      formats:
                        items:
                          type: string
                          enum:
                            - image/avif
                            - image/webp
                        type: array
                      dangerouslyAllowSVG:
                        type: boolean
                        enum:
                          - false
                          - true
                      contentSecurityPolicy:
                        type: string
                      contentDispositionType:
                        type: string
                        enum:
                          - attachment
                          - inline
                    type: object
                  bootedAt:
                    type: number
                  buildingAt:
                    type: number
                  buildContainerFinishedAt:
                    type: number
                    description: Since April 2025 it necessary for On-Demand Concurrency Minutes calculation
                  buildSkipped:
                    type: boolean
                    enum:
                      - false
                      - true
                  creator:
                    properties:
                      uid:
                        type: string
                        description: Stable creator id across principal types (user id, app id, integration configuration id, or `system`).
                        example: 96SnxkFiMyVKsK3pnoHfx3Hz
                      type:
                        type: string
                        enum:
                          - app
                          - integration
                          - system
                          - user
                        description: Principal type of the deployment creator.
                      username:
                        type: string
                        description: The username of the user that created the deployment
                        example: john-doe
                      avatar:
                        type: string
                        description: The avatar of the user that created the deployment
                    required:
                      - uid
                    type: object
                    description: Information about the deployment creator
                  initReadyAt:
                    type: number
                  isFirstBranchDeployment:
                    type: boolean
                    enum:
                      - false
                      - true
                  lambdas:
                    items:
                      properties:
                        id:
                          type: string
                        readyState:
