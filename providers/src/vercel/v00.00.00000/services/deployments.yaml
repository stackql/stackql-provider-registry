                                type: array
                              referer:
                                type: string
                              clientIp:
                                type: string
                              region:
                                type: string
                              scheme:
                                type: string
                              responseByteSize:
                                type: number
                              cacheId:
                                type: string
                              pathType:
                                type: string
                              pathTypeVariant:
                                type: string
                              vercelId:
                                type: string
                              vercelCache:
                                type: string
                                enum:
                                  - BYPASS
                                  - HIT
                                  - MISS
                                  - PRERENDER
                                  - REVALIDATED
                                  - STALE
                              lambdaRegion:
                                type: string
                              wafAction:
                                type: string
                                enum:
                                  - bypass
                                  - challenge
                                  - deny
                                  - log
                                  - rate_limit
                              wafRuleId:
                                type: string
                            required:
