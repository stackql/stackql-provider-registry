  /v13/deployments:
    post:
      description: Creates a new deployment for the authenticated team or user. For non-git deployments, upload files first via the file upload API, then reference them here by SHA — or inline small files directly in the request body. To redeploy an existing deployment, provide its `deploymentId`; all settings are inherited unless explicitly overridden. The deployment begins building immediately and transitions through `QUEUED` → `INITIALIZING` → `BUILDING` before reaching `READY` or `ERROR`.
      operationId: createDeployment
      security:
        - bearerToken: []
      summary: Create a new deployment
      tags:
        - deployments
      responses:
        '200':
          description: |-
            Returns the newly created deployment object. Poll `readyState` to track build progress. See https://vercel.com/docs/deployments/deployment-states for possible states.
            Returns the reduced deployment view for anonymous (`vcn_`) callers. Pool-team details are withheld.
          content:
            application/json:
              schema:
                properties:
                  alias:
                    items:
                      type: string
                    type: array
                  aliasAssigned:
                    type: boolean
                    enum:
                      - false
                      - true
                  id:
                    type: string
                    description: A string holding the unique ID of the deployment
                    example: dpl_89qyp1cskzkLrVicDaZoDbjyHuDJ
                  target:
                    nullable: true
                    type: string
                    enum:
                      - production
                      - staging
                      - null
                    description: If defined, either `staging` if a staging alias in the format `<project>.<team>.now.sh` was assigned upon creation, or `production` if the aliases from `alias` were assigned. `null` value indicates the "preview" deployment.
                    example: null
                  readyState:
                    type: string
                    enum:
                      - BLOCKED
                      - BUILDING
                      - CANCELED
                      - ERROR
                      - INITIALIZING
                      - QUEUED
                      - READY
                    description: The state of the deployment depending on the process of deploying, or if it is ready or in an error state
                    example: READY
                  aliasError:
                    nullable: true
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                    type: object
                    description: An object that will contain a `code` and a `message` when the aliasing fails, otherwise the value will be `null`
                    example: null
                  aliasWarning:
                    nullable: true
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      link:
                        type: string
                      action:
                        type: string
                    required:
                      - code
                      - message
                    type: object
                  errorCode:
                    type: string
                  errorMessage:
                    nullable: true
                    type: string
                  aliasAssignedAt:
                    nullable: true
                    oneOf:
                      - type: number
                      - type: boolean
                        enum:
                          - false
                          - true
                  alwaysRefuseToBuild:
                    type: boolean
                    enum:
                      - false
                      - true
                  build:
                    properties:
                      env:
                        items:
                          type: string
                        type: array
                    required:
                      - env
                    type: object
                  buildArtifactUrls:
                    items:
                      type: string
                    type: array
                  builds:
                    items:
                      properties:
                        use:
                          type: string
                        src:
                          type: string
                        config:
                          additionalProperties: true
                          type: object
                      required:
                        - use
                      type: object
                    type: array
                  env:
                    items:
                      type: string
                    type: array
                  resourceConfig:
                    properties:
                      buildMachine:
                        properties:
                          purchaseType:
                            type: string
                            enum:
                              - basic
                              - enhanced
                              - standard
                              - turbo
                            description: Machine type which was purchased/selected for this build. `basic` is the 2vCPU tier, recorded on the deployment so the build pipeline can detect a basic build without consulting the project.
                          defaultPurchaseType:
                            type: string
                            enum:
                              - basic
                              - enhanced
                              - standard
                            description: The default plan type for the build machine — what the customer is *paying* for on their plan. For most customers, this is standard, but some customers have an entitlement for enhanced builds.
                          machineSelectionType:
                            type: string
                            enum:
                              - elastic
                              - fixed
                            description: Whether the build ran on a fixed or elastic machine. Used to drive billing for the build.
                          selectionSource:
                            type: string
                            enum:
                              - elastic-algorithm
                              - plan-default
                              - project-setting
                              - team-entitlement
                              - team-setting
                            description: The setting which selected the build machine when the deployment was created. Frozen here so later project or team changes do not rewrite its history.
                          cores:
                            type: number
                            description: Number of cores the build machine ran with. Set at dispatch time once the build lands on a hive.
                          memory:
                            type: number
                            description: Memory, in MiB, the build machine ran with. Set at dispatch time once the build lands on a hive.
                        type: object
                        description: Build machine configuration recorded for this deployment's build. See {@link DeploymentBuildMachine}. Distinct from the team/user `resourceConfig.buildMachine`, which only carries `default`.
                    type: object
                  inspectorUrl:
                    nullable: true
                    type: string
                  isInConcurrentBuildsQueue:
                    type: boolean
                    enum:
