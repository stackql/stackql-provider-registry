                      created:
                        type: number
                      payload:
                        properties:
                          deploymentId:
                            type: string
                          info:
                            properties:
                              type:
                                type: string
                              name:
                                type: string
                              entrypoint:
                                type: string
                              path:
                                type: string
                              step:
                                type: string
                              readyState:
                                type: string
                              serviceName:
                                type: string
                            required:
                              - name
                              - type
                            type: object
                          text:
                            type: string
                          id:
                            type: string
                          date:
                            type: number
                          serial:
                            type: string
                          created:
                            type: number
                          statusCode:
                            type: number
                          requestId:
                            type: string
                          proxy:
                            properties:
                              timestamp:
                                type: number
                              method:
