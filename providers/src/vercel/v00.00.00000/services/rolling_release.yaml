openapi: 3.0.3
info:
  title: rolling_release API
  description: vercel rolling_release API
  version: 0.0.1
paths:
  /v1/projects/{id_or_name}/rolling-release/billing:
    get:
      description: Get the Rolling Releases billing status for a project. The team level billing status is used to determine if the project can be configured for rolling releases.
      operationId: getRollingReleaseBillingStatus
      security:
        - bearerToken: []
      summary: Get rolling release billing status
      tags:
        - rolling-release
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  availableSlots:
                    type: number
                    enum:
                      - 0
                  reason:
                    type: string
                    enum:
                      - plan_not_supported
                  message:
                    type: string
                  enabledProjects:
                    items:
                      type: string
                    type: array
                required:
                  - availableSlots
                  - message
                  - reason
                  - enabledProjects
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: id_or_name
          description: Project ID or project name (URL-encoded)
          in: path
          required: true
          schema:
            description: Project ID or project name (URL-encoded)
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/projects/{id_or_name}/rolling-release/config:
    get:
      description: Get the Rolling Releases configuration for a project. The project-level config is simply a template that will be used for any future rolling release, and not the configuration for any active rolling release.
      operationId: getRollingReleaseConfig
      security:
        - bearerToken: []
      summary: Get rolling release configuration
      tags:
        - rolling-release
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  rollingRelease:
                    nullable: true
                    properties:
                      target:
                        type: string
                        description: The environment that the release targets, currently only supports production. Adding in case we want to configure with alias groups or custom environments.
                        example: production
                      stages:
                        nullable: true
                        items:
                          properties:
                            targetPercentage:
                              type: number
                              description: The percentage of traffic to serve to the canary deployment (0-100)
                              example: 25
                            requireApproval:
                              type: boolean
                              enum:
                                - false
                                - true
                              description: Whether or not this stage requires manual approval to proceed
                              example: false
                            duration:
                              type: number
                              description: Duration in minutes for automatic advancement to the next stage
                              example: 600
                            linearShift:
                              type: boolean
                              enum:
                                - false
                                - true
                              description: Whether to linearly shift traffic over the duration of this stage
                              example: false
                          required:
                            - targetPercentage
                          type: object
                          description: 'An array of all the stages required during a deployment release. Each stage defines a target percentage and advancement rules. The final stage must always have targetPercentage: 100.'
                        type: array
                        description: 'An array of all the stages required during a deployment release. Each stage defines a target percentage and advancement rules. The final stage must always have targetPercentage: 100.'
                      canaryResponseHeader:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether the request served by a canary deployment should return a header indicating a canary was served. Defaults to `false` when omitted.
                        example: false
                      gate:
                        properties:
                          enabled:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: Whether automated gating is enabled for this project's rollouts.
                          checks:
                            items:
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - error-rate-5xx
                                  description: The metric this check evaluates.
                                minSampleSize:
                                  type: number
                                  description: Minimum number of requests required in the window before the check can fail. Below this, the check is inconclusive rather than failing, so low-traffic stages don't gate on noise. Defaults to `100` when omitted.
                                  example: 100
                                excludeStatusCodes:
                                  items:
                                    type: number
                                  type: array
                                  description: Response status codes to ignore entirely — dropped from both the numerator (errors) and the denominator (total requests). Defaults to `[]` when omitted.
                                  example:
                                    - 503
                                excludePaths:
                                  items:
                                    type: string
                                  type: array
                                  description: Request paths to ignore entirely — dropped from both the numerator (errors) and the denominator (total requests). Matched exactly against the request path with any query string removed; no prefix or glob matching. Defaults to `[]` when omitted.
                                  example:
                                    - /api/health
                                ingestWatermarkSeconds:
                                  type: number
                                  description: 'Seconds of ingest lag to allow for: the query''s upper bound is `now() - this value`, so the check never reads a window that is still filling. Defaults to `30` when omitted.'
                                  example: 30
                              required:
                                - type
                              type: object
                              description: The checks to evaluate. An empty array means nothing is evaluated.
                            type: array
                            description: The checks to evaluate. An empty array means nothing is evaluated.
                          failureThreshold:
                            type: number
                            description: How many failing evaluations within {@link windowSize} trip the gate. Defaults to `3` when omitted.
                            example: 3
                          windowSize:
                            type: number
                            description: How many of the most recent evaluations {@link failureThreshold} is counted against. Defaults to `5` when omitted.
                            example: 5
                          action:
                            type: string
                            enum:
                              - pause
                              - rollback
                            description: 'What to do when the gate trips: pause the rollout, or roll it back.'
                          dryRun:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: When true, a tripped gate is only reported — {@link action} is not taken.
                        required:
                          - action
                          - checks
                          - dryRun
                          - enabled
                        type: object
                        description: 'Automated gating configuration. Omitted (the default) means no gating is configured, which is equivalent to `enabled: false`.'
                    required:
                      - target
                    type: object
                    description: Project-level rolling release configuration that defines how deployments should be gradually rolled out
                required:
                  - rollingRelease
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: id_or_name
          description: Project ID or project name (URL-encoded)
          in: path
          required: true
          schema:
            description: Project ID or project name (URL-encoded)
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    delete:
      description: Disable Rolling Releases for a project means that future deployments will not undergo a rolling release. Changing the config never alters a rollout that's already in-flight—it only affects the next production deployment. If you want to also stop the current rollout, call this endpoint to disable the feature, and then call either the /complete or /abort endpoint.
      operationId: deleteRollingReleaseConfig
      security:
        - bearerToken: []
      summary: Delete rolling release configuration
      tags:
        - rolling-release
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  rollingRelease:
                    nullable: true
                required:
                  - rollingRelease
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: id_or_name
          description: Project ID or project name (URL-encoded)
          in: path
          required: true
          schema:
            description: Project ID or project name (URL-encoded)
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    patch:
      description: 'Update (or disable) Rolling Releases for a project. When disabling with the resolve-on-disable feature flag enabled, any active rolling release document is resolved using the disableRolloutAction parameter: "abort" to roll back (default), or "complete" to promote the canary to production. When enabling or updating config, changes only affect the next production deployment and do not alter a rollout that''s already in-flight. Note: Enabling Rolling Releases automatically enables skew protection on the project with the default value if it wasn''t configured already.'
      operationId: updateRollingReleaseConfig
      security:
        - bearerToken: []
      summary: Update the rolling release settings for the project
      tags:
        - rolling-release
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  rollingRelease:
                    nullable: true
                required:
                  - rollingRelease
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: id_or_name
          description: Project ID or project name (URL-encoded)
          in: path
          required: true
          schema:
            description: Project ID or project name (URL-encoded)
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/projects/{id_or_name}/rolling-release:
    get:
      description: Return the Rolling Release for a project, regardless of whether the rollout is active, aborted, or completed. If the feature is enabled but no deployment has occurred yet, null will be returned.
      operationId: getRollingRelease
      security:
        - bearerToken: []
      summary: Get the active rolling release information for a project
      tags:
        - rolling-release
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  rollingRelease:
                    nullable: true
                    properties:
                      state:
                        type: string
                        enum:
                          - ABORTED
                          - ACTIVE
                          - COMPLETE
                        description: The current state of the rolling release
                        example: ACTIVE
                      substate:
                        nullable: true
                        type: string
                        enum:
                          - PAUSED
                          - null
                        description: When set to `PAUSED`, the rollout is frozen at the current percentage until continued.
                      currentDeployment:
                        nullable: true
                        properties:
                          name:
                            type: string
                            description: The name of the project associated with the deployment at the time that the deployment was created
                            example: my-project
                          createdAt:
                            type: number
                            description: A number containing the date when the deployment was created in milliseconds
                            example: 1540257589405
                          readyState:
                            type: string
                            enum:
                              - BLOCKED
                              - BUILDING
                              - CANCELED
                              - ERROR
                              - INITIALIZING
                              - QUEUED
                              - READY
                            description: The state of the deployment depending on the process of deploying, or if it is ready or in an error state
                            example: READY
                          id:
                            type: string
                            description: A string holding the unique ID of the deployment
                            example: dpl_89qyp1cskzkLrVicDaZoDbjyHuDJ
                          target:
                            nullable: true
                            type: string
                            enum:
                              - production
                              - staging
                              - null
                            description: If defined, either `staging` if a staging alias in the format `<project>.<team>.now.sh` was assigned upon creation, or `production` if the aliases from `alias` were assigned. `null` value indicates the "preview" deployment.
                            example: null
                          readyStateAt:
                            type: number
                          source:
                            type: string
                            enum:
                              - api-trigger-git-deploy
                              - cli
                              - clone/repo
                              - drop
                              - git
                              - git-deploy-hook
                              - import
                              - import/repo
                              - redeploy
                              - v0-web
                            description: Where was the deployment created from. Best-effort guess for metrics only — not authoritative; do not gate behavior on it.
                            example: cli
                          url:
                            type: string
                            description: A string with the unique URL of the deployment
                            example: my-instant-deployment-3ij3cxz9qr.now.sh
                        required:
                          - createdAt
                          - id
                          - name
                          - readyState
                          - url
                        type: object
                        description: The current deployment receiving production traffic
                        example:
                          id: dpl_abc123
                          name: my-shop@main
                          url: my-shop.vercel.app
                          target: production
                          source: git
                          createdAt: 1716206500000
                          readyState: READY
                          readyStateAt: 1716206800000
                      canaryDeployment:
                        nullable: true
                        properties:
                          name:
                            type: string
                            description: The name of the project associated with the deployment at the time that the deployment was created
                            example: my-project
                          createdAt:
                            type: number
                            description: A number containing the date when the deployment was created in milliseconds
                            example: 1540257589405
                          readyState:
                            type: string
                            enum:
                              - BLOCKED
                              - BUILDING
                              - CANCELED
                              - ERROR
                              - INITIALIZING
                              - QUEUED
                              - READY
                            description: The state of the deployment depending on the process of deploying, or if it is ready or in an error state
                            example: READY
                          id:
                            type: string
                            description: A string holding the unique ID of the deployment
                            example: dpl_89qyp1cskzkLrVicDaZoDbjyHuDJ
                          target:
                            nullable: true
                            type: string
                            enum:
                              - production
                              - staging
                              - null
                            description: If defined, either `staging` if a staging alias in the format `<project>.<team>.now.sh` was assigned upon creation, or `production` if the aliases from `alias` were assigned. `null` value indicates the "preview" deployment.
                            example: null
                          readyStateAt:
                            type: number
                          source:
                            type: string
                            enum:
                              - api-trigger-git-deploy
                              - cli
                              - clone/repo
                              - drop
                              - git
                              - git-deploy-hook
                              - import
                              - import/repo
                              - redeploy
                              - v0-web
                            description: Where was the deployment created from. Best-effort guess for metrics only — not authoritative; do not gate behavior on it.
                            example: cli
                          url:
                            type: string
                            description: A string with the unique URL of the deployment
                            example: my-instant-deployment-3ij3cxz9qr.now.sh
                        required:
                          - createdAt
                          - id
                          - name
                          - readyState
                          - url
                        type: object
                        description: The canary deployment being rolled out
                        example:
                          id: dpl_def456
                          name: my-shop@9c7e2f4
                          url: 9c7e2f4-my-shop.vercel.app
                          target: production
                          source: git
                          createdAt: 1716210100000
                          readyState: READY
                          readyStateAt: 1716210400000
                      queuedDeploymentId:
                        nullable: true
                        type: string
                        description: The ID of a deployment queued for the next rolling release
                        example: dpl_ghi789
                      advancementType:
                        type: string
                        enum:
                          - automatic
                          - manual-approval
                        description: The advancement type of the rolling release
                        example: manual-approval
                      stages:
                        items:
                          properties:
                            index:
                              type: number
                              description: The zero-based index of the stage
                              example: 0
                            isFinalStage:
                              type: boolean
                              enum:
                                - false
                                - true
                              description: Whether or not this stage is the final stage (targetPercentage === 100)
                              example: false
                            targetPercentage:
                              type: number
                              description: The percentage of traffic to serve to the canary deployment (0-100)
                              example: 25
                            requireApproval:
                              type: boolean
                              enum:
                                - false
                                - true
                              description: Whether or not this stage requires manual approval to proceed
                            duration:
                              nullable: true
                              type: number
                              description: Duration in seconds for automatic advancement, null for manual stages or the final stage
                              example: null
                            linearShift:
                              type: boolean
                              enum:
                                - false
                                - true
                              description: Whether to linearly shift traffic over the duration of this stage
                              example: false
                          required:
                            - duration
                            - index
                            - isFinalStage
                            - requireApproval
                            - targetPercentage
                          type: object
                          description: All stages configured for this rolling release
                          example:
                            - index: 0
                              isFinalStage: false
                              targetPercentage: 5
                              requireApproval: true
                              duration: null
                            - index: 1
                              isFinalStage: false
                              targetPercentage: 25
                              requireApproval: true
                              duration: null
                            - index: 2
                              isFinalStage: false
                              targetPercentage: 60
                              requireApproval: true
                              duration: null
                            - index: 3
                              isFinalStage: true
                              targetPercentage: 100
                              requireApproval: false
                              duration: null
                        type: array
                        description: All stages configured for this rolling release
                        example:
                          - index: 0
                            isFinalStage: false
                            targetPercentage: 5
                            requireApproval: true
                            duration: null
                          - index: 1
                            isFinalStage: false
                            targetPercentage: 25
                            requireApproval: true
                            duration: null
                          - index: 2
                            isFinalStage: false
                            targetPercentage: 60
                            requireApproval: true
                            duration: null
                          - index: 3
                            isFinalStage: true
                            targetPercentage: 100
                            requireApproval: false
                            duration: null
                      activeStage:
                        nullable: true
                        properties:
                          index:
                            type: number
                            description: The zero-based index of the stage
                            example: 0
                          isFinalStage:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: Whether or not this stage is the final stage (targetPercentage === 100)
                            example: false
                          targetPercentage:
                            type: number
                            description: The percentage of traffic to serve to the canary deployment (0-100)
                            example: 25
                          requireApproval:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: Whether or not this stage requires manual approval to proceed
                          duration:
                            nullable: true
                            type: number
                            description: Duration in seconds for automatic advancement, null for manual stages or the final stage
                            example: null
                          linearShift:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: Whether to linearly shift traffic over the duration of this stage
                            example: false
                        required:
                          - duration
                          - index
                          - isFinalStage
                          - requireApproval
                          - targetPercentage
                        type: object
                        description: The currently active stage, null if the rollout is aborted
                        example:
                          index: 1
                          isFinalStage: false
                          targetPercentage: 25
                          requireApproval: true
                          duration: null
                      nextStage:
                        nullable: true
                        properties:
                          index:
                            type: number
                            description: The zero-based index of the stage
                            example: 0
                          isFinalStage:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: Whether or not this stage is the final stage (targetPercentage === 100)
                            example: false
                          targetPercentage:
                            type: number
                            description: The percentage of traffic to serve to the canary deployment (0-100)
                            example: 25
                          requireApproval:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: Whether or not this stage requires manual approval to proceed
                          duration:
                            nullable: true
                            type: number
                            description: Duration in seconds for automatic advancement, null for manual stages or the final stage
                            example: null
                          linearShift:
                            type: boolean
                            enum:
                              - false
                              - true
                            description: Whether to linearly shift traffic over the duration of this stage
                            example: false
                        required:
                          - duration
                          - index
                          - isFinalStage
                          - requireApproval
                          - targetPercentage
                        type: object
                        description: The next stage to be activated, null if not in ACTIVE state
                        example:
                          index: 2
                          isFinalStage: false
                          targetPercentage: 60
                          requireApproval: true
                          duration: null
                      startedAt:
                        type: number
                        description: Unix timestamp in milliseconds when the rolling release started
                        example: 1716210500000
                      updatedAt:
                        type: number
                        description: Unix timestamp in milliseconds when the rolling release was last updated
                        example: 1716210600000
                      currentCanaryPercentage:
                        type: number
                        description: When set (for example while {@link substate} is `PAUSED`), the canary traffic percentage persisted on the rollout document — use for dashboard display when linear shift is active.
                    required:
                      - activeStage
                      - advancementType
                      - canaryDeployment
                      - currentDeployment
                      - nextStage
                      - queuedDeploymentId
                      - stages
                      - startedAt
                      - state
                      - substate
                      - updatedAt
                    type: object
                    description: Rolling release information including configuration and document details, or null if no rolling release exists
                required:
                  - rollingRelease
                type: object
                description: The response format for rolling release endpoints that return rolling release information
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: id_or_name
          description: Project ID or project name (URL-encoded)
          in: path
          required: true
          schema:
            description: Project ID or project name (URL-encoded)
            type: string
        - name: state
          description: Filter by rolling release state
          in: query
          required: false
          schema:
            description: Filter by rolling release state
            type: string
            enum:
              - ACTIVE
              - COMPLETE
              - ABORTED
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/projects/{id_or_name}/rolling-release/approve-stage:
    post:
      description: Advance a rollout to the next stage. This is only needed when rolling releases is configured to require manual approval.
      operationId: approveRollingReleaseStage
      security:
        - bearerToken: []
      summary: Update the active rolling release to the next stage for a project
      tags:
        - rolling-release
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  rollingRelease:
                    nullable: true
                    properties:
                      state:
                        type: string
                        enum:
                          - ABORTED
                          - ACTIVE
                          - COMPLETE
                        description: The current state of the rolling release
                        example: ACTIVE
                      substate:
                        nullable: true
                        type: string
                        enum:
                          - PAUSED
                          - null
                        description: When set to `PAUSED`, the rollout is frozen at the current percentage until continued.
                      currentDeployment:
                        nullable: true
                        properties:
                          name:
                            type: string
                            description: The name of the project associated with the deployment at the time that the deployment was created
                            example: my-project
                          createdAt:
                            type: number
                            description: A number containing the date when the deployment was created in milliseconds
                            example: 1540257589405
                          readyState:
                            type: string
                            enum:
                              - BLOCKED
                              - BUILDING
                              - CANCELED
                              - ERROR
                              - INITIALIZING
                              - QUEUED
                              - READY
                            description: The state of the deployment depending on the process of deploying, or if it is ready or in an error state
                            example: READY
                          id:
                            type: string
                            description: A string holding the unique ID of the deployment
                            example: dpl_89qyp1cskzkLrVicDaZoDbjyHuDJ
                          target:
                            nullable: true
                            type: string
                            enum:
                              - production
                              - staging
                              - null
                            description: If defined, either `staging` if a staging alias in the format `<project>.<team>.now.sh` was assigned upon creation, or `production` if the aliases from `alias` were assigned. `null` value indicates the "preview" deployment.
                            example: null
                          readyStateAt:
                            type: number
                          source:
                            type: string
                            enum:
