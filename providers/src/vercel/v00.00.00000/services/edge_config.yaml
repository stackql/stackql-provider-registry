          schema:
            type: string
            example: my-team-url-slug
    put:
      description: Updates a Global Config.
      operationId: updateEdgeConfig
      security:
        - bearerToken: []
      summary: Update a Global Config
      tags:
        - global-config
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  createdAt:
                    type: number
                  createdBy:
                    type: string
                    description: The ID of the user who created the Global Config, optional because it is not always set.
                  ownerId:
                    type: string
                  slug:
                    type: string
                    description: Name for the Global Config Names are not unique. Must start with an alphabetic character and can contain only alphanumeric characters and underscores).
                  updatedAt:
                    type: number
                  digest:
                    type: string
                  purpose:
                    properties:
                      type:
                        type: string
                        enum:
                          - flags
                      projectId:
                        type: string
                      resourceId:
                        type: string
                    required:
                      - projectId
                      - type
                      - resourceId
                    type: object
                  deletedAt:
                    nullable: true
                    type: number
                  transfer:
                    properties:
                      fromAccountId:
                        type: string
                      startedAt:
                        type: number
                      doneAt:
                        nullable: true
                        type: number
                    required:
                      - doneAt
                      - fromAccountId
                      - startedAt
                    type: object
                    description: Keeps track of the current state of the Global Config while it gets transferred.
                  schema:
                    type: string
                    description: (opaque JSON object)
                  syncedToDynamoAt:
                    type: number
                    description: Timestamp of when the Global Config was synced to DynamoDB initially. It is only set when syncing the entire Global Config, not when updating.
                  sizeInBytes:
                    type: number
                  itemCount:
                    type: number
                required:
                  - createdAt
                  - digest
                  - id
                  - itemCount
                  - ownerId
                  - sizeInBytes
                  - slug
                  - updatedAt
                type: object
                description: A Global Config
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - name: edge_config_id
          in: path
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - slug
              properties:
                slug:
                  maxLength: 64
                  pattern: ^[\w-]+$
                  type: string
    delete:
      description: Delete a Global Config by id.
      operationId: deleteEdgeConfig
      security:
        - bearerToken: []
      summary: Delete a Global Config
      tags:
        - global-config
      responses:
        '204':
          description: ''
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
