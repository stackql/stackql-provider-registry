openapi: 3.0.3
info:
  title: edge_config API
  description: vercel edge_config API
  version: 0.0.1
paths:
  /v1/global-config:
    get:
      description: Returns all Global Configs.
      operationId: getEdgeConfigs
      security:
        - bearerToken: []
      summary: Get Global Configs
      tags:
        - global-config
      responses:
        '200':
          description: List of all global configs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEdgeConfigsResponse'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    post:
      description: Creates a Global Config.
      operationId: createEdgeConfig
      security:
        - bearerToken: []
      summary: Create a Global Config
      tags:
        - global-config
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  createdAt:
                    type: number
                  createdBy:
                    type: string
                    description: The ID of the user who created the Global Config, optional because it is not always set.
                  ownerId:
                    type: string
                  slug:
                    type: string
                    description: Name for the Global Config Names are not unique. Must start with an alphabetic character and can contain only alphanumeric characters and underscores).
                  updatedAt:
                    type: number
                  digest:
                    type: string
                  purpose:
                    properties:
                      type:
                        type: string
                        enum:
                          - flags
                      projectId:
                        type: string
                      resourceId:
                        type: string
                    required:
                      - projectId
                      - type
                      - resourceId
                    type: object
                  deletedAt:
                    nullable: true
                    type: number
                  transfer:
                    properties:
                      fromAccountId:
                        type: string
                      startedAt:
                        type: number
                      doneAt:
                        nullable: true
                        type: number
                    required:
                      - doneAt
                      - fromAccountId
                      - startedAt
                    type: object
                    description: Keeps track of the current state of the Global Config while it gets transferred.
                  schema:
                    type: string
                    description: (opaque JSON object)
                  syncedToDynamoAt:
                    type: number
                    description: Timestamp of when the Global Config was synced to DynamoDB initially. It is only set when syncing the entire Global Config, not when updating.
                  sizeInBytes:
                    type: number
                  itemCount:
                    type: number
                required:
                  - createdAt
                  - digest
                  - id
                  - itemCount
                  - ownerId
                  - sizeInBytes
                  - slug
                  - updatedAt
                type: object
                description: A Global Config
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - slug
              properties:
                slug:
                  maxLength: 64
                  pattern: ^[\w-]+$
                  type: string
                items:
                  type: object
                  additionalProperties: {}
  /v1/global-config/{edge_config_id}:
    get:
      description: Returns a Global Config.
      operationId: getEdgeConfig
