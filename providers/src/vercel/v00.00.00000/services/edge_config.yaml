                    description: Timestamp of when the Global Config was synced to DynamoDB initially. It is only set when syncing the entire Global Config, not when updating.
                  sizeInBytes:
                    type: number
                  itemCount:
                    type: number
                required:
                  - createdAt
                  - digest
                  - id
                  - itemCount
                  - ownerId
                  - sizeInBytes
                  - slug
                  - updatedAt
                type: object
                description: The Global Config.
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
