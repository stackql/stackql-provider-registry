              id:
                type: string
              createdAt:
                type: number
              createdBy:
                type: string
                description: The ID of the user who created the Global Config, optional because it is not always set.
              ownerId:
                type: string
              slug:
                type: string
                description: Name for the Global Config Names are not unique. Must start with an alphabetic character and can contain only alphanumeric characters and underscores).
              updatedAt:
                type: number
              digest:
                type: string
              purpose:
                oneOf:
                  - properties:
                      type:
                        type: string
                        enum:
                          - flags
                      projectId:
                        type: string
                    required:
                      - projectId
                      - type
                    type: object
                  - properties:
                      type:
                        type: string
                        enum:
                          - experimentation
                      resourceId:
                        type: string
                    required:
                      - resourceId
                      - type
                    type: object
              deletedAt:
                nullable: true
                type: number
              transfer:
                properties:
                  fromAccountId:
                    type: string
                  startedAt:
                    type: number
                  doneAt:
                    nullable: true
                    type: number
                required:
                  - doneAt
                  - fromAccountId
                  - startedAt
                type: object
                description: Keeps track of the current state of the Global Config while it gets transferred.
              schema:
                type: string
                description: (opaque JSON object)
              syncedToDynamoAt:
                type: number
                description: Timestamp of when the Global Config was synced to DynamoDB initially. It is only set when syncing the entire Global Config, not when updating.
              sizeInBytes:
                type: number
              itemCount:
                type: number
            required:
              - createdAt
              - digest
              - id
              - itemCount
              - ownerId
              - sizeInBytes
              - slug
              - updatedAt
            type: object
            description: List of all global configs.
