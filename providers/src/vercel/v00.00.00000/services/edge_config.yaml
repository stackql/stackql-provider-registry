          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    oneOf:
                      - type: object
                        properties:
                          operation:
                            enum:
                              - create
                              - update
                              - upsert
                              - delete
                          key:
                            maxLength: 256
                            pattern: ^[\w-]+$
                            type: string
                          value: {}
                          description:
                            oneOf:
                              - type: string
                                maxLength: 512
                              - type: string
                        anyOf:
                          - properties:
                              operation: {}
                            required:
                              - operation
                              - key
                              - value
                            type: object
                          - properties:
                              operation:
                                enum:
                                  - update
                                  - upsert
                            required:
                              - operation
                              - key
                              - value
                            type: object
                          - properties:
                              operation:
                                enum:
                                  - update
                                  - upsert
                            required:
                              - operation
                              - key
                              - description
                            type: object
                          - properties:
                              operation: {}
                            required:
                              - operation
                              - key
                            not:
                              required:
                                - value
                                - description
                            type: object
