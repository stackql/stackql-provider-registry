    patch:
      description: Update multiple Global Config Items in batch.
      operationId: patchEdgeConfigItems
      security:
        - bearerToken: []
      summary: Update Global Config items in batch
      tags:
        - global-config
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                required:
                  - status
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
        '412':
          description: ''
      parameters:
        - name: edge_config_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^ecfg_
        - description: The Team identifier to perform the request on behalf of.
