      parameters:
        - name: projectId
          description: The project identifier or the project name
          in: query
          required: true
          schema:
            description: The project identifier or the project name
            example: prj_XLKmu1DyR1eY7zq8UgeRKbA7yVLA
            type: string
        - name: by
          description: |-
            Up to two dimensions used to break down results.

            At most one time granularity is allowed: hour, day, week, month, year.

            Other dimensions: country, deviceType, environment, requestPath, referrerHostname, osName, browserName, route, utmSource, utmMedium, utmCampaign, utmContent, utmTerm.

            JSON dimensions: flags. Used bare, it breaks down results by key, for example flags returns one group per flag name. With a key, it breaks down results by that key's value, for example flags/beta_banner. Wrap keys containing characters other than letters, digits, and underscores in single quotes, for example flags/'my-flag'.
          in: query
          required: true
          schema:
            description: |-
              Up to two dimensions used to break down results.

              At most one time granularity is allowed: hour, day, week, month, year.

              Other dimensions: country, deviceType, environment, requestPath, referrerHostname, osName, browserName, route, utmSource, utmMedium, utmCampaign, utmContent, utmTerm.

              JSON dimensions: flags. Used bare, it breaks down results by key, for example flags returns one group per flag name. With a key, it breaks down results by that key's value, for example flags/beta_banner. Wrap keys containing characters other than letters, digits, and underscores in single quotes, for example flags/'my-flag'.
            example:
              - day
              - country
            type: array
            minItems: 1
            maxItems: 2
            uniqueItems: true
            items:
              type: string
              anyOf:
                - enum:
                    - hour
                    - day
                    - week
                    - month
                    - year
                    - country
                    - deviceType
                    - environment
                    - requestPath
                    - referrerHostname
                    - osName
                    - browserName
                    - route
                    - utmSource
                    - utmMedium
                    - utmCampaign
                    - utmContent
                    - utmTerm
                    - flags
                - pattern: ^(flags)(/([0-9A-Za-z_]+|'([^']|'')*'))+$
              errorMessage: '`by` items should be equal to one of the allowed values "hour, day, week, month, year, country, deviceType, environment, requestPath, referrerHostname, osName, browserName, route, utmSource, utmMedium, utmCampaign, utmContent, utmTerm, flags", or a JSON dimension key such as "flags/<name>"'
        - name: since
          description: |-
            Timestamp in milliseconds, or a valid Date string.

            Selects data from (including) this date and time.
            Will be adjusted according to the desired time granularity.
          in: query
          required: true
          schema:
            description: |-
              Timestamp in milliseconds, or a valid Date string.

              Selects data from (including) this date and time.
              Will be adjusted according to the desired time granularity.
            example: '2024-09-01T00:00:00.000Z'
            anyOf:
              - type: number
              - type: string
        - name: until
          description: |-
            Timestamp in milliseconds, or a valid Date string.

            Selects data until (including) this date.
            Will be adjusted according to the desired time granularity.
          in: query
          required: true
          schema:
            description: |-
              Timestamp in milliseconds, or a valid Date string.

              Selects data until (including) this date.
              Will be adjusted according to the desired time granularity.
            example: '2024-09-08T00:00:00.000Z'
            anyOf:
              - type: number
              - type: string
        - name: limit
          description: Number of distinct results, default to 10. Other results are grouped into "Others" group.
          in: query
          required: false
          schema:
            description: Number of distinct results, default to 10. Other results are grouped into "Others" group.
            default: 10
            example: 3
            type: integer
            minimum: 1
            maximum: 100
        - name: filter
          description: |-
            OData-compliant filter. Encode the value when sending it in a URL.

            Allows filtering on one or multiple dimensions. By default, filters for production environment only.

            Supported dimensions: country, deviceType, environment, requestPath, referrerHostname, osName, browserName, route, utmSource, utmMedium, utmCampaign, utmContent, utmTerm.

            JSON dimensions filtered by key: flags/<name>, for example flags/beta_banner eq 'true'. Wrap keys containing characters other than letters, digits, and underscores in single quotes, for example flags/'my-flag' eq 'true'.

            Supported operations include eq, ne, in, and logical operators and, or, not with parentheses. Functions such as startswith are supported by the OData parser.
          in: query
          required: false
          schema:
            description: |-
              OData-compliant filter. Encode the value when sending it in a URL.

              Allows filtering on one or multiple dimensions. By default, filters for production environment only.

              Supported dimensions: country, deviceType, environment, requestPath, referrerHostname, osName, browserName, route, utmSource, utmMedium, utmCampaign, utmContent, utmTerm.

              JSON dimensions filtered by key: flags/<name>, for example flags/beta_banner eq 'true'. Wrap keys containing characters other than letters, digits, and underscores in single quotes, for example flags/'my-flag' eq 'true'.

              Supported operations include eq, ne, in, and logical operators and, or, not with parentheses. Functions such as startswith are supported by the OData parser.
            example: requestPath eq '/docs'
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/query/web-analytics/events/aggregate:
    get:
      description: Counts custom events on a project, within the requested date range. Results are either aggregated or broken down over time. Results can additionally be broken down by one dimension, and filtered by multiple dimensions.
      operationId: aggregateEvents
      security:
        - bearerToken: []
      summary: Aggregates custom events
      tags:
        - web-analytics
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  version:
                    type: number
                  query:
                    properties:
                      since:
                        type: string
                      until:
                        type: string
                      groupBy:
                        items:
                          oneOf:
                            - type: string
                            - type: string
                              enum:
                                - browserName
                                - country
                                - deviceType
                                - environment
                                - eventData
                                - eventName
                                - flags
                                - osName
                                - referrerHostname
                                - requestPath
                                - route
                                - utmCampaign
                                - utmContent
                                - utmMedium
                                - utmSource
                                - utmTerm
                        type: array
                      filter:
                        type: string
                      limit:
                        type: number
                    required:
                      - limit
                      - since
                      - until
                    type: object
                  data:
                    items:
                      properties:
                        projectId:
                          type: string
                        country:
                          type: string
                        deviceType:
                          type: string
                        environment:
                          type: string
                        requestPath:
                          type: string
                        referrerHostname:
                          type: string
                        osName:
