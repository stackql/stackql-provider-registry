openapi: 3.0.3
info:
  title: marketplace API
  description: vercel marketplace API
  version: 0.0.1
paths:
  /v1/installations/{integration_configuration_id}:
    patch:
      description: This endpoint updates an integration installation.
      operationId: update-installation
      security:
        - bearerToken: []
      summary: Update Installation
      tags:
        - marketplace
      responses:
        '204':
          description: ''
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - ready
                    - pending
                    - onboarding
                    - suspended
                    - resumed
                    - uninstalled
                    - error
                externalId:
                  type: string
                billingPlan:
                  type: object
                  required:
                    - id
                    - type
                    - name
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                      enum:
                        - prepayment
                        - subscription
                    name:
                      type: string
                    description:
                      type: string
                    paymentMethodRequired:
                      type: boolean
                    cost:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
                        required:
                          - label
                        additionalProperties: false
                    highlightedDetails:
                      type: array
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
                        required:
                          - label
                        additionalProperties: false
                    effectiveDate:
                      type: string
                  additionalProperties: true
                notification:
                  description: A notification to display to your customer. Send `null` to clear the current notification.
                  type: object
                  required:
                    - level
                    - title
                  properties:
                    level:
                      type: string
                      enum:
                        - info
                        - warn
                        - error
                    title:
                      type: string
                    message:
                      type: string
                    href:
                      type: string
                      format: uri
                      pattern: '^https?://|^sso:'
              additionalProperties: false
  /v1/installations/{integration_configuration_id}/account:
    get:
      description: Fetches the best account or user’s contact info
      operationId: get-account-info
      security:
        - bearerToken: []
      summary: Get Account Information
      tags:
        - marketplace
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  name:
                    type: string
                    description: The name of the team the installation is tied to.
                  url:
                    type: string
                    description: A URL linking to the installation in the Vercel Dashboard.
                  contact:
                    nullable: true
                    properties:
                      email:
                        type: string
                      name:
                        type: string
                    required:
                      - email
                    type: object
                    description: The best contact for the integration, which can change as team members and their roles change.
                required:
                  - contact
                  - url
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
  /v1/installations/{integration_configuration_id}/member/{member_id}:
    get:
      description: Returns the member role and other information for a given member ID ("user_id" claim in the SSO OIDC token).
      operationId: get-member
      security:
        - bearerToken: []
      summary: Get Member Information
      tags:
        - marketplace
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  role:
                    type: string
                    enum:
                      - ADMIN
                      - USER
                    description: '"The `ADMIN` role, by default, is provided to users capable of installing integrations, while the `USER` role can be granted to Vercel users with the Vercel `Billing` or Vercel `Viewer` role, which are considered to be Read-Only roles."'
                  globalUserId:
                    type: string
                  userEmail:
                    type: string
                required:
                  - id
                  - role
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          schema:
            type: string
  /v1/installations/{integration_configuration_id}/credentials/rotate:
    post:
      description: 'Issues a replacement access token for an installation, so a partner can rotate a credential it believes is compromised without the customer having to reinstall. Authenticated by the credential being replaced plus the integration''s client secret: a leaked access token on its own cannot rotate itself, which would otherwise let an attacker take over the installation and lock the partner out. The previous credential intentionally stays valid so in-flight requests keep working. Retiring it is a separate, explicit operation — a partner is never left mid-rotation without a working credential.'
      operationId: rotate-installation-credential
      security:
        - bearerToken: []
      summary: Rotate Installation Credential
      tags:
        - marketplace
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  scope:
                    type: string
                  expires_in:
                    type: number
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                      - oauth2-token
                required:
                  - access_token
                  - expires_in
                  - scope
                  - token_type
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - client_secret
              properties:
                client_secret:
                  type: string
                  maxLength: 512
                client_id:
                  type: string
              additionalProperties: false
  /v1/installations/{integration_configuration_id}/credentials/revoke:
    post:
      description: 'Retires a superseded installation credential, so a partner can complete a rotation it started with `POST /credentials/rotate` — the leaked credential stops working without the customer having to reinstall. Authenticated by a live installation credential plus the integration''s client secret. The credential to retire is named in the body rather than being the one that authenticates, so the ordinary flow is: rotate, store the replacement, then authenticate with the replacement and revoke the old one. Refuses to retire an installation''s last live credential. Rotation exists so remediation is not customer-visible; revoking the only credential would undo that and leave the install needing a reinstall.'
      operationId: revoke-installation-credential
      security:
        - bearerToken: []
      summary: Revoke Installation Credential
      tags:
        - marketplace
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  revoked:
                    type: boolean
                    enum:
                      - false
                      - true
                  already_revoked:
                    type: boolean
                    enum:
                      - false
                      - true
                required:
                  - already_revoked
                  - revoked
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - client_secret
              properties:
                token:
                  type: string
                  maxLength: 512
                client_secret:
                  type: string
                  maxLength: 512
                client_id:
                  type: string
              additionalProperties: false
  /v1/installations/{integration_configuration_id}/events:
    post:
      description: 'Partner notifies Vercel of any changes made to an Installation or a Resource. Vercel is expected to use `list-resources` and other read APIs to get the new state.<br/> <br/> `resource.updated` event should be dispatched when any state of a resource linked to Vercel is modified by the partner.<br/> `installation.updated` event should be dispatched when an installation''s billing plan is changed via the provider instead of Vercel.<br/> <br/> Resource update use cases: <br/> <br/> - The user renames a database in the partner’s application. The partner should dispatch a `resource.updated` event to notify Vercel to update the resource in Vercel’s datastores.<br/> - A resource has been suspended due to a lack of use. The partner should dispatch a `resource.updated` event to notify Vercel to update the resource''s status in Vercel''s datastores.<br/>'
      operationId: create-event
      security:
        - bearerToken: []
      summary: Create Event
      tags:
        - marketplace
      responses:
        '201':
          description: ''
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - event
              properties:
                event:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - installation.updated
                    billingPlanId:
                      type: string
                      description: The installation-level billing plan ID
                    productId:
                      type: string
                      description: Partner-provided product slug or id
                    resourceId:
                      type: string
                      description: Partner provided resource ID
                  required:
                    - type
                    - resourceId
                  additionalProperties: false
              additionalProperties: false
        required: true
  /v1/installations/{integration_configuration_id}/resources:
    get:
      description: Get all resources for a given installation ID.
      operationId: get-integration-resources
      security:
        - bearerToken: []
      summary: Get Integration Resources
      tags:
        - marketplace
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  resources:
                    items:
                      properties:
                        partnerId:
                          type: string
                          description: The ID provided by the partner for the given resource
                        internalId:
                          type: string
                          description: The ID assigned by Vercel for the given resource
                        name:
                          type: string
                          description: The name of the resource as it is recorded in Vercel
                        status:
                          type: string
                          enum:
                            - error
                            - onboarding
                            - pending
                            - ready
                            - resumed
                            - suspended
                            - uninstalled
                          description: The current status of the resource
                        productId:
                          type: string
                          description: The ID of the product the resource is derived from
                        protocolSettings:
                          properties:
                            experimentation:
                              properties:
                                edgeConfigSyncingEnabled:
                                  type: boolean
                                  enum:
                                    - false
                                    - true
                                edgeConfigId:
                                  type: string
                                globalConfigId:
                                  type: string
                                globalConfigSyncingEnabled:
                                  type: boolean
                                  enum:
                                    - false
                                    - true
                                edgeConfigTokenId:
                                  type: string
                              type: object
                            authentication:
                              properties:
                                appUrls:
                                  items:
                                    properties:
                                      url:
                                        type: string
                                      target:
                                        type: string
                                        enum:
                                          - development
                                          - preview
                                          - production
                                    required:
                                      - target
                                      - url
                                    type: object
                                  type: array
                              type: object
                          type: object
                          description: Any settings provided for the resource to support its product's protocols
                        notification:
                          properties:
                            title:
                              type: string
                            level:
                              type: string
                              enum:
                                - error
                                - info
                                - warn
                            message:
                              type: string
                            href:
                              type: string
                          required:
                            - level
                            - title
                          type: object
                          description: The notification, if set, displayed to the user when viewing the resource in Vercel
                        billingPlanId:
                          type: string
                          description: The ID of the billing plan the resource is subscribed to, if applicable
                        metadata:
                          additionalProperties:
                            oneOf:
                              - type: string
                              - type: number
                              - items:
                                  type: string
                                type: array
                                description: The configured metadata for the resource as defined by its product's Metadata Schema
                              - items:
                                  type: number
                                type: array
                                description: The configured metadata for the resource as defined by its product's Metadata Schema
                              - type: boolean
                                enum:
                                  - false
                                  - true
                          type: object
                          description: The configured metadata for the resource as defined by its product's Metadata Schema
                      required:
                        - internalId
                        - name
                        - partnerId
                        - productId
                      type: object
                    type: array
                required:
                  - resources
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
  /v1/installations/{integration_configuration_id}/resources/{resource_id}:
    get:
      description: Get a resource by its partner ID.
      operationId: get-integration-resource
      security:
        - bearerToken: []
      summary: Get Integration Resource
      tags:
        - marketplace
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                    description: The ID provided by the 3rd party provider for the given resource
                  internalId:
                    type: string
                    description: The ID assigned by Vercel for the given resource
                  name:
                    type: string
                    description: The name of the resource as it is recorded in Vercel
                  status:
                    type: string
                    enum:
                      - error
                      - onboarding
                      - pending
                      - ready
                      - resumed
                      - suspended
                      - uninstalled
                    description: The current status of the resource
                  productId:
                    type: string
                    description: The ID of the product the resource is derived from
                  protocolSettings:
                    properties:
                      experimentation:
                        properties:
                          edgeConfigId:
                            type: string
                          globalConfigId:
                            type: string
                        type: object
                      authentication:
                        properties:
                          appUrls:
                            items:
                              properties:
                                url:
                                  type: string
                                target:
                                  type: string
                                  enum:
                                    - development
                                    - preview
                                    - production
                              required:
                                - target
                                - url
                              type: object
                            type: array
                        type: object
                    type: object
                    description: Any settings provided for the resource to support its product's protocols
                  notification:
                    properties:
                      title:
                        type: string
                      level:
                        type: string
                        enum:
                          - error
                          - info
                          - warn
                      message:
                        type: string
                      href:
                        type: string
                    required:
                      - level
                      - title
                    type: object
                    description: The notification, if set, displayed to the user when viewing the resource in Vercel
                  billingPlanId:
                    type: string
                    description: The ID of the billing plan the resource is subscribed to, if applicable
                  metadata:
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: number
                        - items:
                            type: string
                          type: array
                          description: The configured metadata for the resource as defined by its product's Metadata Schema
                        - items:
                            type: number
                          type: array
                          description: The configured metadata for the resource as defined by its product's Metadata Schema
                        - type: boolean
                          enum:
                            - false
                            - true
                    type: object
                    description: The configured metadata for the resource as defined by its product's Metadata Schema
                required:
                  - id
                  - internalId
                  - name
                  - productId
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_configuration_id
          description: The ID of the integration configuration (installation) the resource belongs to
          in: path
          required: true
          schema:
            type: string
            description: The ID of the integration configuration (installation) the resource belongs to
        - name: resource_id
          description: The ID provided by the 3rd party provider for the given resource
          in: path
          required: true
          schema:
            type: string
            description: The ID provided by the 3rd party provider for the given resource
    delete:
      description: Delete a resource owned by the selected installation ID.
      operationId: delete-integration-resource
      security:
        - bearerToken: []
      summary: Delete Integration Resource
      tags:
        - marketplace
      responses:
        '204':
          description: ''
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
    put:
      description: This endpoint imports (upserts) a resource to Vercel's installation. This may be needed if resources can be independently created on the partner's side and need to be synchronized to Vercel. When importing as part of the user-initiated import flow, call this endpoint before redirecting the user back to Vercel. See the [Import existing resources flow](https://vercel.com/docs/integrations/create-integration/marketplace-flows#import-existing-resources-flow) for the full contract.
      operationId: import-resource
      security:
        - bearerToken: []
      summary: Import Resource
      tags:
        - marketplace
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  name:
                    type: string
                required:
                  - name
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
        '422':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - name
                - status
              properties:
                ownership:
                  type: string
                  enum:
                    - owned
                    - linked
                    - sandbox
                productId:
                  type: string
                name:
                  type: string
                status:
                  type: string
                  enum:
                    - ready
                    - pending
                    - onboarding
                    - suspended
                    - resumed
                    - uninstalled
                    - error
                metadata:
                  type: object
                  additionalProperties: true
                billingPlan:
                  type: object
                  required:
                    - id
                    - type
                    - name
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                      enum:
                        - prepayment
                        - subscription
                    name:
                      type: string
                    description:
                      type: string
                    paymentMethodRequired:
                      type: boolean
                    cost:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
                        required:
                          - label
                        additionalProperties: false
                    highlightedDetails:
                      type: array
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
                        required:
                          - label
                        additionalProperties: false
                    effectiveDate:
                      type: string
                  additionalProperties: true
                notification:
                  type: object
                  required:
                    - level
                    - title
                  properties:
                    level:
                      type: string
                      enum:
                        - info
                        - warn
                        - error
                    title:
                      type: string
                    message:
                      type: string
                    href:
                      type: string
                      format: uri
                      pattern: '^https?://|^sso:'
                extras:
                  type: object
                  additionalProperties: true
                secrets:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - value
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      prefix:
                        type: string
                      environmentOverrides:
                        type: object
                        description: 'A map of environments to override values for the secret, used for setting different values across deployments in production, preview, and development environments. Note: the same value will be used for all deployments in the given environment.'
                        properties:
                          development:
                            type: string
                            description: Value used for development environment.
                          preview:
                            type: string
                            description: Value used for preview environment.
                          production:
                            type: string
                            description: Value used for production environment.
                    additionalProperties: false
              additionalProperties: false
    patch:
      description: This endpoint updates an existing resource in the installation. All parameters are optional, allowing partial updates.
      operationId: update-resource
      security:
        - bearerToken: []
      summary: Update Resource
      tags:
        - marketplace
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  name:
                    type: string
                required:
                  - name
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
        '422':
          description: ''
      parameters:
        - name: integration_configuration_id
          in: path
          required: true
          schema:
            type: string
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ownership:
                  type: string
                  enum:
                    - owned
                    - linked
                    - sandbox
                name:
                  type: string
                status:
                  type: string
                  enum:
                    - ready
                    - pending
                    - onboarding
                    - suspended
                    - resumed
                    - uninstalled
                    - error
                metadata:
                  type: object
                  additionalProperties: true
                billingPlan:
                  type: object
                  required:
                    - id
                    - type
                    - name
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                      enum:
                        - prepayment
                        - subscription
                    name:
                      type: string
                    description:
                      type: string
                    paymentMethodRequired:
                      type: boolean
                    cost:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
                        required:
                          - label
                        additionalProperties: false
                    highlightedDetails:
                      type: array
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
                        required:
                          - label
                        additionalProperties: false
                    effectiveDate:
                      type: string
                  additionalProperties: true
                notification:
                  type: object
                  required:
                    - level
                    - title
                  properties:
                    level:
                      type: string
                      enum:
                        - info
                        - warn
                        - error
                    title:
                      type: string
                    message:
                      type: string
                    href:
                      type: string
                      format: uri
                      pattern: '^https?://|^sso:'
                extras:
                  type: object
                  additionalProperties: true
                secrets:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - value
                    properties:
                      name:
                        type: string
                      value:
