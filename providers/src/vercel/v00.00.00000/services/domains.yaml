openapi: 3.0.3
info:
  title: domains API
  description: vercel domains API
  version: 0.0.1
paths:
  /v6/domains/{domain}/config:
    get:
      description: Get a Domain's configuration.
      operationId: getDomainConfig
      security:
        - bearerToken: []
      summary: Get a Domain's configuration
      tags:
        - domains
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  configuredBy:
                    nullable: true
                    type: string
                    enum:
                      - A
                      - CNAME
                      - dns-01
                      - http
                      - null
                    description: 'How we see the domain''s configuration. - `CNAME`: Domain has a CNAME pointing to Vercel. - `A`: Domain''s A record is resolving to Vercel. - `http`: Domain is resolving to Vercel but may be behind a Proxy. - `dns-01`: Domain is not resolving to Vercel but dns-01 challenge is enabled. - `null`: Domain is not resolving to Vercel.'
                  acceptedChallenges:
                    items:
                      type: string
                      enum:
                        - dns-01
                        - http-01
                      description: Which challenge types the domain can use for issuing certs.
                    type: array
                    description: Which challenge types the domain can use for issuing certs.
                  recommendedIPv4:
                    items:
                      properties:
                        rank:
                          type: number
                        value:
                          items:
                            type: string
                          type: array
                      required:
                        - rank
                        - value
                      type: object
                      description: Recommended IPv4s for the domain. rank=1 is the preferred value(s) to use. Only using 1 ip value is acceptable.
                    type: array
                    description: Recommended IPv4s for the domain. rank=1 is the preferred value(s) to use. Only using 1 ip value is acceptable.
                  recommendedCNAME:
                    items:
                      properties:
                        rank:
                          type: number
                        value:
                          type: string
                      required:
                        - rank
                        - value
                      type: object
                      description: Recommended CNAMEs for the domain. rank=1 is the preferred value to use.
                    type: array
                    description: Recommended CNAMEs for the domain. rank=1 is the preferred value to use.
                  misconfigured:
                    type: boolean
                    enum:
                      - false
                      - true
                    description: Whether or not the domain is configured AND we can automatically generate a TLS certificate.
                required:
                  - acceptedChallenges
                  - configuredBy
                  - misconfigured
                  - recommendedCNAME
                  - recommendedIPv4
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - name: domain
          description: The name of the domain.
          in: path
          required: true
          schema:
            description: The name of the domain.
            type: string
            example: example.com
        - name: projectIdOrName
          description: The project id or name that will be associated with the domain. Use this when the domain is not yet associated with a project.
          in: query
          required: false
          schema:
            description: The project id or name that will be associated with the domain. Use this when the domain is not yet associated with a project.
            type: string
        - name: strict
          description: When true, the response will only include the nameservers assigned directly to the specified domain. When false and there are no nameservers assigned directly to the specified domain, the response will include the nameservers of the domain's parent zone.
          in: query
          required: false
          schema:
            enum:
              - 'true'
              - 'false'
            description: When true, the response will only include the nameservers assigned directly to the specified domain. When false and there are no nameservers assigned directly to the specified domain, the response will include the nameservers of the domain's parent zone.
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v9/domains/{domain}/verification:
    get:
      description: Get the TXT verification record needed to claim ownership of a domain for the authenticated team. The caller must add this TXT record to `_vercel.{domain}` in their DNS configuration, then call POST /domains/:domain/claim to complete the ownership transfer.
      operationId: getDomainVerificationRecord
      security:
        - bearerToken: []
      summary: Get Domain Verification Record
      tags:
        - domains
      responses:
        '200':
          description: Returns the TXT record needed to verify domain ownership.
          content:
            application/json:
              schema:
                properties:
                  txtRecord:
                    type: string
                  verificationDomain:
                    type: string
                required:
                  - txtRecord
                  - verificationDomain
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: domain
          description: The domain name to get the verification record for
          in: path
          required: true
          schema:
            description: The domain name to get the verification record for
            type: string
            example: example.com
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v9/domains/{domain}/claim:
    post:
      description: Claim ownership of a domain for the authenticated team by verifying a TXT record. The caller must first add a TXT record to `_vercel.{domain}` (obtained from GET /domains/:domain/verification), then call this endpoint to complete the ownership transfer. If the TXT record is verified, the domain ownership will be transferred to the caller's team, even if the domain is currently owned by another user or team.
      operationId: claimDomainOwnership
      security:
        - bearerToken: []
      summary: Claim Domain Ownership
      tags:
        - domains
      responses:
        '200':
          description: Domain ownership successfully claimed.
          content:
            application/json:
              schema:
                properties:
                  domain:
                    properties:
                      expiresAt:
                        nullable: true
                        type: number
                        description: Timestamp in milliseconds at which the domain is set to expire. null if not bought with Vercel.
                      verified:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: If the domain has the ownership verified.
                        example: true
                      nameservers:
                        items:
                          type: string
                        type: array
                        description: A list of the current nameservers of the domain.
                        example:
                          - ns1.nameserver.net
                          - ns2.nameserver.net
                      intendedNameservers:
                        items:
                          type: string
                        type: array
                        description: A list of the intended nameservers for the domain to point to Vercel DNS.
                        example:
                          - ns1.vercel-dns.com
                          - ns2.vercel-dns.com
                      customNameservers:
                        items:
                          type: string
                        type: array
                        description: A list of custom nameservers for the domain to point to. Only applies to domains purchased with Vercel.
                        example:
                          - ns1.nameserver.net
                          - ns2.nameserver.net
                      creator:
                        properties:
                          username:
                            type: string
                          email:
                            type: string
                          customerId:
                            nullable: true
                            type: string
                          isDomainReseller:
                            type: boolean
                            enum:
                              - false
                              - true
                          id:
                            type: string
                        required:
                          - email
                          - id
                          - username
                        type: object
                        description: An object containing information of the domain creator, including the user's id, username, and email.
                        example:
                          id: ZspSRT4ljIEEmMHgoDwKWDei
                          username: vercel_user
                          email: demo@example.com
                      echMode:
                        type: string
                        enum:
                          - auto
                          - disabled
                          - enabled
                        description: Whether the domain is enrolled in Encrypted Client Hello. `auto` leaves the decision to Vercel, `enabled` always enrolls, and `disabled` never enrolls and opts out of automatic enrollment.
                        example: auto
                      name:
                        type: string
                        description: The domain name.
                        example: example.com
                      teamId:
                        nullable: true
                        type: string
                      boughtAt:
                        nullable: true
                        type: number
                        description: If it was purchased through Vercel, the timestamp in milliseconds when it was purchased.
                        example: 1613602938882
                      createdAt:
                        type: number
                        description: Timestamp in milliseconds when the domain was created in the registry.
                        example: 1613602938882
                      id:
                        type: string
                        description: The unique identifier of the domain.
                        example: EmTbe5CEJyTk2yVAHBUWy4A3sRusca3GCwRjTC1bpeVnt1
                      renew:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Indicates whether the domain is set to automatically renew.
                        example: true
                      serviceType:
                        type: string
                        enum:
                          - external
                          - na
                          - zeit.world
                        description: The type of service the domain is handled by. `external` if the DNS is externally handled, `zeit.world` if handled with Vercel, or `na` if the service is not available.
                        example: zeit.world
                      transferredAt:
                        nullable: true
                        type: number
                        description: Timestamp in milliseconds at which the domain was successfully transferred into Vercel. `null` if the transfer is still processing or was never transferred in.
                        example: 1613602938882
                      transferStartedAt:
                        type: number
                        description: If transferred into Vercel, timestamp in milliseconds when the domain transfer was initiated.
                        example: 1613602938882
                      userId:
                        type: string
                    required:
                      - boughtAt
                      - createdAt
                      - creator
                      - echMode
                      - expiresAt
                      - id
                      - intendedNameservers
                      - name
                      - nameservers
                      - serviceType
                      - teamId
                      - userId
                      - verified
                    type: object
                required:
                  - domain
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: domain
          description: The domain name to claim ownership of
          in: path
          required: true
          schema:
            description: The domain name to claim ownership of
            type: string
            example: example.com
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/domains/{domain}/project-domains:
    get:
      description: List all project domains associated with an apex domain owned by the authenticated account.
      operationId: getDomainProjectDomains
      security:
        - bearerToken: []
      summary: List Project Domains by Apex Domain
      tags:
        - domains
      responses:
        '200':
          description: Successful response retrieving project domains for an apex domain.
          content:
            application/json:
              schema:
                properties:
                  projectDomains:
                    items:
                      properties:
                        name:
                          type: string
                        apexName:
                          type: string
                        projectId:
                          type: string
                        redirect:
                          nullable: true
                          type: string
                        redirectStatusCode:
                          nullable: true
                          type: number
                          enum:
                            - 301
                            - 302
                            - 307
                            - 308
                            - null
                        gitBranch:
                          nullable: true
                          type: string
                        customEnvironmentId:
                          nullable: true
                          type: string
                        updatedAt:
                          type: number
                        createdAt:
                          type: number
                        verified:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: '`true` if the domain is verified for use with the project. If `false` it will not be used as an alias on this project until the challenge in `verification` is completed.'
                        verification:
                          items:
                            properties:
                              type:
                                type: string
                              domain:
                                type: string
                              value:
                                type: string
                              reason:
                                type: string
                            required:
                              - domain
                              - reason
                              - type
                              - value
                            type: object
                            description: 'A list of verification challenges, one of which must be completed to verify the domain for use on the project. After the challenge is complete `POST /projects/:idOrName/domains/:domain/verify` to verify the domain. Possible challenges: - If `verification.type = TXT` the `verification.domain` will be checked for a TXT record matching `verification.value`.'
                          type: array
                          description: 'A list of verification challenges, one of which must be completed to verify the domain for use on the project. After the challenge is complete `POST /projects/:idOrName/domains/:domain/verify` to verify the domain. Possible challenges: - If `verification.type = TXT` the `verification.domain` will be checked for a TXT record matching `verification.value`.'
                      required:
                        - apexName
                        - name
                        - projectId
                        - verified
                      type: object
                    type: array
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - pagination
                  - projectDomains
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: domain
          description: The apex domain name.
          in: path
          required: true
          schema:
            description: The apex domain name.
            type: string
            example: example.com
        - name: limit
          description: Maximum number of project domains to list from a request.
          in: query
          required: false
          schema:
            description: Maximum number of project domains to list from a request.
            type: number
            example: 20
        - name: since
          description: Get project domains created after this JavaScript timestamp.
          in: query
          required: false
          schema:
            description: Get project domains created after this JavaScript timestamp.
            type: number
            example: 1609499532000
        - name: until
          description: Get project domains created before this JavaScript timestamp.
          in: query
          required: false
          schema:
            description: Get project domains created before this JavaScript timestamp.
            type: number
            example: 1612264332000
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v5/domains/{domain}:
    get:
      description: Get information for a single domain in an account or team.
      operationId: getDomain
      security:
        - bearerToken: []
      summary: Get Information for a Single Domain
      tags:
        - domains
      responses:
        '200':
          description: Successful response retrieving an information for a specific domains.
          content:
            application/json:
              schema:
                properties:
                  domain:
                    properties:
                      suffix:
                        type: boolean
                        enum:
                          - false
                          - true
                      expiresAt:
                        nullable: true
                        type: number
                        description: Timestamp in milliseconds at which the domain is set to expire. null if not bought with Vercel.
                      verified:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: If the domain has the ownership verified.
                        example: true
                      nameservers:
                        items:
                          type: string
                        type: array
                        description: A list of the current nameservers of the domain.
                        example:
                          - ns1.nameserver.net
                          - ns2.nameserver.net
                      intendedNameservers:
                        items:
                          type: string
                        type: array
                        description: A list of the intended nameservers for the domain to point to Vercel DNS.
                        example:
                          - ns1.vercel-dns.com
                          - ns2.vercel-dns.com
                      customNameservers:
                        items:
                          type: string
                        type: array
                        description: A list of custom nameservers for the domain to point to. Only applies to domains purchased with Vercel.
                        example:
                          - ns1.nameserver.net
                          - ns2.nameserver.net
                      creator:
                        properties:
                          username:
                            type: string
                          email:
                            type: string
                          customerId:
                            nullable: true
                            type: string
                          isDomainReseller:
                            type: boolean
                            enum:
                              - false
                              - true
                          id:
                            type: string
                        required:
                          - email
                          - id
                          - username
                        type: object
                        description: An object containing information of the domain creator, including the user's id, username, and email.
                        example:
                          id: ZspSRT4ljIEEmMHgoDwKWDei
                          username: vercel_user
                          email: demo@example.com
                      echMode:
                        type: string
                        enum:
                          - auto
                          - disabled
                          - enabled
                        description: Whether the domain is enrolled in Encrypted Client Hello. `auto` leaves the decision to Vercel, `enabled` always enrolls, and `disabled` never enrolls and opts out of automatic enrollment.
                        example: auto
                      name:
                        type: string
                        description: The domain name.
                        example: example.com
                      teamId:
                        nullable: true
                        type: string
                      boughtAt:
                        nullable: true
                        type: number
                        description: If it was purchased through Vercel, the timestamp in milliseconds when it was purchased.
                        example: 1613602938882
                      createdAt:
                        type: number
                        description: Timestamp in milliseconds when the domain was created in the registry.
                        example: 1613602938882
                      id:
                        type: string
                        description: The unique identifier of the domain.
                        example: EmTbe5CEJyTk2yVAHBUWy4A3sRusca3GCwRjTC1bpeVnt1
                      renew:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Indicates whether the domain is set to automatically renew.
                        example: true
                      serviceType:
                        type: string
                        enum:
                          - external
                          - na
                          - zeit.world
                        description: The type of service the domain is handled by. `external` if the DNS is externally handled, `zeit.world` if handled with Vercel, or `na` if the service is not available.
                        example: zeit.world
                      transferredAt:
                        nullable: true
                        type: number
                        description: Timestamp in milliseconds at which the domain was successfully transferred into Vercel. `null` if the transfer is still processing or was never transferred in.
                        example: 1613602938882
                      transferStartedAt:
                        type: number
                        description: If transferred into Vercel, timestamp in milliseconds when the domain transfer was initiated.
                        example: 1613602938882
                      userId:
                        type: string
                    required:
                      - boughtAt
                      - createdAt
                      - creator
                      - echMode
                      - expiresAt
                      - id
                      - intendedNameservers
                      - name
                      - nameservers
                      - serviceType
                      - suffix
                      - teamId
                      - userId
                      - verified
                    type: object
                required:
                  - domain
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
      parameters:
        - name: domain
          description: The name of the domain.
          in: path
          required: true
          schema:
            description: The name of the domain.
            type: string
            example: example.com
          x-vercel-cli:
            kind: argument
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v5/domains:
    get:
      description: Retrieves a list of domains registered for the authenticated user or team. By default it returns the last 20 domains if no limit is provided.
      operationId: getDomains
      security:
        - bearerToken: []
      summary: List all the domains
      tags:
        - domains
      responses:
        '200':
          description: Successful response retrieving a list of domains.
          content:
            application/json:
              schema:
                properties:
                  domains:
                    items:
                      properties:
                        expiresAt:
                          nullable: true
                          type: number
                          description: Timestamp in milliseconds at which the domain is set to expire. null if not bought with Vercel.
                        verified:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: If the domain has the ownership verified.
                          example: true
                        nameservers:
                          items:
                            type: string
                          type: array
                          description: A list of the current nameservers of the domain.
                          example:
                            - ns1.nameserver.net
                            - ns2.nameserver.net
                        intendedNameservers:
                          items:
                            type: string
                          type: array
                          description: A list of the intended nameservers for the domain to point to Vercel DNS.
                          example:
                            - ns1.vercel-dns.com
                            - ns2.vercel-dns.com
                        customNameservers:
                          items:
                            type: string
                          type: array
                          description: A list of custom nameservers for the domain to point to. Only applies to domains purchased with Vercel.
                          example:
                            - ns1.nameserver.net
                            - ns2.nameserver.net
                        creator:
                          properties:
                            username:
                              type: string
                            email:
                              type: string
                            customerId:
                              nullable: true
                              type: string
                            isDomainReseller:
                              type: boolean
                              enum:
                                - false
                                - true
                            id:
                              type: string
                          required:
                            - email
                            - id
                            - username
                          type: object
                          description: An object containing information of the domain creator, including the user's id, username, and email.
                          example:
                            id: ZspSRT4ljIEEmMHgoDwKWDei
                            username: vercel_user
                            email: demo@example.com
                        echMode:
                          type: string
                          enum:
                            - auto
                            - disabled
                            - enabled
                          description: Whether the domain is enrolled in Encrypted Client Hello. `auto` leaves the decision to Vercel, `enabled` always enrolls, and `disabled` never enrolls and opts out of automatic enrollment.
                          example: auto
                        name:
                          type: string
                          description: The domain name.
                          example: example.com
                        teamId:
                          nullable: true
                          type: string
                        boughtAt:
                          nullable: true
                          type: number
                          description: If it was purchased through Vercel, the timestamp in milliseconds when it was purchased.
                          example: 1613602938882
                        createdAt:
                          type: number
                          description: Timestamp in milliseconds when the domain was created in the registry.
                          example: 1613602938882
                        id:
                          type: string
                          description: The unique identifier of the domain.
                          example: EmTbe5CEJyTk2yVAHBUWy4A3sRusca3GCwRjTC1bpeVnt1
                        renew:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: Indicates whether the domain is set to automatically renew.
                          example: true
                        serviceType:
                          type: string
                          enum:
                            - external
                            - na
                            - zeit.world
                          description: The type of service the domain is handled by. `external` if the DNS is externally handled, `zeit.world` if handled with Vercel, or `na` if the service is not available.
                          example: zeit.world
                        transferredAt:
                          nullable: true
                          type: number
                          description: Timestamp in milliseconds at which the domain was successfully transferred into Vercel. `null` if the transfer is still processing or was never transferred in.
                          example: 1613602938882
                        transferStartedAt:
                          type: number
                          description: If transferred into Vercel, timestamp in milliseconds when the domain transfer was initiated.
                          example: 1613602938882
                        userId:
                          type: string
                      required:
                        - boughtAt
                        - createdAt
                        - creator
                        - echMode
                        - expiresAt
                        - id
                        - intendedNameservers
                        - name
                        - nameservers
                        - serviceType
                        - teamId
                        - userId
                        - verified
                      type: object
                    type: array
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - domains
                  - pagination
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '409':
          description: ''
        '410':
          description: ''
      x-vercel-cli:
        supportedSubcommands: true
        supportedProduction: false
        aliases:
          - ls
          - list
      parameters:
        - name: limit
          description: Maximum number of domains to list from a request.
          in: query
          schema:
            description: Maximum number of domains to list from a request.
            type: number
            example: 20
        - name: since
          description: Get domains created after this JavaScript timestamp.
          in: query
          schema:
            description: Get domains created after this JavaScript timestamp.
            type: number
            example: 1609499532000
        - name: until
