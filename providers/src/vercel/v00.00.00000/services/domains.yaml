      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  domain:
                    properties:
                      expiresAt:
                        nullable: true
                        type: number
                        description: Timestamp in milliseconds at which the domain is set to expire. null if not bought with Vercel.
                      verified:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: If the domain has the ownership verified.
                        example: true
                      nameservers:
                        items:
                          type: string
                        type: array
