openapi: 3.0.3
info:
  title: networking API
  description: vercel networking API
  version: 0.0.1
paths:
  /v1/connect/networks:
    get:
      description: Allows to list Secure Compute networks.
      operationId: listNetworks
      security:
        - bearerToken: []
      summary: List Secure Compute networks
      tags:
        - networking
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNetworksResponse'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - name: includeHostedZones
          description: Whether to include Hosted Zones in the response
          in: query
          schema:
            type: boolean
            description: Whether to include Hosted Zones in the response
            default: true
        - name: includePeeringConnections
          description: Whether to include VPC Peering connections in the response
          in: query
          schema:
            type: boolean
            description: Whether to include VPC Peering connections in the response
            default: true
        - name: includeProjects
          description: Whether to include projects in the response
          in: query
          schema:
            type: boolean
            description: Whether to include projects in the response
            default: true
        - name: search
          description: The query to use as a filter for returned networks
          in: query
          schema:
            type: string
            description: The query to use as a filter for returned networks
            maxLength: 255
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    post:
      description: Allows to create a Secure Compute network.
      operationId: createNetwork
      security:
        - bearerToken: []
      summary: Create a Secure Compute network
      tags:
        - networking
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: The account is missing a payment so payment method must be updated
        '403':
          description: You do not have permission to access this resource.
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                awsAvailabilityZoneIds:
                  type: array
                  items:
                    type: string
                    description: An AWS Availability Zone ID to use for the network
                    example: use1-az1
                  minItems: 2
                  maxItems: 2
                cidr:
                  type: string
                  description: The CIDR block of the network
                  example: 192.168.0.0/16
                name:
                  type: string
                  description: The name of the network
                  maxLength: 255
                region:
                  type: string
                  description: The region where the network will be created
                  example: iad1
              required:
                - cidr
                - name
                - region
  /v1/connect/networks/{network_id}:
    delete:
      description: Allows to delete a Secure Compute network.
      operationId: deleteNetwork
      security:
        - bearerToken: []
      summary: Delete a Secure Compute network
      tags:
        - networking
      responses:
        '204':
          description: ''
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - name: network_id
          description: The ID of the network to delete
          in: path
          required: true
          schema:
            type: string
            description: The ID of the network to delete
            example: uzrmorq7bn05z-fz
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    patch:
      description: Allows to update a Secure Compute network.
      operationId: updateNetwork
      security:
        - bearerToken: []
      summary: Update a Secure Compute network
      tags:
        - networking
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - name: network_id
          description: The unique identifier of the Secure Compute network
          in: path
          required: true
          schema:
            type: string
            description: The unique identifier of the Secure Compute network
            example: uzrmorq7bn05z-fz
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: The name of the Secure Compute network
                  maxLength: 255
              required:
                - name
    get:
      description: Allows to read a Secure Compute network.
      operationId: readNetwork
      security:
        - bearerToken: []
      summary: Read a Secure Compute network
      tags:
        - networking
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '410':
          description: ''
      parameters:
        - name: network_id
          description: The unique identifier of the Secure Compute network
          in: path
          required: true
          schema:
            type: string
            description: The unique identifier of the Secure Compute network
            example: uzrmorq7bn05z-fz
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/networking/privatelink/endpoints:
    post:
      description: Creates a PrivateLink endpoint for a project.
      operationId: createPrivateLinkEndpoint
      security:
        - bearerToken: []
      summary: Create a PrivateLink endpoint
      tags:
        - networking
      responses:
        '201':
          description: The PrivateLink endpoint was created and is being provisioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkEndpoint'
        '400':
          description: One of the provided values in the request body is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                projectId:
                  type: string
                  description: The project ID to create the PrivateLink endpoint for.
                  example: prj_a1b2c3d4e5f6g7h8
                name:
                  type: string
                  description: The name of the PrivateLink endpoint, used as its label in the Vercel dashboard.
                  example: payments-db
                  maxLength: 255
                vercelRegion:
                  type: string
                  description: The Vercel region to provision the endpoint in. Advanced Networking must be enabled for the project in that region. The endpoint service itself may live in another AWS region.
                  example: iad1
                awsServiceName:
                  type: string
                  description: The name of the AWS VPC endpoint service to connect to. Its AWS region is read from the name; when that region differs from the one behind `vercelRegion`, the service must allow cross-region access.
                  example: com.amazonaws.vpce.us-east-1.vpce-svc-0123456789abcdef0
                enablePrivateDns:
                  type: boolean
                  description: Whether to resolve the endpoint service through its private DNS names, which are then returned in `privateDnsNames`. Defaults to `false`, in which case the endpoint is reachable through the DNS names in `awsDnsEntries`.
                  example: false
              required:
                - projectId
                - name
                - vercelRegion
                - awsServiceName
    get:
      description: Lists all PrivateLink endpoints for a project.
      operationId: listPrivateLinkEndpoints
      security:
        - bearerToken: []
      summary: List PrivateLink endpoints
      tags:
        - networking
      responses:
        '200':
          description: The PrivateLink endpoints of the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPrivateLinkEndpointsResponse'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: The project ID to list PrivateLink endpoints for.
          in: query
          required: true
          schema:
            type: string
            description: The project ID to list PrivateLink endpoints for.
            example: prj_a1b2c3d4e5f6g7h8
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
  /v1/networking/privatelink/endpoints/{endpoint_id}:
    get:
      description: Reads a single PrivateLink endpoint.
      operationId: readPrivateLinkEndpoint
      security:
        - bearerToken: []
      summary: Read a PrivateLink endpoint
      tags:
        - networking
      responses:
        '200':
          description: The requested PrivateLink endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkEndpoint'
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: The project ID the PrivateLink endpoint belongs to.
          in: query
          required: true
          schema:
            type: string
            description: The project ID the PrivateLink endpoint belongs to.
            example: prj_a1b2c3d4e5f6g7h8
        - name: endpoint_id
          description: The unique identifier of the PrivateLink endpoint.
          in: path
          required: true
          schema:
            type: string
            description: The unique identifier of the PrivateLink endpoint.
            example: ple_a1b2c3d4e5f6g7h8
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    delete:
      description: Deletes a PrivateLink endpoint.
      operationId: deletePrivateLinkEndpoint
      security:
        - bearerToken: []
      summary: Delete a PrivateLink endpoint
      tags:
        - networking
      responses:
        '204':
          description: The PrivateLink endpoint was deleted.
          content:
            application/json:
              schema:
                nullable: true
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: The project ID the PrivateLink endpoint belongs to.
          in: query
          required: true
          schema:
            type: string
            description: The project ID the PrivateLink endpoint belongs to.
            example: prj_a1b2c3d4e5f6g7h8
        - name: endpoint_id
          description: The unique identifier of the PrivateLink endpoint.
          in: path
          required: true
          schema:
            type: string
            description: The unique identifier of the PrivateLink endpoint.
            example: ple_a1b2c3d4e5f6g7h8
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    patch:
      description: Updates a PrivateLink endpoint (name, privateDns).
      operationId: updatePrivateLinkEndpoint
      security:
        - bearerToken: []
      summary: Update a PrivateLink endpoint
      tags:
        - networking
      responses:
        '200':
          description: The updated PrivateLink endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkEndpoint'
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
      parameters:
        - name: projectId
          description: The project ID the PrivateLink endpoint belongs to.
          in: query
          required: true
          schema:
            type: string
            description: The project ID the PrivateLink endpoint belongs to.
            example: prj_a1b2c3d4e5f6g7h8
        - name: endpoint_id
          description: The unique identifier of the PrivateLink endpoint.
          in: path
          required: true
          schema:
            type: string
            description: The unique identifier of the PrivateLink endpoint.
            example: ple_a1b2c3d4e5f6g7h8
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: A new name for the PrivateLink endpoint. When omitted, the current name is kept.
                  example: payments-db
                  maxLength: 255
                enablePrivateDns:
                  type: boolean
                  description: When `true`, resolves the endpoint service through its private DNS names, which are then returned in `privateDnsNames`. When `false`, clears them. When omitted, the current setting is kept. At least one of `name` or `enablePrivateDns` must be provided.
                  example: false
  /v1/projects/{id_or_name}/shared-connect-links:
    patch:
      description: Allows configuring Static IPs for a project
      operationId: updateStaticIps
      security:
        - bearerToken: []
      summary: Configures Static IPs for a project
      tags:
        - networking
        - static-ips
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStaticIpsResponse'
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '402':
          description: ''
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '409':
          description: ''
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: id_or_name
          description: The unique project identifier or the project name
          in: path
          required: true
          schema:
            description: The unique project identifier or the project name
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                builds:
                  type: boolean
                  description: Whether to use Static IPs for builds.
                regions:
                  type: array
                  items:
                    type: string
                    maxLength: 4
                    description: The region in which to enable Static IPs.
                    example: iad1
                  minItems: 0
                  maxItems: 3
                  uniqueItems: true
              required:
                - builds
                - regions
components:
  schemas:
    Network:
      properties:
        awsAccountId:
          type: string
          description: The ID of the AWS Account in which the network exists.
        awsAvailabilityZoneIds:
          items:
            type: string
          type: array
          description: The IDs of the AWS Availability Zones in which the network exists, if specified during creation.
        awsRegion:
          type: string
          description: The AWS Region in which the network exists.
        cidr:
          type: string
          description: The CIDR range of the Network.
        createdAt:
          type: number
          description: The date at which the Network was created, represented as a UNIX timestamp since EPOCH.
        egressIpAddresses:
          items:
            type: string
          type: array
        hostedZones:
          properties:
            count:
              type: number
              description: The number of AWS Route53 Hosted Zones associated with the Network.
          required:
            - count
          type: object
          description: Metadata about any AWS Route53 Hosted Zones associated with the Network.
        id:
          type: string
          description: The unique identifier of the Network.
        name:
          type: string
          description: The name of the network.
        peeringConnections:
          properties:
            count:
              type: number
              description: The number of AWS Route53 Hosted Zones associated with the Network.
          required:
            - count
          type: object
          description: Metadata about any AWS Route53 Hosted Zones associated with the Network.
        projects:
          properties:
            count:
              type: number
            ids:
              items:
                type: string
              type: array
          required:
            - count
            - ids
          type: object
          description: Metadata about any projects associated with the Network.
        region:
          type: string
          description: The Vercel region in which the Network exists.
        status:
          type: string
          enum:
            - create_in_progress
            - delete_in_progress
            - error
            - ready
          description: The status of the Network.
        teamId:
          type: string
          description: The unique identifier of the Team that owns the Network.
        vpcId:
          type: string
          description: The ID of the VPC which hosts the network.
      required:
        - awsAccountId
        - awsRegion
        - cidr
        - createdAt
        - id
        - name
        - status
        - teamId
      type: object
    PrivateLinkEndpoint:
      properties:
        endpointId:
          type: string
          description: The unique identifier of the PrivateLink endpoint.
          example: ple_a1b2c3d4e5f6g7h8
        name:
          type: string
          description: The name of the PrivateLink endpoint, shown in the Vercel dashboard.
          example: payments-db
        teamId:
          type: string
          description: The identifier of the team that owns the PrivateLink endpoint.
          example: team_a1b2c3d4e5f6g7h8
        projectId:
          type: string
          description: The identifier of the project the PrivateLink endpoint belongs to.
          example: prj_a1b2c3d4e5f6g7h8
        vercelRegion:
          type: string
          description: The Vercel region the endpoint is provisioned in.
          example: iad1
        awsServiceName:
          type: string
          description: The AWS VPC endpoint service the endpoint connects to.
          example: com.amazonaws.vpce.us-east-1.vpce-svc-0123456789abcdef0
        vpcEndpointId:
          type: string
          description: The identifier of the underlying AWS VPC endpoint. Absent until AWS has created the endpoint.
          example: vpce-0123456789abcdef0
        awsDnsEntries:
          items:
            type: string
          type: array
          description: The regional DNS names assigned to the endpoint by AWS. Use these to reach the service when private DNS is not enabled.
          example:
            - vpce-0123456789abcdef0-a1b2c3d4.vpce-svc-0123456789abcdef0.us-east-1.vpce.amazonaws.com
        privateDnsNames:
          items:
            type: string
          type: array
          description: The private DNS names of the endpoint service, populated when private DNS is enabled for the endpoint.
          example:
            - payments.internal.example.com
        status:
          type: string
          enum:
            - available
            - creating
            - deleting
            - failed
            - pending-acceptance
            - provisioning
            - rejected
          description: 'The current state of the endpoint. - `creating`: the endpoint is being created. - `pending-acceptance`: waiting for the endpoint service owner to accept the connection. Only occurs for services that require manual acceptance. - `provisioning`: the connection was accepted and AWS is finishing setup. - `available`: the endpoint is fully provisioned and ready to use. - `rejected`: the endpoint service owner rejected the connection. - `failed`: the endpoint could not be provisioned. - `deleting`: the endpoint is being deleted.'
          example: available
        statusMessage:
          type: string
          description: A human-readable explanation of why the endpoint could not be provisioned. Only set when `status` is `failed`, and absent for every other status including `rejected`, since AWS does not report a rejection reason.
          example: Endpoint did not become available in time. Try deleting and recreating, or visit https://vercel.com/help if the issue persists.
        createdAt:
          type: number
          description: Timestamp in milliseconds since the UNIX epoch for when the endpoint was created.
          example: 1610963878358
        updatedAt:
          type: number
          description: Timestamp in milliseconds since the UNIX epoch for when the endpoint was last updated.
          example: 1610963878358
      required:
        - awsServiceName
        - createdAt
        - endpointId
        - name
        - projectId
        - status
        - teamId
        - updatedAt
        - vercelRegion
      type: object
      description: A PrivateLink endpoint, which connects a project to an AWS VPC endpoint service in a single region so that traffic reaches the service over AWS PrivateLink rather than the public internet.
    ListNetworksResponse:
      type: object
      properties:
        networks:
          type: array
          items:
            $ref: '#/components/schemas/Network'
    ListPrivateLinkEndpointsResponse:
      type: object
      properties:
        private_link_endpoints:
          type: array
          items:
            $ref: '#/components/schemas/PrivateLinkEndpoint'
    UpdateStaticIpsResponse:
      type: object
      properties:
        update_static_ips:
          type: array
          items:
            properties:
              envId:
                oneOf:
                  - type: string
                  - type: string
                    enum:
                      - preview
                      - production
              connectConfigurationId:
                type: string
              dc:
                type: string
              passive:
                type: boolean
                enum:
                  - false
                  - true
              buildsEnabled:
                type: boolean
                enum:
                  - false
                  - true
              aws:
                properties:
                  subnetIds:
                    items:
                      type: string
                    type: array
                  securityGroupId:
                    type: string
                required:
                  - subnetIds
                type: object
              createdAt:
                type: number
              updatedAt:
                type: number
            required:
              - buildsEnabled
              - connectConfigurationId
              - createdAt
              - envId
              - passive
              - updatedAt
            type: object
  x-stackQL-resources:
    networks:
      id: vercel.networking.networks
      name: networks
