openapi: 3.0.3
info:
  title: project_routes API
  description: vercel project_routes API
  version: 0.0.1
paths:
  /v1/projects/{project_id}/routes:
    get:
      description: Get the routing rules for a project. Supports searching by name/ID/pattern, filtering by route type, and diffing staged changes against production.
      operationId: getRoutes
      security:
        - bearerToken: []
      summary: Get project routing rules
      tags:
        - project-routes
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  routes:
                    items:
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the routing rule.
                        name:
                          type: string
                          description: Human-readable name for the routing rule.
                        description:
                          type: string
                          description: Optional description of what the routing rule does.
                        enabled:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: Whether the routing rule is enabled. Defaults to true.
                        staged:
                          type: boolean
                          enum:
                            - false
                            - true
                          description: Whether this route is new and not yet published to production. Set to true only when a route is first created via add-route. Cleared (set to false) when a version is promoted to production.
                        route:
                          properties:
                            src:
                              type: string
                            dest:
                              type: string
                            headers:
                              additionalProperties:
                                type: string
                              type: object
                            methods:
                              items:
                                type: string
                              type: array
                            continue:
                              type: boolean
                              enum:
                                - false
                                - true
                            override:
                              type: boolean
                              enum:
                                - false
                                - true
                            caseSensitive:
                              type: boolean
                              enum:
                                - false
                                - true
                            check:
                              type: boolean
                              enum:
                                - false
                                - true
                            important:
                              type: boolean
                              enum:
                                - false
                                - true
                            status:
                              type: number
                            has:
                              items:
                                oneOf:
                                  - properties:
                                      type:
                                        type: string
                                        enum:
                                          - host
                                      value:
                                        oneOf:
                                          - type: string
                                          - properties:
                                              eq:
                                                oneOf:
                                                  - type: string
                                                  - type: number
                                              neq:
                                                type: string
                                              inc:
                                                items:
                                                  type: string
                                                type: array
                                              ninc:
                                                items:
                                                  type: string
                                                type: array
                                              pre:
                                                type: string
                                              suf:
                                                type: string
                                              re:
                                                type: string
                                              gt:
                                                type: number
                                              gte:
                                                type: number
                                              lt:
                                                type: number
                                              lte:
                                                type: number
                                            type: object
                                    required:
                                      - type
                                      - value
                                    type: object
                                  - properties:
                                      type:
                                        type: string
                                        enum:
                                          - cookie
                                          - header
                                          - query
                                      key:
                                        type: string
                                      value:
                                        oneOf:
                                          - type: string
                                          - properties:
                                              eq:
                                                oneOf:
                                                  - type: string
                                                  - type: number
                                              neq:
                                                type: string
                                              inc:
                                                items:
                                                  type: string
                                                type: array
                                              ninc:
                                                items:
                                                  type: string
                                                type: array
                                              pre:
                                                type: string
                                              suf:
                                                type: string
                                              re:
                                                type: string
                                              gt:
                                                type: number
                                              gte:
                                                type: number
                                              lt:
                                                type: number
                                              lte:
                                                type: number
                                            type: object
                                    required:
                                      - key
                                      - type
                                    type: object
                              type: array
                            missing:
                              items:
                                oneOf:
                                  - properties:
                                      type:
                                        type: string
                                        enum:
                                          - host
                                      value:
                                        oneOf:
                                          - type: string
                                          - properties:
                                              eq:
                                                oneOf:
                                                  - type: string
                                                  - type: number
                                              neq:
                                                type: string
                                              inc:
                                                items:
                                                  type: string
                                                type: array
                                              ninc:
                                                items:
                                                  type: string
                                                type: array
                                              pre:
                                                type: string
                                              suf:
                                                type: string
                                              re:
                                                type: string
                                              gt:
                                                type: number
                                              gte:
                                                type: number
                                              lt:
                                                type: number
                                              lte:
                                                type: number
                                            type: object
                                    required:
                                      - type
                                      - value
                                    type: object
                                  - properties:
                                      type:
                                        type: string
                                        enum:
                                          - cookie
                                          - header
                                          - query
                                      key:
                                        type: string
                                      value:
                                        oneOf:
                                          - type: string
                                          - properties:
                                              eq:
                                                oneOf:
                                                  - type: string
                                                  - type: number
                                              neq:
                                                type: string
                                              inc:
                                                items:
                                                  type: string
                                                type: array
                                              ninc:
                                                items:
                                                  type: string
                                                type: array
                                              pre:
                                                type: string
                                              suf:
                                                type: string
                                              re:
                                                type: string
                                              gt:
                                                type: number
                                              gte:
                                                type: number
                                              lt:
                                                type: number
                                              lte:
                                                type: number
                                            type: object
                                    required:
                                      - key
                                      - type
                                    type: object
                              type: array
                            mitigate:
                              properties:
                                action:
                                  type: string
                                  enum:
                                    - challenge
                                    - deny
                              required:
                                - action
                              type: object
                            transforms:
                              items:
                                oneOf:
                                  - properties:
                                      type:
                                        type: string
                                        enum:
                                          - request.headers
                                          - request.query
                                          - response.headers
                                      op:
                                        type: string
                                        enum:
                                          - append
                                          - delete
                                          - set
                                      target:
                                        properties:
                                          key:
                                            oneOf:
                                              - type: string
                                              - properties:
                                                  eq:
                                                    oneOf:
                                                      - type: string
                                                      - type: number
                                                  neq:
                                                    type: string
                                                  inc:
                                                    items:
                                                      type: string
                                                    type: array
                                                  ninc:
                                                    items:
                                                      type: string
                                                    type: array
                                                  pre:
                                                    type: string
                                                  suf:
                                                    type: string
                                                  gt:
                                                    type: number
                                                  gte:
                                                    type: number
                                                  lt:
                                                    type: number
                                                  lte:
                                                    type: number
                                                type: object
                                        required:
                                          - key
                                        type: object
                                      args:
                                        oneOf:
                                          - type: string
                                          - items:
                                              type: string
                                            type: array
                                      env:
                                        items:
                                          type: string
                                        type: array
                                    required:
                                      - op
                                      - target
                                      - type
                                    type: object
                                  - properties:
                                      type:
                                        type: string
                                        enum:
                                          - request.path
                                      op:
                                        type: string
                                        enum:
                                          - set
                                      args:
                                        type: string
                                      env:
                                        items:
                                          type: string
                                        type: array
                                    required:
                                      - args
                                      - op
                                      - type
                                    type: object
                              type: array
                            env:
                              items:
                                type: string
                              type: array
                            locale:
                              properties:
                                redirect:
                                  additionalProperties:
                                    type: string
                                  type: object
                                cookie:
                                  type: string
                              type: object
                            source:
                              type: string
                              description: Aliases for `src`, `dest`, and `status`. These provide consistency with the `rewrites`, `redirects`, and `headers` fields which use `source`, `destination`, and `statusCode`. During normalization, the string forms are converted to their canonical forms (`src`, `dest`, `status`) and stripped from the route object. `destination` may also be a service-targeted object, in which case routing is delegated into the named service's internal route table and the object is preserved as-is (not folded into `dest`).
                            destination:
                              oneOf:
                                - type: string
                                - properties:
                                    type:
                                      type: string
                                      enum:
                                        - service
                                      description: Optional explicit format marker. The destination is identified by the presence of `service`, so `type` is no longer required.
                                    service:
                                      type: string
                                    path:
                                      type: string
                                      description: Routing-only path used to select a route inside the target service.
                                  required:
                                    - service
                                  type: object
                            statusCode:
                              type: number
                            middlewarePath:
                              type: string
                              description: A middleware key within the `output` key under the build result. Overrides a `middleware` definition.
                            middlewareRawSrc:
                              items:
                                type: string
                              type: array
                              description: The original middleware matchers.
                            middleware:
                              type: number
                              description: A middleware index in the `middleware` key under the build result
                            respectOriginCacheControl:
                              type: boolean
                              enum:
                                - false
                                - true
                          required:
                            - src
                          type: object
                          description: The route definition from @vercel/routing-utils.
                        rawSrc:
                          type: string
                          description: Original source pattern provided by user (path-to-regexp or regex). Used to display the user's input in API responses.
                        rawDest:
                          type: string
                          description: Original destination provided by user.
                        srcSyntax:
                          type: string
                          enum:
                            - equals
                            - path-to-regexp
                            - regex
                          description: The syntax type of the source pattern. Determines how the pattern is compiled to regex.
                        routeType:
                          type: string
                          enum:
                            - redirect
                            - rewrite
                            - set_status
                            - transform
                          description: Computed route type based on the route configuration. Only present in API responses, not stored in S3.
                      required:
                        - id
                        - name
                        - route
                      type: object
                      description: A routing rule with metadata for project-level routing.
                    type: array
                  version:
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the version.
                      s3Key:
                        type: string
                        description: The S3 key where the routing rules are stored.
                      lastModified:
                        type: number
                        description: Timestamp of when this version was last modified.
                      createdBy:
                        type: string
                        description: The user who created this version.
                      isStaging:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version is staged and not yet promoted to production.
                      isLive:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version is currently live in production.
                      ruleCount:
                        type: number
                        description: The number of routing rules in this version.
                      alias:
                        type: string
                        description: The staging alias for previewing this version.
                    required:
                      - createdBy
                      - id
                      - lastModified
                      - s3Key
                    type: object
                    description: A version of routing rules stored in S3.
                  diffCount:
                    type: number
                  limit:
                    properties:
                      maxRoutes:
                        type: number
                      currentRoutes:
                        type: number
                    required:
                      - currentRoutes
                      - maxRoutes
                    type: object
                required:
                  - diffCount
                  - routes
                  - version
                  - limit
                type: object
        '400':
          description: One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '404':
          description: ''
        '410':
          description: ''
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum:
              - rewrite
              - redirect
              - set_status
              - transform
        - name: diff
          in: query
          required: false
          schema:
            oneOf:
              - type: boolean
              - type: string
                enum:
                  - only
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
    put:
      description: Stage routing rules for a project. Set `overwrite` to true to replace all existing rules, or omit it to merge with existing rules by ID. Returns the new staged version.
      operationId: stageRoutes
      security:
        - bearerToken: []
      summary: Stage routing rules
      tags:
        - project-routes
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  version:
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the version.
                      s3Key:
                        type: string
                        description: The S3 key where the routing rules are stored.
                      lastModified:
                        type: number
                        description: Timestamp of when this version was last modified.
                      createdBy:
                        type: string
                        description: The user who created this version.
                      isStaging:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version is staged and not yet promoted to production.
                      isLive:
                        type: boolean
                        enum:
                          - false
                          - true
                        description: Whether this version is currently live in production.
                      ruleCount:
                        type: number
                        description: The number of routing rules in this version.
                      alias:
                        type: string
                        description: The staging alias for previewing this version.
                    required:
                      - createdBy
                      - id
                      - lastModified
                      - s3Key
                    type: object
                    description: A version of routing rules stored in S3.
                required:
                  - version
                type: object
        '400':
          description: |-
            One of the provided values in the request body is invalid.
            One of the provided values in the request query is invalid.
        '401':
          description: The request is not authorized.
        '403':
          description: You do not have permission to access this resource.
        '409':
          description: ''
        '410':
          description: ''
        '500':
          description: ''
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - description: The Team identifier to perform the request on behalf of.
          in: query
          name: teamId
          schema:
            type: string
            example: team_1a2b3c4d5e6f7g8h9i0j1k2l
        - description: The Team slug to perform the request on behalf of.
          in: query
          name: slug
          schema:
            type: string
            example: my-team-url-slug
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                overwrite:
                  type: boolean
                routes:
                  type: array
                  default: []
                  items:
                    type: object
                    required:
                      - id
                      - name
                      - route
                    properties:
                      id:
                        type: string
                        maxLength: 256
                      name:
                        type: string
                        maxLength: 256
                      description:
                        type: string
                        maxLength: 1024
                      enabled:
                        type: boolean
                      route:
                        type: object
                        required:
                          - src
                        properties:
                          src:
                            type: string
                          dest:
                            type: string
                          headers:
                            type: string
                            description: (opaque JSON object)
                          caseSensitive:
                            type: boolean
                          status:
                            type: integer
                          has:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - host
                                    - header
                                    - cookie
                                    - query
                                key:
                                  type: string
                                value:
                                  type: string
                          missing:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - host
                                    - header
                                    - cookie
                                    - query
                                key:
                                  type: string
                                value:
                                  type: string
                          transforms:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - request.headers
                                    - request.query
                                    - response.headers
                                op:
                                  type: string
                                  enum:
                                    - append
                                    - set
                                    - delete
                                target:
                                  type: string
                                  description: (opaque JSON object)
                                args: {}
                                env:
                                  type: array
                                  items:
                                    type: string
                          respectOriginCacheControl:
                            type: boolean
