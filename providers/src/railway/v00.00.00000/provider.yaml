id: railway
name: railway
version: v00.00.00000
providerServices:
  account:
    id: account:v00.00.00000
    name: account
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/account.yaml
    title: Account API
    version: v00.00.00000
    description: 'The authenticated user: profile, API tokens and the workspaces a token can reach, sessions, passkeys, SSH keys, linked provider accounts and preferences.'
  agents:
    id: agents:v00.00.00000
    name: agents
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/agents.yaml
    title: Agents and Sandboxes API
    version: v00.00.00000
    description: Cloud agents, their tasks and checkpoints, and sandboxes with their sessions, checkpoints and template builds.
  billing:
    id: billing:v00.00.00000
    name: billing
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/billing.yaml
    title: Billing and Usage API
    version: v00.00.00000
    description: 'Usage and cost: aggregated and estimated usage by measurement, per-project and per-service usage, workspace totals, and the billing customer with its credits and usage limits.'
  deployments:
    id: deployments:v00.00.00000
    name: deployments
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/deployments.yaml
    title: Deployments API
    version: v00.00.00000
    description: Deployments and their lifecycle (redeploy, restart, rollback, stop, cancel, remove), deployment events, instances, snapshots and deployment triggers.
  environments:
    id: environments:v00.00.00000
    name: environments
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/environments.yaml
    title: Environments API
    version: v00.00.00000
    description: Environments, staged changes and patches, change sets, environment history and pending work.
  integrations:
    id: integrations:v00.00.00000
    name: integrations
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/integrations.yaml
    title: Integrations API
    version: v00.00.00000
    description: 'Project integrations and linked accounts: GitHub repositories, branches and access, Heroku and Vercel imports.'
  networking:
    id: networking:v00.00.00000
    name: networking
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/networking.yaml
    title: Networking API
    version: v00.00.00000
    description: Service domains, custom domains, TCP proxies, private networks, egress gateways, and Railway-registered domains with their DNS records and email forwarding rules.
  observability:
    id: observability:v00.00.00000
    name: observability
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/observability.yaml
    title: Observability API
    version: v00.00.00000
    description: Build, deployment, environment, HTTP, DNS query and network flow logs; resource and HTTP metrics; traces; observability dashboards; project events; notification rules and deliveries.
  platform:
    id: platform:v00.00.00000
    name: platform
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/platform.yaml
    title: Platform API
    version: v00.00.00000
    description: 'Platform reference data: regions, platform status, public statistics, function runtimes, platform feature flags and signals.'
  projects:
    id: projects:v00.00.00000
    name: projects
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/projects.yaml
    title: Projects API
    version: v00.00.00000
    description: Projects and their lifecycle, members, invitations, invite codes, project tokens, permissions, canvas groups and compliance.
  services:
    id: services:v00.00.00000
    name: services
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/services.yaml
    title: Services API
    version: v00.00.00000
    description: Services, per-environment service instances (build and deploy configuration, redeploy), resource limits, auto deploy status and edge configuration.
  storage:
    id: storage:v00.00.00000
    name: storage
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/storage.yaml
    title: Storage API
    version: v00.00.00000
    description: Volumes, volume instances, backups and backup schedules, point-in-time recovery, and object storage buckets with their credentials.
  templates:
    id: templates:v00.00.00000
    name: templates
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/templates.yaml
    title: Templates API
    version: v00.00.00000
    description: 'Templates: search, details, services, metrics, deployment, publishing and workspace templates.'
  variables:
    id: variables:v00.00.00000
    name: variables
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/variables.yaml
    title: Variables API
    version: v00.00.00000
    description: 'Service and shared environment variables: rendered values, variable metadata, upsert and delete.'
  workspaces:
    id: workspaces:v00.00.00000
    name: workspaces
    preferred: true
    service:
      $ref: railway/v00.00.00000/services/workspaces.yaml
    title: Workspaces API
    version: v00.00.00000
    description: Workspaces, members, access groups, identity providers, trusted domains, policies, audit logs and compliance agreements.
config:
  auth:
    credentialsenvvar: RAILWAY_TOKEN
    type: bearer
