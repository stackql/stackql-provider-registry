servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=github_pr_info_results&__method=get:
    post:
      operationId: github_pr_info_results_get
      summary: Get info for a GitHub pull request, including fetch errors
      description: Get info for a GitHub pull request, including fetch errors. Backed by the Railway GraphQL query githubPRInfoResult.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.integrations.github_pr_info_results.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { githubPRInfoResult(prNumber: {{ .pr_number }} serviceId: "{{ .service_id }}") { error pr_info: prInfo { additions author body changed_files: changedFiles deletions mergeable state title } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: pr_number
          in: query
          required: true
          schema:
            type: integer
        - name: service_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One GitHubPRInfoResult row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      githubPRInfoResult:
                        $ref: '#/components/schemas/GitHubPRInfoResult'
