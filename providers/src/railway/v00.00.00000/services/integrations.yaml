components:
  schemas:
    GitHubAccess:
      type: object
      properties:
        has_access:
          type: boolean
        is_public:
          type: boolean
    GitHubBranch:
      type: object
      properties:
        name:
          type: string
    GithubIsRepoNameAvailableResult:
      type: object
      properties:
        result:
          type: boolean
          description: githubIsRepoNameAvailable value
    GitHubPRInfo:
      type: object
      properties:
        additions:
          type: integer
        author:
          type: string
        body:
          type: string
        changed_files:
          type: integer
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
          description: List of GitHubCheck objects
        deletions:
          type: integer
        mergeable:
          type: boolean
        state:
          type: string
        title:
          type: string
    GitHubPRInfoResult:
      type: object
      properties:
        error:
