openapi: 3.0.3
info:
  title: Storage API
  description: Volumes, volume instances, backups and backup schedules, point-in-time recovery, and object storage buckets with their credentials.
  version: v00.00.00000
servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=bucket_instances&__method=get:
    post:
      operationId: bucket_instances_get
      summary: Get the S3-compatible credentials for a bucket
      description: Get the S3-compatible credentials for a bucket. Backed by the Railway GraphQL query bucketInstanceDetails.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.storage.bucket_instances.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { bucketInstanceDetails(bucketId: "{{ .bucket_id }}" environmentId: "{{ .environment_id }}") { object_count: objectCount size_bytes: sizeBytes } }'
      x-stackql-protocol: graphql
      parameters:
        - name: bucket_id
          in: query
          required: true
          schema:
            type: string
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One BucketInstanceDetails row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bucketInstanceDetails:
                        $ref: '#/components/schemas/BucketInstanceDetails'
  /graphql/v2?__resource=bucket_s3_credentials&__method=list:
    post:
      operationId: bucket_s3_credentials_list
      summary: Get the S3-compatible credentials for a bucket
      description: Get the S3-compatible credentials for a bucket. Backed by the Railway GraphQL query bucketS3Credentials.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.storage.bucket_s3_credentials.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.bucketS3Credentials[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { bucketS3Credentials(bucketId: "{{ .bucket_id }}" environmentId: "{{ .environment_id }}" projectId: "{{ .project_id }}") { access_key_id: accessKeyId bucket_name: bucketName created_at: createdAt endpoint region secret_access_key: secretAccessKey url_style: urlStyle } }'
      x-stackql-protocol: graphql
      parameters:
        - name: bucket_id
          in: query
          required: true
          schema:
            type: string
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: project_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per BucketS3CompatibleCredentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bucketS3Credentials:
                        type: array
                        items:
                          $ref: '#/components/schemas/BucketS3CompatibleCredentials'
  /graphql/v2?__resource=bucket_s3_credentials&__method=reset:
    post:
      operationId: bucket_s3_credentials_reset
      summary: Reset the credentials for a bucket in an environment
      description: Reset the credentials for a bucket in an environment. Backed by the Railway GraphQL mutation bucketCredentialsReset.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bucket_id
                - environment_id
                - project_id
              properties:
                bucket_id:
                  type: string
                environment_id:
                  type: string
                project_id:
                  type: string
                redeploy_dependents:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                  description: Boolean passed as a string, for example 'true'.
      responses:
        '200':
          description: The BucketS3CompatibleCredentials the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bucketCredentialsReset:
                        $ref: '#/components/schemas/BucketS3CompatibleCredentials'
  /graphql/v2?__resource=buckets&__method=create:
    post:
      operationId: buckets_create
      summary: Create a bucket in a project
      description: Create a bucket in a project. Backed by the Railway GraphQL mutation bucketCreate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
              properties:
                environment_id:
                  type: string
                  description: '[unimplemented] The environment to deploy the bucket instances into. If `null`, the bucket will not be deployed to any environment. `undefined` will deploy to all environments.'
                name:
                  type: string
                  description: The name of the bucket.
                project_id:
                  type: string
                  description: The project to create the bucket in.
      responses:
        '200':
          description: The Bucket the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bucketCreate:
                        $ref: '#/components/schemas/Bucket'
  /graphql/v2?__resource=buckets&__method=list:
    post:
      operationId: buckets_list
      summary: Lists Bucket objects of a Project
      description: Lists Bucket objects of a Project. Backed by the Railway GraphQL query project.buckets.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.storage.buckets.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.project.buckets.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.project.buckets.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.buckets.pageInfo.hasNextPage
        query: 'query { project(id: "{{ .project_id }}") { buckets(first: 100{{ .cursor }}) { edges { node { created_at: createdAt deleted_at: deletedAt group_id: groupId id name parent_service_id: parentServiceId project { base_environment_id: baseEnvironmentId bot_pr_environments: botPrEnvironments created_at: createdAt deleted_at: deletedAt description expired_at: expiredAt feature_flags: featureFlags focused_pr_environments: focusedPrEnvironments id is_public: isPublic is_temp_project: isTempProject name pr_deploys: prDeploys primary_environment_id: primaryEnvironmentId subscription_plan_limit: subscriptionPlanLimit subscription_type: subscriptionType tracing_enabled: tracingEnabled tracing_sample_rate: tracingSampleRate updated_at: updatedAt viewer_role: viewerRole workspace_id: workspaceId } project_id: projectId updated_at: updatedAt } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per Bucket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          buckets:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Bucket'
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /graphql/v2?__resource=buckets&__method=update:
    post:
      operationId: buckets_update
      summary: Updates a bucket
      description: Updates a bucket. Backed by the Railway GraphQL mutation bucketUpdate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
              properties:
                id:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: The Bucket the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bucketUpdate:
                        $ref: '#/components/schemas/Bucket'
  /graphql/v2?__resource=mysql_pitr_restorable_windows&__method=get:
    post:
      operationId: mysql_pitr_restorable_windows_get
      summary: 'The point-in-time window a MySQL service''s binlog archive can restore to, resolved from the archive bucket: the oldest full backup (floor), the newest shipped binlog (ceiling) and every full backup''s timestamp'
      description: 'The point-in-time window a MySQL service''s binlog archive can restore to, resolved from the archive bucket: the oldest full backup (floor), the newest shipped binlog (ceiling) and every full backup''s timestamp. archiveConfigured is false when the service carries no complete BINLOG_ARCHIVE_* contract. Backed by the Railway GraphQL query mysqlPitrRestorableWindow.'
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.storage.mysql_pitr_restorable_windows.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { mysqlPitrRestorableWindow(environmentId: "{{ .environment_id }}" serviceId: "{{ .service_id }}") { archive_configured: archiveConfigured ceiling_at: ceilingAt fetched_at: fetchedAt floor_at: floorAt full_backup_count: fullBackupCount full_backups_taken_at: fullBackupsTakenAt lineage_count: lineageCount listing_truncated: listingTruncated } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: service_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One MysqlPitrRestorableWindow row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mysqlPitrRestorableWindow:
                        $ref: '#/components/schemas/MysqlPitrRestorableWindow'
  /graphql/v2?__resource=pitr_ha_clusters&__method=disable_pitr:
    post:
      operationId: pitr_ha_clusters_disable_pitr
      summary: Disables point-in-time recovery on an HA database cluster with the same rolling rollout as enable
      description: Disables point-in-time recovery on an HA database cluster with the same rolling rollout as enable. The backup bucket is left intact, so existing backup history is preserved. Backed by the Railway GraphQL mutation disablePitrForHaCluster.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - project_id
                - root_service_id
              properties:
                environment_id:
                  type: string
                  description: Environment containing the cluster.
                project_id:
                  type: string
                  description: Project containing the cluster (returned in payload).
                root_service_id:
                  type: string
                  description: Root service of the HA Postgres cluster.
      responses:
        '200':
          description: The TemplateDeployPayload the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      disablePitrForHaCluster:
                        $ref: '#/components/schemas/TemplateDeployPayload'
  /graphql/v2?__resource=pitr_ha_clusters&__method=enable_pitr:
    post:
      operationId: pitr_ha_clusters_enable_pitr
      summary: Enables point-in-time recovery on an HA database cluster (Postgres HA, MySQL HA) with a rolling, near-zero-downtime rollout across its members
      description: Enables point-in-time recovery on an HA database cluster (Postgres HA, MySQL HA) with a rolling, near-zero-downtime rollout across its members. Safe to retry. Backed by the Railway GraphQL mutation enablePitrForHaCluster.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - project_id
                - root_service_id
              properties:
                environment_id:
                  type: string
                  description: Environment containing the cluster.
                project_id:
                  type: string
                  description: Project containing the cluster (returned in payload).
                root_service_id:
                  type: string
                  description: Root service of the HA Postgres cluster.
      responses:
        '200':
          description: The TemplateDeployPayload the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enablePitrForHaCluster:
                        $ref: '#/components/schemas/TemplateDeployPayload'
  /graphql/v2?__resource=pitr_ha_clusters&__method=get_replication_health:
    post:
      operationId: pitr_ha_clusters_get_replication_health
      summary: Live replication health for an HA database cluster (Postgres HA, MySQL HA)
      description: Live replication health for an HA database cluster (Postgres HA, MySQL HA). Use it to gate the Enable/Disable PITR buttons so a rollout can't start while a member is too far behind to rejoin. Returns null when the service isn't an HA root. Backed by the Railway GraphQL query pitrHaClusterReplicationHealth.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.storage.pitr_ha_clusters.get_replication_health
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { pitrHaClusterReplicationHealth(environmentId: "{{ .environment_id }}" rootServiceId: "{{ .root_service_id }}") { all_healthy: allHealthy checked_at: checkedAt environment_id: environmentId members { healthy is_leader: isLeader lag_mb: lagMb patroni_name: patroniName service_id: serviceId service_name: serviceName state } reachable root_service_id: rootServiceId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: root_service_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One PitrHaClusterReplicationHealth row. Live replication health of an HA database cluster's members. Used to gate the Enable/Disable PITR buttons on the same 'caught up' definition the rollout enforces.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pitrHaClusterReplicationHealth:
                        $ref: '#/components/schemas/PitrHaClusterReplicationHealth'
  /graphql/v2?__resource=pitr_ha_workflows&__method=cancel:
    post:
      operationId: pitr_ha_workflows_cancel
      summary: Cancels an in-progress PITR enable/disable rollout on an HA database cluster and resets its progress so the UI re-reads from the live cluster
      description: Cancels an in-progress PITR enable/disable rollout on an HA database cluster and resets its progress so the UI re-reads from the live cluster. No-ops when nothing is running. Backed by the Railway GraphQL mutation cancelPitrHaWorkflow.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - root_service_id
              properties:
                environment_id:
                  type: string
                root_service_id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cancelPitrHaWorkflow:
                        $ref: '#/components/schemas/CancelPitrHaWorkflowResult'
  /graphql/v2?__resource=pitr_ha_workflows&__method=clear_progress:
    post:
      operationId: pitr_ha_workflows_clear_progress
      summary: Clears the recorded progress of a finished PITR enable/disable rollout so the Backups page starts fresh
      description: Clears the recorded progress of a finished PITR enable/disable rollout so the Backups page starts fresh. A rollout still in progress cannot be cleared. Backed by the Railway GraphQL mutation clearPitrHaWorkflowProgress.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - root_service_id
              properties:
                environment_id:
                  type: string
                root_service_id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      clearPitrHaWorkflowProgress:
                        $ref: '#/components/schemas/ClearPitrHaWorkflowProgressResult'
  /graphql/v2?__resource=pitr_ha_workflows&__method=get_progress:
    post:
      operationId: pitr_ha_workflows_get_progress
      summary: One-shot read of the current progress of a PITR enable/disable rollout on an HA database cluster
      description: One-shot read of the current progress of a PITR enable/disable rollout on an HA database cluster. Use it to rehydrate state on page load, then poll this field for updates. Returns null when no rollout has run recently. Backed by the Railway GraphQL query pitrHaWorkflowProgress.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.storage.pitr_ha_workflows.get_progress
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { pitrHaWorkflowProgress(environmentId: "{{ .environment_id }}" rootServiceId: "{{ .root_service_id }}") { cluster_mutated: clusterMutated completed_at: completedAt current_member_service_id: currentMemberServiceId direction engine environment_id: environmentId error_message: errorMessage failed_at_phase: failedAtPhase members { is_leader: isLeader service_id: serviceId service_name: serviceName status } new_leader_service_id: newLeaderServiceId phase project_id: projectId root_service_id: rootServiceId started_at: startedAt updated_at: updatedAt workflow_id: workflowId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: root_service_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One PitrHaWorkflowProgress row. Progress of an in-flight or recently completed PITR enable/disable rollout on an HA database cluster.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pitrHaWorkflowProgress:
                        $ref: '#/components/schemas/PitrHaWorkflowProgress'
  /graphql/v2?__resource=volume_instance_backup_schedules&__method=list:
    post:
      operationId: volume_instance_backup_schedules_list
      summary: List backups schedules of a volume instance
      description: List backups schedules of a volume instance. Backed by the Railway GraphQL query volumeInstanceBackupScheduleList.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.storage.volume_instance_backup_schedules.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.volumeInstanceBackupScheduleList[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { volumeInstanceBackupScheduleList(volumeInstanceId: "{{ .volume_instance_id }}") { created_at: createdAt cron id kind name retention_seconds: retentionSeconds } }'
      x-stackql-protocol: graphql
      parameters:
        - name: volume_instance_id
          in: query
          required: true
          description: The id of the volume instance to list the schedules of.
          schema:
            type: string
      responses:
        '200':
          description: One row per VolumeInstanceBackupSchedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      volumeInstanceBackupScheduleList:
                        type: array
                        items:
                          $ref: '#/components/schemas/VolumeInstanceBackupSchedule'
  /graphql/v2?__resource=volume_instance_backup_schedules&__method=update:
    post:
      operationId: volume_instance_backup_schedules_update
      summary: Manage schedule for backups of a volume instance
      description: Manage schedule for backups of a volume instance. Backed by the Railway GraphQL mutation volumeInstanceBackupScheduleUpdate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kinds
                - volume_instance_id
              properties:
                kinds:
                  type: array
                  items:
                    type: string
                    enum:
                      - DAILY
                      - MONTHLY
                      - WEEKLY
                  description: The frequency/retention of the backups.
                volume_instance_id:
                  type: string
                  description: The id of the volume instance to create a backup of.
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      volumeInstanceBackupScheduleUpdate:
                        $ref: '#/components/schemas/VolumeInstanceBackupScheduleUpdateResult'
  /graphql/v2?__resource=volume_instance_backups&__method=create:
    post:
      operationId: volume_instance_backups_create
      summary: Create backup of a volume instance
      description: Create backup of a volume instance. Backed by the Railway GraphQL mutation volumeInstanceBackupCreate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - volume_instance_id
              properties:
                name:
                  type: string
                  description: Optional name/label for the backup. Defaults to 'Manual' if not provided.
                volume_instance_id:
                  type: string
                  description: The id of the volume instance to create a backup of.
      responses:
        '200':
          description: The WorkflowId the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      volumeInstanceBackupCreate:
                        $ref: '#/components/schemas/WorkflowId'
  /graphql/v2?__resource=volume_instance_backups&__method=delete:
    post:
      operationId: volume_instance_backups_delete
      summary: Deletes volume instance backup
      description: Deletes volume instance backup. Backed by the Railway GraphQL mutation volumeInstanceBackupDelete.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - volume_instance_backup_id
                - volume_instance_id
              properties:
                volume_instance_backup_id:
                  type: string
                  description: The volume instance's backup id.
                volume_instance_id:
                  type: string
                  description: The volume instance's id.
      responses:
        '200':
          description: The WorkflowId the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      volumeInstanceBackupDelete:
                        $ref: '#/components/schemas/WorkflowId'
  /graphql/v2?__resource=volume_instance_backups&__method=list:
    post:
      operationId: volume_instance_backups_list
      summary: List backups of a volume instance
      description: List backups of a volume instance. Backed by the Railway GraphQL query volumeInstanceBackupList.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.storage.volume_instance_backups.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.volumeInstanceBackupList[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { volumeInstanceBackupList(volumeInstanceId: "{{ .volume_instance_id }}") { created_at: createdAt creator_id: creatorId expires_at: expiresAt external_id: externalId id name referenced_mb: referencedMB schedule_id: scheduleId used_mb: usedMB volume_instance_size_mb: volumeInstanceSizeMB } }'
