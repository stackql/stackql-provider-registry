openapi: 3.0.3
info:
  title: Templates API
  description: 'Templates: search, details, services, metrics, deployment, publishing and workspace templates.'
  version: v00.00.00000
servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=template_counts&__method=get:
    post:
      operationId: template_counts_get
      summary: Count all published templates
      description: Count all published templates. Backed by the Railway GraphQL query templatesCount.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.templates.template_counts.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.templatesCount[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: query { templatesCount }
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: One row carrying the value as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templatesCount:
                        type: array
                        items:
                          $ref: '#/components/schemas/TemplatesCountResult'
  /graphql/v2?__resource=template_metrics&__method=get:
    post:
      operationId: template_metrics_get
      summary: Get the metrics for a template
      description: Get the metrics for a template. Backed by the Railway GraphQL query templateMetrics.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.templates.template_metrics.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { templateMetrics(id: "{{ .id }}") { active_deployments: activeDeployments deployments_last90_days: deploymentsLast90Days earnings_last30_days: earningsLast30Days earnings_last90_days: earningsLast90Days eligible_for_support_bonus: eligibleForSupportBonus support_health: supportHealth template_health: templateHealth total_deployments: totalDeployments total_earnings: totalEarnings } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One TemplateMetrics row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateMetrics:
                        $ref: '#/components/schemas/TemplateMetrics'
  /graphql/v2?__resource=template_search&__method=list:
    post:
      operationId: template_search_list
      summary: Search published templates using the backend-ranked template search index
      description: Search published templates using the backend-ranked template search index. Backed by the Railway GraphQL query templateSearch.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.templates.template_search.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.templateSearch.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.templateSearch.pageInfo.endCursor
          terminateOnJsonPath: $.data.templateSearch.pageInfo.hasNextPage
        query: 'query { templateSearch(first: 100{{ .cursor }} {{ if .category }}category: "{{ .category }}" {{ end }}query: "{{ .query }}" {{ if .verified }}verified: {{ .verified }} {{ end }}) { edges { node { code creator_name: creatorName deployment_count: deploymentCount description health_score: healthScore id image is_verified: isVerified name } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: category
          in: query
          required: false
          description: If set, only templates in this category will be returned.
          schema:
            type: string
        - name: query
          in: query
          required: true
          description: Search term to filter templates. Empty query returns browse-style results.
          schema:
            type: string
        - name: verified
          in: query
          required: false
          description: If set, only templates matching this verification state will be returned.
          schema:
            type: boolean
      responses:
        '200':
          description: One row per TemplateSearchResult.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateSearch:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/TemplateSearchResult'
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /graphql/v2?__resource=template_services&__method=list:
    post:
      operationId: template_services_list
      summary: Lists TemplateService objects of a Template
      description: Lists TemplateService objects of a Template. Backed by the Railway GraphQL query template.services.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.templates.template_services.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.template.services.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.template.services.pageInfo.endCursor
          terminateOnJsonPath: $.data.template.services.pageInfo.hasNextPage
        query: 'query { template(code: "{{ .code }}" {{ if .template_id }}id: "{{ .template_id }}" {{ end }}{{ if .owner }}owner: "{{ .owner }}" {{ end }}{{ if .repo }}repo: "{{ .repo }}" {{ end }}) { services(first: 100{{ .cursor }}) { edges { node { config created_at: createdAt id template_id: templateId updated_at: updatedAt } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: template_id
          in: query
          required: false
          schema:
            type: string
        - name: owner
          in: query
          required: false
          schema:
            type: string
        - name: repo
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One row per TemplateService.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      template:
                        type: object
                        properties:
                          services:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  $ref: '#/components/schemas/TemplateService'
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
  /graphql/v2?__resource=templates&__method=clone:
    post:
      operationId: templates_clone
      summary: Duplicates an existing template
      description: Duplicates an existing template. Backed by the Railway GraphQL mutation templateClone.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                workspace_id:
                  type: string
      responses:
        '200':
          description: The Template the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateClone:
                        $ref: '#/components/schemas/Template'
  /graphql/v2?__resource=templates&__method=delete:
    post:
      operationId: templates_delete
      summary: Deletes a template
      description: Deletes a template. Backed by the Railway GraphQL mutation templateDelete.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                workspace_id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateDelete:
                        $ref: '#/components/schemas/TemplateDeleteResult'
  /graphql/v2?__resource=templates&__method=deploy_v2:
    post:
      operationId: templates_deploy_v2
      summary: Deploys a template using the serialized template config
      description: Deploys a template using the serialized template config. Backed by the Railway GraphQL mutation templateDeployV2.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serialized_config
                - template_id
              properties:
                environment_id:
                  type: string
                existing_root_service_id:
                  type: string
                  description: Use an existing service as the cluster root instead of creating a new one. A live cluster edge is resolved to the root it fronts. Used for HA cluster conversion where an existing postgres becomes the primary.
                project_id:
                  type: string
                serialized_config:
                  type: object
                stage_only:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                  description: If true, create resources and patch but don't deploy. Returns patchId for later commit. Boolean passed as a string, for example 'true'.
                template_id:
                  type: string
                workspace_id:
                  type: string
      responses:
        '200':
          description: The TemplateDeployPayload the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateDeployV2:
                        $ref: '#/components/schemas/TemplateDeployPayload'
  /graphql/v2?__resource=templates&__method=eject_service_source:
    post:
      operationId: templates_eject_service_source
      summary: Ejects a service from the template and creates a new repo in the provided org
      description: Ejects a service from the template and creates a new repo in the provided org. Backed by the Railway GraphQL mutation templateServiceSourceEject.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - repo_name
                - repo_owner
                - service_ids
                - upstream_url
              properties:
                project_id:
                  type: string
                repo_name:
                  type: string
                repo_owner:
                  type: string
                service_ids:
                  type: array
                  items:
                    type: string
                  description: Provide multiple serviceIds when ejecting services from a monorepo.
                upstream_url:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateServiceSourceEject:
                        $ref: '#/components/schemas/TemplateServiceSourceEjectResult'
  /graphql/v2?__resource=templates&__method=generate:
    post:
      operationId: templates_generate
      summary: Generate a template for a project
      description: Generate a template for a project. Backed by the Railway GraphQL mutation templateGenerate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
              properties:
                environment_id:
                  type: string
                project_id:
                  type: string
      responses:
        '200':
          description: The Template the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateGenerate:
                        $ref: '#/components/schemas/Template'
  /graphql/v2?__resource=templates&__method=get:
    post:
      operationId: templates_get
      summary: Get a template by code or ID or GitHub owner and repo
      description: Get a template by code or ID or GitHub owner and repo. Backed by the Railway GraphQL query template.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.templates.templates.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { template(code: "{{ .code }}" {{ if .id }}id: "{{ .id }}" {{ end }}{{ if .owner }}owner: "{{ .owner }}" {{ end }}{{ if .repo }}repo: "{{ .repo }}" {{ end }}) { active_projects: activeProjects canvas_config: canvasConfig category code community_thread_slug: communityThreadSlug created_at: createdAt creator { avatar has_public_profile: hasPublicProfile name username } demo_project_id: demoProjectId description guides { post video } health id image is_approved: isApproved is_v2_template: isV2Template is_verified: isVerified languages maintainer { avatar id name } name projects publishing_restriction_id: publishingRestrictionId readme recent_projects: recentProjects serialized_config: serializedConfig similar_templates: similarTemplates { code created_at: createdAt deploys description health image name user_id: userId workspace_id: workspaceId } status support_health_metrics: supportHealthMetrics tags total_payout: totalPayout updated_at: updatedAt workspace_id: workspaceId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: owner
          in: query
          required: false
          schema:
            type: string
        - name: repo
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One Template row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      template:
                        $ref: '#/components/schemas/Template'
  /graphql/v2?__resource=templates&__method=get_source_for_project:
    post:
      operationId: templates_get_source_for_project
      summary: Get the source template for a project
      description: Get the source template for a project. Backed by the Railway GraphQL query templateSourceForProject.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.templates.templates.get_source_for_project
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { templateSourceForProject(projectId: "{{ .project_id }}") { active_projects: activeProjects canvas_config: canvasConfig category code community_thread_slug: communityThreadSlug created_at: createdAt creator { avatar has_public_profile: hasPublicProfile name username } demo_project_id: demoProjectId description guides { post video } health id image is_approved: isApproved is_v2_template: isV2Template is_verified: isVerified languages maintainer { avatar id name } name projects publishing_restriction_id: publishingRestrictionId readme recent_projects: recentProjects serialized_config: serializedConfig similar_templates: similarTemplates { code created_at: createdAt deploys description health image name user_id: userId workspace_id: workspaceId } status support_health_metrics: supportHealthMetrics tags total_payout: totalPayout updated_at: updatedAt workspace_id: workspaceId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One Template row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateSourceForProject:
                        $ref: '#/components/schemas/Template'
  /graphql/v2?__resource=templates&__method=list:
    post:
      operationId: templates_list
      summary: Get all published templates
      description: Get all published templates. Backed by the Railway GraphQL query templates.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.templates.templates.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.templates.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.templates.pageInfo.endCursor
          terminateOnJsonPath: $.data.templates.pageInfo.hasNextPage
        query: 'query { templates(first: 100{{ .cursor }} {{ if .recommended }}recommended: {{ .recommended }} {{ end }}{{ if .verified }}verified: {{ .verified }} {{ end }}) { edges { node { active_projects: activeProjects canvas_config: canvasConfig category code community_thread_slug: communityThreadSlug created_at: createdAt creator { avatar has_public_profile: hasPublicProfile name username } demo_project_id: demoProjectId description guides { post video } health id image is_approved: isApproved is_v2_template: isV2Template is_verified: isVerified languages maintainer { avatar id name } name projects publishing_restriction_id: publishingRestrictionId readme recent_projects: recentProjects serialized_config: serializedConfig similar_templates: similarTemplates { code created_at: createdAt deploys description health image name user_id: userId workspace_id: workspaceId } status support_health_metrics: supportHealthMetrics tags total_payout: totalPayout updated_at: updatedAt workspace_id: workspaceId } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: recommended
          in: query
          required: false
          description: If set to true, only recommended templates will be returned.
          schema:
            type: boolean
        - name: verified
          in: query
          required: false
          description: If set to true, only verified templates will be returned.
          schema:
            type: boolean
      responses:
        '200':
          description: One row per Template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templates:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/Template'
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /graphql/v2?__resource=templates&__method=publish:
    post:
      operationId: templates_publish
      summary: Publishes a template
      description: Publishes a template. Backed by the Railway GraphQL mutation templatePublish.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - category
                - description
                - readme
              properties:
                id:
                  type: string
                category:
                  type: string
                demo_project_id:
                  type: string
                description:
                  type: string
                image:
                  type: string
                readme:
                  type: string
                workspace_id:
                  type: string
      responses:
        '200':
          description: The Template the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templatePublish:
                        $ref: '#/components/schemas/Template'
  /graphql/v2?__resource=templates&__method=revert:
    post:
      operationId: templates_revert
      summary: Reverts an HA cluster to standalone mode using template metadata to derive variables to remove
      description: Reverts an HA cluster to standalone mode using template metadata to derive variables to remove. Backed by the Railway GraphQL mutation templateRevert.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - project_id
                - root_service_id
                - template_code
              properties:
                environment_id:
                  type: string
                  description: The environment ID containing the cluster.
                group_id:
                  type: string
                  description: The group ID to delete when reverting.
                project_id:
                  type: string
                  description: The project ID containing the cluster.
                root_service_id:
                  type: string
                  description: The root service ID of the HA cluster to revert.
                stage_only:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                  description: If true, stage changes instead of deploying. Returns patchId. Boolean passed as a string, for example 'true'.
                template_code:
                  type: string
                  description: The template code to revert (e.g., 'ha-postgres').
      responses:
        '200':
          description: The TemplateDeployPayload the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateRevert:
                        $ref: '#/components/schemas/TemplateDeployPayload'
  /graphql/v2?__resource=templates&__method=unpublish:
    post:
      operationId: templates_unpublish
      summary: Unpublishes a template
      description: Unpublishes a template. Backed by the Railway GraphQL mutation templateUnpublish.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateUnpublish:
                        $ref: '#/components/schemas/TemplateUnpublishResult'
  /graphql/v2?__resource=templates&__method=update_volume:
    post:
      operationId: templates_update_volume
      summary: Sets the default size (in MB) for a volume mount in a template's config
      description: 'Sets the default size (in MB) for a volume mount in a template''s config. New volumes created when the template is deployed are provisioned at this size, clamped to the deployer''s plan maximum. Pass sizeMB: null to clear the pre-size and fall back to the plan default. Editing a template requires maintainer access. Backed by the Railway GraphQL mutation templateVolumeUpdate.'
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - template_id
                - volume_id
              properties:
                service_id:
                  type: string
                size_mb:
                  type: string
                  description: Integer passed as a string, for example '1'.
                template_id:
                  type: string
                volume_id:
                  type: string
      responses:
        '200':
          description: The Template the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateVolumeUpdate:
                        $ref: '#/components/schemas/Template'
  /graphql/v2?__resource=workspace_templates&__method=list:
    post:
      operationId: workspace_templates_list
      summary: Get all templates for a workspace
      description: Get all templates for a workspace. Backed by the Railway GraphQL query workspaceTemplates.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.templates.workspace_templates.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.workspaceTemplates.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.workspaceTemplates.pageInfo.endCursor
          terminateOnJsonPath: $.data.workspaceTemplates.pageInfo.hasNextPage
        query: 'query { workspaceTemplates(first: 100{{ .cursor }} workspaceId: "{{ .workspace_id }}") { edges { node { active_projects: activeProjects canvas_config: canvasConfig category code community_thread_slug: communityThreadSlug created_at: createdAt creator { avatar has_public_profile: hasPublicProfile name username } demo_project_id: demoProjectId description guides { post video } health id image is_approved: isApproved is_v2_template: isV2Template is_verified: isVerified languages maintainer { avatar id name } name projects publishing_restriction_id: publishingRestrictionId readme recent_projects: recentProjects serialized_config: serializedConfig similar_templates: similarTemplates { code created_at: createdAt deploys description health image name user_id: userId workspace_id: workspaceId } status support_health_metrics: supportHealthMetrics tags total_payout: totalPayout updated_at: updatedAt workspace_id: workspaceId } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per Template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspaceTemplates:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
