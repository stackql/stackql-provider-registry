          in: query
          required: false
          schema:
            type: string
        - name: include_deleted
          in: query
          required: false
          schema:
            type: boolean
        - name: project_id
          in: query
          required: false
          schema:
            type: string
        - name: service_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 'GraphQL input object literal of type DeploymentStatusInput, for example {field: "value"}.'
          schema:
            type: string
      responses:
