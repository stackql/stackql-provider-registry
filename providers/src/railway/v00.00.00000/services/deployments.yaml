openapi: 3.0.3
info:
  title: Deployments API
  description: Deployments and their lifecycle (redeploy, restart, rollback, stop, cancel, remove), deployment events, instances, snapshots and deployment triggers.
  version: v00.00.00000
servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=deployment_events&__method=list:
    post:
      operationId: deployment_events_list
      summary: Get the deployment events for a deployment
      description: Get the deployment events for a deployment. Backed by the Railway GraphQL query deploymentEvents.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.deployments.deployment_events.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.deploymentEvents.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.deploymentEvents.pageInfo.endCursor
          terminateOnJsonPath: $.data.deploymentEvents.pageInfo.hasNextPage
        query: 'query { deploymentEvents(first: 100{{ .cursor }} id: "{{ .id }}") { edges { node { completed_at: completedAt created_at: createdAt id payload { attempt detail duration_ms: durationMs error max_attempts: maxAttempts reason skipped } step } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per DeploymentEvent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deploymentEvents:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/DeploymentEvent'
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
