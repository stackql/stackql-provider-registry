components:
  schemas:
    Deployment:
      type: object
      properties:
        can_redeploy:
          type: boolean
        can_rollback:
          type: boolean
        created_at:
          type: string
          format: date-time
        creator:
          type: object
          properties:
            avatar:
              type: string
            email:
              type: string
            id:
              type: string
            name:
              type: string
          description: DeploymentCreator object
        deployment_stopped:
          type: boolean
          description: Check if a deployment's instances have all stopped
        diagnosis:
          type: object
        environment:
          type: object
          properties:
            can_access:
              type: boolean
            config_etag:
              type: string
              description: Opaque snapshot token of the environment's IaC-relevant config. Echo it back as baseConfigEtag on environmentApplyChangeSet for optimistic concurrency.
            created_at:
              type: string
              format: date-time
            deleted_at:
              type: string
              format: date-time
            id:
              type: string
            is_ephemeral:
              type: boolean
            name:
              type: string
            project_id:
              type: string
            unmerged_changes_count:
              type: integer
            updated_at:
              type: string
              format: date-time
          description: Environment object
