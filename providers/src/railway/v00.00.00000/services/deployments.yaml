        query: 'query { deployments(first: 100{{ .cursor }} input: { {{ if .environment_id }}environmentId: "{{ .environment_id }}" {{ end }}{{ if .include_deleted }}includeDeleted: {{ .include_deleted }} {{ end }}{{ if .project_id }}projectId: "{{ .project_id }}" {{ end }}{{ if .service_id }}serviceId: "{{ .service_id }}" {{ end }}{{ if .status }}status: {{ .status }} {{ end }}}) { edges { node { can_redeploy: canRedeploy can_rollback: canRollback created_at: createdAt creator { avatar email id name } deployment_stopped: deploymentStopped diagnosis environment { can_access: canAccess config_etag: configEtag created_at: createdAt deleted_at: deletedAt id is_ephemeral: isEphemeral name project_id: projectId unmerged_changes_count: unmergedChangesCount updated_at: updatedAt } environment_id: environmentId id instances { id status } meta project_id: projectId service_id: serviceId snapshot_id: snapshotId sockets { ipv6 port process_name: processName updated_at: updatedAt } static_url: staticUrl status status_updated_at: statusUpdatedAt suggest_add_service_domain: suggestAddServiceDomain updated_at: updatedAt url } } pageInfo { hasNextPage endCursor } } }'
