  /graphql/v2?__resource=service_edge_configs&__method=update_rules:
    post:
      operationId: service_edge_configs_update_rules
      summary: Replaces the service's edge rules (whole-section replace; null clears)
      description: Replaces the service's edge rules (whole-section replace; null clears). Rules are boolean expressions over request attributes plus one action (block/allow/challenge/redirect/cache_override), evaluated at the edge before requests reach the service. The ruleset is validated server-side; invalid rulesets are rejected with per-rule diagnostics and nothing is written. Rules without an id get a server-assigned stable `rul_` id. Backed by the Railway GraphQL mutation updateServiceEdgeRules.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - service_id
              properties:
                edge_rules:
                  type: object
                environment_id:
                  type: string
                service_id:
                  type: string
      responses:
        '200':
          description: The EdgeConfig the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updateServiceEdgeRules:
                        $ref: '#/components/schemas/EdgeConfig'
