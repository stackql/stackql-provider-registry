openapi: 3.0.3
info:
  title: Services API
  description: Services, per-environment service instances (build and deploy configuration, redeploy), resource limits, auto deploy status and edge configuration.
  version: v00.00.00000
servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=function_runtimes&__method=get:
    post:
      operationId: function_runtimes_get
      summary: Get information about a specific function runtime
      description: Get information about a specific function runtime. Backed by the Railway GraphQL query functionRuntime.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.services.function_runtimes.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { functionRuntime(name: {{ .name }}) { image latest_version: latestVersion { image tag } name versions { image tag } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            enum:
              - bun
      responses:
        '200':
          description: One FunctionRuntime row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      functionRuntime:
                        $ref: '#/components/schemas/FunctionRuntime'
  /graphql/v2?__resource=function_runtimes&__method=list:
