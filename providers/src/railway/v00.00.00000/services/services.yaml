  /graphql/v2?__resource=service_edge_configs&__method=purge_cache:
    post:
      operationId: service_edge_configs_purge_cache
      summary: Purges the CDN cache for a service
      description: Purges the CDN cache for a service. Bumps the edge config's purge epoch so every edge node treats prior cached entries as stale on next request. Idempotent; returns true even if CDN is disabled for the service. Backed by the Railway GraphQL mutation purgeServiceCache.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - scope
                - service_id
              properties:
                environment_id:
                  type: string
                scope:
                  type: string
                  enum:
                    - ALL
                    - HTML
                service_id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      purgeServiceCache:
                        $ref: '#/components/schemas/PurgeServiceCacheResult'
  /graphql/v2?__resource=service_edge_configs&__method=set_under_attack_mode:
    post:
      operationId: service_edge_configs_set_under_attack_mode
      summary: Enables or disables Under Attack Mode for a service
      description: Enables or disables Under Attack Mode for a service. While enabled, the edge serves a browser challenge to unverified visitors of the service's edge-routed domains; non-browser clients (APIs, webhooks) without a clearance cookie are rejected with a 429. Optionally time-boxed via durationSeconds, after which the mode disarms automatically. Backed by the Railway GraphQL mutation setServiceUnderAttackMode.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
                - environment_id
                - service_id
              properties:
                duration_seconds:
                  type: string
                  description: Integer passed as a string, for example '1'.
                enabled:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                  description: Boolean passed as a string, for example 'true'.
                environment_id:
                  type: string
                service_id:
                  type: string
      responses:
        '200':
          description: The EdgeConfig the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      setServiceUnderAttackMode:
                        $ref: '#/components/schemas/EdgeConfig'
