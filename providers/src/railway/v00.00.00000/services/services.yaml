        query: 'query { serviceInstance(environmentId: "{{ .environment_id }}" serviceId: "{{ .service_id }}") { edgeConfig { caching { default_ttl_seconds: defaultTtlSeconds html_caching: htmlCaching mode purge_on_deploy: purgeOnDeploy } edge_rules: edgeRules enabled id overrides purge_epoch: purgeEpoch purge_epoch_by_kind: purgeEpochByKind tracing { enabled sample_rate: sampleRate } under_attack_mode_until: underAttackModeUntil } } }'
