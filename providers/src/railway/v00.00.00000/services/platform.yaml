openapi: 3.0.3
info:
  title: Platform API
  description: 'Platform reference data: regions, platform status, public statistics, function runtimes, platform feature flags and signals.'
  version: v00.00.00000
servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=all_platform_feature_flags&__method=list:
    post:
      operationId: all_platform_feature_flags_list
      summary: Returns the platform feature flags enabled for the current user
      description: Returns the platform feature flags enabled for the current user. Backed by the Railway GraphQL query allPlatformFeatureFlags.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.platform.all_platform_feature_flags.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.allPlatformFeatureFlags[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { allPlatformFeatureFlags { flag rollout_percentage: rolloutPercentage status type } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: One row per PlatformFeatureFlagStatus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      allPlatformFeatureFlags:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlatformFeatureFlagStatus'
  /graphql/v2?__resource=platform_status&__method=get:
    post:
      operationId: platform_status_get
      summary: Get the current status of the platform
      description: Get the current status of the platform. Backed by the Railway GraphQL query platformStatus.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.platform.platform_status.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { platformStatus { incident { created_at: createdAt id message status url } is_stable: isStable maintenance { id message start status url } } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: One PlatformStatus row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      platformStatus:
                        $ref: '#/components/schemas/PlatformStatus'
  /graphql/v2?__resource=public_stats&__method=get:
    post:
      operationId: public_stats_get
      summary: Get public Railway stats
      description: Get public Railway stats. Backed by the Railway GraphQL query publicStats.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.platform.public_stats.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { publicStats { total_deployments_last_month: totalDeploymentsLastMonth total_logs_last_month: totalLogsLastMonth total_projects: totalProjects total_requests_last_month: totalRequestsLastMonth total_services: totalServices total_users: totalUsers } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: One PublicStats row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      publicStats:
                        $ref: '#/components/schemas/PublicStats'
  /graphql/v2?__resource=regions&__method=list:
    post:
      operationId: regions_list
      summary: List available regions
      description: List available regions. Backed by the Railway GraphQL query regions.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.platform.regions.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.regions[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { regions{{ if or .project_id }}({{ if .project_id }}projectId: "{{ .project_id }}" {{ end }}){{ end }} { country id location name region workspace_id: workspaceId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One row per Region.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      regions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Region'
  /graphql/v2?__resource=signal_changes&__method=list:
    post:
      operationId: signal_changes_list
      summary: Recent audit log entries for a signal
      description: Recent audit log entries for a signal. Backed by the Railway GraphQL query signalChanges. A SQL LIMIT is pushed down to the limit argument.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.platform.signal_changes.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.signalChanges[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { signalChanges({{ if .limit }}limit: {{ .limit }} {{ end }}name: "{{ .name }}" {{ if .owner }}owner: "{{ .owner }}" {{ end }}) { author_id: authorId created_at: createdAt id kind payload prev_state: prevState seq signal_id: signalId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: owner
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One row per SignalChange.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signalChanges:
                        type: array
                        items:
                          $ref: '#/components/schemas/SignalChange'
  /graphql/v2?__resource=signal_evaluations&__method=get:
    post:
      operationId: signal_evaluations_get
      summary: Evaluate a signal against an evaluation context (pure resolution; does not mutate registry state)
      description: Evaluate a signal against an evaluation context (pure resolution; does not mutate registry state). Backed by the Railway GraphQL query signalEvaluate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.platform.signal_evaluations.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { signalEvaluate(context: {{ .context }} name: "{{ .name }}" {{ if .owner }}owner: "{{ .owner }}" {{ end }}) { reason trace value } }'
      x-stackql-protocol: graphql
      parameters:
        - name: context
          in: query
          required: true
          description: 'GraphQL value literal, for example {key: "value"}.'
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: owner
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One SignalEvaluation row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signalEvaluate:
                        $ref: '#/components/schemas/SignalEvaluation'
  /graphql/v2?__resource=signals&__method=create:
    post:
      operationId: signals_create
      summary: Register a new signal for an owner scope
      description: Register a new signal for an owner scope. Backed by the Railway GraphQL mutation signalCreate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - default_
                - name
                - owner
                - type
              properties:
                default_:
                  type: object
                name:
                  type: string
                owner:
                  type: string
                type:
                  type: string
                  enum:
                    - bool
                    - json
                    - number
                    - string
                writable_by:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: The Signal the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signalCreate:
                        $ref: '#/components/schemas/Signal'
  /graphql/v2?__resource=signals&__method=delete:
    post:
      operationId: signals_delete
      summary: Delete a signal and its audit log
      description: Delete a signal and its audit log. Backed by the Railway GraphQL mutation signalDelete.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - owner
              properties:
                name:
                  type: string
                owner:
                  type: string
      responses:
        '200':
          description: The Signal the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signalDelete:
                        $ref: '#/components/schemas/Signal'
  /graphql/v2?__resource=signals&__method=get:
    post:
      operationId: signals_get
      summary: Fetch a single signal by owner scope and name
      description: Fetch a single signal by owner scope and name. Backed by the Railway GraphQL query signal.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.platform.signals.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { signal(name: "{{ .name }}" {{ if .owner }}owner: "{{ .owner }}" {{ end }}) { created_at: createdAt created_by: createdBy default_: default id name owner rules type updated_at: updatedAt version writable_by: writableBy } }'
      x-stackql-protocol: graphql
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: owner
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One Signal row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signal:
                        $ref: '#/components/schemas/Signal'
  /graphql/v2?__resource=signals&__method=list:
    post:
      operationId: signals_list
      summary: List signals registered for an owner scope
      description: List signals registered for an owner scope. Backed by the Railway GraphQL query signals.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.platform.signals.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.signals[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { signals{{ if or .owner }}({{ if .owner }}owner: "{{ .owner }}" {{ end }}){{ end }} { created_at: createdAt created_by: createdBy default_: default id name owner rules type updated_at: updatedAt version writable_by: writableBy } }'
      x-stackql-protocol: graphql
      parameters:
        - name: owner
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One row per Signal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signals:
                        type: array
                        items:
                          $ref: '#/components/schemas/Signal'
  /graphql/v2?__resource=signals&__method=replace:
    post:
      operationId: signals_replace
      summary: Replace a signal's type and default, clearing all rules
      description: Replace a signal's type and default, clearing all rules. Destructive — intended for CLI --force re-type. Backed by the Railway GraphQL mutation signalReplace.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - default_
                - name
                - owner
                - type
              properties:
                default_:
                  type: object
                name:
                  type: string
                owner:
                  type: string
                type:
                  type: string
                  enum:
                    - bool
                    - json
                    - number
                    - string
      responses:
        '200':
          description: The Signal the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signalReplace:
                        $ref: '#/components/schemas/Signal'
  /graphql/v2?__resource=signals&__method=rollback:
    post:
      operationId: signals_rollback
      summary: Restore a signal to the snapshot captured before a change (reads prevState from the target change row)
      description: Restore a signal to the snapshot captured before a change (reads prevState from the target change row). Backed by the Railway GraphQL mutation signalRollback.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - owner
                - seq
              properties:
                name:
                  type: string
                owner:
                  type: string
                seq:
                  type: string
      responses:
        '200':
          description: The Signal the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signalRollback:
                        $ref: '#/components/schemas/Signal'
  /graphql/v2?__resource=signals&__method=set_default:
    post:
      operationId: signals_set_default
      summary: Change a signal's canonical default (production floor)
      description: Change a signal's canonical default (production floor). Backed by the Railway GraphQL mutation signalDefaultSet.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - default_
                - name
                - owner
              properties:
                default_:
                  type: object
                name:
                  type: string
                owner:
                  type: string
      responses:
        '200':
          description: The Signal the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signalDefaultSet:
                        $ref: '#/components/schemas/Signal'
  /graphql/v2?__resource=signals&__method=set_rule:
    post:
      operationId: signals_set_rule
      summary: Attach or replace a rule on a signal
      description: Attach or replace a rule on a signal. Matching rules must agree at resolution time or the default is returned. Backed by the Railway GraphQL mutation signalRuleSet.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expression
                - name
                - owner
                - rule_id
                - value
              properties:
                expression:
                  type: object
                name:
                  type: string
                owner:
                  type: string
                rule_id:
                  type: string
                value:
                  type: object
      responses:
        '200':
          description: The Signal the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signalRuleSet:
                        $ref: '#/components/schemas/Signal'
  /graphql/v2?__resource=signals&__method=unset_rule:
    post:
      operationId: signals_unset_rule
      summary: Remove a rule from a signal
      description: Remove a rule from a signal. Backed by the Railway GraphQL mutation signalRuleUnset.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - owner
                - rule_id
              properties:
                name:
                  type: string
                owner:
                  type: string
                rule_id:
                  type: string
      responses:
        '200':
          description: The Signal the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signalRuleUnset:
                        $ref: '#/components/schemas/Signal'
components:
  schemas:
    PlatformFeatureFlagStatus:
      type: object
      properties:
        flag:
          type: string
          enum:
            - AGENT_USAGE_CH_INGEST
            - ALERT_SUS_USERS_CRON_KILLSWITCH
            - BUILDER_V4_ROLLOUT
            - BUILD_DEPLOY_QUEUE_V2
            - CAC_T0_KILLSWITCH
            - CANVAS_CROSS_ENV_GUARD_ENFORCE
            - CHAT_SANDBOX
            - CLICKHOUSE_WORKSPACE_LIMIT_ENFORCE
            - CS_MCP
            - CS_MCP_EXPRESS
            - CTRD_IMAGE_STORE_ROLLOUT
            - DEFAULT_USAGE_ALERTS
            - DEMO_PERCENTAGE_ROLLOUT
            - DEPLOYMENT_DIAGNOSIS_KILLSWITCH
            - DEPLOY_SUPERSEDE_ON_PUSH
            - DEV_STUDIO
            - DEV_STUDIO_ANON_PROVISIONS
            - DOMAIN_RECONCILE_KILLSWITCH
            - EMAIL_FORWARDING_KILLSWITCH
            - IN_DASHBOARD_SUPPORT
            - KAFKA_EPHEMERAL_ENVIRONMENT_UPDATES
            - LOGS_LONG_WINDOW_CHUNKING
            - NEW_PROJECT_PAGE
            - NEW_STRIPE_WEBHOOK_VERSION_ROLLOUT
            - NUDGES
            - NUDGE_BACKUP_SCHEDULE_MISSING
            - NUDGE_FIRST_DEPLOY_FAILED
            - NUDGE_PUBLIC_DB_URL_WITHIN_PROJECT
            - NUDGE_RESUBSCRIBE_AFTER_DEAD_INVOICE
            - NUDGE_UPGRADE_TO_PRO
            - OAUTH_DCR_KILLSWITCH
            - PRE_DEPLOY_TIMEOUT_KILLSWITCH
            - PROJECT_HISTORY_DUAL_WRITE
            - REMOVE_DEPLOYMENT_COMPACT
            - SERVICEINSTANCE_DATALOADER_FOR_STATIC_URL
            - SPLIT_USAGE_QUERIES
            - SSH_ANON_PROVISIONING
            - SSH_TRIAL_GUEST_IDLE_SLEEP
            - STRIPE_INTERACTIVE_SUBSCRIPTION_ON_SESSION
            - STRIPE_METERS_NEW_ACCOUNTS
            - STRIPE_METERS_SHADOW_ENABLED
            - STRIPE_WEBHOOK_DISPUTE_CANCELLATION
            - UPDATED_VM_QUERIES
            - USAGE_CH_READS
            - VM_COUPON_MIGRATION
            - VM_USAGE_CH_INGEST
            - WORKSPACE_MCP_KILLSWITCH
        rollout_percentage:
          type: integer
        status:
          type: boolean
        type:
          type: string
          enum:
            - BOOLEAN
            - PERCENTAGE
    PlatformStatus:
      type: object
      properties:
        incident:
          type: object
          properties:
            created_at:
              type: string
              format: date-time
            id:
              type: string
            message:
              type: string
            status:
              type: string
              enum:
                - IDENTIFIED
                - INVESTIGATING
                - MONITORING
                - RESOLVED
            url:
              type: string
          description: Incident object
        is_stable:
          type: boolean
        maintenance:
          type: object
          properties:
            id:
              type: string
            message:
              type: string
            start:
              type: string
              format: date-time
            status:
              type: string
              enum:
                - COMPLETED
                - INPROGRESS
                - NOTSTARTEDYET
            url:
              type: string
          description: Maintenance object
    PublicStats:
      type: object
      properties:
        total_deployments_last_month:
          type: integer
        total_logs_last_month:
          type: string
        total_projects:
          type: integer
        total_requests_last_month:
          type: string
        total_services:
          type: integer
        total_users:
          type: integer
    Region:
      type: object
      properties:
        country:
          type: string
          description: Region country
        id:
          type: string
          description: Region ID (airport code)
        location:
          type: string
        name:
          type: string
        region:
          type: string
        workspace_id:
          type: string
    Signal:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        default_:
          type: object
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        rules:
          type: object
        type:
          type: string
          enum:
            - bool
            - json
            - number
            - string
        updated_at:
          type: string
          format: date-time
        version:
          type: string
        writable_by:
          type: array
          items:
            type: string
    SignalChange:
      type: object
      properties:
        author_id:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: string
        kind:
          type: string
          enum:
            - default_changed
            - replaced
            - rollback
            - set
            - unset
        payload:
          type: object
        prev_state:
          type: object
        seq:
          type: string
        signal_id:
          type: string
    SignalEvaluation:
      type: object
      properties:
        reason:
          type: string
          enum:
            - DEFAULT
            - SPLIT
            - TARGETING_MATCH
        trace:
          type: object
        value:
          type: object
  x-stackQL-resources:
    all_platform_feature_flags:
      id: railway.platform.all_platform_feature_flags
      name: all_platform_feature_flags
      title: All Platform Feature Flags
      methods:
        list:
          operation:
            $ref: '#/paths/~1graphql~1v2?__resource=all_platform_feature_flags&__method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.allPlatformFeatureFlags
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/all_platform_feature_flags/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
    platform_status:
      id: railway.platform.platform_status
      name: platform_status
      title: Platform Status
      methods:
        get:
          operation:
            $ref: '#/paths/~1graphql~1v2?__resource=platform_status&__method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.platformStatus
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/platform_status/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
    public_stats:
      id: railway.platform.public_stats
      name: public_stats
      title: Public Stats
      methods:
        get:
          operation:
            $ref: '#/paths/~1graphql~1v2?__resource=public_stats&__method=get/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.publicStats
          x-stackql-protocol: graphql
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/public_stats/methods/get'
        insert: []
        update: []
        delete: []
        replace: []
    regions:
      id: railway.platform.regions
      name: regions
      title: Regions
      methods:
        list:
          operation:
            $ref: '#/paths/~1graphql~1v2?__resource=regions&__method=list/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
            objectKey: $.data.regions
          x-stackql-protocol: graphql
