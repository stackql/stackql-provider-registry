        cursor:
          strategy: page_info
          jsonPath: $.data.project.groups.pageInfo.endCursor
          terminateOnJsonPath: $.data.project.groups.pageInfo.hasNextPage
        query: 'query { project(id: "{{ .project_id }}") { groups(first: 100{{ .cursor }}) { edges { node { color group_id: groupId icon id is_collapsed: isCollapsed name project { base_environment_id: baseEnvironmentId bot_pr_environments: botPrEnvironments created_at: createdAt deleted_at: deletedAt description expired_at: expiredAt feature_flags: featureFlags focused_pr_environments: focusedPrEnvironments id is_public: isPublic is_temp_project: isTempProject name pr_deploys: prDeploys primary_environment_id: primaryEnvironmentId subscription_plan_limit: subscriptionPlanLimit subscription_type: subscriptionType tracing_enabled: tracingEnabled tracing_sample_rate: tracingSampleRate updated_at: updatedAt viewer_role: viewerRole workspace_id: workspaceId } project_id: projectId } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per Group.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        type: object
                        properties:
                          groups:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Group'
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
