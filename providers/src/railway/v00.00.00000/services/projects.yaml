        httpVerb: POST
        responseSelection:
          jsonPath: $.data.projectFavorites[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { projectFavorites({{ if .order_by }}orderBy: {{ .order_by }} {{ end }}workspaceId: "{{ .workspace_id }}") }'
      x-stackql-protocol: graphql
      parameters:
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - CREATED_AT_DESC
              - NAME_ASC
              - UPDATED_AT_DESC
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per value, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projectFavorites:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectFavoritesResult'
