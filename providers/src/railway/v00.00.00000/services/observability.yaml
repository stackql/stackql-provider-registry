        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.observability.traces.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.traces[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { traces({{ if .end_date }}endDate: "{{ .end_date }}" {{ end }}environmentId: "{{ .environment_id }}" {{ if .filter }}filter: "{{ .filter }}" {{ end }}{{ if .limit }}limit: {{ .limit }} {{ end }}{{ if .service_id }}serviceId: "{{ .service_id }}" {{ end }}{{ if .start_date }}startDate: "{{ .start_date }}" {{ end }}) { duration_ms: durationMs error_count: errorCount has_edge: hasEdge root_component: rootComponent root_server_address: rootServerAddress root_service_id: rootServiceId root_service_name: rootServiceName root_span_name: rootSpanName root_url_path: rootUrlPath service_name: serviceName span_count: spanCount started_at: startedAt trace_id: traceId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: end_date
          in: query
          required: false
          description: Latest span start to consider (ISO); defaults to now.
          schema:
            type: string
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: filter
          in: query
          required: false
          description: 'Filter expression over spans, e.g. @status:error @component:edge @duration:>500 @http.route:/api/users. Built-in fields: trace, span, name, serviceName, service, deployment, replica, component, kind, status, duration (ms). Any other @key looks the key up in the span and resource attributes; free text matches the span name. Prefix a term with - to exclude it.'
          schema:
            type: string
        - name: service_id
          in: query
          required: false
          description: Only traces with a span from this Railway service (optional).
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          description: Oldest span start to consider (ISO). Clamped to the project's retention; defaults to one hour ago.
          schema:
            type: string
      responses:
        '200':
          description: 'One row per TraceSummary. One trace of an environment: the request as a whole, summarised from its spans.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      traces:
                        type: array
                        items:
                          $ref: '#/components/schemas/TraceSummary'
  /graphql/v2?__resource=tracing_status&__method=list:
    post:
      operationId: tracing_status_list
      summary: Span activity per service of an environment within retention; a service absent from the list has produced no spans at all
      description: Span activity per service of an environment within retention; a service absent from the list has produced no spans at all. Backed by the Railway GraphQL query tracingStatus.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.observability.tracing_status.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.tracingStatus[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { tracingStatus(environmentId: "{{ .environment_id }}") { last_edge_span_at: lastEdgeSpanAt last_service_span_at: lastServiceSpanAt service_id: serviceId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per ServiceTracingStatus. Whether a service's requests are producing spans, per exporting hop. The edge tracing a request says nothing about the app behind it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tracingStatus:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceTracingStatus'
components:
