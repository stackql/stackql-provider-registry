openapi: 3.0.3
info:
  title: Observability API
  description: Build, deployment, environment, HTTP, DNS query and network flow logs; resource and HTTP metrics; traces; observability dashboards; project events; notification rules and deliveries.
  version: v00.00.00000
servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=build_logs&__method=list:
    post:
      operationId: build_logs_list
      summary: Fetch logs for a build
      description: Fetch logs for a build. Backed by the Railway GraphQL query buildLogs. A SQL LIMIT is pushed down to the limit argument.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.observability.build_logs.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.buildLogs[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { buildLogs(deploymentId: "{{ .deployment_id }}" {{ if .end_date }}endDate: "{{ .end_date }}" {{ end }}{{ if .filter }}filter: "{{ .filter }}" {{ end }}{{ if .limit }}limit: {{ .limit }} {{ end }}{{ if .start_date }}startDate: "{{ .start_date }}" {{ end }}) { attributes { key value } message severity tags { deployment_id: deploymentId deployment_instance_id: deploymentInstanceId environment_id: environmentId project_id: projectId service_id: serviceId snapshot_id: snapshotId } timestamp } }'
      x-stackql-protocol: graphql
      parameters:
        - name: deployment_id
          in: query
          required: true
          schema:
            type: string
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: filter
          in: query
          required: false
          description: Filter logs by a string. Providing an empty value will match all logs.
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One row per Log. The result of a logs query.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      buildLogs:
                        type: array
                        items:
                          $ref: '#/components/schemas/Log'
