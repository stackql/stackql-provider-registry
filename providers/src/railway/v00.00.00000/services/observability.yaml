      x-stackql-protocol: graphql
      parameters:
        - name: end_date
          in: query
          required: true
          description: The end of the period to get metrics for.
          schema:
            type: string
            format: date-time
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: method
          in: query
          required: false
