  /graphql/v2?__resource=events&__method=list:
    post:
      operationId: events_list
      summary: Gets the events for a project
      description: Gets the events for a project. Backed by the Railway GraphQL query events.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.observability.events.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.events.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.events.pageInfo.endCursor
          terminateOnJsonPath: $.data.events.pageInfo.hasNextPage
        query: 'query { events(first: 100{{ .cursor }} {{ if .environment_id }}environmentId: "{{ .environment_id }}" {{ end }}{{ if or .action .object .service_id }}filter: { {{ if .action }}action: {{ .action }} {{ end }}{{ if .object }}object: {{ .object }} {{ end }}{{ if .service_id }}serviceId: {{ .service_id }} {{ end }}} {{ end }}projectId: "{{ .project_id }}") { edges { node { action activity_payload: activityPayload created_at: createdAt environment { can_access: canAccess config_etag: configEtag created_at: createdAt deleted_at: deletedAt id is_ephemeral: isEphemeral name project_id: projectId unmerged_changes_count: unmergedChangesCount updated_at: updatedAt } environment_id: environmentId id object payload project_id: projectId severity } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: 'GraphQL input object literal of type EventStringListFilter, for example {field: "value"}.'
          schema:
            type: string
        - name: object
          in: query
          required: false
          description: 'GraphQL input object literal of type EventStringListFilter, for example {field: "value"}.'
          schema:
            type: string
        - name: service_id
          in: query
          required: false
          description: 'GraphQL input object literal of type EventStringListFilter, for example {field: "value"}.'
          schema:
            type: string
        - name: project_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per Event.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      events:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/Event'
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
