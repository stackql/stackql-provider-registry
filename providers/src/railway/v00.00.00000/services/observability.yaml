  /graphql/v2?__resource=dns_query_logs&__method=list:
    post:
      operationId: dns_query_logs_list
      summary: Fetch individual DNS query logs for an environment
      description: Fetch individual DNS query logs for an environment. Backed by the Railway GraphQL query dnsQueryLogs.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.observability.dns_query_logs.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.dnsQueryLogs[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { dnsQueryLogs({{ if .after_date }}afterDate: "{{ .after_date }}" {{ end }}{{ if .after_limit }}afterLimit: {{ .after_limit }} {{ end }}{{ if .anchor_date }}anchorDate: "{{ .anchor_date }}" {{ end }}{{ if .before_date }}beforeDate: "{{ .before_date }}" {{ end }}{{ if .before_limit }}beforeLimit: {{ .before_limit }} {{ end }}{{ if .deployment_instance_id }}deploymentInstanceId: "{{ .deployment_instance_id }}" {{ end }}environmentId: "{{ .environment_id }}" {{ if .filter }}filter: "{{ .filter }}" {{ end }}{{ if .service_id }}serviceId: "{{ .service_id }}" {{ end }}) { answers cname_chain: cnameChain deployment_id: deploymentId deployment_instance_id: deploymentInstanceId qname qtype queried_at: queriedAt query_zone: queryZone rcode service_id: serviceId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: after_date
          in: query
          required: false
          description: Latest date to look for logs after the anchor.
          schema:
            type: string
        - name: after_limit
          in: query
          required: false
          description: Limit logs returned after the anchor.
          schema:
            type: integer
        - name: anchor_date
          in: query
          required: false
          description: Target date time to look for logs.
          schema:
            type: string
        - name: before_date
          in: query
          required: false
          description: Oldest date to look for logs before the anchor.
          schema:
            type: string
        - name: before_limit
          in: query
          required: false
          description: Limit logs returned before the anchor.
          schema:
            type: integer
        - name: deployment_instance_id
          in: query
          required: false
          description: Filter by deployment instance / sandbox ID (optional).
          schema:
            type: string
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: filter
          in: query
          required: false
          description: Filter expression (e.g., @rcode:NXDOMAIN @qtype:A @domain:example.com @status:failed). Prefix a term with - to exclude it; repeat a key to match any of its values.
          schema:
            type: string
        - name: service_id
          in: query
          required: false
          description: Filter by service ID (optional).
          schema:
            type: string
      responses:
        '200':
          description: One row per DnsQueryLog. A single DNS query resolved for a service (one row per query, not aggregated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      dnsQueryLogs:
                        type: array
                        items:
                          $ref: '#/components/schemas/DnsQueryLog'
