          type: string
          enum:
            - external
            - internal
          description: Whether the query targeted the internal zone or the public internet
        rcode:
          type: string
          description: The DNS response code (NOERROR, NXDOMAIN, SERVFAIL, ...) or synthetic TIMEOUT/ERROR when no upstream response was received
        service_id:
