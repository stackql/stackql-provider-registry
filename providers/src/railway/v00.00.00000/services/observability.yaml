            type: string
        - name: path
          in: query
          required: false
          description: Filter by request path.
          schema:
            type: string
        - name: service_id
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          description: The start of the period to get metrics for.
          schema:
            type: string
            format: date-time
        - name: status_code
          in: query
          required: false
          description: Filter by HTTP status code (e.g., 200, 404, 500).
          schema:
            type: integer
        - name: step_seconds
          in: query
          required: false
          description: The frequency of data points in the response. If the `stepSeconds` is 60, then the response will contain one data point per minute.
          schema:
            type: integer
      responses:
        '200':
