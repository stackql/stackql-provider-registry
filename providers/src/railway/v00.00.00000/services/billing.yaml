openapi: 3.0.3
info:
  title: Billing and Usage API
  description: 'Usage and cost: aggregated and estimated usage by measurement, per-project and per-service usage, workspace totals, and the billing customer with its credits and usage limits.'
  version: v00.00.00000
servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=agent_usage&__method=get:
    post:
      operationId: agent_usage_get
      summary: Get unified AI usage for a workspace
      description: Get unified AI usage for a workspace. Backed by the Railway GraphQL query agentUsage.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.billing.agent_usage.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { agentUsage(workspaceId: "{{ .workspace_id }}") { billing_period_end: billingPeriodEnd hard_limit_cents: hardLimitCents has_custom_hard_limit: hasCustomHardLimit soft_limit_cents: softLimitCents total_used_cents: totalUsedCents usage_remaining: usageRemaining } }'
      x-stackql-protocol: graphql
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One AgentUsageSummary row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      agentUsage:
                        $ref: '#/components/schemas/AgentUsageSummary'
  /graphql/v2?__resource=agent_usage&__method=set_limit:
    post:
      operationId: agent_usage_set_limit
      summary: Set agent usage limit for a workspace
      description: Set agent usage limit for a workspace. Backed by the Railway GraphQL mutation agentUsageLimitSet.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hard_limit_cents
                - workspace_id
              properties:
                hard_limit_cents:
                  type: string
                  description: Integer passed as a string, for example '1'.
                soft_limit_cents:
                  type: string
                  description: Integer passed as a string, for example '1'.
                workspace_id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      agentUsageLimitSet:
                        $ref: '#/components/schemas/AgentUsageLimitSetResult'
  /graphql/v2?__resource=customers&__method=create_free_plan_subscription:
    post:
      operationId: customers_create_free_plan_subscription
      summary: Create a free plan subscription for a customer
      description: Create a free plan subscription for a customer. Backed by the Railway GraphQL mutation customerCreateFreePlanSubscription.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customerCreateFreePlanSubscription:
                        $ref: '#/components/schemas/CustomerCreateFreePlanSubscriptionResult'
  /graphql/v2?__resource=customers&__method=get:
    post:
      operationId: customers_get
      summary: Gets a Customer of a Workspace
      description: Gets a Customer of a Workspace. Backed by the Railway GraphQL query workspace.customer.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.billing.customers.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.workspace.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { workspace(workspaceId: "{{ .workspace_id }}") { customer { applied_credits: appliedCredits billing_address: billingAddress { city country line1 line2 name postal_code: postalCode state } billing_email: billingEmail billing_period: billingPeriod { end start } credit_balance: creditBalance current_usage: currentUsage default_payment_method: defaultPaymentMethod { id } default_payment_method_id: defaultPaymentMethodId has_exhausted_free_plan: hasExhaustedFreePlan id invoices { amount_due: amountDue amount_paid: amountPaid hosted_url: hostedURL invoice_id: invoiceId last_payment_error: lastPaymentError payment_intent_status: paymentIntentStatus pdf_url: pdfURL period_end: periodEnd period_start: periodStart reissued_invoice_from: reissuedInvoiceFrom reissued_invoice_of: reissuedInvoiceOf spend_commitment_prepayment: spendCommitmentPrepayment status subscription_id: subscriptionId subscription_status: subscriptionStatus total } is_prepaying: isPrepaying is_trialing: isTrialing is_usage_subscriber: isUsageSubscriber is_withdrawing_to_credits: isWithdrawingToCredits plan_limit_override: planLimitOverride { config id } remaining_usage_credit_balance: remainingUsageCreditBalance spend_commitment: spendCommitment { features id min_spend_amount_cents: minSpendAmountCents } state stripe_customer_id: stripeCustomerId subscriptions { billing_cycle_anchor: billingCycleAnchor cancel_at: cancelAt cancel_at_period_end: cancelAtPeriodEnd coupon_id: couponId id latest_invoice_id: latestInvoiceId next_invoice_current_total: nextInvoiceCurrentTotal next_invoice_date: nextInvoiceDate status } supported_withdrawal_platforms: supportedWithdrawalPlatforms tax_ids: taxIds { id type value } trial_days_remaining: trialDaysRemaining usage_limit: usageLimit { agent_hard_limit_cents: agentHardLimitCents agent_soft_limit_cents: agentSoftLimitCents customer_id: customerId hard_limit: hardLimit id is_over_limit: isOverLimit soft_limit: softLimit } workspace { adoption_level: adoptionLevel avatar created_at: createdAt discord_role: discordRole has2fa_enforcement: has2FAEnforcement has_automatic_diagnosis: hasAutomaticDiagnosis has_guardrails_access: hasGuardrailsAccess has_hipaa_baa: hasHipaaBAA has_saml: hasSAML id name plan preferred_region: preferredRegion project_count: projectCount redacted_due_to2fa_pending: redactedDueTo2FAPending restrict_project_visibility_to_groups: restrictProjectVisibilityToGroups slack_channel_id: slackChannelId subscription_plan_limit: subscriptionPlanLimit updated_at: updatedAt users_without2fa: usersWithout2FA } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One Customer row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspace:
                        type: object
                        properties:
                          customer:
                            $ref: '#/components/schemas/Customer'
  /graphql/v2?__resource=customers&__method=remove_usage_limit:
    post:
      operationId: customers_remove_usage_limit
      summary: Remove the usage limit for a customer
      description: Remove the usage limit for a customer. Backed by the Railway GraphQL mutation usageLimitRemove.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
              properties:
                customer_id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      usageLimitRemove:
                        $ref: '#/components/schemas/UsageLimitRemoveResult'
  /graphql/v2?__resource=customers&__method=set_usage_limit:
    post:
      operationId: customers_set_usage_limit
      summary: Set the usage limit for a customer
      description: Set the usage limit for a customer. Backed by the Railway GraphQL mutation usageLimitSet.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - soft_limit_dollars
              properties:
                customer_id:
                  type: string
                hard_limit_dollars:
                  type: string
                  description: Integer passed as a string, for example '1'.
                soft_limit_dollars:
                  type: string
                  description: Integer passed as a string, for example '1'.
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      usageLimitSet:
                        $ref: '#/components/schemas/UsageLimitSetResult'
  /graphql/v2?__resource=customers&__method=toggle_payouts_to_credits:
    post:
      operationId: customers_toggle_payouts_to_credits
      summary: Toggle whether a customer is automatically withdrawing to credits
      description: Toggle whether a customer is automatically withdrawing to credits. Backed by the Railway GraphQL mutation customerTogglePayoutsToCredits.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - is_withdrawing_to_credits
              properties:
                customer_id:
                  type: string
                is_withdrawing_to_credits:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                  description: Boolean passed as a string, for example 'true'.
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customerTogglePayoutsToCredits:
                        $ref: '#/components/schemas/CustomerTogglePayoutsToCreditsResult'
  /graphql/v2?__resource=estimated_usage&__method=list:
    post:
      operationId: estimated_usage_list
      summary: Get the estimated total cost of the project at the end of the current billing cycle
      description: Get the estimated total cost of the project at the end of the current billing cycle. If no `startDate` is provided, the usage for the current billing period of the project owner is returned. Backed by the Railway GraphQL query estimatedUsage.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.billing.estimated_usage.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.estimatedUsage[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { estimatedUsage({{ if .include_deleted }}includeDeleted: {{ .include_deleted }} {{ end }}measurements: {{ .measurements }} {{ if .project_id }}projectId: "{{ .project_id }}" {{ end }}{{ if .workspace_id }}workspaceId: "{{ .workspace_id }}" {{ end }}) { estimated_value: estimatedValue measurement project_id: projectId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: include_deleted
          in: query
          required: false
          description: Whether to include deleted projects in estimations.
          schema:
            type: boolean
        - name: measurements
          in: query
          required: true
          description: GraphQL list literal of MetricMeasurement values, for example [AGENT_CACHE_READ_TOKENS, AGENT_CACHE_WRITE_TOKENS].
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          schema:
            type: string
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One row per EstimatedUsage. The estimated usage of a single measurement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      estimatedUsage:
                        type: array
                        items:
                          $ref: '#/components/schemas/EstimatedUsage'
  /graphql/v2?__resource=project_service_usage&__method=list:
    post:
      operationId: project_service_usage_list
      summary: Get paginated usage grouped by project and service for a workspace
      description: Get paginated usage grouped by project and service for a workspace. Backed by the Railway GraphQL query projectServiceUsage.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.billing.project_service_usage.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.projectServiceUsage.usage[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.projectServiceUsage.pageInfo.endCursor
          terminateOnJsonPath: $.data.projectServiceUsage.pageInfo.hasNextPage
        query: 'query { projectServiceUsage(first: 50{{ .cursor }} endDate: "{{ .end_date }}" {{ if .include_deleted }}includeDeleted: {{ .include_deleted }} {{ end }}measurements: {{ .measurements }} startDate: "{{ .start_date }}" workspaceId: "{{ .workspace_id }}") { usage { measurement tags { deployment_id: deploymentId deployment_instance_id: deploymentInstanceId environment_id: environmentId project_id: projectId region service_id: serviceId volume_id: volumeId volume_instance_id: volumeInstanceId } value } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: include_deleted
          in: query
          required: false
          description: Whether to include deleted projects in usage.
          schema:
            type: boolean
        - name: measurements
          in: query
          required: true
          description: GraphQL list literal of MetricMeasurement values, for example [AGENT_CACHE_READ_TOKENS, AGENT_CACHE_WRITE_TOKENS].
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per AggregatedUsage. The aggregated usage of a single measurement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projectServiceUsage:
                        type: object
                        properties:
                          usage:
                            type: array
                            items:
                              $ref: '#/components/schemas/AggregatedUsage'
                          pageInfo:
                            type: object
                            properties:
                              endCursor:
                                type: string
                              hasNextPage:
                                type: boolean
  /graphql/v2?__resource=usage&__method=list:
    post:
      operationId: usage_list
      summary: Get the usage for a single project or all projects for a user/workspace
      description: Get the usage for a single project or all projects for a user/workspace. If no `projectId` or `workspaceId` is provided, the usage for the current user is returned. If no `startDate` is provided, the usage for the current billing period of the project owner is returned. Backed by the Railway GraphQL query usage.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.billing.usage.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.usage[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { usage({{ if .end_date }}endDate: "{{ .end_date }}" {{ end }}{{ if .group_by }}groupBy: {{ .group_by }} {{ end }}{{ if .include_deleted }}includeDeleted: {{ .include_deleted }} {{ end }}measurements: {{ .measurements }} {{ if .project_id }}projectId: "{{ .project_id }}" {{ end }}{{ if .start_date }}startDate: "{{ .start_date }}" {{ end }}{{ if .workspace_id }}workspaceId: "{{ .workspace_id }}" {{ end }}) { measurement tags { deployment_id: deploymentId deployment_instance_id: deploymentInstanceId environment_id: environmentId project_id: projectId region service_id: serviceId volume_id: volumeId volume_instance_id: volumeInstanceId } value } }'
      x-stackql-protocol: graphql
      parameters:
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: group_by
          in: query
          required: false
          description: What to group the aggregated usage by. By default, it is grouped over the entire project. GraphQL list literal of MetricTag values, for example [BILLABLE, DEPLOYMENT_ID].
          schema:
            type: string
        - name: include_deleted
          in: query
          required: false
          description: Whether to include deleted projects in the usage.
          schema:
            type: boolean
        - name: measurements
          in: query
          required: true
          description: GraphQL list literal of MetricMeasurement values, for example [AGENT_CACHE_READ_TOKENS, AGENT_CACHE_WRITE_TOKENS].
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One row per AggregatedUsage. The aggregated usage of a single measurement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      usage:
                        type: array
                        items:
                          $ref: '#/components/schemas/AggregatedUsage'
  /graphql/v2?__resource=workspace_usage_totals&__method=list:
    post:
      operationId: workspace_usage_totals_list
      summary: Workspace-wide SUM of the same UI usage rollup as `usage` grouped by project
      description: Workspace-wide SUM of the same UI usage rollup as `usage` grouped by project. Use this for the usage-page header so it does not wait on per-project rows. Deleted projects that still bill are included when `includeDeleted` is true. Backed by the Railway GraphQL query workspaceUsageTotals.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.billing.workspace_usage_totals.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.workspaceUsageTotals[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { workspaceUsageTotals({{ if .end_date }}endDate: "{{ .end_date }}" {{ end }}{{ if .include_deleted }}includeDeleted: {{ .include_deleted }} {{ end }}measurements: {{ .measurements }} {{ if .start_date }}startDate: "{{ .start_date }}" {{ end }}{{ if .workspace_id }}workspaceId: "{{ .workspace_id }}" {{ end }}) { measurement tags { deployment_id: deploymentId deployment_instance_id: deploymentInstanceId environment_id: environmentId project_id: projectId region service_id: serviceId volume_id: volumeId volume_instance_id: volumeInstanceId } value } }'
      x-stackql-protocol: graphql
      parameters:
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: include_deleted
          in: query
          required: false
          description: Whether to include deleted projects in the usage.
          schema:
            type: boolean
        - name: measurements
          in: query
          required: true
          description: GraphQL list literal of MetricMeasurement values, for example [AGENT_CACHE_READ_TOKENS, AGENT_CACHE_WRITE_TOKENS].
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One row per AggregatedUsage. The aggregated usage of a single measurement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspaceUsageTotals:
                        type: array
                        items:
                          $ref: '#/components/schemas/AggregatedUsage'
components:
  schemas:
    AgentUsageLimitSetResult:
      type: object
      properties:
        result:
          type: boolean
          description: Value returned by the agentUsageLimitSet mutation (Boolean!)
    AgentUsageSummary:
      type: object
      properties:
        billing_period_end:
          type: string
          format: date-time
        hard_limit_cents:
          type: integer
        has_custom_hard_limit:
          type: boolean
        soft_limit_cents:
          type: integer
        total_used_cents:
          type: integer
        usage_remaining:
          type: number
    AggregatedUsage:
      type: object
      properties:
        measurement:
          type: string
          enum:
            - AGENT_CACHE_READ_TOKENS
            - AGENT_CACHE_WRITE_TOKENS
            - AGENT_INPUT_TOKENS
            - AGENT_OUTPUT_TOKENS
            - AGENT_SPEND_USD
            - BACKUP_USAGE_GB
            - CPU_LIMIT
            - CPU_USAGE
            - CPU_USAGE_2
            - DISK_USAGE_GB
            - EPHEMERAL_DISK_USAGE_GB
            - MEASUREMENT_UNSPECIFIED
            - MEMORY_LIMIT_GB
            - MEMORY_USAGE_GB
            - NETWORK_RX_GB
            - NETWORK_TX_GB
            - UNRECOGNIZED
          description: The measurement that was aggregated.
        tags:
          type: object
          properties:
            deployment_id:
              type: string
            deployment_instance_id:
              type: string
            environment_id:
              type: string
            project_id:
              type: string
            region:
              type: string
            service_id:
              type: string
            volume_id:
              type: string
            volume_instance_id:
              type: string
          description: The tags that were used to group the metric. Only the tags that were used in the `groupBy` will be present.
        value:
          type: number
          description: The aggregated value.
    Customer:
      type: object
      properties:
        applied_credits:
          type: number
          description: The total amount of credits that have been applied during the current billing period.
        billing_address:
          type: object
          properties:
            city:
              type: string
            country:
              type: string
            line1:
              type: string
            line2:
              type: string
            name:
              type: string
            postal_code:
              type: string
            state:
              type: string
          description: CustomerAddress object
        billing_email:
          type: string
        billing_period:
          type: object
          properties:
            end:
              type: string
              format: date-time
            start:
              type: string
              format: date-time
          description: BillingPeriod object
        credit_balance:
          type: number
          description: The total amount of unused credits for the customer.
        current_usage:
          type: number
          description: The current usage for the customer. This value is cached and may not be up to date.
        default_payment_method:
          type: object
          properties:
            id:
              type: string
          description: PaymentMethod object
        default_payment_method_id:
          type: string
        has_exhausted_free_plan:
          type: boolean
        id:
          type: string
        invoices:
          type: array
          items:
            type: object
            properties:
              amount_due:
                type: number
              amount_paid:
                type: number
              hosted_url:
                type: string
              invoice_id:
                type: string
              last_payment_error:
                type: string
              payment_intent_status:
                type: string
              pdf_url:
                type: string
              period_end:
                type: string
              period_start:
                type: string
              reissued_invoice_from:
                type: string
              reissued_invoice_of:
                type: string
              spend_commitment_prepayment:
                type: boolean
              status:
                type: string
              subscription_id:
                type: string
              subscription_status:
                type: string
              total:
                type: integer
          description: List of CustomerInvoice objects
        is_prepaying:
          type: boolean
        is_trialing:
          type: boolean
        is_usage_subscriber:
          type: boolean
        is_withdrawing_to_credits:
          type: boolean
        plan_limit_override:
          type: object
          properties:
            config:
              type: object
            id:
              type: string
          description: PlanLimitOverride object
        remaining_usage_credit_balance:
          type: number
        spend_commitment:
          type: object
          properties:
            features:
              type: array
              items:
                type: string
            id:
              type: string
            min_spend_amount_cents:
              type: integer
          description: SpendCommitment object
        state:
          type: string
          enum:
            - ACTIVE
            - CANCELLED
            - INACTIVE
            - PAST_DUE
            - UNPAID
        stripe_customer_id:
          type: string
        subscriptions:
          type: array
          items:
            type: object
            properties:
              billing_cycle_anchor:
                type: string
                format: date-time
              cancel_at:
                type: string
              cancel_at_period_end:
                type: boolean
              coupon_id:
                type: string
              id:
                type: string
              latest_invoice_id:
                type: string
              next_invoice_current_total:
