openapi: 3.0.3
info:
  title: Account API
  description: 'The authenticated user: profile, API tokens and the workspaces a token can reach, sessions, passkeys, SSH keys, linked provider accounts and preferences.'
  version: v00.00.00000
servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=api_token_workspaces&__method=list:
    post:
      operationId: api_token_workspaces_list
      summary: Introspect the current API token and its accessible workspaces
      description: Introspect the current API token and its accessible workspaces. Backed by the Railway GraphQL query apiToken.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.account.api_token_workspaces.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.apiToken.workspaces[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: query { apiToken { workspaces { id name } } }
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: One row per ApiTokenWorkspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      apiToken:
                        type: object
                        properties:
                          workspaces:
                            type: array
                            items:
                              $ref: '#/components/schemas/ApiTokenWorkspace'
  /graphql/v2?__resource=api_tokens&__method=create:
    post:
      operationId: api_tokens_create
      summary: Creates a new API token
      description: Creates a new API token. Backed by the Railway GraphQL mutation apiTokenCreate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                workspace_id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      apiTokenCreate:
                        $ref: '#/components/schemas/ApiTokenCreateResult'
