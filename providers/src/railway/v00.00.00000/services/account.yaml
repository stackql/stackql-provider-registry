  /graphql/v2?__resource=api_tokens&__method=list:
    post:
      operationId: api_tokens_list
      summary: Gets all API tokens for the authenticated user
      description: Gets all API tokens for the authenticated user. Backed by the Railway GraphQL query apiTokens.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.account.api_tokens.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.apiTokens.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.apiTokens.pageInfo.endCursor
          terminateOnJsonPath: $.data.apiTokens.pageInfo.hasNextPage
        query: 'query { apiTokens(first: 100{{ .cursor }}) { edges { node { display_token: displayToken expires_at: expiresAt id name workspace_id: workspaceId } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: One row per ApiToken.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      apiTokens:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/ApiToken'
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
