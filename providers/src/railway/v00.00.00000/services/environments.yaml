        query: 'query { environment(id: "{{ .id }}" {{ if .project_id }}projectId: "{{ .project_id }}" {{ end }}) { can_access: canAccess canvas_group_refs: canvasGroupRefs config config_etag: configEtag created_at: createdAt deleted_at: deletedAt iac_partials: iacPartials id is_ephemeral: isEphemeral meta { base_branch: baseBranch branch latest_successful_git_hub_deployment_id: latestSuccessfulGitHubDeploymentId pr_comment_id: prCommentId pr_number: prNumber pr_repo: prRepo pr_title: prTitle skipped_resource_ids: skippedResourceIds } name project_id: projectId unmerged_changes_count: unmergedChangesCount updated_at: updatedAt } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One Environment row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environment:
                        $ref: '#/components/schemas/Environment'
  /graphql/v2?__resource=environments&__method=import_docker_compose:
    post:
      operationId: environments_import_docker_compose
      summary: Create services and volumes from docker compose
      description: Create services and volumes from docker compose. Backed by the Railway GraphQL mutation dockerComposeImport.
