              type: string
            email:
              type: string
            id:
              type: string
            name:
              type: string
            username:
              type: string
          description: AppliedByMember object
        created_at:
          type: string
          format: date-time
        environment_id:
          type: string
        id:
          type: string
        last_applied_error:
          type: string
        message:
          type: string
        patch:
          type: object
        status:
          type: string
          enum:
            - APPLYING
            - COMMITTED
            - FAILED
            - STAGED
        updated_at:
          type: string
          format: date-time
    EnvironmentPatchCommitResult:
      type: object
      properties:
        result:
          type: string
          description: Value returned by the environmentPatchCommit mutation (String!)
    EnvironmentPatchCommitStagedResult:
      type: object
      properties:
        result:
          type: string
          description: Value returned by the environmentPatchCommitStaged mutation (String!)
