        httpVerb: POST
        responseSelection:
          jsonPath: $.data.environmentPatches.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.environmentPatches.pageInfo.endCursor
          terminateOnJsonPath: $.data.environmentPatches.pageInfo.hasNextPage
        query: 'query { environmentPatches(first: 100{{ .cursor }} environmentId: "{{ .environment_id }}") { edges { node { applied_at: appliedAt applied_by: appliedBy { avatar email id name username } created_at: createdAt environment_id: environmentId id last_applied_error: lastAppliedError message patch status updated_at: updatedAt } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per EnvironmentPatch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentPatches:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/EnvironmentPatch'
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /graphql/v2?__resource=environment_patches&__method=restage:
    post:
      operationId: environment_patches_restage
      summary: Copy a FAILED patch's changes into the environment's staged patch (creating one if needed)
      description: Copy a FAILED patch's changes into the environment's staged patch (creating one if needed). The FAILED patch is left untouched. Backed by the Railway GraphQL mutation environmentPatchRestage.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patch_id
              properties:
                patch_id:
                  type: string
      responses:
        '200':
          description: The EnvironmentPatch the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentPatchRestage:
                        $ref: '#/components/schemas/EnvironmentPatch'
  /graphql/v2?__resource=environment_pending_work&__method=list:
    post:
      operationId: environment_pending_work_list
      summary: Pending project-mutating work for an environment
      description: Pending project-mutating work for an environment. Unions registered OperationSources (patches, standalone deploys) and returns parent rows only — not a stored inbox. Backed by the Railway GraphQL query environmentPendingWork.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.environments.environment_pending_work.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.environmentPendingWork[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { environmentPendingWork(environmentId: "{{ .environment_id }}") { actor { on_behalf_of: onBehalfOf principal surface } changes environment_id: environmentId finished_at: finishedAt id kind parent_ref: parentRef started_at: startedAt status workflow_id: workflowId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per ProjectOperation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentPendingWork:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectOperation'
  /graphql/v2?__resource=environment_staged_changes&__method=commit:
    post:
      operationId: environment_staged_changes_commit
      summary: Commits the staged changes for a single environment
      description: Commits the staged changes for a single environment. Backed by the Railway GraphQL mutation environmentPatchCommitStaged.
      externalDocs:
