            - INFO
            - NOTICE
            - WARNING
        source:
          type: string
        workflow_id:
          type: string
    ProjectOperation:
      type: object
      properties:
        actor:
          type: object
          properties:
            on_behalf_of:
              type: string
            principal:
              type: string
            surface:
              type: string
          description: ProjectOperationActor object
        changes:
          type: object
        environment_id:
          type: string
        finished_at:
          type: string
          format: date-time
        id:
          type: string
        kind:
          type: string
        parent_ref:
          type: string
        started_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - applied
            - applying
            - failed
            - staged
        workflow_id:
          type: string
