  /graphql/v2?__resource=environments&__method=create:
    post:
      operationId: environments_create
      summary: Creates a new environment
      description: Creates a new environment. Backed by the Railway GraphQL mutation environmentCreate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - project_id
              properties:
                apply_changes_in_background:
                  type: boolean
                  description: If true, the changes will be applied in the background and the mutation will return immediately. If false, the mutation will wait for the changes to be applied before returning.
                ephemeral:
                  type: boolean
                name:
                  type: string
                project_id:
                  type: string
                skip_initial_deploys:
                  type: boolean
                  description: When committing the changes immediately, skip any initial deployments.
                source_environment_id:
                  type: string
                  description: Create the environment with all of the services, volumes, configuration, and variables from this source environment.
                stage_initial_changes:
                  type: boolean
                  description: Stage the initial changes for the environment. If false (default), the changes will be committed immediately.
      responses:
        '200':
          description: The Environment the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentCreate:
                        $ref: '#/components/schemas/Environment'
