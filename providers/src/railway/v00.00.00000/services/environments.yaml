      operationId: environments_get
      summary: Find a single environment
      description: Find a single environment. Backed by the Railway GraphQL query environment.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.environments.environments.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
