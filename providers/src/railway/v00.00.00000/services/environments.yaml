openapi: 3.0.3
info:
  title: Environments API
  description: Environments, staged changes and patches, change sets, environment history and pending work.
  version: v00.00.00000
servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=canvas_view_merges&__method=get_preview:
    post:
      operationId: canvas_view_merges_get_preview
      summary: Preview a canvas layout merge from one environment to another
      description: Preview a canvas layout merge from one environment to another. Returns the merged state and the mutations needed to reach it. Backed by the Railway GraphQL query canvasViewMergePreview.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.environments.canvas_view_merges.get_preview
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { canvasViewMergePreview(sourceEnvironmentId: "{{ .source_environment_id }}" targetEnvironmentId: "{{ .target_environment_id }}") { mutations state } }'
      x-stackql-protocol: graphql
      parameters:
        - name: source_environment_id
          in: query
          required: true
          schema:
            type: string
        - name: target_environment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One CanvasViewMergePreview row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      canvasViewMergePreview:
                        $ref: '#/components/schemas/CanvasViewMergePreview'
  /graphql/v2?__resource=canvas_view_merges&__method=merge:
    post:
      operationId: canvas_view_merges_merge
      summary: Merge a canvas layout from one environment into another
      description: Merge a canvas layout from one environment into another. Re-computes the merge from current state and applies mutations. Backed by the Railway GraphQL mutation canvasViewMerge.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_environment_id
                - target_environment_id
              properties:
                source_environment_id:
                  type: string
                target_environment_id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      canvasViewMerge:
                        $ref: '#/components/schemas/CanvasViewMergeResult'
  /graphql/v2?__resource=environment_change_sets&__method=apply:
    post:
      operationId: environment_change_sets_apply
      summary: 'Experimental: applies an intent-level RailwayChangeSet and returns operation results'
      description: 'Experimental: applies an intent-level RailwayChangeSet and returns operation results. Backed by the Railway GraphQL mutation environmentApplyChangeSet.'
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - input
              properties:
                base_config_etag:
                  type: string
                  description: Snapshot token from Environment.configEtag the plan was computed against. When set, the apply is rejected if the environment has changed since.
                commit_message:
                  type: string
                environment_id:
                  type: string
                input:
                  type: object
                wait_for_completion:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                  description: Defaults to true for compatibility. Async-capable clients set false and poll environmentChangeSetApply. Boolean passed as a string, for example 'true'.
      responses:
        '200':
          description: The ChangeSetApplyResult the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentApplyChangeSet:
                        $ref: '#/components/schemas/ChangeSetApplyResult'
  /graphql/v2?__resource=environment_change_sets&__method=get:
    post:
      operationId: environment_change_sets_get
      summary: Returns the status or completed result of an asynchronous RailwayChangeSet apply
      description: Returns the status or completed result of an asynchronous RailwayChangeSet apply. Backed by the Railway GraphQL query environmentChangeSetApply.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.environments.environment_change_sets.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { environmentChangeSetApply(environmentId: "{{ .environment_id }}" id: "{{ .id }}") { changes { kind path status summary } deployment_id: deploymentId diagnostics id operation_id: operationId staged_patch_id: stagedPatchId status } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One ChangeSetApplyResult row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentChangeSetApply:
                        $ref: '#/components/schemas/ChangeSetApplyResult'
  /graphql/v2?__resource=environment_change_sets&__method=preview:
    post:
      operationId: environment_change_sets_preview
      summary: 'Experimental: previews an intent-level RailwayChangeSet without side effects'
      description: 'Experimental: previews an intent-level RailwayChangeSet without side effects. Backed by the Railway GraphQL mutation environmentPreviewChangeSet.'
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - input
              properties:
                environment_id:
                  type: string
                input:
                  type: object
      responses:
        '200':
          description: The ChangeSetPreview the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentPreviewChangeSet:
                        $ref: '#/components/schemas/ChangeSetPreview'
  /graphql/v2?__resource=environment_history&__method=list:
    post:
      operationId: environment_history_list
      summary: Settled history for an environment (system events + terminal operations), newest first
      description: Settled history for an environment (system events + terminal operations), newest first. Cursor-paginated. Backed by the Railway GraphQL query environmentHistory.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.environments.environment_history.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.environmentHistory.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.environmentHistory.pageInfo.endCursor
          terminateOnJsonPath: $.data.environmentHistory.pageInfo.hasNextPage
        query: 'query { environmentHistory(first: 100{{ .cursor }} environmentId: "{{ .environment_id }}" {{ if or .actions .objects .outcomes .service_ids }}filter: { {{ if .actions }}actions: {{ .actions }} {{ end }}{{ if .objects }}objects: {{ .objects }} {{ end }}{{ if .outcomes }}outcomes: {{ .outcomes }} {{ end }}{{ if .service_ids }}serviceIds: {{ .service_ids }} {{ end }}} {{ end }}) { edges { node { action activity_payload: activityPayload actor { on_behalf_of: onBehalfOf principal surface } changes created_at: createdAt id object operation_kind: operationKind outcome parent_ref: parentRef payload service_ids: serviceIds severity source workflow_id: workflowId } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: actions
          in: query
          required: false
          description: GraphQL list literal, for example ["a", "b"].
          schema:
            type: string
        - name: objects
          in: query
          required: false
          description: GraphQL list literal, for example ["a", "b"].
          schema:
            type: string
        - name: outcomes
          in: query
          required: false
          description: Any of '', 'applied', 'failed'. GraphQL list literal, for example ["a", "b"].
          schema:
            type: string
        - name: service_ids
          in: query
          required: false
          description: GraphQL list literal, for example ["a", "b"].
          schema:
            type: string
      responses:
        '200':
          description: 'One row per ProjectHistoryEntry. One settled change in an environment: a system event or a terminal operation (patch, deploy, …).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentHistory:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/ProjectHistoryEntry'
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /graphql/v2?__resource=environment_legacy_static_egress&__method=get:
    post:
      operationId: environment_legacy_static_egress_get
      summary: Whether any service in the environment is on legacy static egress (not HA)
      description: Whether any service in the environment is on legacy static egress (not HA). Used to surface the HA migration banner. Backed by the Railway GraphQL query environmentHasLegacyStaticEgress.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.environments.environment_legacy_static_egress.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.environmentHasLegacyStaticEgress[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { environmentHasLegacyStaticEgress(environmentId: "{{ .environment_id }}") }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row carrying the value as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentHasLegacyStaticEgress:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnvironmentHasLegacyStaticEgressResult'
  /graphql/v2?__resource=environment_patches&__method=commit:
    post:
      operationId: environment_patches_commit
      summary: Commit the provided patch to the environment
      description: Commit the provided patch to the environment. Backed by the Railway GraphQL mutation environmentPatchCommit.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
              properties:
                commit_message:
                  type: string
                environment_id:
                  type: string
                patch:
                  type: object
                skip_deploys:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                  description: Skip deploys for services affected by this patch. Boolean passed as a string, for example 'true'.
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentPatchCommit:
                        $ref: '#/components/schemas/EnvironmentPatchCommitResult'
  /graphql/v2?__resource=environment_patches&__method=get:
    post:
      operationId: environment_patches_get
      summary: Get a single environment patch by ID
      description: Get a single environment patch by ID. Backed by the Railway GraphQL query environmentPatch.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.environments.environment_patches.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { environmentPatch(id: "{{ .id }}") { applied_at: appliedAt applied_by: appliedBy { avatar email id name username } created_at: createdAt environment_id: environmentId id last_applied_error: lastAppliedError message patch status updated_at: updatedAt } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One EnvironmentPatch row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environmentPatch:
                        $ref: '#/components/schemas/EnvironmentPatch'
  /graphql/v2?__resource=environment_patches&__method=list:
    post:
      operationId: environment_patches_list
      summary: Get the patches for an environment
      description: Get the patches for an environment. Backed by the Railway GraphQL query environmentPatches.
      externalDocs:
        description: Railway public API documentation
