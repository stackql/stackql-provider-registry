openapi: 3.0.3
info:
  title: Agents and Sandboxes API
  description: Cloud agents, their tasks and checkpoints, and sandboxes with their sessions, checkpoints and template builds.
  version: v00.00.00000
servers:
  - url: https://backboard.railway.com
paths:
  /graphql/v2?__resource=cloud_agent_checkpoints&__method=create:
    post:
      operationId: cloud_agent_checkpoints_create
      summary: Checkpoint the agent's disk
      description: Checkpoint the agent's disk. Poll cloudAgentCheckpoint until SUCCEEDED. Backed by the Railway GraphQL mutation cloudAgentCheckpointCreate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: The CloudAgentCheckpoint the mutation returns. A checkpoint of a cloud agent's disk.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentCheckpointCreate:
                        $ref: '#/components/schemas/CloudAgentCheckpoint'
  /graphql/v2?__resource=cloud_agent_checkpoints&__method=delete:
    post:
      operationId: cloud_agent_checkpoints_delete
      summary: Delete a checkpoint
      description: Delete a checkpoint. Backed by the Railway GraphQL mutation cloudAgentCheckpointDelete.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentCheckpointDelete:
                        $ref: '#/components/schemas/CloudAgentCheckpointDeleteResult'
  /graphql/v2?__resource=cloud_agent_checkpoints&__method=get:
    post:
      operationId: cloud_agent_checkpoints_get
      summary: A cloud agent checkpoint by ID
      description: A cloud agent checkpoint by ID. Backed by the Railway GraphQL query cloudAgentCheckpoint.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.agents.cloud_agent_checkpoints.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { cloudAgentCheckpoint(id: "{{ .id }}") { created_at: createdAt environment_id: environmentId failure_reason: failureReason id name region status } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One CloudAgentCheckpoint row. A checkpoint of a cloud agent's disk.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentCheckpoint:
                        $ref: '#/components/schemas/CloudAgentCheckpoint'
  /graphql/v2?__resource=cloud_agent_checkpoints&__method=list:
    post:
      operationId: cloud_agent_checkpoints_list
      summary: Cloud agent checkpoints in an environment, newest first
      description: Cloud agent checkpoints in an environment, newest first. Backed by the Railway GraphQL query cloudAgentCheckpoints.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.agents.cloud_agent_checkpoints.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.cloudAgentCheckpoints.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.cloudAgentCheckpoints.pageInfo.endCursor
          terminateOnJsonPath: $.data.cloudAgentCheckpoints.pageInfo.hasNextPage
        query: 'query { cloudAgentCheckpoints(first: 100{{ .cursor }} environmentId: "{{ .environment_id }}") { edges { node { created_at: createdAt environment_id: environmentId failure_reason: failureReason id name region status } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per CloudAgentCheckpoint. A checkpoint of a cloud agent's disk.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentCheckpoints:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/CloudAgentCheckpoint'
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /graphql/v2?__resource=cloud_agent_console_sessions&__method=list:
    post:
      operationId: cloud_agent_console_sessions_list
      summary: Shell and exec sessions running on a cloud agent's VM that you can reconnect to
      description: Shell and exec sessions running on a cloud agent's VM that you can reconnect to. Null if the agent has no running machine. Backed by the Railway GraphQL query cloudAgentConsoleSessions.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.agents.cloud_agent_console_sessions.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.cloudAgentConsoleSessions.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.cloudAgentConsoleSessions.pageInfo.endCursor
          terminateOnJsonPath: $.data.cloudAgentConsoleSessions.pageInfo.hasNextPage
        query: 'query { cloudAgentConsoleSessions(first: 100{{ .cursor }} cloudAgentId: "{{ .cloud_agent_id }}") { edges { node { attached command created_at: createdAt foreground_active: foregroundActive kind name run_state: runState { exit_code: exitCode exited_at: exitedAt running } } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: cloud_agent_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'One row per SandboxSession. A resumable session inside a sandbox: an interactive shell or a one-off exec command.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentConsoleSessions:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/SandboxSession'
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
  /graphql/v2?__resource=cloud_agent_task_results&__method=get:
    post:
      operationId: cloud_agent_task_results_get
      summary: Read the latest task on an agent/session without waking the VM
      description: Read the latest task on an agent/session without waking the VM. Backed by the Railway GraphQL query cloudAgentTask.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.agents.cloud_agent_task_results.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { cloudAgentTask(cloudAgentId: "{{ .cloud_agent_id }}" sessionId: "{{ .session_id }}") { cloud_agent_id: cloudAgentId completed_at: completedAt error external_ref: externalRef metadata session_id: sessionId session_state: sessionState status structured_output: structuredOutput task_id: taskId text } }'
      x-stackql-protocol: graphql
      parameters:
        - name: cloud_agent_id
          in: query
          required: true
          schema:
            type: string
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One CloudAgentTaskResult row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentTask:
                        $ref: '#/components/schemas/CloudAgentTaskResult'
  /graphql/v2?__resource=cloud_agent_task_results&__method=recover:
    post:
      operationId: cloud_agent_task_results_recover
      summary: Recover the latest task response from the agent
      description: Recover the latest task response from the agent. May wake the VM. Backed by the Railway GraphQL mutation cloudAgentTaskRecover.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cloud_agent_id
                - session_id
              properties:
                cloud_agent_id:
                  type: string
                session_id:
                  type: string
      responses:
        '200':
          description: The CloudAgentTaskResult the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentTaskRecover:
                        $ref: '#/components/schemas/CloudAgentTaskResult'
  /graphql/v2?__resource=cloud_agent_tasks&__method=dispatch:
    post:
      operationId: cloud_agent_tasks_dispatch
      summary: Start a task and return its handle
      description: Start a task and return its handle. Creates a fresh agent by default; replyToTaskId continues the original conversation. Backed by the Railway GraphQL mutation cloudAgentTaskDispatch.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - project_id
                - prompt
              properties:
                agent_name:
                  type: string
                cloud_agent_id:
                  type: string
                  description: Explicit agent reuse. Omit all targets to create a fresh agent.
                environment_id:
                  type: string
                external_ref:
                  type: string
                idempotency_key:
                  type: string
                metadata:
                  type: object
                mode:
                  type: string
                  enum:
                    - FOLLOW_UP
                    - PROMPT
                    - STEER
                output_schema:
                  type: object
                  description: JSON Schema object for structured output; requires PROMPT mode.
                project_id:
                  type: string
                prompt:
                  type: string
                reply_to_task_id:
                  type: string
                  description: Continue this task's original agent/session. Mutually exclusive with cloudAgentId/sessionId.
                session_id:
                  type: string
                  description: Existing session to continue; requires cloudAgentId.
                source:
                  type: object
                  description: JSON object of GraphQL type CloudAgentSourceInput; keys keep the API's camelCase names.
                webhook_secret:
                  type: string
                webhook_url:
                  type: string
      responses:
        '200':
          description: The CloudAgentTaskHandle the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentTaskDispatch:
                        $ref: '#/components/schemas/CloudAgentTaskHandle'
  /graphql/v2?__resource=cloud_agent_tasks&__method=list:
    post:
      operationId: cloud_agent_tasks_list
      summary: List task lifecycle records in an environment, newest first
      description: List task lifecycle records in an environment, newest first. Backed by the Railway GraphQL query cloudAgentTasks.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.agents.cloud_agent_tasks.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.cloudAgentTasks.tasks[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.cloudAgentTasks.nextCursor
          terminateOnJsonPath: $.data.cloudAgentTasks.nextCursor
          format: 'cursor: "{{ .value }}" '
        query: 'query { cloudAgentTasks({{ .cursor }} environmentId: "{{ .environment_id }}" {{ if .status }}status: {{ .status }} {{ end }}) { tasks { cloud_agent_id: cloudAgentId completed_at: completedAt created_at: createdAt created_via: createdVia error external_ref: externalRef id metadata prompt_preview: promptPreview requested_by_user_id: requestedByUserId session_id: sessionId started_at: startedAt status } nextCursor } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - AWAITING_INPUT
              - COMPLETED
              - FAILED
              - PENDING
              - RUNNING
      responses:
        '200':
          description: One row per CloudAgentTask. Task lifecycle and correlation. Read cloudAgentTask for the latest session response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentTasks:
                        type: object
                        properties:
                          tasks:
                            type: array
                            items:
                              $ref: '#/components/schemas/CloudAgentTask'
                          nextCursor:
                            type: string
  /graphql/v2?__resource=cloud_agents&__method=create:
    post:
      operationId: cloud_agents_create
      summary: Create a cloud agent
      description: Create a cloud agent. Backed by the Railway GraphQL mutation cloudAgentCreate.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
              properties:
                cloud_agent_checkpoint_id:
                  type: string
                  description: Create the cloud agent from an existing checkpoint.
                code_endpoint:
                  type: object
                  description: Provision a code-* domain. Omit to disable, including when restoring a checkpoint or bootstrap. JSON object of GraphQL type CloudAgentCodeEndpointInput; keys keep the API's camelCase names.
                environment_id:
                  type: string
                name:
                  type: string
                region:
                  type: string
                  description: Region to run the agent in, e.g. us-west2. Defaults to the checkpoint's region when booting from one, else the workspace's preferred region.
                source:
                  type: object
                  description: JSON object of GraphQL type CloudAgentSourceInput; keys keep the API's camelCase names.
                variables:
                  type: object
      responses:
        '200':
          description: The CloudAgent the mutation returns. A persistent cloud agent for running coding harnesses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentCreate:
                        $ref: '#/components/schemas/CloudAgent'
  /graphql/v2?__resource=cloud_agents&__method=delete:
    post:
      operationId: cloud_agents_delete
      summary: Delete a cloud agent
      description: Delete a cloud agent. Backed by the Railway GraphQL mutation cloudAgentDelete.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentDelete:
                        $ref: '#/components/schemas/CloudAgentDeleteResult'
  /graphql/v2?__resource=cloud_agents&__method=deploy:
    post:
      operationId: cloud_agents_deploy
      summary: Build the agent's code inside its own VM and deploy it
      description: 'Build the agent''s code inside its own VM and deploy it. Creates the named service (default: the agent''s name) or reuses it. Needs an agent booted with the builder. Backed by the Railway GraphQL mutation cloudAgentDeploy.'
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                path:
                  type: string
                regions:
                  type: object
                  description: 'Replicas per region, e.g. { "us-west2": 3 }. Saved on the service; omit to keep its current regions.'
                service_name:
                  type: string
      responses:
        '200':
          description: The CloudAgentDeployResult the mutation returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentDeploy:
                        $ref: '#/components/schemas/CloudAgentDeployResult'
  /graphql/v2?__resource=cloud_agents&__method=fork:
    post:
      operationId: cloud_agents_fork
      summary: Duplicate a running cloud agent
      description: Duplicate a running cloud agent. Backed by the Railway GraphQL mutation cloudAgentFork.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                name:
                  type: string
                variables:
                  type: object
      responses:
        '200':
          description: The CloudAgent the mutation returns. A persistent cloud agent for running coding harnesses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentFork:
                        $ref: '#/components/schemas/CloudAgent'
  /graphql/v2?__resource=cloud_agents&__method=get:
    post:
      operationId: cloud_agents_get
      summary: A cloud agent by ID, within an environment
      description: A cloud agent by ID, within an environment. Null when the agent belongs to another one, so a caller cannot render an agent it has switched away from. Backed by the Railway GraphQL query cloudAgent.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.agents.cloud_agents.get
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.*
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { cloudAgent(environmentId: "{{ .environment_id }}" id: "{{ .id }}") { agent_ws_url: agentWsUrl console_target_id: consoleTargetId created_at: createdAt domain domains { domain port prefix } environment_id: environmentId id name project { base_environment_id: baseEnvironmentId bot_pr_environments: botPrEnvironments created_at: createdAt deleted_at: deletedAt description expired_at: expiredAt feature_flags: featureFlags focused_pr_environments: focusedPrEnvironments id is_public: isPublic is_temp_project: isTempProject name pr_deploys: prDeploys primary_environment_id: primaryEnvironmentId subscription_plan_limit: subscriptionPlanLimit subscription_type: subscriptionType tracing_enabled: tracingEnabled tracing_sample_rate: tracingSampleRate updated_at: updatedAt viewer_role: viewerRole workspace_id: workspaceId } project_id: projectId region sessions { harness last_event_kind: lastEventKind latest_prompt: latestPrompt prompt session_id: sessionId session_name: sessionName state task_id: taskId terminal title updated_at: updatedAt } source { branch dir repo service_id: serviceId status } status } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One CloudAgent row. A persistent cloud agent for running coding harnesses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgent:
                        $ref: '#/components/schemas/CloudAgent'
  /graphql/v2?__resource=cloud_agents&__method=harness_token:
    post:
      operationId: cloud_agents_harness_token
      summary: Mint a short-lived (5m) JWT for the agent's harness WebSocket (see agentWsUrl)
      description: Mint a short-lived (5m) JWT for the agent's harness WebSocket (see agentWsUrl). The in-VM gate verifies signature/exp/aud and pins it to this agent. Mint one per dial; the token only has to survive the upgrade. Backed by the Railway GraphQL mutation cloudAgentHarnessToken.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackql-protocol: graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment_id
                - id
              properties:
                environment_id:
                  type: string
                id:
                  type: string
      responses:
        '200':
          description: The value the mutation returns, as the result column.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgentHarnessToken:
                        $ref: '#/components/schemas/CloudAgentHarnessTokenResult'
  /graphql/v2?__resource=cloud_agents&__method=list:
    post:
      operationId: cloud_agents_list
      summary: Cloud agents in an environment
      description: Cloud agents in an environment. Backed by the Railway GraphQL query cloudAgents.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.agents.cloud_agents.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.cloudAgents[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { cloudAgents(environmentId: "{{ .environment_id }}" {{ if .mine }}mine: {{ .mine }} {{ end }}) { agent_ws_url: agentWsUrl console_target_id: consoleTargetId created_at: createdAt domain domains { domain port prefix } environment_id: environmentId id name project { base_environment_id: baseEnvironmentId bot_pr_environments: botPrEnvironments created_at: createdAt deleted_at: deletedAt description expired_at: expiredAt feature_flags: featureFlags focused_pr_environments: focusedPrEnvironments id is_public: isPublic is_temp_project: isTempProject name pr_deploys: prDeploys primary_environment_id: primaryEnvironmentId subscription_plan_limit: subscriptionPlanLimit subscription_type: subscriptionType tracing_enabled: tracingEnabled tracing_sample_rate: tracingSampleRate updated_at: updatedAt viewer_role: viewerRole workspace_id: workspaceId } project_id: projectId region sessions { harness last_event_kind: lastEventKind latest_prompt: latestPrompt prompt session_id: sessionId session_name: sessionName state task_id: taskId terminal title updated_at: updatedAt } source { branch dir repo service_id: serviceId status } status } }'
      x-stackql-protocol: graphql
      parameters:
        - name: environment_id
          in: query
          required: true
          schema:
            type: string
        - name: mine
          in: query
          required: false
          description: Return only the agents that belong to you. By default every agent in the environment is returned, including your teammates'.
          schema:
            type: boolean
      responses:
        '200':
          description: One row per CloudAgent. A persistent cloud agent for running coding harnesses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cloudAgents:
                        type: array
                        items:
                          $ref: '#/components/schemas/CloudAgent'
  /graphql/v2?__resource=cloud_agents&__method=list_mine:
    post:
      operationId: cloud_agents_list_mine
      summary: Cloud agents you own, across every project and environment you can reach
      description: Cloud agents you own, across every project and environment you can reach. Answers "where are my agents" in one request; `cloudAgents` needs one call per environment. Machine fields (`status`, `domain`, `domains`) read the last observed state in batched queries, so selecting them across many environments is fine. Backed by the Railway GraphQL query myCloudAgents.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.agents.cloud_agents.list_mine
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.myCloudAgents[*]
        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { myCloudAgents { agent_ws_url: agentWsUrl console_target_id: consoleTargetId created_at: createdAt domain domains { domain port prefix } environment_id: environmentId id name project { base_environment_id: baseEnvironmentId bot_pr_environments: botPrEnvironments created_at: createdAt deleted_at: deletedAt description expired_at: expiredAt feature_flags: featureFlags focused_pr_environments: focusedPrEnvironments id is_public: isPublic is_temp_project: isTempProject name pr_deploys: prDeploys primary_environment_id: primaryEnvironmentId subscription_plan_limit: subscriptionPlanLimit subscription_type: subscriptionType tracing_enabled: tracingEnabled tracing_sample_rate: tracingSampleRate updated_at: updatedAt viewer_role: viewerRole workspace_id: workspaceId } project_id: projectId region sessions { harness last_event_kind: lastEventKind latest_prompt: latestPrompt prompt session_id: sessionId session_name: sessionName state task_id: taskId terminal title updated_at: updatedAt } source { branch dir repo service_id: serviceId status } status } }'
      x-stackql-protocol: graphql
      parameters: []
      responses:
        '200':
          description: One row per CloudAgent. A persistent cloud agent for running coding harnesses.
