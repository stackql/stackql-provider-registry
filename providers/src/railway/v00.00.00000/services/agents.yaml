components:
  schemas:
    CloudAgent:
      type: object
      properties:
        agent_ws_url:
          type: string
          description: 'WebSocket endpoint of the in-VM harness gate, for the dashboard chat. Survives sleep: the domain is stable across sleep and wake. Prefers the machine observation; when that carries no gate domain it falls back to the domain network-cp actively serves, so an agent whose observation lagged still offers chat. Null on agents created before the gate existed, or asleep/absent machines.'
        console_target_id:
          type: string
          description: Target ID for console or command execution. Null while unavailable.
        created_at:
          type: string
          format: date-time
        domain:
          type: string
          description: The agent machine's public HTTP domain (port 8080) — the live preview. Prefers the observation (falling back to the first declared domain when 8080 was never requested); when the observation carries no domains it falls back to the domain network-cp actively serves on 8080, so a preview shows even when the observation lagged. Returns null while the machine sleeps.
        domains:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
                description: Resolved FQDN.
              port:
                type: integer
                description: Target port on the workload this domain routes to.
              prefix:
                type: string
                description: Label prefix the machine declared, e.g. app.
          description: Every public domain on the agent's machine, one per port, in the order the machine declared them.
        environment_id:
          type: string
        id:
          type: string
        name:
          type: string
        project:
          type: object
          properties:
            base_environment_id:
              type: string
            bot_pr_environments:
              type: boolean
            created_at:
              type: string
              format: date-time
            deleted_at:
              type: string
              format: date-time
            description:
              type: string
            expired_at:
              type: string
              format: date-time
            feature_flags:
              type: array
              items:
                type: string
                enum:
                  - PLACEHOLDER
                  - RBS_VOLUMES
            focused_pr_environments:
              type: boolean
            id:
              type: string
            is_public:
              type: boolean
            is_temp_project:
              type: boolean
            name:
              type: string
            pr_deploys:
              type: boolean
            primary_environment_id:
              type: string
              description: The id of the oldest non-ephemeral environment for this project (typically production). Used by the dashboard to render project cards without fetching the full environments connection.
            subscription_plan_limit:
              type: object
            subscription_type:
              type: string
              enum:
                - free
                - hobby
                - pro
                - trial
            tracing_enabled:
              type: boolean
              description: Whether the project's services are traced by default. A service can override it with its own tracingEnabled.
            tracing_sample_rate:
              type: number
              description: Fraction of client-facing requests the edge traces, 0..1. Null uses Railway's default.
            updated_at:
              type: string
              format: date-time
            viewer_role:
              type: string
              enum:
                - ADMIN
                - MEMBER
                - VIEWER
              description: Highest project-scoped role the current user holds on this project, through a direct project permission or an access group. Does not include the workspace role.
            workspace_id:
              type: string
          description: Project object
        project_id:
          type: string
        region:
          type: string
          description: Region the agent's machine runs in. Null briefly after creation, before the machine has been placed.
        sessions:
          type: array
          items:
            type: object
            properties:
              harness:
                type: string
              last_event_kind:
                type: string
              latest_prompt:
                type: string
                description: Truncated most recent prompt of the session, display-only. Null when the harness never reported one.
              prompt:
                type: string
                description: Truncated first prompt of the session, display-only. Null when the harness never reported one.
              session_id:
                type: string
              session_name:
                type: string
                description: Durable console session name the harness ran inside. Null on older VMs that don't report it.
              state:
                type: string
                description: 'One of: unknown, working, waiting, idle, failed, done.'
              task_id:
                type: string
              terminal:
                type: boolean
              title:
                type: string
                description: Generated display title for the session, display-only. Null until generated; fall back to latestPrompt, then prompt.
              updated_at:
                type: string
          description: Live coding-agent sessions, one entry per session. Retained for 24h after the last report, so a sleeping agent still shows what it was last doing.
        source:
          type: object
          properties:
            branch:
              type: string
              description: Requested ref; null = the repo's default branch.
            dir:
              type: string
              description: Selected checkout directory; null means /app.
            repo:
              type: string
              description: owner/repo.
            service_id:
              type: string
              description: Service the repo was resolved from, when given.
            status:
              type: string
              enum:
                - CLONING
                - FAILED
                - READY
              description: Clone progress. Failed never blocks the agent; only CLONING should hold a launch.
          description: Repo this agent's workspace was created from. Null for agents created without a source.
        status:
          type: string
          enum:
