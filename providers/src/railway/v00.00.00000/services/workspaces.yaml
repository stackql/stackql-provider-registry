  /graphql/v2?__resource=access_groups&__method=list:
    post:
      operationId: access_groups_list
      summary: Lists AccessGroup objects of a Workspace
      description: Lists AccessGroup objects of a Workspace. Backed by the Railway GraphQL query workspace.accessGroups.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.workspaces.access_groups.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.workspace.accessGroups.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.workspace.accessGroups.pageInfo.endCursor
          terminateOnJsonPath: $.data.workspace.accessGroups.pageInfo.hasNextPage
        query: 'query { workspace(workspaceId: "{{ .workspace_id }}") { accessGroups(first: 100{{ .cursor }}) { edges { node { created_at: createdAt id name role source updated_at: updatedAt workspace { adoption_level: adoptionLevel avatar created_at: createdAt discord_role: discordRole has2fa_enforcement: has2FAEnforcement has_automatic_diagnosis: hasAutomaticDiagnosis has_guardrails_access: hasGuardrailsAccess has_hipaa_baa: hasHipaaBAA has_saml: hasSAML id name plan preferred_region: preferredRegion project_count: projectCount redacted_due_to2fa_pending: redactedDueTo2FAPending restrict_project_visibility_to_groups: restrictProjectVisibilityToGroups slack_channel_id: slackChannelId subscription_plan_limit: subscriptionPlanLimit updated_at: updatedAt users_without2fa: usersWithout2FA } workspace_id: workspaceId } } pageInfo { hasNextPage endCursor } } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per AccessGroup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspace:
                        type: object
                        properties:
                          accessGroups:
                            type: object
                            properties:
                              nodes:
                                type: array
                                items:
                                  $ref: '#/components/schemas/AccessGroup'
                              pageInfo:
                                type: object
                                properties:
                                  hasNextPage:
                                    type: boolean
                                  endCursor:
                                    type: string
