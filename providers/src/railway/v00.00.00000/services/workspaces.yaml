        cursor:
          jsonPath: $.stackql_gql_get_sentinel
        query: 'query { auditLog(id: "{{ .id }}" workspaceId: "{{ .workspace_id }}") { context created_at: createdAt environment { can_access: canAccess config_etag: configEtag created_at: createdAt deleted_at: deletedAt id is_ephemeral: isEphemeral name project_id: projectId unmerged_changes_count: unmergedChangesCount updated_at: updatedAt } environment_id: environmentId event_type: eventType id payload project { base_environment_id: baseEnvironmentId bot_pr_environments: botPrEnvironments created_at: createdAt deleted_at: deletedAt description expired_at: expiredAt feature_flags: featureFlags focused_pr_environments: focusedPrEnvironments id is_public: isPublic is_temp_project: isTempProject name pr_deploys: prDeploys primary_environment_id: primaryEnvironmentId subscription_plan_limit: subscriptionPlanLimit subscription_type: subscriptionType tracing_enabled: tracingEnabled tracing_sample_rate: tracingSampleRate updated_at: updatedAt viewer_role: viewerRole workspace_id: workspaceId } project_id: projectId workspace_id: workspaceId } }'
      x-stackql-protocol: graphql
      parameters:
        - name: id
          in: query
          required: true
          description: The ID of the audit log entry.
