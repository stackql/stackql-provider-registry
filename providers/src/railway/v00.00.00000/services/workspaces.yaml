            type: string
        - name: workspace_id
          in: query
          required: true
          description: The ID of the workspace.
          schema:
            type: string
      responses:
        '200':
          description: One AuditLog row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      auditLog:
                        $ref: '#/components/schemas/AuditLog'
  /graphql/v2?__resource=audit_logs&__method=list:
    post:
      operationId: audit_logs_list
      summary: Gets audit logs for a workspace
      description: Gets audit logs for a workspace. Backed by the Railway GraphQL query auditLogs.
      externalDocs:
        description: Railway public API documentation
        url: https://docs.railway.com/integrations/api
      x-stackQL-graphQL:
        id: railway.workspaces.audit_logs.list
        url: https://backboard.railway.com/graphql/v2
        httpVerb: POST
        responseSelection:
          jsonPath: $.data.auditLogs.nodes[*]
        cursor:
          strategy: page_info
          jsonPath: $.data.auditLogs.pageInfo.endCursor
          terminateOnJsonPath: $.data.auditLogs.pageInfo.hasNextPage
        query: 'query { auditLogs(first: 100{{ .cursor }} {{ if or .end_date .environment_id .event_types .project_id .start_date }}filter: { {{ if .end_date }}endDate: "{{ .end_date }}" {{ end }}{{ if .environment_id }}environmentId: "{{ .environment_id }}" {{ end }}{{ if .event_types }}eventTypes: {{ .event_types }} {{ end }}{{ if .project_id }}projectId: "{{ .project_id }}" {{ end }}{{ if .start_date }}startDate: "{{ .start_date }}" {{ end }}} {{ end }}{{ if .sort }}sort: {{ .sort }} {{ end }}workspaceId: "{{ .workspace_id }}") { edges { node { context created_at: createdAt environment { can_access: canAccess config_etag: configEtag created_at: createdAt deleted_at: deletedAt id is_ephemeral: isEphemeral name project_id: projectId unmerged_changes_count: unmergedChangesCount updated_at: updatedAt } environment_id: environmentId event_type: eventType id payload project { base_environment_id: baseEnvironmentId bot_pr_environments: botPrEnvironments created_at: createdAt deleted_at: deletedAt description expired_at: expiredAt feature_flags: featureFlags focused_pr_environments: focusedPrEnvironments id is_public: isPublic is_temp_project: isTempProject name pr_deploys: prDeploys primary_environment_id: primaryEnvironmentId subscription_plan_limit: subscriptionPlanLimit subscription_type: subscriptionType tracing_enabled: tracingEnabled tracing_sample_rate: tracingSampleRate updated_at: updatedAt viewer_role: viewerRole workspace_id: workspaceId } project_id: projectId workspace_id: workspaceId } } pageInfo { hasNextPage endCursor } } }'
      x-stackql-protocol: graphql
      parameters:
        - name: end_date
          in: query
          required: false
          description: Filter events created on or before this date.
          schema:
            type: string
            format: date-time
        - name: environment_id
          in: query
          required: false
          description: Filter events for a single environment.
          schema:
            type: string
        - name: event_types
          in: query
          required: false
          description: List of event types to filter by. GraphQL list literal, for example ["a", "b"].
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          description: Filter events for a single project.
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          description: Filter events created on or after this date.
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One row per AuditLog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      auditLogs:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/AuditLog'
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                              endCursor:
                                type: string
