        - path
        - code
      type: object
    DomainForwarding:
      properties:
        fqdn:
          type: string
          description: The fqdn (domain or sub domain) to forward (ex somedomain.com or sub.somedomain.com)
        type:
          type: string
          default: REDIRECT_PERMANENT
          enum:
            - MASKED
            - REDIRECT_PERMANENT
            - REDIRECT_TEMPORARY
          description: |-
            The type of forwarding to implement

            - **MASKED** — Prevents the forwarded domain or subdomain URL from displaying in the browser's address bar.
            - **REDIRECT_PERMANENT** (default) — Redirects to the url specified in the forwardTo field using a `301 Moved Permanently` HTTP response. Tells user-agents (including search engines) that the location has permanently moved.
            - **REDIRECT_TEMPORARY** — Redirects to the url specified in the forwardTo field using a `302 Found` HTTP response. Tells user-agents (including search engines) that the location has temporarily moved.
        url:
          type: string
          format: url
          description: Forwards http(s) traffic to this destination url (ex. http://www.somedomain.com/)
        mask:
          $ref: '#/components/schemas/DomainForwardingMask'
      required:
        - fqdn
        - type
        - url
      type: object
    DomainForwardingCreate:
      properties:
        type:
          type: string
          default: REDIRECT_PERMANENT
          enum:
            - MASKED
            - REDIRECT_PERMANENT
            - REDIRECT_TEMPORARY
          description: |-
            The type of forwarding to implement

            - **MASKED** — Prevents the forwarded domain or subdomain URL from displaying in the browser's address bar.
            - **REDIRECT_PERMANENT** (default) — Redirects to the url specified in the forwardTo field using a `301 Moved Permanently` HTTP response. Tells user-agents (including search engines) that the location has permanently moved.
            - **REDIRECT_TEMPORARY** — Redirects to the url specified in the forwardTo field using a `302 Found` HTTP response. Tells user-agents (including search engines) that the location has temporarily moved.
        url:
          type: string
          format: url
          description: Forwards http(s) traffic to this destination url (ex. http://www.somedomain.com/)
        mask:
          $ref: '#/components/schemas/DomainForwardingMask'
      required:
        - type
        - url
      type: object
    ErrorField_v2:
      properties:
        code:
          description: Short identifier for the error, suitable for indicating the specific error within client code
          format: constant
          type: string
        message:
          description: Human-readable, English description of the problem with the contents of the field
          type: string
        path:
          description: |-
            JSONPath referring to a field containing an error, or a field that refers to an
            object containing an error (with more detail in `pathRelated`).
          format: json-path
          type: string
        pathRelated:
          description: JSONPath referring to a field containing an error, which is referenced by `path`
          format: json-path
          type: string
      required:
        - path
        - code
      type: object
    DomainForwardingMask:
      properties:
        title:
          type: string
          description: Displays at the top of the browser window and in search results.
        description:
          type: string
          description: A short description of your website to display in search engine results.
        keywords:
          type: string
          description: A list of comma-separated keywords that describes the content and purpose of your website.
      type: object
    DNSRecordType:
      title: DNS Record Type
      description: |
        The DNS resource record type. A — IPv4 address record. AAAA — IPv6 address record. CNAME — canonical name alias record; not permitted at the zone apex. MX — mail exchange routing record. TXT — arbitrary text record, used for SPF, DKIM, and domain verification. NS — authoritative name server delegation record. SRV — service locator record. SOA — start of authority record. CAA — certification authority authorization record.
      type: string
      enum:
        - A
        - AAAA
        - CNAME
        - MX
        - TXT
        - NS
        - SRV
        - SOA
        - CAA
    DNSRecords:
      title: DNS Records
      description: |
        Paginated collection of DNS resource records for a zone. HATEOAS links provide navigation to adjacent pages.
      type: object
      required:
        - items
        - links
      properties:
        items:
          type: array
          description: DNS records for the current page.
          items:
            $ref: '#/components/schemas/DNSRecord_v3'
        totalItems:
          type: integer
          minimum: 1
          description: |
            Total number of records in the zone. Only present when totalRequired=true was passed in the request and the zone contains at least one record.
        totalPages:
          type: integer
          minimum: 1
          description: |
            Total number of pages at the requested pageSize. Only present under the same conditions as totalItems.
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDescription'
          description: |
            HATEOAS pagination links. rel=self — this page. rel=next — next page (absent on the last page). rel=prev — previous page (absent on the first page).
          readOnly: true
    DNSRecord_v3:
      title: DNS Record
      description: A single DNS resource record within a zone.
      type: object
      required:
        - name
        - type
        - data
        - ttl
      properties:
        recordId:
          type: string
          description: Server-assigned identifier for this DNS record. Stable across updates.
          readOnly: true
          example: rec_a1b2c3d4
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The DNS record name relative to the zone apex. Use @ to represent the zone apex itself (e.g. the bare domain example.com).
          example: www
        type:
          title: DNS Record Type
          description: |
            The DNS resource record type. A — IPv4 address record. AAAA — IPv6 address record. CNAME — canonical name alias record; not permitted at the zone apex. MX — mail exchange routing record. TXT — arbitrary text record, used for SPF, DKIM, and domain verification. NS — authoritative name server delegation record. SRV — service locator record. SOA — start of authority record. CAA — certification authority authorization record.
          type: string
          enum:
            - A
            - AAAA
            - CNAME
            - MX
            - TXT
            - NS
            - SRV
            - SOA
            - CAA
        data:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            The record value. Format is type-specific — for example, an IPv4 address for A records, or a hostname for CNAME and MX records.
          example: 93.184.216.34
        ttl:
          type: integer
          minimum: 600
          maximum: 86400
          description: Time-to-live in seconds. Controls how long resolvers cache this record.
          example: 3600
        priority:
          type: integer
          minimum: 0
          maximum: 65535
          description: Priority value for MX and SRV records. Lower values are preferred.
        service:
          type: string
          description: Service label for SRV records (e.g. _http).
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: Port number for SRV records.
        weight:
          type: integer
          minimum: 0
          maximum: 65535
          description: |
            Weight for SRV load balancing among records with equal priority. Higher weight increases the probability of selection.
        protocol:
          type: string
          description: Protocol identifier for SRV records (e.g. _tcp, _udp).
        flag:
          type: integer
          minimum: 0
          maximum: 255
          description: |
            Flag byte for CAA records. 0 indicates non-critical; 128 indicates critical (the issuer must understand the tag property to proceed).
        tag:
          type: string
          description: |
            Tag property for CAA records. Common values: issue, issuewild, iodef.
    Uuid:
      description: A universally unique identifier (UUID) in [RFC-4122 format](https://tools.ietf.org/html/rfc4122).
      type: string
      format: uuid
    LinkDescription:
      title: Link Description
      type: object
      description: A request-related [HATEOAS link](https://datatracker.ietf.org/doc/html/draft-handrews-json-schema-hyperschema-02).
      properties:
        href:
          description: The complete target URL, or link, to use in combination with the method to make the related call, as defined by [RFC 6570 - URI Template](https://tools.ietf.org/html/rfc6570), with the addition of the `$`, `(`, and `)` characters for pre-processing. The `href` is the key HATEOAS component that links a completed call with a subsequent call.
          type: string
          format: uri
        rel:
          description: The [link relation type](https://tools.ietf.org/html/rfc5988#section-4), which is an identifier for a link that unambiguously describes the semantics of the link. For values, see [Link Relationship Types](https://www.iana.org/assignments/link-relations/link-relations.xhtml).
          type: string
        title:
          description: The link title.
          type: string
        targetMediaType:
          description: The [RFC 2046-defined media type](https://www.ietf.org/rfc/rfc2046.txt) that describes the link target.
          type: string
        targetSchema:
          description: The schema that describes the link target.
        method:
          description: The method to use to request the link target. For example, for HTTP, this might be `GET` or `DELETE`.
          type: string
        submissionMediaType:
          description: The media type with which to submit data with the request.
          type: string
          default: application/json
        submissionSchema:
          description: The schema that describes the request data.
      required:
        - rel
        - href
    Error_v3:
      type: object
      title: Error
      description: The error information.
      properties:
        name:
          type: string
          description: The human-readable, unique name of the error.
        correlationId:
          type: string
          description: Internal identifier used for correlation purposes.
        message:
          type: string
          description: The message that describes the error.
        informationLink:
          type: string
          description: The URI for detailed information related to this error for the developer.
        details:
          type: array
          description: An array of additional details about the error. Required for client-side `4XX` errors.
          additionalItems: false
          items:
            $ref: '#/components/schemas/ErrorDetails'
        links:
          type: array
          description: An array of error-related HATEOAS links.
          readOnly: true
          items:
            $ref: '#/components/schemas/LinkDescription'
            readOnly: true
      required:
        - name
        - correlationId
        - message
    ErrorDetails:
      title: Error Details
      type: object
      description: The error details. Required for client-side `4XX` errors.
      properties:
        field:
          type: string
          description: The field that caused the error. If the field is in the body, set this value to the JSON pointer to that field. Required for client-side errors.
        value:
          type: string
          description: The value of the field that caused the error.
        location:
          type: string
          description: The location of the field that caused the error. Value is `body`, `path`, or `query`.
          default: body
        issue:
          type: string
          description: The unique fine-grained application-level error code.
        description:
          type: string
          description: The human-readable description for an issue. The description MAY change over the lifetime of an API, so clients MUST NOT depend on this value.
      required:
        - issue
  parameters:
    xRequestId:
      name: X-Request-Id
      in: header
      description: |
        Optional client-generated request correlation identifier, propagated across services and returned in the response X-Request-Id header.
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    zonePath:
      name: zone
      in: path
      description: |
        The domain name in punycode A-label form (for example, example.com). For IDNs, use the punycode representation.
      required: true
      schema:
        type: string
      example: example.com
    page:
      name: page
      in: query
      description: |
        One-based page number for offset-based pagination. Defaults to 1.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 2
    pageSize:
      name: pageSize
      in: query
      description: |
        Maximum number of items to return per page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    totalRequired:
      name: totalRequired
      in: query
      description: |
        When true, the response includes totalItems and totalPages for the current filter when at least one record matches. Both are omitted when the result set is empty. Defaults to false; omitting totals avoids the cost of a count query on large collections.
      required: false
      schema:
        type: boolean
        default: false
      example: true
    fields:
      name: fields
      in: query
      description: |
        Comma-separated list of fields to include in each item of the response. Omitted fields are excluded from the payload. When absent, all fields are returned. Field names must match properties defined on the item schema for the operation; any unknown or invalid name returns 400 Bad Request.
      required: false
      schema:
        type: string
      example: name,type,data,ttl
    recordId:
      name: recordId
      in: path
      description: Server-assigned DNS record identifier within the zone.
      required: true
      schema:
        type: string
      example: Aad7oqdXCms9mlJvm_m6UFYqmwjyP20H2KBmQHgttK9kGbF_TuI3knsocArQqIv5I0Kq5C0
  responses:
    '400':
      description: Malformed request syntax, missing required field, or invalid field type.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '401':
      description: Authentication credentials are missing or invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '403':
      description: Authenticated identity is not authorized to perform this operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '404':
      description: The requested resource was not found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '409':
      description: |
        Conflict — the request cannot be completed in the current state. Used for quote lifecycle errors (quote_expired, quote_consumed), domain state conflicts such as domain_already_exists, and immutable DNS records (dns_record_not_mutable) such as GoDaddy-managed SOA and NS records.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '422':
      description: |
        Semantically invalid request — valid structure but violates a business rule, such as an ineligible contact, unsupported TLD, non-renewable domain status, or quote_mismatch (e.g. iscCode or acknowledgedFees that do not match the locked quote).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '429':
      description: Too many requests — rate limit exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
  headers:
    xRequestId:
      description: Request correlation identifier echoed from the request or server-generated.
      schema:
        $ref: '#/components/schemas/Uuid'
    location:
      description: URL of the created or async resource.
      schema:
        type: string
        format: uri
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'GoDaddy Personal Access Token (PAT), passed as Authorization: Bearer <token>.'
