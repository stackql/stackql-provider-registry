  /v3/domains/zones/{zone}/dns-records/{recordId}:
    put:
      operationId: replaceDNSRecord
      tags:
        - Records
      summary: Replace a DNS record
      description: |
        Fully replaces an existing DNS resource record identified by
        recordId within the zone. All writable fields (name, type, data,
        ttl) must be supplied; partial updates are not supported on this
        endpoint. Changes are applied synchronously.

        GoDaddy-managed system records (SOA and NS) are read-only. When
        recordId refers to such a record, the request fails with
        `409 Conflict` — the record exists but cannot be modified.
      parameters:
        - $ref: '#/components/parameters/xRequestId'
        - $ref: '#/components/parameters/zonePath'
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSRecord_v3'
            examples:
              apexARecord:
                summary: Replace apex A record
                value:
                  name: '@'
                  type: A
                  data: 192.0.2.1
                  ttl: 3600
      security:
        - bearerAuth: []
      responses:
        '200':
          description: DNS record replaced.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/xRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSRecord_v3'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
    delete:
      operationId: deleteDNSRecord
      tags:
        - Records
      summary: Delete a DNS record
      description: |
        Permanently removes a DNS resource record from the zone. The
        recordId must refer to an existing record within the specified
        zone. Changes are applied synchronously.

        GoDaddy-managed system records (SOA and NS) are read-only. When
        recordId refers to such a record, the request fails with
        `409 Conflict` — the record exists but cannot be deleted.
      parameters:
        - $ref: '#/components/parameters/xRequestId'
        - $ref: '#/components/parameters/zonePath'
        - $ref: '#/components/parameters/recordId'
      security:
        - bearerAuth: []
      responses:
        '204':
          description: DNS record deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/xRequestId'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
components:
  schemas:
    ArrayOfDNSRecord:
      type: array
      items:
        $ref: '#/components/schemas/DNSRecord'
    Error:
      properties:
        code:
          description: Short identifier for the error, suitable for indicating the specific error within client code
          format: constant
          type: string
        fields:
          description: List of the specific fields, and the errors found with their contents
          items:
            $ref: '#/components/schemas/ErrorField_v2'
          type: array
        message:
          description: Human-readable, English description of the error
          type: string
      required:
        - code
      type: object
    ErrorLimit:
      properties:
        code:
          description: Short identifier for the error, suitable for indicating the specific error within client code
          format: constant
          type: string
        fields:
          description: List of the specific fields, and the errors found with their contents
          items:
            $ref: '#/components/schemas/ErrorField_v2'
          type: array
        message:
          description: Human-readable, English description of the error
          type: string
        retryAfterSec:
          description: Number of seconds to wait before attempting a similar request
          format: integer-positive
          type: integer
      required:
        - retryAfterSec
        - code
      type: object
    DNSRecord:
      properties:
        data:
          type: string
        name:
          format: domain
          type: string
