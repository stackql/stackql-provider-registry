openapi: 3.1.1
info:
  title: GoDaddy DNS
  description: DNS zone records (Domains v1 bulk record management and the Domains v3 record-id based CRUD) and domain forwarding rules (Domains v2).
  version: v00.00.00000
servers:
  - url: https://api.godaddy.com
    description: GoDaddy production API
security:
  - bearerAuth: []
tags: []
paths:
  /v1/domains/{domain}/records:
    patch:
      tags:
        - Manage DNS
      parameters:
        - description: 'Shopper ID which owns the domain. NOTE: This is only required if you are a Reseller managing a domain purchased outside the scope of your reseller account.'
          in: header
          name: X-Shopper-Id
          required: false
          schema:
            type: string
        - description: Domain whose DNS Records are to be augmented
          in: path
          name: domain
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - records
              properties:
                records:
                  $ref: '#/components/schemas/ArrayOfDNSRecord'
                  description: DNS records to write (the request body array).
          application/xml:
            schema:
              type: object
              required:
                - records
              properties:
                records:
                  $ref: '#/components/schemas/ArrayOfDNSRecord'
                  description: DNS records to write (the request body array).
          text/xml:
            schema:
              type: object
              required:
                - records
              properties:
                records:
                  $ref: '#/components/schemas/ArrayOfDNSRecord'
                  description: DNS records to write (the request body array).
        description: DNS Records to add to whatever currently exists
        required: true
      responses:
        '200':
          description: Request was successful
        '400':
          description: Request was malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/javascript:
              schema:
                $ref: '#/components/schemas/Error'
