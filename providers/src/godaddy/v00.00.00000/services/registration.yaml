        autoRenew:
          type: boolean
          description: |
            Auto-renew preference for this registration. Omit to inherit from the resolved saved profile or account defaults.
        privacy:
          type: boolean
          description: |
            WHOIS privacy preference for this registration. Omit to inherit from the resolved saved profile or account defaults.
        nameServers:
          type: array
          minItems: 2
          maxItems: 13
          items:
            type: string
            description: Fully-qualified nameserver hostname.
          description: |
            Authoritative nameservers for this registration. Omit to inherit from the resolved saved profile or platform defaults.
          example:
            - ns1.example.com
            - ns2.example.com
    RegistrationQuote:
      title: Registration Quote
      description: |
        A price quote for registering a single domain. Contains a locked price, resolved contact and preference settings, required legal agreements, and a short-lived single-use quoteToken that must be presented on the subsequent registration execute call. Execution without a valid quoteToken is structurally impossible.
        When available is false, no quoteToken is returned — this is not an error; it means the domain cannot be registered as requested.
      type: object
      required:
        - domain
        - available
      properties:
        quoteToken:
          description: A universally unique identifier (UUID) in [RFC-4122 format](https://tools.ietf.org/html/rfc4122).
          type: string
          format: uuid
          example: 7f3a2b1c-9d8e-4012-a5b6-c1d2e3f4a5b6
        expiresAt:
          description: 'A date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6). Note: The regular expression provides static schematic guidance but does not reject all invalid dates.'
          type: string
          minLength: 20
          maxLength: 64
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])[T,t]([0-1][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$
        domain:
          type: string
          description: |
            The domain name being quoted, in punycode A-label form for IDNs.
          example: example.com
        available:
          type: boolean
          description: |
            Whether the domain is available for registration. When false, no quoteToken is returned. The availability check at quote time is authoritative; a name sniped between suggest/availability and quote fails cleanly here.
        price:
          type: object
          title: Simple Money
          description: The currency and amount for a financial transaction, such as a balance or payment due. Use for value representations with default transactable-value precision.
          properties:
            currencyCode:
              $ref: '#/components/schemas/CurrencyCode'
            value:
              type: integer
              format: int64
              description: The value, which might represent intergrals for currencies like `JPY` that are not typically fractional; or, with an implied decimal fraction for currencies like `TND` that are subdivided into thousandths. For the implied number of decimal places for a currency code, see [ISO-4217 Currency Codes](https://en.wikipedia.org/wiki/ISO_4217).
          required:
            - currencyCode
            - value
        renewalPrice:
          type: object
          title: Simple Money
          description: The currency and amount for a financial transaction, such as a balance or payment due. Use for value representations with default transactable-value precision.
          properties:
            currencyCode:
              $ref: '#/components/schemas/CurrencyCode'
            value:
              type: integer
              format: int64
              description: The value, which might represent intergrals for currencies like `JPY` that are not typically fractional; or, with an implied decimal fraction for currencies like `TND` that are subdivided into thousandths. For the implied number of decimal places for a currency code, see [ISO-4217 Currency Codes](https://en.wikipedia.org/wiki/ISO_4217).
          required:
            - currencyCode
            - value
        period:
          type: integer
          minimum: 1
          maximum: 10
          description: Registration period in years for which the price is quoted.
          example: 1
        resolved:
          title: Resolved Settings
          description: |
            A preview of the effective settings that will be applied if the associated quote is executed. Returned in the quote response to eliminate invisible side effects — the caller sees exactly whose contact info and which preferences will be used before making a commitment. contactSource names where the registrant contact came from so an agent can be explicit at the confirmation step.
          type: object
          properties:
            profileId:
              description: A universally unique identifier (UUID) in [RFC-4122 format](https://tools.ietf.org/html/rfc4122).
              type: string
              format: uuid
              readOnly: true
              example: 14514a29-5fce-4624-8d8a-d8abd56015e2
            contactSource:
              title: Contact Source
              description: |
                Where the resolved registrant contact came from. INLINE — contact was supplied via an inline registration profile on the request. PROFILE — contact was resolved from a named or default saved profile. ACCOUNT — contact was derived from the authenticated principal's account identity (no profile supplied or on file).
              type: string
              enum:
                - INLINE
                - PROFILE
                - ACCOUNT
              example: PROFILE
            registrantSummary:
              type: string
              description: |
                A human-readable one-line summary of the resolved registrant, suitable for display in a confirmation prompt. When contactSource is ACCOUNT, the summary is suffixed with "(account identity)" to make the derivation explicit.
              example: Jane Smith / jane@example.com
            autoRenew:
              type: boolean
              description: |
                The effective auto-renew setting that will be applied upon registration.
            privacy:
              type: boolean
              description: |
                The effective WHOIS privacy setting that will be applied upon registration.
            nameServers:
              type: array
              items:
                type: string
                description: Fully-qualified nameserver hostname.
              description: |
                The effective nameservers that will be provisioned for the domain.
              example:
                - ns01.domaincontrol.com
                - ns02.domaincontrol.com
        requiredAgreements:
          type: array
          items:
            $ref: '#/components/schemas/Agreement'
          description: |
            Legal agreements that must be accepted before executing this quote. The agreementType values from this list must be included in the execute request's consent object.
        irreversible:
          type: boolean
          description: |
            Whether executing this quote is irreversible once accepted. Use to calibrate the explicitness of any confirmation step presented before execute.
          example: false
        inventory:
          title: Inventory Type
          description: |
            The inventory source for a domain name. REGISTRY — standard registry price inventory. REGISTRY_PREMIUM — registry premium tier pricing. PREMIUM — third-party premium domain marketplace.
          type: string
          enum:
            - REGISTRY
            - REGISTRY_PREMIUM
            - PREMIUM
          readOnly: true
        fees:
          type: array
          description: |
            Fees charged at the time of purchase, in addition to the registration price. Present when the domain incurs purchase fees beyond the base registration cost.
            These are the same fees as TermPrice.fees for the selected term (this quote's period) — not a separate term-independent fee list and not additional to term-level fees. Execute cost is price plus this array. Mirrored on Registration.fees after execute.
          items:
            $ref: '#/components/schemas/Fee'
    Registration:
      title: Registration
      description: |
        A domain registration entity created when a POST /registrations request is accepted. Registrations are a top-level resource with their own stable registrationId; the domain relationship is captured in the representation.
        On POST /registrations, supply the writable fields (domain, period, quoteToken, consent, and optionally profileId/profile). The server returns the full Registration with readOnly fields populated. Poll links[rel=self] until status reaches COMPLETED or FAILED. The same resource is also reachable via GET /operations/{operationId} for clients operating at the abstract level; operationId is included in the representation for that purpose.
      type: object
      required:
        - domain
        - quoteToken
        - consent
      properties:
        registrationId:
          description: A universally unique identifier (UUID) in [RFC-4122 format](https://tools.ietf.org/html/rfc4122).
          type: string
          format: uuid
          readOnly: true
        domain:
          type: string
          description: |
            The domain name to register, in punycode A-label form for IDNs. Must match the domain in the quoteToken.
          example: example.com
        period:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Registration period in years. Must match the period in the quote.
          example: 1
