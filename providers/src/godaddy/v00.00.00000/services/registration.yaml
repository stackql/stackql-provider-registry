      operationId: available
      summary: Determine whether or not the specified domain is available for purchase
      description: Checks whether a single domain is available to register and returns the current price in currency-micro-unit format. The definitive flag indicates whether the result came from a live registry query.
    post:
      tags:
        - Find Domains
      parameters:
        - description: Optimize for time ('FAST') or accuracy ('FULL')
          in: query
          name: checkType
          required: false
          schema:
            type: string
            enum:
              - FAST
              - FULL
              - fast
              - full
            default: FAST
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - domains
              properties:
                domains:
                  items:
                    type: string
                  maximum: 500
                  type: array
                  description: Domain names to check (the request body array).
          application/xml:
            schema:
              type: object
              required:
                - domains
              properties:
                domains:
                  items:
                    type: string
                  maximum: 500
                  type: array
                  description: Domain names to check (the request body array).
          text/xml:
            schema:
              type: object
              required:
                - domains
              properties:
                domains:
                  items:
                    type: string
                  maximum: 500
                  type: array
                  description: Domain names to check (the request body array).
        description: Domain names for which to check availability
        required: true
      responses:
