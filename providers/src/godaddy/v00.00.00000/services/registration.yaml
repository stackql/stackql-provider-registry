    SuggestionSource:
      title: Suggestion Source
      description: |
        A suggestion source strategy that generates domain name variations. EXTENSION — vary the TLD. KEYWORD_SPIN — rotate keywords. CC_TLD — vary using country-code TLDs. PREMIUM — include premium-priced variations.
      type: string
      enum:
        - CC_TLD
        - EXTENSION
        - KEYWORD_SPIN
        - PREMIUM
    Suggestion:
      title: Suggestion
      description: |
        A single available domain suggestion returned by the suggest endpoint. Availability is implied by presence in the results (available-only contract) and is best-effort — the availability check at quote time is the authoritative re-check. Indicative pricing may be stale; the locked price is established at quote time only.
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
          description: |
            The suggested domain name in punycode A-label form.
          example: sunrisebakery.com
        prices:
          type: array
          description: |
            Multi-term pricing for this suggestion. Each entry represents a different registration period. Indicative only — the locked price is established at quote time.
          items:
            $ref: '#/components/schemas/TermPrice'
        inventory:
          title: Inventory Type
          description: |
            The inventory source for a domain name. REGISTRY — standard registry price inventory. REGISTRY_PREMIUM — registry premium tier pricing. PREMIUM — third-party premium domain marketplace.
          type: string
          enum:
            - REGISTRY
            - REGISTRY_PREMIUM
            - PREMIUM
          example: REGISTRY
    OptimizationTarget:
      title: Optimization Target
      description: |
        How an availability check should prioritize speed vs. authoritative accuracy. SPEED — use cached zone data for a fast response (may be slightly stale). ACCURACY — perform a live registry check for authoritative availability (higher latency).
      type: string
      enum:
        - SPEED
        - ACCURACY
    Availability:
      title: Availability
      description: |
        The availability check result for a single requested domain. A checkable domain returns the available flag plus optional pricing. A domain that could not be checked carries an error object and no availability fields. Exactly one of available or error is present per item.
        Availability is best-effort indicative; the authoritative availability check is performed at quote time. definitive: true means the result was confirmed directly with the registry rather than from a cached zone check.
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
          description: |
            The domain name checked, normalized to punycode A-label form.
          example: example.com
        unicodeDomain:
          type: string
          description: |
            The Unicode (U-label) form of the domain. Present only for IDN domains.
          example: münchen.de
        available:
          type: boolean
          description: |
            Whether this domain appears to be available for registration. Best-effort; re-verified at quote time. Present only when the domain was successfully checked (no error).
        definitive:
          type: boolean
          description: |
            When true, the availability result was confirmed directly with the registry (ACCURACY mode). When false, the result is from a cached zone data check (SPEED mode) and may be stale.
        inventory:
          title: Inventory Type
          description: |
            The inventory source for a domain name. REGISTRY — standard registry price inventory. REGISTRY_PREMIUM — registry premium tier pricing. PREMIUM — third-party premium domain marketplace.
          type: string
          enum:
            - REGISTRY
            - REGISTRY_PREMIUM
            - PREMIUM
          example: REGISTRY
        prices:
          type: array
          description: |
            Multi-term pricing for this domain. Each entry represents a different registration period (e.g. 1 year, 2 years). Present when available is true.
          items:
            $ref: '#/components/schemas/TermPrice'
        error:
          type: object
          title: Error
          description: The error information.
          properties:
            name:
              type: string
              description: The human-readable, unique name of the error.
            correlationId:
              type: string
              description: Internal identifier used for correlation purposes.
            message:
              type: string
              description: The message that describes the error.
            informationLink:
              type: string
              description: The URI for detailed information related to this error for the developer.
            details:
              type: array
              description: An array of additional details about the error. Required for client-side `4XX` errors.
              additionalItems: false
              items:
                $ref: '#/components/schemas/ErrorDetails'
            links:
              type: array
              description: An array of error-related HATEOAS links.
              readOnly: true
              items:
                $ref: '#/components/schemas/LinkDescription'
                readOnly: true
          required:
            - name
            - correlationId
            - message
    AvailabilityCheckCriteria:
      title: Availability Check Criteria
      description: |
        Request body for the POST /check-availability controller. Specifies the domain names to check and optional parameters that influence how the check is performed. The response returns one Availability result per requested domain in input order.
        This controller does not persist the check; there is no check identity or poll URL.
      type: object
      required:
        - domains
      properties:
        domains:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
          description: |
            List of 1–25 domain names to check, in punycode A-label form for IDNs.
          example:
            - example.com
            - example.net
        optimizeFor:
          title: Optimization Target
          description: |
            How an availability check should prioritize speed vs. authoritative accuracy. SPEED — use cached zone data for a fast response (may be slightly stale). ACCURACY — perform a live registry check for authoritative availability (higher latency).
          type: string
          enum:
            - SPEED
            - ACCURACY
          default: SPEED
          example: SPEED
        iscCode:
          type: string
          description: |
            Reseller ISC (International Shopper Code) for pricing context. When provided, the indicative prices in the results reflect the applicable reseller rates for this ISC.
          example: ISC_PARTNER_001
    Uuid:
      description: A universally unique identifier (UUID) in [RFC-4122 format](https://tools.ietf.org/html/rfc4122).
      type: string
      format: uuid
    InlineRegistrationProfile:
      title: Inline Registration Profile
      description: |
        A one-time, non-persisted set of contacts and purchase preference defaults supplied inline on a quote or execute request. Use to provide registration data for this transaction without creating or updating a saved registration profile.
        Shared by the registration quote and execute request bodies. Every field is optional. Omitted fields account identity or other default values. Provided fields override only what is supplied — contact roles replace as a whole block; preference fields replace individually.
        This is not a saved registration profile and is not JSON Patch. Data here applies only to the current quote or registration request.
      type: object
      properties:
        contacts:
          title: Contacts
          description: |
            The set of ICANN-required contact roles for a domain registration. Registrant is required; admin, tech, and billing cascade from the registrant when omitted. Merge rule across resolution layers (saved profile, inline registration profile): identity fields replace as a whole block per role.
          type: object
          required:
            - registrant
          properties:
            registrant:
              title: Contact
              description: |
                An ICANN-required contact record for a domain registration. Covers registrant, administrative, technical, and billing roles. Identity fields are validated at registration-profile save time.
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
                - address
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: The contact's first (given) name.
                  example: Jane
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: The contact's last (family) name.
                  example: Smith
                organization:
                  type: string
                  maxLength: 100
                  description: |
                    Organization or company name. Required for contacts acting on behalf of a legal entity. Leave blank for individual registrants.
                  example: Example LLC
                email:
                  description: 'A valid, internationalized email address. Note: Up to 64 characters are allowed before and 255 characters are allowed after the @ sign. However, the generally accepted maximum length for an email address is 254 characters. The pattern verifies that an unquoted @ sign exists.'
                  type: string
                  minLength: 3
                  maxLength: 254
                  pattern: ^.+@[^"\-].+$
                  example: foo@bar.com
                phone:
                  type: object
                  title: Phone
                  description: The phone number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en).
                  properties:
                    countryCode:
                      type: string
                      description: The country calling code (CC), in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en). The combined length of the CC and the national number must not be greater than 15 digits. The national number consists of a national destination code (NDC) and subscriber number (SN).
                      minLength: 1
                      maxLength: 3
                      pattern: ^[0-9]{1,3}?$
                    nationalNumber:
                      type: string
                      description: The national number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en). The combined length of the country calling code (CC) and the national number must not be greater than 15 digits. The national number consists of a national destination code (NDC) and subscriber number (SN).
                      minLength: 1
                      maxLength: 14
                      pattern: ^[0-9]{1,14}?$
                    extensionNumber:
                      type: string
                      description: The extension number.
                      minLength: 1
                      maxLength: 15
                      pattern: ^[0-9]{1,15}?$
                  required:
                    - countryCode
                    - nationalNumber
                  example:
                    countryCode: '1'
                    nationalNumber: '4805551234'
                address:
                  type: object
                  title: Simple Postal Address (Coarse-Grained)
                  description: Simple postal address with coarse-grained fields. Do not use for international postal addresses. Use for backward compatibility only. Address does not contain a phone number.
                  properties:
                    line1:
                      type: string
                      description: The first line of the address. For example, number or street.
                      maxLength: 300
                    line2:
                      type: string
                      description: The second line of the address. For example, suite or apartment number.
                      maxLength: 300
                    city:
                      type: string
                      description: The city name.
                      maxLength: 300
                    state:
                      type: string
                      description: The [code](https://about.usps.com/who/profile/history/state-abbreviations.htm) for a US state or the equivalent for other countries.
                      maxLength: 300
                    countryCode:
                      $ref: '#/components/schemas/CountryCode'
                      description: 'The [two-character ISO 3166-1 code](https://en.wikipedia.org/wiki/ISO_3166-1) that identifies the country or region. Note: The country code for Great Britain is `GB` and not `UK` as used in the top-level domain names for that country. Use country code `C2` for China for comparable uncontrolled price (CUP) method, bank-card, and cross-border transactions.'
                    postalCode:
                      type: string
                      description: The postal code, which is the zip code or equivalent. Typically required for countries that have a postal code or an equivalent. See [Postal Code](https://en.wikipedia.org/wiki/Postal_code).
                      maxLength: 60
                  required:
                    - line1
                    - city
                    - countryCode
            admin:
              title: Contact
              description: |
                An ICANN-required contact record for a domain registration. Covers registrant, administrative, technical, and billing roles. Identity fields are validated at registration-profile save time.
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
                - address
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: The contact's first (given) name.
                  example: Jane
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: The contact's last (family) name.
                  example: Smith
                organization:
                  type: string
                  maxLength: 100
                  description: |
                    Organization or company name. Required for contacts acting on behalf of a legal entity. Leave blank for individual registrants.
                  example: Example LLC
                email:
                  description: 'A valid, internationalized email address. Note: Up to 64 characters are allowed before and 255 characters are allowed after the @ sign. However, the generally accepted maximum length for an email address is 254 characters. The pattern verifies that an unquoted @ sign exists.'
                  type: string
                  minLength: 3
                  maxLength: 254
                  pattern: ^.+@[^"\-].+$
                  example: foo@bar.com
                phone:
                  type: object
                  title: Phone
