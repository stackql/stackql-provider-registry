  /v3/domains/suggestions:
    get:
      operationId: suggestDomains
      tags:
        - Discovery
      summary: Suggest available domains for a query
      description: |
        Returns available domain name suggestions for a natural-language query
        or keyword set. All results are available (available-only contract).
        Prices are indicative; the authoritative price and availability check
        is at quote time.
      parameters:
        - $ref: '#/components/parameters/xRequestId'
        - name: query
          in: query
          required: false
          description: |
            Natural-language query or keywords describing the desired domain, e.g. "sunrise bakery". Used to generate creative and keyword-spin suggestions.
          schema:
            type: string
            maxLength: 100
          example: sunrise bakery
        - name: tlds
          in: query
          required: false
          description: Top-level domains to be included in suggestions.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          example:
            - com
            - net
            - shop
        - name: lengthMax
          in: query
          required: false
          description: Maximum length of second-level domain.
          schema:
            type: integer
            minimum: 1
        - name: lengthMin
          in: query
          required: false
          description: Minimum length of second-level domain.
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: |
            Maximum number of suggestions in the response. Defaults to 10 when omitted.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: sources
          in: query
          required: false
          description: |
            Suggestion source strategies to activate.
