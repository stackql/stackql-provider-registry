  /v3/domains/check-availability:
    get:
      operationId: getDomainAvailability
      tags:
        - Discovery
      summary: Check availability of a single domain
      description: |
        Returns an indicative availability result for one domain, including
        per-term pricing when available. Availability is best-effort; the
        authoritative check is performed at quote time. This operation does
        not persist the check — there is no check identity or poll URL.

        A domain that cannot be checked is still returned as a `200` with an
        `error` object on the body; request-level failures use the `4xx` responses.
      parameters:
        - $ref: '#/components/parameters/xRequestId'
        - name: domain
          in: query
          required: true
          description: The domain name to check, in punycode A-label form for IDNs.
          schema:
            type: string
          example: example.com
        - name: optimizeFor
          in: query
          required: false
          description: |
            Optional. When omitted, defaults to SPEED. Availability is always re-verified authoritatively at quote time regardless of this setting.
          schema:
            default: SPEED
            title: Optimization Target
            description: |
              How an availability check should prioritize speed vs. authoritative accuracy. SPEED — use cached zone data for a fast response (may be slightly stale). ACCURACY — perform a live registry check for authoritative availability (higher latency).
            type: string
            enum:
              - SPEED
              - ACCURACY
          example: SPEED
        - $ref: '#/components/parameters/iscCode'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Availability result for the requested domain.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/xRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
              examples:
                available:
                  summary: Available domain with per-term pricing
                  value:
                    domain: coffee24x7x365.com
                    available: true
                    definitive: false
                    inventory: REGISTRY
                    prices:
                      - term: YEAR
                        period: 1
                        price:
                          currencyCode: USD
                          value: 1199
                        renewalPrice:
                          currencyCode: USD
                          value: 2299
                      - term: YEAR
                        period: 2
                        price:
                          currencyCode: USD
                          value: 3098
                        renewalPrice:
                          currencyCode: USD
                          value: 4598
                        firstTermPrice:
                          currencyCode: USD
                          value: 799
                      - term: YEAR
                        period: 3
                        price:
                          currencyCode: USD
                          value: 4599
                        renewalPrice:
                          currencyCode: USD
                          value: 6897
                        firstTermPrice:
                          currencyCode: USD
                          value: 499
                        recommended: true
                      - term: YEAR
                        period: 5
                        price:
                          currencyCode: USD
                          value: 9197
                        renewalPrice:
                          currencyCode: USD
                          value: 11495
                        firstTermPrice:
                          currencyCode: USD
                          value: 100
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
    post:
      operationId: checkAvailability
      tags:
        - Discovery
      summary: Check availability of one or more specific domains
      description: |
        Batch controller for domain availability checking. Accepts 1–25 domain
        names alongside optional check criteria (optimization mode, ISC pricing
        code). Returns one Availability result per requested domain in input
        order inside `{ items: [...] }`. Domains that cannot be checked carry
        an `error` object on that item.

        For a single domain, GET /check-availability (getDomainAvailability)
        offers the same check semantics and Availability result without a
        request body; the response is the lone item unwrapped.

        Availability is best-effort indicative; the authoritative check is
        always performed at quote time. This controller does not persist the
        check — there is no check identity or poll URL.
      parameters:
        - $ref: '#/components/parameters/xRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityCheckCriteria'
            examples:
              defaultBehavior:
                summary: Omit optimizeFor — defaults to SPEED
                value:
                  domains:
                    - example.com
                    - example.net
              speedCheck:
                summary: Check two domains using cached data
                value:
                  domains:
                    - example.com
                    - example.net
                  optimizeFor: SPEED
              accuracyCheck:
                summary: Live registry check with ISC pricing context
                value:
                  domains:
                    - example.com
                  optimizeFor: ACCURACY
                  iscCode: ISC_PARTNER_001
      security:
        - bearerAuth: []
      responses:
        '200':
          description: |
            Per-domain availability results in request order. Uncheckable items carry an error object.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/xRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    description: |
                      Availability results in the same order as the domains array in the request body.
                    items:
                      $ref: '#/components/schemas/Availability'
              examples:
                mixedResults:
                  summary: One available domain and one uncheckable domain
                  value:
                    items:
                      - domain: example.com
                        available: true
                        definitive: false
                        inventory: REGISTRY
                        prices:
                          - term: YEAR
                            period: 1
                            price:
                              currencyCode: USD
                              value: 1999
                            renewalPrice:
                              currencyCode: USD
                              value: 1999
                          - term: YEAR
                            period: 2
                            price:
                              currencyCode: USD
                              value: 3098
                            renewalPrice:
                              currencyCode: USD
                              value: 4598
                            firstTermPrice:
                              currencyCode: USD
                              value: 799
                          - term: YEAR
                            period: 3
                            price:
                              currencyCode: USD
                              value: 4599
                            renewalPrice:
                              currencyCode: USD
                              value: 6897
                            firstTermPrice:
                              currencyCode: USD
                              value: 499
                            recommended: true
                      - domain: invalid..com
                        error:
                          name: MISMATCH_FORMAT
                          correlationId: 9f1c2e7a-4b3d-4e8f-a1c2-3d4e5f6a7b8c
                          message: 'does not conform to the ''domain'' format, based on pattern: /^[^.\s]{1,63}(\.[^.\s]{1,63}){1,2}$/'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
  /v3/domains/registration-quotes:
    post:
      operationId: quoteDomainRegistration
      tags:
        - Registration Quotes
      summary: Quote a single-domain registration (no commitment)
      description: |
        Prices the registration, resolves contact and preference settings,
        returns required legal agreements, and mints a single-use quoteToken
        with a 10-minute TTL. Free and read-only; safe to call speculatively.

        When the domain is unavailable, `available: false` is returned with
        no quoteToken — this is a valid non-error response.

        When required contact fields are missing, a `422` is returned with
        field-level details so the agent can collect the missing data and re-quote.

        May pass `iscCode` to lock pricing at applicable rates;
        the same value must be supplied on /registrations if provided here.
        The `period` supplied here must be re-supplied on /registrations;
        a mismatch returns `quote_mismatch`.
        If `profile` or `profileId` is supplied here, the same value must be
        re-supplied on /registrations; a mismatch returns `quote_mismatch`.

        **PREMIUM domains:** when the quoted domain has inventory `PREMIUM`,
        the response includes a `fees` array containing a
        `ONE_TIME_PREMIUM_DOMAIN_PURCHASE` entry. The execute request must
        echo this array verbatim in `consent.acknowledgedFees` to confirm
        the customer accepted the specific charge before the irreversible
        purchase proceeds.
      parameters:
        - $ref: '#/components/parameters/xRequestId'
        - $ref: '#/components/parameters/iscCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                domain:
                  type: string
                  description: The domain name to quote, in punycode A-label form.
                  example: example.com
                period:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
                  description: Registration period in years. If supplied, the same value must be re-supplied on /registrations.
                profileId:
                  description: A universally unique identifier (UUID) in [RFC-4122 format](https://tools.ietf.org/html/rfc4122).
                  type: string
                  format: uuid
                profile:
                  title: Inline Registration Profile
                  description: |
                    A one-time, non-persisted set of contacts and purchase preference defaults supplied inline on a quote or execute request. Use to provide registration data for this transaction without creating or updating a saved registration profile.
                    Shared by the registration quote and execute request bodies. Every field is optional. Omitted fields account identity or other default values. Provided fields override only what is supplied — contact roles replace as a whole block; preference fields replace individually.
                    This is not a saved registration profile and is not JSON Patch. Data here applies only to the current quote or registration request.
                  type: object
                  properties:
                    contacts:
                      title: Contacts
                      description: |
                        The set of ICANN-required contact roles for a domain registration. Registrant is required; admin, tech, and billing cascade from the registrant when omitted. Merge rule across resolution layers (saved profile, inline registration profile): identity fields replace as a whole block per role.
                      type: object
                      required:
                        - registrant
                      properties:
                        registrant:
                          title: Contact
                          description: |
                            An ICANN-required contact record for a domain registration. Covers registrant, administrative, technical, and billing roles. Identity fields are validated at registration-profile save time.
                          type: object
                          required:
                            - firstName
                            - lastName
                            - email
                            - phone
                            - address
                          properties:
                            firstName:
                              type: string
                              minLength: 1
                              maxLength: 60
                              description: The contact's first (given) name.
                              example: Jane
                            lastName:
                              type: string
                              minLength: 1
                              maxLength: 60
                              description: The contact's last (family) name.
                              example: Smith
                            organization:
                              type: string
                              maxLength: 100
                              description: |
                                Organization or company name. Required for contacts acting on behalf of a legal entity. Leave blank for individual registrants.
                              example: Example LLC
                            email:
                              description: 'A valid, internationalized email address. Note: Up to 64 characters are allowed before and 255 characters are allowed after the @ sign. However, the generally accepted maximum length for an email address is 254 characters. The pattern verifies that an unquoted @ sign exists.'
                              type: string
                              minLength: 3
                              maxLength: 254
                              pattern: ^.+@[^"\-].+$
                              example: foo@bar.com
                            phone:
                              type: object
                              title: Phone
                              description: The phone number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en).
                              properties:
                                countryCode:
                                  type: string
                                  description: The country calling code (CC), in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en). The combined length of the CC and the national number must not be greater than 15 digits. The national number consists of a national destination code (NDC) and subscriber number (SN).
                                  minLength: 1
                                  maxLength: 3
                                  pattern: ^[0-9]{1,3}?$
                                nationalNumber:
                                  type: string
                                  description: The national number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en). The combined length of the country calling code (CC) and the national number must not be greater than 15 digits. The national number consists of a national destination code (NDC) and subscriber number (SN).
                                  minLength: 1
                                  maxLength: 14
                                  pattern: ^[0-9]{1,14}?$
                                extensionNumber:
                                  type: string
                                  description: The extension number.
                                  minLength: 1
                                  maxLength: 15
                                  pattern: ^[0-9]{1,15}?$
                              required:
                                - countryCode
                                - nationalNumber
                              example:
                                countryCode: '1'
                                nationalNumber: '4805551234'
                            address:
                              type: object
                              title: Simple Postal Address (Coarse-Grained)
                              description: Simple postal address with coarse-grained fields. Do not use for international postal addresses. Use for backward compatibility only. Address does not contain a phone number.
                              properties:
