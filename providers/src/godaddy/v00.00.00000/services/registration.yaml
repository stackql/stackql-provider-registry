          description: Simple postal address with coarse-grained fields. Do not use for international postal addresses. Use for backward compatibility only. Address does not contain a phone number.
          properties:
            line1:
              type: string
              description: The first line of the address. For example, number or street.
              maxLength: 300
            line2:
              type: string
              description: The second line of the address. For example, suite or apartment number.
              maxLength: 300
            city:
              type: string
              description: The city name.
              maxLength: 300
            state:
              type: string
              description: The [code](https://about.usps.com/who/profile/history/state-abbreviations.htm) for a US state or the equivalent for other countries.
              maxLength: 300
            countryCode:
              $ref: '#/components/schemas/CountryCode'
              description: 'The [two-character ISO 3166-1 code](https://en.wikipedia.org/wiki/ISO_3166-1) that identifies the country or region. Note: The country code for Great Britain is `GB` and not `UK` as used in the top-level domain names for that country. Use country code `C2` for China for comparable uncontrolled price (CUP) method, bank-card, and cross-border transactions.'
            postalCode:
              type: string
              description: The postal code, which is the zip code or equivalent. Typically required for countries that have a postal code or an equivalent. See [Postal Code](https://en.wikipedia.org/wiki/Postal_code).
              maxLength: 60
          required:
            - line1
            - city
            - countryCode
    CurrencyCode:
      type: string
      title: Currency Code
      description: A three-character ISO-4217 currency code.
      minLength: 3
      maxLength: 3
    ContactSource:
      title: Contact Source
      description: |
        Where the resolved registrant contact came from. INLINE — contact was supplied via an inline registration profile on the request. PROFILE — contact was resolved from a named or default saved profile. ACCOUNT — contact was derived from the authenticated principal's account identity (no profile supplied or on file).
      type: string
      enum:
        - INLINE
        - PROFILE
        - ACCOUNT
    AgreementType:
      title: Agreement Type
      description: |
        The type of legal agreement that must be accepted prior to executing a domain operation. Additional agreement types may be returned for specific TLDs or product combinations. API_DPA - API Domain Purchase Agreement. DNTA — Domain Name Transfer Agreement. DNPA — Domain Name Privacy Agreement. HTTPS_NOTICE — HTTPS notice acknowledgment for eligible TLDs. AURA — AU Domain Agreement for .au TLD registrations and transfers. CIRA — Canadian Internet Registration Authority Agreement for .ca TLD registrations and transfers.
      type: string
    FeeType:
      title: Fee Type
      description: |
        The type of a fee charged at the time of purchase. ONE_TIME_PREMIUM_DOMAIN_PURCHASE — one-time acquisition cost charged by the aftermarket marketplace when purchasing a premium domain.
      type: string
    ConsentActor:
      title: Consent Actor
      description: |
        Identifies who gave consent and who transmitted it. One uniform schema for all actor types. Self-reported by the caller and treated as supplementary attestation; the server verifies principal against the resolved auth identity (OAuth token + X-Shopper-Id) and rejects with consent_principal_mismatch on disagreement. The persisted consent record is the union of this block and the verified auth context.
        principal identifies the account holder whose consent is being recorded. actor identifies the automated or intermediary party that transmitted the consent when different from the principal. For DIRECT, actor is omitted.
      type: object
      required:
        - type
        - principal
      properties:
        type:
          title: Consent Actor Type
          description: |
            Who transmitted consent on behalf of the principal. DIRECT — the principal acted directly; actor is omitted. AGENT — an AI or automation acted on behalf of the principal. RESELLER — a reseller acted on behalf of a shopper.
          type: string
          example: DIRECT
        principal:
          type: string
          description: |
            The shopper or account ID whose consent is being recorded. Must match the shopper resolved from the OAuth token and X-Shopper-Id header; mismatch returns consent_principal_mismatch.
          example: shopper_123
        actor:
          type: string
          description: |
            The automated agent or system that transmitted the consent. Omitted for DIRECT. For AGENT, identifies the specific agent instance. For RESELLER, may identify the reseller when distinct from the OAuth token subject.
          example: agent:claude/atlas-1
        ip:
          type: string
          description: |
            The IP address of the principal at the time consent was expressed, if known. Optional — an absent IP with a verified principal is preferred over a fabricated one.
          example: 203.0.113.7
    EmailAddress:
      description: 'A valid, internationalized email address. Note: Up to 64 characters are allowed before and 255 characters are allowed after the @ sign. However, the generally accepted maximum length for an email address is 254 characters. The pattern verifies that an unquoted @ sign exists.'
      type: string
      minLength: 3
      maxLength: 254
      pattern: ^.+@[^"\-].+$
    Phone:
      type: object
      title: Phone
      description: The phone number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en).
      properties:
        countryCode:
          type: string
          description: The country calling code (CC), in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en). The combined length of the CC and the national number must not be greater than 15 digits. The national number consists of a national destination code (NDC) and subscriber number (SN).
          minLength: 1
          maxLength: 3
          pattern: ^[0-9]{1,3}?$
        nationalNumber:
          type: string
          description: The national number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en). The combined length of the country calling code (CC) and the national number must not be greater than 15 digits. The national number consists of a national destination code (NDC) and subscriber number (SN).
          minLength: 1
          maxLength: 14
          pattern: ^[0-9]{1,14}?$
        extensionNumber:
          type: string
          description: The extension number.
          minLength: 1
          maxLength: 15
          pattern: ^[0-9]{1,15}?$
      required:
        - countryCode
        - nationalNumber
    SimplePostalAddress:
      type: object
      title: Simple Postal Address (Coarse-Grained)
      description: Simple postal address with coarse-grained fields. Do not use for international postal addresses. Use for backward compatibility only. Address does not contain a phone number.
      properties:
        line1:
          type: string
          description: The first line of the address. For example, number or street.
          maxLength: 300
        line2:
          type: string
          description: The second line of the address. For example, suite or apartment number.
          maxLength: 300
        city:
          type: string
          description: The city name.
          maxLength: 300
        state:
          type: string
          description: The [code](https://about.usps.com/who/profile/history/state-abbreviations.htm) for a US state or the equivalent for other countries.
          maxLength: 300
        countryCode:
          $ref: '#/components/schemas/CountryCode'
          description: 'The [two-character ISO 3166-1 code](https://en.wikipedia.org/wiki/ISO_3166-1) that identifies the country or region. Note: The country code for Great Britain is `GB` and not `UK` as used in the top-level domain names for that country. Use country code `C2` for China for comparable uncontrolled price (CUP) method, bank-card, and cross-border transactions.'
        postalCode:
          type: string
          description: The postal code, which is the zip code or equivalent. Typically required for countries that have a postal code or an equivalent. See [Postal Code](https://en.wikipedia.org/wiki/Postal_code).
          maxLength: 60
      required:
        - line1
        - city
        - countryCode
    ConsentActorType:
      title: Consent Actor Type
      description: |
        Who transmitted consent on behalf of the principal. DIRECT — the principal acted directly; actor is omitted. AGENT — an AI or automation acted on behalf of the principal. RESELLER — a reseller acted on behalf of a shopper.
      type: string
    CountryCode:
      description: A two-character ISO 3166-1 code that identifies the country or region.
      type: string
      maxLength: 2
      minLength: 2
      pattern: ^([A-Z]{2}|C2)$
  requestBodies:
    DomainPurchase:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainPurchase'
        application/xml:
          schema:
            $ref: '#/components/schemas/DomainPurchase'
        text/xml:
          schema:
            $ref: '#/components/schemas/DomainPurchase'
      description: An instance document expected to match the JSON schema returned by `./schema/{tld}`
      required: true
    DomainPurchaseV2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainPurchaseV2'
      description: An instance document expected to match the JSON schema returned by `./schema/{tld}`
      required: true
  parameters:
    xRequestId:
      name: X-Request-Id
      in: header
      description: |
        Optional client-generated request correlation identifier, propagated across services and returned in the response X-Request-Id header.
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    iscCode:
      name: iscCode
      in: query
      description: |
        ISC (International Shopper Code) for pricing context. When provided, prices reflect the applicable rates for this ISC.
      required: false
      schema:
        type: string
      example: ISC_PARTNER_001
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-generated unique key (UUID recommended). Retrying a mutating request with the same Idempotency-Key returns the original response without creating a duplicate side effect. Required on all execute endpoints.
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
      example: 9f1c2e7a-4b3d-4e8f-a1c2-3d4e5f6a7b8c
    registrationId:
      name: registrationId
      in: path
      description: Server-assigned registration identifier.
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    '400':
      description: Malformed request syntax, missing required field, or invalid field type.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '401':
      description: Authentication credentials are missing or invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '403':
      description: Authenticated identity is not authorized to perform this operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '404':
      description: The requested resource was not found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '409':
      description: |
        Conflict — the request cannot be completed in the current state. Used for quote lifecycle errors (quote_expired, quote_consumed), domain state conflicts such as domain_already_exists, and immutable DNS records (dns_record_not_mutable) such as GoDaddy-managed SOA and NS records.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '422':
      description: |
        Semantically invalid request — valid structure but violates a business rule, such as an ineligible contact, unsupported TLD, non-renewable domain status, or quote_mismatch (e.g. iscCode or acknowledgedFees that do not match the locked quote).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '429':
      description: Too many requests — rate limit exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
  headers:
    xRequestId:
      description: Request correlation identifier echoed from the request or server-generated.
      schema:
        $ref: '#/components/schemas/Uuid'
    location:
      description: URL of the created or async resource.
      schema:
        type: string
        format: uri
    retryAfter:
      description: |
        Suggested number of seconds before the client should poll again. Present on 202 responses and non-terminal operation poll responses.
      schema:
        type: integer
        example: 5
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'GoDaddy Personal Access Token (PAT), passed as Authorization: Bearer <token>.'
