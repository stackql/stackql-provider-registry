      operationId: getAgreement
      summary: Retrieve the legal agreement(s) required to purchase the specified TLD and add-ons
      description: Returns the TLD-specific legal agreements that must be accepted before purchase or transfer. The agreementKeys from this response are required in the consent object.
  /v1/domains/available:
    get:
      tags:
        - Find Domains
      parameters:
        - description: Domain name whose availability is to be checked
          in: query
          name: domain
          required: true
          schema:
            type: string
        - description: Optimize for time ('FAST') or accuracy ('FULL')
          in: query
          name: checkType
          required: false
          schema:
            type: string
            enum:
              - FAST
              - FULL
              - fast
              - full
            default: FAST
        - description: Whether or not to include domains available for transfer. If set to True, checkType is ignored
          in: query
          name: forTransfer
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Request was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainAvailableResponse'
            application/javascript:
