        firstTermPrice:
          $ref: '#/components/schemas/SimpleMoney'
          description: |
            Discounted price of only the first term unit within this multi-unit period. Typically omitted when period is 1 (where it equals price). Present when a first-term-only promotion applies to a multi-unit period.
