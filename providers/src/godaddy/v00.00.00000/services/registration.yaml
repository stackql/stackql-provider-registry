    DateTime:
      description: 'A date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6). Note: The regular expression provides static schematic guidance but does not reject all invalid dates.'
      type: string
      minLength: 20
      maxLength: 64
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])[T,t]([0-1][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$
    SimpleMoney:
      type: object
      title: Simple Money
      description: The currency and amount for a financial transaction, such as a balance or payment due. Use for value representations with default transactable-value precision.
      properties:
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        value:
          type: integer
          format: int64
          description: The value, which might represent intergrals for currencies like `JPY` that are not typically fractional; or, with an implied decimal fraction for currencies like `TND` that are subdivided into thousandths. For the implied number of decimal places for a currency code, see [ISO-4217 Currency Codes](https://en.wikipedia.org/wiki/ISO_4217).
      required:
        - currencyCode
        - value
    ResolvedSettings:
      title: Resolved Settings
      description: |
        A preview of the effective settings that will be applied if the associated quote is executed. Returned in the quote response to eliminate invisible side effects — the caller sees exactly whose contact info and which preferences will be used before making a commitment. contactSource names where the registrant contact came from so an agent can be explicit at the confirmation step.
      type: object
      properties:
        profileId:
          description: A universally unique identifier (UUID) in [RFC-4122 format](https://tools.ietf.org/html/rfc4122).
          type: string
          format: uuid
          readOnly: true
          example: 14514a29-5fce-4624-8d8a-d8abd56015e2
        contactSource:
          title: Contact Source
          description: |
            Where the resolved registrant contact came from. INLINE — contact was supplied via an inline registration profile on the request. PROFILE — contact was resolved from a named or default saved profile. ACCOUNT — contact was derived from the authenticated principal's account identity (no profile supplied or on file).
          type: string
          enum:
            - INLINE
            - PROFILE
            - ACCOUNT
          example: PROFILE
        registrantSummary:
          type: string
          description: |
            A human-readable one-line summary of the resolved registrant, suitable for display in a confirmation prompt. When contactSource is ACCOUNT, the summary is suffixed with "(account identity)" to make the derivation explicit.
          example: Jane Smith / jane@example.com
        autoRenew:
          type: boolean
          description: |
            The effective auto-renew setting that will be applied upon registration.
        privacy:
          type: boolean
          description: |
            The effective WHOIS privacy setting that will be applied upon registration.
        nameServers:
          type: array
          items:
            type: string
            description: Fully-qualified nameserver hostname.
          description: |
            The effective nameservers that will be provisioned for the domain.
          example:
            - ns01.domaincontrol.com
            - ns02.domaincontrol.com
    Agreement:
      title: Agreement
      description: |
        A legal agreement that must be accepted prior to executing a domain operation. Agreements are returned in the quote response and must be acknowledged in the execute request via the consent.agreementTypes array.
      type: object
      required:
        - agreementType
        - title
      properties:
        agreementType:
          title: Agreement Type
          description: |
            The type of legal agreement that must be accepted prior to executing a domain operation. Additional agreement types may be returned for specific TLDs or product combinations. API_DPA - API Domain Purchase Agreement. DNTA — Domain Name Transfer Agreement. DNPA — Domain Name Privacy Agreement. HTTPS_NOTICE — HTTPS notice acknowledgment for eligible TLDs. AURA — AU Domain Agreement for .au TLD registrations and transfers. CIRA — Canadian Internet Registration Authority Agreement for .ca TLD registrations and transfers.
          type: string
          example: API_DPA
        title:
          type: string
          description: |
            Human-readable title of the agreement, suitable for display to the customer.
          example: Domain Name Registration Agreement
        url:
          type: string
          format: uri
          description: URL to the full legal text of this agreement. Present when available.
          example: https://www.godaddy.com/agreements/showdoc?pageid=reg_sa
    Fee:
      title: Fee
      description: |
        Fees charged at the time of purchase, separate from the registration price. The type identifies the nature of the charge.
      type: object
      required:
        - type
        - fee
      properties:
        type:
          title: Fee Type
          description: |
            The type of a fee charged at the time of purchase. ONE_TIME_PREMIUM_DOMAIN_PURCHASE — one-time acquisition cost charged by the aftermarket marketplace when purchasing a premium domain.
          type: string
          example: ONE_TIME_PREMIUM_DOMAIN_PURCHASE
        fee:
          type: object
          title: Simple Money
          description: The currency and amount for a financial transaction, such as a balance or payment due. Use for value representations with default transactable-value precision.
          properties:
            currencyCode:
              $ref: '#/components/schemas/CurrencyCode'
            value:
              type: integer
              format: int64
              description: The value, which might represent intergrals for currencies like `JPY` that are not typically fractional; or, with an implied decimal fraction for currencies like `TND` that are subdivided into thousandths. For the implied number of decimal places for a currency code, see [ISO-4217 Currency Codes](https://en.wikipedia.org/wiki/ISO_4217).
          required:
            - currencyCode
            - value
    Consent_v3:
      title: Consent
      description: |
        Customer consent record for a domain operation, capturing which legal agreements were accepted, which fees were acknowledged, when, and by whom. On execute, the caller supplies agreementTypes, agreedAt, and (when the quote carries fees) acknowledgedFees. The server derives agreedBy from the authenticated request context (OAuth identity, X-Shopper-Id, client IP, and transmission channel).
      type: object
      required:
        - agreementTypes
        - agreedAt
      properties:
        agreementTypes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AgreementType'
          description: |
            The agreement types the customer accepted. Must match the agreementType values returned in the corresponding quote's requiredAgreements array.
          example:
            - API_DPA
        agreedAt:
          description: 'A date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6). Note: The regular expression provides static schematic guidance but does not reject all invalid dates.'
          type: string
          minLength: 20
          maxLength: 64
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])[T,t]([0-1][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$
        acknowledgedFees:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Fee'
          description: |
            Fees the customer explicitly acknowledged before executing the purchase.
            When the preceding quote's `fees` array is non-empty, this field must be present and contain the same entries verbatim (same types, amounts, and currencies). The server validates this against the locked quote token; a mismatch is rejected with `422 quote_mismatch`. This field is not in `required` because the obligation is conditional on quote state and cannot be expressed as a schema constraint — its absence is enforced at the API layer, not by validation tooling.
            Contrast with `Registration.fees` (read-only): that field records what the server charged; this field records what the customer acknowledged. Both share the Fee type.
            Omit when the quote carries no purchase fees (standard REGISTRY registration).
          example:
            - type: ONE_TIME_PREMIUM_DOMAIN_PURCHASE
              fee:
                value: 390000
                currencyCode: USD
        agreedBy:
          title: Consent Actor
          description: |
            Identifies who gave consent and who transmitted it. One uniform schema for all actor types. Self-reported by the caller and treated as supplementary attestation; the server verifies principal against the resolved auth identity (OAuth token + X-Shopper-Id) and rejects with consent_principal_mismatch on disagreement. The persisted consent record is the union of this block and the verified auth context.
            principal identifies the account holder whose consent is being recorded. actor identifies the automated or intermediary party that transmitted the consent when different from the principal. For DIRECT, actor is omitted.
          type: object
          required:
            - type
            - principal
          properties:
            type:
              title: Consent Actor Type
              description: |
                Who transmitted consent on behalf of the principal. DIRECT — the principal acted directly; actor is omitted. AGENT — an AI or automation acted on behalf of the principal. RESELLER — a reseller acted on behalf of a shopper.
              type: string
              example: DIRECT
            principal:
              type: string
              description: |
                The shopper or account ID whose consent is being recorded. Must match the shopper resolved from the OAuth token and X-Shopper-Id header; mismatch returns consent_principal_mismatch.
              example: shopper_123
            actor:
              type: string
              description: |
                The automated agent or system that transmitted the consent. Omitted for DIRECT. For AGENT, identifies the specific agent instance. For RESELLER, may identify the reseller when distinct from the OAuth token subject.
              example: agent:claude/atlas-1
            ip:
              type: string
              description: |
                The IP address of the principal at the time consent was expressed, if known. Optional — an absent IP with a verified principal is preferred over a fabricated one.
              example: 203.0.113.7
          readOnly: true
    DomainOperationStatus:
      title: Domain Operation Status
      description: |
        The execution state of an asynchronous domain operation. CONFIRMED — operation has been accepted and is queued for execution. EXECUTING — operation is actively being processed by the registry or downstream systems. COMPLETED — operation finished successfully; result data is available. FAILED — operation terminated with an unrecoverable error; error detail is attached.
      type: string
    LinkDescription:
      title: Link Description
      type: object
      description: A request-related [HATEOAS link](https://datatracker.ietf.org/doc/html/draft-handrews-json-schema-hyperschema-02).
      properties:
        href:
          description: The complete target URL, or link, to use in combination with the method to make the related call, as defined by [RFC 6570 - URI Template](https://tools.ietf.org/html/rfc6570), with the addition of the `$`, `(`, and `)` characters for pre-processing. The `href` is the key HATEOAS component that links a completed call with a subsequent call.
          type: string
          format: uri
        rel:
          description: The [link relation type](https://tools.ietf.org/html/rfc5988#section-4), which is an identifier for a link that unambiguously describes the semantics of the link. For values, see [Link Relationship Types](https://www.iana.org/assignments/link-relations/link-relations.xhtml).
          type: string
        title:
          description: The link title.
          type: string
        targetMediaType:
          description: The [RFC 2046-defined media type](https://www.ietf.org/rfc/rfc2046.txt) that describes the link target.
          type: string
        targetSchema:
          description: The schema that describes the link target.
        method:
          description: The method to use to request the link target. For example, for HTTP, this might be `GET` or `DELETE`.
          type: string
        submissionMediaType:
          description: The media type with which to submit data with the request.
          type: string
          default: application/json
        submissionSchema:
          description: The schema that describes the request data.
      required:
        - rel
        - href
    Term:
      title: Term
      description: |
        The unit of a registration period. YEAR — registration period is expressed in years.
      type: string
      enum:
        - YEAR
    ErrorDetails:
      title: Error Details
      type: object
      description: The error details. Required for client-side `4XX` errors.
      properties:
        field:
          type: string
          description: The field that caused the error. If the field is in the body, set this value to the JSON pointer to that field. Required for client-side errors.
        value:
          type: string
          description: The value of the field that caused the error.
        location:
          type: string
          description: The location of the field that caused the error. Value is `body`, `path`, or `query`.
          default: body
        issue:
          type: string
          description: The unique fine-grained application-level error code.
        description:
          type: string
          description: The human-readable description for an issue. The description MAY change over the lifetime of an API, so clients MUST NOT depend on this value.
      required:
        - issue
