    DomainStatus:
      title: Domain Status
      description: |
        The lifecycle state of a registered domain. ACTIVE — domain is registered and resolving normally. EXPIRED — domain has passed its expiration date; renewal still possible during the grace period. CANCELLED — domain registration has been cancelled and released. CANCELLED_REDEEMABLE — cancelled domain still within the redemption grace period. PENDING_TRANSFER — inbound transfer from another registrar is in progress. TRANSFERRED_OUT — domain was transferred to another registrar. LOCKED — domain has a registry-level administrative lock applied.
      type: string
      enum:
        - ACTIVE
        - EXPIRED
        - CANCELLED
        - CANCELLED_REDEEMABLE
        - PENDING_TRANSFER
        - TRANSFERRED_OUT
        - LOCKED
    DomainLifecycleGroup:
      title: Domain Lifecycle Group
      description: |
        A logical grouping of domain lifecycle statuses for filtering purposes. PENDING — domain setup is in progress (e.g. PENDING_REGISTRATION). REGISTERED — domain is actively registered and operational (e.g. ACTIVE, PARKED). PENDING_TERMINAL — domain is approaching a terminal state (e.g. PENDING_TRANSFER, EXPIRED). TERMINAL — domain has reached a terminal state and is no longer manageable (e.g. CANCELLED, DELETED_REDEEMABLE, TRANSFERRED, REPOSSESSED).
      type: string
      examples:
        - PENDING
        - REGISTERED
        - PENDING_TERMINAL
        - TERMINAL
    DomainCollection:
      title: DomainCollection
      description: |
        A paginated collection of registered domains owned by the authenticated account. Supports filtering by status and cursor-based pagination.
      type: object
      required:
        - items
        - links
      properties:
        items:
          type: array
          description: Domains for the current page.
          items:
            $ref: '#/components/schemas/Domain'
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDescription'
          description: |
            HATEOAS pagination links. May include rel=self (current page),  rel=prev is present when more items are available before the current page. and rel=next is present when more items are available beyond the current page.
          readOnly: true
    Domain:
      title: Domain
      description: |
        Full management state for a registered domain owned by the authenticated account. Includes registration metadata, expiration timestamps, lifecycle settings, current nameservers, and HATEOAS links for sub-resource navigation.
      type: object
      required:
        - domain
        - status
        - expiresAt
        - createdAt
        - autoRenew
        - privacy
      properties:
        domain:
          type: string
          description: The domain name in punycode A-label form.
          readOnly: true
          example: example.com
        idnDomain:
          type: string
          description: |
            The internationalized (U-label) representation of the domain name. Only present for internationalized domain names (IDNs).
          readOnly: true
          example: 例え.jp
        status:
          title: Domain Status
          description: |
            The lifecycle state of a registered domain. ACTIVE — domain is registered and resolving normally. EXPIRED — domain has passed its expiration date; renewal still possible during the grace period. CANCELLED — domain registration has been cancelled and released. CANCELLED_REDEEMABLE — cancelled domain still within the redemption grace period. PENDING_TRANSFER — inbound transfer from another registrar is in progress. TRANSFERRED_OUT — domain was transferred to another registrar. LOCKED — domain has a registry-level administrative lock applied.
          type: string
          enum:
            - ACTIVE
            - EXPIRED
            - CANCELLED
            - CANCELLED_REDEEMABLE
            - PENDING_TRANSFER
            - TRANSFERRED_OUT
            - LOCKED
          readOnly: true
        expiresAt:
          description: 'A date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6). Note: The regular expression provides static schematic guidance but does not reject all invalid dates.'
          type: string
          minLength: 20
