      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '429':
      description: Too many requests — rate limit exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
