                - REDEMPTION
                - RENEWABLE
                - VERIFICATION_ICANN
                - VISIBLE
              type: string
        - description: Maximum number of domains to return
          in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - description: Marker Domain to use as the offset in results
          in: query
          name: marker
          required: false
          schema:
            type: string
        - description: Optional details to be included in the response
          in: query
          name: includes
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              enum:
                - authCode
                - contacts
                - nameServers
              type: string
        - description: Only include results that have been modified since the specified date
          in: query
          name: modifiedDate
          required: false
          schema:
            type: string
            format: iso-datetime
