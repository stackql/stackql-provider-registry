      description: |
        The domain name in punycode A-label form (e.g., example.com). For IDNs, use the punycode representation.
      required: true
      schema:
        type: string
      example: example.com
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-generated unique key (UUID recommended). Retrying a mutating request with the same Idempotency-Key returns the original response without creating a duplicate side effect. Required on all execute endpoints.
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
      example: 9f1c2e7a-4b3d-4e8f-a1c2-3d4e5f6a7b8c
    operationId:
      name: operationId
      in: path
      description: |
        The server-assigned operation identifier returned in the 202 response of any async domain mutation.
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 9f1c2e7a-4b3d-4e8f-a1c2-3d4e5f6a7b8c
  responses:
    '400':
      description: Malformed request syntax, missing required field, or invalid field type.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '401':
      description: Authentication credentials are missing or invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '403':
      description: Authenticated identity is not authorized to perform this operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '404':
      description: The requested resource was not found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/xRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_v3'
    '422':
      description: |
