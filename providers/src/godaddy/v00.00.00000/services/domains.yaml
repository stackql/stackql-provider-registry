openapi: 3.1.1
info:
  title: GoDaddy Domains
  description: 'Registered domain inventory, settings and lifecycle: domain details, contacts, nameservers, renewal, cancellation, registrant changes, privacy forwarding, pending actions and notifications (Domains v1 and v2), the v3 domain list and asynchronous operations, and monthly API usage.'
  version: v00.00.00000
servers:
  - url: https://api.godaddy.com
    description: GoDaddy production API
security:
  - bearerAuth: []
tags: []
