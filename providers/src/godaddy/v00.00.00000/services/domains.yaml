          type: string
          format: iso-datetime
          description: Timestamp indicating when the action was created
        startedAt:
          type: string
          format: iso-datetime
          description: Timestamp indicating when the action was started
        completedAt:
          type: string
          format: iso-datetime
          description: Timestamp indicating when the action was completed
        modifiedAt:
          type: string
          format: iso-datetime
          description: Timestamp indicating when the action was last modified
        status:
          type: string
          default: ACCEPTED
          enum:
            - ACCEPTED
            - AWAITING
            - CANCELLED
            - FAILED
            - PENDING
            - SUCCESS
          description: |-
            The current status of the action

            - **ACCEPTED** — The action has been queued; processing has not started.
            - **AWAITING** — The action is waiting on user input.
            - **CANCELLED** — The action has been cancelled by the user.
            - **FAILED** — An error occurred while the action was processing; no more processing will be performed.
            - **PENDING** — The action is being processed.
            - **SUCCESS** — The action has completed; no additional processing is required.
        reason:
          $ref: '#/components/schemas/ActionReason'
        requestId:
          type: string
          description: A client provided identifier (via X-Request-Id header) used for tracking individual requests
      required:
        - type
        - origination
        - createdAt
        - status
      type: object
    DomainNotification:
      properties:
        notificationId:
          description: The notification ID to be used in POST /v2/customers/{customerId}/domains/notifications to acknowledge the notification
          default: ''
          type: string
        type:
          description: The type of action the notification relates to
          enum:
            - AUTH_CODE_REGENERATE
            - AUTO_RENEWAL
            - CHANGE_OF_REGISTRANT_DELETE
            - DOMAIN_DELETE
            - DOMAIN_UPDATE
            - DOMAIN_UPDATE_NAME_SERVERS
            - PRIVACY_FORWARDING_UPDATE
            - REGISTER
            - TRANSFER
            - TRANSFER_IN
            - TRANSFER_IN_ACCEPT
            - TRANSFER_IN_CANCEL
            - TRANSFER_IN_RESTART
            - TRANSFER_IN_RETRY
            - TRANSFER_OUT
            - TRANSFER_OUT_ACCEPT
            - TRANSFER_OUT_REJECT
          type: string
        resource:
          description: The resource the notification pertains to.
          default: ''
          type: string
        resourceType:
          description: The type of resource the notification relates to
          enum:
            - CONTACT
            - DOMAIN
            - HOST
          type: string
        status:
          type: string
          enum:
            - AWAITING
            - CANCELLED
            - FAILED
            - PENDING
            - SUCCESS
          description: The resulting status of the action.
        addedAt:
          description: The date the notification was added
          default: ''
          type: string
          format: iso-datetime
        requestId:
          type: string
          description: A client provided identifier (via X-Request-Id header) indicating the request this notification is for
        metadata:
          description: The notification data for the given type as specified by GET /v2/customers/{customerId}/domains/notifications/schema (opaque JSON object)
          default: ''
          type: string
      required:
