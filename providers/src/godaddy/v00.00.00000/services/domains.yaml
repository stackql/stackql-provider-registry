      type: object
    DomainDnssec:
      properties:
        algorithm:
          description: |-
            This identifies the cryptographic algorithm used to generate the signature

            - **RSAMD5** — [01] DRSA/MD5
            - **DSA** — [03] DSA/SHA1
            - **RSASHA1** — [05] RSA/SHA-1
            - **DSA_NSEC3_SHA1** — [06] DSA-NSEC3-SHA1
            - **RSASHA1_NSEC3_SHA1** — [07] RSASHA1-NSEC3-SHA1
            - **RSASHA256** — [08] RSA/SHA-256
            - **RSASHA512** — [10] RSA/SHA-512
            - **ECC_GOST** — [12] GOST R 34.10-2001
            - **ECDSAP256SHA256** — [13] ECDSA Curve P-256 with SHA-256
            - **ECDSAP384SHA384** — [14] ECDSA Curve P-384 with SHA-384
            - **ED25519** — [15] Ed25519
            - **ED448** — [16] Ed448
          enum:
            - RSAMD5
            - DH
            - DSA
            - RSASHA1
            - DSA_NSEC3_SHA1
            - RSASHA1_NSEC3_SHA1
            - RSASHA256
            - RSASHA512
            - ECC_GOST
            - ECDSAP256SHA256
            - ECDSAP384SHA384
            - ED25519
            - ED448
            - PRIVATEDNS
            - PRIVATEOID
          type: string
        keyTag:
          description: This is an integer value less than 65536 used to identify the DNSSEC record for the domain name.
          type: integer
          format: integer-positive
          maximum: 65536
        digestType:
          description: |-
            This identifies the algorithm used to construct the digest

            - **SHA1** — [01] SHA-1
            - **SHA256** — [02] SHA-256
            - **GOST** — [03] GOST R 34.11-94
            - **SHA384** — [04] SHA-384
          enum:
            - SHA1
            - SHA256
            - GOST
            - SHA384
          type: string
        digest:
          type: string
          description: The digest is an alpha-numeric value
        flags:
          description: |-
            This identifies the key type; either a Zone-Signing Key or a Key-Signing Key

            - **ZSK** — [256] Zone-Signing Key
            - **KSK** — [257] Key-Signing Key
          enum:
            - ZSK
            - KSK
          type: string
        publicKey:
          type: string
          description: Registries use this value to encrypt DS records. Decryption requires a matching public key
        maxSignatureLife:
          type: integer
          format: integer-positive
          description: This specifies the validity period for the signature. The value is expressed in seconds. You can use any integer value larger than zero
      required:
        - algorithm
      type: object
