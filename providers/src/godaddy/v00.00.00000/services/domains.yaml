      summary: Retrieve api usage request counts for a specific year/month.  The data is retained for a period of three months.
      description: Returns monthly API request counts for the account. Data is retained for three months.
      parameters:
        - name: X-Request-Id
          required: false
          in: header
          description: A client provided identifier for tracking this request.
          schema:
            type: string
        - name: yyyymm
          description: The year/month timeframe for the request counts (in the format yyyy-mm)
          in: path
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}$
        - name: includes
          required: false
          in: query
          description: Determines if the detail records (grouped by request path) are included in the response
          style: form
          explode: false
          schema:
            type: array
            items:
              enum:
                - details
              type: string
      responses:
        '200':
          description: Request was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageMonthly'
        '401':
          description: Authentication info not sent or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests received within interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getDomainsUsageByYyyymm
  /v3/domains/domain-names:
    get:
      operationId: listDomains
      tags:
        - Domains
      summary: List registered domains
      description: |
        Returns a paginated collection of domain names owned by the authenticated account. Supports filtering by statuses and cursor-based pagination. The statuses and lifecycleGroups parameters are mutually exclusive; supplying both returns 400 Bad Request. An unrecognized value for statuses or lifecycleGroups returns 400 Bad Request.
      parameters:
        - $ref: '#/components/parameters/xRequestId'
        - $ref: '#/components/parameters/pageToken'
        - $ref: '#/components/parameters/pageTokenDirection'
        - name: pageSize
          in: query
          required: false
          description: |
            Maximum number of domains in the response. Defaults to 100 when omitted. Offset-based "page" parameter is not supported, only cursor-based "pageToken".
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: statuses
          in: query
          required: false
          description: |
            Filter results to domains with one or more lifecycle statuses. Supply multiple values as a single comma-separated list, e.g. `?statuses=ACTIVE,EXPIRED`. Multiple values are combined with logical OR — returns domains matching ANY of the specified statuses. See DomainStatus for accepted values (ACTIVE, EXPIRED, PENDING_REGISTRATION, etc.). Cannot be combined with the lifecycleGroups parameter. Use this for precise filtering on specific known status values; for coarse lifecycle phases, consider lifecycleGroups.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              $ref: '#/components/schemas/DomainStatus'
          example:
            - ACTIVE
            - EXPIRED
        - name: lifecycleGroups
          in: query
          required: false
          description: |
            Filter results to domains belonging to one or more status groups. Supply multiple values as a single comma-separated list, e.g. `?lifecycleGroups=REGISTERED,PENDING`. Multiple values are combined with logical OR. Cannot be combined with the statuses parameter. Use this for coarse lifecycle phases that remain stable as new statuses are added; for precise filtering, use statuses.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DomainLifecycleGroup'
          example:
            - REGISTERED
            - PENDING
        - name: updatedAfter
          in: query
          required: false
          description: |
            Return only domains last updated after this timestamp (exclusive). Must be a valid RFC 3339 date-time.
          schema:
            type: string
            format: date-time
          example: '2026-01-01T00:00:00Z'
        - name: expiresBefore
          in: query
          required: false
          description: |
            Return only domains whose registration expires before this timestamp (exclusive). Must be a valid RFC 3339 date-time.
          schema:
            type: string
            format: date-time
          example: '2027-01-01T00:00:00Z'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated list of domains owned by the account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/xRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainCollection'
              examples:
                paginated:
                  summary: First page of active domains with totals
                  value:
                    items:
                      - domain: example.com
                        status: ACTIVE
                        expiresAt: '2027-06-12T10:02:10Z'
                        createdAt: '2026-06-12T10:02:10Z'
                        autoRenew: true
                        privacy: false
                        transferLock: true
                        nameServers:
                          - ns01.domaincontrol.com
                          - ns02.domaincontrol.com
                        links:
                          - rel: self
                            href: /v3/domains/domain-names/example.com
                      - domain: mysite.net
                        status: ACTIVE
                        expiresAt: '2027-08-01T00:00:00Z'
                        createdAt: '2025-08-01T00:00:00Z'
                        autoRenew: false
                        privacy: true
                        transferLock: true
                        nameServers:
                          - ns01.domaincontrol.com
                          - ns02.domaincontrol.com
                        links:
                          - rel: self
                            href: /v3/domains/domain-names/mysite.net
                    links:
                      - rel: self
                        href: /v3/domains/domain-names?statuses=ACTIVE&pageSize=25
                      - rel: next
                        href: /v3/domains/domain-names?statuses=ACTIVE&pageSize=25&pageToken=eyJkb21haW4iOiJteXNpdGUubmV0In0
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
