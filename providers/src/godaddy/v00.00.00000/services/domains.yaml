    DomainOperation:
      title: Domain Operation
      description: |
        The abstract operation envelope for all domain mutations, returned by the universal GET /operations/{operationId} endpoint. Concrete specializations — Registration, Renewal, and Transfer — are returned directly by their respective POST endpoints and carry the same operationId. Developers who do not need the abstract view can poll the concrete resource (GET /registrations/{id}, etc.) and ignore this type entirely.
        Operation IDs are unique across all concrete types, so either poll path works for any given operation.
        Async state machine:
          status tracks where the operation is in its lifecycle. Non-terminal values
          (CONFIRMED, EXECUTING) are transient — poll until a terminal value is reached.
          result and error are mutually exclusive terminal payloads:
            COMPLETED — operation succeeded; result contains the final outcome data.
            FAILED — operation terminated; error contains failure detail.
          Neither result nor error is present while status is non-terminal.
      type: object
      required:
        - operationId
        - type
        - status
      properties:
        operationId:
          description: A universally unique identifier (UUID) in [RFC-4122 format](https://tools.ietf.org/html/rfc4122).
          type: string
          format: uuid
          readOnly: true
          example: 9f1c2e7a-4b3d-4e8f-a1c2-3d4e5f6a7b8c
        type:
          title: Domain Operation Type
          description: |
            The type of asynchronous domain operation. Used to distinguish which workflow is being polled on the /operations/{operationId} endpoint. REGISTER — new domain registration.
          type: string
          readOnly: true
        domain:
          type: string
          description: The domain name this operation applies to.
          readOnly: true
          example: example.com
        status:
          title: Domain Operation Status
          description: |
            The execution state of an asynchronous domain operation. CONFIRMED — operation has been accepted and is queued for execution. EXECUTING — operation is actively being processed by the registry or downstream systems. COMPLETED — operation finished successfully; result data is available. FAILED — operation terminated with an unrecoverable error; error detail is attached.
          type: string
          readOnly: true
        result:
          readOnly: true
          title: Domain Operation Result
          description: |
            The terminal success payload for a completed domain operation. Returned on the parent DomainOperation when status is COMPLETED. Absent for non-terminal statuses (CONFIRMED, EXECUTING) and for FAILED operations.
            Once status reaches COMPLETED it is terminal: result is populated, remains available on subsequent polls, and status does not revert. Interpret the fields present in result using the parent operation's type:
            REGISTER — expiresAt, orderId.
          type: object
          properties:
            expiresAt:
              description: 'A date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6). Note: The regular expression provides static schematic guidance but does not reject all invalid dates.'
              type: string
              minLength: 20
              maxLength: 64
              pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])[T,t]([0-1][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$
            orderId:
              type: string
              description: |
                The commerce order ID associated with the charge. Present for commercial operations (REGISTER, RENEW, TRANSFER_IN).
              example: ord_abc123
            updatedAt:
              description: 'A date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6). Note: The regular expression provides static schematic guidance but does not reject all invalid dates.'
              type: string
              minLength: 20
              maxLength: 64
              pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])[T,t]([0-1][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$
        error:
          readOnly: true
          type: object
          title: Error
          description: The error information.
          properties:
            name:
              type: string
              description: The human-readable, unique name of the error.
            correlationId:
              type: string
              description: Internal identifier used for correlation purposes.
            message:
              type: string
              description: The message that describes the error.
            informationLink:
              type: string
              description: The URI for detailed information related to this error for the developer.
            details:
              type: array
              description: An array of additional details about the error. Required for client-side `4XX` errors.
              additionalItems: false
              items:
                $ref: '#/components/schemas/ErrorDetails'
            links:
              type: array
              description: An array of error-related HATEOAS links.
              readOnly: true
              items:
                $ref: '#/components/schemas/LinkDescription'
                readOnly: true
          required:
            - name
            - correlationId
            - message
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDescription'
          description: |
            HATEOAS link relations for this operation. rel=self — the canonical URL for this abstract operation view. rel=registration, rel=renewal, or rel=transfer — the same resource viewed through its concrete typed collection. rel=domain — the domain-name resource affected by this operation.
          readOnly: true
        createdAt:
          description: 'A date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6). Note: The regular expression provides static schematic guidance but does not reject all invalid dates.'
          type: string
          minLength: 20
          maxLength: 64
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])[T,t]([0-1][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$
          readOnly: true
        updatedAt:
          description: 'A date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6). Note: The regular expression provides static schematic guidance but does not reject all invalid dates.'
          type: string
