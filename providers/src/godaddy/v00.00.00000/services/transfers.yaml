    DomainTransferInV2:
      additionalProperties: false
      properties:
        authCode:
          type: string
          description: Authorization code from registrar for transferring a domain
        period:
          type: integer
          format: integer-positive
          default: 1
          minimum: 1
          maximum: 10
          pattern: ^[0-9]+$
          description: Can be more than 1 but no more than 10 years total including current registration length
        renewAuto:
          type: boolean
          default: true
          description: Whether or not the domain should be configured to automatically renew
        privacy:
          type: boolean
          default: false
          description: Whether or not privacy has been requested
        identityDocumentId:
          type: string
          description: Unique identifier of the identify document that the user wants to associate with the domain being transferred in. This is required only if the gaining registry has a requirement for an approved identity document
        consent:
          $ref: '#/components/schemas/ConsentV2'
        contacts:
          $ref: '#/components/schemas/DomainContactsCreateV2'
        metadata:
          type: string
          description: The domain eligibility data fields as specified by GET /v2/customers/{customerId}/domains/register/schema/{tld} (opaque JSON object)
      required:
        - authCode
        - consent
      type: object
    ErrorField_v2:
      properties:
        code:
          description: Short identifier for the error, suitable for indicating the specific error within client code
          format: constant
          type: string
        message:
          description: Human-readable, English description of the problem with the contents of the field
          type: string
        path:
          description: |-
            JSONPath referring to a field containing an error, or a field that refers to an
            object containing an error (with more detail in `pathRelated`).
          format: json-path
          type: string
        pathRelated:
          description: JSONPath referring to a field containing an error, which is referenced by `path`
          format: json-path
          type: string
      required:
        - path
        - code
      type: object
    DomainTransferAuthCode:
      type: object
      additionalProperties: false
      properties:
        authCode:
          description: Authorization code for transferring the Domain
          type: string
      required:
        - authCode
    ConsentV2:
      additionalProperties: false
      properties:
        agreementKeys:
          type: array
          items:
            type: string
          description: Unique identifiers of the legal agreements to which the end-user has agreed, as returned from the/domains/agreements endpoint
        price:
          type: integer
          format: currency-micro-unit
          description: Price of the domain excluding taxes or fees. Please use GET /v1/domains/available to retrieve the price and currency for the domain
        currency:
          type: string
          format: iso-currency-code
          default: USD
          pattern: ^[A-Z][A-Z][A-Z]$
          description: Currency in which the `price` is listed
        registryPremiumPricing:
          type: boolean
          description: Only required for hosted registrar if domain is premium. If true indicates that the `price` and `currency` listed are the registry premium price and currency for the domain
        agreedBy:
          type: string
          description: Originating client IP address of the end-user's computer when they consented to these legal agreements
        agreedAt:
          type: string
          format: iso-datetime
          description: Timestamp indicating when the end-user consented to these legal agreements
        claimToken:
          description: The trademark claim token, only needed if the domain has an active trademark claim
          type: string
      required:
        - agreementKeys
        - price
        - currency
        - agreedBy
        - agreedAt
      type: object
    DomainContactsCreateV2:
      additionalProperties: false
      type: object
      properties:
        admin:
          $ref: '#/components/schemas/ContactDomainCreate'
        adminId:
          description: |
            Unique identifier of the contact that the user wants to use for the domain admin contact. This can be specified instead of the `admin` property.
          type: string
        billing:
          $ref: '#/components/schemas/ContactDomainCreate'
        billingId:
          description: |
            Unique identifier of the contact that the user wants to use for the domain billing contact. This can be specified instead of the `billing` property.
          type: string
        registrant:
          $ref: '#/components/schemas/ContactDomainCreate'
        registrantId:
          description: |
            Unique identifier of the contact that the user wants to use for the domain registrant contact. This can be specified instead of the `registrant` property.
          type: string
        tech:
          $ref: '#/components/schemas/ContactDomainCreate'
        techId:
          description: |
            Unique identifier of the contact that the user wants to use for the domain tech contact. This can be specified instead of the `tech` property.
          type: string
    ContactDomainCreate:
      additionalProperties: false
      properties:
        encoding:
          type: string
          default: ASCII
          enum:
            - ASCII
            - UTF-8
          description: |-
            The encoding of the contact data

            - **ASCII** — Data contains only ASCII characters that are not region or language specific.
            - **UTF-8** — Data contains characters that are specific to a region or language.
        nameFirst:
          type: string
          format: person-name
          maxLength: 30
        nameMiddle:
          type: string
        nameLast:
          type: string
          format: person-name
          maxLength: 30
        organization:
          type: string
          format: organization-name
          maxLength: 100
        jobTitle:
          type: string
        email:
          type: string
          format: email
          maxLength: 80
        phone:
          type: string
          format: phone
          maxLength: 17
        fax:
          type: string
          format: phone
          maxLength: 17
        addressMailing:
          $ref: '#/components/schemas/Address_v2'
        metadata:
          type: string
          description: The contact eligibility data fields as specified by GET /v2/customers/{customerId}/domains/contacts/schema/{tld} (opaque JSON object)
      required:
        - encoding
        - nameFirst
        - nameLast
        - email
        - phone
        - addressMailing
      type: object
