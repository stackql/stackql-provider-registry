openapi: 3.1.1
info:
  title: GoDaddy Transfers
  description: 'Inbound and outbound domain transfers: the Domains v1 transfer-in order and the Domains v2 asynchronous transfer workflow (accept, cancel, restart, retry, transfer out, accept or reject an outbound transfer).'
  version: v00.00.00000
servers:
  - url: https://api.godaddy.com
    description: GoDaddy production API
security:
  - bearerAuth: []
tags: []
paths:
  /v1/domains/{domain}/transfer:
    post:
      tags:
        - Transfer Domains
      parameters:
        - description: 'Shopper ID which owns the domain. NOTE: This is only required if you are a Reseller managing a domain purchased outside the scope of your reseller account.'
          in: header
          name: X-Shopper-Id
          required: false
          schema:
            type: string
        - description: Domain to transfer in
          in: path
          name: domain
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainTransferIn'
          application/xml:
            schema:
              $ref: '#/components/schemas/DomainTransferIn'
          text/xml:
            schema:
              $ref: '#/components/schemas/DomainTransferIn'
        description: Details for domain transfer purchase
        required: true
      responses:
        '200':
          description: Request was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPurchaseResponse'
            application/javascript:
              schema:
                $ref: '#/components/schemas/DomainPurchaseResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/DomainPurchaseResponse'
            text/javascript:
              schema:
                $ref: '#/components/schemas/DomainPurchaseResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/DomainPurchaseResponse'
        '400':
          description: Request was malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
            text/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication info not sent or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
            text/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
            text/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`domain` (domain) isn''t available for transfer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
            text/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            - Based on restrictions declared in JSON schema returned by `./schema/{tld}`
            - Cannot convert domain label error
            - Domain is missing IDN script
            - Domain segment ends with dash
            - Domain starts with dash
            - Domain uses unsupported IDN script
            - End-user must read and consent to all of the following legal agreements
            - FQDN fails generic validity regex
            - Invalid character(s) error
            - Invalid period range
            - Invalid tld error
            - Non-IDN domain name must not have dashes at the third and fourth position
            - Reserved name error
            - `authCode` cannot be empty
            - `domain` must match `sld.tld`
            - domain must be specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
            text/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests received within interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
            application/javascript:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
            text/javascript:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
            text/javascript:
              schema:
                $ref: '#/components/schemas/Error'
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: transferIn
      summary: Purchase and start or restart transfer process
      description: Initiates an inbound domain transfer from another registrar. Requires an authcode and a consent object with agreement keys. Charges a transfer fee.
  /domains/{domain}/transfer:
    post:
      tags:
        - Transfer Domains
      summary: Initiate inbound transfer
      description: Initiates an inbound domain transfer from another registrar. Requires an authcode and consent object. Returns 202 - poll GET .../actions/TRANSFER until COMPLETED, FAILED, or CANCELLED.
      parameters:
        - name: X-Request-Id
          required: false
          in: header
          description: A client provided identifier for tracking this request.
          schema:
            type: string
        - description: Domain to transfer in
          name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/DomainTransferInV2'
      responses:
        '202':
          description: Request Accepted. You may use GET /v2/customers/{customerId}/domains/{domain}/actions/TRANSFER to poll status
        '400':
          description: Request was malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication info not sent or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The domain does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: There is already a similar action processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Based on restrictions declared in JSON schema returned by `./schema/{tld}`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests received within interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postDomainsByDomainTransfer
    servers:
      - url: https://api.godaddy.com/v2/customers/{customer_id}
        variables:
          customer_id:
            description: GoDaddy customer identifier (UUID, not the numeric shopper number). Resolved from the GODADDY_CUSTOMER_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every query as WHERE customer_id = '<uuid>'. A WHERE value always takes precedence over the environment. API resellers acting on behalf of a subaccount pass the subaccount customer identifier.
            x-stackQL-envVar: GODADDY_CUSTOMER_ID
  /domains/{domain}/transferInAccept:
    post:
      tags:
        - Transfer Domains
      summary: Accept the inbound transfer
      description: Explicitly accepts an in-progress inbound transfer to expedite the process. Returns 202 - poll GET .../actions/TRANSFER_IN_ACCEPT until the action reaches a terminal state.
      parameters:
        - name: X-Request-Id
          required: false
          in: header
          description: A client provided identifier for tracking this request.
          schema:
            type: string
        - name: domain
          required: true
          in: path
          description: Domain to accept the transfer in for
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/DomainTransferAuthCode'
      responses:
        '202':
          description: Request Accepted. You may use GET /v2/customers/{customerId}/domains/{domain}/actions/TRANSFER_IN_ACCEPT to poll status
        '400':
          description: Request was malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication info not sent or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The domain does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The domain status does not allow performing the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Request body doesn't fulfill schema, see details in `fields`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests received within interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postDomainsByDomainTransferInAccept
    servers:
      - url: https://api.godaddy.com/v2/customers/{customer_id}
        variables:
          customer_id:
            description: GoDaddy customer identifier (UUID, not the numeric shopper number). Resolved from the GODADDY_CUSTOMER_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every query as WHERE customer_id = '<uuid>'. A WHERE value always takes precedence over the environment. API resellers acting on behalf of a subaccount pass the subaccount customer identifier.
            x-stackQL-envVar: GODADDY_CUSTOMER_ID
  /domains/{domain}/transferInCancel:
    post:
      tags:
        - Transfer Domains
      summary: Cancel the inbound transfer
      description: Cancels an in-progress inbound transfer. Returns 202 - poll GET .../actions/TRANSFER_IN_CANCEL until the action reaches a terminal state.
      parameters:
        - name: X-Request-Id
          required: false
          in: header
          description: A client provided identifier for tracking this request.
          schema:
            type: string
        - description: Domain to cancel the transfer in for
          name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Request Accepted. You may use GET /v2/customers/{customerId}/domains/{domain}/actions/TRANSFER_IN_CANCEL to poll status
        '401':
          description: Authentication info not sent or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The domain does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: There is already a similar action processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests received within interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postDomainsByDomainTransferInCancel
    servers:
      - url: https://api.godaddy.com/v2/customers/{customer_id}
        variables:
          customer_id:
            description: GoDaddy customer identifier (UUID, not the numeric shopper number). Resolved from the GODADDY_CUSTOMER_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every query as WHERE customer_id = '<uuid>'. A WHERE value always takes precedence over the environment. API resellers acting on behalf of a subaccount pass the subaccount customer identifier.
            x-stackQL-envVar: GODADDY_CUSTOMER_ID
  /domains/{domain}/transferInRestart:
    post:
      tags:
        - Transfer Domains
      summary: Restart the inbound transfer from the beginning
      description: Restarts a stalled inbound transfer from the beginning. Returns 202 - poll GET .../actions/TRANSFER_IN_RESTART until the action reaches a terminal state.
      parameters:
        - name: X-Request-Id
          required: false
          in: header
          description: A client provided identifier for tracking this request.
          schema:
            type: string
        - name: domain
          required: true
          in: path
          description: Domain to restart the transfer in
          schema:
            type: string
      responses:
        '202':
          description: Request Accepted. You may use GET /v2/customers/{customerId}/domains/{domain}/actions/TRANSFER_IN_RESTART to poll status
        '401':
          description: Authentication info not sent or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The domain status does not allow performing the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests received within interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postDomainsByDomainTransferInRestart
    servers:
      - url: https://api.godaddy.com/v2/customers/{customer_id}
        variables:
          customer_id:
            description: GoDaddy customer identifier (UUID, not the numeric shopper number). Resolved from the GODADDY_CUSTOMER_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every query as WHERE customer_id = '<uuid>'. A WHERE value always takes precedence over the environment. API resellers acting on behalf of a subaccount pass the subaccount customer identifier.
            x-stackQL-envVar: GODADDY_CUSTOMER_ID
  /domains/{domain}/transferInRetry:
    post:
      tags:
        - Transfer Domains
      summary: Retry the inbound transfer with a new authorization code
      description: Retries a failed inbound transfer with a new authorization code. Returns 202 - poll GET .../actions/TRANSFER_IN_RETRY until the action reaches a terminal state.
      parameters:
        - name: X-Request-Id
          required: false
          in: header
          description: A client provided identifier for tracking this request.
          schema:
            type: string
        - name: domain
          required: true
          in: path
          description: Domain to retry the transfer in
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/DomainTransferAuthCode'
      responses:
        '202':
          description: Request Accepted. You may use GET /v2/customers/{customerId}/domains/{domain}/actions/TRANSFER_IN_RETRY to poll status
        '400':
          description: Request was malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication info not sent or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The domain status does not allow performing the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Request body doesn't fulfill schema, see details in `fields`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests received within interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postDomainsByDomainTransferInRetry
    servers:
      - url: https://api.godaddy.com/v2/customers/{customer_id}
        variables:
          customer_id:
            description: GoDaddy customer identifier (UUID, not the numeric shopper number). Resolved from the GODADDY_CUSTOMER_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every query as WHERE customer_id = '<uuid>'. A WHERE value always takes precedence over the environment. API resellers acting on behalf of a subaccount pass the subaccount customer identifier.
            x-stackQL-envVar: GODADDY_CUSTOMER_ID
  /domains/{domain}/transferOut:
    post:
      tags:
        - Transfer Domains
      summary: Initiate an outbound transfer
      description: Initiates an outbound transfer for .uk domains. Returns 202 - poll the actions endpoint for completion.
      parameters:
        - name: X-Request-Id
          required: false
          in: header
          description: A client provided identifier for tracking this request.
          schema:
            type: string
        - description: Domain to initiate the transfer out for
          name: domain
          in: path
          required: true
          schema:
            type: string
        - description: Registrar tag to push transfer to
          name: registrar
          in: query
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Request Accepted. You may use GET /v2/customers/{customerId}/domains/{domain}/actions/TRANSFER_OUT_REQUESTED to poll status
        '401':
          description: Authentication info not sent or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The domain does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: There is already a similar action processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Domain invalid. TLD must be .uk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests received within interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postDomainsByDomainTransferOut
    servers:
      - url: https://api.godaddy.com/v2/customers/{customer_id}
        variables:
          customer_id:
            description: GoDaddy customer identifier (UUID, not the numeric shopper number). Resolved from the GODADDY_CUSTOMER_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every query as WHERE customer_id = '<uuid>'. A WHERE value always takes precedence over the environment. API resellers acting on behalf of a subaccount pass the subaccount customer identifier.
            x-stackQL-envVar: GODADDY_CUSTOMER_ID
  /domains/{domain}/transferOutAccept:
    post:
      tags:
        - Transfer Domains
      summary: Accept the outbound transfer
      description: Accepts a pending outbound transfer request. Returns 202 - poll GET .../actions/TRANSFER_OUT_ACCEPT until the action reaches a terminal state.
      parameters:
        - name: X-Request-Id
          required: false
          in: header
          description: A client provided identifier for tracking this request.
          schema:
            type: string
        - description: Domain to accept the transfer out for
          name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Request Accepted. You may use GET /v2/customers/{customerId}/domains/{domain}/actions/TRANSFER_OUT_ACCEPT to poll status
        '401':
          description: Authentication info not sent or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The domain does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: There is already a similar action processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests received within interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postDomainsByDomainTransferOutAccept
    servers:
      - url: https://api.godaddy.com/v2/customers/{customer_id}
        variables:
          customer_id:
            description: GoDaddy customer identifier (UUID, not the numeric shopper number). Resolved from the GODADDY_CUSTOMER_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every query as WHERE customer_id = '<uuid>'. A WHERE value always takes precedence over the environment. API resellers acting on behalf of a subaccount pass the subaccount customer identifier.
            x-stackQL-envVar: GODADDY_CUSTOMER_ID
  /domains/{domain}/transferOutReject:
    post:
      tags:
        - Transfer Domains
      summary: Reject the outbound transfer
      description: Rejects a pending outbound transfer request, keeping the domain at GoDaddy. Returns 202 - poll GET .../actions/TRANSFER_OUT_REJECT until the action reaches a terminal state.
      parameters:
        - name: X-Request-Id
          required: false
          in: header
          description: A client provided identifier for tracking this request.
          schema:
            type: string
        - description: Domain to reject the transfer out for
          name: domain
          in: path
          required: true
          schema:
            type: string
        - name: reason
          description: Transfer out reject reason
          in: query
          required: false
          schema:
            type: string
            enum:
              - EVIDENCE_OF_FRAUD
              - URDP_ACTION
              - COURT_ORDER
              - DISPUTE_OVER_IDENTITY
              - NO_PAYMENT_FOR_PREVIOUS_REGISTRATION_PERIOD
              - WRITTEN_OBJECTION
              - TRANSFERRED_WITHIN_SIXTY_DAYS
      responses:
        '202':
          description: Request Accepted. You may use GET /v2/customers/{customerId}/domains/{domain}/actions/TRANSFER_OUT_REJECT to poll status
        '401':
          description: Authentication info not sent or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated user is not allowed access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The domain does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: There is already a similar action processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests received within interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimit'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postDomainsByDomainTransferOutReject
    servers:
      - url: https://api.godaddy.com/v2/customers/{customer_id}
        variables:
          customer_id:
            description: GoDaddy customer identifier (UUID, not the numeric shopper number). Resolved from the GODADDY_CUSTOMER_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every query as WHERE customer_id = '<uuid>'. A WHERE value always takes precedence over the environment. API resellers acting on behalf of a subaccount pass the subaccount customer identifier.
            x-stackQL-envVar: GODADDY_CUSTOMER_ID
components:
  schemas:
    DomainTransferIn:
      properties:
        authCode:
          description: Authorization code from registrar for transferring a domain
          type: string
        consent:
          $ref: '#/components/schemas/Consent'
        period:
          default: 1
          description: Can be more than 1 but no more than 10 years total including current registration length
          format: integer-positive
          maximum: 10
          minimum: 1
          type: integer
        privacy:
          default: false
          description: Whether or not privacy has been requested
          type: boolean
        renewAuto:
