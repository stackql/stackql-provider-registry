id: godaddy
name: godaddy
version: v00.00.00000
providerServices:
  dns:
    id: dns:v00.00.00000
    name: dns
    preferred: true
    service:
      $ref: godaddy/v00.00.00000/services/dns.yaml
    title: GoDaddy DNS
    version: v00.00.00000
    description: >-
      DNS zone records (Domains v1 bulk record management and the Domains v3
      record-id based CRUD) and domain forwarding rules (Domains v2).
  domains:
    id: domains:v00.00.00000
    name: domains
    preferred: true
    service:
      $ref: godaddy/v00.00.00000/services/domains.yaml
    title: GoDaddy Domains
    version: v00.00.00000
    description: >-
      Registered domain inventory, settings and lifecycle: domain details,
      contacts, nameservers, renewal, cancellation, registrant changes, privacy
      forwarding, pending actions and notifications (Domains v1 and v2), the v3
      domain list and asynchronous operations, and monthly API usage.
  registration:
    id: registration:v00.00.00000
    name: registration
    preferred: true
    service:
      $ref: godaddy/v00.00.00000/services/registration.yaml
    title: GoDaddy Registration
    version: v00.00.00000
    description: >-
      Finding and registering domains: availability checks, suggestions, TLDs,
      legal agreements, purchase schemas and validation (Domains v1),
      asynchronous registration (Domains v2), and the quote-then-register model
      with registration status (Domains v3).
  transfers:
    id: transfers:v00.00.00000
    name: transfers
    preferred: true
    service:
      $ref: godaddy/v00.00.00000/services/transfers.yaml
    title: GoDaddy Transfers
    version: v00.00.00000
    description: >-
      Inbound and outbound domain transfers: the Domains v1 transfer-in order
      and the Domains v2 asynchronous transfer workflow (accept, cancel,
      restart, retry, transfer out, accept or reject an outbound transfer).
config:
  auth:
    type: bearer
    credentialsenvvar: GODADDY_API_KEY
  snake_case_aliases: true
