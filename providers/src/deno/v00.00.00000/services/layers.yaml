openapi: 3.1.1
info:
  title: layers API
  description: >-
    A layer is a mutable configuration object that can be shared across multiple
    apps. Layers provide the solution for bulk environment variable management:
    instead of updating thousands of apps individually, you create a layer,
    attach it to apps, then update the layer once.


    **Key characteristics:**


    - Organization-scoped and identified by ID or slug

    - Contain environment variables

    - Can include other layers (base layers) for hierarchical configuration

    - Apps reference layers in their `layers` array

    - Updating a layer is O(1) regardless of how many apps reference it

    - Layer updates cause running isolates to restart but do not require
    redeployment
  version: 2.0.0
paths:
  /v2/layers:
    post:
      operationId: layers.create
      summary: Create layer
      description: Create a new layer.
      tags:
        - layers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  description: Human-readable layer slug
                description:
                  type: string
                  description: Optional description of the layer's purpose
                layers:
                  type: array
                  items:
                    $ref: '#/components/schemas/LayerRefInput'
                  description: Other layers to include for hierarchical configuration
                env_vars:
                  type: array
                  items:
                    $ref: '#/components/schemas/EnvVarInput'
                  description: Environment variables for this layer
              required:
                - slug
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
    get:
      operationId: layers.list
      summary: List layers
      description: List all layers in the organization.
      tags:
        - layers
      parameters:
        - name: search
          in: query
          schema:
            type: string
          allowEmptyValue: true
          allowReserved: true
          description: The search query for filtering
        - name: cursor
          in: query
          schema:
            type: string
          allowEmptyValue: true
          allowReserved: true
          description: The pagination cursor
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          allowEmptyValue: true
          allowReserved: true
          description: The maximum number of items to return
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Layer'
  /v2/layers/{layer}:
    get:
      operationId: layers.get
      summary: Get layer
      description: |-
        Get a layer by ID or slug.

        Slugs cannot contain underscores; IDs always do.
      tags:
        - layers
      parameters:
        - name: layer
          in: path
          required: true
          schema:
            type: string
          description: Layer ID or slug. Slugs cannot contain underscores; IDs always do.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
    patch:
      operationId: layers.update
      summary: Update layer
      description: >-
        Update a layer. This is the key operation for bulk environment variable
        updates.


        All fields are optional. `env_vars` performs a deep merge with existing
        variables: update by ID, update by key+contexts match, or create new.
        Set `delete: true` to remove a variable.


        Running isolates will restart to pick up the new configuration.
      tags:
        - layers
      parameters:
        - name: layer
          in: path
          required: true
          schema:
            type: string
          description: Layer ID or slug. Slugs cannot contain underscores; IDs always do.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  description: New layer slug
                description:
                  type: string
                  description: New description
                layers:
                  type: array
                  items:
                    $ref: '#/components/schemas/LayerRefInput'
                  description: Replace all included layers
                env_vars:
                  type: array
                  items:
                    $ref: '#/components/schemas/EnvVarUpdate'
                  description: Deep merge with existing environment variables
              required: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
    delete:
      operationId: layers.delete
      summary: Delete layer
      description: Returns 409 Conflict if apps still reference this layer.
      tags:
        - layers
      parameters:
        - name: layer
          in: path
          required: true
          schema:
            type: string
          description: Layer ID or slug. Slugs cannot contain underscores; IDs always do.
      responses:
        '204':
          description: OK
  /v2/layers/{layer}/apps:
    get:
      operationId: layers.apps
      summary: List apps using layer
      description: |-
        List apps that reference this layer.

        The `layer_position` indicates the index in each app's `layers` array.
      tags:
        - layers
      parameters:
        - name: layer
          in: path
          required: true
          schema:
            type: string
          description: Layer ID or slug. Slugs cannot contain underscores; IDs always do.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          allowEmptyValue: true
          allowReserved: true
          description: The pagination cursor
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          allowEmptyValue: true
          allowReserved: true
          description: The maximum number of items to return
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LayerAppRef'
components:
  schemas:
    LayerRefInput:
      type: string
      description: Layer ID to reference / Layer slug to reference
    EnvVarInput:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
          description: The environment variable name
        value:
          type: string
          maxLength: 65536
          description: The environment variable value
        secret:
          type: boolean
          description: Whether to mask the value in API responses. Defaults to false
        contexts:
          description: >-
            Deployment contexts this variable applies to. Defaults to `"all"`.
            (JSON value: string or array)
          type: string
      required:
        - key
        - value
      example:
        key: DATABASE_URL
        value: postgres://localhost/dev
    Layer:
      type: object
      properties:
        id:
          type: string
          description: Unique layer identifier
        slug:
          type: string
          description: Human-readable layer slug
        description:
          type: string
          description: Optional description of the layer's purpose
        layers:
          type: array
          items:
            $ref: '#/components/schemas/LayerRef'
          description: >-
            Base layers included by this layer, in priority order (later
            overrides earlier). The including layer's own env vars take
            precedence over all its bases
        env_vars:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
          description: Environment variables defined in this layer
        app_count:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Number of apps that reference this layer
        created_at:
          type: string
          description: ISO 8601 timestamp of creation
        updated_at:
          type: string
          description: ISO 8601 timestamp of last modification
      required:
        - id
        - slug
        - layers
        - env_vars
        - app_count
        - created_at
        - updated_at
      example:
        id: lyr_abc123
        slug: shared-secrets
        description: Common API keys and secrets for all customer apps
        layers:
          - id: lyr_base123
            slug: base-config
        env_vars:
          - id: 00000000-0000-0000-0000-000000000000
            key: DATABASE_URL
            value: postgres://host/db
            secret: false
            contexts: all
          - id: 00000000-0000-0000-0000-000000000000
            key: API_SECRET
            secret: true
            contexts: all
        app_count: 42
        created_at: '2024-01-15T10:30:00Z'
        updated_at: '2024-01-15T10:30:00Z'
    EnvVarUpdate:
      type: object
      properties:
        id:
          type: string
          description: ID of the existing variable to update or delete
        key:
          type: string
          minLength: 1
          maxLength: 128
          description: Variable name. Used for matching when `id` is not provided
        value:
          type: string
          maxLength: 65536
          description: New value for the variable
        secret:
          type: boolean
          description: Whether to mask the value in API responses
        contexts:
          description: >-
            Deployment contexts this variable applies to (JSON value: string or
            array)
          type: string
        delete:
          type: boolean
          description: Set to true to remove this variable
      example:
        id: 00000000-0000-0000-0000-000000000000
        value: postgres://prod-host/db
    LayerAppRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique app identifier (UUID)
        slug:
          type: string
          description: >-
            Human-readable app slug. App slugs must be 3–32 characters long, may
            contain only lowercase letters, numbers, and hyphens, cannot contain
            underscores, must not start or end with a hyphen, must not have
            consecutive hyphens in positions 3 and 4, and cannot be a reserved
            slug.
        layer_position:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Index of this layer in the app's `layers` array
      required:
        - id
        - slug
        - layer_position
      example:
        id: 00000000-0000-0000-0000-000000000000
        slug: customer-app-1
        layer_position: 0
    LayerRef:
      type: object
      properties:
        id:
          type: string
          description: Unique layer identifier
        slug:
          type: string
          description: Human-readable layer slug
      required:
        - id
        - slug
      example:
        id: lyr_abc123
        slug: shared-secrets
    EnvVar:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the environment variable
        key:
          type: string
          description: The environment variable name
        value:
          type: string
          description: The value. Omitted when `secret` is true
        secret:
          type: boolean
          description: Whether the value is masked in API responses
        contexts:
          description: >-
            Deployment contexts this variable applies to. `"all"` means every
            context. (JSON value: string or array)
          type: string
      required:
        - id
        - key
        - secret
        - contexts
      example:
        id: 00000000-0000-0000-0000-000000000000
        key: DATABASE_URL
        value: postgres://localhost/dev
        secret: false
        contexts: all
  x-stackQL-resources:
    layers:
      id: deno.layers.layers
      name: layers
      title: Layers
      methods:
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v2~1layers/post'
          response:
            mediaType: application/json
            openAPIDocKey: '201'
        list:
          operation:
            $ref: '#/paths/~1v2~1layers/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        get:
          operation:
            $ref: '#/paths/~1v2~1layers~1{layer}/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        update:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v2~1layers~1{layer}/patch'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
        delete:
          operation:
            $ref: '#/paths/~1v2~1layers~1{layer}/delete'
          response:
            mediaType: application/json
            openAPIDocKey: '204'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/layers/methods/get'
          - $ref: '#/components/x-stackQL-resources/layers/methods/list'
        insert:
          - $ref: '#/components/x-stackQL-resources/layers/methods/create'
        update:
          - $ref: '#/components/x-stackQL-resources/layers/methods/update'
        delete:
          - $ref: '#/components/x-stackQL-resources/layers/methods/delete'
        replace: []
    layer_apps:
      id: deno.layers.layer_apps
      name: layer_apps
      title: Layer Apps
      methods:
        list:
          operation:
            $ref: '#/paths/~1v2~1layers~1{layer}~1apps/get'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select:
          - $ref: '#/components/x-stackQL-resources/layer_apps/methods/list'
        insert: []
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.deno.com
x-stackQL-config:
  pagination:
    requestToken:
      key: ''
      location: request
    responseToken:
      key: Link
      location: header
