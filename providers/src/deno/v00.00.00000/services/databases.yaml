openapi: 3.1.1
info:
  title: databases API
  description: >-
    Create database instances (BYO Postgres, Deno KV, Prisma) and bind the
    manual databases hosted on them. Manual databases are bound to one of an
    app's timelines (`production`, `preview`, etc.) and coexist with the
    per-timeline databases provisioned by default. Use the deploy endpoint's
    `databases` parameter to bind a specific manual database to an individual
    revision without affecting other revisions on the timeline.
  version: 2.0.0
paths:
  /v2/database_instances:
    post:
      operationId: databases.createInstance
      summary: Create database instance
      description: >-
        Create a new database instance owned by the organization. Supported
        engines: `postgresql` (bring-your-own server), `denokv` (Deno-managed
        key-value), and `prisma` (Prisma-managed Postgres).
      tags:
        - databases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseInstanceInit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseInstance'
components:
  schemas:
    DatabaseInstanceInit:
      type: object
      properties:
        slug:
          type: string
          description: Slug for the new database instance
        connection:
          type: object
          properties:
            engine:
              enum:
                - postgresql
              type: string
            hostname:
              type: string
              minLength: 1
              description: Database server hostname
            port:
              description: Database server port
              nullable: true
              type: integer
              minimum: 1
              maximum: 65535
            username:
              description: Username for authentication
              nullable: true
              type: string
            password:
              description: Password for authentication
              nullable: true
              type: string
            certificate:
              description: >-
                Custom CA certificate (PEM). Omit to use the bundled AWS RDS CA
                bundle
              nullable: true
              type: string
            region:
              type: string
              description: Prisma project region
          required:
            - engine
            - hostname
            - port
            - username
            - password
            - certificate
            - region
      required:
        - slug
        - connection
    DatabaseInstance:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique database instance identifier
        slug:
          type: string
          description: Human-readable instance slug
        engine:
          enum:
            - postgresql
            - denokv
            - prisma
          description: Database engine type
          type: string
        connection:
          description: Non-sensitive connection metadata. Credentials are never returned
          type: object
          properties:
            engine:
              enum:
                - postgresql
              type: string
            hostname:
              type: string
              minLength: 1
              description: Database server hostname
            port:
              description: Database server port
              nullable: true
              type: integer
              minimum: 1
              maximum: 65535
            username:
              description: Username for authentication
              nullable: true
              type: string
            custom_certificate:
              type: boolean
              description: Whether a custom CA certificate is configured
            project_id:
              type: string
              description: Prisma project identifier
            region:
              type: string
              description: Prisma project region
          required:
            - engine
            - hostname
            - port
            - username
            - custom_certificate
            - project_id
            - region
        databases:
          type: array
          items:
            $ref: '#/components/schemas/Database'
          description: Databases that exist on this instance
        created_at:
          type: string
          description: ISO 8601 timestamp of creation
      required:
        - id
        - slug
        - engine
        - connection
        - databases
        - created_at
    Database:
      type: object
      properties:
        name:
          type: string
          description: Literal database name
        status:
          enum:
            - pending
            - creating
            - ready
            - failed
            - deleted
          description: Provisioning status of the database
          type: string
        created_at:
          type: string
          description: ISO 8601 timestamp of creation
        timelines:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseTimeline'
          description: Timelines this database is bound to
      required:
        - name
        - status
        - created_at
        - timelines
    DatabaseTimeline:
      type: object
      properties:
        app:
          type: object
          properties:
            slug:
              type: string
              description: >-
                App slugs must be 3–32 characters long, may contain only
                lowercase letters, numbers, and hyphens, cannot contain
                underscores, must not start or end with a hyphen, must not have
                consecutive hyphens in positions 3 and 4, and cannot be a
                reserved slug.
          required:
            - slug
          description: The app the timeline belongs to
        timeline:
          type: string
          description: >-
            Timeline slug derived from the partition config name (e.g.
            `production`)
        partition:
          type: object
          additionalProperties:
            type: string
          description: Partition key-value pairs identifying the timeline
          example:
            git.branch: main
      required:
        - app
        - timeline
        - partition
  x-stackQL-resources:
    database_instances:
      id: deno.databases.database_instances
      name: database_instances
      title: Database Instances
      methods:
        create:
          config:
            requestBodyTranslate:
              algorithm: naive
          operation:
            $ref: '#/paths/~1v2~1database_instances/post'
          response:
            mediaType: application/json
            openAPIDocKey: '200'
      sqlVerbs:
        select: []
        insert:
          - $ref: '#/components/x-stackQL-resources/database_instances/methods/create'
        update: []
        delete: []
        replace: []
servers:
  - url: https://api.deno.com
x-stackQL-config:
  pagination:
    requestToken:
      key: ''
      location: request
    responseToken:
      key: Link
      location: header
