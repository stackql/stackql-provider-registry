name: Provider document signatures

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            signing/go.sum
      - run: go test ./... && go vet ./...
      - run: go test ./... && go vet ./...
        working-directory: signing
        env:
          PQSIG_PROVIDER_ROOT: ${{ github.workspace }}/providers/src
      - run: python -m unittest discover -s scripts/package -p 'test_*.py'
